一小段文字就可以概括房间里发生了什么，但对应的视觉流包含的信息要多得多：外观、运动、几何、光照，以及大量可能重要、也可能毫无用处的局部细节。视觉没有与语言相当的压缩层。缺少有用的中间单位时，视觉学习系统必须自己发现哪些信息要保留、哪些应忽略，以及如何压缩输入。早期视觉系统人为设定了检测、分割、深度估计等任务。这些抽象当然有用，但它们并不等同于语言 token。无论 bounding box 还是 mask，在表达灵活性上都无法与一个词或一句话类比。因此，我并不认为答案是人工设计一个固定的视觉词汇表。某些形式的视觉智能，可能需要比语言预训练高出数个数量级的有效算力和数据处理量；在一些情境中，也许要达到 1,000 倍甚至 10,000 倍，合适的抽象才会自然涌现。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px2.p3.1\"\u003e\u003c/span\u003e视觉世界可以被无限细分，但并非所有细节都有用。如果把所有内容都表示到最细粒度，会浪费巨量算力；如果全部表示得过粗，又会错过真正重要的信息。因此，有用的视觉感知单位必然与任务相关。一个视觉系统应对无关区域保留粗粒度表征，而把细粒度表征资源分配给与任务相关的区域。从这个意义上说，“视觉单位是什么”这个问题，与“应该看哪里”这个问题密不可分。这个观点与主动视觉和 visual routines 的思想一致：感知并不是被动接收，而是为了行为主动选择并组织信息的过程 [\u003ca href=\"#bib.bib55\"\u003e104\u003c/a\u003e, \u003ca href=\"#bib.bib56\"\u003e83\u003c/a\u003e, \u003ca href=\"#bib.bib57\"\u003e4\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e这并不是反对规模扩展。事实上，我本身就相信 scaling。就我自己的研究经验而言，只要拥有合适的数据、合适的目标和足够的规模，最简单的方法往往效果最好。因此，我并不想主张手工设计视觉单位、注意力策略或主动感知模块。只要算力足够、模型足够大、视觉经验足够多样，很多关于“如何自适应形成视觉抽象”和“应该看哪里”的行为，完全可能在没有显式工程设计的情况下自然涌现。真正的问题并不是“规模还是结构”，而是：\u003cstrong\u003e需要怎样的规模，才能让正确的结构涌现？又怎样把这种规模扩展做得足够高效，真正可用？\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS9.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e一个核心困难是：视觉不像语言那样，自带清晰的符号单位。语言拥有相对明确的层级：词、短语、句子、文档。现代语言模型使用 subword token，但这些 token 仍建立在人类早已创造出来的符号系统之上。因此，语言并不是原始经验，而是经过压缩的人类经验。视觉则不同。像素层级太低，不能直接充当智能的单位；patch 更多只是工程上的便利，而不是感知的基本原语。人类视觉理解看起来具有以物体为中心、分层组织的特点，会涉及场景、物体、部件和关系 [[64](#bib.bib53), [34](#bib.bib54)]。但视觉领域至今没有一种可以与语言层级相类比、得到广泛认同的层级结构。\n\n这使视觉学习尤其昂贵。一小段文字就可以概括房间里发生了什么，但对应的视觉流包含的信息要多得多：外观、运动、几何、光照，以及大量可能重要、也可能毫无用处的局部细节。视觉没有与语言相当的压缩层。缺少有用的中间单位时，视觉学习系统必须自己发现哪些信息要保留、哪些应忽略，以及如何压缩输入。早期视觉系统人为设定了检测、分割、深度估计等任务。这些抽象当然有用，但它们并不等同于语言 token。无论 bounding box 还是 mask，在表达灵活性上都无法与一个词或一句话类比。因此，我并不认为答案是人工设计一个固定的视觉词汇表。某些形式的视觉智能，可能需要比语言预训练高出数个数量级的有效算力和数据处理量；在一些情境中，也许要达到 1,000 倍甚至 10,000 倍，合适的抽象才会自然涌现。\n\n\u003cspan id=\"S2.SS9.SSS0.Px2.p3.1\"\u003e\u003c/span\u003e视觉世界可以被无限细分，但并非所有细节都有用。如果把所有内容都表示到最细粒度，会浪费巨量算力；如果全部表示得过粗，又会错过真正重要的信息。因此，有用的视觉感知单位必然与任务相关。一个视觉系统应对无关区域保留粗粒度表征，而把细粒度表征资源分配给与任务相关的区域。从这个意义上说，“视觉单位是什么”这个问题，与“应该看哪里”这个问题密不可分。这个观点与主动视觉和 visual routines 的思想一致：感知并不是被动接收，而是为了行为主动选择并组织信息的过程 [[104](#bib.bib55), [83](#bib.bib56), [4](#bib.bib57)]。\n\n这并不是反对规模扩展。事实上，我本身就相信 scaling。就我自己的研究经验而言，只要拥有合适的数据、合适的目标和足够的规模，最简单的方法往往效果最好。因此，我并不想主张手工设计视觉单位、注意力策略或主动感知模块。只要算力足够、模型足够大、视觉经验足够多样，很多关于“如何自适应形成视觉抽象”和“应该看哪里”的行为，完全可能在没有显式工程设计的情况下自然涌现。真正的问题并不是“规模还是结构”，而是：**需要怎样的规模，才能让正确的结构涌现？又怎样把这种规模扩展做得足够高效，真正可用？**","sourceFormat":"markdown"},"note:sha256:5bc187228c9a63a15f7f2c6b8d5837b66cf0be86308402b111f508fe37fafef7":{"html":"\u003cp\u003e在一个极端，表征可以完全连续：整个场景变成网络产生的一组向量。这样的表示能力强、也容易优化，但其中没有任何部分可以被显式读取、编辑或验证。另一个极端则是完全离散且有名字的表示：场景里有一个杯子，它放在桌上，有一个把手，这个把手绕某条给定轴转动。这样的表示可以被读取、编辑和验证，但它能覆盖的范围受限于自身词汇表。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px3.p2.1\"\u003e\u003c/span\u003e一个真正有效的表征需要同时捕捉这两者 [\u003ca href=\"#bib.bib96\"\u003e108\u003c/a\u003e, \u003ca href=\"#bib.bib97\"\u003e62\u003c/a\u003e, \u003ca href=\"#bib.bib98\"\u003e44\u003c/a\u003e, \u003ca href=\"#bib.bib95\"\u003e97\u003c/a\u003e]。那些离散且关系化的结构——有哪些部件、有多少个、如何排列、什么与什么连接——天然适合用程序或语言写下来。那些连续且难以命名的结构——一片叶子的精确几何，一件上釉陶瓷的细致外观——则更适合留给学习得到的 embedding。Scene Language [\u003ca href=\"#bib.bib96\"\u003e108\u003c/a\u003e] 是一个具体实例：一个场景由程序表示，程序描述它的层级结构；每个实体的语义类别由词语命名；每个实体独特的视觉身份则由 embedding 表示。相同理念也支撑了我们关于神经符号概念的工作：像“left of”或“put down”这样的概念，会同时以符号程序和神经网络的形式共同保存，而神经网络则 grounding 于感知和行动 [\u003ca href=\"#bib.bib97\"\u003e62\u003c/a\u003e, \u003ca href=\"#bib.bib98\"\u003e44\u003c/a\u003e, \u003ca href=\"#bib.bib99\"\u003e63\u003c/a\u003e]。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在一个极端，表征可以完全连续：整个场景变成网络产生的一组向量。这样的表示能力强、也容易优化，但其中没有任何部分可以被显式读取、编辑或验证。另一个极端则是完全离散且有名字的表示：场景里有一个杯子，它放在桌上，有一个把手，这个把手绕某条给定轴转动。这样的表示可以被读取、编辑和验证，但它能覆盖的范围受限于自身词汇表。\n\n\u003cspan id=\"S2.SS8.SSS0.Px3.p2.1\"\u003e\u003c/span\u003e一个真正有效的表征需要同时捕捉这两者 [[108](#bib.bib96), [62](#bib.bib97), [44](#bib.bib98), [97](#bib.bib95)]。那些离散且关系化的结构——有哪些部件、有多少个、如何排列、什么与什么连接——天然适合用程序或语言写下来。那些连续且难以命名的结构——一片叶子的精确几何，一件上釉陶瓷的细致外观——则更适合留给学习得到的 embedding。Scene Language [[108](#bib.bib96)] 是一个具体实例：一个场景由程序表示，程序描述它的层级结构；每个实体的语义类别由词语命名；每个实体独特的视觉身份则由 embedding 表示。相同理念也支撑了我们关于神经符号概念的工作：像“left of”或“put down”这样的概念，会同时以符号程序和神经网络的形式共同保存，而神经网络则 grounding 于感知和行动 [[62](#bib.bib97), [44](#bib.bib98), [63](#bib.bib99)]。","sourceFormat":"markdown"},"note:sha256:5be8fbea9a028f725c07de6409921faade4c3406462390469ec90c8c1e58ccc8":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e归根结底，视觉智能应当提供机器人为了执行任务而真正需要的理解，使机器人能够行动、交互与探索。视觉计划并不需要以同等保真度复现观察中的每一个细节，但必须保留那些会改变机器人可用行动空间或任务结果的关键差异。我们团队通过把决策建模为条件视觉生成，探索了这种连接 [\u003ca href=\"#bib.bib74\"\u003e24\u003c/a\u003e, \u003ca href=\"#bib.bib79\"\u003e112\u003c/a\u003e, \u003ca href=\"#bib.bib75\"\u003e12\u003c/a\u003e]。在这一框架中，生成模型提出一条高层次视觉轨迹，表示任务可能如何完成；另一个独立的低层控制器，再把这条轨迹 grounding 到连续的机器人动作上。这样的分解方式，使视觉生成负责表达任务级意图与预期的物理演化，而把精确执行交给控制器。随后比较预测结果与实际观察结果，就能把真实执行过程同时变成对计划和视觉世界模型的检验。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS7.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e归根结底，视觉智能应当提供机器人为了执行任务而真正需要的理解，使机器人能够行动、交互与探索。视觉计划并不需要以同等保真度复现观察中的每一个细节，但必须保留那些会改变机器人可用行动空间或任务结果的关键差异。我们团队通过把决策建模为条件视觉生成，探索了这种连接 [[24](#bib.bib74), [112](#bib.bib79), [12](#bib.bib75)]。在这一框架中，生成模型提出一条高层次视觉轨迹，表示任务可能如何完成；另一个独立的低层控制器，再把这条轨迹 grounding 到连续的机器人动作上。这样的分解方式，使视觉生成负责表达任务级意图与预期的物理演化，而把精确执行交给控制器。随后比较预测结果与实际观察结果，就能把真实执行过程同时变成对计划和视觉世界模型的检验。","sourceFormat":"markdown"},"note:sha256:5c97fd35c254cd63aed15bf2c20e12e8f2818ccd8e4c63a8f882f47446d802d9":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px4.p1.1\"\u003e\u003c/span\u003e上面描述的许多结构都可以写成程序。物体有层级，所以程序会嵌套；部件会重复，所以程序会循环；关节有活动范围、部件存在约束，所以程序会接受参数并包含 assertion。最近，LLM Agent 恰好非常擅长做这些事：它们能够写程序、运行程序、读取错误，然后再次尝试，而且可靠性已经高到足以重塑软件行业。如果物理结构可以用代码表达，那么擅长写代码的系统，也可能擅长构建物体与场景的模型 [\u003ca href=\"#bib.bib100\"\u003e113\u003c/a\u003e, \u003ca href=\"#bib.bib101\"\u003e76\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px4.p2.1\"\u003e\u003c/span\u003e这种能力建立在代码本身一个根本属性上：\u003cstrong\u003e代码能够运行，也能够被验证。\u003c/strong\u003e 一个程序要么能编译，要么不能；要么通过测试，要么不能通过。正是这种自动检查，使编程成为 Agent 能够被训练到高度熟练的一类任务。当程序描述的不是软件，而是一个物体时，这个属性依然成立。这样的程序可以被执行、渲染和模拟，而它的输出可以与程序原本应该解释的图像，或物体应该产生的运动进行比较。于是，一个提出的结构不只是被“生成出来”，还可以被发现错误并修正。Agent 已经能够编写代码，在数百个类别上生成有关节结构的 3D 资产 [\u003ca href=\"#bib.bib100\"\u003e113\u003c/a\u003e]；也能够编写控制机器人完成操作任务的代码，并在获得执行反馈和视觉比较后持续改进 [\u003ca href=\"#bib.bib102\"\u003e29\u003c/a\u003e]。这个思路最终能延伸多远仍是开放问题。今天的 Agent 很大程度依赖人类预先提供给它们的抽象，以及语言模型关于日常物体“通常怎样构成、怎样工作”的先验知识；当这些先验被移除时，性能就会下降 [\u003ca href=\"#bib.bib102\"\u003e29\u003c/a\u003e]。对我们而言，真正最重要的问题是：这些抽象能否不再依赖事先提供，而是直接从系统正在观察的世界中被提取出来。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS8.SSS0.Px4.p1.1\"\u003e\u003c/span\u003e上面描述的许多结构都可以写成程序。物体有层级，所以程序会嵌套；部件会重复，所以程序会循环；关节有活动范围、部件存在约束，所以程序会接受参数并包含 assertion。最近，LLM Agent 恰好非常擅长做这些事：它们能够写程序、运行程序、读取错误，然后再次尝试，而且可靠性已经高到足以重塑软件行业。如果物理结构可以用代码表达，那么擅长写代码的系统，也可能擅长构建物体与场景的模型 [[113](#bib.bib100), [76](#bib.bib101)]。\n\n\u003cspan id=\"S2.SS8.SSS0.Px4.p2.1\"\u003e\u003c/span\u003e这种能力建立在代码本身一个根本属性上：**代码能够运行，也能够被验证。** 一个程序要么能编译，要么不能；要么通过测试，要么不能通过。正是这种自动检查，使编程成为 Agent 能够被训练到高度熟练的一类任务。当程序描述的不是软件，而是一个物体时，这个属性依然成立。这样的程序可以被执行、渲染和模拟，而它的输出可以与程序原本应该解释的图像，或物体应该产生的运动进行比较。于是，一个提出的结构不只是被“生成出来”，还可以被发现错误并修正。Agent 已经能够编写代码，在数百个类别上生成有关节结构的 3D 资产 [[113](#bib.bib100)]；也能够编写控制机器人完成操作任务的代码，并在获得执行反馈和视觉比较后持续改进 [[29](#bib.bib102)]。这个思路最终能延伸多远仍是开放问题。今天的 Agent 很大程度依赖人类预先提供给它们的抽象，以及语言模型关于日常物体“通常怎样构成、怎样工作”的先验知识；当这些先验被移除时，性能就会下降 [[29](#bib.bib102)]。对我们而言，真正最重要的问题是：这些抽象能否不再依赖事先提供，而是直接从系统正在观察的世界中被提取出来。","sourceFormat":"markdown"},"note:sha256:5df698a0cacbd6e457ef3aeea60b0a6160e6d769afdf5b2ad6aef6420d892353":{"blocks":[{"children":[],"kind":"leaf","title":"今天最强的视觉系统令人印象深刻，但它们并没有以真正重要的方式实现“通用”。它们通常先在规模庞大、精心构建的数据集上训练一次，随后以基本固定的模型形态部署。它们可以识别物体、重建场景、回答关于图像的问题，或遵循文本指令；但它们不会通过持续经验逐步形成对世界的一致理解，也不会随着世界变化而持续重组这种理解。今天，我们这个领域对这一问题已知的一种“修复方式”只有：加入更多数据，然后（重新）训练。"},{"children":[],"kind":"leaf","title":"在我看来，一个具备视觉通用智能的系统，应当随着视觉经验本身不断展开而学习：持续地学习，不依赖标签，不需要反复打乱并重放过去，也不预设哪些任务将来才是重要的。如果我们能够构建这样的系统，就有可能得到会适应、会持续改进的模型与 Agent；它们更新权重所需的能量或许只相当于一只灯泡，而不是一座城市。"},{"children":[],"kind":"leaf","title":"起点应当是视觉，而不是语言。一个智能系统在描述世界之前，首先必须发现世界的结构。它需要学会：一次观察中的哪些部分属于同一个整体；哪些物体能跨越视角变化和暂时遮挡而持续存在；观察者自身如何移动；场景中哪些变化独立发生；又有哪些规律能在数天、数月乃至数年中保持稳定。"},{"children":[],"kind":"leaf","title":"目标并不只是训练一个更大的视频模型。当前的视频模型已经是强大而通用的感知模块，但它们工作的数据已经被事先采集、切分、打乱并反复访问。22 2 我也认为，把生成式视频模型继续规模化，朝某个实用意义上的 VGI 定义迈进，是一个合理的赌注。但对我而言，视觉通用智能真正提出的问题是：一个系统如何在 它自己的视觉生命历程中 学习。它应该知道自己以前见过什么，能够检测真正的新事物何时发生，决定自身哪些部分需要改变，并保留那些依然有用的知识。这里所需要的，与其说是一套持续学习方案，不如说是一个能够在开放环境中自主运行的完整学习系统。可以想象一个婴儿：没有明确目标、不会说话，也没有关系。一个略显粗糙的类比，是今天那些可以自行生成子 Agent 的编程 Agent——只是把它们换成视觉系统，从零开始，而且没有语言。"},{"children":[{"title":"• **感知系统**：把当前视觉流转化为物体、区域、表面、运动和语义特征。44 4 甚至“视频应该怎样被最佳表示”本身都是问题：帧存在冗余，codec 很复杂，而以物体为中心的表示又带有一定任意性。"},{"title":"• **空间与动态世界模型**：维护关于几何、视角、物体身份、运动和因果变化的假设。它应当区分由观察者自身引起的变化，与由世界本身引起的变化。"},{"title":"• **记忆系统**：在不同时间尺度上存储信息。"},{"title":"• **任务与行动接口**：把已经学到的视觉知识暴露给下游系统，包括机器人、科学仪器、搜索工具和人类用户。"}],"kind":"section","title":"看起来很明显的是，单纯把 Transformer 做得更大，并沿用今天的学习范式，并不能解决这个问题。33 3 我也乐于被证明是错的，我喜欢简单方案。相反，一个合理的人工视觉大脑，应该包含多个彼此交互的系统"},{"children":[],"kind":"leaf","title":"这些模块不一定必须被手工设计成僵硬的符号组件。它们完全可以是神经网络、可微分的，并通过联合训练得到。但它们应当承担不同角色，拥有不同的更新规则和时间尺度。人脑并不是一个均质的整体；一个既要在持续变化中保持稳定、又要不断学习的人工学习器，也不太可能是一个均质模块。"},{"children":[],"kind":"leaf","title":"语言可以在之后作为这种视觉智能的接口进入系统。它可以给概念命名、传达目标、支持协作，并偶尔提供监督。但语言不应当成为视觉系统唯一的组织原则。世界中的许多结构——深度、运动、持续性、包含关系、接触以及可供性（affordance）——都先于它们被命名而存在。因此，一个视觉智能系统应当能够在没有图像描述文本的情况下学习这些规律，之后再把它们与词语连接起来。语言因此成为查询、引导 [75] 和教授一个已经具备现实 grounding 的世界模型的方式，而不是这个世界模型的替代品。"},{"children":[],"kind":"leaf","title":"长期目标，是构建一个会随着经验一起成长的视觉系统。它观察世界的时间越长，就应变得越有能力、结构越完善、越有用；而不需要反复重置、从头重新训练，也无需提前告诉它最终必须理解的一切。"}],"html":"\u003cp\u003e今天最强的视觉系统令人印象深刻，但它们并没有以真正重要的方式实现“通用”。它们通常先在规模庞大、精心构建的数据集上训练一次，随后以基本固定的模型形态部署。它们可以识别物体、重建场景、回答关于图像的问题，或遵循文本指令；但它们不会通过持续经验逐步形成对世界的一致理解，也不会随着世界变化而持续重组这种理解。今天，我们这个领域对这一问题已知的一种“修复方式”只有：加入更多数据，然后（重新）训练。\u003c/p\u003e\n\u003cp\u003e在我看来，一个具备视觉通用智能的系统，应当随着视觉经验本身不断展开而学习：持续地学习，不依赖标签，不需要反复打乱并重放过去，也不预设哪些任务将来才是重要的。如果我们能够构建这样的系统，就有可能得到会适应、会持续改进的模型与 Agent；它们更新权重所需的能量或许只相当于一只灯泡，而不是一座城市。\u003c/p\u003e\n\u003cp\u003e起点应当是视觉，而不是语言。一个智能系统在描述世界之前，首先必须发现世界的结构。它需要学会：一次观察中的哪些部分属于同一个整体；哪些物体能跨越视角变化和暂时遮挡而持续存在；观察者自身如何移动；场景中哪些变化独立发生；又有哪些规律能在数天、数月乃至数年中保持稳定。\u003c/p\u003e\n\u003cp\u003e目标并不只是训练一个更大的视频模型。当前的视频模型已经是强大而通用的感知模块，但它们工作的数据已经被事先采集、切分、打乱并反复访问。22 2 我也认为，把生成式视频模型继续规模化，朝某个实用意义上的 VGI 定义迈进，是一个合理的赌注。但对我而言，视觉通用智能真正提出的问题是：一个系统如何在 \u003cem\u003e它自己的视觉生命历程中\u003c/em\u003e 学习。它应该知道自己以前见过什么，能够检测真正的新事物何时发生，决定自身哪些部分需要改变，并保留那些依然有用的知识。这里所需要的，与其说是一套持续学习方案，不如说是一个能够在开放环境中自主运行的完整学习系统。可以想象一个婴儿：没有明确目标、不会说话，也没有关系。一个略显粗糙的类比，是今天那些可以自行生成子 Agent 的编程 Agent——只是把它们换成视觉系统，从零开始，而且没有语言。\u003c/p\u003e\n\u003cp\u003e看起来很明显的是，单纯把 Transformer 做得更大，并沿用今天的学习范式，并不能解决这个问题。33 3 我也乐于被证明是错的，我喜欢简单方案。相反，一个合理的人工视觉大脑，应该包含多个彼此交互的系统：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e• \u003cstrong\u003e感知系统\u003c/strong\u003e：把当前视觉流转化为物体、区域、表面、运动和语义特征。44 4 甚至“视频应该怎样被最佳表示”本身都是问题：帧存在冗余，codec 很复杂，而以物体为中心的表示又带有一定任意性。\u003c/li\u003e\n\u003cli\u003e• \u003cstrong\u003e空间与动态世界模型\u003c/strong\u003e：维护关于几何、视角、物体身份、运动和因果变化的假设。它应当区分由观察者自身引起的变化，与由世界本身引起的变化。\u003c/li\u003e\n\u003cli\u003e• \u003cstrong\u003e记忆系统\u003c/strong\u003e：在不同时间尺度上存储信息。\u003c/li\u003e\n\u003cli\u003e• \u003cstrong\u003e任务与行动接口\u003c/strong\u003e：把已经学到的视觉知识暴露给下游系统，包括机器人、科学仪器、搜索工具和人类用户。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e这些模块不一定必须被手工设计成僵硬的符号组件。它们完全可以是神经网络、可微分的，并通过联合训练得到。但它们应当承担不同角色，拥有不同的更新规则和时间尺度。人脑并不是一个均质的整体；一个既要在持续变化中保持稳定、又要不断学习的人工学习器，也不太可能是一个均质模块。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS3.p8.1\"\u003e\u003c/span\u003e语言可以在之后作为这种视觉智能的接口进入系统。它可以给概念命名、传达目标、支持协作，并偶尔提供监督。但语言不应当成为视觉系统唯一的组织原则。世界中的许多结构——深度、运动、持续性、包含关系、接触以及可供性（affordance）——都先于它们被命名而存在。因此，一个视觉智能系统应当能够在没有图像描述文本的情况下学习这些规律，之后再把它们与词语连接起来。语言因此成为查询、引导 [\u003ca href=\"#bib.bib20\"\u003e75\u003c/a\u003e] 和教授一个已经具备现实 grounding 的世界模型的方式，而不是这个世界模型的替代品。\u003c/p\u003e\n\u003cp\u003e长期目标，是构建一个会随着经验一起成长的视觉系统。它观察世界的时间越长，就应变得越有能力、结构越完善、越有用；而不需要反复重置、从头重新训练，也无需提前告诉它最终必须理解的一切。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"今天最强的视觉系统令人印象深刻，但它们并没有以真正重要的方式实现“通用”。它们通常先在规模庞大、精心构建的数据集上训练一次，随后以基本固定的模型形态部署。它们可以识别物体、重建场景、回答关于图像的问题，或遵循文本指令；但它们不会通过持续经验逐步形成对世界的一致理解，也不会随着世界变化而持续重组这种理解。今天，我们这个领域对这一问题已知的一种“修复方式”只有：加入更多数据，然后（重新）训练。\n\n在我看来，一个具备视觉通用智能的系统，应当随着视觉经验本身不断展开而学习：持续地学习，不依赖标签，不需要反复打乱并重放过去，也不预设哪些任务将来才是重要的。如果我们能够构建这样的系统，就有可能得到会适应、会持续改进的模型与 Agent；它们更新权重所需的能量或许只相当于一只灯泡，而不是一座城市。\n\n起点应当是视觉，而不是语言。一个智能系统在描述世界之前，首先必须发现世界的结构。它需要学会：一次观察中的哪些部分属于同一个整体；哪些物体能跨越视角变化和暂时遮挡而持续存在；观察者自身如何移动；场景中哪些变化独立发生；又有哪些规律能在数天、数月乃至数年中保持稳定。\n\n目标并不只是训练一个更大的视频模型。当前的视频模型已经是强大而通用的感知模块，但它们工作的数据已经被事先采集、切分、打乱并反复访问。22 2 我也认为，把生成式视频模型继续规模化，朝某个实用意义上的 VGI 定义迈进，是一个合理的赌注。但对我而言，视觉通用智能真正提出的问题是：一个系统如何在 *它自己的视觉生命历程中* 学习。它应该知道自己以前见过什么，能够检测真正的新事物何时发生，决定自身哪些部分需要改变，并保留那些依然有用的知识。这里所需要的，与其说是一套持续学习方案，不如说是一个能够在开放环境中自主运行的完整学习系统。可以想象一个婴儿：没有明确目标、不会说话，也没有关系。一个略显粗糙的类比，是今天那些可以自行生成子 Agent 的编程 Agent——只是把它们换成视觉系统，从零开始，而且没有语言。\n\n看起来很明显的是，单纯把 Transformer 做得更大，并沿用今天的学习范式，并不能解决这个问题。33 3 我也乐于被证明是错的，我喜欢简单方案。相反，一个合理的人工视觉大脑，应该包含多个彼此交互的系统：\n\n- • **感知系统**：把当前视觉流转化为物体、区域、表面、运动和语义特征。44 4 甚至“视频应该怎样被最佳表示”本身都是问题：帧存在冗余，codec 很复杂，而以物体为中心的表示又带有一定任意性。\n- • **空间与动态世界模型**：维护关于几何、视角、物体身份、运动和因果变化的假设。它应当区分由观察者自身引起的变化，与由世界本身引起的变化。\n- • **记忆系统**：在不同时间尺度上存储信息。\n- • **任务与行动接口**：把已经学到的视觉知识暴露给下游系统，包括机器人、科学仪器、搜索工具和人类用户。\n\n这些模块不一定必须被手工设计成僵硬的符号组件。它们完全可以是神经网络、可微分的，并通过联合训练得到。但它们应当承担不同角色，拥有不同的更新规则和时间尺度。人脑并不是一个均质的整体；一个既要在持续变化中保持稳定、又要不断学习的人工学习器，也不太可能是一个均质模块。\n\n\u003cspan id=\"S2.SS3.p8.1\"\u003e\u003c/span\u003e语言可以在之后作为这种视觉智能的接口进入系统。它可以给概念命名、传达目标、支持协作，并偶尔提供监督。但语言不应当成为视觉系统唯一的组织原则。世界中的许多结构——深度、运动、持续性、包含关系、接触以及可供性（affordance）——都先于它们被命名而存在。因此，一个视觉智能系统应当能够在没有图像描述文本的情况下学习这些规律，之后再把它们与词语连接起来。语言因此成为查询、引导 [[75](#bib.bib20)] 和教授一个已经具备现实 grounding 的世界模型的方式，而不是这个世界模型的替代品。\n\n长期目标，是构建一个会随着经验一起成长的视觉系统。它观察世界的时间越长，就应变得越有能力、结构越完善、越有用；而不需要反复重置、从头重新训练，也无需提前告诉它最终必须理解的一切。","sourceFormat":"markdown"},"note:sha256:6390417600022caed124731cebf6999a9bd6026bc614c63c2caf965b2ba9daba":{"html":"\u003cp\u003eGeirhos 认为，在大规模视频数据上训练的生成模型，可能获得跨越一系列下游任务的通用能力，而这些任务在训练期间并没有被逐一显式指定。其他观点也从不同语境把这类大规模生成模型视为重要里程碑：Ramanan 把它们连接到表征学习，Du 连接到世界建模与行动，Raghunathan 连接到创造力，Kataoka 等人则连接到想象。\u003c/p\u003e\n\u003cp\u003e但仅仅扩大训练数据量并不足够。Liu 和 Ramanan 都强调，关键是收集\u003cstrong\u003e多样的视觉数据\u003c/strong\u003e，而不只是让模型反复接触数量巨大、模式却相似的数据。与此同时，Fouhey 强调需要能够处理那些只能获得少量数据的科学现象。Shangzhe Wu 与 Jiajun Wu 进一步区分了照片级真实外观与物理理解：模型可以生成视觉上合理的事件，却并不一定理解支配这一事件的底层物理属性。因此，我们可能需要进一步研究那些可以被检查、编辑、模拟和验证的物理结构表征。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Geirhos 认为，在大规模视频数据上训练的生成模型，可能获得跨越一系列下游任务的通用能力，而这些任务在训练期间并没有被逐一显式指定。其他观点也从不同语境把这类大规模生成模型视为重要里程碑：Ramanan 把它们连接到表征学习，Du 连接到世界建模与行动，Raghunathan 连接到创造力，Kataoka 等人则连接到想象。\n\n但仅仅扩大训练数据量并不足够。Liu 和 Ramanan 都强调，关键是收集**多样的视觉数据**，而不只是让模型反复接触数量巨大、模式却相似的数据。与此同时，Fouhey 强调需要能够处理那些只能获得少量数据的科学现象。Shangzhe Wu 与 Jiajun Wu 进一步区分了照片级真实外观与物理理解：模型可以生成视觉上合理的事件，却并不一定理解支配这一事件的底层物理属性。因此，我们可能需要进一步研究那些可以被检查、编辑、模拟和验证的物理结构表征。","sourceFormat":"markdown"},"note:sha256:6cd38bbdd7283ef57f69011dc01fa02567d91539a5ff211f5ac67bff599c93b4":{"html":"\u003cp\u003e具身 Agent 会持续遇到训练分布之外的观察，而当前视觉系统在这些情况下可能以不可预测的方式失败；在机器人场景中，这种失败有时甚至会造成灾难性后果。因此，视觉智能的一项核心挑战，是面对视角、环境、物体配置和交互方式等开放式变化时，仍能稳健泛化。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px1.p2.1\"\u003e\u003c/span\u003e一种很有前景的稳健性路径，是构建生成式世界模型，并把感知表述为：对那些可能生成当前观察的潜在场景状态进行推断。视觉观察来自反复出现的物理规律，包括几何、物体、关系和动力学；因此，这类模型可以通过复用和重新组合已有知识来解释陌生场景。显式 3D 结构 [\u003ca href=\"#bib.bib65\"\u003e54\u003c/a\u003e] 与组合结构 [\u003ca href=\"#bib.bib66\"\u003e22\u003c/a\u003e, \u003ca href=\"#bib.bib64\"\u003e89\u003c/a\u003e, \u003ca href=\"#bib.bib67\"\u003e114\u003c/a\u003e] 可以为数据高效学习与系统性泛化提供有用的归纳偏置。这个思路延续了长期存在的“分析即合成”（analysis by synthesis）范式 [\u003ca href=\"#bib.bib68\"\u003e106\u003c/a\u003e, \u003ca href=\"#bib.bib69\"\u003e48\u003c/a\u003e]：视觉理解通过推断一个潜在场景解释来实现，而由这个解释合成出的观察应与输入一致。与这一观点相符，我们团队此前的工作已经表明，生成式组合模型能够泛化到包含训练期间从未出现过的物体数量与配置的场景中 [\u003ca href=\"#bib.bib64\"\u003e89\u003c/a\u003e]。\u003c/p\u003e\n","kind":"html","rawMarkdown":"具身 Agent 会持续遇到训练分布之外的观察，而当前视觉系统在这些情况下可能以不可预测的方式失败；在机器人场景中，这种失败有时甚至会造成灾难性后果。因此，视觉智能的一项核心挑战，是面对视角、环境、物体配置和交互方式等开放式变化时，仍能稳健泛化。\n\n\u003cspan id=\"S2.SS7.SSS0.Px1.p2.1\"\u003e\u003c/span\u003e一种很有前景的稳健性路径，是构建生成式世界模型，并把感知表述为：对那些可能生成当前观察的潜在场景状态进行推断。视觉观察来自反复出现的物理规律，包括几何、物体、关系和动力学；因此，这类模型可以通过复用和重新组合已有知识来解释陌生场景。显式 3D 结构 [[54](#bib.bib65)] 与组合结构 [[22](#bib.bib66), [89](#bib.bib64), [114](#bib.bib67)] 可以为数据高效学习与系统性泛化提供有用的归纳偏置。这个思路延续了长期存在的“分析即合成”（analysis by synthesis）范式 [[106](#bib.bib68), [48](#bib.bib69)]：视觉理解通过推断一个潜在场景解释来实现，而由这个解释合成出的观察应与输入一致。与这一观点相符，我们团队此前的工作已经表明，生成式组合模型能够泛化到包含训练期间从未出现过的物体数量与配置的场景中 [[89](#bib.bib64)]。","sourceFormat":"markdown"},"note:sha256:700ac19ed2299606495d3cfd48d35f289d346167a5ab506fa192cf6ef397f93c":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS6.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e在更广泛的人工智能图景中，SLAM 一个很特殊的地方在于，它还没有被机器学习彻底主导。定位和稀疏建图中性能最好的方法，大多仍是基于几何与概率状态估计的人工设计算法；而稠密和语义 SLAM 系统通常采取一种平衡方式，让机器学习替代状态估计的一部分功能，或在其上增加能力（例如 MASt3R-SLAM [\u003ca href=\"#bib.bib81\"\u003e68\u003c/a\u003e]）。\u003c/p\u003e\n\u003cp\u003e人们很自然会问：整个 SLAM 和空间 AI 最终是否都会被端到端神经网络完成，不再需要任何人工设计的表征与算法？近来很多 3D 基础模型研究确实正在朝这个方向推进。在我看来，这并不是最重要的问题。未来的空间 AI 系统，几乎一定会把学习得到的组件和人工设计组件紧密整合到很难分辨彼此的程度；这种状态既可能通过在设计好的系统中不断加入学习模块实现，也可能通过给一个纯学习系统不断加入结构来实现。无论哪条路径，真正重要的仍是整个系统的存储和计算结构。如果它要具备现实应用需要的属性——高效、可组合，并能与其他设备和人类用户共享——那么我认为，这两条路线最终都会收敛到类似的系统性质。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS6.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e在更广泛的人工智能图景中，SLAM 一个很特殊的地方在于，它还没有被机器学习彻底主导。定位和稀疏建图中性能最好的方法，大多仍是基于几何与概率状态估计的人工设计算法；而稠密和语义 SLAM 系统通常采取一种平衡方式，让机器学习替代状态估计的一部分功能，或在其上增加能力（例如 MASt3R-SLAM [[68](#bib.bib81)]）。\n\n人们很自然会问：整个 SLAM 和空间 AI 最终是否都会被端到端神经网络完成，不再需要任何人工设计的表征与算法？近来很多 3D 基础模型研究确实正在朝这个方向推进。在我看来，这并不是最重要的问题。未来的空间 AI 系统，几乎一定会把学习得到的组件和人工设计组件紧密整合到很难分辨彼此的程度；这种状态既可能通过在设计好的系统中不断加入学习模块实现，也可能通过给一个纯学习系统不断加入结构来实现。无论哪条路径，真正重要的仍是整个系统的存储和计算结构。如果它要具备现实应用需要的属性——高效、可组合，并能与其他设备和人类用户共享——那么我认为，这两条路线最终都会收敛到类似的系统性质。","sourceFormat":"markdown"},"note:sha256:7680539a21e5bf4a9619f9ea94df0eb9f92c1f5cbcd35e6aec5e9b1a696d1134":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e把视频模型视为视觉基础模型，既有原则层面的理由，也有实践层面的理由。原则上的原因在于，视频生成是许多视觉任务中最具一般性的框架，静态图像可以被视为其中的一个特例 [\u003ca href=\"#bib.bib50\"\u003e102\u003c/a\u003e, e.g.]。实践上的原因则是，过去大约两年里，视频模型终于进入舞台中央，能力迅速提升，目前的重要进展往往以月、甚至以天为单位发生。事实上，它们已经足以充当视觉基础模型的“1.0 版本”。在我们近期的工作 [\u003ca href=\"#bib.bib39\"\u003e93\u003c/a\u003e] 中，我们证明了 Veo 3 这样的生成式视频模型，在视觉领域已经展现出与早期语言基础模型类似的广泛涌现能力。无需任何任务专用训练，模型仅通过图像到视频生成就能执行一系列视觉任务：边缘检测、目标分割、关键点定位、超分辨率、图像编辑、风格迁移，甚至包括迷宫求解、图遍历等早期形式的视觉推理。Veo 3 原本是一个面向娱乐用途训练的视频模型，却恰好成为了视觉基础模型。后续研究也在其他模型——包括开源模型——上验证并扩展了这些发现 [\u003ca href=\"#bib.bib45\"\u003e86\u003c/a\u003e, \u003ca href=\"#bib.bib49\"\u003e57\u003c/a\u003e, \u003ca href=\"#bib.bib48\"\u003e69\u003c/a\u003e, \u003ca href=\"#bib.bib47\"\u003e45\u003c/a\u003e, \u003ca href=\"#bib.bib46\"\u003e115\u003c/a\u003e, \u003ca href=\"#bib.bib42\"\u003e110\u003c/a\u003e, \u003ca href=\"#bib.bib44\"\u003e37\u003c/a\u003e, \u003ca href=\"#bib.bib43\"\u003e80\u003c/a\u003e]。就像语言基础模型从 GPT-2 快速发展到 GPT-3，最终走到 ChatGPT 和今天的现代 LLM 一样，只要我们开始明确地朝这个未来建设，视频模型也很可能迅速演进成能力完整的视觉基础模型。\u003c/p\u003e\n\u003cp\u003e基于这些理由，我认为，通过把视频模型发展为视觉基础模型，视觉通用智能是可以实现的；更令人期待的是，这有可能统一今天仍十分碎片化、还处于“每个任务都需要自己的模型”状态下的大量计算机视觉研究。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS1.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e把视频模型视为视觉基础模型，既有原则层面的理由，也有实践层面的理由。原则上的原因在于，视频生成是许多视觉任务中最具一般性的框架，静态图像可以被视为其中的一个特例 [[102](#bib.bib50), e.g.]。实践上的原因则是，过去大约两年里，视频模型终于进入舞台中央，能力迅速提升，目前的重要进展往往以月、甚至以天为单位发生。事实上，它们已经足以充当视觉基础模型的“1.0 版本”。在我们近期的工作 [[93](#bib.bib39)] 中，我们证明了 Veo 3 这样的生成式视频模型，在视觉领域已经展现出与早期语言基础模型类似的广泛涌现能力。无需任何任务专用训练，模型仅通过图像到视频生成就能执行一系列视觉任务：边缘检测、目标分割、关键点定位、超分辨率、图像编辑、风格迁移，甚至包括迷宫求解、图遍历等早期形式的视觉推理。Veo 3 原本是一个面向娱乐用途训练的视频模型，却恰好成为了视觉基础模型。后续研究也在其他模型——包括开源模型——上验证并扩展了这些发现 [[86](#bib.bib45), [57](#bib.bib49), [69](#bib.bib48), [45](#bib.bib47), [115](#bib.bib46), [110](#bib.bib42), [37](#bib.bib44), [80](#bib.bib43)]。就像语言基础模型从 GPT-2 快速发展到 GPT-3，最终走到 ChatGPT 和今天的现代 LLM 一样，只要我们开始明确地朝这个未来建设，视频模型也很可能迅速演进成能力完整的视觉基础模型。\n\n基于这些理由，我认为，通过把视频模型发展为视觉基础模型，视觉通用智能是可以实现的；更令人期待的是，这有可能统一今天仍十分碎片化、还处于“每个任务都需要自己的模型”状态下的大量计算机视觉研究。","sourceFormat":"markdown"},"note:sha256:776559283483ee7d32a927dd15758eafa7178c3ae54fa7c590afec2dbe0fdda6":{"html":"\u003cp\u003e智能并不只存在于拥有唯一正确答案的任务中。在开放式情境里，成功还取决于能否以有创造力的方式满足要求，并建立此前没有被明确遇见过的新联系。对于视觉智能而言，这类任务可以包括：在功能约束下设计物体、为机器人提出彼此不同的计划、构建科学示意图，或设想一个物理场景可能如何以多种方式演化。这些任务中的创造力，要求输出不仅自身连贯，还要在重复生成之间具有多样性，并相对于训练经验保持原创性。随着视觉模型越来越多地被用于科学发现、设计、新型训练数据生成以及测试时探索，这些能力会变得愈发重要。\u003c/p\u003e\n\u003cp\u003e很多创造性任务都需要一次“思维跃迁”：在可观察输出真正生成之前，先通过一种隐式的搜索与规划过程，协调多个相互依赖的决策。在视觉任务中，这个隐藏计划可能规定场景布局、3D 结构、一组物体关系、某种物理机制、相机轨迹，或一连串动作。它在最终图像或视频中可能只能被间接观察到。因此，要生成这样的结果，模型必须把握整个生成过程中的高阶结构，而不是把一个个局部上看似合理的选择简单拼装起来。\u003c/p\u003e\n\u003cp\u003e在此前的工作中，我们设计了一组最小化的算法任务。它们是对开放式现实任务的宽松抽象，但可以让创造力在受控环境下被测量。借鉴认知科学中的分类，我们考虑了两种创造力。\u003cstrong\u003e组合式创造力（combinational creativity）\u003c/strong\u003e 寻找熟悉元素之间不熟悉的联系，例如类比、文字游戏，以及发现原本彼此分离的思想之间的连接。它在视觉领域的对应形式，可以是在熟悉的物体、场景、概念或物理过程中，找到出乎意料却又有意义的关系。\u003cstrong\u003e探索式创造力（exploratory creativity）\u003c/strong\u003e 则是在一组规则或约束之下构造新的模式，例如设计问题、蛋白质、机制或叙事。它在视觉领域的对应形式，可以是一个满足几何、物理、语义或任务级约束的新场景、3D 结构、视频、机制或行动计划。\u003c/p\u003e\n\u003cp\u003e在这两种情况下，目标都是生成连贯、彼此不同，而且并非简单复现训练样本的解决方案。我们把这种可操作的定义称为\u003cstrong\u003e算法创造力（algorithmic creativity）\u003c/strong\u003e。与之对应，对创造性视觉智能的评估至少应衡量三个属性。第一，每个输出都应当连贯，并满足相关的物理、几何、语义、时间或任务约束。第二，不同生成结果应在结构上具有多样性，代表真正不同的解决方案，而不仅仅是纹理、颜色、措辞或视角上的表面变化。第三，输出相对于模型的训练经验应具有原创性。\u003c/p\u003e\n\u003cp\u003e我们的结果表明，学习目标会影响这类行为能否被获得。在受控任务中，基于 teacherless training 和 diffusion 的多 token 方法，比传统的下一 token 学习生成出了更多样、更原创的解法。这里的核心问题是全局协调：潜在的创造性计划通过序列多个部分之间的关系体现出来，而这些部分必须作为一个整体彼此协调。对于视觉模型而言，这提示我们需要这样的目标与架构：既能表示一个高层次的整体构造，又能在保持空间与时间一致性的同时生成局部细节。\u003c/p\u003e\n\u003cp\u003e我们还考察了随机性应当在生成过程的哪个位置进入。与其只通过输出层的温度采样引入随机性，seed-conditioning 会在训练和推理阶段都向模型提供随机输入。不同 seed 可以选择不同解法，同时让每个解法内部仍保持一致。其视觉对应形式，可以是在生成细节之前，用一个持续存在的样本级潜变量先选定某种高层次可能性——例如布局、机制、轨迹或假设。这样做或许能促进完整方案之间真正的多样性，而不是仅在解码过程中制造局部变化。\u003c/p\u003e\n\u003cp\u003e因此，创造力扩展了“生成”在视觉通用智能中的角色。一个具备视觉智能的系统，不应只会识别眼前存在什么、重建隐藏结构，或预测最可能发生的未来；它还应当能够构造多个合理的替代方案，保持每个方案内部的逻辑，并搜索那些既有用又陌生的可能性。因此，对视觉模型的评价不应只有保真度和准确率，还应包括连贯性、结构多样性、原创性与实用性。核心问题不只是模型能不能“想象”，而是它能不能在不失去结构的前提下，\u003cstrong\u003e以不同的方式去想象\u003c/strong\u003e。\u003c/p\u003e\n","kind":"html","rawMarkdown":"智能并不只存在于拥有唯一正确答案的任务中。在开放式情境里，成功还取决于能否以有创造力的方式满足要求，并建立此前没有被明确遇见过的新联系。对于视觉智能而言，这类任务可以包括：在功能约束下设计物体、为机器人提出彼此不同的计划、构建科学示意图，或设想一个物理场景可能如何以多种方式演化。这些任务中的创造力，要求输出不仅自身连贯，还要在重复生成之间具有多样性，并相对于训练经验保持原创性。随着视觉模型越来越多地被用于科学发现、设计、新型训练数据生成以及测试时探索，这些能力会变得愈发重要。\n\n很多创造性任务都需要一次“思维跃迁”：在可观察输出真正生成之前，先通过一种隐式的搜索与规划过程，协调多个相互依赖的决策。在视觉任务中，这个隐藏计划可能规定场景布局、3D 结构、一组物体关系、某种物理机制、相机轨迹，或一连串动作。它在最终图像或视频中可能只能被间接观察到。因此，要生成这样的结果，模型必须把握整个生成过程中的高阶结构，而不是把一个个局部上看似合理的选择简单拼装起来。\n\n在此前的工作中，我们设计了一组最小化的算法任务。它们是对开放式现实任务的宽松抽象，但可以让创造力在受控环境下被测量。借鉴认知科学中的分类，我们考虑了两种创造力。**组合式创造力（combinational creativity）** 寻找熟悉元素之间不熟悉的联系，例如类比、文字游戏，以及发现原本彼此分离的思想之间的连接。它在视觉领域的对应形式，可以是在熟悉的物体、场景、概念或物理过程中，找到出乎意料却又有意义的关系。**探索式创造力（exploratory creativity）** 则是在一组规则或约束之下构造新的模式，例如设计问题、蛋白质、机制或叙事。它在视觉领域的对应形式，可以是一个满足几何、物理、语义或任务级约束的新场景、3D 结构、视频、机制或行动计划。\n\n在这两种情况下，目标都是生成连贯、彼此不同，而且并非简单复现训练样本的解决方案。我们把这种可操作的定义称为**算法创造力（algorithmic creativity）**。与之对应，对创造性视觉智能的评估至少应衡量三个属性。第一，每个输出都应当连贯，并满足相关的物理、几何、语义、时间或任务约束。第二，不同生成结果应在结构上具有多样性，代表真正不同的解决方案，而不仅仅是纹理、颜色、措辞或视角上的表面变化。第三，输出相对于模型的训练经验应具有原创性。\n\n我们的结果表明，学习目标会影响这类行为能否被获得。在受控任务中，基于 teacherless training 和 diffusion 的多 token 方法，比传统的下一 token 学习生成出了更多样、更原创的解法。这里的核心问题是全局协调：潜在的创造性计划通过序列多个部分之间的关系体现出来，而这些部分必须作为一个整体彼此协调。对于视觉模型而言，这提示我们需要这样的目标与架构：既能表示一个高层次的整体构造，又能在保持空间与时间一致性的同时生成局部细节。\n\n我们还考察了随机性应当在生成过程的哪个位置进入。与其只通过输出层的温度采样引入随机性，seed-conditioning 会在训练和推理阶段都向模型提供随机输入。不同 seed 可以选择不同解法，同时让每个解法内部仍保持一致。其视觉对应形式，可以是在生成细节之前，用一个持续存在的样本级潜变量先选定某种高层次可能性——例如布局、机制、轨迹或假设。这样做或许能促进完整方案之间真正的多样性，而不是仅在解码过程中制造局部变化。\n\n因此，创造力扩展了“生成”在视觉通用智能中的角色。一个具备视觉智能的系统，不应只会识别眼前存在什么、重建隐藏结构，或预测最可能发生的未来；它还应当能够构造多个合理的替代方案，保持每个方案内部的逻辑，并搜索那些既有用又陌生的可能性。因此，对视觉模型的评价不应只有保真度和准确率，还应包括连贯性、结构多样性、原创性与实用性。核心问题不只是模型能不能“想象”，而是它能不能在不失去结构的前提下，**以不同的方式去想象**。","sourceFormat":"markdown"},"note:sha256:865e1648ea7e958fd840131576e42c309829ce78fc193465859baa5f1017aa9f":{"html":"\u003cblockquote\u003e\n\u003cp\u003e作者：Hirokatsu Kataoka, Yoshihiro Fukuhara, Yonglong Tian, Shangzhe Wu, Oishi Deb, Ryousuke Yamada, Christian Rupprecht, Jianyuan Wang, Kohsuke Ide, Koichi Namekata, Xianzheng Ma, Yiming Chen, Robert Geirhos, Aditi Raghunathan, Yuki M. Asano, Deva Ramanan, David Fouhey, Andrew J. Davison, Yilun Du, Jiajun Wu, Zhuang Liu\u003cbr\u003e机构：National Institute of Advanced Industrial Science and Technology (AIST) · Visual Geometry Group (VGG), University of Oxford · CADDi · OpenAI · University of Cambridge · University of Technology Nuremberg · University of Tsukuba · Google DeepMind · Carnegie Mellon University · New York University · Imperial College London · Harvard University · Stanford University · Princeton University\u003cbr\u003e\u003ca href=\"https://arxiv.org/html/2608.25924\" target=\"_blank\" rel=\"noopener noreferrer\"\u003earXiv:2608.25924v1\u003c/a\u003e · cs.CV · 2026-08-26\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e 作者：Hirokatsu Kataoka, Yoshihiro Fukuhara, Yonglong Tian, Shangzhe Wu, Oishi Deb, Ryousuke Yamada, Christian Rupprecht, Jianyuan Wang, Kohsuke Ide, Koichi Namekata, Xianzheng Ma, Yiming Chen, Robert Geirhos, Aditi Raghunathan, Yuki M. Asano, Deva Ramanan, David Fouhey, Andrew J. Davison, Yilun Du, Jiajun Wu, Zhuang Liu\n\u003e 机构：National Institute of Advanced Industrial Science and Technology \\(AIST\\) · Visual Geometry Group \\(VGG\\), University of Oxford · CADDi · OpenAI · University of Cambridge · University of Technology Nuremberg · University of Tsukuba · Google DeepMind · Carnegie Mellon University · New York University · Imperial College London · Harvard University · Stanford University · Princeton University\n\u003e [arXiv:2608.25924v1](https://arxiv.org/html/2608.25924) · cs.CV · 2026-08-26","sourceFormat":"markdown"},"note:sha256:9eac0fad974ca879d65dcb11cce3d5e7286faf78387d3cc5ce0d4f62625053c8":{"html":"\u003cp\u003e我们把视觉智能理解为这样一种能力：从视觉经验中获得关于世界的可用知识，并把这些知识用于预测、想象、重建和新任务。从这个意义上说，视觉智能就是从视觉经验中涌现出的智能：它能够从不完整的视觉观察中学习可用的、关于可观测世界的结构，理解隐藏结构，预测接下来可能发生什么，重建那些没有被直接观察到的内容，想象可能存在的替代方案，并把这些知识泛化到新的视觉任务。它并不只是一个更强的图像分类器，也不只是一个连接到 LLM 的视觉编码器。\u003c/p\u003e\n\u003cp\u003e这一观点带来的一个重要结论是：\u003cstrong\u003e人类视觉不应成为视觉智能的能力上限。\u003c/strong\u003e 一个接触到比人类更丰富视觉信息的系统，可能获得超越人类中心视觉的智能。视觉智能的目标不是模仿人类感知，而是追问：当机器能够以人类无法接触的规模、多样性和精度，从视觉经验中学习时，会涌现出怎样的智能？这一观点也提示了一个横跨人类、动物与机器的共同类比。生物体无需语言，也能通过感知世界、发现规律、预测和行动，表现出智能行为。视觉和感知远早于符号语言出现，因此，类似智能的功能完全可能在没有语言的情况下涌现。对于视觉研究而言，关键问题是：一个足够强大的视觉系统，能否获得关于世界的内部知识，并从这种知识中激发出智能行为？\u003c/p\u003e\n\u003cp\u003e如果一个模型对世界的理解足够深入，很多能力也许已经潜伏在模型内部。剩下的问题，可能只是怎样把它们激发出来。这是语言模型发展史带给我们的一个重要经验：一个只用简单自回归目标、在大规模文本上训练的模型，只要在上下文中给出少量示例，就能完成新任务。视觉领域可能存在对应形式，也就是真正的\u003cstrong\u003e视觉上下文学习（visual in-context learning）\u003c/strong\u003e。模型先看到一个新任务的少量视觉示例，推断任务结构，推断合适的输出形式，然后无需显式重新训练，就能解决新的案例。换句话说，如果一个模型已经足够好地捕捉了世界的外观和动态，那么视觉上下文学习可能让我们无需更新参数，就更容易激发出新能力。不过，即使如此，世界模型也只是必要条件，而不是充分条件。智能还要求系统能够在新目标下使用这个模型：推断任务，选择相关抽象，生成反事实，适应新的观察，并采取或给出恰当行动与响应。\u003c/p\u003e\n\u003cp\u003e我们的核心假设是，视觉智能可能通过三种互补学习目标的汇合而涌现：\u003cstrong\u003e序列预测、开放式生成与重建\u003c/strong\u003e。它们对应智能的三种基本操作。序列预测回答“接下来会发生什么”；开放式生成探索“可能存在什么”；重建则从不完整观察中推断隐藏结构。单独来看，每一种目标都可能产生非常强大的模型；组合起来，它们则可能定义一条从视觉基础模型走向视觉智能，最终走向通用智能的路径。\u003c/p\u003e\n\u003cp\u003e自回归视觉学习可能成为视觉领域的 GPT 对应物。在语言中，下一 token 预测看起来很简单，但如果模型真的要预测成功，就必须捕捉语法、语义、事实、篇章、推理模式与任务结构。在视觉中，预测下一个视觉状态可能需要更加丰富的潜在概念。面对图像、视频或具身观察，模型必须推断物体、几何、运动、遮挡、物理约束、相机运动、Agent 行为、时间因果与不确定性。所谓连贯预测，并不只是外推像素，而是要推断使下一次观察变得合理的隐藏结构。如果一个模型能够跨越多样环境和长时间跨度预测未来视觉状态，那么它实际上被迫学习世界如何演化。这种压力天然把系统推向视觉世界建模：模型必须从观察中学习，推断其结构，并预判之后应该出现什么。\u003c/p\u003e\n\u003cp\u003e生成式学习，就是学习如何想象。与识别相比，生成往往提出更广泛的建模要求，因为识别有时只要找到具有判别力的线索就能成功，而生成则要求模型表示“什么可能存在”。一个高质量生成模型必须学习外观、几何、材质、光照、运动、交互以及合理性。如果这样的模型能够生成高保真图像、视频、3D 场景，以及物理世界可能出现的未来，它就不再只是内容生成器。只要它捕捉的是物理和时间结构，而不仅仅是表面外观，它就可能成为一种内部模拟器的基础。一个能够想象的视觉 Agent，还可以在自己生成的可能性空间里继续学习：构造反事实、检验假设、模拟后果，并在真正行动之前细化自己的理解。从这个意义上说，想象并不是装饰，而是一种学习、理解和思考机制。\u003c/p\u003e\n\u003cp\u003e重建则提供了一条从不完整观察直接学习隐藏结构的路径。超分辨率、图像修复、逆向渲染、深度估计、多视图重建、3D 重建和 4D 动态重建，都要求模型从有限观察中恢复隐藏原因。其中，可规模扩展的 3D 重建尤其重要。一个能够根据图像实时、准确重建世界的系统，必须获得空间、尺度、对应关系、表面、物体、运动和物理一致性等概念。这样的系统还可能学会检测异常、推断不可见结构，并理解为什么某些观察在物理上合理、另一些则不合理。如果重建能力得到大幅提升，它可能就不再只是一项恢复任务，而会成为一种从视觉证据中恢复物理世界规律的方法。\u003c/p\u003e\n\u003cp\u003e因此，在走向 AGI 的过程中，视觉智能的角色不是取代语言，而是提供一条具有现实 grounding、并且可能相对独立的路径。语言优先的 AI 已经证明，简单目标在大规模训练下可以涌现出广泛能力。现在，视觉优先的 AI 应该提出对应问题：当模型在大规模视觉经验中学习时，会涌现出什么？一些早期迹象已经出现在视频理解、几何理解、物理理解、具身智能、语言对齐和第一视角感知等系统中。我们不应把这些视为彼此孤立的 demo，而应把它们看成一张更大路线图上的早期坐标：从视觉基础模型走向视觉智能，再从视觉智能走向通用智能。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们把视觉智能理解为这样一种能力：从视觉经验中获得关于世界的可用知识，并把这些知识用于预测、想象、重建和新任务。从这个意义上说，视觉智能就是从视觉经验中涌现出的智能：它能够从不完整的视觉观察中学习可用的、关于可观测世界的结构，理解隐藏结构，预测接下来可能发生什么，重建那些没有被直接观察到的内容，想象可能存在的替代方案，并把这些知识泛化到新的视觉任务。它并不只是一个更强的图像分类器，也不只是一个连接到 LLM 的视觉编码器。\n\n这一观点带来的一个重要结论是：**人类视觉不应成为视觉智能的能力上限。** 一个接触到比人类更丰富视觉信息的系统，可能获得超越人类中心视觉的智能。视觉智能的目标不是模仿人类感知，而是追问：当机器能够以人类无法接触的规模、多样性和精度，从视觉经验中学习时，会涌现出怎样的智能？这一观点也提示了一个横跨人类、动物与机器的共同类比。生物体无需语言，也能通过感知世界、发现规律、预测和行动，表现出智能行为。视觉和感知远早于符号语言出现，因此，类似智能的功能完全可能在没有语言的情况下涌现。对于视觉研究而言，关键问题是：一个足够强大的视觉系统，能否获得关于世界的内部知识，并从这种知识中激发出智能行为？\n\n如果一个模型对世界的理解足够深入，很多能力也许已经潜伏在模型内部。剩下的问题，可能只是怎样把它们激发出来。这是语言模型发展史带给我们的一个重要经验：一个只用简单自回归目标、在大规模文本上训练的模型，只要在上下文中给出少量示例，就能完成新任务。视觉领域可能存在对应形式，也就是真正的**视觉上下文学习（visual in-context learning）**。模型先看到一个新任务的少量视觉示例，推断任务结构，推断合适的输出形式，然后无需显式重新训练，就能解决新的案例。换句话说，如果一个模型已经足够好地捕捉了世界的外观和动态，那么视觉上下文学习可能让我们无需更新参数，就更容易激发出新能力。不过，即使如此，世界模型也只是必要条件，而不是充分条件。智能还要求系统能够在新目标下使用这个模型：推断任务，选择相关抽象，生成反事实，适应新的观察，并采取或给出恰当行动与响应。\n\n我们的核心假设是，视觉智能可能通过三种互补学习目标的汇合而涌现：**序列预测、开放式生成与重建**。它们对应智能的三种基本操作。序列预测回答“接下来会发生什么”；开放式生成探索“可能存在什么”；重建则从不完整观察中推断隐藏结构。单独来看，每一种目标都可能产生非常强大的模型；组合起来，它们则可能定义一条从视觉基础模型走向视觉智能，最终走向通用智能的路径。\n\n自回归视觉学习可能成为视觉领域的 GPT 对应物。在语言中，下一 token 预测看起来很简单，但如果模型真的要预测成功，就必须捕捉语法、语义、事实、篇章、推理模式与任务结构。在视觉中，预测下一个视觉状态可能需要更加丰富的潜在概念。面对图像、视频或具身观察，模型必须推断物体、几何、运动、遮挡、物理约束、相机运动、Agent 行为、时间因果与不确定性。所谓连贯预测，并不只是外推像素，而是要推断使下一次观察变得合理的隐藏结构。如果一个模型能够跨越多样环境和长时间跨度预测未来视觉状态，那么它实际上被迫学习世界如何演化。这种压力天然把系统推向视觉世界建模：模型必须从观察中学习，推断其结构，并预判之后应该出现什么。\n\n生成式学习，就是学习如何想象。与识别相比，生成往往提出更广泛的建模要求，因为识别有时只要找到具有判别力的线索就能成功，而生成则要求模型表示“什么可能存在”。一个高质量生成模型必须学习外观、几何、材质、光照、运动、交互以及合理性。如果这样的模型能够生成高保真图像、视频、3D 场景，以及物理世界可能出现的未来，它就不再只是内容生成器。只要它捕捉的是物理和时间结构，而不仅仅是表面外观，它就可能成为一种内部模拟器的基础。一个能够想象的视觉 Agent，还可以在自己生成的可能性空间里继续学习：构造反事实、检验假设、模拟后果，并在真正行动之前细化自己的理解。从这个意义上说，想象并不是装饰，而是一种学习、理解和思考机制。\n\n重建则提供了一条从不完整观察直接学习隐藏结构的路径。超分辨率、图像修复、逆向渲染、深度估计、多视图重建、3D 重建和 4D 动态重建，都要求模型从有限观察中恢复隐藏原因。其中，可规模扩展的 3D 重建尤其重要。一个能够根据图像实时、准确重建世界的系统，必须获得空间、尺度、对应关系、表面、物体、运动和物理一致性等概念。这样的系统还可能学会检测异常、推断不可见结构，并理解为什么某些观察在物理上合理、另一些则不合理。如果重建能力得到大幅提升，它可能就不再只是一项恢复任务，而会成为一种从视觉证据中恢复物理世界规律的方法。\n\n因此，在走向 AGI 的过程中，视觉智能的角色不是取代语言，而是提供一条具有现实 grounding、并且可能相对独立的路径。语言优先的 AI 已经证明，简单目标在大规模训练下可以涌现出广泛能力。现在，视觉优先的 AI 应该提出对应问题：当模型在大规模视觉经验中学习时，会涌现出什么？一些早期迹象已经出现在视频理解、几何理解、物理理解、具身智能、语言对齐和第一视角感知等系统中。我们不应把这些视为彼此孤立的 demo，而应把它们看成一张更大路线图上的早期坐标：从视觉基础模型走向视觉智能，再从视觉智能走向通用智能。","sourceFormat":"markdown"},"note:sha256:9f2d8565bd2d342d607dc3044d1e5fc8449adad1d276badce737b3a1cfa96b61":{"html":"\u003cp\u003e本文提出的不同观点，从彼此互补的方向切入视觉通用智能（VGI）。表 \u003ca href=\"#S3.T1\"\u003e1\u003c/a\u003e 对这些核心立场作了简要总结。\u003c/p\u003e\n\u003cp\u003e表 1：本文所呈现的视觉通用智能不同观点的简要总结。\u003c/p\u003e\n\u003cp\u003e总体来看，这些立场大体可以归纳为以下方向：规模扩展与生成建模；创造力、预测、想象与重建；持续学习与终身学习；持久的 3D 与空间世界表征；具身、主动感知与行动；多模态学习与计算效率；科学发现与对陌生环境的泛化；组合式物理结构的恢复；以及不以语言作为主要组织中心的视觉智能形态。\u003c/p\u003e\n\u003cp\u003e多位作者都把生成式学习置于核心位置。Geirhos 认为，在 Web 规模视觉数据上训练的生成式视频模型可以获得通用能力，因为与任务专用识别相比，生成要求模型解释视觉世界中远更多的内容（第 \u003ca href=\"#S2.SS1\"\u003e2.1\u003c/a\u003e 节）。Raghunathan 把生成从“保真”进一步推向“创造力”，要求输出同时具备连贯性、结构多样性、原创性和实用性（第 \u003ca href=\"#S2.SS2\"\u003e2.2\u003c/a\u003e 节）。Ramanan 等人把生成视为自监督表征学习可能的终极形态，同时强调多模态与效率（第 \u003ca href=\"#S2.SS4\"\u003e2.4\u003c/a\u003e 节）。Du 使用生成式世界模型来支持稳健感知，并把视觉生成作为连接行动的接口（第 \u003ca href=\"#S2.SS7\"\u003e2.7\u003c/a\u003e 节）。Kataoka 等人则把生成视为“想象”，并将其与自回归预测、基于重建的结构理解结合起来（第 \u003ca href=\"#S2.SS10\"\u003e2.10\u003c/a\u003e 节）。\u003c/p\u003e\n\u003cp\u003eShangzhe Wu 与 Jiajun Wu 对这种“生成中心”倾向提出了一个互补性的限定（第 \u003ca href=\"#S2.SS8\"\u003e2.8\u003c/a\u003e 节）。他们认为，预测像素或生成照片般逼真的输出，并不能单独证明模型理解了物理世界。视觉智能应该恢复产生一次观察的实体、内在属性与外在属性、关系和动力学，使得到的表征能够支持干预、模拟、验证与行动。\u003c/p\u003e\n\u003cp\u003e其他观点则更强调视觉知识应该如何获得、如何随时间维持，以及如何被使用。Asano 认为，一个具备视觉智能的系统应当在自己的视觉生命历程中不断发展，而不是预训练后就固定不变（第 \u003ca href=\"#S2.SS3\"\u003e2.3\u003c/a\u003e 节）。Davison 强调持久但可适应的空间表征、闭环状态估计，以及实时空间 AI 所需要的计算结构（第 \u003ca href=\"#S2.SS6\"\u003e2.6\u003c/a\u003e 节）。Du 把持久场景表征进一步连接到行动、主动探索和持续适应。Liu 则进一步提出，视觉原生系统不应只是被动处理预先指定的视觉输入，而必须自己决定\u003cstrong\u003e什么时候看、看哪里、需要多少细节\u003c/strong\u003e（第 \u003ca href=\"#S2.SS9\"\u003e2.9\u003c/a\u003e 节）。\u003c/p\u003e\n\u003cp\u003e视觉智能的范围也超出了传统视觉识别。Ramanan 等人强调原始多模态经验，包括触觉、音频和本体感觉。Fouhey 从科学场景出发，强调在缺少传统 ground truth 时如何验证，如何处理传感器系统误差和单位，以及如何整合领域知识（第 \u003ca href=\"#S2.SS5\"\u003e2.5\u003c/a\u003e 节）。Raghunathan 关于创造力的讨论，同样追问一个系统能否构造出训练经验中从未明确出现过的可能性。\u003c/p\u003e\n\u003cp\u003e这些观点并没有收敛为一种单一模型、学习目标、表征方式或 VGI 定义。但它们共享一个重要前提：\u003cstrong\u003e视觉通用智能不应被简单理解为更准确的图像识别系统，也不应只是一个挂在语言模型上的视觉编码器。\u003c/strong\u003e VGI 更关心的是从视觉经验中涌现出的智能：系统能够发现并验证世界结构，随时间维持和更新知识，预测可能的未来，想象替代方案，重建未被观察的结构，并让行为适应陌生情境。对这类知识的最终检验，也不应只看系统能否描述或复现一次观察，还要看它的表征能否被编辑、模拟，并用于支持可靠行动。\u003c/p\u003e\n\u003cp\u003e因此，由此形成的研究议程远不止“扩大模型规模”。一个核心挑战，是确定如何在一个通用视觉系统中组合生成、组合式物理结构、记忆、空间理解、具身、主动信息获取、多模态经验与持续学习。本文中各观点的多样性提示我们：这些组成部分不应被当作彼此孤立的能力，而应被视为从视觉基础模型走向视觉智能，并可能进一步走向通用智能的一条更广路径中的互补部分。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本文提出的不同观点，从彼此互补的方向切入视觉通用智能（VGI）。表 [1](#S3.T1) 对这些核心立场作了简要总结。\n\n\n表 1：本文所呈现的视觉通用智能不同观点的简要总结。\n\n总体来看，这些立场大体可以归纳为以下方向：规模扩展与生成建模；创造力、预测、想象与重建；持续学习与终身学习；持久的 3D 与空间世界表征；具身、主动感知与行动；多模态学习与计算效率；科学发现与对陌生环境的泛化；组合式物理结构的恢复；以及不以语言作为主要组织中心的视觉智能形态。\n\n多位作者都把生成式学习置于核心位置。Geirhos 认为，在 Web 规模视觉数据上训练的生成式视频模型可以获得通用能力，因为与任务专用识别相比，生成要求模型解释视觉世界中远更多的内容（第 [2.1](#S2.SS1) 节）。Raghunathan 把生成从“保真”进一步推向“创造力”，要求输出同时具备连贯性、结构多样性、原创性和实用性（第 [2.2](#S2.SS2) 节）。Ramanan 等人把生成视为自监督表征学习可能的终极形态，同时强调多模态与效率（第 [2.4](#S2.SS4) 节）。Du 使用生成式世界模型来支持稳健感知，并把视觉生成作为连接行动的接口（第 [2.7](#S2.SS7) 节）。Kataoka 等人则把生成视为“想象”，并将其与自回归预测、基于重建的结构理解结合起来（第 [2.10](#S2.SS10) 节）。\n\nShangzhe Wu 与 Jiajun Wu 对这种“生成中心”倾向提出了一个互补性的限定（第 [2.8](#S2.SS8) 节）。他们认为，预测像素或生成照片般逼真的输出，并不能单独证明模型理解了物理世界。视觉智能应该恢复产生一次观察的实体、内在属性与外在属性、关系和动力学，使得到的表征能够支持干预、模拟、验证与行动。\n\n其他观点则更强调视觉知识应该如何获得、如何随时间维持，以及如何被使用。Asano 认为，一个具备视觉智能的系统应当在自己的视觉生命历程中不断发展，而不是预训练后就固定不变（第 [2.3](#S2.SS3) 节）。Davison 强调持久但可适应的空间表征、闭环状态估计，以及实时空间 AI 所需要的计算结构（第 [2.6](#S2.SS6) 节）。Du 把持久场景表征进一步连接到行动、主动探索和持续适应。Liu 则进一步提出，视觉原生系统不应只是被动处理预先指定的视觉输入，而必须自己决定**什么时候看、看哪里、需要多少细节**（第 [2.9](#S2.SS9) 节）。\n\n视觉智能的范围也超出了传统视觉识别。Ramanan 等人强调原始多模态经验，包括触觉、音频和本体感觉。Fouhey 从科学场景出发，强调在缺少传统 ground truth 时如何验证，如何处理传感器系统误差和单位，以及如何整合领域知识（第 [2.5](#S2.SS5) 节）。Raghunathan 关于创造力的讨论，同样追问一个系统能否构造出训练经验中从未明确出现过的可能性。\n\n这些观点并没有收敛为一种单一模型、学习目标、表征方式或 VGI 定义。但它们共享一个重要前提：**视觉通用智能不应被简单理解为更准确的图像识别系统，也不应只是一个挂在语言模型上的视觉编码器。** VGI 更关心的是从视觉经验中涌现出的智能：系统能够发现并验证世界结构，随时间维持和更新知识，预测可能的未来，想象替代方案，重建未被观察的结构，并让行为适应陌生情境。对这类知识的最终检验，也不应只看系统能否描述或复现一次观察，还要看它的表征能否被编辑、模拟，并用于支持可靠行动。\n\n因此，由此形成的研究议程远不止“扩大模型规模”。一个核心挑战，是确定如何在一个通用视觉系统中组合生成、组合式物理结构、记忆、空间理解、具身、主动信息获取、多模态经验与持续学习。本文中各观点的多样性提示我们：这些组成部分不应被当作彼此孤立的能力，而应被视为从视觉基础模型走向视觉智能，并可能进一步走向通用智能的一条更广路径中的互补部分。","sourceFormat":"markdown"},"note:sha256:a8f7f84c3a4a46a1c2417a9a80bc3150a5584a5c46d142c1d3ca8ae9aba9045d":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS1.p1.1\"\u003e\u003c/span\u003e在我的研究语境中，视觉智能可以被理解为：无需针对每一个新任务进行显式训练，就能解决从感知到推理的各种视觉任务。就像大语言模型如今已经能够处理大多数语言任务一样，我相信机器视觉终于也到了从任务专用模型转向通用模型的时刻。迄今为止，计算机视觉社区已经构建了许多出色的单项模型和任务专用模型 [\u003ca href=\"#bib.bib51\"\u003e101\u003c/a\u003e, \u003ca href=\"#bib.bib52\"\u003e46\u003c/a\u003e, e.g.]，但这个领域还没有像 LLM 统一了自然语言处理大部分研究那样，被某个共同框架真正统一起来。那么，我们应该怎样构建统一的视觉基础模型？开启语言智能的那些基础要素——在 Web 规模数据上训练大型生成模型——可以直接应用到今天的生成式视频模型上。我确信，把这些原则本身（大规模训练 + 生成目标）迁移到视频模型，是解决视觉智能问题的关键。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS1.p1.1\"\u003e\u003c/span\u003e在我的研究语境中，视觉智能可以被理解为：无需针对每一个新任务进行显式训练，就能解决从感知到推理的各种视觉任务。就像大语言模型如今已经能够处理大多数语言任务一样，我相信机器视觉终于也到了从任务专用模型转向通用模型的时刻。迄今为止，计算机视觉社区已经构建了许多出色的单项模型和任务专用模型 [[101](#bib.bib51), [46](#bib.bib52), e.g.]，但这个领域还没有像 LLM 统一了自然语言处理大部分研究那样，被某个共同框架真正统一起来。那么，我们应该怎样构建统一的视觉基础模型？开启语言智能的那些基础要素——在 Web 规模数据上训练大型生成模型——可以直接应用到今天的生成式视频模型上。我确信，把这些原则本身（大规模训练 + 生成目标）迁移到视频模型，是解决视觉智能问题的关键。","sourceFormat":"markdown"},"note:sha256:af38ae7154ce30ab2016afc389d328ca520a8a6818bd71047fd252c8002521b4":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS8.p1.1\"\u003e\u003c/span\u003e理解视觉智能的一种方式，是把它看成从视觉观察中恢复物理世界的结构——或者说“代码”。一幅图像，本质上是对某种物理现象的一次测量：一个场景由具有特定形状和材质的物体构成，它们以特定方式被照亮，从某个具体视角被观察，并在物理规律作用下运动与交互。图像记录的，只是这一整个构型恰好向相机发送的光。按照这种理解，“看见”就是试图把这次测量反过来：从被记录下来的光，推断产生它的底层场景。这样的框架在视觉研究中已经存在很久 [\u003ca href=\"#bib.bib53\"\u003e64\u003c/a\u003e, \u003ca href=\"#bib.bib5\"\u003e36\u003c/a\u003e, \u003ca href=\"#bib.bib4\"\u003e67\u003c/a\u003e, \u003ca href=\"#bib.bib68\"\u003e106\u003c/a\u003e]，也大体上是我们自己的研究一直遵循的路线。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.p2.1\"\u003e\u003c/span\u003e这个框架最吸引人的地方在于，它恢复出的结构能够超越最初被观察到的条件而继续有效。假设一个系统已经判断出：场景里有一个具有特定形状和材质的杯子，放在桌面上。那么，它就已经为回答很多训练期间从未被提出的问题做好准备，而且这些问题往往是反事实性的：从背后看这个杯子是什么样？如果桌子倾斜会发生什么？要把杯子拿起来，手应该放在哪里？如果一个系统学到的只是“杯子通常怎样出现在桌面上”的统计规律，它当然也可能正确回答其中一些问题，但它并没有特别充分的理由一定能做到。正是这种结构，使数量有限的观察能够支持开放式、近乎无限范围的预测与行动 [\u003ca href=\"#bib.bib82\"\u003e99\u003c/a\u003e, \u003ca href=\"#bib.bib83\"\u003e98\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.p3.1\"\u003e\u003c/span\u003e这也塑造了我们理解视觉与语言关系的方式。语言本身已经是对经验的一层抽象：它记录的是人们认为值得彼此描述的内容，并使用人类历史中恰好发展出来的词汇来表达。物理世界的很多行为从来没有被这样描述过——比如某一款婴儿车具体如何折叠，面团面对擀面杖时如何变形，一朵玫瑰如何开放，又如何在几周后逐渐凋谢塌陷 [\u003ca href=\"#bib.bib87\"\u003e33\u003c/a\u003e]。无论有没有人给这些现象命名，视觉观察都携带着相应信息。对我们而言，这正是把视觉视为一种独立的世界结构来源，而不只是语言模型输入通道的理由。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS8.p1.1\"\u003e\u003c/span\u003e理解视觉智能的一种方式，是把它看成从视觉观察中恢复物理世界的结构——或者说“代码”。一幅图像，本质上是对某种物理现象的一次测量：一个场景由具有特定形状和材质的物体构成，它们以特定方式被照亮，从某个具体视角被观察，并在物理规律作用下运动与交互。图像记录的，只是这一整个构型恰好向相机发送的光。按照这种理解，“看见”就是试图把这次测量反过来：从被记录下来的光，推断产生它的底层场景。这样的框架在视觉研究中已经存在很久 [[64](#bib.bib53), [36](#bib.bib5), [67](#bib.bib4), [106](#bib.bib68)]，也大体上是我们自己的研究一直遵循的路线。\n\n\u003cspan id=\"S2.SS8.p2.1\"\u003e\u003c/span\u003e这个框架最吸引人的地方在于，它恢复出的结构能够超越最初被观察到的条件而继续有效。假设一个系统已经判断出：场景里有一个具有特定形状和材质的杯子，放在桌面上。那么，它就已经为回答很多训练期间从未被提出的问题做好准备，而且这些问题往往是反事实性的：从背后看这个杯子是什么样？如果桌子倾斜会发生什么？要把杯子拿起来，手应该放在哪里？如果一个系统学到的只是“杯子通常怎样出现在桌面上”的统计规律，它当然也可能正确回答其中一些问题，但它并没有特别充分的理由一定能做到。正是这种结构，使数量有限的观察能够支持开放式、近乎无限范围的预测与行动 [[99](#bib.bib82), [98](#bib.bib83)]。\n\n\u003cspan id=\"S2.SS8.p3.1\"\u003e\u003c/span\u003e这也塑造了我们理解视觉与语言关系的方式。语言本身已经是对经验的一层抽象：它记录的是人们认为值得彼此描述的内容，并使用人类历史中恰好发展出来的词汇来表达。物理世界的很多行为从来没有被这样描述过——比如某一款婴儿车具体如何折叠，面团面对擀面杖时如何变形，一朵玫瑰如何开放，又如何在几周后逐渐凋谢塌陷 [[33](#bib.bib87)]。无论有没有人给这些现象命名，视觉观察都携带着相应信息。对我们而言，这正是把视觉视为一种独立的世界结构来源，而不只是语言模型输入通道的理由。","sourceFormat":"markdown"},"note:sha256:b1798155486ff546f2b818c29e6e3a5efe0b4bfb3b1a4aaf2919e8502d6fe83d":{"html":"\u003cp\u003e从视觉智能走向通用智能的路径，不太可能由某一个定义、模型或基准完整刻画。本节汇集不同研究视角，帮助厘清计算机视觉社区可以继续探索的一系列开放问题。\u003c/p\u003e\n","kind":"html","rawMarkdown":"从视觉智能走向通用智能的路径，不太可能由某一个定义、模型或基准完整刻画。本节汇集不同研究视角，帮助厘清计算机视觉社区可以继续探索的一系列开放问题。","sourceFormat":"markdown"},"note:sha256:c0b4202489310aa97f6cee6172b18e621576d19f173a3072c8ce710bd8b78d45":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS6.p1.1\"\u003e\u003c/span\u003e在 FutureMapping 1 和 2 [\u003ca href=\"#bib.bib61\"\u003e17\u003c/a\u003e, \u003ca href=\"#bib.bib62\"\u003e16\u003c/a\u003e] 中，我把空间 AI（Spatial AI）定义为这样一种能力：人工设备能够为周围环境建立真正丰富却又高效的表征，并据此像人类一样，以具备一般智能的方式与环境交互。借用 Pearl 的话来说：“人类拥有而其他物种缺少的，是一种心理表征——一张关于自身环境的蓝图；人可以随意操纵这张蓝图，想象不同的假设性环境，用于规划和学习” [\u003ca href=\"#bib.bib80\"\u003e71\u003c/a\u003e]。我认为，构建高质量、与具体任务无关的表征，是创造性视觉智能的关键；它将使一些真正改变世界的产品成为可能，例如能够自主收拾凌乱厨房的机器人，或一种通用、轻量的可穿戴设备，普遍增强人的记忆与智能。这类产品不仅对空间 AI 系统提出极高能力要求，也会从尺寸、重量和效率等方面，对其嵌入式实现施加非常严格的约束。因此，这些系统的\u003cstrong\u003e计算结构\u003c/strong\u003e——什么在什么地方被计算和存储，各部分如何连接，以及它们如何对应未来计算硬件可能的发展——是一个极其重要、却很少被讨论的研究问题。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS6.p1.1\"\u003e\u003c/span\u003e在 FutureMapping 1 和 2 [[17](#bib.bib61), [16](#bib.bib62)] 中，我把空间 AI（Spatial AI）定义为这样一种能力：人工设备能够为周围环境建立真正丰富却又高效的表征，并据此像人类一样，以具备一般智能的方式与环境交互。借用 Pearl 的话来说：“人类拥有而其他物种缺少的，是一种心理表征——一张关于自身环境的蓝图；人可以随意操纵这张蓝图，想象不同的假设性环境，用于规划和学习” [[71](#bib.bib80)]。我认为，构建高质量、与具体任务无关的表征，是创造性视觉智能的关键；它将使一些真正改变世界的产品成为可能，例如能够自主收拾凌乱厨房的机器人，或一种通用、轻量的可穿戴设备，普遍增强人的记忆与智能。这类产品不仅对空间 AI 系统提出极高能力要求，也会从尺寸、重量和效率等方面，对其嵌入式实现施加非常严格的约束。因此，这些系统的**计算结构**——什么在什么地方被计算和存储，各部分如何连接，以及它们如何对应未来计算硬件可能的发展——是一个极其重要、却很少被讨论的研究问题。","sourceFormat":"markdown"},"note:sha256:c3d7010687e3ec4215a8ca4c1bcf406b08f4240a38318f13a72867f16426ab99":{"html":"\u003cp\u003e\u003cspan id=\"S1.p1.1\"\u003e\u003c/span\u003e从人工智能（AI）的早期讨论开始，包括围绕 Alan Turing 与控制论展开的思考，人们就常把智能理解为这样一种能力：从环境信号中获得表征，捕捉其潜在规律，将其泛化到未见情境，并把这些表征连接到预测或行动 [\u003ca href=\"#bib.bib12\"\u003e82\u003c/a\u003e, \u003ca href=\"#bib.bib13\"\u003e94\u003c/a\u003e, \u003ca href=\"#bib.bib10\"\u003e49\u003c/a\u003e, \u003ca href=\"#bib.bib11\"\u003e35\u003c/a\u003e]。与此同时，并没有显而易见的理由认为智能应被还原为语言。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p2.1\"\u003e\u003c/span\u003e在地球生命史上，包括照相机式眼睛和复眼在内的高级视觉系统，可以追溯到约五亿年前的寒武纪；视觉系统的快速发展，也长期被讨论为推动生物互动发生重大变化的可能因素之一 [\u003ca href=\"#bib.bib14\"\u003e70\u003c/a\u003e, \u003ca href=\"#bib.bib15\"\u003e111\u003c/a\u003e]。相比之下，从生命史尺度看，高级人类语言、文字系统以及英语这样的具体语言都只是极其晚近的现象 [\u003ca href=\"#bib.bib16\"\u003e27\u003c/a\u003e, \u003ca href=\"#bib.bib17\"\u003e15\u003c/a\u003e, \u003ca href=\"#bib.bib18\"\u003e5\u003c/a\u003e]。这种反差提示我们：视觉或许不只是一个传感器或输入模态；视觉模态本身可能构成一种用于捕捉世界结构的基础智能功能。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p3.1\"\u003e\u003c/span\u003e大语言模型（LLM）的近期进展，为思考智能如何涌现提供了重要参照。从统计语言模型、神经概率语言模型 [\u003ca href=\"#bib.bib19\"\u003e7\u003c/a\u003e]，到 word2vec 等分布式表征 [\u003ca href=\"#bib.bib21\"\u003e66\u003c/a\u003e]、序列到序列模型 [\u003ca href=\"#bib.bib22\"\u003e77\u003c/a\u003e]、注意力机制 [\u003ca href=\"#bib.bib23\"\u003e3\u003c/a\u003e]、Transformer [\u003ca href=\"#bib.bib24\"\u003e84\u003c/a\u003e]、BERT [\u003ca href=\"#bib.bib25\"\u003e19\u003c/a\u003e] 与 GPT [\u003ca href=\"#bib.bib26\"\u003e73\u003c/a\u003e]，语言处理逐步从人工设计特征和任务专用流水线，转向基于大规模数据与通用学习目标的表征学习。GPT-3 尤其令人瞩目：它在没有图像、音频或具身交互的情况下，仅通过在 Web 规模文本语料上扩展一个简单的自回归自监督目标（下一 token 预测），便展现出上下文学习、少样本适应等广泛能力 [\u003ca href=\"#bib.bib27\"\u003e11\u003c/a\u003e]。Wei 等人将这种随规模增长而出现的定性能力跃迁概括为“大语言模型的涌现能力” [\u003ca href=\"#bib.bib28\"\u003e92\u003c/a\u003e]。这也与 Sutton 的《苦涩的教训》（The Bitter Lesson）[\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e] 相呼应：从长期看，能够随计算、数据、学习和搜索扩展的方法，往往会胜过人工设计的知识与规则。语言模型的成功当然不能简单照搬到视觉模型，但“简单目标 + 大规模经验 + 规模扩展”能够产生出乎意料的能力，这一事实为视觉智能提供了关键线索。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p4.1\"\u003e\u003c/span\u003e计算机视觉同样经历了深刻变革。在深度神经网络时代之前，这一领域已经积累了大量基于几何、统计和优化的方法，包括边缘与角点检测、SIFT 等局部特征、立体视觉、光流、运动恢复结构以及目标检测。AlexNet 在 ILSVRC 2012 的成功构成了转折点，开启了深度学习时代，并推动视觉识别取得巨大进展 [\u003ca href=\"#bib.bib30\"\u003e47\u003c/a\u003e, \u003ca href=\"#bib.bib31\"\u003e74\u003c/a\u003e]。近年来，视觉研究又从监督学习进一步扩展到自监督学习、图文对比学习、Transformer、图像与视频生成、3D/4D 重建、机器人以及具身 AI。在这一背景下，一个自然的问题是：当视觉模型不断扩大规模并接触越来越多样的视觉经验时，是否也会出现类似语言模型中的涌现能力？还是说，视觉需要一套视觉智能特有的原则？\u003c/p\u003e\n\u003cp\u003e现阶段没有必要用一个答案终结这个问题。一种观点认为，把单模态、单目标的视觉学习扩展到极致或许已经足够；另一种观点则认为，整合视频、几何、时空等视觉模态，或生成、修复、重建等视觉任务，可能不可或缺。关键不是把视觉基础模型（vision foundation models，VFM）的规模扩展本身当作终点，而是要追问：在怎样的学习策略、数据结构、模型架构和评估设置下，视觉表征才能泛化到未知任务和未知环境。当前 VFM 已越来越多地用于分类、稠密预测、对应关系估计和 3D 重建，但我们仍有很大空间去厘清：某种能力究竟来自训练数据、任务设计、解码器、提示、模型规模，还是这些因素的组合。这种尚未解决的状态不应被视为局限，而应被视为一个起点：由视觉涌现出的智能，能否进一步演化为通用智能？\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p6.1\"\u003e\u003c/span\u003eVLM 和 MLLM 的近期进展也是这一讨论的核心。CLIP 通过对比学习把图像和文本映射到共享空间，从而实现以自然语言为媒介的零样本识别 [\u003ca href=\"#bib.bib32\"\u003e72\u003c/a\u003e]。Flamingo [\u003ca href=\"#bib.bib33\"\u003e2\u003c/a\u003e]、BLIP/BLIP-2 [\u003ca href=\"#bib.bib34\"\u003e51\u003c/a\u003e, \u003ca href=\"#bib.bib35\"\u003e50\u003c/a\u003e]、LLaVA [\u003ca href=\"#bib.bib36\"\u003e56\u003c/a\u003e] 等 MLLM，则把视觉编码器中的图像特征作为 token 序列或中间表征连接到 LLM，使视觉问答、图像描述、对话和指令遵循成为可能。这类模型为连接视觉与语言提供了强大的框架，也构成视觉研究迈向 AGI 时代的核心方向之一。不过，由于图像特征、图文对、指令微调与推理过程高度交织，我们仍难以分离哪些能力源自视觉经验本身，哪些则来自语言模型。本文并不排斥 MLLM，而是同时保留纯视觉、视觉优先、语言中介和多模态等多种视角，从不同角度讨论视觉智能。\u003c/p\u003e\n\u003cp\u003e本文所讨论的视觉通用智能（VGI）并不是对语言的否定。它更像一项研究议程：追问视觉在与语言耦合之前，或与语言交互的过程中，究竟能够理解什么、预测什么，又能泛化到什么程度。视觉数据包含密集、可观测、可测量的结构。面对这些结构，模型应该预测接下来会看到什么、生成不可见区域、重建 3D/4D 结构，还是整合多个目标来获得通用视觉表征？我们把视觉智能研究视为一种尝试：通过多种形式的视觉学习，重新审视这些具有视觉特性的核心问题。\u003c/p\u003e\n\u003cp\u003e在 AGI 时代，计算机视觉承担着格外重要的角色。恰恰因为语言模型已经重塑 AI 的版图，计算机视觉社区现在可以重新追问一个根本问题：视觉学习能够产生怎样的通用性？视觉领域在不同模态和任务上长期积累的多样专业能力，为探索 VGI 提供了异常丰富的基础。我们正在进入一个更具创造性的阶段：社区可以主动设计那些超越基准准确率和渐进式提升的衡量目标，包括现实物理世界中的应用、对未知环境的适应，以及社会影响。\u003c/p\u003e\n\u003cp\u003eVGI——也就是从视觉模态与视觉任务中涌现出的智能——目前还不是一个已经充分确立的概念。也正因如此，把不同研究者基于各自专业与经验形成的假设汇集起来，并从计算机视觉社区的视角，以开放、乐观而大胆的方式探索从视觉通往通用智能的各种可能路径，具有很大价值。本文希望成为这类探索的一个起点，并尽可能拓展视觉研究在 AGI 时代所能承担的角色。\u003cspan id=\"footnote1\"\u003e\u003c/span\u003e11 1 本文源于 CVPR 2026 VGI Workshop 的讨论 [\u003ca href=\"#bib.bib37\"\u003e85\u003c/a\u003e]。本文所呈现的观点并非旨在给出 VGI 的单一定义，而是总结多种视角，以打开视觉研究通往通用智能的多种可能性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S1.p1.1\"\u003e\u003c/span\u003e从人工智能（AI）的早期讨论开始，包括围绕 Alan Turing 与控制论展开的思考，人们就常把智能理解为这样一种能力：从环境信号中获得表征，捕捉其潜在规律，将其泛化到未见情境，并把这些表征连接到预测或行动 [[82](#bib.bib12), [94](#bib.bib13), [49](#bib.bib10), [35](#bib.bib11)]。与此同时，并没有显而易见的理由认为智能应被还原为语言。\n\n\u003cspan id=\"S1.p2.1\"\u003e\u003c/span\u003e在地球生命史上，包括照相机式眼睛和复眼在内的高级视觉系统，可以追溯到约五亿年前的寒武纪；视觉系统的快速发展，也长期被讨论为推动生物互动发生重大变化的可能因素之一 [[70](#bib.bib14), [111](#bib.bib15)]。相比之下，从生命史尺度看，高级人类语言、文字系统以及英语这样的具体语言都只是极其晚近的现象 [[27](#bib.bib16), [15](#bib.bib17), [5](#bib.bib18)]。这种反差提示我们：视觉或许不只是一个传感器或输入模态；视觉模态本身可能构成一种用于捕捉世界结构的基础智能功能。\n\n\u003cspan id=\"S1.p3.1\"\u003e\u003c/span\u003e大语言模型（LLM）的近期进展，为思考智能如何涌现提供了重要参照。从统计语言模型、神经概率语言模型 [[7](#bib.bib19)]，到 word2vec 等分布式表征 [[66](#bib.bib21)]、序列到序列模型 [[77](#bib.bib22)]、注意力机制 [[3](#bib.bib23)]、Transformer [[84](#bib.bib24)]、BERT [[19](#bib.bib25)] 与 GPT [[73](#bib.bib26)]，语言处理逐步从人工设计特征和任务专用流水线，转向基于大规模数据与通用学习目标的表征学习。GPT-3 尤其令人瞩目：它在没有图像、音频或具身交互的情况下，仅通过在 Web 规模文本语料上扩展一个简单的自回归自监督目标（下一 token 预测），便展现出上下文学习、少样本适应等广泛能力 [[11](#bib.bib27)]。Wei 等人将这种随规模增长而出现的定性能力跃迁概括为“大语言模型的涌现能力” [[92](#bib.bib28)]。这也与 Sutton 的《苦涩的教训》（The Bitter Lesson）[[78](#bib.bib29)] 相呼应：从长期看，能够随计算、数据、学习和搜索扩展的方法，往往会胜过人工设计的知识与规则。语言模型的成功当然不能简单照搬到视觉模型，但“简单目标 + 大规模经验 + 规模扩展”能够产生出乎意料的能力，这一事实为视觉智能提供了关键线索。\n\n\u003cspan id=\"S1.p4.1\"\u003e\u003c/span\u003e计算机视觉同样经历了深刻变革。在深度神经网络时代之前，这一领域已经积累了大量基于几何、统计和优化的方法，包括边缘与角点检测、SIFT 等局部特征、立体视觉、光流、运动恢复结构以及目标检测。AlexNet 在 ILSVRC 2012 的成功构成了转折点，开启了深度学习时代，并推动视觉识别取得巨大进展 [[47](#bib.bib30), [74](#bib.bib31)]。近年来，视觉研究又从监督学习进一步扩展到自监督学习、图文对比学习、Transformer、图像与视频生成、3D/4D 重建、机器人以及具身 AI。在这一背景下，一个自然的问题是：当视觉模型不断扩大规模并接触越来越多样的视觉经验时，是否也会出现类似语言模型中的涌现能力？还是说，视觉需要一套视觉智能特有的原则？\n\n现阶段没有必要用一个答案终结这个问题。一种观点认为，把单模态、单目标的视觉学习扩展到极致或许已经足够；另一种观点则认为，整合视频、几何、时空等视觉模态，或生成、修复、重建等视觉任务，可能不可或缺。关键不是把视觉基础模型（vision foundation models，VFM）的规模扩展本身当作终点，而是要追问：在怎样的学习策略、数据结构、模型架构和评估设置下，视觉表征才能泛化到未知任务和未知环境。当前 VFM 已越来越多地用于分类、稠密预测、对应关系估计和 3D 重建，但我们仍有很大空间去厘清：某种能力究竟来自训练数据、任务设计、解码器、提示、模型规模，还是这些因素的组合。这种尚未解决的状态不应被视为局限，而应被视为一个起点：由视觉涌现出的智能，能否进一步演化为通用智能？\n\n\u003cspan id=\"S1.p6.1\"\u003e\u003c/span\u003eVLM 和 MLLM 的近期进展也是这一讨论的核心。CLIP 通过对比学习把图像和文本映射到共享空间，从而实现以自然语言为媒介的零样本识别 [[72](#bib.bib32)]。Flamingo [[2](#bib.bib33)]、BLIP/BLIP-2 [[51](#bib.bib34), [50](#bib.bib35)]、LLaVA [[56](#bib.bib36)] 等 MLLM，则把视觉编码器中的图像特征作为 token 序列或中间表征连接到 LLM，使视觉问答、图像描述、对话和指令遵循成为可能。这类模型为连接视觉与语言提供了强大的框架，也构成视觉研究迈向 AGI 时代的核心方向之一。不过，由于图像特征、图文对、指令微调与推理过程高度交织，我们仍难以分离哪些能力源自视觉经验本身，哪些则来自语言模型。本文并不排斥 MLLM，而是同时保留纯视觉、视觉优先、语言中介和多模态等多种视角，从不同角度讨论视觉智能。\n\n本文所讨论的视觉通用智能（VGI）并不是对语言的否定。它更像一项研究议程：追问视觉在与语言耦合之前，或与语言交互的过程中，究竟能够理解什么、预测什么，又能泛化到什么程度。视觉数据包含密集、可观测、可测量的结构。面对这些结构，模型应该预测接下来会看到什么、生成不可见区域、重建 3D/4D 结构，还是整合多个目标来获得通用视觉表征？我们把视觉智能研究视为一种尝试：通过多种形式的视觉学习，重新审视这些具有视觉特性的核心问题。\n\n在 AGI 时代，计算机视觉承担着格外重要的角色。恰恰因为语言模型已经重塑 AI 的版图，计算机视觉社区现在可以重新追问一个根本问题：视觉学习能够产生怎样的通用性？视觉领域在不同模态和任务上长期积累的多样专业能力，为探索 VGI 提供了异常丰富的基础。我们正在进入一个更具创造性的阶段：社区可以主动设计那些超越基准准确率和渐进式提升的衡量目标，包括现实物理世界中的应用、对未知环境的适应，以及社会影响。\n\nVGI——也就是从视觉模态与视觉任务中涌现出的智能——目前还不是一个已经充分确立的概念。也正因如此，把不同研究者基于各自专业与经验形成的假设汇集起来，并从计算机视觉社区的视角，以开放、乐观而大胆的方式探索从视觉通往通用智能的各种可能路径，具有很大价值。本文希望成为这类探索的一个起点，并尽可能拓展视觉研究在 AGI 时代所能承担的角色。\u003cspan id=\"footnote1\"\u003e\u003c/span\u003e11 1 本文源于 CVPR 2026 VGI Workshop 的讨论 [[85](#bib.bib37)]。本文所呈现的观点并非旨在给出 VGI 的单一定义，而是总结多种视角，以打开视觉研究通往通用智能的多种可能性。","sourceFormat":"markdown"},"note:sha256:cd12912c3fdbbabb665c81399af0f7e68994b529c8c28715dd554e451ddefd62":{"html":"\u003cp\u003e本文从以视觉为中心的视角重新审视智能，并探讨由视觉经验与学习涌现出的智能，是否可能提供一条通往 AGI 的路径。在语言领域，自 Transformer 架构提出以来，GPT 系列通过在 Web 规模文本上进行自回归语言建模，并配合激进的规模扩展，已经展现出向未见任务迁移的能力。这自然引出一个问题：图像、视频、几何等视觉模态中，究竟能够涌现出哪些能力与智能形态？本文汇集来自不同立场与机构的研究者，讨论视觉智能能否成为通往 AGI 的路径，并将这一方向称为视觉通用智能（visual general intelligence，VGI）。我们的目的不是给出一个单一的视觉智能定义，而是澄清在 AGI 时代，计算机视觉应当追求的原则、视觉输入模态、基准、学习范式，以及当视觉被置于核心位置时，它与语言等其他模态之间的关系。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本文从以视觉为中心的视角重新审视智能，并探讨由视觉经验与学习涌现出的智能，是否可能提供一条通往 AGI 的路径。在语言领域，自 Transformer 架构提出以来，GPT 系列通过在 Web 规模文本上进行自回归语言建模，并配合激进的规模扩展，已经展现出向未见任务迁移的能力。这自然引出一个问题：图像、视频、几何等视觉模态中，究竟能够涌现出哪些能力与智能形态？本文汇集来自不同立场与机构的研究者，讨论视觉智能能否成为通往 AGI 的路径，并将这一方向称为视觉通用智能（visual general intelligence，VGI）。我们的目的不是给出一个单一的视觉智能定义，而是澄清在 AGI 时代，计算机视觉应当追求的原则、视觉输入模态、基准、学习范式，以及当视觉被置于核心位置时，它与语言等其他模态之间的关系。","sourceFormat":"markdown"},"note:sha256:d06ba9f277bf206ad7f5fbde9c70faddc9031cbef60bffdf30e85e528b680140":{"html":"\u003cp\u003e计算机视觉长期以来通过把视觉理解拆解成识别、重建、生成、建图和行动预测等任务来取得进展。这种分解依然有用，但它也鼓励每项任务由一个单独训练的系统处理。一个通用视觉系统则需要跨越任务、时间尺度、环境、表征，甚至潜在的感觉模态运行。它需要保留并修订知识，判断哪些观察重要，并把感知连接到预测和行动。\u003c/p\u003e\n\u003cp\u003e如果视觉基础模型获得这些性质，那么识别、重建、生成、空间建图与行动，就可能只是访问和检验\u003cstrong\u003e同一个系统所持有知识\u003c/strong\u003e的不同方式。因此，从视觉基础模型走向视觉智能，将标志计算机视觉进入一个新阶段：研究重点不再只是构建越来越强的视觉功能，而是开始研究\u003cstrong\u003e智能本身如何从视觉经验中涌现。\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"计算机视觉长期以来通过把视觉理解拆解成识别、重建、生成、建图和行动预测等任务来取得进展。这种分解依然有用，但它也鼓励每项任务由一个单独训练的系统处理。一个通用视觉系统则需要跨越任务、时间尺度、环境、表征，甚至潜在的感觉模态运行。它需要保留并修订知识，判断哪些观察重要，并把感知连接到预测和行动。\n\n如果视觉基础模型获得这些性质，那么识别、重建、生成、空间建图与行动，就可能只是访问和检验**同一个系统所持有知识**的不同方式。因此，从视觉基础模型走向视觉智能，将标志计算机视觉进入一个新阶段：研究重点不再只是构建越来越强的视觉功能，而是开始研究**智能本身如何从视觉经验中涌现。**","sourceFormat":"markdown"},"note:sha256:dbf4093594e900ca0a23e0624a3ab941ff396fd4484961dbfd44214f0ae20afb":{"html":"\u003cp\u003e本节结合我们团队的研究，提出一种理解视觉智能的视角。我认为，对视觉通用智能的一项核心检验，是它能否让机器人在真实物理世界中可靠地感知、推理并行动。具身并不只是视觉智能的一个下游应用：Agent 可以主动选择视角并干预世界，从而揭示仅靠被动观察很难推断出的属性，检验自己的预测，并获得反馈来修正视觉模型。要通过这一检验，视觉系统必须能够泛化到陌生情境，把跨越很长时间跨度的观察整合成一致的场景表征，把视觉理解连接到行动，主动获取有信息价值的经验，并在部署后继续适应。这些能力共同构成一个闭环：视觉引导行动，而行动产生的结果又为改进视觉理解提供证据。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本节结合我们团队的研究，提出一种理解视觉智能的视角。我认为，对视觉通用智能的一项核心检验，是它能否让机器人在真实物理世界中可靠地感知、推理并行动。具身并不只是视觉智能的一个下游应用：Agent 可以主动选择视角并干预世界，从而揭示仅靠被动观察很难推断出的属性，检验自己的预测，并获得反馈来修正视觉模型。要通过这一检验，视觉系统必须能够泛化到陌生情境，把跨越很长时间跨度的观察整合成一致的场景表征，把视觉理解连接到行动，主动获取有信息价值的经验，并在部署后继续适应。这些能力共同构成一个闭环：视觉引导行动，而行动产生的结果又为改进视觉理解提供证据。","sourceFormat":"markdown"},"note:sha256:dc882b52cc9bdee01f8ca090f25a90900a8ac2dfa6ee88e8d661f5c6c9efac4c":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e单纯的数据规模，并不等同于视觉多样性。如果数据高度重复、范围狭窄或存在偏差，那么加入更多图像和视频并不会自然带来更广泛的视觉经验。大规模视觉数据集并不会自动变得多样。即使看起来覆盖面很广的数据集，也可能带有很强的数据集特有 signature；理解这些偏差，本身就是理解模型究竟获得了什么视觉经验的一部分 [\u003ca href=\"#bib.bib58\"\u003e59\u003c/a\u003e, \u003ca href=\"#bib.bib59\"\u003e107\u003c/a\u003e]。除了继续提升模型能力和扩大算力，我们也应更深入地理解：数据集提供了哪些视觉经验、缺失了哪些经验，以及如何筛选出覆盖更广、偏差更小、也更适合学习通用视觉抽象的数据。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px3.p2.1\"\u003e\u003c/span\u003e当前大多数系统都没有把视觉设计成一种连续、低摩擦的上下文通道。用户仍需要手动捕捉视觉信息、上传，然后解释这些信息为什么重要。一个更“视觉原生”的系统应该把这种关系反过来：把视觉上下文视为系统、用户与世界之间自然交互的一部分。随着 AI 系统变得更自主、越来越直接面向现实世界，这一点会尤其重要。机器人、实验室助手或医疗系统不可能依赖人类持续描述世界状态 [\u003ca href=\"#bib.bib60\"\u003e20\u003c/a\u003e]。它必须自己感知，决定什么重要，发现变化，并用反馈修正行动。视觉并不是在“重要性”上落后于语言；它只是今天在交互界面上的可见度落后于语言。\u003c/p\u003e\n\u003cp\u003e我希望未来的 VGI 研究能够超越静态图像或视频问答。我们不只应该问“给定一段视觉输入，模型能推断出什么”，还应问：\u003cstrong\u003e模型知不知道下一步自己需要看什么？\u003c/strong\u003e 我们也应该评估自适应视觉抽象能力，也就是让无关区域保持粗粒度，同时对任务相关细节进行精细检查的能力。对我而言，最关键的检验很简单：一个视觉系统能不能学会\u003cstrong\u003e什么时候看、看哪里，以及需要看多细？\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS9.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e单纯的数据规模，并不等同于视觉多样性。如果数据高度重复、范围狭窄或存在偏差，那么加入更多图像和视频并不会自然带来更广泛的视觉经验。大规模视觉数据集并不会自动变得多样。即使看起来覆盖面很广的数据集，也可能带有很强的数据集特有 signature；理解这些偏差，本身就是理解模型究竟获得了什么视觉经验的一部分 [[59](#bib.bib58), [107](#bib.bib59)]。除了继续提升模型能力和扩大算力，我们也应更深入地理解：数据集提供了哪些视觉经验、缺失了哪些经验，以及如何筛选出覆盖更广、偏差更小、也更适合学习通用视觉抽象的数据。\n\n\u003cspan id=\"S2.SS9.SSS0.Px3.p2.1\"\u003e\u003c/span\u003e当前大多数系统都没有把视觉设计成一种连续、低摩擦的上下文通道。用户仍需要手动捕捉视觉信息、上传，然后解释这些信息为什么重要。一个更“视觉原生”的系统应该把这种关系反过来：把视觉上下文视为系统、用户与世界之间自然交互的一部分。随着 AI 系统变得更自主、越来越直接面向现实世界，这一点会尤其重要。机器人、实验室助手或医疗系统不可能依赖人类持续描述世界状态 [[20](#bib.bib60)]。它必须自己感知，决定什么重要，发现变化，并用反馈修正行动。视觉并不是在“重要性”上落后于语言；它只是今天在交互界面上的可见度落后于语言。\n\n我希望未来的 VGI 研究能够超越静态图像或视频问答。我们不只应该问“给定一段视觉输入，模型能推断出什么”，还应问：**模型知不知道下一步自己需要看什么？** 我们也应该评估自适应视觉抽象能力，也就是让无关区域保持粗粒度，同时对任务相关细节进行精细检查的能力。对我而言，最关键的检验很简单：一个视觉系统能不能学会**什么时候看、看哪里，以及需要看多细？**","sourceFormat":"markdown"},"note:sha256:e06a111ae20ca9c2e707f6b3640dcde51f7dd730bef187b2c58d0b48bad2a286":{"html":"\u003cp\u003e如果处理器与内存真的越来越细粒度，每个 tile 都带有本地内存，而 tile 之间只通过稀疏连接通信，那么这里的“苦涩的教训”就是：\u003cstrong\u003e最适合映射到这种硬件设计上的算法，会表现最好。\u003c/strong\u003e FutureMapping 系列论文提出了一条前进路径：找到空间 AI 算法的数据结构与处理结构中的“图”，再尽可能把这些图与硬件结构对齐——本质上，就像把图的拓扑在地理意义上铺到芯片上。从算法角度，我们需要关注能够在一般性的、有环图上通过消息传递完成推理与学习的方法。belief propagation 是一个很有力的候选，因为即使通信是异步的、甚至存在丢失，它依然具有很强的分布式收敛性质。\u003c/p\u003e\n\u003cp\u003e机器人周围场景的表征本身也拥有内在图结构，许多 SLAM 方法已经揭示了这一点。这些表征必须被设计成能够高效连接到主实时处理循环：这些循环负责接收传感器的实时数据，并向执行器输出控制信号。此外，高度专用的处理器还会部署在非常靠近传感器和执行器的位置，甚至直接位于其中；这样，各模块之间传递的就可以是“可直接采取行动的信息”这种抽象层内容，而不是视频这样的大规模原始数据流。\u003c/p\u003e\n\u003cp\u003e从很多方面看，我们可以推测：对高效、模块化实现的追求，会推动空间 AI 系统越来越像生物大脑——它以极高效率实现极强能力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"如果处理器与内存真的越来越细粒度，每个 tile 都带有本地内存，而 tile 之间只通过稀疏连接通信，那么这里的“苦涩的教训”就是：**最适合映射到这种硬件设计上的算法，会表现最好。** FutureMapping 系列论文提出了一条前进路径：找到空间 AI 算法的数据结构与处理结构中的“图”，再尽可能把这些图与硬件结构对齐——本质上，就像把图的拓扑在地理意义上铺到芯片上。从算法角度，我们需要关注能够在一般性的、有环图上通过消息传递完成推理与学习的方法。belief propagation 是一个很有力的候选，因为即使通信是异步的、甚至存在丢失，它依然具有很强的分布式收敛性质。\n\n机器人周围场景的表征本身也拥有内在图结构，许多 SLAM 方法已经揭示了这一点。这些表征必须被设计成能够高效连接到主实时处理循环：这些循环负责接收传感器的实时数据，并向执行器输出控制信号。此外，高度专用的处理器还会部署在非常靠近传感器和执行器的位置，甚至直接位于其中；这样，各模块之间传递的就可以是“可直接采取行动的信息”这种抽象层内容，而不是视频这样的大规模原始数据流。\n\n从很多方面看，我们可以推测：对高效、模块化实现的追求，会推动空间 AI 系统越来越像生物大脑——它以极高效率实现极强能力。","sourceFormat":"markdown"},"note:sha256:e4e2de82e2be0670ef5566ebb5e5c9167b4819bbcab55e679349f78af88d5570":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e这种推断不能在每一帧上都从零开始。机器人如果要在数天甚至更长时间里自主工作，就必须把持续不断、却始终不完整的观察流整合成一个持久且内部一致的环境表征。这个表征必须能够跨越视角变化和遮挡把观察关联起来，保持实体的身份与关系，并随着物理世界变化而更新。我们团队研究过以物体为中心的表征，用来随时间维持单个实体 [\u003ca href=\"#bib.bib76\"\u003e23\u003c/a\u003e, \u003ca href=\"#bib.bib77\"\u003e28\u003c/a\u003e]；也研究过场景级 3D 记忆，把整个环境中的观察聚合起来 [\u003ca href=\"#bib.bib78\"\u003e103\u003c/a\u003e]。一个关键方向，是发展动态、分层的表征，把全局场景结构连接到物体、部件及其关系，同时追踪每一个层级随时间如何演化。这些表征应当支持增量更新，并能根据任务需要，在适当抽象层级上进行检索。因此，目标并不只是建立一张持久地图，而是建立一种\u003cstrong\u003e可修订的场景表征\u003c/strong\u003e，让它同时支持预测、行动以及有针对性的信息收集。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS7.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e这种推断不能在每一帧上都从零开始。机器人如果要在数天甚至更长时间里自主工作，就必须把持续不断、却始终不完整的观察流整合成一个持久且内部一致的环境表征。这个表征必须能够跨越视角变化和遮挡把观察关联起来，保持实体的身份与关系，并随着物理世界变化而更新。我们团队研究过以物体为中心的表征，用来随时间维持单个实体 [[23](#bib.bib76), [28](#bib.bib77)]；也研究过场景级 3D 记忆，把整个环境中的观察聚合起来 [[103](#bib.bib78)]。一个关键方向，是发展动态、分层的表征，把全局场景结构连接到物体、部件及其关系，同时追踪每一个层级随时间如何演化。这些表征应当支持增量更新，并能根据任务需要，在适当抽象层级上进行检索。因此，目标并不只是建立一张持久地图，而是建立一种**可修订的场景表征**，让它同时支持预测、行动以及有针对性的信息收集。","sourceFormat":"markdown"},"note:sha256:ebb97b06dd2d044ce4f6dba7f8174c7d9fe633ca7bdac99d11b457099aac2e83":{"html":"\u003cp\u003e行动不仅是视觉智能的输出，也是一种获取视觉证据的方式。机器人可以移动到更有信息价值的视角，并与物体发生物理交互，从而消解感知歧义，揭示那些被动观察可能无法确定的属性、可供性和动力学特征。改变视角可以解决遮挡问题；推动、抬起或打开一个物体，则能够为它的关节结构、稳定性和物理行为提供证据。这类交互也会暴露机器人当前视觉模型的局限。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px4.p2.1\"\u003e\u003c/span\u003e来自生物视觉的经典证据，也支持把感知与自主产生的行动耦合起来的重要性。在 Held 和 Hein 的实验中，成对的小猫获得几乎一致的视觉输入，但只有那些能够通过自身运动控制视觉输入的小猫，最终发展出了正常的视觉引导行为 [\u003ca href=\"#bib.bib70\"\u003e39\u003c/a\u003e]。我们团队早期的工作曾探索主动视觉学习的初步形式：训练一个由好奇心驱动的策略，使它主动寻找环境中那些在已学习视觉表征模型下具有最大 surprisal 的区域 [\u003ca href=\"#bib.bib63\"\u003e21\u003c/a\u003e]。这种定向交互，使“行动”本身成为选择视觉系统将从哪些经验中学习的机制。\u003c/p\u003e\n","kind":"html","rawMarkdown":"行动不仅是视觉智能的输出，也是一种获取视觉证据的方式。机器人可以移动到更有信息价值的视角，并与物体发生物理交互，从而消解感知歧义，揭示那些被动观察可能无法确定的属性、可供性和动力学特征。改变视角可以解决遮挡问题；推动、抬起或打开一个物体，则能够为它的关节结构、稳定性和物理行为提供证据。这类交互也会暴露机器人当前视觉模型的局限。\n\n\u003cspan id=\"S2.SS7.SSS0.Px4.p2.1\"\u003e\u003c/span\u003e来自生物视觉的经典证据，也支持把感知与自主产生的行动耦合起来的重要性。在 Held 和 Hein 的实验中，成对的小猫获得几乎一致的视觉输入，但只有那些能够通过自身运动控制视觉输入的小猫，最终发展出了正常的视觉引导行为 [[39](#bib.bib70)]。我们团队早期的工作曾探索主动视觉学习的初步形式：训练一个由好奇心驱动的策略，使它主动寻找环境中那些在已学习视觉表征模型下具有最大 surprisal 的区域 [[21](#bib.bib63)]。这种定向交互，使“行动”本身成为选择视觉系统将从哪些经验中学习的机制。","sourceFormat":"markdown"},"note:sha256:ecdb6083218431464749a256cbeac5f02d3bc4868164520e8df32c461dd223f8":{"html":"\u003cp\u003e本文把视觉通用智能作为一项研究议程，围绕两个彼此相关的问题展开：智能如何从视觉经验中涌现，以及这种视觉智能如何可能提供一条通往通用智能的路径。本文汇集的观点并不支持某种单一 VGI 定义、架构、学习目标或实现路线。与其强行把这些立场压缩成一个统一预测，本文呈现的是多种合理且彼此互补的结论。视觉智能可能通过大规模生成式学习、预测、重建、持久空间记忆、持续学习、具身、主动感知、多模态经验，或这些机制中尚未被充分探索的组合方式涌现。\u003c/p\u003e\n\u003cp\u003e这种多元性本身，就是本文的核心结论之一。我们不应过早把 VGI 定义成某一种模型或某一种能力；它也不应被还原为更强的图像分类器、视频生成器、世界模型，或挂接到语言模型上的视觉编码器。本文提出的不同立场，更倾向于把视觉智能描述为一种更宽广的能力：从视觉经验中获得知识，发现并维持世界结构，想象并评估可能的替代方案，适应新的观察，并把视觉知识用于预测、发现与行动。\u003c/p\u003e\n\u003cp\u003e现有系统已经展示出视觉智能中的一些重要组成部分，但还没有把它们整合为一个真正通用、能够持续适应的视觉系统。不过，当前模型已经提供了部分且越来越具有启发性的证据。生成式视频模型表现出出乎意料的跨任务能力；重建模型能够恢复越来越丰富的几何与物理结构；空间系统可以随时间维持持久表征；创造性模型能够构造多个合理替代方案；具身 Agent 则通过交互改善自身感知与行为。这些能力仍然彼此碎片化、计算成本很高、时间跨度有限，或高度依赖精心选择的数据与训练条件。但如果把它们放在一起看，它们也许已经构成从“视觉功能”走向“视觉智能”这一更广泛转变中的早期坐标。\u003c/p\u003e\n\u003cp\u003e因此，现在就问“VGI 是否已经成为通往通用智能的路径”，也许还为时过早。更近的一个里程碑，是先确定：\u003cstrong\u003e智能本身能否首先被观察到从视觉经验中涌现。\u003c/strong\u003e 这种转变的证据不应只表现为一组固定视觉任务上的性能提升，而应该包括可迁移能力、持久且可修订的世界知识、创造性与反事实推理、主动信息获取、持续适应、空间与物理一致性，以及在陌生情境中的可靠行动。\u003c/p\u003e\n\u003cp\u003e计算机视觉也许正进入一个新阶段，其核心研究对象将从单个视觉功能，扩展到视觉智能本身的涌现。本文的目的不是宣布哪条路线最终会胜出，而是让各路线背后的假设、相互关系与开放问题变得可见。决定性的原则可能来自本文讨论的某个方向，来自多个方向的汇合，也可能来自一种我们尚未想象出来的方法。因此，留给整个领域的问题已经不只是“如何构建能力更强的视觉模型”，而是：\u003cstrong\u003e什么样的证据，才足以让我们相信智能已经开始从视觉中产生？而这种智能最终又将如何参与通用智能的形成？\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"本文把视觉通用智能作为一项研究议程，围绕两个彼此相关的问题展开：智能如何从视觉经验中涌现，以及这种视觉智能如何可能提供一条通往通用智能的路径。本文汇集的观点并不支持某种单一 VGI 定义、架构、学习目标或实现路线。与其强行把这些立场压缩成一个统一预测，本文呈现的是多种合理且彼此互补的结论。视觉智能可能通过大规模生成式学习、预测、重建、持久空间记忆、持续学习、具身、主动感知、多模态经验，或这些机制中尚未被充分探索的组合方式涌现。\n\n这种多元性本身，就是本文的核心结论之一。我们不应过早把 VGI 定义成某一种模型或某一种能力；它也不应被还原为更强的图像分类器、视频生成器、世界模型，或挂接到语言模型上的视觉编码器。本文提出的不同立场，更倾向于把视觉智能描述为一种更宽广的能力：从视觉经验中获得知识，发现并维持世界结构，想象并评估可能的替代方案，适应新的观察，并把视觉知识用于预测、发现与行动。\n\n现有系统已经展示出视觉智能中的一些重要组成部分，但还没有把它们整合为一个真正通用、能够持续适应的视觉系统。不过，当前模型已经提供了部分且越来越具有启发性的证据。生成式视频模型表现出出乎意料的跨任务能力；重建模型能够恢复越来越丰富的几何与物理结构；空间系统可以随时间维持持久表征；创造性模型能够构造多个合理替代方案；具身 Agent 则通过交互改善自身感知与行为。这些能力仍然彼此碎片化、计算成本很高、时间跨度有限，或高度依赖精心选择的数据与训练条件。但如果把它们放在一起看，它们也许已经构成从“视觉功能”走向“视觉智能”这一更广泛转变中的早期坐标。\n\n因此，现在就问“VGI 是否已经成为通往通用智能的路径”，也许还为时过早。更近的一个里程碑，是先确定：**智能本身能否首先被观察到从视觉经验中涌现。** 这种转变的证据不应只表现为一组固定视觉任务上的性能提升，而应该包括可迁移能力、持久且可修订的世界知识、创造性与反事实推理、主动信息获取、持续适应、空间与物理一致性，以及在陌生情境中的可靠行动。\n\n计算机视觉也许正进入一个新阶段，其核心研究对象将从单个视觉功能，扩展到视觉智能本身的涌现。本文的目的不是宣布哪条路线最终会胜出，而是让各路线背后的假设、相互关系与开放问题变得可见。决定性的原则可能来自本文讨论的某个方向，来自多个方向的汇合，也可能来自一种我们尚未想象出来的方法。因此，留给整个领域的问题已经不只是“如何构建能力更强的视觉模型”，而是：**什么样的证据，才足以让我们相信智能已经开始从视觉中产生？而这种智能最终又将如何参与通用智能的形成？**","sourceFormat":"markdown"},"note:sha256:f48a295447662eb906e65362bd0f9053c9b8b18ffb95c311d157046a7d782b48":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eRich Sutton 的“苦涩的教训” [\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e] 有力地指出，过去几十年推动 AI 进步的最大单一因素就是规模。因此，LLM 迄今持续受益于更大的模型，以及规模更大、更多样的数据集，也就顺理成章。同样，没有理由认为视频模型不会在架构规模和数据规模两方面从扩展中获益。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS1.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eRich Sutton 的“苦涩的教训” [[78](#bib.bib29)] 有力地指出，过去几十年推动 AI 进步的最大单一因素就是规模。因此，LLM 迄今持续受益于更大的模型，以及规模更大、更多样的数据集，也就顺理成章。同样，没有理由认为视频模型不会在架构规模和数据规模两方面从扩展中获益。","sourceFormat":"markdown"},"note:sha256:fbfbb9d08dc12c716395ed1f72546d4ab690b6c5baa620386934bf3a8b74587d":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e过去几年的进展表明，要恢复这类结构，规模扩展可能是必需的，因为视觉世界实在过于多样，不可能靠手工指定的模型全部覆盖。更有意思的问题在于：我们把这些规模花在了哪里。目前很大一部分资源都投入到预测像素的生成模型上，而对它们的判断又主要依据输出看起来是否可信。但这个评价标准并不能告诉我们：形状、材质、关节结构或物理属性是否真的被模型表示出来了。一个视频模型能逼真地渲染掉落的杯子，说明它知道“掉落的杯子看起来是什么样”；却不能说明质量、接触或摩擦是否真的在模型内部以某种形式存在。当评估只奖励感知质量时，这个差距很难被发现；而一旦我们希望干预、编辑或行动，它就会立刻显现 [\u003ca href=\"#bib.bib93\"\u003e25\u003c/a\u003e, \u003ca href=\"#bib.bib94\"\u003e87\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px2.p2.1\"\u003e\u003c/span\u003e只靠像素预测，在数据和算力足够时，这些量最终是否会自行涌现，目前仍是开放问题。我们自己的工作选择了另一条路线：把结构本身作为明确的学习目标，而不是把它当作其他目标的副产物。物理世界具有组合性——物体由部件组成，场景由物体组成，运动由关节旋转组成——因此，如果一个系统能够恢复这些基本组成部分，它就应该能在新的组合中复用它们；学习第一百个物体的成本，也应低于第一个物体。只对外观建模则没有那么强的复用性，因为每一种新配置都可能需要被单独捕捉。针对这条结构路线的标准反对意见是：结构化表征不具备规模扩展性，主要因为过去太多结构必须由人工放进去，而手工构建的组件并不会随着数据和算力增长而自然变强 [\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e]。我们的看法是，这更可能是\u003cstrong\u003e结构如何被获得\u003c/strong\u003e的问题，而不是结构本身的问题；于是关键就转向：结构应该如何表示，以及结构究竟从哪里来。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS8.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e过去几年的进展表明，要恢复这类结构，规模扩展可能是必需的，因为视觉世界实在过于多样，不可能靠手工指定的模型全部覆盖。更有意思的问题在于：我们把这些规模花在了哪里。目前很大一部分资源都投入到预测像素的生成模型上，而对它们的判断又主要依据输出看起来是否可信。但这个评价标准并不能告诉我们：形状、材质、关节结构或物理属性是否真的被模型表示出来了。一个视频模型能逼真地渲染掉落的杯子，说明它知道“掉落的杯子看起来是什么样”；却不能说明质量、接触或摩擦是否真的在模型内部以某种形式存在。当评估只奖励感知质量时，这个差距很难被发现；而一旦我们希望干预、编辑或行动，它就会立刻显现 [[25](#bib.bib93), [87](#bib.bib94)]。\n\n\u003cspan id=\"S2.SS8.SSS0.Px2.p2.1\"\u003e\u003c/span\u003e只靠像素预测，在数据和算力足够时，这些量最终是否会自行涌现，目前仍是开放问题。我们自己的工作选择了另一条路线：把结构本身作为明确的学习目标，而不是把它当作其他目标的副产物。物理世界具有组合性——物体由部件组成，场景由物体组成，运动由关节旋转组成——因此，如果一个系统能够恢复这些基本组成部分，它就应该能在新的组合中复用它们；学习第一百个物体的成本，也应低于第一个物体。只对外观建模则没有那么强的复用性，因为每一种新配置都可能需要被单独捕捉。针对这条结构路线的标准反对意见是：结构化表征不具备规模扩展性，主要因为过去太多结构必须由人工放进去，而手工构建的组件并不会随着数据和算力增长而自然变强 [[78](#bib.bib29)]。我们的看法是，这更可能是**结构如何被获得**的问题，而不是结构本身的问题；于是关键就转向：结构应该如何表示，以及结构究竟从哪里来。","sourceFormat":"markdown"}},"sourceRevision":"sha256:0bfb08d31cba2771dbf697282c3360b4dbe08613beb90cf1a5d4f62ba9b591a6"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=e}}function i(e,t){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${e}": ${t}`)}function r(e){const t=String(e||"").normalize("NFC").trim().replace(/\\/g,"/");t||i(t,"empty"),t.includes("\0")&&i(t,"nul_byte"),t.startsWith("/")&&i(t,"absolute"),/^[A-Za-z]:/.test(t)&&i(t,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*
