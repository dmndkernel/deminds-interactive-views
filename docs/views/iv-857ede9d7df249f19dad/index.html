</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-05T15:25:54.236Z","language":"zh-CN","name":"DeMinds","version":"1.0.33"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"视觉通用智能：白皮书","outlineVersion":1},"sourceRevision":"sha256:0bfb08d31cba2771dbf697282c3360b4dbe08613beb90cf1a5d4f62ba9b591a6","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Visual General Intelligence  A White Paper.md","sourceUrl":"https://arxiv.org/html/2608.25924","title":"视觉通用智能：白皮书"},"files":[{"byteLength":119851,"content":"# 视觉通用智能：白皮书\n\n\u003e 作者：Hirokatsu Kataoka, Yoshihiro Fukuhara, Yonglong Tian, Shangzhe Wu, Oishi Deb, Ryousuke Yamada, Christian Rupprecht, Jianyuan Wang, Kohsuke Ide, Koichi Namekata, Xianzheng Ma, Yiming Chen, Robert Geirhos, Aditi Raghunathan, Yuki M. Asano, Deva Ramanan, David Fouhey, Andrew J. Davison, Yilun Du, Jiajun Wu, Zhuang Liu\n\u003e 机构：National Institute of Advanced Industrial Science and Technology \\(AIST\\) · Visual Geometry Group \\(VGG\\), University of Oxford · CADDi · OpenAI · University of Cambridge · University of Technology Nuremberg · University of Tsukuba · Google DeepMind · Carnegie Mellon University · New York University · Imperial College London · Harvard University · Stanford University · Princeton University\n\u003e [arXiv:2608.25924v1](https://arxiv.org/html/2608.25924) · cs.CV · 2026-08-26\n\n## 摘要\n\n本文从以视觉为中心的视角重新审视智能，并探讨由视觉经验与学习涌现出的智能，是否可能提供一条通往 AGI 的路径。在语言领域，自 Transformer 架构提出以来，GPT 系列通过在 Web 规模文本上进行自回归语言建模，并配合激进的规模扩展，已经展现出向未见任务迁移的能力。这自然引出一个问题：图像、视频、几何等视觉模态中，究竟能够涌现出哪些能力与智能形态？本文汇集来自不同立场与机构的研究者，讨论视觉智能能否成为通往 AGI 的路径，并将这一方向称为视觉通用智能（visual general intelligence，VGI）。我们的目的不是给出一个单一的视觉智能定义，而是澄清在 AGI 时代，计算机视觉应当追求的原则、视觉输入模态、基准、学习范式，以及当视觉被置于核心位置时，它与语言等其他模态之间的关系。\n\n\u003cspan id=\"S1\"\u003e\u003c/span\u003e\n\n## 1 引言\n\n\u003cspan id=\"S1.p1.1\"\u003e\u003c/span\u003e从人工智能（AI）的早期讨论开始，包括围绕 Alan Turing 与控制论展开的思考，人们就常把智能理解为这样一种能力：从环境信号中获得表征，捕捉其潜在规律，将其泛化到未见情境，并把这些表征连接到预测或行动 [[82](#bib.bib12), [94](#bib.bib13), [49](#bib.bib10), [35](#bib.bib11)]。与此同时，并没有显而易见的理由认为智能应被还原为语言。\n\n\u003cspan id=\"S1.p2.1\"\u003e\u003c/span\u003e在地球生命史上，包括照相机式眼睛和复眼在内的高级视觉系统，可以追溯到约五亿年前的寒武纪；视觉系统的快速发展，也长期被讨论为推动生物互动发生重大变化的可能因素之一 [[70](#bib.bib14), [111](#bib.bib15)]。相比之下，从生命史尺度看，高级人类语言、文字系统以及英语这样的具体语言都只是极其晚近的现象 [[27](#bib.bib16), [15](#bib.bib17), [5](#bib.bib18)]。这种反差提示我们：视觉或许不只是一个传感器或输入模态；视觉模态本身可能构成一种用于捕捉世界结构的基础智能功能。\n\n\u003cspan id=\"S1.p3.1\"\u003e\u003c/span\u003e大语言模型（LLM）的近期进展，为思考智能如何涌现提供了重要参照。从统计语言模型、神经概率语言模型 [[7](#bib.bib19)]，到 word2vec 等分布式表征 [[66](#bib.bib21)]、序列到序列模型 [[77](#bib.bib22)]、注意力机制 [[3](#bib.bib23)]、Transformer [[84](#bib.bib24)]、BERT [[19](#bib.bib25)] 与 GPT [[73](#bib.bib26)]，语言处理逐步从人工设计特征和任务专用流水线，转向基于大规模数据与通用学习目标的表征学习。GPT-3 尤其令人瞩目：它在没有图像、音频或具身交互的情况下，仅通过在 Web 规模文本语料上扩展一个简单的自回归自监督目标（下一 token 预测），便展现出上下文学习、少样本适应等广泛能力 [[11](#bib.bib27)]。Wei 等人将这种随规模增长而出现的定性能力跃迁概括为“大语言模型的涌现能力” [[92](#bib.bib28)]。这也与 Sutton 的《苦涩的教训》（The Bitter Lesson）[[78](#bib.bib29)] 相呼应：从长期看，能够随计算、数据、学习和搜索扩展的方法，往往会胜过人工设计的知识与规则。语言模型的成功当然不能简单照搬到视觉模型，但“简单目标 + 大规模经验 + 规模扩展”能够产生出乎意料的能力，这一事实为视觉智能提供了关键线索。\n\n\u003cspan id=\"S1.p4.1\"\u003e\u003c/span\u003e计算机视觉同样经历了深刻变革。在深度神经网络时代之前，这一领域已经积累了大量基于几何、统计和优化的方法，包括边缘与角点检测、SIFT 等局部特征、立体视觉、光流、运动恢复结构以及目标检测。AlexNet 在 ILSVRC 2012 的成功构成了转折点，开启了深度学习时代，并推动视觉识别取得巨大进展 [[47](#bib.bib30), [74](#bib.bib31)]。近年来，视觉研究又从监督学习进一步扩展到自监督学习、图文对比学习、Transformer、图像与视频生成、3D/4D 重建、机器人以及具身 AI。在这一背景下，一个自然的问题是：当视觉模型不断扩大规模并接触越来越多样的视觉经验时，是否也会出现类似语言模型中的涌现能力？还是说，视觉需要一套视觉智能特有的原则？\n\n现阶段没有必要用一个答案终结这个问题。一种观点认为，把单模态、单目标的视觉学习扩展到极致或许已经足够；另一种观点则认为，整合视频、几何、时空等视觉模态，或生成、修复、重建等视觉任务，可能不可或缺。关键不是把视觉基础模型（vision foundation models，VFM）的规模扩展本身当作终点，而是要追问：在怎样的学习策略、数据结构、模型架构和评估设置下，视觉表征才能泛化到未知任务和未知环境。当前 VFM 已越来越多地用于分类、稠密预测、对应关系估计和 3D 重建，但我们仍有很大空间去厘清：某种能力究竟来自训练数据、任务设计、解码器、提示、模型规模，还是这些因素的组合。这种尚未解决的状态不应被视为局限，而应被视为一个起点：由视觉涌现出的智能，能否进一步演化为通用智能？\n\n\u003cspan id=\"S1.p6.1\"\u003e\u003c/span\u003eVLM 和 MLLM 的近期进展也是这一讨论的核心。CLIP 通过对比学习把图像和文本映射到共享空间，从而实现以自然语言为媒介的零样本识别 [[72](#bib.bib32)]。Flamingo [[2](#bib.bib33)]、BLIP/BLIP-2 [[51](#bib.bib34), [50](#bib.bib35)]、LLaVA [[56](#bib.bib36)] 等 MLLM，则把视觉编码器中的图像特征作为 token 序列或中间表征连接到 LLM，使视觉问答、图像描述、对话和指令遵循成为可能。这类模型为连接视觉与语言提供了强大的框架，也构成视觉研究迈向 AGI 时代的核心方向之一。不过，由于图像特征、图文对、指令微调与推理过程高度交织，我们仍难以分离哪些能力源自视觉经验本身，哪些则来自语言模型。本文并不排斥 MLLM，而是同时保留纯视觉、视觉优先、语言中介和多模态等多种视角，从不同角度讨论视觉智能。\n\n本文所讨论的视觉通用智能（VGI）并不是对语言的否定。它更像一项研究议程：追问视觉在与语言耦合之前，或与语言交互的过程中，究竟能够理解什么、预测什么，又能泛化到什么程度。视觉数据包含密集、可观测、可测量的结构。面对这些结构，模型应该预测接下来会看到什么、生成不可见区域、重建 3D/4D 结构，还是整合多个目标来获得通用视觉表征？我们把视觉智能研究视为一种尝试：通过多种形式的视觉学习，重新审视这些具有视觉特性的核心问题。\n\n在 AGI 时代，计算机视觉承担着格外重要的角色。恰恰因为语言模型已经重塑 AI 的版图，计算机视觉社区现在可以重新追问一个根本问题：视觉学习能够产生怎样的通用性？视觉领域在不同模态和任务上长期积累的多样专业能力，为探索 VGI 提供了异常丰富的基础。我们正在进入一个更具创造性的阶段：社区可以主动设计那些超越基准准确率和渐进式提升的衡量目标，包括现实物理世界中的应用、对未知环境的适应，以及社会影响。\n\nVGI——也就是从视觉模态与视觉任务中涌现出的智能——目前还不是一个已经充分确立的概念。也正因如此，把不同研究者基于各自专业与经验形成的假设汇集起来，并从计算机视觉社区的视角，以开放、乐观而大胆的方式探索从视觉通往通用智能的各种可能路径，具有很大价值。本文希望成为这类探索的一个起点，并尽可能拓展视觉研究在 AGI 时代所能承担的角色。\u003cspan id=\"footnote1\"\u003e\u003c/span\u003e11 1 本文源于 CVPR 2026 VGI Workshop 的讨论 [[85](#bib.bib37)]。本文所呈现的观点并非旨在给出 VGI 的单一定义，而是总结多种视角，以打开视觉研究通往通用智能的多种可能性。\n\n\u003cspan id=\"S2\"\u003e\u003c/span\u003e\n\n## 2 视觉通用智能的多种视角\n\n从视觉智能走向通用智能的路径，不太可能由某一个定义、模型或基准完整刻画。本节汇集不同研究视角，帮助厘清计算机视觉社区可以继续探索的一系列开放问题。\n\n\u003cspan id=\"S2.SS1\"\u003e\u003c/span\u003e\n\n### 2.1 视频模型就是视觉基础模型（Robert Geirhos）\n\n\u003cspan id=\"S2.SS1.p1.1\"\u003e\u003c/span\u003e在我的研究语境中，视觉智能可以被理解为：无需针对每一个新任务进行显式训练，就能解决从感知到推理的各种视觉任务。就像大语言模型如今已经能够处理大多数语言任务一样，我相信机器视觉终于也到了从任务专用模型转向通用模型的时刻。迄今为止，计算机视觉社区已经构建了许多出色的单项模型和任务专用模型 [[101](#bib.bib51), [46](#bib.bib52), e.g.]，但这个领域还没有像 LLM 统一了自然语言处理大部分研究那样，被某个共同框架真正统一起来。那么，我们应该怎样构建统一的视觉基础模型？开启语言智能的那些基础要素——在 Web 规模数据上训练大型生成模型——可以直接应用到今天的生成式视频模型上。我确信，把这些原则本身（大规模训练 + 生成目标）迁移到视频模型，是解决视觉智能问题的关键。\n\n\u003cspan id=\"S2.SS1.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### 为什么要在 *Web 规模数据* 上训练 *大模型*？\n\n\u003cspan id=\"S2.SS1.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eRich Sutton 的“苦涩的教训” [[78](#bib.bib29)] 有力地指出，过去几十年推动 AI 进步的最大单一因素就是规模。因此，LLM 迄今持续受益于更大的模型，以及规模更大、更多样的数据集，也就顺理成章。同样，没有理由认为视频模型不会在架构规模和数据规模两方面从扩展中获益。\n\n\u003cspan id=\"S2.SS1.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### 为什么是 *生成式* 模型？\n\n\u003cspan id=\"S2.SS1.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e机器学习模型很喜欢学习捷径——也就是找到完成某个目标最容易的办法，哪怕只是表面上完成了任务 [[30](#bib.bib38)]。因此，我们需要尽可能把训练目标设计得足够困难。比如，在 ImageNet 上训练分类器就太容易了；模型完全可能把纹理 [[31](#bib.bib40)] 或图像背景 [[6](#bib.bib41)] 当作预测特征：一检测到灰色、类似皮革的纹理就预测“elephant”，一看到草地就预测“cow”。但如果在视觉数据上训练一个 *生成式* 模型，模型面对的是一个困难得多的任务。它不能只生成草地却把牛省掉，因为生成目标迫使模型把所有东西都做对：物体、背景、纹理、形状、光照和阴影——否则就会受到训练目标的惩罚。正是这种直觉让我相信，生成模型能够解决视觉智能问题：它的训练任务足够困难、足够有意义，以至于模型不得不通过预测学到大量关于世界的知识。\n\n\u003cspan id=\"S2.SS1.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### 最后，为什么是 *视频* 模型？\n\n\u003cspan id=\"S2.SS1.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e把视频模型视为视觉基础模型，既有原则层面的理由，也有实践层面的理由。原则上的原因在于，视频生成是许多视觉任务中最具一般性的框架，静态图像可以被视为其中的一个特例 [[102](#bib.bib50), e.g.]。实践上的原因则是，过去大约两年里，视频模型终于进入舞台中央，能力迅速提升，目前的重要进展往往以月、甚至以天为单位发生。事实上，它们已经足以充当视觉基础模型的“1.0 版本”。在我们近期的工作 [[93](#bib.bib39)] 中，我们证明了 Veo 3 这样的生成式视频模型，在视觉领域已经展现出与早期语言基础模型类似的广泛涌现能力。无需任何任务专用训练，模型仅通过图像到视频生成就能执行一系列视觉任务：边缘检测、目标分割、关键点定位、超分辨率、图像编辑、风格迁移，甚至包括迷宫求解、图遍历等早期形式的视觉推理。Veo 3 原本是一个面向娱乐用途训练的视频模型，却恰好成为了视觉基础模型。后续研究也在其他模型——包括开源模型——上验证并扩展了这些发现 [[86](#bib.bib45), [57](#bib.bib49), [69](#bib.bib48), [45](#bib.bib47), [115](#bib.bib46), [110](#bib.bib42), [37](#bib.bib44), [80](#bib.bib43)]。就像语言基础模型从 GPT-2 快速发展到 GPT-3，最终走到 ChatGPT 和今天的现代 LLM 一样，只要我们开始明确地朝这个未来建设，视频模型也很可能迅速演进成能力完整的视觉基础模型。\n\n基于这些理由，我认为，通过把视频模型发展为视觉基础模型，视觉通用智能是可以实现的；更令人期待的是，这有可能统一今天仍十分碎片化、还处于“每个任务都需要自己的模型”状态下的大量计算机视觉研究。\n\n\u003cspan id=\"S2.SS2\"\u003e\u003c/span\u003e\n\n### 2.2 将创造力作为视觉通用智能的检验（Aditi Raghunathan）\n\n智能并不只存在于拥有唯一正确答案的任务中。在开放式情境里，成功还取决于能否以有创造力的方式满足要求，并建立此前没有被明确遇见过的新联系。对于视觉智能而言，这类任务可以包括：在功能约束下设计物体、为机器人提出彼此不同的计划、构建科学示意图，或设想一个物理场景可能如何以多种方式演化。这些任务中的创造力，要求输出不仅自身连贯，还要在重复生成之间具有多样性，并相对于训练经验保持原创性。随着视觉模型越来越多地被用于科学发现、设计、新型训练数据生成以及测试时探索，这些能力会变得愈发重要。\n\n很多创造性任务都需要一次“思维跃迁”：在可观察输出真正生成之前，先通过一种隐式的搜索与规划过程，协调多个相互依赖的决策。在视觉任务中，这个隐藏计划可能规定场景布局、3D 结构、一组物体关系、某种物理机制、相机轨迹，或一连串动作。它在最终图像或视频中可能只能被间接观察到。因此，要生成这样的结果，模型必须把握整个生成过程中的高阶结构，而不是把一个个局部上看似合理的选择简单拼装起来。\n\n在此前的工作中，我们设计了一组最小化的算法任务。它们是对开放式现实任务的宽松抽象，但可以让创造力在受控环境下被测量。借鉴认知科学中的分类，我们考虑了两种创造力。**组合式创造力（combinational creativity）** 寻找熟悉元素之间不熟悉的联系，例如类比、文字游戏，以及发现原本彼此分离的思想之间的连接。它在视觉领域的对应形式，可以是在熟悉的物体、场景、概念或物理过程中，找到出乎意料却又有意义的关系。**探索式创造力（exploratory creativity）** 则是在一组规则或约束之下构造新的模式，例如设计问题、蛋白质、机制或叙事。它在视觉领域的对应形式，可以是一个满足几何、物理、语义或任务级约束的新场景、3D 结构、视频、机制或行动计划。\n\n在这两种情况下，目标都是生成连贯、彼此不同，而且并非简单复现训练样本的解决方案。我们把这种可操作的定义称为**算法创造力（algorithmic creativity）**。与之对应，对创造性视觉智能的评估至少应衡量三个属性。第一，每个输出都应当连贯，并满足相关的物理、几何、语义、时间或任务约束。第二，不同生成结果应在结构上具有多样性，代表真正不同的解决方案，而不仅仅是纹理、颜色、措辞或视角上的表面变化。第三，输出相对于模型的训练经验应具有原创性。\n\n我们的结果表明，学习目标会影响这类行为能否被获得。在受控任务中，基于 teacherless training 和 diffusion 的多 token 方法，比传统的下一 token 学习生成出了更多样、更原创的解法。这里的核心问题是全局协调：潜在的创造性计划通过序列多个部分之间的关系体现出来，而这些部分必须作为一个整体彼此协调。对于视觉模型而言，这提示我们需要这样的目标与架构：既能表示一个高层次的整体构造，又能在保持空间与时间一致性的同时生成局部细节。\n\n我们还考察了随机性应当在生成过程的哪个位置进入。与其只通过输出层的温度采样引入随机性，seed-conditioning 会在训练和推理阶段都向模型提供随机输入。不同 seed 可以选择不同解法，同时让每个解法内部仍保持一致。其视觉对应形式，可以是在生成细节之前，用一个持续存在的样本级潜变量先选定某种高层次可能性——例如布局、机制、轨迹或假设。这样做或许能促进完整方案之间真正的多样性，而不是仅在解码过程中制造局部变化。\n\n因此，创造力扩展了“生成”在视觉通用智能中的角色。一个具备视觉智能的系统，不应只会识别眼前存在什么、重建隐藏结构，或预测最可能发生的未来；它还应当能够构造多个合理的替代方案，保持每个方案内部的逻辑，并搜索那些既有用又陌生的可能性。因此，对视觉模型的评价不应只有保真度和准确率，还应包括连贯性、结构多样性、原创性与实用性。核心问题不只是模型能不能“想象”，而是它能不能在不失去结构的前提下，**以不同的方式去想象**。\n\n\u003cspan id=\"S2.SS3\"\u003e\u003c/span\u003e\n\n### 2.3 从一个数据点中学习的学习系统（Yuki M. Asano）\n\n今天最强的视觉系统令人印象深刻，但它们并没有以真正重要的方式实现“通用”。它们通常先在规模庞大、精心构建的数据集上训练一次，随后以基本固定的模型形态部署。它们可以识别物体、重建场景、回答关于图像的问题，或遵循文本指令；但它们不会通过持续经验逐步形成对世界的一致理解，也不会随着世界变化而持续重组这种理解。今天，我们这个领域对这一问题已知的一种“修复方式”只有：加入更多数据，然后（重新）训练。\n\n在我看来，一个具备视觉通用智能的系统，应当随着视觉经验本身不断展开而学习：持续地学习，不依赖标签，不需要反复打乱并重放过去，也不预设哪些任务将来才是重要的。如果我们能够构建这样的系统，就有可能得到会适应、会持续改进的模型与 Agent；它们更新权重所需的能量或许只相当于一只灯泡，而不是一座城市。\n\n起点应当是视觉，而不是语言。一个智能系统在描述世界之前，首先必须发现世界的结构。它需要学会：一次观察中的哪些部分属于同一个整体；哪些物体能跨越视角变化和暂时遮挡而持续存在；观察者自身如何移动；场景中哪些变化独立发生；又有哪些规律能在数天、数月乃至数年中保持稳定。\n\n目标并不只是训练一个更大的视频模型。当前的视频模型已经是强大而通用的感知模块，但它们工作的数据已经被事先采集、切分、打乱并反复访问。22 2 我也认为，把生成式视频模型继续规模化，朝某个实用意义上的 VGI 定义迈进，是一个合理的赌注。但对我而言，视觉通用智能真正提出的问题是：一个系统如何在 *它自己的视觉生命历程中* 学习。它应该知道自己以前见过什么，能够检测真正的新事物何时发生，决定自身哪些部分需要改变，并保留那些依然有用的知识。这里所需要的，与其说是一套持续学习方案，不如说是一个能够在开放环境中自主运行的完整学习系统。可以想象一个婴儿：没有明确目标、不会说话，也没有关系。一个略显粗糙的类比，是今天那些可以自行生成子 Agent 的编程 Agent——只是把它们换成视觉系统，从零开始，而且没有语言。\n\n看起来很明显的是，单纯把 Transformer 做得更大，并沿用今天的学习范式，并不能解决这个问题。33 3 我也乐于被证明是错的，我喜欢简单方案。相反，一个合理的人工视觉大脑，应该包含多个彼此交互的系统：\n\n- • **感知系统**：把当前视觉流转化为物体、区域、表面、运动和语义特征。44 4 甚至“视频应该怎样被最佳表示”本身都是问题：帧存在冗余，codec 很复杂，而以物体为中心的表示又带有一定任意性。\n- • **空间与动态世界模型**：维护关于几何、视角、物体身份、运动和因果变化的假设。它应当区分由观察者自身引起的变化，与由世界本身引起的变化。\n- • **记忆系统**：在不同时间尺度上存储信息。\n- • **任务与行动接口**：把已经学到的视觉知识暴露给下游系统，包括机器人、科学仪器、搜索工具和人类用户。\n\n这些模块不一定必须被手工设计成僵硬的符号组件。它们完全可以是神经网络、可微分的，并通过联合训练得到。但它们应当承担不同角色，拥有不同的更新规则和时间尺度。人脑并不是一个均质的整体；一个既要在持续变化中保持稳定、又要不断学习的人工学习器，也不太可能是一个均质模块。\n\n\u003cspan id=\"S2.SS3.p8.1\"\u003e\u003c/span\u003e语言可以在之后作为这种视觉智能的接口进入系统。它可以给概念命名、传达目标、支持协作，并偶尔提供监督。但语言不应当成为视觉系统唯一的组织原则。世界中的许多结构——深度、运动、持续性、包含关系、接触以及可供性（affordance）——都先于它们被命名而存在。因此，一个视觉智能系统应当能够在没有图像描述文本的情况下学习这些规律，之后再把它们与词语连接起来。语言因此成为查询、引导 [[75](#bib.bib20)] 和教授一个已经具备现实 grounding 的世界模型的方式，而不是这个世界模型的替代品。\n\n长期目标，是构建一个会随着经验一起成长的视觉系统。它观察世界的时间越长，就应变得越有能力、结构越完善、越有用；而不需要反复重置、从头重新训练，也无需提前告诉它最终必须理解的一切。\n\n\u003cspan id=\"S2.SS4\"\u003e\u003c/span\u003e\n\n### 2.4 智能将是多模态的、生成式的，而且高效（Deva Ramanan 等）\n\n本节将结合我们团队的工作，概述我对视觉智能的一些思考。我会把这些观点表述为一系列“赌注”：其中一些最终可能是错的，一些则可能显得理所当然。提出它们的目的，是激发讨论——希望是富有成效的讨论。这些思考很大程度上受到具身机器人视角下“智能”问题的启发。\n\n\u003cspan id=\"S2.SS4.p2.1\"\u003e\u003c/span\u003e**（视觉）智能不会只有视觉。** 智能将由多模态信号建模驱动。显而易见的大问题或许是视觉与语言之间的相互作用，但其他感觉模态还包括音频、触觉和本体感觉。尤其从机器人视角来看，这些感觉信号非常重要。一个很值得注意的事实是：绝大多数足式机器人演示——包括人形机器人和四足机器人——依赖的其实是“盲”策略，它们不使用视觉观察，而是依赖反映机器人身体运动学状态的本体感觉反馈。即使不睁眼，也可以在世界中移动，甚至完成后空翻这样的杂技动作。类似地，一些灵巧操作也可以“盲”着完成；比如不看手，只靠触觉，人就能在口袋里摊开并辨认不同钥匙。事实上，我在机器人领域听过一种说法：视觉是机器人最不重要的感知信号。我并不同意这种观点。相反，从信息论角度，我愿意为视觉辩护：和其他感觉模态相比，视觉具有很高的维度，而且往往包含大量关于物理世界的信息。讽刺的是，这也正是机器人系统常常觉得“忽略视觉很有吸引力”的原因之一——基于低维本体状态构建轻量、低延迟策略要容易得多。最后，我想用几个研究不足的方向来结束这项“赌注”。首先是真正的多模态学习。出于实践原因，大多数所谓多模态模型，本质上仍然是单模态模型，之后再通过 adaptor 对其他模态进行后训练。直接从原始多模态信号流中预训练表征会很有意思 [[81](#bib.bib9)]。另一个我认为研究不足的方向是触觉感知。构建可规模化的触觉传感器当然仍存在大量硬件挑战，但视觉社区可以立刻切入的一种方式，是研究“近场”视觉：用视觉感知来分析距离非常近、甚至正在接触的场景结构。GelSight 传感器 [[105](#bib.bib8)] 就是一个很好的例子，它把触觉感知重新表述为一个光度立体重建问题。另一个被广泛使用的例子是腕载第一视角相机，它们有可能成为理解近距离视觉世界的丰富数据来源 [[14](#bib.bib7)]。\n\n\u003cspan id=\"S2.SS4.p3.1\"\u003e\u003c/span\u003e**（视觉）智能将是生成式的。** 在这一点上，我认同 Hinton 的观点：“要识别形状，先学会生成图像” [[42](#bib.bib6)]；这个思路本身还可以追溯到模式识别中“分析即合成”（analysis-by-synthesis）的传统 [[36](#bib.bib5), [67](#bib.bib4)]。对我而言，近几年最震撼、最令人印象深刻的创新，是图像和视频的生成建模。类似的图像生成结果或许早在生成对抗网络（GAN）时代就已经出现，但今天的 diffusion 和 flow 模型似乎构成了一个量级上的跃迁，尤其是在视频领域。我倾向于把生成建模视为自监督学习的自然演进与最终形态。Veo3、NanoBanana 等令人印象深刻的例子，都指向一个事实：即便只是简单的像素监督，也可能涌现出丰富知识。我的赌注是，生成模型会“接管”表征学习，使 DINO、JEPA 等有影响力的方法所普及的嵌入空间显式表征学习不再成为必要环节。随着更多数据、更大规模，以及产业界巨额投入和支持，生成模型仍在持续进步。事实上，人们普遍感觉，生成模型研发所需资源已经超出了学术界能够提供的范围。也许更令人意外的是，产业界除了少数玩家之外，大多数参与者似乎同样难以承担。因此，**效率** 必须成为创新的基础支柱之一，下面会进一步讨论。不过，在此之前，我想指出一些仍未被充分研究的技术挑战。一个开放问题是多模态生成的架构。用于同时生成文本和图像的统一模型已经越来越多，但基于前面的动机，我认为这个领域应进一步探索多感觉信号的生成。一个可借鉴的视角来自多视图学习：即便只学习一种模态，在数据和规模足够大时也可能理解真实物理世界，但不同模态可能提供关于真实世界的条件独立视图，而这已被证明能够显著提高学习效率 [[9](#bib.bib3)]。第二个挑战是条件建模。分析或重建本身可以被理解为条件生成；例如，不是直接生成一张 RGBD 图像，而是以 RGB 为条件生成深度。目前的做法之一，是用不同噪声调度对不同模态进行去噪 [[26](#bib.bib2)]。我希望未来能通过为条件信号学习编码器，让条件架构变得更高效；而这本身又可以被视为一种表征学习。\n\n\u003cspan id=\"S2.SS4.p4.1\"\u003e\u003c/span\u003e**（视觉）智能将是高效的。** 一个很值得注意的例子是，OpenAI 最早一批生成式视频建模尝试之一——SORA——已经被终止。目前的理解是，其推理和生成的美元成本过高。真正大规模推进视频生成，似乎只对少数前沿实验室可行，学术界则可能根本难以企及。我认为，我们必须同时在训练和推理阶段强调效率。我的赌注是：可以把 recurrence、3D、多尺度处理等“经典”表征重新引入生成建模，以此解决效率问题。一个开放问题是长视频生成，也就是生成 1 分钟以上的视频。应用自回归序列建模很有吸引力，但关键挑战在于如何维持一致的记忆。从更底层看，真正需要的是一种不会随着时间不断增长的有状态表征；这通常就被称为 recurrence。比如，在生成一段房屋漫游视频时，如果 5 分钟后重新回到客厅，我们当然希望客厅仍保持一致。此时，可以把在线 3D 重建看成一种空间记忆状态，用它来强制维持一致性。联合重建与生成方向的工作正在增加，但还有一个研究不足的空间是**分辨率的作用**。高分辨率、高帧率的视频生成成本太高，几乎只有少数机构负担得起。我一直很认同一种思路：我们应该尝试建模并生成底层连续的时空世界，而不应被用于捕捉它的具体传感器形式所限制。换一种说法，也许长视频生成在低分辨率、低帧率下反而更可行。这样的折中方案在实际工作流里已经很常见，但我认为我们应该更积极地接受它，并延续过去一些重要工作所开辟的方向 [[79](#bib.bib1)]。最后，我想用一个更具挑衅性的观点结束对数据驱动学习的讨论：如果框架正确，我们可能根本不需要那么多数据。我的出发点是，真正驱动学习的关键不是数据规模，而是**数据多样性**。某种意义上这很直观：同一个训练样本复制一百万份，对学习并没有帮助。规模之所以如此有吸引力，是因为它是组装一个多样化数据集最容易的办法。但如果能够正确筛选数据，我认为未必需要那么大的规模。当然，这马上又引出一个同样困难的问题：怎样正确地——甚至自动地——进行数据筛选？对此我没有一个特别深刻的答案，但我认为更合适的框架是强化学习（RL）。与监督学习、生成建模等其他机器学习范式相比，强化学习似乎是唯一一种把“收集什么数据”的责任交给学习者自身的范式。这让我觉得方向是对的。我希望视觉社区能像机器人和自然语言领域一样，真正拥抱它。\n\n\u003cspan id=\"S2.SS5\"\u003e\u003c/span\u003e\n\n### 2.5 视觉智能与科学发现（David Fouhey）\n\n在我看来，视觉智能是这样一种能力：无需为每个任务提供不合理的大量监督，就能够以人类水平或更高水平理解视觉数据，并且也许还能生成视觉数据。这里的“监督”采用最宽泛的含义，不仅包括过去显式训练超专用模型（例如人脸检测器）的直接标签，也包括今天用于隐式训练新模型的原始数据、环境和模拟。\n\n目前，我认为让我们与视觉通用智能仍有距离的关键，是**监督规模**。只要资源足够，我们的系统在许多任务上表现得惊人地好，但仍需要太多人工扶持。说到这里，人们往往会开始感叹，并拿 AI 与幼儿高效学习的能力进行对比。我们的确非常“吃数据”，但我认为这种看法并不完全正确：事实证明，能够依靠数据解决的问题比我们原来想象的多得多，从识别到 3D 再到生成都有例子；而且有不少问题，只需要出乎意料地少量数据，就能用“蛮力”做到相当合理的性能。我们真正需要解决的是，怎样让这些方法减少对数据的饥渴。与此同时，正因为这些 proof-of-concept 已经成立，市场对视觉智能产生了前所未有的需求，也由此打开了改变世界的新机会。\n\n\u003cspan id=\"S2.SS5.p3.1\"\u003e\u003c/span\u003e我的同事会很好地覆盖 3D、视频生成等其他角度，因此我会把重点放到**科学发现**的语境中。我在这个方向工作了几年，目标是生成真正会被科学家用于发现的 AI 数据。我的工作包括：用 AI 模型 [[88](#bib.bib108)] 更细致地揭示太阳磁场，以及用 AI 驱动的数据 [[91](#bib.bib107)] 来帮助重建演化过程 [[8](#bib.bib106)]。我相信这个领域只会继续增长，而且未来视觉智能的大量投入，很可能会流向由专业科学仪器生成的数据；这些仪器正在从不同尺度观察现实世界。\n\n下面我会串联几个与科学家合作时不断遇到的问题。在这些问题上，计算机视觉能够提供的东西，与实际需要之间存在明显错位。\n\n\u003cspan id=\"S2.SS5.p5.1\"\u003e\u003c/span\u003e**（数据是有限的。）** 除了少数前沿实验室工作之外，计算机视觉通常处于这样一种环境：数据是一个可以调节的旋钮，而且很可能是最有效的旋钮。但许多关键科学问题之所以困难，正是因为无法收集更多数据。比如，要理解气候变化对动物形态的影响 [[90](#bib.bib115)]，我们不可能回到 1970 年重新采集那些物种。现有模型直接面对少量数据时往往并不合适，因此我们需要找到办法，让自身能力与领域需求对齐；而且要真正理解这些数据，还必须综合其他因素。\n\n**（没有 ground truth 时，验证非常困难。）** 科学很少拥有我们习惯的那种方便 ground truth。这里我采用最宽泛的定义：不仅是人工绘制的分割标签，也包括其他视角、其他数据等。有些领域比较幸运，比如天气有气压计和雨量计，但大多数领域没有这种条件。太阳物理学往往只有来自某个单一角度、某个时间点的光子；演化生态学面对的则是跨越数千万年深时间尺度才显现出的过程。因此，当我们提出一种新的测量或预测时，没有排行榜可以比较，也没有一个“最佳数字”可以在表格里加粗。验证反而意味着漫长而困难地把新结果与我们已有的知识体系协调起来。这会把工作量大幅推向验证环节，其占比远高于常见 CVPR 研究范式中的习惯。尽管很多人已经付出了努力，我们这个领域的学术评价与激励体系实际上并没有为这类工作做好准备。\n\n\u003cspan id=\"S2.SS5.p7.1\"\u003e\u003c/span\u003e**（广义的多模态是不可或缺的。）** 一种验证方法，是把结果与方程、简化模型以及其他仪器的历史数据连接起来。例如，可以通过原子物理把太阳日冕热结构的估计 [[13](#bib.bib109)] 与另一台仪器观测到的 X 射线辐射联系起来，从而进行验证。这样的验证很难，因为它需要来自其他仪器和已有知识的“常识”判断：比如，我们是不是在模型里漏掉了一条谱线？假设的元素丰度合理吗？模型有没有违反基本规律？目前这类关联很难自动化，主要仍依赖人眼和手工工作。更麻烦的是，最有用的约束通常并不是 Maxwell 方程这样的硬规则，而是那些需要专家直觉才能判断的“软合理性”。归根结底，如果视觉智能真的要推动科学发现，它必须能够真正连接彼此分散的多模态来源。\n\n\u003cspan id=\"S2.SS5.p8.1\"\u003e\u003c/span\u003e**（不能忽视系统误差和单位。）** 另一种验证方式来自其他仪器。在计算机视觉里，我们常常把数据当成某个黑盒传感器给出的 [0,255] 或 [0,1] 数值。但原则上，科学传感器的数据带有单位，因此这些单位可以成为非常强的现实校验。然而，所有仪器也都存在 systematics，也就是并非来自真实物理现象本身的系统效应。因此，为科学任务构建和评估视觉系统，就必须把底层现象产生的真实信号，与仪器自身引入的信号区分开来。这种区分需要深刻理解：太阳确实存在 11 年周期 [[38](#bib.bib110)] 和 5 分钟振荡，但研究中也发现过 160 分钟 [[10](#bib.bib111)]、24 小时 [[43](#bib.bib112)] 这样的伪信号。我们的经验是，模型会同时抓住真实模式和虚假模式，并且同样忠实地模仿它们 [[41](#bib.bib113)]。目前我们只能像处理天气再分析数据那样，从数据源头把这些问题尽量消除 [[40](#bib.bib114)]；未来的模型则应该更加“可编辑”，能够把不同信号分离出来并选择忽略某些信号。作为一个研究社区，我们也往往把模型和数学视为最主要的贡献，而现实中，干净的数据常常同样重要，甚至可能是更大的成功驱动因素。\n\n**（现实很难被建模。）** 我经常遇到一个问题：为什么不用模拟？遗憾的是，只要一个领域值得采集新数据，往往就意味着我们对现实的理解仍然模糊。因此，我们手头的模型通常只是近似模型，或者存在多个彼此竞争、却都能解释数据的机制。更麻烦的是，我们平时习惯处理“行为良好”的现实；而在许多前沿物理问题中，渲染过程本身就常常是一个优化问题，只有有限的一部分问题拥有干净的解析方案。现有技术总体上还不擅长把模型与这些复杂过程直接连接起来，不过我希望高效 coding model 的出现，能让我们的模型更容易直接连接到现实世界的模型。\n\n**（视觉只是更大体系的一部分。）** 再退一步看，在大型科学项目里工作让我始终保持谦逊。在计算机视觉领域，我们很容易把一篇 CVPR 论文当成整个世界：表格里的数字全都加粗以后，就宣布成功。但真正的科学发现流水线里，视觉通常只是其中一环。我刚开始和科学家合作时就发现，他们在意的问题与 CVPR 审稿人很不一样：我的 AI 数据里有没有系统误差？AI 生成的数据有没有错误？你能不能几乎把所有错误都找出来？我也发现，要把我们的成果真正整合进科学发现流程并不容易：科学家通常已经有一套现成方法，用来绕过过去方法的局限。为了让数据真正被科学家使用，理解并打通这个接口，既非常费力，也同样令人有成就感。\n\n\u003cspan id=\"S2.SS6\"\u003e\u003c/span\u003e\n\n### 2.6 空间 AI 的计算结构是什么？（Andrew J. Davison）\n\n\u003cspan id=\"S2.SS6.p1.1\"\u003e\u003c/span\u003e在 FutureMapping 1 和 2 [[17](#bib.bib61), [16](#bib.bib62)] 中，我把空间 AI（Spatial AI）定义为这样一种能力：人工设备能够为周围环境建立真正丰富却又高效的表征，并据此像人类一样，以具备一般智能的方式与环境交互。借用 Pearl 的话来说：“人类拥有而其他物种缺少的，是一种心理表征——一张关于自身环境的蓝图；人可以随意操纵这张蓝图，想象不同的假设性环境，用于规划和学习” [[71](#bib.bib80)]。我认为，构建高质量、与具体任务无关的表征，是创造性视觉智能的关键；它将使一些真正改变世界的产品成为可能，例如能够自主收拾凌乱厨房的机器人，或一种通用、轻量的可穿戴设备，普遍增强人的记忆与智能。这类产品不仅对空间 AI 系统提出极高能力要求，也会从尺寸、重量和效率等方面，对其嵌入式实现施加非常严格的约束。因此，这些系统的**计算结构**——什么在什么地方被计算和存储，各部分如何连接，以及它们如何对应未来计算硬件可能的发展——是一个极其重要、却很少被讨论的研究问题。\n\n\u003cspan id=\"S2.SS6.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### 表征\n\n表征是一组用于描述设备自身状态以及周围世界状态的数值。它必须具有持久性，同时也必须能够适应变化：随着我们获得关于世界的新信息，或世界本身发生变化，表征也始终在更新。这使机器人能够进行预测和规划。“世界模型”这个词近年在机器学习研究中变得流行，但场景表征在 AI 和机器人领域拥有悠久历史。SLAM（Simultaneous Localisation and Mapping，同步定位与建图）研究，是“逐步构建持久世界表征如何支持一致、长时间跨度行为”最清晰的例子。基于稀疏特征的简单视觉 SLAM 地图，就可以支持面向多个 waypoint 的可靠长期导航，或保证区域覆盖。但实时视觉 SLAM 能够构建的表征一直在进步，逐渐走向稠密地图、语义标签，以及显式的物体级场景图，有时还会估计物理与动力学属性。此外，这些表征并不一定追求全局范围内精确的度量一致性；它们可以在局部非常准确，而在大尺度上采用更近似的表示。\n\n我之所以认为视觉 SLAM 正在演化为空间 AI，一个重要原因是：这个领域长期由现场演示驱动，强调效率、低成本硬件、实时可视化以及开源代码发布。SLAM 研究者长期执着于一个核心问题：如何从多传感器数据流中持续构建一个持久表征，同时避免漂移，并始终受限于固定的计算与内存预算。\n\n\u003cspan id=\"S2.SS6.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### 机器学习与状态估计\n\n\u003cspan id=\"S2.SS6.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e在更广泛的人工智能图景中，SLAM 一个很特殊的地方在于，它还没有被机器学习彻底主导。定位和稀疏建图中性能最好的方法，大多仍是基于几何与概率状态估计的人工设计算法；而稠密和语义 SLAM 系统通常采取一种平衡方式，让机器学习替代状态估计的一部分功能，或在其上增加能力（例如 MASt3R-SLAM [[68](#bib.bib81)]）。\n\n人们很自然会问：整个 SLAM 和空间 AI 最终是否都会被端到端神经网络完成，不再需要任何人工设计的表征与算法？近来很多 3D 基础模型研究确实正在朝这个方向推进。在我看来，这并不是最重要的问题。未来的空间 AI 系统，几乎一定会把学习得到的组件和人工设计组件紧密整合到很难分辨彼此的程度；这种状态既可能通过在设计好的系统中不断加入学习模块实现，也可能通过给一个纯学习系统不断加入结构来实现。无论哪条路径，真正重要的仍是整个系统的存储和计算结构。如果它要具备现实应用需要的属性——高效、可组合，并能与其他设备和人类用户共享——那么我认为，这两条路线最终都会收敛到类似的系统性质。\n\n\u003cspan id=\"S2.SS6.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### 未来的处理器硬件\n\n过去 15 年里，AI 的主导处理器从 CPU 转向 GPU，这只是一个趋势的开端。计算效率的关键，是充分利用并行性，让非常大量、相对简单的核心共同完成工作；与此同时，还要尽量减少数据在芯片内部以及由芯片组成的更大系统中来回移动。这意味着，长期来看，处理器会走向更细粒度的并行结构，内存被分布到不同 processing tile 上，而各 tile 之间通过遵循局部性的稀疏通信通道连接。为了进一步提高效率，这类处理器也不可避免地会走向异步、事件驱动的运行方式，以及低 bit-rate、甚至模拟形式的数值表示。\n\n\u003cspan id=\"S2.SS6.SSS0.Px4\"\u003e\u003c/span\u003e\n\n#### 将空间 AI 图映射到硬件\n\n如果处理器与内存真的越来越细粒度，每个 tile 都带有本地内存，而 tile 之间只通过稀疏连接通信，那么这里的“苦涩的教训”就是：**最适合映射到这种硬件设计上的算法，会表现最好。** FutureMapping 系列论文提出了一条前进路径：找到空间 AI 算法的数据结构与处理结构中的“图”，再尽可能把这些图与硬件结构对齐——本质上，就像把图的拓扑在地理意义上铺到芯片上。从算法角度，我们需要关注能够在一般性的、有环图上通过消息传递完成推理与学习的方法。belief propagation 是一个很有力的候选，因为即使通信是异步的、甚至存在丢失，它依然具有很强的分布式收敛性质。\n\n机器人周围场景的表征本身也拥有内在图结构，许多 SLAM 方法已经揭示了这一点。这些表征必须被设计成能够高效连接到主实时处理循环：这些循环负责接收传感器的实时数据，并向执行器输出控制信号。此外，高度专用的处理器还会部署在非常靠近传感器和执行器的位置，甚至直接位于其中；这样，各模块之间传递的就可以是“可直接采取行动的信息”这种抽象层内容，而不是视频这样的大规模原始数据流。\n\n从很多方面看，我们可以推测：对高效、模块化实现的追求，会推动空间 AI 系统越来越像生物大脑——它以极高效率实现极强能力。\n\n\u003cspan id=\"S2.SS7\"\u003e\u003c/span\u003e\n\n### 2.7 视觉智能就是具身智能（Yilun Du）\n\n本节结合我们团队的研究，提出一种理解视觉智能的视角。我认为，对视觉通用智能的一项核心检验，是它能否让机器人在真实物理世界中可靠地感知、推理并行动。具身并不只是视觉智能的一个下游应用：Agent 可以主动选择视角并干预世界，从而揭示仅靠被动观察很难推断出的属性，检验自己的预测，并获得反馈来修正视觉模型。要通过这一检验，视觉系统必须能够泛化到陌生情境，把跨越很长时间跨度的观察整合成一致的场景表征，把视觉理解连接到行动，主动获取有信息价值的经验，并在部署后继续适应。这些能力共同构成一个闭环：视觉引导行动，而行动产生的结果又为改进视觉理解提供证据。\n\n\u003cspan id=\"S2.SS7.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### 用生成式世界模型构建稳健视觉系统\n\n具身 Agent 会持续遇到训练分布之外的观察，而当前视觉系统在这些情况下可能以不可预测的方式失败；在机器人场景中，这种失败有时甚至会造成灾难性后果。因此，视觉智能的一项核心挑战，是面对视角、环境、物体配置和交互方式等开放式变化时，仍能稳健泛化。\n\n\u003cspan id=\"S2.SS7.SSS0.Px1.p2.1\"\u003e\u003c/span\u003e一种很有前景的稳健性路径，是构建生成式世界模型，并把感知表述为：对那些可能生成当前观察的潜在场景状态进行推断。视觉观察来自反复出现的物理规律，包括几何、物体、关系和动力学；因此，这类模型可以通过复用和重新组合已有知识来解释陌生场景。显式 3D 结构 [[54](#bib.bib65)] 与组合结构 [[22](#bib.bib66), [89](#bib.bib64), [114](#bib.bib67)] 可以为数据高效学习与系统性泛化提供有用的归纳偏置。这个思路延续了长期存在的“分析即合成”（analysis by synthesis）范式 [[106](#bib.bib68), [48](#bib.bib69)]：视觉理解通过推断一个潜在场景解释来实现，而由这个解释合成出的观察应与输入一致。与这一观点相符，我们团队此前的工作已经表明，生成式组合模型能够泛化到包含训练期间从未出现过的物体数量与配置的场景中 [[89](#bib.bib64)]。\n\n\u003cspan id=\"S2.SS7.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### 构建一致的场景表征\n\n\u003cspan id=\"S2.SS7.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e这种推断不能在每一帧上都从零开始。机器人如果要在数天甚至更长时间里自主工作，就必须把持续不断、却始终不完整的观察流整合成一个持久且内部一致的环境表征。这个表征必须能够跨越视角变化和遮挡把观察关联起来，保持实体的身份与关系，并随着物理世界变化而更新。我们团队研究过以物体为中心的表征，用来随时间维持单个实体 [[23](#bib.bib76), [28](#bib.bib77)]；也研究过场景级 3D 记忆，把整个环境中的观察聚合起来 [[103](#bib.bib78)]。一个关键方向，是发展动态、分层的表征，把全局场景结构连接到物体、部件及其关系，同时追踪每一个层级随时间如何演化。这些表征应当支持增量更新，并能根据任务需要，在适当抽象层级上进行检索。因此，目标并不只是建立一张持久地图，而是建立一种**可修订的场景表征**，让它同时支持预测、行动以及有针对性的信息收集。\n\n\u003cspan id=\"S2.SS7.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### 把视觉智能连接到行动\n\n\u003cspan id=\"S2.SS7.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e归根结底，视觉智能应当提供机器人为了执行任务而真正需要的理解，使机器人能够行动、交互与探索。视觉计划并不需要以同等保真度复现观察中的每一个细节，但必须保留那些会改变机器人可用行动空间或任务结果的关键差异。我们团队通过把决策建模为条件视觉生成，探索了这种连接 [[24](#bib.bib74), [112](#bib.bib79), [12](#bib.bib75)]。在这一框架中，生成模型提出一条高层次视觉轨迹，表示任务可能如何完成；另一个独立的低层控制器，再把这条轨迹 grounding 到连续的机器人动作上。这样的分解方式，使视觉生成负责表达任务级意图与预期的物理演化，而把精确执行交给控制器。随后比较预测结果与实际观察结果，就能把真实执行过程同时变成对计划和视觉世界模型的检验。\n\n\u003cspan id=\"S2.SS7.SSS0.Px4\"\u003e\u003c/span\u003e\n\n#### 主动视觉学习\n\n行动不仅是视觉智能的输出，也是一种获取视觉证据的方式。机器人可以移动到更有信息价值的视角，并与物体发生物理交互，从而消解感知歧义，揭示那些被动观察可能无法确定的属性、可供性和动力学特征。改变视角可以解决遮挡问题；推动、抬起或打开一个物体，则能够为它的关节结构、稳定性和物理行为提供证据。这类交互也会暴露机器人当前视觉模型的局限。\n\n\u003cspan id=\"S2.SS7.SSS0.Px4.p2.1\"\u003e\u003c/span\u003e来自生物视觉的经典证据，也支持把感知与自主产生的行动耦合起来的重要性。在 Held 和 Hein 的实验中，成对的小猫获得几乎一致的视觉输入，但只有那些能够通过自身运动控制视觉输入的小猫，最终发展出了正常的视觉引导行为 [[39](#bib.bib70)]。我们团队早期的工作曾探索主动视觉学习的初步形式：训练一个由好奇心驱动的策略，使它主动寻找环境中那些在已学习视觉表征模型下具有最大 surprisal 的区域 [[21](#bib.bib63)]。这种定向交互，使“行动”本身成为选择视觉系统将从哪些经验中学习的机制。\n\n\u003cspan id=\"S2.SS7.SSS0.Px5\"\u003e\u003c/span\u003e\n\n#### 持续适应的视觉智能\n\n只有当主动探索得到的证据能够真正被纳入视觉模型时，这种探索才有价值。机器人不可避免地会遇到陌生物体、材料和视觉现象——例如透明表面或折射表面——而这些内容在初始训练数据中可能没有得到充分表示。因此，视觉系统在部署后仍应保持可塑性，根据新经验不断修正自己的表征与世界模型。\n\n\u003cspan id=\"S2.SS7.SSS0.Px5.p2.1\"\u003e\u003c/span\u003e我们团队近期的工作正在探索这类自我改进的初步机制：SILVR 使用 Agent 自身交互生成的轨迹，改进基于视频的机器人规划器 [[60](#bib.bib71)]；World Action Verifier 则利用检测到的预测失败，引导有针对性的数据收集和世界模型细化 [[58](#bib.bib72)]。其中一项核心挑战，是如何吸收真正的新经验，同时不灾难性遗忘此前已经获得的知识 [[65](#bib.bib73)]。一个有希望的方向，是采用“wake–sleep”过程，把在线交互与经验获取，同周期性的知识巩固分离开来。把这些组件放在一起，就形成了一个闭合的视觉学习循环：推断结构化场景解释，随时间维持这种解释，预测行动发生后视觉世界将如何演化，主动干预世界以获取有信息价值的证据，并在预测与观察不一致时修正模型。\n\n\u003cspan id=\"S2.SS8\"\u003e\u003c/span\u003e\n\n### 2.8 通过代码看见物理世界（Shangzhe Wu \u0026 Jiajun Wu）\n\n\u003cspan id=\"S2.SS8.p1.1\"\u003e\u003c/span\u003e理解视觉智能的一种方式，是把它看成从视觉观察中恢复物理世界的结构——或者说“代码”。一幅图像，本质上是对某种物理现象的一次测量：一个场景由具有特定形状和材质的物体构成，它们以特定方式被照亮，从某个具体视角被观察，并在物理规律作用下运动与交互。图像记录的，只是这一整个构型恰好向相机发送的光。按照这种理解，“看见”就是试图把这次测量反过来：从被记录下来的光，推断产生它的底层场景。这样的框架在视觉研究中已经存在很久 [[64](#bib.bib53), [36](#bib.bib5), [67](#bib.bib4), [106](#bib.bib68)]，也大体上是我们自己的研究一直遵循的路线。\n\n\u003cspan id=\"S2.SS8.p2.1\"\u003e\u003c/span\u003e这个框架最吸引人的地方在于，它恢复出的结构能够超越最初被观察到的条件而继续有效。假设一个系统已经判断出：场景里有一个具有特定形状和材质的杯子，放在桌面上。那么，它就已经为回答很多训练期间从未被提出的问题做好准备，而且这些问题往往是反事实性的：从背后看这个杯子是什么样？如果桌子倾斜会发生什么？要把杯子拿起来，手应该放在哪里？如果一个系统学到的只是“杯子通常怎样出现在桌面上”的统计规律，它当然也可能正确回答其中一些问题，但它并没有特别充分的理由一定能做到。正是这种结构，使数量有限的观察能够支持开放式、近乎无限范围的预测与行动 [[99](#bib.bib82), [98](#bib.bib83)]。\n\n\u003cspan id=\"S2.SS8.p3.1\"\u003e\u003c/span\u003e这也塑造了我们理解视觉与语言关系的方式。语言本身已经是对经验的一层抽象：它记录的是人们认为值得彼此描述的内容，并使用人类历史中恰好发展出来的词汇来表达。物理世界的很多行为从来没有被这样描述过——比如某一款婴儿车具体如何折叠，面团面对擀面杖时如何变形，一朵玫瑰如何开放，又如何在几周后逐渐凋谢塌陷 [[33](#bib.bib87)]。无论有没有人给这些现象命名，视觉观察都携带着相应信息。对我们而言，这正是把视觉视为一种独立的世界结构来源，而不只是语言模型输入通道的理由。\n\n\u003cspan id=\"S2.SS8.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### “结构”具体意味着什么？\n\n\u003cspan id=\"S2.SS8.SSS0.Px1.p1.1\"\u003e\u003c/span\u003e如果把物理世界的这种结构说得更具体一些，会更有帮助。第一是 *实体（entities）*：一个场景可以分解成物体，而物体又可以递归地分解为部件。第二是 *内在属性（intrinsics）*：属于物体本身，而不是属于其被观察条件的性质，包括几何、纹理、材质，部件之间如何铰接以及可以移动多远，还包括质量、摩擦、刚度等物理属性 [[109](#bib.bib86), [100](#bib.bib84), [55](#bib.bib85), [18](#bib.bib88), [52](#bib.bib89), [53](#bib.bib103), [32](#bib.bib104), [96](#bib.bib90), [33](#bib.bib87)]。第三是 *外在属性（extrinsics）*：姿态、光照和相机。它们解释了像素变化中的很大一部分，却不会改变物体本身，因此很值得被单独分解出去。第四是 *关系（relations）*：哪个物体支撑哪个物体，哪个部件绕哪个部件转动，什么包含在什么里面。第五是 *动力学（dynamics）*：当某种作用施加到场景上时，场景状态如何变化 [[95](#bib.bib91), [61](#bib.bib105), [1](#bib.bib92)]。\n\n这套分解方式远非穷尽，只是它在我们自己的研究里很有效。它说明的是“应该恢复什么”，而不是“必须怎样编码”。比如，一条关节轴可以是显式参数，也可以只是隐含在网络权重中的一个方向。这种分解最有吸引力的地方，是它能让系统精确预测一个动作的影响：一旦系统表示了关节轴，它就能说明拉门时会发生什么；一旦表示了质量和摩擦，它就能说明推一下堆叠物体后会发生什么。一个把这些量彼此纠缠在一起的表征，也许仍然能非常逼真地复现场景外观，但却未必能支持上述任一预测。\n\n\u003cspan id=\"S2.SS8.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### 大规模结构学习\n\n\u003cspan id=\"S2.SS8.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e过去几年的进展表明，要恢复这类结构，规模扩展可能是必需的，因为视觉世界实在过于多样，不可能靠手工指定的模型全部覆盖。更有意思的问题在于：我们把这些规模花在了哪里。目前很大一部分资源都投入到预测像素的生成模型上，而对它们的判断又主要依据输出看起来是否可信。但这个评价标准并不能告诉我们：形状、材质、关节结构或物理属性是否真的被模型表示出来了。一个视频模型能逼真地渲染掉落的杯子，说明它知道“掉落的杯子看起来是什么样”；却不能说明质量、接触或摩擦是否真的在模型内部以某种形式存在。当评估只奖励感知质量时，这个差距很难被发现；而一旦我们希望干预、编辑或行动，它就会立刻显现 [[25](#bib.bib93), [87](#bib.bib94)]。\n\n\u003cspan id=\"S2.SS8.SSS0.Px2.p2.1\"\u003e\u003c/span\u003e只靠像素预测，在数据和算力足够时，这些量最终是否会自行涌现，目前仍是开放问题。我们自己的工作选择了另一条路线：把结构本身作为明确的学习目标，而不是把它当作其他目标的副产物。物理世界具有组合性——物体由部件组成，场景由物体组成，运动由关节旋转组成——因此，如果一个系统能够恢复这些基本组成部分，它就应该能在新的组合中复用它们；学习第一百个物体的成本，也应低于第一个物体。只对外观建模则没有那么强的复用性，因为每一种新配置都可能需要被单独捕捉。针对这条结构路线的标准反对意见是：结构化表征不具备规模扩展性，主要因为过去太多结构必须由人工放进去，而手工构建的组件并不会随着数据和算力增长而自然变强 [[78](#bib.bib29)]。我们的看法是，这更可能是**结构如何被获得**的问题，而不是结构本身的问题；于是关键就转向：结构应该如何表示，以及结构究竟从哪里来。\n\n\u003cspan id=\"S2.SS8.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### 有些结构适合明确写下来，有些则不适合\n\n在一个极端，表征可以完全连续：整个场景变成网络产生的一组向量。这样的表示能力强、也容易优化，但其中没有任何部分可以被显式读取、编辑或验证。另一个极端则是完全离散且有名字的表示：场景里有一个杯子，它放在桌上，有一个把手，这个把手绕某条给定轴转动。这样的表示可以被读取、编辑和验证，但它能覆盖的范围受限于自身词汇表。\n\n\u003cspan id=\"S2.SS8.SSS0.Px3.p2.1\"\u003e\u003c/span\u003e一个真正有效的表征需要同时捕捉这两者 [[108](#bib.bib96), [62](#bib.bib97), [44](#bib.bib98), [97](#bib.bib95)]。那些离散且关系化的结构——有哪些部件、有多少个、如何排列、什么与什么连接——天然适合用程序或语言写下来。那些连续且难以命名的结构——一片叶子的精确几何，一件上釉陶瓷的细致外观——则更适合留给学习得到的 embedding。Scene Language [[108](#bib.bib96)] 是一个具体实例：一个场景由程序表示，程序描述它的层级结构；每个实体的语义类别由词语命名；每个实体独特的视觉身份则由 embedding 表示。相同理念也支撑了我们关于神经符号概念的工作：像“left of”或“put down”这样的概念，会同时以符号程序和神经网络的形式共同保存，而神经网络则 grounding 于感知和行动 [[62](#bib.bib97), [44](#bib.bib98), [63](#bib.bib99)]。\n\n\u003cspan id=\"S2.SS8.SSS0.Px4\"\u003e\u003c/span\u003e\n\n#### 让编程 Agent 成为结构的“作者”\n\n\u003cspan id=\"S2.SS8.SSS0.Px4.p1.1\"\u003e\u003c/span\u003e上面描述的许多结构都可以写成程序。物体有层级，所以程序会嵌套；部件会重复，所以程序会循环；关节有活动范围、部件存在约束，所以程序会接受参数并包含 assertion。最近，LLM Agent 恰好非常擅长做这些事：它们能够写程序、运行程序、读取错误，然后再次尝试，而且可靠性已经高到足以重塑软件行业。如果物理结构可以用代码表达，那么擅长写代码的系统，也可能擅长构建物体与场景的模型 [[113](#bib.bib100), [76](#bib.bib101)]。\n\n\u003cspan id=\"S2.SS8.SSS0.Px4.p2.1\"\u003e\u003c/span\u003e这种能力建立在代码本身一个根本属性上：**代码能够运行，也能够被验证。** 一个程序要么能编译，要么不能；要么通过测试，要么不能通过。正是这种自动检查，使编程成为 Agent 能够被训练到高度熟练的一类任务。当程序描述的不是软件，而是一个物体时，这个属性依然成立。这样的程序可以被执行、渲染和模拟，而它的输出可以与程序原本应该解释的图像，或物体应该产生的运动进行比较。于是，一个提出的结构不只是被“生成出来”，还可以被发现错误并修正。Agent 已经能够编写代码，在数百个类别上生成有关节结构的 3D 资产 [[113](#bib.bib100)]；也能够编写控制机器人完成操作任务的代码，并在获得执行反馈和视觉比较后持续改进 [[29](#bib.bib102)]。这个思路最终能延伸多远仍是开放问题。今天的 Agent 很大程度依赖人类预先提供给它们的抽象，以及语言模型关于日常物体“通常怎样构成、怎样工作”的先验知识；当这些先验被移除时，性能就会下降 [[29](#bib.bib102)]。对我们而言，真正最重要的问题是：这些抽象能否不再依赖事先提供，而是直接从系统正在观察的世界中被提取出来。\n\n\u003cspan id=\"S2.SS9\"\u003e\u003c/span\u003e\n\n### 2.9 从视觉模型走向视觉原生智能（Zhuang Liu）\n\n本节并不试图给出一套完整的视觉通用智能理论。有些观点可能已经很熟悉，有些则带有推测性质。我把它们写下来，是因为它们反映了几种由我个人研究偏好塑造的信念：简单而可规模扩展的方法、对模型的实证理解，以及数据和评估所扮演的角色。即使视觉模型不断变强，很多 AI 系统今天仍主要把视觉作为语言的附属能力。我希望用一种更“视觉原生”的方式思考 VGI：视觉本身是获取上下文和提供及时反馈的自然通道。\n\n\u003cspan id=\"S2.SS9.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### 为什么今天的视觉看起来没那么“中心”\n\n人类视觉是一个极强的基线。它经过漫长演化过程塑造，而且大多数人几乎不需要有意识地努力，就能使用它。我们可以识别物体，在杂乱环境中导航，并几乎持续不断地通过视觉反馈修正自己的行动。这也许部分解释了为什么语言领域的进展看起来格外惊人。在语言任务中，AI 系统面对的是一个差异很大、而且高度依赖文化训练的人类基线；在视觉任务中，它们面对的，却是生物学中最成熟的智能系统之一。\n\n这并不意味着视觉不重要，反而说明它极其重要。视觉是人类体验并组织世界的主要方式之一。人类思维经常通过语言表达，但很多内部认知过程其实是视觉的或空间的。我们会想象场景、推理物体之间的关系、规划行动，而这些过程并不天然像文本 token。我不知道这是否就是当前 AI 系统缺失的关键成分，但我怀疑，以文本为主导的训练可能遗漏了一类重要经验：**有现实 grounding、具有空间性、连续发生，而且面向行动的视觉经验。**\n\n\u003cspan id=\"S2.SS9.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### 为什么视觉规模扩展不同于语言规模扩展\n\n\u003cspan id=\"S2.SS9.SSS0.Px2.p1.1\"\u003e\u003c/span\u003e一个核心困难是：视觉不像语言那样，自带清晰的符号单位。语言拥有相对明确的层级：词、短语、句子、文档。现代语言模型使用 subword token，但这些 token 仍建立在人类早已创造出来的符号系统之上。因此，语言并不是原始经验，而是经过压缩的人类经验。视觉则不同。像素层级太低，不能直接充当智能的单位；patch 更多只是工程上的便利，而不是感知的基本原语。人类视觉理解看起来具有以物体为中心、分层组织的特点，会涉及场景、物体、部件和关系 [[64](#bib.bib53), [34](#bib.bib54)]。但视觉领域至今没有一种可以与语言层级相类比、得到广泛认同的层级结构。\n\n这使视觉学习尤其昂贵。一小段文字就可以概括房间里发生了什么，但对应的视觉流包含的信息要多得多：外观、运动、几何、光照，以及大量可能重要、也可能毫无用处的局部细节。视觉没有与语言相当的压缩层。缺少有用的中间单位时，视觉学习系统必须自己发现哪些信息要保留、哪些应忽略，以及如何压缩输入。早期视觉系统人为设定了检测、分割、深度估计等任务。这些抽象当然有用，但它们并不等同于语言 token。无论 bounding box 还是 mask，在表达灵活性上都无法与一个词或一句话类比。因此，我并不认为答案是人工设计一个固定的视觉词汇表。某些形式的视觉智能，可能需要比语言预训练高出数个数量级的有效算力和数据处理量；在一些情境中，也许要达到 1,000 倍甚至 10,000 倍，合适的抽象才会自然涌现。\n\n\u003cspan id=\"S2.SS9.SSS0.Px2.p3.1\"\u003e\u003c/span\u003e视觉世界可以被无限细分，但并非所有细节都有用。如果把所有内容都表示到最细粒度，会浪费巨量算力；如果全部表示得过粗，又会错过真正重要的信息。因此，有用的视觉感知单位必然与任务相关。一个视觉系统应对无关区域保留粗粒度表征，而把细粒度表征资源分配给与任务相关的区域。从这个意义上说，“视觉单位是什么”这个问题，与“应该看哪里”这个问题密不可分。这个观点与主动视觉和 visual routines 的思想一致：感知并不是被动接收，而是为了行为主动选择并组织信息的过程 [[104](#bib.bib55), [83](#bib.bib56), [4](#bib.bib57)]。\n\n这并不是反对规模扩展。事实上，我本身就相信 scaling。就我自己的研究经验而言，只要拥有合适的数据、合适的目标和足够的规模，最简单的方法往往效果最好。因此，我并不想主张手工设计视觉单位、注意力策略或主动感知模块。只要算力足够、模型足够大、视觉经验足够多样，很多关于“如何自适应形成视觉抽象”和“应该看哪里”的行为，完全可能在没有显式工程设计的情况下自然涌现。真正的问题并不是“规模还是结构”，而是：**需要怎样的规模，才能让正确的结构涌现？又怎样把这种规模扩展做得足够高效，真正可用？**\n\n\u003cspan id=\"S2.SS9.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### 这对 VGI 意味着什么\n\n\u003cspan id=\"S2.SS9.SSS0.Px3.p1.1\"\u003e\u003c/span\u003e单纯的数据规模，并不等同于视觉多样性。如果数据高度重复、范围狭窄或存在偏差，那么加入更多图像和视频并不会自然带来更广泛的视觉经验。大规模视觉数据集并不会自动变得多样。即使看起来覆盖面很广的数据集，也可能带有很强的数据集特有 signature；理解这些偏差，本身就是理解模型究竟获得了什么视觉经验的一部分 [[59](#bib.bib58), [107](#bib.bib59)]。除了继续提升模型能力和扩大算力，我们也应更深入地理解：数据集提供了哪些视觉经验、缺失了哪些经验，以及如何筛选出覆盖更广、偏差更小、也更适合学习通用视觉抽象的数据。\n\n\u003cspan id=\"S2.SS9.SSS0.Px3.p2.1\"\u003e\u003c/span\u003e当前大多数系统都没有把视觉设计成一种连续、低摩擦的上下文通道。用户仍需要手动捕捉视觉信息、上传，然后解释这些信息为什么重要。一个更“视觉原生”的系统应该把这种关系反过来：把视觉上下文视为系统、用户与世界之间自然交互的一部分。随着 AI 系统变得更自主、越来越直接面向现实世界，这一点会尤其重要。机器人、实验室助手或医疗系统不可能依赖人类持续描述世界状态 [[20](#bib.bib60)]。它必须自己感知，决定什么重要，发现变化，并用反馈修正行动。视觉并不是在“重要性”上落后于语言；它只是今天在交互界面上的可见度落后于语言。\n\n我希望未来的 VGI 研究能够超越静态图像或视频问答。我们不只应该问“给定一段视觉输入，模型能推断出什么”，还应问：**模型知不知道下一步自己需要看什么？** 我们也应该评估自适应视觉抽象能力，也就是让无关区域保持粗粒度，同时对任务相关细节进行精细检查的能力。对我而言，最关键的检验很简单：一个视觉系统能不能学会**什么时候看、看哪里，以及需要看多细？**\n\n\u003cspan id=\"S2.SS10\"\u003e\u003c/span\u003e\n\n### 2.10 从视觉智能走向通用智能（Hirokatsu Kataoka *等*）\n\n我们把视觉智能理解为这样一种能力：从视觉经验中获得关于世界的可用知识，并把这些知识用于预测、想象、重建和新任务。从这个意义上说，视觉智能就是从视觉经验中涌现出的智能：它能够从不完整的视觉观察中学习可用的、关于可观测世界的结构，理解隐藏结构，预测接下来可能发生什么，重建那些没有被直接观察到的内容，想象可能存在的替代方案，并把这些知识泛化到新的视觉任务。它并不只是一个更强的图像分类器，也不只是一个连接到 LLM 的视觉编码器。\n\n这一观点带来的一个重要结论是：**人类视觉不应成为视觉智能的能力上限。** 一个接触到比人类更丰富视觉信息的系统，可能获得超越人类中心视觉的智能。视觉智能的目标不是模仿人类感知，而是追问：当机器能够以人类无法接触的规模、多样性和精度，从视觉经验中学习时，会涌现出怎样的智能？这一观点也提示了一个横跨人类、动物与机器的共同类比。生物体无需语言，也能通过感知世界、发现规律、预测和行动，表现出智能行为。视觉和感知远早于符号语言出现，因此，类似智能的功能完全可能在没有语言的情况下涌现。对于视觉研究而言，关键问题是：一个足够强大的视觉系统，能否获得关于世界的内部知识，并从这种知识中激发出智能行为？\n\n如果一个模型对世界的理解足够深入，很多能力也许已经潜伏在模型内部。剩下的问题，可能只是怎样把它们激发出来。这是语言模型发展史带给我们的一个重要经验：一个只用简单自回归目标、在大规模文本上训练的模型，只要在上下文中给出少量示例，就能完成新任务。视觉领域可能存在对应形式，也就是真正的**视觉上下文学习（visual in-context learning）**。模型先看到一个新任务的少量视觉示例，推断任务结构，推断合适的输出形式，然后无需显式重新训练，就能解决新的案例。换句话说，如果一个模型已经足够好地捕捉了世界的外观和动态，那么视觉上下文学习可能让我们无需更新参数，就更容易激发出新能力。不过，即使如此，世界模型也只是必要条件，而不是充分条件。智能还要求系统能够在新目标下使用这个模型：推断任务，选择相关抽象，生成反事实，适应新的观察，并采取或给出恰当行动与响应。\n\n我们的核心假设是，视觉智能可能通过三种互补学习目标的汇合而涌现：**序列预测、开放式生成与重建**。它们对应智能的三种基本操作。序列预测回答“接下来会发生什么”；开放式生成探索“可能存在什么”；重建则从不完整观察中推断隐藏结构。单独来看，每一种目标都可能产生非常强大的模型；组合起来，它们则可能定义一条从视觉基础模型走向视觉智能，最终走向通用智能的路径。\n\n自回归视觉学习可能成为视觉领域的 GPT 对应物。在语言中，下一 token 预测看起来很简单，但如果模型真的要预测成功，就必须捕捉语法、语义、事实、篇章、推理模式与任务结构。在视觉中，预测下一个视觉状态可能需要更加丰富的潜在概念。面对图像、视频或具身观察，模型必须推断物体、几何、运动、遮挡、物理约束、相机运动、Agent 行为、时间因果与不确定性。所谓连贯预测，并不只是外推像素，而是要推断使下一次观察变得合理的隐藏结构。如果一个模型能够跨越多样环境和长时间跨度预测未来视觉状态，那么它实际上被迫学习世界如何演化。这种压力天然把系统推向视觉世界建模：模型必须从观察中学习，推断其结构，并预判之后应该出现什么。\n\n生成式学习，就是学习如何想象。与识别相比，生成往往提出更广泛的建模要求，因为识别有时只要找到具有判别力的线索就能成功，而生成则要求模型表示“什么可能存在”。一个高质量生成模型必须学习外观、几何、材质、光照、运动、交互以及合理性。如果这样的模型能够生成高保真图像、视频、3D 场景，以及物理世界可能出现的未来，它就不再只是内容生成器。只要它捕捉的是物理和时间结构，而不仅仅是表面外观，它就可能成为一种内部模拟器的基础。一个能够想象的视觉 Agent，还可以在自己生成的可能性空间里继续学习：构造反事实、检验假设、模拟后果，并在真正行动之前细化自己的理解。从这个意义上说，想象并不是装饰，而是一种学习、理解和思考机制。\n\n重建则提供了一条从不完整观察直接学习隐藏结构的路径。超分辨率、图像修复、逆向渲染、深度估计、多视图重建、3D 重建和 4D 动态重建，都要求模型从有限观察中恢复隐藏原因。其中，可规模扩展的 3D 重建尤其重要。一个能够根据图像实时、准确重建世界的系统，必须获得空间、尺度、对应关系、表面、物体、运动和物理一致性等概念。这样的系统还可能学会检测异常、推断不可见结构，并理解为什么某些观察在物理上合理、另一些则不合理。如果重建能力得到大幅提升，它可能就不再只是一项恢复任务，而会成为一种从视觉证据中恢复物理世界规律的方法。\n\n因此，在走向 AGI 的过程中，视觉智能的角色不是取代语言，而是提供一条具有现实 grounding、并且可能相对独立的路径。语言优先的 AI 已经证明，简单目标在大规模训练下可以涌现出广泛能力。现在，视觉优先的 AI 应该提出对应问题：当模型在大规模视觉经验中学习时，会涌现出什么？一些早期迹象已经出现在视频理解、几何理解、物理理解、具身智能、语言对齐和第一视角感知等系统中。我们不应把这些视为彼此孤立的 demo，而应把它们看成一张更大路线图上的早期坐标：从视觉基础模型走向视觉智能，再从视觉智能走向通用智能。\n\n\u003cspan id=\"S3\"\u003e\u003c/span\u003e\n\n## 3 总结与讨论\n\n\u003cspan id=\"S3.SS1\"\u003e\u003c/span\u003e\n\n### 3.1 各视角总结\n\n本文提出的不同观点，从彼此互补的方向切入视觉通用智能（VGI）。表 [1](#S3.T1) 对这些核心立场作了简要总结。\n\n\u003cspan id=\"S3.T1\"\u003e\u003c/span\u003e\n\n表 1：本文所呈现的视觉通用智能不同观点的简要总结。\n\n总体来看，这些立场大体可以归纳为以下方向：规模扩展与生成建模；创造力、预测、想象与重建；持续学习与终身学习；持久的 3D 与空间世界表征；具身、主动感知与行动；多模态学习与计算效率；科学发现与对陌生环境的泛化；组合式物理结构的恢复；以及不以语言作为主要组织中心的视觉智能形态。\n\n多位作者都把生成式学习置于核心位置。Geirhos 认为，在 Web 规模视觉数据上训练的生成式视频模型可以获得通用能力，因为与任务专用识别相比，生成要求模型解释视觉世界中远更多的内容（第 [2.1](#S2.SS1) 节）。Raghunathan 把生成从“保真”进一步推向“创造力”，要求输出同时具备连贯性、结构多样性、原创性和实用性（第 [2.2](#S2.SS2) 节）。Ramanan 等人把生成视为自监督表征学习可能的终极形态，同时强调多模态与效率（第 [2.4](#S2.SS4) 节）。Du 使用生成式世界模型来支持稳健感知，并把视觉生成作为连接行动的接口（第 [2.7](#S2.SS7) 节）。Kataoka 等人则把生成视为“想象”，并将其与自回归预测、基于重建的结构理解结合起来（第 [2.10](#S2.SS10) 节）。\n\nShangzhe Wu 与 Jiajun Wu 对这种“生成中心”倾向提出了一个互补性的限定（第 [2.8](#S2.SS8) 节）。他们认为，预测像素或生成照片般逼真的输出，并不能单独证明模型理解了物理世界。视觉智能应该恢复产生一次观察的实体、内在属性与外在属性、关系和动力学，使得到的表征能够支持干预、模拟、验证与行动。\n\n其他观点则更强调视觉知识应该如何获得、如何随时间维持，以及如何被使用。Asano 认为，一个具备视觉智能的系统应当在自己的视觉生命历程中不断发展，而不是预训练后就固定不变（第 [2.3](#S2.SS3) 节）。Davison 强调持久但可适应的空间表征、闭环状态估计，以及实时空间 AI 所需要的计算结构（第 [2.6](#S2.SS6) 节）。Du 把持久场景表征进一步连接到行动、主动探索和持续适应。Liu 则进一步提出，视觉原生系统不应只是被动处理预先指定的视觉输入，而必须自己决定**什么时候看、看哪里、需要多少细节**（第 [2.9](#S2.SS9) 节）。\n\n视觉智能的范围也超出了传统视觉识别。Ramanan 等人强调原始多模态经验，包括触觉、音频和本体感觉。Fouhey 从科学场景出发，强调在缺少传统 ground truth 时如何验证，如何处理传感器系统误差和单位，以及如何整合领域知识（第 [2.5](#S2.SS5) 节）。Raghunathan 关于创造力的讨论，同样追问一个系统能否构造出训练经验中从未明确出现过的可能性。\n\n这些观点并没有收敛为一种单一模型、学习目标、表征方式或 VGI 定义。但它们共享一个重要前提：**视觉通用智能不应被简单理解为更准确的图像识别系统，也不应只是一个挂在语言模型上的视觉编码器。** VGI 更关心的是从视觉经验中涌现出的智能：系统能够发现并验证世界结构，随时间维持和更新知识，预测可能的未来，想象替代方案，重建未被观察的结构，并让行为适应陌生情境。对这类知识的最终检验，也不应只看系统能否描述或复现一次观察，还要看它的表征能否被编辑、模拟，并用于支持可靠行动。\n\n因此，由此形成的研究议程远不止“扩大模型规模”。一个核心挑战，是确定如何在一个通用视觉系统中组合生成、组合式物理结构、记忆、空间理解、具身、主动信息获取、多模态经验与持续学习。本文中各观点的多样性提示我们：这些组成部分不应被当作彼此孤立的能力，而应被视为从视觉基础模型走向视觉智能，并可能进一步走向通用智能的一条更广路径中的互补部分。\n\n\u003cspan id=\"S3.SS2\"\u003e\u003c/span\u003e\n\n### 3.2 讨论\n\n\u003cspan id=\"S3.SS2.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### 智能能否从视觉经验中涌现？\n\n在追问视觉智能能否通往通用智能之前，一个更直接的问题是：智能能否从视觉经验本身涌现？今天的 AI 系统常常把视觉当作输入，而把抽象和推理主要交给语言。本文中的多种观点都在挑战这种分工。Asano 认为，物体、深度、运动、持续性与可供性，都可以在被命名之前先被学到。Liu 同样强调，具有现实 grounding、空间性和行动导向的经验，并不能自然还原为文本 token。Shangzhe Wu 与 Jiajun Wu 又进一步指出，视觉观察包含的物理属性和动力学，有些可能从来没有被语言描述过。与 Kataoka 等人的观点一起，这些立场都为一条从视觉经验出发、具有 grounding、并可能相对独立地走向智能的路径留下了空间。\n\n这并不意味着语言或其他模态不再必要。Ramanan 强调音频、触觉和本体感觉，Du 则把视觉连接到行动与物理反馈。开放问题在于：视觉 grounding 应该先于多模态整合形成，还是与多模态整合共同涌现？无论哪种情况，视觉都不应被压缩成一个“本质上仍以语言为中心的系统”的输入通道。\n\n\u003cspan id=\"S3.SS2.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### 规模扩展、生成与物理结构\n\nGeirhos 认为，在大规模视频数据上训练的生成模型，可能获得跨越一系列下游任务的通用能力，而这些任务在训练期间并没有被逐一显式指定。其他观点也从不同语境把这类大规模生成模型视为重要里程碑：Ramanan 把它们连接到表征学习，Du 连接到世界建模与行动，Raghunathan 连接到创造力，Kataoka 等人则连接到想象。\n\n但仅仅扩大训练数据量并不足够。Liu 和 Ramanan 都强调，关键是收集**多样的视觉数据**，而不只是让模型反复接触数量巨大、模式却相似的数据。与此同时，Fouhey 强调需要能够处理那些只能获得少量数据的科学现象。Shangzhe Wu 与 Jiajun Wu 进一步区分了照片级真实外观与物理理解：模型可以生成视觉上合理的事件，却并不一定理解支配这一事件的底层物理属性。因此，我们可能需要进一步研究那些可以被检查、编辑、模拟和验证的物理结构表征。\n\n\u003cspan id=\"S3.SS2.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### 持续学习与评估\n\n一个训练一次后就被冻结的系统，无法适应开放且不断变化的世界。Asano 把 VGI 定义为一个在自身视觉生命历程中不断发展的系统；Du 则主张，具身系统必须主动收集有信息价值的经验，并在部署后持续适应。Davison 的持久空间表征，以及 Ramanan 的长时程有状态模型，都凸显了对**紧凑、可访问、可修订记忆**的需求。Liu 与 Du 还进一步强调，一个智能系统应该主动决定观察什么，并通过行动消除不确定性。\n\n这些要求也会改变我们评估 VGI 的方式。Fouhey 的科学场景强调在缺乏传统 ground truth 时进行验证，以及处理传感器 systematics 和单位；Raghunathan 加入了连贯性、多样性和原创性；Davison 与 Du 要求持久空间理解与可靠行动；Shangzhe Wu 与 Jiajun Wu 则追问：恢复出的结构是否支持干预与模拟，而不只是支持重建。因此，VGI 基准应当评估迁移、持续适应、主动观察、持久世界知识、创造力、物理一致性与效率。很可能不存在一个单一基准能够覆盖所有维度，但彼此孤立的静态任务也显然不会足够。\n\n\u003cspan id=\"S3.SS2.SSS0.Px4\"\u003e\u003c/span\u003e\n\n#### 从视觉功能走向视觉智能\n\n计算机视觉长期以来通过把视觉理解拆解成识别、重建、生成、建图和行动预测等任务来取得进展。这种分解依然有用，但它也鼓励每项任务由一个单独训练的系统处理。一个通用视觉系统则需要跨越任务、时间尺度、环境、表征，甚至潜在的感觉模态运行。它需要保留并修订知识，判断哪些观察重要，并把感知连接到预测和行动。\n\n如果视觉基础模型获得这些性质，那么识别、重建、生成、空间建图与行动，就可能只是访问和检验**同一个系统所持有知识**的不同方式。因此，从视觉基础模型走向视觉智能，将标志计算机视觉进入一个新阶段：研究重点不再只是构建越来越强的视觉功能，而是开始研究**智能本身如何从视觉经验中涌现。**\n\n\u003cspan id=\"S4\"\u003e\u003c/span\u003e\n\n## 4 结论\n\n本文把视觉通用智能作为一项研究议程，围绕两个彼此相关的问题展开：智能如何从视觉经验中涌现，以及这种视觉智能如何可能提供一条通往通用智能的路径。本文汇集的观点并不支持某种单一 VGI 定义、架构、学习目标或实现路线。与其强行把这些立场压缩成一个统一预测，本文呈现的是多种合理且彼此互补的结论。视觉智能可能通过大规模生成式学习、预测、重建、持久空间记忆、持续学习、具身、主动感知、多模态经验，或这些机制中尚未被充分探索的组合方式涌现。\n\n这种多元性本身，就是本文的核心结论之一。我们不应过早把 VGI 定义成某一种模型或某一种能力；它也不应被还原为更强的图像分类器、视频生成器、世界模型，或挂接到语言模型上的视觉编码器。本文提出的不同立场，更倾向于把视觉智能描述为一种更宽广的能力：从视觉经验中获得知识，发现并维持世界结构，想象并评估可能的替代方案，适应新的观察，并把视觉知识用于预测、发现与行动。\n\n现有系统已经展示出视觉智能中的一些重要组成部分，但还没有把它们整合为一个真正通用、能够持续适应的视觉系统。不过，当前模型已经提供了部分且越来越具有启发性的证据。生成式视频模型表现出出乎意料的跨任务能力；重建模型能够恢复越来越丰富的几何与物理结构；空间系统可以随时间维持持久表征；创造性模型能够构造多个合理替代方案；具身 Agent 则通过交互改善自身感知与行为。这些能力仍然彼此碎片化、计算成本很高、时间跨度有限，或高度依赖精心选择的数据与训练条件。但如果把它们放在一起看，它们也许已经构成从“视觉功能”走向“视觉智能”这一更广泛转变中的早期坐标。\n\n因此，现在就问“VGI 是否已经成为通往通用智能的路径”，也许还为时过早。更近的一个里程碑，是先确定：**智能本身能否首先被观察到从视觉经验中涌现。** 这种转变的证据不应只表现为一组固定视觉任务上的性能提升，而应该包括可迁移能力、持久且可修订的世界知识、创造性与反事实推理、主动信息获取、持续适应、空间与物理一致性，以及在陌生情境中的可靠行动。\n\n计算机视觉也许正进入一个新阶段，其核心研究对象将从单个视觉功能，扩展到视觉智能本身的涌现。本文的目的不是宣布哪条路线最终会胜出，而是让各路线背后的假设、相互关系与开放问题变得可见。决定性的原则可能来自本文讨论的某个方向，来自多个方向的汇合，也可能来自一种我们尚未想象出来的方法。因此，留给整个领域的问题已经不只是“如何构建能力更强的视觉模型”，而是：**什么样的证据，才足以让我们相信智能已经开始从视觉中产生？而这种智能最终又将如何参与通用智能的形成？**\n\n## 致谢\n\n本研究由 AIST 研究人员在 FRONTia 项目框架下开展。FRONTia 是由日本经济产业省（METI）与新能源产业技术综合开发机构（NEDO）主导的日本国家级项目，目标是为 AI 机器人与 Physical AI 开发本土多模态基础模型。本研究同时获得日本科学技术振兴机构（JST）“Adopting Sustainable Partnerships for Innovative Research Ecosystem（ASPIRE）”项目支持，项目编号 JPMJAP2518。我们也感谢 CVPR 2026 Workshop on Visual General Intelligence（VGI）的受邀演讲者，他们富有洞见的报告与讨论，为本白皮书提供了重要启发。特别感谢参与 workshop 的 Matt Deitke、Alexei A. Efros、Kristen Grauman、Alex Kendall 和 Andrea Vedaldi。他们的观点帮助我们进一步厘清了围绕视觉智能所存在的多样开放问题。\n\n\u003cspan id=\"bib\"\u003e\u003c/span\u003e\n\n## 参考文献\n\n- \u003cspan id=\"bib.bib92\"\u003e\u003c/span\u003e[1] (2025) A review of learning-based dynamics models for robotic manipulation. Science Robotics 10 (105). 引用位置： [§2.8](#S2.SS8.SSS0.Px1.p1.1).\n- \u003cspan id=\"bib.bib33\"\u003e\u003c/span\u003e[2] J. Alayrac, J. Donahue, P. Luc, A. Miech, I. Barr, Y. Hasson, K. Lenc, A. Mensch, K. Millican, M. Reynolds, R. Ring, E. Rutherford, S. Cabi, T. Han, Z. Gong, S. Samangooei, M. Monteiro, J. Menick, S. Borgeaud, A. Brock, A. Nematzadeh, S. Sharifzadeh, M. Bińkowski, R. Barreira, O. Vinyals, A. Zisserman, and K. Simonyan (2022) Flamingo: a visual language model for few-shot learning. In Advances in Neural Information Processing Systems, Vol. 35, pp. 23716–23736. 引用位置： [§1](#S1.p6.1).\n- \u003cspan id=\"bib.bib23\"\u003e\u003c/sp
