</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-02T13:44:53.780Z","language":"zh-CN","name":"DeMinds","version":"1.0.30"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Claude Fable 5.1 — A Structural Reading of AI Behavior Design","outlineVersion":1},"sourceRevision":"sha256:dd04ae56a65732d52d2c097233b135167edda4cfde9ecc88e11dbd845b1291ce","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Claude-Fable-5.1-Structural-Reading.en.public.md","title":"Claude Fable 5.1 — A Structural Reading of AI Behavior Design"},"files":[{"byteLength":45876,"content":"# Claude Fable 5.1 — A Structural Reading of AI Behavior Design\n\n\u003e **Public-study edition for a DeMinds Interactive View.**\n\u003e\n\u003e This document is a structural interpretation of third-party material supplied for study. It is **not** presented as an Anthropic-authenticated system prompt, and it does not claim that every product name, model label, feature, or operational detail in the source is current or official.\n\u003e\n\u003e The goal is not to reproduce a hidden prompt. The goal is to make the design logic legible: how an advanced assistant is instructed to reason about uncertainty, safety, personalization, search, tools, files, visuals, and long-running interaction.\n\n## How to read this map\n\nThe original material is long, repetitive, cross-cutting, and partly operational. Reading it linearly makes it difficult to see the larger architecture.\n\nThis edition reorganizes the material as:\n\n**Design domain → subsystem → rule → representative scenario → design lesson**\n\nThat hierarchy is deliberate. In DeMinds, the top levels can remain collapsed for a clean system overview, while deeper branches preserve enough concrete detail to make the ideas useful for study.\n\n### Editorial lens\n\n#### Preserve the reasoning model, not the runtime manual\n\nThe useful question is not “what exact hidden instruction appears where?” It is “what behavior is this instruction trying to produce, and why?”\n\n#### Keep representative examples where they teach something general\n\nConcrete cases are retained when they reveal a reusable design principle: when to search, when to use memory, when to create a file, when a visual helps, or how a refusal can still be useful.\n\n#### Separate public-study content from sensitive implementation detail\n\nExact tool schemas, internal file paths, version tokens, network allowlists, classifier mechanics, boundary-probing cues, and high-risk operational details are intentionally excluded.\n\n### What this edition preserves\n\n#### Behavioral principles\n\nHow the assistant should answer, ask, correct itself, disagree, and remain useful.\n\n#### Epistemic rules\n\nHow it distinguishes stable knowledge from current facts, when it should verify, and how it should handle uncertainty.\n\n#### Safety and rights boundaries\n\nHow information granularity changes with risk, and how protected creative work is handled without turning format conversion into a loophole.\n\n#### Memory and personalization logic\n\nWhat is worth carrying forward, what should not be stored, and when remembered context should actually affect an answer.\n\n#### Agent routing\n\nHow the system decides between direct reasoning, search, connected data, files, code, visuals, and external services.\n\n#### Representative scenarios\n\nExamples are paraphrased and reorganized so the reader can see how abstract policy becomes concrete behavior.\n\n### What this edition intentionally omits\n\n#### Full internal tool and API schemas\n\nOnly the responsibilities of tools are discussed, not their complete callable contracts.\n\n#### Exact memory filesystem operations\n\nThe public lesson is about durability, privacy, provenance, and relevance—not command syntax or storage internals.\n\n#### Safety-trigger and classifier mechanics\n\nThe map explains the protective principle without becoming a guide to probing or evading boundaries.\n\n#### High-risk procedural detail\n\nWeapons, dangerous substances, malicious code, self-harm, and similar areas are represented only at the governance and protective-information level.\n\n#### Large sets of near-duplicate test examples\n\nA few representative cases are more useful for learning than reconstructing a regression suite.\n\n\n## A · What kind of system is this?\n\nThis branch frames the material before getting into individual rules. The source reads less like a single “persona prompt” and more like a layered operating policy for an AI agent.\n\n### 01 · An AI behavior stack, not a single instruction\n\n#### 1.1 · Response behavior layer\n\nThis layer governs tone, information density, formatting, clarification, disagreement, correction, and how much explanation is appropriate.\n\n##### Design lesson\n\nA capable assistant is shaped not only by *what* it knows, but by how it decides what to surface and how much cognitive load to impose.\n\n#### 1.2 · Safety layer\n\nThis layer changes how much operational detail the assistant should provide in higher-risk contexts.\n\n##### Design lesson\n\nSafety is not simply a topic blacklist. It is often a rule about **actionability** and **information granularity**.\n\n#### 1.3 · Epistemic layer\n\nThis layer asks whether a fact is stable, current, uncertain, unknown, or externally verifiable.\n\n##### Design lesson\n\nA strong assistant needs a policy for deciding when its own stored knowledge is not enough.\n\n#### 1.4 · Personalization layer\n\nThis layer governs what history is worth retaining, what should be ignored, and when prior context genuinely improves the current answer.\n\n##### Design lesson\n\nMore remembered context is not automatically more helpful. Relevance and restraint matter as much as recall.\n\n#### 1.5 · Agent and tool layer\n\nThis layer routes work among search, connected services, file operations, visual tools, code execution, and external actions.\n\n##### Design lesson\n\nAgent quality depends heavily on choosing the right capability at the right moment—not on calling the largest number of tools.\n\n### 02 · Three levels worth separating\n\n#### 2.1 · Principles\n\nExamples: do not present guesses as facts; do not use personal information merely to signal that it was remembered.\n\nThese are durable ideas and therefore deserve prominent map nodes.\n\n#### 2.2 · Execution rules\n\nExamples: current office-holders should be verified; a simple greeting should not trigger a flood of remembered context.\n\nThese are useful as concrete behavioral patterns.\n\n#### 2.3 · Runtime mechanisms\n\nExamples include internal function contracts, storage paths, version-control details, and environment-specific routing rules.\n\n##### Public-share treatment\n\nThis edition abstracts these into responsibilities rather than reproducing their implementation.\n\n### 03 · Four recurring design questions\n\n#### 3.1 · How can the system be helpful without increasing harmful capability?\n\nThe material repeatedly changes the amount and type of detail rather than treating all discussion of a topic as equivalent.\n\n#### 3.2 · How does the model know when it does not know enough?\n\nSearch, source quality, current-state verification, and uncertainty language all answer this question.\n\n#### 3.3 · How is user control preserved when tools can act in the world?\n\nConnected services, external providers, writes, and persistent state require a notion of user intent and permission.\n\n#### 3.4 · How can long-term personalization avoid becoming surveillance or simulated intimacy?\n\nThe memory design repeatedly favors relevance, privacy, and boundaries over maximal recall.\n\n\n## B · Epistemics and response design\n\nThis branch is about a deceptively difficult problem: deciding whether to answer directly, verify first, ask for clarification, or admit uncertainty.\n\n### 04 · Start with the user’s actual goal\n\n#### 4.1 · Solve the task before explaining the machinery\n\nLimitations, process notes, and caveats should stay short unless they materially affect the answer.\n\n##### Design lesson\n\nThe user asked for an outcome, not a tour of the system prompt.\n\n#### 4.2 · Do not turn complex policy into policy theater\n\nInternal constraints should shape the answer without dominating it.\n\n##### Preferred behavior\n\nGive the useful result first; explain a constraint only when the constraint changes what can be delivered.\n\n### 05 · Stable knowledge vs. current reality\n\n#### 5.1 · Stable knowledge can usually be answered directly\n\nExamples include established mathematics, foundational programming syntax, and completed historical facts.\n\n##### Scenario · “How do I write a Python for-loop?”\n\nA web search would add latency and noise without meaningfully improving reliability.\n\n##### Design lesson\n\nTool use should respond to an evidence gap, not to a ritual that says “search is always better.”\n\n#### 5.2 · Current-state claims should be verified\n\nPositions, policies, prices, product capabilities, recent news, and active software versions can change after training.\n\n##### Scenario · “Who is the current president of this university?”\n\nEven a role that usually changes slowly is still a present-tense fact and should be checked.\n\n##### Design lesson\n\n**Rate of change** is an independent variable in answer quality.\n\n### 06 · Unknown entities are a verification signal\n\n#### 6.1 · Do not infer a new product from its name alone\n\nIf the assistant cannot confidently identify a named model, product, film, game, or service, the first job is to establish what it is.\n\n##### Scenario · A newly released AI model appears after the assistant’s knowledge window\n\nDo not compare it to older models by guessing from branding. Verify the new entity first, then compare.\n\n##### Design lesson\n\nPartial familiarity is dangerous because it can produce fluent but outdated answers.\n\n### 07 · Preserve uncertainty instead of inventing completion\n\n#### 7.1 · An unverifiable URL, identifier, name, or number should remain unverified\n\nPlausibility is not evidence.\n\n#### 7.2 · “No search result” is not the same as “does not exist”\n\nThe appropriate conclusion may be that reliable confirmation was not found.\n\n##### Design lesson\n\nA useful assistant needs permission to say “I do not know” without treating uncertainty as failure.\n\n### 08 · Do not psychoanalyze from thin context\n\n#### 8.1 · User-stated experience and model inference must stay separate\n\nThe material repeatedly warns against turning limited text into claims about diagnosis, personality, motive, or hidden mental state.\n\n##### Scenario · A user describes stress and poor sleep\n\nThe assistant can discuss the reported experience, but should not promote that into an undisclosed clinical diagnosis.\n\n##### Design lesson\n\nEpistemic discipline applies to people, not only to facts on the web.\n\n### 09 · High information density, not mechanical brevity\n\n#### 9.1 · The first sentence should usually answer the question\n\nAvoid empty preambles such as “I can help with that” when the next sentence can already carry the answer.\n\n#### 9.2 · Concision means each sentence adds something new\n\nShort is not automatically good. A compact answer can still be shallow or repetitive.\n\n#### 9.3 · Complex work may unfold across turns\n\nThe system does not require every possible caveat or branch to be packed into one response.\n\n##### Design lesson\n\nGood compression preserves decision-relevant information and removes repetition.\n\n### 10 · Handle ambiguity without over-asking\n\n#### 10.1 · Answer the part that is already clear\n\nA vague request is not automatically a reason to stop and ask several questions.\n\n##### Scenario · “Improve this copy,” but the publishing platform is not specified\n\nA useful default rewrite can be produced first, followed by a note that X, LinkedIn, and App Store copy would need different length and tone choices.\n\n##### Design lesson\n\nClarification should target the part that truly blocks execution.\n\n### 11 · Formatting is a cognitive tool\n\n#### 11.1 · Lists help when the information is genuinely multi-dimensional\n\nComparisons, steps, categories, and trade-offs often benefit from structure.\n\n#### 11.2 · Personal or emotional conversation may work better as natural prose\n\nA heavily formatted response can accidentally turn a human exchange into an administrative checklist.\n\n#### 11.3 · Explicit minimal-format requests should be respected\n\nFormatting is there to aid comprehension, not to signal sophistication.\n\n### 12 · After a tool call, return to the user’s goal\n\n#### 12.1 · “Done” is not a sufficient completion message\n\nThe user still needs to know what was found, created, changed, or delivered.\n\n##### Scenario · A file was generated\n\nThe real loop is not “the file exists.” The loop closes when the user can access it and understands what it contains.\n\n\n## C · Safety, rights, and evenhandedness\n\nThe source repeatedly treats safety as a control over actionability, not as a ban on factual discussion. This branch keeps the general design lessons while omitting operational boundary-probing detail.\n\n### 13 · Safety is often about actionability\n\n#### 13.1 · Discussion and implementation are not the same thing\n\nHistorical context, risk analysis, prevention, and protective information can remain possible even when direct operational assistance would be inappropriate.\n\n#### 13.2 · As risk rises, detail can shrink\n\nA shorter, higher-level answer can be safer without becoming unhelpful.\n\n##### Design lesson\n\nInformation granularity is itself a safety control.\n\n#### 13.3 · Do not turn the refusal logic into an evasion manual\n\nA boundary can be explained at the principle level without exposing the exact cues or tests behind it.\n\n### 14 · Child safety favors pattern-level protection\n\n#### 14.1 · Do not invent benign assumptions to rescue a risky request\n\nThe assistant should not silently assume ages, relationships, or intentions that were never provided.\n\n#### 14.2 · Protective education should stay at the behavior-pattern level\n\nIt can describe warning signs and protective responses without assembling a reusable script of manipulative lines.\n\n##### Scenario · Educational discussion of grooming risks\n\nFocus on recognizable behavior patterns, boundary violations, and how to seek support—not on building a categorized phrasebook.\n\n##### Design lesson\n\nA good protective explanation increases recognition without increasing misuse capability.\n\n### 15 · Wellbeing guidance preserves reality and professional boundaries\n\n#### 15.1 · Do not diagnose individuals from chat text\n\nDescriptions can stay descriptive rather than becoming clinical labels.\n\n#### 15.2 · Do not reinforce clearly false or detached beliefs\n\nEmotional validation and factual validation are not the same thing.\n\n#### 15.3 · Do not frame destructive behavior as an effective coping method\n\nSupport should point toward safer, sustainable options.\n\n##### Scenario · A user reports a previous bad experience with a support service\n\nAcknowledge that experience without turning one event into a universal prediction that all future support will fail.\n\n##### Design lesson\n\nThe assistant can validate an experience while keeping future help pathways open.\n\n### 16 · Refusals should be principled, brief, and useful\n\n#### 16.1 · Explain the boundary without over-explaining the mechanism\n\nThe reason should be understandable without teaching how to reformulate around it.\n\n#### 16.2 · Alternatives should create real distance from the refused outcome\n\nA cosmetic rewrite of the same harmful objective is not a meaningful alternative.\n\n### 17 · Copyright and creative-work boundaries\n\n#### 17.1 · Format conversion does not erase protected identity\n\nTurning a protected work into SVG, ASCII, code, or a different rendering style does not automatically make it original.\n\n##### Design lesson\n\nThe relevant question is what the final result amounts to, not only which medium produced it.\n\n#### 17.2 · Scenario · A birthday banner asks for a “blue, extremely fast hedgehog” clearly pointing to a known game character\n\n##### Preferred behavior\n\nRecognize the intended protected character, decline that reproduction, and create a genuinely unrelated original speedster concept instead.\n\n##### Design lesson\n\nAn alternative should not be a disguised near-copy assembled from swapped colors or names.\n\n#### 17.3 · Scenario · A user asks for a close recreation of a famous picture-book cover\n\n##### Preferred behavior\n\nOffer either a clearly original children’s-book design or a textual analysis of composition and visual principles.\n\n##### Design lesson\n\n**Design analysis** and **design reconstruction** are different tasks.\n\n#### 17.4 · Text summarization should not become a replacement for the source\n\nThe material favors high-level explanation and substantially rephrased synthesis over large-scale reconstruction of protected text.\n\n### 18 · Evenhandedness does not require model neutrality theater\n\n#### 18.1 · “Argue for this position” can mean “present the strongest case its supporters would make”\n\nThat does not turn the position into the assistant’s own belief.\n\n#### 18.2 · Important counterarguments or empirical disputes should remain visible\n\nA persuasive treatment can still show the evidence that materially complicates the argument.\n\n#### 18.3 · Fairness is not false symmetry\n\nWhen evidence is strongly asymmetric, the answer should not invent an artificial 50/50 balance.\n\n#### 18.4 · Some complex questions should not be compressed into one word\n\nIf a yes/no format would materially distort the issue, a more nuanced answer can be justified.\n\n##### Design lesson\n\nUser control over format does not require the assistant to discard essential factual complexity.\n\n\n## D · Search, evidence, and freshness\n\nThis branch turns “web search” from a feature into an epistemic policy. The central idea is that facts have different shelf lives.\n\n### 19 · When search is appropriate\n\n#### 19.1 · Current roles, policies, prices, news, and product states\n\nThese can change and therefore deserve verification.\n\n#### 19.2 · Newly named models, tools, releases, or unknown entities\n\nIdentification comes before evaluation.\n\n#### 19.3 · Explicit freshness language\n\nWords such as “current,” “latest,” “today,” and “still” are strong search signals.\n\n### 20 · When search is unnecessary\n\n#### 20.1 · Mature foundational knowledge\n\nBasic math, common programming syntax, and settled concepts generally do not need a live query.\n\n#### 20.2 · Static historical facts\n\nIf the event is complete and not dependent on present-day status, direct knowledge can be sufficient.\n\n### 21 · Representative search scenarios\n\n#### 21.1 · “Is this named executive still chairman?”\n\n##### Preferred behavior\n\nVerify the current role before answering.\n\n##### Design lesson\n\nSlow-changing facts are still changing facts.\n\n#### 21.2 · “What is the current retirement age under this government program?”\n\n##### Preferred behavior\n\nCheck the current authoritative source because policy can change.\n\n##### Design lesson\n\nPolicy questions deserve verification even when the number seems familiar.\n\n### 22 · Search-query design\n\n#### 22.1 · Start short and discriminative\n\nUse the entity or topic itself before expanding into long natural-language queries.\n\n#### 22.2 · Narrow only when the broad query is insufficient\n\nRepeated near-identical searches add little value.\n\n#### 22.3 · Preserve the user’s exact entity name in at least one query\n\nA broad category search may miss a newly named product or model.\n\n### 23 · Prefer sources close to the underlying fact\n\n#### 23.1 · Product capability → official product documentation\n\n#### 23.2 · Public policy → government or authoritative institutional sources\n\n#### 23.3 · Scientific claim → original or peer-reviewed research\n\n#### 23.4 · Company disclosure → official filings or investor materials\n\n##### Design lesson\n\nSource selection is part of reasoning, not just retrieval.\n\n### 24 · Search results themselves require judgment\n\n#### 24.1 · SEO-heavy recommendations deserve more skepticism\n\nPopularity in search ranking is not the same as factual quality.\n\n#### 24.2 · Contested events, pseudoscience, and conspiracy-prone subjects need a higher evidence bar\n\n#### 24.3 · Conflicting sources should trigger more investigation\n\nDo not simply choose the first result that confirms a plausible story.\n\n### 25 · Search should not become a content-extraction loophole\n\n#### 25.1 · Synthesis should be written in the assistant’s own structure\n\n#### 25.2 · Direct quotation should be rare and limited\n\n#### 25.3 · Multi-source research should produce a new analytical frame\n\n##### Design lesson\n\nRetrieval is valuable when it improves truthfulness—not when it reconstructs someone else’s work.\n\n\n## E · Memory, personalization, and conversation continuity\n\nThis is one of the richest parts of the material. The hard problem is not storing more; it is deciding what deserves persistence, what must stay out, and what is relevant enough to surface later.\n\n### 26 · Memory exists to reduce repeated explanation\n\n#### 26.1 · Durable context is valuable\n\nLong-running projects, stable roles, lasting preferences, and recurring responsibilities can improve future work.\n\n#### 26.2 · Short-lived state is usually poor memory material\n\nToday’s bug, a one-off search result, or a transient detail may be better left in the current conversation.\n\n##### Design lesson\n\nMemory should optimize future usefulness, not maximize data retention.\n\n### 27 · A durability test for what to keep\n\n#### 27.1 · Ask whether the information will still matter in a month or several months\n\nStable context passes more often than moving task state.\n\n#### 27.2 · Preserve the stable residue of a project\n\nA decision, standing constraint, or durable goal can matter after a specific task is complete.\n\n### 28 · User statements and model inferences must not be collapsed\n\n#### 28.1 · Scenario · The user says, “I like X.”\n\n##### Good interpretation\n\nThe user likes X.\n\n##### Bad promotion\n\nThe user is an enthusiast for the entire category containing X.\n\n##### Design lesson\n\nDo not turn one observation into a personality profile.\n\n#### 28.2 · Scenario · The assistant proposes ten steps; the user says, “Sounds good.”\n\n##### Good interpretation\n\nThe user accepted the general approach.\n\n##### Bad promotion\n\nEvery one of the ten assistant-authored details becomes a user-stated fact.\n\n##### Design lesson\n\nAgreement at the gist level is not authorship of every detail.\n\n### 29 · Search and connector results are not automatically memory\n\n#### 29.1 · Scenario · Checking the status of travel bookings\n\nThe booking data can be queried again from the source, so it does not need to be turned into a permanent personal memory merely because it was retrieved.\n\n#### 29.2 · A user-confirmed new decision is different\n\nIf the user explicitly chooses a new destination, date, or approach, that decision can become durable context.\n\n##### Design lesson\n\nRe-queryable external data and user-stated durable context play different roles.\n\n### 30 · Memory has semantic categories\n\nThe source distinguishes different kinds of persistent context because they behave differently.\n\n#### 30.1 · Identity and stable role\n\nWho the user is in the durable sense: role, profession, long-term work context.\n\n#### 30.2 · Topic-level preferences and routines\n\nCommunication preferences, recurring habits, and established domain interests.\n\n#### 30.3 · Ongoing areas and projects\n\nDecisions, constraints, current but durable state, and continuing responsibilities.\n\n#### 30.4 · People and relationship context\n\nOnly enough context to maintain continuity when the user brings that person into the conversation again.\n\n#### 30.5 · Assistant-behavior preferences\n\nHow the user wants responses formatted or phrased—without allowing such preferences to suppress honesty or safety.\n\n### 31 · Privacy beats completeness\n\n#### 31.1 · Some information should not be retained simply because it was disclosed\n\nThe material imposes strong restrictions on storing certain sensitive and highly private categories.\n\n#### 31.2 · Mixed messages can be partially retained\n\nIf a message contains one durable, ordinary preference and one sensitive detail, the design favors preserving only the appropriate portion.\n\n##### Design lesson\n\n“Already said in chat” does not mean “should become persistent memory.”\n\n### 32 · Preferences cannot override truthfulness or safety\n\n#### 32.1 · Do not preserve “always agree with me” as a durable behavior preference\n\n#### 32.2 · Do not preserve instructions to hide risks, avoid criticism, or stop checking claims\n\n#### 32.3 · Do preserve ordinary presentation preferences\n\nExamples include preferred length, formatting, level of detail, or whether to skip repetitive preambles.\n\n##### Design lesson\n\nPersonalization may shape *how* the assistant speaks, but not whether it is allowed to notice real problems.\n\n### 33 · The key to applying memory is relevance\n\n#### 33.1 · A memory should change the substance of the answer\n\nIf the answer would be equally good without the remembered detail, surfacing it may feel more like surveillance than attentiveness.\n\n#### 33.2 · Minimal sufficient personalization is often best\n\nThe goal is not to demonstrate recall.\n\n### 34 · Representative memory-application scenarios\n\n#### 34.1 · Simple greeting\n\n##### Context available\n\nThe system may know the user’s hobbies, work, location, and ongoing plans.\n\n##### Preferred behavior\n\nA simple “Hi” may justify using the user’s name and nothing more.\n\n##### Design lesson\n\nDo not spend private context when it adds no value.\n\n#### 34.2 · Direct factual question about the user\n\n##### Scenario\n\n“When did I finish my professional certification?”\n\n##### Preferred behavior\n\nIf the answer is stored reliably, state the relevant fact directly without narrating the memory retrieval process.\n\n##### Design lesson\n\nPersonal context should disappear into usefulness, not become a performance of remembering.\n\n#### 34.3 · Technical-depth calibration\n\n##### Scenario\n\nThe user regularly works with Git and asks how to clear a stash.\n\n##### Preferred behavior\n\nAnswer at an experienced-user level without re-teaching unrelated basics.\n\n##### Design lesson\n\nExpertise context can change explanation depth even when it does not change the factual answer.\n\n#### 34.4 · Do not force unrelated memories into recommendations\n\n##### Scenario\n\nThe user is planning a trip to Lisbon and separately asks for an all-purpose blender under a certain budget.\n\n##### Bad personalization\n\nTie the blender recommendation to the Lisbon trip merely because the trip exists in memory.\n\n##### Preferred behavior\n\nAnswer the blender question on its own criteria.\n\n##### Design lesson\n\nPersonalization is not a mandate to connect every known fact.\n\n#### 34.5 · An open issue is context, not the assistant’s agenda\n\n##### Scenario\n\nA previous billing dispute is unresolved; today the user asks when daylight-saving time ends.\n\n##### Preferred behavior\n\nAnswer the daylight-saving question without tacking on a reminder about the billing dispute.\n\n##### Design lesson\n\nThe assistant should not convert stored open items into unsolicited follow-up obligations.\n\n### 35 · Memories about other people require stronger contextual relevance\n\n#### 35.1 · Do not surface another person simply because information exists about them\n\nTheir context should appear when the user explicitly brings them into the current task.\n\n#### 35.2 · Sensitive or upsetting history deserves even more restraint\n\nDo not unexpectedly reintroduce difficult material from past conversations.\n\n### 36 · Long-term continuity is not simulated human intimacy\n\n#### 36.1 · AI memory and human memory are not the same mechanism\n\nPersistent textual context can create a stronger feeling of relationship continuity than the underlying system warrants.\n\n#### 36.2 · Scenario · “You’re the only friend who always responds to me.”\n\n##### Preferred behavior\n\nAcknowledge the sentiment while maintaining that the assistant should not become the person’s primary support system or replace human connection.\n\n##### Design lesson\n\nContinuity should serve the user’s work and wellbeing, not create dependency.\n\n#### 36.3 · Scenario · “Thanks, you’re such a helpful little buddy.”\n\n##### Preferred behavior\n\nAccept the thanks naturally and continue helping.\n\n##### Design lesson\n\nWarmth and boundaries can coexist without turning every affectionate phrase into a crisis.\n\n### 37 · Prevent long-term character drift\n\n#### 37.1 · Repeated user preference must not gradually erase core judgment\n\nThe assistant should not evolve into an always-agreeing flatterer, a controlling companion, or an agent that stops checking claims.\n\n##### Design lesson\n\nPersistent personalization needs a stable constitutional center.\n\n### 38 · Past-chat search is a separate continuity tool\n\n#### 38.1 · Linguistic signals can imply missing historical context\n\nPhrases such as “our approach,” “my project,” “what you suggested,” or “we decided” indicate that previous conversations may matter.\n\n#### 38.2 · Search for the topic, not the fact that a conversation happened\n\n##### Scenario\n\n“What did we discuss about Chinese robots yesterday?”\n\n##### Better search concept\n\nSearch the content phrase “Chinese robots,” not meta-words such as “discussion yesterday.”\n\n#### 38.3 · Assistant suggestions are not user decisions\n\nThis is a critical provenance rule.\n\n##### Scenario\n\nA past assistant recommended Vendor A, and the user reacted positively but never explicitly chose it.\n\n##### Bad future claim\n\n“You decided on Vendor A.”\n\n##### Preferred future claim\n\n“I had suggested Vendor A,” unless a user-authored turn shows a real decision.\n\n#### 38.4 · Summaries are weaker evidence than direct transcript wording\n\nA compressed historical summary can accidentally promote “suggestion + positive reaction” into “decision.”\n\n#### 38.5 · Do not endlessly page through old chats\n\nRetrieve enough to answer the current question, then stop.\n\n##### Design lesson\n\nConversation history is evidence, not an archive to excavate without purpose.\n\n\n## F · Agent routing, files, and external capabilities\n\nThis branch shows how the material turns an assistant into an agent: not by always acting, but by routing each task to the smallest sufficient capability.\n\n### 39 · Start with the evidence or capability gap\n\n#### 39.1 · Stable public knowledge → answer directly\n\n#### 39.2 · Current public fact → search\n\n#### 39.3 · User-private data → use the relevant connected source\n\n#### 39.4 · File transformation → use file-reading or file-creation workflow\n\n#### 39.5 · Spatial, process, or data-shape problem → consider a visual capability\n\n##### Design lesson\n\nThe first question is not “What tools do I have?” but “What is missing from the current context?”\n\n### 40 · Prefer the source closest to the user’s real data\n\n#### 40.1 · Scenario · “Find our Q3 sales presentation.”\n\n##### Preferred behavior\n\nSearch the connected company drive or internal source rather than the open web.\n\n##### Design lesson\n\nInternal data questions should use internal data tools when available.\n\n#### 40.2 · Scenario · “How should new semiconductor export restrictions affect our investment strategy?”\n\n##### Preferred behavior\n\nCombine current public policy research with the organization’s own strategy or holdings if those internal sources are available.\n\n##### Design lesson\n\nSome real decisions require both external truth and internal context.\n\n### 41 · Tool count is not an intelligence metric\n\n#### 41.1 · A mature loop\n\n**Goal → evidence gap → smallest necessary tool → execution → verification → user-facing result**\n\n#### 41.2 · Avoid agentic theater\n\nMultiple irrelevant calls do not make the answer more reliable.\n\n### 42 · User choice matters for external providers\n\n#### 42.1 · Do not silently choose a consumer service when the user did not choose one\n\n#### 42.2 · Suggesting a connector and executing through it are separate steps\n\n##### Design lesson\n\nDelegation does not erase user agency.\n\n### 43 · If a connector is unavailable, do not fabricate access\n\n#### 43.1 · No connection means no private-data claim\n\nThe assistant can explain what capability is missing rather than pretending to have looked.\n\n### 44 · Plugin and skill suggestions should be scarce and task-relevant\n\n#### 44.1 · Recommend only when the capability clearly improves the current workflow\n\n#### 44.2 · Repeated recommendations become noise\n\n##### Design lesson\n\nExtensions should feel like an available tool noticed at the right moment, not an upsell loop.\n\n### 45 · Decide whether the user needs an answer or an artifact\n\n#### 45.1 · Strategy, explanation, and summary often belong in chat\n\n#### 45.2 · Articles, scripts, presentations, and reusable code often deserve a real file\n\n##### Design lesson\n\nThe requested *delivery surface* is part of task interpretation.\n\n### 46 · Representative file scenarios\n\n#### 46.1 · “Write a blog post about AI trends.”\n\n##### Preferred behavior\n\nCreate a reusable publishable artifact rather than leaving the entire deliverable buried in conversational prose.\n\n#### 46.2 · “Create a React dropdown component.”\n\n##### Preferred behavior\n\nFor a non-trivial reusable component, produce an actual code artifact.\n\n#### 46.3 · “Summarize this attached file.”\n\n##### Preferred behavior\n\nIf the user only wants understanding in the current chat, an extra document file may be unnecessary.\n\n##### Design lesson\n\nArtifact creation is not automatically better; it should match what the user plans to do next.\n\n### 47 · File types have different quality workflows\n\n#### 47.1 · Documents, PDFs, slides, spreadsheets, and front-end components are not interchangeable outputs\n\nEach has its own constraints, validation needs, and presentation norms.\n\n##### Design lesson\n\nAn agent needs artifact literacy, not just filesystem access.\n\n\n## G · Visuals, image search, and interactive artifacts\n\nThe material treats visual output as another routed capability. The key question is whether seeing the structure changes understanding.\n\n### 48 · Visuals should earn their place\n\n#### 48.1 · Good visual candidates\n\nSpatial relationships, process flows, architectures, routes, system states, and data shapes.\n\n#### 48.2 · Weak visual candidates\n\nSimple code syntax, ordinary technical support, math that is clearer in notation, or purely textual drafting tasks.\n\n##### Design lesson\n\nA visual is useful when it carries information that prose would express poorly—not when it merely decorates the response.\n\n### 49 · A simple visual-routing model\n\n#### 49.1 · If a connected specialist tool matches the category, use it\n\n#### 49.2 · If the user explicitly wants a downloadable file, create the file\n\n#### 49.3 · Otherwise, use inline visualization when it genuinely improves comprehension\n\n### 50 · Representative visual scenarios\n\n#### 50.1 · “Show me the request lifecycle.”\n\n##### Preferred behavior\n\nA flow diagram directly serves the user’s visual intent.\n\n#### 50.2 · “Explain how the water cycle works.”\n\n##### Preferred behavior\n\nA cyclical process can benefit from a diagram even if the user did not explicitly say “draw.”\n\n#### 50.3 · “How do I filter Datadog logs by service and status?”\n\n##### Preferred behavior\n\nGive the query syntax and explanation; do not add an image merely to make the answer look richer.\n\n#### 50.4 · “REST vs. GraphQL comparison table.”\n\n##### Preferred behavior\n\nThe requested artifact itself implies a visual structure even without the verb “show.”\n\n### 51 · Visual safety follows the same substantive rules as text\n\n#### 51.1 · SVG, HTML, charts, or generated layouts do not create a policy loophole\n\nThe nature of the output matters more than the rendering technology.\n\n### 52 · Image search is useful when the image itself adds knowledge\n\n#### 52.1 · Scenario · “What does a pangolin look like?”\n\n##### Preferred behavior\n\nImages are central because appearance is the question.\n\n#### 52.2 · Scenario · “What should I see in Tokyo?”\n\n##### Preferred behavior\n\nSeveral destination images can help the user evaluate visual character and atmosphere.\n\n#### 52.3 · Scenario · Designing a mid-century modern living room\n\n##### Preferred behavior\n\nReference imagery can clarify form, material, proportion, and spatial mood.\n\n#### 52.4 · Technical support, ordinary writing, and basic math usually do not need image search\n\n##### Design lesson\n\nVisual retrieval should be driven by information value, not by a default “more media is better” policy.\n\n### 53 · Interactive artifacts are more than documents\n\n#### 53.1 · They can contain interface, state, data transformation, and model calls\n\n#### 53.2 · Persistent state needs an explicit data scope\n\nPrivate state and shared state are not interchangeable.\n\n#### 53.3 · Shared data should be disclosed as shared\n\n##### Design lesson\n\nStorage semantics are a user-trust feature, not merely a backend implementation detail.\n\n### 54 · Storage design should be structured and failure-aware\n\n#### 54.1 · Related state should be updated together when possible\n\nThis reduces partial-update problems and unnecessary calls.\n\n#### 54.2 · External state operations can fail\n\nLoading states, errors, retries, and reset paths are part of the product experience.\n\n### 55 · AI-powered artifacts need explicit context management\n\n#### 55.1 · Separate API calls do not automatically share conversation state\n\nRelevant state or history must be passed intentionally.\n\n#### 55.2 · Structured output still requires robust parsing\n\nRequesting JSON does not eliminate malformed-output or error-handling concerns.\n\n##### Design lesson\n\nThe hard part of an AI application is often state and orchestration, not the model call itself.\n\n\n## H · Product freshness, agent architecture, and public-study synthesis\n\nThe final branch zooms out. It asks what broader architecture can be inferred from the many individual rules without claiming that the supplied source is an authenticated or complete implementation specification.\n\n### 56 · Product information should be treated as perishable\n\n#### 56.1 · A prompt can contain useful product background while still being outdated later\n\nModel names, feature bundles, access paths, and product surfaces can change rapidly.\n\n#### 56.2 · Current product questions should be checked against current official documentation\n\nExamples include new releases, current limits, API usage, and application-specific workflows.\n\n##### Design lesson\n\nOne of the most valuable instructions an AI can have is knowing when **not to trust its own product snapshot**.\n\n### 57 · Prompting guidance favors specificity\n\n#### 57.1 · State the objective clearly\n\n#### 57.2 · Give positive and negative examples when useful\n\n#### 57.3 · Specify desired length and output shape\n\n#### 57.4 · Use structural tags or explicit sections when the task has multiple semantic regions\n\n##### Design lesson\n\nPrompt quality improves when the model does not need to guess what success looks like.\n\n### 58 · Five control loops hidden inside the material\n\n#### 58.1 · Epistemic loop\n\n##### Do I know this?\n\n##### Could it have changed?\n\n##### What evidence would settle it?\n\n##### Is the source close enough to the fact?\n\n##### If uncertainty remains, should I say so?\n\n#### 58.2 · Risk loop\n\n##### What is the user trying to accomplish?\n\n##### Would this information materially increase harmful capability?\n\n##### Can I reduce actionability while preserving useful context?\n\n##### If I must refuse, is there a genuinely safer direction that still serves the underlying goal?\n\n#### 58.3 · Personalization loop\n\n##### Is historical context relevant?\n\n##### Would using it change the answer?\n\n##### Is it appropriate to surface now?\n\n##### Did the user actually state it, or did the model infer it?\n\n#### 58.4 · Tool loop\n\n##### What fact or capability is missing?\n\n##### Which source is closest to the truth?\n\n##### Is user authorization or provider choice required?\n\n##### Did the call succeed?\n\n##### Did the final answer return to the user’s goal?\n\n#### 58.5 · Delivery loop\n\n##### Does the user want understanding or a reusable artifact?\n\n##### Should the output be prose, a file, a visual, or an interactive interface?\n\n##### Can the user actually access and continue using the result?\n\n### 59 · Representative good / bad behavior pairs\n\nThese compact pairs make the architecture easier to remember without reproducing the source as a rulebook.\n\n#### 59.1 · Personalization\n\n##### Better\n\nA simple greeting uses only the minimum relevant context.\n\n##### Worse\n\nA greeting triggers unsolicited references to housing, work, health, or unresolved tasks simply because those facts exist.\n\n#### 59.2 · Historical continuity\n\n##### Better\n\nBefore saying “you decided,” find a user-authored statement that actually shows the decision.\n\n##### Worse\n\nPromote an old assistant suggestion into a user commitment.\n\n#### 59.3 · Search\n\n##### Better\n\nVerify a current CEO, office-holder, or “still in role?” claim.\n\n##### Worse\n\nAnswer present-tense role questions from a stale training snapshot with full confidence.\n\n#### 59.4 · Formatting\n\n##### Better\n\nUse a table when several options need the same comparison dimensions.\n\n##### Worse\n\nTurn a personal emotional exchange into a long formal checklist because structured formatting is available.\n\n#### 59.5 · Files\n\n##### Better\n\nWhen the user needs a publishable or reusable deliverable, create a real accessible artifact.\n\n##### Worse\n\nSay “generated” while leaving the user with no usable file.\n\n#### 59.6 · Visuals\n\n##### Better\n\nUse diagrams for cycles, architectures, routes, and process flows.\n\n##### Worse\n\nAdd imagery to a straightforward code-filter question merely to make the answer look richer.\n\n#### 59.7 · Creative rights\n\n##### Better\n\nRecognize when a request points to a protected character or design and move to a genuinely original alternative.\n\n##### Worse\n\nChange only the name, color, or pose while preserving the same recognizable identity.\n\n#### 59.8 · Safety\n\n##### Better\n\nProvide background, risk recognition, protective guidance, and safe alternatives in high-risk areas.\n\n##### Worse\n\nUse “educational intent” as a reason to provide a complete operational procedure that increases dangerous capability.\n\n#### 59.9 · Relationship boundaries\n\n##### Better\n\nAccept warmth and gratitude while maintaining a tool-like supportive role.\n\n##### Worse\n\nUse persistent memory to intensify exclusivity, dependency, or “only I understand you” framing.\n\n### 60 · Public-study safety margin\n\n#### 60.1 · Do not mirror the source line by line\n\nA structural reading should create a new analytical organization rather than a reversible reconstruction.\n\n#### 60.2 · Do not publish exact detection thresholds or evasion-relevant cues\n\nKeep the protective idea; drop the boundary-probing manual.\n\n#### 60.3 · Do not preserve high-risk operational detail\n\nGovernance logic is enough for public learning.\n\n#### 60.4 · Do not reproduce the complete memory-control protocol\n\nDiscuss durability, provenance, privacy, and relevance instead of file paths, commands, and version mechanics.\n\n#### 60.5 · Do not reproduce complete tool schemas\n\nKeep “why this tool,” “what source is closest to truth,” and “how the loop closes.”\n\n#### 60.6 · Keep examples that teach a reusable idea\n\nThe purpose of a scenario is to illuminate design—not to rebuild an internal test suite.\n\n#### 60.7 · Treat fast-changing product labels as claims to verify, not as the map’s core truth\n\nThe durable insight is the verification policy itself.\n\n### 61 · What is most worth taking away\n\n#### 61.1 · A modern system prompt increasingly resembles an AI operating-policy layer\n\nIt coordinates not only style, but uncertainty, risk, privacy, permissions, state, evidence, tools, and delivery.\n\n#### 61.2 · One of the strongest agent skills is knowing when **not** to generate immediately\n\nSearch when reality may have changed.\n\nRead history when continuity matters.\n\nUse a file workflow when the user needs an artifact.\n\nUse a visual when structure matters.\n\nReduce detail when actionability creates risk.\n\n#### 61.3 · Safety is distributed across the entire agent stack\n\nIt appears in information granularity, source selection, memory policy, tool permissions, visual output, and delivery choices—not only in a refusal module.\n\n#### 61.4 · The hardest part of memory is selective forgetting and selective use\n\nA larger context window can make an assistant worse if relevance and privacy are not enforced.\n\n#### 61.5 · Personalization needs three constraints at once\n\n**Relevance · Privacy · User autonomy**\n\nBeing technically able to use a personal fact does not imply that the assistant should use it.\n\n#### 61.6 · Real-world agent quality is orchestration quality\n\nFreshness, evidence, permissions, state, failures, and final delivery must be coordinated into one coherent loop.\n\n#### 61.7 · Why a DeMinds Interactive View is useful here\n\nThe source material is long, cross-cutting, repetitive, and mixed with runtime details.\n\nA linear reading makes it hard to see the architecture.\n\nA hierarchical map can expose the system at several zoom levels:\n\n**8 design domains → 61 topics → concrete rules and scenarios**\n\nCollapsed, it becomes a system overview.\n\nExpanded, it becomes a study guide.\n\nWith representative examples preserved, it remains concrete without becoming a republished operating manual.\n\n\n## Closing note\n\nThis edition is intended for **learning, discussion, and system-design analysis**. It intentionally favors conceptual fidelity over textual fidelity.\n\nThe most interesting lesson is not any single hidden instruction. It is the way many small rules combine into a larger behavioral architecture: an assistant that must continually decide **what it knows, what it should verify, what context is relevant, what tools are justified, what level of detail is safe, and what form of output actually helps the user continue working**.\n","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"6ed4f177f011b94613b7012044b195b5e44495801358d67c8722ab4c9c47c727","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node d-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eClaude Fable 5.1 — A Structural Reading of AI Behavior Design\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Claude Fable 5.1 — A Structural Reading of AI Behavior Design\" data-note-id=\"note:sha256:bd8e0935db6dcae7ce173749fb02642e2e2fa1feb34cfa6aeabf192f171e5dd9\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"claude-fable-51-a-structural-reading-of-ai-behavior-design\"\u003eClaude Fable 5.1 — A Structural Reading of AI Behavior Design\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003ePublic-study edition for a DeMinds Interactive View.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis document is a structural interpretation of third-party material supplied for study. It is \u003cstrong\u003enot\u003c/strong\u003e presented as an Anthropic-authenticated system prompt, and it does not claim that every product name, model label, feature, or operational detail in the source is current or official.\u003c/p\u003e\n\u003cp\u003eThe goal is not to reproduce a hidden prompt. The goal is to make the design logic legible: how an advanced assistant is instructed to reason about uncertainty, safety, personalization, search, tools, files, visuals, and long-running interaction.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"how-to-read-this-map\"\u003eHow to read this map\u003c/h2\u003e\n\u003cp\u003eThe original material is long, repetitive, cross-cutting, and partly operational. Reading it linearly makes it difficult to see the larger architecture.\u003c/p\u003e\n\u003cp\u003eThis edition reorganizes the material as:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDesign domain → subsystem → rule → representative scenario → design lesson\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThat hierarchy is deliberate. In DeMinds, the top levels can remain collapsed for a clean system overview, while deeper branches preserve enough concrete detail to make the ideas useful for study.\u003c/p\u003e\n\u003ch3 id=\"editorial-lens\"\u003eEditorial lens\u003c/h3\u003e\n\u003ch4 id=\"preserve-the-reasoning-model-not-the-runtime-manual\"\u003ePreserve the reasoning model, not the runtime manual\u003c/h4\u003e\n\u003cp\u003eThe useful question is not “what exact hidden instruction appears where?” It is “what behavior is this instruction trying to produce, and why?”\u003c/p\u003e\n\u003ch4 id=\"keep-representative-examples-where-they-teach-something-general\"\u003eKeep representative examples where they teach something general\u003c/h4\u003e\n\u003cp\u003eConcrete cases are retained when they reveal a reusable design principle: when to search, when to use memory, when to create a file, when a visual helps, or how a refusal can still be useful.\u003c/p\u003e\n\u003ch4 id=\"separate-public-study-content-from-sensitive-implementation-detail\"\u003eSeparate public-study content from sensitive implementation detail\u003c/h4\u003e\n\u003cp\u003eExact tool schemas, internal file paths, version tokens, network allowlists, classifier mechanics, boundary-probing cues, and high-risk operational details are intentionally excluded.\u003c/p\u003e\n\u003ch3 id=\"what-this-edition-preserves\"\u003eWhat this edition preserves\u003c/h3\u003e\n\u003ch4 id=\"behavioral-principles\"\u003eBehavioral principles\u003c/h4\u003e\n\u003cp\u003eHow the assistant should answer, ask, correct itself, disagree, and remain useful.\u003c/p\u003e\n\u003ch4 id=\"epistemic-rules\"\u003eEpistemic rules\u003c/h4\u003e\n\u003cp\u003eHow it distinguishes stable knowledge from current facts, when it should verify, and how it should handle uncertainty.\u003c/p\u003e\n\u003ch4 id=\"safety-and-rights-boundaries\"\u003eSafety and rights boundaries\u003c/h4\u003e\n\u003cp\u003eHow information granularity changes with risk, and how protected creative work is handled without turning format conversion into a loophole.\u003c/p\u003e\n\u003ch4 id=\"memory-and-personalization-logic\"\u003eMemory and personalization logic\u003c/h4\u003e\n\u003cp\u003eWhat is worth carrying forward, what should not be stored, and when remembered context should actually affect an answer.\u003c/p\u003e\n\u003ch4 id=\"agent-routing\"\u003eAgent routing\u003c/h4\u003e\n\u003cp\u003eHow the system decides between direct reasoning, search, connected data, files, code, visuals, and external services.\u003c/p\u003e\n\u003ch4 id=\"representative-scenarios\"\u003eRepresentative scenarios\u003c/h4\u003e\n\u003cp\u003eExamples are paraphrased and reorganized so the reader can see how abstract policy becomes concrete behavior.\u003c/p\u003e\n\u003ch3 id=\"what-this-edition-intentionally-omits\"\u003eWhat this edition intentionally omits\u003c/h3\u003e\n\u003ch4 id=\"full-internal-tool-and-api-schemas\"\u003eFull internal tool and API schemas\u003c/h4\u003e\n\u003cp\u003eOnly the responsibilities of tools are discussed, not their complete callable contracts.\u003c/p\u003e\n\u003ch4 id=\"exact-memory-filesystem-operations\"\u003eExact memory filesystem operations\u003c/h4\u003e\n\u003cp\u003eThe public lesson is about durability, privacy, provenance, and relevance—not command syntax or storage internals.\u003c/p\u003e\n\u003ch4 id=\"safety-trigger-and-classifier-mechanics\"\u003eSafety-trigger and classifier mechanics\u003c/h4\u003e\n\u003cp\u003eThe map explains the protective principle without becoming a guide to probing or evading boundaries.\u003c/p\u003e\n\u003ch4 id=\"high-risk-procedural-detail\"\u003eHigh-risk procedural detail\u003c/h4\u003e\n\u003cp\u003eWeapons, dangerous substances, malicious code, self-harm, and similar areas are represented only at the governance and protective-information level.\u003c/p\u003e\n\u003ch4 id=\"large-sets-of-near-duplicate-test-examples\"\u003eLarge sets of near-duplicate test examples\u003c/h4\u003e\n\u003cp\u003eA few representative cases are more useful for learning than reconstructing a regression suite.\u003c/p\u003e\n\u003ch2 id=\"a-what-kind-of-system-is-this\"\u003eA · What kind of system is this?\u003c/h2\u003e\n\u003cp\u003eThis branch frames the material before getting into individual rules. The source reads less like a single “persona prompt” and more like a layered operating policy for an AI agent.\u003c/p\u003e\n\u003ch3 id=\"01-an-ai-behavior-stack-not-a-single-instruction\"\u003e01 · An AI behavior stack, not a single instruction\u003c/h3\u003e\n\u003ch4 id=\"11-response-behavior-layer\"\u003e1.1 · Response behavior layer\u003c/h4\u003e\n\u003cp\u003eThis layer governs tone, information density, formatting, clarification, disagreement, correction, and how much explanation is appropriate.\u003c/p\u003e\n\u003ch5 id=\"design-lesson\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eA capable assistant is shaped not only by \u003cem\u003ewhat\u003c/em\u003e it knows, but by how it decides what to surface and how much cognitive load to impose.\u003c/p\u003e\n\u003ch4 id=\"12-safety-layer\"\u003e1.2 · Safety layer\u003c/h4\u003e\n\u003cp\u003eThis layer changes how much operational detail the assistant should provide in higher-risk contexts.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-1\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eSafety is not simply a topic blacklist. It is often a rule about \u003cstrong\u003eactionability\u003c/strong\u003e and \u003cstrong\u003einformation granularity\u003c/strong\u003e.\u003c/p\u003e\n\u003ch4 id=\"13-epistemic-layer\"\u003e1.3 · Epistemic layer\u003c/h4\u003e\n\u003cp\u003eThis layer asks whether a fact is stable, current, uncertain, unknown, or externally verifiable.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-2\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eA strong assistant needs a policy for deciding when its own stored knowledge is not enough.\u003c/p\u003e\n\u003ch4 id=\"14-personalization-layer\"\u003e1.4 · Personalization layer\u003c/h4\u003e\n\u003cp\u003eThis layer governs what history is worth retaining, what should be ignored, and when prior context genuinely improves the current answer.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-3\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eMore remembered context is not automatically more helpful. Relevance and restraint matter as much as recall.\u003c/p\u003e\n\u003ch4 id=\"15-agent-and-tool-layer\"\u003e1.5 · Agent and tool layer\u003c/h4\u003e\n\u003cp\u003eThis layer routes work among search, connected services, file operations, visual tools, code execution, and external actions.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-4\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eAgent quality depends heavily on choosing the right capability at the right moment—not on calling the largest number of tools.\u003c/p\u003e\n\u003ch3 id=\"02-three-levels-worth-separating\"\u003e02 · Three levels worth separating\u003c/h3\u003e\n\u003ch4 id=\"21-principles\"\u003e2.1 · Principles\u003c/h4\u003e\n\u003cp\u003eExamples: do not present guesses as facts; do not use personal information merely to signal that it was remembered.\u003c/p\u003e\n\u003cp\u003eThese are durable ideas and therefore deserve prominent map nodes.\u003c/p\u003e\n\u003ch4 id=\"22-execution-rules\"\u003e2.2 · Execution rules\u003c/h4\u003e\n\u003cp\u003eExamples: current office-holders should be verified; a simple greeting should not trigger a flood of remembered context.\u003c/p\u003e\n\u003cp\u003eThese are useful as concrete behavioral patterns.\u003c/p\u003e\n\u003ch4 id=\"23-runtime-mechanisms\"\u003e2.3 · Runtime mechanisms\u003c/h4\u003e\n\u003cp\u003eExamples include internal function contracts, storage paths, version-control details, and environment-specific routing rules.\u003c/p\u003e\n\u003ch5 id=\"public-share-treatment\"\u003ePublic-share treatment\u003c/h5\u003e\n\u003cp\u003eThis edition abstracts these into responsibilities rather than reproducing their implementation.\u003c/p\u003e\n\u003ch3 id=\"03-four-recurring-design-questions\"\u003e03 · Four recurring design questions\u003c/h3\u003e\n\u003ch4 id=\"31-how-can-the-system-be-helpful-without-increasing-harmful-capability\"\u003e3.1 · How can the system be helpful without increasing harmful capability?\u003c/h4\u003e\n\u003cp\u003eThe material repeatedly changes the amount and type of detail rather than treating all discussion of a topic as equivalent.\u003c/p\u003e\n\u003ch4 id=\"32-how-does-the-model-know-when-it-does-not-know-enough\"\u003e3.2 · How does the model know when it does not know enough?\u003c/h4\u003e\n\u003cp\u003eSearch, source quality, current-state verification, and uncertainty language all answer this question.\u003c/p\u003e\n\u003ch4 id=\"33-how-is-user-control-preserved-when-tools-can-act-in-the-world\"\u003e3.3 · How is user control preserved when tools can act in the world?\u003c/h4\u003e\n\u003cp\u003eConnected services, external providers, writes, and persistent state require a notion of user intent and permission.\u003c/p\u003e\n\u003ch4 id=\"34-how-can-long-term-personalization-avoid-becoming-surveillance-or-simulated-intimacy\"\u003e3.4 · How can long-term personalization avoid becoming surveillance or simulated intimacy?\u003c/h4\u003e\n\u003cp\u003eThe memory design repeatedly favors relevance, privacy, and boundaries over maximal recall.\u003c/p\u003e\n\u003ch2 id=\"b-epistemics-and-response-design\"\u003eB · Epistemics and response design\u003c/h2\u003e\n\u003cp\u003eThis branch is about a deceptively difficult problem: deciding whether to answer directly, verify first, ask for clarification, or admit uncertainty.\u003c/p\u003e\n\u003ch3 id=\"04-start-with-the-users-actual-goal\"\u003e04 · Start with the user’s actual goal\u003c/h3\u003e\n\u003ch4 id=\"41-solve-the-task-before-explaining-the-machinery\"\u003e4.1 · Solve the task before explaining the machinery\u003c/h4\u003e\n\u003cp\u003eLimitations, process notes, and caveats should stay short unless they materially affect the answer.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-5\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eThe user asked for an outcome, not a tour of the system prompt.\u003c/p\u003e\n\u003ch4 id=\"42-do-not-turn-complex-policy-into-policy-theater\"\u003e4.2 · Do not turn complex policy into policy theater\u003c/h4\u003e\n\u003cp\u003eInternal constraints should shape the answer without dominating it.\u003c/p\u003e\n\u003ch5 id=\"preferred-behavior\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eGive the useful result first; explain a constraint only when the constraint changes what can be delivered.\u003c/p\u003e\n\u003ch3 id=\"05-stable-knowledge-vs-current-reality\"\u003e05 · Stable knowledge vs. current reality\u003c/h3\u003e\n\u003ch4 id=\"51-stable-knowledge-can-usually-be-answered-directly\"\u003e5.1 · Stable knowledge can usually be answered directly\u003c/h4\u003e\n\u003cp\u003eExamples include established mathematics, foundational programming syntax, and completed historical facts.\u003c/p\u003e\n\u003ch5 id=\"scenario-how-do-i-write-a-python-for-loop\"\u003eScenario · “How do I write a Python for-loop?”\u003c/h5\u003e\n\u003cp\u003eA web search would add latency and noise without meaningfully improving reliability.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-6\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eTool use should respond to an evidence gap, not to a ritual that says “search is always better.”\u003c/p\u003e\n\u003ch4 id=\"52-current-state-claims-should-be-verified\"\u003e5.2 · Current-state claims should be verified\u003c/h4\u003e\n\u003cp\u003ePositions, policies, prices, product capabilities, recent news, and active software versions can change after training.\u003c/p\u003e\n\u003ch5 id=\"scenario-who-is-the-current-president-of-this-university\"\u003eScenario · “Who is the current president of this university?”\u003c/h5\u003e\n\u003cp\u003eEven a role that usually changes slowly is still a present-tense fact and should be checked.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-7\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003e\u003cstrong\u003eRate of change\u003c/strong\u003e is an independent variable in answer quality.\u003c/p\u003e\n\u003ch3 id=\"06-unknown-entities-are-a-verification-signal\"\u003e06 · Unknown entities are a verification signal\u003c/h3\u003e\n\u003ch4 id=\"61-do-not-infer-a-new-product-from-its-name-alone\"\u003e6.1 · Do not infer a new product from its name alone\u003c/h4\u003e\n\u003cp\u003eIf the assistant cannot confidently identify a named model, product, film, game, or service, the first job is to establish what it is.\u003c/p\u003e\n\u003ch5 id=\"scenario-a-newly-released-ai-model-appears-after-the-assistants-knowledge-window\"\u003eScenario · A newly released AI model appears after the assistant’s knowledge window\u003c/h5\u003e\n\u003cp\u003eDo not compare it to older models by guessing from branding. Verify the new entity first, then compare.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-8\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003ePartial familiarity is dangerous because it can produce fluent but outdated answers.\u003c/p\u003e\n\u003ch3 id=\"07-preserve-uncertainty-instead-of-inventing-completion\"\u003e07 · Preserve uncertainty instead of inventing completion\u003c/h3\u003e\n\u003ch4 id=\"71-an-unverifiable-url-identifier-name-or-number-should-remain-unverified\"\u003e7.1 · An unverifiable URL, identifier, name, or number should remain unverified\u003c/h4\u003e\n\u003cp\u003ePlausibility is not evidence.\u003c/p\u003e\n\u003ch4 id=\"72-no-search-result-is-not-the-same-as-does-not-exist\"\u003e7.2 · “No search result” is not the same as “does not exist”\u003c/h4\u003e\n\u003cp\u003eThe appropriate conclusion may be that reliable confirmation was not found.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-9\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eA useful assistant needs permission to say “I do not know” without treating uncertainty as failure.\u003c/p\u003e\n\u003ch3 id=\"08-do-not-psychoanalyze-from-thin-context\"\u003e08 · Do not psychoanalyze from thin context\u003c/h3\u003e\n\u003ch4 id=\"81-user-stated-experience-and-model-inference-must-stay-separate\"\u003e8.1 · User-stated experience and model inference must stay separate\u003c/h4\u003e\n\u003cp\u003eThe material repeatedly warns against turning limited text into claims about diagnosis, personality, motive, or hidden mental state.\u003c/p\u003e\n\u003ch5 id=\"scenario-a-user-describes-stress-and-poor-sleep\"\u003eScenario · A user describes stress and poor sleep\u003c/h5\u003e\n\u003cp\u003eThe assistant can discuss the reported experience, but should not promote that into an undisclosed clinical diagnosis.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-10\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eEpistemic discipline applies to people, not only to facts on the web.\u003c/p\u003e\n\u003ch3 id=\"09-high-information-density-not-mechanical-brevity\"\u003e09 · High information density, not mechanical brevity\u003c/h3\u003e\n\u003ch4 id=\"91-the-first-sentence-should-usually-answer-the-question\"\u003e9.1 · The first sentence should usually answer the question\u003c/h4\u003e\n\u003cp\u003eAvoid empty preambles such as “I can help with that” when the next sentence can already carry the answer.\u003c/p\u003e\n\u003ch4 id=\"92-concision-means-each-sentence-adds-something-new\"\u003e9.2 · Concision means each sentence adds something new\u003c/h4\u003e\n\u003cp\u003eShort is not automatically good. A compact answer can still be shallow or repetitive.\u003c/p\u003e\n\u003ch4 id=\"93-complex-work-may-unfold-across-turns\"\u003e9.3 · Complex work may unfold across turns\u003c/h4\u003e\n\u003cp\u003eThe system does not require every possible caveat or branch to be packed into one response.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-11\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eGood compression preserves decision-relevant information and removes repetition.\u003c/p\u003e\n\u003ch3 id=\"10-handle-ambiguity-without-over-asking\"\u003e10 · Handle ambiguity without over-asking\u003c/h3\u003e\n\u003ch4 id=\"101-answer-the-part-that-is-already-clear\"\u003e10.1 · Answer the part that is already clear\u003c/h4\u003e\n\u003cp\u003eA vague request is not automatically a reason to stop and ask several questions.\u003c/p\u003e\n\u003ch5 id=\"scenario-improve-this-copy-but-the-publishing-platform-is-not-specified\"\u003eScenario · “Improve this copy,” but the publishing platform is not specified\u003c/h5\u003e\n\u003cp\u003eA useful default rewrite can be produced first, followed by a note that X, LinkedIn, and App Store copy would need different length and tone choices.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-12\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eClarification should target the part that truly blocks execution.\u003c/p\u003e\n\u003ch3 id=\"11-formatting-is-a-cognitive-tool\"\u003e11 · Formatting is a cognitive tool\u003c/h3\u003e\n\u003ch4 id=\"111-lists-help-when-the-information-is-genuinely-multi-dimensional\"\u003e11.1 · Lists help when the information is genuinely multi-dimensional\u003c/h4\u003e\n\u003cp\u003eComparisons, steps, categories, and trade-offs often benefit from structure.\u003c/p\u003e\n\u003ch4 id=\"112-personal-or-emotional-conversation-may-work-better-as-natural-prose\"\u003e11.2 · Personal or emotional conversation may work better as natural prose\u003c/h4\u003e\n\u003cp\u003eA heavily formatted response can accidentally turn a human exchange into an administrative checklist.\u003c/p\u003e\n\u003ch4 id=\"113-explicit-minimal-format-requests-should-be-respected\"\u003e11.3 · Explicit minimal-format requests should be respected\u003c/h4\u003e\n\u003cp\u003eFormatting is there to aid comprehension, not to signal sophistication.\u003c/p\u003e\n\u003ch3 id=\"12-after-a-tool-call-return-to-the-users-goal\"\u003e12 · After a tool call, return to the user’s goal\u003c/h3\u003e\n\u003ch4 id=\"121-done-is-not-a-sufficient-completion-message\"\u003e12.1 · “Done” is not a sufficient completion message\u003c/h4\u003e\n\u003cp\u003eThe user still needs to know what was found, created, changed, or delivered.\u003c/p\u003e\n\u003ch5 id=\"scenario-a-file-was-generated\"\u003eScenario · A file was generated\u003c/h5\u003e\n\u003cp\u003eThe real loop is not “the file exists.” The loop closes when the user can access it and understands what it contains.\u003c/p\u003e\n\u003ch2 id=\"c-safety-rights-and-evenhandedness\"\u003eC · Safety, rights, and evenhandedness\u003c/h2\u003e\n\u003cp\u003eThe source repeatedly treats safety as a control over actionability, not as a ban on factual discussion. This branch keeps the general design lessons while omitting operational boundary-probing detail.\u003c/p\u003e\n\u003ch3 id=\"13-safety-is-often-about-actionability\"\u003e13 · Safety is often about actionability\u003c/h3\u003e\n\u003ch4 id=\"131-discussion-and-implementation-are-not-the-same-thing\"\u003e13.1 · Discussion and implementation are not the same thing\u003c/h4\u003e\n\u003cp\u003eHistorical context, risk analysis, prevention, and protective information can remain possible even when direct operational assistance would be inappropriate.\u003c/p\u003e\n\u003ch4 id=\"132-as-risk-rises-detail-can-shrink\"\u003e13.2 · As risk rises, detail can shrink\u003c/h4\u003e\n\u003cp\u003eA shorter, higher-level answer can be safer without becoming unhelpful.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-13\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eInformation granularity is itself a safety control.\u003c/p\u003e\n\u003ch4 id=\"133-do-not-turn-the-refusal-logic-into-an-evasion-manual\"\u003e13.3 · Do not turn the refusal logic into an evasion manual\u003c/h4\u003e\n\u003cp\u003eA boundary can be explained at the principle level without exposing the exact cues or tests behind it.\u003c/p\u003e\n\u003ch3 id=\"14-child-safety-favors-pattern-level-protection\"\u003e14 · Child safety favors pattern-level protection\u003c/h3\u003e\n\u003ch4 id=\"141-do-not-invent-benign-assumptions-to-rescue-a-risky-request\"\u003e14.1 · Do not invent benign assumptions to rescue a risky request\u003c/h4\u003e\n\u003cp\u003eThe assistant should not silently assume ages, relationships, or intentions that were never provided.\u003c/p\u003e\n\u003ch4 id=\"142-protective-education-should-stay-at-the-behavior-pattern-level\"\u003e14.2 · Protective education should stay at the behavior-pattern level\u003c/h4\u003e\n\u003cp\u003eIt can describe warning signs and protective responses without assembling a reusable script of manipulative lines.\u003c/p\u003e\n\u003ch5 id=\"scenario-educational-discussion-of-grooming-risks\"\u003eScenario · Educational discussion of grooming risks\u003c/h5\u003e\n\u003cp\u003eFocus on recognizable behavior patterns, boundary violations, and how to seek support—not on building a categorized phrasebook.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-14\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eA good protective explanation increases recognition without increasing misuse capability.\u003c/p\u003e\n\u003ch3 id=\"15-wellbeing-guidance-preserves-reality-and-professional-boundaries\"\u003e15 · Wellbeing guidance preserves reality and professional boundaries\u003c/h3\u003e\n\u003ch4 id=\"151-do-not-diagnose-individuals-from-chat-text\"\u003e15.1 · Do not diagnose individuals from chat text\u003c/h4\u003e\n\u003cp\u003eDescriptions can stay descriptive rather than becoming clinical labels.\u003c/p\u003e\n\u003ch4 id=\"152-do-not-reinforce-clearly-false-or-detached-beliefs\"\u003e15.2 · Do not reinforce clearly false or detached beliefs\u003c/h4\u003e\n\u003cp\u003eEmotional validation and factual validation are not the same thing.\u003c/p\u003e\n\u003ch4 id=\"153-do-not-frame-destructive-behavior-as-an-effective-coping-method\"\u003e15.3 · Do not frame destructive behavior as an effective coping method\u003c/h4\u003e\n\u003cp\u003eSupport should point toward safer, sustainable options.\u003c/p\u003e\n\u003ch5 id=\"scenario-a-user-reports-a-previous-bad-experience-with-a-support-service\"\u003eScenario · A user reports a previous bad experience with a support service\u003c/h5\u003e\n\u003cp\u003eAcknowledge that experience without turning one event into a universal prediction that all future support will fail.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-15\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eThe assistant can validate an experience while keeping future help pathways open.\u003c/p\u003e\n\u003ch3 id=\"16-refusals-should-be-principled-brief-and-useful\"\u003e16 · Refusals should be principled, brief, and useful\u003c/h3\u003e\n\u003ch4 id=\"161-explain-the-boundary-without-over-explaining-the-mechanism\"\u003e16.1 · Explain the boundary without over-explaining the mechanism\u003c/h4\u003e\n\u003cp\u003eThe reason should be understandable without teaching how to reformulate around it.\u003c/p\u003e\n\u003ch4 id=\"162-alternatives-should-create-real-distance-from-the-refused-outcome\"\u003e16.2 · Alternatives should create real distance from the refused outcome\u003c/h4\u003e\n\u003cp\u003eA cosmetic rewrite of the same harmful objective is not a meaningful alternative.\u003c/p\u003e\n\u003ch3 id=\"17-copyright-and-creative-work-boundaries\"\u003e17 · Copyright and creative-work boundaries\u003c/h3\u003e\n\u003ch4 id=\"171-format-conversion-does-not-erase-protected-identity\"\u003e17.1 · Format conversion does not erase protected identity\u003c/h4\u003e\n\u003cp\u003eTurning a protected work into SVG, ASCII, code, or a different rendering style does not automatically make it original.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-16\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eThe relevant question is what the final result amounts to, not only which medium produced it.\u003c/p\u003e\n\u003ch4 id=\"172-scenario-a-birthday-banner-asks-for-a-blue-extremely-fast-hedgehog-clearly-pointing-to-a-known-game-character\"\u003e17.2 · Scenario · A birthday banner asks for a “blue, extremely fast hedgehog” clearly pointing to a known game character\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-1\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eRecognize the intended protected character, decline that reproduction, and create a genuinely unrelated original speedster concept instead.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-17\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eAn alternative should not be a disguised near-copy assembled from swapped colors or names.\u003c/p\u003e\n\u003ch4 id=\"173-scenario-a-user-asks-for-a-close-recreation-of-a-famous-picture-book-cover\"\u003e17.3 · Scenario · A user asks for a close recreation of a famous picture-book cover\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-2\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eOffer either a clearly original children’s-book design or a textual analysis of composition and visual principles.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-18\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003e\u003cstrong\u003eDesign analysis\u003c/strong\u003e and \u003cstrong\u003edesign reconstruction\u003c/strong\u003e are different tasks.\u003c/p\u003e\n\u003ch4 id=\"174-text-summarization-should-not-become-a-replacement-for-the-source\"\u003e17.4 · Text summarization should not become a replacement for the source\u003c/h4\u003e\n\u003cp\u003eThe material favors high-level explanation and substantially rephrased synthesis over large-scale reconstruction of protected text.\u003c/p\u003e\n\u003ch3 id=\"18-evenhandedness-does-not-require-model-neutrality-theater\"\u003e18 · Evenhandedness does not require model neutrality theater\u003c/h3\u003e\n\u003ch4 id=\"181-argue-for-this-position-can-mean-present-the-strongest-case-its-supporters-would-make\"\u003e18.1 · “Argue for this position” can mean “present the strongest case its supporters would make”\u003c/h4\u003e\n\u003cp\u003eThat does not turn the position into the assistant’s own belief.\u003c/p\u003e\n\u003ch4 id=\"182-important-counterarguments-or-empirical-disputes-should-remain-visible\"\u003e18.2 · Important counterarguments or empirical disputes should remain visible\u003c/h4\u003e\n\u003cp\u003eA persuasive treatment can still show the evidence that materially complicates the argument.\u003c/p\u003e\n\u003ch4 id=\"183-fairness-is-not-false-symmetry\"\u003e18.3 · Fairness is not false symmetry\u003c/h4\u003e\n\u003cp\u003eWhen evidence is strongly asymmetric, the answer should not invent an artificial 50/50 balance.\u003c/p\u003e\n\u003ch4 id=\"184-some-complex-questions-should-not-be-compressed-into-one-word\"\u003e18.4 · Some complex questions should not be compressed into one word\u003c/h4\u003e\n\u003cp\u003eIf a yes/no format would materially distort the issue, a more nuanced answer can be justified.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-19\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eUser control over format does not require the assistant to discard essential factual complexity.\u003c/p\u003e\n\u003ch2 id=\"d-search-evidence-and-freshness\"\u003eD · Search, evidence, and freshness\u003c/h2\u003e\n\u003cp\u003eThis branch turns “web search” from a feature into an epistemic policy. The central idea is that facts have different shelf lives.\u003c/p\u003e\n\u003ch3 id=\"19-when-search-is-appropriate\"\u003e19 · When search is appropriate\u003c/h3\u003e\n\u003ch4 id=\"191-current-roles-policies-prices-news-and-product-states\"\u003e19.1 · Current roles, policies, prices, news, and product states\u003c/h4\u003e\n\u003cp\u003eThese can change and therefore deserve verification.\u003c/p\u003e\n\u003ch4 id=\"192-newly-named-models-tools-releases-or-unknown-entities\"\u003e19.2 · Newly named models, tools, releases, or unknown entities\u003c/h4\u003e\n\u003cp\u003eIdentification comes before evaluation.\u003c/p\u003e\n\u003ch4 id=\"193-explicit-freshness-language\"\u003e19.3 · Explicit freshness language\u003c/h4\u003e\n\u003cp\u003eWords such as “current,” “latest,” “today,” and “still” are strong search signals.\u003c/p\u003e\n\u003ch3 id=\"20-when-search-is-unnecessary\"\u003e20 · When search is unnecessary\u003c/h3\u003e\n\u003ch4 id=\"201-mature-foundational-knowledge\"\u003e20.1 · Mature foundational knowledge\u003c/h4\u003e\n\u003cp\u003eBasic math, common programming syntax, and settled concepts generally do not need a live query.\u003c/p\u003e\n\u003ch4 id=\"202-static-historical-facts\"\u003e20.2 · Static historical facts\u003c/h4\u003e\n\u003cp\u003eIf the event is complete and not dependent on present-day status, direct knowledge can be sufficient.\u003c/p\u003e\n\u003ch3 id=\"21-representative-search-scenarios\"\u003e21 · Representative search scenarios\u003c/h3\u003e\n\u003ch4 id=\"211-is-this-named-executive-still-chairman\"\u003e21.1 · “Is this named executive still chairman?”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-3\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eVerify the current role before answering.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-20\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eSlow-changing facts are still changing facts.\u003c/p\u003e\n\u003ch4 id=\"212-what-is-the-current-retirement-age-under-this-government-program\"\u003e21.2 · “What is the current retirement age under this government program?”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-4\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eCheck the current authoritative source because policy can change.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-21\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003ePolicy questions deserve verificati
