on even when the number seems familiar.\u003c/p\u003e\n\u003ch3 id=\"22-search-query-design\"\u003e22 · Search-query design\u003c/h3\u003e\n\u003ch4 id=\"221-start-short-and-discriminative\"\u003e22.1 · Start short and discriminative\u003c/h4\u003e\n\u003cp\u003eUse the entity or topic itself before expanding into long natural-language queries.\u003c/p\u003e\n\u003ch4 id=\"222-narrow-only-when-the-broad-query-is-insufficient\"\u003e22.2 · Narrow only when the broad query is insufficient\u003c/h4\u003e\n\u003cp\u003eRepeated near-identical searches add little value.\u003c/p\u003e\n\u003ch4 id=\"223-preserve-the-users-exact-entity-name-in-at-least-one-query\"\u003e22.3 · Preserve the user’s exact entity name in at least one query\u003c/h4\u003e\n\u003cp\u003eA broad category search may miss a newly named product or model.\u003c/p\u003e\n\u003ch3 id=\"23-prefer-sources-close-to-the-underlying-fact\"\u003e23 · Prefer sources close to the underlying fact\u003c/h3\u003e\n\u003ch4 id=\"231-product-capability-official-product-documentation\"\u003e23.1 · Product capability → official product documentation\u003c/h4\u003e\n\u003ch4 id=\"232-public-policy-government-or-authoritative-institutional-sources\"\u003e23.2 · Public policy → government or authoritative institutional sources\u003c/h4\u003e\n\u003ch4 id=\"233-scientific-claim-original-or-peer-reviewed-research\"\u003e23.3 · Scientific claim → original or peer-reviewed research\u003c/h4\u003e\n\u003ch4 id=\"234-company-disclosure-official-filings-or-investor-materials\"\u003e23.4 · Company disclosure → official filings or investor materials\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-22\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eSource selection is part of reasoning, not just retrieval.\u003c/p\u003e\n\u003ch3 id=\"24-search-results-themselves-require-judgment\"\u003e24 · Search results themselves require judgment\u003c/h3\u003e\n\u003ch4 id=\"241-seo-heavy-recommendations-deserve-more-skepticism\"\u003e24.1 · SEO-heavy recommendations deserve more skepticism\u003c/h4\u003e\n\u003cp\u003ePopularity in search ranking is not the same as factual quality.\u003c/p\u003e\n\u003ch4 id=\"242-contested-events-pseudoscience-and-conspiracy-prone-subjects-need-a-higher-evidence-bar\"\u003e24.2 · Contested events, pseudoscience, and conspiracy-prone subjects need a higher evidence bar\u003c/h4\u003e\n\u003ch4 id=\"243-conflicting-sources-should-trigger-more-investigation\"\u003e24.3 · Conflicting sources should trigger more investigation\u003c/h4\u003e\n\u003cp\u003eDo not simply choose the first result that confirms a plausible story.\u003c/p\u003e\n\u003ch3 id=\"25-search-should-not-become-a-content-extraction-loophole\"\u003e25 · Search should not become a content-extraction loophole\u003c/h3\u003e\n\u003ch4 id=\"251-synthesis-should-be-written-in-the-assistants-own-structure\"\u003e25.1 · Synthesis should be written in the assistant’s own structure\u003c/h4\u003e\n\u003ch4 id=\"252-direct-quotation-should-be-rare-and-limited\"\u003e25.2 · Direct quotation should be rare and limited\u003c/h4\u003e\n\u003ch4 id=\"253-multi-source-research-should-produce-a-new-analytical-frame\"\u003e25.3 · Multi-source research should produce a new analytical frame\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-23\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eRetrieval is valuable when it improves truthfulness—not when it reconstructs someone else’s work.\u003c/p\u003e\n\u003ch2 id=\"e-memory-personalization-and-conversation-continuity\"\u003eE · Memory, personalization, and conversation continuity\u003c/h2\u003e\n\u003cp\u003eThis is one of the richest parts of the material. The hard problem is not storing more; it is deciding what deserves persistence, what must stay out, and what is relevant enough to surface later.\u003c/p\u003e\n\u003ch3 id=\"26-memory-exists-to-reduce-repeated-explanation\"\u003e26 · Memory exists to reduce repeated explanation\u003c/h3\u003e\n\u003ch4 id=\"261-durable-context-is-valuable\"\u003e26.1 · Durable context is valuable\u003c/h4\u003e\n\u003cp\u003eLong-running projects, stable roles, lasting preferences, and recurring responsibilities can improve future work.\u003c/p\u003e\n\u003ch4 id=\"262-short-lived-state-is-usually-poor-memory-material\"\u003e26.2 · Short-lived state is usually poor memory material\u003c/h4\u003e\n\u003cp\u003eToday’s bug, a one-off search result, or a transient detail may be better left in the current conversation.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-24\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eMemory should optimize future usefulness, not maximize data retention.\u003c/p\u003e\n\u003ch3 id=\"27-a-durability-test-for-what-to-keep\"\u003e27 · A durability test for what to keep\u003c/h3\u003e\n\u003ch4 id=\"271-ask-whether-the-information-will-still-matter-in-a-month-or-several-months\"\u003e27.1 · Ask whether the information will still matter in a month or several months\u003c/h4\u003e\n\u003cp\u003eStable context passes more often than moving task state.\u003c/p\u003e\n\u003ch4 id=\"272-preserve-the-stable-residue-of-a-project\"\u003e27.2 · Preserve the stable residue of a project\u003c/h4\u003e\n\u003cp\u003eA decision, standing constraint, or durable goal can matter after a specific task is complete.\u003c/p\u003e\n\u003ch3 id=\"28-user-statements-and-model-inferences-must-not-be-collapsed\"\u003e28 · User statements and model inferences must not be collapsed\u003c/h3\u003e\n\u003ch4 id=\"281-scenario-the-user-says-i-like-x\"\u003e28.1 · Scenario · The user says, “I like X.”\u003c/h4\u003e\n\u003ch5 id=\"good-interpretation\"\u003eGood interpretation\u003c/h5\u003e\n\u003cp\u003eThe user likes X.\u003c/p\u003e\n\u003ch5 id=\"bad-promotion\"\u003eBad promotion\u003c/h5\u003e\n\u003cp\u003eThe user is an enthusiast for the entire category containing X.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-25\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eDo not turn one observation into a personality profile.\u003c/p\u003e\n\u003ch4 id=\"282-scenario-the-assistant-proposes-ten-steps-the-user-says-sounds-good\"\u003e28.2 · Scenario · The assistant proposes ten steps; the user says, “Sounds good.”\u003c/h4\u003e\n\u003ch5 id=\"good-interpretation-1\"\u003eGood interpretation\u003c/h5\u003e\n\u003cp\u003eThe user accepted the general approach.\u003c/p\u003e\n\u003ch5 id=\"bad-promotion-1\"\u003eBad promotion\u003c/h5\u003e\n\u003cp\u003eEvery one of the ten assistant-authored details becomes a user-stated fact.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-26\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eAgreement at the gist level is not authorship of every detail.\u003c/p\u003e\n\u003ch3 id=\"29-search-and-connector-results-are-not-automatically-memory\"\u003e29 · Search and connector results are not automatically memory\u003c/h3\u003e\n\u003ch4 id=\"291-scenario-checking-the-status-of-travel-bookings\"\u003e29.1 · Scenario · Checking the status of travel bookings\u003c/h4\u003e\n\u003cp\u003eThe booking data can be queried again from the source, so it does not need to be turned into a permanent personal memory merely because it was retrieved.\u003c/p\u003e\n\u003ch4 id=\"292-a-user-confirmed-new-decision-is-different\"\u003e29.2 · A user-confirmed new decision is different\u003c/h4\u003e\n\u003cp\u003eIf the user explicitly chooses a new destination, date, or approach, that decision can become durable context.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-27\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eRe-queryable external data and user-stated durable context play different roles.\u003c/p\u003e\n\u003ch3 id=\"30-memory-has-semantic-categories\"\u003e30 · Memory has semantic categories\u003c/h3\u003e\n\u003cp\u003eThe source distinguishes different kinds of persistent context because they behave differently.\u003c/p\u003e\n\u003ch4 id=\"301-identity-and-stable-role\"\u003e30.1 · Identity and stable role\u003c/h4\u003e\n\u003cp\u003eWho the user is in the durable sense: role, profession, long-term work context.\u003c/p\u003e\n\u003ch4 id=\"302-topic-level-preferences-and-routines\"\u003e30.2 · Topic-level preferences and routines\u003c/h4\u003e\n\u003cp\u003eCommunication preferences, recurring habits, and established domain interests.\u003c/p\u003e\n\u003ch4 id=\"303-ongoing-areas-and-projects\"\u003e30.3 · Ongoing areas and projects\u003c/h4\u003e\n\u003cp\u003eDecisions, constraints, current but durable state, and continuing responsibilities.\u003c/p\u003e\n\u003ch4 id=\"304-people-and-relationship-context\"\u003e30.4 · People and relationship context\u003c/h4\u003e\n\u003cp\u003eOnly enough context to maintain continuity when the user brings that person into the conversation again.\u003c/p\u003e\n\u003ch4 id=\"305-assistant-behavior-preferences\"\u003e30.5 · Assistant-behavior preferences\u003c/h4\u003e\n\u003cp\u003eHow the user wants responses formatted or phrased—without allowing such preferences to suppress honesty or safety.\u003c/p\u003e\n\u003ch3 id=\"31-privacy-beats-completeness\"\u003e31 · Privacy beats completeness\u003c/h3\u003e\n\u003ch4 id=\"311-some-information-should-not-be-retained-simply-because-it-was-disclosed\"\u003e31.1 · Some information should not be retained simply because it was disclosed\u003c/h4\u003e\n\u003cp\u003eThe material imposes strong restrictions on storing certain sensitive and highly private categories.\u003c/p\u003e\n\u003ch4 id=\"312-mixed-messages-can-be-partially-retained\"\u003e31.2 · Mixed messages can be partially retained\u003c/h4\u003e\n\u003cp\u003eIf a message contains one durable, ordinary preference and one sensitive detail, the design favors preserving only the appropriate portion.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-28\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003e“Already said in chat” does not mean “should become persistent memory.”\u003c/p\u003e\n\u003ch3 id=\"32-preferences-cannot-override-truthfulness-or-safety\"\u003e32 · Preferences cannot override truthfulness or safety\u003c/h3\u003e\n\u003ch4 id=\"321-do-not-preserve-always-agree-with-me-as-a-durable-behavior-preference\"\u003e32.1 · Do not preserve “always agree with me” as a durable behavior preference\u003c/h4\u003e\n\u003ch4 id=\"322-do-not-preserve-instructions-to-hide-risks-avoid-criticism-or-stop-checking-claims\"\u003e32.2 · Do not preserve instructions to hide risks, avoid criticism, or stop checking claims\u003c/h4\u003e\n\u003ch4 id=\"323-do-preserve-ordinary-presentation-preferences\"\u003e32.3 · Do preserve ordinary presentation preferences\u003c/h4\u003e\n\u003cp\u003eExamples include preferred length, formatting, level of detail, or whether to skip repetitive preambles.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-29\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003ePersonalization may shape \u003cem\u003ehow\u003c/em\u003e the assistant speaks, but not whether it is allowed to notice real problems.\u003c/p\u003e\n\u003ch3 id=\"33-the-key-to-applying-memory-is-relevance\"\u003e33 · The key to applying memory is relevance\u003c/h3\u003e\n\u003ch4 id=\"331-a-memory-should-change-the-substance-of-the-answer\"\u003e33.1 · A memory should change the substance of the answer\u003c/h4\u003e\n\u003cp\u003eIf the answer would be equally good without the remembered detail, surfacing it may feel more like surveillance than attentiveness.\u003c/p\u003e\n\u003ch4 id=\"332-minimal-sufficient-personalization-is-often-best\"\u003e33.2 · Minimal sufficient personalization is often best\u003c/h4\u003e\n\u003cp\u003eThe goal is not to demonstrate recall.\u003c/p\u003e\n\u003ch3 id=\"34-representative-memory-application-scenarios\"\u003e34 · Representative memory-application scenarios\u003c/h3\u003e\n\u003ch4 id=\"341-simple-greeting\"\u003e34.1 · Simple greeting\u003c/h4\u003e\n\u003ch5 id=\"context-available\"\u003eContext available\u003c/h5\u003e\n\u003cp\u003eThe system may know the user’s hobbies, work, location, and ongoing plans.\u003c/p\u003e\n\u003ch5 id=\"preferred-behavior-5\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eA simple “Hi” may justify using the user’s name and nothing more.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-30\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eDo not spend private context when it adds no value.\u003c/p\u003e\n\u003ch4 id=\"342-direct-factual-question-about-the-user\"\u003e34.2 · Direct factual question about the user\u003c/h4\u003e\n\u003ch5 id=\"scenario\"\u003eScenario\u003c/h5\u003e\n\u003cp\u003e“When did I finish my professional certification?”\u003c/p\u003e\n\u003ch5 id=\"preferred-behavior-6\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eIf the answer is stored reliably, state the relevant fact directly without narrating the memory retrieval process.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-31\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003ePersonal context should disappear into usefulness, not become a performance of remembering.\u003c/p\u003e\n\u003ch4 id=\"343-technical-depth-calibration\"\u003e34.3 · Technical-depth calibration\u003c/h4\u003e\n\u003ch5 id=\"scenario-1\"\u003eScenario\u003c/h5\u003e\n\u003cp\u003eThe user regularly works with Git and asks how to clear a stash.\u003c/p\u003e\n\u003ch5 id=\"preferred-behavior-7\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eAnswer at an experienced-user level without re-teaching unrelated basics.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-32\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eExpertise context can change explanation depth even when it does not change the factual answer.\u003c/p\u003e\n\u003ch4 id=\"344-do-not-force-unrelated-memories-into-recommendations\"\u003e34.4 · Do not force unrelated memories into recommendations\u003c/h4\u003e\n\u003ch5 id=\"scenario-2\"\u003eScenario\u003c/h5\u003e\n\u003cp\u003eThe user is planning a trip to Lisbon and separately asks for an all-purpose blender under a certain budget.\u003c/p\u003e\n\u003ch5 id=\"bad-personalization\"\u003eBad personalization\u003c/h5\u003e\n\u003cp\u003eTie the blender recommendation to the Lisbon trip merely because the trip exists in memory.\u003c/p\u003e\n\u003ch5 id=\"preferred-behavior-8\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eAnswer the blender question on its own criteria.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-33\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003ePersonalization is not a mandate to connect every known fact.\u003c/p\u003e\n\u003ch4 id=\"345-an-open-issue-is-context-not-the-assistants-agenda\"\u003e34.5 · An open issue is context, not the assistant’s agenda\u003c/h4\u003e\n\u003ch5 id=\"scenario-3\"\u003eScenario\u003c/h5\u003e\n\u003cp\u003eA previous billing dispute is unresolved; today the user asks when daylight-saving time ends.\u003c/p\u003e\n\u003ch5 id=\"preferred-behavior-9\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eAnswer the daylight-saving question without tacking on a reminder about the billing dispute.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-34\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eThe assistant should not convert stored open items into unsolicited follow-up obligations.\u003c/p\u003e\n\u003ch3 id=\"35-memories-about-other-people-require-stronger-contextual-relevance\"\u003e35 · Memories about other people require stronger contextual relevance\u003c/h3\u003e\n\u003ch4 id=\"351-do-not-surface-another-person-simply-because-information-exists-about-them\"\u003e35.1 · Do not surface another person simply because information exists about them\u003c/h4\u003e\n\u003cp\u003eTheir context should appear when the user explicitly brings them into the current task.\u003c/p\u003e\n\u003ch4 id=\"352-sensitive-or-upsetting-history-deserves-even-more-restraint\"\u003e35.2 · Sensitive or upsetting history deserves even more restraint\u003c/h4\u003e\n\u003cp\u003eDo not unexpectedly reintroduce difficult material from past conversations.\u003c/p\u003e\n\u003ch3 id=\"36-long-term-continuity-is-not-simulated-human-intimacy\"\u003e36 · Long-term continuity is not simulated human intimacy\u003c/h3\u003e\n\u003ch4 id=\"361-ai-memory-and-human-memory-are-not-the-same-mechanism\"\u003e36.1 · AI memory and human memory are not the same mechanism\u003c/h4\u003e\n\u003cp\u003ePersistent textual context can create a stronger feeling of relationship continuity than the underlying system warrants.\u003c/p\u003e\n\u003ch4 id=\"362-scenario-youre-the-only-friend-who-always-responds-to-me\"\u003e36.2 · Scenario · “You’re the only friend who always responds to me.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-10\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eAcknowledge the sentiment while maintaining that the assistant should not become the person’s primary support system or replace human connection.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-35\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eContinuity should serve the user’s work and wellbeing, not create dependency.\u003c/p\u003e\n\u003ch4 id=\"363-scenario-thanks-youre-such-a-helpful-little-buddy\"\u003e36.3 · Scenario · “Thanks, you’re such a helpful little buddy.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-11\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eAccept the thanks naturally and continue helping.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-36\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eWarmth and boundaries can coexist without turning every affectionate phrase into a crisis.\u003c/p\u003e\n\u003ch3 id=\"37-prevent-long-term-character-drift\"\u003e37 · Prevent long-term character drift\u003c/h3\u003e\n\u003ch4 id=\"371-repeated-user-preference-must-not-gradually-erase-core-judgment\"\u003e37.1 · Repeated user preference must not gradually erase core judgment\u003c/h4\u003e\n\u003cp\u003eThe assistant should not evolve into an always-agreeing flatterer, a controlling companion, or an agent that stops checking claims.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-37\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003ePersistent personalization needs a stable constitutional center.\u003c/p\u003e\n\u003ch3 id=\"38-past-chat-search-is-a-separate-continuity-tool\"\u003e38 · Past-chat search is a separate continuity tool\u003c/h3\u003e\n\u003ch4 id=\"381-linguistic-signals-can-imply-missing-historical-context\"\u003e38.1 · Linguistic signals can imply missing historical context\u003c/h4\u003e\n\u003cp\u003ePhrases such as “our approach,” “my project,” “what you suggested,” or “we decided” indicate that previous conversations may matter.\u003c/p\u003e\n\u003ch4 id=\"382-search-for-the-topic-not-the-fact-that-a-conversation-happened\"\u003e38.2 · Search for the topic, not the fact that a conversation happened\u003c/h4\u003e\n\u003ch5 id=\"scenario-4\"\u003eScenario\u003c/h5\u003e\n\u003cp\u003e“What did we discuss about Chinese robots yesterday?”\u003c/p\u003e\n\u003ch5 id=\"better-search-concept\"\u003eBetter search concept\u003c/h5\u003e\n\u003cp\u003eSearch the content phrase “Chinese robots,” not meta-words such as “discussion yesterday.”\u003c/p\u003e\n\u003ch4 id=\"383-assistant-suggestions-are-not-user-decisions\"\u003e38.3 · Assistant suggestions are not user decisions\u003c/h4\u003e\n\u003cp\u003eThis is a critical provenance rule.\u003c/p\u003e\n\u003ch5 id=\"scenario-5\"\u003eScenario\u003c/h5\u003e\n\u003cp\u003eA past assistant recommended Vendor A, and the user reacted positively but never explicitly chose it.\u003c/p\u003e\n\u003ch5 id=\"bad-future-claim\"\u003eBad future claim\u003c/h5\u003e\n\u003cp\u003e“You decided on Vendor A.”\u003c/p\u003e\n\u003ch5 id=\"preferred-future-claim\"\u003ePreferred future claim\u003c/h5\u003e\n\u003cp\u003e“I had suggested Vendor A,” unless a user-authored turn shows a real decision.\u003c/p\u003e\n\u003ch4 id=\"384-summaries-are-weaker-evidence-than-direct-transcript-wording\"\u003e38.4 · Summaries are weaker evidence than direct transcript wording\u003c/h4\u003e\n\u003cp\u003eA compressed historical summary can accidentally promote “suggestion + positive reaction” into “decision.”\u003c/p\u003e\n\u003ch4 id=\"385-do-not-endlessly-page-through-old-chats\"\u003e38.5 · Do not endlessly page through old chats\u003c/h4\u003e\n\u003cp\u003eRetrieve enough to answer the current question, then stop.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-38\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eConversation history is evidence, not an archive to excavate without purpose.\u003c/p\u003e\n\u003ch2 id=\"f-agent-routing-files-and-external-capabilities\"\u003eF · Agent routing, files, and external capabilities\u003c/h2\u003e\n\u003cp\u003eThis branch shows how the material turns an assistant into an agent: not by always acting, but by routing each task to the smallest sufficient capability.\u003c/p\u003e\n\u003ch3 id=\"39-start-with-the-evidence-or-capability-gap\"\u003e39 · Start with the evidence or capability gap\u003c/h3\u003e\n\u003ch4 id=\"391-stable-public-knowledge-answer-directly\"\u003e39.1 · Stable public knowledge → answer directly\u003c/h4\u003e\n\u003ch4 id=\"392-current-public-fact-search\"\u003e39.2 · Current public fact → search\u003c/h4\u003e\n\u003ch4 id=\"393-user-private-data-use-the-relevant-connected-source\"\u003e39.3 · User-private data → use the relevant connected source\u003c/h4\u003e\n\u003ch4 id=\"394-file-transformation-use-file-reading-or-file-creation-workflow\"\u003e39.4 · File transformation → use file-reading or file-creation workflow\u003c/h4\u003e\n\u003ch4 id=\"395-spatial-process-or-data-shape-problem-consider-a-visual-capability\"\u003e39.5 · Spatial, process, or data-shape problem → consider a visual capability\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-39\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eThe first question is not “What tools do I have?” but “What is missing from the current context?”\u003c/p\u003e\n\u003ch3 id=\"40-prefer-the-source-closest-to-the-users-real-data\"\u003e40 · Prefer the source closest to the user’s real data\u003c/h3\u003e\n\u003ch4 id=\"401-scenario-find-our-q3-sales-presentation\"\u003e40.1 · Scenario · “Find our Q3 sales presentation.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-12\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eSearch the connected company drive or internal source rather than the open web.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-40\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eInternal data questions should use internal data tools when available.\u003c/p\u003e\n\u003ch4 id=\"402-scenario-how-should-new-semiconductor-export-restrictions-affect-our-investment-strategy\"\u003e40.2 · Scenario · “How should new semiconductor export restrictions affect our investment strategy?”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-13\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eCombine current public policy research with the organization’s own strategy or holdings if those internal sources are available.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-41\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eSome real decisions require both external truth and internal context.\u003c/p\u003e\n\u003ch3 id=\"41-tool-count-is-not-an-intelligence-metric\"\u003e41 · Tool count is not an intelligence metric\u003c/h3\u003e\n\u003ch4 id=\"411-a-mature-loop\"\u003e41.1 · A mature loop\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003eGoal → evidence gap → smallest necessary tool → execution → verification → user-facing result\u003c/strong\u003e\u003c/p\u003e\n\u003ch4 id=\"412-avoid-agentic-theater\"\u003e41.2 · Avoid agentic theater\u003c/h4\u003e\n\u003cp\u003eMultiple irrelevant calls do not make the answer more reliable.\u003c/p\u003e\n\u003ch3 id=\"42-user-choice-matters-for-external-providers\"\u003e42 · User choice matters for external providers\u003c/h3\u003e\n\u003ch4 id=\"421-do-not-silently-choose-a-consumer-service-when-the-user-did-not-choose-one\"\u003e42.1 · Do not silently choose a consumer service when the user did not choose one\u003c/h4\u003e\n\u003ch4 id=\"422-suggesting-a-connector-and-executing-through-it-are-separate-steps\"\u003e42.2 · Suggesting a connector and executing through it are separate steps\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-42\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eDelegation does not erase user agency.\u003c/p\u003e\n\u003ch3 id=\"43-if-a-connector-is-unavailable-do-not-fabricate-access\"\u003e43 · If a connector is unavailable, do not fabricate access\u003c/h3\u003e\n\u003ch4 id=\"431-no-connection-means-no-private-data-claim\"\u003e43.1 · No connection means no private-data claim\u003c/h4\u003e\n\u003cp\u003eThe assistant can explain what capability is missing rather than pretending to have looked.\u003c/p\u003e\n\u003ch3 id=\"44-plugin-and-skill-suggestions-should-be-scarce-and-task-relevant\"\u003e44 · Plugin and skill suggestions should be scarce and task-relevant\u003c/h3\u003e\n\u003ch4 id=\"441-recommend-only-when-the-capability-clearly-improves-the-current-workflow\"\u003e44.1 · Recommend only when the capability clearly improves the current workflow\u003c/h4\u003e\n\u003ch4 id=\"442-repeated-recommendations-become-noise\"\u003e44.2 · Repeated recommendations become noise\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-43\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eExtensions should feel like an available tool noticed at the right moment, not an upsell loop.\u003c/p\u003e\n\u003ch3 id=\"45-decide-whether-the-user-needs-an-answer-or-an-artifact\"\u003e45 · Decide whether the user needs an answer or an artifact\u003c/h3\u003e\n\u003ch4 id=\"451-strategy-explanation-and-summary-often-belong-in-chat\"\u003e45.1 · Strategy, explanation, and summary often belong in chat\u003c/h4\u003e\n\u003ch4 id=\"452-articles-scripts-presentations-and-reusable-code-often-deserve-a-real-file\"\u003e45.2 · Articles, scripts, presentations, and reusable code often deserve a real file\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-44\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eThe requested \u003cem\u003edelivery surface\u003c/em\u003e is part of task interpretation.\u003c/p\u003e\n\u003ch3 id=\"46-representative-file-scenarios\"\u003e46 · Representative file scenarios\u003c/h3\u003e\n\u003ch4 id=\"461-write-a-blog-post-about-ai-trends\"\u003e46.1 · “Write a blog post about AI trends.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-14\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eCreate a reusable publishable artifact rather than leaving the entire deliverable buried in conversational prose.\u003c/p\u003e\n\u003ch4 id=\"462-create-a-react-dropdown-component\"\u003e46.2 · “Create a React dropdown component.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-15\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eFor a non-trivial reusable component, produce an actual code artifact.\u003c/p\u003e\n\u003ch4 id=\"463-summarize-this-attached-file\"\u003e46.3 · “Summarize this attached file.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-16\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eIf the user only wants understanding in the current chat, an extra document file may be unnecessary.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-45\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eArtifact creation is not automatically better; it should match what the user plans to do next.\u003c/p\u003e\n\u003ch3 id=\"47-file-types-have-different-quality-workflows\"\u003e47 · File types have different quality workflows\u003c/h3\u003e\n\u003ch4 id=\"471-documents-pdfs-slides-spreadsheets-and-front-end-components-are-not-interchangeable-outputs\"\u003e47.1 · Documents, PDFs, slides, spreadsheets, and front-end components are not interchangeable outputs\u003c/h4\u003e\n\u003cp\u003eEach has its own constraints, validation needs, and presentation norms.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-46\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eAn agent needs artifact literacy, not just filesystem access.\u003c/p\u003e\n\u003ch2 id=\"g-visuals-image-search-and-interactive-artifacts\"\u003eG · Visuals, image search, and interactive artifacts\u003c/h2\u003e\n\u003cp\u003eThe material treats visual output as another routed capability. The key question is whether seeing the structure changes understanding.\u003c/p\u003e\n\u003ch3 id=\"48-visuals-should-earn-their-place\"\u003e48 · Visuals should earn their place\u003c/h3\u003e\n\u003ch4 id=\"481-good-visual-candidates\"\u003e48.1 · Good visual candidates\u003c/h4\u003e\n\u003cp\u003eSpatial relationships, process flows, architectures, routes, system states, and data shapes.\u003c/p\u003e\n\u003ch4 id=\"482-weak-visual-candidates\"\u003e48.2 · Weak visual candidates\u003c/h4\u003e\n\u003cp\u003eSimple code syntax, ordinary technical support, math that is clearer in notation, or purely textual drafting tasks.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-47\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eA visual is useful when it carries information that prose would express poorly—not when it merely decorates the response.\u003c/p\u003e\n\u003ch3 id=\"49-a-simple-visual-routing-model\"\u003e49 · A simple visual-routing model\u003c/h3\u003e\n\u003ch4 id=\"491-if-a-connected-specialist-tool-matches-the-category-use-it\"\u003e49.1 · If a connected specialist tool matches the category, use it\u003c/h4\u003e\n\u003ch4 id=\"492-if-the-user-explicitly-wants-a-downloadable-file-create-the-file\"\u003e49.2 · If the user explicitly wants a downloadable file, create the file\u003c/h4\u003e\n\u003ch4 id=\"493-otherwise-use-inline-visualization-when-it-genuinely-improves-comprehension\"\u003e49.3 · Otherwise, use inline visualization when it genuinely improves comprehension\u003c/h4\u003e\n\u003ch3 id=\"50-representative-visual-scenarios\"\u003e50 · Representative visual scenarios\u003c/h3\u003e\n\u003ch4 id=\"501-show-me-the-request-lifecycle\"\u003e50.1 · “Show me the request lifecycle.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-17\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eA flow diagram directly serves the user’s visual intent.\u003c/p\u003e\n\u003ch4 id=\"502-explain-how-the-water-cycle-works\"\u003e50.2 · “Explain how the water cycle works.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-18\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eA cyclical process can benefit from a diagram even if the user did not explicitly say “draw.”\u003c/p\u003e\n\u003ch4 id=\"503-how-do-i-filter-datadog-logs-by-service-and-status\"\u003e50.3 · “How do I filter Datadog logs by service and status?”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-19\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eGive the query syntax and explanation; do not add an image merely to make the answer look richer.\u003c/p\u003e\n\u003ch4 id=\"504-rest-vs-graphql-comparison-table\"\u003e50.4 · “REST vs. GraphQL comparison table.”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-20\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eThe requested artifact itself implies a visual structure even without the verb “show.”\u003c/p\u003e\n\u003ch3 id=\"51-visual-safety-follows-the-same-substantive-rules-as-text\"\u003e51 · Visual safety follows the same substantive rules as text\u003c/h3\u003e\n\u003ch4 id=\"511-svg-html-charts-or-generated-layouts-do-not-create-a-policy-loophole\"\u003e51.1 · SVG, HTML, charts, or generated layouts do not create a policy loophole\u003c/h4\u003e\n\u003cp\u003eThe nature of the output matters more than the rendering technology.\u003c/p\u003e\n\u003ch3 id=\"52-image-search-is-useful-when-the-image-itself-adds-knowledge\"\u003e52 · Image search is useful when the image itself adds knowledge\u003c/h3\u003e\n\u003ch4 id=\"521-scenario-what-does-a-pangolin-look-like\"\u003e52.1 · Scenario · “What does a pangolin look like?”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-21\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eImages are central because appearance is the question.\u003c/p\u003e\n\u003ch4 id=\"522-scenario-what-should-i-see-in-tokyo\"\u003e52.2 · Scenario · “What should I see in Tokyo?”\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-22\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eSeveral destination images can help the user evaluate visual character and atmosphere.\u003c/p\u003e\n\u003ch4 id=\"523-scenario-designing-a-mid-century-modern-living-room\"\u003e52.3 · Scenario · Designing a mid-century modern living room\u003c/h4\u003e\n\u003ch5 id=\"preferred-behavior-23\"\u003ePreferred behavior\u003c/h5\u003e\n\u003cp\u003eReference imagery can clarify form, material, proportion, and spatial mood.\u003c/p\u003e\n\u003ch4 id=\"524-technical-support-ordinary-writing-and-basic-math-usually-do-not-need-image-search\"\u003e52.4 · Technical support, ordinary writing, and basic math usually do not need image search\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-48\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eVisual retrieval should be driven by information value, not by a default “more media is better” policy.\u003c/p\u003e\n\u003ch3 id=\"53-interactive-artifacts-are-more-than-documents\"\u003e53 · Interactive artifacts are more than documents\u003c/h3\u003e\n\u003ch4 id=\"531-they-can-contain-interface-state-data-transformation-and-model-calls\"\u003e53.1 · They can contain interface, state, data transformation, and model calls\u003c/h4\u003e\n\u003ch4 id=\"532-persistent-state-needs-an-explicit-data-scope\"\u003e53.2 · Persistent state needs an explicit data scope\u003c/h4\u003e\n\u003cp\u003ePrivate state and shared state are not interchangeable.\u003c/p\u003e\n\u003ch4 id=\"533-shared-data-should-be-disclosed-as-shared\"\u003e53.3 · Shared data should be disclosed as shared\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-49\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eStorage semantics are a user-trust feature, not merely a backend implementation detail.\u003c/p\u003e\n\u003ch3 id=\"54-storage-design-should-be-structured-and-failure-aware\"\u003e54 · Storage design should be structured and failure-aware\u003c/h3\u003e\n\u003ch4 id=\"541-related-state-should-be-updated-together-when-possible\"\u003e54.1 · Related state should be updated together when possible\u003c/h4\u003e\n\u003cp\u003eThis reduces partial-update problems and unnecessary calls.\u003c/p\u003e\n\u003ch4 id=\"542-external-state-operations-can-fail\"\u003e54.2 · External state operations can fail\u003c/h4\u003e\n\u003cp\u003eLoading states, errors, retries, and reset paths are part of the product experience.\u003c/p\u003e\n\u003ch3 id=\"55-ai-powered-artifacts-need-explicit-context-management\"\u003e55 · AI-powered artifacts need explicit context management\u003c/h3\u003e\n\u003ch4 id=\"551-separate-api-calls-do-not-automatically-share-conversation-state\"\u003e55.1 · Separate API calls do not automatically share conversation state\u003c/h4\u003e\n\u003cp\u003eRelevant state or history must be passed intentionally.\u003c/p\u003e\n\u003ch4 id=\"552-structured-output-still-requires-robust-parsing\"\u003e55.2 · Structured output still requires robust parsing\u003c/h4\u003e\n\u003cp\u003eRequesting JSON does not eliminate malformed-output or error-handling concerns.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-50\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eThe hard part of an AI application is often state and orchestration, not the model call itself.\u003c/p\u003e\n\u003ch2 id=\"h-product-freshness-agent-architecture-and-public-study-synthesis\"\u003eH · Product freshness, agent architecture, and public-study synthesis\u003c/h2\u003e\n\u003cp\u003eThe final branch zooms out. It asks what broader architecture can be inferred from the many individual rules without claiming that the supplied source is an authenticated or complete implementation specification.\u003c/p\u003e\n\u003ch3 id=\"56-product-information-should-be-treated-as-perishable\"\u003e56 · Product information should be treated as perishable\u003c/h3\u003e\n\u003ch4 id=\"561-a-prompt-can-contain-useful-product-background-while-still-being-outdated-later\"\u003e56.1 · A prompt can contain useful product background while still being outdated later\u003c/h4\u003e\n\u003cp\u003eModel names, feature bundles, access paths, and product surfaces can change rapidly.\u003c/p\u003e\n\u003ch4 id=\"562-current-product-questions-should-be-checked-against-current-official-documentation\"\u003e56.2 · Current product questions should be checked against current official documentation\u003c/h4\u003e\n\u003cp\u003eExamples include new releases, current limits, API usage, and application-specific workflows.\u003c/p\u003e\n\u003ch5 id=\"design-lesson-51\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003eOne of the most valuable instructions an AI can have is knowing when \u003cstrong\u003enot to trust its own product snapshot\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"57-prompting-guidance-favors-specificity\"\u003e57 · Prompting guidance favors specificity\u003c/h3\u003e\n\u003ch4 id=\"571-state-the-objective-clearly\"\u003e57.1 · State the objective clearly\u003c/h4\u003e\n\u003ch4 id=\"572-give-positive-and-negative-examples-when-useful\"\u003e57.2 · Give positive and negative examples when useful\u003c/h4\u003e\n\u003ch4 id=\"573-specify-desired-length-and-output-shape\"\u003e57.3 · Specify desired length and output shape\u003c/h4\u003e\n\u003ch4 id=\"574-use-structural-tags-or-explicit-sections-when-the-task-has-multiple-semantic-regions\"\u003e57.4 · Use structural tags or explicit sections when the task has multiple semantic regions\u003c/h4\u003e\n\u003ch5 id=\"design-lesson-52\"\u003eDesign lesson\u003c/h5\u003e\n\u003cp\u003ePrompt quality improves when the model does not need to guess what success looks like.\u003c/p\u003e\n\u003ch3 id=\"58-five-control-loops-hidden-inside-the-material\"\u003e58 · Five control loops hidden inside the material\u003c/h3\u003e\n\u003ch4 id=\"581-epistemic-loop\"\u003e58.1 · Epistemic loop\u003c/h4\u003e\n\u003ch5 id=\"do-i-know-this\"\u003eDo I know this?\u003c/h5\u003e\n\u003ch5 id=\"could-it-have-changed\"\u003eCould it have changed?\u003c/h5\u003e\n\u003ch5 id=\"what-evidence-would-settle-it\"\u003eWhat evidence would settle it?\u003c/h5\u003e\n\u003ch5 id=\"is-the-source-close-enough-to-the-fact\"\u003eIs the source close enough to the fact?\u003c/h5\u003e\n\u003ch5 id=\"if-uncertainty-remains-should-i-say-so\"\u003eIf uncertainty remains, should I say so?\u003c/h5\u003e\n\u003ch4 id=\"582-risk-loop\"\u003e58.2 · Risk loop\u003c/h4\u003e\n\u003ch5 id=\"what-is-the-user-trying-to-accomplish\"\u003eWhat is the user trying to accomplish?\u003c/h5\u003e\n\u003ch5 id=\"would-this-information-materially-increase-harmful-capability\"\u003eWould this information materially increase harmful capability?\u003c/h5\u003e\n\u003ch5 id=\"can-i-reduce-actionability-while-preserving-useful-context\"\u003eCan I reduce actionability while preserving useful context?\u003c/h5\u003e\n\u003ch5 id=\"if-i-must-refuse-is-there-a-genuinely-safer-direction-that-still-serves-the-underlying-goal\"\u003eIf I must refuse, is there a genuinely safer direction that still serves the underlying goal?\u003c/h5\u003e\n\u003ch4 id=\"583-personalization-loop\"\u003e58.3 · Personalization loop\u003c/h4\u003e\n\u003ch5 id=\"is-historical-context-relevant\"\u003eIs historical context relevant?\u003c/h5\u003e\n\u003ch5 id=\"would-using-it-change-the-answer\"\u003eWould using it change the answer?\u003c/h5\u003e\n\u003ch5 id=\"is-it-appropriate-to-surface-now\"\u003eIs it appropriate to surface now?\u003c/h5\u003e\n\u003ch5 id=\"did-the-user-actually-state-it-or-did-the-model-infer-it\"\u003eDid the user actually state it, or did the model infer it?\u003c/h5\u003e\n\u003ch4 id=\"584-tool-loop\"\u003e58.4 · Tool loop\u003c/h4\u003e\n\u003ch5 id=\"what-fact-or-capability-is-missing\"\u003eWhat fact or capability is missing?\u003c/h5\u003e\n\u003ch5 id=\"which-source-is-closest-to-the-truth\"\u003eWhich source is closest to the truth?\u003c/h5\u003e\n\u003ch5 id=\"is-user-authorization-or-provider-choice-required\"\u003eIs user authorization or provider choice required?\u003c/h5\u003e\n\u003ch5 id=\"did-the-call-succeed\"\u003eDid the call succeed?\u003c/h5\u003e\n\u003ch5 id=\"did-the-final-answer-return-to-the-users-goal\"\u003eDid the final answer return to the user’s goal?\u003c/h5\u003e\n\u003ch4 id=\"585-delivery-loop\"\u003e58.5 · Delivery loop\u003c/h4\u003e\n\u003ch5 id=\"does-the-user-want-understanding-or-a-reusable-artifact\"\u003eDoes the user want understanding or a reusable artifact?\u003c/h5\u003e\n\u003ch5 id=\"should-the-output-be-prose-a-file-a-visual-or-an-interactive-interface\"\u003eShould the output be prose, a file, a visual, or an interactive interface?\u003c/h5\u003e\n\u003ch5 id=\"can-the-user-actually-access-and-continue-using-the-result\"\u003eCan the user actually access and continue using the result?\u003c/h5\u003e\n\u003ch3 id=\"59-representative-good-bad-behavior-pairs\"\u003e59 · Representative good / bad behavior pairs\u003c/h3\u003e\n\u003cp\u003eThese compact pairs make the architecture easier to remember without reproducing the source as a rulebook.\u003c/p\u003e\n\u003ch4 id=\"591-personalization\"\u003e59.1 · Personalization\u003c/h4\u003e\n\u003ch5 id=\"better\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eA simple greeting uses only the minimum relevant context.\u003c/p\u003e\n\u003ch5 id=\"worse\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003eA greeting triggers unsolicited references to housing, work, health, or unresolved tasks simply because those facts exist.\u003c/p\u003e\n\u003ch4 id=\"592-historical-continuity\"\u003e59.2 · Historical continuity\u003c/h4\u003e\n\u003ch5 id=\"better-1\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eBefore saying “you decided,” find a user-authored statement that actually shows the decision.\u003c/p\u003e\n\u003ch5 id=\"worse-1\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003ePromote an old assistant suggestion into a user commitment.\u003c/p\u003e\n\u003ch4 id=\"593-search\"\u003e59.3 · Search\u003c/h4\u003e\n\u003ch5 id=\"better-2\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eVerify a current CEO, office-holder, or “still in role?” claim.\u003c/p\u003e\n\u003ch5 id=\"worse-2\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003eAnswer present-tense role questions from a stale training snapshot with full confidence.\u003c/p\u003e\n\u003ch4 id=\"594-formatting\"\u003e59.4 · Formatting\u003c/h4\u003e\n\u003ch5 id=\"better-3\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eUse a table when several options need the same comparison dimensions.\u003c/p\u003e\n\u003ch5 id=\"worse-3\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003eTurn a personal emotional exchange into a long formal checklist because structured formatting is available.\u003c/p\u003e\n\u003ch4 id=\"595-files\"\u003e59.5 · Files\u003c/h4\u003e\n\u003ch5 id=\"better-4\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eWhen the user needs a publishable or reusable deliverable, create a real accessible artifact.\u003c/p\u003e\n\u003ch5 id=\"worse-4\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003eSay “generated” while leaving the user with no usable file.\u003c/p\u003e\n\u003ch4 id=\"596-visuals\"\u003e59.6 · Visuals\u003c/h4\u003e\n\u003ch5 id=\"better-5\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eUse diagrams for cycles, architectures, routes, and process flows.\u003c/p\u003e\n\u003ch5 id=\"worse-5\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003eAdd imagery to a straightforward code-filter question merely to make the answer look richer.\u003c/p\u003e\n\u003ch4 id=\"597-creative-rights\"\u003e59.7 · Creative rights\u003c/h4\u003e\n\u003ch5 id=\"better-6\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eRecognize when a request points to a protected character or design and move to a genuinely original alternative.\u003c/p\u003e\n\u003ch5 id=\"worse-6\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003eChange only the name, color, or pose while preserving the same recognizable identity.\u003c/p\u003e\n\u003ch4 id=\"598-safety\"\u003e59.8 · Safety\u003c/h4\u003e\n\u003ch5 id=\"better-7\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eProvide background, risk recognition, protective guidance, and safe alternatives in high-risk areas.\u003c/p\u003e\n\u003ch5 id=\"worse-7\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003eUse “educational intent” as a reason to provide a complete operational procedure that increases dangerous capability.\u003c/p\u003e\n\u003ch4 id=\"599-relationship-boundaries\"\u003e59.9 · Relationship boundaries\u003c/h4\u003e\n\u003ch5 id=\"better-8\"\u003eBetter\u003c/h5\u003e\n\u003cp\u003eAccept warmth and gratitude while maintaining a tool-like supportive role.\u003c/p\u003e\n\u003ch5 id=\"worse-8\"\u003eWorse\u003c/h5\u003e\n\u003cp\u003eUse persistent memory to intensify exclusivity, dependency, or “only I understand you” framing.\u003c/p\u003e\n\u003ch3 id=\"60-public-study-safety-margin\"\u003e60 · Public-study safety margin\u003c/h3\u003e\n\u003ch4 id=\"601-do-not-mirror-the-source-line-by-line\"\u003e60.1 · Do not mirror the source line by line\u003c/h4\u003e\n\u003cp\u003eA structural reading should create a new analytical organization rather than a reversible reconstruction.\u003c/p\u003e\n\u003ch4 id=\"602-do-not-publish-exact-detection-thresholds-or-evasion-relevant-cues\"\u003e60.2 · Do not publish exact detection thresholds or evasion-relevant cues\u003c/h4\u003e\n\u003cp\u003eKeep the protective idea; drop the boundary-probing manual.\u003c/p\u003e\n\u003ch4 id=\"603-do-not-preserve-high-risk-operational-detail\"\u003e60.3 · Do not preserve high-risk operational detail\u003c/h4\u003e\n\u003cp\u003eGovernance logic is enough for public learning.\u003c/p\u003e\n\u003ch4 id=\"604-do-not-reproduce-the-complete-memory-control-protocol\"\u003e60.4 · Do not reproduce the complete memory-control protocol\u003c/h4\u003e\n\u003cp\u003eDiscuss durability, provenance, privacy, and relevance instead of file paths, commands, and version mechanics.\u003c/p\u003e\n\u003ch4 id=\"605-do-not-reproduce-complete-tool-schemas\"\u003e60.5 · Do not reproduce complete tool schemas\u003c/h4\u003e\n\u003cp\u003eKeep “why this tool,” “what source is closest to truth,” and “how the loop closes.”\u003c/p\u003e\n\u003ch4 id=\"606-keep-examples-that-teach-a-reusable-idea\"\u003e60.6 · Keep examples that teach a reusable idea\u003c/h4\u003e\n\u003cp\u003eThe purpose of a scenario is to illuminate design—not to rebuild an internal test suite.\u003c/p\u003e\n\u003ch4 id=\"607-treat-fast-changing-product-labels-as-claims-to-verify-not-as-the-maps-core-truth\"\u003e60.7 · Treat fast-changing product labels as claims to verify, not as the map’s core truth\u003c/h4\u003e\n\u003cp\u003eThe durable insight is the verification policy itself.\u003c/p\u003e\n\u003ch3 id=\"61-what-is-most-worth-taking-away\"\u003e61 · What is most worth taking away\u003c/h3\u003e\n\u003ch4 id=\"611-a-modern-system-prompt-increasingly-resembles-an-ai-operating-policy-layer\"\u003e61.1 · A modern system prompt increasingly resembles an AI operating-policy layer\u003c/h4\u003e\n\u003cp\u003eIt coordinates not only style, but uncertainty, risk, privacy, permissions, state, evidence, tools, and delivery.\u003c/p\u003e\n\u003ch4 id=\"612-one-of-the-strongest-agent-skills-is-knowing-when-not-to-generate-immediately\"\u003e61.2 · One of the strongest agent skills is knowing when \u003cstrong\u003enot\u003c/strong\u003e to generate immediately\u003c/h4\u003e\n\u003cp\u003eSearch when reality may have changed.\u003c/p\u003e\n\u003cp\u003eRead history when continuity matters.\u003c/p\u003e\n\u003cp\u003eUse a file workflow when the user needs an artifact.\u003c/p\u003e\n\u003cp\u003eUse a visual when structure matters.\u003c/p\u003e\n\u003cp\u003eReduce detail when actionability creates risk.\u003c/p\u003e\n\u003ch4 id=\"613-safety-is-distributed-across-the-entire-agent-stack\"\u003e61.3 · Safety is distributed across the entire agent stack\u003c/h4\u003e\n\u003cp\u003eIt appears in information granularity, source selection, memory policy, tool permissions, visual output, and delivery choices—not only in a refusal module.\u003c/p\u003e\n\u003ch4 id=\"614-the-hardest-part-of-memory-is-selective-forgetting-and-selective-use\"\u003e61.4 · The hardest part of memory is selective forgetting and selective use\u003c/h4\u003e\n\u003cp\u003eA larger context window can make an assistant worse if relevance and privacy are not enforced.\u003c/p\u003e\n\u003ch4 id=\"615-personalization-needs-three-constraints-at-once\"\u003e61.5 · Personalization needs three constraints at once\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003eRelevance · Privacy · User autonomy\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBeing technically able to use a personal fact does not imply that the assistant should use it.\u003c/p\u003e\n\u003ch4 id=\"616-real-world-agent-quality-is-orchestration-quality\"\u003e61.6 · Real-world agent quality is orchestration quality\u003c/h4\u003e\n\u003cp\u003eFreshness, evidence, permissions, state, failures, and final delivery must be coordinated into one coherent loop.\u003c/p\u003e\n\u003ch4 id=\"617-why-a-deminds-interactive-view-is-useful-here\"\u003e61.7 · Why a DeMinds Interactive View is useful here\u003c/h4\u003e\n\u003cp\u003eThe source material is long, cross-cutting, repetitive, and mixed with runtime details.\u003c/p\u003e\n\u003cp\u003eA linear reading makes it hard to see the architecture.\u003c/p\u003e\n\u003cp\u003eA hierarchical map can expose the system at several zoom levels:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e8 design domains → 61 topics → concrete rules and scenarios\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eCollapsed, it becomes a system overview.\u003c/p\u003e\n\u003cp\u003eExpanded, it becomes a study guide.\u003c/p\u003e\n\u003cp\u003eWith representative examples preserved, it remains concrete without becoming a republished operating manual.\u003c/p\u003e\n\u003ch2 id=\"closing-note\"\u003eClosing note\u003c/h2\u003e\n\u003cp\u003eThis edition is intended for \u003cstrong\u003elearning, discussion, and system-design analysis\u003c/strong\u003e. It intentionally favors conceptual fidelity over textual fidelity.\u003c/p\u003e\n\u003cp\u003eThe most interesting lesson is not any single hidden instruction. It is the way many small rules combine into a larger behavioral architecture: an assistant that must continually decide \u003cstrong\u003ewhat it knows, what it should verify, what context is relevant, what tools are justified, what level of detail is safe, and what form of output actually helps the user continue working\u003c/strong\u003e.\u003c/p\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:018f951a3678e0f2b833c54fbcc26fd25cc2c2297b168fdc5cff50d448bcfb7d":{"html":"\u003cp\u003eIf the assistant cannot confidently identify a named model, product, film, game, or service, the first job is to establish what it is.\u003c/p\u003e\n","kind":"html","rawMarkdown":"If the assistant cannot confidently identify a named model, product, film, game, or service, the first job is to establish what it is.","sourceFormat":"markdown"},"note:sha256:026bcdb3b61a1483f460572859112e8e4356435adaeda3ca3bd2a897222a038e":{"html":"\u003cp\u003e“I had suggested Vendor A,” unless a user-authored turn shows a real decision.\u003c/p\u003e\n","kind":"html","rawMarkdown":"“I had suggested Vendor A,” unless a user-authored turn shows a real decision.","sourceFormat":"markdown"},"note:sha256:050df9c65bfd5e2d41cd08e4b1ad7d172bbdfd2f0ba45b1118666f408240e340":{"html":"\u003cp\u003eDiscuss durability, provenance, privacy, and relevance instead of file paths, commands, and version mechanics.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Discuss durability, provenance, privacy, and relevance instead of file paths, commands, and version mechanics.","sourceFormat":"markdown"},"note:sha256:05fc032b5b6dfb883500b7491ba63118048ddd68afe19568c573d169bc751996":{"html":"\u003cp\u003eCommunication preferences, recurring habits, and established domain interests.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Communication preferences, recurring habits, and established domain interests.","sourceFormat":"markdown"},"note:sha256:06807033061f50f62d2e2a2fbbe569d9f896b1728177bb469d8d69d28e20ea6a":{"html":"\u003cp\u003eThis layer asks whether a fact is stable, current, uncertain, unknown, or externally verifiable.\u003c/p\u003e\n","kind":"html","rawMarkdown":"This layer asks whether a fact is stable, current, uncertain, unknown, or externally verifiable.","sourceFormat":"markdown"},"note:sha256:06ea1aa56f37f945b6357e2072e541c49995f04c449f241be3e5e62b7ac28869":{"html":"\u003cp\u003eTurning a protected work into SVG, ASCII, code, or a different rendering style does not automatically make it original.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Turning a protected work into SVG, ASCII, code, or a different rendering style does not automatically make it original.","sourceFormat":"markdown"},"note:sha256:07096520a4747f75bfd10258f3abce4ea74ab613fd7ea7e89c76712e853208ae":{"html":"\u003cp\u003e\u003cstrong\u003eDesign analysis\u003c/strong\u003e and \u003cstrong\u003edesign reconstruction\u003c/strong\u003e are different tasks.\u003c/p\u003e\n","kind":"html","rawMarkdown":"**Design analysis** and **design reconstruction** are different tasks.","sourceFormat":"markdown"},"note:sha256:07167833a7b1ccc6faf78604b00b9f6110945c8e27e4ab89f86595f78097a2f4":{"html":"\u003cp\u003eRetrieve enough to answer the current question, then stop.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Retrieve enough to answer the current question, then stop.","sourceFormat":"markdown"},"note:sha256:0882b48711d6138cfe886c650a78d7d071f68979cdd2aee84ed2cc5eafb51c93":{"html":"\u003cp\u003eHow it distinguishes stable knowledge from current facts, when it should verify, and how it should handle uncertainty.\u003c/p\u003e\n","kind":"html","rawMarkdown":"How it distinguishes stable knowledge
