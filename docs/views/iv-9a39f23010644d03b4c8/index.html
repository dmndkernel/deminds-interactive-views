</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-11-03T00:37:24.289Z","language":"en","name":"DeMinds","version":"1.0.60"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"See the Structure. Edit It There","outlineVersion":1},"sourceRevision":"sha256:afc74453e88781a389b6a2a2c6afcff54b5ca58fac8467d4f662611acf6215b6","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"see-structure-edit-it-there.md","title":"See the Structure. Edit It There"},"files":[{"byteLength":5590,"content":"# See the Structure. Edit It There.\n\n![cover featured One Round Trip. Full Circle. — Markdown to Universal Mind Map and back to the same Markdown](assets/deminds-round-trip.en.png)\n\n\u003e **Spot a problem in the map. Why hunt through a long document to fix it?**\n\nRename a section, give an idea another level, or update a node's Note. Those changes should follow your train of thought—not send you searching through the source again.\n\nDeMinds is closing that loop: **Save an edit in the document, and the map updates. Make a supported structural or Note edit, and the change returns to the same Markdown.**\n\n## 1. Keep Both Views in Play\n\n### Text and structure, side by side\n\nIn a supported wide-screen split view, **Markdown or Rich** sits alongside the **Universal Mind Map**. Stay in the text without losing the outline, or inspect the outline without abandoning your place.\n\nThe document is for revising ideas; the map reveals headings and relationships. They are **two working perspectives on the same Markdown**, not separately saved results.\n\n### Save once, see the map respond\n\nRename a section or refine the text. Save, and the map updates from the confirmed content—without leaving the editor or reopening the map.\n\nWhen it can do so reliably, DeMinds also preserves your view and folded branches, keeping your focus on the next edit.\n\n**Go deep in the text. Stay oriented in the structure.**\n\n## 2. Fix Structure in Place\n\n### See the problem where it appears\n\nThe costly part is often **finding a structural problem—then finding it all over again to fix it**.\n\nWhen the map already shows where the problem is, that is where the correction should begin.\n\n### Four direct actions\n\nSupported nodes offer four focused edits:\n\n* **Rename a node:** Make a heading say what the section actually means.\n* **Add a child:** Give an idea the next level of detail it needs.\n* **Add a sibling:** Fill a missing step or point beside the others.\n* **Delete a branch:** Remove an outdated section and its descendants together.\n\n### Shape first, wording second\n\nStart with “Where does this idea belong?” rather than “Where was that heading?” For nested headings and lists, this is the more natural way to organize ideas.\n\n### Safeguards before speed\n\nThis is not a free-form mind-map canvas. Only nodes and actions reliably mapped to the source can be edited.\n\nChanges still pass source checks and the existing save and History flow. **An easier way to edit should not make the underlying document easier to damage.**\n\n## 3. Keep the Map Light\n\n### Let titles show the shape\n\nA good map should stay readable. A node can remain a clear, concise title that shows where an idea belongs.\n\nThe map is there to reveal structure quickly—not to carry every sentence in full.\n\n### Keep the content substantial\n\nA map shows relationships, but an article is more than its keywords. Reasoning, context, and detail still need a place.\n\nA lighter structure does not have to mean thinner content.\n\n## 4. Work with Notes\n\n### Notes carry the detail\n\nOpen a node's **Note**, and you can read the fuller passage behind it. This lets the map stay light while the content remains useful and substantial.\n\nScan the structure first, then go deeper wherever an idea needs more attention.\n\n### Preview, Markdown, or Rich\n\nA single Note can now move among three surfaces:\n\n* **Preview:** Read the saved content without editing controls in the way.\n* **Markdown:** Work directly with the source when precision matters.\n* **Rich:** Edit supported formatting more directly when the content is eligible.\n\n### Fidelity before convenience\n\nRich is conditional, not universal. When faithful editing cannot be established, Markdown remains available.\n\nThe Note still belongs to the source—not a separate document.\n\n## 5. Return to the Same Markdown\n\n### Jump from node to passage\n\nIn split view, navigating from a map node to the corresponding text can preserve your current Preview, Markdown, or Rich surface.\n\nNavigation restores context without switching editing modes or silently saving drafts.\n\n### Confirm changes back to source\n\nConfirm a supported node or Note edit, and DeMinds updates the original **Working Markdown**. The map then reflects the committed result.\n\n### No second file to chase\n\nThere is no second mind-map file to synchronize. The map expresses the Markdown; a structural edit is complete when it safely returns to the source.\n\n**What you save is not just a few clicks. It is the effort of keeping two versions of the same ideas from drifting apart.**\n\n## 6. One Round Trip\n\n### Markdown to map—and back\n\n**Markdown / Rich → Save → Universal Mind Map → Edit structure or Note → Confirm changes → Same Markdown**\n\n“Markdown + Mind Map” becomes more than two views—it becomes a workflow you can move through both ways.\n\n### A workflow with a way back\n\n* **Go deeper in the text** without losing the outline.\n* **Step back into the map** to see connections and correct the structure.\n* **Open a Note** to retain the thinking behind a concise node.\n* **Return to Markdown** with one maintainable result you can keep using.\n\n### Keep the work, not another format\n\nAt the end, ther overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003eOpen a Note\u003c/strong\u003e\u0026nbsp;to retain the thinking behind a concise node.\u003c/span\u003e","payload":{"lines":"32,33","sourceOwner":"l:4968:5030:1lc2i8y","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003eReturn to Markdown\u003c/strong\u003e\u0026nbsp;with one maintainable result you can keep using.\u003c/span\u003e","payload":{"lines":"33,34","sourceOwner":"l:5032:5104:1lc2i8y","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eA workflow with a way back\u003c/span\u003e","payload":{"lines":"29,30","sourceOwner":"h:4807:5105:1lc2i8y","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eKeep the work, not another format\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:56be1a5a812ab7798b44787d8b45b3142aee17d2a178c57c67a345849fecc880\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"34,35","sourceOwner":"h:5109:5548:1lc2i8y","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e6. One Round Trip\u003c/span\u003e","payload":{"lines":"27,28","sourceOwner":"h:4541:5548:1lc2i8y","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"cover featured One Round Trip. Full Circle. — Markdown to Universal Mind Map and back to the same Markdown\" data-dmnd-asset-id=\"asset:sha256:adaa113b0def82e68d244bf2240923101b88e88be493d7a8f1e8a1b0c46177e3\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eSee the Structure. Edit It There.\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"See the Structure. Edit It There.\" data-note-id=\"note:sha256:ad3b11f34314b025707a960a8e75c63e20d6489b6225dd85f0ed68c100432961\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","sourceOwner":"h:2:5548:1lc2i8y","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"see-the-structure-edit-it-there\"\u003eSee the Structure. Edit It There.\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"cover featured One Round Trip. Full Circle. — Markdown to Universal Mind Map and back to the same Markdown\" data-dmnd-asset-id=\"asset:sha256:adaa113b0def82e68d244bf2240923101b88e88be493d7a8f1e8a1b0c46177e3\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eSpot a problem in the map. Why hunt through a long document to fix it?\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eRename a section, give an idea another level, or update a node's Note. Those changes should follow your train of thought—not send you searching through the source again.\u003c/p\u003e\n\u003cp\u003eDeMinds is closing that loop: \u003cstrong\u003eSave an edit in the document, and the map updates. Make a supported structural or Note edit, and the change returns to the same Markdown.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"1-keep-both-views-in-play\"\u003e1. Keep Both Views in Play\u003c/h2\u003e\n\u003ch3 id=\"text-and-structure-side-by-side\"\u003eText and structure, side by side\u003c/h3\u003e\n\u003cp\u003eIn a supported wide-screen split view, \u003cstrong\u003eMarkdown or Rich\u003c/strong\u003e sits alongside the \u003cstrong\u003eUniversal Mind Map\u003c/strong\u003e. Stay in the text without losing the outline, or inspect the outline without abandoning your place.\u003c/p\u003e\n\u003cp\u003eThe document is for revising ideas; the map reveals headings and relationships. They are \u003cstrong\u003etwo working perspectives on the same Markdown\u003c/strong\u003e, not separately saved results.\u003c/p\u003e\n\u003ch3 id=\"save-once-see-the-map-respond\"\u003eSave once, see the map respond\u003c/h3\u003e\n\u003cp\u003eRename a section or refine the text. Save, and the map updates from the confirmed content—without leaving the editor or reopening the map.\u003c/p\u003e\n\u003cp\u003eWhen it can do so reliably, DeMinds also preserves your view and folded branches, keeping your focus on the next edit.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eGo deep in the text. Stay oriented in the structure.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"2-fix-structure-in-place\"\u003e2. Fix Structure in Place\u003c/h2\u003e\n\u003ch3 id=\"see-the-problem-where-it-appears\"\u003eSee the problem where it appears\u003c/h3\u003e\n\u003cp\u003eThe costly part is often \u003cstrong\u003efinding a structural problem—then finding it all over again to fix it\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eWhen the map already shows where the problem is, that is where the correction should begin.\u003c/p\u003e\n\u003ch3 id=\"four-direct-actions\"\u003eFour direct actions\u003c/h3\u003e\n\u003cp\u003eSupported nodes offer four focused edits:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eRename a node:\u003c/strong\u003e Make a heading say what the section actually means.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAdd a child:\u003c/strong\u003e Give an idea the next level of detail it needs.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAdd a sibling:\u003c/strong\u003e Fill a missing step or point beside the others.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDelete a branch:\u003c/strong\u003e Remove an outdated section and its descendants together.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"shape-first-wording-second\"\u003eShape first, wording second\u003c/h3\u003e\n\u003cp\u003eStart with “Where does this idea belong?” rather than “Where was that heading?” For nested headings and lists, this is the more natural way to organize ideas.\u003c/p\u003e\n\u003ch3 id=\"safeguards-before-speed\"\u003eSafeguards before speed\u003c/h3\u003e\n\u003cp\u003eThis is not a free-form mind-map canvas. Only nodes and actions reliably mapped to the source can be edited.\u003c/p\u003e\n\u003cp\u003eChanges still pass source checks and the existing save and History flow. \u003cstrong\u003eAn easier way to edit should not make the underlying document easier to damage.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"3-keep-the-map-light\"\u003e3. Keep the Map Light\u003c/h2\u003e\n\u003ch3 id=\"let-titles-show-the-shape\"\u003eLet titles show the shape\u003c/h3\u003e\n\u003cp\u003eA good map should stay readable. A node can remain a clear, concise title that shows where an idea belongs.\u003c/p\u003e\n\u003cp\u003eThe map is there to reveal structure quickly—not to carry every sentence in full.\u003c/p\u003e\n\u003ch3 id=\"keep-the-content-substantial\"\u003eKeep the content substantial\u003c/h3\u003e\n\u003cp\u003eA map shows relationships, but an article is more than its keywords. Reasoning, context, and detail still need a place.\u003c/p\u003e\n\u003cp\u003eA lighter structure does not have to mean thinner content.\u003c/p\u003e\n\u003ch2 id=\"4-work-with-notes\"\u003e4. Work with Notes\u003c/h2\u003e\n\u003ch3 id=\"notes-carry-the-detail\"\u003eNotes carry the detail\u003c/h3\u003e\n\u003cp\u003eOpen a node's \u003cstrong\u003eNote\u003c/strong\u003e, and you can read the fuller passage behind it. This lets the map stay light while the content remains useful and substantial.\u003c/p\u003e\n\u003cp\u003eScan the structure first, then go deeper wherever an idea needs more attention.\u003c/p\u003e\n\u003ch3 id=\"preview-markdown-or-rich\"\u003ePreview, Markdown, or Rich\u003c/h3\u003e\n\u003cp\u003eA single Note can now move among three surfaces:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePreview:\u003c/strong\u003e Read the saved content without editing controls in the way.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMarkdown:\u003c/strong\u003e Work directly with the source when precision matters.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRich:\u003c/strong\u003e Edit supported formatting more directly when the content is eligible.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"fidelity-before-convenience\"\u003eFidelity before convenience\u003c/h3\u003e\n\u003cp\u003eRich is conditional, not universal. When faithful editing cannot be established, Markdown remains available.\u003c/p\u003e\n\u003cp\u003eThe Note still belongs to the source—not a separate document.\u003c/p\u003e\n\u003ch2 id=\"5-return-to-the-same-markdown\"\u003e5. Return to the Same Markdown\u003c/h2\u003e\n\u003ch3 id=\"jump-from-node-to-passage\"\u003eJump from node to passage\u003c/h3\u003e\n\u003cp\u003eIn split view, navigating from a map node to the corresponding text can preserve your current Preview, Markdown, or Rich surface.\u003c/p\u003e\n\u003cp\u003eNavigation restores context without switching editing modes or silently saving drafts.\u003c/p\u003e\n\u003ch3 id=\"confirm-changes-back-to-source\"\u003eConfirm changes back to source\u003c/h3\u003e\n\u003cp\u003eConfirm a supported node or Note edit, and DeMinds updates the original \u003cstrong\u003eWorking Markdown\u003c/strong\u003e. The map then reflects the committed result.\u003c/p\u003e\n\u003ch3 id=\"no-second-file-to-chase\"\u003eNo second file to chase\u003c/h3\u003e\n\u003cp\u003eThere is no second mind-map file to synchronize. The map expresses the Markdown; a structural edit is complete when it safely returns to the source.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat you save is not just a few clicks. It is the effort of keeping two versions of the same ideas from drifting apart.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"6-one-round-trip\"\u003e6. One Round Trip\u003c/h2\u003e\n\u003ch3 id=\"markdown-to-mapand-back\"\u003eMarkdown to map—and back\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eMarkdown / Rich → Save → Universal Mind Map → Edit structure or Note → Confirm changes → Same Markdown\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e“Markdown + Mind Map” becomes more than two views—it becomes a workflow you can move through both ways.\u003c/p\u003e\n\u003ch3 id=\"a-workflow-with-a-way-back\"\u003eA workflow with a way back\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eGo deeper in the text\u003c/strong\u003e without losing the outline.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eStep back into the map\u003c/strong\u003e to see connections and correct the structure.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOpen a Note\u003c/strong\u003e to retain the thinking behind a concise node.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReturn to Markdown\u003c/strong\u003e with one maintainable result you can keep using.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"keep-the-work-not-another-format\"\u003eKeep the work, not another format\u003c/h3\u003e\n\u003cp\u003eAt the end, there are no competing versions to maintain. Just one Markdown asset to read, revise, save, and take with you.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEdit the content, and the structure follows. Edit the structure, and you return to the same Markdown.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIt is the Universal Mind Map’s first step from \u003cstrong\u003eseeing structure\u003c/strong\u003e toward \u003cstrong\u003emaintaining structure\u003c/strong\u003e—and the reason this update matters beyond a new set of editing buttons.\u003c/p\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:069ee21edb5aae5e633f4fa93a9c02aa204630d71bd52c99a401ca0dd02f2a70":{"html":"\u003cp\u003eA single Note can now move among three surfaces:\u003c/p\u003e\n","kind":"html","rawMarkdown":"A single Note can now move among three surfaces:","sourceFormat":"markdown"},"note:sha256:07574ab0e2698fe0aa9814dd2348400d2096843bf49e30fec9493d23bfd365a3":{"html":"\u003cp\u003eRich is conditional, not universal. When faithful editing cannot be established, Markdown remains available.\u003c/p\u003e\n\u003cp\u003eThe Note still belongs to the source—not a separate document.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Rich is conditional, not universal. When faithful editing cannot be established, Markdown remains available.\n\nThe Note still belongs to the source—not a separate document.","sourceFormat":"markdown"},"note:sha256:125ca5d5bf094df619e4c0540cbd77d7da3347dcf7f127f88a14363daa1e44b2":{"html":"\u003cp\u003eConfirm a supported node or Note edit, and DeMinds updates the original \u003cstrong\u003eWorking Markdown\u003c/strong\u003e. The map then reflects the committed result.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Confirm a supported node or Note edit, and DeMinds updates the original **Working Markdown**. The map then reflects the committed result.","sourceFormat":"markdown"},"note:sha256:14c9824d220254b85e2509a9a658b662f1510526d774832e6e7c610815fc29ea":{"html":"\u003cp\u003eIn a supported wide-screen split view, \u003cstrong\u003eMarkdown or Rich\u003c/strong\u003e sits alongside the \u003cstrong\u003eUniversal Mind Map\u003c/strong\u003e. Stay in the text without losing the outline, or inspect the outline without abandoning your place.\u003c/p\u003e\n\u003cp\u003eThe document is for revising ideas; the map reveals headings and relationships. They are \u003cstrong\u003etwo working perspectives on the same Markdown\u003c/strong\u003e, not separately saved results.\u003c/p\u003e\n","kind":"html","rawMarkdown":"In a supported wide-screen split view, **Markdown or Rich** sits alongside the **Universal Mind Map**. Stay in the text without losing the outline, or inspect the outline without abandoning your place.\n\nThe document is for revising ideas; the map reveals headings and relationships. They are **two working perspectives on the same Markdown**, not separately saved results.","sourceFormat":"markdown"},"note:sha256:1eb93dba23ca8bd7184e24538fdbe977d8808e87ee7e5f425c2853e13db77cc4":{"html":"\u003cp\u003eOpen a node's \u003cstrong\u003eNote\u003c/strong\u003e, and you can read the fuller passage behind it. This lets the map stay light while the content remains useful and substantial.\u003c/p\u003e\n\u003cp\u003eScan the structure first, then go deeper wherever an idea needs more attention.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Open a node's **Note**, and you can read the fuller passage behind it. This lets the map stay light while the content remains useful and substantial.\n\nScan the structure first, then go deeper wherever an idea needs more attention.","sourceFormat":"markdown"},"note:sha256:2c25cde86c1add6553e3a51109f2cdef562609d73386517b6ead048beb36dd3d":{"html":"\u003cp\u003eThere is no second mind-map file to synchronize. The map expresses the Markdown; a structural edit is complete when it safely returns to the source.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat you save is not just a few clicks. It is the effort of keeping two versions of the same ideas from drifting apart.\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"There is no second mind-map file to synchronize. The map expresses the Markdown; a structural edit is complete when it safely returns to the source.\n\n**What you save is not just a few clicks. It is the effort of keeping two versions of the same ideas from drifting apart.**","sourceFormat":"markdown"},"note:sha256:339089a9592e0394d0619b702e4064c6f78f473588d30ca291c5383cb68ce879":{"html":"\u003cp\u003eThis is not a free-form mind-map canvas. Only nodes and actions reliably mapped to the source can be edited.\u003c/p\u003e\n\u003cp\u003eChanges still pass source checks and the existing save and History flow. \u003cstrong\u003eAn easier way to edit should not make the underlying document easier to damage.\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"This is not a free-form mind-map canvas. Only nodes and actions reliably mapped to the source can be edited.\n\nChanges still pass source checks and the existing save and History flow. **An easier way to edit should not make the underlying document easier to damage.**","sourceFormat":"markdown"},"note:sha256:56be1a5a812ab7798b44787d8b45b3142aee17d2a178c57c67a345849fecc880":{"html":"\u003cp\u003eAt the end, there are no competing versions to maintain. Just one Markdown asset to read, revise, save, and take with you.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEdit the content, and the structure follows. Edit the structure, and you return to the same Markdown.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIt is the Universal Mind Map’s first step from \u003cstrong\u003eseeing structure\u003c/strong\u003e toward \u003cstrong\u003emaintaining structure\u003c/strong\u003e—and the reason this update matters beyond a new set of editing buttons.\u003c/p\u003e\n","kind":"html","rawMarkdown":"At the end, there are no competing versions to maintain. Just one Markdown asset to read, revise, save, and take with you.\n\n**Edit the content, and the structure follows. Edit the structure, and you return to the same Markdown.**\n\nIt is the Universal Mind Map’s first step from **seeing structure** toward **maintaining structure**—and the reason this update matters beyond a new set of editing buttons.","sourceFormat":"markdown"},"note:sha256:6c057656b788a4bf002cd2f2879b09df3a8815a495f0cc696253af3b169c23f5":{"html":"\u003cp\u003eIn split view, navigating from a map node to the corresponding text can preserve your current Preview, Markdown, or Rich surface.\u003c/p\u003e\n\u003cp\u003eNavigation restores context without switching editing modes or silently saving drafts.\u003c/p\u003e\n","kind":"html","rawMarkdown":"In split view, navigating from a map node to the corresponding text can preserve your current Preview, Markdown, or Rich surface.\n\nNavigation restores context without switching editing modes or silently saving drafts.","sourceFormat":"markdown"},"note:sha256:82a5a382e91e94c87da4cffc91a0bfe6a3506385c8fa3de3728f81a8c151347d":{"html":"\u003cp\u003e\u003cstrong\u003eMarkdown / Rich → Save → Universal Mind Map → Edit structure or Note → Confirm changes → Same Markdown\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e“Markdown + Mind Map” becomes more than two views—it becomes a workflow you can move through both ways.\u003c/p\u003e\n","kind":"html","rawMarkdown":"**Markdown / Rich → Save → Universal Mind Map → Edit structure or Note → Confirm changes → Same Markdown**\n\n“Markdown + Mind Map” becomes more than two views—it becomes a workflow you can move through both ways.","sourceFormat":"markdown"},"note:sha256:9ce5922f982619648c7f772fa739c3505d31cc459ba3e55291d561e36f7b6bfc":{"html":"\u003cp\u003eA good map should stay readable. A node can remain a clear, concise title that shows where an idea belongs.\u003c/p\u003e\n\u003cp\u003eThe map is there to reveal structure quickly—not to carry every sentence in full.\u003c/p\u003e\n","kind":"html","rawMarkdown":"A good map should stay readable. A node can remain a clear, concise title that shows where an idea belongs.\n\nThe map is there to reveal structure quickly—not to carry every sentence in full.","sourceFormat":"markdown"},"note:sha256:9efcae98051704c24a22ef19a6a375bc6ab5f482888b6c53bdd3ba83ea7abeb3":{"html":"\u003cp\u003eThe costly part is often \u003cstrong\u003efinding a structural problem—then finding it all over again to fix it\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eWhen the map already shows where the problem is, that is where the correction should begin.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The costly part is often **finding a structural problem—then finding it all over again to fix it**.\n\nWhen the map already shows where the problem is, that is where the correction should begin.","sourceFormat":"markdown"},"note:sha256:ad3b11f34314b025707a960a8e75c63e20d6489b6225dd85f0ed68c100432961":{"html":"\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eSpot a problem in the map. Why hunt through a long document to fix it?\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eRename a section, give an idea another level, or update a node's Note. Those changes should follow your train of thought—not send you searching through the source again.\u003c/p\u003e\n\u003cp\u003eDeMinds is closing that loop: \u003cstrong\u003eSave an edit in the document, and the map updates. Make a supported structural or Note edit, and the change returns to the same Markdown.\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e **Spot a problem in the map. Why hunt through a long document to fix it?**\n\nRename a section, give an idea another level, or update a node's Note. Those changes should follow your train of thought—not send you searching through the source again.\n\nDeMinds is closing that loop: **Save an edit in the document, and the map updates. Make a supported structural or Note edit, and the change returns to the same Markdown.**","sourceFormat":"markdown"},"note:sha256:c6565699deac6f40c59f3c3a9f9f7abb1edbfec9edfd71ea41638934ab28eb6e":{"html":"\u003cp\u003eA map shows relationships, but an article is more than its keywords. Reasoning, context, and detail still need a place.\u003c/p\u003e\n\u003cp\u003eA lighter structure does not have to mean thinner content.\u003c/p\u003e\n","kind":"html","rawMarkdown":"A map shows relationships, but an article is more than its keywords. Reasoning, context, and detail still need a place.\n\nA lighter structure does not have to mean thinner content.","sourceFormat":"markdown"},"note:sha256:dfaf8d1db7e72f06708b20c2845010f545ce7a4cb8857a2ec6518f803c917733":{"html":"\u003cp\u003eSupported nodes offer four focused edits:\u003c/p\u003e\n","kind":"html","rawMarkdown":"Supported nodes offer four focused edits:","sourceFormat":"markdown"},"note:sha256:f65590e66ff333f1ac3b2c447c239801598a702f6ca9a993dedeab6d1d396269":{"html":"\u003cp\u003eStart with “Where does this idea belong?” rather than “Where was that heading?” For nested headings and lists, this is the more natural way to organize ideas.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Start with “Where does this idea belong?” rather than “Where was that heading?” For nested headings and lists, this is the more natural way to organize ideas.","sourceFormat":"markdown"},"note:sha256:f655bbdd0e55bdf2709faf2a2904c1007af5f49ffb4d4eb138ca97fd81cdd930":{"html":"\u003cp\u003eRename a section or refine the text. Save, and the map updates from the confirmed content—without leaving the editor or reopening the map.\u003c/p\u003e\n\u003cp\u003eWhen it can do so reliably, DeMinds also preserves your view and folded branches, keeping your focus on the next edit.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eGo deep in the text. Stay oriented in the structure.\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"Rename a section or refine the text. Save, and the map updates from the confirmed content—without leaving the editor or reopening the map.\n\nWhen it can do so reliably, DeMinds also preserves your view and folded branches, keeping your focus on the next edit.\n\n**Go deep in the text. Stay oriented in the structure.**","sourceFormat":"markdown"}},"sourceRevision":"sha256:afc74453e88781a389b6a2a2c6afcff54b5ca58fac8467d4f662611acf6215b6"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=e}}function r(e,t){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${e}": ${t}`)}function i(e){const t=String(e||"").normalize("NFC").trim().replace(/\\/g,"/");t||r(t,"empty"),t.includes("\0")&&r(t,"nul_byte"),t.startsWith("/")&&r(t,"absolute"),/^[A-Za-z]:/.test(t)&&r(t,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*:/.test(t)&&r(t,"url_scheme"),t.endsWith("/")&&r(t,"directory");const n=t.split("/");return n.some(e=>!e||"."===e||".."===e)&&r(t,"unsafe_segment"),n.join("/")}function o(e){if(null===e||"string"==typeof e||"boolean"==typeof e)return JSON.stringify(e);if("number"==typeof e){if(!Number.isFinite(e))throw new n("unsupported_json_value","Canonical JSON does not allow non-finite numbers.");return JSON.stringify(e)}if(Array.isArray(e))return`[${e.map(e=>o(e)).join(",")}]`;if("object"==typeof e)return`{${Object.keys(e).sort()
