pbs.twimg.com/media/HQO8A-ebcAAiIPa?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n云端文件、项目资产和本地工作空间用途不同。工作空间适合当前电脑上的执行；项目资产适合一个长期主题的共享背景；云端网盘适合保存和流转产物。**不要把三者当成同一个备份系统，重要原件仍要有独立备份**。\n\n连接腾讯文档后，WorkBuddy 可以搜索文档、把资料加入任务，并把产物保存回云端。乐享、ima 等知识来源也能通过连接器进入任务。检索命中后仍要打开原文确认日期、作者和适用范围，尤其是制度、价格和产品功能等会变化的信息。","sourceFormat":"markdown"},"note:sha256:92fee35233a9d084651e4495636b3d32d639cfe5049c3568880b4f1a8dec003b":{"blocks":[{"children":[],"kind":"leaf","title":"模型下拉菜单里会列出当前账户可用的模型和思考档位。本次实机界面能看到 Auto，以及混元、GLM、MiniMax、Kimi、DeepSeek 等不同模型选项，还提供 Max 模式和自定义模型入口。名单会随版本、套餐、地区和服务状态变化。"},{"children":[],"kind":"leaf","title":"国内项目很难只按单次测评成绩选模型。组织允许使用哪些服务、数据能否送出当前环境、额度是否稳定、发票和支持能不能跟上，都会影响最终选择。WorkBuddy 把多种国内模型放在一个任务入口里，价值主要来自替换和管理更方便，并不代表每个模型都适合所有任务。"},{"children":[{"title":"需要看图片或截图时，选择明确支持视觉输入的模型。"},{"title":"大段代码、复杂表格或长文档，需要更强的上下文和推理能力。"},{"title":"任务成本敏感时，避免不必要地开启高消耗档位。"},{"title":"组织接入了指定模型时，按数据合规和团队规范选择。"}],"kind":"section","title":"刚开始建议用 Auto。它省去了逐个比较模型的负担，常见办公任务通常够用。遇到以下情况再手动选择"},{"children":[],"kind":"leaf","title":"Max、深度思考或强模型通常意味着更长等待和更多积分消耗。用强模型重做一个模糊任务，往往仍然会得到模糊结果。先把资料和验收标准说清，再升级模型。"},{"children":[],"kind":"leaf","title":"如果输出中断或质量突然下降，查看任务详情里的模型、消耗和运行时间。有些故障来自额度、网络或服务状态，并非提示词本身。"}],"html":"\u003cp\u003e模型下拉菜单里会列出当前账户可用的模型和思考档位。本次实机界面能看到 Auto，以及混元、GLM、MiniMax、Kimi、DeepSeek 等不同模型选项，还提供 Max 模式和自定义模型入口。名单会随版本、套餐、地区和服务状态变化。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e国内项目很难只按单次测评成绩选模型\u003c/strong\u003e。组织允许使用哪些服务、数据能否送出当前环境、额度是否稳定、发票和支持能不能跟上，都会影响最终选择。WorkBuddy 把多种国内模型放在一个任务入口里，价值主要来自替换和管理更方便，并不代表每个模型都适合所有任务。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO7vNsaEAAxjJB?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003e刚开始建议用 Auto\u003c/strong\u003e。它省去了逐个比较模型的负担，常见办公任务通常够用。遇到以下情况再手动选择：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e需要看图片或截图时，选择明确支持视觉输入的模型。\u003c/li\u003e\n\u003cli\u003e大段代码、复杂表格或长文档，需要更强的上下文和推理能力。\u003c/li\u003e\n\u003cli\u003e任务成本敏感时，避免不必要地开启高消耗档位。\u003c/li\u003e\n\u003cli\u003e组织接入了指定模型时，按数据合规和团队规范选择。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMax、深度思考或强模型通常意味着更长等待和更多积分消耗。用强模型重做一个模糊任务，往往仍然会得到模糊结果。\u003cstrong\u003e先把资料和验收标准说清，再升级模型\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e如果输出中断或质量突然下降，查看任务详情里的模型、消耗和运行时间。有些故障来自额度、网络或服务状态，并非提示词本身。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"模型下拉菜单里会列出当前账户可用的模型和思考档位。本次实机界面能看到 Auto，以及混元、GLM、MiniMax、Kimi、DeepSeek 等不同模型选项，还提供 Max 模式和自定义模型入口。名单会随版本、套餐、地区和服务状态变化。\n\n**国内项目很难只按单次测评成绩选模型**。组织允许使用哪些服务、数据能否送出当前环境、额度是否稳定、发票和支持能不能跟上，都会影响最终选择。WorkBuddy 把多种国内模型放在一个任务入口里，价值主要来自替换和管理更方便，并不代表每个模型都适合所有任务。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO7vNsaEAAxjJB?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n**刚开始建议用 Auto**。它省去了逐个比较模型的负担，常见办公任务通常够用。遇到以下情况再手动选择：\n\n- 需要看图片或截图时，选择明确支持视觉输入的模型。\n- 大段代码、复杂表格或长文档，需要更强的上下文和推理能力。\n- 任务成本敏感时，避免不必要地开启高消耗档位。\n- 组织接入了指定模型时，按数据合规和团队规范选择。\n\nMax、深度思考或强模型通常意味着更长等待和更多积分消耗。用强模型重做一个模糊任务，往往仍然会得到模糊结果。**先把资料和验收标准说清，再升级模型**。\n\n如果输出中断或质量突然下降，查看任务详情里的模型、消耗和运行时间。有些故障来自额度、网络或服务状态，并非提示词本身。","sourceFormat":"markdown"},"note:sha256:968aa6dcc3b15e4b455258f92718b1ffd37a6eeb4712f844ab751ac0525a04fe":{"html":"\u003cp\u003e适合会议纪要、制度摘要、方案改写、合同要点、FAQ 和周报。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e读取 @会议纪要.docx，生成《项目周报.md》。\n结构为：本周完成、当前风险、下周计划、待确认事项。\n所有结论都要标注来自纪要的哪一段；没有依据的内容写“待确认”。\n不要修改原文件。\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e验收时看有没有把“讨论”写成“已经决定”，有没有捏造负责人和日期。\u003cstrong\u003e摘要任务最常见的错误，是把不确定内容说得太确定\u003c/strong\u003e，语言反倒经常很流畅。\u003c/p\u003e\n","kind":"html","rawMarkdown":"适合会议纪要、制度摘要、方案改写、合同要点、FAQ 和周报。\n\n```text\n读取 @会议纪要.docx，生成《项目周报.md》。\n结构为：本周完成、当前风险、下周计划、待确认事项。\n所有结论都要标注来自纪要的哪一段；没有依据的内容写“待确认”。\n不要修改原文件。\n```\n\n验收时看有没有把“讨论”写成“已经决定”，有没有捏造负责人和日期。**摘要任务最常见的错误，是把不确定内容说得太确定**，语言反倒经常很流畅。","sourceFormat":"markdown"},"note:sha256:98a07e829da765c3b719aec4279d9ad2af8969c40d52aa029e811f1dd921bcdc":{"html":"\u003cp\u003e第一天只做只读问答。准备三个普通文件，让 WorkBuddy 说明目录结构、总结文档、解释表格字段，全程不修改文件。\u003c/p\u003e\n\u003cp\u003e第二天完成本文的行动清单练习，学会选择工作空间、生成产物、查看变更和继续追问。\u003c/p\u003e\n\u003cp\u003e第三天用一份 CSV 做数据体检、汇总和图表。抽查计算结果，认识“图表正确”和“数据可靠”之间的差别。\u003c/p\u003e\n\u003cp\u003e第四天尝试 Plan 模式，先做一个十页 PPT 的页纲，确认后再生成文件。重点练习验收标准。\u003c/p\u003e\n\u003cp\u003e第五天安装一个来源可信的技能，连接一个你确实需要的云端服务。记录授权范围，并完成最小测试。\u003c/p\u003e\n\u003cp\u003e第六天创建一个项目，把固定说明、资料和模板放进去，连续跑两个任务，观察共享配置有没有减少重复说明。\u003c/p\u003e\n\u003cp\u003e第七天创建一条低风险自动化，先手动运行，再设置低频时间表。最后回看一周的任务历史、产物、变更和积分消耗，整理出自己的模板。\u003c/p\u003e\n\u003cp\u003e七天之后，判断自己是否熟练，就看能否稳定做到五件事：\u003cstrong\u003e给任务划边界，选对模式和模型，提供可追踪材料，验收产物与变更，遇到失败知道从哪里排查\u003c/strong\u003e。\u003c/p\u003e\n","kind":"html","rawMarkdown":"第一天只做只读问答。准备三个普通文件，让 WorkBuddy 说明目录结构、总结文档、解释表格字段，全程不修改文件。\n\n第二天完成本文的行动清单练习，学会选择工作空间、生成产物、查看变更和继续追问。\n\n第三天用一份 CSV 做数据体检、汇总和图表。抽查计算结果，认识“图表正确”和“数据可靠”之间的差别。\n\n第四天尝试 Plan 模式，先做一个十页 PPT 的页纲，确认后再生成文件。重点练习验收标准。\n\n第五天安装一个来源可信的技能，连接一个你确实需要的云端服务。记录授权范围，并完成最小测试。\n\n第六天创建一个项目，把固定说明、资料和模板放进去，连续跑两个任务，观察共享配置有没有减少重复说明。\n\n第七天创建一条低风险自动化，先手动运行，再设置低频时间表。最后回看一周的任务历史、产物、变更和积分消耗，整理出自己的模板。\n\n七天之后，判断自己是否熟练，就看能否稳定做到五件事：**给任务划边界，选对模式和模型，提供可追踪材料，验收产物与变更，遇到失败知道从哪里排查**。","sourceFormat":"markdown"},"note:sha256:9d684dc84cdc730e37e66a91e6a245aaa2de6d0a244815a263cff91df40ce859":{"html":"\u003cpre\u003e\u003ccode class=\"language-text\"\u003e根据工作空间中的调研报告和品牌素材，制作 10 页汇报 PPT。\n听众是不了解技术的业务负责人，每页只讲一个结论。\n先输出页纲让我确认，再生成 PPTX。\n所有数字在备注区写明来源文件和页码。\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePPT 任务适合 Plan 模式。\u003cstrong\u003e先看页纲，再生成 PPT\u003c/strong\u003e，能避免做到十页之后才发现叙事方向错了。生成后检查字体、图片版权、图表刻度、备注和投影比例。\u003c/p\u003e\n","kind":"html","rawMarkdown":"```text\n根据工作空间中的调研报告和品牌素材，制作 10 页汇报 PPT。\n听众是不了解技术的业务负责人，每页只讲一个结论。\n先输出页纲让我确认，再生成 PPTX。\n所有数字在备注区写明来源文件和页码。\n```\n\nPPT 任务适合 Plan 模式。**先看页纲，再生成 PPT**，能避免做到十页之后才发现叙事方向错了。生成后检查字体、图片版权、图表刻度、备注和投影比例。","sourceFormat":"markdown"},"note:sha256:9dfd21f689f3e29a6d23e645ca141857d0ecff4d10b6a85790ebf50e612720bd":{"html":"\u003cp\u003e一个实用任务可以按“动作、输入、输出、约束”来写：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e请读取工作空间中的《会议纪要.txt》，生成一份《行动清单.md》。\n要求：用表格列出负责人、任务、截止日期和状态；\n状态统一写“待开始”；\n不要修改原文件；\n完成后告诉我新建了哪个文件。\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e“读取会议纪要”是动作和输入，“行动清单.md”是输出，“表格字段、状态、不改原文件”是约束\u003c/strong\u003e，“告诉我新建了哪个文件”则是验收信号。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO7ni9bkAA9988?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e文件名最好写准确。材料很多时，可以点加号上传，也可以拖进输入框，或输入 \u003ccode\u003e@\u003c/code\u003e 引用当前对话和工作空间中的文件。直接写“帮我处理一下这个”会迫使 WorkBuddy 猜测目标：猜对是运气，猜错却可能真的改文件。\u003c/p\u003e\n","kind":"html","rawMarkdown":"一个实用任务可以按“动作、输入、输出、约束”来写：\n\n```text\n请读取工作空间中的《会议纪要.txt》，生成一份《行动清单.md》。\n要求：用表格列出负责人、任务、截止日期和状态；\n状态统一写“待开始”；\n不要修改原文件；\n完成后告诉我新建了哪个文件。\n```\n\n**“读取会议纪要”是动作和输入，“行动清单.md”是输出，“表格字段、状态、不改原文件”是约束**，“告诉我新建了哪个文件”则是验收信号。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO7ni9bkAA9988?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n文件名最好写准确。材料很多时，可以点加号上传，也可以拖进输入框，或输入 `@` 引用当前对话和工作空间中的文件。直接写“帮我处理一下这个”会迫使 WorkBuddy 猜测目标：猜对是运气，猜错却可能真的改文件。","sourceFormat":"markdown"},"note:sha256:a6db3d89b78f2cf683628ad6db2063e79aa208e7b55e324ff6e3c7b5cf8a4786":{"html":"\u003cp\u003e等待一两分钟，查看任务详情和网络状态。暂停其他大任务，避免同时跑太多工作流。新版多次修复准备阶段和多任务切换问题，版本较旧时可以在保存现场后升级。\u003c/p\u003e\n","kind":"html","rawMarkdown":"等待一两分钟，查看任务详情和网络状态。暂停其他大任务，避免同时跑太多工作流。新版多次修复准备阶段和多任务切换问题，版本较旧时可以在保存现场后升级。","sourceFormat":"markdown"},"note:sha256:a86d077cad641adb7bbd3b176a0466c33b8d020c7642a6a07ed2643f0804de3b":{"html":"\u003cpre\u003e\u003ccode class=\"language-text\"\u003e根据 @品牌说明.pdf 和 @产品截图.png，先给出三种封面方向。\n尺寸 1600×900，保留右上角标题安全区，不使用无授权人物照片。\n我选择方向后再生成最终图片，并保留可修改的源文件。\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e设计任务需要给尺寸、品牌色、文字、参考图和禁止项。\u003cstrong\u003e生成式图片里的小字、Logo、手指和数据图表要逐项检查\u003c/strong\u003e。视频任务还要写清时长、比例、字幕、配音和导出格式。\u003c/p\u003e\n","kind":"html","rawMarkdown":"```text\n根据 @品牌说明.pdf 和 @产品截图.png，先给出三种封面方向。\n尺寸 1600×900，保留右上角标题安全区，不使用无授权人物照片。\n我选择方向后再生成最终图片，并保留可修改的源文件。\n```\n\n设计任务需要给尺寸、品牌色、文字、参考图和禁止项。**生成式图片里的小字、Logo、手指和数据图表要逐项检查**。视频任务还要写清时长、比例、字幕、配音和导出格式。","sourceFormat":"markdown"},"note:sha256:a9fcd7dfafba1febf8abc0540c4864ec171ef0064b43e2b3af6b517b66158c78":{"html":"\u003cp\u003e回到验收标准，告诉它缺哪一列、哪一节、哪几页。长资料可以分阶段处理：先建立目录和来源索引，再逐节生成，最后合并。不要只说“再详细一点”，那会让修改方向继续模糊。\u003c/p\u003e\n","kind":"html","rawMarkdown":"回到验收标准，告诉它缺哪一列、哪一节、哪几页。长资料可以分阶段处理：先建立目录和来源索引，再逐节生成，最后合并。不要只说“再详细一点”，那会让修改方向继续模糊。","sourceFormat":"markdown"},"note:sha256:ad3c939b86e6c0661572febe0e3a50c3599b92a9eab54ba161d6120bb34eabde":{"html":"\u003cp\u003e刚开始最容易混淆的是一组听起来都像“帮我做事”的名词：任务、项目、技能、专家和连接器。可以先把它们放回交付过程里理解。\u003c/p\u003e\n\u003cp\u003e这些名词单独看很像产品菜单，放进交付流程就清楚了：任务承载一次工作，工作空间限定资料，权限限定动作，技能负责具体工具，连接器接入客户已有系统，项目负责把一套做法留给下一次。它们共同解决的是同一个问题：怎样把模型的一次回答，变成可以反复执行、可以交接的工作。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO7lVqbIAAQRBv?format=jpg\u0026amp;name=large\"\u003e\u003c/div\u003e\n\n\u003cp\u003e先别急着把每个模块都配满。\u003cstrong\u003e第一个阶段只需要掌握任务、工作空间、权限、产物和变更\u003c/strong\u003e，已经足以完成大量日常工作。\u003c/p\u003e\n","kind":"html","rawMarkdown":"刚开始最容易混淆的是一组听起来都像“帮我做事”的名词：任务、项目、技能、专家和连接器。可以先把它们放回交付过程里理解。\n\n这些名词单独看很像产品菜单，放进交付流程就清楚了：任务承载一次工作，工作空间限定资料，权限限定动作，技能负责具体工具，连接器接入客户已有系统，项目负责把一套做法留给下一次。它们共同解决的是同一个问题：怎样把模型的一次回答，变成可以反复执行、可以交接的工作。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO7lVqbIAAQRBv?format=jpg\u0026name=large\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n先别急着把每个模块都配满。**第一个阶段只需要掌握任务、工作空间、权限、产物和变更**，已经足以完成大量日常工作。","sourceFormat":"markdown"},"note:sha256:adb87dec1e22123f2e4e83ea82c8989cc10c65d2ec4b1bd7932b737a1b5b8363":{"html":"\u003cpre\u003e\u003ccode class=\"language-text\"\u003e调研 2026 年国内企业 AI 办公代理的主要产品。\n先提出检索计划，优先使用官网、帮助中心、更新日志和原始公告。\n把事实、厂商自述和你的推断分开。\n最终生成《调研报告.md》和《来源清单.csv》，记录标题、网址、日期和引用用途。\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e调研的关键在于留住证据，页面数量不能替代证据质量\u003c/strong\u003e。要求来源清单和日期，后续才能复核。搜索结果摘要只能帮助定位，重要结论要回到原页面。\u003c/p\u003e\n","kind":"html","rawMarkdown":"```text\n调研 2026 年国内企业 AI 办公代理的主要产品。\n先提出检索计划，优先使用官网、帮助中心、更新日志和原始公告。\n把事实、厂商自述和你的推断分开。\n最终生成《调研报告.md》和《来源清单.csv》，记录标题、网址、日期和引用用途。\n```\n\n**调研的关键在于留住证据，页面数量不能替代证据质量**。要求来源清单和日期，后续才能复核。搜索结果摘要只能帮助定位，重要结论要回到原页面。","sourceFormat":"markdown"},"note:sha256:b28bc21d3dd2430fcde69157933e891f6c77f9cdb7d23967d5ca1317e7582ddf":{"html":"\u003cp\u003e本机 5.2.6 界面底部已经显示“新版本就绪”，并给出“更新日志”和“重启升级”。本次教程没有替用户重启升级，因为升级会打断正在进行的任务，也可能改变当前界面。\u003c/p\u003e\n\u003cp\u003e你可以先看更新日志，结束手头工作、保存重要文件后再升级。如果文章里的按钮和你的界面略有不同，优先按功能名称寻找，不必逐像素照抄。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本机 5.2.6 界面底部已经显示“新版本就绪”，并给出“更新日志”和“重启升级”。本次教程没有替用户重启升级，因为升级会打断正在进行的任务，也可能改变当前界面。\n\n你可以先看更新日志，结束手头工作、保存重要文件后再升级。如果文章里的按钮和你的界面略有不同，优先按功能名称寻找，不必逐像素照抄。","sourceFormat":"markdown"},"note:sha256:b35968764c4b1be297993b113a4cc7579b3c65ce5b98709062db777152c8ed1a":{"html":"\u003cp\u003e连接器让 WorkBuddy 读取或操作外部服务。本机连接器页面能看到腾讯文档、QQ 邮箱、腾讯会议、企业微信、飞书、钉钉、TAPD、腾讯问卷、乐享、ima 等入口，也有金融和其他业务服务。可用列表会随版本和账号变化。\u003c/p\u003e\n\u003cp\u003e这部分最能解释 WorkBuddy 在国内交付里的位置。客户资料本来就在这些系统中，团队每天也在这些入口里沟通。\u003cstrong\u003e工具能够接入现有环境，项目才有机会少做一层人工搬运\u003c/strong\u003e。连接器数量多本身没有意义，关键是你需要的系统能否稳定授权、检索和写回。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO71OmaUAAW7p_?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e连接过程通常包含添加、登录或授权、选择权限范围、测试连接。连接成功后，可以在任务中引用云端资料或调用服务。例如从腾讯文档检索制度、整理腾讯会议记录、从邮箱提取待办，再把产物保存回云端。\u003c/p\u003e\n\u003cp\u003e授权时不要只看“连接成功”。\u003cstrong\u003e还要确认账号归属、可读空间、写入权限和撤销方式\u003c/strong\u003e。涉及邮件发送、创建工单、改动云文档时，最好先要求生成草稿或预览，确认后再执行。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO72Oxa8AAbRY_?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"连接器让 WorkBuddy 读取或操作外部服务。本机连接器页面能看到腾讯文档、QQ 邮箱、腾讯会议、企业微信、飞书、钉钉、TAPD、腾讯问卷、乐享、ima 等入口，也有金融和其他业务服务。可用列表会随版本和账号变化。\n\n这部分最能解释 WorkBuddy 在国内交付里的位置。客户资料本来就在这些系统中，团队每天也在这些入口里沟通。**工具能够接入现有环境，项目才有机会少做一层人工搬运**。连接器数量多本身没有意义，关键是你需要的系统能否稳定授权、检索和写回。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO71OmaUAAW7p_?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n连接过程通常包含添加、登录或授权、选择权限范围、测试连接。连接成功后，可以在任务中引用云端资料或调用服务。例如从腾讯文档检索制度、整理腾讯会议记录、从邮箱提取待办，再把产物保存回云端。\n\n授权时不要只看“连接成功”。**还要确认账号归属、可读空间、写入权限和撤销方式**。涉及邮件发送、创建工单、改动云文档时，最好先要求生成草稿或预览，确认后再执行。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO72Oxa8AAbRY_?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:b77c614eff703d8525e787a7e6c6f07fdf748298ac30efb67df4f7f6022d5e74":{"html":"\u003cp\u003e立即停止继续任务，打开“查看所有变更”，记录文件和行数。先从备份或版本控制恢复，再修改提示词和权限。下一次明确写“只新增文件，不修改或删除现有文件；如必须修改，先征得确认”。\u003c/p\u003e\n","kind":"html","rawMarkdown":"立即停止继续任务，打开“查看所有变更”，记录文件和行数。先从备份或版本控制恢复，再修改提示词和权限。下一次明确写“只新增文件，不修改或删除现有文件；如必须修改，先征得确认”。","sourceFormat":"markdown"},"note:sha256:b98c47c2d0423da0828d2ac487bd556c3ec3950a3e2613fa72d07a65c8eef068":{"html":"\u003cpre\u003e\u003ccode class=\"language-text\"\u003e请作为审阅者检查当前产物，不要直接修改。\n核对事实、数字、日期、来源、缺失项、格式和文件可打开性。\n把问题分为“必须修复、建议修复、需要我确认”，并给出证据位置。\n\u003c/code\u003e\u003c/pre\u003e\n","kind":"html","rawMarkdown":"```text\n请作为审阅者检查当前产物，不要直接修改。\n核对事实、数字、日期、来源、缺失项、格式和文件可打开性。\n把问题分为“必须修复、建议修复、需要我确认”，并给出证据位置。\n```","sourceFormat":"markdown"},"note:sha256:bc3319bbc95424c8786656e45dff41e4e4a9fbd92963069710ea367373849256":{"html":"\u003cp\u003e自动化页可以添加定时任务，也提供 AI 早报、每日英语、睡前故事、周工作汇报等模板。它适合重复、规则清楚、即使无人盯着也能安全执行的工作。\u003c/p\u003e\n\u003cp\u003e自动化是交付成熟之后的结果，不能用来掩盖一条还不稳定的流程。\u003cstrong\u003e手动运行时会漏字段、找错目录的任务，改成定时只会更稳定地制造错误\u003c/strong\u003e。先把输入、路径、输出和验收跑顺，再交给时间表。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO75SnasAAV2ME?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e一条自动化通常包含名称、工作空间、任务指令、模型或技能、运行时间和通知方式。建议从低频、只读、可核验的任务开始：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e每周五 17:30 读取本周工作日志，只生成《本周汇总草稿.md》。\n按“完成、风险、下周计划、待确认”整理。\n不要发送邮件，不覆盖历史文件；文件名带当天日期。\n完成后把产物链接推送给我。\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e创建后先手动运行一次，检查路径、权限、产物命名和通知\u003c/strong\u003e。确认无误再启用时间表。提示词里包含删除、付款、批量发送或覆盖的自动化风险很高，不适合作为无人值守任务。\u003c/p\u003e\n\u003cp\u003e自动化长期运行后还要维护。文件结构变化、连接器授权过期、模型下线、额度不足，都可能让原本正常的任务失败。至少每月检查一次最近运行记录和失败原因。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO7_kIaUAAQ3rH?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"自动化页可以添加定时任务，也提供 AI 早报、每日英语、睡前故事、周工作汇报等模板。它适合重复、规则清楚、即使无人盯着也能安全执行的工作。\n\n自动化是交付成熟之后的结果，不能用来掩盖一条还不稳定的流程。**手动运行时会漏字段、找错目录的任务，改成定时只会更稳定地制造错误**。先把输入、路径、输出和验收跑顺，再交给时间表。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO75SnasAAV2ME?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n一条自动化通常包含名称、工作空间、任务指令、模型或技能、运行时间和通知方式。建议从低频、只读、可核验的任务开始：\n\n```text\n每周五 17:30 读取本周工作日志，只生成《本周汇总草稿.md》。\n按“完成、风险、下周计划、待确认”整理。\n不要发送邮件，不覆盖历史文件；文件名带当天日期。\n完成后把产物链接推送给我。\n```\n\n**创建后先手动运行一次，检查路径、权限、产物命名和通知**。确认无误再启用时间表。提示词里包含删除、付款、批量发送或覆盖的自动化风险很高，不适合作为无人值守任务。\n\n自动化长期运行后还要维护。文件结构变化、连接器授权过期、模型下线、额度不足，都可能让原本正常的任务失败。至少每月检查一次最近运行记录和失败原因。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO7_kIaUAAQ3rH?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:c04d08ecdefbfcb1a7f212ea8c5224af453156802672188a8946b8e7d4b4ebbe":{"html":"\u003cpre\u003e\u003ccode class=\"language-text\"\u003e读取 @销售数据.csv，检查缺失值、重复行和日期格式。\n先汇报数据质量问题，再按月份计算销售额、订单量和退款率。\n生成《销售分析.xlsx》和《销售趋势.png》，不要覆盖原始 CSV。\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e要求先做数据体检很重要\u003c/strong\u003e。图表画得漂亮，原始数据若有重复或口径混乱，结论仍然不可靠。验收时抽查两个月份，用计算器或 Excel 复算一遍。\u003c/p\u003e\n","kind":"html","rawMarkdown":"```text\n读取 @销售数据.csv，检查缺失值、重复行和日期格式。\n先汇报数据质量问题，再按月份计算销售额、订单量和退款率。\n生成《销售分析.xlsx》和《销售趋势.png》，不要覆盖原始 CSV。\n```\n\n**要求先做数据体检很重要**。图表画得漂亮，原始数据若有重复或口径混乱，结论仍然不可靠。验收时抽查两个月份，用计算器或 Excel 复算一遍。","sourceFormat":"markdown"},"note:sha256:c53e904b544d90611c52cafa9799ec558147ead2a4ed9900c68e546a1b99f22d":{"html":"\u003cp\u003e\u003cstrong\u003e不要拿桌面、下载目录或正在交付的项目做第一次测试\u003c/strong\u003e。先新建一个空文件夹，例如：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eWorkBuddy-练习/\n├── 会议纪要.txt\n└── 销售数据.csv\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e把文件副本放进去，原件继续保留。这样即使任务理解出现偏差，影响也会被限制在练习区。等你熟悉“产物”和“变更”两个面板后，再把真实项目逐步迁进来。\u003c/p\u003e\n","kind":"html","rawMarkdown":"**不要拿桌面、下载目录或正在交付的项目做第一次测试**。先新建一个空文件夹，例如：\n\n```text\nWorkBuddy-练习/\n├── 会议纪要.txt\n└── 销售数据.csv\n```\n\n把文件副本放进去，原件继续保留。这样即使任务理解出现偏差，影响也会被限制在练习区。等你熟悉“产物”和“变更”两个面板后，再把真实项目逐步迁进来。","sourceFormat":"markdown"},"note:sha256:ce01fc26edd38f528b0f151fc40e483a94861b07890e5c2e9ecebe5f4d1593e2":{"html":"\u003cpre\u003e\u003ccode class=\"language-text\"\u003e只读取当前工作空间，不修改、不创建、不删除任何文件。\n请列出目录结构，说明每个文件可能的用途、更新时间和相互关系。\n不确定的地方明确标记，不要猜测。\n\u003c/code\u003e\u003c/pre\u003e\n","kind":"html","rawMarkdown":"```text\n只读取当前工作空间，不修改、不创建、不删除任何文件。\n请列出目录结构，说明每个文件可能的用途、更新时间和相互关系。\n不确定的地方明确标记，不要猜测。\n```","sourceFormat":"markdown"},"note:sha256:cfb197aef4330f444f84a199910664761a41f2172df027d33c3b1876ac681709":{"html":"\u003cp\u003e本机界面里，权限下拉菜单默认是“默认权限”。展开后还能看到“允许完全访问”的开关。\u003cstrong\u003e小白阶段保持默认权限即可\u003c/strong\u003e。它会在相对受控的范围里工作，遇到高风险操作再让你确认。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO7jwbaAAApT12?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003e完全访问只会扩大操作范围，不会让模型突然变聪明\u003c/strong\u003e。批量整理文件、跨目录搬运或运行某些本地工具时可能需要它；阅读资料、生成文档、分析表格等常见练习，通常没有必要一开始就打开。\u003c/p\u003e\n\u003cp\u003e如果任务涉及删除、覆盖、上传、发信、付款、公开分享或改动大量文件，\u003cstrong\u003e应当在指令中明确写出“执行前先列出计划并等待我确认”\u003c/strong\u003e。当 WorkBuddy 弹出授权卡片时，也要看清对象和范围，不要习惯性地点确认。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本机界面里，权限下拉菜单默认是“默认权限”。展开后还能看到“允许完全访问”的开关。**小白阶段保持默认权限即可**。它会在相对受控的范围里工作，遇到高风险操作再让你确认。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO7jwbaAAApT12?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n**完全访问只会扩大操作范围，不会让模型突然变聪明**。批量整理文件、跨目录搬运或运行某些本地工具时可能需要它；阅读资料、生成文档、分析表格等常见练习，通常没有必要一开始就打开。\n\n如果任务涉及删除、覆盖、上传、发信、付款、公开分享或改动大量文件，**应当在指令中明确写出“执行前先列出计划并等待我确认”**。当 WorkBuddy 弹出授权卡片时，也要看清对象和范围，不要习惯性地点确认。","sourceFormat":"markdown"},"note:sha256:d29f8975b561e6ac64d12baee15a6bae176d3ed9def5f1b56de267d6bbc1cea9":{"html":"\u003cp\u003e检查工作空间名称、文件是否在子目录、文件名和扩展名是否准确。用 \u003ccode\u003e@\u003c/code\u003e 显式引用，或先让 WorkBuddy “列出准备读取的文件，不执行其他动作”。云端文件还要确认连接器授权没有过期。\u003c/p\u003e\n","kind":"html","rawMarkdown":"检查工作空间名称、文件是否在子目录、文件名和扩展名是否准确。用 `@` 显式引用，或先让 WorkBuddy “列出准备读取的文件，不执行其他动作”。云端文件还要确认连接器授权没有过期。","sourceFormat":"markdown"},"note:sha256:d8a038993e7363e33d9e4112d139b1291fc20ddca3a49b9aa35ec3637d6c460c":{"html":"\u003cp\u003e点击产物卡片，右侧会打开文件预览。这里能看到文件名、内容，以及打开所在文件夹、上传到云端、分享等入口。\u003cstrong\u003e先检查标题、字段、行数、日期、格式和遗漏项，再决定是否导出或分享\u003c/strong\u003e。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO7psQaIAAw6nO?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e本次产物包含三行任务，日期与原文件一致。英文角色名来自练习材料，说明 WorkBuddy 没有擅自替换负责人。状态列采用 \u003ccode\u003eNot started\u003c/code\u003e，与期望语义一致；如果交付必须是中文，就继续追问：“把状态列统一改成‘待开始’，负责人保留原文，其余不变。”\u003c/p\u003e\n\u003cp\u003e这类追问比重新开一个任务更省上下文。修改后再预览一次，直到结果达到交付标准。\u003c/p\u003e\n","kind":"html","rawMarkdown":"点击产物卡片，右侧会打开文件预览。这里能看到文件名、内容，以及打开所在文件夹、上传到云端、分享等入口。**先检查标题、字段、行数、日期、格式和遗漏项，再决定是否导出或分享**。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO7psQaIAAw6nO?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n本次产物包含三行任务，日期与原文件一致。英文角色名来自练习材料，说明 WorkBuddy 没有擅自替换负责人。状态列采用 `Not started`，与期望语义一致；如果交付必须是中文，就继续追问：“把状态列统一改成‘待开始’，负责人保留原文，其余不变。”\n\n这类追问比重新开一个任务更省上下文。修改后再预览一次，直到结果达到交付标准。","sourceFormat":"markdown"},"note:sha256:ea310cc89cdfa15f7e43c2f79fb13f0ca72108a3651e16538404848743e84445":{"html":"\u003cp\u003e下面用一个实际跑过的任务走一遍完整流程。练习文件 \u003ccode\u003emeeting-notes.txt\u003c/code\u003e 里有会议日期、三名角色、三项任务和各自的截止日期。目标是生成 \u003ccode\u003eaction-list.md\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e我特意没有从复杂报告或炫目的网页开始。\u003cstrong\u003e一个交付系统是否可靠，先看它能否读对文件、生成产物、保留原件，再把改动完整展示出来\u003c/strong\u003e。这个小任务足以检查整条链路。\u003c/p\u003e\n","kind":"html","rawMarkdown":"下面用一个实际跑过的任务走一遍完整流程。练习文件 `meeting-notes.txt` 里有会议日期、三名角色、三项任务和各自的截止日期。目标是生成 `action-list.md`。\n\n我特意没有从复杂报告或炫目的网页开始。**一个交付系统是否可靠，先看它能否读对文件、生成产物、保留原件，再把改动完整展示出来**。这个小任务足以检查整条链路。","sourceFormat":"markdown"},"note:sha256:f1bab770dd7910f95cced6e066524b5b6b14eb9742253910437021ace62c9017":{"html":"\u003cp\u003e任务发送后会保留在历史列表里。你可以修改标题，让它从一串自动摘要变成容易识别的名字，例如“8 月销售分析：待复核”。任务多起来后，标题里加项目名、日期和状态，比依赖默认名称更容易找到。\u003c/p\u003e\n\u003cp\u003e对话页顶部提供任务内搜索、分享和详情入口。任务内搜索适合定位一个文件名、数字或错误信息；详情里可以核对模型、运行阶段、耗时和消耗；分享前则要检查对话中是否出现本地路径、客户名称、内部资料和个人信息。\u003c/p\u003e\n\u003cp\u003e新版已经增加批量删除和归档任务。归档适合暂时不用、以后仍可能复查的任务；删除前要确认重要产物已经单独保存。\u003cstrong\u003e对话历史不能充当唯一文件仓库\u003c/strong\u003e，产物仍应进入清楚的项目目录或云端交付位置。\u003c/p\u003e\n\u003cp\u003e一个持续任务最好留在原对话里追问，因为已有材料和修改记录都在。目标已经更换、工作空间不同或需要隔离权限时，再新建任务。把无关工作硬塞进同一条对话，只会让上下文越来越混乱。\u003c/p\u003e\n","kind":"html","rawMarkdown":"任务发送后会保留在历史列表里。你可以修改标题，让它从一串自动摘要变成容易识别的名字，例如“8 月销售分析：待复核”。任务多起来后，标题里加项目名、日期和状态，比依赖默认名称更容易找到。\n\n对话页顶部提供任务内搜索、分享和详情入口。任务内搜索适合定位一个文件名、数字或错误信息；详情里可以核对模型、运行阶段、耗时和消耗；分享前则要检查对话中是否出现本地路径、客户名称、内部资料和个人信息。\n\n新版已经增加批量删除和归档任务。归档适合暂时不用、以后仍可能复查的任务；删除前要确认重要产物已经单独保存。**对话历史不能充当唯一文件仓库**，产物仍应进入清楚的项目目录或云端交付位置。\n\n一个持续任务最好留在原对话里追问，因为已有材料和修改记录都在。目标已经更换、工作空间不同或需要隔离权限时，再新建任务。把无关工作硬塞进同一条对话，只会让上下文越来越混乱。","sourceFormat":"markdown"},"note:sha256:f3b1ccd18594246a46108681101c3e9ae1bfe22ac032d75f8b0750072679472c":{"blocks":[{"children":[],"kind":"leaf","title":"WorkBuddy 支持上传或引用 PDF、Word、文本、Markdown、Excel、CSV、PPT、图片、压缩包和常见代码文件。不同版本、模型和账户方案的支持范围可能不同，超大文件也可能需要拆分。"},{"children":[],"kind":"leaf","title":"在客户现场，模型质量只是结果的一部分。它如果读到旧制度、错版本或另一个项目的文件，再强的推理也会沿着错误材料继续走。很多看起来像模型能力的问题，根源其实在工作空间、文件版本和上下文。"},{"children":[{"title":"1. 选定工作空间，让它读取授权目录中的文件。"},{"title":"2. 点击加号上传文件或文件夹。"},{"title":"3. 把文件、图片直接拖进输入框。"},{"title":"4. 使用 `@` 引用对话文件或项目材料。"}],"kind":"section","title":"提供材料有四种常见方式"},{"children":[],"kind":"leaf","title":"资料少时可以直接上传；资料需要长期使用，或文件之间有关联时，选择工作空间更合适。团队共享的规章、产品资料、FAQ，则适合放进项目资产或已连接的知识库。"},{"children":[],"kind":"leaf","title":"每次任务都要确认它读到的是哪个版本。文件名里带日期或版本号，能减少“新旧稿混用”。如果同名文件很多，可以写出相对路径，并要求它先列出准备读取的文件。"}],"html":"\u003cp\u003eWorkBuddy 支持上传或引用 PDF、Word、文本、Markdown、Excel、CSV、PPT、图片、压缩包和常见代码文件。不同版本、模型和账户方案的支持范围可能不同，超大文件也可能需要拆分。\u003c/p\u003e\n\u003cp\u003e在客户现场，模型质量只是结果的一部分。它如果读到旧制度、错版本或另一个项目的文件，再强的推理也会沿着错误材料继续走。\u003cstrong\u003e很多看起来像模型能力的问题，根源其实在工作空间、文件版本和上下文\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e提供材料有四种常见方式：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e选定工作空间，让它读取授权目录中的文件。\u003c/li\u003e\n\u003cli\u003e点击加号上传文件或文件夹。\u003c/li\u003e\n\u003cli\u003e把文件、图片直接拖进输入框。\u003c/li\u003e\n\u003cli\u003e使用 \u003ccode\u003e@\u003c/code\u003e 引用对话文件或项目材料。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e资料少时可以直接上传；资料需要长期使用，或文件之间有关联时，选择工作空间更合适。团队共享的规章、产品资料、FAQ，则适合放进项目资产或已连接的知识库。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e每次任务都要确认它读到的是哪个版本\u003c/strong\u003e。文件名里带日期或版本号，能减少“新旧稿混用”。如果同名文件很多，可以写出相对路径，并要求它先列出准备读取的文件。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"WorkBuddy 支持上传或引用 PDF、Word、文本、Markdown、Excel、CSV、PPT、图片、压缩包和常见代码文件。不同版本、模型和账户方案的支持范围可能不同，超大文件也可能需要拆分。\n\n在客户现场，模型质量只是结果的一部分。它如果读到旧制度、错版本或另一个项目的文件，再强的推理也会沿着错误材料继续走。**很多看起来像模型能力的问题，根源其实在工作空间、文件版本和上下文**。\n\n提供材料有四种常见方式：\n\n1. 选定工作空间，让它读取授权目录中的文件。\n2. 点击加号上传文件或文件夹。\n3. 把文件、图片直接拖进输入框。\n4. 使用 `@` 引用对话文件或项目材料。\n\n资料少时可以直接上传；资料需要长期使用，或文件之间有关联时，选择工作空间更合适。团队共享的规章、产品资料、FAQ，则适合放进项目资产或已连接的知识库。\n\n**每次任务都要确认它读到的是哪个版本**。文件名里带日期或版本号，能减少“新旧稿混用”。如果同名文件很多，可以写出相对路径，并要求它先列出准备读取的文件。","sourceFormat":"markdown"},"note:sha256:f5e1ee365f64d1e0b17bb9d471fdd6137080b32fecfa0dfc744063b384a013c7":{"html":"\u003cp\u003e权限设置的目标，是让任务顺利完成，同时把意外操作的影响控制住。\u003cstrong\u003e默认权限适合多数办公任务，完全访问只留给确实需要的场景\u003c/strong\u003e，开启前应先备份。\u003c/p\u003e\n\u003cp\u003e官方文档说明，WorkBuddy 默认以本地处理为主，服务器侧处理必要片段，并限制未授权目录和敏感路径；高风险动作会要求二次确认。实际使用时仍要\u003cstrong\u003e把授权、云端模型处理和文件分享视为三件不同的事\u003c/strong\u003e。文件能被本地应用读取，不等于适合交给外部模型，也不等于可以公开分享。\u003c/p\u003e\n\u003cp\u003e含有身份证、合同金额、未发布财报、客户名单、密钥或内部代码时，先做脱敏。连接第三方技能和连接器前阅读权限说明。涉及公司合规的内容，以组织自己的安全规则为准。\u003c/p\u003e\n","kind":"html","rawMarkdown":"权限设置的目标，是让任务顺利完成，同时把意外操作的影响控制住。**默认权限适合多数办公任务，完全访问只留给确实需要的场景**，开启前应先备份。\n\n官方文档说明，WorkBuddy 默认以本地处理为主，服务器侧处理必要片段，并限制未授权目录和敏感路径；高风险动作会要求二次确认。实际使用时仍要**把授权、云端模型处理和文件分享视为三件不同的事**。文件能被本地应用读取，不等于适合交给外部模型，也不等于可以公开分享。\n\n含有身份证、合同金额、未发布财报、客户名单、密钥或内部代码时，先做脱敏。连接第三方技能和连接器前阅读权限说明。涉及公司合规的内容，以组织自己的安全规则为准。","sourceFormat":"markdown"},"note:sha256:f6cdfd7fd2220912eecdd00024d3eeda1ffc09acaafef40c0890a359bb079a24":{"html":"\u003cp\u003e技能可以理解成封装好的工具和操作流程。它可能包含说明、脚本、依赖和参数，让 WorkBuddy 在特定任务上更稳定，例如文档格式转换、图表生成、图片处理、特定网站操作等。\u003c/p\u003e\n\u003cp\u003e一次交付靠人盯着提示词也许能跑通，\u003cstrong\u003e连续交付需要把稳定动作固化下来\u003c/strong\u003e。技能的意义在于减少“这次记得做、下次忘了做”的波动。不过它仍然是代码和外部能力的载体，来源、权限和数据去向都要检查。\u003c/p\u003e\n\u003cp\u003e技能市场分为推荐与分类列表，已安装技能可以在管理页启用、停用或卸载。本机界面中还能从市场搜索和查看技能详情。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQO7wuNaYAAmdAk?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e安装前要看三件事：\u003cstrong\u003e它会读取什么，会运行什么，会把数据发到哪里\u003c/strong\u003e。第三方技能可能访问输入内容、文件或凭据，也可能调用外部服务。只安装来源可信、当前任务确实需要的技能；暂时不用时关闭。遇到需要安装依赖、登录账号或赋予高权限的技能，先在测试工作空间里验证。\u003c/p\u003e\n\u003cp\u003e调用技能时可以在输入框输入 \u003ccode\u003e/\u003c/code\u003e，也可以在任务里明确说“使用某某技能”。如果 WorkBuddy 没有调用你预期的技能，检查它是否已经安装并启用，名称是否一致，当前模型和权限是否满足要求。\u003c/p\u003e\n","kind":"html","rawMarkdown":"技能可以理解成封装好的工具和操作流程。它可能包含说明、脚本、依赖和参数，让 WorkBuddy 在特定任务上更稳定，例如文档格式转换、图表生成、图片处理、特定网站操作等。\n\n一次交付靠人盯着提示词也许能跑通，**连续交付需要把稳定动作固化下来**。技能的意义在于减少“这次记得做、下次忘了做”的波动。不过它仍然是代码和外部能力的载体，来源、权限和数据去向都要检查。\n\n技能市场分为推荐与分类列表，已安装技能可以在管理页启用、停用或卸载。本机界面中还能从市场搜索和查看技能详情。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQO7wuNaYAAmdAk?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n安装前要看三件事：**它会读取什么，会运行什么，会把数据发到哪里**。第三方技能可能访问输入内容、文件或凭据，也可能调用外部服务。只安装来源可信、当前任务确实需要的技能；暂时不用时关闭。遇到需要安装依赖、登录账号或赋予高权限的技能，先在测试工作空间里验证。\n\n调用技能时可以在输入框输入 `/`，也可以在任务里明确说“使用某某技能”。如果 WorkBuddy 没有调用你预期的技能，检查它是否已经安装并启用，名称是否一致，当前模型和权限是否满足要求。","sourceFormat":"markdown"},"note:sha256:fd4c53c333148bd77c8bc186544c469e5bcb5f6310e27a6455d36fc952005a4f":{"html":"\u003cp\u003e先确认输入框里是否真的有文字，工作空间是否有效，模型是否可用，当前是否有登录或额度提示。尝试删除多余空行，重新输入一小段纯文本。仍无反应时查看网络检查和更新日志，不要连续快速点击。\u003c/p\u003e\n","kind":"html","rawMarkdown":"先确认输入框里是否真的有文字，工作空间是否有效，模型是否可用，当前是否有登录或额度提示。尝试删除多余空行，重新输入一小段纯文本。仍无反应时查看网络检查和更新日志，不要连续快速点击。","sourceFormat":"markdown"},"note:sha256:ff459f0b1d83be1904fbdb99f12208fe4760307d5f84b4fc435de22c333a74a4":{"html":"\u003cp\u003e查看任务使用的模型、专家团、深度思考和重试次数。简单任务使用 Auto 或普通模式，复杂任务先 Plan。避免把同一份长资料反复上传，也不要让多个专家处理可以由一个专家完成的工作。\u003c/p\u003e\n","kind":"html","rawMarkdown":"查看任务使用的模型、专家团、深度思考和重试次数。简单任务使用 Auto 或普通模式，复杂任务先 Plan。避免把同一份长资料反复上传，也不要让多个专家处理可以由一个专家完成的工作。","sourceFormat":"markdown"}},"sourceRevision":"sha256:a9fa3ca0c31183cb9b593b28e92a3a6307d40b62e04759246e46969c8082887d"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__
