</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-21T13:31:46.167Z","language":"zh-CN","name":"DeMinds","version":"1.0.42"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Jev 作为 Agent 评测的 Judge","outlineVersion":1},"sourceRevision":"sha256:5d6bdd584681d58263d06989be5d9aba034d4c9a6b71513b5c3577352c85a3e9","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Jev-as-a-Judge for Agent Evals.md","sourceUrl":"https://x.com/LangChain/status/2101454284927959080","title":"Jev 作为 Agent 评测的 Judge"},"files":[{"byteLength":12990,"content":"# Jev 作为 Agent 评测的 Judge\n\n![Image](https://pbs.twimg.com/media/HSncFIHbYAAsCGa?format=jpg\u0026name=medium)\n\n\u003e @LangChain · [X 文章](https://x.com/LangChain/article/2101454284927959080) · 2026-09-19\n\n*作者：Daniel Shea 和 Seán Roche*\n\n核心要点：\n\n- **Jev 是一种本质不同的评测器。** 它不像 LLM judge 那样生成文本，而是直接返回类型化答案。\n- **Jev 在连续评分上表现出显著更高的一致性。** 它的质量评分方差比 GPT-5.6 Luna、Terra 和 Claude Sonnet 4.6 低 92–913 倍。\n- **Jev 也是速度最快、成本最低的。** 平均耗时 0.44 秒、每次调用 $0.00035（总成本 $0.34，而 Claude 为 $28.17）。\n- **结果很有潜力，但仍处于早期。** 尽管这只是一次范围较窄的测试，Jev 的表现仍指向了 Agent 评测一个很有吸引力的新方向。\n\n今天的 Agent 评测大致有两种形式：基于代码的评测，以及 LLM-as-a-judge。两者都有各自的局限：基于代码的评测器只能用于输入明确、范围较窄的问题；LLM judge 则可能速度慢、成本高，而且不够可靠。随着 [TypeSafe AI 的 Jev](https://typesafe.ai/blog/introducing-system-one-models-and-jev) 受到广泛关注，我们想看看这种“System One”模型是否可能成为 Agent 评测的第三种形式，以及它会给 Agent 工程带来什么影响。\n\n## Jev 是什么？\n\nJev 是 TypeSafe AI 发布的一种新模型。严格来说，Jev 并不是传统 LLM；它不会生成文本。TypeSafe AI 团队将它称为“System One”模型：\n\n\u003e 📖 System One 模型是一类用于快速做出结构化决策、并让软件可以直接使用结果的 AI 模型。System One 模型会评估一个 [**state**](https://docs.typesafe.ai/concepts/state)，然后返回类型化答案和概率。\n\n![Image](https://pbs.twimg.com/media/HSnaAn-bAAA_7aA?format=jpg\u0026name=medium)\n\n根据 TypeSafe AI 的说法，在分类任务上，这种设计使 Jev 比 LLM 更快、更便宜，推理速度最高可达 **200 倍**，成本最高可降低 **400 倍**。\n\n## 为什么 Jev 可能适合做 Agent 评测器？\n\n今天的 Agent 评测通常要么基于代码，要么采用 LLM-as-a-judge；两种方式都各有收益、限制和权衡。\n\n### 基于代码的评测\n\n基于代码的评测和代码本身一样历史悠久。它便宜、快速、可靠，主要缺点是能力范围较窄。传统函数需要明确、确定性的输入，因此在评估具有随机性的 Agent 行为时能力有限。\n\n例如，传统函数*可以*判断 Agent 是否在第一次运行时调用了某个工具，但如果要进一步判断 Agent 是否利用工具返回的结果成功回答了用户问题，就会困难得多。在开放式任务中，同一份工具结果往往存在多种有效使用方式，因此试图把所有可接受答案都编码成确定性逻辑，很快就会碰到基于代码评测范围狭窄的限制。\n\n### LLM-as-a-judge\n\n于是出现了 [LLM-as-a-judge](https://docs.langchain.com/langsmith/llm-as-judge)：使用 LLM 对 Agent trace 的非结构化输入进行推理并打分。LLM judge 可以把问题、trace 和证据作为非结构化输入，再通过 prompt 判断回答是否满足用户请求。\n\n![Image](https://pbs.twimg.com/media/HSnaJR7bsAEPn58?format=jpg\u0026name=medium)\n\n但任何 Agent 工程师都会承认，LLM judge 并不是完美方案。它本质上是非确定性系统，很难成为可信测试体系的稳固基础；同时，相比传统的基于代码评测，它通常也更慢、更昂贵。\n\n### Jev 的 decision-first 设计\n\nAgent 评测本质上是一项决策任务：给定 Agent 的状态与行为，分配一个能够提供反馈的分数。Jev 正是为这类模式设计的。它根据结构化 state 评估类型化问题，并返回带概率的类型化答案。相比之下，自回归模型需要通过逐 token 生成来形成判断。\n\n在这次实验中，这种 decision-first 设计与更低延迟、更低成本和更低方差同时出现。\n\n![Image](https://pbs.twimg.com/media/HSnaPgna8AA-RbS?format=jpg\u0026name=medium)\n\n### Choice、Score 与 Noul\n\nJev 支持三种问题类型：\n\n*Choice* 会选择一个选项，并返回概率和置信度。\n\n- 示例：“最终答案是否基于检索到的证据？”\n- 返回：0.0 到 1.0 之间的浮点数，其中 1.0 表示完全基于证据\n\n*‍Score* 根据有序 rubric 对答案评分，并返回概率和置信度‍‍。\n\n- 示例：“这个答案有多有用？”\n- 返回：从 1（无帮助）到 5（非常有用）的 rubric 分数，以及概率和置信度\n\n*Noul* 返回某个 yes/no 判断为真的概率。\n\n- 示例：“哪一种搜索结果最能描述这次运行？”\n- 返回：searched_appropriately、searched_unnecessarily 或 failed_to_search 之一，以及概率和置信度\n\n针对同一个 state，可以并行评估多个原子问题。\n\n![Image](https://pbs.twimg.com/media/HSnaS2ybgAAsjM7?format=jpg\u0026name=medium)\n\n### 固定 Agent run，保证比较一致\n\n如果每次运行中的 Agent 行为、检索数据或 trace 上下文都发生变化，就很难公平比较不同 judge。[Deep Agents](https://www.langchain.com/deep-agents) 和 [LangSmith](https://www.langchain.com/langsmith-platform?utm_campaign=evergreen_langsmith_branded_cv\u0026utm_campaign_id=23553472535\u0026utm_ad_group_id=198810166528\u0026utm_ad_id=797108559068\u0026utm_network=g\u0026utm_term=langsmith\u0026utm_campaign=evergreen_evaluation_cv\u0026utm_source=google\u0026utm_medium=cpc\u0026hsa_acc=7906965105\u0026hsa_cam=23553472535\u0026hsa_grp=198810166528\u0026hsa_ad=797108559068\u0026hsa_src=g\u0026hsa_tgt=kwd-2174781825802\u0026hsa_kw=langsmith\u0026hsa_mt=e\u0026hsa_net=adwords\u0026hsa_ver=3\u0026gad_source=1\u0026gad_campaignid=23553472535\u0026gbraid=0AAAAA-PkietYkJqgIHVlwo2UlqyTQ7bGY\u0026gclid=Cj0KCQjw5bjVBhCiARIsAJzMVnS-CMMHOqW_r5uwOa8HniET34GlYQuRJpCxQuzo5bk9U1THPps3chsaApDfEALw_wcB) 让我们能够把一次 Agent 运行捕获为数据集，并在每个模型上重复回放。\n\n## 用 Jev 做评测\n\n### 测试设置\n\n为了真正测试 Jev，我们首先需要一个被评测的 Agent。我们使用开源 Agent harness Deep Agents 构建了目标 Agent，然后把测试集定义成 LangSmith dataset，让每个评测器面对相同的问题和预期行为。测试集由五个天气请求组成：\n\n![Image](https://pbs.twimg.com/media/HSnbcHhbEAEeNV2?format=jpg\u0026name=medium)\n\n对于数据集中的每个样本，我们捕获天气 Agent 的响应，并把完整输出作为固定样本存储在 LangSmith 中。每个 judge 都使用两个信号评估这五次已捕获运行：*quality*，连续分数；以及 *does_pass*，二元判断。\n\n![Image](https://pbs.twimg.com/media/HSnbiouagAAfvpp?format=jpg\u0026name=medium)\n\n### 人工 oracle 与两个评测维度\n\n为了把正确性与可重复性分开衡量，我们让一位人工评审者依据同一套 rubric 对每个固定响应打标签。把人工评审标签作为 oracle score，使我们能够更深入分析精度和正确性如何共同影响评测器的整体效果。\n\nAccuracy 衡量 judge 与人工 oracle 的一致程度。Variance 衡量在 Agent 行为完全相同时，judge 是否能持续给出同样的判断。更低的 variance 并不自动意味着更高的 accuracy：judge 仍然可能稳定地判断错误。但当 judge 本身准确时，**更低的 variance 会让这种准确性在生产环境中更值得依赖**。\n\n我们将 Jev 与 GPT-5.6 Luna、GPT-5.6 Terra 和 Claude Sonnet 4.6 进行比较，对每个案例重复 100 次，计算方差，并衡量与人工 oracle 的一致程度。\n\n## 评测结果\n\n### Accuracy：与人工 oracle 的一致性\n\n以人工评审者的标签作为本次比较的 oracle，我们计算了二元 pass/fail 判断的 accuracy。\n\n对于二元 *does_pass* 分数，Jev 在全部 500 次重复判断中都与 oracle 一致。Terra 的一致率为 99.8%，Luna 为 96.4%，Claude 为 80.0%。\n\n![Image](https://pbs.twimg.com/media/HSnbwEHa4AAF45A?format=jpg\u0026name=medium)\n\n### Precision：重复评分的一致性\n\nAccuracy 告诉我们 judge 是否与人工 oracle 一致。这里的 Precision 则关注：当 Agent 行为不变时，judge 是否会产生相同的 quality score。我们用各 judge 分数的观测方差来衡量这一点。\n\nJev 的平均单案例观测方差最低，为 0.0000149。Luna 高 433 倍，Terra 高 913 倍，Claude 高 92 倍。\n\n这次实验无法告诉我们为什么 Jev 的分数波动更小。一种假设是，不同模型针对的输出类型不同。TypeSafe 将 Jev 描述为经过训练、用于返回校准概率与类型化答案的决策模型；而自回归 LLM judge 会先生成文本，再由评测器把输出映射成分数。这种差异可能让 Jev 更适合这种有明确边界的评测任务，但这里观察到的是相关现象，并不能证明是训练目标导致了更低方差。\n\n![Image](https://pbs.twimg.com/media/HSnb1qlbUAAWwG4?format=jpg\u0026name=medium)\n\n![Image](https://pbs.twimg.com/media/HSna5m1akAArqWc?format=jpg\u0026name=medium)\n\n![Image](https://pbs.twimg.com/media/HSna3LwacAEOl4J?format=jpg\u0026name=medium)\n\n### 成本与延迟\n\n![Image](https://pbs.twimg.com/media/HSnb6qkbIAACQGk?format=jpg\u0026name=medium)\n\n低成本意味着大规模运行 Agent 评测在实践中可能变得可行。当每次 evaluator 调用都很昂贵时，团队必须在覆盖率和预算之间做取舍。在这次实验中，Jev 每次调用成本为 $0.00035，因此这种权衡没那么尖锐。团队可以承担更多重复判断，以及更频繁的回归检查。\n\n这对 online evaluation 更重要：更低的单次调用成本意味着团队可以在更大比例的生产 trace 上运行更多 judge，从而产生更密集的反馈信号。\n\n![Image](https://pbs.twimg.com/media/HSnazUOaAAE7ZuO?format=jpg\u0026name=medium)\n\n## 大规模 Online Evals 的可能性\n\n对于每天产生 10,000 条 trace 的生产 Agent，实验中观测到的单次调用成本会转化为显著的运营差异。\n\n### Signal value：同时考虑准确与稳定\n\n为了衡量一次低成本调用是否真正有用，我们定义 **signal value**：二元 oracle 一致率乘以二元 repeatability。Repeatability 指的是，对同一条 trace 独立调用两次时得到相同 verdict 的概率。这个指标会奖励既准确又稳定的 judge，同时惩罚那些“稳定地判断错误”的 judge。\n\n![Image](https://pbs.twimg.com/media/HSnb_0Za0AAUvDk?format=jpg\u0026name=medium)\n\n像 Jev 这样高信号、低成本的 judge，可能为 online evaluators 带来更高价值。团队可以为更多生产 trace 生成反馈，更早发现质量变化，并在反馈趋势开始恶化时设置告警。\n\n## 一种新的 Agent 评测形式\n\n今天，每一次 Agent eval 都存在权衡。评测更多 Agent 运行、更多维度，或测试更多变化，都会增加测试成本，这会迫使团队减少他们原本希望执行的评测数量。\n\n### 更密集的反馈循环\n\n在这次实验中，一次 Jev 判断的成本是 $0.00035。除了成本低之外，Jev 还表现出高 accuracy 和低 variance，这意味着 judge 结果可靠、信号密度高。在这个价格下，如果 judge 质量足够好，开发者就可以针对多个聚焦标准评测每一次 Agent 运行，衡量每一次 Agent 变更，并在置信度重要时重复判断。\n\n这一点之所以重要，是因为打造高质量 Agent 需要大量测试和监控。评测 Agent 越频繁，进入开发循环的有效反馈也越多。\n\n### 仍然需要验证的边界\n\n我们仍然需要观察，这次实验中的结果能否推广到其他 Agent 和真实生产工作流。与此同时，低成本也会放大错误——一个持续判断错误的 evaluator，可能把错误反馈规模化。工程师仍然需要把人工复核和 judge alignment 纳入工作流。\n\nSystem One 风格的新模型可能让高质量评测变得充足，从而加快整个 Agent 开发生命周期。Agent 工程师可以把更多 trace 转化为反馈，更早捕捉回归，并在构建、测试、监控和部署 Agent 的过程中更快迭代。\n\n真正被解锁的不只是更便宜的 evals，而是一个更紧密、用于构建可靠 Agent 的反馈循环。\n\n## 可复现性\n\n本项目的 GitHub 仓库可以在[这里](https://github.com/danielgshea/jev-as-a-judge)找到。\n\n我们通过 LangSmith Gateway 运行 LLM judges：GPT-5.6 Luna、GPT-5.6 Terra 和 Claude Sonnet 4.6。Jev 则通过 langchain-typesafe==0.0.1a2 访问。\n\n为保证可复现性，本次运行使用 Deep Agents 0.7.15、LangChain OpenAI 1.6.2、LangSmith 0.12.6 和 Tavily Python 0.8.3。我们没有为 LLM judges 设置 temperature、top-p、seed 或 max tokens，因此使用各 provider 的默认值。实验 metadata 中没有 Jev service version。\n\n## 进一步了解\n\n如果想进一步了解如何使用 Jev 构建 Agent，LangChain 将在 9 月 22 日（周二）与 TypeSafe AI 团队举办一场[直播](https://events.langchain.com/webinar/building-a-harness-with-jev/)。","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"59ff97cf36a71567853c10efd929ed1e9432cab6feb3096440e9a8ac8bb23ff3","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eJev 是什么？\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:0f474ae0b329953f22f5fbd6505e20714b93db5513eff851aca988e4733760ec\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"1,2","tag":"h2"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e基于代码的评测\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256 59e4bad3162023bba61c1ed119015a0f4d66539adeabb0f81\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"20,21","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e进一步了解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:97bd4c833104013f5b1560b06b368b1688f6855350c6579f6cefc865d8b9ca99\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"21,22","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSncFIHbYAAsCGa?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eJev 作为 Agent 评测的 Judge\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Jev 作为 Agent 评测的 Judge\" data-note-id=\"note:sha256:3f5c1788dce01ae59d5dd07eec306de39c7f816f244a14e57d58d22bf3b13279\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"jev-作为-agent-评测的-judge\"\u003eJev 作为 Agent 评测的 Judge\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSncFIHbYAAsCGa?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@LangChain · \u003ca href=\"https://x.com/LangChain/article/2101454284927959080\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-09-19\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cem\u003e作者：Daniel Shea 和 Seán Roche\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e核心要点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eJev 是一种本质不同的评测器。\u003c/strong\u003e 它不像 LLM judge 那样生成文本，而是直接返回类型化答案。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJev 在连续评分上表现出显著更高的一致性。\u003c/strong\u003e 它的质量评分方差比 GPT-5.6 Luna、Terra 和 Claude Sonnet 4.6 低 92–913 倍。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJev 也是速度最快、成本最低的。\u003c/strong\u003e 平均耗时 0.44 秒、每次调用 $0.00035（总成本 $0.34，而 Claude 为 $28.17）。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e结果很有潜力，但仍处于早期。\u003c/strong\u003e 尽管这只是一次范围较窄的测试，Jev 的表现仍指向了 Agent 评测一个很有吸引力的新方向。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e今天的 Agent 评测大致有两种形式：基于代码的评测，以及 LLM-as-a-judge。两者都有各自的局限：基于代码的评测器只能用于输入明确、范围较窄的问题；LLM judge 则可能速度慢、成本高，而且不够可靠。随着 \u003ca href=\"https://typesafe.ai/blog/introducing-system-one-models-and-jev\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eTypeSafe AI 的 Jev\u003c/a\u003e 受到广泛关注，我们想看看这种“System One”模型是否可能成为 Agent 评测的第三种形式，以及它会给 Agent 工程带来什么影响。\u003c/p\u003e\n\u003ch2 id=\"jev-是什么\"\u003eJev 是什么？\u003c/h2\u003e\n\u003cp\u003eJev 是 TypeSafe AI 发布的一种新模型。严格来说，Jev 并不是传统 LLM；它不会生成文本。TypeSafe AI 团队将它称为“System One”模型：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📖 System One 模型是一类用于快速做出结构化决策、并让软件可以直接使用结果的 AI 模型。System One 模型会评估一个 \u003ca href=\"https://docs.typesafe.ai/concepts/state\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003estate\u003c/strong\u003e\u003c/a\u003e，然后返回类型化答案和概率。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnaAn-bAAA_7aA?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e根据 TypeSafe AI 的说法，在分类任务上，这种设计使 Jev 比 LLM 更快、更便宜，推理速度最高可达 \u003cstrong\u003e200 倍\u003c/strong\u003e，成本最高可降低 \u003cstrong\u003e400 倍\u003c/strong\u003e。\u003c/p\u003e\n\u003ch2 id=\"为什么-jev-可能适合做-agent-评测器\"\u003e为什么 Jev 可能适合做 Agent 评测器？\u003c/h2\u003e\n\u003cp\u003e今天的 Agent 评测通常要么基于代码，要么采用 LLM-as-a-judge；两种方式都各有收益、限制和权衡。\u003c/p\u003e\n\u003ch3 id=\"基于代码的评测\"\u003e基于代码的评测\u003c/h3\u003e\n\u003cp\u003e基于代码的评测和代码本身一样历史悠久。它便宜、快速、可靠，主要缺点是能力范围较窄。传统函数需要明确、确定性的输入，因此在评估具有随机性的 Agent 行为时能力有限。\u003c/p\u003e\n\u003cp\u003e例如，传统函数\u003cem\u003e可以\u003c/em\u003e判断 Agent 是否在第一次运行时调用了某个工具，但如果要进一步判断 Agent 是否利用工具返回的结果成功回答了用户问题，就会困难得多。在开放式任务中，同一份工具结果往往存在多种有效使用方式，因此试图把所有可接受答案都编码成确定性逻辑，很快就会碰到基于代码评测范围狭窄的限制。\u003c/p\u003e\n\u003ch3 id=\"llm-as-a-judge\"\u003eLLM-as-a-judge\u003c/h3\u003e\n\u003cp\u003e于是出现了 \u003ca href=\"https://docs.langchain.com/langsmith/llm-as-judge\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLLM-as-a-judge\u003c/a\u003e：使用 LLM 对 Agent trace 的非结构化输入进行推理并打分。LLM judge 可以把问题、trace 和证据作为非结构化输入，再通过 prompt 判断回答是否满足用户请求。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnaJR7bsAEPn58?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e但任何 Agent 工程师都会承认，LLM judge 并不是完美方案。它本质上是非确定性系统，很难成为可信测试体系的稳固基础；同时，相比传统的基于代码评测，它通常也更慢、更昂贵。\u003c/p\u003e\n\u003ch3 id=\"jev-的-decision-first-设计\"\u003eJev 的 decision-first 设计\u003c/h3\u003e\n\u003cp\u003eAgent 评测本质上是一项决策任务：给定 Agent 的状态与行为，分配一个能够提供反馈的分数。Jev 正是为这类模式设计的。它根据结构化 state 评估类型化问题，并返回带概率的类型化答案。相比之下，自回归模型需要通过逐 token 生成来形成判断。\u003c/p\u003e\n\u003cp\u003e在这次实验中，这种 decision-first 设计与更低延迟、更低成本和更低方差同时出现。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnaPgna8AA-RbS?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"choicescore-与-noul\"\u003eChoice、Score 与 Noul\u003c/h3\u003e\n\u003cp\u003eJev 支持三种问题类型：\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eChoice\u003c/em\u003e 会选择一个选项，并返回概率和置信度。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e示例：“最终答案是否基于检索到的证据？”\u003c/li\u003e\n\u003cli\u003e返回：0.0 到 1.0 之间的浮点数，其中 1.0 表示完全基于证据\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003e‍Score\u003c/em\u003e 根据有序 rubric 对答案评分，并返回概率和置信度‍‍。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e示例：“这个答案有多有用？”\u003c/li\u003e\n\u003cli\u003e返回：从 1（无帮助）到 5（非常有用）的 rubric 分数，以及概率和置信度\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003eNoul\u003c/em\u003e 返回某个 yes/no 判断为真的概率。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e示例：“哪一种搜索结果最能描述这次运行？”\u003c/li\u003e\n\u003cli\u003e返回：searched_appropriately、searched_unnecessarily 或 failed_to_search 之一，以及概率和置信度\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e针对同一个 state，可以并行评估多个原子问题。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnaS2ybgAAsjM7?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"固定-agent-run保证比较一致\"\u003e固定 Agent run，保证比较一致\u003c/h3\u003e\n\u003cp\u003e如果每次运行中的 Agent 行为、检索数据或 trace 上下文都发生变化，就很难公平比较不同 judge。\u003ca href=\"https://www.langchain.com/deep-agents\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eDeep Agents\u003c/a\u003e 和 \u003ca href=\"https://www.langchain.com/langsmith-platform?utm_campaign=evergreen_langsmith_branded_cv\u0026amp;utm_campaign_id=23553472535\u0026amp;utm_ad_group_id=198810166528\u0026amp;utm_ad_id=797108559068\u0026amp;utm_network=g\u0026amp;utm_term=langsmith\u0026amp;utm_campaign=evergreen_evaluation_cv\u0026amp;utm_source=google\u0026amp;utm_medium=cpc\u0026amp;hsa_acc=7906965105\u0026amp;hsa_cam=23553472535\u0026amp;hsa_grp=198810166528\u0026amp;hsa_ad=797108559068\u0026amp;hsa_src=g\u0026amp;hsa_tgt=kwd-2174781825802\u0026amp;hsa_kw=langsmith\u0026amp;hsa_mt=e\u0026amp;hsa_net=adwords\u0026amp;hsa_ver=3\u0026amp;gad_source=1\u0026amp;gad_campaignid=23553472535\u0026amp;gbraid=0AAAAA-PkietYkJqgIHVlwo2UlqyTQ7bGY\u0026amp;gclid=Cj0KCQjw5bjVBhCiARIsAJzMVnS-CMMHOqW_r5uwOa8HniET34GlYQuRJpCxQuzo5bk9U1THPps3chsaApDfEALw_wcB\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLangSmith\u003c/a\u003e 让我们能够把一次 Agent 运行捕获为数据集，并在每个模型上重复回放。\u003c/p\u003e\n\u003ch2 id=\"用-jev-做评测\"\u003e用 Jev 做评测\u003c/h2\u003e\n\u003ch3 id=\"测试设置\"\u003e测试设置\u003c/h3\u003e\n\u003cp\u003e为了真正测试 Jev，我们首先需要一个被评测的 Agent。我们使用开源 Agent harness Deep Agents 构建了目标 Agent，然后把测试集定义成 LangSmith dataset，让每个评测器面对相同的问题和预期行为。测试集由五个天气请求组成：\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnbcHhbEAEeNV2?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e对于数据集中的每个样本，我们捕获天气 Agent 的响应，并把完整输出作为固定样本存储在 LangSmith 中。每个 judge 都使用两个信号评估这五次已捕获运行：\u003cem\u003equality\u003c/em\u003e，连续分数；以及 \u003cem\u003edoes_pass\u003c/em\u003e，二元判断。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnbiouagAAfvpp?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"人工-oracle-与两个评测维度\"\u003e人工 oracle 与两个评测维度\u003c/h3\u003e\n\u003cp\u003e为了把正确性与可重复性分开衡量，我们让一位人工评审者依据同一套 rubric 对每个固定响应打标签。把人工评审标签作为 oracle score，使我们能够更深入分析精度和正确性如何共同影响评测器的整体效果。\u003c/p\u003e\n\u003cp\u003eAccuracy 衡量 judge 与人工 oracle 的一致程度。Variance 衡量在 Agent 行为完全相同时，judge 是否能持续给出同样的判断。更低的 variance 并不自动意味着更高的 accuracy：judge 仍然可能稳定地判断错误。但当 judge 本身准确时，\u003cstrong\u003e更低的 variance 会让这种准确性在生产环境中更值得依赖\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e我们将 Jev 与 GPT-5.6 Luna、GPT-5.6 Terra 和 Claude Sonnet 4.6 进行比较，对每个案例重复 100 次，计算方差，并衡量与人工 oracle 的一致程度。\u003c/p\u003e\n\u003ch2 id=\"评测结果\"\u003e评测结果\u003c/h2\u003e\n\u003ch3 id=\"accuracy与人工-oracle-的一致性\"\u003eAccuracy：与人工 oracle 的一致性\u003c/h3\u003e\n\u003cp\u003e以人工评审者的标签作为本次比较的 oracle，我们计算了二元 pass/fail 判断的 accuracy。\u003c/p\u003e\n\u003cp\u003e对于二元 \u003cem\u003edoes_pass\u003c/em\u003e 分数，Jev 在全部 500 次重复判断中都与 oracle 一致。Terra 的一致率为 99.8%，Luna 为 96.4%，Claude 为 80.0%。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnbwEHa4AAF45A?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"precision重复评分的一致性\"\u003ePrecision：重复评分的一致性\u003c/h3\u003e\n\u003cp\u003eAccuracy 告诉我们 judge 是否与人工 oracle 一致。这里的 Precision 则关注：当 Agent 行为不变时，judge 是否会产生相同的 quality score。我们用各 judge 分数的观测方差来衡量这一点。\u003c/p\u003e\n\u003cp\u003eJev 的平均单案例观测方差最低，为 0.0000149。Luna 高 433 倍，Terra 高 913 倍，Claude 高 92 倍。\u003c/p\u003e\n\u003cp\u003e这次实验无法告诉我们为什么 Jev 的分数波动更小。一种假设是，不同模型针对的输出类型不同。TypeSafe 将 Jev 描述为经过训练、用于返回校准概率与类型化答案的决策模型；而自回归 LLM judge 会先生成文本，再由评测器把输出映射成分数。这种差异可能让 Jev 更适合这种有明确边界的评测任务，但这里观察到的是相关现象，并不能证明是训练目标导致了更低方差。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnb1qlbUAAWwG4?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSna5m1akAArqWc?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSna3LwacAEOl4J?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"成本与延迟\"\u003e成本与延迟\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnb6qkbIAACQGk?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e低成本意味着大规模运行 Agent 评测在实践中可能变得可行。当每次 evaluator 调用都很昂贵时，团队必须在覆盖率和预算之间做取舍。在这次实验中，Jev 每次调用成本为 $0.00035，因此这种权衡没那么尖锐。团队可以承担更多重复判断，以及更频繁的回归检查。\u003c/p\u003e\n\u003cp\u003e这对 online evaluation 更重要：更低的单次调用成本意味着团队可以在更大比例的生产 trace 上运行更多 judge，从而产生更密集的反馈信号。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnazUOaAAE7ZuO?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch2 id=\"大规模-online-evals-的可能性\"\u003e大规模 Online Evals 的可能性\u003c/h2\u003e\n\u003cp\u003e对于每天产生 10,000 条 trace 的生产 Agent，实验中观测到的单次调用成本会转化为显著的运营差异。\u003c/p\u003e\n\u003ch3 id=\"signal-value同时考虑准确与稳定\"\u003eSignal value：同时考虑准确与稳定\u003c/h3\u003e\n\u003cp\u003e为了衡量一次低成本调用是否真正有用，我们定义 \u003cstrong\u003esignal value\u003c/strong\u003e：二元 oracle 一致率乘以二元 repeatability。Repeatability 指的是，对同一条 trace 独立调用两次时得到相同 verdict 的概率。这个指标会奖励既准确又稳定的 judge，同时惩罚那些“稳定地判断错误”的 judge。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnb_0Za0AAUvDk?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e像 Jev 这样高信号、低成本的 judge，可能为 online evaluators 带来更高价值。团队可以为更多生产 trace 生成反馈，更早发现质量变化，并在反馈趋势开始恶化时设置告警。\u003c/p\u003e\n\u003ch2 id=\"一种新的-agent-评测形式\"\u003e一种新的 Agent 评测形式\u003c/h2\u003e\n\u003cp\u003e今天，每一次 Agent eval 都存在权衡。评测更多 Agent 运行、更多维度，或测试更多变化，都会增加测试成本，这会迫使团队减少他们原本希望执行的评测数量。\u003c/p\u003e\n\u003ch3 id=\"更密集的反馈循环\"\u003e更密集的反馈循环\u003c/h3\u003e\n\u003cp\u003e在这次实验中，一次 Jev 判断的成本是 $0.00035。除了成本低之外，Jev 还表现出高 accuracy 和低 variance，这意味着 judge 结果可靠、信号密度高。在这个价格下，如果 judge 质量足够好，开发者就可以针对多个聚焦标准评测每一次 Agent 运行，衡量每一次 Agent 变更，并在置信度重要时重复判断。\u003c/p\u003e\n\u003cp\u003e这一点之所以重要，是因为打造高质量 Agent 需要大量测试和监控。评测 Agent 越频繁，进入开发循环的有效反馈也越多。\u003c/p\u003e\n\u003ch3 id=\"仍然需要验证的边界\"\u003e仍然需要验证的边界\u003c/h3\u003e\n\u003cp\u003e我们仍然需要观察，这次实验中的结果能否推广到其他 Agent 和真实生产工作流。与此同时，低成本也会放大错误——一个持续判断错误的 evaluator，可能把错误反馈规模化。工程师仍然需要把人工复核和 judge alignment 纳入工作流。\u003c/p\u003e\n\u003cp\u003eSystem One 风格的新模型可能让高质量评测变得充足，从而加快整个 Agent 开发生命周期。Agent 工程师可以把更多 trace 转化为反馈，更早捕捉回归，并在构建、测试、监控和部署 Agent 的过程中更快迭代。\u003c/p\u003e\n\u003cp\u003e真正被解锁的不只是更便宜的 evals，而是一个更紧密、用于构建可靠 Agent 的反馈循环。\u003c/p\u003e\n\u003ch2 id=\"可复现性\"\u003e可复现性\u003c/h2\u003e\n\u003cp\u003e本项目的 GitHub 仓库可以在\u003ca href=\"https://github.com/danielgshea/jev-as-a-judge\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e这里\u003c/a\u003e找到。\u003c/p\u003e\n\u003cp\u003e我们通过 LangSmith Gateway 运行 LLM judges：GPT-5.6 Luna、GPT-5.6 Terra 和 Claude Sonnet 4.6。Jev 则通过 langchain-typesafe==0.0.1a2 访问。\u003c/p\u003e\n\u003cp\u003e为保证可复现性，本次运行使用 Deep Agents 0.7.15、LangChain OpenAI 1.6.2、LangSmith 0.12.6 和 Tavily Python 0.8.3。我们没有为 LLM judges 设置 temperature、top-p、seed 或 max tokens，因此使用各 provider 的默认值。实验 metadata 中没有 Jev service version。\u003c/p\u003e\n\u003ch2 id=\"进一步了解\"\u003e进一步了解\u003c/h2\u003e\n\u003cp\u003e如果想进一步了解如何使用 Jev 构建 Agent，LangChain 将在 9 月 22 日（周二）与 TypeSafe AI 团队举办一场\u003ca href=\"https://events.langchain.com/webinar/building-a-harness-with-jev/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e直播\u003c/a\u003e。\u003c/p\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:0f474ae0b329953f22f5fbd6505e20714b93db5513eff851aca988e4733760ec":{"html":"\u003cp\u003eJev 是 TypeSafe AI 发布的一种新模型。严格来说，Jev 并不是传统 LLM；它不会生成文本。TypeSafe AI 团队将它称为“System One”模型：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e📖 System One 模型是一类用于快速做出结构化决策、并让软件可以直接使用结果的 AI 模型。System One 模型会评估一个 \u003ca href=\"https://docs.typesafe.ai/concepts/state\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003estate\u003c/strong\u003e\u003c/a\u003e，然后返回类型化答案和概率。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnaAn-bAAA_7aA?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e根据 TypeSafe AI 的说法，在分类任务上，这种设计使 Jev 比 LLM 更快、更便宜，推理速度最高可达 \u003cstrong\u003e200 倍\u003c/strong\u003e，成本最高可降低 \u003cstrong\u003e400 倍\u003c/strong\u003e。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Jev 是 TypeSafe AI 发布的一种新模型。严格来说，Jev 并不是传统 LLM；它不会生成文本。TypeSafe AI 团队将它称为“System One”模型：\n\n\u003e 📖 System One 模型是一类用于快速做出结构化决策、并让软件可以直接使用结果的 AI 模型。System One 模型会评估一个 [**state**](https://docs.typesafe.ai/concepts/state)，然后返回类型化答案和概率。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnaAn-bAAA_7aA?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n根据 TypeSafe AI 的说法，在分类任务上，这种设计使 Jev 比 LLM 更快、更便宜，推理速度最高可达 **200 倍**，成本最高可降低 **400 倍**。","sourceFormat":"markdown"},"note:sha256:1605f70c949e180473326e03a7907c8ab95f7f2fec2c019b14211678195e5892":{"html":"\u003cp\u003e为了真正测试 Jev，我们首先需要一个被评测的 Agent。我们使用开源 Agent harness Deep Agents 构建了目标 Agent，然后把测试集定义成 LangSmith dataset，让每个评测器面对相同的问题和预期行为。测试集由五个天气请求组成：\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnbcHhbEAEeNV2?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e对于数据集中的每个样本，我们捕获天气 Agent 的响应，并把完整输出作为固定样本存储在 LangSmith 中。每个 judge 都使用两个信号评估这五次已捕获运行：\u003cem\u003equality\u003c/em\u003e，连续分数；以及 \u003cem\u003edoes_pass\u003c/em\u003e，二元判断。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnbiouagAAfvpp?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"为了真正测试 Jev，我们首先需要一个被评测的 Agent。我们使用开源 Agent harness Deep Agents 构建了目标 Agent，然后把测试集定义成 LangSmith dataset，让每个评测器面对相同的问题和预期行为。测试集由五个天气请求组成：\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnbcHhbEAEeNV2?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n对于数据集中的每个样本，我们捕获天气 Agent 的响应，并把完整输出作为固定样本存储在 LangSmith 中。每个 judge 都使用两个信号评估这五次已捕获运行：*quality*，连续分数；以及 *does_pass*，二元判断。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnbiouagAAfvpp?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:1f34f7f1c7ad357a42958b628655165bcbbb15e34fb05e2e9cc4624de88ec145":{"html":"\u003cp\u003e我们仍然需要观察，这次实验中的结果能否推广到其他 Agent 和真实生产工作流。与此同时，低成本也会放大错误——一个持续判断错误的 evaluator，可能把错误反馈规模化。工程师仍然需要把人工复核和 judge alignment 纳入工作流。\u003c/p\u003e\n\u003cp\u003eSystem One 风格的新模型可能让高质量评测变得充足，从而加快整个 Agent 开发生命周期。Agent 工程师可以把更多 trace 转化为反馈，更早捕捉回归，并在构建、测试、监控和部署 Agent 的过程中更快迭代。\u003c/p\u003e\n\u003cp\u003e真正被解锁的不只是更便宜的 evals，而是一个更紧密、用于构建可靠 Agent 的反馈循环。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们仍然需要观察，这次实验中的结果能否推广到其他 Agent 和真实生产工作流。与此同时，低成本也会放大错误——一个持续判断错误的 evaluator，可能把错误反馈规模化。工程师仍然需要把人工复核和 judge alignment 纳入工作流。\n\nSystem One 风格的新模型可能让高质量评测变得充足，从而加快整个 Agent 开发生命周期。Agent 工程师可以把更多 trace 转化为反馈，更早捕捉回归，并在构建、测试、监控和部署 Agent 的过程中更快迭代。\n\n真正被解锁的不只是更便宜的 evals，而是一个更紧密、用于构建可靠 Agent 的反馈循环。","sourceFormat":"markdown"},"note:sha256:38d2a9bc8a9a9a059e4bad3162023bba61c1ed119015a0f4d66539adeabb0f81":{"html":"\u003cp\u003e本项目的 GitHub 仓库可以在\u003ca href=\"https://github.com/danielgshea/jev-as-a-judge\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e这里\u003c/a\u003e找到。\u003c/p\u003e\n\u003cp\u003e我们通过 LangSmith Gateway 运行 LLM judges：GPT-5.6 Luna、GPT-5.6 Terra 和 Claude Sonnet 4.6。Jev 则通过 langchain-typesafe==0.0.1a2 访问。\u003c/p\u003e\n\u003cp\u003e为保证可复现性，本次运行使用 Deep Agents 0.7.15、LangChain OpenAI 1.6.2、LangSmith 0.12.6 和 Tavily Python 0.8.3。我们没有为 LLM judges 设置 temperature、top-p、seed 或 max tokens，因此使用各 provider 的默认值。实验 metadata 中没有 Jev service version。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本项目的 GitHub 仓库可以在[这里](https://github.com/danielgshea/jev-as-a-judge)找到。\n\n我们通过 LangSmith Gateway 运行 LLM judges：GPT-5.6 Luna、GPT-5.6 Terra 和 Claude Sonnet 4.6。Jev 则通过 langchain-typesafe==0.0.1a2 访问。\n\n为保证可复现性，本次运行使用 Deep Agents 0.7.15、LangChain OpenAI 1.6.2、LangSmith 0.12.6 和 Tavily Python 0.8.3。我们没有为 LLM judges 设置 temperature、top-p、seed 或 max tokens，因此使用各 provider 的默认值。实验 metadata 中没有 Jev service version。","sourceFormat":"markdown"},"note:sha256:3f5c1788dce01ae59d5dd07eec306de39c7f816f244a14e57d58d22bf3b13279":{"blocks":[{"children":[],"kind":"leaf","title":"@LangChain · X 文章 · 2026-09-19"},{"children":[],"kind":"leaf","title":"作者：Daniel Shea 和 Seán Roche"},{"children":[{"title":"**Jev 是一种本质不同的评测器。** 它不像 LLM judge 那样生成文本，而是直接返回类型化答案。"},{"title":"**Jev 在连续评分上表现出显著更高的一致性。** 它的质量评分方差比 GPT-5.6 Luna、Terra 和 Claude Sonnet 4.6 低 92–913 倍。"},{"title":"**Jev 也是速度最快、成本最低的。** 平均耗时 0.44 秒、每次调用 $0.00035（总成本 $0.34，而 Claude 为 $28.17）。"},{"title":"**结果很有潜力，但仍处于早期。** 尽管这只是一次范围较窄的测试，Jev 的表现仍指向了 Agent 评测一个很有吸引力的新方向。"}],"kind":"section","title":"核心要点"},{"children":[],"kind":"leaf","title":"今天的 Agent 评测大致有两种形式：基于代码的评测，以及 LLM-as-a-judge。两者都有各自的局限：基于代码的评测器只能用于输入明确、范围较窄的问题；LLM judge 则可能速度慢、成本高，而且不够可靠。随着 TypeSafe AI 的 Jev 受到广泛关注，我们想看看这种“System One”模型是否可能成为 Agent 评测的第三种形式，以及它会给 Agent 工程带来什么影响。"}],"html":"\u003cblockquote\u003e\n\u003cp\u003e@LangChain · \u003ca href=\"https://x.com/LangChain/article/2101454284927959080\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-09-19\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cem\u003e作者：Daniel Shea 和 Seán Roche\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e核心要点：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eJev 是一种本质不同的评测器。\u003c/strong\u003e 它不像 LLM judge 那样生成文本，而是直接返回类型化答案。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJev 在连续评分上表现出显著更高的一致性。\u003c/strong\u003e 它的质量评分方差比 GPT-5.6 Luna、Terra 和 Claude Sonnet 4.6 低 92–913 倍。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJev 也是速度最快、成本最低的。\u003c/strong\u003e 平均耗时 0.44 秒、每次调用 $0.00035（总成本 $0.34，而 Claude 为 $28.17）。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e结果很有潜力，但仍处于早期。\u003c/strong\u003e 尽管这只是一次范围较窄的测试，Jev 的表现仍指向了 Agent 评测一个很有吸引力的新方向。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e今天的 Agent 评测大致有两种形式：基于代码的评测，以及 LLM-as-a-judge。两者都有各自的局限：基于代码的评测器只能用于输入明确、范围较窄的问题；LLM judge 则可能速度慢、成本高，而且不够可靠。随着 \u003ca href=\"https://typesafe.ai/blog/introducing-system-one-models-and-jev\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eTypeSafe AI 的 Jev\u003c/a\u003e 受到广泛关注，我们想看看这种“System One”模型是否可能成为 Agent 评测的第三种形式，以及它会给 Agent 工程带来什么影响。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"\u003e @LangChain · [X 文章](https://x.com/LangChain/article/2101454284927959080) · 2026-09-19\n\n*作者：Daniel Shea 和 Seán Roche*\n\n核心要点：\n\n- **Jev 是一种本质不同的评测器。** 它不像 LLM judge 那样生成文本，而是直接返回类型化答案。\n- **Jev 在连续评分上表现出显著更高的一致性。** 它的质量评分方差比 GPT-5.6 Luna、Terra 和 Claude Sonnet 4.6 低 92–913 倍。\n- **Jev 也是速度最快、成本最低的。** 平均耗时 0.44 秒、每次调用 $0.00035（总成本 $0.34，而 Claude 为 $28.17）。\n- **结果很有潜力，但仍处于早期。** 尽管这只是一次范围较窄的测试，Jev 的表现仍指向了 Agent 评测一个很有吸引力的新方向。\n\n今天的 Agent 评测大致有两种形式：基于代码的评测，以及 LLM-as-a-judge。两者都有各自的局限：基于代码的评测器只能用于输入明确、范围较窄的问题；LLM judge 则可能速度慢、成本高，而且不够可靠。随着 [TypeSafe AI 的 Jev](https://typesafe.ai/blog/introducing-system-one-models-and-jev) 受到广泛关注，我们想看看这种“System One”模型是否可能成为 Agent 评测的第三种形式，以及它会给 Agent 工程带来什么影响。","sourceFormat":"markdown"},"note:sha256:4767b55d11acadd118b0aa9b5f59d21e7c86dc24a99038ce236f71f50b43f2f8":{"html":"\u003cp\u003eAccuracy 告诉我们 judge 是否与人工 oracle 一致。这里的 Precision 则关注：当 Agent 行为不变时，judge 是否会产生相同的 quality score。我们用各 judge 分数的观测方差来衡量这一点。\u003c/p\u003e\n\u003cp\u003eJev 的平均单案例观测方差最低，为 0.0000149。Luna 高 433 倍，Terra 高 913 倍，Claude 高 92 倍。\u003c/p\u003e\n\u003cp\u003e这次实验无法告诉我们为什么 Jev 的分数波动更小。一种假设是，不同模型针对的输出类型不同。TypeSafe 将 Jev 描述为经过训练、用于返回校准概率与类型化答案的决策模型；而自回归 LLM judge 会先生成文本，再由评测器把输出映射成分数。这种差异可能让 Jev 更适合这种有明确边界的评测任务，但这里观察到的是相关现象，并不能证明是训练目标导致了更低方差。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnb1qlbUAAWwG4?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSna5m1akAArqWc?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSna3LwacAEOl4J?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"Accuracy 告诉我们 judge 是否与人工 oracle 一致。这里的 Precision 则关注：当 Agent 行为不变时，judge 是否会产生相同的 quality score。我们用各 judge 分数的观测方差来衡量这一点。\n\nJev 的平均单案例观测方差最低，为 0.0000149。Luna 高 433 倍，Terra 高 913 倍，Claude 高 92 倍。\n\n这次实验无法告诉我们为什么 Jev 的分数波动更小。一种假设是，不同模型针对的输出类型不同。TypeSafe 将 Jev 描述为经过训练、用于返回校准概率与类型化答案的决策模型；而自回归 LLM judge 会先生成文本，再由评测器把输出映射成分数。这种差异可能让 Jev 更适合这种有明确边界的评测任务，但这里观察到的是相关现象，并不能证明是训练目标导致了更低方差。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnb1qlbUAAWwG4?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSna5m1akAArqWc?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSna3LwacAEOl4J?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:4c2a1cc37960a89149f5581c48c177b6fe29e0e549793b4794051dc208e9c34f":{"blocks":[{"bodyBlocks":[{"kind":"paragraph","text":"Choice 会选择一个选项，并返回概率和置信度。"}],"children":[{"title":"示例：“最终答案是否基于检索到的证据？”"},{"title":"返回：0.0 到 1.0 之间的浮点数，其中 1.0 表示完全基于证据"}],"kind":"compound_leaf","lead":"Jev 支持三种问题类型："},{"children":[{"title":"示例：“这个答案有多有用？”"},{"title":"返回：从 1（无帮助）到 5（非常有用）的 rubric 分数，以及概率和置信度"}],"kind":"section","title":"‍Score 根据有序 rubric 对答案评分，并返回概率和置信度‍‍。"},{"children":[{"title":"示例：“哪一种搜索结果最能描述这次运行？”"},{"title":"返回：searched_appropriately、searched_unnecessarily 或 failed_to_search 之一，以及概率和置信度"}],"kind":"section","title":"Noul 返回某个 yes/no 判断为真的概率。"},{"children":[],"kind":"leaf","title":"针对同一个 state，可以并行评估多个原子问题。"}],"html":"\u003cp\u003eJev 支持三种问题类型：\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eChoice\u003c/em\u003e 会选择一个选项，并返回概率和置信度。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e示例：“最终答案是否基于检索到的证据？”\u003c/li\u003e\n\u003cli\u003e返回：0.0 到 1.0 之间的浮点数，其中 1.0 表示完全基于证据\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003e‍Score\u003c/em\u003e 根据有序 rubric 对答案评分，并返回概率和置信度‍‍。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e示例：“这个答案有多有用？”\u003c/li\u003e\n\u003cli\u003e返回：从 1（无帮助）到 5（非常有用）的 rubric 分数，以及概率和置信度\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003eNoul\u003c/em\u003e 返回某个 yes/no 判断为真的概率。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e示例：“哪一种搜索结果最能描述这次运行？”\u003c/li\u003e\n\u003cli\u003e返回：searched_appropriately、searched_unnecessarily 或 failed_to_search 之一，以及概率和置信度\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e针对同一个 state，可以并行评估多个原子问题。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnaS2ybgAAsjM7?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"structured","rawMarkdown":"Jev 支持三种问题类型：\n\n*Choice* 会选择一个选项，并返回概率和置信度。\n\n- 示例：“最终答案是否基于检索到的证据？”\n- 返回：0.0 到 1.0 之间的浮点数，其中 1.0 表示完全基于证据\n\n*‍Score* 根据有序 rubric 对答案评分，并返回概率和置信度‍‍。\n\n- 示例：“这个答案有多有用？”\n- 返回：从 1（无帮助）到 5（非常有用）的 rubric 分数，以及概率和置信度\n\n*Noul* 返回某个 yes/no 判断为真的概率。\n\n- 示例：“哪一种搜索结果最能描述这次运行？”\n- 返回：searched_appropriately、searched_unnecessarily 或 failed_to_search 之一，以及概率和置信度\n\n针对同一个 state，可以并行评估多个原子问题。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnaS2ybgAAsjM7?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:5f8c2224cf3c4c600150cf65b97d6a5e6736edae1454ceb2fb54e997aa5707e9":{"html":"\u003cp\u003e为了把正确性与可重复性分开衡量，我们让一位人工评审者依据同一套 rubric 对每个固定响应打标签。把人工评审标签作为 oracle score，使我们能够更深入分析精度和正确性如何共同影响评测器的整体效果。\u003c/p\u003e\n\u003cp\u003eAccuracy 衡量 judge 与人工 oracle 的一致程度。Variance 衡量在 Agent 行为完全相同时，judge 是否能持续给出同样的判断。更低的 variance 并不自动意味着更高的 accuracy：judge 仍然可能稳定地判断错误。但当 judge 本身准确时，\u003cstrong\u003e更低的 variance 会让这种准确性在生产环境中更值得依赖\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e我们将 Jev 与 GPT-5.6 Luna、GPT-5.6 Terra 和 Claude Sonnet 4.6 进行比较，对每个案例重复 100 次，计算方差，并衡量与人工 oracle 的一致程度。\u003c/p\u003e\n","kind":"html","rawMarkdown":"为了把正确性与可重复性分开衡量，我们让一位人工评审者依据同一套 rubric 对每个固定响应打标签。把人工评审标签作为 oracle score，使我们能够更深入分析精度和正确性如何共同影响评测器的整体效果。\n\nAccuracy 衡量 judge 与人工 oracle 的一致程度。Variance 衡量在 Agent 行为完全相同时，judge 是否能持续给出同样的判断。更低的 variance 并不自动意味着更高的 accuracy：judge 仍然可能稳定地判断错误。但当 judge 本身准确时，**更低的 variance 会让这种准确性在生产环境中更值得依赖**。\n\n我们将 Jev 与 GPT-5.6 Luna、GPT-5.6 Terra 和 Claude Sonnet 4.6 进行比较，对每个案例重复 100 次，计算方差，并衡量与人工 oracle 的一致程度。","sourceFormat":"markdown"},"note:sha256:765842493c8c853ff96e5af500abe7997509b2fbcc1be9940281a16220436cbf":{"html":"\u003cp\u003e基于代码的评测和代码本身一样历史悠久。它便宜、快速、可靠，主要缺点是能力范围较窄。传统函数需要明确、确定性的输入，因此在评估具有随机性的 Agent 行为时能力有限。\u003c/p\u003e\n\u003cp\u003e例如，传统函数\u003cem\u003e可以\u003c/em\u003e判断 Agent 是否在第一次运行时调用了某个工具，但如果要进一步判断 Agent 是否利用工具返回的结果成功回答了用户问题，就会困难得多。在开放式任务中，同一份工具结果往往存在多种有效使用方式，因此试图把所有可接受答案都编码成确定性逻辑，很快就会碰到基于代码评测范围狭窄的限制。\u003c/p\u003e\n","kind":"html","rawMarkdown":"基于代码的评测和代码本身一样历史悠久。它便宜、快速、可靠，主要缺点是能力范围较窄。传统函数需要明确、确定性的输入，因此在评估具有随机性的 Agent 行为时能力有限。\n\n例如，传统函数*可以*判断 Agent 是否在第一次运行时调用了某个工具，但如果要进一步判断 Agent 是否利用工具返回的结果成功回答了用户问题，就会困难得多。在开放式任务中，同一份工具结果往往存在多种有效使用方式，因此试图把所有可接受答案都编码成确定性逻辑，很快就会碰到基于代码评测范围狭窄的限制。","sourceFormat":"markdown"},"note:sha256:7f35d84d7088868e748c79178af5e0e3eaf4c7e53422932e89a989158d647fb3":{"html":"\u003cp\u003e今天，每一次 Agent eval 都存在权衡。评测更多 Agent 运行、更多维度，或测试更多变化，都会增加测试成本，这会迫使团队减少他们原本希望执行的评测数量。\u003c/p\u003e\n","kind":"html","rawMarkdown":"今天，每一次 Agent eval 都存在权衡。评测更多 Agent 运行、更多维度，或测试更多变化，都会增加测试成本，这会迫使团队减少他们原本希望执行的评测数量。","sourceFormat":"markdown"},"note:sha256:97bd4c833104013f5b1560b06b368b1688f6855350c6579f6cefc865d8b9ca99":{"html":"\u003cp\u003e如果想进一步了解如何使用 Jev 构建 Agent，LangChain 将在 9 月 22 日（周二）与 TypeSafe AI 团队举办一场\u003ca href=\"https://events.langchain.com/webinar/building-a-harness-with-jev/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e直播\u003c/a\u003e。\u003c/p\u003e\n","kind":"html","rawMarkdown":"如果想进一步了解如何使用 Jev 构建 Agent，LangChain 将在 9 月 22 日（周二）与 TypeSafe AI 团队举办一场[直播](https://events.langchain.com/webinar/building-a-harness-with-jev/)。","sourceFormat":"markdown"},"note:sha256:b1f37839ab607f3218799a1bd1a51e1b13a76d5e33915d82c5528624b92a4b4f":{"html":"\u003cp\u003e低成本意味着大规模运行 Agent 评测在实践中可能变得可行。当每次 evaluator 调用都很昂贵时，团队必须在覆盖率和预算之间做取舍。在这次实验中，Jev 每次调用成本为 $0.00035，因此这种权衡没那么尖锐。团队可以承担更多重复判断，以及更频繁的回归检查。\u003c/p\u003e\n\u003cp\u003e这对 online evaluation 更重要：更低的单次调用成本意味着团队可以在更大比例的生产 trace 上运行更多 judge，从而产生更密集的反馈信号。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnazUOaAAE7ZuO?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"低成本意味着大规模运行 Agent 评测在实践中可能变得可行。当每次 evaluator 调用都很昂贵时，团队必须在覆盖率和预算之间做取舍。在这次实验中，Jev 每次调用成本为 $0.00035，因此这种权衡没那么尖锐。团队可以承担更多重复判断，以及更频繁的回归检查。\n\n这对 online evaluation 更重要：更低的单次调用成本意味着团队可以在更大比例的生产 trace 上运行更多 judge，从而产生更密集的反馈信号。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnazUOaAAE7ZuO?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:bc4452746142f64572db5c7597c162303334f2b4e80dad3c57f0e452d197c0dc":{"html":"\u003cp\u003eAgent 评测本质上是一项决策任务：给定 Agent 的状态与行为，分配一个能够提供反馈的分数。Jev 正是为这类模式设计的。它根据结构化 state 评估类型化问题，并返回带概率的类型化答案。相比之下，自回归模型需要通过逐 token 生成来形成判断。\u003c/p\u003e\n\u003cp\u003e在这次实验中，这种 decision-first 设计与更低延迟、更低成本和更低方差同时出现。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnaPgna8AA-RbS?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"Agent 评测本质上是一项决策任务：给定 Agent 的状态与行为，分配一个能够提供反馈的分数。Jev 正是为这类模式设计的。它根据结构化 state 评估类型化问题，并返回带概率的类型化答案。相比之下，自回归模型需要通过逐 token 生成来形成判断。\n\n在这次实验中，这种 decision-first 设计与更低延迟、更低成本和更低方差同时出现。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnaPgna8AA-RbS?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:c5b0f7eba2de89aadf3a71ee7b80ddd7c6020d4cddc3f9dc3ee6521b0863a169":{"html":"\u003cp\u003e如果每次运行中的 Agent 行为、检索数据或 trace 上下文都发生变化，就很难公平比较不同 judge。\u003ca href=\"https://www.langchain.com/deep-agents\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eDeep Agents\u003c/a\u003e 和 \u003ca href=\"https://www.langchain.com/langsmith-platform?utm_campaign=evergreen_langsmith_branded_cv\u0026amp;utm_campaign_id=23553472535\u0026amp;utm_ad_group_id=198810166528\u0026amp;utm_ad_id=797108559068\u0026amp;utm_network=g\u0026amp;utm_term=langsmith\u0026amp;utm_campaign=evergreen_evaluation_cv\u0026amp;utm_source=google\u0026amp;utm_medium=cpc\u0026amp;hsa_acc=7906965105\u0026amp;hsa_cam=23553472535\u0026amp;hsa_grp=198810166528\u0026amp;hsa_ad=797108559068\u0026amp;hsa_src=g\u0026amp;hsa_tgt=kwd-2174781825802\u0026amp;hsa_kw=langsmith\u0026amp;hsa_mt=e\u0026amp;hsa_net=adwords\u0026amp;hsa_ver=3\u0026amp;gad_source=1\u0026amp;gad_campaignid=23553472535\u0026amp;gbraid=0AAAAA-PkietYkJqgIHVlwo2UlqyTQ7bGY\u0026amp;gclid=Cj0KCQjw5bjVBhCiARIsAJzMVnS-CMMHOqW_r5uwOa8HniET34GlYQuRJpCxQuzo5bk9U1THPps3chsaApDfEALw_wcB\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLangSmith\u003c/a\u003e 让我们能够把一次 Agent 运行捕获为数据集，并在每个模型上重复回放。\u003c/p\u003e\n","kind":"html","rawMarkdown":"如果每次运行中的 Agent 行为、检索数据或 trace 上下文都发生变化，就很难公平比较不同 judge。[Deep Agents](https://www.langchain.com/deep-agents) 和 [LangSmith](https://www.langchain.com/langsmith-platform?utm_campaign=evergreen_langsmith_branded_cv\u0026utm_campaign_id=23553472535\u0026utm_ad_group_id=198810166528\u0026utm_ad_id=797108559068\u0026utm_network=g\u0026utm_term=langsmith\u0026utm_campaign=evergreen_evaluation_cv\u0026utm_source=google\u0026utm_medium=cpc\u0026hsa_acc=7906965105\u0026hsa_cam=23553472535\u0026hsa_grp=198810166528\u0026hsa_ad=797108559068\u0026hsa_src=g\u0026hsa_tgt=kwd-2174781825802\u0026hsa_kw=langsmith\u0026hsa_mt=e\u0026hsa_net=adwords\u0026hsa_ver=3\u0026gad_source=1\u0026gad_campaignid=23553472535\u0026gbraid=0AAAAA-PkietYkJqgIHVlwo2UlqyTQ7bGY\u0026gclid=Cj0KCQjw5bjVBhCiARIsAJzMVnS-CMMHOqW_r5uwOa8HniET34GlYQuRJpCxQuzo5bk9U1THPps3chsaApDfEALw_wcB) 让我们能够把一次 Agent 运行捕获为数据集，并在每个模型上重复回放。","sourceFormat":"markdown"},"note:sha256:cddb91ddeaaf79b522329eea848507bcc30b033d2e7664f125f2b36f047bee64":{"html":"\u003cp\u003e对于每天产生 10,000 条 trace 的生产 Agent，实验中观测到的单次调用成本会转化为显著的运营差异。\u003c/p\u003e\n","kind":"html","rawMarkdown":"对于每天产生 10,000 条 trace 的生产 Agent，实验中观测到的单次调用成本会转化为显著的运营差异。","sourceFormat":"markdown"},"note:sha256:cfdf337a41d3210884a9367175992ef15a2868d203a3d9028867145b91062e2a":{"html":"\u003cp\u003e为了衡量一次低成本调用是否真正有用，我们定义 \u003cstrong\u003esignal value\u003c/strong\u003e：二元 oracle 一致率乘以二元 repeatability。Repeatability 指的是，对同一条 trace 独立调用两次时得到相同 verdict 的概率。这个指标会奖励既准确又稳定的 judge，同时惩罚那些“稳定地判断错误”的 judge。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnb_0Za0AAUvDk?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e像 Jev 这样高信号、低成本的 judge，可能为 online evaluators 带来更高价值。团队可以为更多生产 trace 生成反馈，更早发现质量变化，并在反馈趋势开始恶化时设置告警。\u003c/p\u003e\n","kind":"html","rawMarkdown":"为了衡量一次低成本调用是否真正有用，我们定义 **signal value**：二元 oracle 一致率乘以二元 repeatability。Repeatability 指的是，对同一条 trace 独立调用两次时得到相同 verdict 的概率。这个指标会奖励既准确又稳定的 judge，同时惩罚那些“稳定地判断错误”的 judge。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnb_0Za0AAUvDk?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n像 Jev 这样高信号、低成本的 judge，可能为 online evaluators 带来更高价值。团队可以为更多生产 trace 生成反馈，更早发现质量变化，并在反馈趋势开始恶化时设置告警。","sourceFormat":"markdown"},"note:sha256:d0c7be39e615fbf036fc83312b293a8a70452e37f8215c5f400457f875b8db4c":{"html":"\u003cp\u003e在这次实验中，一次 Jev 判断的成本是 $0.00035。除了成本低之外，Jev 还表现出高 accuracy 和低 variance，这意味着 judge 结果可靠、信号密度高。在这个价格下，如果 judge 质量足够好，开发者就可以针对多个聚焦标准评测每一次 Agent 运行，衡量每一次 Agent 变更，并在置信度重要时重复判断。\u003c/p\u003e\n\u003cp\u003e这一点之所以重要，是因为打造高质量 Agent 需要大量测试和监控。评测 Agent 越频繁，进入开发循环的有效反馈也越多。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在这次实验中，一次 Jev 判断的成本是 $0.00035。除了成本低之外，Jev 还表现出高 accuracy 和低 variance，这意味着 judge 结果可靠、信号密度高。在这个价格下，如果 judge 质量足够好，开发者就可以针对多个聚焦标准评测每一次 Agent 运行，衡量每一次 Agent 变更，并在置信度重要时重复判断。\n\n这一点之所以重要，是因为打造高质量 Agent 需要大量测试和监控。评测 Agent 越频繁，进入开发循环的有效反馈也越多。","sourceFormat":"markdown"},"note:sha256:d29bcade87e93fdbbc7143db8ca426a97106388c69e76ff476e1f94e96668512":{"html":"\u003cp\u003e今天的 Agent 评测通常要么基于代码，要么采用 LLM-as-a-judge；两种方式都各有收益、限制和权衡。\u003c/p\u003e\n","kind":"html","rawMarkdown":"今天的 Agent 评测通常要么基于代码，要么采用 LLM-as-a-judge；两种方式都各有收益、限制和权衡。","sourceFormat":"markdown"},"note:sha256:dbfb5a75638b7031bddfbab9ccf5aa8548dffbc4a6ee3ae08ff2c9a32462aa71":{"html":"\u003cp\u003e以人工评审者的标签作为本次比较的 oracle，我们计算了二元 pass/fail 判断的 accuracy。\u003c/p\u003e\n\u003cp\u003e对于二元 \u003cem\u003edoes_pass\u003c/em\u003e 分数，Jev 在全部 500 次重复判断中都与 oracle 一致。Terra 的一致率为 99.8%，Luna 为 96.4%，Claude 为 80.0%。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnbwEHa4AAF45A?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"以人工评审者的标签作为本次比较的 oracle，我们计算了二元 pass/fail 判断的 accuracy。\n\n对于二元 *does_pass* 分数，Jev 在全部 500 次重复判断中都与 oracle 一致。Terra 的一致率为 99.8%，Luna 为 96.4%，Claude 为 80.0%。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnbwEHa4AAF45A?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:e65c79b2d1b828607c3b7000c2fd5e770b22a020c0dda9f4a9fdccbe5ba852bf":{"html":"\u003cp\u003e于是出现了 \u003ca href=\"https://docs.langchain.com/langsmith/llm-as-judge\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLLM-as-a-judge\u003c/a\u003e：使用 LLM 对 Agent trace 的非结构化输入进行推理并打分。LLM judge 可以把问题、trace 和证据作为非结构化输入，再通过 prompt 判断回答是否满足用户请求。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HSnaJR7bsAEPn58?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e但任何 Agent 工程师都会承认，LLM judge 并不是完美方案。它本质上是非确定性系统，很难成为可信测试体系的稳固基础；同时，相比传统的基于代码评测，它通常也更慢、更昂贵。\u003c/p\u003e\n","kind":"html","rawMarkdown":"于是出现了 [LLM-as-a-judge](https://docs.langchain.com/langsmith/llm-as-judge)：使用 LLM 对 Agent trace 的非结构化输入进行推理并打分。LLM judge 可以把问题、trace 和证据作为非结构化输入，再通过 prompt 判断回答是否满足用户请求。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HSnaJR7bsAEPn58?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n但任何 Agent 工程师都会承认，LLM judge 并不是完美方案。它本质上是非确定性系统，很难成为可信测试体系的稳固基础；同时，相比传统的基于代码评测，它通常也更慢、更昂贵。","sourceFormat":"markdown"}},"sourceRevision":"sha256:5d6bdd584681d58263d06989be5d9aba034d4c9a6b71513b5c3577352c85a3e9"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=e}}function i(e,t){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${e}": ${t}`)}function r(e){const t=String(e||"").normalize("NFC").trim().replace(/\\/g,"/");t||i(t,"empty"),t.includes("\0")&&i(t,"nul_byte"),t.startsWith("/")&&i(t,"absolute"),/^[A-Za-z]:/.test(t)&&i(t,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*:/.test(t)&&i(t,"url_scheme"),t.endsWith("/")&&i(t,"directory");const n=t.split("/");return n.some(e=>!e||"."===e||".."===e)&&i(t,"unsafe_segment"),n.join("/")}function a(e){if(null===e||"string"==typeof e||"boolean"==typeof e)return JSON.stringify(e);if("number"==typeof e){if(!Number.isFinite(e))throw new n("unsupported_json_value","Canonical JSON does not allow non-finite num
