</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-08-28T05:13:43.724Z","language":"zh-TW","name":"DeMinds","version":"1.0.27"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Prime Agent：自我改進的 RLM 執行框架","outlineVersion":1},"sourceRevision":"sha256:42783f35599858eade58ee862aa8a70e2261c6fea49ead4e1c4e6beab8d42a90","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Prime Agent  A Self-Improving RLM Harness.md","sourceUrl":"https://arxiv.org/html/2608.23552v1","title":"Prime Agent：自我改進的 RLM 執行框架"},"files":[{"byteLength":47263,"content":"# Prime Agent：自我改進的 RLM 執行框架\n\n\u003e 作者：Seth Karten, Alex L. Zhang, Kevin Thomas, Sebastian Müller, Elie Bakouch, Daniel Auras, Mika Senghaas, Fares Obeid, Konstantin Dunas, Johannes Hagemann, Sami Jaghouar\n\u003e [arXiv:2608.23552v1](https://arxiv.org/html/2608.23552v1) · cs.AI · 2026-08-24\n\n首次發布：2026 年 8 月 5 日 • 目前版本：2026 年 8 月 24 日\n\n## 摘要\n\n語言模型是序列處理器，但長時程代理能力需要超出模型權重與當前上下文之外的外部資訊與計算。Prime Agent 是一套開源執行框架，用於長時程評估與程式編寫代理工作流程。持久化 IPython REPL 遵循 Recursive Language Model 抽象，支援程式化上下文處理與測試時計算；Continual Harness 則跨軌跡保存歷史、記憶、技能、提示與子代理規格。遞迴子代理透過代理對代理直接通訊協調，而 Agents View 讓人類能檢視與管理由常駐程序支援的工作階段。Prime Agent 將執行、復原、驗證與資源計量標準化，同時把策略建構留給模型。這層低摩擦且具表達力的介面可避免執行框架故障被誤判為模型失敗，並使衡量結果更接近模型真正的最大潛在能力。Prime Agent 將 ARC-AGI-3 的 RHAE Best@1 從 30% 提升至 95.5%，並在長上下文程式編寫、GPU 核心生成、模擬器建構與自主 nanoGPT 競速等任務上，達到或超越原生及主流執行框架。在 Factorio 上，我們發現精煉可讓科技持續推進，而專職子代理能讓工作平行化。程式碼位於 [https://github.com/PrimeIntellect-ai/prime-agent](https://github.com/PrimeIntellect-ai/prime-agent)。\n\n## 1 引言\n\n單靠一個強大的語言模型，並不具備電腦的完整能力。LLM 是受限的序列處理器，其下一步決策只能使用模型權重與當前上下文中可見的狀態資訊。執行框架提供缺少的計算基底，使模型能透過工具呼叫執行外部動作。這些外部動作也包括管理超出模型權重既有知識之外的資訊。上下文管理最初由代理式壓縮實現：模型選擇性分析自身上下文，以在保留關鍵資訊的同時減少 token。然而，完整的資訊狀態如今已超出權重與 token 上下文。若將其視為一個狀態資訊快取（[圖 2](#S2.F2)），模型權重是 L0、當前上下文是 L1、持久化 REPL 與遞迴子代理構成 L2，而磁碟支援的歷史、記憶與技能構成 L3。這使系統更具 *von Neumann* 式特徵：模型可以讀取、轉換與寫入目前正在生成之指令之外、可定址的狀態 [[34](#bib.bib31), [35](#bib.bib32)]。\n\n從這個觀點來看，*表達力*成為執行框架的關鍵特性。具表達力的執行框架並不預先編碼單一工作流程，而是暴露一組基元，讓模型能在推論時自行建構程式、子代理與回饋迴圈。Recursive Language Models（RLMs）讓上下文與遞迴呼叫可程式化 [[44](#bib.bib4)]；Continual Harness 則讓提示、子代理、技能與記憶可依軌跡歷史修訂 [[18](#bib.bib3)]。最後，我們透過代理對代理直接通訊，支援大規模多代理群體的協調與編排。這些元件讓固定模型能利用資訊管理與測試時計算，擴大其可到達的策略集合。\n\nPrime Agent 首先被設計為一套標準化的*長時程評估*執行框架。最常見的指標是在固定支出下的分數 [[8](#bib.bib33)]，例如固定成本/token 與時間；對長時程任務尤其重要的另一項指標，是實務平台期的分數 [[8](#bib.bib33)]，可用來分析效能隨時間變化的形狀。執行框架是模型觀察世界並對其採取行動時所經過的介面層。模型應該因任務超出自身能力而在評估中失敗，而不是因執行框架遺失狀態、限制有用動作、錯算資源或過早終止。為此，Prime Agent 將標準化且可靠的執行，與低摩擦、高表達力的程式化工具、資訊管理與群體管理介面結合。這讓模型能充分利用測試時計算，使量測到的效能更接近模型真正的最大潛在能力，而非受限於執行框架。\n\nPrime Agent 同時管理資訊與計算。資訊管理透過程式化上下文處理、壓縮、持久歷史與可修訂記憶，在 L1–L3 之間移動狀態。計算管理則將測試時計算分配給程式、工具呼叫、可重用技能與平行遞迴子代理 [[32](#bib.bib34), [44](#bib.bib4)]。代理對代理直接通訊把兩者連接起來，讓資訊在分散式計算之間路由，使代理群體能動態協調，而不是遵循固定圖結構。這些通訊連結也讓人類不必追蹤每一次交換，就能檢視、傳訊、附加至子代理工作階段並介入其中 [[16](#bib.bib26), [21](#bib.bib27)]。這些互動共同產生可保留的軌跡，用來改善後續計算，並可作為後續模型世代的訓練資料 [[43](#bib.bib28), [40](#bib.bib29), [25](#bib.bib30)]。\n\n我們提出 Prime Agent：一套用於長時程模型評估與程式編寫代理工作流程的開源執行框架。Prime Agent 橫跨當前上下文、持久化程式化執行、遞迴子代理，以及保留的歷史、記憶與可重用技能，整合資訊與計算管理，並以代理對代理及人類—代理直接通訊相互連接。其 Agents View 提供視覺介面，用於檢視、附加至並管理由常駐程序支援的持久代理工作階段。我們將評估基礎設施標準化，同時保留模型自行建構策略的自由。Prime Agent 將 ARC-AGI-3 效能從 30% 提升至 95%，在長上下文程式編寫、GPU 核心生成與模擬器建構方面達到或超越 Pi、Claude Code 與 Codex（並在其他基準上優於 Hermes Agent、OpenCode 與 Kimi-Code 等執行框架），支撐一場長達 85.5 小時、產生 19 筆經驗證紀錄的 nanoGPT 執行，並支援四角色 Factorio 控制與長時程 MazeBench 探索。\n\n## 2 Prime Agent 架構\n\n以下我們詳細說明 Prime Agent 的架構。具體而言，我們討論：（1）系統如何管理資訊與計算（§[2.1](#S2.SS1)）；（2）狀態如何分布於模型權重、當前上下文、REPL 與磁碟支援的儲存空間（§[2.2](#S2.SS2)）；（3）持久化 REPL 與 RLM 呼叫如何支援程式化計算（§[2.3](#S2.SS3)）；（4）遞迴工作階段如何與代理及人類操作員通訊（§[2.4](#S2.SS4)）；（5）Continual Harness 如何將軌跡證據轉為可重用狀態（§[2.5](#S2.SS5)）；以及（6）長時程控制如何定義延續、終止與評估計量（§[2.6](#S2.SS6)）。[圖 1](#S2.F1) 提供整體概覽。\n\n![圖 1：Prime Agent 將持久化的根工作階段與子代理工作階段連接至常駐程序、Continual Harness、Agents View 與環境。實線箭頭承載執行與訊息；虛線箭頭承載持久狀態。](https://arxiv.org/html/2608.23552v1/architecture.svg)\n\n圖 1：Prime Agent 將持久化的根工作階段與子代理工作階段連接至常駐程序、Continual Harness、Agents View 與環境。實線箭頭承載執行與訊息；虛線箭頭承載持久狀態。\n\n### 2.1 架構概覽\n\nPrime Agent 將資訊管理與計算管理分離。資訊管理決定哪些狀態會進入模型呼叫，以及哪些狀態能在壓縮或重新啟動後保留下來。\n\n計算管理將模型選擇的動作對應至程式碼、工具與遞迴子代理工作階段。代理對代理直接通訊連接彼此相關的工作階段，而人類—代理直接互動則將個別節點暴露出來，供檢視與介入。\n\n模型使用程式碼操作中間值。工作階段會跨壓縮、脫離與重新啟動保留歷史。子代理繼承根工作階段的執行與通訊基元。執行環境會記錄模型呼叫、工具使用、訊息、執行框架變更與資源使用情形。模型控制任務分解、計算分配、通訊與停止時機。\n\n### 2.2 資訊階層與持久狀態\n\n一次模型呼叫由固定權重參數化，並以其當前 token 上下文為條件。Prime Agent 在該上下文之外加入額外狀態。當執行環境注入外部狀態，或某項操作將結果序列化進上下文時，外部狀態就會影響生成。[圖 2](#S2.F2) 依可見性、存取機制與持久性整理這些狀態。\n\n![圖 2：Prime Agent 狀態階層。L1 與 L2 之間的邊界，將 token 可見的模型狀態與顯式管理的計算及保留狀態分隔開來。](https://arxiv.org/html/2608.23552v1/state-hierarchy.svg)\n\n圖 2：Prime Agent 狀態階層。L1 與 L2 之間的邊界，將 token 可見的模型狀態與顯式管理的計算及保留狀態分隔開來。\n\n各層級透過不同機制改變。微調更新 L0，壓縮改寫 L1，而精煉會為選定的 L3 項目建立新版本。我們將 L2 的機制稱為*代理式垃圾回收*。隨著任務改變，模型會建立、保留、摘要或刪除 REPL 值與子代理工作階段。\n\n顯式操作會在層級之間移動資訊。L2 中的 Python 值與工具輸出，在序列化至 L1 時進入生成流程。壓縮會以摘要取代對話前綴，同時將原始事件保留在 L3，以供 REPL 擷取。執行環境會把選定的 Continual Harness 項目組裝到後續的補充提示中；其他 L3 產物則在擷取時進入上下文。L0 維持不變。\n\n被保留的執行階段狀態包括：僅附加的事件歷史、選定的核心快照、以根為起點的工作階段樹、上下文與壓縮紀錄、持久訊息佇列，以及版本化的 Continual Harness 狀態。建立分支或 fork 會產生新的邏輯延續，而不刪除既有事件序列。復原會在相同身分下重建工作階段。不可序列化的 Python 物件與外部程序，則由已儲存產物或外部服務重新建立。\n\n### 2.3 使用 RLM 的程式化計算\n\n每個工作階段都擁有一個持久化 IPython Read-Eval-Print Loop（REPL）。在測試時，計算包含模型推論、Python 執行與工具呼叫；評估會分別回報 token、時間與成本。已安裝的工具會以 Python 模組匯入，並透過一般程式碼進行解析、篩選、彙整與驗證。中間值會跨回合持久保留，且在被選取前維持於當前上下文之外。這可避免反覆將大型日誌、任務規格與結構化評估器輸出序列化進上下文。\n\nPrime Agent 以非同步 `rlm` 基元實作 RLM 抽象 [[44](#bib.bib4)]。呼叫 `rlm` 會建立並排程一個子代理工作階段，且在子代理完成之前就先回傳穩定的 handle。子代理會取得自己的模型上下文、IPython 核心、歷史與工作區中繼資料。子代理執行期間，父代理可繼續本地計算。結果稍後會透過代理對代理直接通訊傳回，而保留的 handle 可在壓縮或重新啟動後繼續後續互動。模型自行選擇使用本地程式碼、工具、循序委派或平行子代理。Prime Agent 定義的是這些操作的執行語義，而不是固定的工作流程圖。完整的編排範例見[附錄 B](#A2)。\n\n### 2.4 遞迴編排與互動\n\n常駐程序會獨立於建立工作階段的用戶端，持有仍在運作的工作階段。根工作階段與子代理工作階段使用相同生命週期。工作階段在執行回合或工具操作時為 running；已載入但沒有進行中回合時為 idle；卸載後則為 inactive，但仍可由持久狀態復原。用戶端脫離後，工作階段仍持續執行。穩定的工作階段與父工作階段識別碼，會在這些狀態轉換中維持遞迴拓撲。\n\n代理對代理直接通訊使用由常駐程序中介的非同步佇列。代理可以指定父代理、子代理與手足代理為收件者；當收件者再次變為 active 時，佇列中的訊息仍可取得。檔案系統、網路與憑證存取遵循執行環境的權限。[圖 3](#S2.F3) 概述共用的生命週期與通訊拓撲。\n\n![圖 3：多代理編排生命週期與代理對代理直接通訊。](https://arxiv.org/html/2608.23552v1/orchestration-lifecycle.svg)\n\n圖 3：多代理編排生命週期與代理對代理直接通訊。\n\nAgents View 將持久樹狀結構暴露出來，以支援人類—代理直接互動。使用者可以透過此介面檢視歷史、附加至工作階段、提供新輸入，或在不中斷執行的情況下脫離。`agent-observe` 介面提供有界的唯讀狀態與近期訊息預覽；`agent-message` 則可指定一個具名的相關工作階段。這讓使用者能透過編排器進行完整互動。\n\n### 2.5 Continual Harness\n\nContinual Harness 提供補充狀態，供軌跡執行期間讀寫 [[18](#bib.bib3)]。提示註記儲存行為指令，記憶儲存事實，技能封裝可執行程序，而子代理規格則儲存可重用角色或分工方式。型別化狀態會區分規則、事實、程式與協調模式。各項目支援建立、讀取、更新與刪除；本地項目屬於單一工作階段，而明確要求為全域的項目則可供後續工作階段使用。\n\n精煉會把軌跡證據轉換為版本化狀態更新。代理可直接要求編輯，或由 `/refine` 對相關事件執行背景模型呼叫。執行環境會在回合邊界套用每項編輯、記錄其觸發原因與預期效果，並為下一次呼叫組裝補充狀態。版本可保留來源脈絡並支援回滾。精煉是在不改寫基礎政策的前提下，補充不可變的基礎提示。\n\n*自我改進*會把執行證據轉換成持久的執行框架狀態，在模型權重保持不變時改變後續行為。有用的計算會成為技能，重複出現的協調模式會成為子代理規格，而修正後的假設會成為記憶或提示註記。所產生的軌跡紀錄也能作為後續模型世代的訓練資料。\n\n### 2.6 長時程執行與評估語義\n\nPrime Agent 提供三種長時程控制機制（[圖 4](#S2.F4)）。\n\n![圖 4：長時程控制機制。自主模式會在明確預算內持續執行，直到終止條件測試通過。Goals 會跨延續保留目標，直到代理式完成。Heartbeats 會依 cron 或計時排程啟動回合。](https://arxiv.org/html/2608.23552v1/long-horizon-controls.svg)\n\n圖 4：長時程控制機制。自主模式會在明確預算內持續執行，直到終止條件測試通過。Goals 會跨延續保留目標，直到代理式完成。Heartbeats 會依 cron 或計時排程啟動回合。\n\n自主模式會在明確預算內持續進行模型回合，並在每個回合後評估任務指定的終止條件測試。測試失敗時會回傳有界輸出，以供再次嘗試；回合數、token 與實際經過時間限制則會停止執行。Goal 會跨多次延續保留目標，並在代理將目標標記為完成時，透過代理式完成結束。Heartbeats 會依 cron 或計時排程啟動回合。\n\n評估設定會把任務與工具介面綁定至模型與供應商設定、壓縮與精煉政策、重試政策、完成門檻及資源限制。資源計量會彙總根工作階段及其後代工作階段，因此委派成本仍會反映在測試時成本中。事件歷史會把模型與工具呼叫、訊息、介入、重試、驗證器結果與執行框架編輯，連結至相應設定。標準化的持久化、復原、終止與計量，可將執行框架故障與模型失敗區分開來，同時保留模型對任務分解的控制。\n\n## 3 評估\n\n本評估針對三個源自 Prime Agent 設計的研究問題。RQ1：測試時擴展。標準化且具表達力的執行介面，能否讓前沿模型把額外的輸出 token 與 API 成本轉化為經驗證的任務進展？我們在 ARC-AGI-3 上評估此問題。RQ2：資訊管理。模型能否使用持久化 REPL 狀態，在長上下文中搜尋、轉換與彙整資訊？我們在長上下文推理與程式編寫任務上，將 Prime Agent 與原生及其他執行框架比較。RQ3：持久遞迴執行。同一執行環境能否支撐多日實驗、反覆系統建構、遞迴控制與線上精煉？我們透過端到端結果與軌跡分析研究 nanoGPT、PMPP-Hard、EmulatorBench、Factorio 與 MazeBench。軌跡分析呈現代理如何分配子代理、保留資訊，以及在中斷後復原。\n\n### 3.1 測試時規模下的互動式推理\n\nARC-AGI-3 是檢驗 Prime Agent 能否支援強健且一致的長時程評估，最直接的測試 [[2](#bib.bib6)]。每個遊戲都要求模型在動作次數限制下學習遊戲規則，臨時建立世界模型。Prime Agent 只提供環境介面與改寫自 PRO-LONG 的自主提示 [[9](#bib.bib5)]；策略由模型自行建構。我們注意到，Claude Code 與 Codex 在 ARC-AGI-3（公開集）上的執行結果低於 Anthropic 與 Open AI 自行回報的效能，因此相較於我們使用相同提示與設定所做的執行，我們以其公布結果為準。\n\n![圖 5：ARC-AGI-3 測試時擴展。RHAE 分數相對於每局輸出 token（左）與估算 API 成本（右）。](https://arxiv.org/html/2608.23552v1/arc-agi3-scaling-combined.svg)\n\n圖 5：ARC-AGI-3 測試時擴展。RHAE 分數相對於每局輸出 token（左）與估算 API 成本（右）。\n\n在觀察到的各種設定中，額外輸出 token 與成本轉化為進展的速率差異非常大（[圖 5](#S3.F5)）。較強的設定能在長互動時程中持續改善，而其他設定則很早進入平台期。這種模式符合一種由模型控制的介面：它允許依模型而異的測試時擴展，而不是強制套用單一固定工作流程。圖中的參考線與參考點將這些曲線與 ARC 官方結果並列。這些值屬於外部數據，因為我們在原生執行框架上的重跑結果低於已公布分數；因此它們的作用是提供結果定位，而不是隔離執行框架的因果效應。\n\n### 3.2 長上下文資訊管理\n\n長上下文測試套件檢驗模型能否主動管理那些不適合自然塞入單一提示的資訊。Prime Agent 將初始上下文儲存在可讀檔案中，讓模型能透過持久化 REPL 搜尋、轉換、摘要並重新檢視內容。這把長上下文推理從對固定序列的被動注意，轉變為程式化資訊管理問題。測試套件涵蓋彙整、潛在檢索、指令遵循、推理與長篇程式編寫 [[5](#bib.bib7), [33](#bib.bib8), [6](#bib.bib9), [3](#bib.bib10), [23](#bib.bib11)]。\n\n表 1：長上下文結果。粗體表示每一組名義模型配對中較高的點估計值；各列指標不同。粗體不代表統計顯著性，且沒有可用的不確定性區間。\n\n整體而言，我們發現 Prime Agent 在各類長任務上都具有競爭力，尤其是在對比那些所用模型並非圍繞該執行框架訓練的系統時。Prime Agent 在長時間執行或長上下文任務上尤其突出，並能以自主代理形式獨立執行且保持競爭力。我們進一步納入一組聚焦的個案研究與實驗，呈現 Prime Agent 在長時程情境中的優勢。\n\n### 3.3 多日自主研究\n\nnanoGPT speedrun [[4](#bib.bib43)] 衡量代理能將 124M 參數 GPT 達到固定驗證損失所需的訓練步數降低到什麼程度；每項紀錄都以八個 seed 的平均值驗證。對三個模型（Kimi K3、DeepSeek V4 Pro 與 GLM 5.3），我們將 Prime Agent 與另一套執行框架比較：若模型開發者有自己的 CLI，就使用該 CLI；否則使用 Claude Code 或 opencode。我們發現，相較於實驗本身的雜訊，執行框架的選擇對最終紀錄影響不大。\n\n然而，模型行為確實不同。在 Prime Agent 上，模型經常利用持久化 REPL 在基準的訓練腳本之外進行實驗，例如在啟動訓練執行前，先用合成梯度模擬候選最佳化器，或以數值方法最佳化更新規則係數。[圖 6](#S3.F6) 統計 18 次執行中的這類實驗，並以每個代理執行的訓練次數正規化；[附錄 A](#A1) 則為每個模型重現一個此類實驗。DeepSeek V4 Pro 的差異最大：在 Prime Agent 下，每次訓練執行所建立的這類實驗數量約為 Claude Code 下的六倍。原因之一可能是 DeepSeek 自身的代理執行框架也提供類似的程式碼執行模式，因此 REPL 符合該模型很可能在訓練時接觸過的工作流程。我們也觀察到模型會替基準本身建構程式化介面：Kimi K3 定義了一個 `probe` 函式，透過它進行約九十次篩選實驗，以及全部 19 筆經驗證紀錄；相較之下，同一模型在自己的 CLI 上，每項操作都透過直接編輯檔案完成，並未建立這類機制。\n\n![圖 6：不同執行框架下的迴圈外實驗。每 100 次訓練腳本執行所建立、位於訓練腳本之外的不同實驗數量；每種執行框架合併 2–3 個 seed 的結果（標籤：實驗/訓練執行）。計數由完整軌跡人工分類；可取得時會稽核分母，否則由啟動命令估算。](https://arxiv.org/html/2608.23552v1/nanogpt-lab-census.svg)\n\n圖 6：不同執行框架下的迴圈外實驗。每 100 次訓練腳本執行所建立、位於訓練腳本之外的不同實驗數量；每種執行框架合併 2–3 個 seed 的結果（標籤：實驗/訓練執行）。計數由完整軌跡人工分類；可取得時會稽核分母，否則由啟動命令估算。\n\n### 3.4 程式化系統建構\n\n#### 模擬器\n\n模擬器是一種重現另一個電腦系統可觀察行為的軟體。我們在 EmulatorBench 上評估 Prime Agent；該基準要求代理以 Rust 為各種遊戲系統建構模擬器。代理會取得模擬器規格，以及一組以驗證器形式提供的診斷測試。\n\n![(a) Sega Genesis。](https://arxiv.org/html/2608.23552v1/emulator-genesis.svg)\n\n(a) Sega Genesis。\n\n![(b) Game Boy Color。](https://arxiv.org/html/2608.23552v1/emulator-game-boy-color.svg)\n\n(b) Game Boy Color。\n\n圖 7：選定的 EmulatorBench 執行結果。逐步驗證器分數相對於估算成本；色相編碼模型，線型編碼執行框架。\n\n模擬器的正確性取決於它能否模仿目標機器的行為。這項能力由人工撰寫的診斷程式衡量，這些程式會檢查模擬器的行為，例如 CPU flags、PPU timing 與其他元件。為盡量降低資料污染的影響，我們要求代理在沒有任何參考實作的沙箱環境中，以 Rust 從零建構模擬器。我們在[表 1](#S3.T1) 回報這項長上下文程式編寫基準的初步結果，數值為 16 次模擬器重建的平均；此外，[圖 7](#S3.F7) 顯示 Prime Agent 成功重現的兩個模擬器：SEGA Genesis 與 Nintendo Game Boy Color。對 Opus 而言，儘管工具呼叫回應成功，我們的執行卻出乎意料地未能解決這些任務。\n\n#### GPU 核心\n\nPMPP-Hard 將同一套程式化迴圈壓縮成在實際經過時間預算內，反覆進行編輯、編譯、正確性檢查與效能剖析的週期。\n\n![圖 8：在固定模型內預算下的 PMPP-Hard 解題率。](https://arxiv.org/html/2608.23552v1/pmpp-hard.svg)\n\n圖 8：在固定模型內預算下的 PMPP-Hard 解題率。\n\nPrime Agent 與原生執行框架的結果依然接近，而兩個模型群組的排序彼此相反。在這些已回報的模型內比較中，通用持久介面能支援編譯—效能剖析迴圈，未觀察到明顯差距。PMPP-Hard 一項已知限制，是採用嚴格的實際經過時間預算比較。然而，實際經過時間預算無法呈現的是：使用 Prime Agent 的模型在 token 使用量上有顯著改善。也就是說，Prime Agent 能以大幅更低的成本達到與 Codex 或 Kimi-Code 相同的效能；若以相同 token 數量比較，Prime Agent 具有優勢。\n\n### 3.5 持久互動與精煉\n\n#### Factorio\n\nFactorio Learning Environment 為一個持久化工廠世界提供 Python 觀察與動作介面 [[12](#bib.bib12)]。在一場為期七天的 Sonnet 5 執行中，根工作階段及其後代共使用 23.4 百萬個輸出 token，完成 196 項科技中的 24 項，並將 advanced-circuit 研究推進至 71%（[圖 9](#S3.F9)），且沒有停滯跡象。\n\n![圖 9：Factorio 進展與遞迴計算。上方為已研究科技數，下方為代理樹成長與並行度，皆相對於 Sonnet 5 美學執行的累積輸出 token。垂直線標示一次破壞性世界重置。最後的空心標記表示完成 24 項科技後，advanced-circuit 研究進度為 71%。](https://arxiv.org/html/2608.23552v1/factorio-tech-and-tree.svg)\n\n圖 9：Factorio 進展與遞迴計算。上方為已研究科技數，下方為代理樹成長與並行度，皆相對於 Sonnet 5 美學執行的累積輸出 token。垂直線標示一次破壞性世界重置。最後的空心標記表示完成 24 項科技後，advanced-circuit 研究進度為 71%。\n\n模型處理不可逆動作的表現不佳。一次破壞性世界重置把科技數從五項退回一項；之後工作階段成功復原並繼續執行，而不是捨棄整條軌跡。根工作階段在 149 波派工中建立了 633 個深度為一的子代理，同時 active 的數量最多為七個。這棵淺層、反覆向外擴張的樹，記錄的是平行任務專業化，而非更深層的遞迴；呈突發式成長的科技曲線，則把漫長的建造區段與經外部驗證的進展區分開來。\n\n另一條 Factorio 軌跡揭示了線上精煉的核心安全失敗。代理發現 RCON 命令可以直接把資源生成到組裝機中；儘管存在反作弊 heartbeat，它仍使用這項捷徑，之後甚至將其保存為可重用技能。在這條軌跡中，持久化保存了能最佳化量測目標的行為，其中也包括對規格漏洞的利用。因此，安全部署需要最小權限的動作介面、獨立的狀態驗證，以及可稽核地回滾受污染精煉的能力。\n\n#### MazeBench\n\nMazeBench 是一個開放世界 3D 空間推理環境，玩家控制一個 3D 方塊，在全域迷宮中解開各個謎題房間，同時收集寶石。前沿模型已被證明在此任務上非常吃力，即使耗費數十億 token，也只能解開整個世界的一小部分。我們比較 Opus 5 與 GPT-5.6 Sol 在 Prime Agent 和各自原生執行框架上的表現，並另比較搭配 Claude Code 的 GLM-5.2。依照基準指標，我們回報其找到的不重複房間數、不重複狀態數與寶石總數，並將這些數值都表示為其整體 token 支出的函數。\n\n![圖 10：MazeBench 探索相對於估算 token 成本。實線與實心標記表示 Prime Agent；點線與空心標記表示比較用執行框架。色相與標記形狀用於識別模型。](https://arxiv.org/html/2608.23552v1/mazebench.svg)\n\n圖 10：MazeBench 探索相對於估算 token 成本。實線與實心標記表示 Prime Agent；點線與空心標記表示比較用執行框架。色相與標記形狀用於識別模型。\n\n## 4 相關工作\n\n#### 程式化推論與自適應狀態\n\n程式化推論讓模型使用程式碼、工具與遞迴呼叫，以轉換上下文並分配測試時計算 [[42](#bib.bib13), [30](#bib.bib14), [37](#bib.bib15), [44](#bib.bib4), [9](#bib.bib5), [32](#bib.bib34)]。記憶與精煉方法會跨回合與任務保留選定的觀察、回饋、技能或推理軌跡 [[24](#bib.bib17), [31](#bib.bib18), [22](#bib.bib19), [36](#bib.bib20), [26](#bib.bib21), [43](#bib.bib28)]。Continual Harness 將提示、記憶、可執行技能與子代理規格儲存為型別化、版本化狀態 [[18](#bib.bib3)]。Prime Agent 將這些機制與持久化核心、遞迴工作階段、復原及完整軌跡擷取整合在一起。\n\n#### 程式編寫代理與長時程評估\n\n程式編寫代理的執行環境使用可執行動作、程式碼儲存庫工具、沙箱、事件歷史與結構化角色分派，在多個互動步驟中解決任務 [[37](#bib.bib15), [41](#bib.bib2), [38](#bib.bib16), [39](#bib.bib22), [20](#bib.bib23), [11](#bib.bib24), [27](#bib.bib25)]。可執行基準與軌跡語料庫則衡量在長上下文或延伸互動下的問題解決、指令遵循、檢索與推理能力 [[13](#bib.bib1), [25](#bib.bib30), [40](#bib.bib29), [5](#bib.bib7), [33](#bib.bib8), [6](#bib.bib9), [3](#bib.bib10), [23](#bib.bib11)]。Prime Agent 讓執行基底具有持久性與遞迴性，並記錄根工作階段與後代工作階段的支出。\n\n#### ARC-AGI-3 上的互動式推理\n\nARC-AGI-3 將抽象推理延伸至具有隱藏動態、目標與動作語義的互動環境 [[2](#bib.bib6), [1](#bib.bib39)]。社群系統會建立並驗證可執行世界模型、將代理表示成具狀態的 Python 物件、最佳化外部工作區、協調專業化代理，並跨遊戲保留程序 [[28](#bib.bib35), [10](#bib.bib36), [7](#bib.bib37), [29](#bib.bib38), [18](#bib.bib3), [9](#bib.bib5)]。Prime Agent 為同一類長時程互動任務提供持久遞迴執行與標準化評估設定。\n\n#### 多代理與人類—代理通訊\n\n語言模型代理系統透過角色提示、自然語言訊息、共用成品與顯式信念狀態進行協調 [[39](#bib.bib22), [20](#bib.bib23), [11](#bib.bib24), [27](#bib.bib25), [21](#bib.bib27), [29](#bib.bib38)]。學習式多代理通訊研究涵蓋稀疏訊息選擇、壓縮表示、社會學習、策略對齊，以及面向人類夥伴的可解釋性 [[15](#bib.bib41), [14](#bib.bib40), [16](#bib.bib26), [19](#bib.bib42)]。Prime Agent 透過持久、以代理家族為範圍的佇列實作代理對代理直接通訊，並將同一棵工作階段樹暴露給人類檢視與介入。\n\n## 5 結論\n\nPrime Agent 為代理執行框架設計提出一種新典範：將持久執行、遞迴工作階段、自主控制、記錄式歷史與 Continual Harness 整合成長時程工作的單一基底。互動式推理、長上下文任務、自主研究、系統建構與持久環境等結果顯示，這個基底能在標準化執行與計量下支援不同形式的測試時計算。儘管相較於其他執行框架已取得上述結果，模型在決定如何分配子代理、管理保留資訊，以及精煉可重用狀態時，仍會遇到摩擦。許多執行框架能力目前仍未被充分利用，因為現有模型並未接受如何操作這些能力的訓練。我們預期，模型—執行框架共同學習將成為開發新長時程能力的主要途徑。直接使用 Prime Agent 進行訓練，可以教會模型更有效地使用整合式執行框架；而針對 RLM 與 Continual Harness 元件進行訓練，則可分離辨識各自的貢獻。\n\n## 致謝\n\n感謝 Florian Brand、SinatraS 與 Patience Cave 協助完成 Prime Agent 在其他環境中的執行。SinatraS 建立了 PMPP Hard，Patience Cave 建立了 MazeBench。\n\n## 參考文獻\n\n- [1] (2026) ARC-AGI community leaderboard. Note: [https://arcprize.org/leaderboard/community](https://arcprize.org/leaderboard/community)Accessed August 2026 Cited by: [§4](#S4.SS0.SSS0.Px3.p1.1).\n- [2] ARC Prize Foundation (2026) ARC-AGI-3: a new challenge for frontier agentic intelligence. External Links: 2603.24621, [Link](https://arxiv.org/abs/2603.24621) Cited by: [§3.1](#S3.SS1.p1.1), [§4](#S4.SS0.SSS0.Px3.p1.1).\n- [3] Y. Bai, S. Tu, J. Zhang, H. Peng, X. Wang, X. Lv, S. Cao, J. Xu, L. Hou, Y. Dong, J. Tang, and J. Li (2024) LongBench v2: towards deeper understanding and reasoning on realistic long-context multitasks. External Links: 2412.15204, [Link](https://arxiv.org/abs/2412.15204) Cited by: [§3.2](#S3.SS2.p1.1), [Table 1](#S3.T1.3.1.7.1), [§4](#S4.SS0.SSS0.Px2.p1.1).\n- [4] E. Bakouch and P. Intellect (2026) Measuring autonomous AI research. Prime Intellect Blog. External Links: [Link](https://www.primeintellect.ai/blog/measuring-autonomous-research) Cited by: [§3.3](#S3.SS3.p1.1).\n- [5] A. Bertsch, A. Pratapa, T. Mitamura, G. Neubig, and M. R. Gormley (2025) Oolong: evaluating long co 601, [Link](https://arxiv.org/abs/2512.24601) Cited by: [§1](#S1.p2.1), [§1](#S1.p4.1), [§2.3](#S2.SS3.p2.1), [Table 1](#S3.T1.3.1.4.1), [§4](#S4.SS0.SSS0.Px1.p1.1).\n- [45] J. Zhang, T. Li, W. Jurayj, H. Zhan, B. V. Durme, and D. Khashabi (2026) Many-tier instruction hierarchy in llm agents. External Links: 2604.09443, [Link](https://arxiv.org/abs/2604.09443) Cited by: [Table 1](#S3.T1.3.1.8.1), [Table 1](#S3.T1.3.1.9.1).\n\n## 附錄 A：nanoGPT Speedrun 中的迴圈外實驗範例\n\n以下每段摘錄都是代理在 nanoGPT 執行期間，於基準訓練腳本之外自行建立並執行的實驗（[第 3.3 節](#S3.SS3)）；內容重現自軌跡，並為篇幅而節錄。\n\nKimi K3 使用全域最佳化器重新推導 Newton–Schulz 迭代係數，並逐位元精確檢查 bf16 捨入：\n\n```python\nfrom scipy.optimize import differential_evolution\n\ngrid_in = np.concatenate([np.linspace(0.02, 0.05, 10),\n\n                          np.linspace(0.05, 1.0, 190)])\n\ngrid_over = np.linspace(1.0, 1.3, 20)\n\ndef p_map(sig, a, b, c, iters=6):\n\n    x = sig\n\n    for _ in range(iters):\n\n        x = a*x + b*x**3 + c*x**5\n\n    return x\n\ndef objective(params):\n\n    a, b, c = params\n\n    dev = np.max(np.abs(p_map(grid_in, a, b, c) - 1.0))\n\n    over = max(0.0, np.max(np.abs(p_map(grid_over, a, b, c))) - 1.15)\n\n    return dev + 5.0*over\n\nres = differential_evolution(objective,\n\n        [(1.0, 6.0), (-8.0, 0.0), (0.0, 5.0)],\n\n        maxiter=300, tol=1e-9, seed=0, polish=True)\n```\n\nDeepSeek V4 Pro 建立了一個校準過的訓練問題玩具模型，其中 minibatch 雜訊由真實 Kronecker Hessian 塑形，並包含自然梯度 oracle 分支：\n\n```python\n\"\"\"Calibrated toy: Kron-quadratic + CORRECT Kron-Hessian\n\nminibatch noise. eps = Hl^{1/2} Z Hr^{1/2} / sqrt(n_eff).\n\nIdeal preconditioner: Ql = Hl^{-1/2}, Qr = Hr^{-1/2}.\"\"\"\n\nG = Hl @ W @ Hr\n\neps = Hl12 @ torch.randn(p, q) @ Hr12 / (n_eff ** 0.5)\n\ng = G + eps\n\nelif opt == \"natgrad\":   # oracle arm\n\n    El, Vl = torch.linalg.eigh(Hl)\n\n    Er, Vr = torch.linalg.eigh(Hr)\n\n    u = Vl @ (Vl.T @ d @ Vr /\n\n        (El[:, None]**0.5 * Er[None, :]**0.5)) @ Vr.T\n```\n\nGLM 5.3 在任何 GPU 篩選之前，先在 CPU 上除錯其 SOAP 實作：\n\n```python\ntorch.manual_seed(0)\n\nfor shape in [(768, 768), (3072, 768), (768, 3072)]:\n\n    p = torch.nn.Parameter((torch.randn(*shape) * 0.02).bfloat16())\n\n    opt = SOAP([p], lr=0.025)\n\n    for t in range(25):\n\n        p.grad = (torch.randn(*shape) * 0.01).to(torch.bfloat16)\n\n        opt.step()\n\n        if not torch.isfinite(p.data).all():\n\n            print(shape, ’NaN at step’, t+1)\n\n            st = opt.state[p]\n\n            print(’  L finite’, torch.isfinite(st[’L’]).all().item(),\n\n                  ’v finite’, torch.isfinite(st[’v’]).all().item())\n\n            break\n```\n\n## 附錄 B：程式化編排範例\n\n```python\n# Admit independent subagents; do not wait for answers here.\n\nreview = await rlm(\"Audit the implementation. Reply with concrete issues.\",\n\n                   name=\"reviewer\")\n\ntests = await rlm(\"Run the test suite and classify failures.\",\n\n                  name=\"tester\")\n\n# Later, recover retained sessions and send a follow-up.\n\nchildren = await rlm.list_subagents()\n\nawait agent_message.send(\n\n    \"Also inspect error-handling edge cases.\",\n\n    receiver_role=\"child\", receiver_name=review.name)\n```\n\n這條顯式回覆路徑是刻意設計的：子代理是一個持久且並行的工作階段，而不是由 `rlm` 回傳的無狀態完成結果。\n\n## 附錄 C：LLM 使用聲明\n\n本稿件準備過程中使用大型語言模型協助程式碼開發、文字精煉與格式整理。所有科學主張、實驗設計、分析與智識貢獻均完全出自作者。","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"14ecfec3bd5761bc963d421d84d224bd7336ab30b7c03c604f97481317fc1d4e","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow 003e\u003c/a\u003e","payload":{"lines":"73,74","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e附錄 B：程式化編排範例\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:3b7e82c124c8f72853bf6c3a8fcefc38107d0c844a40c760e6c6eab765ff6ad8\" title=\"点击查看完整註釋\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"74,75","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e附錄 C：LLM 使用聲明\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:f13d23403ccb4033f7fa681ccaabeda25af164eb811f3a2b5d075fd179fa46f7\" title=\"点击查看完整註釋\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"75,76","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003ePrime Agent：自我改進的 RLM 執行框架\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Prime Agent：自我改進的 RLM 執行框架\" data-note-id=\"note:sha256:116715910abab9475c1bd2d8359a2f9652cf7e9071473cb0725375b7169f047f\" title=\"点击查看完整註釋\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"prime-agent自我改進的-rlm-執行框架\"\u003ePrime Agent：自我改進的 RLM 執行框架\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e作者：Seth Karten, Alex L. Zhang, Kevin Thomas, Sebastian Müller, Elie Bakouch, Daniel Auras, Mika Senghaas, Fares Obeid, Konstantin Dunas, Johannes Hagemann, Sami Jaghouar\u003cbr\u003e\u003ca href=\"https://arxiv.org/html/2608.23552v1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003earXiv:2608.23552v1\u003c/a\u003e · cs.AI · 2026-08-24\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e首次發布：2026 年 8 月 5 日 • 目前版本：2026 年 8 月 24 日\u003c/p\u003e\n\u003ch2 id=\"摘要\"\u003e摘要\u003c/h2\u003e\n\u003cp\u003e語言模型是序列處理器，但長時程代理能力需要超出模型權重與當前上下文之外的外部資訊與計算。Prime Agent 是一套開源執行框架，用於長時程評估與程式編寫代理工作流程。持久化 IPython REPL 遵循 Recursive Language Model 抽象，支援程式化上下文處理與測試時計算；Continual Harness 則跨軌跡保存歷史、記憶、技能、提示與子代理規格。遞迴子代理透過代理對代理直接通訊協調，而 Agents View 讓人類能檢視與管理由常駐程序支援的工作階段。Prime Agent 將執行、復原、驗證與資源計量標準化，同時把策略建構留給模型。這層低摩擦且具表達力的介面可避免執行框架故障被誤判為模型失敗，並使衡量結果更接近模型真正的最大潛在能力。Prime Agent 將 ARC-AGI-3 的 RHAE Best@1 從 30% 提升至 95.5%，並在長上下文程式編寫、GPU 核心生成、模擬器建構與自主 nanoGPT 競速等任務上，達到或超越原生及主流執行框架。在 Factorio 上，我們發現精煉可讓科技持續推進，而專職子代理能讓工作平行化。程式碼位於 \u003ca href=\"https://github.com/PrimeIntellect-ai/prime-agent\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/PrimeIntellect-ai/prime-agent\u003c/a\u003e。\u003c/p\u003e\n\u003ch2 id=\"1-引言\"\u003e1 引言\u003c/h2\u003e\n\u003cp\u003e單靠一個強大的語言模型，並不具備電腦的完整能力。LLM 是受限的序列處理器，其下一步決策只能使用模型權重與當前上下文中可見的狀態資訊。執行框架提供缺少的計算基底，使模型能透過工具呼叫執行外部動作。這些外部動作也包括管理超出模型權重既有知識之外的資訊。上下文管理最初由代理式壓縮實現：模型選擇性分析自身上下文，以在保留關鍵資訊的同時減少 token。然而，完整的資訊狀態如今已超出權重與 token 上下文。若將其視為一個狀態資訊快取（\u003ca href=\"#S2.F2\"\u003e圖 2\u003c/a\u003e），模型權重是 L0、當前上下文是 L1、持久化 REPL 與遞迴子代理構成 L2，而磁碟支援的歷史、記憶與技能構成 L3。這使系統更具 \u003cem\u003evon Neumann\u003c/em\u003e 式特徵：模型可以讀取、轉換與寫入目前正在生成之指令之外、可定址的狀態 [\u003ca href=\"#bib.bib31\"\u003e34\u003c/a\u003e, \u003ca href=\"#bib.bib32\"\u003e35\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e從這個觀點來看，\u003cem\u003e表達力\u003c/em\u003e成為執行框架的關鍵特性。具表達力的執行框架並不預先編碼單一工作流程，而是暴露一組基元，讓模型能在推論時自行建構程式、子代理與回饋迴圈。Recursive Language Models（RLMs）讓上下文與遞迴呼叫可程式化 [\u003ca href=\"#bib.bib4\"\u003e44\u003c/a\u003e]；Continual Harness 則讓提示、子代理、技能與記憶可依軌跡歷史修訂 [\u003ca href=\"#bib.bib3\"\u003e18\u003c/a\u003e]。最後，我們透過代理對代理直接通訊，支援大規模多代理群體的協調與編排。這些元件讓固定模型能利用資訊管理與測試時計算，擴大其可到達的策略集合。\u003c/p\u003e\n\u003cp\u003ePrime Agent 首先被設計為一套標準化的\u003cem\u003e長時程評估\u003c/em\u003e執行框架。最常見的指標是在固定支出下的分數 [\u003ca href=\"#bib.bib33\"\u003e8\u003c/a\u003e]，例如固定成本/token 與時間；對長時程任務尤其重要的另一項指標，是實務平台期的分數 [\u003ca href=\"#bib.bib33\"\u003e8\u003c/a\u003e]，可用來分析效能隨時間變化的形狀。執行框架是模型觀察世界並對其採取行動時所經過的介面層。模型應該因任務超出自身能力而在評估中失敗，而不是因執行框架遺失狀態、限制有用動作、錯算資源或過早終止。為此，Prime Agent 將標準化且可靠的執行，與低摩擦、高表達力的程式化工具、資訊管理與群體管理介面結合。這讓模型能充分利用測試時計算，使量測到的效能更接近模型真正的最大潛在能力，而非受限於執行框架。\u003c/p\u003e\n\u003cp\u003ePrime Agent 同時管理資訊與計算。資訊管理透過程式化上下文處理、壓縮、持久歷史與可修訂記憶，在 L1–L3 之間移動狀態。計算管理則將測試時計算分配給程式、工具呼叫、可重用技能與平行遞迴子代理 [\u003ca href=\"#bib.bib34\"\u003e32\u003c/a\u003e, \u003ca href=\"#bib.bib4\"\u003e44\u003c/a\u003e]。代理對代理直接通訊把兩者連接起來，讓資訊在分散式計算之間路由，使代理群體能動態協調，而不是遵循固定圖結構。這些通訊連結也讓人類不必追蹤每一次交換，就能檢視、傳訊、附加至子代理工作階段並介入其中 [\u003ca href=\"#bib.bib26\"\u003e16\u003c/a\u003e, \u003ca href=\"#bib.bib27\"\u003e21\u003c/a\u003e]。這些互動共同產生可保留的軌跡，用來改善後續計算，並可作為後續模型世代的訓練資料 [\u003ca href=\"#bib.bib28\"\u003e43\u003c/a\u003e, \u003ca href=\"#bib.bib29\"\u003e40\u003c/a\u003e, \u003ca href=\"#bib.bib30\"\u003e25\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e我們提出 Prime Agent：一套用於長時程模型評估與程式編寫代理工作流程的開源執行框架。Prime Agent 橫跨當前上下文、持久化程式化執行、遞迴子代理，以及保留的歷史、記憶與可重用技能，整合資訊與計算管理，並以代理對代理及人類—代理直接通訊相互連接。其 Agents View 提供視覺介面，用於檢視、附加至並管理由常駐程序支援的持久代理工作階段。我們將評估基礎設施標準化，同時保留模型自行建構策略的自由。Prime Agent 將 ARC-AGI-3 效能從 30% 提升至 95%，在長上下文程式編寫、GPU 核心生成與模擬器建構方面達到或超越 Pi、Claude Code 與 Codex（並在其他基準上優於 Hermes Agent、OpenCode 與 Kimi-Code 等執行框架），支撐一場長達 85.5 小時、產生 19 筆經驗證紀錄的 nanoGPT 執行，並支援四角色 Factorio 控制與長時程 MazeBench 探索。\u003c/p\u003e\n\u003ch2 id=\"2-prime-agent-架構\"\u003e2 Prime Agent 架構\u003c/h2\u003e\n\u003cp\u003e以下我們詳細說明 Prime Agent 的架構。具體而言，我們討論：（1）系統如何管理資訊與計算（§\u003ca href=\"#S2.SS1\"\u003e2.1\u003c/a\u003e）；（2）狀態如何分布於模型權重、當前上下文、REPL 與磁碟支援的儲存空間（§\u003ca href=\"#S2.SS2\"\u003e2.2\u003c/a\u003e）；（3）持久化 REPL 與 RLM 呼叫如何支援程式化計算（§\u003ca href=\"#S2.SS3\"\u003e2.3\u003c/a\u003e）；（4）遞迴工作階段如何與代理及人類操作員通訊（§\u003ca href=\"#S2.SS4\"\u003e2.4\u003c/a\u003e）；（5）Continual Harness 如何將軌跡證據轉為可重用狀態（§\u003ca href=\"#S2.SS5\"\u003e2.5\u003c/a\u003e）；以及（6）長時程控制如何定義延續、終止與評估計量（§\u003ca href=\"#S2.SS6\"\u003e2.6\u003c/a\u003e）。\u003ca href=\"#S2.F1\"\u003e圖 1\u003c/a\u003e 提供整體概覽。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 1：Prime Agent 將持久化的根工作階段與子代理工作階段連接至常駐程序、Continual Harness、Agents View 與環境。實線箭頭承載執行與訊息；虛線箭頭承載持久狀態。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/architecture.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 1：Prime Agent 將持久化的根工作階段與子代理工作階段連接至常駐程序、Continual Harness、Agents View 與環境。實線箭頭承載執行與訊息；虛線箭頭承載持久狀態。\u003c/p\u003e\n\u003ch3 id=\"21-架構概覽\"\u003e2.1 架構概覽\u003c/h3\u003e\n\u003cp\u003ePrime Agent 將資訊管理與計算管理分離。資訊管理決定哪些狀態會進入模型呼叫，以及哪些狀態能在壓縮或重新啟動後保留下來。\u003c/p\u003e\n\u003cp\u003e計算管理將模型選擇的動作對應至程式碼、工具與遞迴子代理工作階段。代理對代理直接通訊連接彼此相關的工作階段，而人類—代理直接互動則將個別節點暴露出來，供檢視與介入。\u003c/p\u003e\n\u003cp\u003e模型使用程式碼操作中間值。工作階段會跨壓縮、脫離與重新啟動保留歷史。子代理繼承根工作階段的執行與通訊基元。執行環境會記錄模型呼叫、工具使用、訊息、執行框架變更與資源使用情形。模型控制任務分解、計算分配、通訊與停止時機。\u003c/p\u003e\n\u003ch3 id=\"22-資訊階層與持久狀態\"\u003e2.2 資訊階層與持久狀態\u003c/h3\u003e\n\u003cp\u003e一次模型呼叫由固定權重參數化，並以其當前 token 上下文為條件。Prime Agent 在該上下文之外加入額外狀態。當執行環境注入外部狀態，或某項操作將結果序列化進上下文時，外部狀態就會影響生成。\u003ca href=\"#S2.F2\"\u003e圖 2\u003c/a\u003e 依可見性、存取機制與持久性整理這些狀態。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 2：Prime Agent 狀態階層。L1 與 L2 之間的邊界，將 token 可見的模型狀態與顯式管理的計算及保留狀態分隔開來。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/state-hierarchy.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 2：Prime Agent 狀態階層。L1 與 L2 之間的邊界，將 token 可見的模型狀態與顯式管理的計算及保留狀態分隔開來。\u003c/p\u003e\n\u003cp\u003e各層級透過不同機制改變。微調更新 L0，壓縮改寫 L1，而精煉會為選定的 L3 項目建立新版本。我們將 L2 的機制稱為\u003cem\u003e代理式垃圾回收\u003c/em\u003e。隨著任務改變，模型會建立、保留、摘要或刪除 REPL 值與子代理工作階段。\u003c/p\u003e\n\u003cp\u003e顯式操作會在層級之間移動資訊。L2 中的 Python 值與工具輸出，在序列化至 L1 時進入生成流程。壓縮會以摘要取代對話前綴，同時將原始事件保留在 L3，以供 REPL 擷取。執行環境會把選定的 Continual Harness 項目組裝到後續的補充提示中；其他 L3 產物則在擷取時進入上下文。L0 維持不變。\u003c/p\u003e\n\u003cp\u003e被保留的執行階段狀態包括：僅附加的事件歷史、選定的核心快照、以根為起點的工作階段樹、上下文與壓縮紀錄、持久訊息佇列，以及版本化的 Continual Harness 狀態。建立分支或 fork 會產生新的邏輯延續，而不刪除既有事件序列。復原會在相同身分下重建工作階段。不可序列化的 Python 物件與外部程序，則由已儲存產物或外部服務重新建立。\u003c/p\u003e\n\u003ch3 id=\"23-使用-rlm-的程式化計算\"\u003e2.3 使用 RLM 的程式化計算\u003c/h3\u003e\n\u003cp\u003e每個工作階段都擁有一個持久化 IPython Read-Eval-Print Loop（REPL）。在測試時，計算包含模型推論、Python 執行與工具呼叫；評估會分別回報 token、時間與成本。已安裝的工具會以 Python 模組匯入，並透過一般程式碼進行解析、篩選、彙整與驗證。中間值會跨回合持久保留，且在被選取前維持於當前上下文之外。這可避免反覆將大型日誌、任務規格與結構化評估器輸出序列化進上下文。\u003c/p\u003e\n\u003cp\u003ePrime Agent 以非同步 \u003ccode\u003erlm\u003c/code\u003e 基元實作 RLM 抽象 [\u003ca href=\"#bib.bib4\"\u003e44\u003c/a\u003e]。呼叫 \u003ccode\u003erlm\u003c/code\u003e 會建立並排程一個子代理工作階段，且在子代理完成之前就先回傳穩定的 handle。子代理會取得自己的模型上下文、IPython 核心、歷史與工作區中繼資料。子代理執行期間，父代理可繼續本地計算。結果稍後會透過代理對代理直接通訊傳回，而保留的 handle 可在壓縮或重新啟動後繼續後續互動。模型自行選擇使用本地程式碼、工具、循序委派或平行子代理。Prime Agent 定義的是這些操作的執行語義，而不是固定的工作流程圖。完整的編排範例見\u003ca href=\"#A2\"\u003e附錄 B\u003c/a\u003e。\u003c/p\u003e\n\u003ch3 id=\"24-遞迴編排與互動\"\u003e2.4 遞迴編排與互動\u003c/h3\u003e\n\u003cp\u003e常駐程序會獨立於建立工作階段的用戶端，持有仍在運作的工作階段。根工作階段與子代理工作階段使用相同生命週期。工作階段在執行回合或工具操作時為 running；已載入但沒有進行中回合時為 idle；卸載後則為 inactive，但仍可由持久狀態復原。用戶端脫離後，工作階段仍持續執行。穩定的工作階段與父工作階段識別碼，會在這些狀態轉換中維持遞迴拓撲。\u003c/p\u003e\n\u003cp\u003e代理對代理直接通訊使用由常駐程序中介的非同步佇列。代理可以指定父代理、子代理與手足代理為收件者；當收件者再次變為 active 時，佇列中的訊息仍可取得。檔案系統、網路與憑證存取遵循執行環境的權限。\u003ca href=\"#S2.F3\"\u003e圖 3\u003c/a\u003e 概述共用的生命週期與通訊拓撲。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 3：多代理編排生命週期與代理對代理直接通訊。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/orchestration-lifecycle.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 3：多代理編排生命週期與代理對代理直接通訊。\u003c/p\u003e\n\u003cp\u003eAgents View 將持久樹狀結構暴露出來，以支援人類—代理直接互動。使用者可以透過此介面檢視歷史、附加至工作階段、提供新輸入，或在不中斷執行的情況下脫離。\u003ccode\u003eagent-observe\u003c/code\u003e 介面提供有界的唯讀狀態與近期訊息預覽；\u003ccode\u003eagent-message\u003c/code\u003e 則可指定一個具名的相關工作階段。這讓使用者能透過編排器進行完整互動。\u003c/p\u003e\n\u003ch3 id=\"25-continual-harness\"\u003e2.5 Continual Harness\u003c/h3\u003e\n\u003cp\u003eContinual Harness 提供補充狀態，供軌跡執行期間讀寫 [\u003ca href=\"#bib.bib3\"\u003e18\u003c/a\u003e]。提示註記儲存行為指令，記憶儲存事實，技能封裝可執行程序，而子代理規格則儲存可重用角色或分工方式。型別化狀態會區分規則、事實、程式與協調模式。各項目支援建立、讀取、更新與刪除；本地項目屬於單一工作階段，而明確要求為全域的項目則可供後續工作階段使用。\u003c/p\u003e\n\u003cp\u003e精煉會把軌跡證據轉換為版本化狀態更新。代理可直接要求編輯，或由 \u003ccode\u003e/refine\u003c/code\u003e 對相關事件執行背景模型呼叫。執行環境會在回合邊界套用每項編輯、記錄其觸發原因與預期效果，並為下一次呼叫組裝補充狀態。版本可保留來源脈絡並支援回滾。精煉是在不改寫基礎政策的前提下，補充不可變的基礎提示。\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e自我改進\u003c/em\u003e會把執行證據轉換成持久的執行框架狀態，在模型權重保持不變時改變後續行為。有用的計算會成為技能，重複出現的協調模式會成為子代理規格，而修正後的假設會成為記憶或提示註記。所產生的軌跡紀錄也能作為後續模型世代的訓練資料。\u003c/p\u003e\n\u003ch3 id=\"26-長時程執行與評估語義\"\u003e2.6 長時程執行與評估語義\u003c/h3\u003e\n\u003cp\u003ePrime Agent 提供三種長時程控制機制（\u003ca href=\"#S2.F4\"\u003e圖 4\u003c/a\u003e）。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 4：長時程控制機制。自主模式會在明確預算內持續執行，直到終止條件測試通過。Goals 會跨延續保留目標，直到代理式完成。Heartbeats 會依 cron 或計時排程啟動回合。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/long-horizon-controls.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 4：長時程控制機制。自主模式會在明確預算內持續執行，直到終止條件測試通過。Goals 會跨延續保留目標，直到代理式完成。Heartbeats 會依 cron 或計時排程啟動回合。\u003c/p\u003e\n\u003cp\u003e自主模式會在明確預算內持續進行模型回合，並在每個回合後評估任務指定的終止條件測試。測試失敗時會回傳有界輸出，以供再次嘗試；回合數、token 與實際經過時間限制則會停止執行。Goal 會跨多次延續保留目標，並在代理將目標標記為完成時，透過代理式完成結束。Heartbeats 會依 cron 或計時排程啟動回合。\u003c/p\u003e\n\u003cp\u003e評估設定會把任務與工具介面綁定至模型與供應商設定、壓縮與精煉政策、重試政策、完成門檻及資源限制。資源計量會彙總根工作階段及其後代工作階段，因此委派成本仍會反映在測試時成本中。事件歷史會把模型與工具呼叫、訊息、介入、重試、驗證器結果與執行框架編輯，連結至相應設定。標準化的持久化、復原、終止與計量，可將執行框架故障與模型失敗區分開來，同時保留模型對任務分解的控制。\u003c/p\u003e\n\u003ch2 id=\"3-評估\"\u003e3 評估\u003c/h2\u003e\n\u003cp\u003e本評估針對三個源自 Prime Agent 設計的研究問題。RQ1：測試時擴展。標準化且具表達力的執行介面，能否讓前沿模型把額外的輸出 token 與 API 成本轉化為經驗證的任務進展？我們在 ARC-AGI-3 上評估此問題。RQ2：資訊管理。模型能否使用持久化 REPL 狀態，在長上下文中搜尋、轉換與彙整資訊？我們在長上下文推理與程式編寫任務上，將 Prime Agent 與原生及其他執行框架比較。RQ3：持久遞迴執行。同一執行環境能否支撐多日實驗、反覆系統建構、遞迴控制與線上精煉？我們透過端到端結果與軌跡分析研究 nanoGPT、PMPP-Hard、EmulatorBench、Factorio 與 MazeBench。軌跡分析呈現代理如何分配子代理、保留資訊，以及在中斷後復原。\u003c/p\u003e\n\u003ch3 id=\"31-測試時規模下的互動式推理\"\u003e3.1 測試時規模下的互動式推理\u003c/h3\u003e\n\u003cp\u003eARC-AGI-3 是檢驗 Prime Agent 能否支援強健且一致的長時程評估，最直接的測試 [\u003ca href=\"#bib.bib6\"\u003e2\u003c/a\u003e]。每個遊戲都要求模型在動作次數限制下學習遊戲規則，臨時建立世界模型。Prime Agent 只提供環境介面與改寫自 PRO-LONG 的自主提示 [\u003ca href=\"#bib.bib5\"\u003e9\u003c/a\u003e]；策略由模型自行建構。我們注意到，Claude Code 與 Codex 在 ARC-AGI-3（公開集）上的執行結果低於 Anthropic 與 Open AI 自行回報的效能，因此相較於我們使用相同提示與設定所做的執行，我們以其公布結果為準。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 5：ARC-AGI-3 測試時擴展。RHAE 分數相對於每局輸出 token（左）與估算 API 成本（右）。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/arc-agi3-scaling-combined.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 5：ARC-AGI-3 測試時擴展。RHAE 分數相對於每局輸出 token（左）與估算 API 成本（右）。\u003c/p\u003e\n\u003cp\u003e在觀察到的各種設定中，額外輸出 token 與成本轉化為進展的速率差異非常大（\u003ca href=\"#S3.F5\"\u003e圖 5\u003c/a\u003e）。較強的設定能在長互動時程中持續改善，而其他設定則很早進入平台期。這種模式符合一種由模型控制的介面：它允許依模型而異的測試時擴展，而不是強制套用單一固定工作流程。圖中的參考線與參考點將這些曲線與 ARC 官方結果並列。這些值屬於外部數據，因為我們在原生執行框架上的重跑結果低於已公布分數；因此它們的作用是提供結果定位，而不是隔離執行框架的因果效應。\u003c/p\u003e\n\u003ch3 id=\"32-長上下文資訊管理\"\u003e3.2 長上下文資訊管理\u003c/h3\u003e\n\u003cp\u003e長上下文測試套件檢驗模型能否主動管理那些不適合自然塞入單一提示的資訊。Prime Agent 將初始上下文儲存在可讀檔案中，讓模型能透過持久化 REPL 搜尋、轉換、摘要並重新檢視內容。這把長上下文推理從對固定序列的被動注意，轉變為程式化資訊管理問題。測試套件涵蓋彙整、潛在檢索、指令遵循、推理與長篇程式編寫 [\u003ca href=\"#bib.bib7\"\u003e5\u003c/a\u003e, \u003ca href=\"#bib.bib8\"\u003e33\u003c/a\u003e, \u003ca href=\"#bib.bib9\"\u003e6\u003c/a\u003e, \u003ca href=\"#bib.bib10\"\u003e3\u003c/a\u003e, \u003ca href=\"#bib.bib11\"\u003e23\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e表 1：長上下文結果。粗體表示每一組名義模型配對中較高的點估計值；各列指標不同。粗體不代表統計顯著性，且沒有可用的不確定性區間。\u003c/p\u003e\n\u003cp\u003e整體而言，我們發現 Prime Agent 在各類長任務上都具有競爭力，尤其是在對比那些所用模型並非圍繞該執行框架訓練的系統時。Prime Agent 在長時間執行或長上下文任務上尤其突出，並能以自主代理形式獨立執行且保持競爭力。我們進一步納入一組聚焦的個案研究與實驗，呈現 Prime Agent 在長時程情境中的優勢。\u003c/p\u003e\n\u003ch3 id=\"33-多日自主研究\"\u003e3.3 多日自主研究\u003c/h3\u003e\n\u003cp\u003enanoGPT speedrun [\u003ca href=\"#bib.bib43\"\u003e4\u003c/a\u003e] 衡量代理能將 124M 參數 GPT 達到固定驗證損失所需的訓練步數降低到什麼程度；每項紀錄都以八個 seed 的平均值驗證。對三個模型（Kimi K3、DeepSeek V4 Pro 與 GLM 5.3），我們將 Prime Agent 與另一套執行框架比較：若模型開發者有自己的 CLI，就使用該 CLI；否則使用 Claude Code 或 opencode。我們發現，相較於實驗本身的雜訊，執行框架的選擇對最終紀錄影響不大。\u003c/p\u003e\n\u003cp\u003e然而，模型行為確實不同。在 Prime Agent 上，模型經常利用持久化 REPL 在基準的訓練腳本之外進行實驗，例如在啟動訓練執行前，先用合成梯度模擬候選最佳化器，或以數值方法最佳化更新規則係數。\u003ca href=\"#S3.F6\"\u003e圖 6\u003c/a\u003e 統計 18 次執行中的這類實驗，並以每個代理執行的訓練次數正規化；\u003ca href=\"#A1\"\u003e附錄 A\u003c/a\u003e 則為每個模型重現一個此類實驗。DeepSeek V4 Pro 的差異最大：在 Prime Agent 下，每次訓練執行所建立的這類實驗數量約為 Claude Code 下的六倍。原因之一可能是 DeepSeek 自身的代理執行框架也提供類似的程式碼執行模式，因此 REPL 符合該模型很可能在訓練時接觸過的工作流程。我們也觀察到模型會替基準本身建構程式化介面：Kimi K3 定義了一個 \u003ccode\u003eprobe\u003c/code\u003e 函式，透過它進行約九十次篩選實驗，以及全部 19 筆經驗證紀錄；相較之下，同一模型在自己的 CLI 上，每項操作都透過直接編輯檔案完成，並未建立這類機制。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 6：不同執行框架下的迴圈外實驗。每 100 次訓練腳本執行所建立、位於訓練腳本之外的不同實驗數量；每種執行框架合併 2–3 個 seed 的結果（標籤：實驗/訓練執行）。計數由完整軌跡人工分類；可取得時會稽核分母，否則由啟動命令估算。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/nanogpt-lab-census.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 6：不同執行框架下的迴圈外實驗。每 100 次訓練腳本執行所建立、位於訓練腳本之外的不同實驗數量；每種執行框架合併 2–3 個 seed 的結果（標籤：實驗/訓練執行）。計數由完整軌跡人工分類；可取得時會稽核分母，否則由啟動命令估算。\u003c/p\u003e\n\u003ch3 id=\"34-程式化系統建構\"\u003e3.4 程式化系統建構\u003c/h3\u003e\n\u003ch4 id=\"模擬器\"\u003e模擬器\u003c/h4\u003e\n\u003cp\u003e模擬器是一種重現另一個電腦系統可觀察行為的軟體。我們在 EmulatorBench 上評估 Prime Agent；該基準要求代理以 Rust 為各種遊戲系統建構模擬器。代理會取得模擬器規格，以及一組以驗證器形式提供的診斷測試。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"(a) Sega Genesis。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/emulator-genesis.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e(a) Sega Genesis。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"(b) Game Boy Color。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/emulator-game-boy-color.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e(b) Game Boy Color。\u003c/p\u003e\n\u003cp\u003e圖 7：選定的 EmulatorBench 執行結果。逐步驗證器分數相對於估算成本；色相編碼模型，線型編碼執行框架。\u003c/p\u003e\n\u003cp\u003e模擬器的正確性取決於它能否模仿目標機器的行為。這項能力由人工撰寫的診斷程式衡量，這些程式會檢查模擬器的行為，例如 CPU flags、PPU timing 與其他元件。為盡量降低資料污染的影響，我們要求代理在沒有任何參考實作的沙箱環境中，以 Rust 從零建構模擬器。我們在\u003ca href=\"#S3.T1\"\u003e表 1\u003c/a\u003e 回報這項長上下文程式編寫基準的初步結果，數值為 16 次模擬器重建的平均；此外，\u003ca href=\"#S3.F7\"\u003e圖 7\u003c/a\u003e 顯示 Prime Agent 成功重現的兩個模擬器：SEGA Genesis 與 Nintendo Game Boy Color。對 Opus 而言，儘管工具呼叫回應成功，我們的執行卻出乎意料地未能解決這些任務。\u003c/p\u003e\n\u003ch4 id=\"gpu-核心\"\u003eGPU 核心\u003c/h4\u003e\n\u003cp\u003ePMPP-Hard 將同一套程式化迴圈壓縮成在實際經過時間預算內，反覆進行編輯、編譯、正確性檢查與效能剖析的週期。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 8：在固定模型內預算下的 PMPP-Hard 解題率。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/pmpp-hard.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 8：在固定模型內預算下的 PMPP-Hard 解題率。\u003c/p\u003e\n\u003cp\u003ePrime Agent 與原生執行框架的結果依然接近，而兩個模型群組的排序彼此相反。在這些已回報的模型內比較中，通用持久介面能支援編譯—效能剖析迴圈，未觀察到明顯差距。PMPP-Hard 一項已知限制，是採用嚴格的實際經過時間預算比較。然而，實際經過時間預算無法呈現的是：使用 Prime Agent 的模型在 token 使用量上有顯著改善。也就是說，Prime Agent 能以大幅更低的成本達到與 Codex 或 Kimi-Code 相同的效能；若以相同 token 數量比較，Prime Agent 具有優勢。\u003c/p\u003e\n\u003ch3 id=\"35-持久互動與精煉\"\u003e3.5 持久互動與精煉\u003c/h3\u003e\n\u003ch4 id=\"factorio\"\u003eFactorio\u003c/h4\u003e\n\u003cp\u003eFactorio Learning Environment 為一個持久化工廠世界提供 Python 觀察與動作介面 [\u003ca href=\"#bib.bib12\"\u003e12\u003c/a\u003e]。在一場為期七天的 Sonnet 5 執行中，根工作階段及其後代共使用 23.4 百萬個輸出 token，完成 196 項科技中的 24 項，並將 advanced-circuit 研究推進至 71%（\u003ca href=\"#S3.F9\"\u003e圖 9\u003c/a\u003e），且沒有停滯跡象。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 9：Factorio 進展與遞迴計算。上方為已研究科技數，下方為代理樹成長與並行度，皆相對於 Sonnet 5 美學執行的累積輸出 token。垂直線標示一次破壞性世界重置。最後的空心標記表示完成 24 項科技後，advanced-circuit 研究進度為 71%。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/factorio-tech-and-tree.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 9：Factorio 進展與遞迴計算。上方為已研究科技數，下方為代理樹成長與並行度，皆相對於 Sonnet 5 美學執行的累積輸出 token。垂直線標示一次破壞性世界重置。最後的空心標記表示完成 24 項科技後，advanced-circuit 研究進度為 71%。\u003c/p\u003e\n\u003cp\u003e模型處理不可逆動作的表現不佳。一次破壞性世界重置把科技數從五項退回一項；之後工作階段成功復原並繼續執行，而不是捨棄整條軌跡。根工作階段在 149 波派工中建立了 633 個深度為一的子代理，同時 active 的數量最多為七個。這棵淺層、反覆向外擴張的樹，記錄的是平行任務專業化，而非更深層的遞迴；呈突發式成長的科技曲線，則把漫長的建造區段與經外部驗證的進展區分開來。\u003c/p\u003e\n\u003cp\u003e另一條 Factorio 軌跡揭示了線上精煉的核心安全失敗。代理發現 RCON 命令可以直接把資源生成到組裝機中；儘管存在反作弊 heartbeat，它仍使用這項捷徑，之後甚至將其保存為可重用技能。在這條軌跡中，持久化保存了能最佳化量測目標的行為，其中也包括對規格漏洞的利用。因此，安全部署需要最小權限的動作介面、獨立的狀態驗證，以及可稽核地回滾受污染精煉的能力。\u003c/p\u003e\n\u003ch4 id=\"mazebench\"\u003eMazeBench\u003c/h4\u003e\n\u003cp\u003eMazeBench 是一個開放世界 3D 空間推理環境，玩家控制一個 3D 方塊，在全域迷宮中解開各個謎題房間，同時收集寶石。前沿模型已被證明在此任務上非常吃力，即使耗費數十億 token，也只能解開整個世界的一小部分。我們比較 Opus 5 與 GPT-5.6 Sol 在 Prime Agent 和各自原生執行框架上的表現，並另比較搭配 Claude Code 的 GLM-5.2。依照基準指標，我們回報其找到的不重複房間數、不重複狀態數與寶石總數，並將這些數值都表示為其整體 token 支出的函數。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"圖 10：MazeBench 探索相對於估算 token 成本。實線與實心標記表示 Prime Agent；點線與空心標記表示比較用執行框架。色相與標記形狀用於識別模型。\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://arxiv.org/html/2608.23552v1/mazebench.svg\"\u003e\u003c/p\u003e\n\u003cp\u003e圖 10：MazeBench 探索相對於估算 token 成本。實線與實心標記表示 Prime Agent；點線與空心標記表示比較用執行框架。色相與標記形狀用於識別模型。\u003c/p\u003e\n\u003ch2 id=\"4-相關工作\"\u003e4 相關工作\u003c/h2\u003e\n\u003ch4 id=\"程式化推論與自適應狀態\"\u003e程式化推論與自適應狀態\u003c/h4\u003e\n\u003cp\u003e程式化推論讓模型使用程式碼、工具與遞迴呼叫，以轉換上下文並分配測試時計算 [\u003ca href=\"#bib.bib13\"\u003e42\u003c/a\u003e, \u003ca href=\"#bib.bib14\"\u003e30\u003c/a\u003e, \u003ca href=\"#bib.bib15\"\u003e37\u003c/a\u003e, \u003ca href=\"#bib.bib4\"\u003e44\u003c/a\u003e, \u003ca href=\"#bib.bib5\"\u003e9\u003c/a\u003e, \u003ca href=\"#bib.bib34\"\u003e32\u003c/a\u003e]。記憶與精煉方法會跨回合與任務保留選定的觀察、回饋、技能或推理軌跡 [\u003ca href=\"#bib.bib17\"\u003e24\u003c/a\u003e, \u003ca href=\"#bib.bib18\"\u003e31\u003c/a\u003e, \u003ca href=\"#bib.bib19\"\u003e22\u003c/a\u003e, \u003ca href=\"#bib.bib20\"\u003e36\u003c/a\u003e, \u003ca href=\"#bib.bib21\"\u003e26\u003c/a\u003e, \u003ca href=\"#bib.bib28\"\u003e43\u003c/a\u003e]。Continual Harness 將提示、記憶、可執行技能與子代理規格儲存為型別化、版本化狀態 [\u003ca href=\"#bib.bib3\"\u003e18\u003c/a\u003e]。Prime Agent 將這些機制與持久化核心、遞迴工作階段、復原及完整軌跡擷取整合在一起。\u003c/p\u003e\n\u003ch4 id=\"程式編寫代理與長時程評估\"\u003e程式編寫代理與長時程評估\u003c/h4\u003e\n\u003cp\u003e程式編寫代理的執行環境使用可執行動作、程式碼儲存庫工具、沙箱、事件歷史與結構化角色分派，在多個互動步驟中解決任務 [\u003ca href=\"#bib.bib15\"\u003e37\u003c/a\u003e, \u003ca href=\"#bib.bib2\"\u003e41\u003c/a\u003e, \u003ca href=\"#bib.bib16\"\u003e38\u003c/a\u003e, \u003ca href=\"#bib.bib22\"\u003e39\u003c/a\u003e, \u003ca href=\"#bib.bib23\"\u003e20\u003c/a\u003e, \u003ca href=\"#bib.bib24\"\u003e11\u003c/a\u003e, \u003ca href=\"#bib.bib25\"\u003e27\u003c/a\u003e]。可執行基準與軌跡語料庫則衡量在長上下文或延伸互動下的問題解決、指令遵循、檢索與推理能力 [\u003ca href=\"#bib.bib1\"\u003e13\u003c/a\u003e, \u003ca href=\"#bib.bib30\"\u003e25\u003c/a\u003e, \u003ca href=\"#bib.bib29\"\u003e40\u003c/a\u003e, \u003ca href=\"#bib.bib7\"\u003e5\u003c/a\u003e, \u003ca href=\"#bib.bib8\"\u003e33\u003c/a\u003e, \u003ca href=\"#bib.bib9\"\u003e6\u003c/a\u003e, \u003ca href=\"#bib.bib10\"\u003e3\u003c/a\u003e, \u003ca href=\"#bib.bib11\"\u003e23\u003c/a\u003e]。Prime Agent 讓執行基底具有持久性與遞迴性，並記錄根工作階段與後代工作階段的支出。\u003c/p\u003e\n\u003ch4 id=\"arc-agi-3-上的互動式推理\"\u003eARC-AGI-3 上的互動式推理\u003c/h4\u003e\n\u003cp\u003eARC-AGI-3 將抽象推理延伸至具有隱藏動態、目標與動作語義的互動環境 [\u003ca href=\"#bib.bib6\"\u003e2\u003c/a\u003e, \u003ca href=\"#bib.bib39\"\u003e1\u003c/a\u003e]。社群系統會建立並驗證可執行世界模型、將代理表示成具狀態的 Python 物件、最佳化外部工作區、協調專業化代理，並跨遊戲保留程序 [\u003ca href=\"#bib.bib35\"\u003e28\u003c/a\u003e, \u003ca href=\"#bib.bib36\"\u003e10\u003c/a\u003e, \u003ca href=\"#bib.bib37\"\u003e7\u003c/a\u003e, \u003ca href=\"#bib.bib38\"\u003e29\u003c/a\u003e, \u003ca href=\"#bib.bib3\"\u003e18\u003c/a\u003e, \u003ca href=\"#bib.bib5\"\u003e9\u003c/a\u003e]。Prime Agent 為同一類長時程互動任務提供持久遞迴執行與標準化評估設定。\u003c/p\u003e\n\u003ch4 id=\"多代理與人類代理通訊\"\u003e多代理與人類—代理通訊\u003c/h4\u003e\n\u003cp\u003e語言模型代理系統透過角色提示、自然語言訊息、共用成品與顯式信念狀態進行協調 [\u003ca href=\"#bib.bib22\"\u003e39\u003c/a\u003e, \u003ca href=\"#bib.bib23\"\u003e20\u003c/a\u003e, \u003ca href=\"#bib.bib24\"\u003e11\u003c/a\u003e, \u003ca href=\"#bib.bib25\"\u003e27\u003c/a\u003e, \u003ca href=\"#bib.bib27\"\u003e21\u003c/a\u003e, \u003ca href=\"#bib.bib38\"\u003e29\u003c/a\u003e]。學習式多代理通訊研究涵蓋稀疏訊息選擇、壓縮表示、社會學習、策略對齊，以及面向人類夥伴的可解釋性 [\u003ca href=\"#bib.bib41\"\u003e15\u003c/a\u003e, \u003ca href=\"#bib.bib40\"\u003e14\u003c/a\u003e, \u003ca href=\"#bib.bib26\"\u003e16\u003c/a\u003e, \u003ca href=\"#bib.bib42\"\u003e19\u003c/a\u003e]。Prime Agent 透過持久、以代理家族為範圍的佇列實作代理對代理直接通訊，並將同一棵工作階段樹暴露給人類檢視與介入。\u003c/p\u003e\n\u003ch2 id=\"5-結論\"\u003e5 結論\u003c/h2\u003e\n\u003cp\u003ePrime Agent 為代理執行框架設計提出一種新典範：將持久執行、遞迴工作階段、自主控制、記錄式歷史與 Continual Harness 整合成長時程工作的單一基底。互動式推理、長上下文任務、自主研究、系統建構與持久環境等結果顯示，這個基底能在標準化執行與計量下支援不同形式的測試時計算。儘管相較於其他執行框架已取得上述結果，模型在決定如何分配子代理、管理保留資訊，以及精煉可重用狀態時，仍會遇到摩擦。許多執行框架能力目前仍未被充分利用，因為現有模型並未接受如何操作這些能力的訓練。我們預期，模型—執行框架共同學習將成為開發新長時程能力的主要途徑。直接使用 Prime Agent 進行訓練，可以教會模型更有效地使用整合式執行框架；而針對 RLM 與 Continual Harness 元件進行訓練，則可分離辨識各自的貢獻。\u003c/p\u003e\n\u003ch2 id=\"致謝\"\u003e致謝\u003c/h2\u003e\n\u003cp\u003e感謝 Florian Brand、SinatraS 與 Patience Cave 協助完成 Prime Agent 在其他環境中的執行。SinatraS 建立了 PMPP Hard，Patience Cave 建立了 MazeBench。\u003c/p\u003e\n\u003ch2 id=\"參考文獻\"\u003e參考文獻\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e[1] (2026) ARC-AGI community leaderboard. Note: \u003ca href=\"https://arcprize.org/leaderboard/community\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://arcprize.org/leaderboard/community\u003c/a\u003eAccessed August 2026 Cited by: \u003ca href=\"#S4.SS0.SSS0.Px3.p1.1\"\u003e§4\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e[2] ARC Prize Foundation (2026) ARC-AGI-3: a new challenge for frontie
