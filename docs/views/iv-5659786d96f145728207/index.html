</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-14T14:40:15.424Z","language":"en","name":"DeMinds","version":"1.0.38"},"capabilities":{"optional":["notes"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"DeMinds 格式与内容支持","outlineVersion":1},"sourceRevision":"sha256:8af382dc8c4bdcf73f4366a29780b4bc2e5ae9ff42993ea03cce467b3c98b16f","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"DeMinds-Format-and-Content-Support.zh-CN.md","title":"DeMinds 格式与内容支持"},"files":[{"byteLength":22789,"content":"# DeMinds 格式与内容支持\n\n**如果一份内容值得继续读、继续整理，或者以后还想回来继续工作，可以先试着交给 DeMinds。**\n\n从 Markdown、Obsidian 笔记和思维导图，到 DOCX、网页文章、HTML 论文与 AI 分享内容，DeMinds 会尽量保留可识别的内容、结构、图片、链接与来源关系，让它们进入可以持续维护的工作流程。\n\n本文按 DeMinds V1.0 / 1.0.38 的当前能力整理，核对日期为 2026 年 9 月 14 日。不同格式的支持重点与保真程度不同，具体入口还受运行平台和内容访问条件影响。\n\n## 认识 DeMinds\n\n### Markdown 与通用导图\n\nMarkdown 与通用导图是同一份结构化内容的两种工作表面。Markdown 承载可维护的正文，通用导图帮助你浏览整体关系。\n\n#### 通用导图：看清整体\n\n根据可识别的标题、列表与正文关系生成结构，支持展开分支、搜索、定位、平移和缩放，方便先看全貌，再进入细节。\n\n#### Markdown 预览：连续阅读\n\n连续阅读正文、引用、表格、代码、常见公式与图片。导图中的一段细节，也可以回到正文语境中理解。\n\n#### Markdown 编辑：持续维护\n\n修改文字、调整标题与列表层级，保存后更新当前工作稿与通用导图。编辑不会直接改写外部原文件。\n\n#### 左右分栏：结构与正文并看\n\n适合的宽屏工作面可以将 Markdown 与通用导图左右并排，一边读正文，一边查看结构。可使用的 Markdown 表面包括预览与编辑；编辑保存后，导图同步更新。iPhone 和窄屏工作面使用单一表面阅读。\n\n### 主结构与细节\n\n主结构负责便于浏览，细节保留在正文或节点注释中。长段落、引用、表格等内容不必全部摊开为主导图节点；适用的结构化注释还可以切换 Markdown 与结构视图。\n\n长分支可能默认折叠。结构没有展开，不等于正文已经丢失。\n\n### 从导入到继续工作\n\n内容导入并保存后，可以从“继续工作”再次打开、阅读和编辑，也可以结合分类、工作阶段与版本历史逐步维护。\n\n通常的工作过程是：**带入内容 → 看见结构 → 阅读细节 → 编辑整理 → 保存成果 → 回来继续工作。**\n\n### 结构识别的边界\n\nDeMinds 主要利用原文中能够识别的标题、层级、列表、段落和链接关系。原文结构越明确，形成的导图通常越清楚。\n\n自动生成导图不代表已经替你总结、核实或推理全文。对于依靠字号、空格或视觉排版表达层次的内容，转换后可能仍需进一步整理。\n\n### 适用范围与分享\n\n#### Standard 与 Plus\n\n主要格式导入、Markdown 阅读与编辑、通用导图、内容源、版本历史、Markdown 文件与标准包导出，以及“借助 AI 继续”属于 Standard 核心能力。\n\n原始导图、导图全图 PNG、便携 Markdown、交互视图创建、工作区备份导入及更高的项目保留上限属于 Plus。具体入口同时受平台与内容条件约束。\n\n#### 平台差异\n\nDeMinds 覆盖 Web、iPhone、iPad 和 Designed for iPad on Mac。文件选择、系统分享、网页导入预览和部分导出入口并不完全相同。\n\nDesigned for iPad on Mac 是 iPad App 在兼容 Mac 上的运行形态，不等于独立 macOS App；窄屏 Web 也不等于 iPhone App。\n\n#### 导入效果\n\n不同来源不能承诺完全相同的保真程度。原文结构、资源完整性、页面访问条件、文件大小与运行环境都会影响结果。\n\nDeMinds 不绕过登录、付费墙或来源访问限制。原页面不能可靠取得完整正文时，不能保证导入成功或恢复完整内容。\n\n#### 分享与公开发布\n\n分享或公开发布成果前，请确认正文、图片及其他材料适合他人查看，并拥有相应权限。交互视图是只读交付文件，不等于加密文件或访问控制方案。\n\n#### 文档依据\n\n本文是面向用户的能力说明，不替代项目现有事实源，也不新增格式、平台或权益承诺。本次已核对产品功能事实源，无须改动其能力定义。\n\n主要依据为[产品功能事实源](./product/DeMinds-Product-Feature-Fact-Source.md)、[导入资源类型规范](./strategy/ImportResourceTypeRoutingStrategy.zh-CN.md)、[格式兼容矩阵](../COMPATIBILITY_MATRIX.md)与[产品术语表](./product/DeMinds-terminology.multilingual.md)，并交叉核对相关解析入口、权限配置及发布记录。\n\n#### 先看见结构，再继续工作\n\nDeMinds 希望把不同来源中值得保留的内容，变成可以阅读、理解、编辑、带走，并且以后还能回来继续维护的知识。\n\n## 文件与知识库\n\n### 文本与 Markdown 知识库\n\n#### Markdown 与纯文本\n\n##### 支持的内容\n\n支持 `.md`、`.markdown` 和 `.txt`。Markdown 是最自然的工作对象，也是不同来源转换后继续维护的主要形式；TXT 按实际文本内容处理，不会仅凭扩展名推断出复杂结构。\n\n##### 可以怎样使用\n\n打开文件后，可以阅读正文、查看通用导图并继续编辑。也可以直接输入或粘贴 Markdown，先调整内容，再创建工作项目。\n\n代码、表格、图片和常见公式等，按能够识别的 Markdown 内容处理；第三方工具的专有语法不等于标准 Markdown 能力。\n\n#### Markdown 包\n\n##### 多份文档一起整理\n\n从文件夹或 ZIP 中选择一份或多份 Markdown，并处理相关资源。导入范围由你的选择决定。\n\n##### 三种组织方式\n\n| 组织方式 | 适合的内容 |\n| --- | --- |\n| 顺序合并 | 希望按选择顺序连续阅读的多份文档 |\n| 目录结构 | 希望保留文件夹层次的一组文档 |\n| Vault 结构 | 已识别为 Obsidian Vault、希望按其组织关系阅读的内容 |\n\n##### 图片与文档链接\n\n能够定位且处于支持范围内的相关图片，会随所选内容一同处理。已选文档之间可识别的标准 Markdown 链接，可以成为继续阅读的导航。\n\n只保留图片引用与实际携带图片文件是两回事。资源缺失、路径无法解析或超出所选资源范围时，不能保证图片随内容完整迁移。\n\n#### Obsidian Vault\n\n##### 结构与内容\n\n###### 利用 Vault 的组织关系\n\nDeMinds 会利用所选内容的目录与笔记关系组织结构，包括能够识别的 Folder Note，也就是用于说明某个目录的笔记。它不只是把多份 `.md` 首尾拼接。\n\n###### 常见链接与静态图片\n\n支持处理常见 Markdown 文档链接、Wiki Link，以及能够唯一定位的静态 Wiki 图片嵌入，例如 `![[image.png]]`。可解析的相对路径图片也会按适用规则处理。\n\n###### 部分专有写法的可读处理\n\n部分 Callout 等静态写法可以转为普通引用或文本形式继续阅读。这保留的是可表达内容，不是 Obsidian 插件的运行效果。\n\n##### 明确的兼容范围\n\n这里的支持是所选内容的静态整理与迁移。Wiki 链接主要支持已选文档之间的文档级跳转，不承诺 Obsidian 标题或块引用的精确定位。\n\nDeMinds 不因链接而递归导入未选择的笔记，不执行插件或 Dataview，不复现完整关系图，也不提供 Vault 回写与双向同步。\n\nWiki 图片嵌入不等于完整支持笔记、PDF、音视频等所有嵌入类型。\n\n### 思维导图\n\n#### 支持格式\n\n##### MindNode\n\n支持受支持的 `.mindnode` 文件与目录包，保留可表达的层级、注释、图片，以及部分能够恢复的标题富文本与样式；能够处理受支持的多主节点内容。目录包选择方式受平台与文件提供方影响。\n\n##### XMind\n\n支持 `.xmind` 中可识别的层级、注释、图片，以及受支持的主题、颜色和部分分支样式信息。具体效果取决于包内结构与内容。\n\n##### FreeMind 与 Freeplane\n\n支持 `.mm` 的树结构、NOTE / DETAILS 内容、链接及能够定位的图片资源。\n\n#### 通用导图与原始导图\n\n导图导入后，可以形成可继续维护的 Markdown 与通用导图。通用导图用于跨格式阅读、结构检查和后续维护。\n\n对于具有可恢复来源的导图文件，DeMinds Plus 还可提供原始导图视图，帮助查看原文件中能够恢复的结构与视觉表达。Markdown、网页等来源不会因此获得原始导图。\n\n#### 保真与编辑边界\n\n各格式都会尽量保留主结构、节点内容、注释、图片与链接，但不保证复刻所有复杂布局、私有样式和特殊对象。\n\n后续维护的是当前 Markdown 工作稿，不直接改写外部 MindNode、XMind 或 `.mm` 文件，也不承诺把编辑结果完整回写为原厂商格式。\n\n### 常见文档与大纲\n\n#### DOCX\n\n##### 内容与结构\n\n提取标题、段落、列表、可转换表格、图片等内容，并保留导入的原始 DOCX。适合把办公文档带入 Markdown 工作流程。\n\n##### 支持边界\n\n重点是内容与结构，不承诺页眉页脚、分栏、浮动对象等复杂 Word 版式的完整还原。不支持旧版 `.doc`。\n\n#### HTML 与 HTM\n\n##### 内容与结构\n\n支持受支持的 `.html` / `.htm` 内容。DeMinds 会按普通 HTML、网页文章或 AI 分享内容进行识别与清理，再生成 Markdown。\n\n##### 支持边界\n\n支持保存的 HTML，不代表支持所有浏览器专有网页归档格式；网页脚本、交互控件与页面装饰也不等于可维护正文。\n\n#### OPML\n\n##### 内容与结构\n\n保留适合继续工作的层级、备注与链接。支持本地文件和受支持的远程入口，包括 GitHub 文件链接。\n\n##### 支持边界\n\n导入结果是普通可编辑内容。OPML 中即使包含订阅地址，也不会自动创建或批量订阅 Feed 内容源。\n\n### ZIP 与文件夹\n\nZIP 和文件夹是容器。DeMinds 会根据内部结构识别 Markdown 包、导图包、工作区备份或其他受支持内容，并进入对应流程。\n\n把不受支持的文件放进 ZIP，不会使其自动变成受支持格式。工作区备份的恢复与普通文档导入也是不同用途；工作区备份导入属于 Plus。\n\n## 网页与在线内容\n\n### 正文型文章\n\n#### 更适合的页面\n\n公开可访问、正文完整且结构清楚的长文章、博客、技术文章和部分公开文档页面，通常更适合导入。\n\nDeMinds 会尝试识别标题、作者、日期、正文、图片与链接，并减少导航、推荐和页面装饰的干扰。\n\n#### 有专项规则的来源\n\n微信公众号文章、知乎、Medium、Substack、少数派等部分来源具有定向识别与清理规则。无需登录即可显示正文的 X Article 也有专门处理路径。\n\n这些支持针对符合条件的文章，不代表同一网站的首页、个人页、搜索页或所有内容都可以导入。\n\n#### 网页导入预览\n\n在 iPhone、iPad 和 Designed for iPad on Mac 中，网页导入预览可以让你先查看页面，再确认导入。\n\n页面访问限制、复杂动态加载和第三方登录条件仍会影响结果。Safari 登录状态不会自动成为 DeMinds 内的登录状态，预览也不承诺第三方网站登录一定可用。\n\n### GitHub 与远程文件\n\n#### 公开 Markdown 文档\n\n支持公开 README 与 Markdown 文档中的标题锚点、相对图片和可识别的相关文档链接。继续打开文档链接时，按目标内容处理，不自动扫描整个仓库。\n\n#### 文件与仓库根地址\n\n具体 Markdown 文件通常作为普通可编辑内容导入。精确的仓库根地址可以进入 GitHub README 内容源，用于以后手动检查 README 更新。\n\n仓库中的某个文件不会仅因位于 GitHub，就被当作整个仓库的内容源。\n\n#### 受支持的文件链接\n\n公开的 Markdown、文本、HTML、DOCX、XMind、MindNode、FreeMind 和 OPML 等明确文件目标，可以在通过类型、大小与下载检查后进入对应导入流程。\n\n支持文件链接不等于支持任意下载页面、私有链接或所有网盘分享形式。GitHub 支持也不包含私有仓库登录、完整仓库浏览与整仓递归导入。\n\n### 论文与学术文章\n\n#### arXiv HTML 论文\n\n##### 论文内容与阅读\n\n###### 学术信息与章节\n\n保留能够识别的论文标题、作者、机构、arXiv 标识、摘要、参考文献和附录，帮助你沿论文结构继续阅读。\n\n###### 公式、代码与算法\n\n尽量保留能够可靠恢复的数学表达、代码列表、带编号的算法，以及算法中的步骤、缩进和说明。能够识别的提示词模板也会保持可读结构。\n\n###### 表格结构\n\n可以可靠重建的普通表格进入 Markdown 表格。部分具有合并行列、多级表头或分组关系的表格，会以 DeMinds 能够保留的复杂表格形式继续阅读。\n\n复杂表格主要在 Markdown 预览与交互视图中呈现，不会把每个单元格都展开为导图节点。其他 Markdown 工具不一定能以相同方式呈现这些特殊结构。\n\n###### 论文内跳转\n\n保留能够解析的章节、图表、算法和参考文献之间的链接，方便在结构与正文之间连续阅读。\n\n##### HTML 支持的边界\n\n这些能力针对已识别的 arXiv HTML 论文结构，不等于任意 HTML、DOCX、PDF 或 TeX 源文件都具备同样的还原能力，也不包含引用图谱或论文版本自动更新。\n\n部分 arXiv 入口即使带有 `pdf` 路径，也只是转向对应 HTML 版本。HTML 不可用时，不会自动改为 PDF 提取、摘要导入或 OCR。\n\n#### Nature 文章\n\n##### 文章信息与图片\n\n符合条件的 Nature 文章页面可以保留文章信息、正文图片，以及图表和参考文献的页内阅读链接。\n\n##### 表格补入\n\n在受支持的 Apple App 网页导入预览中，同一篇文章的简单表格子页若能够取得并验证，会尽力补入；否则保留原始表格链接，不因此中断主文章导入。\n\n##### 完整正文条件\n\n正文存在明确访问限制、无法取得完整内容时，不将摘要、参考文献等外围信息冒充完整文章导入。\n\n### AI 分享内容\n\n#### 当前支持来源\n\n支持 ChatGPT、DeepSeek、Gemini 和豆包已经实现的分享路径。根据来源和入口，可以通过受支持的公开链接、保存的 HTML 或系统分享进入。\n\n#### 实际导入范围\n\n以分享页面实际公开、能够识别的内容为准。ChatGPT 既有完整对话分享，也有受支持的单条公开回复；单条回复不会被补成完整对话。\n\n代码、列表、表格与常见公式等，按能够识别的内容结构处理。\n\n#### 导入后继续整理\n\n有价值的 AI 内容可以进入通用导图、Markdown 阅读、编辑和导出流程，成为以后还可以维护的工作项目。\n\n#### 账户与内容边界\n\nAI 分享导入不连接你的 AI 账户，不读取私人聊天历史，也不保证恢复分享页面没有公开的附件、工具结果或隐藏内容。\n\n## 内容元素与结构\n\n### 标题、列表与正文\n\n#### 标题与层级\n\n可识别的标题形成主结构与分支。目录、导图节点和 Markdown 标题可以提供不同来源的层级依据。\n\n#### 列表与嵌套\n\n在关系明确时保留列表层次，并参与结构组织。没有足够依据的平级内容，不应被理解为已经自动建立了新的父子关系。\n\n#### 段落、引用与注释\n\n长段落、引用和详细说明保留在正文或节点注释中，避免主导图过度拥挤。适用的结构化注释可单独查看其结构。\n\n### 表格、代码与公式\n\n#### 表格\n\n普通表格主要在正文与注释中阅读。复杂表格按来源和可恢复程度处理，arXiv 专项支持不能泛化为所有格式的复杂表格还原。\n\n#### 代码\n\n保留代码块和行内代码。代码中的标题符号属于代码内容，不应变成正文层级；导入与阅读不意味着执行代码。\n\n#### 公式\n\n支持常见 Markdown 公式，以及 HTML 导入时能够恢复的数学表达。具体呈现可能随公式与阅读表面而有所不同，不等于完整 TeX 排版系统。\n\n### 图片、链接与来源\n\n#### 本地与包内图片\n\n能够定位的本地和包内图片可用于阅读，并在适用的资源打包流程中随文档带走。缺失文件、无法解析的路径或不受支持的资源可能无法显示。\n\n#### 远程图片\n\n保留远程图片引用不等于已保存离线副本。图片可能继续依赖原站点、网络和访问条件；导出结果是否携带图片，需要结合具体导出形式判断。\n\n交互视图在本地文件或 DeMinds 内只读打开时，合规远程图片由用户主动加载；作为公开 HTTPS 网页交付时，可自动加载合规远程图片，失败时保留可重试占位。\n\n#### 文档链接与页内导航\n\n尽量保留外链、可识别的文档链接和页内跳转。能否准确定位取决于目标是否存在，以及该来源的链接是否可以可靠解析。\n\n#### 回看来源\n\n符合条件的网页文章、AI 分享页面与 GitHub 文档，可以保留可追溯的来源信息，并使用适用的来源入口回看原页面。回看来源不等于刷新或重新导入工作稿。\n\n### 音视频与其他附件\n\n音视频及其他附件不能仅因在正文中出现引用，就视为能够完整迁移、离线播放或进入所有导出格式。\n\n可用的预览表现取决于现有资源、格式与运行环境。DeMinds 不因此承诺自动下载、转码、修复媒体，或把图片中的文字自动识别为正文。\n\n## 持续更新的内容源\n\n### Feed\n\n支持经过验证的 RSS、Atom、RDF 和 JSON Feed，将其中提供的内容作为只读内容源保存。\n\nFeed 提供全文，就可以处理 Feed 中的全文；只提供摘要，就只能取得其中的摘要。DeMinds 不自动递归抓取每个条目的完整文章。\n\n`.xml` 或 `.json` 扩展名本身不代表 Feed，需要实际内容符合支持的格式。\n\n### GitHub README\n\n精确的 GitHub 仓库根地址，或对适用 README 的显式转换，可以建立 GitHub README 内容源，保留仓库来源并支持后续手动检查更新。\n\n更新对象是 README，不是整个仓库的文件集合。\n\n### 与普通工作文档的区别\n\n| 普通工作文档 | 内容源 |\n| --- | --- |\n| 编辑和维护自己的工作稿 | 阅读外部来源最近一次成功取得的内容 |\n| 修改后由你保存 | 更新由你手动检查 |\n| 普通导入后不自动跟踪原网页 | 保留受支持的来源关系 |\n| 正文可以继续整理 | 来源本身只读 |\n\n### 检查更新\n\n内容源集中显示在“继续工作”的内容源分支。只有你主动检查时才更新，不在后台自动轮询。\n\n检查失败或取消时，保留最近一次成功取得的内容；没有变化时，不制造新的历史版本。当前不提供完整订阅阅读器中的未读管理、推荐或自动全文采集。\n\n## 保存、带走与继续\n\n### 把内容带入\n\n#### 文件与文件夹\n\n通过平台提供的文件或文件夹选择入口，打开受支持内容。系统文件提供方、目录包和云端文件的可用状态可能影响读取。\n\n#### 剪贴板\n\n从可识别的纯文本、Markdown、富文本、HTML 或支持的图片剪贴板内容建立导入候选。不同应用实际提供的剪贴板内容可能不同。\n\n#### 系统分享\n\n在受支持的 Apple App 环境中，将其他 App 分享的文件、文本、URL 或支持的混合内容发送到 DeMinds，确认后导入。\n\n#### 网页与文件链接\n\n链接会按具体资源类型处理：网页文章、远程文档、AI 分享与内容源各自遵循对应规则。\n\n### 保存工作过程\n\n#### 继续工作\n\n已保存项目可以再次打开和编辑，而不只是保留一条最近文件记录。Standard 当前最多保留 5 个活动项目，Plus 提供更高保留上限。\n\n#### 版本历史\n\n可以查看、比较和恢复适用的工作稿版本。当前保留导入基线、最近 3 个自动历史版本与 1 个固定版本，不等于所有资源的无限版本控制。\n\n#### 本地优先\n\n核心工作流程不要求 DeMinds 账户。Web 使用本地浏览器存储；受支持的 Apple App 可以显式选择本机工作区或 iCloud 工作区。\n\n本地优先不等于所有功能离线。远程导入、在线图片、内容源与 iCloud 仍需要相应网络或系统服务。\n\n### 按用途导出\n\n#### 继续编辑\n\n##### Markdown 文件\n\n适合继续编辑和迁移。导出当前 Markdown 并保留图片引用，不自动附带完整资源目录。属于 Standard。\n\n##### Markdown 标准包\n\n将 Markdown 与可打包的本地图片、资源一起带走，保持适用的相对路径，适合持续维护。从当前项目导出的有效标准包还可携带 DeMinds 能识别的延续信息。属于 Standard。\n\n##### 便携 Markdown\n\n将可处理的图片内嵌到单个 Markdown 文件，适合需要单文件携带的场景。属于 Plus；当前文档与“继续工作”中的可用入口随平台而异，接收工具对内嵌图片的兼容性也可能不同。\n\n#### 阅读与分享\n\n##### PDF 文档\n\n在受支持的 Apple App 环境中，从当前 Markdown 正文生成连续阅读版或分页打印版。属于 Standard。\n\nPDF 导出不等于支持通用 PDF 导入、扫描件识别或 OCR。\n\n##### 导图全图 PNG\n\n把当前完整导图导出为静态图片，按现有能力可包含注释附录。适合展示与分享，属于 Plus。\n\n##### 交互视图\n\n导出单个 `.deminds.html` 文件，可包含正文、通用导图或两者，供接收方只读浏览、折叠分支和阅读注释。创建属于 Plus，接收方阅读不要求 Plus。\n\n在 DeMinds 中首先只读打开；明确选择导入后，才以经过验证的 Markdown 与资源创建可编辑内容。只读打开与显式导入不要求 Plus。\n\n### 借助 AI 继续\n\n#### 准备交付文件\n\n将当前内容准备为 Markdown 标准包，或适合不支持 ZIP 的外部工具使用的单个 AI 编辑文件。属于 Standard。\n\n#### 选择处理目的\n\n可以选择结构优化，或结构与表达优化；也可以附加受支持目标语言的翻译要求。实际处理由你选择的外部 AI 完成。\n\n#### 带回结果\n\n处理后的有效文件返回时，在符合识别条件的情况下回到原项目，先比较外部版本与当前工作稿，再由你确认应用。也可以作为新内容打开。\n\n如果文件缺少足够的原项目识别信息，不能保证自动回接；DeMinds 不会据此猜测关联并静默覆盖。\n\n#### 由你控制交接\n\nDeMinds 负责准备与接回文件，不自动上传内容、调用外部 AI 或自动取回结果。你决定交给谁、处理什么，以及是否应用返回版本。\n","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"b8af8c96ad9065e25fe68383e6ad624aa23a8f52bdeab5dff7a34831cf03986a","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["map"],"defaultMode":"map","mapFit":"contain"},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e通用导图：看清整体\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:0956646c41b650e9fbd6f8e4abfd6fa895b4385300fd746e95efe1f863777552\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0  class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eDeMinds 格式与内容支持\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"DeMinds 格式与内容支持\" data-note-id=\"note:sha256:22cb6e00cf280dab311f15b5a6402de6d64d6ff46a5d7c3ff768e4d7c5683198\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:01f42efede3ea6fda5a765ca49d7255d8820a3edbb5c052a457de47e441df626":{"html":"\u003cp\u003e支持经过验证的 RSS、Atom、RDF 和 JSON Feed，将其中提供的内容作为只读内容源保存。\u003c/p\u003e\n\u003cp\u003eFeed 提供全文，就可以处理 Feed 中的全文；只提供摘要，就只能取得其中的摘要。DeMinds 不自动递归抓取每个条目的完整文章。\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e.xml\u003c/code\u003e 或 \u003ccode\u003e.json\u003c/code\u003e 扩展名本身不代表 Feed，需要实际内容符合支持的格式。\u003c/p\u003e\n","kind":"html","rawMarkdown":"支持经过验证的 RSS、Atom、RDF 和 JSON Feed，将其中提供的内容作为只读内容源保存。\n\nFeed 提供全文，就可以处理 Feed 中的全文；只提供摘要，就只能取得其中的摘要。DeMinds 不自动递归抓取每个条目的完整文章。\n\n`.xml` 或 `.json` 扩展名本身不代表 Feed，需要实际内容符合支持的格式。","sourceFormat":"markdown"},"note:sha256:03e20a4dc14fa9e822a77e7f432d0e6f985da9aff487f09843ea1a825e500cec":{"html":"\u003cp\u003e支持受支持的 \u003ccode\u003e.mindnode\u003c/code\u003e 文件与目录包，保留可表达的层级、注释、图片，以及部分能够恢复的标题富文本与样式；能够处理受支持的多主节点内容。目录包选择方式受平台与文件提供方影响。\u003c/p\u003e\n","kind":"html","rawMarkdown":"支持受支持的 `.mindnode` 文件与目录包，保留可表达的层级、注释、图片，以及部分能够恢复的标题富文本与样式；能够处理受支持的多主节点内容。目录包选择方式受平台与文件提供方影响。","sourceFormat":"markdown"},"note:sha256:03ed23fbbbe133be631c30ac774cd2d353d96ce3172f661c03495b40db6b1340":{"html":"\u003cp\u003e在关系明确时保留列表层次，并参与结构组织。没有足够依据的平级内容，不应被理解为已经自动建立了新的父子关系。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在关系明确时保留列表层次，并参与结构组织。没有足够依据的平级内容，不应被理解为已经自动建立了新的父子关系。","sourceFormat":"markdown"},"note:sha256:0473e4c64ba1e87ef9232265e8e9cf73c8341c82de00afd3055c91904658240f":{"html":"\u003cp\u003e在受支持的 Apple App 环境中，将其他 App 分享的文件、文本、URL 或支持的混合内容发送到 DeMinds，确认后导入。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在受支持的 Apple App 环境中，将其他 App 分享的文件、文本、URL 或支持的混合内容发送到 DeMinds，确认后导入。","sourceFormat":"markdown"},"note:sha256:04c2e55f8acf71e4fdff8ab5523ac4b2cf6b033e0ee3bbdb9fd4f3a29da2ce64":{"html":"\u003cp\u003eDeMinds 覆盖 Web、iPhone、iPad 和 Designed for iPad on Mac。文件选择、系统分享、网页导入预览和部分导出入口并不完全相同。\u003c/p\u003e\n\u003cp\u003eDesigned for iPad on Mac 是 iPad App 在兼容 Mac 上的运行形态，不等于独立 macOS App；窄屏 Web 也不等于 iPhone App。\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds 覆盖 Web、iPhone、iPad 和 Designed for iPad on Mac。文件选择、系统分享、网页导入预览和部分导出入口并不完全相同。\n\nDesigned for iPad on Mac 是 iPad App 在兼容 Mac 上的运行形态，不等于独立 macOS App；窄屏 Web 也不等于 iPhone App。","sourceFormat":"markdown"},"note:sha256:08447d574b0bc116fb982ba88d2a8e38da61cb248fab57448a02e4a781bffdc6":{"html":"\u003cp\u003e微信公众号文章、知乎、Medium、Substack、少数派等部分来源具有定向识别与清理规则。无需登录即可显示正文的 X Article 也有专门处理路径。\u003c/p\u003e\n\u003cp\u003e这些支持针对符合条件的文章，不代表同一网站的首页、个人页、搜索页或所有内容都可以导入。\u003c/p\u003e\n","kind":"html","rawMarkdown":"微信公众号文章、知乎、Medium、Substack、少数派等部分来源具有定向识别与清理规则。无需登录即可显示正文的 X Article 也有专门处理路径。\n\n这些支持针对符合条件的文章，不代表同一网站的首页、个人页、搜索页或所有内容都可以导入。","sourceFormat":"markdown"},"note:sha256:08cfcf360c5b2fd117ddf426488e11f23b1d5ac39811669bc1b8627cb7eac9eb":{"html":"\u003cp\u003e普通表格主要在正文与注释中阅读。复杂表格按来源和可恢复程度处理，arXiv 专项支持不能泛化为所有格式的复杂表格还原。\u003c/p\u003e\n","kind":"html","rawMarkdown":"普通表格主要在正文与注释中阅读。复杂表格按来源和可恢复程度处理，arXiv 专项支持不能泛化为所有格式的复杂表格还原。","sourceFormat":"markdown"},"note:sha256:0956646c41b650e9fbd6f8e4abfd6fa895b4385300fd746e95efe1f863777552":{"html":"\u003cp\u003e根据可识别的标题、列表与正文关系生成结构，支持展开分支、搜索、定位、平移和缩放，方便先看全貌，再进入细节。\u003c/p\u003e\n","kind":"html","rawMarkdown":"根据可识别的标题、列表与正文关系生成结构，支持展开分支、搜索、定位、平移和缩放，方便先看全貌，再进入细节。","sourceFormat":"markdown"},"note:sha256:099eae489fb7e41357e371e900bc87ac29d7ea1842cb19ecb634be0e71aa627b":{"html":"\u003cp\u003e已保存项目可以再次打开和编辑，而不只是保留一条最近文件记录。Standard 当前最多保留 5 个活动项目，Plus 提供更高保留上限。\u003c/p\u003e\n","kind":"html","rawMarkdown":"已保存项目可以再次打开和编辑，而不只是保留一条最近文件记录。Standard 当前最多保留 5 个活动项目，Plus 提供更高保留上限。","sourceFormat":"markdown"},"note:sha256:09c195e19ddc5c3769e115ab38927aafba484130f18f9d43ed431da083d49e15":{"html":"\u003cp\u003e主要格式导入、Markdown 阅读与编辑、通用导图、内容源、版本历史、Markdown 文件与标准包导出，以及“借助 AI 继续”属于 Standard 核心能力。\u003c/p\u003e\n\u003cp\u003e原始导图、导图全图 PNG、便携 Markdown、交互视图创建、工作区备份导入及更高的项目保留上限属于 Plus。具体入口同时受平台与内容条件约束。\u003c/p\u003e\n","kind":"html","rawMarkdown":"主要格式导入、Markdown 阅读与编辑、通用导图、内容源、版本历史、Markdown 文件与标准包导出，以及“借助 AI 继续”属于 Standard 核心能力。\n\n原始导图、导图全图 PNG、便携 Markdown、交互视图创建、工作区备份导入及更高的项目保留上限属于 Plus。具体入口同时受平台与内容条件约束。","sourceFormat":"markdown"},"note:sha256:0ef70cf05c6b86037f084e2063860f01bcc94fe3c18d29df83ca15adb2ed43c7":{"html":"\u003cp\u003e内容源集中显示在“继续工作”的内容源分支。只有你主动检查时才更新，不在后台自动轮询。\u003c/p\u003e\n\u003cp\u003e检查失败或取消时，保留最近一次成功取得的内容；没有变化时，不制造新的历史版本。当前不提供完整订阅阅读器中的未读管理、推荐或自动全文采集。\u003c/p\u003e\n","kind":"html","rawMarkdown":"内容源集中显示在“继续工作”的内容源分支。只有你主动检查时才更新，不在后台自动轮询。\n\n检查失败或取消时，保留最近一次成功取得的内容；没有变化时，不制造新的历史版本。当前不提供完整订阅阅读器中的未读管理、推荐或自动全文采集。","sourceFormat":"markdown"},"note:sha256:1a464eb24431c9a8e44bbf0c1d9c70078e4ac53b700ecc4284e9ba007e11fd09":{"html":"\u003cp\u003e提取标题、段落、列表、可转换表格、图片等内容，并保留导入的原始 DOCX。适合把办公文档带入 Markdown 工作流程。\u003c/p\u003e\n","kind":"html","rawMarkdown":"提取标题、段落、列表、可转换表格、图片等内容，并保留导入的原始 DOCX。适合把办公文档带入 Markdown 工作流程。","sourceFormat":"markdown"},"note:sha256:1be92bf0f2042dd5e6156556f586630b1702aeee9210ba4428025c15da90c976":{"html":"\u003cp\u003e导图导入后，可以形成可继续维护的 Markdown 与通用导图。通用导图用于跨格式阅读、结构检查和后续维护。\u003c/p\u003e\n\u003cp\u003e对于具有可恢复来源的导图文件，DeMinds Plus 还可提供原始导图视图，帮助查看原文件中能够恢复的结构与视觉表达。Markdown、网页等来源不会因此获得原始导图。\u003c/p\u003e\n","kind":"html","rawMarkdown":"导图导入后，可以形成可继续维护的 Markdown 与通用导图。通用导图用于跨格式阅读、结构检查和后续维护。\n\n对于具有可恢复来源的导图文件，DeMinds Plus 还可提供原始导图视图，帮助查看原文件中能够恢复的结构与视觉表达。Markdown、网页等来源不会因此获得原始导图。","sourceFormat":"markdown"},"note:sha256:208e61c4e0aae083272a2460413bc8ae71ee89db2c18c5d13e76a75765af298e":{"html":"\u003cp\u003e支持 \u003ccode\u003e.mm\u003c/code\u003e 的树结构、NOTE / DETAILS 内容、链接及能够定位的图片资源。\u003c/p\u003e\n","kind":"html","rawMarkdown":"支持 `.mm` 的树结构、NOTE / DETAILS 内容、链接及能够定位的图片资源。","sourceFormat":"markdown"},"note:sha256:20bb665f06409c38f0fb7c5026576865c46b17f19d24aeac9786d0465db3c264":{"html":"\u003cp\u003e保留能够解析的章节、图表、算法和参考文献之间的链接，方便在结构与正文之间连续阅读。\u003c/p\u003e\n","kind":"html","rawMarkdown":"保留能够解析的章节、图表、算法和参考文献之间的链接，方便在结构与正文之间连续阅读。","sourceFormat":"markdown"},"note:sha256:20f852c1bb59b3cd809a4235ed430467d64143cfed1007a6c8f4cfc30b488047":{"html":"\u003cp\u003e能够定位且处于支持范围内的相关图片，会随所选内容一同处理。已选文档之间可识别的标准 Markdown 链接，可以成为继续阅读的导航。\u003c/p\u003e\n\u003cp\u003e只保留图片引用与实际携带图片文件是两回事。资源缺失、路径无法解析或超出所选资源范围时，不能保证图片随内容完整迁移。\u003c/p\u003e\n","kind":"html","rawMarkdown":"能够定位且处于支持范围内的相关图片，会随所选内容一同处理。已选文档之间可识别的标准 Markdown 链接，可以成为继续阅读的导航。\n\n只保留图片引用与实际携带图片文件是两回事。资源缺失、路径无法解析或超出所选资源范围时，不能保证图片随内容完整迁移。","sourceFormat":"markdown"},"note:sha256:22cb6e00cf280dab311f15b5a6402de6d64d6ff46a5d7c3ff768e4d7c5683198":{"html":"\u003cp\u003e\u003cstrong\u003e如果一份内容值得继续读、继续整理，或者以后还想回来继续工作，可以先试着交给 DeMinds。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从 Markdown、Obsidian 笔记和思维导图，到 DOCX、网页文章、HTML 论文与 AI 分享内容，DeMinds 会尽量保留可识别的内容、结构、图片、链接与来源关系，让它们进入可以持续维护的工作流程。\u003c/p\u003e\n\u003cp\u003e本文按 DeMinds V1.0 / 1.0.38 的当前能力整理，核对日期为 2026 年 9 月 14 日。不同格式的支持重点与保真程度不同，具体入口还受运行平台和内容访问条件影响。\u003c/p\u003e\n","kind":"html","rawMarkdown":"**如果一份内容值得继续读、继续整理，或者以后还想回来继续工作，可以先试着交给 DeMinds。**\n\n从 Markdown、Obsidian 笔记和思维导图，到 DOCX、网页文章、HTML 论文与 AI 分享内容，DeMinds 会尽量保留可识别的内容、结构、图片、链接与来源关系，让它们进入可以持续维护的工作流程。\n\n本文按 DeMinds V1.0 / 1.0.38 的当前能力整理，核对日期为 2026 年 9 月 14 日。不同格式的支持重点与保真程度不同，具体入口还受运行平台和内容访问条件影响。","sourceFormat":"markdown"},"note:sha256:32f7e791ebb943bbd676208181c4dc28b341650642089281025f147bcb86cbab":{"html":"\u003cp\u003e支持常见 Markdown 公式，以及 HTML 导入时能够恢复的数学表达。具体呈现可能随公式与 :"html","rawMarkdown":"在受支持的 Apple App 网页导入预览中，同一篇文章的简单表格子页若能够取得并验证，会尽力补入；否则保留原始表格链接，不因此中断主文章导入。","sourceFormat":"markdown"},"note:sha256:93dd62ef6b387f151c1dfeaa0d93c6d1fdf31063a39717fe2bf1f246923d1915":{"html":"\u003cp\u003e正文存在明确访问限制、无法取得完整内容时，不将摘要、参考文献等外围信息冒充完整文章导入。\u003c/p\u003e\n","kind":"html","rawMarkdown":"正文存在明确访问限制、无法取得完整内容时，不将摘要、参考文献等外围信息冒充完整文章导入。","sourceFormat":"markdown"},"note:sha256:96dda9e79b19a9824348963bbca0b085666e82532e7377ff9d73fc92c56a3b26":{"html":"\u003cp\u003e支持处理常见 Markdown 文档链接、Wiki Link，以及能够唯一定位的静态 Wiki 图片嵌入，例如 \u003ccode\u003e![[image.png]]\u003c/code\u003e。可解析的相对路径图片也会按适用规则处理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"支持处理常见 Markdown 文档链接、Wiki Link，以及能够唯一定位的静态 Wiki 图片嵌入，例如 `![[image.png]]`。可解析的相对路径图片也会按适用规则处理。","sourceFormat":"markdown"},"note:sha256:98e3a54ff30f2442eee979dbbcd71d3a01fb0891232cddb0f91d3ceb9d648559":{"html":"\u003cp\u003e长段落、引用和详细说明保留在正文或节点注释中，避免主导图过度拥挤。适用的结构化注释可单独查看其结构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"长段落、引用和详细说明保留在正文或节点注释中，避免主导图过度拥挤。适用的结构化注释可单独查看其结构。","sourceFormat":"markdown"},"note:sha256:9aa8396d75aab8e3b6c3361461d3d382b02db06ea1f1ea16879dc9d30177c6df":{"html":"\u003cp\u003e各格式都会尽量保留主结构、节点内容、注释、图片与链接，但不保证复刻所有复杂布局、私有样式和特殊对象。\u003c/p\u003e\n\u003cp\u003e后续维护的是当前 Markdown 工作稿，不直接改写外部 MindNode、XMind 或 \u003ccode\u003e.mm\u003c/code\u003e 文件，也不承诺把编辑结果完整回写为原厂商格式。\u003c/p\u003e\n","kind":"html","rawMarkdown":"各格式都会尽量保留主结构、节点内容、注释、图片与链接，但不保证复刻所有复杂布局、私有样式和特殊对象。\n\n后续维护的是当前 Markdown 工作稿，不直接改写外部 MindNode、XMind 或 `.mm` 文件，也不承诺把编辑结果完整回写为原厂商格式。","sourceFormat":"markdown"},"note:sha256:9dd0138be2582bcf405481d30e6345d900082672b5c0ddde0505046f32b97564":{"html":"\u003cp\u003eMarkdown 与通用导图是同一份结构化内容的两种工作表面。Markdown 承载可维护的正文，通用导图帮助你浏览整体关系。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Markdown 与通用导图是同一份结构化内容的两种工作表面。Markdown 承载可维护的正文，通用导图帮助你浏览整体关系。","sourceFormat":"markdown"},"note:sha256:a4d9def232026f8d8506ddfe7b6700eeb2f1cfec393d254edeb4aab92fd18343":{"html":"\u003cp\u003e这些能力针对已识别的 arXiv HTML 论文结构，不等于任意 HTML、DOCX、PDF 或 TeX 源文件都具备同样的还原能力，也不包含引用图谱或论文版本自动更新。\u003c/p\u003e\n\u003cp\u003e部分 arXiv 入口即使带有 \u003ccode\u003epdf\u003c/code\u003e 路径，也只是转向对应 HTML 版本。HTML 不可用时，不会自动改为 PDF 提取、摘要导入或 OCR。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这些能力针对已识别的 arXiv HTML 论文结构，不等于任意 HTML、DOCX、PDF 或 TeX 源文件都具备同样的还原能力，也不包含引用图谱或论文版本自动更新。\n\n部分 arXiv 入口即使带有 `pdf` 路径，也只是转向对应 HTML 版本。HTML 不可用时，不会自动改为 PDF 提取、摘要导入或 OCR。","sourceFormat":"markdown"},"note:sha256:a9cd73b3c53d5872713810ee2af0850090a784c3f5611a9d1e5391bef0aa5f47":{"html":"\u003cp\u003e支持保存的 HTML，不代表支持所有浏览器专有网页归档格式；网页脚本、交互控件与页面装饰也不等于可维护正文。\u003c/p\u003e\n","kind":"html","rawMarkdown":"支持保存的 HTML，不代表支持所有浏览器专有网页归档格式；网页脚本、交互控件与页面装饰也不等于可维护正文。","sourceFormat":"markdown"},"note:sha256:b13bc1eee4448cefc9b51852a26d204ed8658a7386f2587517fa1fab18cde5b8":{"html":"\u003cp\u003e保留代码块和行内代码。代码中的标题符号属于代码内容，不应变成正文层级；导入与阅读不意味着执行代码。\u003c/p\u003e\n","kind":"html","rawMarkdown":"保留代码块和行内代码。代码中的标题符号属于代码内容，不应变成正文层级；导入与阅读不意味着执行代码。","sourceFormat":"markdown"},"note:sha256:b3042b8a7935482864eeb4fe2eb70f551cd72bc771c4ff53cf2746ab797da896":{"html":"\u003cp\u003eDeMinds 会利用所选内容的目录与笔记关系组织结构，包括能够识别的 Folder Note，也就是用于说明某个目录的笔记。它不只是把多份 \u003ccode\u003e.md\u003c/code\u003e 首尾拼接。\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds 会利用所选内容的目录与笔记关系组织结构，包括能够识别的 Folder Note，也就是用于说明某个目录的笔记。它不只是把多份 `.md` 首尾拼接。","sourceFormat":"markdown"},"note:sha256:b326d91417efcfc101133285db35d8bc1095746e260f885d01c58ae1016c9037":{"html":"\u003cp\u003e本文是面向用户的能力说明，不替代项目现有事实源，也不新增格式、平台或权益承诺。本次已核对产品功能事实源，无须改动其能力定义。\u003c/p\u003e\n\u003cp\u003e主要依据为\u003ca\u003e产品功能事实源\u003c/a\u003e、\u003ca\u003e导入资源类型规范\u003c/a\u003e、\u003ca\u003e格式兼容矩阵\u003c/a\u003e与\u003ca\u003e产品术语表\u003c/a\u003e，并交叉核对相关解析入口、权限配置及发布记录。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本文是面向用户的能力说明，不替代项目现有事实源，也不新增格式、平台或权益承诺。本次已核对产品功能事实源，无须改动其能力定义。\n\n主要依据为[产品功能事实源](./product/DeMinds-Product-Feature-Fact-Source.md)、[导入资源类型规范](./strategy/ImportResourceTypeRoutingStrategy.zh-CN.md)、[格式兼容矩阵](../COMPATIBILITY_MATRIX.md)与[产品术语表](./product/DeMinds-terminology.multilingual.md)，并交叉核对相关解析入口、权限配置及发布记录。","sourceFormat":"markdown"},"note:sha256:b467a3b1b26a4faf3b9b50e4fff50cd59bf6bd8749d9595a0cfa7ffd8ec79da1":{"html":"\u003cp\u003e公开的 Markdown、文本、HTML、DOCX、XMind、MindNode、FreeMind 和 OPML 等明确文件目标，可以在通过类型、大小与下载检查后进入对应导入流程。\u003c/p\u003e\n\u003cp\u003e支持文件链接不等于支持任意下载页面、私有链接或所有网盘分享形式。GitHub 支持也不包含私有仓库登录、完整仓库浏览与整仓递归导入。\u003c/p\u003e\n","kind":"html","rawMarkdown":"公开的 Markdown、文本、HTML、DOCX、XMind、MindNode、FreeMind 和 OPML 等明确文件目标，可以在通过类型、大小与下载检查后进入对应导入流程。\n\n支持文件链接不等于支持任意下载页面、私有链接或所有网盘分享形式。GitHub 支持也不包含私有仓库登录、完整仓库浏览与整仓递归导入。","sourceFormat":"markdown"},"note:sha256:b61a4a910e9880b12c93edabc28d4fa47ca3ef18514267b9143822d67aaa17d0":{"html":"\u003cp\u003e可以可靠重建的普通表格进入 Markdown 表格。部分具有合并行列、多级表头或分组关系的表格，会以 DeMinds 能够保留的复杂表格形式继续阅读。\u003c/p\u003e\n\u003cp\u003e复杂表格主要在 Markdown 预览与交互视图中呈现，不会把每个单元格都展开为导图节点。其他 Markdown 工具不一定能以相同方式呈现这些特殊结构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"可以可靠重建的普通表格进入 Markdown 表格。部分具有合并行列、多级表头或分组关系的表格，会以 DeMinds 能够保留的复杂表格形式继续阅读。\n\n复杂表格主要在 Markdown 预览与交互视图中呈现，不会把每个单元格都展开为导图节点。其他 Markdown 工具不一定能以相同方式呈现这些特殊结构。","sourceFormat":"markdown"},"note:sha256:b7ac5fc249cd1307bef9eca74c1e737694bcb04ea22e78e85b99938d12525c52":{"html":"\u003cp\u003eZIP 和文件夹是容器。DeMinds 会根据内部结构识别 Markdown 包、导图包、工作区备份或其他受支持内容，并进入对应流程。\u003c/p\u003e\n\u003cp\u003e把不受支持的文件放进 ZIP，不会使其自动变成受支持格式。工作区备份的恢复与普通文档导入也是不同用途；工作区备份导入属于 Plus。\u003c/p\u003e\n","kind":"html","rawMarkdown":"ZIP 和文件夹是容器。DeMinds 会根据内部结构识别 Markdown 包、导图包、工作区备份或其他受支持内容，并进入对应流程。\n\n把不受支持的文件放进 ZIP，不会使其自动变成受支持格式。工作区备份的恢复与普通文档导入也是不同用途；工作区备份导入属于 Plus。","sourceFormat":"markdown"},"note:sha256:b92ee4cf84a8a32bea6951f5fade536df782818c39ff56963b59f4841c5dd6fd":{"html":"\u003cp\u003e以分享页面实际公开、能够识别的内容为准。ChatGPT 既有完整对话分享，也有受支持的单条公开回复；单条回复不会被补成完整对话。\u003c/p\u003e\n\u003cp\u003e代码、列表、表格与常见公式等，按能够识别的内容结构处理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"以分享页面实际公开、能够识别的内容为准。ChatGPT 既有完整对话分享，也有受支持的单条公开回复；单条回复不会被补成完整对话。\n\n代码、列表、表格与常见公式等，按能够识别的内容结构处理。","sourceFormat":"markdown"},
