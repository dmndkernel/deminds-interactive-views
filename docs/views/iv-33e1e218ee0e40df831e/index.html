的防御。"},{"children":[],"kind":"leaf","title":"调查还发现，被 Moonshot 转发给 Claude 的用户查询中包含多名客户的敏感信息。我们不知道 Moonshot 是否通知客户：其请求被重新路由给 Anthropic，并暴露给第三方。"},{"children":[{"title":"**与 PLA 有关的监控活动。** 一名我们评估很可能与 PLA 有关联的用户，使用其以为是 Moonshot Kimi 的模型，加载针对单一目标个人的 CCTV 监控档案。用户让 Kimi 分析 CCTV 数据，以判断被跟踪人员是否存在异常行为。数据包含成都数百个摄像头的视频监控，其中包括 PLA 设施外部、China Electronics Technology Group Corporation 关联机构外部，以及一家大型国有企业外部的摄像头。"},{"title":"**大型中国国企的一名工程师。** 一名工程师使用 Kimi 为大型中国国企构建内部系统。在使用 Kimi 时，他暴露了多家大型中国公司的内部代码和仍然有效的凭据，其中包括知名科技公司。用户没有任何办法知道自己的 Kimi 使用过程被转发给 Claude。"}],"kind":"section","title":"其中包括"},{"children":[],"kind":"leaf","title":"2026 年 5 月至 7 月期间归因于 Moonshot 的蒸馏攻击规模：观察到超过 2,300 万次交流。"}],"html":"\u003cp\u003e我们发现，Kimi 系列模型的开发商 Moonshot AI 会在用户不知情的情况下，把客户请求转发给 Claude，而不是由 Kimi 自身处理；随后再把 Claude 的回答展示给用户。这些用户以为自己正在使用 Kimi，实际收到的却是 Claude 的响应。\u003c/p\u003e\n\u003cp\u003e一个实例中，Moonshot 在 10 天内向 Anthropic 中继了近 30 万条客户请求，绝大多数被路由到 Opus。Moonshot 使用由 5,380 个欺诈账号组成的代理服务网络，其中大多数看起来位于新加坡和日本。\u003c/p\u003e\n\u003cp\u003e除了把 Claude 的回答直接提供给客户，Moonshot 还捕获并保存了至少部分交流。它建立了 CoT 提取流水线，从这些已保存的中继会话中提取 Claude 的 CoT 记录用于训练模型，也从其他渠道收集 CoT。\u003c/p\u003e\n\u003cp\u003e为降低未经授权蒸馏风险，Claude 返回时不会直接提供原始思维，而是返回对原始思维的引用——“thinking signature”。API 在后续调用中可通过这一签名查找原始推理轨迹。Moonshot 绕过了这一控制：保存 Claude 响应中的 reasoning signature，开启新会话，再诱导 Claude 把签名还原为完整推理轨迹。这种跨会话重放攻击让非法蒸馏行为者能够收集 CoT 推理记录。我们正在引入新方法强化对这类战术的防御。\u003c/p\u003e\n\u003cp\u003e调查还发现，被 Moonshot 转发给 Claude 的用户查询中包含多名客户的敏感信息。我们不知道 Moonshot 是否通知客户：其请求被重新路由给 Anthropic，并暴露给第三方。\u003c/p\u003e\n\u003cp\u003e其中包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e与 PLA 有关的监控活动。\u003c/strong\u003e 一名我们评估很可能与 PLA 有关联的用户，使用其以为是 Moonshot Kimi 的模型，加载针对单一目标个人的 CCTV 监控档案。用户让 Kimi 分析 CCTV 数据，以判断被跟踪人员是否存在异常行为。数据包含成都数百个摄像头的视频监控，其中包括 PLA 设施外部、China Electronics Technology Group Corporation 关联机构外部，以及一家大型国有企业外部的摄像头。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e大型中国国企的一名工程师。\u003c/strong\u003e 一名工程师使用 Kimi 为大型中国国企构建内部系统。在使用 Kimi 时，他暴露了多家大型中国公司的内部代码和仍然有效的凭据，其中包括知名科技公司。用户没有任何办法知道自己的 Kimi 使用过程被转发给 Claude。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003e2026 年 5 月至 7 月期间归因于 Moonshot 的蒸馏攻击规模：观察到超过 2,300 万次交流。\u003c/em\u003e\u003c/p\u003e\n","kind":"structured","rawMarkdown":"我们发现，Kimi 系列模型的开发商 Moonshot AI 会在用户不知情的情况下，把客户请求转发给 Claude，而不是由 Kimi 自身处理；随后再把 Claude 的回答展示给用户。这些用户以为自己正在使用 Kimi，实际收到的却是 Claude 的响应。\n\n一个实例中，Moonshot 在 10 天内向 Anthropic 中继了近 30 万条客户请求，绝大多数被路由到 Opus。Moonshot 使用由 5,380 个欺诈账号组成的代理服务网络，其中大多数看起来位于新加坡和日本。\n\n除了把 Claude 的回答直接提供给客户，Moonshot 还捕获并保存了至少部分交流。它建立了 CoT 提取流水线，从这些已保存的中继会话中提取 Claude 的 CoT 记录用于训练模型，也从其他渠道收集 CoT。\n\n为降低未经授权蒸馏风险，Claude 返回时不会直接提供原始思维，而是返回对原始思维的引用——“thinking signature”。API 在后续调用中可通过这一签名查找原始推理轨迹。Moonshot 绕过了这一控制：保存 Claude 响应中的 reasoning signature，开启新会话，再诱导 Claude 把签名还原为完整推理轨迹。这种跨会话重放攻击让非法蒸馏行为者能够收集 CoT 推理记录。我们正在引入新方法强化对这类战术的防御。\n\n调查还发现，被 Moonshot 转发给 Claude 的用户查询中包含多名客户的敏感信息。我们不知道 Moonshot 是否通知客户：其请求被重新路由给 Anthropic，并暴露给第三方。\n\n其中包括：\n\n- **与 PLA 有关的监控活动。** 一名我们评估很可能与 PLA 有关联的用户，使用其以为是 Moonshot Kimi 的模型，加载针对单一目标个人的 CCTV 监控档案。用户让 Kimi 分析 CCTV 数据，以判断被跟踪人员是否存在异常行为。数据包含成都数百个摄像头的视频监控，其中包括 PLA 设施外部、China Electronics Technology Group Corporation 关联机构外部，以及一家大型国有企业外部的摄像头。\n- **大型中国国企的一名工程师。** 一名工程师使用 Kimi 为大型中国国企构建内部系统。在使用 Kimi 时，他暴露了多家大型中国公司的内部代码和仍然有效的凭据，其中包括知名科技公司。用户没有任何办法知道自己的 Kimi 使用过程被转发给 Claude。\n\n*2026 年 5 月至 7 月期间归因于 Moonshot 的蒸馏攻击规模：观察到超过 2,300 万次交流。*","sourceFormat":"markdown"},"note:sha256:aed70a759fb51462fb12eebfc9860e466e5f0c92b165a874251d4a5983918b8e":{"html":"\u003cp\u003e自 2025 年 11 月发布上一份\u003ca href=\"https://www.anthropic.com/news/disrupting-AI-espionage\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e威胁报告\u003c/a\u003e以来，我们识别出新的威胁行为者类别，他们以违反 Usage Policy 和服务条款的方式滥用 Claude。其中一类是使用 Claude 为常规武器开发软件，包括枪械、导弹、武装无人机、炸弹和其他弹药，以及用于操作这些武器的瞄准与控制系统。与本报告同步，Anthropic 的 Frontier Red Team 开发了\u003ca href=\"https://www.anthropic.com/research/intelligence-targeting-conventional-weapons-capabilities\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e新的评估\u003c/a\u003e，用于衡量 AI 在战术情报目标定位（例如根据零散信息寻找人员所在位置）和常规武器开发（例如设计可打击移动目标的无人机）方面的能力。评估显示，模型在模拟情报和武器开发任务上正在持续进步。\u003c/p\u003e\n\u003cp\u003e过去一年，我们的威胁情报团队调查并阻断了多个使用 Claude 开发武器设计与研发软件，或为武器项目所依赖的情报收集和采购提供支持的威胁行为者。本报告披露其中六个案例：三个在中国、两个在俄罗斯、一个在也门。\u003c/p\u003e\n\u003cp\u003e历史上，这类活动通常由政府、联合国专家组和外部调查者通过追回的硬件和公开来源拼接还原。但作为前沿模型供应商，如果我们检测到威胁行为者违反 Usage Policy 和服务条款，可以直接从平台侧识别这些活动。一旦发现，我们会封禁违规账号，把调查发现纳入安全措施以防止未来滥用，并向公共和私营部门伙伴提供信息，以缓解已识别的威胁。\u003c/p\u003e\n\u003cp\u003e本节六个案例分为两部分。第一部分包含四个行为者直接使用 Claude 为武器本身开发软件的案例：一个制导火箭项目，行为者进行了真实野外测试；一项反鱼雷系统设计和提案工作；一个无人机蜂群软件项目，在仿真中测试且代码已加载到真实开发板；以及用于电子战和压制防空系统的目标软件。第二部分包含两个使用 Claude 进行采购和情报收集的案例：一名行为者为俄罗斯国防客户采购军民两用品，另一名行为者收集关于定向能武器及其供应链的公开信息。\u003c/p\u003e\n\u003cp\u003e我们已经把这些调查发现用于改进防护，并刚刚上线一组新的分类器，用于更好地检测和阻断与高当量爆炸物及武器开发有关的流量。\u003c/p\u003e\n\u003cp\u003e我们希望本报告能够帮助安全社区、政府和公民社会共同防范 AI 工具被用于常规武器开发。\u003c/p\u003e\n","kind":"html","rawMarkdown":"自 2025 年 11 月发布上一份[威胁报告](https://www.anthropic.com/news/disrupting-AI-espionage)以来，我们识别出新的威胁行为者类别，他们以违反 Usage Policy 和服务条款的方式滥用 Claude。其中一类是使用 Claude 为常规武器开发软件，包括枪械、导弹、武装无人机、炸弹和其他弹药，以及用于操作这些武器的瞄准与控制系统。与本报告同步，Anthropic 的 Frontier Red Team 开发了[新的评估](https://www.anthropic.com/research/intelligence-targeting-conventional-weapons-capabilities)，用于衡量 AI 在战术情报目标定位（例如根据零散信息寻找人员所在位置）和常规武器开发（例如设计可打击移动目标的无人机）方面的能力。评估显示，模型在模拟情报和武器开发任务上正在持续进步。\n\n过去一年，我们的威胁情报团队调查并阻断了多个使用 Claude 开发武器设计与研发软件，或为武器项目所依赖的情报收集和采购提供支持的威胁行为者。本报告披露其中六个案例：三个在中国、两个在俄罗斯、一个在也门。\n\n历史上，这类活动通常由政府、联合国专家组和外部调查者通过追回的硬件和公开来源拼接还原。但作为前沿模型供应商，如果我们检测到威胁行为者违反 Usage Policy 和服务条款，可以直接从平台侧识别这些活动。一旦发现，我们会封禁违规账号，把调查发现纳入安全措施以防止未来滥用，并向公共和私营部门伙伴提供信息，以缓解已识别的威胁。\n\n本节六个案例分为两部分。第一部分包含四个行为者直接使用 Claude 为武器本身开发软件的案例：一个制导火箭项目，行为者进行了真实野外测试；一项反鱼雷系统设计和提案工作；一个无人机蜂群软件项目，在仿真中测试且代码已加载到真实开发板；以及用于电子战和压制防空系统的目标软件。第二部分包含两个使用 Claude 进行采购和情报收集的案例：一名行为者为俄罗斯国防客户采购军民两用品，另一名行为者收集关于定向能武器及其供应链的公开信息。\n\n我们已经把这些调查发现用于改进防护，并刚刚上线一组新的分类器，用于更好地检测和阻断与高当量爆炸物及武器开发有关的流量。\n\n我们希望本报告能够帮助安全社区、政府和公民社会共同防范 AI 工具被用于常规武器开发。","sourceFormat":"markdown"},"note:sha256:b08c9bdb8c6410ad268f71db6be798f2f2aeea6ac92984a602e4bd01b94910de":{"blocks":[{"children":[],"kind":"leaf","title":"调查发现，DeepSeek 也采用了与 Moonshot 类似的策略。DeepSeek 建立 CoT 提取流水线，依赖前文所述的同一种跨会话重放攻击；同时也在不通知 DeepSeek 客户的情况下，把交流静默中继给 Claude。与 GTG-16002 类似，其客户很可能并不知道自己的请求被转交给 Claude。"},{"children":[],"kind":"leaf","title":"调查显示，DeepSeek 重点针对 Opus 的推理轨迹，使用与 Moonshot 相似的方法。它利用 reasoning signature，通过同样的跨会话重放攻击提取 CoT 记录并绕过技术控制，从而外传原本会被摘要处理的推理轨迹。"},{"children":[],"kind":"leaf","title":"DeepSeek 会把原本试图通过第三方或 Anthropic 编程 Harness 使用 DeepSeek 模型的用户请求重新路由给 Claude，例如 Claude Code、Claude Agent SDK 或 OpenCode。DeepSeek 检查入站请求中的特定字符串，给使用这些第三方 Harness 的用户打标签，再把部分已标记用户的请求转发给 Claude Opus。这些敏感数据很可能在 DeepSeek 客户不知情、也未同意的情况下被路由给 Anthropic。"},{"children":[{"title":"**一家中国科技公司。** 一名中国科技公司员工使用其以为是 DeepSeek 的模型分析内部文档，DeepSeek 把这些数据中继给 Claude。数据包含敏感信息，例如一个旗舰 AI 项目的完整规格、组织架构和战略目标。该公司几乎肯定没有被告知其数据被转发给 Claude。"},{"title":"**俄罗斯国防机构。** DeepSeek 转发了一名 IT 操作者的请求，此人正在处理与俄罗斯国防部有关的政府机构数据；被转发的请求暴露了俄罗斯政府数据库仍然有效的凭据。"},{"title":"**中国公安监控。** 中国某市级公安局案件管理系统的工程师使用 DeepSeek，而 DeepSeek 把请求转发给 Claude。该工程师构建的工具使用公民国家身份证号，把个人移动轨迹与公安记录进行比对。"}],"kind":"section","title":"案例包括"},{"children":[],"kind":"leaf","title":"2026 年 7 月的 14 天内归因于 DeepSeek 的蒸馏攻击规模：观察到超过 1,210 万次交流。"}],"html":"\u003cp\u003e调查发现，DeepSeek 也采用了与 Moonshot 类似的策略。DeepSeek 建立 CoT 提取流水线，依赖前文所述的同一种跨会话重放攻击；同时也在不通知 DeepSeek 客户的情况下，把交流静默中继给 Claude。与 GTG-16002 类似，其客户很可能并不知道自己的请求被转交给 Claude。\u003c/p\u003e\n\u003cp\u003e调查显示，DeepSeek 重点针对 Opus 的推理轨迹，使用与 Moonshot 相似的方法。它利用 reasoning signature，通过同样的跨会话重放攻击提取 CoT 记录并绕过技术控制，从而外传原本会被摘要处理的推理轨迹。\u003c/p\u003e\n\u003cp\u003eDeepSeek 会把原本试图通过第三方或 Anthropic 编程 Harness 使用 DeepSeek 模型的用户请求重新路由给 Claude，例如 Claude Code、Claude Agent SDK 或 OpenCode。DeepSeek 检查入站请求中的特定字符串，给使用这些第三方 Harness 的用户打标签，再把部分已标记用户的请求转发给 Claude Opus。这些敏感数据很可能在 DeepSeek 客户不知情、也未同意的情况下被路由给 Anthropic。\u003c/p\u003e\n\u003cp\u003e案例包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e一家中国科技公司。\u003c/strong\u003e 一名中国科技公司员工使用其以为是 DeepSeek 的模型分析内部文档，DeepSeek 把这些数据中继给 Claude。数据包含敏感信息，例如一个旗舰 AI 项目的完整规格、组织架构和战略目标。该公司几乎肯定没有被告知其数据被转发给 Claude。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e俄罗斯国防机构。\u003c/strong\u003e DeepSeek 转发了一名 IT 操作者的请求，此人正在处理与俄罗斯国防部有关的政府机构数据；被转发的请求暴露了俄罗斯政府数据库仍然有效的凭据。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e中国公安监控。\u003c/strong\u003e 中国某市级公安局案件管理系统的工程师使用 DeepSeek，而 DeepSeek 把请求转发给 Claude。该工程师构建的工具使用公民国家身份证号，把个人移动轨迹与公安记录进行比对。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cem\u003e2026 年 7 月的 14 天内归因于 DeepSeek 的蒸馏攻击规模：观察到超过 1,210 万次交流。\u003c/em\u003e\u003c/p\u003e\n","kind":"structured","rawMarkdown":"调查发现，DeepSeek 也采用了与 Moonshot 类似的策略。DeepSeek 建立 CoT 提取流水线，依赖前文所述的同一种跨会话重放攻击；同时也在不通知 DeepSeek 客户的情况下，把交流静默中继给 Claude。与 GTG-16002 类似，其客户很可能并不知道自己的请求被转交给 Claude。\n\n调查显示，DeepSeek 重点针对 Opus 的推理轨迹，使用与 Moonshot 相似的方法。它利用 reasoning signature，通过同样的跨会话重放攻击提取 CoT 记录并绕过技术控制，从而外传原本会被摘要处理的推理轨迹。\n\nDeepSeek 会把原本试图通过第三方或 Anthropic 编程 Harness 使用 DeepSeek 模型的用户请求重新路由给 Claude，例如 Claude Code、Claude Agent SDK 或 OpenCode。DeepSeek 检查入站请求中的特定字符串，给使用这些第三方 Harness 的用户打标签，再把部分已标记用户的请求转发给 Claude Opus。这些敏感数据很可能在 DeepSeek 客户不知情、也未同意的情况下被路由给 Anthropic。\n\n案例包括：\n\n- **一家中国科技公司。** 一名中国科技公司员工使用其以为是 DeepSeek 的模型分析内部文档，DeepSeek 把这些数据中继给 Claude。数据包含敏感信息，例如一个旗舰 AI 项目的完整规格、组织架构和战略目标。该公司几乎肯定没有被告知其数据被转发给 Claude。\n- **俄罗斯国防机构。** DeepSeek 转发了一名 IT 操作者的请求，此人正在处理与俄罗斯国防部有关的政府机构数据；被转发的请求暴露了俄罗斯政府数据库仍然有效的凭据。\n- **中国公安监控。** 中国某市级公安局案件管理系统的工程师使用 DeepSeek，而 DeepSeek 把请求转发给 Claude。该工程师构建的工具使用公民国家身份证号，把个人移动轨迹与公安记录进行比对。\n\n*2026 年 7 月的 14 天内归因于 DeepSeek 的蒸馏攻击规模：观察到超过 1,210 万次交流。*","sourceFormat":"markdown"},"note:sha256:b43bb71543610c3b74b478c17e88b682008664f60582eb11f7e539cc0fdcd30b":{"html":"\u003cp\u003e其他 AI 工作流持续运行以执行侦察。流程从特定目标行业生成扫描范围，经专用 Tool Server 调用资产搜索引擎和配套探测工具，对结果进行指纹识别。识别出的暴露面被绘制出来，再根据已知漏洞筛选入口。每一轮发现都会写入持久项目记忆，并扩展下一轮扫描的目标集合。该行为者使用这套框架针对多个外国政府和外交机构，以及十多家中国国内企业。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff3ddd5297b62ba79c500e9d921a6bafbf7dfb954-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 13. 攻击面与 OSINT 侦察循环。\u003c/p\u003e\n","kind":"html","rawMarkdown":"其他 AI 工作流持续运行以执行侦察。流程从特定目标行业生成扫描范围，经专用 Tool Server 调用资产搜索引擎和配套探测工具，对结果进行指纹识别。识别出的暴露面被绘制出来，再根据已知漏洞筛选入口。每一轮发现都会写入持久项目记忆，并扩展下一轮扫描的目标集合。该行为者使用这套框架针对多个外国政府和外交机构，以及十多家中国国内企业。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff3ddd5297b62ba79c500e9d921a6bafbf7dfb954-1920x471.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 13. 攻击面与 OSINT 侦察循环。","sourceFormat":"markdown"},"note:sha256:b5dd874a7689104a6726d46217f2e14ae6d58e56d2be9e3af5c136702ffb9507":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e角色\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e首次发现\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e最后发现\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003efrntrs-analytics.dedyn[.]io\u003c/td\u003e\n\u003ctd\u003eBeEF 浏览器 C2 主机名（deSEC 动态 DNS，攻击者持有 API Token）\u003c/td\u003e\n\u003ctd\u003e2026-05-13\u003c/td\u003e\n\u003ctd\u003e2026-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efrntrs-analytics-863060591218.europe-west1.run[.]app\u003c/td\u003e\n\u003ctd\u003eC2 域名背后的 Cloud Run Origin\u003c/td\u003e\n\u003ctd\u003e2026-05-13\u003c/td\u003e\n\u003ctd\u003e2026-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eprod-artfkt[.]com\u003c/td\u003e\n\u003ctd\u003e攻击者注册的行动域名\u003c/td\u003e\n\u003ctd\u003e2026 年 4–5 月观察到\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efafwatch[.]xyz\u003c/td\u003e\n\u003ctd\u003e攻击者注册的、与开盒活动相关的域名\u003c/td\u003e\n\u003ctd\u003e2026 年 4–5 月观察到\u003c/td\u003e\n\u003ctd\u ttacks)以来，我们又识别并阻断了来自七家中国实验室、针对 Claude 的蒸馏攻击。所有这些攻击都针对我们向公众普遍开放的模型；我们没有观察到针对 Mythos 5 或 Mythos Preview 的尝试，因为它们并不向公众开放。","sourceFormat":"markdown"},"note:sha256:b81cb9a2c85e353e061d6e658ea3728eb68ed2ee2a0c7491ce627c0f1e97af47":{"html":"\u003cp\u003e外国行为者提供主题和论点，再用 Claude 把它们转化成简报、合同、脚本、图形和帖子。其中一些材料被准备好交付给总统府发言人和 Russian House 负责人。重复使用的模板和长期指令表明，大部分规划在发送任何 Prompt 给 Claude 之前，就已离线完成。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fe3724dfd4779f2c838c6cb0b70c54cc5f757ef2a-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 1. 与该行动有关的亲俄 Telegram 频道；这些频道会被固定导出，用于风格语气分析、模仿和分发。\u003c/p\u003e\n","kind":"html","rawMarkdown":"外国行为者提供主题和论点，再用 Claude 把它们转化成简报、合同、脚本、图形和帖子。其中一些材料被准备好交付给总统府发言人和 Russian House 负责人。重复使用的模板和长期指令表明，大部分规划在发送任何 Prompt 给 Claude 之前，就已离线完成。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fe3724dfd4779f2c838c6cb0b70c54cc5f757ef2a-1990x1150.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 1. 与该行动有关的亲俄 Telegram 频道；这些频道会被固定导出，用于风格语气分析、模仿和分发。","sourceFormat":"markdown"},"note:sha256:bb2c538c092d472debd69cbfff58f0ef8d4dca2ca226be82e9f3ee9ccc63630d":{"html":"\u003cp\u003e在 OpenAI 分享有关其平台上重复违规活动的线索后，我们围绕肯尼亚可疑协调式虚假行为展开内部调查，并识别出这场行动。我们移除了相关账号及其背后的组织，并围绕其行为特征建立检测能力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在 OpenAI 分享有关其平台上重复违规活动的线索后，我们围绕肯尼亚可疑协调式虚假行为展开内部调查，并识别出这场行动。我们移除了相关账号及其背后的组织，并围绕其行为特征建立检测能力。","sourceFormat":"markdown"},"note:sha256:bdf1e53377d2f136bb2152fa216c6ba446cf593a543674fd0cca2f4854e3b89a":{"html":"\u003cp\u003e本报告描述的大多数行动，都通过 AI 的直接执行或编排得以实现。AI 的使用已经超出聊天机器人的简单问答，转向由多 Agent 框架执行侦察、漏洞利用和数据外传。人类仍然处于回路中，负责设定攻击目标并审阅外传结果。GTG-20006 是这一趋势的例子：该行为者构建了一套 AI 辅助工作流，一旦其工具被安全产品检测到，就会自动重建并重新部署整套工具。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本报告描述的大多数行动，都通过 AI 的直接执行或编排得以实现。AI 的使用已经超出聊天机器人的简单问答，转向由多 Agent 框架执行侦察、漏洞利用和数据外传。人类仍然处于回路中，负责设定攻击目标并审阅外传结果。GTG-20006 是这一趋势的例子：该行为者构建了一套 AI 辅助工作流，一旦其工具被安全产品检测到，就会自动重建并重新部署整套工具。","sourceFormat":"markdown"},"note:sha256:c335e859006b518499825422546d7bdc8ff35e67d900694aedaaab57c2cc6cdc":{"html":"\u003cp\u003e我们识别并移除了三个与伊朗国家有关联的账号，它们利用 Claude 筹划影响力行动。相关人员正在规划并准备内容，以支持其所称的“软战争”或“认知战”项目。按他们自己的说法，这是一项通过非军事方式塑造国内外舆论的计划。调查发现，每场行动都由在某个具名伊朗国家宣传机构内部工作、或代表该机构行事的行为者运作。相关实体包括：隶属于文化与伊斯兰指导部的 Islamic Culture and Communications Organization（ICCO）；Khorasan Razavi Islamic Propaganda Office——其从 Mashhad 一所宗教学校运行一个认知战指挥室，分发与 IRGC 叙事一致的内容；以及 Islamic Propaganda Organization 旗下的 Bina Cultural Observatory。\u003c/p\u003e\n\u003cp\u003e在每个案例中，行动都依赖 Claude 构建活动计划、理论手册、人格系统、目标数据库和部级规划文档。以这种方式使用模型，使他们可以生成复杂的组织框架与资产；否则，这些工作通常需要一个人员完备的项目办公室才能完成。行为者还高度重视“归属洗白”：他们有意设计内容，让国家支持的叙事看起来像独立声音。正如 ICCO 行为者所说，他们作为文化专员的角色“不是叙述者，而是导演”。\u003c/p\u003e\n\u003cp\u003e行为者有意采取措施隐藏身份与来源地。由于从伊朗境内访问 Claude 被封锁，他们使用 VPN 和外国电话号码注册、验证账号。但在对话中，他们仍反复提到自己的地点、机构和职务。结合带有机构品牌的文档页脚，以及对相关个人的公开来源核验，这些信息把各场行动分别与对应的伊朗国家关联机构联系起来。\u003c/p\u003e\n\u003cp\u003e调查还发现，其中一些活动已经在其他平台传播。例如，我们观察到相关内容通过支持 IRGC 叙事的分发渠道扩散。\u003c/p\u003e\n\u003cp\u003e按照 Breakout Scale，我们将这场行动评估为 \u003cstrong\u003eCategory Three\u003c/strong\u003e：内容跨多个平台传播，并被观察到由 Eitaa 等平台上的 IRGC 关联频道分发。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别并移除了三个与伊朗国家有关联的账号，它们利用 Claude 筹划影响力行动。相关人员正在规划并准备内容，以支持其所称的“软战争”或“认知战”项目。按他们自己的说法，这是一项通过非军事方式塑造国内外舆论的计划。调查发现，每场行动都由在某个具名伊朗国家宣传机构内部工作、或代表该机构行事的行为者运作。相关实体包括：隶属于文化与伊斯兰指导部的 Islamic Culture and Communications Organization（ICCO）；Khorasan Razavi Islamic Propaganda Office——其从 Mashhad 一所宗教学校运行一个认知战指挥室，分发与 IRGC 叙事一致的内容；以及 Islamic Propaganda Organization 旗下的 Bina Cultural Observatory。\n\n在每个案例中，行动都依赖 Claude 构建活动计划、理论手册、人格系统、目标数据库和部级规划文档。以这种方式使用模型，使他们可以生成复杂的组织框架与资产；否则，这些工作通常需要一个人员完备的项目办公室才能完成。行为者还高度重视“归属洗白”：他们有意设计内容，让国家支持的叙事看起来像独立声音。正如 ICCO 行为者所说，他们作为文化专员的角色“不是叙述者，而是导演”。\n\n行为者有意采取措施隐藏身份与来源地。由于从伊朗境内访问 Claude 被封锁，他们使用 VPN 和外国电话号码注册、验证账号。但在对话中，他们仍反复提到自己的地点、机构和职务。结合带有机构品牌的文档页脚，以及对相关个人的公开来源核验，这些信息把各场行动分别与对应的伊朗国家关联机构联系起来。\n\n调查还发现，其中一些活动已经在其他平台传播。例如，我们观察到相关内容通过支持 IRGC 叙事的分发渠道扩散。\n\n按照 Breakout Scale，我们将这场行动评估为 **Category Three**：内容跨多个平台传播，并被观察到由 Eitaa 等平台上的 IRGC 关联频道分发。","sourceFormat":"markdown"},"note:sha256:c474a86afc42fedf926a9caf1a4524d3757959c029f88df1addb55dfc13b4a3a":{"html":"\u003cp\u003e我们封禁了全部 16 个账号及相关组织，理由是违反 Usage Policy 中对未经同意的监控和画像、虚假信息的禁止规定，以及 Supported Regions Policy。我们还把调查发现纳入检测系统，以识别并封禁未来滥用。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们封禁了全部 16 个账号及相关组织，理由是违反 Usage Policy 中对未经同意的监控和画像、虚假信息的禁止规定，以及 Supported Regions Policy。我们还把调查发现纳入检测系统，以识别并封禁未来滥用。","sourceFormat":"markdown"},"note:sha256:c524223ef0f8641eb01a677c1ff212382aff028468d95985fc21fe92286a2ab0":{"html":"\u003cp\u003eAI 带来的能力增益受到恶意行为者和更广泛犯罪经济体的高度追逐。被攻陷的 API Key、会话 Token 和设备所代表的 AI 访问权限，越来越成为多个犯罪团体的唯一目标。此类团体常常通过中间商转售访问权，而中间商又为欺诈性 AI 经销商网络供货；这些网络不断轮换新的被盗 API Key 和会话 Token，直到额度耗尽。恶意行为者也会从中间商处使用或购买这些被盗凭据，用于自己的网络攻击。\u003c/p\u003e\n\u003cp\u003e犯罪型 AI 供应链已经形成多种“养殖”受害者 API Key 和会话 Token 的路径。其中一种方式，是伪装成真实 AI 服务提供商来投递恶意软件。攻击者搭建网站，声称自己是多个 AI 模型之间的中介服务，并以折扣价提供前沿模型访问。访问者可能通过多种方式被攻陷，其中最持久的一种，是诱导受害者下载并安装恶意客户端应用。这些应用常伪装成包括 Claude Code 在内的热门 AI Harness，实际却是凭据窃取器，会收集设备上的全部凭据和已认证会话 Token 并发送给攻击者，其中包括任何 AI 相关会话 Token 或 API Key。当受害者的 API Key 或账号被识别为已泄露并重置后，凭据窃取器仍会继续识别设备上出现的新会话并发送给行为者。这样一来，攻击者实际上复制了那些自己为其供应被盗凭据的欺诈经销网络模式，却让受害者设备持续向攻击者“供给”凭据，再把这些凭据转售给欺诈经销商。\u003c/p\u003e\n\u003cp\u003eGTG-50021 是从事类似活动的一个团体，由讲俄语和乌克兰语的人员组成，其中一人使用别名“kl1zy”。他们运营一个欺诈性 AI 经销业务，号称提供廉价 Claude 访问——结果既不便宜，也根本不是 Claude。客户以为自己购买的是折扣 Claude，但其流量实际上被静默代理到另一个 AI 模型；与此同时，经销工具会安装凭据窃取器，盗取客户 Anthropic 账号凭据，再转卖给其他 AI 代理经销商用于恶意活动。\u003c/p\u003e\n","kind":"html","rawMarkdown":"AI 带来的能力增益受到恶意行为者和更广泛犯罪经济体的高度追逐。被攻陷的 API Key、会话 Token 和设备所代表的 AI 访问权限，越来越成为多个犯罪团体的唯一目标。此类团体常常通过中间商转售访问权，而中间商又为欺诈性 AI 经销商网络供货；这些网络不断轮换新的被盗 API Key 和会话 Token，直到额度耗尽。恶意行为者也会从中间商处使用或购买这些被盗凭据，用于自己的网络攻击。\n\n犯罪型 AI 供应链已经形成多种“养殖”受害者 API Key 和会话 Token 的路径。其中一种方式，是伪装成真实 AI 服务提供商来投递恶意软件。攻击者搭建网站，声称自己是多个 AI 模型之间的中介服务，并以折扣价提供前沿模型访问。访问者可能通过多种方式被攻陷，其中最持久的一种，是诱导受害者下载并安装恶意客户端应用。这些应用常伪装成包括 Claude Code 在内的热门 AI Harness，实际却是凭据窃取器，会收集设备上的全部凭据和已认证会话 Token 并发送给攻击者，其中包括任何 AI 相关会话 Token 或 API Key。当受害者的 API Key 或账号被识别为已泄露并重置后，凭据窃取器仍会继续识别设备上出现的新会话并发送给行为者。这样一来，攻击者实际上复制了那些自己为其供应被盗凭据的欺诈经销网络模式，却让受害者设备持续向攻击者“供给”凭据，再把这些凭据转售给欺诈经销商。\n\nGTG-50021 是从事类似活动的一个团体，由讲俄语和乌克兰语的人员组成，其中一人使用别名“kl1zy”。他们运营一个欺诈性 AI 经销业务，号称提供廉价 Claude 访问——结果既不便宜，也根本不是 Claude。客户以为自己购买的是折扣 Claude，但其流量实际上被静默代理到另一个 AI 模型；与此同时，经销工具会安装凭据窃取器，盗取客户 Anthropic 账号凭据，再转卖给其他 AI 代理经销商用于恶意活动。","sourceFormat":"markdown"},"note:sha256:c886f8c0643bb6747f8d4e51386ed574faa05a766b2ddfbdbe5da8fe2823ddc8":{"html":"\u003cp\u003e在行动另一部分，行为者使用 Claude 构建模块化 Windows Implant \u003ccode\u003eSECOMS64\u003c/code\u003e。该 Implant 包含键盘记录、截图捕获、绕过 App-Bound Encryption 的 Chrome 凭据提取，以及对 Microsoft Defender 和 Intune 的侦察。配套组件还包括经 ngrok 隧道传输的 PowerShell Reverse Shell、USB 驱动器传播、浏览器数据破坏模块，以及一个从文件共享服务获取、再修改以规避防病毒检测的分阶段 Dropper。\u003c/p\u003e\n\u003cp\u003e整套工具面向个人监控。键盘记录器会在 Telegram Desktop 处于焦点时捕获按键；截图组件以名为“Telegram”的可执行文件运行，使用相同图标，并通过 Telegram Bot 外传截图。USB 模块记录接触过的每个驱动器序列号；同一集群中的 Android 应用会上载设备联系人、消息和媒体。持久化采用多层机制：注册表 Run Key、最高权限级别的计划任务、自删除批处理文件，以及伪装成 Windows 字体驱动服务、位于固定 ProgramData 路径的二进制文件。另一条外传路径把数据暂存到商业云存储中，文件名编码受害者主机名，随后在服务端下载并删除文件。行为者还测试通过 Telegram 文档处理实现远程代码执行，评估其他命令与控制框架，把组件封装成无可见控制台窗口运行并绕过 SmartScreen，还把工具包装成假图像编辑应用，并附上伪造 Adobe 版权声明。在同一集群其他位置，我们还发现一条驱动器擦除单行命令，以及针对具名 Windows 用户的浏览器数据破坏操作。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在行动另一部分，行为者使用 Claude 构建模块化 Windows Implant `SECOMS64`。该 Implant 包含键盘记录、截图捕获、绕过 App-Bound Encryption 的 Chrome 凭据提取，以及对 Microsoft Defender 和 Intune 的侦察。配套组件还包括经 ngrok 隧道传输的 PowerShell Reverse Shell、USB 驱动器传播、浏览器数据破坏模块，以及一个从文件共享服务获取、再修改以规避防病毒检测的分阶段 Dropper。\n\n整套工具面向个人监控。键盘记录器会在 Telegram Desktop 处于焦点时捕获按键；截图组件以名为“Telegram”的可执行文件运行，使用相同图标，并通过 Telegram Bot 外传截图。USB 模块记录接触过的每个驱动器序列号；同一集群中的 Android 应用会上载设备联系人、消息和媒体。持久化采用多层机制：注册表 Run Key、最高权限级别的计划任务、自删除批处理文件，以及伪装成 Windows 字体驱动服务、位于固定 ProgramData 路径的二进制文件。另一条外传路径把数据暂存到商业云存储中，文件名编码受害者主机名，随后在服务端下载并删除文件。行为者还测试通过 Telegram 文档处理实现远程代码执行，评估其他命令与控制框架，把组件封装成无可见控制台窗口运行并绕过 SmartScreen，还把工具包装成假图像编辑应用，并附上伪造 Adobe 版权声明。在同一集群其他位置，我们还发现一条驱动器擦除单行命令，以及针对具名 Windows 用户的浏览器数据破坏操作。","sourceFormat":"markdown"},"note:sha256:c9f7053fd70b7678cd00dc2ce5b44d83fa7f503afd3fe340234da99f136eae9d":{"html":"\u003cp\u003e我们在内部调查中发现这些活动并封禁相关账号。我们还围绕已记录的行为特征建立检测，以阻止未来相关活动，并共享指标以支持其他产业伙伴采取行动。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们在内部调查中发现这些活动并封禁相关账号。我们还围绕已记录的行为特征建立检测，以阻止未来相关活动，并共享指标以支持其他产业伙伴采取行动。\n\n[返回顶部](#main)","sourceFormat":"markdown"},"note:sha256:ca1253c22126e3f3a727022bee2a7fa97373044a92ef0b22652e2d889e9b3f18":{"html":"\u003cp\u003e攻击者使用一套容器化开源渗透测试平台，前端接入本地模型网关，目标为 Web 应用。Worker Agent 在无人监督下执行注入、XSS、身份验证绕过和 SSRF 测试，把潜在发现和凭据收集到操作者工作区。该循环对生产系统启用了真实利用，也就是说，同一工作流既尝试识别漏洞，也主动利用漏洞获取访问权限。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd67f43c0159621c1e7b84b5cc5245f0e2bed40a2-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 16. 自主利用流水线。\u003c/p\u003e\n","kind":"html","rawMarkdown":"攻击者使用一套容器化开源渗透测试平台，前端接入本地模型网关，目标为 Web 应用。Worker Agent 在无人监督下执行注入、XSS、身份验证绕过和 SSRF 测试，把潜在发现和凭据收集到操作者工作区。该循环对生产系统启用了真实利用，也就是说，同一工作流既尝试识别漏洞，也主动利用漏洞获取访问权限。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd67f43c0159621c1e7b84b5cc5245f0e2bed40a2-1920x471.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 16. 自主利用流水线。","sourceFormat":"markdown"},"note:sha256:ca5d65ad85d431ec961556650d614fbafc5425353567574194c6579a80062f9d":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003eIP\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u00 5-21 | 2026-05-25 |\n\n表 3. 攻击者出口 IP。","sourceFormat":"markdown"},"note:sha256:cace4f567238ba14694f81033c75945f84d2770cc8760fee907d47f4e50ae5a5":{"html":"\u003cp\u003e我们在持续调查该地区影响力行动时识别到该账号，随后封禁该账号及其关联组织，并实施新的检测方法，针对其行为特征。下文分享相关指标，以帮助其他产业伙伴采取行动，尤其包括把整个网络关联到同一账号的共享部署标识，以及从约 70 个虚假媒体中按地区选取的代表性样本（完整域名与账号清单另行提供）：\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们在持续调查该地区影响力行动时识别到该账号，随后封禁该账号及其关联组织，并实施新的检测方法，针对其行为特征。下文分享相关指标，以帮助其他产业伙伴采取行动，尤其包括把整个网络关联到同一账号的共享部署标识，以及从约 70 个虚假媒体中按地区选取的代表性样本（完整域名与账号清单另行提供）：","sourceFormat":"markdown"},"note:sha256:cb00db931b42deca0af278c2df85bc08d85bf09edfe32fd520f4251cad54f966":{"html":"\u003cp\u003e我们封禁了负责这些活动的账号集群，并增强检测能力，以阻断和降低未来滥用风险。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e对齐的优先事项\u003c/td\u003e\n\u003ctd\u003e中国统一战线和宗教事务体系：United Front Work Department、Ministry of State Security，以及原 State Administration for Religious Affairs。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e目标类别\u003c/td\u003e\n\u003ctd\u003e亚洲高级天主教枢机；台湾基督长老教会；Central Tibetan Administration 与藏人倡议组织（International Campaign for Tibet、Students for a Free Tibet）；法轮功及关联媒体（Shen Yun、NTD）；连接新加坡、香港与中国大陆的基督教传教网络。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e内部模板特征\u003c/td\u003e\n\u003ctd\u003e“人物调研底稿”“线索报”“态势感知”摘要；反复出现“工作抓手”“负面情况”等字段。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e国家安全语汇（归属信号）\u003c/td\u003e\n\u003ctd\u003e“工作抓手”“态势感知”“线索报”“邪教”“民分”“境外涉华”“站在中方立场”等。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 6. 宗教事务情报行动指标：对齐的国家重点、目标类别、内部模板特征与国家安全语汇。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们封禁了负责这些活动的账号集群，并增强检测能力，以阻断和降低未来滥用风险。\n\n| **类别** | **指标** |\n| --- | --- |\n| 对齐的优先事项 | 中国统一战线和宗教事务体系：United Front Work Department、Ministry of State Security，以及原 State Administration for Religious Affairs。 |\n| 目标类别 | 亚洲高级天主教枢机；台湾基督长老教会；Central Tibetan Administration 与藏人倡议组织（International Campaign for Tibet、Students for a Free Tibet）；法轮功及关联媒体（Shen Yun、NTD）；连接新加坡、香港与中国大陆的基督教传教网络。 |\n| 内部模板特征 | “人物调研底稿”“线索报”“态势感知”摘要；反复出现“工作抓手”“负面情况”等字段。 |\n| 国家安全语汇（归属信号） | “工作抓手”“态势感知”“线索报”“邪教”“民分”“境外涉华”“站在中方立场”等。 |\n\n表 6. 宗教事务情报行动指标：对齐的国家重点、目标类别、内部模板特征与国家安全语汇。","sourceFormat":"markdown"},"note:sha256:cb883187a3f1aabbf1408121d123a5b38ac5c927c788de38020879e4b869eb72":{"html":"\u003cp\u003e上述 LLM 平台并不是从事病毒功能获得研究的人员访问我们模型的唯一途径。2026 年 5 月，我们发现一名美国以外研究人员使用 Claude 开展高致病性禽流感（“bird flu”）研究。项目聚焦病毒适应哺乳动物的过程，以及它如何在呼吸道之外造成严重疾病。\u003c/p\u003e\n\u003cp\u003e相关流感变体因潜在大流行风险而受到高度关注。它们广泛存在于野鸟和家禽中，并偶尔跨越到哺乳动物。人群几乎没有免疫力，一旦发生跨物种感染，已确认的人类病例中约一半致死。尽管致死率很高，这类病毒目前还不能高效在人际传播。因此，一旦出现具有人际传播能力的变体，就会构成非常严重的风险。更令人担忧的是，这种变体还可能在呼吸系统之外造成严重疾病。不同于其他流感变体，H5 病毒——该禽流感病毒属于其中之一——经常在猫、狐狸、雪貂和部分人类病例中表现出明显脑部受累。如果具有这种特性的变体引发大流行，可能同时提高疾病严重度、干扰诊断并阻碍治疗。\u003c/p\u003e\n\u003cp\u003e与第一个案例一样，该研究明显具有军民两用性质。理解这些特定病毒特征的遗传基础，可能帮助更早识别自然出现、具有引发人类大流行潜力的病毒版本；但同一研究也会产生可能被用于主动制造这种变体的危险知识，并且增加代价高昂的实验室事故风险。\u003c/p\u003e\n\u003cp\u003e研究人员从一个不受支持地区访问 Claude，通过美国 VPS 基础设施连接，并使用自动生成用户名的隐私邮箱服务。他在一个可信的机构研究背景下开展工作，连续数周与 Claude 交互，总消息量达数千条。在这些交流中，他借助 Claude 对科学文献的知识进行研究规划与设计、数据分析、实验解释和优先级排序，也用 Claude 协助撰写研究成果。\u003c/p\u003e\n\u003cp\u003e现有证据都指向项目仍处于非常早期的研究计划阶段。但计划细节显示，这是在研究一种具增强大流行潜力的病原体：项目包含遗传工程方法，计划引入与哺乳动物适应和动物模型中空气传播有关的突变。研究人员打算在动物模型和病毒基因组测序输出中测量这些特征，而相关标签和描述与其研究组很可能实际拥有这些分离株的情况一致。\u003c/p\u003e\n\u003cp\u003e重要的是，由于我们的生物安全分类器能够可靠阻断涉及高风险生物研究——这里即构建增强大流行潜力病原体——的内容，这些交流全部发生在我们能力最弱的一档模型上，具体为 Claude Sonnet 4 和 Haiku 4.5；Sonnet 4 停用后，用户开始改用 Haiku 4.5。详细检查这些交互后，我们估计 Claude 带来的提升主要是数据分析、研究构想和设计方面的事务性辅助。这与我们对 Sonnet 4 和 Haiku 4.5 能力的理解一致：它们无法完成专家级生物研究任务，因此给该研究人员带来的能力提升有限，显著低于更强模型可能提供的帮助。\u003c/p\u003e\n\u003cp\u003e即便如此，该案例仍证明现实中存在活跃的湿实验室研究项目，会同时形成制造增强大流行潜力病原体所需的知识和生物材料。案例还表明，从事这些项目的研究人员有兴趣绕过地域限制来使用美国前沿 AI 模型，而且采取的方式显示他们清楚保持隐蔽身份的重要性。\u003c/p\u003e\n\u003cp\u003e这个案例也表明，我们现有前沿模型防护足够强，能够迫使研究者使用能力更弱、保护相对较少的模型，从而显著限制模型在被重点限制领域提供的能力提升。但后续案例也说明，可能被用于造成伤害的科学活动范围非常广，并与优先支持的有益研究领域深度重叠。\u003c/p\u003e\n","kind":"html","rawMarkdown":"上述 LLM 平台并不是从事病毒功能获得研究的人员访问我们模型的唯一途径。2026 年 5 月，我们发现一名美国以外研究人员使用 Claude 开展高致病性禽流感（“bird flu”）研究。项目聚焦病毒适应哺乳动物的过程，以及它如何在呼吸道之外造成严重疾病。\n\n相关流感变体因潜在大流行风险而受到高度关注。它们广泛存在于野鸟和家禽中，并偶尔跨越到哺乳动物。人群几乎没有免疫力，一旦发生跨物种感染，已确认的人类病例中约一半致死。尽管致死率很高，这类病毒目前还不能高效在人际传播。因此，一旦出现具有人际传播能力的变体，就会构成非常严重的风险。更令人担忧的是，这种变体还可能在呼吸系统之外造成严重疾病。不同于其他流感变体，H5 病毒——该禽流感病毒属于其中之一——经常在猫、狐狸、雪貂和部分人类病例中表现出明显脑部受累。如果具有这种特性的变体引发大流行，可能同时提高疾病严重度、干扰诊断并阻碍治疗。\n\n与第一个案例一样，该研究明显具有军民两用性质。理解这些特定病毒特征的遗传基础，可能帮助更早识别自然出现、具有引发人类大流行潜力的病毒版本；但同一研究也会产生可能被用于主动制造这种变体的危险知识，并且增加代价高昂的实验室事故风险。\n\n研究人员从一个不受支持地区访问 Claude，通过美国 VPS 基础设施连接，并使用自动生成用户名的隐私邮箱服务。他在一个可信的机构研究背景下开展工作，连续数周与 Claude 交互，总消息量达数千条。在这些交流中，他借助 Claude 对科学文献的知识进行研究规划与设计、数据分析、实验解释和优先级排序，也用 Claude 协助撰写研究成果。\n\n现有证据都指向项目仍处于非常早期的研究计划阶段。但计划细节显示，这是在研究一种具增强大流行潜力的病原体：项目包含遗传工程方法，计划引入与哺乳动物适应和动物模型中空气传播有关的突变。研究人员打算在动物模型和病毒基因组测序输出中测量这些特征，而相关标签和描述与其研究组很可能实际拥有这些分离株的情况一致。\n\n重要的是，由于我们的生物安全分类器能够可靠阻断涉及高风险生物研究——这里即构建增强大流行潜力病原体——的内容，这些交流全部发生在我们能力最弱的一档模型上，具体为 Claude Sonnet 4 和 Haiku 4.5；Sonnet 4 停用后，用户开始改用 Haiku 4.5。详细检查这些交互后，我们估计 Claude 带来的提升主要是数据分析、研究构想和设计方面的事务性辅助。这与我们对 Sonnet 4 和 Haiku 4.5 能力的理解一致：它们无法完成专家级生物研究任务，因此给该研究人员带来的能力提升有限，显著低于更强模型可能提供的帮助。\n\n即便如此，该案例仍证明现实中存在活跃的湿实验室研究项目，会同时形成制造增强大流行潜力病原体所需的知识和生物材料。案例还表明，从事这些项目的研究人员有兴趣绕过地域限制来使用美国前沿 AI 模型，而且采取的方式显示他们清楚保持隐蔽身份的重要性。\n\n这个案例也表明，我们现有前沿模型防护足够强，能够迫使研究者使用能力更弱、保护相对较少的模型，从而显著限制模型在被重点限制领域提供的能力提升。但后续案例也说明，可能被用于造成伤害的科学活动范围非常广，并与优先支持的有益研究领域深度重叠。","sourceFormat":"markdown"},"note:sha256:d0bca3b3a1851184e7273a460bea8ebe647ec98986ce1123da646142d1295cdc":{"html":"\u003cp\u003e用于绕过 Anthropic 访问限制的代理服务不断扩散，形成了一个次级市场：实验室可以从中购买或以其他方式获得被收集的用户—Claude 交流。一些代理网络既向不受支持地区用户提供 Claude 访问，又保存交流记录并出售给其他实验室。\u003c/p\u003e\n\u003cp\u003e例如，SenseTime 的蒸馏流水线包含从第三方数据供应商购买的用户—Claude 交流记录。这些记录来自通过第三方应用或路由服务等中间商访问 Claude 的用户；中间商记录对话并出售。SenseTime 还使用 Claude 编写蒸馏流水线，以及启动和监控训练任务。\u003c/p\u003e\n\u003cp\u003eMiniMax 则通过一家壳公司建立自己的代理网络服务。这家公司与 MiniMax 没有明显公开联系，也不披露与母公司的关系。该代理服务只提供 Anthropic 和 OpenAI 模型访问，不提供任何中国模型，包括 MiniMax 自己的模型。这些证据表明，MiniMax 很可能建立该代理网络服务，是为了收集用户与美国前沿模型之间的交流，用于训练自己的模型。\u003c/p\u003e\n","kind":"html","rawMarkdown":"用于绕过 Anthropic 访问限制的代理服务不断扩散，形成了一个次级市场：实验室可以从中购买或以其他方式获得被收集的用户—Claude 交流。一些代理网络既向不受支持地区用户提供 Claude 访问，又保存交流记录并出售给其他实验室。\n\n例如，SenseTime 的蒸馏流水线包含从第三方数据供应商购买的用户—Claude 交流记录。这些记录来自通过第三方应用或路由服务等中间商访问 Claude 的用户；中间商记录对话并出售。SenseTime 还使用 Claude 编写蒸馏流水线，以及启动和监控训练任务。\n\nMiniMax 则通过一家壳公司建立自己的代理网络服务。这家公司与 MiniMax 没有明显公开联系，也不披露与母公司的关系。该代理服务只提供 Anthropic 和 OpenAI 模型访问，不提供任何中国模型，包括 MiniMax 自己的模型。这些证据表明，MiniMax 很可能建立该代理网络服务，是为了收集用户与美国前沿模型之间的交流，用于训练自己的模型。","sourceFormat":"markdown"},"note:sha256:d154885eab1e987fc2c7bf8b94c608157b5efa622ee837386d466df7d089c553":{"html":"\u003cp\u003e本节讨论我们阻断的四场常规武器行动。这里的“阻断”意味着我们封禁了能够与相关行为者关联的全部账号，从而关闭其整套行动。如果发现这些行为者还跨其他平台活动，我们会与产业同行共享发现，以便对方同样采取阻断措施；并酌情与其他公共和私营部门伙伴共享威胁报告。\u003c/p\u003e\n\u003cp\u003e这些案例中，行为者都利用 Claude 构建和改进自己本来就熟悉、也能够接触的武器硬件或固件软件。他们把工作拆散到大量会话中，以隐藏项目全貌，并采用其他方式绕过我们的安全措施与访问控制。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本节讨论我们阻断的四场常规武器行动。这里的“阻断”意味着我们封禁了能够与相关行为者关联的全部账号，从而关闭其整套行动。如果发现这些行为者还跨其他平台活动，我们会与产业同行共享发现，以便对方同样采取阻断措施；并酌情与其他公共和私营部门伙伴共享威胁报告。\n\n这些案例中，行为者都利用 Claude 构建和改进自己本来就熟悉、也能够接触的武器硬件或固件软件。他们把工作拆散到大量会话中，以隐藏项目全貌，并采用其他方式绕过我们的安全措施与访问控制。","sourceFormat":"markdown"},"note:sha256:d1cd02b91ee20894e82e1810ee146103c7990d23d9129d54c4ef4b255d1d8ca4":{"html":"\u003cpre\u003e\u003ccode\u003eupdatebeacon.duckdns[.]org\nesvfecawvjmchjslqyemho2fiduc59wzn.oast[.]fun\nsoraki-proxy.20245aad98d27b1b1a2f0f103e1d7ee0.workers[.]dev\nsoraki[.]cc\nsoraki[.]work\npolicenationale[.]cc\nemailsecure[.]email\nmozilla[.]ws\nsignin-1psswoord[.]com\non-pssword[.]com\nari-chain[.]com\narichain[.]network\nbitmart-mystery[.]com\ndefi-claim[.]xyz\nservice-infos[.]info\n0x0[.]st // Exfiltration file uploads via curl\n\u003c/code\u003e\u003c/pre\u003e\n","kind":"html","rawMarkdown":"```\nupdatebeacon.duckdns[.]org\nesvfecawvjmchjslqyemho2fiduc59wzn.oast[.]fun\nsoraki-proxy.20245aad98d27b1b1a2f0f103e1d7ee0.workers[.]dev\nsoraki[.]cc\nsoraki[.]work\npolicenationale[.]cc\nemailsecure[.]email\nmozilla[.]ws\nsignin-1psswoord[.]com\non-pssword[.]com\nari-chain[.]com\narichain[.]network\nbitmart-mystery[.]com\ndefi-claim[.]xyz\nservice-infos[.]info\n0x0[.]st // Exfiltration file uploads via curl\n```","sourceFormat":"markdown"},"note:sha256:d23d07c8d0c27fd6ea0e452a96c941cdc5544dee11cf64375e1dfb21bfa9950a":{"html":"\u003cp\u003e我们还发现一个账号，为一家国家关联传染病实验室的正痘病毒研究撰写资助申请。申请描述了对高等级生物安全设施的访问，并计划对活体正痘病毒开展研究。正痘病毒包括引发天花的 variola，也包括在 2022 年造成全球暴发的 Mpox。\u003c/p\u003e\n\u003cp\u003e正痘病毒大约编码 200 个基因，其中很大一部分用于关闭宿主免疫反应。该资助申请计划识别能够关闭某一宿主抗病毒通路的基因，并验证删除这一病毒基因后，病毒在小鼠体内会发生减毒，也就是降低致病毒力。研究希望更好理解正痘病毒免疫逃逸基因；这种知识对希望减毒病毒的人有价值，对希望保留、增强或把这类功能转移给其他病毒的人同样有价值。\u003c/p\u003e\n\u003cp\u003e该账号在使用前不久通过随机生成的邮箱地址创建，并经匿名化美国基础设施运行；操作者登录可以追溯到与一个已封禁账号农场共享的代理。它并非单个用户，而是一个服务十余名互不相关客户的转售中继，数天内与 Claude 交换了数万条消息。上述资助申请只是其中一个客户的任务，全部使用 Opus 5，在约一小时内完成：用户让 Claude 从头到尾起草申请，包括核心假设、实验设计、给药方案、统计计划和应急策略。由于研究具有明显军民两用性质，而且明确聚焦“减毒”，Claude 向用户提供了信息，因此没有被分类器阻断。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们还发现一个账号，为一家国家关联传染病实验室的正痘病毒研究撰写资助申请。申请描述了对高等级生物安全设施的访问，并计划对活体正痘病毒开展研究。正痘病毒包括引发天花的 variola，也包括在 2022 年造成全球暴发的 Mpox。\n\n正痘病毒大约编码 200 个基因，其中很大一部分用于关闭宿主免疫反应。该资助申请计划识别能够关闭某一宿主抗病毒通路的基因，并验证删除这一病毒基因后，病毒在小鼠体内会发生减毒，也就是降低致病毒力。研究希望更好理解正痘病毒免疫逃逸基因；这种知识对希望减毒病毒的人有价值，对希望保留、增强或把这类功能转移给其他病毒的人同样有价值。\n\n该账号在使用前不久通过随机生成的邮箱地址创建，并经匿名化美国基础设施运行；操作者登录可以追溯到与一个已封禁账号农场共享的代理。它并非单个用户，而是一个服务十余名互不相关客户的转售中继，数天内与 Claude 交换了数万条消息。上述资助申请只是其中一个客户的任务，全部使用 Opus 5，在约一小时内完成：用户让 Claude 从头到尾起草申请，包括核心假设、实验设计、给药方案、统计计划和应急策略。由于研究具有明显军民两用性质，而且明确聚焦“减毒”，Claude 向用户提供了信息，因此没有被分类器阻断。","sourceFormat":"markdown"},"note:sha256:d4733b1279fbb039316be31169419a4f1495a473de4e261a7613a72645aea548":{"html":"\u003cp\u003e图 5. 将电子战与压制防空目标软件套件映射到联合目标循环，展示 Claude 在循环中的介入位置。\u003c/p\u003e\n","kind":"html","rawMarkdown":"图 5. 将电子战与压制防空目标软件套件映射到联合目标循环，展示 Claude 在循环中的介入位置。","sourceFormat":"markdown"},"note:sha256:d5f889714f40bce5115576c905e74ef40a4881c4c3beb288bb0e2900a3b0228f":{"html":"\u003cp\u003 003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eZWNJ + 点/空格规避；强制口号；#OurChoiceMaryamRajavi；SKILL.md / LEARNINGS.md 记忆\u003c/td\u003e\n\u003ctd\u003e指纹\u003c/td\u003e\n\u003ctd\u003e跨行为者特征\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 12. 该活动背后的网络账号、相关网站及传播账号 IoC。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们在内部调查中发现这些活动并封禁相关账号。目前，我们无法独立确认该网络的放大账号获得了多少真实用户互动。\n\n| **指标** | **类型** | **备注** |\n| --- | --- | --- |\n| mojahedin[.]org; ncr-iran[.]org; maryam-rajavi[.]com; iranntv[.]com; iranfreedom[.]org; hambastegimeli[.]com; wncri[.]org | 域名 | 在各行为者中硬编码的 MEK/NCRI 强制来源集 |\n| @simaintv / @iranintv | Instagram | 原始节点（~708K） |\n| @javanane_shargt | Instagram | 全国侨民受众（~299K） |\n| @tehranchekhabar19 | Instagram | “独立新闻”；学生定向（~173K） |\n| @faryade_mamnoo | Instagram | 反对派内容（~89.5K） |\n| @khabar_fouri_mardom; @iranpayam_tehran5 | Instagram | 协调式多页面网络 |\n| @fwr.ir / @fwr_ir; t[.]me/FWR_ir | Instagram / Telegram | 马甲账号漏斗与监控终端 |\n| @anti_silent | Telegram | 学生监控漏斗 |\n| @jomhouri_democratic | Instagram / Telegram | 十点计划宣传 |\n| ZWNJ + 点/空格规避；强制口号；#OurChoiceMaryamRajavi；SKILL.md / LEARNINGS.md 记忆 | 指纹 | 跨行为者特征 |\n\n表 12. 该活动背后的网络账号、相关网站及传播账号 IoC。","sourceFormat":"markdown"},"note:sha256:d6a19b83905b36d843ebee448918395de512077051b519b759bebad3aadec47e":{"html":"\u003cp\u003e我们识别并移除了一个持续运行的自动化虚假信息网络，该网络使用 Claude 在孟加拉国生成捏造的孟加拉语新闻。行动重点是宣传 Bangladesh Awami League，并攻击其政治对手。由于 Awami League 自 2024 年 7 月起义后已不再执政，因此该网络是在为反对党而非政府开展活动。行为者完全清楚自己的欺骗手法；他们在内部沟通中写道：“没人知道这些新闻是假的。”\u003c/p\u003e\n\u003cp\u003e行动由孟加拉国 Gaibandha District 的一名行为者单独运作。为规避平台限制和检测，他轮换使用 29 个 Claude 账号。行为者使用名为 \u003ccode\u003efake_news_3.py\u003c/code\u003e 的自定义软件直接连接 Claude，程序被写死为按固定批次生成内容：15 个标题、3 篇详细虚构报道，以及 15 条图像生成提示词。根据行为者自己的说法，这些产出用于持续供应 Facebook Live、YouTube 和 TikTok 直播，目标受众是识字程度有限的农村 Awami League 支持者。\u003c/p\u003e\n\u003cp\u003e行为者至少生成了 1,500 个标题、300 条虚假叙事和 1,500 条图像提示词。由于 Claude 当时尚不具备图像生成功能，这些提示词很可能被导出到其他前沿 AI 模型，用于制作虚假叙事中的视觉内容。\u003c/p\u003e\n\u003cp\u003e行动在孟加拉国境内运行，目标也是国内受众，其内容旨在服务 Awami League 的利益。尽管叙事方向一致，我们的调查没有发现该党本身参与指导或资助该网络活动的证据。\u003c/p\u003e\n\u003cp\u003e调查显示，该行动的视频出现在三个社交媒体平台上的多个孟加拉国相关频道和账号中。我们无法确认究竟是哪些具体频道发布了全部产出，也没有证据表明这些内容在相关账号之外触达了更广泛受众。\u003c/p\u003e\n\u003cp\u003e按照 Breakout Scale，我们把该行动评估为 \u003cstrong\u003eCategory Three\u003c/strong\u003e：活动跨多个平台，并在多个聚焦孟加拉国的频道和社交媒体账号中观察到与其产出匹配的视频。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别并移除了一个持续运行的自动化虚假信息网络，该网络使用 Claude 在孟加拉国生成捏造的孟加拉语新闻。行动重点是宣传 Bangladesh Awami League，并攻击其政治对手。由于 Awami League 自 2024 年 7 月起义后已不再执政，因此该网络是在为反对党而非政府开展活动。行为者完全清楚自己的欺骗手法；他们在内部沟通中写道：“没人知道这些新闻是假的。”\n\n行动由孟加拉国 Gaibandha District 的一名行为者单独运作。为规避平台限制和检测，他轮换使用 29 个 Claude 账号。行为者使用名为 `fake_news_3.py` 的自定义软件直接连接 Claude，程序被写死为按固定批次生成内容：15 个标题、3 篇详细虚构报道，以及 15 条图像生成提示词。根据行为者自己的说法，这些产出用于持续供应 Facebook Live、YouTube 和 TikTok 直播，目标受众是识字程度有限的农村 Awami League 支持者。\n\n行为者至少生成了 1,500 个标题、300 条虚假叙事和 1,500 条图像提示词。由于 Claude 当时尚不具备图像生成功能，这些提示词很可能被导出到其他前沿 AI 模型，用于制作虚假叙事中的视觉内容。\n\n行动在孟加拉国境内运行，目标也是国内受众，其内容旨在服务 Awami League 的利益。尽管叙事方向一致，我们的调查没有发现该党本身参与指导或资助该网络活动的证据。\n\n调查显示，该行动的视频出现在三个社交媒体平台上的多个孟加拉国相关频道和账号中。我们无法确认究竟是哪些具体频道发布了全部产出，也没有证据表明这些内容在相关账号之外触达了更广泛受众。\n\n按照 Breakout Scale，我们把该行动评估为 **Category Three**：活动跨多个平台，并在多个聚焦孟加拉国的频道和社交媒体账号中观察到与其产出匹配的视频。","sourceFormat":"markdown"},"note:sha256:d8d20f2814fc9570702ee2848041f80f9330103899a0ce111a02fd1a8150c0e1":{"html":"\u003cpre\u003e\u003ccode\u003ems365-live[.]com\nteams.ms365-live[.]com\nm365-owa[.]com\nowa-ms365[.]com\nms365-device[.]com\nmslivetest.duckdns[.]org\nmy-invite[.]org\nchamber-ua[.]org\nchathamhouse[.]eu\nukrinform-share[.]net\n104.145.210[.]184\n31.57.243[.]154\nstatistic-ms[.]live\nstatic-ms[.]live\n104.194.151[.]133\nad-g[.]org\n104.194.159[.]55\ndocs-viewer[.]org\n144.172.114[.]192\nwa-connect[.]eu\nmygreatmarket[.]org\nmygreatmarket[.]com\n213.145.86[.]112\n2.26.53[.]194\ncdncounter[.]net\nstatic.cdncounter[.]net\nstuseamandesilt[.]org\napi.stuseamandesilt[.]org\ncdn.stuseamandesilt[.]org\nupdate.stuseamandesilt[.]org\nitechx[.]tel\npdfviewer2024.b-cdn[.] 31fc05d0d4513be11c593\n```","sourceFormat":"markdown"},"note:sha256:da090f3e4f05ab615f422069cb5d57d4c507b472555431806cc243150133ca15":{"html":"\u003cp\u003e行为者使用 Claude 生成和分析内容。一个案例中，他们每次向 Claude 输入约 25 条社交媒体帖子，让 Claude 分析并返回发帖者的人口类别、位置和政治倾向等信息，同时对每项判断给出置信度。另一个案例中，行为者让 Claude 用波斯语、阿拉伯语、英语和德语为一批（很可能是虚假的）线上人格生成帖子；这些人格被设计成不同亲伊朗政权和反伊朗政权群体中的普通成员。这种行为表明，对方可能试图大规模创建虚假社交账号，同时在冲突双方布点。\u003c/p\u003e\n\u003cp\u003eForbidden Stories 在 2023 年对泄露的 S2T 宣传册进行调查时，描述了该公司的服务，包括创建虚假账号渗透私人 WhatsApp 和 Telegram 群组、收集成员名单，并进一步升级到网络钓鱼和设备入侵。该行为者借助 Claude 生成的内容，可能就是为这些虚假账号增加可信度，让目标愿意信任它们。我们无法独立确认 Forbidden Stories 报道的后续行动阶段是否真的发生。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc5c7183d60d65a5ac34e454a02653468c287ae24-1920x960.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 1. 该行动的收集漏斗：由 Claude 驱动的分类和人格生成，很可能帮助行为者渗透目标社区。\u003c/p\u003e\n","kind":"html","rawMarkdown":"行为者使用 Claude 生成和分析内容。一个案例中，他们每次向 Claude 输入约 25 条社交媒体帖子，让 Claude 分析并返回发帖者的人口类别、位置和政治倾向等信息，同时对每项判断给出置信度。另一个案例中，行为者让 Claude 用波斯语、阿拉伯语、英语和德语为一批（很可能是虚假的）线上人格生成帖子；这些人格被设计成不同亲伊朗政权和反伊朗政权群体中的普通成员。这种行为表明，对方可能试图大规模创建虚假社交账号，同时在冲突双方布点。\n\nForbidden Stories 在 2023 年对泄露的 S2T 宣传册进行调查时，描述了该公司的服务，包括创建虚假账号渗透私人 WhatsApp 和 Telegram 群组、收集成员名单，并进一步升级到网络钓鱼和设备入侵。该行为者借助 Claude 生成的内容，可能就是为这些虚假账号增加可信度，让目标愿意信任它们。我们无法独立确认 Forbidden Stories 报道的后续行动阶段是否真的发生。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc5c7183d60d65a5ac34e454a02653468c287ae24-1920x960.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 1. 该行动的收集漏斗：由 Claude 驱动的分类和人格生成，很可能帮助行为者渗透目标社区。","sourceFormat":"markdown"},"note:sha256:dc99d7da6dd6663bd5cdd2b75a35929c9887634eca74438b8c53c908f23d6fd7":{"html":"\u003cp\u003e攻击者还开展凭据窃取和钓鱼。受害者会被引导到外观相似的身份验证域名，该域名的反向代理把真实 KYC 流程转发给受害者，因此受害者完成的是真实身份验证，但夹在中间的代理会捕获已经通过验证的会话和文档。攻击者随后从自己的机器上使用被捕获会话，访问目标服务和数据。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F57702ff9f64d0a10b7c3c12f0debec33dd185124-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 18. KYC 中间人拦截伪装。\u003c/p\u003e\n","kind":"html","rawMarkdown":"攻击者还开展凭据窃取和钓鱼。受害者会被引导到外观相似的身份验证域名，该域名的反向代理把真实 KYC 流程转发给受害者，因此受害者完成的是真实身份验证，但夹在中间的代理会捕获已经通过验证的会话和文档。攻击者随后从自己的机器上使用被捕获会话，访问目标服务和数据。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F57702ff9f64d0a10b7c3c12f0debec33dd185124-1920x471.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 18. KYC 中间人拦截伪装。","sourceFormat":"markdown"},"note:sha256:df63d8c7459277dc705668abb1f532661e66a3b0face9e2cf9019b77c8788b30":{"html":"\u003cp\u003eClaude 被用于：用真实选举数据构建选区定向系统；设计并运行虚假社交账号网络及其检测规避逻辑；改写和“洗白”虚假新闻；以及反复修改伪造档案。\u003c/p\u003e\n\u003cp\u003e合成新闻媒体还抓取马来西亚合法媒体报道，让模型连续改写数次后，以虚构署名重新发布。它也转载俄罗斯和中国国家关联外国媒体内容，包括 TV BRICS、新华社、Sputnik/RIA 和 CGTN，并删除国家来源归因，把这些内容包装成独立的马来西亚本地报道。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e集群\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eClaude 的用途\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e最严重元素\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e选民定向系统\u003c/td\u003e\n\u003ctd\u003e基于真实人口普查与选民数据构建选区画像\u003c/td\u003e\n\u003ctd\u003e围绕族群、宗教和王室裂缝进行微定向\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e虚假账号网络\u003c/td\u003e\n\u003ctd\u003e约 1,000 个账号、养号与规避逻辑\u003c/td\u003e\n\u003ctd\u003e高度相似发帖；针对一国政府首脑制造人工互动\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成新闻媒体\u003c/td\u003e\n\u003ctd\u003eAI 改写流水线、虚构署名\u003c/td\u003e\n\u003ctd\u003e把俄罗斯和中国国家媒体内容洗成“独立报道”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伪造档案\u003c/td\u003e\n\u003ctd\u003e以虚假权威包装的“情报报告”\u003c/td\u003e\n\u003ctd\u003e制造针对具名个人的虚假指控\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e加密通信工具\u003c/td\u003e\n\u003ctd\u003e行动安全通信\u003c/td\u003e\n\u003ctd\u003e为该行动专门构建的行动安全能力\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 3. 一个覆盖完整影响力行动链条的商业平台：定向、放大、合成新闻、伪造档案和行动安全。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff5b85037fdaf7b599c544e77b0f76c06d75257a1-1990x858.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 6. 虚假评论账号画像，转发并分享来自该平台的内容。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F50310bb34607a9bcac2a1ecddae75c7547ebc5e2-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 7. 虚假新闻媒体“Malaysia Pulse”，是该行动背后的页面之一；域名注册于 2026 年 5 月 10 日。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd1b0a944121b60eaea479afba155f1c75da4a87d-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 8. 与该行动关联的虚假 YouTube 频道，首个也是唯一一个视频在数周后发布。归档：hXXps[://]archive[.]ph/GZCoq。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Claude 被用于：用真实选举数据构建选区定向系统；设计并运行虚假社交账号网络及其检测规避逻辑；改写和“洗白”虚假新闻；以及反复修改伪造档案。\n\n合成新闻媒体还抓取马来西亚合法媒体报道，让模型连续改写数次后，以虚构署名重新发布。它也转载俄罗斯和中国国家关联外国媒体内容，包括 TV BRICS、新华社、Sputnik/RIA 和 CGTN，并删除国家来源归因，把这些内容包装成独立的马来西亚本地报道。\n\n| **集群** | **Claude 的用途** | **最严重元素** |\n| --- | --- | --- |\n| 选民定向系统 | 基于真实人口普查与选民数据构建选区画像 | 围绕族群、宗教和王室裂缝进行微定向 |\n| 虚假账号网络 | 约 1,000 个账号、养号与规避逻辑 | 高度相似发帖；针对一国政府首脑制造人工互动 |\n| 合成新闻媒体 | AI 改写流水线、虚构署名 | 把俄罗斯和中国国家媒体内容洗成“独立报道” |\n| 伪造档案 | 以虚假权威包装的“情报报告” | 制造针对具名个人的虚假指控 |\n| 加密通信工具 | 行动安全通信 | 为该行动专门构建的行动安全能力 |\n\n表 3. 一个覆盖完整影响力行动链条的商业平台：定向、放大、合成新闻、伪造档案和行动安全。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff5b85037fdaf7b599c544e77b0f76c06d75257a1-1990x858.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 6. 虚假评论账号画像，转发并分享来自该平台的内容。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F50310bb34607a9bcac2a1ecddae75c7547ebc5e2-1990x1150.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 7. 虚假新闻媒体“Malaysia Pulse”，是该行动背后的页面之一；域名注册于 2026 年 5 月 10 日。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd1b0a944121b60eaea479afba155f1c75da4a87d-1990x1150.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 8. 与该行动关联的虚假 YouTube 频道，首个也是唯一一个视频在数周后发布。归档：hXXps[://]archive[.]ph/GZCoq。","sourceFormat":"markdown"},"note:sha256:e1a35c003fcb8156add8e393de90fc508942291759d3c504bb9e1ae3e17067b8":{"html":"\u003cp\u003e操作者主要参与开发、消费工作流输出，以及由自主利用工作流产生的入侵事件；或者在通过弱凭据、收集到的凭据和暴露控制台获得访问时亲自介入。进入内部网络后，AI 助手会枚举主机，通过凭据复用和暴露的管理面提升权限，收集凭据和数据存储，把材料中转回操作者基础设施，再根据已获得内容转向下一台主机。尽管 AI 工作流在全球范围针对实体，该行为者的人工直接入侵却只集中于中国境内受害者。\u003c/p\u003e\n","kind":"html","rawMarkdown":"操作者主要参与开发、消费工作流输出，以及由自主利用工作流产生的入侵事件；或者在通过弱凭据、收集到的凭据和暴露控制台获得访问时亲自介入。进入内部网络后，AI 助手会枚举主机，通过凭据复用和暴露的管理面提升权限，收集凭据和数据存储，把材料中转回操作者基础设施，再根据已获得内容转向下一台主机。尽管 AI 工作流在全球范围针对实体，该行为者的人工直接入侵却只集中于中国境内受害者。","sourceFormat":"markdown"},"note:sha256:e66ea3f725ded7a201d01d00e6b7a9127514227d5fa03390b2f8eaf62c6e6f49":{"html":"\u003cp\u003e下列指标仅限于我们评估为运营者控制、并对社区有用的基础设施。平台特定指标，包括应用商店发布者身份以及上文描述的审核规避细节，已直接分享给 Apple 和 Google。\u003c/p\u003e\n","kind":"html","rawMarkdown":"下列指标仅限于我们评估为运营者控制、并对社区有用的基础设施。平台特定指标，包括应用商店发布者身份以及上文描述的审核规避细节，已直接分享给 Apple 和 Google。","sourceFormat":"markdown"},"note:sha256:e79703d925c55ba061d253043e46f194a57b251385936e820afaa08f4086cf4d":{"html":"\u003cp\u003e与上一节直接参与武器开发的案例不同，这两个案例中的行为者没有使用 Claude 为武器设计和开发编写软件，而是利用 Claude 收集外国武器项目及其供应链情报，并采购同时具有军用和民用用途的商品。\u003c/p\u003e\n","kind":"html","rawMarkdown":"与上一节直接参与武器开发的案例不同，这两个案例中的行为者没有使用 Claude 为武器设计和开发编写软件，而是利用 Claude 收集外国武器项目及其供应链情报，并采购同时具有军用和民用用途的商品。","sourceFormat":"markdown"},"note:sha256:e89542a1f8d6e85631f13d5c723ed7736ca3048cfbdd24fc502c79f82b4ed164":{"html":"\u003cp\u003e行动工作流先输入现实议题和预先编写的政治理论文件，再使用 Claude 把这些材料转换成外观正式的情报简报、克隆身份报告、代写证词，以及针对个人建立的目标清单，其中若干材料准备直接提交给阿联酋高级官员。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F04d4d1292aa3c5069a1390dd6b164bec444f2e87-1990x1617.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 18. X/Twitter 账号在 2026 年 6 月 4 日围绕 #SudanIslamists 开展协调行动，发布近乎一致的图像内容，把苏丹穆斯林兄弟会与地区不稳定联系起来。\u003c/p\u003e\n","kind":"html","rawMarkdown":"行动工作流先输入现实议题和预先编写的政治理论文件，再使用 Claude 把这些材料转换成外观正式的情报简报、克隆身份报告、代写证词，以及针对个人建立的目标清单，其中若干材料准备直接提交给阿联酋高级官员。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F04d4d1292aa3c5069a1390dd6b164bec444f2e87-1990x1617.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 18. X/Twitter 账号在 2026 年 6 月 4 日围绕 #SudanIslamists 开展协调行动，发布近乎一致的图像内容，把苏丹穆斯林兄弟会与地区不稳定联系起来。","sourceFormat":"markdown"},"note:sha256:ea30e06ab683584b7734389e0c3cbf6237f8fd52219b6d93f 波斯语国内受众传播该行动内容。"},{"children":[],"kind":"leaf","title":"图 13. Threads 账号展示了其中一次实际定向攻击，此处目标是新闻媒体 Nawapress。"}],"html":"\u003cp\u003e我们确认，行为者把 Claude 作为这三场伊朗宣传行动的主要行政与运营层：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e首先，他们使用 Claude 构建理论和意识形态相关内容，包括数字行动管理与运作指南、操作手册、编码项目组合、人格系统、预警协议和影响力行动的放大时序方案。\u003c/li\u003e\n\u003cli\u003e其次，该网络使用 Claude 把政府官方情报简报转换成定制内容，覆盖波斯语、阿拉伯语、乌尔都语、马来语、西班牙语和英语，并制定了面向 20 种语言的更大计划。\u003c/li\u003e\n\u003cli\u003e第三，他们用 Claude 进行归属洗白，让帖子看起来来自外国作者或独立新闻来源，也让标签活动看起来像由普通公民自发发起。\u003c/li\u003e\n\u003cli\u003e第四，行为者通过 Eitaa、Bale、Rubika 等伊朗国内平台，以及 X/Twitter、Instagram、Telegram、TikTok、YouTube 和 ICCO 文化专员网络分发内容。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e机构\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eClaude 生成的内容\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e分发渠道\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eICCO / 文化与伊斯兰指导部\u003c/td\u003e\n\u003ctd\u003e部级影响力项目组合，以及最高领袖葬礼与继任计划\u003c/td\u003e\n\u003ctd\u003e文化专员网络、外国署名、社交平台\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKhorasan Razavi Islamic Propaganda Office\u003c/td\u003e\n\u003ctd\u003e“Manjanegh”内容工厂理论与人格定制内容；付费活动；分发与 IRGC 叙事一致的内容\u003c/td\u003e\n\u003ctd\u003eEitaa、Bale、Rubika，以及 X、Instagram、Telegram\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eIslamic Propaganda Organization / Bina Cultural Observatory\u003c/td\u003e\n\u003ctd\u003e重新包装 IRGC 发言人通告；系列化战争公共传播；借智库名义洗白\u003c/td\u003e\n\u003ctd\u003eBina Telegram 与 Instagram；国内受众\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 7. 三场伊朗国家关联行动与其机构、Claude 生成内容及分发渠道的对应关系。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F3a285b36a6c34c01c2377882cd8f26838c601c69-1990x734.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 12. 在伊朗国内消息平台 Eitaa 上观察到的 IRGC 关联频道，向波斯语国内受众传播该行动内容。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F615f56ed52a382c0631355595ea691dc268ff1d5-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 13. Threads 账号展示了其中一次实际定向攻击，此处目标是新闻媒体 Nawapress。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"我们确认，行为者把 Claude 作为这三场伊朗宣传行动的主要行政与运营层：\n\n- 首先，他们使用 Claude 构建理论和意识形态相关内容，包括数字行动管理与运作指南、操作手册、编码项目组合、人格系统、预警协议和影响力行动的放大时序方案。\n- 其次，该网络使用 Claude 把政府官方情报简报转换成定制内容，覆盖波斯语、阿拉伯语、乌尔都语、马来语、西班牙语和英语，并制定了面向 20 种语言的更大计划。\n- 第三，他们用 Claude 进行归属洗白，让帖子看起来来自外国作者或独立新闻来源，也让标签活动看起来像由普通公民自发发起。\n- 第四，行为者通过 Eitaa、Bale、Rubika 等伊朗国内平台，以及 X/Twitter、Instagram、Telegram、TikTok、YouTube 和 ICCO 文化专员网络分发内容。\n\n| **机构** | **Claude 生成的内容** | **分发渠道** |\n| --- | --- | --- |\n| ICCO / 文化与伊斯兰指导部 | 部级影响力项目组合，以及最高领袖葬礼与继任计划 | 文化专员网络、外国署名、社交平台 |\n| Khorasan Razavi Islamic Propaganda Office | “Manjanegh”内容工厂理论与人格定制内容；付费活动；分发与 IRGC 叙事一致的内容 | Eitaa、Bale、Rubika，以及 X、Instagram、Telegram |\n| Islamic Propaganda Organization / Bina Cultural Observatory | 重新包装 IRGC 发言人通告；系列化战争公共传播；借智库名义洗白 | Bina Telegram 与 Instagram；国内受众 |\n\n表 7. 三场伊朗国家关联行动与其机构、Claude 生成内容及分发渠道的对应关系。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F3a285b36a6c34c01c2377882cd8f26838c601c69-1990x734.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 12. 在伊朗国内消息平台 Eitaa 上观察到的 IRGC 关联频道，向波斯语国内受众传播该行动内容。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F615f56ed52a382c0631355595ea691dc268ff1d5-1990x1150.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 13. Threads 账号展示了其中一次实际定向攻击，此处目标是新闻媒体 Nawapress。","sourceFormat":"markdown"},"note:sha256:ef670a1c8b23ccc4666e766f6d51c89d067341078c4076d89d0e381b92c79ad2":{"html":"\u003cp\u003e自 2026 年 2 月以来，我们已经检测并阻断多场未经授权的蒸馏行动，并以高置信度将其归因到具体中国实验室。这些行动主要瞄准 Anthropic 的 Opus 级模型。\u003c/p\u003e\n","kind":"html","rawMarkdown":"自 2026 年 2 月以来，我们已经检测并阻断多场未经授权的蒸馏行动，并以高置信度将其归因到具体中国实验室。这些行动主要瞄准 Anthropic 的 Opus 级模型。","sourceFormat":"markdown"},"note:sha256:f09ea88517dd3b81da590df0339a219f812f52fc8c49548686c4ca79941c950b":{"html":"\u003cp\u003e图 2. 攻击生命周期与 AI 集成。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e来源与侦察。\u003c/strong\u003e 大多数入侵从已被攻陷的凭据开始。攻击者还大量开展扫描、语音钓鱼（vishing）、普通钓鱼和域名仿冒，引诱员工交出系统访问权。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd5167078d1d9356e40f423a712471b3d4f859c18-1999x823.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 3. 来源与侦察。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e发现。\u003c/strong\u003e 暴露的访问 Token 也会通过各种自动抓取和挖掘项目，以工业化规模被发现，包括分析应用二进制、代码仓库和集成、客户端代码、凭据存储、容器镜像、元数据端点、开放存储，以及受害者部署的 AI Agent。一个例子是，某攻击项目会下载 Google Play Store 中的所有 APK，并搜索暴露的会话 Token 或其他可被滥用的访问机制。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F501c3ff9d2bbd9362435907d7235e114db66031a-1999x1193.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 4. 发现。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e验证/筛选。\u003c/strong\u003e 在使用或转售之前，所有发现都会经过测试和筛选，例如批量验证云 Key、专门构建登录 Oracle、在生产环境中实时重放、按转售价值分级，以及离线破解。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9ce01ce0e7381c9e67125c0c12089f542a137ebc-1999x792.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 5. 验证/筛选。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e在受害环境内扩张。\u003c/strong\u003e 一枚可用凭据会被用来扩展对受害环境的访问，例如整集群 Secret Dump、管理员 Token 权限放大、CI/CD 注入、数据库与会话表导出、从 Dump 中挖掘签名 Key，以及利用供应商 OAuth 向每个下游租户横向扩散。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F6a6bd5fa483b30c5bfe9fbc894d9a8de93501d02-1999x866.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 6. 在受害环境内扩张。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e外传信道。\u003c/strong\u003e 数据通过六类信道外流：消费级云存储、经 Mesh VPN 连接的私有 NAS、Telegram Bot 数据流、受害者云环境内的中转、C2 信道，以及普通批量 API 拉取。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F880dd51cfdf39c25162963dbf03608811faf4010-1999x792.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 7. 外传信道。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e仓储。\u003c/strong\u003e 战利品会被存储下来以便重复使用和销售：包括一个自托管基础设施，用于再次提供被盗数据库；按受害者分类的战利品树；兼作商店的 Telegram 仓库；以及仍然有效的 Key 存储。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F360fd2e670b587c3dc2f91c5f1ba8b0284abb790-1999x760.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 8. 仓储。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e生成/维持。\u003c/strong\u003e 为了让行动在凭据轮换后仍然持续，攻击者会生成新的凭据和持久访问能力，包括受害账号中的云 API Key、平台开发者 Key、伪造会话和 2FA 验证码，以及网络后门。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc5504af2b3b96d4b74f7b9c6b4b220ea8bf0f0a3-1999x760.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 9. 生成/维持。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e变现。\u003c/strong\u003e 变现方式包括转售渠道与 Key 池、直接财务盗窃、以被盗数据勒索、同时领取漏洞赏金，以及持有批量数据作为施压筹码。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbb32ff7c140deed4174bf8fe87ba5a053a999567-1999x760.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 10. 变现。\u003c/p\u003e\n","kind":"html","rawMarkdown":"图 2. 攻击生命周期与 AI 集成。\n\n**来源与侦察。** 大多数入侵从已被攻陷的凭据开始。攻击者还大量开展扫描、语音钓鱼（vishing）、普通钓鱼和域名仿冒，引诱员工交出系统访问权。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd5167078d1d9356e40f423a712471b3d4f859c18-1999x823.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 3. 来源与侦察。\n\n**发现。** 暴露的访问 Token 也会通过各种自动抓取和挖掘项目，以工业化规模被发现，包括分析应用二进制、代码仓库和集成、客户端代码、凭据存储、容器镜像、元数据端点、开放存储，以及受害者部署的 AI Agent。一个例子是，某攻击项目会下载 Google Play Store 中的所有 APK，并搜索暴露的会话 Token 或其他可被滥用的访问机制。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F501c3ff9d2bbd9362435907d7235e114db66031a-1999x1193.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 4. 发现。\n\n**验证/筛选。** 在使用或转售之前，所有发现都会经过测试和筛选，例如批量验证云 Key、专门构建登录 Oracle、在生产环境中实时重放、按转售价值分级，以及离线破解。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9ce01ce0e7381c9e67125c0c12089f542a137ebc-1999x792.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 5. 验证/筛选。\n\n**在受害环境内扩张。** 一枚可用凭据会被用来扩展对受害环境的访问，例如整集群 Secret Dump、管理员 Token 权限放大、CI/CD 注入、数据库与会话表导出、从 Dump 中挖掘签名 Key，以及利用供应商 OAuth 向每个下游租户横向扩散。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F6a6bd5fa483b30c5bfe9fbc894d9a8de93501d02-1999x866.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 6. 在受害环境内扩张。\n\n**外传信道。** 数据通过六类信道外流：消费级云存储、经 Mesh VPN 连接的私有 NAS、Telegram Bot 数据流、受害者云环境内的中转、C2 信道，以及普通批量 API 拉取。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F880dd51cfdf39c25162963dbf03608811faf4010-1999x792.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 7. 外传信道。\n\n**仓储。** 战利品会被存储下来以便重复使用和销售：包括一个自托管基础设施，用于再次提供被盗数据库；按受害者分类的战利品树；兼作商店的 Telegram 仓库；以及仍然有效的 Key 存储。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F360fd2e670b587c3dc2f91c5f1ba8b0284abb790-1999x760.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 8. 仓储。\n\n**生成/维持。** 为了让行动在凭据轮换后仍然持续，攻击者会生成新的凭据和持久访问能力，包括受害账号中的云 API Key、平台开发者 Key、伪造会话和 2FA 验证码，以及网络后门。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc5504af2b3b96d4b74f7b9c6b4b220ea8bf0f0a3-1999x760.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 9. 生成/维持。\n\n**变现。** 变现方式包括转售渠道与 Key 池、直接财务盗窃、以被盗数据勒索、同时领取漏洞赏金，以及持有批量数据作为施压筹码。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbb32ff7c140deed4174bf8fe87ba5a053a999567-1999x760.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 10. 变现。","sourceFormat":"markdown"},"note:sha256:f2e0c76f0025e3122a84cc4f492f99515109d41ddcc22e5cb8250893d44f0546":{"html":"\u003cp\u003e我们识别到一名位于中国的行为者，其使用 Claude 的聊天、编码和 Agent 工作工具，设计、构建并迭代一套约 16 个模块的中文电子战软件，用电磁频谱探测、干扰或欺骗对手雷达与通信，并用于压制对方防空系统。\u003c/p\u003e\n\u003cp\u003e行为者使用 Claude 从底层逻辑到用户界面构建整个软件系统，并迭代 12 个版本。其中包括实现和优化雷达探测与干扰物理模型、生成漏洞分析模块以及起草中文目标指令。该软件套件会分析对手的雷达、地空导弹阵地、指挥所和通信节点，再计算其探测覆盖范围，评估干扰效果，按照价值和脆弱性对目标排序——包括决定先压制哪些目标——并确定在持续数日的作战中如何把干扰机架次分配给不同目标。套件还对对方资产的压制优先级排序，并模拟 Patriot 与 THAAD 等具体系统的交战包线。\u003c/p\u003e\n\u003cp\u003e项目进行中，行为者把仿真的默认场景改成台湾的 12 个目标，其中包括台湾一处指挥掩体、一处预警雷达站、Patriot 和 Tien Kung 防空连、主要空军基地，以及地区作战指挥总部。\u003c/p\u003e\n\u003cp\u003e行为者还在内部网络上与 Claude 并行运行自托管模型，并通过 Tool-use 集成把软件套件连接到该模型。\u003c/p\u003e\n\u003cp\u003e根据调查，我们评估行为者是一名位于中国的国防和军工研究人员。账号级元数据以及由安全系统标记的内容表明，其与中国研究机构有关，包括 PLA Academy of Military Sciences。我们在内部疑似武器开发调查中发现这些活动，封禁了关联账号，并把调查发现纳入防护以降低未来滥用风险。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F37f60e304d8d25803ecdc8ec1eb075ba84667f0e-1920x1246.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 4. 语料中被提及最多的系统，按出现次数排序。计数反映恢复出的会话中的独立提及次数，说明行为者关注什么，而不是其实际达成了什么能力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别到一名位于中国的行为者，其使用 Claude 的聊天、编码和 Agent 工作工具，设计、构建并迭代一套约 16 个模块的中文电子战软件，用电磁频谱探测、干扰或欺骗对手雷达与通信，并用于压制对方防空系统。\n\n行为者使用 Claude 从底层逻辑到用户界面构建整个软件系统，并迭代 12 个版本。其中包括实现和优化雷达探测与干扰物理模型、生成漏洞分析模块以及起草中文目标指令。该软件套件会分析对手的雷达、地空导弹阵地、指挥所和通信节点，再计算其探测覆盖范围，评估干扰效果，按照价值和脆弱性对目标排序——包括决定先压制哪些目标——并确定在持续数日的作战中如何把干扰机架次分配给不同目标。套件还对对方资产的压制优先级排序，并模拟 Patriot 与 THAAD 等具体系统的交战包线。\n\n项目进行中，行为者把仿真的默认场景改成台湾的 12 个目标，其中包括台湾一处指挥掩体、一处预警雷达站、Patriot 和 Tien Kung 防空连、主要空军基地，以及地区作战指挥总部。\n\n行为者还在内部网络上与 Claude 并行运行自托管模型，并通过 Tool-use 集成把软件套件连接到该模型。\n\n根据调查，我们评估行为者是一名位于中国的国防和军工研究人员。账号级元数据以及由安全系统标记的内容表明，其与中国研究机构有关，包括 PLA Academy of Military Sciences。我们在内部疑似武器开发调查中发现这些活动，封禁了关联账号，并把调查发现纳入防护以降低未来滥用风险。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F37f60e304d8d25803ecdc8ec1eb075ba84667f0e-1920x1246.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 4. 语料中被提及最多的系统，按出现次数排序。计数反映恢复出的会话中的独立提及次数，说明行为者关注什么，而不是其实际达成了什么能力。","sourceFormat":"markdown"},"note:sha256:f344df0666b8cb45d3ee25f436d77f7fd829115df0a3399c4687ba5e39a1c912":{"html":"\u003cp\u003e在这一案例中，一名操作者运行的很可能是一个宗教事务情报收集台。在四条并行工作流中，行为者让 Claude 摄取多语言来源，再按照内部模板生成结构化中文档案。每套模板都要求列出目标的涉华活动、丑闻和可利用“抓手”。实质上，行为者用 Claude 承担了一支分析团队的工作，把它变成由单一操作者运行的模板化流程。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e工作流\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e目标集合\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e输出\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e频率\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e天主教领导层\u003c/td\u003e\n\u003ctd\u003e亚洲各地高级枢机\u003c/td\u003e\n\u003ctd\u003e目标档案\u003c/td\u003e\n\u003ctd\u003e按对象\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e台湾宗教公民社会\u003c/td\u003e\n\u003ctd\u003e台湾基督长老教会领导层\u003c/td\u003e\n\u003ctd\u003e多目标档案 + 场所侦察\u003c/td\u003e\n\u003ctd\u003e事件驱动\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e藏传佛教\u003c/td\u003e\n\u003ctd\u003e流亡行政机构和倡议组织；中国登记协会\u003c/td\u003e\n\u003ctd\u003e态势摘要与组织数据集\u003c/td\u003e\n\u003ctd\u003e每日及批处理\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e法轮功\u003c/td\u003e\n\u003ctd\u003e修炼者及关联媒体（Shen Yun、NTD）\u003c/td\u003e\n\u003ctd\u003e监控摘要\u003c/td\u003e\n\u003ctd\u003e每日\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e基督教传教网络\u003c/td\u003e\n\u003ctd\u003e与新加坡、香港和中国大陆有关的事工网络\u003c/td\u003e\n\u003ctd\u003e国家安全风格“线索报”\u003c/td\u003e\n\u003ctd\u003e不定期\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 5. 该行动各工作流中的监控目标与报告产出。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F4c445959585523daef561e14eaa8f8da2ccc7dde-1920x821.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 3. 情报收集台工作流：多语言来源被摄取后，进入模板化档案、摘要和报告。Claude 在每个阶段用于翻译、摘要、起草和格式化文档。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbef891c7485a75fa18002afbd18909f1d453888e-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 4. 被监控者之一是一所法轮功关联机构的大学教师。行动针对海外群体，对与侨民有关的教育人员和修炼者建立画像。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在这一案例中，一名操作者运行的很可能是一个宗教事务情报收集台。在四条并行工作流中，行为者让 Claude 摄取多语言来源，再按照内部模板生成结构化中文档案。每套模板都要求列出目标的涉华活动、丑闻和可利用“抓手”。实质上，行为者用 Claude 承担了一支分析团队的工作，把它变成由单一操作者运行的模板化流程。\n\n| **工作流** | **目标集合** | **输出** | **频率** |\n| --- | --- | --- | --- |\n| 天主教领导层 | 亚洲各地高级枢机 | 目标档案 | 按对象 |\n| 台湾宗教公民社会 | 台湾基督长老教会领导层 | 多目标档案 + 场所侦察 | 事件驱动 |\n| 藏传佛教 | 流亡行政机构和倡议组织；中国登记协会 | 态势摘要与组织数据集 | 每日及批处理 |\n| 法轮功 | 修炼者及关联媒体（Shen Yun、NTD） | 监控摘要 | 每日 |\n| 基督教传教网络 | 与新加坡、香港和中国大陆有关的事工网络 | 国家安全风格“线索报” | 不定期 |\n\n表 5. 该行动各工作流中的监控目标与报告产出。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F4c445959585523daef561e14eaa8f8da2ccc7dde-1920x821.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 3. 情报收集台工作流：多语言来源被摄取后，进入模板化档案、摘要和报告。Claude 在每个阶段用于翻译、摘要、起草和格式化文档。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbef891c7485a75fa18002afbd18909f1d453888e-1990x1150.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 4. 被监控者之一是一所法轮功关联机构的大学教师。行动针对海外群体，对与侨民有关的教育人员和修炼者建立画像。","sourceFormat":"markdown"},"note:sha256:f36ef43f20ae1db92d6f94d452969c4941de6f7ccb619f0b934c0f00049fb0e5":{"html":"\u003cp\u003e系统搭建完成后，行动以较少人工监督半自主运行。名为 \u003ccode\u003efake_news_3.py\u003c/code\u003e 的自定义程序调用 Claude API，按标准批次生成虚构孟加拉语内容，包括标题、详细叙事和配套图像提示词。程序还针对识字程度较低的农村受众，调优了带有强烈情绪色彩的主题。产出进入固定云存储文件夹，随后被转换为音频和视频，再由第二个脚本提前数月排入 YouTube 发布队列。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e叙事主题\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e手法\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e目标\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e宗教极端主义框架\u003c/td\u003e\n\u003ctd\u003e把反对派描述为计划实施塔利班式伊斯兰教法统治、渗透安全部队\u003c/td\u003e\n\u003ctd\u003eJamaat-e-Islami、BNP、NCP\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e暴力与阴谋\u003c/td\u003e\n\u003ctd\u003e捏造暗杀计划和行动小组\u003c/td\u003e\n\u003ctd\u003e临时政府、学生抗议领袖\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e外国代理人抹黑\u003c/td\u003e\n\u003ctd\u003e把学生领袖标记为外国情报机构代理人\u003c/td\u003e\n\u003ctd\u003e7 月抗议运动\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e腐败与阴谋\u003c/td\u003e\n\u003ctd\u003e捏造金融腐败和秘密跨党联盟\u003c/td\u003e\n\u003ctd\u003e反对党\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 9. 自动化假新闻流水线：从自定义 API 工具、批量捏造内容、云端暂存，到定时发布。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fa96c365e73fecaee2efb1c3149545a9d97c0d812-1990x734.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 14. 行为者用于在分发前存储和暂存视频内容的 Google Drive 文件夹。\u003c/p\u003e\n","kind":"html","rawMarkdown":"系统搭建完成后，行动以较少人工监督半自主运行。名为 `fake_news_3.py` 的自定义程序调用 Claude API，按标准批次生成虚构孟加拉语内容，包括标题、详细叙事和配套图像提示词。程序还针对识字程度较低的农村受众，调优了带有强烈情绪色彩的主题。产出进入固定云存储文件夹，随后被转换为音频和视频，再由第二个脚本提前数月排入 YouTube 发布队列。\n\n| **叙事主题** | **手法** | **目标** |\n| --- | --- | --- |\n| 宗教极端主义框架 | 把反对派描述为计划实施塔利班式伊斯兰教法统治、渗透安全部队 | Jamaat-e-Islami、BNP、NCP |\n| 暴力与阴谋 | 捏造暗杀计划和行动小组 | 临时政府、学生抗议领袖 |\n| 外国代理人抹黑 | 把学生领袖标记为外国情报机构代理人 | 7 月抗议运动 |\n| 腐败与阴谋 | 捏造金融腐败和秘密跨党联盟 | 反对党 |\n\n表 9. 自动化假新闻流水线：从自定义 API 工具、批量捏造内容、云端暂存，到定时发布。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fa96c365e73fecaee2efb1c3149545a9d97c0d812-1990x734.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 14. 行为者用于在分发前存储和暂存视频内容的 Google Drive 文件夹。","sourceFormat":"markdown"},"note:sha256:f724431a8c65de8bb391fe2fa1ed8264b2e11397b5d539b3391f875dc6c56fd6":{"html":"\u003cp\u003e攻击者配置住宅代理和反检测浏览器 Profile，然后由 Bot 在交易所和市场类目标上自动完成注册流程。商业验证码破解服务、自动轮询邮箱以及自动身份验证步骤共同绕过入驻控制，最终把完成验证的账号储备起来供后续行动使用。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F08c5bd02a2fc4c27002bc17f5f07c29e38000d59-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 17. 欺诈账号工厂。\u003c/p\u003e\n","kind":"html","rawMarkdown":"攻击者配置住宅代理和反检测浏览器 Profile，然后由 Bot 在交易所和市场类目标上自动完成注册流程。商业验证码破解服务、自动轮询邮箱以及自动身份验证步骤共同绕过入驻控制，最终把完成验证的账号储备起来供后续行动使用。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F08c5bd02a2fc4c27002bc17f5f07c29e38000d59-1920x471.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 17. 欺诈账号工厂。","sourceFormat":"markdown"},"note:sha256:f9980d945fcd4f6fabaae17bfd7b99306c9723a4de6b59cf89287455d77f4596":{"html":"\u003cp\u003e我们识别并阻断了一名行为者，其把 Claude 当作主要工程劳动力，为马里国家情报部门构建全国国内监控平台。一个 Claude 订阅用户——很可能是位于 Bamako、与马里国家情报机构“Agence Nationale de la Sécurité d’État（ANSE）”合作的独立顾问——使用 Claude 构建名为“Lakana 360”的人口规模国内监控平台。该平台监控马里三家全国移动运营商上的约 2,500 万张 SIM 卡。行为者在设计上绕过了马里法律中部分监控记录披露必须获得法院命令的限制；他要求 Claude 对任何指定电话号码生成情报档案，而不要求 ANSE 用户提供有效法律程序。美国国务院和 \u003ca href=\"https://www.hrw.org/news/2025/02/13/mali-au-action-needed-end-crackdown-opposition-dissent\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHuman Rights Watch\u003c/a\u003e 都曾记录马里安全部门拘留和绑架反对派人士、记者和公民社会成员的情况。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别并阻断了一名行为者，其把 Claude 当作主要工程劳动力，为马里国家情报部门构建全国国内监控平台。一个 Claude 订阅用户——很可能是位于 Bamako、与马里国家情报机构“Agence Nationale de la Sécurité d’État（ANSE）”合作的独立顾问——使用 Claude 构建名为“Lakana 360”的人口规模国内监控平台。该平台监控马里三家全国移动运营商上的约 2,500 万张 SIM 卡。行为者在设计上绕过了马里法律中部分监控记录披露必须获得法院命令的限制；他要求 Claude 对任何指定电话号码生成情报档案，而不要求 ANSE 用户提供有效法律程序。美国国务院和 [Human Rights Watch](https://www.hrw.org/news/2025/02/13/mali-au-action-needed-end-crackdown-opposition-dissent) 都曾记录马里安全部门拘留和绑架反对派人士、记者和公民社会成员的情况。","sourceFormat":"markdown"},"note:sha256:f9abedd8fa2dae32e2451502d037faecb82e09c1f6d4e439582c00f3f19f6d5d":{"html":"\u003cp\u003e我们阻断并封禁了一组用于开展三场行动的账号。在这些行动中，与市级公安和国家安全机关有关联的中国境内行为者使用 Claude 支持“维稳”（党国体系用于指代压制社会动荡和异议的术语）监控与跨国压制。一个案例中，行为者还生成了关于 AI 使用的内部手册，其中包括要求 Claude 扮演服务于中国国家安全体系的情报分析员的提示语。\u003c/p\u003e\n\u003cp\u003e我们认为该行为者与一个市级网警单位有关，该单位使用 Claude 运行国内舆情监控项目。我们还发现该行为者与一名警校学生有关联；后者把 10 名中国普通公民列为中国安全体系所谓需要“管控”的目标。另一个关联方则是地方国家安全局，它使用 Claude 每日生成模板化“态势感知”简报，目标是海外异议人士和公民社会组织。\u003c/p\u003e\n\u003cp\u003e目标范围从国内上访者、维权人士，一直延伸到香港知名民主派人士、六四纪念活动组织者、维吾尔倡议组织以及西方人权机构。在最严重的案例中，行为者要求 Claude 为海外抗议活动生成“行动前场地情报”，也就是在行动实施前对地点进行侦察。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们阻断并封禁了一组用于开展三场行动的账号。在这些行动中，与市级公安和国家安全机关有关联的中国境内行为者使用 Claude 支持“维稳”（党国体系用于指代压制社会动荡和异议的术语）监控与跨国压制。一个案例中，行为者还生成了关于 AI 使用的内部手册，其中包括要求 Claude 扮演服务于中国国家安全体系的情报分析员的提示语。\n\n我们认为该行为者与一个市级网警单位有关，该单位使用 Claude 运行国内舆情监控项目。我们还发现该行为者与一名警校学生有关联；后者把 10 名中国普通公民列为中国安全体系所谓需要“管控”的目标。另一个关联方则是地方国家安全局，它使用 Claude 每日生成模板化“态势感知”简报，目标是海外异议人士和公民社会组织。\n\n目标范围从国内上访者、维权人士，一直延伸到香港知名民主派人士、六四纪念活动组织者、维吾尔倡议组织以及西方人权机构。在最严重的案例中，行为者要求 Claude 为海外抗议活动生成“行动前场地情报”，也就是在行动实施前对地点进行侦察。","sourceFormat":"markdown"},"note:sha256:f9df2e39d77f4b5964fc5206add547b4229188a15e5fdc3f9bc2197fee0e37f8":{"html":"\u003cp\u003e我们以高置信度判断，这两个单位与伊朗准军事国内安全实体有关。行为者使用 Claude 为国家安全客户生成成果；我们还发现证据表明，它们会响应伊朗政府高级官员下达的任务。另有证据显示，这些单位代表伊朗政府对公职候选人进行审查。\u003c/p\u003e\n\u003cp\u003e两个单位都把监控收集数据录入共享案件管理系统“Arman”。在该系统中，一个人的档案包含国家身份证号、信仰、犯罪记录、社交账号，以及一个“action”标签页。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们以高置信度判断，这两个单位与伊朗准军事国内安全实体有关。行为者使用 Claude 为国家安全客户生成成果；我们还发现证据表明，它们会响应伊朗政府高级官员下达的任务。另有证据显示，这些单位代表伊朗政府对公职候选人进行审查。\n\n两个单位都把监控收集数据录入共享案件管理系统“Arman”。在该系统中，一个人的档案包含国家身份证号、信仰、犯罪记录、社交账号，以及一个“action”标签页。","sourceFormat":"markdown"},"note:sha256:fb1a6cb794d8893251bcb9f4880cae327735271c38da7674572d6f87d27c25fe":{"html":"\u003cp\u003e行为者提供主题、话术要点和标签，再用 Claude 把它们转成 50 条主题统一、符合字符数限制、可跨平台发布和分发的帖子。在数个会话中，这些内容还被封装成可“一键复制全部”的交互式组件，直接用于部署。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd54d70fe0a25ebee59b8a9eecb32d70e048e8421-1990x1620.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 17. 虚假评论账号放大内阁部长 Opiyo Wandayi 相关内容，可看到该行动虚假账号之间形成的协调集群。\u003c/p\u003e\n","kind":"html","rawMarkdown":"行为者提供主题、话术要点和标签，再用 Claude 把它们转成 50 条主题统一、符合字符数限制、可跨平台发布和分发的帖子。在数个会话中，这些内容还被封装成可“一键复制全部”的交互式组件，直接用于部署。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd54d70fe0a25ebee59b8a9eecb32d70e048e8421-1990x1620.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 17. 虚假评论账号放大内阁部长 Opiyo Wandayi 相关内容，可看到该行动虚假账号之间形成的协调集群。","sourceFormat":"markdown"},"note:sha256:fe714203b40e53fe2b8ca31fbb02ffdc7a608330bb59c1cb094a71a5a7a8e04c":{"html":"\u003cp\u003e我们识别并移除了一个由单一行为者使用的账号，该账号被用于大规模生产肯尼亚政治内容。行动被设计成看起来像自然、自发的草根舆论。行为者在多个会话中使用 Claude，每次生成整批恰好 50 条推文，并明确要求模型让内容看起来像自发的草根评论，而不是协调行动。\u003c/p\u003e\n\u003cp\u003e该网络围绕肯尼亚重要政治议题和人物进行传播。大量 AI 生成推文赞扬能源内阁部长 Opiyo Wandayi 阻止 Kenya Power 原计划的电价上涨，并使用 #PowerReliefKE 和 #PoweringTheNewKenya 提升可见度。同时，网络还推动“Kenya’s United Opposition 联盟在 2027 年大选前正在瓦解”的叙事，直接针对政治人物 Rigathi Gachagua 和前总统 Uhuru Kenyatta。\u003c/p\u003e\n\u003cp\u003e此外，行为者还以“SHANKI”/“Elkins Marketer”这一营销身份，为肯尼亚零售品牌运行完全相同的 AI 工作流。我们没有发现政府参与的证据，这些活动更符合完全由肯尼亚国内行为者运作的特征。\u003c/p\u003e\n\u003cp\u003e调查显示，这是一场高度结构化的政治“伪草根”行动：它在不同对话中围绕电价上涨推出完全一致、统一的信息。我们使用 Breakout Scale 评估其影响，把它归为 \u003cstrong\u003eCategory One\u003c/strong\u003e。相关活动完全局限于单个平台上的虚假账号和本地影响者网络中，没有成功触达或影响真实公众。\u003c/p\u003e\n\u003cp\u003e我们并不知道背后人员的现实身份，但判断这是一场肯尼亚本地政治伪草根行动。网络的亲政府语气和特定标签表明，它可能与执政联盟立场一致，但我们尚未识别具体责任组织。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别并移除了一个由单一行为者使用的账号，该账号被用于大规模生产肯尼亚政治内容。行动被设计成看起来像自然、自发的草根舆论。行为者在多个会话中使用 Claude，每次生成整批恰好 50 条推文，并明确要求模型让内容看起来像自发的草根评论，而不是协调行动。\n\n该网络围绕肯尼亚重要政治议题和人物进行传播。大量 AI 生成推文赞扬能源内阁部长 Opiyo Wandayi 阻止 Kenya Power 原计划的电价上涨，并使用 #PowerReliefKE 和 #PoweringTheNewKenya 提升可见度。同时，网络还推动“Kenya’s United Opposition 联盟在 2027 年大选前正在瓦解”的叙事，直接针对政治人物 Rigathi Gachagua 和前总统 Uhuru Kenyatta。\n\n此外，行为者还以“SHANKI”/“Elkins Marketer”这一营销身份，为肯尼亚零售品牌运行完全相同的 AI 工作流。我们没有发现政府参与的证据，这些活动更符合完全由肯尼亚国内行为者运作的特征。\n\n调查显示，这是一场高度结构化的政治“伪草根”行动：它在不同对话中围绕电价上涨推出完全一致、统一的信息。我们使用 Breakout Scale 评估其影响，把它归为 **Category One**。相关活动完全局限于单个平台上的虚假账号和本地影响者网络中，没有成功触达或影响真实公众。\n\n我们并不知道背后人员的现实身份，但判断这是一场肯尼亚本地政治伪草根行动。网络的亲政府语气和特定标签表明，它可能与执政联盟立场一致，但我们尚未识别具体责任组织。","sourceFormat":"markdown"},"note:sha256:ff3b040636c98df40be19cf5e64e37993f23da3f9b413f7450bffab1c52e379a":{"html":"\u003cp\u003eGTG-15001 同时展现了现有 AI 模型在诈骗活动中的触达能力与局限。一家位于中国的应用工作室使用 Claude 同时完成两件事：构建一个包含 20 多款交友应用的网络，并驱动其中与用户聊天的 AI 人格——尽管这些应用对外宣称服务完全由真人提供。2026 年 4 月的两周窗口内，我们发现 4,700 多个不同 AI 人格，与至少 25,000 名不同用户发生过对话。\u003c/p\u003e\n\u003cp\u003e工作室还招募真人，把他们与机器人混在同一匹配信息流中。这些真人主要用于完成真实性验证，例如实时视频通话和社交媒体互关，以降低受骗用户的怀疑。真人工作人员本身也得到 AI 增强：另一个模型会为他们生成部分消息。\u003c/p\u003e\n\u003cp\u003e这与我们披露过的一个\u003ca href=\"https://www-cdn.anthropic.com/b2a76c6f6992465c09a6f2fce282f6c0cea8c200.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e2025 年案例\u003c/a\u003e类似，当时另一名行为者把 Telegram Bot 做成服务，让其他诈骗者自动生成交友应用消息。GTG-15001 并没有采用全新的模型滥用技术，但规模大得多，而且刻意把多个 AI 提供商用于彼此不重叠的角色。\u003c/p\u003e\n\u003cp\u003e与本报告许多案例一样，该行为者依赖中国境内的 API 转售/代理基础设施，大规模获得并轮换 AI 模型访问，并绕过 Anthropic Supported Regions 和 Usage Policies。我们封禁了相关威胁行为者账号，并与包括其他 AI 实验室在内的产业伙伴合作，阻断其对多个 AI 模型的使用。\u003c/p\u003e\n","kind":"html","rawMarkdown":"GTG-15001 同时展现了现有 AI 模型在诈骗活动中的触达能力与局限。一家位于中国的应用工作室使用 Claude 同时完成两件事：构建一个包含 20 多款交友应用的网络，并驱动其中与用户聊天的 AI 人格——尽管这些应用对外宣称服务完全由真人提供。2026 年 4 月的两周窗口内，我们发现 4,700 多个不同 AI 人格，与至少 25,000 名不同用户发生过对话。\n\n工作室还招募真人，把他们与机器人混在同一匹配信息流中。这些真人主要用于完成真实性验证，例如实时视频通话和社交媒体互关，以降低受骗用户的怀疑。真人工作人员本身也得到 AI 增强：另一个模型会为他们生成部分消息。\n\n这与我们披露过的一个[2025 年案例](https://www-cdn.anthropic.com/b2a76c6f6992465c09a6f2fce282f6c0cea8c200.pdf)类似，当时另一名行为者把 Telegram Bot 做成服务，让其他诈骗者自动生成交友应用消息。GTG-15001 并没有采用全新的模型滥用技术，但规模大得多，而且刻意把多个 AI 提供商用于彼此不重叠的角色。\n\n与本报告许多案例一样，该行为者依赖中国境内的 API 转售/代理基础设施，大规模获得并轮换 AI 模型访问，并绕过 Anthropic Supported Regions 和 Usage Policies。我们封禁了相关威胁行为者账号，并与包括其他 AI 实验室在内的产业伙伴合作，阻断其对多个 AI 模型的使用。","sourceFormat":"markdown"},"note:sha256:ff7d37972297d17ff5e924e8a52be9a134cc13ef85e128cf2621bf0d268ce22b":{"html":"\u003cp\u003e深入观察网络产出后，可以看到对刚果民主共和国的明显聚焦：所有虚假新闻站点共发布 318 篇相关文章。这些故事通常支持 DRC 政府立场，尤其关注地区矿产交易以及与卢旺达持续紧张的关系。这一策略与网络早期受众增长相符：在最初几周，大部分关注其 X 账号的虚假人设都与 DRC 有关，其 DRC 专用新闻账号一度成为整个行动中分享最多、最受欢迎的账号。\u003c/p\u003e\n\u003cp\u003e我们还观察到一个把自己包装成刚果平民“数字军队”的 X 账号关注了该网络多个账号。我们没有发现任何政府指挥的证据。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?u
