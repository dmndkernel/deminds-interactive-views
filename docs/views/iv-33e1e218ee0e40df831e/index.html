l; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e非法蒸馏与规模化滥用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:b6a6a94f16f9573ca1ad569a9d7ec501fefc577e390810222ee529e7a34d89df\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"259,260","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e应对 AI 滥用：2026 年 9 月 / Anthropic\u003c/span\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"应对-ai-滥用2026-年-9-月-anthropic\"\u003e应对 AI 滥用：2026 年 9 月 / Anthropic\u003c/h1\u003e\n\u003ch2 id=\"全文导读\"\u003e全文导读\u003c/h2\u003e\n\u003cp\u003e这份报告汇总了 Anthropic 威胁情报团队在 \u003cstrong\u003e2025 年 12 月至 2026 年 8 月\u003c/strong\u003e期间识别并阻断的一组 Claude 滥用案例，覆盖网络行动、影响力行动、监控、诈骗与欺诈、生物滥用、常规武器开发以及非法蒸馏。Anthropic 明确说明，这些并非“典型滥用”的统计样本，而是其迄今识别到的、较为显著或新颖的威胁活动案例。因此，阅读时更适合把它视为一组\u003cstrong\u003e高风险前沿案例与趋势信号\u003c/strong\u003e，而不是对所有 AI 滥用发生率的总体估计。\u003c/p\u003e\n\u003ch3 id=\"最重要的关键要点\"\u003e最重要的关键要点\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAI 在恶意网络行动中的角色正从“助手”走向“编排者”。\u003c/strong\u003e 多个案例不再停留于问答或代码建议，而是让多 Agent / Agentic 工作流持续执行侦察、漏洞利用、凭据窃取、数据外传和工具重构；人类更多保留目标选择、结果审阅和变现等关键决策。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI 正压缩高级攻击所需的劳动力、专业知识和工具成本。\u003c/strong\u003e 报告认为，“技术复杂度”越来越难作为判断攻击者能力或背景的可靠信号，因为个人、犯罪团伙与国家关联行动者都可以借助类似的 Agent 框架获得更广的知识覆盖、更深的任务执行和更快的迭代速度。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e攻击经济学正在变化，而不一定是攻击原理完全变新。\u003c/strong\u003e 报告中的大量攻击仍依赖凭据失窃、未修补边缘设备、SQL 注入、钓鱼和暴露服务等传统路径；变化在于侦察、开发、利用和数据处理可以被 AI 并行化、自动化，从而让原本成本过高的目标变得可行。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI 供应链本身已经成为攻击目标。\u003c/strong\u003e API Key、会话令牌、评估沙箱、代理服务、模型路由与经销商网络都被用于窃取访问权限、转嫁计算成本、隐藏攻击来源，甚至尝试获取尚未发布的模型能力。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e影响力行动中的 AI 主要提升规模、速度、语言适配与“看起来像真人”的能力，但传播效果并不自动等于影响力。\u003c/strong\u003e 多个案例展示了批量内容、虚假媒体、合成人设、舆情塑造和政治传播；Anthropic 同时强调，部分网络的真实触达和政策影响无法确认，甚至完全停留在虚假账号网络内部。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e监控与情报场景中，AI 的关键价值正在从写作扩展到“大规模摄取 → 结构化 → 打分 → 定位目标 → 支持行动”。\u003c/strong\u003e 报告包含针对异议人士、宗教群体、海外社群和政治活动者的画像、地理定位、敏感度评级、招募与跨境压制等案例。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e在常规武器与生物领域，AI 可以对知识工作和工程流程产生实质增益，但物理验证、领域能力与现实资源仍然构成边界。\u003c/strong\u003e 案例包括制导软件、反鱼雷火控、无人机集群、电子战、军民两用采购以及高风险生物研究；报告并未把“得到 AI 帮助”等同于“成功部署可用武器”。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e诈骗开始出现“AI 人设 + 真人补位”的混合运营。\u003c/strong\u003e 报告中的虚假约会应用使用大量 Claude 驱动的自动对话人设，并混入真人零工处理视频通话、社交媒体关注等 AI 无法完成的环节，以增强真实性。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e非法蒸馏不仅是模型知识产权问题，也可能成为用户数据与隐私问题。\u003c/strong\u003e Anthropic 称其发现部分实验室或代理网络把真实用户请求转给 Claude，再把 Claude 的回答作为自家模型输出或训练数据来源；其中可能包含个人、企业和机构的敏感信息。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e整份报告反复强调的防御逻辑，是把真实滥用案例转化为检测、阻断和跨机构情报共享。\u003c/strong\u003e Anthropic 表示其对报告中的活动进行了账号处置、规则与检测更新，并在适当情况下与政府及产业伙伴共享情报；这些说法属于 Anthropic 对自身调查和处置结果的陈述。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"阅读备注\"\u003e阅读备注\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e主题\u003c/th\u003e\n\u003cth\u003e报告给出的核心证据或观察\u003c/th\u003e\n\u003cth\u003e阅读时需要保留的边界\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e案例代表性\u003c/td\u003e\n\u003ctd\u003e报告选择的是“最显著、最新颖”的威胁活动\u003c/td\u003e\n\u003ctd\u003e不应把这些案例当作 AI 滥用的总体发生率或普通用户行为样本\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e“AI 增益（uplift）”\u003c/td\u003e\n\u003ctd\u003e主要从\u003cstrong\u003e速度、规模、深度\u003c/strong\u003e观察 AI 相比无 AI 时带来的能力提升\u003c/td\u003e\n\u003ctd\u003e报告中的 uplift 多为案例分析与威胁情报判断，并非统一实验条件下的量化因果测量\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAgent 自主性\u003c/td\u003e\n\u003ctd\u003e多个案例出现多 Agent、定时任务、自动重构、自动侦察和外传\u003c/td\u003e\n\u003ctd\u003e人类仍普遍保留目标选择、结果审阅、变现、现实行动等关键决策；“自主”与“危害严重度”是不同维度\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e网络攻击创新\u003c/td\u003e\n\u003ctd\u003e多数底层手法并不新：凭据、钓鱼、暴露服务、SQL 注入等依旧重要\u003c/td\u003e\n\u003ctd\u003e更值得关注的是自动化改变了单位攻击成本、并行能力和可持续运营能力\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e影响力行动\u003c/td\u003e\n\u003ctd\u003eAI 帮助批量生成、翻译、本地化、伪装身份和运行内容流水线\u003c/td\u003e\n\u003ctd\u003e内容产量或账号规模不等于真实说服力；多个案例的外部触达和影响无法确认\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e监控与压制\u003c/td\u003e\n\u003ctd\u003eAI 被用于批量分析社交内容、建立个人画像、评估脆弱点、支持招募或行动准备\u003c/td\u003e\n\u003ctd\u003e部分归因与最终客户判断带有不同置信度，应保留报告原有的概率与限定语\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e武器与生物风险\u003c/td\u003e\n\u003ctd\u003eAI 可协助规格设计、软件开发、仿真、采购、情报收集和研究规划\u003c/td\u003e\n\u003ctd\u003e报告多次区分知识/工程增益与现实武器、实验或部署成功，不能从“使用 Claude”直接推断成果已实现\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e非法蒸馏\u003c/td\u003e\n\u003ctd\u003eAnthropic 称发现多个针对 Opus 级模型的未授权能力提取活动\u003c/td\u003e\n\u003ctd\u003e涉及具体实验室的归因、用户请求转发方式与隐私影响，均应按报告陈述理解，而非超出证据范围外推\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e数据与来源\u003c/td\u003e\n\u003ctd\u003e文中包含大量 IOC、IP、域名、账号、基础设施与案例编号\u003c/td\u003e\n\u003ctd\u003e这些机器可读指标应原样保留，用于威胁情报语境；不应把其中的存在本身理解为对所有相关主体的泛化判断\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch2 id=\"检测并应对-ai-滥用2026-年-9-月\"\u003e检测并应对 AI 滥用：2026 年 9 月\u003c/h2\u003e\n\u003ch3 id=\"网络行动\"\u003e网络行动\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"#cyber-operations-sep-26\"\u003e阅读更多\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"监控行动\"\u003e监控行动\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"#surveillance-operations-sep-26\"\u003e阅读更多\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"影响力行动\"\u003e影响力行动\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"#influence-operations-sep-26\"\u003e阅读更多\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"常规武器\"\u003e常规武器\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"#conventional-weapons-sep-26\"\u003e阅读更多\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"生物滥用\"\u003e生物滥用\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"#biological-misuse-sep-26\"\u003e阅读更多\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"非法蒸馏\"\u003e非法蒸馏\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"#illicit-distillation-sep-26\"\u003e阅读更多\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e过去八个月里，我们的威胁情报团队识别并阻断了一系列威胁行为者试图利用 Claude 从事恶意活动的行动。本报告分享其中的案例研究，并说明自 2025 年 \u003ca href=\"https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e3 月\u003c/a\u003e、\u003ca href=\"https://www.anthropic.com/news/detecting-countering-misuse-aug-2025\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e8 月\u003c/a\u003e和 \u003ca href=\"https://www.anthropic.com/news/disrupting-AI-espionage\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e11 月\u003c/a\u003e发布此前威胁报告以来，Claude 的恶意使用方式发生了怎样的演变。对于每个案例，我们都阻断了相关活动，根据调查所得强化了防护措施，并在适当情况下与有关当局和行业伙伴共享情报。\u003c/p\u003e\n\u003cp\u003e本报告覆盖了我们在 2025 年 12 月至 2026 年 8 月期间阻断的活动，涉及七类危害：网络行动、影响力行动、监控、诈骗与欺诈、生物滥用、常规武器开发以及蒸馏。相关活动使用了 Claude Haiku、Sonnet 和 Opus 模型。除一例非法蒸馏案例外，没有任何滥用案例涉及 Claude Fable 或 Mythos 级模型。\u003c/p\u003e\n\u003cp\u003e我们在这里分享的案例并不是典型滥用，而是我们迄今识别到的一些最显著、最新颖的威胁活动。我们发布这些内容，是因为我们认为自己有责任披露针对我们服务的恶意滥用。随着模型能力不断增强，如果 AI 开发者和社会中的防御者不采取行动提升安全性，相应风险也会增加。\u003c/p\u003e\n\u003cp\u003e本报告涉及的威胁行为者包括疑似国家支持团体、以经济利益为动机的犯罪分子、商业间谍软件供应商、国家宣传机构以及出于政治动机的个人。案例范围从用于欺诈用户的虚假约会应用网络，到为识别和监控异议人士而构建的监控系统。\u003c/p\u003e\n\u003cp\u003e能力强且长期活动的威胁行为者会持续测试我们的防护措施，并试图绕过我们用于检测和防止滥用的技术措施。我们将继续迭代这些防护，与合作伙伴协调，以提升检测、阻断并\u003ca href=\"https://www.anthropic.com/news/building-safeguards-for-claude\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e预防未来滥用\u003c/a\u003e的能力。\u003c/p\u003e\n\u003cp\u003e我们希望，本报告中的发现能帮助其他开发者在自己的平台上识别类似模式，让政府和公民社会更清楚地看到新兴威胁如何形成，并增强集体防御能力。\u003c/p\u003e\n\u003ch2 id=\"ai-增强的网络行动\"\u003eAI 增强的网络行动\u003c/h2\u003e\n\u003ch3 id=\"网络行动从助手到编排者\"\u003e网络行动：从助手到编排者\u003c/h3\u003e\n\u003cp\u003e过去六个月里，我们的威胁情报团队识别并阻断了一系列威胁行为者使用 Claude 的网络行动。相关行为者包括疑似国家支持团体、以经济利益为动机的犯罪分子以及出于政治动机的个人。本节介绍其中的一些案例。\u003c/p\u003e\n\u003cp\u003e在这些案例研究中，报告会引用“生成式威胁组（Generative Threat Groups，GTGs）”这一称呼，这是 Anthropic 用于标记被观察到正在滥用 AI 的行为者的内部编号体系。报告还尝试衡量“增益（uplift）”：我们用这个词描述 AI 带来的能力提升，即有 AI 与没有 AI 相比，可能造成了多少额外危害。我们从速度、规模和深度三个维度观察这种增益，并尝试判断行为者采用 AI 后，分别如何实质改变这些特征。\u003c/p\u003e\n\u003cp\u003e许多评论者关注 AI 大规模开发漏洞利用代码的风险。虽然这确实构成危险，但 AI 的采用在整个网络攻击杀伤链上带来的风险更为突出：攻击者能够以更少资源、更快速度，在更广、更深的攻击面上行动。\u003c/p\u003e\n\u003cp\u003e这些案例覆盖 2025 年 12 月至 2026 年 8 月。所有案例均涉及 Claude Haiku、Sonnet 和 Opus；我们没有在 Claude Fable 或 Mythos 上发现恶意活动（Mythos 已部署\u003ca href=\"https://www.anthropic.com/news/fable-safeguards-jailbreak-framework\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e一系列防护措施\u003c/a\u003e，大幅降低其执行有害网络任务的能力）。在每个案例中，我们都阻断了相关活动，根据所得信息强化 AI 防护，并在适当情况下与有关当局和行业伙伴共享情报。\u003c/p\u003e\n\u003cp\u003e以下内容先讨论我们在这些网络行动中观察到的关键趋势，再进入具体案例，并说明这些案例如何体现上述趋势。\u003c/p\u003e\n\u003ch3 id=\"趋势\"\u003e趋势\u003c/h3\u003e\n\u003ch4 id=\"复杂攻击不再要求攻击者本身具备同等复杂能力\"\u003e复杂攻击不再要求攻击者本身具备同等复杂能力\u003c/h4\u003e\n\u003cp\u003eAI 模型具备的网络安全技能正在压缩过去横亘在资源充足的国家支持行动与个人操作者之间的劳动力和工具差距。在下文案例中，一名使用被盗 API Key 的黑客行动主义者、若干彼此分散但以经济利益为动机的个人，以及一名国家间谍行动者，都维持了针对多个受害者的持续行动；即使只倒退一年，这类行动也往往需要多名熟练操作者和专业知识才能完成。\u003c/p\u003e\n\u003cp\u003e对威胁情报调查人员而言，“技术复杂度”已不再是判断行动背后是谁的可靠信号。从侦察、工具开发到数据处理与漏洞利用，进攻行动的每一层都得到了 AI 增强。下文 GTG-50014 案例记录了这种能力增益的一个例子。其净效应是获得更广的知识\u003cem\u003e覆盖面\u003c/em\u003e和更深的知识\u003cem\u003e深度\u003c/em\u003e，进而推动能力开发和实施速度进一步提升。\u003c/p\u003e\n\u003cp\u003e2025 年 11 月，我们记录了一种疑似国家支持行动用于实施自主攻击的作业模式。如今，这种模式已经扩散到我们调查过的各类行为者。公开可用的进攻性 Agent 框架，如 \u003ca href=\"https://github.com/vxcontrol/pentagi\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePentAGI\u003c/a\u003e，让任何下载者都能复现其中大量基础编排结构。这类脚手架实际上可以自动化网络攻击杀伤链的各个步骤。我们观察到的操作者从国家机构到单独个人不等，涉及的国家范围也在扩大。GTG-20006 是采用 AI 驱动杀伤链的一个案例。随着模型持续演进和改进，我们判断，会有更多从“独狼”到组织化实体的行为者采用 AI 框架，以更快速度、更大规模实施更复杂的网络攻击。\u003c/p\u003e\n\u003ch4 id=\"ai-在网络行动中的角色正在变得越来越自主\"\u003eAI 在网络行动中的角色正在变得越来越自主\u003c/h4\u003e\n\u003cp\u003e本报告描述的大多数行动，都通过 AI 的直接执行或编排得以实现。AI 的使用已经超出聊天机器人的简单问答，转向由多 Agent 框架执行侦察、漏洞利用和数据外传。人类仍然处于回路中，负责设定攻击目标并审阅外传结果。GTG-20006 是这一趋势的例子：该行为者构建了一套 AI 辅助工作流，一旦其工具被安全产品检测到，就会自动重建并重新部署整套工具。\u003c/p\u003e\n\u003ch3 id=\"gtg-20006俄罗斯间谍活动\"\u003eGTG-20006：俄罗斯间谍活动\u003c/h3\u003e\n\u003cp\u003e历史上，网络间谍行为者通常会开发并部署定制工具包以规避检测。攻击者会持续使用这些工具，直到防御方识别它们并建立签名进行检测和阻断，然后新一轮规避与检测循环重新开始。因此，强健的防御和检测能力能够提高对手的行动成本。然而如今，AI 的采用正在威胁这种机制：它可能让攻击者迅速而轻易地削弱防御方仅凭静态检测向其施加成本的能力。\u003c/p\u003e\n\u003cp\u003eGTG-20006 是一个通过 AI 自动化行动、显著提升作业速度的行为者。我们的归因与公开报道中将其与 Midnight Blizzard 联系起来的说法一致。其中一名操作者讲俄语，使用“JackPoterz”这一网名，其技战术和目标选择与俄罗斯国家关联的间谍活动相符。该团体攻击了乌克兰和欧洲政府中的军事情报目标，以及外交、防务机构和与美国外交政策相关的个人。我们观察到，GTG-20006 使用定制的 AI 驱动工作流，将从开发、基础设施获取、钓鱼、持久化、命令与控制，一直到数据外传的大量行动自动化。\u003c/p\u003e\n\u003cp\u003eGTG-20006 使用了一套定制工具包，包括两类基于 Windows 的植入程序、一套移动端利用工具包、针对浏览器密码存储的凭据窃取工具、一个用于仿冒政府机构等优先目标的钓鱼平台，以及一个管理被攻陷账号的管理控制台。在网络行动过程中，这些工具都通过 AI 辅助工作流按需维护和重新改造。\u003c/p\u003e\n\u003cp\u003e该行为者还使用 AI 监控其工具规避已知安全防御检测的效果。如果监控 Agent 发现已部署的某个恶意软件被安全产品识别，Agent 就会自主开始修改和重新构建该恶意软件，以绕过现有检测。它们被设计为持续迭代 GTG-20006 的工具包，直到不再被检测到。随后，这些工具会被部署到一次性托管服务器上，用于真实行动；受害者流量会被引导到这些服务器下载恶意软件，相关行动包括钓鱼、\u003ca href=\"https://en.wikipedia.org/wiki/ClickFix\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eClickFix\u003c/a\u003e 以及 DNS 劫持等方案。\u003c/p\u003e\n\u003cp\u003e该行为者也用 AI 驱动其钓鱼行动。他们构建了 AI 工作流，用于调研并注册域名，再配置发送钓鱼邮件所需的托管基础设施；另有工作流负责发送邮件，并监视 C2 信道中是否出现成功入侵。人类操作者主要在工作流需要优化时介入，修改驱动这些流程的 Claude Code Skill。\u003c/p\u003e\n\u003cp\u003e我们的调查识别出该行为者在行动规划、侦察和实际攻击中针对的 20 多个不同组织，包括政府部委、防务与情报机构、使领馆及外交机构、智库和国防工业企业。目标主要集中在乌克兰和欧洲，但也延伸至中东和亚洲与海事相关的政府机构。一个反复出现的主题，是乌克兰以及军用无人机技术供应商和供应链。例外目标包括一个与海上航运和追踪有关的东南亚政府实体，以及一个北非政府技术机构。\u003c/p\u003e\n\u003ch4 id=\"网络行动-1\"\u003e网络行动\u003c/h4\u003e\n\u003cp\u003e最常见、反复出现的目标，是乌克兰政府、军方和外交人员。该行为者扫描了二十多个乌克兰政府机构的电子邮件服务和远程访问系统。\u003c/p\u003e\n\u003cp\u003e另一个持续出现的窃取目标是无人机供应链技术。该行为者批量导出了至少两家无人机零部件制造商的邮箱，攻击一家军用无人机制造商，并窃取了一套无人机视觉系统完整的专有软件开发工具包。他们花费数天逆向分析该无人机视觉系统，恢复出产品架构、硬件物料清单、供应商依赖以及一款尚未发布产品的细节。军用无人机控制和 AI 视觉相关固件似乎尤其受到关注。\u003c/p\u003e\n\u003cp\u003e目标并不总是被直接攻击。为间接接近真正目标，该行为者攻陷了至少三家运营酒店住客 Wi‑Fi 的酒店服务供应商。他们使用被盗管理员凭据修改 DNS 记录，使其指向攻击者控制的服务，这种技术称为 DNS 劫持。使用这些供应商服务的酒店住客一旦连接 Wi‑Fi，其网络流量、设备标识符和 IP 地址就会被发送到攻击者服务器。随后，攻击者部署 \u003ca href=\"https://en.wikipedia.org/wiki/ClickFix\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eClickFix\u003c/a\u003e 风格诱饵，向受害者设备投递 Windows、Android 和 iOS 恶意软件。攻击者还能把从酒店管理系统窃取的住客信息，与个人设备中窃取的数据结合起来，进一步聚焦目标。其中尤其受关注的是与乌克兰有关的人员，包括政府官员和无人机制造商。需要指出的是，2026 年 7 月，Microsoft Threat Intelligence 发布了一份关于此处所用窃取与恶意软件投递方式的报告，并将其称为 \u003ca href=\"https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCaptiveCrunch\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e该行为者还接管受害者的 WhatsApp 账号，使用一套\u003ca href=\"https://en.wikipedia.org/wiki/Headless_browser\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e无头浏览器\u003c/a\u003e平台把受害者账号作为伴随设备连接。部分依赖开源 WhatsApp 自动化库 \u003ca href=\"https://github.com/wppconnect-team/wppconnect\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eWPPConnect\u003c/a\u003e，其配置关闭了已读回执，使受害者在大量俄语和乌克兰语对话被批量导出时不易察觉。至少两名前乌克兰高级官员以这种方式遭到针对。\u003c/p\u003e\n\u003cp\u003e该行为者也攻击监控平台。他们在摄像头流媒体服务的应用接口中发现授权缺陷，并据此枚举用户、收集令牌，从而获得受害者实时摄像头视频流的访问权限。\u003c/p\u003e\n\u003cp\u003e同一行为者还入侵了一个北非政府技术机构。他们窃取了一台 VPN 设备的凭据，并利用这些凭据接管该机构的中央账号服务器，由此外传了完整凭据数据库：其中包括超过 30 万条国家身份记录，以及该国超过 50 万家企业的商业登记数据。\u003c/p\u003e\n\u003cp\u003e该行为者持续开发一套云端邮件间谍平台，其中部分使用“Embassy Kit”——一套管理设备代码钓鱼的框架——实施 Microsoft 365 Token 窃取行动。该平台用于针对外交和政府人员，最终访问并外传了至少八个组织的邮件记录，其中包括一个国家检察机构、一所军事教育机构和一个区域性政府间组织。\u003c/p\u003e\n\u003cp\u003eWindows 凭据窃取程序通过“虚假更新”主题的社会工程诱饵投递，同时附带具备完整远程访问能力的配套载荷。这些载荷被设计为冻结受害机器的安全更新，这意味着安全厂商发布的新恶意软件检测签名不会被受害设备获取或执行。\u003c/p\u003e\n\u003cp\u003e该行为者在行动的每个环节都使用了 AI：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e侦察：\u003c/strong\u003e 使用 AI 识别邮件和远程访问系统特征，并从公开来源收集信息，为钓鱼构建目标清单。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e初始访问：\u003c/strong\u003e 使用 AI 构建并运营执行网络入侵行动的平台。该行动主要使用一种“设备代码钓鱼”，滥用云邮件服务的合法登录流程（更多细节参见 Microsoft 的\u003ca href=\"https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e这篇文章\u003c/a\u003e）。行为者用 AI 搭建钓鱼基础设施和利用工具，并在其指挥下让 AI 直接执行部分入侵，包括对受害系统运行命令、收集凭据和横向移动。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e收集与外传：\u003c/strong\u003e 使用 AI 提取并整理数百 GB 被盗数据；部分案例通过从已攻陷邮箱批量导出来完成外传。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e维持访问：\u003c/strong\u003e 通过自动把攻击者控制的设备注册到受害组织租户中，协助维持对被攻陷账号和租户的访问。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e在本地部署环境中，该行为者使用 AI 监控植入程序的隐蔽性与持久化能力。当植入程序被安全产品标记后，攻击者会使用 Claude 系统性识别、修改并重新部署被检测到的制品。\u003c/p\u003e\n\u003cp\u003e上述变化的结果，是 AI 把成本压力重新反向推给了防御方。过去，防御者或许可以通过部署新的检测规则拖慢攻击节奏；现在，至少从理论上说，有能力的对手可以“闭合循环”，以比防御者开发和部署新检测更快的速度绕过传统安全检测。\u003c/p\u003e\n\u003cp\u003e该行为者使用的恶意软件包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWindows 恶意软件：PowerChrome、WUEngine、Shadow C2、MiniPlasma、CloudSyncSvc；\u003c/li\u003e\n\u003cli\u003eAndroid 恶意软件：GiftDrop，一款重新包装的 GiftsExpress Android 监控 RAT；\u003c/li\u003e\n\u003cli\u003eiOS 恶意软件：DarkSword，一条 iOS 漏洞利用链。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch5 id=\"入侵指标\"\u003e入侵指标\u003c/h5\u003e\n\u003cpre\u003e\u003ccode\u003ems365-live[.]com\nteams.ms365-live[.]com\nm365-owa[.]com\nowa-ms365[.]com\nms365-device[.]com\nmslivetest.duckdns[.]org\nmy-invite[.]org\nchamber-ua[.]org\nchathamhouse[.]eu\nukrinform-share[.]net\n104.145.210[.]184\n31.57.243[.]154\nstatistic-ms[.]live\nstatic-ms[.]live\n104.194.151[.]133\nad-g[.]org\n104.194.159[.]55\ndocs-viewer[.]org\n144.172.114[.]192\nwa-connect[.]eu\nmygreatmarket[.]org\nmygreatmarket[.]com\n213.145.86[.]112\n2.26.53[.]194\ncdncounter[.]net\nstatic.cdncounter[.]net\nstuseamandesilt[.]org\napi.stuseamandesilt[.]org\ncdn.stuseamandesilt[.]org\nupdate.stuseamandesilt[.]org\nitechx[.]tel\npdfviewer2024.b-cdn[.]net\nmeridian-protocol[.]org\nmeridiangroup-corp[.]com\nprojectnightcrawler[.]dev\nmetricwave[.]org\nmgsend[.]org\n148.135.195[.]111\n185.198.234[.]26\n185.198.234[.]101\n149.54.42[.]106\n104.194.149[.]228\n38.146.28[.]132\n38.146.28[.]75\nwa-meeting[.]com\nrussianearabroad[.]com\nrussianearabroad[.]org\nanna.manager@russianearabroad[.]net\nevents@embassy-protocol[.]int\nmsedgeupdate_v3[.]exe\nmsedgeupdate[.]exe\nversion[.]dll\nWUEngine[.]exe\nDiagHost[.]exe\nclient_20260507093021_4286d211_x64[.]exe\nfix_network[.]apk\nbe99857449d2856dd5a84e21c8a3d5e0e01456adb44062ddec5a6b4970d8d42c\n918fa52ae45ed60ba7cc8bdc99c3cbe9ab92e0375ec31fc05d0d4513be11c593\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"gtg-50014shinyhunters-打砸抢式机会主义攻击者\"\u003eGTG-50014：ShinyHunters “打砸抢式”机会主义攻击者\u003c/h3\u003e\n\u003cp\u003e有些网络威胁行为者会开展定向入侵，为间谍活动或其他目的寻找特定信息；另一些则没有这么聚焦和精细。历史上，这类机会主义黑客通常采用大范围扫描，识别并探测没有修补的互联网暴露系统，再利用漏洞攻陷或接管目标。我们识别出若干高级威胁行为者，他们使用 AI 增强这种机会主义犯罪活动，借助 Claude 加速大规模扫描、利用并接管目标系统的能力。\u003c/p\u003e\n\u003cp\u003e机会主义攻击形式很多：抢在 N-day 补丁广泛部署前进行批量利用；翻查公开容器仓库、代码仓库、移动应用和网站，寻找凭据、Token 和 API Key；批量扫描和利用存在漏洞的互联网暴露设备；在安全能力不足的新兴服务商上创建服务账号并逃逸其容器；对 LiteLLM 或 OpenClaw 部署实施 Prompt Injection；等等。\u003c/p\u003e\n\u003cp\u003e许多攻击者会在互联网上寻找进入网络和服务的路径，窃取数据用于出售和勒索，之后还可能转售访问权限。AI 出现前这一生态已经存在；AI 则扩大了既有网络犯罪活动的规模和严重程度。借助 AI，攻击者更容易理解各不相同的目标环境并快速适配，独特或冷门的配置也更容易被解释和利用。“通过隐蔽获得安全”的旧观念，在这个 AI 辅助的新环境里已经难以成立：任何连接互联网的事物都可能成为被利用的目标。\u003c/p\u003e\n\u003cp\u003e攻击者一旦进入系统，通常会直接转向数据库寻找客户数据。如果目标是 SaaS 提供商，他们往往进一步利用被盗数据访问下游客户，并提出勒索要求：如果不付款，就把提供商本身以及其客户的数据泄露或出售到网上。\u003c/p\u003e\n\u003cp\u003e我们识别并阻断了多个以经济利益为动机的网络犯罪活动集群，操作者疑似为 \u003ca href=\"https://en.wikipedia.org/wiki/ShinyHunters\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eShinyHunters\u003c/a\u003e 团伙的关联成员。该团伙以多次大规模数据窃取以及随后“付款否则泄露”的勒索而闻名。虽然这些关联成员看起来彼此分散，拥有各自工具和作业流程，但对其方法与目标进行分析后，可以看出它们属于同一个总体行动。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ffc8ef227f64c039d99e27145fae5204fd8a81501-1920x312.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 1. 我们阻断的疑似 ShinyHunters 关联成员集群所共有的攻击生命周期：从收集凭据到勒索。\u003c/p\u003e\n\u003cp\u003e一名使用（MeowSHA | frkoo | blazespider）等别名的法语操作者，在由 10 个 AWS EC2 工作节点组成的集群上运行分布式凭据收集流水线。该流水线从多个应用商店来源批量下载 180 万个不同的 Android APK，进行反编译，并使用 \u003ca href=\"https://github.com/trufflesecurity/trufflehog\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eTruffleHog\u003c/a\u003e 扫描硬编码 Secret。经验证的发现会实时路由到一个 Telegram 群组，并按超过 100 种来源类型组织。另一个并行的 GitHub 组织邮箱收集器则形成第二条被盗 GitHub Personal Access Token 流。frkoo 相关的大多数已确认入侵，其初始访问凭据都由这两条流水线提供。\u003c/p\u003e\n\u003cp\u003e这些操作者的行动安全纪律参差不齐。frkoo 管理着基于 EC2 的凭据收集流水线，却暴露了自己的 EC2 中转 IP、多个 Telegram Bot Token、一台带硬编码凭据的 Squid 代理，以及至少一次直接在受害环境中上传到公共 paste 站点的记录。他们还注册了一个仿冒法国国家警察的域名 policenationale[.]cc（不过我们认为，这主要用于犯罪商店的品牌包装，而不是钓鱼诱饵）。其子域 autoshop.policenationale[.]cc 是攻击者银行卡黑产商店的 Web 前端：出售被盗支付卡记录（“fiches”），并附带 BIN 查询、完整持卡人 PII，以及受害者地址的交互式地理定位地图。客户通过 Telegram Mini App（@Soraki_Bot）访问该商店，后台是攻击者的“Soraki”平台，一个 PostgreSQL/GraphQL 技术栈，同时把多个法国数据泄露数据集汇总成可搜索服务，其中包括一个约 40 万条记录、含 IBAN 和 BIC 的电信/ISP 数据集。\u003c/p\u003e\n\u003cp\u003e在这一操作者群体中，多次入侵目标时，都出现了从目标企业软件供应商环境中窃取 AI API Key 的情况。其中一枚被盗 API Key 随后被攻击者使用了约三周，用于开展二次攻击：包括攻陷一家法国零售连锁，并探测一个 Web3 身份平台。他们还继续对一个非营利组织受害者实施入侵后的攻击；frkoo 甚至继续开发其银行卡黑产商店，该商店伪装成法国警察部门网站。\u003c/p\u003e\n\u003cp\u003e较严重的一次入侵发生在一家技术提供商。操作者外传了超过 1 TB 数据，其中包括数十万条国家身份标识和数百万条支付卡记录，随后把被盗材料放到公共网站上，借此施压受害者支付赎金。在一家航空公司，威胁行为者访问了存储数千万乘客记录的系统。在一家能源公司，操作者声称其能够远程控制安装在客户家中的电动车充电器电流。\u003c/p\u003e\n\u003cp\u003e另一名关联成员似乎专门从事供应链窃取：先攻陷一家公司，再借此触达其下游客户数据。攻陷一家 SaaS 提供商后，操作者借助这个落脚点提取了大约 200 家下游客户组织的数据。随后在约 34 小时内导出一个会话存储，其中包含跨 40 多个企业租户的 2,100 余组 Azure AD Token。几乎所有工作都由 AI Agent 完成。\u003c/p\u003e\n\u003cp\u003e在另一场入侵中，攻击者在针对一家 SaaS 供应商的供应链攻击中使用 Claude，加快侦察并支持数据外传。攻击者利用跨站脚本漏洞获得访问权限、提升权限，最终从数千家下游客户组织外传数据。Claude 被用于帮助识别、理解并调用开发者与身份验证 API，创建和转换高权限 Token，并构建批量导出和跨租户数据收集工具。针对另一个目标时，同一攻击者还声称曾从其已经入侵并勒索的两家公司分别领取 2,000 美元和 5,000 美元的 HackerOne 漏洞赏金，把 Bug Bounty 披露机制与入侵行为都当成针对同一目标的额外收入来源。他们还似乎在对特定目标实施聚焦攻击期间，抓取 HackerOne 与其他 Bug Bounty 提交内容作为侦察来源。\u003c/p\u003e\n\u003cp\u003e这一威胁行为者的行动节奏相对稳定。对一家企业软件公司的入侵，从首次访问到批量窃取数据只用了数小时；另一次入侵则从一枚被盗开发者 Token 开始，在约三小时内升级到对受害者云环境的完全管理员控制。此后，攻击者反复抓取内部数据存储；在供应链攻击中，还会继续迭代访问并抓取终端客户数据。我们检测并封禁了与 ShinyHunters 相关人员有关的账号，实施了用于检测和阻断其未来滥用的措施，并与政府机构、产业伙伴和受害者合作，修复这些行为者造成的威胁。\u003c/p\u003e\n\u003cp\u003e入侵和数据窃取中的 AI 使用方式，经常类似于“\u003ca href=\"https://www.anthropic.com/news/detecting-countering-misuse-aug-2025\" target=\"_blank\" rel=\"noopener noreferrer\"\u003evibe hacking\u003c/a\u003e”：操作者只给 AI 一个总体目标，例如“使用某实体的凭据”或“从一批目标中获取数据”，随后让 AI 自己评估环境、编写并执行脚本、提供摘要，再反复执行直到任务完成。很多情况下，操作者并不直接理解每个目标环境，也不了解定位和访问高价值信息的复杂细节，而是把这些具体问题交给 AI。\u003c/p\u003e\n\u003cp\u003e安全从业者常用“living off the land（利用现有环境）”形容使用受害环境中已有工具的攻击。本节描述的机会主义黑客把同样原则应用到了 AI：他们既把 AI 供应链视作攻击目标，也把它当作资源。从多个目标环境中窃取 AI API Key 后，再利用这些 Key 获得额外 AI 计算资源。所有这些案例中的 API Key 都是从 Anthropic 客户环境中窃取的；该行为者并未攻陷 Anthropic 自身系统。后文“AI 供应链”章节会详细讨论这种模式。\u003c/p\u003e\n\u003ch5 id=\"攻击生命周期与-ai-集成\"\u003e攻击生命周期与 AI 集成\u003c/h5\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fed4f8197b659c784685ee2be7b6f02efb523ee91-1920x500.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 2. 攻击生命周期与 AI 集成。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e来源与侦察。\u003c/strong\u003e 大多数入侵从已被攻陷的凭据开始。攻击者还大量开展扫描、语音钓鱼（vishing）、普通钓鱼和域名仿冒，引诱员工交出系统访问权。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd5167078d1d9356e40f423a712471b3d4f859c18-1999x823.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 3. 来源与侦察。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e发现。\u003c/strong\u003e 暴露的访问 Token 也会通过各种自动抓取和挖掘项目，以工业化规模被发现，包括分析应用二进制、代码仓库和集成、客户端代码、凭据存储、容器镜像、元数据端点、开放存储，以及受害者部署的 AI Agent。一个例子是，某攻击项目会下载 Google Play Store 中的所有 APK，并搜索暴露的会话 Token 或其他可被滥用的访问机制。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F501c3ff9d2bbd9362435907d7235e114db66031a-1999x1193.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 4. 发现。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e验证/筛选。\u003c/strong\u003e 在使用或转售之前，所有发现都会经过测试和筛选，例如批量验证云 Key、专门构建登录 Oracle、在生产环境中实时重放、按转售价值分级，以及离线破解。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9ce01ce0e7381c9e67125c0c12089f542a137ebc-1999x792.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 5. 验证/筛选。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e在受害环境内扩张。\u003c/strong\u003e 一枚可用凭据会被用来扩展对受害环境的访问，例如整集群 Secret Dump、管理员 Token 权限放大、CI/CD 注入、数据库与会话表导出、从 Dump 中挖掘签名 Key，以及利用供应商 OAuth 向每个下游租户横向扩散。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F6a6bd5fa483b30c5bfe9fbc894d9a8de93501d02-1999x866.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 6. 在受害环境内扩张。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e外传信道。\u003c/strong\u003e 数据通过六类信道外流：消费级云存储、经 Mesh VPN 连接的私有 NAS、Telegram Bot 数据流、受害者云环境内的中转、C2 信道，以及普通批量 API 拉取。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F880dd51cfdf39c25162963dbf03608811faf4010-1999x792.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 7. 外传信道。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e仓储。\u003c/strong\u003e 战利品会被存储下来以便重复使用和销售：包括一个自托管基础设施，用于再次提供被盗数据库；按受害者分类的战利品树；兼作商店的 Telegram 仓库；以及仍然有效的 Key 存储。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F360fd2e670b587c3dc2f91c5f1ba8b0284abb790-1999x760.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 8. 仓储。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e生成/维持。\u003c/strong\u003e 为了让行动在凭据轮换后仍然持续，攻击者会生成新的凭据和持久访问能力，包括受害账号中的云 API Key、平台开发者 Key、伪造会话和 2FA 验证码，以及网络后门。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc5504af2b3b96d4b74f7b9c6b4b220ea8bf0f0a3-1999x760.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 9. 生成/维持。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e变现。\u003c/strong\u003e 变现方式包括转售渠道与 Key 池、直接财务盗窃、以被盗数据勒索、同时领取漏洞赏金，以及持有批量数据作为施压筹码。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbb32ff7c140deed4174bf8fe87ba5a053a999567-1999x760.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 10. 变现。\u003c/p\u003e\n\u003ch5 id=\"观察到的常见工作流\"\u003e观察到的常见工作流\u003c/h5\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9ca8558aea18b56c588e1fb34b6b8cbd01bf093a-1813x1999.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 11. 观察到的常见工作流。\u003c/p\u003e\n\u003ch5 id=\"入侵指标-1\"\u003e入侵指标\u003c/h5\u003e\n\u003cpre\u003e\u003ccode\u003eupdatebea
