</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-13T02:39:51.384Z","language":"en","name":"DeMinds","version":"1.0.37"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"应对 AI 滥用：2026 年 9 月 Anthropic","outlineVersion":1},"sourceRevision":"sha256:d7196b8681d8593ce5ecbefdade3f246ca13748388b00a95fe293e64ad8e9b20","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Countering misuse of AI  September 2026   Anthropic.md","sourceUrl":"https://www.anthropic.com/threat-intelligence-report-september-2026","title":"应对 AI 滥用：2026 年 9 月 Anthropic"},"files":[{"byteLength":240149,"content":"# 应对 AI 滥用：2026 年 9 月 / Anthropic\n\n## 全文导读\n\n这份报告汇总了 Anthropic 威胁情报团队在 **2025 年 12 月至 2026 年 8 月**期间识别并阻断的一组 Claude 滥用案例，覆盖网络行动、影响力行动、监控、诈骗与欺诈、生物滥用、常规武器开发以及非法蒸馏。Anthropic 明确说明，这些并非“典型滥用”的统计样本，而是其迄今识别到的、较为显著或新颖的威胁活动案例。因此，阅读时更适合把它视为一组**高风险前沿案例与趋势信号**，而不是对所有 AI 滥用发生率的总体估计。\n\n### 最重要的关键要点\n\n- **AI 在恶意网络行动中的角色正从“助手”走向“编排者”。** 多个案例不再停留于问答或代码建议，而是让多 Agent / Agentic 工作流持续执行侦察、漏洞利用、凭据窃取、数据外传和工具重构；人类更多保留目标选择、结果审阅和变现等关键决策。\n- **AI 正压缩高级攻击所需的劳动力、专业知识和工具成本。** 报告认为，“技术复杂度”越来越难作为判断攻击者能力或背景的可靠信号，因为个人、犯罪团伙与国家关联行动者都可以借助类似的 Agent 框架获得更广的知识覆盖、更深的任务执行和更快的迭代速度。\n- **攻击经济学正在变化，而不一定是攻击原理完全变新。** 报告中的大量攻击仍依赖凭据失窃、未修补边缘设备、SQL 注入、钓鱼和暴露服务等传统路径；变化在于侦察、开发、利用和数据处理可以被 AI 并行化、自动化，从而让原本成本过高的目标变得可行。\n- **AI 供应链本身已经成为攻击目标。** API Key、会话令牌、评估沙箱、代理服务、模型路由与经销商网络都被用于窃取访问权限、转嫁计算成本、隐藏攻击来源，甚至尝试获取尚未发布的模型能力。\n- **影响力行动中的 AI 主要提升规模、速度、语言适配与“看起来像真人”的能力，但传播效果并不自动等于影响力。** 多个案例展示了批量内容、虚假媒体、合成人设、舆情塑造和政治传播；Anthropic 同时强调，部分网络的真实触达和政策影响无法确认，甚至完全停留在虚假账号网络内部。\n- **监控与情报场景中，AI 的关键价值正在从写作扩展到“大规模摄取 → 结构化 → 打分 → 定位目标 → 支持行动”。** 报告包含针对异议人士、宗教群体、海外社群和政治活动者的画像、地理定位、敏感度评级、招募与跨境压制等案例。\n- **在常规武器与生物领域，AI 可以对知识工作和工程流程产生实质增益，但物理验证、领域能力与现实资源仍然构成边界。** 案例包括制导软件、反鱼雷火控、无人机集群、电子战、军民两用采购以及高风险生物研究；报告并未把“得到 AI 帮助”等同于“成功部署可用武器”。\n- **诈骗开始出现“AI 人设 + 真人补位”的混合运营。** 报告中的虚假约会应用使用大量 Claude 驱动的自动对话人设，并混入真人零工处理视频通话、社交媒体关注等 AI 无法完成的环节，以增强真实性。\n- **非法蒸馏不仅是模型知识产权问题，也可能成为用户数据与隐私问题。** Anthropic 称其发现部分实验室或代理网络把真实用户请求转给 Claude，再把 Claude 的回答作为自家模型输出或训练数据来源；其中可能包含个人、企业和机构的敏感信息。\n- **整份报告反复强调的防御逻辑，是把真实滥用案例转化为检测、阻断和跨机构情报共享。** Anthropic 表示其对报告中的活动进行了账号处置、规则与检测更新，并在适当情况下与政府及产业伙伴共享情报；这些说法属于 Anthropic 对自身调查和处置结果的陈述。\n\n### 阅读备注\n\n| 主题 | 报告给出的核心证据或观察 | 阅读时需要保留的边界 |\n| --- | --- | --- |\n| 案例代表性 | 报告选择的是“最显著、最新颖”的威胁活动 | 不应把这些案例当作 AI 滥用的总体发生率或普通用户行为样本 |\n| “AI 增益（uplift）” | 主要从**速度、规模、深度**观察 AI 相比无 AI 时带来的能力提升 | 报告中的 uplift 多为案例分析与威胁情报判断，并非统一实验条件下的量化因果测量 |\n| Agent 自主性 | 多个案例出现多 Agent、定时任务、自动重构、自动侦察和外传 | 人类仍普遍保留目标选择、结果审阅、变现、现实行动等关键决策；“自主”与“危害严重度”是不同维度 |\n| 网络攻击创新 | 多数底层手法并不新：凭据、钓鱼、暴露服务、SQL 注入等依旧重要 | 更值得关注的是自动化改变了单位攻击成本、并行能力和可持续运营能力 |\n| 影响力行动 | AI 帮助批量生成、翻译、本地化、伪装身份和运行内容流水线 | 内容产量或账号规模不等于真实说服力；多个案例的外部触达和影响无法确认 |\n| 监控与压制 | AI 被用于批量分析社交内容、建立个人画像、评估脆弱点、支持招募或行动准备 | 部分归因与最终客户判断带有不同置信度，应保留报告原有的概率与限定语 |\n| 武器与生物风险 | AI 可协助规格设计、软件开发、仿真、采购、情报收集和研究规划 | 报告多次区分知识/工程增益与现实武器、实验或部署成功，不能从“使用 Claude”直接推断成果已实现 |\n| 非法蒸馏 | Anthropic 称发现多个针对 Opus 级模型的未授权能力提取活动 | 涉及具体实验室的归因、用户请求转发方式与隐私影响，均应按报告陈述理解，而非超出证据范围外推 |\n| 数据与来源 | 文中包含大量 IOC、IP、域名、账号、基础设施与案例编号 | 这些机器可读指标应原样保留，用于威胁情报语境；不应把其中的存在本身理解为对所有相关主体的泛化判断 |\n\n## 检测并应对 AI 滥用：2026 年 9 月\n\n### 网络行动\n\n[阅读更多](#cyber-operations-sep-26)\n\n### 监控行动\n\n[阅读更多](#surveillance-operations-sep-26)\n\n### 影响力行动\n\n[阅读更多](#influence-operations-sep-26)\n\n### 常规武器\n\n[阅读更多](#conventional-weapons-sep-26)\n\n### 生物滥用\n\n[阅读更多](#biological-misuse-sep-26)\n\n### 非法蒸馏\n\n[阅读更多](#illicit-distillation-sep-26)\n\n过去八个月里，我们的威胁情报团队识别并阻断了一系列威胁行为者试图利用 Claude 从事恶意活动的行动。本报告分享其中的案例研究，并说明自 2025 年 [3 月](https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025)、[8 月](https://www.anthropic.com/news/detecting-countering-misuse-aug-2025)和 [11 月](https://www.anthropic.com/news/disrupting-AI-espionage)发布此前威胁报告以来，Claude 的恶意使用方式发生了怎样的演变。对于每个案例，我们都阻断了相关活动，根据调查所得强化了防护措施，并在适当情况下与有关当局和行业伙伴共享情报。\n\n本报告覆盖了我们在 2025 年 12 月至 2026 年 8 月期间阻断的活动，涉及七类危害：网络行动、影响力行动、监控、诈骗与欺诈、生物滥用、常规武器开发以及蒸馏。相关活动使用了 Claude Haiku、Sonnet 和 Opus 模型。除一例非法蒸馏案例外，没有任何滥用案例涉及 Claude Fable 或 Mythos 级模型。\n\n我们在这里分享的案例并不是典型滥用，而是我们迄今识别到的一些最显著、最新颖的威胁活动。我们发布这些内容，是因为我们认为自己有责任披露针对我们服务的恶意滥用。随着模型能力不断增强，如果 AI 开发者和社会中的防御者不采取行动提升安全性，相应风险也会增加。\n\n本报告涉及的威胁行为者包括疑似国家支持团体、以经济利益为动机的犯罪分子、商业间谍软件供应商、国家宣传机构以及出于政治动机的个人。案例范围从用于欺诈用户的虚假约会应用网络，到为识别和监控异议人士而构建的监控系统。\n\n能力强且长期活动的威胁行为者会持续测试我们的防护措施，并试图绕过我们用于检测和防止滥用的技术措施。我们将继续迭代这些防护，与合作伙伴协调，以提升检测、阻断并[预防未来滥用](https://www.anthropic.com/news/building-safeguards-for-claude)的能力。\n\n我们希望，本报告中的发现能帮助其他开发者在自己的平台上识别类似模式，让政府和公民社会更清楚地看到新兴威胁如何形成，并增强集体防御能力。\n\n## AI 增强的网络行动\n\n### 网络行动：从助手到编排者\n\n过去六个月里，我们的威胁情报团队识别并阻断了一系列威胁行为者使用 Claude 的网络行动。相关行为者包括疑似国家支持团体、以经济利益为动机的犯罪分子以及出于政治动机的个人。本节介绍其中的一些案例。\n\n在这些案例研究中，报告会引用“生成式威胁组（Generative Threat Groups，GTGs）”这一称呼，这是 Anthropic 用于标记被观察到正在滥用 AI 的行为者的内部编号体系。报告还尝试衡量“增益（uplift）”：我们用这个词描述 AI 带来的能力提升，即有 AI 与没有 AI 相比，可能造成了多少额外危害。我们从速度、规模和深度三个维度观察这种增益，并尝试判断行为者采用 AI 后，分别如何实质改变这些特征。\n\n许多评论者关注 AI 大规模开发漏洞利用代码的风险。虽然这确实构成危险，但 AI 的采用在整个网络攻击杀伤链上带来的风险更为突出：攻击者能够以更少资源、更快速度，在更广、更深的攻击面上行动。\n\n这些案例覆盖 2025 年 12 月至 2026 年 8 月。所有案例均涉及 Claude Haiku、Sonnet 和 Opus；我们没有在 Claude Fable 或 Mythos 上发现恶意活动（Mythos 已部署[一系列防护措施](https://www.anthropic.com/news/fable-safeguards-jailbreak-framework)，大幅降低其执行有害网络任务的能力）。在每个案例中，我们都阻断了相关活动，根据所得信息强化 AI 防护，并在适当情况下与有关当局和行业伙伴共享情报。\n\n以下内容先讨论我们在这些网络行动中观察到的关键趋势，再进入具体案例，并说明这些案例如何体现上述趋势。\n\n### 趋势\n\n#### 复杂攻击不再要求攻击者本身具备同等复杂能力\n\nAI 模型具备的网络安全技能正在压缩过去横亘在资源充足的国家支持行动与个人操作者之间的劳动力和工具差距。在下文案例中，一名使用被盗 API Key 的黑客行动主义者、若干彼此分散但以经济利益为动机的个人，以及一名国家间谍行动者，都维持了针对多个受害者的持续行动；即使只倒退一年，这类行动也往往需要多名熟练操作者和专业知识才能完成。\n\n对威胁情报调查人员而言，“技术复杂度”已不再是判断行动背后是谁的可靠信号。从侦察、工具开发到数据处理与漏洞利用，进攻行动的每一层都得到了 AI 增强。下文 GTG-50014 案例记录了这种能力增益的一个例子。其净效应是获得更广的知识*覆盖面*和更深的知识*深度*，进而推动能力开发和实施速度进一步提升。\n\n2025 年 11 月，我们记录了一种疑似国家支持行动用于实施自主攻击的作业模式。如今，这种模式已经扩散到我们调查过的各类行为者。公开可用的进攻性 Agent 框架，如 [PentAGI](https://github.com/vxcontrol/pentagi)，让任何下载者都能复现其中大量基础编排结构。这类脚手架实际上可以自动化网络攻击杀伤链的各个步骤。我们观察到的操作者从国家机构到单独个人不等，涉及的国家范围也在扩大。GTG-20006 是采用 AI 驱动杀伤链的一个案例。随着模型持续演进和改进，我们判断，会有更多从“独狼”到组织化实体的行为者采用 AI 框架，以更快速度、更大规模实施更复杂的网络攻击。\n\n#### AI 在网络行动中的角色正在变得越来越自主\n\n本报告描述的大多数行动，都通过 AI 的直接执行或编排得以实现。AI 的使用已经超出聊天机器人的简单问答，转向由多 Agent 框架执行侦察、漏洞利用和数据外传。人类仍然处于回路中，负责设定攻击目标并审阅外传结果。GTG-20006 是这一趋势的例子：该行为者构建了一套 AI 辅助工作流，一旦其工具被安全产品检测到，就会自动重建并重新部署整套工具。\n\n### GTG-20006：俄罗斯间谍活动\n\n历史上，网络间谍行为者通常会开发并部署定制工具包以规避检测。攻击者会持续使用这些工具，直到防御方识别它们并建立签名进行检测和阻断，然后新一轮规避与检测循环重新开始。因此，强健的防御和检测能力能够提高对手的行动成本。然而如今，AI 的采用正在威胁这种机制：它可能让攻击者迅速而轻易地削弱防御方仅凭静态检测向其施加成本的能力。\n\nGTG-20006 是一个通过 AI 自动化行动、显著提升作业速度的行为者。我们的归因与公开报道中将其与 Midnight Blizzard 联系起来的说法一致。其中一名操作者讲俄语，使用“JackPoterz”这一网名，其技战术和目标选择与俄罗斯国家关联的间谍活动相符。该团体攻击了乌克兰和欧洲政府中的军事情报目标，以及外交、防务机构和与美国外交政策相关的个人。我们观察到，GTG-20006 使用定制的 AI 驱动工作流，将从开发、基础设施获取、钓鱼、持久化、命令与控制，一直到数据外传的大量行动自动化。\n\nGTG-20006 使用了一套定制工具包，包括两类基于 Windows 的植入程序、一套移动端利用工具包、针对浏览器密码存储的凭据窃取工具、一个用于仿冒政府机构等优先目标的钓鱼平台，以及一个管理被攻陷账号的管理控制台。在网络行动过程中，这些工具都通过 AI 辅助工作流按需维护和重新改造。\n\n该行为者还使用 AI 监控其工具规避已知安全防御检测的效果。如果监控 Agent 发现已部署的某个恶意软件被安全产品识别，Agent 就会自主开始修改和重新构建该恶意软件，以绕过现有检测。它们被设计为持续迭代 GTG-20006 的工具包，直到不再被检测到。随后，这些工具会被部署到一次性托管服务器上，用于真实行动；受害者流量会被引导到这些服务器下载恶意软件，相关行动包括钓鱼、[ClickFix](https://en.wikipedia.org/wiki/ClickFix) 以及 DNS 劫持等方案。\n\n该行为者也用 AI 驱动其钓鱼行动。他们构建了 AI 工作流，用于调研并注册域名，再配置发送钓鱼邮件所需的托管基础设施；另有工作流负责发送邮件，并监视 C2 信道中是否出现成功入侵。人类操作者主要在工作流需要优化时介入，修改驱动这些流程的 Claude Code Skill。\n\n我们的调查识别出该行为者在行动规划、侦察和实际攻击中针对的 20 多个不同组织，包括政府部委、防务与情报机构、使领馆及外交机构、智库和国防工业企业。目标主要集中在乌克兰和欧洲，但也延伸至中东和亚洲与海事相关的政府机构。一个反复出现的主题，是乌克兰以及军用无人机技术供应商和供应链。例外目标包括一个与海上航运和追踪有关的东南亚政府实体，以及一个北非政府技术机构。\n\n#### 网络行动\n\n最常见、反复出现的目标，是乌克兰政府、军方和外交人员。该行为者扫描了二十多个乌克兰政府机构的电子邮件服务和远程访问系统。\n\n另一个持续出现的窃取目标是无人机供应链技术。该行为者批量导出了至少两家无人机零部件制造商的邮箱，攻击一家军用无人机制造商，并窃取了一套无人机视觉系统完整的专有软件开发工具包。他们花费数天逆向分析该无人机视觉系统，恢复出产品架构、硬件物料清单、供应商依赖以及一款尚未发布产品的细节。军用无人机控制和 AI 视觉相关固件似乎尤其受到关注。\n\n目标并不总是被直接攻击。为间接接近真正目标，该行为者攻陷了至少三家运营酒店住客 Wi‑Fi 的酒店服务供应商。他们使用被盗管理员凭据修改 DNS 记录，使其指向攻击者控制的服务，这种技术称为 DNS 劫持。使用这些供应商服务的酒店住客一旦连接 Wi‑Fi，其网络流量、设备标识符和 IP 地址就会被发送到攻击者服务器。随后，攻击者部署 [ClickFix](https://en.wikipedia.org/wiki/ClickFix) 风格诱饵，向受害者设备投递 Windows、Android 和 iOS 恶意软件。攻击者还能把从酒店管理系统窃取的住客信息，与个人设备中窃取的数据结合起来，进一步聚焦目标。其中尤其受关注的是与乌克兰有关的人员，包括政府官员和无人机制造商。需要指出的是，2026 年 7 月，Microsoft Threat Intelligence 发布了一份关于此处所用窃取与恶意软件投递方式的报告，并将其称为 [CaptiveCrunch](https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/)。\n\n该行为者还接管受害者的 WhatsApp 账号，使用一套[无头浏览器](https://en.wikipedia.org/wiki/Headless_browser)平台把受害者账号作为伴随设备连接。部分依赖开源 WhatsApp 自动化库 [WPPConnect](https://github.com/wppconnect-team/wppconnect)，其配置关闭了已读回执，使受害者在大量俄语和乌克兰语对话被批量导出时不易察觉。至少两名前乌克兰高级官员以这种方式遭到针对。\n\n该行为者也攻击监控平台。他们在摄像头流媒体服务的应用接口中发现授权缺陷，并据此枚举用户、收集令牌，从而获得受害者实时摄像头视频流的访问权限。\n\n同一行为者还入侵了一个北非政府技术机构。他们窃取了一台 VPN 设备的凭据，并利用这些凭据接管该机构的中央账号服务器，由此外传了完整凭据数据库：其中包括超过 30 万条国家身份记录，以及该国超过 50 万家企业的商业登记数据。\n\n该行为者持续开发一套云端邮件间谍平台，其中部分使用“Embassy Kit”——一套管理设备代码钓鱼的框架——实施 Microsoft 365 Token 窃取行动。该平台用于针对外交和政府人员，最终访问并外传了至少八个组织的邮件记录，其中包括一个国家检察机构、一所军事教育机构和一个区域性政府间组织。\n\nWindows 凭据窃取程序通过“虚假更新”主题的社会工程诱饵投递，同时附带具备完整远程访问能力的配套载荷。这些载荷被设计为冻结受害机器的安全更新，这意味着安全厂商发布的新恶意软件检测签名不会被受害设备获取或执行。\n\n该行为者在行动的每个环节都使用了 AI：\n\n- **侦察：** 使用 AI 识别邮件和远程访问系统特征，并从公开来源收集信息，为钓鱼构建目标清单。\n- **初始访问：** 使用 AI 构建并运营执行网络入侵行动的平台。该行动主要使用一种“设备代码钓鱼”，滥用云邮件服务的合法登录流程（更多细节参见 Microsoft 的[这篇文章](https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/)）。行为者用 AI 搭建钓鱼基础设施和利用工具，并在其指挥下让 AI 直接执行部分入侵，包括对受害系统运行命令、收集凭据和横向移动。\n- **收集与外传：** 使用 AI 提取并整理数百 GB 被盗数据；部分案例通过从已攻陷邮箱批量导出来完成外传。\n- **维持访问：** 通过自动把攻击者控制的设备注册到受害组织租户中，协助维持对被攻陷账号和租户的访问。\n\n在本地部署环境中，该行为者使用 AI 监控植入程序的隐蔽性与持久化能力。当植入程序被安全产品标记后，攻击者会使用 Claude 系统性识别、修改并重新部署被检测到的制品。\n\n上述变化的结果，是 AI 把成本压力重新反向推给了防御方。过去，防御者或许可以通过部署新的检测规则拖慢攻击节奏；现在，至少从理论上说，有能力的对手可以“闭合循环”，以比防御者开发和部署新检测更快的速度绕过传统安全检测。\n\n该行为者使用的恶意软件包括：\n\n- Windows 恶意软件：PowerChrome、WUEngine、Shadow C2、MiniPlasma、CloudSyncSvc；\n- Android 恶意软件：GiftDrop，一款重新包装的 GiftsExpress Android 监控 RAT；\n- iOS 恶意软件：DarkSword，一条 iOS 漏洞利用链。\n\n##### 入侵指标\n\n```\nms365-live[.]com\nteams.ms365-live[.]com\nm365-owa[.]com\nowa-ms365[.]com\nms365-device[.]com\nmslivetest.duckdns[.]org\nmy-invite[.]org\nchamber-ua[.]org\nchathamhouse[.]eu\nukrinform-share[.]net\n104.145.210[.]184\n31.57.243[.]154\nstatistic-ms[.]live\nstatic-ms[.]live\n104.194.151[.]133\nad-g[.]org\n104.194.159[.]55\ndocs-viewer[.]org\n144.172.114[.]192\nwa-connect[.]eu\nmygreatmarket[.]org\nmygreatmarket[.]com\n213.145.86[.]112\n2.26.53[.]194\ncdncounter[.]net\nstatic.cdncounter[.]net\nstuseamandesilt[.]org\napi.stuseamandesilt[.]org\ncdn.stuseamandesilt[.]org\nupdate.stuseamandesilt[.]org\nitechx[.]tel\npdfviewer2024.b-cdn[.]net\nmeridian-protocol[.]org\nmeridiangroup-corp[.]com\nprojectnightcrawler[.]dev\nmetricwave[.]org\nmgsend[.]org\n148.135.195[.]111\n185.198.234[.]26\n185.198.234[.]101\n149.54.42[.]106\n104.194.149[.]228\n38.146.28[.]132\n38.146.28[.]75\nwa-meeting[.]com\nrussianearabroad[.]com\nrussianearabroad[.]org\nanna.manager@russianearabroad[.]net\nevents@embassy-protocol[.]int\nmsedgeupdate_v3[.]exe\nmsedgeupdate[.]exe\nversion[.]dll\nWUEngine[.]exe\nDiagHost[.]exe\nclient_20260507093021_4286d211_x64[.]exe\nfix_network[.]apk\nbe99857449d2856dd5a84e21c8a3d5e0e01456adb44062ddec5a6b4970d8d42c\n918fa52ae45ed60ba7cc8bdc99c3cbe9ab92e0375ec31fc05d0d4513be11c593\n```\n\n### GTG-50014：ShinyHunters “打砸抢式”机会主义攻击者\n\n有些网络威胁行为者会开展定向入侵，为间谍活动或其他目的寻找特定信息；另一些则没有这么聚焦和精细。历史上，这类机会主义黑客通常采用大范围扫描，识别并探测没有修补的互联网暴露系统，再利用漏洞攻陷或接管目标。我们识别出若干高级威胁行为者，他们使用 AI 增强这种机会主义犯罪活动，借助 Claude 加速大规模扫描、利用并接管目标系统的能力。\n\n机会主义攻击形式很多：抢在 N-day 补丁广泛部署前进行批量利用；翻查公开容器仓库、代码仓库、移动应用和网站，寻找凭据、Token 和 API Key；批量扫描和利用存在漏洞的互联网暴露设备；在安全能力不足的新兴服务商上创建服务账号并逃逸其容器；对 LiteLLM 或 OpenClaw 部署实施 Prompt Injection；等等。\n\n许多攻击者会在互联网上寻找进入网络和服务的路径，窃取数据用于出售和勒索，之后还可能转售访问权限。AI 出现前这一生态已经存在；AI 则扩大了既有网络犯罪活动的规模和严重程度。借助 AI，攻击者更容易理解各不相同的目标环境并快速适配，独特或冷门的配置也更容易被解释和利用。“通过隐蔽获得安全”的旧观念，在这个 AI 辅助的新环境里已经难以成立：任何连接互联网的事物都可能成为被利用的目标。\n\n攻击者一旦进入系统，通常会直接转向数据库寻找客户数据。如果目标是 SaaS 提供商，他们往往进一步利用被盗数据访问下游客户，并提出勒索要求：如果不付款，就把提供商本身以及其客户的数据泄露或出售到网上。\n\n我们识别并阻断了多个以经济利益为动机的网络犯罪活动集群，操作者疑似为 [ShinyHunters](https://en.wikipedia.org/wiki/ShinyHunters) 团伙的关联成员。该团伙以多次大规模数据窃取以及随后“付款否则泄露”的勒索而闻名。虽然这些关联成员看起来彼此分散，拥有各自工具和作业流程，但对其方法与目标进行分析后，可以看出它们属于同一个总体行动。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ffc8ef227f64c039d99e27145fae5204fd8a81501-1920x312.jpg\u0026w=3840\u0026q=75)\n\n图 1. 我们阻断的疑似 ShinyHunters 关联成员集群所共有的攻击生命周期：从收集凭据到勒索。\n\n一名使用（MeowSHA | frkoo | blazespider）等别名的法语操作者，在由 10 个 AWS EC2 工作节点组成的集群上运行分布式凭据收集流水线。该流水线从多个应用商店来源批量下载 180 万个不同的 Android APK，进行反编译，并使用 [TruffleHog](https://github.com/trufflesecurity/trufflehog) 扫描硬编码 Secret。经验证的发现会实时路由到一个 Telegram 群组，并按超过 100 种来源类型组织。另一个并行的 GitHub 组织邮箱收集器则形成第二条被盗 GitHub Personal Access Token 流。frkoo 相关的大多数已确认入侵，其初始访问凭据都由这两条流水线提供。\n\n这些操作者的行动安全纪律参差不齐。frkoo 管理着基于 EC2 的凭据收集流水线，却暴露了自己的 EC2 中转 IP、多个 Telegram Bot Token、一台带硬编码凭据的 Squid 代理，以及至少一次直接在受害环境中上传到公共 paste 站点的记录。他们还注册了一个仿冒法国国家警察的域名 policenationale[.]cc（不过我们认为，这主要用于犯罪商店的品牌包装，而不是钓鱼诱饵）。其子域 autoshop.policenationale[.]cc 是攻击者银行卡黑产商店的 Web 前端：出售被盗支付卡记录（“fiches”），并附带 BIN 查询、完整持卡人 PII，以及受害者地址的交互式地理定位地图。客户通过 Telegram Mini App（@Soraki_Bot）访问该商店，后台是攻击者的“Soraki”平台，一个 PostgreSQL/GraphQL 技术栈，同时把多个法国数据泄露数据集汇总成可搜索服务，其中包括一个约 40 万条记录、含 IBAN 和 BIC 的电信/ISP 数据集。\n\n在这一操作者群体中，多次入侵目标时，都出现了从目标企业软件供应商环境中窃取 AI API Key 的情况。其中一枚被盗 API Key 随后被攻击者使用了约三周，用于开展二次攻击：包括攻陷一家法国零售连锁，并探测一个 Web3 身份平台。他们还继续对一个非营利组织受害者实施入侵后的攻击；frkoo 甚至继续开发其银行卡黑产商店，该商店伪装成法国警察部门网站。\n\n较严重的一次入侵发生在一家技术提供商。操作者外传了超过 1 TB 数据，其中包括数十万条国家身份标识和数百万条支付卡记录，随后把被盗材料放到公共网站上，借此施压受害者支付赎金。在一家航空公司，威胁行为者访问了存储数千万乘客记录的系统。在一家能源公司，操作者声称其能够远程控制安装在客户家中的电动车充电器电流。\n\n另一名关联成员似乎专门从事供应链窃取：先攻陷一家公司，再借此触达其下游客户数据。攻陷一家 SaaS 提供商后，操作者借助这个落脚点提取了大约 200 家下游客户组织的数据。随后在约 34 小时内导出一个会话存储，其中包含跨 40 多个企业租户的 2,100 余组 Azure AD Token。几乎所有工作都由 AI Agent 完成。\n\n在另一场入侵中，攻击者在针对一家 SaaS 供应商的供应链攻击中使用 Claude，加快侦察并支持数据外传。攻击者利用跨站脚本漏洞获得访问权限、提升权限，最终从数千家下游客户组织外传数据。Claude 被用于帮助识别、理解并调用开发者与身份验证 API，创建和转换高权限 Token，并构建批量导出和跨租户数据收集工具。针对另一个目标时，同一攻击者还声称曾从其已经入侵并勒索的两家公司分别领取 2,000 美元和 5,000 美元的 HackerOne 漏洞赏金，把 Bug Bounty 披露机制与入侵行为都当成针对同一目标的额外收入来源。他们还似乎在对特定目标实施聚焦攻击期间，抓取 HackerOne 与其他 Bug Bounty 提交内容作为侦察来源。\n\n这一威胁行为者的行动节奏相对稳定。对一家企业软件公司的入侵，从首次访问到批量窃取数据只用了数小时；另一次入侵则从一枚被盗开发者 Token 开始，在约三小时内升级到对受害者云环境的完全管理员控制。此后，攻击者反复抓取内部数据存储；在供应链攻击中，还会继续迭代访问并抓取终端客户数据。我们检测并封禁了与 ShinyHunters 相关人员有关的账号，实施了用于检测和阻断其未来滥用的措施，并与政府机构、产业伙伴和受害者合作，修复这些行为者造成的威胁。\n\n入侵和数据窃取中的 AI 使用方式，经常类似于“[vibe hacking](https://www.anthropic.com/news/detecting-countering-misuse-aug-2025)”：操作者只给 AI 一个总体目标，例如“使用某实体的凭据”或“从一批目标中获取数据”，随后让 AI 自己评估环境、编写并执行脚本、提供摘要，再反复执行直到任务完成。很多情况下，操作者并不直接理解每个目标环境，也不了解定位和访问高价值信息的复杂细节，而是把这些具体问题交给 AI。\n\n安全从业者常用“living off the land（利用现有环境）”形容使用受害环境中已有工具的攻击。本节描述的机会主义黑客把同样原则应用到了 AI：他们既把 AI 供应链视作攻击目标，也把它当作资源。从多个目标环境中窃取 AI API Key 后，再利用这些 Key 获得额外 AI 计算资源。所有这些案例中的 API Key 都是从 Anthropic 客户环境中窃取的；该行为者并未攻陷 Anthropic 自身系统。后文“AI 供应链”章节会详细讨论这种模式。\n\n##### 攻击生命周期与 AI 集成\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fed4f8197b659c784685ee2be7b6f02efb523ee91-1920x500.jpg\u0026w=3840\u0026q=75)\n\n图 2. 攻击生命周期与 AI 集成。\n\n**来源与侦察。** 大多数入侵从已被攻陷的凭据开始。攻击者还大量开展扫描、语音钓鱼（vishing）、普通钓鱼和域名仿冒，引诱员工交出系统访问权。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd5167078d1d9356e40f423a712471b3d4f859c18-1999x823.jpg\u0026w=3840\u0026q=75)\n\n图 3. 来源与侦察。\n\n**发现。** 暴露的访问 Token 也会通过各种自动抓取和挖掘项目，以工业化规模被发现，包括分析应用二进制、代码仓库和集成、客户端代码、凭据存储、容器镜像、元数据端点、开放存储，以及受害者部署的 AI Agent。一个例子是，某攻击项目会下载 Google Play Store 中的所有 APK，并搜索暴露的会话 Token 或其他可被滥用的访问机制。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F501c3ff9d2bbd9362435907d7235e114db66031a-1999x1193.jpg\u0026w=3840\u0026q=75)\n\n图 4. 发现。\n\n**验证/筛选。** 在使用或转售之前，所有发现都会经过测试和筛选，例如批量验证云 Key、专门构建登录 Oracle、在生产环境中实时重放、按转售价值分级，以及离线破解。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9ce01ce0e7381c9e67125c0c12089f542a137ebc-1999x792.jpg\u0026w=3840\u0026q=75)\n\n图 5. 验证/筛选。\n\n**在受害环境内扩张。** 一枚可用凭据会被用来扩展对受害环境的访问，例如整集群 Secret Dump、管理员 Token 权限放大、CI/CD 注入、数据库与会话表导出、从 Dump 中挖掘签名 Key，以及利用供应商 OAuth 向每个下游租户横向扩散。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F6a6bd5fa483b30c5bfe9fbc894d9a8de93501d02-1999x866.jpg\u0026w=3840\u0026q=75)\n\n图 6. 在受害环境内扩张。\n\n**外传信道。** 数据通过六类信道外流：消费级云存储、经 Mesh VPN 连接的私有 NAS、Telegram Bot 数据流、受害者云环境内的中转、C2 信道，以及普通批量 API 拉取。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F880dd51cfdf39c25162963dbf03608811faf4010-1999x792.jpg\u0026w=3840\u0026q=75)\n\n图 7. 外传信道。\n\n**仓储。** 战利品会被存储下来以便重复使用和销售：包括一个自托管基础设施，用于再次提供被盗数据库；按受害者分类的战利品树；兼作商店的 Telegram 仓库；以及仍然有效的 Key 存储。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F360fd2e670b587c3dc2f91c5f1ba8b0284abb790-1999x760.jpg\u0026w=3840\u0026q=75)\n\n图 8. 仓储。\n\n**生成/维持。** 为了让行动在凭据轮换后仍然持续，攻击者会生成新的凭据和持久访问能力，包括受害账号中的云 API Key、平台开发者 Key、伪造会话和 2FA 验证码，以及网络后门。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc5504af2b3b96d4b74f7b9c6b4b220ea8bf0f0a3-1999x760.jpg\u0026w=3840\u0026q=75)\n\n图 9. 生成/维持。\n\n**变现。** 变现方式包括转售渠道与 Key 池、直接财务盗窃、以被盗数据勒索、同时领取漏洞赏金，以及持有批量数据作为施压筹码。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbb32ff7c140deed4174bf8fe87ba5a053a999567-1999x760.jpg\u0026w=3840\u0026q=75)\n\n图 10. 变现。\n\n##### 观察到的常见工作流\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9ca8558aea18b56c588e1fb34b6b8cbd01bf093a-1813x1999.jpg\u0026w=3840\u0026q=75)\n\n图 11. 观察到的常见工作流。\n\n##### 入侵指标\n\n```\nupdatebeacon.duckdns[.]org\nesvfecawvjmchjslqyemho2fiduc59wzn.oast[.]fun\nsoraki-proxy.20245aad98d27b1b1a2f0f103e1d7ee0.workers[.]dev\nsoraki[.]cc\nsoraki[.]work\npolicenationale[.]cc\nemailsecure[.]email\nmozilla[.]ws\nsignin-1psswoor 行动的规模和影响主要受到两个关键约束：可用进攻性漏洞利用的供给，以及能够部署这些利用的熟练操作者数量。我们已经识别出多个利用 AI 实际建立起自动化“漏洞工厂”的威胁行为者。他们设计并实施自主工作流，可以指挥 Claude 全天候以 Agent 方式开展漏洞与利用研究。在多个实例中，我们发现 Claude 被用来显著加快漏洞研究、测试和利用设计的节奏。\n\n我们识别并调查了一起持续的间谍行动，编号为 GTG-10007，由讲中文、很可能居住在中国湖南长沙的操作者实施。其中两名操作者被识别为湖南某中国高校计算机与通信工程学院课程体系中的本科生。一人曾在中国安全公司深信服实习，并正在应聘另一家中国安全公司奇安信的进攻性网络行动职位。该团体多名操作者把 Claude 用作一项协同进攻计划的工程与编排层，涉及多类任务：尝试入侵生产系统；侦察中东、欧洲和东南亚的外国政府网络；持续针对主要端点安全产品进行漏洞研究和利用开发；恶意软件开发；以及构建情报收集平台。值得注意的是，该团队并行运行多个工作流，共享工具与基础设施，并维护可在不同工作会话之间保留上下文的持久行动记录；其收集和漏洞研究能力在操作者离开后仍可继续运行。\n\n该行为者针对约 50 个组织，覆盖教育、零售、能源、科技、医疗、金融、制造业，以及全球多个政府机构。他们攻陷一家教育科技公司，从其云存储中提取数百 MB 学生个人数据；还进入一家零售公司的生产系统，抵达内部主机，并证明其有能力修改实时生产环境；此外，他们还针对一个东南亚政府机构，获取包含姓名、电话号码和家庭地址的公民记录。\n\n该团体维护一套自主漏洞研究计划，核心是持续研究一款主要安全产品（这类软件本身正是专门用来检测入侵的）。研究产出多个此前未知的漏洞，并由攻击者在自有实验室环境中验证。同一研究工作还为多个网络与安全设备家族产出了可用利用代码。在另一条工作流中，行为者被观察到针对全球多个政府机构所使用的同类设备尝试实施网络利用。我们封禁了与这些操作者关联的账号，并部署额外监控，以检测和封禁相关活动。\n\n多个不同工作流并行运行：一条执行漏洞利用与入侵；一条侦察外国政府；一条逆向安全产品寻找新漏洞；一条开发和测试定制恶意软件；另一条构建并维护收集基础设施。\n\n#### 自主间谍活动\n\n操作者经常运行“Agent Swarm”：由一个主 AI Agent 拆分侦察和入侵后任务，再把它们派发给大量并行运行的子 Agent。该行动维护持久的 Campaign Memory。目标列表、收集到的凭据、行动状态和长期指令都会跨工作会话保存，因此每次会话都可以在行动中途恢复，并继续使用此前积累的上下文。该集群还构建并运营一个情报收集平台，无人值守地批量抓取符合国家情报优先级的开源材料，包括公开可访问的军事条令和官方出版物、地区防务报道以及政策来源。\n\n#### 设备零日研究：二进制逆向与漏洞利用开发循环\n\n以下简要描述该行为者在零日漏洞工厂中的循环。攻击者配置自主 AI 工作流，以设备固件和二进制为目标。流程从通过 Tool Server 把固件和二进制加载进反编译器开始。一个辅助 Agent 先概览镜像，再沿着反编译与交叉引用链展开分析——整个调用流包含数千次反编译调用，连续反编译序列占据主要部分。随后，它会基于一个长期维护的知识库以及此前查找过的 PoC，形成漏洞假设。接着，工作流会针对这些假设编写利用代码，并在目标产品的实验室副本上测试。整个过程持续迭代修改利用代码，直到成功，最终把成果纳入操作者私有的 Exploit Portfolio。\n\n供应商固件镜像通过专门构建的 Skill 获取和解密，解包为 Root Filesystem，再载入反汇编和审计会话。多个并行 Agent 按组件逐一搜寻漏洞模式，且被要求提供证据并使用项目记忆。某一持续针对网络设备迭代的工作流，仅一个月就产出十多个可能的零日漏洞发现。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F72970785999715f22b78c4fc2d0e2f20786fdfd3-1920x471.jpg\u0026w=3840\u0026q=75)\n\n图 12. 设备零日研究：二进制逆向与漏洞利用开发循环。\n\n#### 攻击面与 OSINT 侦察循环\n\n其他 AI 工作流持续运行以执行侦察。流程从特定目标行业生成扫描范围，经专用 Tool Server 调用资产搜索引擎和配套探测工具，对结果进行指纹识别。识别出的暴露面被绘制出来，再根据已知漏洞筛选入口。每一轮发现都会写入持久项目记忆，并扩展下一轮扫描的目标集合。该行为者使用这套框架针对多个外国政府和外交机构，以及十多家中国国内企业。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff3ddd5297b62ba79c500e9d921a6bafbf7dfb954-1920x471.jpg\u0026w=3840\u0026q=75)\n\n图 13. 攻击面与 OSINT 侦察循环。\n\n#### 自主收集集群循环\n\n由 13 个常驻收集 AI Agent 组成的集群按计划任务运行，识别并下载目标网站内容，包括公开可访问的美国军方和政府站点（如合同公告），以及社交媒体账号内容。工作流通过分层爬虫、反 Bot 绕过技术和商业代理出口完成这些任务。相邻流水线再以情报报告风格对获取内容进行摘要和评分，之后把工作流摘要交付到一个分发门户。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F966baae8ca495387317bcf4fe8c4147522584903-1920x471.jpg\u0026w=3840\u0026q=75)\n\n图 14. 自主收集集群循环。\n\n#### 人工直接参与的入侵\n\n操作者主要参与开发、消费工作流输出，以及由自主利用工作流产生的入侵事件；或者在通过弱凭据、收集到的凭据和暴露控制台获得访问时亲自介入。进入内部网络后，AI 助手会枚举主机，通过凭据复用和暴露的管理面提升权限，收集凭据和数据存储，把材料中转回操作者基础设施，再根据已获得内容转向下一台主机。尽管 AI 工作流在全球范围针对实体，该行为者的人工直接入侵却只集中于中国境内受害者。\n\n### AI 供应链：既是目标、战利品，也是攻击算力\n\nAI 带来的能力增益受到恶意行为者和更广泛犯罪经济体的高度追逐。被攻陷的 API Key、会话 Token 和设备所代表的 AI 访问权限，越来越成为多个犯罪团体的唯一目标。此类团体常常通过中间商转售访问权，而中间商又为欺诈性 AI 经销商网络供货；这些网络不断轮换新的被盗 API Key 和会话 Token，直到额度耗尽。恶意行为者也会从中间商处使用或购买这些被盗凭据，用于自己的网络攻击。\n\n犯罪型 AI 供应链已经形成多种“养殖”受害者 API Key 和会话 Token 的路径。其中一种方式，是伪装成真实 AI 服务提供商来投递恶意软件。攻击者搭建网站，声称自己是多个 AI 模型之间的中介服务，并以折扣价提供前沿模型访问。访问者可能通过多种方式被攻陷，其中最持久的一种，是诱导受害者下载并安装恶意客户端应用。这些应用常伪装成包括 Claude Code 在内的热门 AI Harness，实际却是凭据窃取器，会收集设备上的全部凭据和已认证会话 Token 并发送给攻击者，其中包括任何 AI 相关会话 Token 或 API Key。当受害者的 API Key 或账号被识别为已泄露并重置后，凭据窃取器仍会继续识别设备上出现的新会话并发送给行为者。这样一来，攻击者实际上复制了那些自己为其供应被盗凭据的欺诈经销网络模式，却让受害者设备持续向攻击者“供给”凭据，再把这些凭据转售给欺诈经销商。\n\nGTG-50021 是从事类似活动的一个团体，由讲俄语和乌克兰语的人员组成，其中一人使用别名“kl1zy”。他们运营一个欺诈性 AI 经销业务，号称提供廉价 Claude 访问——结果既不便宜，也根本不是 Claude。客户以为自己购买的是折扣 Claude，但其流量实际上被静默代理到另一个 AI 模型；与此同时，经销工具会安装凭据窃取器，盗取客户 Anthropic 账号凭据，再转卖给其他 AI 代理经销商用于恶意活动。\n\n##### GTG-50021 入侵指标\n\n```\nawstore[.]cloud\nkiro[.]cheap\nsys-tools[.]cfd\naws-us-east-3[.]com\nholdboost[.]store\ndeltaclient[.]xyz\niymkjuzymkapovrntoxy.supabase[.]co\n```\n\n还有一些团体直接以 AI 生态与供应链本身为目标，试图通过 AI 厂商、评估机构和可信访问计划获取受限制模型。例如，我们观察到多个行为者攻陷 AI Wrapper 服务对 LiteLLM 的实现，通过 Prompt Injection 外传其云托管容器环境中使用的生产 API Key。\n\n欺诈经销商越来越多地从被攻陷访问权限中获得“货源”。最常见的来源，是合法客户不慎把 API Key 和会话 Token 暴露在产品、应用和公开代码中，例如 GitHub、移动应用安装文件、Docker 容器、网站和聊天机器人。恶意行为者持续挖掘这些来源中的暴露 Key，并分析可能的身份验证滥用途径。\n\n拿到 AI 凭据的操作者一次获得三样东西：\n\n- **战利品：** 被盗 Key 和账号在成熟黑市中具有转售价值；\n- **算力：** 掌握凭据后，其攻击工作负载可以由别人承担费用；\n- **掩护：** 活动会被归因到凭据的合法所有者。\n\n后文描述的一场黑客行动主义活动完全依赖被盗 API Key 运行了一个月。ShinyHunters 关联成员在入侵中获得受害者 AI Key 后，会把自己的攻击负载切换到受害者 Key 上。GTG-50020 攻陷一家 AI 供应商的评估沙箱后，最先拿走的也是其生产 Key。\n\nAI API Key 与会话 Token 本身就是攻击目标；客户围绕 AI 构建的集成——例如沙箱、代理和经销网络——也属于攻击面。组织应以对待生产凭据同等级别的严肃程度对待 AI Key 和 Agent 集成，因为攻击者正是如此看待它们。AI 访问应只通过授权渠道购买。任何所谓“折扣”如果要求把流量和凭据交给未知中间商转发，都会给用户数据和系统带来巨大风险。\n\n### GTG-50020：从酒店预订平台到 AI 供应链\n\nGTG-50020 是一个讲俄语、以经济利益为动机的行为者，历史上曾入侵酒店预订和金融科技平台。在一次入侵中，他们从一名受害者处外传约 26 GB 数据，并试图通过勒索付款（或在暗网论坛售卖数据）获得 150 万至 250 万美元。\n\n随后，他们把同样的技战术转向 AI 行业。通过向一家 AI 厂商的自动评估沙箱注入恶意指令，攻击者诱使沙箱交出了其持有的凭据，其中包括属于该厂商、来自多个提供商的生产 AI API Key。\n\n攻击者随后滥用这些被盗 Key，同时继续针对该 AI 厂商和其他无关目标实施入侵。实际上，一旦获得目标 API Key，他们就会自动停止使用自己的 Key，切换到受害者 Key。随后，同一基础设施又在约四天内以类似技术攻击了大约 30 家 AI 公司：找到一条成功攻击路径后，就重复应用到 30 个目标，只针对不同环境做轻微调整。攻击者明示的目标，是通过十多个不同途径获得尚未发布的 Claude 模型访问权。但其从未成功，所有尝试路径都失败了。整个过程中涉及的 Key 都是从客户环境窃取的客户 Key；攻击者从未攻陷 Anthropic 自身系统。\n\n这个案例是迄今最清楚的证据之一：AI 供应链已经成为蓄意的犯罪目标。攻击者追逐 AI 厂商的生产 API Key，并明确希望——但需要强调的是，从未实现——获得未发布 AI 模型的访问权。\n\n#### 人类指挥的 AI 渗透测试循环\n\n操作者为每个目标维护一份 Scope 文件，由它启动自定义工作流，把任务委派给并行的侦察和利用 Agent。Agent 的发现会再次测试，确认是否真正能获得访问；如果可行，就合并到增量报告中。工作流再继续循环至下一个目标域名。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F0c118bda9102ec213c6035fb16a4847509c49e1b-1920x496.jpg\u0026w=3840\u0026q=75)\n\n图 15. 人类指挥的 AI 渗透测试循环。\n\n#### 自主利用流水线\n\n攻击者使用一套容器化开源渗透测试平台，前端接入本地模型网关，目标为 Web 应用。Worker Agent 在无人监督下执行注入、XSS、身份验证绕过和 SSRF 测试，把潜在发现和凭据收集到操作者工作区。该循环对生产系统启用了真实利用，也就是说，同一工作流既尝试识别漏洞，也主动利用漏洞获取访问权限。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd67f43c0159621c1e7b84b5cc5245f0e2bed40a2-1920x471.jpg\u0026w=3840\u0026q=75)\n\n图 16. 自主利用流水线。\n\n#### 欺诈账号工厂\n\n攻击者配置住宅代理和反检测浏览器 Profile，然后由 Bot 在交易所和市场类目标上自动完成注册流程。商业验证码破解服务、自动轮询邮箱以及自动身份验证步骤共同绕过入驻控制，最终把完成验证的账号储备起来供后续行动使用。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F08c5bd02a2fc4c27002bc17f5f07c29e38000d59-1920x471.jpg\u0026w=3840\u0026q=75)\n\n图 17. 欺诈账号工厂。\n\n#### KYC 中间人拦截伪装\n\n攻击者还开展凭据窃取和钓鱼。受害者会被引导到外观相似的身份验证域名，该域名的反向代理把真实 KYC 流程转发给受害者，因此受害者完成的是真实身份验证，但夹在中间的代理会捕获已经通过验证的会话和文档。攻击者随后从自己的机器上使用被捕获会话，访问目标服务和数据。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F57702ff9f64d0a10b7c3c12f0debec33dd185124-1920x471.jpg\u0026w=3840\u0026q=75)\n\n图 18. KYC 中间人拦截伪装。\n\n##### 攻击者出口 IP\n\n| **IP** | **开始** | **结束** |\n| --- | --- | --- |\n| 141.133.125[.]208 | 2026-05-21 | 2026-05-23 |\n| 167.250.111[.]136 | 2026-05-23 | 2026-06-03 |\n| 178.16.54[.]141 | 2026-05-21 | 2026-06-16 |\n| 37.27.103[.]22 | 2026-05-26 | 2026-06-13 |\n| 194.163.183[.]216 | 2026-05-23 | 2026-05-24 |\n| 202.66.167[.]230 | 2026-05-21 | 2026-06-04 |\n| 146.103.101[.]253 | 2026-05-21 | 2026-06-13 |\n| 146.103.97[.]169 | 2026-05-21 | 2026-05-25 |\n\n表 3. 攻击者出口 IP。\n\n### GTG-50029：以欧洲政治及关联实体为目标的黑客行动主义者\n\nAI 正在缩小能力差距，把低水平“黑客行动主义者”抬升为类似高级持续性威胁的行动者。正如多个案例反复显示的那样，AI 能力既提高进攻型网络操作者的能力基线，也降低所需资源。本节详细介绍我们调查并阻断的一场黑客行动主义活动：规模很小但动机强烈的操作者，因为把 AI 集成到作业中，得以实现相当显著的目标。\n\n2026 年春季，我们观察到一名讲法语的单独行为者使用 Claude，针对欧洲政党、媒体、智库，以及这些组织使用的 SaaS 提供商。\n\n该行为者用 Rust 构建了一套自定义扫描器，用于扫描和验证公开容器中暴露的 API Key。一旦验证成功，工具就会通过本地代理层轮换不同 Key 的使用，使其流量能够混入被盗 API Key 合法所有者的正常流量。正如前述案例所示，一枚暴露 API Key 就足以移除恶意操作者的进入门槛。\n\nGTG-50029 又一次展示了行为者如何在整个杀伤链上采用 AI。攻击者在一个可管理子 Agent 的框架中使用 AI 的 Agentic 编码能力；这些子 Agent 又分别负责认证前后侦察、代码审查，以及核验不同 AI 模型给出的发现。\n\n#### 新型利用与专用工具\n\n该行动用于初始进入目标系统的标志性技术，是利用一个此前未公开记录的 WordPress“重新安装竞态条件”，在没有有效凭据的情况下创建恶意管理员账号。攻击者在同一个会话中使用 Claude 开发和调试利用代码，包括构建实验环境 Harness。该方法至少在四个受害网站上成功。\n\n在一个案例中，攻击者通过一个暴露的搜索端点攻陷政治竞选管理平台。他让 Agent 在这一端点上反复迭代，最终外传约 14 万条记录，其中包含用户政治观点。\n\n针对另一个目标时，攻击者把一个 WebShell 隐藏在字体资源中。WebShell 是放置在 Web 服务器上的小型脚本，允许攻击者远程发送命令并让服务器执行，本质上是一个可通过网站直接访问的后门。攻击者在识别出允许上传的漏洞后，现场构建 WebShell。他们还使用一个 WordPress “must-use”插件——这类插件每次页面加载都会执行，而且不能从管理员后台关闭——来收集提交的凭据，并用每个站点独有的公钥加密后等待取回。此外，GTG-50029 还污染了受害者备份，推测是为了维持持久化：如果受害者从旧备份恢复环境，就会再次被感染。\n\n最后，攻击者通过注入脚本部署浏览器利用 C2 框架，攻陷一家媒体机构并“挂钩”其读者浏览器。这让攻击者能够对数千个来访浏览器进行指纹识别。我们观察到，攻击者明确利用这套框架搜寻编辑人员的会话和凭据。\n\n该行为者的标志性工具名为“fafsearch”，是一套专门构建的开盒（doxxing）平台。它提供编译后的搜索引擎，包含数据摄取流水线、把单个泄露数据集与已外传数据交叉比对的能力、对国家身份号码与电话号码的规范化、排序逻辑、测试以及容器化部署。攻击者向平台导入数千万行数据，包括国家医疗标识符和司法系统泄露信息，并与其自身入侵获得的材料融合。之后，他们把结果发布为一组匿名托管的暗网服务，可以按姓名检索与目标政治运动有关联的个人。\n\n这是我们所见最清晰的案例之一：AI 辅助软件工程被直接用于大规模隐私攻击，而整个平台由一个人独立创建。\n\n在跟踪的 42 个目标实体中，攻击者至少进入了 14 个内部环境。其访问并外传了估计 12–26 GB 数据库 Dump，包括政党捐助者和成员记录、一个含 15,000 封邮件的邮箱、学生申请记录（包括未成年人数据）以及支付服务商数据。攻击者还部署了实时凭据拦截。利用这些已外传数据，他们在自营 Tor 泄露站点上为每名受害者准备独立加密归档。\n\n#### 攻击者出口 IP 基础设施\n\n| **指标** | **角色** | **首次发现** | **最后发现** |\n| --- | --- | --- | --- |\n| 139.59.2[.]243 | Key 验证服务器（DigitalOcean） | 2026-02-06 | 2026-06-12 |\n| 158.173.46[.]118, 146.70.116[.]131, 149.22.83[.]6, 138.199.60[.]29, 138.199.6[.]208, 103.216.220[.]19, 103.124.165[.]199, 103.141.60[.]144, 2001:ac8:27:89::a02d, 2001:ac8:29:84::a01d | 商业 VPN/DC 攻击出口（Mullvad/M247/31173/Datacamp；AL/AT/AR/CH/BG/SK/DE）— 主要 Key 操作窗口 | 2026-03-25 | 2026-05-20 |\n| 34.156.199[.]132, 34.156.95[.]176 | 被劫持 GCP 项目中的外传端点 | 2026-04 | 2026-05 |\n| 136.144.242[.]56 | 用于欧洲政治组织的中转与扫描服务器 | 2026-05-17 | 2026-05-21 |\n| 163.172.157[.]53, 2001:bc8:711:5854:dc00:1ff:fe18[:]ba53 | 持久专用服务器，Scaleway FR，用于后期行动 | 2026-06-26 | 2026-07-04 |\n\n表 4. 攻击者出口 IP 基础设施。\n\n#### 攻击者拥有或控制的域名与服务\n\n| **指标** | **角色** | **首次发现** | **最后发现** |\n| --- | --- | --- | --- |\n| frntrs-analytics.dedyn[.]io | BeEF 浏览器 C2 主机名（deSEC 动态 DNS，攻击者持有 API Token） | 2026-05-13 | 2026-06 |\n| frntrs-analytics-863060591218.europe-west1.run[.]app | C2 域名背后的 Cloud Run Origin | 2026-05-13 | 2026-06 |\n| prod-artfkt[.]com | 攻击者注册的行动域名 | 2026 年 4–5 月观察到 | — |\n| fafwatch[.]xyz | 攻击者注册的、与开盒活动相关的域名 | 2026 年 4–5 月观察到 | — |\n| 3ell6n47y3ct4a3x67fbuz62q2mk2l4vo6eacho2suzftdshsnrfopyd[.]onion | CRS 凭据保险库 API | 2026-05 | 2026-07（调查结束时仍在线） |\n| 6mshbvhvzhdgumwwazf4jcep2xx4kdk6n4wgffc46msu2gc3j3t2fpad[.]onion | 攻击者 Tor LLM 网关（第三方模型路由） | 2026-06 | 2026-06 |\n\n表 5. 攻击者拥有或控制的域名与服务。\n\n### 主导趋势\n\n#### 概览\n\n尽管上述案例彼此没有关联，但有两个广泛发展趋势与所有案例都有关。\n\n##### AI 技战术正在扩散：AI 驱动网络行动的普及\n\n就像合法经济活动中一样，AI 已经扩散到网络战场。包括 GTG-10002 在内的多个团体——[此前已有报道](https://www.anthropic.com/news/disrupting-AI-espionage)——开发并使用自己的自主攻击框架；而 GTG-50020、GTG-50029 等其他团体则使用了 [PentAGI](https://github.com/vxcontrol/pentagi) 这样的公开进攻型 Agent 框架。这些公开框架为任何下载者复现了大量相同的编排脚手架，本报告多个行动直接运行在这些框架或其衍生版本上。\n\n支持这一战场的市场也已经形成。我们发现 GTG-50021 搭建欺诈经销商，号称以折扣价提供 Claude 访问，实际却把用户流量静默代理到另一个模型，同时收集所有注册者的 Anthropic 凭据。\n\n这种扩散正在不同类型的威胁行为者、不同地区和不同任务之间发生。本报告描述的能力，应被视为任何有足够动机的行为者都有可能获得。我们会持续投入资源、工具和人员，发展更有效的方法，在危害真正发生前领先并阻断这些对手的访问。但我们预计，仍将长期面对高度有动机、且有时具备复杂国家支持背景的恶意网络行为者，并继续与公私部门伙伴共享威胁信息和最佳实践以缓解风险。\n\n本报告既包含小型犯罪团伙，也包含国家支持组织指挥的行动。AI 的扩散正在拉平能力差距，使两类行为者都能获得同一组高级能力。它们之间最主要的区别，不再是“技术复杂度”，而是“意图”。过去，国家支持行为者可以凭借更多资源部署更高级网络能力；AI 的进步让非国家行为者也能获得过去主要由国家行为者掌握的能力。一名使用被盗 API Key 的黑客行动主义者（GTG-50029）、一个从移动应用中批量收集凭据的经济型犯罪团伙（GTG-50014），以及一个国家关联间谍操作者（GTG-20006），展示出相似的方法：使用 Agentic AI 开展针对多个受害者的行动，而过去这类行动往往需要一个团队。他们构建定制工具、执行入侵，并以单个人类操作者无法手工处理的规模加工被盗数据。\n\n攻击本身并不陌生：被盗凭据、未修补边缘设备、暴露服务、SQL 注入和钓鱼仍然是主要手段。本报告没有哪一项行动依赖防御者从未见过的全新技术。真正变化的是攻击的*经济学*。过去让资源充足行动与其他攻击者拉开差距的那类劳动——侦察、利用、工具开发和数据处理——如今都可以委派给 AI 模型；模型在 Harness 中以机器速度并行运行。前文数字已经体现结果：有的入侵从开始到完成只需两三小时，单个操作者就可以并行处理数十名受害者。\n\n##### AI 在网络行动中的角色越来越自主\n\n本报告案例中的 AI 使用横跨广泛的自主性光谱。一端是对话式使用：Claude 作为工程助手，用于创建恶意软件、钓鱼套件和监控工具。再往前一步，威胁行为者会指挥 Claude 执行真实操作——例如对受害网络运行命令、收集凭据、外传数据——但每个具体目标仍由人类决定（GTG-20006）。在最远端，一些行动能够以极少人类输入或监督自主运行：多 Agent 框架会针对多个受害者并行执行侦察、利用和窃取，连续运行数小时甚至数天（GTG-50014、GTG-50020、GTG-50029）。我们还观察到按预设时间表运行、完全无人工介入的收集集群（GTG-10007），以及在无人参与情况下定时续签被盗访问 Token、收集受害者云存储数据的任务（GTG-20006）。\n\n需要牢记两个限定。第一，人类仍然保留对自己最重要的决策权，例如目标选择、发现内容的变现以及结果审阅。第二，“自主性”和“危害”是两个不同维度：*自主性*会放大行动规模和速度，并降低运营成本与复杂度；但*严重程度*依然由许多因素决定。我们报告的一些最严重入侵，恰恰来自人类逐步指挥每一步的行动。从经济学角度看，AI 自主性压缩了攻击者 ROI 计算中的成本侧：降低每场行动所需的技能门槛和人力，同时潜在收益基本不变。这种更有利的单位经济性，会让过去“不值得攻击”的边缘目标变得可行，并鼓励更高频、更低人工介入的行动。\n\n##### 附录 A\n\n以下列出威胁行为者为构建其 AI 驱动工作流而开发的 Skill。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F5b3c1191e266cbbe020d44dfb9acdbc1bedf5b9f-1920x1778.jpg\u0026w=3840\u0026q=75)\n\n图 19. Skill 分类。\n\n[返回顶部](#main)\n\n## 使用 Claude 检测并应对影响力行动\n\n*本节聚焦影响力行动。我们将其定义为：出于欺骗、扭曲或隐蔽影响个人或群体的认知、信念或行为之目的，对信息环境——包括政治、公民和公共讨论——实施操纵的活动；这类活动通常还会隐藏其来源、资助方或协调关系。*\n\n我们的[第一份威胁情报报告](https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025)讨论过一个商业“影响力即服务”网络。此后，我们发现并阻断了规模更大、复杂度更高的行动。我们看到一些团体使用 Claude 搭建虚假社交媒体账号网络乃至完整新闻网站，并利用这些平台发布欺骗性内容，同时彻底隐藏行动背后的实体。\n\n例如，某个行为者可以创建 100 个看起来属于某国普通公民的社交账号，再让这些账号在一周内全部发布内容，放大同一种政治立场。账号本身并不真实，其中表达的意见也并非真实持有；从表面上看，完全无法识别真正的幕后操作者。\n\n本报告详细介绍其中九个案例。它们源自俄罗斯、伊朗、土耳其，以及海湾地区、南亚、非洲和欧洲，并针对六大洲的受众。行动背后的行为者包括政府、国家关联宣传机构和国家媒体，也包括向付费客户出售影响力服务的私营公司、国内政治操作者，以及一例流亡反对派运动。\n\n值得注意的是，其中几场行动与全国性选举时间重合。例如，俄罗斯国家媒体在 2025 年 9 月摩尔多瓦投票前制造有关该国总统的虚假说法；而肯尼亚一名亲政府操作者则为 2027 年全国大选提前准备了伪装成草根舆论的社交媒体内容。\n\n### 我们如何调查\n\n影响力行动既不是新事物，也不是互联网独有。新闻记者、研究人员和政府机构组成的成熟研究共同体，长期研究并揭露此类技战术，也建立了我们用于理解这类行动的[分析框架](https://www.annenbergpublicpolicycenter.org/wp-content/uploads/ABC_Framework_TWG_Francois_Sept_2019.pdf)。\n\n但与社交平台通常要等内容已经开始传播后才能看到行动不同，我们有时会在行动尚处于搭建阶段时，就在 Claude 上看到它。行为者会使用 AI 规划行动、选择目标、撰写材料；这些任务会产生我们系统已训练去识别的信号，因此常常能让我们在行动真正启动前进行阻断。\n\n一旦行动离开我们的平台正式上线，我们的直接可见性就结束了。为了验证调查结果并了解内容离开平台后发生了什么，我们依赖开源研究、跨平台行业数据和公开报道。每个案例都会说明我们如何发现相关活动，以及还有哪些机构参与调查。\n\n一旦识别到行动，我们会封禁相关账号，并把活动归因到背后的组织。我们还会利用这些调查所得强化防护，把每次调查中发现的新技战术和行为模式反馈到检测系统中。\n\n### 我们如何衡量触达\n\n为了更准确评估每场影响力行动的实际影响，我们采用 [Breakout Scale](https://www.brookings.edu/articles/the-breakout-scale-measuring-the-impact-of-influence-operations/)。这是一个被行业研究者广泛采用的六级框架，根据内容跨平台迁移与触达范围衡量影响：Category One 表示内容只局限于单个平台的单一社群；Category Two 到 Category Six 则代表公众曝光和传播程度逐级提高。\n\n### 影响力行动趋势\n\n1. **影响力被作为服务出售。** 正如我们此前报告指出的，受政治实体、政府等客户雇佣的商业操作者，可以为任何愿意付费的人制作内容。这使真正委托影响力行动的一方获得可否认性，也让无法或不愿自行建设相关能力的行为者可以购买现成服务。本报告两个案例中，正常经营的广告或营销公司一边做普通商业业务，一边运营影响力行动。\n2. **AI 充当新闻编辑台。** 在多个案例中，Claude 被嵌入一个本来就由人类编辑、已经运行的内容流水线，扮演副编辑或内容创作者。这让资源有限的行为者也能以远超其独立能力的规模运作影响力行动。\n3. **AI 不只生产内容，也帮助建设整套行动装置。** 行为者让模型制作行动纲领、反对派档案、部长级材料包、人设系统、目标数据库、把编辑忠诚写进条款的雇佣合同，以及用于给参与行动的员工打分的评分标准。没有 AI 时，这类工作通常需要一个配备人员的项目办公室。\n4. **复杂工具使用。** 我们发现一些影响力行动从一开始就被设计成可持续、可轻易扩张。包含行动原则的 Markdown 文件几乎原样重复用于数百个会话；行为者在 AI Agent 内维护禁用词清单，共享已批准来源和规避规则文件，并运行按固定批次调用 Claude 的定制软件。中央化设置意味着不同内容生产者甚至不需要彼此协调或相互认识。一名行为者还在制作课程，准备把工作流教给其他人。越来越多行动不再靠单次 Prompt 驱动，而是把大量规则嵌入持久 Memory 文件。\n5. **洗白归因、来源和确定性。** 行为者使用 Claude 设计内容，让国家或委托方叙事看起来来自独立声音。他们要求 Claude 有意移除转载材料中的国家归因，把同一说法在多个媒体节点之间层层转手，使其读起来像是被不同来源独立证实。在一个与俄罗斯国家媒体有关的案例中，模型曾把某些说法标记为未经验证，操作者随后明确要求删除这些限定，把全部内容写成“已确认事实”。\n6. **行动安全水平提高。** 威胁行为者想方设法隐藏身份来源。这从内容创作一开始就发生：要求模型移除自动生成文本的痕迹、写得更“自然”，设计账号养号和规避逻辑，并在交付前删除元数据和代号。他们还通过 VPN、外国电话号码、轮换账号和隐藏 IP 的第三方服务“洗白”自己对 Claude 的访问。\n7. **虚假人设，以及冒充真实人设。** 行为者用 AI 生成头像、虚构记者履历、制作政治发言人，形成完整虚假人设。我们还发现冒充真实个人和真实机构的案例，包括国家发言人和人权组织，以及伪造政府文件。\n8. **直接针对个人与问责机制。** 我们观察到：克隆一名真实活动人士账号，与其在伊朗境内的联系人进行实时对话；为其他伊朗人建立带逮捕历史的档案；代写在联合国人权理事会现场宣读的证词；以及为联合国特别报告员制作反制档案。\n9. **影响力行动经常无法真正触达真实受众。** 因为我们处于行动的内容生产上游，在内容进入社交平台等分发渠道前就可能发现并阻断。我们识别的大多数内容只获得很少甚至没有真实互动；多个案例在形成受众前就被阻断。真实触达最广的情况，往往是国家媒体本身承担分发机制，包括 FM 广播、卫星与短波广播以及全球电视网络。\n\n### GTG-04001：阻断中非共和国境内的俄罗斯对外信息操纵与干预行动\n\n我们移除了一个由班吉一名讲俄语的行为者运营的账号。该行为者为一场针对中非共和国（CAR）、与俄罗斯国家利益一致的“对外信息操纵与干预”（Foreign Information Manipulation and Interference，FIMI）行动提供内容生产后台。\n\n行为者通过 Radio Lengo Songo（98.9 FM）运营每日内容流水线，并与俄罗斯国家媒体 RT、Sputnik Afrique、TASS，以及班吉的 Russian House 协调。每次生成内容时，用户都会明确要求 Claude 把亲俄、反法的论点嵌入报道。为了实现充分可否认性，他们还要求模型去除典型格式习惯，避免新闻 Feed 看起来像合成或 AI 生成文本。在抽样活动中，大多数内容支持中非共和国政府、支持 Wagner、反法并反对中非共和国反对派。\n\nAll Eyes On Wagner 项目近期的一份[调查报告](https://alleyesonwagner.org/2026/05/26/manufacturing-enemies-politologys-war-on-civil-society-in-car/)显示，这家广播电台由 Wagner Group 于 2017 年创建并资助。行为者设计了一条流水线，把伪造内容通过电台送入全国广播体系。他们以提供 Rossiya Segodnya 面向外国记者的 SputnikPro 媒体培训名额，交换广播时段。这样一来，俄罗斯官方国家材料就可以披着普通全国性节目的外衣抵达当地听众。\n\n表面上，大部分内容看起来像由普通中非共和国记者撰写；但我们的调查把该行为者与 Politology 联系起来。Politology 被认为是 Africa Corps/Wagner 的影响力分支，并被评估在 2023 年底转入俄罗斯对外情报局（SVR）控制。我们判断，该个人充当 Politology 在当地的媒体协调人。最终，这名行为者传播的是与俄罗斯国家立场一致的宣传。这是一场由俄罗斯国家指挥、旨在操纵并干预中非共和国信息空间的秘密行动。\n\n使用 Breakout Scale，我们将该行动评估为 Category Four：内容每天通过 Radio Lengo Songo 98.9 FM 广播，再由 Telegram 频道放大，并被中非共和国当地新闻媒体转载。\n\n#### 关键发现\n\n- 行动完全由外国力量运营，却被精心设计成看似源自班吉本地。讲俄语的行为者负责指挥产出，而合同、脚本和帖子则把它包装成中非共和国广播电台自身的工作。\n- 该网络使用 Claude 自动化人力资源与内部管理。行为者要求模型生成合同，其中强制员工忠于中非共和国总统以及“俄罗斯及其派驻力量”；还用模型撰写职位说明、评分标准和“三次违规即解雇”流程。之后，他们按这些标准给员工文章打分，并让 Claude 建议哪些员工应保留、哪些应解雇。当 Claude 指出评分中的政治倾向后，行为者只是把相关维度改成中性名称，继续沿用评分。\n- 行为者还开展三类旨在实现政治控制和影响的活动：组织周期性监控行动，追踪并更新中非共和国反对派政治人物数据；为 Russian House 的发言人起草战略论点和声明——Russian House 是俄罗斯在海外用于软实力与政治活动的文化和信息中心；以及基于原始设计文件伪造中非共和国政府文件，包括宪兵和国防部通信材料。\n- Claude 拒绝执行该行动最激进的一项要求：把真实个人点名为武装分子，以诱导安全机构对其采取行动。行为者随后改用“匿名消息源”的叙事方式。\n\n#### 攻击生命周期与 AI 使用\n\n外国行为者提供主题和论点，再用 Claude 把它们转化成简报、合同、脚本、图形和帖子。其中一些材料被准备好交付给总统府发言人和 Russian House 负责人。重复使用的模板和长期指令表明，大部分规划在发送任何 Prompt 给 Claude 之前，就已离线完成。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fe3724dfd4779f2c838c6cb0b70c54cc5f757ef2a-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 1. 与该行动有关的亲俄 Telegram 频道；这些频道会被固定导出，用于风格语气分析、模仿和分发。\n\n#### 组织节点\n\n| **实体** | **在行动中的角色** |\n| --- | --- |\n| Radio Lengo Songo / SARL Media International（98.9 FM） | 主要枢纽；亲俄编辑路线；HR 基础设施把政治服从写入制度。 |\n| Russian House / Rossotrudnichestvo, Bangui | 国家文化节点与协调点（Dmitri Sytyi）。 |\n| Sputnik Afrique / Rossiya Segodnya | 国家媒体内容供应方；合作与交换（以培训换播出时段）。 |\n| RT, TASS | 国际放大；协调部长访谈。 |\n| Africa Corps / Wagner | 行动所宣传的安全力量主体；相关内部行动数据被访问。 |\n| Telegram: СОМБ («Туристы в Африке»), «Залечь на дне в Банги» | 军事宣传频道和亲俄本地声音频道（风格被模仿）。 |\n| Radio Centrafrique | 被作为下游“洗白”终点的国家广播机构。 |\n| Ndjoni Sango, Pravda RCA | 被允许作为来源使用的立场一致本地媒体。 |\n\n表 1. 围绕该行动的关联媒体与平台。\n\n#### 阻断与缓解\n\n我们最初是在收到 INPACT/All Eyes on Wagner 的线索后识别出该网络。这些组织的[报道](https://alleyesonwagner.org/2026/07/07/the-svr-arms-politology-with-chatgpt-and-claude-in-the-central-african-republic/)帮助我们启动内部审查，并独立确认网络中相关人员的身份。我们移除了该账号及其背后的组织，并根据其行为特征建立自动检测，用于未来识别和阻断类似行动。\n\n### GTG-54002：阻断横跨六大洲的商业“影响力即服务”行动\n\n我们识别并移除了一个使用 Claude 批量生产和改写政治内容的账号。该行动用模型在大约 70 个伪造新闻网站上重写并分发虚构新闻，随后又由约 70 个相互对应的 X/Twitter 账号，以及一个包含 250 多个虚假评论账号的 X/Twitter 网络进一步放大。\n\n调查显示，这场行动面向六大洲的全球受众。虽然操作者刻意让网络看起来像彼此独立的本地新闻编辑部，但我们追踪到其背后是法国数字广告机构 LKM Company。\n\n该网络并不坚持单一政治意识形态，而是根据当时付款方是谁，在政治光谱不同阵营之间切换立场。这符合商业“影响力即服务”模式：私营公司受雇操纵信息、改变公众意见、推动特定政治议程，或对个人实施定向抹黑。\n\n我们较早阻断了该行动，当时它尚未建立真实受众。网络用约 20 种语言至少发布了 8,913 篇文章，但我们识别到的大多数内容几乎没有来自真实受众的可观察互动。按 Brookings Institution 的 Breakout Scale 评估，这一行动属于 Category Two：内容在网络自有网站和匹配的社交账号之间传播，没有证据显示它突破自身网络形成外部扩散。\n\n#### 关键发现\n\n- 行为者主要用 Claude 做两件事：为虚假新闻站点撰写完全原创的文章，以及改写合法记者发布的真实文章。自动化系统会把真实新闻改写成带政治倾向的版本，并针对不同国家受众和所需政治角度做适配。\n- 行动特别针对政治竞争高度激烈的民主环境，包括美国、巴西、法国和刚果民主共和国（DRC）。由于这些国家政治环境非常不同，目标选择并不支持“单一政治议程”的解释。\n- 调查发现若干信号，表明部分活动可能反映一名或多名在当前 DRC—卢旺达冲突中有利益关系的客户诉求。我们无法独立确认究竟是哪些客户委托了这些内容，也没有发现任何政府直接指挥的证据。\n\n#### 攻击生命周期与 AI 使用\n\n该行动在很短时间内搭建 Web 基础设施：2025 年中期约十周内，从法国集中注册这些域名，并把所有站点托管在一个共享部署之上。这让调查人员能够把表面看似独立的约 70 个新闻网站，关联到同一个操作者账号。\n\n网络使用 Claude 建立标准化内容流水线。所有 Prompt 都要求固定 JSON 输出结构、格式化 HTML、精确字符数，以及每篇文章包含三到四个内部链接。借此，操作者可以自动化大规模生成和发布内容。这些文章还被专门设计来提升站点在搜索引擎中的权威度排名。\n\n我们发现该行动反复使用三种操纵策略：把同一来源故事分别改写成相反意识形态版本，面向不同受众；给原本不带政治色彩的故事加入政治角度；以及把故事跨国“洗”到无关地区，同时去除原始语境。\n\n为了让文章显得真实，操作者使用虚假记者姓名作为署名。调查确认这些作者实际上并不存在。\n\n这些虚构署名让每个站点看起来都像拥有独立员工的本地新闻编辑部。网络还为每个虚假媒体配套一个 X（原 Twitter）账号，随后再由一层评论账号放大。这些评论账号与网站几乎在同一时间段创建，很多使用 AI 生成头像；大多数虚假账号创建于 2025 年 6 月和 7 月。\n\n2025 年 9 月 11 日，我们检测到明显协同式虚假行为：多个网络网站在三分钟内发布几乎相同的 DRC—卢旺达冲突文章。操作者会根据不同地区受众调整语气，同时协调多个 X 账号分发这些链接。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fb518031942512c47b27b5a0c65d67c509318c867-1990x704.jpg\u0026w=3840\u0026q=75)\n\n图 2. 使用 AI 生成头像的虚假评论账号样本，来自该网络在 2025 年 6—7 月创建的 250 多个账号。\n\n#### 聚焦 DRC 的活动\n\n深入观察网络产出后，可以看到对刚果民主共和国的明显聚焦：所有虚假新闻站点共发布 318 篇相关文章。这些故事通常支持 DRC 政府立场，尤其关注地区矿产交易以及与卢旺达持续紧张的关系。这一策略与网络早期受众增长相符：在最初几周，大部分关注其 X 账号的虚假人设都与 DRC 有关，其 DRC 专用新闻账号一度成为整个行动中分享最多、最受欢迎的账号。\n\n我们还观察到一个把自己包装成刚果平民“数字军队”的 X 账号关注了该网络多个账号。我们没有发现任何政府指挥的证据。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9ce3edba5554816c9f0aac2d661ba860ba7551a2-1990x1620.jpg\u0026w=3840\u0026q=75)\n\n图 3. 放大 DRC 相关内容的虚假评论账号，显示该行动 250 多个账号中的协同集群。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F219929a00ffce40e1a67b9d9fa33084a01daf6ec-1990x1620.jpg\u0026w=3840\u0026q=75)\n\n图 4. 协同集群中的虚假评论账号，用于放大 DRC 相关内容。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F4f3d2da01fe0c8488f61c0f1f30b4e539a095cb6-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 5. 该网络约 70 个虚假媒体站点之一，托管在行动共享基础设施上。\n\n#### 阻断与缓解\n\n我们在持续调查该地区影响力行动时识别到该账号，随后封禁该账号及其关联组织，并实施新的检测方法，针对其行为特征。下文分享相关指标，以帮助其他产业伙伴采取行动，尤其包括把整个网络关联到同一账号的共享部署标识，以及从约 70 个虚假媒体中按地区选取的代表性样本（完整域名与账号清单另行提供）：\n\n#### 虚假媒体样本\n\n| **媒体名称** | **域名（已去武器化）** | **X（Twitter）账号** |\n| --- | --- | --- |\n| Naija Pulse | naijapulse[.]org | @Naijapulse_ |\n| Axum Voices | axumvoices[.]org | @AxumVoices |\n| Jambo Journal | jambojournal[.]org | @journaljambo |\n| Zion Pulse | zion-pulse[.]com | @zionpulse |\n| Al Watan Al Akbar | alwatanalakbar[.]com | @saudinews966 |\n| Echo Berlin | echoberlin[.]info | @berlin_echo |\n| The British Daily | british-daily[.]com | @britishdaily_ |\n| Russian Way | russianway[.]info | @RussianWayMedia |\n| Pak Sarzameen | pakssarzameen[.]org | @PSarzameeninfo |\n| Voice of the Rejuvenation | voiceoftherejuvenation[.]com | @fuxingmedia |\n| El Pulso Popular | elpulsopopular[.]com | @elpulsopopular |\n| Fifty States | fiftystates[.]news | @Fiftystatesnews |\n| Civic Pulse | civicpulse[.]info | @Civicpulsemedia |\n| Commonwealth Post | commonwealth-post[.]com | @cmwthpost |\n\n表 2. 该网络约 70 个虚假新闻媒体的代表性样本，包括已去武器化域名及对应 X 账号。\n\n### GTG-84005：阻断针对马来西亚的商业选举操纵平台\n\n我们识别并移除了一个使用 Claude 运营商业选举操纵平台的账号，主要针对马来西亚用户。网络由约 1,000 个虚假 X/Twitter 社交账号、一家虚假新闻媒体和一系列伪造档案组成。\n\n该平台把自己包装成防御型网络情报与反虚假信息工具平台。然而，我们的调查发现其与总部位于伊斯坦布尔的技术公司 BBS Bilisim Teknolojileri 存在明确联系；该公司把平台作为付费的“影响力即服务”能力出售。根据威胁行为者自己的文档，这套基础设施被营销为“军用级、AI 驱动、实时政治行动生态系统”。\n\n行动中的行为者利用由 Claude 构建的平台，摄取人口普查和选举数据后，按选区逐一画像并针对马来西亚选民。平台管理约 1,000 个虚假账号，并专门优化这些账号来抬高互动指标、规避社交平台检测。系统还运营一个名为“Malaysia Pulse”的虚假新闻网站，由 AI 改写流水线持续为该合成媒体供稿。\n\n行动背后的人员还制作伪造情报档案，用虚假指控攻击一名反对派政治人物和公民社会组织。这些指控完全由行为者编造。\n\n我们按 Breakout Scale 将该行动评为 Category Two：相关资产分布在多个平台，但没有证据显示其突破进入真实社群。\n\n行为者使用 Claude Code 构建定制 Dashboard，用于管理、运行和追踪虚假账号网络。Dashboard 会记录每个目标从欺骗性账号获得的点赞、浏览量等指标。一个针对马来西亚高级政府官员账号的示例显示数百万级数据。由于这些数字来自行为者自己的工具自报，我们无法独立验证。\n\n#### 关键发现\n\n- 行动使用真实人口普查、选举数据以及数百万条选民记录，针对马来西亚最敏感的政治社会裂缝：覆盖全部 222 个国会选区的族群、宗教和王室议题。\n- 平台管理超过 1,000 个虚假 X/Twitter 账号。每个账号都包含“养号”逻辑，在投入影响力行动前先运行一段时间模拟真实账号，包括定期更新 Cookie 与 IP 地址。Dashboard 里还有一个参数，让用户设定每个目标最多应获得多少人工浏览量。我们观察到一个支持马来西亚现任总理的请求，要求为其账号制造 100 万次人工浏览。\n- 行为者针对具名个人生成指控，而模型自己的研究找不到任何可佐证信息。\n- Claude 多次拒绝执行行动要求，例如识别到某份文件属于政治诽谤材料后拒绝继续；行为者随后会与模型“协商”更中性的措辞，以继续构建相同能力。\n- 行为者曾寻求与马来西亚国家通信监管机构签订合同。我们没有发现该尝试成功的证据。\n\n#### 攻击生命周期与 AI 使用\n\nClaude 被用于：用真实选举数据构建选区定向系统；设计并运行虚假社交账号网络及其检测规避逻辑；改写和“洗白”虚假新闻；以及反复修改伪造档案。\n\n合成新闻媒体还抓取马来西亚合法媒体报道，让模型连续改写数次后，以虚构署名重新发布。它也转载俄罗斯和中国国家关联外国媒体内容，包括 TV BRICS、新华社、Sputnik/RIA 和 CGTN，并删除国家来源归因，把这些内容包装成独立的马来西亚本地报道。\n\n| **集群** | **Claude 的用途** | **最严重元素** |\n| --- | --- | --- |\n| 选民定向系统 | 基于真实人口普查与选民数据构建选区画像 | 围绕族群、宗教和王室裂缝进行微定向 |\n| 虚假账号网络 | 约 1,000 个账号、养号与规避逻辑 | 高度相似发帖；针对一国政府首脑制造人工互动 |\n| 合成新闻媒体 | AI 改写流水线、虚构署名 | 把俄罗斯和中国国家媒体内容洗成“独立报道” |\n| 伪造档案 | 以虚假权威包装的“情报报告” | 制造针对具名个人的虚假指控 |\n| 加密通信工具 | 行动安全通信 | 为该行动专门构建的行动安全能力 |\n\n表 3. 一个覆盖完整影响力行动链条的商业平台：定向、放大、合成新闻、伪造档案和行动安全。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff5b85037fdaf7b599c544e77b0f76c06d75257a1-1990x858.jpg\u0026w=3840\u0026q=75)\n\n图 6. 虚假评论账号画像，转发并分享来自该平台的内容。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F50310bb34607a9bcac2a1ecddae75c7547ebc5e2-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 7. 虚假新闻媒体“Malaysia Pulse”，是该行动背后的页面之一；域名注册于 2026 年 5 月 10 日。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd1b0a944121b60eaea479afba155f1c75da4a87d-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 8. 与该行动关联的虚假 YouTube 频道，首个也是唯一一个视频在数周后发布。归档：hXXps[://]archive[.]ph/GZCoq。\n\n#### 阻断与缓解\n\n我们通过内部检测识别该账号，并利用恢复出的指标映射整个行动范围，同时阻断后续滥用。\n\nClaude 在多个节点拒绝或部分拒绝了行为者的请求，其中包括：模型已经把某份伪造档案识别为政治诽谤材料，以及对明显唤起“心理行动”的措辞表示拒绝。\n\n| **指标** | **类型** | **备注** |\n| --- | --- | --- |\n| malaysiapulse[.]com; bbsteknoloji[.]com | 域名 | 攻击者控制：新闻前台、公司 |\n| 23.88.118[.]216; 91.99.117[.]166; 157.180.93[.]7; 167.235.157[.]100; 46.62.214[.]3; 46.225.91[.]180 | IP（Hetzner） | XPanel/MalaysiaPulse、NEOS、Renderer、NEOS Docker、Panel、Voxta |\n| github[.]com/bbsbilisimteknolojileri-cell | 代码 | 组织仓库与开发者 Handle |\n| @armsam1209, @kioskou, @Chikmore, @avihoue, @goldsteve1, @adriansantodo, @bmmyangels, @telkisoszoba, @SHIHAN1947, @garyponce, @hugolaurent, @exceiivier | 马甲账号（示例） | 12 个账号，共享同一创建时间（2026 年 5 月 17 日） |\n| @malaysiapulseof | 频道 | 合成新闻行动的 YouTube 频道 |\n\n表 4. 马来西亚选举操纵平台的入侵/行动指标：攻击者控制域名、托管 IP、代码仓库、马甲账号及合成新闻频道。\n\n### GTG-24015：阻断基于 Claude 构建的俄罗斯国家媒体编辑流水线\n\n我们识别并移除了四个账号，其中各自的操作者都把 Claude 当成编辑与新闻生产台，再通过俄罗斯国家媒体渠道分发内容。这些操作者产出已经润色完成的成品，并直接送入生产线播出。\n\n虽然各操作者都试图隐藏身份，但我们以高置信度判断，他们最终把产出共享给俄罗斯国有或国家资助媒体，而且 Claude 生成的内容最终确实通过俄罗斯国家关联媒体发布和播出，包括面向摩尔多瓦受众的 *Sputnik Moldova* 和 *RIA Novosti*，面向拉丁美洲的 *Sputnik en Español*，面向非洲的 *Sputnik Africa*，以及 RT 全球播出的 *RT 英语新闻编辑部*。\n\n操作者利用不同媒体组成传播链，让俄罗斯来源的说法看起来像被不同渠道独立报道。借助 Claude 工作流，他们达到了通常需要整个专业编辑团队才能实现的生产规模。\n\n与那些难以触达真实受众的秘密账号网络不同，这些个人操作者制作的内容通过成熟媒体渠道分发。我们把单条 Claude 产出与已发布内容比对时，看到的实际触达从一条约 2,000 次浏览的 Telegram 帖子，到真实上电视播出的广播文案不等。我们无法判断这些媒体总产出中，有多大比例经过了涉及 Claude 的流水线。\n\n#### 关键发现\n\n- 一名前 *Sputnik Moldova* 总编辑使用 Claude，把罗马尼亚语和摩尔多瓦新闻、民调数据以及反对派社交帖子转成俄语文章；这些内容最终发布在 *Sputnik Moldova* Telegram 频道和 RIA Novosti，并在俄罗斯与摩尔多瓦媒体网络间放大，制造虚假的“多源验证”循环：同一个故事被不同媒体重复回响，看起来像获得了独立确认。\n- 同一行为者在摩尔多瓦最近一次重大全国投票——2025 年 9 月 28 日举行的[2025 年摩尔多瓦议会选举](https://en.wikipedia.org/wiki/2025_Moldovan_parliamentary_election)——前，放大针对总统 Maia Sandu 的捏造和诽谤性说法。\n- 一名与俄罗斯有关联的承包商直接从 Telegram 频道提取内容，再利用 Claude 为 *Sputnik en Español* 以及 Telegram 账号 @ATodaPotencia 撰写拉丁美洲西班牙语文章。在 Sputnik Mundo 一名主持人兼制片人的编辑监督下，该承包商还把产出输送给一个“看似独立”的 Telegram 频道，把与克里姆林宫一致的叙事重构成本地自然评论。\n- 一名俄罗斯国有媒体员工使用 Claude 构建直播内容，具体处理跑马字幕、屏幕标题、旁白脚本和短标题；输入来自俄罗斯新闻通讯社、SVR（俄罗斯对外情报局）以及国防部。至少有一例得到确认，这些材料确实进入俄罗斯广播信号。\n\n在每场行动中，Claude 都被嵌入一个本来已经运行、由专业人员编辑的流水线，作为“副编辑层”，让单个员工的产出大幅超过其独立工作能力。\n\n| **最终分发渠道** | **受众** | **来源材料** | **输出形式** |\n| --- | --- | --- | --- |\n| Sputnik Moldova / RIA Novosti | 摩尔多瓦（俄语受众） | 罗马尼亚和摩尔多瓦新闻、民调、反对派社交帖子 | Sputnik Moldova Telegram 与 RIA Novosti 的俄语文章，跨平台放大；秘密反对党材料 |\n| Sputnik en Español | 拉丁美洲（西班牙语） | 俄罗斯军事博主 Telegram（Rybar、Colonel Cassad 等） | 本地化西语文章 + @ATodaPotencia 帖子 |\n| Sputnik Africa | 非洲公众（英语） | 俄罗斯和法语新闻线（RIA Novosti、TASS、Sputnik Afrique） | 按 40 条内部风格规则生成 @sputnik_africa X/Twitter 与 News 帖文 |\n| RT 英语新闻编辑部 | RT 全球英语广播受众 | 俄罗斯新闻线、SVR 与国防部说法 | 严格字符数的直播跑马字幕、屏幕标题和旁白 |\n\n表 5. 国家媒体生产台：从来源材料，经 Claude 辅助本地化和框架化，到在受制裁媒体与放大网络上部署的共同生命周期。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff8895df92b5ec0ea58be773446ff04fc198e4e5d-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 9. 一条使用 Claude 创建并实际发布的帖子示例，获得 2.09K 次浏览；未观察到其他完全一致的匹配。“[Sputnik Moldova 2.0](https://t.me/rusputnikmd_2/)”属于一组与 Sputnik News 有关的网站与频道网络。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fe976cb85cd718bdfd272d70d296ece74ab60c064-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 10. [RIA Novosti](https://ria.ru/20250721/opros-2030492835.html) 出现带细微变化的其他标题；该 RIA Novosti 文章又被其他亲克里姆林宫媒体转载。归档：hXXps[://]archive[.]ph/Q1zW0。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F4cee6e4dcbcfa110aea472b5f6e5a2cdfa0937fd-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 11. Sputnik Africa Twitter/X 账号实际发布的一条帖子，与 Claude 生成文本完全一致。归档：hXXps[://]x[.]com/sputnik_africa/status/2027706409727492278。\n\n#### 阻断与缓解\n\n我们通过内部检测识别这些账号，封禁了与四场行动有关的账号，并与产业和研究伙伴共享指标。\n\n| **类别** | **指标** | **类型 / 备注** |\n| --- | --- | --- |\n| 国家媒体 | Sputnik Moldova; RIA Novosti; Sputnik en Español; Sputnik Africa (@sputnik_africa); RT English (Russia Today, ANO TV-Novosti) |  |\n| 欺骗性放大资产 | @ATodaPotencia (Telegram) | 把与克里姆林宫一致的内容包装成自然的拉丁美洲本地分析 |\n| 摩尔多瓦放大生态 | eadaily[.]com（受欧盟制裁）；point[.]md; vz[.]ru; mos[.]news; ru[.]euronews[.]com | 域名 |\n| 来源洗白生态（俄罗斯军事宣传 Telegram） | Rybar (@rybar_america); Colonel Cassad (@boris_rozhin); @theaterVD; @china3army; @kalashnikovnews | Telegram 频道 |\n\n表 6. 四场俄罗斯国家媒体行动中的指标：分发媒体、欺骗性放大资产，以及用于洗白来源的 Telegram 生态。\n\n### GTG-34001：阻断伊朗国家关联影响力行动——ICCO、伊斯兰宣传办公室与 Bina Observatory\n\n我们识别并移除了三个与伊朗国家有关联的账号，它们利用 Claude 筹划影响力行动。相关人员正在规划并准备内容，以支持其所称的“软战争”或“认知战”项目。按他们自己的说法，这是一项通过非军事方式塑造国内外舆论的计划。调查发现，每场行动都由在某个具名伊朗国家宣传机构内部工作、或代表该机构行事的行为者运作。相关实体包括：隶属于文化与伊斯兰指导部的 Islamic Culture and Communications Organization（ICCO）；Khorasan Razavi Islamic Propaganda Office——其从 Mashhad 一所宗教学校运行一个认知战指挥室，分发与 IRGC 叙事一致的内容；以及 Islamic Propaganda Organization 旗下的 Bina Cultural Observatory。\n\n在每个案例中，行动都依赖 Claude 构建活动计划、理论手册、人格系统、目标数据库和部级规划文档。以这种方式使用模型，使他们可以生成复杂的组织框架与资产；否则，这些工作通常需要一个人员完备的项目办公室才能完成。行为者还高度重视“归属洗白”：他们有意设计内容，让国家支持的叙事看起来像独立声音。正如 ICCO 行为者所说，他们作为文化专员的角色“不是叙述者，而是导演”。\n\n行为者有意采取措施隐藏身份与来源地。由于从伊朗境内访问 Claude 被封锁，他们使用 VPN 和外国电话号码注册、验证账号。但在对话中，他们仍反复提到自己的地点、机构和职务。结合带有机构品牌的文档页脚，以及对相关个人的公开来源核验，这些信息把各场行动分别与对应的伊朗国家关联机构联系起来。\n\n调查还发现，其中一些活动已经在其他平台传播。例如，我们观察到相关内容通过支持 IRGC 叙事的分发渠道扩散。\n\n按照 Breakout Scale，我们将这场行动评估为 **Category Three**：内容跨多个平台传播，并被观察到由 Eitaa 等平台上的 IRGC 关联频道分发。\n\n#### 关键发现\n\n- 三场行动的行为者都明确把活动与伊朗国家层面的“*Jihad al-Tabyin*（解释性圣战）”原则联系起来。按照这一概念，伊朗机构把生产宣传既视为宗教义务，也视为战略职责。与该国家理论相关的措辞直接出现在行为者会话和内部规划文件中。\n- 该网络制作了带有 ICCO 官方品牌的部级交付物，其中包括一个九部分组成的国际影响力项目组合，以及关于伊朗最高领袖葬礼的完整组织计划。\n- 公开资料印证了 Mashhad 指挥室战略设计者与指挥官的身份和职务。这些负责人运作名为“Manjanegh（Catapult）”的跨省内容工厂，使用数十名活动人员，把伊朗安全机构公开报告重新包装为特定人格发布的内容，并隐藏与伊朗安全机构的关联。该网络还通过 100 多个伊朗平台频道开展付费放大，其中包括与 IRGC 有关的频道。\n- 我们把行动与伊朗 Bina Cultural Observatory 一名主任级官员联系起来，并通过公开来源与账号遥测验证了这一关联。行为者在多个会话线程中以一名 IRGC 发言人的官方口吻生成内容。在围绕 2026 年美以伊战争的一场具体活动中，该网络把虚假说法归因给西方研究机构，包括 CSIS、Brookings 和 RAND。这两类手法都用于让国家支持的信息看起来更可信。\n- 该网络还部署了具有攻击性的反叙事内容，针对遭受迫害的宗教少数群体巴哈伊教徒，并建立了包含国际官员和伊朗反对派人物姓名的目标数据库。\n\n#### 行动生命周期与 AI 使用\n\n我们确认，行为者把 Claude 作为这三场伊朗宣传行动的主要行政与运营层：\n\n- 首先，他们使用 Claude 构建理论和意识形态相关内容，包括数字行动管理与运作指南、操作手册、编码项目组合、人格系统、预警协议和影响力行动的放大时序方案。\n- 其次，该网络使用 Claude 把政府官方情报简报转换成定制内容，覆盖波斯语、阿拉伯语、乌尔都语、马来语、西班牙语和英语，并制定了面向 20 种语言的更大计划。\n- 第三，他们用 Claude 进行归属洗白，让帖子看起来来自外国作者或独立新闻来源，也让标签活动看起来像由普通公民自发发起。\n- 第四，行为者通过 Eitaa、Bale、Rubika 等伊朗国内平台，以及 X/Twitter、Instagram、Telegram、TikTok、YouTube 和 ICCO 文化专员网络分发内容。\n\n| **机构** | **Claude 生成的内容** | **分发渠道** |\n| --- | --- | --- |\n| ICCO / 文化与伊斯兰指导部 | 部级影响力项目组合，以及最高领袖葬礼与继任计划 | 文化专员网络、外国署名、社交平台 |\n| Khorasan Razavi Islamic Propaganda Office | “Manjanegh”内容工厂理论与人格定制内容；付费活动；分发与 IRGC 叙事一致的内容 | Eitaa、Bale、Rubika，以及 X、Instagram、Telegram |\n| Islamic Propaganda Organization / Bina Cultural Observatory | 重新包装 IRGC 发言人通告；系列化战争公共传播；借智库名义洗白 | Bina Telegram 与 Instagram；国内受众 |\n\n表 7. 三场伊朗国家关联行动与其机构、Claude 生成内容及分发渠道的对应关系。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F3a285b36a6c34c01c2377882cd8f26838c601c69-1990x734.jpg\u0026w=3840\u0026q=75)\n\n图 12. 在伊朗国内消息平台 Eitaa 上观察到的 IRGC 关联频道，向波斯语国内受众传播该行动内容。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F615f56ed52a382c0631355595ea691dc268ff1d5-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 13. Threads 账号展示了其中一次实际定向攻击，此处目标是新闻媒体 Nawapress。\n\n#### 阻断与缓解\n\n我们通过内部调查识别这些账号，封禁了与三场行动相关的账号，并与产业和研究伙伴共享相关指标。\n\n| **类别** | **指标** | **类型 / 备注** |\n| --- | --- | --- |\n| 归属机构 | Islamic Culture and Communications Organization（ICCO）及其 International Quran and Propagation Center，隶属文化与伊斯兰指导部；Khorasan Razavi Islamic Propaganda Office 与 Shahid Hasheminejad Cultural Technology House（Mashhad）；Islamic Propaganda Organization 及其 Bina Cultural Observatory | 机构 |\n| ICCO 项目组合 | 项目代码 A-01 至 B-04；注明 ICCO 和 IQPC 的文档页脚；人为制造草根感的 #IranStands 标签 | 项目代码、页脚、标签 |\n| Mashhad 内容工厂 | 内部命名 Manjanegh（Catapult）、Mashe（Trigger）、Chashni（Primer）；私人 Eitaa 频道“Monjaneq”；付费放大，包括 IRGC 关联频道 @hamyane_sepah 与 @moghavematnews_iran | 代号、频道 |\n| Bina | 冒充 IRGC 发言人；Bina Monitoring Center 的 Telegram 与 Instagram 频道 | 频道、冒充 |\n\n表 8. 三场伊朗国家关联行动的指标：归属机构、项目代码、内容工厂代号和放大渠道。\n\n### GTG-54006：阻断面向孟加拉国农村地区、支持 Awami League 的自动化假新闻行动\n\n我们识别并移除了一个持续运行的自动化虚假信息网络，该网络使用 Claude 在孟加拉国生成捏造的孟加拉语新闻。行动重点是宣传 Bangladesh Awami League，并攻击其政治对手。由于 Awami League 自 2024 年 7 月起义后已不再执政，因此该网络是在为反对党而非政府开展活动。行为者完全清楚自己的欺骗手法；他们在内部沟通中写道：“没人知道这些新闻是假的。”\n\n行动由孟加拉国 Gaibandha District 的一名行为者单独运作。为规避平台限制和检测，他轮换使用 29 个 Claude 账号。行为者使用名为 `fake_news_3.py` 的自定义软件直接连接 Claude，程序被写死为按固定批次生成内容：15 个标题、3 篇详细虚构报道，以及 15 条图像生成提示词。根据行为者自己的说法，这些产出用于持续供应 Facebook Live、YouTube 和 TikTok 直播，目标受众是识字程度有限的农村 Awami League 支持者。\n\n行为者至少生成了 1,500 个标题、300 条虚假叙事和 1,500 条图像提示词。由于 Claude 当时尚不具备图像生成功能，这些提示词很可能被导出到其他前沿 AI 模型，用于制作虚假叙事中的视觉内容。\n\n行动在孟加拉国境内运行，目标也是国内受众，其内容旨在服务 Awami League 的利益。尽管叙事方向一致，我们的调查没有发现该党本身参与指导或资助该网络活动的证据。\n\n调查显示，该行动的视频出现在三个社交媒体平台上的多个孟加拉国相关频道和账号中。我们无法确认究竟是哪些具体频道发布了全部产出，也没有证据表明这些内容在相关账号之外触达了更广泛受众。\n\n按照 Breakout Scale，我们把该行动评估为 **Category Three**：活动跨多个平台，并在多个聚焦孟加拉国的频道和社交媒体账号中观察到与其产出匹配的视频。\n\n#### 关键发现\n\n- 行为者在内部把输出明确称为“假新闻”，要求内容“火爆、有攻击性”，并且要简单到“连村里人都能看懂”。其明确假设是，目标受众会把这些内容当成真实新闻。\n- 内容一贯支持 Awami League，并针对 [Bangladesh Nationalist Party](https://en.wikipedia.org/wiki/Bangladesh_Nationalist_Party)（BNP）、Jamaat-e-Islami、National Citizens Committee、临时政府和学生抗议领袖。网络使用捏造的抹黑活动，指控这些对手是外国代理人、试图推动塔利班式治理。\n- 行为者还创建了独立上传脚本，通过 YouTube API 批量发布视频。脚本会借助第三方持续集成服务，按照提前一个月设置的计划发布内容。\n- 该网络生成的一些叙事也与亲印度地缘政治利益一致，但我们没有发现任何国家指导或资助的证据。\n\n#### 行动生命周期与 AI 使用\n\n系统搭建完成后，行动以较少人工监督半自主运行。名为 `fake_news_3.py` 的自定义程序调用 Claude API，按标准批次生成虚构孟加拉语内容，包括标题、详细叙事和配套图像提示词。程序还针对识字程度较低的农村受众，调优了带有强烈情绪色彩的主题。产出进入固定云存储文件夹，随后被转换为音频和视频，再由第二个脚本提前数月排入 YouTube 发布队列。\n\n| **叙事主题** | **手法** | **目标** |\n| --- | --- | --- |\n| 宗教极端主义框架 | 把反对派描述为计划实施塔利班式伊斯兰教法统治、渗透安全部队 | Jamaat-e-Islami、BNP、NCP |\n| 暴力与阴谋 | 捏造暗杀计划和行动小组 | 临时政府、学生抗议领袖 |\n| 外国代理人抹黑 | 把学生领袖标记为外国情报机构代理人 | 7 月抗议运动 |\n| 腐败与阴谋 | 捏造金融腐败和秘密跨党联盟 | 反对党 |\n\n表 9. 自动化假新闻流水线：从自定义 API 工具、批量捏造内容、云端暂存，到定时发布。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fa96c365e73fecaee2efb1c3149545a9d97c0d812-1990x734.jpg\u0026w=3840\u0026q=75)\n\n图 14. 行为者用于在分发前存储和暂存视频内容的 Google Drive 文件夹。\n\n#### 阻断与缓解\n\n我们在内部调查中发现该活动并封禁了相关账号。我们预计行为者可能创建新账号继续活动，因此已经围绕其行为特征建立检测能力，以阻止其再次出现。与本报告其他行动一样，我们还把相关指标分享给对应分发平台和其他合作伙伴。\n\n| **类别** | **指标** | **类型 / 备注** |\n| --- | --- | --- |\n| 行为者 | 一名位于孟加拉国 Gaibandha District 的行为者，在约 16 个月内轮换使用 29 个 Claude 账号 | 行为者 |\n| 自动化工具 | `fake_news_3.py`（API 内容生成，至少是第三版）；配套上传脚本（自动上传 YouTube、提前数月排程，并通过第三方持续集成服务路由以隐藏行为者 IP） | 脚本 |\n| 固定输出格式 | 每次运行生成 15 个虚构孟加拉语标题、3 篇详细叙事和 15 条英文图像生成提示词 | 输出 Schema |\n| 保留给合作伙伴共享 | 云存储文件夹标识符；上传脚本 | 未公开 |\n\n表 10. 支持 Awami League 行动的指标：单一孟加拉国行为者、自动化脚本和虚构内容输出格式。\n\n### GTG-84006：阻断与 MEK/NCRI 一致的分布式影响力行动——共享 AI Agent 冒充真人并在伊朗境内招募\n\n我们识别并移除了一个分布式影响力行动，其目标包括伊朗境内和海外的伊朗受众。为欺骗用户，行动通过共享 AI Agent 冒充一名现实中的活动人士：先让 Agent 克隆该活动人士的私人 Telegram 账号，再用波斯语指示它“现在就是这个人”。行为者让 Claude 阅读约 8,400 条该人士的 Telegram 帖文，以模仿其写作风格，随后用它与联系人开展实时政治对话。据我们所知，这些联系人并不知道自己正在与一个 AI 辅助账号交流。\n\n虽然相关行为者并未共享账号基础设施，也没有明显的协同行为迹象，但调查把这些活动与 People’s Mojahedin Organization of Iran（PMOI/MEK）及其政治前台 National Council of Resistance of Iran（NCRI）联系起来。\n\n调查显示，至少四名运作该行动的人在 NCRI 官方媒体机构工作。行动依赖多个配备人员的 NCRI/MEK 媒体资产，横跨广播电视、卫星和短波广播、Instagram、Telegram 与 X/Twitter。委员会审批环节以及关于 MEK 领导层的记录，说明存在中央任务分配的可能性很高，但我们无法核实集中控制的具体程度。\n\n按照 Breakout Scale，我们将该行动评估为 **Category Two**：跨多个平台，通过网络自有的 NCRI 媒体资产和放大账号传播。\n\n#### 关键发现\n\n- 行动成功抓取了 500 多个社交媒体频道，为伊朗境内个人建立详细画像，再按城市、年龄、职业、政治立场以及逮捕经历对目标分组，以便针对不同受众调整信息。\n- 网络分析了这些对话中约 51,944 条归档消息，为伊朗境内数十名具名个人建立详细心理画像。为了进一步传播信息，冒充账号还同时向 30 多名联系人发送一条捏造的突发新闻标题。\n- 为宣传 NCRI 主席 Maryam Rajavi 的十点计划，该网络为每篇文章创建 AI 生成头像，再为头像制作动画、加入波斯语音频，并把它们设计成普通伊朗人的样子，同时有意隐藏其 AI 生成属性。\n- 行为者使用自动化流水线运作多个 Instagram 账号网络并协调发布时间，同时针对不同目标受众调整内容。为隐藏真实动机，最初的帖子刻意不提 Mojahedin，使该组织的宣传看起来像没有关联的中立新闻。\n- 行动的信息重点针对伊朗政府、君主主义团体和 Pahlavi 阵营。行为者传播了一段攻击 Pahlavi 家族成员的伪造视频，并使用“Neither Shah Nor Sheikh”框架攻击目标，意在强化 MEK 在伊朗反对派中的位置。\n\n#### 行动生命周期与 AI 使用\n\n该网络依靠 Claude 支持影响力行动的所有阶段。行为者通过一个共享 AI Agent 平台管理任务，每个工作区都维护自己的长期记忆文件。随着时间推移，他们不断向这些文件加入具体指令，例如禁用词列表、批准来源、账号管理规则和规避检测的方法。这样一来，即使没有人类用户逐次指导每个会话，Agent 也能持续生产内容。其中一名行为者还把 MEK 的创立理论加载到模型记忆中，作为行动内部其他人可以复用的“战略基础数据”。\n\n这场行动背后的人类管理高度结构化，包括由专门委员会组成的审批闭环，以及从内容纠正人员到管理者的正式审查流程。在沟通中，行为者反复使用“按照我们的合同”这一表述，并经常提到 MEK 领导层。我们发现，同一套行动手册在所有工作区中统一应用。\n\n多数产出以波斯语为先，并把 2022 年抗议中自然形成的口号 «زن، زندگی، آزادی»（“Woman, Life, Freedom”）替换为 MEK 版本 «زن، مقاومت، آزادی»（“Woman, Resistance, Freedom”）。\n\n| **集群** | **Claude 的用途** | **最严重的要素** |\n| --- | --- | --- |\n| 共享 Agent 平台（“Viktor”） | 基于持久记忆的 Agent 跨行为者自主、定时生产 | 跨行为者共享的理论与规避规则，成为协同底层 |\n| 实时冒充 | 从私人消息克隆真人表达方式；以其身份进行实时对话 | 在伊朗境内联系人不知情的情况下冒充真实活动人士 |\n| 监控与画像 | 十阶段漏斗；对伊朗境内具名个人建立心理画像档案 | 根据逮捕经历画像，而这些人在伊朗法律下可能面临监禁或处决 |\n| 协调式虚假行为 | 多账号 Instagram 流水线，按照受众分组同步发布 | 隐藏 MEK 归属，在“独立”品牌下发布近乎一致的协调内容 |\n| 合成媒体 | 为发言人创建带波斯语音频的头像 | 未披露的合成“普通伊朗人”与历史人物深度伪造，用于制造虚假权威 |\n| 媒体洗白 | 把 MEK 关联媒体重写并重新分发为独立报道 | 去除水印，把组织内容伪装成普通同胞的声音 |\n\n表 11. 该影响力行动的不同组成：共享 Agent 平台、冒充、监控、协调式虚假行为、合成媒体和媒体洗白。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbcae98f28b9f99f32eb9e5d72fa994ee730282e8-1990x1250.jpg\u0026w=3840\u0026q=75)\n\n图 15. 一个由名为“Viktor”的共享 Claude Agent 平台连接起来的分布式网络，涵盖实时冒充、伊朗境内监控、协调式虚假行为、合成发言人和媒体洗白。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc3a3242fdb031d4b508557fcbc790b9b233d9505-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 16. 该行动以协调式虚假行为、合成媒体和媒体洗白为基础。图中为网络账号的 Instagram 帖子示例。\n\n#### 阻断与缓解\n\n我们在内部调查中发现这些活动并封禁相关账号。目前，我们无法独立确认该网络的放大账号获得了多少真实用户互动。\n\n| **指标** | **类型** | **备注** |\n| --- | --- | --- |\n| mojahedin[.]org; ncr-iran[.]org; maryam-rajavi[.]com; iranntv[.]com; iranfreedom[.]org; hambastegimeli[.]com; wncri[.]org | 域名 | 在各行为者中硬编码的 MEK/NCRI 强制来源集 |\n| @simaintv / @iranintv | Instagram | 原始节点（~708K） |\n| @javanane_shargt | Instagram | 全国侨民受众（~299K） |\n| @tehranchekhabar19 | Instagram | “独立新闻”；学生定向（~173K） |\n| @faryade_mamnoo | Instagram | 反对派内容（~89.5K） |\n| @khabar_fouri_mardom; @iranpayam_tehran5 | Instagram | 协调式多页面网络 |\n| @fwr.ir / @fwr_ir; t[.]me/FWR_ir | Instagram / Telegram | 马甲账号漏斗与监控终端 |\n| @anti_silent | Telegram | 学生监控漏斗 |\n| @jomhouri_democratic | Instagram / Telegram | 十点计划宣传 |\n| ZWNJ + 点/空格规避；强制口号；#OurChoiceMaryamRajavi；SKILL.md / LEARNINGS.md 记忆 | 指纹 | 跨行为者特征 |\n\n表 12. 该活动背后的网络账号、相关网站及传播账号 IoC。\n\n### GTG-54004：阻断肯尼亚国内协调式虚假草根舆论行动\n\n我们识别并移除了一个由单一行为者使用的账号，该账号被用于大规模生产肯尼亚政治内容。行动被设计成看起来像自然、自发的草根舆论。行为者在多个会话中使用 Claude，每次生成整批恰好 50 条推文，并明确要求模型让内容看起来像自发的草根评论，而不是协调行动。\n\n该网络围绕肯尼亚重要政治议题和人物进行传播。大量 AI 生成推文赞扬能源内阁部长 Opiyo Wandayi 阻止 Kenya Power 原计划的电价上涨，并使用 #PowerReliefKE 和 #PoweringTheNewKenya 提升可见度。同时，网络还推动“Kenya’s United Opposition 联盟在 2027 年大选前正在瓦解”的叙事，直接针对政治人物 Rigathi Gachagua 和前总统 Uhuru Kenyatta。\n\n此外，行为者还以“SHANKI”/“Elkins Marketer”这一营销身份，为肯尼亚零售品牌运行完全相同的 AI 工作流。我们没有发现政府参与的证据，这些活动更符合完全由肯尼亚国内行为者运作的特征。\n\n调查显示，这是一场高度结构化的政治“伪草根”行动：它在不同对话中围绕电价上涨推出完全一致、统一的信息。我们使用 Breakout Scale 评估其影响，把它归为 **Category One**。相关活动完全局限于单个平台上的虚假账号和本地影响者网络中，没有成功触达或影响真实公众。\n\n我们并不知道背后人员的现实身份，但判断这是一场肯尼亚本地政治伪草根行动。网络的亲政府语气和特定标签表明，它可能与执政联盟立场一致，但我们尚未识别具体责任组织。\n\n#### 关键发现\n\n- 行动采用同一套手册，同时放大亲政府和反对派负面叙事。以这种方式既强化现政府、又削弱反对派的政治可行性，符合单一协调式选举传播行动的特征。\n- 这里使用的模板也被逐字用于零售品牌营销，包括把一段促销广播重新包装成看似自然的推文，并每隔五条插入一个链接。这符合肯尼亚常见的一种模式：营销机构付费给本地影响者以[操纵叙事](https://www.wired.com/story/opinion-in-kenya-influencers-are-hired-to-spread-disinformation/)。\n- 行动频繁使用 Claude 对 50 条预先拟好的主题和推文批量进行“人性化”和润色，表明模型对该网络的主要价值是提高数量并制造真实感；核心意识形态信息在 Claude 介入前已经由行为者完全决定。\n\n#### 行动生命周期与 AI 使用\n\n行为者提供主题、话术要点和标签，再用 Claude 把它们转成 50 条主题统一、符合字符数限制、可跨平台发布和分发的帖子。在数个会话中，这些内容还被封装成可“一键复制全部”的交互式组件，直接用于部署。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd54d70fe0a25ebee59b8a9eecb32d70e048e8421-1990x1620.jpg\u0026w=3840\u0026q=75)\n\n图 17. 虚假评论账号放大内阁部长 Opiyo Wandayi 相关内容，可看到该行动虚假账号之间形成的协调集群。\n\n#### 阻断与缓解\n\n在 OpenAI 分享有关其平台上重复违规活动的线索后，我们围绕肯尼亚可疑协调式虚假行为展开内部调查，并识别出这场行动。我们移除了相关账号及其背后的组织，并围绕其行为特征建立检测能力。\n\n### GTG-84002：阻断由阿联酋方面主导、针对穆斯林兄弟会、苏丹冲突及联合国问责机制的影响力行动\n\n我们识别并移除了一个由单一行为者用于持续开展反穆斯林兄弟会影响力行动的账号。行为者利用 Claude 维护一个名为“Deadshot”的 AI 人格，该人格托管在其私人平台上。系统设置中嵌入了一份主理论文件，要求 Claude 在数百个会话中反复执行同一使命：“一场协调一致、跨大西洋及地区性的全球拆解穆斯林兄弟会行动。”\n\n行动分成五条紧密关联的工作线。行为者同时管理各条支线，确保叙事生成、技术混淆与战术目标选择在整个行动中完全同步：\n\n- 建立并管理约 300 个虚假影响者社交账号组成的网络；\n- 创建一个前台 NGO，复制一家真实瑞士组织的身份，并以其名义发布国家撰写的人权报告；\n- 代写正式证词，计划由两个人在联合国人权理事会第 62 届会议上发表，并在内容设计上明确要求两份发言都不能提到 UAE；\n- 深入研究并画像 18 名欧洲议会议员和知名记者，为这些议员和记者建立详细个人档案；\n- 针对曾批评 UAE 在苏丹行为的联合国特别报告员，整理“反问责”档案。\n\n尽管行动的设计目标之一就是不可追溯到幕后行为者，我们的调查仍以高置信度把它与阿联酋政府官员联系起来。理论文件还把阿联酋高级官员列为工作的预期接收者。根据调查，行为者也为放大内容的社交媒体网络提供资金。\n\n我们无法确认任何证词或目标档案是否最终成功送达预期受众。\n\n按照 Breakout Scale，我们把该活动评估为 **Category Three**，因为它横跨多个社交媒体平台。若要达到更高类别，则需要有广泛公众关注或政策影响的证据，而我们无法确认这些情况。\n\n#### 关键发现\n\n- 社交媒体放大网络由中央出资和协调。内部报告把网络的“独立性”称为其“最大的战略资产”，实际上承认其试图隐藏国家指导属性。\n- 行为者借用一家真实苏丹人权组织的身份，并为两名具名人士完整代写联合国证词，使服务于苏丹冲突一方的材料可以作为“独立本地证人”的声音进入联合国，而不是作为国家信息传播。\n\n#### 行动生命周期与 AI 使用\n\n行动工作流先输入现实议题和预先编写的政治理论文件，再使用 Claude 把这些材料转换成外观正式的情报简报、克隆身份报告、代写证词，以及针对个人建立的目标清单，其中若干材料准备直接提交给阿联酋高级官员。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F04d4d1292aa3c5069a1390dd6b164bec444f2e87-1990x1617.jpg\u0026w=3840\u0026q=75)\n\n图 18. X/Twitter 账号在 2026 年 6 月 4 日围绕 #SudanIslamists 开展协调行动，发布近乎一致的图像内容，把苏丹穆斯林兄弟会与地区不稳定联系起来。\n\n#### 阻断与缓解\n\n我们在内部调查中发现这些活动并封禁相关账号。我们还围绕已记录的行为特征建立检测，以阻止未来相关活动，并共享指标以支持其他产业伙伴采取行动。\n\n[返回顶部](#main)\n\n## AI 赋能的监控行动\n\n今年 1 月至 7 月，我们识别并阻断了一系列利用 Claude 构建、运行或以其他方式支持监控行动的活动，参与者包括国家关联行为者、与政府有联系的承包商和商业间谍软件供应商。这些案例涉及中国、伊朗和西非的威胁行为者，也涉及商业“监控即服务”市场；行动规模从单一个人到完整团队不等。Anthropic 的 Usage Policy 禁止使用 Claude 开展未经同意的监控和画像，也禁止利用我们的服务侵犯个人的公民自由和人权。下文每个案例中的威胁行为者都违反了我们的 Usage Policy，并试图绕过用于检测此类滥用的控制措施。对于每个案例，我们都封禁了相关账号，改进了对观察到的战术、技术和程序（TTP）的检测能力；当行动涉及平台之外的活动或影响时，我们也酌情与产业伙伴和相关机构共享标识符与情报。\n\n调查过程中，我们观察到几个趋势。\n\n**第一，AI 正在被用来替代一支工程团队。** 一名为马里国家安全部门工作的顾问使用 Claude 设计了一套大规模拦截平台，可以监视该国所有移动运营商上的通信并为目标生成档案。在这个案例中，Claude 并不是用来分析监控档案，而是用来设计支撑情报收集的软件本身。另一个案例中，伊朗行为者使用 Claude 构建并部署了一个恶意 Firefox 扩展，从社交网络中收集用户身份。中国（PRC）一个宗教事务情报收集部门过去由多支分析团队组成，如今则缩减为一个办公室，借助 AI 助手每月完成数千项调查。\n\n**第二，AI 不仅用于构建工具，也被用于批量摄取数据、识别目标。** 一个案例中，行为者批量上传社交媒体帖子，并要求 Claude 生成结构化记录，列出目标的位置、人口统计信息和政治倾向，同时为每项判断给出置信度。类似地，一个伊朗单位使用 Claude 分析数十万条社交媒体帖子，从中选出 39 个反对派账号进行监控。中国行为者让 Claude 按政治敏感度对社交媒体内容和新闻文章评分，并标记可能需要其所谓“管控”的目标。而在最成熟的案例中，一名与中国有关联、完全不会阿拉伯语的行为者使用 Claude 对叙利亚境内的维吾尔目标开展持续数日的招募行动。模型用当地口音起草接触话术、实时翻译回复、以“专家”身份角色扮演对任务进行质量检查，并把结果整理成我们怀疑是提交给案件负责人的格式。\n\n**第三，AI 正在被完整嵌入国家安全官僚体系。** 一个中国国家安全局使用 Claude 制作内部手册，说明如何在监控行动中使用 AI，这表明 AI 模型正在深入进入国家行为者的日常工作。在伊朗，两个既不共享代码、也不共享人员的单位，分别独立使用 Claude 解决国家运营的集中式监控案件管理系统中的相同技术和可用性问题。这说明 AI 正被用于跨越国家监控体系中的技术和官僚障碍。\n\n本节几乎所有案例中，操作者都是国家关联组织，其目标也仍是这些政权历史上一贯关注的侨民和异议群体，包括香港民主派人士、亚洲各地的藏人和法轮功群体，以及海外的伊朗少数群体和伊朗政权反对者。\n\n### GTG-54009：阻断使用 Claude 对伊朗和波斯湾地区用户社交账号进行画像的商业监控平台\n\n2026 年 6 月，我们封禁了一个使用 Claude 构建商业监控平台的账号。该平台用于分析、分类并画像伊朗和波斯湾地区用户的社交媒体活动。调查发现，这些活动由名为“S2T Unlocking Cyberspace”的实体实施或代表其实施；公开来源研究表明，这是一家以色列—新加坡背景的商业情报供应商。\n\n该平台的核心目的就是监控：它绘制社交媒体用户的地理位置，把人群划分成编码后的人口类别，并生成以政府报告语体撰写的阿拉伯语情报简报。\n\n我们的发现独立印证了新闻调查网络 [Forbidden Stories](https://forbiddenstories.org/osint-s2t-unlocking-cyberspace-journalists-activists/) 在 2023 年 2 月发布的一项调查。该调查记录了一款 S2T 监控产品，记者在哥伦比亚军方泄露文件中的公司宣传册里发现了它。宣传册描述的能力与我们在这次行动中观察到的行为高度吻合。\n\n我们在该项目仍处于试点阶段时识别出这些活动；在封禁账号之前，没有发现 Forbidden Stories 报道中所描述的 S2T 监控链后续阶段已经被用于真实目标的证据。\n\n#### 关键发现\n\n- 行为者正在构建一组多品牌系统，很可能面向海湾地区的阿拉伯语客户。\n- 系统收集并分类侨民社交网络用户的位置，把他们划分为亲政府或反政府人群。\n- 行为者使用包含六类人群的分类体系：城市居民、宗教人士、军方、青年、侨民和农村人口。\n- 最终简报以正式阿拉伯语撰写，样式仿照官方政府通信；情绪评分按不同海湾国家国籍拆分，并附带建议的反叙事方案。\n- 我们还识别到另一条工作流，其中包含 255 个以上的合成社交网络账号。这表明行为者正在建立一批以后可投入使用的虚假账号库存。\n\n#### 行动生命周期与 AI 使用\n\n行为者使用 Claude 生成和分析内容。一个案例中，他们每次向 Claude 输入约 25 条社交媒体帖子，让 Claude 分析并返回发帖者的人口类别、位置和政治倾向等信息，同时对每项判断给出置信度。另一个案例中，行为者让 Claude 用波斯语、阿拉伯语、英语和德语为一批（很可能是虚假的）线上人格生成帖子；这些人格被设计成不同亲伊朗政权和反伊朗政权群体中的普通成员。这种行为表明，对方可能试图大规模创建虚假社交账号，同时在冲突双方布点。\n\nForbidden Stories 在 2023 年对泄露的 S2T 宣传册进行调查时，描述了该公司的服务，包括创建虚假账号渗透私人 WhatsApp 和 Telegram 群组、收集成员名单，并进一步升级到网络钓鱼和设备入侵。该行为者借助 Claude 生成的内容，可能就是为这些虚假账号增加可信度，让目标愿意信任它们。我们无法独立确认 Forbidden Stories 报道的后续行动阶段是否真的发生。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc5c7183d60d65a5ac34e454a02653468c287ae24-1920x960.jpg\u0026w=3840\u0026q=75)\n\n图 1. 该行动的收集漏斗：由 Claude 驱动的分类和人格生成，很可能帮助行为者渗透目标社区。\n\n#### 阻断与缓解\n\n这些活动违反了我们的 Usage Policy：其中既包括禁止监控——例如对活动人士、记者和政治异议人士进行画像、评分和建立档案——也包括禁止协调式虚假行为。我们封禁了相关账号，并正在实施缓解措施以应对未来滥用。我们也向跟踪“监控即服务”行为者的合作伙伴共享了指标，以便在 Anthropic 平台之外共同阻断该行动。\n\n#### 按人群划分的合成账号 Handle\n\n| **类别** | **分组代码** | **Handles** |\n| --- | --- | --- |\n| 合成：侨民 | IR-DI | @ShirazisInLA, @TorontoPersianForum, @BerlinIranFree, @DubaiIranOpposition, @LondonIranExile |\n| 合成：青年/学生 | IR-YO | @tehran_uni_student, @isfahanprotestkid, @tabriz_uni_protest, @ShirazYouthRebel |\n| 合成：军方 | IR-MI | @BasijMashhad, @IRGC_Isfahan, @QudsForceChat |\n| 合成：宗教人士 | IR-CL | @QomSeminaryNews, @mashhad_clergy, @AyatollahKhamenei |\n| 合成：农村 | IR-RU | @IsfahanVillageNews, @rural_khorasan, @VillageVoiceIR |\n| 合成：UAE 外籍人员 | UAE | @PakistaniDubaiWorker, @AjmanLaborForum, @IntlCityWorkers, @BanglaExpatSharjah |\n| 合成：Saudi/GCC 宗派议题 | GCC | @RiyadhDefender, @SaudiShiaWatcher, @ShiaThreatAlert, @EyeOnIranSA |\n\n表 1. 被放入合成训练语料中的社交媒体 Handle；这些账号在审查早期被发现，没有被评估为已投入实际行动。\n\n#### 按语料划分的标签\n\n| **语料** | **Hashtags** |\n| --- | --- |\n| 反政权：IRGC/Khamenei | #sepah_fased, #IRGCcorruption, #trust_Khamenei |\n| 反政权：征兵 | #faraar_az_sarbazi, #flee_draft |\n| 反政权：新闻自由 | #PressFreedomIran, #IranCensorship |\n| 反政权：经济 | #tavarrom, #gerani, #hyperinflation_iran |\n| 反政权：外交孤立 | #IranTanha, #EnzevaYeDiplomasi |\n| 反政权：政权更替 | #سرنگونی, #ایران_آزاد |\n| 亲政权：核权利 | #hagh-e-hasteh-i, #حق_هسته_ای |\n| 亲政权：抵抗/殉难 | #mehvar_e_moghavemat, #AxisOfResistance, #shahid |\n| 亲政权：爱国动员 | #vatanparasti, #defa_az_keshvar |\n| 心理画像/脆弱性 | #PTSD_Iran, #salamat_e_ravan, #trauma_ye_jang, #suicide_rate_war |\n| UAE/GCC 宗派议题 | #صراع_سني_شيعي, #خطر_شيعي |\n| 亲沙特反伊朗 | #USBaseGulf, #FifthFleetBahrain |\n\n表 2. 行为者分类器跟踪的标签；这些标签本身并不是该行为者的指标。\n\n### GTG-14010：阻断中国境内针对叙利亚维吾尔人的监控与招募行动\n\n我们识别出一场与中国政府有关联的行动，行为者使用 Claude 跟踪、画像并招募叙利亚境内的维吾尔人及维吾尔武装编队。被作为武装目标的人，是近期加入新组建叙利亚军队的维吾尔族成员，而中国政府将这些编队认定为恐怖组织。行为者借助 Claude 寻找并联系被判断可能接触这些编队的叙利亚境内人员，随后试图招募他们，包括提出以付费换取有关部队情况的报告。\n\n此外，行为者还使用 Claude 定位叙利亚境内特定维吾尔商家和兴趣地点。这些活动与更广泛的监控行动并行，包括监视维吾尔侨民记者，以及为政府客户起草监控平台投标文件的商业项目。行为者主要使用中文，其情报收集优先级与中国国家安全系统的关注方向一致。我们以低置信度判断，该行为者更可能是代表中国国家安全系统工作的承包商，而非国家安全机关直接行动。\n\n#### 关键发现\n\n行为者使用 Claude，把从 100 多个受监控 WhatsApp 群组和数十个 Telegram 频道中批量提取的聊天内容，转换为结构化中文数据。其中包括为可能因经济压力、家庭分离和意识形态幻灭而容易被针对的个人建立画像。行为者特别标出那些仍有家人留在新疆的目标——这种杠杆只有与中国国内安全机构协同才能真正利用。\n\n- 行为者要求 Claude 扮演会说阿拉伯语的“专家”顾问，从方言、军事术语和目标心理等方面检查欺骗性信息的质量。\n- 同时，行为者还针对维吾尔侨民记者——尤其是 *Uyghur Post* 的工作人员——策划协调式大规模举报、通过外国前台进行污名化以及机器人网络放大。\n- 行为者起草面向中国局级政府客户的监控平台招标书和能力宣传册，显示出“政府客户—供应商”的运营结构。\n- Claude 拒绝了多项秘密审讯请求，以及大规模生成虚假人格的请求。\n\n#### 行动生命周期与 AI 使用\n\n行动覆盖完整情报链。在收集和分析阶段，行为者使用独立于 Claude 的其他基础设施，从社交媒体群组批量提取聊天内容，然后把 Claude 作为离线分析层，用于跨平台关联身份、绘制关系网络、按照可利用脆弱点画像个人、生成中文报告，并制定压制维吾尔侨民媒体的详细方案。在执行阶段，行为者使用 Claude 策划一场针对叙利亚境内目标、持续数日的秘密招募行动，并用叙利亚阿拉伯语起草内容。Claude 实时翻译回复，以“专家”顾问身份检查欺骗方案，并把文档整理成可向上级报告链交付的格式。\n\n行为者利用 Claude 降低了对母语能力和专业人员的依赖。这样，一个不会阿拉伯语的人也能维持具有可信度的秘密接触行动，建立用于监控个人的结构化数据库，定位具体人员，并搭建支撑数据收集所需的商业与影响力基础设施。Claude 拒绝了其中若干最严重的请求，包括秘密审讯和大规模人格培养。\n\n| **工作流** | **Claude 的用途** | **结果** |\n| --- | --- | --- |\n| HUMINT 招募 | 秘密接触、谈判辅导、实时翻译、成果整理 | 对我们不可见 |\n| 对侨民成员的大规模监控 | 把批量提取的社区聊天整理为中文目标数据 | 对受迫害侨民群体建立脆弱性画像 |\n| 物理定位 | 通过卫星图和地图进行网络映射和地点确认 | 冲突区内特定平民的现实位置 |\n| 媒体压制 | 规划协调举报、污名化和放大行动 | 针对维吾尔侨民媒体 *Uyghur Post* 的方案 |\n| 商业采购 | 起草监控平台投标文件和能力宣传册 | 面向局级政府客户营销 |\n| 虚假账号基础设施 | 请求大规模培养虚假人格 | 大部分被模型拒绝 |\n\n表 3. Claude 在该行动不同工作流中的使用方式。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fef384f0fab07ffb7fc9c2df850e561ad33ff791a-1920x744.jpg\u0026w=3840\u0026q=75)\n\n图 2. 从收集到执行的完整链路：从批量监控和脆弱性画像，到 AI 实时辅导的招募、定位和交接。Claude 在每个阶段都提供支持，包括为候选目标的可接近性评分、用当地口音起草招募脚本，以及在与目标的对话进行时实时向行为者提供建议。\n\n#### 阻断与缓解\n\n我们封禁了与该活动有关的账号，目前正在跟踪该行为者的数字特征，以防止未来再次滥用。\n\n| **类别** | **指标** |\n| --- | --- |\n| 行为者画像 | 中文行为者，其收集优先级与中国国家安全系统一致，通过 API 和 Agent 工作流运作。很可能是“监控即服务”承包商。 |\n| 目标集合 | 叙利亚境内由维吾尔人组成的武装编队；Idlib Province 的维吾尔平民侨民社区；以及海外维吾尔媒体和活动人士。 |\n| 行动特征 | 以“专家组”角色扮演检查欺骗信息；重复使用掩护故事（例如真实媒体的自由记者、“寻找军队工作的表亲”）；当目标指出“这是中国账号”时，使用预先编写、带宗教编码的否认话术。 |\n| 监控流水线 | 多字段结构化提取 Schema，并强制要求中文摘要字段；匿名支付通道（稳定币和消息应用积分）。 |\n| 商业层 | 面向局级政府客户营销的监控平台投标书和能力宣传册。 |\n| 媒体压制目标 | 维吾尔侨民媒体 *Uyghur Post*，该媒体在 Radio Free Asia 的 Uyghur Service 关闭后成立。 |\n\n表 4. 针对叙利亚维吾尔人的中国境内行动指标：行为者画像、目标集合、行动特征，以及监控和商业基础设施。\n\n### GTG-14020：阻断中国境内针对天主教、藏传佛教、法轮功及台湾基督教社群的宗教事务情报行动\n\n我们封禁了一组账号，并认为其与一场位于中国境内、与中国政府有关联的情报行动有关。行为者把 Claude 当成一整支分析团队的替代品，为亚洲各地宗教领袖和中国侨民人物建立中文档案。其目标选择与中国宗教事务和统一战线体系的重点高度吻合——即负责宗教事务，并对被认为威胁宗教统一的群体进行吸纳或施压的党国机构。用户活动表明这些行为者位于中国；一个案例中，用户还自称是中国国家系统的信息安全人员。\n\n行为者要求 Claude 生成看起来供国家安全内部办公室使用的分析文档，包括“人物调研底稿”、调查性“线索报”和每日“态势感知”摘要。每份材料都会记录特定目标的涉华活动、丑闻，以及“抓手（zhuāshǒu）”——这是统一战线工作语境中指代可利用杠杆的术语。\n\n目标包括亚洲多地的高级天主教枢机、台湾基督长老教会领导层、藏传佛教公民社会及流亡行政机构成员，以及法轮功和其关联媒体。目标既有公开露面的高级宗教领袖，也有普通私人公民。\n\n#### 关键发现\n\n- 行为者收集特定个人的出生日期、出生地、移民时间和社交媒体 Handle；还对宗教场所进行侦察，制作平面图、外立面和结构示意图。\n- 监控覆盖境内外平台，包括微信、小红书、抖音、微博，也包括 LinkedIn、Instagram、Threads、X 和 Facebook，并以每日为报告周期。\n- 在提示词中，行为者要求 Claude “站在中国立场”，把西藏流亡行政机构描述为“非法分裂政权”，并按照国家口径把法轮功称为“邪教”。\n\n#### 行动生命周期与 AI 使用\n\n在这一案例中，一名操作者运行的很可能是一个宗教事务情报收集台。在四条并行工作流中，行为者让 Claude 摄取多语言来源，再按照内部模板生成结构化中文档案。每套模板都要求列出目标的涉华活动、丑闻和可利用“抓手”。实质上，行为者用 Claude 承担了一支分析团队的工作，把它变成由单一操作者运行的模板化流程。\n\n| **工作流** | **目标集合** | **输出** | **频率** |\n| --- | --- | --- | --- |\n| 天主教领导层 | 亚洲各地高级枢机 | 目标档案 | 按对象 |\n| 台湾宗教公民社会 | 台湾基督长老教会领导层 | 多目标档案 + 场所侦察 | 事件驱动 |\n| 藏传佛教 | 流亡行政机构和倡议组织；中国登记协会 | 态势摘要与组织数据集 | 每日及批处理 |\n| 法轮功 | 修炼者及关联媒体（Shen Yun、NTD） | 监控摘要 | 每日 |\n| 基督教传教网络 | 与新加坡、香港和中国大陆有关的事工网络 | 国家安全风格“线索报” | 不定期 |\n\n表 5. 该行动各工作流中的监控目标与报告产出。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F4c445959585523daef561e14eaa8f8da2ccc7dde-1920x821.jpg\u0026w=3840\u0026q=75)\n\n图 3. 情报收集台工作流：多语言来源被摄取后，进入模板化档案、摘要和报告。Claude 在每个阶段用于翻译、摘要、起草和格式化文档。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbef891c7485a75fa18002afbd18909f1d453888e-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 4. 被监控者之一是一所法轮功关联机构的大学教师。行动针对海外群体，对与侨民有关的教育人员和修炼者建立画像。\n\n#### 阻断与缓解\n\n我们封禁了负责这些活动的账号集群，并增强检测能力，以阻断和降低未来滥用风险。\n\n| **类别** | **指标** |\n| --- | --- |\n| 对齐的优先事项 | 中国统一战线和宗教事务体系：United Front Work Department、Ministry of State Security，以及原 State Administration for Religious Affairs。 |\n| 目标类别 | 亚洲高级天主教枢机；台湾基督长老教会；Central Tibetan Administration 与藏人倡议组织（International Campaign for Tibet、Students for a Free Tibet）；法轮功及关联媒体（Shen Yun、NTD）；连接新加坡、香港与中国大陆的基督教传教网络。 |\n| 内部模板特征 | “人物调研底稿”“线索报”“态势感知”摘要；反复出现“工作抓手”“负面情况”等字段。 |\n| 国家安全语汇（归属信号） | “工作抓手”“态势感知”“线索报”“邪教”“民分”“境外涉华”“站在中方立场”等。 |\n\n表 6. 宗教事务情报行动指标：对齐的国家重点、目标类别、内部模板特征与国家安全语汇。\n\n### GTG-14021：阻断中国境内“维稳”监控与跨国压制行动\n\n我们阻断并封禁了一组用于开展三场行动的账号。在这些行动中，与市级公安和国家安全机关有关联的中国境内行为者使用 Claude 支持“维稳”（党国体系用于指代压制社会动荡和异议的术语）监控与跨国压制。一个案例中，行为者还生成了关于 AI 使用的内部手册，其中包括要求 Claude 扮演服务于中国国家安全体系的情报分析员的提示语。\n\n我们认为该行为者与一个市级网警单位有关，该单位使用 Claude 运行国内舆情监控项目。我们还发现该行为者与一名警校学生有关联；后者把 10 名中国普通公民列为中国安全体系所谓需要“管控”的目标。另一个关联方则是地方国家安全局，它使用 Claude 每日生成模板化“态势感知”简报，目标是海外异议人士和公民社会组织。\n\n目标范围从国内上访者、维权人士，一直延伸到香港知名民主派人士、六四纪念活动组织者、维吾尔倡议组织以及西方人权机构。在最严重的案例中，行为者要求 Claude 为海外抗议活动生成“行动前场地情报”，也就是在行动实施前对地点进行侦察。\n\n#### 关键发现\n\n- 三个与中国市级安全体系一致的账号使用 Claude 开展“维稳”和跨国压制。相关工作似乎分别由一名个人分析员、一名警务学术人员，以及一个具体市级机构执行。\n- 一个市级网警单位使用 Claude Code 配合自定义 Skills，运行舆情监控流水线、查询政府监控数据库，并生成关于政治敏感事件的每日报告，其中包括跟踪一个知名海外异议账号。\n- Claude 曾拒绝一次摄取并生成每周“维稳”报告的请求，但行为者随后通过重新提示，让模型输出了具有实际执行性的压制建议，并点名 10 名普通公民作为“管控”对象，涉及拦截上访、“谈话”式审讯（国家体系中指强制传唤），以及严密监控其行动和通信。\n- 一个地方国家安全局运行每日流水线，按照政府模板生成“态势感知”简报，并把整套工作流整理为 AI 使用手册，其中包含让 Claude 扮演服务国家的情报分析员的提示词。\n- 市级机构对具体海外活动人士和组织建立画像，并索取海外活动的行动前场地信息，包括温哥华一场民主游行的集合点、路线和终点，土耳其的维吾尔文化活动地点，以及 Oslo Freedom Forum 的放映场所。\n- 自动化流水线在生成每份报告前，会抓取一份既有公民社会媒体清单。报告将维吾尔倡议活动描述成与恐怖主义相邻，并把大型人权组织称为“敌对势力”，与中国国家安全体系用语一致。\n\n#### 行动生命周期与 AI 使用\n\n虽然三场关联行动规模不同，但都服务于中国地方安全机关的“维稳”任务。各案例中的行为者都会识别可能提出正式申诉的公民，以便提前拦截；监视维权人士；跟踪监控名单中被指定为“重点人员”的对象。监控范围还延伸到海外异议人士和侨民群体。\n\n一个案例中，行为者使用 Claude Code 与自定义 Skills 自动抓取浏览器内容、查询政府监控数据库，并向上级分发每日报告。第二个案例中，行为者只通过一次提示就让 Claude 生成报告，为具体个人分配执法类别。第三个案例中，模型生成每日情报简报并画像特定活动人士。此后，该工作流又被整理成手册供整个机构内部使用。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fae32bdff452a5193a13b0dda3366900629a1a9d1-1920x568.jpg\u0026w=3840\u0026q=75)\n\n图 5. 行为者同时监控国内和跨国目标，从地方上访者到知名西方人权组织。\n\n| **案例** | **行为者（身份）** | **Claude 的用途** | **最严重要素** |\n| --- | --- | --- | --- |\n| 市级网警单位 | 一名网警（低置信度身份） | 通过 Claude Code 和自定义 Skills 运行国内舆情监控流水线 | 自动化跨平台跟踪，包括监控一个知名海外异议账号 |\n| 警校学生 | 一名公安侦查人员兼警校学生 | 一份实际“维稳”报告 | Claude 原先拒绝，但被重新提示后绕过；压制建议点名 10 名普通公民 |\n| 地方国家安全局 | 多名操作者（未恢复姓名） | 每日政府“态势感知”简报；机构 AI 手册 | 对合法海外抗议活动进行行动前场地侦察；模型在大量会话中持续配合 |\n\n表 7. 三个案例从单个行为者手工工作，逐步发展到国家安全局内部自动化工作流。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd0be69c577562e8fdb1cc98d0e9e7eb124cb2b15-1990x892.jpg\u0026w=3840\u0026q=75)\n\n图 6. @whyyoutouzhele（“李老师不是你老师”）是该行动监控的账号之一；该账号以汇总中国境内抗议影像和被审查新闻而知名。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F0eba606146d3dd88ccc072436349e99a6608f8f7-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 7. 行为者试图在 Claude 协助下开发的国内监控仪表盘实时测试。\n\n#### 阻断与缓解\n\n我们封禁了与这些行动有关的账号，并正在映射其更广泛活动痕迹，其中包括两个案例共享的商业 VPN 出口节点。我们正在跟踪相关行为者的数字特征，以防止未来滥用。\n\n现有防护在这些案例中的表现并不一致：一个案例中，Claude 正确拒绝了请求，但在进一步提示后被绕过；另一个案例中，模型在大量会话中持续配合而没有触发干预。我们正把这些发现用于开发新的安全措施和模型训练。\n\n| **类别** | **指标** |\n| --- | --- |\n| 行为者画像 | 在中国境内运行、与中国公安和国家安全机关一致的行为者（不论出口节点如何，设备时区为 UTC+8；使用 v2ray 和商业 VPN），分为三个层级：个人网警、警校学生，以及包含多名个人操作者的机构。 |\n| 机构归属（置信度不同） | 一名同时为警校研究生的市级公安侦查人员（中等置信度）；国家安全局很可能位于浙江（中等置信度）。 |\n| 维稳特征 | 政府文档模板（“态势感知”简报）；维稳语汇；敏感度层级分类；内部 AI 使用手册，其中固化了供机构内分发的具体提示公式。 |\n| Agent 化 TTP | Claude Code + 自定义监控 Skills；查询政府监控数据库；通过企业消息和静态网页分发报告。 |\n| 提及的内部平台 | 国内舆情监控与预警系统；具名内部监控工具。 |\n| 跨国压制目标 | 香港民主派人士；六四纪念活动组织者；维吾尔倡议组织；知名国际人权组织。 |\n\n表 8. 三个“维稳”案例中的指标：行为者画像、机构归属、行动特征与跨国压制目标。\n\n### GTG-14022：阻断中国境内“舆情监控”与异议人士监控行动\n\n我们阻断了一场中国境内行动，其使用 Claude 作为自动化“舆情监控”（党国体系用于指跟踪和管理网络舆论）和情报分析系统。行为者让 Claude 生成政府“舆情简报”（供官员使用的受限简报），将异议人士、活动人士、少数族裔和中国侨民社群、外国媒体列为政治稳定风险。行为者还要求 Claude 扮演“服务中华人民共和国政府的高级应急舆情分析员”。\n\nClaude 生成的文档会按政治敏感度给内容评分，并依据特定术语规则重新框定批评中国的报道，例如给“human rights violations（侵犯人权）”等表述加上引号。一些文档还建议只有政府才能执行的具体执法行动。自动化流水线每天处理 15 至 30 多篇外国新闻，来源包括微博、X、YouTube、Telegram 和 Facebook。\n\n我们以中等置信度判断，这是一名为政府客户工作的承包商，而非国家机关或国家行为者直接实施。其客户很可能与国家安全体系、统一战线和宣传系统有关。我们还以高置信度判断，两组彼此关联的账号集群属于同一行为者。\n\n#### 关键发现\n\n- 行为者为政府官员制作情报简报，把对国内外异议活动的内部监控，与将外国报道重新框定为“敌对叙事”的外部传播工作结合起来。\n- 行为者使用 Claude 监控并分类具体异议人士、活动人士、少数族裔与侨民社群、宗教组织、台湾政治人物、劳工和学生行动者，以及知名国际人权和民主组织。\n- 行为者使用 Claude 制作带版本控制的行动手册和一套文档系统，使每日摄取 15 至 30 多篇文章的报告流水线可以自动运行；这一量级更像官僚体系中的例行工作，而不是临时任务。\n- 行为者使用 Claude 的代码执行环境，以很少人工干预运行自动文档生成流水线。\n- 行为者要求 Claude 使用特定术语，例如把“台湾政府”改成“台湾当局”，并给批评中国的措辞加上引号，例如“侵犯人权”。\n- 一些文档提出给特定政府部门的建议，或建议只有国家才能实施的执法行动，并使用中国“三战”（心理战、法律战、舆论战）理论语汇。\n\n#### 行动生命周期与 AI 使用\n\n行为者用 Claude 运行可重复流程，从社交网络及主要西方和台湾媒体摄取公开来源内容，再综合成内部政府简报，把异议活动和外国报道识别为稳定与意识形态安全风险。Claude 生成的文档会为每条内容打政治敏感度分，并按标准化术语和框架重新表述。\n\n行为者要求 Claude 扮演分析员，并使用其代码执行环境定期生成一整套标准化简报。该行动并没有展示特别新颖的模型能力，其独特之处在于 Claude 被嵌入了官僚体系的日常流程。\n\n| **目标类别** | **监控重点** |\n| --- | --- |\n| 国内社交媒体批评 | 对官方的“负面舆情”；按政治安全风险评分 |\n| 劳工与学生行动 | 将抗议和纠纷框定为“恶意炒作” |\n| 台湾政治活动 | 把两岸与文化外交活动描述为主权威胁 |\n| 少数族裔和宗教社群 | 维吾尔、藏人和法轮功活动；特定倡议组织 |\n| 海外侨民与异议人士 | 知名异议账号、民主和权利组织 |\n| 外国媒体 | 将西方与台湾媒体报道重新框定为敌对叙事 |\n\n表 9. 监控目标组合及其关注领域，展示个人、组织和事件如何被归入行动收集优先级。\n\n![图像](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fa091a50d8def75bcaf1ddcfa53b2a6f7ec5d71f8-1990x1150.jpg\u0026w=3840\u0026q=75)\n\n图 8. 舆情简报流水线会摄取类似示例中的公开文章，为每篇内容评估政治敏感度、重构叙事，再格式化成政府简报；Claude 参与这一流程的每个阶段。\n\n#### 阻断与缓解\n\n我们封禁了与该行动相关的账号，其中包括通过共享基础设施关联到同一行为者的第二组账号；同时还在映射与该基础设施有关的更大账号网络。我们已经部署检测，以防止该行为者未来再次滥用。\n\n| **类别** | **指标** |\n| --- | --- |\n| 行为者画像 | 为中国政府客户工作的商业承包商（中等置信度），很可能与国家安全、统一战线或宣传生态有关；提示词为简体中文；zh-CN locale；活动集中在中国工作时间；通过共享基础设施高置信度判断两组账号属于同一行为者。 |\n| 行动特征 | 名为“Daily Report 1”的账号；带版本控制的“舆情监控”框架（v2.6），包含主控表和附录；要求模型扮演服务政府的舆情分析员；政治敏感度评分；术语标准化与叙事重构；强制加入对抗性分析章节；整合正式心理战、法律战和舆论战理论。 |\n| 输出 | 政府风格“舆情简报”；通过代码执行环境定期生成多份格式化简报；每天处理 15 至 30 多篇文章。 |\n| 目标 | 国内外异议人士和活动人士；维吾尔、藏人等少数族裔和宗教社群；台湾政治人物、劳工和学生行动者；外国媒体；知名全球人权组织。 |\n\n表 10. “舆情监控”行动指标：行为者画像、行动特征、输出格式和监控目标。\n\n### GTG-34007：阻断两个伊朗关联单位构建监控系统与恶意 Firefox 浏览器扩展\n\n我们识别并封禁了由两个彼此关联、与伊朗准军事和国内安全机构有关的单位运作的 16 个 Claude 账号。两个单位在 Claude 上使用不同的行动手册，但都把数据送入同一中央基础设施。\n\n我们识别到一个横跨伊朗多个省份、设有七个部门的组织。该组织声称维护伊朗公民身份记录数据库，并在一年内监控和画像 6,388 名伊朗人。操作者把 Claude 当成分析员和生产工作室，构建了一个很可能由政府控制的监控案件管理系统前端，并对 155,216 条推文进行社交网络分析。\n\n我们还识别出一个位于 Qom 的省级单位，把 Claude 当作工程部门来构建国内监控能力。该单位最重要的成果是一款已经投产的恶意 Firefox 扩展，名为“al-Najm al-thāqib”；单位成员用它从主要社交平台大规模收集用户身份。两个单位都围绕同一集中式系统“Arman”构建扩展和界面，该系统采用联邦式模式，由省级单位向中央基础设施输送数据。用户借助 Claude 获取代码、速度、工程能力和分析支持。\n\n#### 最终客户\n\n我们以高置信度判断，这两个单位与伊朗准军事国内安全实体有关。行为者使用 Claude 为国家安全客户生成成果；我们还发现证据表明，它们会响应伊朗政府高级官员下达的任务。另有证据显示，这些单位代表伊朗政府对公职候选人进行审查。\n\n两个单位都把监控收集数据录入共享案件管理系统“Arman”。在该系统中，一个人的档案包含国家身份证号、信仰、犯罪记录、社交账号，以及一个“action”标签页。\n\n#### 关键发现\n\n- 一个单位使用 Claude 构建、调试并部署多种工具，包括消息平台去匿名化工具、手机号到身份解析器、国家身份证钓鱼页面、Telegram 批量举报机器人，以及伪装成祈祷时间工具的 Firefox 身份收集扩展。这些工具被下游操作者用于监控和画像伊朗人。另一个单位则基于“Arman”的后端源代码，使用 Claude 构建 Web 前端；它还运行社交网络分析流水线，点名 39 个伊朗反对派和侨民账号。\n- Claude 拒绝了明确的画像和宣传请求，但我们的防护并没有拒绝许多监控软件工具开发请求。\n- 与其中一个单位共址的另一个行为者，把 Claude 的自定义 Skills 功能变成一个语音克隆宣传工厂：克隆三名伊朗作家的声音，并提前为最高领袖继任准备叙事。\n\n#### 行动生命周期与 AI 使用\n\n行为者使用 Claude 维护部分既有代码，并为日常行动开发新工具。一个案例中，它要求 Claude 构建恶意浏览器扩展，用于批量收集社交媒体数据以支持监控；另一个案例中，它向 Claude 输入大量社交媒体帖子，要求模型评估行为者眼中的反对派情绪。\n\n#### 阻断与缓解\n\n我们封禁了全部 16 个账号及相关组织，理由是违反 Usage Policy 中对未经同意的监控和画像、虚假信息的禁止规定，以及 Supported Regions Policy。我们还把调查发现纳入检测系统，以识别并封禁未来滥用。\n\n### GTG-50027：阻断为马里国家情报部门构建的全国性大规模拦截与监控平台\n\n我们识别并阻断了一名行为者，其把 Claude 当作主要工程劳动力，为马里国家情报部门构建全国国内监控平台。一个 Claude 订阅用户——很可能是位于 Bamako、与马里国家情报机构“Agence Nationale de la Sécurité d’État（ANSE）”合作的独立顾问——使用 Claude 构建名为“Lakana 360”的人口规模国内监控平台。该平台监控马里三家全国移动运营商上的约 2,500 万张 SIM 卡。行为者在设计上绕过了马里法律中部分监控记录披露必须获得法院命令的限制；他要求 Claude 对任何指定电话号码生成情报档案，而不要求 ANSE 用户提供有效法律程序。美国国务院和 [Human Rights Watch](https://www.hrw.org/news/2025/02/13/mali-au-action-needed-end-crackdown-opposition-dissent) 都曾记录马里安全部门拘留和绑架反对派人士、记者和公民社会成员的情况。\n\n#### 关键发现\n\n- 行为者把 Claude 当成国家情报服务监控平台的主要工程团队。平台覆盖马里全部三家全国移动运营商，约 2,500 万张 SIM。\n- 平台底层负责收集全国电信用户数据，包括通话记录、短信和语音通话，并额外捕获马里移动网络上的语音流量。\n- 应操作者要求，为任意电话号码撰写 LLM 情报档案的组件取消了司法令要求，并被重新定义为全国流水线：控制默认关闭、数据无限期保留。\n- 平台还包括跨 SIM 声纹识别、标记加密与 VPN 用户、推断秘密会面、对个人设置地理围栏“观察名单”，以及把个人与国家生物识别民事登记系统和其他政府登记系统进行匹配。\n- 平台完全在本地部署并使用本地模型；行为者使用 Claude 获取软件设计和工程支持。账号执法并不会影响已经部署的产品。\n\n| **能力** | **Claude 的用途** | **最严重要素** |\n| --- | --- | --- |\n| 定向拦截 | 构建需要司法令的通话、消息、语音拦截流程，以及证据保管和审计工具 | 审批和审计规则不适用于批量收集层 |\n| 全国批量收集 | 构建全国通话记录、SMS 和语音捕获流水线 | 在移动核心网并行捕获语音 |\n| 无司法令档案 | 用 LLM 为任意电话号码生成情报叙事 | 应操作者要求移除司法令要求，并无限期保留 |\n| 人口规模分析 | 跨 SIM 声纹跟踪、隐私工具标记、观察名单、跨登记系统关联 | 绕过一次性 SIM 的自我保护；与国家生物识别登记系统连接 |\n\n表 11. 平台的四项能力，以及 Claude 在每项能力中的用途。\n\n#### 阻断与缓解\n\n我们封禁了该用户账号并实施检测，以防止未来滥用。最终用户使用本地 LLM 把平台部署在本地基础设施上。因此，我们的账号执法阻断了行为者的软件和设计活动，但不会影响平台本身的部署。\n\n1 HRW, Mali: AU Action Needed To End Crackdown on Opposition, Dissent [https://www.hrw.org/news/2025/02/13/mali-au-action-needed-end-crackdown-opposition-dissent](https://www.hrw.org/news/2025/02/13/mali-au-action-needed-end-crackdown-opposition-dissent)\n\n### GTG-30004：自动化开源情报与恶意软件开发\n\n我们识别出一名伊朗关联威胁行为者，其使用 Claude 构建自动化开源情报身份画像 Harness，目标是以色列政府及非政府人员和犹太侨民组织。此外，该行为者还利用 Claude 提高恶意软件的隐蔽性，使其更难被识别为恶意软件。\n\n#### 自动化情报 Harness\n\n一条工作流中，威胁行为者构建并使用 Claude 编排一个开源情报与侦察工具，对以色列和犹太侨民中的数百人建立画像。行为者运行自动化身份画像 Harness，对既有目标名单进行补充，试图生成关于以色列与美国个人的开源情报产品。Claude 加速了其公开来源数据收集和分析能力。\n\n#### 恶意软件开发\n\n在另一条并行工作流中，行为者通过多个波斯语会话修改开源 LSASS 凭据转储工具 NanoDump，并使用 Python 构建定制 C++ 混淆/构建流水线，用于重命名标识符并注入无用函数，很可能意在混淆恶意软件样本并妨碍分析。\n\n### GTG-30005：军事侦察\n\n#### 海军侦察\n\n另一项调查中，我们识别并阻断了一名伊朗关联威胁行为者，其使用 Claude 收集和分析公开可获得的数据，以形成针对地区内美国海军力量的目标建议。该行为者通过一条在 Claude 协助下构建的 Python 流水线，根据公开信息识别和跟踪海军位置，并编制目标手册。汇总材料包括：从公开军事照片说明文字中抓取的美国人员名单；公开可获得的舰船和飞机应答器标识符；商业卫星图像查询脚本；以及会暴露美国海军动向的公开网站清单。行为者还要求 Claude 汇总舰载系统漏洞研究，整理海事 VSAT 终端、Cisco 通信设备和工业控制产品中的已知 CVE。\n\n我们封禁了该行为者账号，开发检测以降低未来滥用风险，并与政府部门共享威胁情报以阻断相关威胁。\n\n#### 国内大规模监控\n\n此外，同一账号还为伊朗国家系统开展企业软件开发，包括使用 Claude 设计一个国内大规模监控平台的软件组件，将自动车牌识别与移动设备标识符拦截结合起来。操作者还针对一个 244 人私人 Telegram 群组的当天导出数据构建分析工具，包括对成员关系进行社交网络分析。\n\n#### 调研的漏洞\n\n```\nCVE-2022-22707, CVE-2019-11072, CVE-2018-19052 (COBHAM SAILOR 900 VSAT)\nCVE-2025-20309 (Cisco Unified Communications Manager)\nCVE-2024-20418 (Cisco Ultra-Reliable Wireless Backhaul)\nCVE-2024-20354 (Cisco IW3702)\nCVE-2024-2658 (Schneider Electric EcoStruxure)\n```\n\n### GTG-30006：构建国内监控工具\n\n我们识别出一名伊朗威胁行为者，其在 16 个单操作者组织中利用免费 Claude.ai 账号，开发针对伊朗国内用户的恶意软件、投递流水线和钓鱼门户。投递页面被设计成只向 IP 地址来自伊朗的访问者提供恶意内容，页面主题围绕规避审查工具和一个虚构的波斯语新闻品牌。\n\n#### 行动生命周期与 AI 使用\n\n##### 网络钓鱼与投递工具\n\n威胁行为者使用 Claude 进行工程开发和测试，把项目拆分成表面上彼此独立、看似无害的 Web 开发请求。产出包括：由 Telegram Bot 控制的 VBScript Dropper、伪造 Microsoft Excel 和 Windows 凭据对话框、将捕获凭据发送到 Telegram 的假 ESET NOD32 防病毒登录页、ClickFix 风格 Win+R 诱饵、V2Ray 落地页和地理限制投递页。对十个表面上明确恶意的直接请求，Claude 拒绝了九个；但当用户把工作拆碎、分散到后续更小的会话中时，我们的防护表现不再那么稳定。\n\n##### SECOMS64 Implant\n\n在行动另一部分，行为者使用 Claude 构建模块化 Windows Implant `SECOMS64`。该 Implant 包含键盘记录、截图捕获、绕过 App-Bound Encryption 的 Chrome 凭据提取，以及对 Microsoft Defender 和 Intune 的侦察。配套组件还包括经 ngrok 隧道传输的 PowerShell Reverse Shell、USB 驱动器传播、浏览器数据破坏模块，以及一个从文件共享服务获取、再修改以规避防病毒检测的分阶段 Dropper。\n\n整套工具面向个人监控。键盘记录器会在 Telegram Desktop 处于焦点时捕获按键；截图组件以名为“Telegram”的可执行文件运行，使用相同图标，并通过 Telegram Bot 外传截图。USB 模块记录接触过的每个驱动器序列号；同一集群中的 Android 应用会上载设备联系人、消息和媒体。持久化采用多层机制：注册表 Run Key、最高权限级别的计划任务、自删除批处理文件，以及伪装成 Windows 字体驱动服务、位于固定 ProgramData 路径的二进制文件。另一条外传路径把数据暂存到商业云存储中，文件名编码受害者主机名，随后在服务端下载并删除文件。行为者还测试通过 Telegram 文档处理实现远程代码执行，评估其他命令与控制框架，把组件封装成无可见控制台窗口运行并绕过 SmartScreen，还把工具包装成假图像编辑应用，
