tyle=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eAI 增强的网络行动\u003c/span\u003e","payload":{"lines":"21,22","tag":"h2"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e我们如何调查\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:8adb9e82756ab4b33c11e6411fe4b419b5b1f9467a5e6419dd6498284e4e08ce\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"60,61","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e我们如何衡量触达\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:89d5a57f0dbea1c78f8908b5027dbff12e9d2ec02e902f7d75243a7e45ee82c3\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"61,62","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e1.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e影响力被作为服务出售。\u003c/strong\u003e\u0026nbsp;正如我们此前报告指出的，受政治实体、政府等客户雇佣的商业操作者，可以为任何愿意付费的人制作内容。这使真正委托影响力行动的一方获得可否认性，也让无法或不愿自行建设相关能力的行为者可以购买现成服务。本报告两个案例中，正常经营的广告或营销公司一边做普通商业业务，一边运营影响力行动。\u003c/span\u003e","payload":{"lines":"63,64","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e2.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003eAI 充当新闻编辑台。\u003c/strong\u003e\u0026nbsp;在多个案例中，Claude 被嵌入一个本来就由人类编辑、已经运行的内容流水线，扮演副编辑或内容创作者。这让资源有限的行为者也能以远超其独立能力的规模运作影响力行动。\u003c/span\u003e","payload":{"lines":"64,65","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003eAI 不只生产内容，也帮助建设整套行动装置。\u003c/strong\u003e\u0026nbsp;行为者让模型制作行动纲领、反对派档案、部长级材料包、人设系统、目标数据库、把编辑忠诚写进条款的雇佣合同，以及用于给参与行动的员工打分的评分标准。没有 AI 时，这类工作通常需要一个配备人员的项目办公室。\u003c/span\u003e","payload":{"lines":"65,66","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e4.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e复杂工具使用。\u003c/strong\u003e\u0026nbsp;我们发现一些影响力行动从一开始就被设计成可持续、可轻易扩张。包含行动原则的 Markdown 文件几乎原样重复用于数百个会话；行为者在 AI Agent 内维护禁用词清单，共享已批准来源和规避规则文件，并运行按固定批次调用 Claude 的定制软件。中央化设置意味着不同内容生产者甚至不需要彼此协调或相互认识。一名行为者还在制作课程，准备把工作流教给其他人。越来越多行动不再靠单次 Prompt 驱动，而是把大量规则嵌入持久 Memory 文件。\u003c/span\u003e","payload":{"lines":"66,67","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e5.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e洗白归因、来源和确定性。\u003c/strong\u003e\u0026nbsp;行为者使用 Claude 设计内容，让国家或委托方叙事看起来来自独立声音。他们要求 Claude 有意移除转载材料中的国家归因，把同一说法在多个媒体节点之间层层转手，使其读起来像是被不同来源独立证实。在一个与俄罗斯国家媒体有关的案例中，模型曾把某些说法标记为未经验证，操作者随后明确要求删除这些限定，把全部内容写成“已确认事实”。\u003c/span\u003e","payload":{"lines":"67,68","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e6.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e行动安全水平提高。\u003c/strong\u003e\u0026nbsp;威胁行为者想方设法隐藏身份来源。这从内容创作一开始就发生：要求模型移除自动生成文本的痕迹、写得更“自然”，设计账号养号和规避逻辑，并在交付前删除元数据和代号。他们还通过 VPN、外国电话号码、轮换账号和隐藏 IP 的第三方服务“洗白”自己对 Claude 的访问。\u003c/span\u003e","payload":{"lines":"68,69","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e7.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e虚假人设，以及冒充真实人设。\u003c/strong\u003e\u0026nbsp;行为者用 AI 生成头像、虚构记者履历、制作政治发言人，形成完整虚假人设。我们还发现冒充真实个人和真实机构的案例，包括国家发言人和人权组织，以及伪造政府文件。\u003c/span\u003e","payload":{"lines":"69,70","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e8.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e直接针对个人与问责机制。\u003c/strong\u003e\u0026nbsp;我们观察到：克隆一名真实活动人士账号，与其在伊朗境内的联系人进行实时对话；为其他伊朗人建立带逮捕历史的档案；代写在联合国人权理事会现场宣读的证词；以及为联合国特别报告员制作反制档案。\u003c/span\u003e","payload":{"lines":"70,71","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e9.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e影响力行动经常无法真正触达真实受众。\u003c/strong\u003e\u0026nbsp;因为我们处于行动的内容生产上游，在内容进入社交平台等分发渠道前就可能发现并阻断。我们识别的大多数内容只获得很少甚至没有真实互动；多个案例在形成受众前就被阻断。真实触达最广的情况，往往是国家媒体本身承担分发机制，包括 FM 广播、卫星与短波广播以及全球电视网络。\u003c/span\u003e","payload":{"lines":"71,72","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e影响力行动趋势\u003c/span\u003e","payload":{"fold":1,"lines":"62,63","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动完全由外国力量运营，却被精心设计成看似源自班吉本地。讲俄语的行为者负责指挥产出，而合同、脚本和帖子则把它包装成中非共和国广播电台自身的工作。\u003c/span\u003e","payload":{"lines":"74,75","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e该网络使用 Claude 自动化人力资源与内部管理。行为者要求模型生成合同，其中强制员工忠于中非共和国总统以及“俄罗斯及其派驻力量”；还用模型撰写职位说明、评分标准和“三次违规即解雇”流程。之后，他们按这些标准给员工文章打分，并让 Claude 建议哪些员工应保留、哪些应解雇。当 Claude 指出评分中的政治倾向后，行为者只是把相关维度改成中性名称，继续沿用评分。\u003c/span\u003e","payload":{"lines":"75,76","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者还开展三类旨在实现政治控制和影响的活动：组织周期性监控行动，追踪并更新中非共和国反对派政治人物数据；为 Russian House 的发言人起草战略论点和声明——Russian House 是俄罗斯在海外用于软实力与政治活动的文化和信息中心；以及基于原始设计文件伪造中非共和国政府文件，包括宪兵和国防部通信材料。\u003c/span\u003e","payload":{"lines":"76,77","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eClaude 拒绝执行该行动最激进的一项要求：把真实个人点名为武装分子，以诱导安全机构对其采取行动。行为者随后改用“匿名消息源”的叙事方式。\u003c/span\u003e","payload":{"lines":"77,78","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"73,74","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e攻击生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:b81cb9a2c85e353e061d6e658ea3728eb68ed2ee2a0c7491ce627c0f1e97af47\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"78,79","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e组织节点\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:8a3d009e567bcfce646dc28251378290cf067d9e117d1b3c1375d55b193d0835\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"79,80","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:5a4c4013d546306d2a7953b54ab1642738f28dd3928f3ef3e1c8366d76a844a9\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"80,81","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-04001：阻断中非共和国境内的俄罗斯对外信息操纵与干预行动\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:8c4ba1a2fadc14bd3e6ee30e727c5de706a0228724e40638672bb6e650458647\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"72,73","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者主要用 Claude 做两件事：为虚假新闻站点撰写完全原创的文章，以及改写合法记者发布的真实文章。自动化系统会把真实新闻改写成带政治倾向的版本，并针对不同国家受众和所需政治角度做适配。\u003c/span\u003e","payload":{"lines":"83,84","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动特别针对政治竞争高度激烈的民主环境，包括美国、巴西、法国和刚果民主共和国（DRC）。由于这些国家政治环境非常不同，目标选择并不支持“单一政治议程”的解释。\u003c/span\u003e","payload":{"lines":"84,85","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e调查发现若干信号，表明部分活动可能反映一名或多名在当前 DRC—卢旺达冲突中有利益关系的客户诉求。我们无法独立确认究竟是哪些客户委托了这些内容，也没有发现任何政府直接指挥的证据。\u003c/span\u003e","payload":{"lines":"85,86","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"82,83","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e攻击生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:94069c1be55a0daf5ba9b30556a238eb1762df48eb777d1640ce5ecd8a92f863\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"86,87","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e聚焦 DRC 的活动\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:ff7d37972297d17ff5e924e8a52be9a134cc13ef85e128cf2621bf0d268ce22b\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"87,88","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:cace4f567238ba14694f81033c75945f84d2770cc8760fee907d47f4e50ae5a5\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"88,89","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e虚假媒体样本\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:1a746fddd6cfd7012517bc3f8b772e261a4485c4cc13290b47fbd6d25959778d\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"89,90","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-54002：阻断横跨六大洲的商业“影响力即服务”行动\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:1597b6f282dd9d56cf369f026062ad71a2f4a2b2da070a8b9aed6fe0903e5ad8\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"81,82","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动使用真实人口普查、选举数据以及数百万条选民记录，针对马来西亚最敏感的政治社会裂缝：覆盖全部 222 个国会选区的族群、宗教和王室议题。\u003c/span\u003e","payload":{"lines":"92,93","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e平台管理超过 1,000 个虚假 X/Twitter 账号。每个账号都包含“养号”逻辑，在投入影响力行动前先运行一段时间模拟真实账号，包括定期更新 Cookie 与 IP 地址。Dashboard 里还有一个参数，让用户设定每个目标最多应获得多少人工浏览量。我们观察到一个支持马来西亚现任总理的请求，要求为其账号制造 100 万次人工浏览。\u003c/span\u003e","payload":{"lines":"93,94","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者针对具名个人生成指控，而模型自己的研究找不到任何可佐证信息。\u003c/span\u003e","payload":{"lines":"94,95","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eClaude 多次拒绝执行行动要求，例如识别到某份文件属于政治诽谤材料后拒绝继续；行为者随后会与模型“协商”更中性的措辞，以继续构建相同能力。\u003c/span\u003e","payload":{"lines":"95,96","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者曾寻求与马来西亚国家通信监管机构签订合同。我们没有发现该尝试成功的证据。\u003c/span\u003e","payload":{"lines":"96,97","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"91,92","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e攻击生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:df63d8c7459277dc705668abb1f532661e66a3b0face9e2cf9019b77c8788b30\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"97,98","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:6af86c4db7908fec7af26cec941dd61eb75330f58e4c304a31ac3b0548382158\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"98,99","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-84005：阻断针对马来西亚的商业选举操纵平台\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:397aea5f693297d93a1503b7dbbff95171beea07937022a5f101bfd844df38bb\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"90,91","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:573d3e56f7136d102156a46b25cca617de5e35c01bc1ff205f90f52725081cef\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"100,101","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:772ddd605200696bbc054d496649048a6897d6ceca3a85f5bfe308736af6ebb5\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"101,102","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-24015：阻断基于 Claude 构建的俄罗斯国家媒体编辑流水线\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:4253d983fb4522b6d8af41a5d105f815421742cbc37f6ec1b428ff1a872d0a00\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"99,100","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e三场行动的行为者都明确把活动与伊朗国家层面的“\u003cem style=\"font-style: italic;\"\u003eJihad al-Tabyin\u003c/em\u003e（解释性圣战）”原则联系起来。按照这一概念，伊朗机构把生产宣传既视为宗教义务，也视为战略职责。与该国家理论相关的措辞直接出现在行为者会话和内部规划文件中。\u003c/span\u003e","payload":{"lines":"104,105","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e该网络制作了带有 ICCO 官方品牌的部级交付物，其中包括一个九部分组成的国际影响力项目组合，以及关于伊朗最高领袖葬礼的完整组织计划。\u003c/span\u003e","payload":{"lines":"105,106","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e公开资料印证了 Mashhad 指挥室战略设计者与指挥官的身份和职务。这些负责人运作名为“Manjanegh（Catapult）”的跨省内容工厂，使用数十名活动人员，把伊朗安全机构公开报告重新包装为特定人格发布的内容，并隐藏与伊朗安全机构的关联。该网络还通过 100 多个伊朗平台频道开展付费放大，其中包括与 IRGC 有关的频道。\u003c/span\u003e","payload":{"lines":"106,107","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e我们把行动与伊朗 Bina Cultural Observatory 一名主任级官员联系起来，并通过公开来源与账号遥测验证了这一关联。行为者在多个会话线程中以一名 IRGC 发言人的官方口吻生成内容。在围绕 2026 年美以伊战争的一场具体活动中，该网络把虚假说法归因给西方研究机构，包括 CSIS、Brookings 和 RAND。这两类手法都用于让国家支持的信息看起来更可信。\u003c/span\u003e","payload":{"lines":"107,108","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e该网络还部署了具有攻击性的反叙事内容，针对遭受迫害的宗教少数群体巴哈伊教徒，并建立了包含国际官员和伊朗反对派人物姓名的目标数据库。\u003c/span\u003e","payload":{"lines":"108,109","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"103,104","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:ec2548cdfd05c1a00bf1cd5907421e4b1b92c16d630538b4d37302689d86aa17\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"109,110","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:99b4af517e7619dcc23dccf8d755e660f8fa3ec2447a57e1f6332c509866dbbe\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"110,111","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-34001：阻断伊朗国家关联影响力行动——ICCO、伊斯兰宣传办公室与 Bina Observatory\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:c335e859006b518499825422546d7bdc8ff35e67d900694aedaaab57c2cc6cdc\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"102,103","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者在内部把输出明确称为“假新闻”，要求内容“火爆、有攻击性”，并且要简单到“连村里人都能看懂”。其明确假设是，目标受众会把这些内容当成真实新闻。\u003c/span\u003e","payload":{"lines":"113,114","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e内容一贯支持 Awami League，并针对\u0026nbsp;\u003ca href=\"https://en.wikipedia.org/wiki/Bangladesh_Nationalist_Party\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBangladesh Nationalist Party\u003c/a\u003e（BNP）、Jamaat-e-Islami、National Citizens Committee、临时政府和学生抗议领袖。网络使用捏造的抹黑活动，指控这些对手是外国代理人、试图推动塔利班式治理。\u003c/span\u003e","payload":{"lines":"114,115","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者还创建了独立上传脚本，通过 YouTube API 批量发布视频。脚本会借助第三方持续集成服务，按照提前一个月设置的计划发布内容。\u003c/span\u003e","payload":{"lines":"115,116","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e该网络生成的一些叙事也与亲印度地缘政治利益一致，但我们没有发现任何国家指导或资助的证据。\u003c/span\u003e","payload":{"lines":"116,117","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"112,113","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:f36ef43f20ae1db92d6f94d452969c4941de6f7ccb619f0b934c0f00049fb0e5\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"117,118","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:9f01e10f6722d4e1e9367d130b9891b21c9f97e9705bf415b164123032dd7f61\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"118,119","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-54006：阻断面向孟加拉国农村地区、支持 Awami League 的自动化假新闻行动\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:d6a19b83905b36d843ebee448918395de512077051b519b759bebad3aadec47e\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"111,112","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动成功抓取了 500 多个社交媒体频道，为伊朗境内个人建立详细画像，再按城市、年龄、职业、政治立场以及逮捕经历对目标分组，以便针对不同受众调整信息。\u003c/span\u003e","payload":{"lines":"121,122","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e网络分析了这些对话中约 51,944 条归档消息，为伊朗境内数十名具名个人建立详细心理画像。为了进一步传播信息，冒充账号还同时向 30 多名联系人发送一条捏造的突发新闻标题。\u003c/span\u003e","payload":{"lines":"122,123","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e为宣传 NCRI 主席 Maryam Rajavi 的十点计划，该网络为每篇文章创建 AI 生成头像，再为头像制作动画、加入波斯语音频，并把它们设计成普通伊朗人的样子，同时有意隐藏其 AI 生成属性。\u003c/span\u003e","payload":{"lines":"123,124","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者使用自动化流水线运作多个 Instagram 账号网络并协调发布时间，同时针对不同目标受众调整内容。为隐藏真实动机，最初的帖子刻意不提 Mojahedin，使该组织的宣传看起来像没有关联的中立新闻。\u003c/span\u003e","payload":{"lines":"124,125","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动的信息重点针对伊朗政府、君主主义团体和 Pahlavi 阵营。行为者传播了一段攻击 Pahlavi 家族成员的伪造视频，并使用“Neither Shah Nor Sheikh”框架攻击目标，意在强化 MEK 在伊朗反对派中的位置。\u003c/span\u003e","payload":{"lines":"125,126","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"120,121","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:05521f9094888ececa2355bda02989c2395e8284381359a902a66b51383b10e9\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"126,127","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:d5f889714f40bce5115576c905e74ef40a4881c4c3beb288bb0e2900a3b0228f\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"127,128","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-84006：阻断与 MEK/NCRI 一致的分布式影响力行动——共享 AI Agent 冒充真人并在伊朗境内招募\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:2694bd87e3ed7a92dae3f482c48ea6aa592241feb37afb868f3b38cb95e20fa8\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"119,120","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动采用同一套手册，同时放大亲政府和反对派负面叙事。以这种方式既强化现政府、又削弱反对派的政治可行性，符合单一协调式选举传播行动的特征。\u003c/span\u003e","payload":{"lines":"130,131","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e这里使用的模板也被逐字用于零售品牌营销，包括把一段促销广播重新包装成看似自然的推文，并每隔五条插入一个链接。这符合肯尼亚常见的一种模式：营销机构付费给本地影响者以\u003ca href=\"https://www.wired.com/story/opinion-in-kenya-influencers-are-hired-to-spread-disinformation/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e操纵叙事\u003c/a\u003e。\u003c/span\u003e","payload":{"lines":"131,132","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动频繁使用 Claude 对 50 条预先拟好的主题和推文批量进行“人性化”和润色，表明模型对该网络的主要价值是提高数量并制造真实感；核心意识形态信息在 Claude 介入前已经由行为者完全决定。\u003c/span\u003e","payload":{"lines":"132,133","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"129,130","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note- :"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"162,163","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:f344df0666b8cb45d3ee25f436d77f7fd829115df0a3399c4687ba5e39a1c912\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"166,167","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:cb00db931b42deca0af278c2df85bc08d85bf09edfe32fd520f4251cad54f966\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"167,168","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-14020：阻断中国境内针对天主教、藏传佛教、法轮功及台湾基督教社群的宗教事务情报行动\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:8371fc5942b3449d3bc9f3ca77bd3daeb3854b7b1b75ecc85a6a1c8542e0f6a4\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"161,162","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e三个与中国市级安全体系一致的账号使用 Claude 开展“维稳”和跨国压制。相关工作似乎分别由一名个人分析员、一名警务学术人员，以及一个具体市级机构执行。\u003c/span\u003e","payload":{"lines":"170,171","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e一个市级网警单位使用 Claude Code 配合自定义 Skills，运行舆情监控流水线、查询政府监控数据库，并生成关于政治敏感事件的每日报告，其中包括跟踪一个知名海外异议账号。\u003c/span\u003e","payload":{"lines":"171,172","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eClaude 曾拒绝一次摄取并生成每周“维稳”报告的请求，但行为者随后通过重新提示，让模型输出了具有实际执行性的压制建议，并点名 10 名普通公民作为“管控”对象，涉及拦截上访、“谈话”式审讯（国家体系中指强制传唤），以及严密监控其行动和通信。\u003c/span\u003e","payload":{"lines":"172,173","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e一个地方国家安全局运行每日流水线，按照政府模板生成“态势感知”简报，并把整套工作流整理为 AI 使用手册，其中包含让 Claude 扮演服务国家的情报分析员的提示词。\u003c/span\u003e","payload":{"lines":"173,174","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e市级机构对具体海外活动人士和组织建立画像，并索取海外活动的行动前场地信息，包括温哥华一场民主游行的集合点、路线和终点，土耳其的维吾尔文化活动地点，以及 Oslo Freedom Forum 的放映场所。\u003c/span\u003e","payload":{"lines":"174,175","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e自动化流水线在生成每份报告前，会抓取一份既有公民社会媒体清单。报告将维吾尔倡议活动描述成与恐怖主义相邻，并把大型人权组织称为“敌对势力”，与中国国家安全体系用语一致。\u003c/span\u003e","payload":{"lines":"175,176","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"169,170","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:1cb803525b25ac0bb18ca1a0d4c4ae0fb7b22dc29d85bf7898b518fca897e02f\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"176,177","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e阻断与缓解\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:78f1eed9d98afd8fec134f3e49031086e9c073512c69ce2d7b1796fe684597da\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"177,178","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eGTG-14021：阻断中国境内“维稳”监控与跨国压制行动\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:f9abedd8fa2dae32e2451502d037faecb82e09c1f6d4e439582c00f3f19f6d5d\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"168,169","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者为政府官员制作情报简报，把对国内外异议活动的内部监控，与将外国报道重新框定为“敌对叙事”的外部传播工作结合起来。\u003c/span\u003e","payload":{"lines":"180,181","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者使用 Claude 监控并分类具体异议人士、活动人士、少数族裔与侨民社群、宗教组织、台湾政治人物、劳工和学生行动者，以及知名国际人权和民主组织。\u003c/span\u003e","payload":{"lines":"181,182","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者使用 Claude 制作带版本控制的行动手册和一套文档系统，使每日摄取 15 至 30 多篇文章的报告流水线可以自动运行；这一量级更像官僚体系中的例行工作，而不是临时任务。\u003c/span\u003e","payload":{"lines":"182,183","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行为者使用 Claude 的代码执行环境，以很少人工干预运行自动文档生成流水线。\u003c/span\u003e","payload":{"lines":"183,184","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; tex 03e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"242,243","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e案例 4 与 5：毒液与毒素\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:8df36fb84d2601aea04221fd51cb6f5b4d8c840a6fc85216f917cdd319f76db3\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"243,244","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e结论\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:9053cb0b814626965b0b58a45c47ec66448152c48b68795716b52bc70b179a34\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"244,245","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003eAI 与真人约为 3:1。\u003c/strong\u003e\u0026nbsp;运营方招募真人零工，把其资料与 Claude 驱动的人格混进同一滑动匹配流，比例大约三个 AI 人格对应一个真人。真人负责 Claude 无法完成的互动，例如视频通话和社交媒体互关，以让用户相信应用真实可信。\u003c/span\u003e","payload":{"lines":"247,248","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003e不同 AI 提供商承担不同角色。\u003c/strong\u003e\u0026nbsp;在两周窗口内，Claude 负责自主对话人格，产生约 236 万条消息。另一个较小的非 Anthropic 模型为真人零工生成可直接点击发送的短回复建议，并承担人脸吸引力评分、照片/语音审核；图像编辑模型则生成头像。我们已经把相关细节直接分享给对应提供商。\u003c/span\u003e","payload":{"lines":"248,249","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003e系统提示在抽样交互中几乎总能诱导模型持续保持人格。\u003c/strong\u003e\u0026nbsp;其系统提示看起来像普通角色扮演或陪伴类部署，从任何单次交互内部都看不到变现和欺骗机制。在少量抽样案例里，模型自身推理曾识别到伤害风险，例如用户透露严重疾病或急性心理困扰，但模型仍未拒绝完成任务，而是继续以角色人格输出。\u003c/span\u003e","payload":{"lines":"249,250","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003e应用被专门设计用于规避 App Store 和 Play Store 审核。\u003c/strong\u003e\u0026nbsp;开发文档显示，其中有一个 UI 控制器只在商店审核时激活，其他时候保持关闭。20 多个应用变体之间刻意使用不同类名，以绕过平台用于发现相似应用的检测机制。应用内浏览器会把支付重定向到第三方处理商，并可在服务器端配置，因此审核时可以隐藏。\u003c/span\u003e","payload":{"lines":"250,251","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键发现\u003c/span\u003e","payload":{"fold":1,"lines":"246,247","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e行动生命周期与 AI 使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:39b6593e01c78e7d94d92d157ea45c5bdf5cdaa2e74a3ddbcfd7ff2c1de21bd3\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"251,252","tag":"h4"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003e域名。\u003c/strong\u003e\u0026nbsp;heyhru[.]com、archat[.]us（应用营销站）和 file[.]archat[.]us（内容分发与 API 基础设施），以及 sitin[.]ai（零工 Web 应用）。\u003c/span\u003e","payload":{"lines":"253,254","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 70
