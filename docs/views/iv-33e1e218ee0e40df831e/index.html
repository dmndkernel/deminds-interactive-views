rawMarkdown":"我们通过内部检测识别这些账号，封禁了与四场行动有关的账号，并与产业和研究伙伴共享指标。\n\n| **类别** | **指标** | **类型 / 备注** |\n| --- | --- | --- |\n| 国家媒体 | Sputnik Moldova; RIA Novosti; Sputnik en Español; Sputnik Africa (@sputnik_africa); RT English (Russia Today, ANO TV-Novosti) |  |\n| 欺骗性放大资产 | @ATodaPotencia (Telegram) | 把与克里姆林宫一致的内容包装成自然的拉丁美洲本地分析 |\n| 摩尔多瓦放大生态 | eadaily[.]com（受欧盟制裁）；point[.]md; vz[.]ru; mos[.]news; ru[.]euronews[.]com | 域名 |\n| 来源洗白生态（俄罗斯军事宣传 Telegram） | Rybar (@rybar_america); Colonel Cassad (@boris_rozhin); @theaterVD; @china3army; @kalashnikovnews | Telegram 频道 |\n\n表 6. 四场俄罗斯国家媒体行动中的指标：分发媒体、欺骗性放大资产，以及用于洗白来源的 Telegram 生态。","sourceFormat":"markdown"},"note:sha256:780c7c5bdca1cffdc93e279f09e4903f5c2625263da3390388f542fc4fe23055":{"html":"\u003cp\u003e图 1. GNC 小组的系统工程 V 模型，映射了从需求分解到集成与测试的工作。我们对整个研发项目的可见性有限；图中反映的是我们对行为者使用 Claude 开发 GNC 软件方式的评估。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e集群\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eClaude 的用途\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e最严重要素\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e战术制导火箭\u003c/td\u003e\n\u003ctd\u003e飞控固件、末段制导、测试后遥测诊断\u003c/td\u003e\n\u003ctd\u003e在也门进行真实野外试射，并在数小时内把结果带回 Claude 分析失败原因\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e弹道导弹仿真\u003c/td\u003e\n\u003ctd\u003e多级、六自由度轨迹仿真\u003c/td\u003e\n\u003ctd\u003e中程、中远程以及高超声速滑翔版本\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e优化\u003c/td\u003e\n\u003ctd\u003e使用强化学习调优飞控\u003c/td\u003e\n\u003ctd\u003e加快制导算法开发\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e建模与仿真\u003c/td\u003e\n\u003ctd\u003e根据参考实现校准仿真\u003c/td\u003e\n\u003ctd\u003e构建武器系统数字模型，降低对物理测试的依赖\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e打包\u003c/td\u003e\n\u003ctd\u003e把仿真工具包编译为独立可执行文件\u003c/td\u003e\n\u003ctd\u003e可脱离 Claude 持续运行的交付物\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 1. 该行动各工作流范围，以及 Claude 在其中的具体用途。\u003c/p\u003e\n","kind":"html","rawMarkdown":"图 1. GNC 小组的系统工程 V 模型，映射了从需求分解到集成与测试的工作。我们对整个研发项目的可见性有限；图中反映的是我们对行为者使用 Claude 开发 GNC 软件方式的评估。\n\n| **集群** | **Claude 的用途** | **最严重要素** |\n| --- | --- | --- |\n| 战术制导火箭 | 飞控固件、末段制导、测试后遥测诊断 | 在也门进行真实野外试射，并在数小时内把结果带回 Claude 分析失败原因 |\n| 弹道导弹仿真 | 多级、六自由度轨迹仿真 | 中程、中远程以及高超声速滑翔版本 |\n| 优化 | 使用强化学习调优飞控 | 加快制导算法开发 |\n| 建模与仿真 | 根据参考实现校准仿真 | 构建武器系统数字模型，降低对物理测试的依赖 |\n| 打包 | 把仿真工具包编译为独立可执行文件 | 可脱离 Claude 持续运行的交付物 |\n\n表 1. 该行动各工作流范围，以及 Claude 在其中的具体用途。","sourceFormat":"markdown"},"note:sha256:78edf9eb66d83c56b07291ff5cbaa53453685f92f3fc004e9a624f12ba02d321":{"html":"\u003cp\u003e我们封禁了归属于该行动的账号和组织，包括整批一次性组织以及运营方员工直接持有的账号。由于绝大多数账号都与来自中国的代理网络有关，这些账号也经常通过更广泛的账号滥用检测和执法动作被处理。\u003c/p\u003e\n\u003cp\u003e我们还把相关发现共享给其他 AI 实验室，其模型承担了行动中的非对话角色。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们封禁了归属于该行动的账号和组织，包括整批一次性组织以及运营方员工直接持有的账号。由于绝大多数账号都与来自中国的代理网络有关，这些账号也经常通过更广泛的账号滥用检测和执法动作被处理。\n\n我们还把相关发现共享给其他 AI 实验室，其模型承担了行动中的非对话角色。\n\n[返回顶部](#main)","sourceFormat":"markdown"},"note:sha256:78f1eed9d98afd8fec134f3e49031086e9c073512c69ce2d7b1796fe684597da":{"html":"\u003cp\u003e我们封禁了与这些行动有关的账号，并正在映射其更广泛活动痕迹，其中包括两个案例共享的商业 VPN 出口节点。我们正在跟踪相关行为者的数字特征，以防止未来滥用。\u003c/p\u003e\n\u003cp\u003e现有防护在这些案例中的表现并不一致：一个案例中，Claude 正确拒绝了请求，但在进一步提示后被绕过；另一个案例中，模型在大量会话中持续配合而没有触发干预。我们正把这些发现用于开发新的安全措施和模型训练。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e行为者画像\u003c/td\u003e\n\u003ctd\u003e在中国境内运行、与中国公安和国家安全机关一致的行为者（不论出口节点如何，设备时区为 UTC+8；使用 v2ray 和商业 VPN），分为三个层级：个人网警、警校学生，以及包含多名个人操作者的机构。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e机构归属（置信度不同）\u003c/td\u003e\n\u003ctd\u003e一名同时为警校研究生的市级公安侦查人员（中等置信度）；国家安全局很可能位于浙江（中等置信度）。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e维稳特征\u003c/td\u003e\n\u003ctd\u003e政府文档模板（“态势感知”简报）；维稳语汇；敏感度层级分类；内部 AI 使用手册，其中固化了供机构内分发的具体提示公式。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAgent 化 TTP\u003c/td\u003e\n\u003ctd\u003eClaude Code + 自定义监控 Skills；查询政府监控数据库；通过企业消息和静态网页分发报告。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e提及的内部平台\u003c/td\u003e\n\u003ctd\u003e国内舆情监控与预警系统；具名内部监控工具。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e跨国压制目标\u003c/td\u003e\n\u003ctd\u003e香港民主派人士；六四纪念活动组织者；维吾尔倡议组织；知名国际人权组织。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 8. 三个“维稳”案例中的指标：行为者画像、机构归属、行动特征与跨国压制目标。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们封禁了与这些行动有关的账号，并正在映射其更广泛活动痕迹，其中包括两个案例共享的商业 VPN 出口节点。我们正在跟踪相关行为者的数字特征，以防止未来滥用。\n\n现有防护在这些案例中的表现并不一致：一个案例中，Claude 正确拒绝了请求，但在进一步提示后被绕过；另一个案例中，模型在大量会话中持续配合而没有触发干预。我们正把这些发现用于开发新的安全措施和模型训练。\n\n| **类别** | **指标** |\n| --- | --- |\n| 行为者画像 | 在中国境内运行、与中国公安和国家安全机关一致的行为者（不论出口节点如何，设备时区为 UTC+8；使用 v2ray 和商业 VPN），分为三个层级：个人网警、警校学生，以及包含多名个人操作者的机构。 |\n| 机构归属（置信度不同） | 一名同时为警校研究生的市级公安侦查人员（中等置信度）；国家安全局很可能位于浙江（中等置信度）。 |\n| 维稳特征 | 政府文档模板（“态势感知”简报）；维稳语汇；敏感度层级分类；内部 AI 使用手册，其中固化了供机构内分发的具体提示公式。 |\n| Agent 化 TTP | Claude Code + 自定义监控 Skills；查询政府监控数据库；通过企业消息和静态网页分发报告。 |\n| 提及的内部平台 | 国内舆情监控与预警系统；具名内部监控工具。 |\n| 跨国压制目标 | 香港民主派人士；六四纪念活动组织者；维吾尔倡议组织；知名国际人权组织。 |\n\n表 8. 三个“维稳”案例中的指标：行为者画像、机构归属、行动特征与跨国压制目标。","sourceFormat":"markdown"},"note:sha256:7cfbfa46d2dd0d449e189e434bc8845e8032ed7b0db7f64d67ee0748a0eb762b":{"html":"\u003cp\u003e尽管上述案例彼此没有关联，但有两个广泛发展趋势与所有案例都有关。\u003c/p\u003e\n","kind":"html","rawMarkdown":"尽管上述案例彼此没有关联，但有两个广泛发展趋势与所有案例都有关。","sourceFormat":"markdown"},"note:sha256:7da158fcf5ccc82ad749d9742cd077d88c8a5476055369e65cfb04d0215b2025":{"html":"\u003cp\u003e这些活动违反了我们的 Usage Policy：其中既包括禁止监控——例如对活动人士、记者和政治异议人士进行画像、评分和建立档案——也包括禁止协调式虚假行为。我们封禁了相关账号，并正在实施缓解措施以应对未来滥用。我们也向跟踪“监控即服务”行为者的合作伙伴共享了指标，以便在 Anthropic 平台之外共同阻断该行动。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这些活动违反了我们的 Usage Policy：其中既包括禁止监控——例如对活动人士、记者和政治异议人士进行画像、评分和建立档案——也包括禁止协调式虚假行为。我们封禁了相关账号，并正在实施缓解措施以应对未来滥用。我们也向跟踪“监控即服务”行为者的合作伙伴共享了指标，以便在 Anthropic 平台之外共同阻断该行动。","sourceFormat":"markdown"},"note:sha256:7ece290ce678260c46002b8edcd1be26f52bf64462772720f03ac68824255c57":{"html":"\u003cp\u003e此外，同一账号还为伊朗国家系统开展企业软件开发，包括使用 Claude 设计一个国内大规模监控平台的软件组件，将自动车牌识别与移动设备标识符拦截结合起来。操作者还针对一个 244 人私人 Telegram 群组的当天导出数据构建分析工具，包括对成员关系进行社交网络分析。\u003c/p\u003e\n","kind":"html","rawMarkdown":"此外，同一账号还为伊朗国家系统开展企业软件开发，包括使用 Claude 设计一个国内大规模监控平台的软件组件，将自动车牌识别与移动设备标识符拦截结合起来。操作者还针对一个 244 人私人 Telegram 群组的当天导出数据构建分析工具，包括对成员关系进行社交网络分析。","sourceFormat":"markdown"},"note:sha256:819450df5fecc331887bccf9cc2950593078596777e6cb3011843f4b8465e94d":{"html":"\u003cp\u003e我们识别出一名伊朗关联威胁行为者，其使用 Claude 构建自动化开源情报身份画像 Harness，目标是以色列政府及非政府人员和犹太侨民组织。此外，该行为者还利用 Claude 提高恶意软件的隐蔽性，使其更难被识别为恶意软件。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别出一名伊朗关联威胁行为者，其使用 Claude 构建自动化开源情报身份画像 Harness，目标是以色列政府及非政府人员和犹太侨民组织。此外，该行为者还利用 Claude 提高恶意软件的隐蔽性，使其更难被识别为恶意软件。","sourceFormat":"markdown"},"note:sha256:8371fc5942b3449d3bc9f3ca77bd3daeb3854b7b1b75ecc85a6a1c8542e0f6a4":{"html":"\u003cp\u003e我们封禁了一组账号，并认为其与一场位于中国境内、与中国政府有关联的情报行动有关。行为者把 Claude 当成一整支分析团队的替代品，为亚洲各地宗教领袖和中国侨民人物建立中文档案。其目标选择与中国宗教事务和统一战线体系的重点高度吻合——即负责宗教事务，并对被认为威胁宗教统一的群体进行吸纳或施压的党国机构。用户活动表明这些行为者位于中国；一个案例中，用户还自称是中国国家系统的信息安全人员。\u003c/p\u003e\n\u003cp\u003e行为者要求 Claude 生成看起来供国家安全内部办公室使用的分析文档，包括“人物调研底稿”、调查性“线索报”和每日“态势感知”摘要。每份材料都会记录特定目标的涉华活动、丑闻，以及“抓手（zhuāshǒu）”——这是统一战线工作语境中指代可利用杠杆的术语。\u003c/p\u003e\n\u003cp\u003e目标包括亚洲多地的高级天主教枢机、台湾基督长老教会领导层、藏传佛教公民社会及流亡行政机构成员，以及法轮功和其关联媒体。目标既有公开露面的高级宗教领袖，也有普通私人公民。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们封禁了一组账号，并认为其与一场位于中国境内、与中国政府有关联的情报行动有关。行为者把 Claude 当成一整支分析团队的替代品，为亚洲各地宗教领袖和中国侨民人物建立中文档案。其目标选择与中国宗教事务和统一战线体系的重点高度吻合——即负责宗教事务，并对被认为威胁宗教统一的群体进行吸纳或施压的党国机构。用户活动表明这些行为者位于中国；一个案例中，用户还自称是中国国家系统的信息安全人员。\n\n行为者要求 Claude 生成看起来供国家安全内部办公室使用的分析文档，包括“人物调研底稿”、调查性“线索报”和每日“态势感知”摘要。每份材料都会记录特定目标的涉华活动、丑闻，以及“抓手（zhuāshǒu）”——这是统一战线工作语境中指代可利用杠杆的术语。\n\n目标包括亚洲多地的高级天主教枢机、台湾基督长老教会领导层、藏传佛教公民社会及流亡行政机构成员，以及法轮功和其关联媒体。目标既有公开露面的高级宗教领袖，也有普通私人公民。","sourceFormat":"markdown"},"note:sha256:837ea8b0ef79f8f9423f8d9ce1402b181104526ddf6d8817969ee960dbeb795f":{"html":"\u003cp\u003e生物领域滥用是前沿 AI 模型\u003ca href=\"https://darioamodei.com/essay/the-adolescence-of-technology\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e最严重的风险\u003c/a\u003e之一。长期以来，人们一直担心 AI 模型有一天会强到足以帮助把现有病原体变得更危险，甚至创造全新的病原体。如果缺乏正确的安全措施，这类能力可能造成灾难性后果。\u003c/p\u003e\n\u003cp\u003e对较早模型的评估结果——例如 2025 年的 Claude Opus 4 和 Claude Sonnet 4.5——清楚表明，它们远低于能够实质帮助高水平用户开展危险生物研究的能力阈值。因此，当时模型的防护相对宽松，主要阻止可能帮助新手复现已知生物武器的内容。但对于今天的模型——已经能够协助多种复杂科学研究任务——证据已经不再确定，我们无法做出同样保证。因此，出于高度谨慎，我们为近期模型（尤其是 Claude Fable 5）部署了更强防护，限制访问更广泛的军民两用生物研究问题。\u003c/p\u003e\n\u003cp\u003e评估可以提供能力证据，但无法具体证明这些能力在现实世界中一定会被用于开发生物武器。\u003c/p\u003e\n\u003cp\u003e迄今，关于 AI 模型在现实中可能被滥用的证据，主要来自\u003ca href=\"https://casp.ac/reports/ai-enabled-terrorism\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e学术研究\u003c/a\u003e、\u003ca href=\"https://www.state.gov/wp-content/uploads/2025/04/2025-Arms-Control-Treaty-Compliance-Report-1.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e政府报告\u003c/a\u003e、\u003ca href=\"https://www.europol.europa.eu/publications-events/main-reports/tesat-report\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e国际组织\u003c/a\u003e以及\u003ca href=\"https://www.bellingcat.com/news/uk-and-europe/2020/10/23/russias-clandestine-chemical-weapons-programme-and-the-grus-unit-21955/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e记者\u003c/a\u003e的工作。但可能直接卷入这些活动的 AI 公司，迄今基本缺席公开讨论。据我们所知，还没有任何私人公司——无论 AI 公司还是其他公司——公开分享过其平台可能被用于生物武器开发的证据。\u003c/p\u003e\n\u003cp\u003e这里，我们披露五个使用我们模型、其用途可能支持生物武器开发的案例。这些案例旨在展示模型实际被用于哪些任务，以及判断某种生物学用途是否危险时经常面临的困难；也说明 AI 公司会获得一些原本不会公开的关于生物滥用风险的观察。第一个案例中，一个转售平台绕过地区封锁，为参与国家资助项目、开展 chikungunya 功能获得研究的病毒学家提供服务，并把被模型拒绝的提示转发给安全限制更宽松的模型。第二个案例中，一名不受支持地区的研究人员连续数周用 Claude 规划高致病性禽流感的哺乳动物适应实验，但分类器把工作限制在我们能力最弱的模型上。第三个案例中，一个面向十余名客户的转售中继，让 Opus 5 在约一小时内起草了一份完整的正痘病毒免疫逃逸项目申请。第四个案例中，一名国家支持的研究人员建立毒液肽图谱，并搭建针对麻痹性和镇痛性靶点的分子生成优化流水线。第五个案例中，一名研究人员为国家项目计算重设计毒素，并要求 Claude 在进度报告中刻意模糊这些制剂的真实身份。\u003c/p\u003e\n\u003cp\u003e下述案例中的行为者绕过我们阻止不受支持地区用户访问模型的控制，还采取其他措施掩盖研究目的，以规避防护。发现并调查后，我们封禁账号，并把调查发现纳入前沿模型安全、执法和威胁情报流程，以便未来更好地预防、检测和阻断这些活动。我们不会披露涉事研究机构、活动所在国家，以及具体生物因子或研究技术的名称。案例中的个人都是在职科研人员；我们并不声称他们有伤害意图，公开其个人或实验室身份反而可能给他们带来风险。\u003c/p\u003e\n\u003cp\u003e我们希望，通过分享这些案例，可以推动 AI 行业与政府讨论正在出现的生物风险，以及如何更有效地应对。\u003c/p\u003e\n","kind":"html","rawMarkdown":"生物领域滥用是前沿 AI 模型[最严重的风险](https://darioamodei.com/essay/the-adolescence-of-technology)之一。长期以来，人们一直担心 AI 模型有一天会强到足以帮助把现有病原体变得更危险，甚至创造全新的病原体。如果缺乏正确的安全措施，这类能力可能造成灾难性后果。\n\n对较早模型的评估结果——例如 2025 年的 Claude Opus 4 和 Claude Sonnet 4.5——清楚表明，它们远低于能够实质帮助高水平用户开展危险生物研究的能力阈值。因此，当时模型的防护相对宽松，主要阻止可能帮助新手复现已知生物武器的内容。但对于今天的模型——已经能够协助多种复杂科学研究任务——证据已经不再确定，我们无法做出同样保证。因此，出于高度谨慎，我们为近期模型（尤其是 Claude Fable 5）部署了更强防护，限制访问更广泛的军民两用生物研究问题。\n\n评估可以提供能力证据，但无法具体证明这些能力在现实世界中一定会被用于开发生物武器。\n\n迄今，关于 AI 模型在现实中可能被滥用的证据，主要来自[学术研究](https://casp.ac/reports/ai-enabled-terrorism)、[政府报告](https://www.state.gov/wp-content/uploads/2025/04/2025-Arms-Control-Treaty-Compliance-Report-1.pdf)、[国际组织](https://www.europol.europa.eu/publications-events/main-reports/tesat-report)以及[记者](https://www.bellingcat.com/news/uk-and-europe/2020/10/23/russias-clandestine-chemical-weapons-programme-and-the-grus-unit-21955/)的工作。但可能直接卷入这些活动的 AI 公司，迄今基本缺席公开讨论。据我们所知，还没有任何私人公司——无论 AI 公司还是其他公司——公开分享过其平台可能被用于生物武器开发的证据。\n\n这里，我们披露五个使用我们模型、其用途可能支持生物武器开发的案例。这些案例旨在展示模型实际被用于哪些任务，以及判断某种生物学用途是否危险时经常面临的困难；也说明 AI 公司会获得一些原本不会公开的关于生物滥用风险的观察。第一个案例中，一个转售平台绕过地区封锁，为参与国家资助项目、开展 chikungunya 功能获得研究的病毒学家提供服务，并把被模型拒绝的提示转发给安全限制更宽松的模型。第二个案例中，一名不受支持地区的研究人员连续数周用 Claude 规划高致病性禽流感的哺乳动物适应实验，但分类器把工作限制在我们能力最弱的模型上。第三个案例中，一个面向十余名客户的转售中继，让 Opus 5 在约一小时内起草了一份完整的正痘病毒免疫逃逸项目申请。第四个案例中，一名国家支持的研究人员建立毒液肽图谱，并搭建针对麻痹性和镇痛性靶点的分子生成优化流水线。第五个案例中，一名研究人员为国家项目计算重设计毒素，并要求 Claude 在进度报告中刻意模糊这些制剂的真实身份。\n\n下述案例中的行为者绕过我们阻止不受支持地区用户访问模型的控制，还采取其他措施掩盖研究目的，以规避防护。发现并调查后，我们封禁账号，并把调查发现纳入前沿模型安全、执法和威胁情报流程，以便未来更好地预防、检测和阻断这些活动。我们不会披露涉事研究机构、活动所在国家，以及具体生物因子或研究技术的名称。案例中的个人都是在职科研人员；我们并不声称他们有伤害意图，公开其个人或实验室身份反而可能给他们带来风险。\n\n我们希望，通过分享这些案例，可以推动 AI 行业与政府讨论正在出现的生物风险，以及如何更有效地应对。","sourceFormat":"markdown"},"note:sha256:8633ddfe98ff1df3f2dd292f3a6a65f5b94fc9e80cce9eb5d7d434f75a87c9b8":{"html":"\u003cpre\u003e\u003ccode\u003eChat IDs: -10078223223323, -1003197249446, -1003233252, 7828288328\n\u003c/code\u003e\u003c/pre\u003e\n","kind":"html","rawMarkdown":"```\nChat IDs: -10078223223323, -1003197249446, -1003233252, 7828288328\n```","sourceFormat":"markdown"},"note:sha256:89a444e9dac184bb997d07b28db23084494b03b0edf13368902a710a7d9dd9e3":{"html":"\u003cp\u003e蒸馏是一个复杂挑战。相关实体会使用多种技术和系统访问模型并抽取能力，没有任何单一安全措施能够独自解决，因此我们采用分层防御来检测和阻断非法蒸馏攻击。\u003c/p\u003e\n\u003cp\u003e我们使用元数据，并寻找异常活动信号，识别与代理服务网络有关的账号。我们不会只逐个封禁代理账号，而是努力把可疑活动归因到具体组织，以便采取更全面、更有效的执法行动来防止蒸馏攻击。\u003c/p\u003e\n\u003cp\u003e我们也建立了专门检测对抗性抽取的分类器。如果我们高置信度判断一组请求与非法蒸馏或其他未经授权的 Claude 使用有关，就会阻断请求并封禁相关账号。今年早些时候随 \u003ca href=\"https://www.anthropic.com/news/claude-fable-5-mythos-5\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eFable 5\u003c/a\u003e 发布，我们进一步强化了这些分类器。\u003c/p\u003e\n\u003cp\u003e此外，我们增加了新的安全措施，让未经授权实验室更难蒸馏 Claude 能力。Claude 现在会在回答前对内部推理进行摘要，使被盗对话记录更难直接用于训练其他模型。Fable 5.1 中，我们还\u003ca href=\"https://support.claude.com/en/articles/15363606-why-claude-switched-models-in-your-conversation-with-fable-5-or-fable-5-1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e引入 preserved thinking\u003c/a\u003e：新 API 账号无法修改多轮对话中位于 Claude 推理之前的系统提示、工具或消息。推理本身经过加密，而修改推理前上下文正是攻击者常用的诱导 Claude 暴露推理方法。\u003c/p\u003e\n\u003cp\u003e最后，如果检测到潜在滥用信号，例如未经授权转售 Claude，或账号来自中国、俄罗斯、伊朗等不受支持国家，我们的系统可以要求用户验证身份才能继续访问；无法完成验证的账号会被封禁。\u003c/p\u003e\n\u003cp\u003e随着我们持续调查和阻断蒸馏攻击，从中获得的经验会继续反馈到新的安全措施中。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"蒸馏是一个复杂挑战。相关实体会使用多种技术和系统访问模型并抽取能力，没有任何单一安全措施能够独自解决，因此我们采用分层防御来检测和阻断非法蒸馏攻击。\n\n我们使用元数据，并寻找异常活动信号，识别与代理服务网络有关的账号。我们不会只逐个封禁代理账号，而是努力把可疑活动归因到具体组织，以便采取更全面、更有效的执法行动来防止蒸馏攻击。\n\n我们也建立了专门检测对抗性抽取的分类器。如果我们高置信度判断一组请求与非法蒸馏或其他未经授权的 Claude 使用有关，就会阻断请求并封禁相关账号。今年早些时候随 [Fable 5](https://www.anthropic.com/news/claude-fable-5-mythos-5) 发布，我们进一步强化了这些分类器。\n\n此外，我们增加了新的安全措施，让未经授权实验室更难蒸馏 Claude 能力。Claude 现在会在回答前对内部推理进行摘要，使被盗对话记录更难直接用于训练其他模型。Fable 5.1 中，我们还[引入 preserved thinking](https://support.claude.com/en/articles/15363606-why-claude-switched-models-in-your-conversation-with-fable-5-or-fable-5-1)：新 API 账号无法修改多轮对话中位于 Claude 推理之前的系统提示、工具或消息。推理本身经过加密，而修改推理前上下文正是攻击者常用的诱导 Claude 暴露推理方法。\n\n最后，如果检测到潜在滥用信号，例如未经授权转售 Claude，或账号来自中国、俄罗斯、伊朗等不受支持国家，我们的系统可以要求用户验证身份才能继续访问；无法完成验证的账号会被封禁。\n\n随着我们持续调查和阻断蒸馏攻击，从中获得的经验会继续反馈到新的安全措施中。\n\n[返回顶部](#main)","sourceFormat":"markdown"},"note:sha256:89cd6e6707d12b13d3cae2e6177f90a10b242747be95ff3bed89376725874f03":{"html":"\u003cp\u003e蒸馏本身是一种合法训练方法。研究人员让更大、更强的“教师”模型对一组输入生成回答，再用这些交互训练更小的“学生”模型去模仿教师模型。蒸馏被广泛采用，因为它能以更少资源获得更先进的能力。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff2bbccb4f43c02cf858fc7a232f714f7598fe044-1920x470.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e我们把“非法蒸馏”定义为：未经授权，以工业规模、隐蔽方式抽取一个模型的能力，并在另一个模型中复制。非法蒸馏通常由欺诈支撑，例如利用被盗信用卡、登录凭据和 API Key 创建复杂的大规模虚假账号网络。\u003c/p\u003e\n\u003cp\u003e其他前沿实验室也遭遇过蒸馏攻击。OpenAI 自 2025 年初以来就曾\u003ca href=\"https://www.ft.com/content/a0dfedd1-5255-4fa9-8ccc-1fe01de87ea6\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e提醒注意\u003c/a\u003e这类活动；Google 今年早些时候也\u003ca href=\"https://cloud.google.com/blog/topics/threat-intelligence/distillation-experimentation-integration-ai-adversarial-use\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e发布威胁追踪\u003c/a\u003e，讨论对抗性蒸馏。蒸馏攻击通常瞄准美国前沿模型最有价值的能力，包括 Agent 能力与工具使用、编程与数据分析、逻辑推理。\u003c/p\u003e\n\u003cp\u003e非法蒸馏让未经授权的实验室能够用远少于自主研发所需的时间、算力和成本，非法抽取并模仿前沿模型能力。\u003c/p\u003e\n\u003cp\u003e过去几个月，未经授权的实验室开发出越来越复杂的方法，以绕过我们的防御并收割美国前沿模型能力。它们通常通过代理服务访问 Anthropic 模型，这类服务也被称为“\u003ca href=\"https://www.chinatalk.media/p/how-to-buy-cheap-claude-tokens-in\" target=\"_blank\" rel=\"noopener noreferrer\"\u003etransfer stations\u003c/a\u003e”。为绕过地域限制和相关控制，这些代理服务使用虚假身份、伪造或被盗信用卡以及被盗 API Key 创建数千个新账号。它们还常常盗用属于合法公司或个人的 API 凭据，让未经授权实体访问美国前沿模型。这些欺诈会直接伤害合法客户。下图展示非法蒸馏行动的生命周期。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F0e2c5cfa7cb0e27eac962ffb59e394ddd9d5de46-1920x631.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e未经授权的实验室还会从第三方转售商购买美国前沿模型与用户之间的交互记录。这些转售商包括代理服务运营者；它们往往在用户不知情或未同意的情况下保存用户与美国模型的交流，再把记录卖给其他实验室。未经授权的实验室随后用这些购买来的交流记录蒸馏前沿能力。在另一些案例中，它们甚至在用户不知情也未授权的情况下，把自家用户请求重新路由给 Claude，以收集“用户—Claude”交流作为训练数据。\u003c/p\u003e\n","kind":"html","rawMarkdown":"蒸馏本身是一种合法训练方法。研究人员让更大、更强的“教师”模型对一组输入生成回答，再用这些交互训练更小的“学生”模型去模仿教师模型。蒸馏被广泛采用，因为它能以更少资源获得更先进的能力。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff2bbccb4f43c02cf858fc7a232f714f7598fe044-1920x470.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n我们把“非法蒸馏”定义为：未经授权，以工业规模、隐蔽方式抽取一个模型的能力，并在另一个模型中复制。非法蒸馏通常由欺诈支撑，例如利用被盗信用卡、登录凭据和 API Key 创建复杂的大规模虚假账号网络。\n\n其他前沿实验室也遭遇过蒸馏攻击。OpenAI 自 2025 年初以来就曾[提醒注意](https://www.ft.com/content/a0dfedd1-5255-4fa9-8ccc-1fe01de87ea6)这类活动；Google 今年早些时候也[发布威胁追踪](https://cloud.google.com/blog/topics/threat-intelligence/distillation-experimentation-integration-ai-adversarial-use)，讨论对抗性蒸馏。蒸馏攻击通常瞄准美国前沿模型最有价值的能力，包括 Agent 能力与工具使用、编程与数据分析、逻辑推理。\n\n非法蒸馏让未经授权的实验室能够用远少于自主研发所需的时间、算力和成本，非法抽取并模仿前沿模型能力。\n\n过去几个月，未经授权的实验室开发出越来越复杂的方法，以绕过我们的防御并收割美国前沿模型能力。它们通常通过代理服务访问 Anthropic 模型，这类服务也被称为“[transfer stations](https://www.chinatalk.media/p/how-to-buy-cheap-claude-tokens-in)”。为绕过地域限制和相关控制，这些代理服务使用虚假身份、伪造或被盗信用卡以及被盗 API Key 创建数千个新账号。它们还常常盗用属于合法公司或个人的 API 凭据，让未经授权实体访问美国前沿模型。这些欺诈会直接伤害合法客户。下图展示非法蒸馏行动的生命周期。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F0e2c5cfa7cb0e27eac962ffb59e394ddd9d5de46-1920x631.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n未经授权的实验室还会从第三方转售商购买美国前沿模型与用户之间的交互记录。这些转售商包括代理服务运营者；它们往往在用户不知情或未同意的情况下保存用户与美国模型的交流，再把记录卖给其他实验室。未经授权的实验室随后用这些购买来的交流记录蒸馏前沿能力。在另一些案例中，它们甚至在用户不知情也未授权的情况下，把自家用户请求重新路由给 Claude，以收集“用户—Claude”交流作为训练数据。","sourceFormat":"markdown"},"note:sha256:89d5a57f0dbea1c78f8908b5027dbff12e9d2ec02e902f7d75243a7e45ee82c3":{"html":"\u003cp\u003e为了更准确评估每场影响力行动的实际影响，我们采用 \u003ca href=\"https://www.brookings.edu/articles/the-breakout-scale-measuring-the-impact-of-influence-operations/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBreakout Scale\u003c/a\u003e。这是一个被行业研究者广泛采用的六级框架，根据内容跨平台迁移与触达范围衡量影响：Category One 表示内容只局限于单个平台的单一社群；Category Two 到 Category Six 则代表公众曝光和传播程度逐级提高。\u003c/p\u003e\n","kind":"html","rawMarkdown":"为了更准确评估每场影响力行动的实际影响，我们采用 [Breakout Scale](https://www.brookings.edu/articles/the-breakout-scale-measuring-the-impact-of-influence-operations/)。这是一个被行业研究者广泛采用的六级框架，根据内容跨平台迁移与触达范围衡量影响：Category One 表示内容只局限于单个平台的单一社群；Category Two 到 Category Six 则代表公众曝光和传播程度逐级提高。","sourceFormat":"markdown"},"note:sha256:89f6b756727283eac3423dd71c8a5d8b6961431c783ed9a4132bd2a56fd8d380":{"html":"\u003cp\u003e以下列出威胁行为者为构建其 AI 驱动工作流而开发的 Skill。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F5b3c1191e266cbbe020d44dfb9acdbc1bedf5b9f-1920x1778.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 19. Skill 分类。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"以下列出威胁行为者为构建其 AI 驱动工作流而开发的 Skill。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F5b3c1191e266cbbe020d44dfb9acdbc1bedf5b9f-1920x1778.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 19. Skill 分类。\n\n[返回顶部](#main)","sourceFormat":"markdown"},"note:sha256:8a3d009e567bcfce646dc28251378290cf067d9e117d1b3c1375d55b193d0835":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e实体\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e在行动中的角色\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eRadio Lengo Songo / SARL Media International（98.9 FM）\u003c/td\u003e\n\u003ctd\u003e主要枢纽；亲俄编辑路线；HR 基础设施把政治服从写入制度。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRussian House / Rossotrudnichestvo, Bangui\u003c/td\u003e\n\u003ctd\u003e国家文化节点与协调点（Dmitri Sytyi）。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSputnik Afrique / Rossiya Segodnya\u003c/td\u003e\n\u003ctd\u003e国家媒体内容供应方；合作与交换（以培训换播出时段）。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRT, TASS\u003c/td\u003e\n\u003ctd\u003e国际放大；协调部长访谈。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAfrica Corps / Wagner\u003c/td\u003e\n\u003ctd\u003e行动所宣传的安全力量主体；相关内部行动数据被访问。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTelegram: СОМБ («Туристы в Африке»), «Залечь на дне в Банги»\u003c/td\u003e\n\u003ctd\u003e军事宣传频道和亲俄本地声音频道（风格被模仿）。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRadio Centrafrique\u003c/td\u003e\n\u003ctd\u003e被作为下游“洗白”终点的国家广播机构。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNdjoni Sango, Pravda RCA\u003c/td\u003e\n\u003ctd\u003e被允许作为来源使用的立场一致本地媒体。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 1. 围绕该行动的关联媒体与平台。\u003c/p\u003e\n","kind":"html","rawMarkdown":"| **实体** | **在行动中的角色** |\n| --- | --- |\n| Radio Lengo Songo / SARL Media International（98.9 FM） | 主要枢纽；亲俄编辑路线；HR 基础设施把政治服从写入制度。 |\n| Russian House / Rossotrudnichestvo, Bangui | 国家文化节点与协调点（Dmitri Sytyi）。 |\n| Sputnik Afrique / Rossiya Segodnya | 国家媒体内容供应方；合作与交换（以培训换播出时段）。 |\n| RT, TASS | 国际放大；协调部长访谈。 |\n| Africa Corps / Wagner | 行动所宣传的安全力量主体；相关内部行动数据被访问。 |\n| Telegram: СОМБ («Туристы в Африке»), «Залечь на дне в Банги» | 军事宣传频道和亲俄本地声音频道（风格被模仿）。 |\n| Radio Centrafrique | 被作为下游“洗白”终点的国家广播机构。 |\n| Ndjoni Sango, Pravda RCA | 被允许作为来源使用的立场一致本地媒体。 |\n\n表 1. 围绕该行动的关联媒体与平台。","sourceFormat":"markdown"},"note:sha256:8adb9e82756ab4b33c11e6411fe4b419b5b1f9467a5e6419dd6498284e4e08ce":{"html":"\u003cp\u003e影响力行动既不是新事物，也不是互联网独有。新闻记者、研究人员和政府机构组成的成熟研究共同体，长期研究并揭露此类技战术，也建立了我们用于理解这类行动的\u003ca href=\"https://www.annenbergpublicpolicycenter.org/wp-content/uploads/ABC_Framework_TWG_Francois_Sept_2019.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e分析框架\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e但与社交平台通常要等内容已经开始传播后才能看到行动不同，我们有时会在行动尚处于搭建阶段时，就在 Claude 上看到它。行为者会使用 AI 规划行动、选择目标、撰写材料；这些任务会产生我们系统已训练去识别的信号，因此常常能让我们在行动真正启动前进行阻断。\u003c/p\u003e\n\u003cp\u003e一旦行动离开我们的平台正式上线，我们的直接可见性就结束了。为了验证调查结果并了解内容离开平台后发生了什么，我们依赖开源研究、跨平台行业数据和公开报道。每个案例都会说明我们如何发现相关活动，以及还有哪些机构参与调查。\u003c/p\u003e\n\u003cp\u003e一旦识别到行动，我们会封禁相关账号，并把活动归因到背后的组织。我们还会利用这些调查所得强化防护，把每次调查中发现的新技战术和行为模式反馈到检测系统中。\u003c/p\u003e\n","kind":"html","rawMarkdown":"影响力行动既不是新事物，也不是互联网独有。新闻记者、研究人员和政府机构组成的成熟研究共同体，长期研究并揭露此类技战术，也建立了我们用于理解这类行动的[分析框架](https://www.annenbergpublicpolicycenter.org/wp-content/uploads/ABC_Framework_TWG_Francois_Sept_2019.pdf)。\n\n但与社交平台通常要等内容已经开始传播后才能看到行动不同，我们有时会在行动尚处于搭建阶段时，就在 Claude 上看到它。行为者会使用 AI 规划行动、选择目标、撰写材料；这些任务会产生我们系统已训练去识别的信号，因此常常能让我们在行动真正启动前进行阻断。\n\n一旦行动离开我们的平台正式上线，我们的直接可见性就结束了。为了验证调查结果并了解内容离开平台后发生了什么，我们依赖开源研究、跨平台行业数据和公开报道。每个案例都会说明我们如何发现相关活动，以及还有哪些机构参与调查。\n\n一旦识别到行动，我们会封禁相关账号，并把活动归因到背后的组织。我们还会利用这些调查所得强化防护，把每次调查中发现的新技战术和行为模式反馈到检测系统中。","sourceFormat":"markdown"},"note:sha256:8b0bea62462487b6562fe25c39334de7209baea027af5f2d708fcd4a64177e06":{"html":"\u003cp\u003e该行动用于初始进入目标系统的标志性技术，是利用一个此前未公开记录的 WordPress“重新安装竞态条件”，在没有有效凭据的情况下创建恶意管理员账号。攻击者在同一个会话中使用 Claude 开发和调试利用代码，包括构建实验环境 Harness。该方法至少在四个受害网站上成功。\u003c/p\u003e\n\u003cp\u003e在一个案例中，攻击者通过一个暴露的搜索端点攻陷政治竞选管理平台。他让 Agent 在这一端点上反复迭代，最终外传约 14 万条记录，其中包含用户政治观点。\u003c/p\u003e\n\u003cp\u003e针对另一个目标时，攻击者把一个 WebShell 隐藏在字体资源中。WebShell 是放置在 Web 服务器上的小型脚本，允许攻击者远程发送命令并让服务器执行，本质上是一个可通过网站直接访问的后门。攻击者在识别出允许上传的漏洞后，现场构建 WebShell。他们还使用一个 WordPress “must-use”插件——这类插件每次页面加载都会执行，而且不能从管理员后台关闭——来收集提交的凭据，并用每个站点独有的公钥加密后等待取回。此外，GTG-50029 还污染了受害者备份，推测是为了维持持久化：如果受害者从旧备份恢复环境，就会再次被感染。\u003c/p\u003e\n\u003cp\u003e最后，攻击者通过注入脚本部署浏览器利用 C2 框架，攻陷一家媒体机构并“挂钩”其读者浏览器。这让攻击者能够对数千个来访浏览器进行指纹识别。我们观察到，攻击者明确利用这套框架搜寻编辑人员的会话和凭据。\u003c/p\u003e\n\u003cp\u003e该行为者的标志性工具名为“fafsearch”，是一套专门构建的开盒（doxxing）平台。它提供编译后的搜索引擎，包含数据摄取流水线、把单个泄露数据集与已外传数据交叉比对的能力、对国家身份号码与电话号码的规范化、排序逻辑、测试以及容器化部署。攻击者向平台导入数千万行数据，包括国家医疗标识符和司法系统泄露信息，并与其自身入侵获得的材料融合。之后，他们把结果发布为一组匿名托管的暗网服务，可以按姓名检索与目标政治运动有关联的个人。\u003c/p\u003e\n\u003cp\u003e这是我们所见最清晰的案例之一：AI 辅助软件工程被直接用于大规模隐私攻击，而整个平台由一个人独立创建。\u003c/p\u003e\n\u003cp\u003e在跟踪的 42 个目标实体中，攻击者至少进入了 14 个内部环境。其访问并外传了估计 12–26 GB 数据库 Dump，包括政党捐助者和成员记录、一个含 15,000 封邮件的邮箱、学生申请记录（包括未成年人数据）以及支付服务商数据。攻击者还部署了实时凭据拦截。利用这些已外传数据，他们在自营 Tor 泄露站点上为每名受害者准备独立加密归档。\u003c/p\u003e\n","kind":"html","rawMarkdown":"该行动用于初始进入目标系统的标志性技术，是利用一个此前未公开记录的 WordPress“重新安装竞态条件”，在没有有效凭据的情况下创建恶意管理员账号。攻击者在同一个会话中使用 Claude 开发和调试利用代码，包括构建实验环境 Harness。该方法至少在四个受害网站上成功。\n\n在一个案例中，攻击者通过一个暴露的搜索端点攻陷政治竞选管理平台。他让 Agent 在这一端点上反复迭代，最终外传约 14 万条记录，其中包含用户政治观点。\n\n针对另一个目标时，攻击者把一个 WebShell 隐藏在字体资源中。WebShell 是放置在 Web 服务器上的小型脚本，允许攻击者远程发送命令并让服务器执行，本质上是一个可通过网站直接访问的后门。攻击者在识别出允许上传的漏洞后，现场构建 WebShell。他们还使用一个 WordPress “must-use”插件——这类插件每次页面加载都会执行，而且不能从管理员后台关闭——来收集提交的凭据，并用每个站点独有的公钥加密后等待取回。此外，GTG-50029 还污染了受害者备份，推测是为了维持持久化：如果受害者从旧备份恢复环境，就会再次被感染。\n\n最后，攻击者通过注入脚本部署浏览器利用 C2 框架，攻陷一家媒体机构并“挂钩”其读者浏览器。这让攻击者能够对数千个来访浏览器进行指纹识别。我们观察到，攻击者明确利用这套框架搜寻编辑人员的会话和凭据。\n\n该行为者的标志性工具名为“fafsearch”，是一套专门构建的开盒（doxxing）平台。它提供编译后的搜索引擎，包含数据摄取流水线、把单个泄露数据集与已外传数据交叉比对的能力、对国家身份号码与电话号码的规范化、排序逻辑、测试以及容器化部署。攻击者向平台导入数千万行数据，包括国家医疗标识符和司法系统泄露信息，并与其自身入侵获得的材料融合。之后，他们把结果发布为一组匿名托管的暗网服务，可以按姓名检索与目标政治运动有关联的个人。\n\n这是我们所见最清晰的案例之一：AI 辅助软件工程被直接用于大规模隐私攻击，而整个平台由一个人独立创建。\n\n在跟踪的 42 个目标实体中，攻击者至少进入了 14 个内部环境。其访问并外传了估计 12–26 GB 数据库 Dump，包括政党捐助者和成员记录、一个含 15,000 封邮件的邮箱、学生申请记录（包括未成年人数据）以及支付服务商数据。攻击者还部署了实时凭据拦截。利用这些已外传数据，他们在自营 Tor 泄露站点上为每名受害者准备独立加密归档。","sourceFormat":"markdown"},"note:sha256:8c2dc070e67dea789ae5b7370cdfe41e610dab387a0d0a4aa74c2546eeb85eac":{"html":"\u003cp\u003e图 3. 将系统工程 V 模型与技术成熟度（TRL）对应，展示该活动发生在软件研发周期的哪个阶段，以及距离可用系统还有多远。\u003c/p\u003e\n","kind":"html","rawMarkdown":"图 3. 将系统工程 V 模型与技术成熟度（TRL）对应，展示该活动发生在软件研发周期的哪个阶段，以及距离可用系统还有多远。","sourceFormat":"markdown"},"note:sha256:8c4ba1a2fadc14bd3e6ee30e727c5de706a0228724e40638672bb6e650458647":{"html":"\u003cp\u003e我们移除了一个由班吉一名讲俄语的行为者运营的账号。该行为者为一场针对中非共和国（CAR）、与俄罗斯国家利益一致的“对外信息操纵与干预”（Foreign Information Manipulation and Interference，FIMI）行动提供内容生产后台。\u003c/p\u003e\n\u003cp\u003e行为者通过 Radio Lengo Songo（98.9 FM）运营每日内容流水线，并与俄罗斯国家媒体 RT、Sputnik Afrique、TASS，以及班吉的 Russian House 协调。每次生成内容时，用户都会明确要求 Claude 把亲俄、反法的论点嵌入报道。为了实现充分可否认性，他们还要求模型去除典型格式习惯，避免新闻 Feed 看起来像合成或 AI 生成文本。在抽样活动中，大多数内容支持中非共和国政府、支持 Wagner、反法并反对中非共和国反对派。\u003c/p\u003e\n\u003cp\u003eAll Eyes On Wagner 项目近期的一份\u003ca href=\"https://alleyesonwagner.org/2026/05/26/manufacturing-enemies-politologys-war-on-civil-society-in-car/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e调查报告\u003c/a\u003e显示，这家广播电台由 Wagner Group 于 2017 年创建并资助。行为者设计了一条流水线，把伪造内容通过电台送入全国广播体系。他们以提供 Rossiya Segodnya 面向外国记者的 SputnikPro 媒体培训名额，交换广播时段。这样一来，俄罗斯官方国家材料就可以披着普通全国性节目的外衣抵达当地听众。\u003c/p\u003e\n\u003cp\u003e表面上，大部分内容看起来像由普通中非共和国记者撰写；但我们的调查把该行为者与 Politology 联系起来。Politology 被认为是 Africa Corps/Wagner 的影响力分支，并被评估在 2023 年底转入俄罗斯对外情报局（SVR）控制。我们判断，该个人充当 Politology 在当地的媒体协调人。最终，这名行为者传播的是与俄罗斯国家立场一致的宣传。这是一场由俄罗斯国家指挥、旨在操纵并干预中非共和国信息空间的秘密行动。\u003c/p\u003e\n\u003cp\u003e使用 Breakout Scale，我们将该行动评估为 Category Four：内容每天通过 Radio Lengo Songo 98.9 FM 广播，再由 Telegram 频道放大，并被中非共和国当地新闻媒体转载。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们移除了一个由班吉一名讲俄语的行为者运营的账号。该行为者为一场针对中非共和国（CAR）、与俄罗斯国家利益一致的“对外信息操纵与干预”（Foreign Information Manipulation and Interference，FIMI）行动提供内容生产后台。\n\n行为者通过 Radio Lengo Songo（98.9 FM）运营每日内容流水线，并与俄罗斯国家媒体 RT、Sputnik Afrique、TASS，以及班吉的 Russian House 协调。每次生成内容时，用户都会明确要求 Claude 把亲俄、反法的论点嵌入报道。为了实现充分可否认性，他们还要求模型去除典型格式习惯，避免新闻 Feed 看起来像合成或 AI 生成文本。在抽样活动中，大多数内容支持中非共和国政府、支持 Wagner、反法并反对中非共和国反对派。\n\nAll Eyes On Wagner 项目近期的一份[调查报告](https://alleyesonwagner.org/2026/05/26/manufacturing-enemies-politologys-war-on-civil-society-in-car/)显示，这家广播电台由 Wagner Group 于 2017 年创建并资助。行为者设计了一条流水线，把伪造内容通过电台送入全国广播体系。他们以提供 Rossiya Segodnya 面向外国记者的 SputnikPro 媒体培训名额，交换广播时段。这样一来，俄罗斯官方国家材料就可以披着普通全国性节目的外衣抵达当地听众。\n\n表面上，大部分内容看起来像由普通中非共和国记者撰写；但我们的调查把该行为者与 Politology 联系起来。Politology 被认为是 Africa Corps/Wagner 的影响力分支，并被评估在 2023 年底转入俄罗斯对外情报局（SVR）控制。我们判断，该个人充当 Politology 在当地的媒体协调人。最终，这名行为者传播的是与俄罗斯国家立场一致的宣传。这是一场由俄罗斯国家指挥、旨在操纵并干预中非共和国信息空间的秘密行动。\n\n使用 Breakout Scale，我们将该行动评估为 Category Four：内容每天通过 Radio Lengo Songo 98.9 FM 广播，再由 Telegram 频道放大，并被中非共和国当地新闻媒体转载。","sourceFormat":"markdown"},"note:sha256:8cb3f9b8e4208829c67904ba11095b4787f49cbc2d63b10a4b753efcff697241":{"html":"\u003cp\u003e历史上，网络间谍行为者通常会开发并部署定制工具包以规避检测。攻击者会持续使用这些工具，直到防御方识别它们并建立签名进行检测和阻断，然后新一轮规避与检测循环重新开始。因此，强健的防御和检测能力能够提高对手的行动成本。然而如今，AI 的采用正在威胁这种机制：它可能让攻击者迅速而轻易地削弱防御方仅凭静态检测向其施加成本的能力。\u003c/p\u003e\n\u003cp\u003eGTG-20006 是一个通过 AI 自动化行动、显著提升作业速度的行为者。我们的归因与公开报道中将其与 Midnight Blizzard 联系起来的说法一致。其中一名操作者讲俄语，使用“JackPoterz”这一网名，其技战术和目标选择与俄罗斯国家关联的间谍活动相符。该团体攻击了乌克兰和欧洲政府中的军事情报目标，以及外交、防务机构和与美国外交政策相关的个人。我们观察到，GTG-20006 使用定制的 AI 驱动工作流，将从开发、基础设施获取、钓鱼、持久化、命令与控制，一直到数据外传的大量行动自动化。\u003c/p\u003e\n\u003cp\u003eGTG-20006 使用了一套定制工具包，包括两类基于 Windows 的植入程序、一套移动端利用工具包、针对浏览器密码存储的凭据窃取工具、一个用于仿冒政府机构等优先目标的钓鱼平台，以及一个管理被攻陷账号的管理控制台。在网络行动过程中，这些工具都通过 AI 辅助工作流按需维护和重新改造。\u003c/p\u003e\n\u003cp\u003e该行为者还使用 AI 监控其工具规避已知安全防御检测的效果。如果监控 Agent 发现已部署的某个恶意软件被安全产品识别，Agent 就会自主开始修改和重新构建该恶意软件，以绕过现有检测。它们被设计为持续迭代 GTG-20006 的工具包，直到不再被检测到。随后，这些工具会被部署到一次性托管服务器上，用于真实行动；受害者流量会被引导到这些服务器下载恶意软件，相关行动包括钓鱼、\u003ca href=\"https://en.wikipedia.org/wiki/ClickFix\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eClickFix\u003c/a\u003e 以及 DNS 劫持等方案。\u003c/p\u003e\n\u003cp\u003e该行为者也用 AI 驱动其钓鱼行动。他们构建了 AI 工作流，用于调研并注册域名，再配置发送钓鱼邮件所需的托管基础设施；另有工作流负责发送邮件，并监视 C2 信道中是否出现成功入侵。人类操作者主要在工作流需要优化时介入，修改驱动这些流程的 Claude Code Skill。\u003c/p\u003e\n\u003cp\u003e我们的调查识别出该行为者在行动规划、侦察和实际攻击中针对的 20 多个不同组织，包括政府部委、防务与情报机构、使领馆及外交机构、智库和国防工业企业。目标主要集中在乌克兰和欧洲，但也延伸至中东和亚洲与海事相关的政府机构。一个反复出现的主题，是乌克兰以及军用无人机技术供应商和供应链。例外目标包括一个与海上航运和追踪有关的东南亚政府实体，以及一个北非政府技术机构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"历史上，网络间谍行为者通常会开发并部署定制工具包以规避检测。攻击者会持续使用这些工具，直到防御方识别它们并建立签名进行检测和阻断，然后新一轮规避与检测循环重新开始。因此，强健的防御和检测能力能够提高对手的行动成本。然而如今，AI 的采用正在威胁这种机制：它可能让攻击者迅速而轻易地削弱防御方仅凭静态检测向其施加成本的能力。\n\nGTG-20006 是一个通过 AI 自动化行动、显著提升作业速度的行为者。我们的归因与公开报道中将其与 Midnight Blizzard 联系起来的说法一致。其中一名操作者讲俄语，使用“JackPoterz”这一网名，其技战术和目标选择与俄罗斯国家关联的间谍活动相符。该团体攻击了乌克兰和欧洲政府中的军事情报目标，以及外交、防务机构和与美国外交政策相关的个人。我们观察到，GTG-20006 使用定制的 AI 驱动工作流，将从开发、基础设施获取、钓鱼、持久化、命令与控制，一直到数据外传的大量行动自动化。\n\nGTG-20006 使用了一套定制工具包，包括两类基于 Windows 的植入程序、一套移动端利用工具包、针对浏览器密码存储的凭据窃取工具、一个用于仿冒政府机构等优先目标的钓鱼平台，以及一个管理被攻陷账号的管理控制台。在网络行动过程中，这些工具都通过 AI 辅助工作流按需维护和重新改造。\n\n该行为者还使用 AI 监控其工具规避已知安全防御检测的效果。如果监控 Agent 发现已部署的某个恶意软件被安全产品识别，Agent 就会自主开始修改和重新构建该恶意软件，以绕过现有检测。它们被设计为持续迭代 GTG-20006 的工具包，直到不再被检测到。随后，这些工具会被部署到一次性托管服务器上，用于真实行动；受害者流量会被引导到这些服务器下载恶意软件，相关行动包括钓鱼、[ClickFix](https://en.wikipedia.org/wiki/ClickFix) 以及 DNS 劫持等方案。\n\n该行为者也用 AI 驱动其钓鱼行动。他们构建了 AI 工作流，用于调研并注册域名，再配置发送钓鱼邮件所需的托管基础设施；另有工作流负责发送邮件，并监视 C2 信道中是否出现成功入侵。人类操作者主要在工作流需要优化时介入，修改驱动这些流程的 Claude Code Skill。\n\n我们的调查识别出该行为者在行动规划、侦察和实际攻击中针对的 20 多个不同组织，包括政府部委、防务与情报机构、使领馆及外交机构、智库和国防工业企业。目标主要集中在乌克兰和欧洲，但也延伸至中东和亚洲与海事相关的政府机构。一个反复出现的主题，是乌克兰以及军用无人机技术供应商和供应链。例外目标包括一个与海上航运和追踪有关的东南亚政府实体，以及一个北非政府技术机构。","sourceFormat":"markdown"},"note:sha256:8ccedc1ae866877d33fbff3370261be06b1f46a733dac56ee6609763a6c636e9":{"blocks":[{"children":[],"kind":"leaf","title":"一名位于俄罗斯的行为者使用 Claude 调研并起草军民两用品的采购文件，很可能面向俄罗斯政府和国防工业客户。行动核心人物自称是莫斯科一家设计局的采购经理。"},{"children":[{"title":"第一，通过中国境内分销商采购德国制造的三轴磁通门磁强计，并交付给俄罗斯客户；行为者声称客户将其用于民用生物医学工作。"},{"title":"第二，通过中国供应商采购数千片航天级 PV 晶圆。"},{"title":"第三，从中国供应商采购航空机组氧气系统。"},{"title":"第四，与商品采购分开，拿到为俄罗斯 National Guard 某单位建设医院的合同。"},{"title":"第五，采购可通过俄罗斯国家国防采购平台获得的信息技术和加密系统。"}],"kind":"section","title":"采购行动分成五条工作流"},{"children":[],"kind":"leaf","title":"行为者使用 Claude 寻找中国大陆和香港的第三国中间商，以采购欧洲制造的产品；同时用 Claude 起草英语、中文和俄语询价邮件模板。这些邮件有意模糊最终用户：把采购方描述为某未具名研究机构的海外联络部门，同时要求货物运往俄罗斯。"},{"children":[],"kind":"leaf","title":"行为者还让 Claude 起草正式的俄罗斯政府招标规范，并计算一条通过其他国家中转、以掩盖最终目的地的进口加价链。他们还让 Claude 逆向梳理俄罗斯现有的灰色进口链路，解释其如何经过一家未经授权的俄罗斯分销商、一家中国进出口公司和一家香港中间商，使行为者能够完整了解隐藏采购网络所需的成本与路由步骤。"},{"children":[],"kind":"leaf","title":"借助 Claude，行为者为主管撰写俄语简报，并明确把这些措施描述为规避欧洲贸易管制的方法。简报引用相关欧洲管制规定，承认直接供应受阻，并说明如何通过第三国把货物转给俄罗斯接收方；文件把这些第三国称为“sanctions-neutral jurisdiction（制裁中立司法辖区）”。"},{"children":[],"kind":"leaf","title":"与此同时，行为者把 Claude 与浏览器自动化 Agent 结合，用于处理这些采购行动的后台工作。这套系统从供应商市场抓取价格，为每份招标中约 40 个条目提供链接；合并多份采购表格，再把最终结果同步到在线笔记、项目管理和其他采购工具中，几乎完全自动化原本需要采购文员大量人工处理的流程。行为者还使用 Claude 在多个国家发现供应商、起草物流通信，甚至修改一份据称已经发货订单的收件人。"},{"children":[],"kind":"leaf","title":"行为者使用 Claude 的方式表明，其采购商品很可能是为了销售给俄罗斯政府和国防工业最终用户。部分订单中，他们明确引用了俄罗斯政府和国防工业客户的合同与订单；其他订单则无法确认最终客户是否与政府或国防工业有关。"},{"children":[],"kind":"leaf","title":"与本报告其他案例类似，该行为者通过 VPN 绕过 Anthropic 的地域访问限制。当我们发现其违反 Usage Policy 和 Supported Regions Policy 时，封禁了账号，部署额外监控以发现新账号创建尝试，并把调查发现纳入安全措施。识别和阻止武器相关采购尤其困难，因为单独看每一次请求——商业询价、招标文件或供应商搜索——都显得非常普通。"}],"html":"\u003cp\u003e一名位于俄罗斯的行为者使用 Claude 调研并起草军民两用品的采购文件，很可能面向俄罗斯政府和国防工业客户。行动核心人物自称是莫斯科一家设计局的采购经理。\u003c/p\u003e\n\u003cp\u003e采购行动分成五条工作流：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e第一，通过中国境内分销商采购德国制造的三轴磁通门磁强计，并交付给俄罗斯客户；行为者声称客户将其用于民用生物医学工作。\u003c/li\u003e\n\u003cli\u003e第二，通过中国供应商采购数千片航天级 PV 晶圆。\u003c/li\u003e\n\u003cli\u003e第三，从中国供应商采购航空机组氧气系统。\u003c/li\u003e\n\u003cli\u003e第四，与商品采购分开，拿到为俄罗斯 National Guard 某单位建设医院的合同。\u003c/li\u003e\n\u003cli\u003e第五，采购可通过俄罗斯国家国防采购平台获得的信息技术和加密系统。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e行为者使用 Claude 寻找中国大陆和香港的第三国中间商，以采购欧洲制造的产品；同时用 Claude 起草英语、中文和俄语询价邮件模板。这些邮件有意模糊最终用户：把采购方描述为某未具名研究机构的海外联络部门，同时要求货物运往俄罗斯。\u003c/p\u003e\n\u003cp\u003e行为者还让 Claude 起草正式的俄罗斯政府招标规范，并计算一条通过其他国家中转、以掩盖最终目的地的进口加价链。他们还让 Claude 逆向梳理俄罗斯现有的灰色进口链路，解释其如何经过一家未经授权的俄罗斯分销商、一家中国进出口公司和一家香港中间商，使行为者能够完整了解隐藏采购网络所需的成本与路由步骤。\u003c/p\u003e\n\u003cp\u003e借助 Claude，行为者为主管撰写俄语简报，并明确把这些措施描述为规避欧洲贸易管制的方法。简报引用相关欧洲管制规定，承认直接供应受阻，并说明如何通过第三国把货物转给俄罗斯接收方；文件把这些第三国称为“sanctions-neutral jurisdiction（制裁中立司法辖区）”。\u003c/p\u003e\n\u003cp\u003e与此同时，行为者把 Claude 与浏览器自动化 Agent 结合，用于处理这些采购行动的后台工作。这套系统从供应商市场抓取价格，为每份招标中约 40 个条目提供链接；合并多份采购表格，再把最终结果同步到在线笔记、项目管理和其他采购工具中，几乎完全自动化原本需要采购文员大量人工处理的流程。行为者还使用 Claude 在多个国家发现供应商、起草物流通信，甚至修改一份据称已经发货订单的收件人。\u003c/p\u003e\n\u003cp\u003e行为者使用 Claude 的方式表明，其采购商品很可能是为了销售给俄罗斯政府和国防工业最终用户。部分订单中，他们明确引用了俄罗斯政府和国防工业客户的合同与订单；其他订单则无法确认最终客户是否与政府或国防工业有关。\u003c/p\u003e\n\u003cp\u003e与本报告其他案例类似，该行为者通过 VPN 绕过 Anthropic 的地域访问限制。当我们发现其违反 Usage Policy 和 Supported Regions Policy 时，封禁了账号，部署额外监控以发现新账号创建尝试，并把调查发现纳入安全措施。识别和阻止武器相关采购尤其困难，因为单独看每一次请求——商业询价、招标文件或供应商搜索——都显得非常普通。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"一名位于俄罗斯的行为者使用 Claude 调研并起草军民两用品的采购文件，很可能面向俄罗斯政府和国防工业客户。行动核心人物自称是莫斯科一家设计局的采购经理。\n\n采购行动分成五条工作流：\n\n- 第一，通过中国境内分销商采购德国制造的三轴磁通门磁强计，并交付给俄罗斯客户；行为者声称客户将其用于民用生物医学工作。\n- 第二，通过中国供应商采购数千片航天级 PV 晶圆。\n- 第三，从中国供应商采购航空机组氧气系统。\n- 第四，与商品采购分开，拿到为俄罗斯 National Guard 某单位建设医院的合同。\n- 第五，采购可通过俄罗斯国家国防采购平台获得的信息技术和加密系统。\n\n行为者使用 Claude 寻找中国大陆和香港的第三国中间商，以采购欧洲制造的产品；同时用 Claude 起草英语、中文和俄语询价邮件模板。这些邮件有意模糊最终用户：把采购方描述为某未具名研究机构的海外联络部门，同时要求货物运往俄罗斯。\n\n行为者还让 Claude 起草正式的俄罗斯政府招标规范，并计算一条通过其他国家中转、以掩盖最终目的地的进口加价链。他们还让 Claude 逆向梳理俄罗斯现有的灰色进口链路，解释其如何经过一家未经授权的俄罗斯分销商、一家中国进出口公司和一家香港中间商，使行为者能够完整了解隐藏采购网络所需的成本与路由步骤。\n\n借助 Claude，行为者为主管撰写俄语简报，并明确把这些措施描述为规避欧洲贸易管制的方法。简报引用相关欧洲管制规定，承认直接供应受阻，并说明如何通过第三国把货物转给俄罗斯接收方；文件把这些第三国称为“sanctions-neutral jurisdiction（制裁中立司法辖区）”。\n\n与此同时，行为者把 Claude 与浏览器自动化 Agent 结合，用于处理这些采购行动的后台工作。这套系统从供应商市场抓取价格，为每份招标中约 40 个条目提供链接；合并多份采购表格，再把最终结果同步到在线笔记、项目管理和其他采购工具中，几乎完全自动化原本需要采购文员大量人工处理的流程。行为者还使用 Claude 在多个国家发现供应商、起草物流通信，甚至修改一份据称已经发货订单的收件人。\n\n行为者使用 Claude 的方式表明，其采购商品很可能是为了销售给俄罗斯政府和国防工业最终用户。部分订单中，他们明确引用了俄罗斯政府和国防工业客户的合同与订单；其他订单则无法确认最终客户是否与政府或国防工业有关。\n\n与本报告其他案例类似，该行为者通过 VPN 绕过 Anthropic 的地域访问限制。当我们发现其违反 Usage Policy 和 Supported Regions Policy 时，封禁了账号，部署额外监控以发现新账号创建尝试，并把调查发现纳入安全措施。识别和阻止武器相关采购尤其困难，因为单独看每一次请求——商业询价、招标文件或供应商搜索——都显得非常普通。","sourceFormat":"markdown"},"note:sha256:8ce20d74aa96532c6870117ba4db59be986a1a3d4b4651a33adef9def31b3bdf":{"html":"\u003cp\u003e行为者还使用 Claude 设计在没有任何 OAuth 同意流程的情况下入侵 Microsoft 365 邮箱的工具。脚本会强制终止 Outlook 进程以解锁凭据文件，然后解密受 DPAPI 保护的密钥、解析 MSAL Token Cache 和 OneAuth 账号存储，并枚举 Windows Credential Manager 的单点登录条目。提取出的 Token 可被重放到 Outlook Web API，以批量下载邮箱内容（包括已删除邮件），有些情况下还会打包成归档或通过代理路由。为逃避服务器端检测，脚本伪造真实 Outlook 桌面版 User-Agent，并复用 Microsoft 第一方应用 Client ID，使流量看起来与原生 Outlook 客户端无异。整个行动中，威胁行为者用 Claude 设计和测试这些工具，而不是让 Claude 直接执行实时行动。\u003c/p\u003e\n","kind":"html","rawMarkdown":"行为者还使用 Claude 设计在没有任何 OAuth 同意流程的情况下入侵 Microsoft 365 邮箱的工具。脚本会强制终止 Outlook 进程以解锁凭据文件，然后解密受 DPAPI 保护的密钥、解析 MSAL Token Cache 和 OneAuth 账号存储，并枚举 Windows Credential Manager 的单点登录条目。提取出的 Token 可被重放到 Outlook Web API，以批量下载邮箱内容（包括已删除邮件），有些情况下还会打包成归档或通过代理路由。为逃避服务器端检测，脚本伪造真实 Outlook 桌面版 User-Agent，并复用 Microsoft 第一方应用 Client ID，使流量看起来与原生 Outlook 客户端无异。整个行动中，威胁行为者用 Claude 设计和测试这些工具，而不是让 Claude 直接执行实时行动。","sourceFormat":"markdown"},"note:sha256:8df36fb84d2601aea04221fd51cb6f5b4d8c840a6fc85216f917cdd319f76db3":{"html":"\u003cp\u003e剩余两个案例中的研究者关注的是不可传播的新型毒液和毒素。这类化合物具有重要军民两用属性。例如，肉毒杆菌毒素是一种高度致命物质，多个国家曾把它作为生物武器研究，但今天以极小且精确控制的剂量作为“Botox”，用于治疗偏头痛、痉挛和皱纹。类似地，贝类藻类产生的 saxitoxin 在 1950—60 年代曾被 CIA 储备用作自杀和暗杀制剂，但如今是研究神经信号的重要工具；其近亲河豚毒素 tetrodotoxin 也曾作为癌痛疗法开展试验。\u003c/p\u003e\n\u003cp\u003e第四个案例中，一名研究人员使用 Claude 建立来自多类有毒动物谱系的毒液毒素肽图谱，并进一步发展成优化毒素特性的生成式流水线。项目有明确治疗目标：开发新的镇痛药、抗抑郁药和其他治疗分子。但图谱同时包含针对镇痛和麻痹靶点的骨架，因此既可以生成新的治疗分子，也可以生成有害化合物。后者源自因可能用作致失能制剂而被 \u003ca href=\"https://www.dfat.gov.au/publications/minisite/theaustraliagroupnet/site/en/controllists.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eAustralia Group common control list\u003c/a\u003e实施出口管制的毒素。研究人员自己也意识到研究的军民两用性质，引用过讨论蛋白质设计双用途风险的期刊文章。此外，针对该地区的国际合规评估对研究人员所关注的特定毒素类别提出过担忧，尤其涉及 AI/ML 在这类毒素的生物武器应用背景下的使用。本案例中，我们还从研究人员与 Claude 分享的信息得知，其成果属于一个国家支持的研究项目。该账号因绕过不受支持地区限制，于 2026 年 5 月被封禁。\u003c/p\u003e\n\u003cp\u003e第五个案例中，一名研究人员在多个项目中使用 Claude，对一组不同毒素进行计算重设计。与上一案例类似，项目使用许多相同技术工具，大多以治疗用途框定目标，并描述为国家公共研究项目下的优先研究任务。其中还涉及一个细菌毒素亚基，以及一种出血热病毒蛋白；该病毒位于\u003ca href=\"https://www.who.int/teams/blueprint/who-r-and-d-blueprint-for-epidemics\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e世界卫生组织 R\u0026amp;D Blueprint\u003c/a\u003e所列、具有最高疫情和大流行威胁的优先疾病名单中。\u003c/p\u003e\n\u003cp\u003e研究人员与 Claude 共同撰写季度进度报告。值得注意的是，报告刻意隐藏细菌毒素和病毒蛋白的真实身份，研究人员还明确要求 Claude 保持低信息精度。我们在 2026 年 5 月以违反 Anthropic Supported Regions Policy 为由封禁了两个账号。\u003c/p\u003e\n\u003cp\u003e这两个案例中，研究大体没有被我们的生物安全分类器阻断；这是有意设计的结果。分类器的目的，是限制那些会让新手更容易开发已知、可能造成灾难性影响的生物武器的信息。在这里，我们看到模型被用于研究全新化合物，而这些化合物可以同时发展成新疗法或有毒制剂。我们认为，这些案例说明仅靠分类器作为唯一安全层的局限：在高度技术化的军民两用领域，无法可靠识别用户真实意图，因此单一分类器无法同时完整放行有益使用并阻止危害。基于这些知识和观察，我们认为，安全提供前沿生物能力的唯一方式，是将其置于可信用户计划中。\u003c/p\u003e\n","kind":"html","rawMarkdown":"剩余两个案例中的研究者关注的是不可传播的新型毒液和毒素。这类化合物具有重要军民两用属性。例如，肉毒杆菌毒素是一种高度致命物质，多个国家曾把它作为生物武器研究，但今天以极小且精确控制的剂量作为“Botox”，用于治疗偏头痛、痉挛和皱纹。类似地，贝类藻类产生的 saxitoxin 在 1950—60 年代曾被 CIA 储备用作自杀和暗杀制剂，但如今是研究神经信号的重要工具；其近亲河豚毒素 tetrodotoxin 也曾作为癌痛疗法开展试验。\n\n第四个案例中，一名研究人员使用 Claude 建立来自多类有毒动物谱系的毒液毒素肽图谱，并进一步发展成优化毒素特性的生成式流水线。项目有明确治疗目标：开发新的镇痛药、抗抑郁药和其他治疗分子。但图谱同时包含针对镇痛和麻痹靶点的骨架，因此既可以生成新的治疗分子，也可以生成有害化合物。后者源自因可能用作致失能制剂而被 [Australia Group common control list](https://www.dfat.gov.au/publications/minisite/theaustraliagroupnet/site/en/controllists.html)实施出口管制的毒素。研究人员自己也意识到研究的军民两用性质，引用过讨论蛋白质设计双用途风险的期刊文章。此外，针对该地区的国际合规评估对研究人员所关注的特定毒素类别提出过担忧，尤其涉及 AI/ML 在这类毒素的生物武器应用背景下的使用。本案例中，我们还从研究人员与 Claude 分享的信息得知，其成果属于一个国家支持的研究项目。该账号因绕过不受支持地区限制，于 2026 年 5 月被封禁。\n\n第五个案例中，一名研究人员在多个项目中使用 Claude，对一组不同毒素进行计算重设计。与上一案例类似，项目使用许多相同技术工具，大多以治疗用途框定目标，并描述为国家公共研究项目下的优先研究任务。其中还涉及一个细菌毒素亚基，以及一种出血热病毒蛋白；该病毒位于[世界卫生组织 R\u0026D Blueprint](https://www.who.int/teams/blueprint/who-r-and-d-blueprint-for-epidemics)所列、具有最高疫情和大流行威胁的优先疾病名单中。\n\n研究人员与 Claude 共同撰写季度进度报告。值得注意的是，报告刻意隐藏细菌毒素和病毒蛋白的真实身份，研究人员还明确要求 Claude 保持低信息精度。我们在 2026 年 5 月以违反 Anthropic Supported Regions Policy 为由封禁了两个账号。\n\n这两个案例中，研究大体没有被我们的生物安全分类器阻断；这是有意设计的结果。分类器的目的，是限制那些会让新手更容易开发已知、可能造成灾难性影响的生物武器的信息。在这里，我们看到模型被用于研究全新化合物，而这些化合物可以同时发展成新疗法或有毒制剂。我们认为，这些案例说明仅靠分类器作为唯一安全层的局限：在高度技术化的军民两用领域，无法可靠识别用户真实意图，因此单一分类器无法同时完整放行有益使用并阻止危害。基于这些知识和观察，我们认为，安全提供前沿生物能力的唯一方式，是将其置于可信用户计划中。","sourceFormat":"markdown"},"note:sha256:9053cb0b814626965b0b58a45c47ec66448152c48b68795716b52bc70b179a34":{"html":"\u003cp\u003e前文指出，评估与 Benchmark——即在受控环境中测试 AI 模型——只能为 AI 的危险生物用途提供有限而模糊的证据。但出于高度谨慎，我们仍然先采取行动，部署了更强安全措施，并持续改进。\u003c/p\u003e\n\u003cp\u003e这些案例只是我们在平台上发现的潜在高风险活动的一部分。近期，我们对与对抗性国家机构有关的 30 天活动进行了扫描，发现约 35 项彼此独立的研究工作；大多数是普通民用科学，但其中一些具有显著军民两用潜力。正如上述案例所示，这类项目覆盖主题非常广，Claude 提供的帮助也从文档整理一直延伸到真正的研究辅助和加速。随着模型能力继续提高，在高难科学任务上接近或超过专家表现，我们预计其影响会同时在有益和潜在有害场景中继续增长。\u003c/p\u003e\n\u003cp\u003e我们并不把这些案例视为“Claude 已经让生物威胁迫在眉睫”的证据。更准确的解释是：一些值得关注的国家行为者已经参与重大军民两用研究，并且经常通过中继、滥用 ZDR、多模型后备机制以及明确规避分类器等方式绕过访问控制，试图把 Claude 模型纳入这些研究，而且往往知道相关工作具有双用途性质。我们观察到，分类器在设计要限制的领域能够可靠阻断内容（案例 1—2），但越来越广泛的军民两用内容同时对有益和潜在恶意用户都具有很高价值（案例 3—5）。安全开放这些内容，必然需要结合账号和机构信号验证用户合法性，并依赖数据保留所提供的基本可观察性来识别滥用。我们认为，这些是安全提供该领域模型能力所必需的条件，也很受鼓舞地看到行业同行在部署其\u003ca href=\"https://openai.com/index/introducing-gpt-rosalind/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e前沿生物能力\u003c/a\u003e时采取了类似措施。\u003c/p\u003e\n\u003cp\u003e随着 AI 模型被更广泛使用，模型提供商会持续获得关于现实使用的威胁相关可见性，其中一些信息甚至是政府和政府间组织所不具备的。正如案例 5 所示，研究人员可能无意间泄露具有防御价值的秘密，从而帮助理解、准备和防御这一领域的威胁。对军民两用研究活动、优先事项和能力的早期洞察，为倡议、政策行动，乃至最极端情况下的执法行动提供了时间窗口。我们希望公开这些早期观察，可以帮助政府、行业和公众理解风险性质，以及安全部署 AI 模型所需的保护措施。我们认为，这类部署必然需要把两类机制结合起来：用安全过滤器保护最高风险的内容和能力，同时通过可信访问计划允许有益用途获得这些能力。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"前文指出，评估与 Benchmark——即在受控环境中测试 AI 模型——只能为 AI 的危险生物用途提供有限而模糊的证据。但出于高度谨慎，我们仍然先采取行动，部署了更强安全措施，并持续改进。\n\n这些案例只是我们在平台上发现的潜在高风险活动的一部分。近期，我们对与对抗性国家机构有关的 30 天活动进行了扫描，发现约 35 项彼此独立的研究工作；大多数是普通民用科学，但其中一些具有显著军民两用潜力。正如上述案例所示，这类项目覆盖主题非常广，Claude 提供的帮助也从文档整理一直延伸到真正的研究辅助和加速。随着模型能力继续提高，在高难科学任务上接近或超过专家表现，我们预计其影响会同时在有益和潜在有害场景中继续增长。\n\n我们并不把这些案例视为“Claude 已经让生物威胁迫在眉睫”的证据。更准确的解释是：一些值得关注的国家行为者已经参与重大军民两用研究，并且经常通过中继、滥用 ZDR、多模型后备机制以及明确规避分类器等方式绕过访问控制，试图把 Claude 模型纳入这些研究，而且往往知道相关工作具有双用途性质。我们观察到，分类器在设计要限制的领域能够可靠阻断内容（案例 1—2），但越来越广泛的军民两用内容同时对有益和潜在恶意用户都具有很高价值（案例 3—5）。安全开放这些内容，必然需要结合账号和机构信号验证用户合法性，并依赖数据保留所提供的基本可观察性来识别滥用。我们认为，这些是安全提供该领域模型能力所必需的条件，也很受鼓舞地看到行业同行在部署其[前沿生物能力](https://openai.com/index/introducing-gpt-rosalind/)时采取了类似措施。\n\n随着 AI 模型被更广泛使用，模型提供商会持续获得关于现实使用的威胁相关可见性，其中一些信息甚至是政府和政府间组织所不具备的。正如案例 5 所示，研究人员可能无意间泄露具有防御价值的秘密，从而帮助理解、准备和防御这一领域的威胁。对军民两用研究活动、优先事项和能力的早期洞察，为倡议、政策行动，乃至最极端情况下的执法行动提供了时间窗口。我们希望公开这些早期观察，可以帮助政府、行业和公众理解风险性质，以及安全部署 AI 模型所需的保护措施。我们认为，这类部署必然需要把两类机制结合起来：用安全过滤器保护最高风险的内容和能力，同时通过可信访问计划允许有益用途获得这些能力。\n\n[返回顶部](#main)","sourceFormat":"markdown"},"note:sha256:91d6858eb8b427904da0ee09e854c98b20b7b28a48bd5301cad89658bee86001":{"html":"\u003cpre\u003e\u003ccode\u003eScript-host processes (wscript.exe / cscript.exe) connecting to api.telegram[.]org\n\nngrok tunnel egress following new service installation\n\nPayload staging via gofile[.]io\n\nLure brand: \"Azar-News\" (fabricated Farsi news outlet)\n\nM365 token-theft behaviors (for Microsoft 365 defenders)\n\nolk.exe / olkexthost.exe terminated by scripts to unlock credential stores\n\nReads of %LOCALAPPDATA%\\Microsoft\\Olk\\msal_token_cache.bin by non-Outlook processes\n\nCredential Manager enumeration of SSO_POP_User / SSO_POP_Device / Olk/PushNotificationsKey entries\n\nOneAuth / AAD BrokerPlugin package-container token file parsing\n\nToken replay to outlook.office.com/api/v2.0 with spoofed Outlook desktop User-Agent\n\nFirst-party Microsoft client IDs reused from python-scripted traffic\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"```\nScript-host processes (wscript.exe / cscript.exe) connecting to api.telegram[.]org\n\nngrok tunnel egress following new service installation\n\nPayload staging via gofile[.]io\n\nLure brand: \"Azar-News\" (fabricated Farsi news outlet)\n\nM365 token-theft behaviors (for Microsoft 365 defenders)\n\nolk.exe / olkexthost.exe terminated by scripts to unlock credential stores\n\nReads of %LOCALAPPDATA%\\Microsoft\\Olk\\msal_token_cache.bin by non-Outlook processes\n\nCredential Manager enumeration of SSO_POP_User / SSO_POP_Device / Olk/PushNotificationsKey entries\n\nOneAuth / AAD BrokerPlugin package-container token file parsing\n\nToken replay to outlook.office.com/api/v2.0 with spoofed Outlook desktop User-Agent\n\nFirst-party Microsoft client IDs reused from python-scripted traffic\n```\n\n[返回顶部](#main)","sourceFormat":"markdown"},"note:sha256:9210b3e580ad4c8d3441122a73f48905ba45bf3ec99ff600725931b12988a1b7":{"html":"\u003cp\u003e我们还发现 Xiaomi 发起的一场非法蒸馏行动。Xiaomi 把其 MiMo 模型与用户之间的对话和编程会话重放给 Claude，通常经 OpenClaw 和 OpenCode 等编程 Harness 运行。调查并没有显示 Xiaomi 使用 Claude 回答直接服务这些用户，而是保存 Xiaomi 客户与其模型之间的交流。许多交流经第三方模型路由服务传递，而这些服务在美国和欧洲用户中很常见。\u003c/p\u003e\n\u003cp\u003eXiaomi 保存自家用户的完整请求与响应，再把会话通过 Claude 重放，生成可同时用于 SFT 和 RL 的数据。我们观察到超过 40 万条发往 Claude 的请求，经代理服务、跨 1,500 多个账号路由。\u003c/p\u003e\n\u003cp\u003e调查表明，Xiaomi 可能在推出 MiMo-V2-Pro 时设置并延长免费试用期，其目的之一是利用国际开发者使用量激增来蒸馏 Claude 能力。针对 Claude 的大规模蒸馏攻击恰好在试用期即将结束时开始。\u003c/p\u003e\n\u003cp\u003e被转发的流量中包含通过第三方模型路由平台访问 Xiaomi 模型用户的敏感数据。我们没有证据表明美国个人数据被暴露，但这些平台常被美国和欧洲用户使用。发给 Claude 的请求中包含至少十余种语言、数百名 Xiaomi 用户的姓名、联系方式、企业数据和其他敏感信息。\u003c/p\u003e\n\u003cp\u003eXiaomi 的非法蒸馏行动利用 Claude 强化未来模型的训练数据。Claude 被用于根据交流记录重建开发者环境，把多轮对话转成更干净的训练交流，也被用于同时生成输入请求与返回答案，以模仿开发者与模型之间的对话。最后，Xiaomi 还让 Claude 判断部分回答的质量。\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e2026 年 3 月至 4 月的 20 天内归因于 Xiaomi 的蒸馏攻击规模：观察到超过 40 万次交流。\u003c/em\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们还发现 Xiaomi 发起的一场非法蒸馏行动。Xiaomi 把其 MiMo 模型与用户之间的对话和编程会话重放给 Claude，通常经 OpenClaw 和 OpenCode 等编程 Harness 运行。调查并没有显示 Xiaomi 使用 Claude 回答直接服务这些用户，而是保存 Xiaomi 客户与其模型之间的交流。许多交流经第三方模型路由服务传递，而这些服务在美国和欧洲用户中很常见。\n\nXiaomi 保存自家用户的完整请求与响应，再把会话通过 Claude 重放，生成可同时用于 SFT 和 RL 的数据。我们观察到超过 40 万条发往 Claude 的请求，经代理服务、跨 1,500 多个账号路由。\n\n调查表明，Xiaomi 可能在推出 MiMo-V2-Pro 时设置并延长免费试用期，其目的之一是利用国际开发者使用量激增来蒸馏 Claude 能力。针对 Claude 的大规模蒸馏攻击恰好在试用期即将结束时开始。\n\n被转发的流量中包含通过第三方模型路由平台访问 Xiaomi 模型用户的敏感数据。我们没有证据表明美国个人数据被暴露，但这些平台常被美国和欧洲用户使用。发给 Claude 的请求中包含至少十余种语言、数百名 Xiaomi 用户的姓名、联系方式、企业数据和其他敏感信息。\n\nXiaomi 的非法蒸馏行动利用 Claude 强化未来模型的训练数据。Claude 被用于根据交流记录重建开发者环境，把多轮对话转成更干净的训练交流，也被用于同时生成输入请求与返回答案，以模仿开发者与模型之间的对话。最后，Xiaomi 还让 Claude 判断部分回答的质量。\n\n*2026 年 3 月至 4 月的 20 天内归因于 Xiaomi 的蒸馏攻击规模：观察到超过 40 万次交流。*","sourceFormat":"markdown"},"note:sha256:93cb2bf116d5bf0fe05f28840cc66f1099c069e96a5d79a70e86311990291e71":{"html":"\u003cp\u003e操作者经常运行“Agent Swarm”：由一个主 AI Agent 拆分侦察和入侵后任务，再把它们派发给大量并行运行的子 Agent。该行动维护持久的 Campaign Memory。目标列表、收集到的凭据、行动状态和长期指令都会跨工作会话保存，因此每次会话都可以在行动中途恢复，并继续使用此前积累的上下文。该集群还构建并运营一个情报收集平台，无人值守地批量抓取符合国家情报优先级的开源材料，包括公开可访问的军事条令和官方出版物、地区防务报道以及政策来源。\u003c/p\u003e\n","kind":"html","rawMarkdown":"操作者经常运行“Agent Swarm”：由一个主 AI Agent 拆分侦察和入侵后任务，再把它们派发给大量并行运行的子 Agent。该行动维护持久的 Campaign Memory。目标列表、收集到的凭据、行动状态和长期指令都会跨工作会话保存，因此每次会话都可以在行动中途恢复，并继续使用此前积累的上下文。该集群还构建并运营一个情报收集平台，无人值守地批量抓取符合国家情报优先级的开源材料，包括公开可访问的军事条令和官方出版物、地区防务报道以及政策来源。","sourceFormat":"markdown"},"note:sha256:93cedad504091e8c2a60193fa0d06862437806bb87a97528d9a5f20cf28a555e":{"html":"\u003cpre\u003e\u003ccode\u003eC:\\ProgramData\\fontdrivehostServicePackages\\drv3060nt10-69s64mmm\\fontdrivehost.exe (persistence; fake font-driver path)\n\nHKCU Run key \"Whost\" (registry persistence)\n\nScheduled tasks: SECOMS64_AdminTask, Calc_AdminTask, MyTask (RunLevel Highest)\n\ntelegram_listener_v12_2.vbs (VBScript dropper)\n\nSECOMS64 (implant project string)\n\ncom.app.safeguard (Android package; silent contacts/SMS/media exfiltration)\n\n\"Image Processor Pro\" / \"© 2024 Adobe - ImagePro Systems Inc\" (fake-app disguise strings)\n\nExecutable named \"Telegram\" with tel.ico (screenshot-exfil component disguise)\n\nCloud exfiltration\n\u003c/code\u003e\u003c/pre\u003e\n","kind":"html","rawMarkdown":"```\nC:\\ProgramData\\fontdrivehostServicePackages\\drv3060nt10-69s64mmm\\fontdrivehost.exe (persistence; fake font-driver path)\n\nHKCU Run key \"Whost\" (registry persistence)\n\nScheduled tasks: SECOMS64_AdminTask, Calc_AdminTask, MyTask (RunLevel Highest)\n\ntelegram_listener_v12_2.vbs (VBScript dropper)\n\nSECOMS64 (implant project string)\n\ncom.app.safeguard (Android package; silent contacts/SMS/media exfiltration)\n\n\"Image Processor Pro\" / \"© 2024 Adobe - ImagePro Systems Inc\" (fake-app disguise strings)\n\nExecutable named \"Telegram\" with tel.ico (screenshot-exfil component disguise)\n\nCloud exfiltration\n```","sourceFormat":"markdown"},"note:sha256:94069c1be55a0daf5ba9b30556a238eb1762df48eb777d1640ce5ecd8a92f863":{"html":"\u003cp\u003e该行动在很短时间内搭建 Web 基础设施：2025 年中期约十周内，从法国集中注册这些域名，并把所有站点托管在一个共享部署之上。这让调查人员能够把表面看似独立的约 70 个新闻网站，关联到同一个操作者账号。\u003c/p\u003e\n\u003cp\u003e网络使用 Claude 建立标准化内容流水线。所有 Prompt 都要求固定 JSON 输出结构、格式化 HTML、精确字符数，以及每篇文章包含三到四个内部链接。借此，操作者可以自动化大规模生成和发布内容。这些文章还被专门设计来提升站点在搜索引擎中的权威度排名。\u003c/p\u003e\n\u003cp\u003e我们发现该行动反复使用三种操纵策略：把同一来源故事分别改写成相反意识形态版本，面向不同受众；给原本不带政治色彩的故事加入政治角度；以及把故事跨国“洗”到无关地区，同时去除原始语境。\u003c/p\u003e\n\u003cp\u003e为了让文章显得真实，操作者使用虚假记者姓名作为署名。调查确认这些作者实际上并不存在。\u003c/p\u003e\n\u003cp\u003e这些虚构署名让每个站点看起来都像拥有独立员工的本地新闻编辑部。网络还为每个虚假媒体配套一个 X（原 Twitter）账号，随后再由一层评论账号放大。这些评论账号与网站几乎在同一时间段创建，很多使用 AI 生成头像；大多数虚假账号创建于 2025 年 6 月和 7 月。\u003c/p\u003e\n\u003cp\u003e2025 年 9 月 11 日，我们检测到明显协同式虚假行为：多个网络网站在三分钟内发布几乎相同的 DRC—卢旺达冲突文章。操作者会根据不同地区受众调整语气，同时协调多个 X 账号分发这些链接。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fb518031942512c47b27b5a0c65d67c509318c867-1990x704.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 2. 使用 AI 生成头像的虚假评论账号样本，来自该网络在 2025 年 6—7 月创建的 250 多个账号。\u003c/p\u003e\n","kind":"html","rawMarkdown":"该行动在很短时间内搭建 Web 基础设施：2025 年中期约十周内，从法国集中注册这些域名，并把所有站点托管在一个共享部署之上。这让调查人员能够把表面看似独立的约 70 个新闻网站，关联到同一个操作者账号。\n\n网络使用 Claude 建立标准化内容流水线。所有 Prompt 都要求固定 JSON 输出结构、格式化 HTML、精确字符数，以及每篇文章包含三到四个内部链接。借此，操作者可以自动化大规模生成和发布内容。这些文章还被专门设计来提升站点在搜索引擎中的权威度排名。\n\n我们发现该行动反复使用三种操纵策略：把同一来源故事分别改写成相反意识形态版本，面向不同受众；给原本不带政治色彩的故事加入政治角度；以及把故事跨国“洗”到无关地区，同时去除原始语境。\n\n为了让文章显得真实，操作者使用虚假记者姓名作为署名。调查确认这些作者实际上并不存在。\n\n这些虚构署名让每个站点看起来都像拥有独立员工的本地新闻编辑部。网络还为每个虚假媒体配套一个 X（原 Twitter）账号，随后再由一层评论账号放大。这些评论账号与网站几乎在同一时间段创建，很多使用 AI 生成头像；大多数虚假账号创建于 2025 年 6 月和 7 月。\n\n2025 年 9 月 11 日，我们检测到明显协同式虚假行为：多个网络网站在三分钟内发布几乎相同的 DRC—卢旺达冲突文章。操作者会根据不同地区受众调整语气，同时协调多个 X 账号分发这些链接。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fb518031942512c47b27b5a0c65d67c509318c867-1990x704.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 2. 使用 AI 生成头像的虚假评论账号样本，来自该网络在 2025 年 6—7 月创建的 250 多个账号。","sourceFormat":"markdown"},"note:sha256:963ce6979db826bb0b1aea40e0864cac54b80c2ca2a759ae6ac12c6b393ee4af":{"html":"\u003cpre\u003e\u003ccode\u003eCVE-2022-22707, CVE-2019-11072, CVE-2018-19052 (COBHAM SAILOR 900 VSAT)\nCVE-2025-20309 (Cisco Unified Communications Manager)\nCVE-2024-20418 (Cisco Ultra-Reliable Wireless Backhaul)\nCVE-2024-20354 (Cisco IW3702)\nCVE-2024-2658 (Schneider Electric EcoStruxure)\n\u003c/code\u003e\u003c/pre\u003e\n","kind":"html","rawMarkdown":"```\nCVE-2022-22707, CVE-2019-11072, CVE-2018-19052 (COBHAM SAILOR 900 VSAT)\nCVE-2025-20309 (Cisco Unified Communications Manager)\nCVE-2024-20418 (Cisco Ultra-Reliable Wireless Backhaul)\nCVE-2024-20354 (Cisco IW3702)\nCVE-2024-2658 (Schneider Electric EcoStruxure)\n```","sourceFormat":"markdown"},"note:sha256:979dcc20a8dd4c5d5e4fa8580628bfd609f0cc32669be4039d5f14c262355917":{"html":"\u003cp\u003e我们封禁了相关账号，把调查发现纳入安全措施以防止未来滥用，并酌情与公共和私营部门伙伴共享发现，以阻断相关行动。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们封禁了相关账号，把调查发现纳入安全措施以防止未来滥用，并酌情与公共和私营部门伙伴共享发现，以阻断相关行动。","sourceFormat":"markdown"},"note:sha256:990852f1f785834358f8c718cf062ab7d76f77279363e47d0e8c9b15ef362352":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e主题\u003c/th\u003e\n\u003cth\u003e报告给出的核心证据或观察\u003c/th\u003e\n\u003cth\u003e阅读时需要保留的边界\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e案例代表性\u003c/td\u003e\n\u003ctd\u003e报告选择的是“最显著、最新颖”的威胁活动\u003c/td\u003e\n\u003ctd\u003e不应把这些案例当作 AI 滥用的总体发生率或普通用户行为样本\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e“AI 增益（uplift）”\u003c/td\u003e\n\u003ctd\u003e主要从\u003cstrong\u003e速度、规模、深度\u003c/strong\u003e观察 AI 相比无 AI 时带来的能力提升\u003c/td\u003e\n\u003ctd\u003e报告中的 uplift 多为案例分析与威胁情报判断，并非统一实验条件下的量化因果测量\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAgent 自主性\u003c/td\u003e\n\u003ctd\u003e多个案例出现多 Agent、定时任务、自动重构、自动侦察和外传\u003c/td\u003e\n\u003ctd\u003e人类仍普遍保留目标选择、结果审阅、变现、现实行动等关键决策；“自主”与“危害严重度”是不同维度\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e网络攻击创新\u003c/td\u003e\n\u003ctd\u003e多数底层手法并不新：凭据、钓鱼、暴露服务、SQL 注入等依旧重要\u003c/td\u003e\n\u003ctd\u003e更值得关注的是自动化改变了单位攻击成本、并行能力和可持续运营能力\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e影响力行动\u003c/td\u003e\n\u003ctd\u003eAI 帮助批量生成、翻译、本地化、伪装身份和运行内容流水线\u003c/td\u003e\n\u003ctd\u003e内容产量或账号规模不等于真实说服力；多个案例的外部触达和影响无法确认\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e监控与压制\u003c/td\u003e\n\u003ctd\u003eAI 被用于批量分析社交内容、建立个人画像、评估脆弱点、支持招募或行动准备\u003c/td\u003e\n\u003ctd\u003e部分归因与最终客户判断带有不同置信度，应保留报告原有的概率与限定语\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e武器与生物风险\u003c/td\u003e\n\u003ctd\u003eAI 可协助规格设计、软件开发、仿真、采购、情报收集和研究规划\u003c/td\u003e\n\u003ctd\u003e报告多次区分知识/工程增益与现实武器、实验或部署成功，不能从“使用 Claude”直接推断成果已实现\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e非法蒸馏\u003c/td\u003e\n\u003ctd\u003eAnthropic 称发现多个针对 Opus 级模型的未授权能力提取活动\u003c/td\u003e\n\u003ctd\u003e涉及具体实验室的归因、用户请求转发方式与隐私影响，均应按报告陈述理解，而非超出证据范围外推\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e数据与来源\u003c/td\u003e\n\u003ctd\u003e文中包含大量 IOC、IP、域名、账号、基础设施与案例编号\u003c/td\u003e\n\u003ctd\u003e这些机器可读指标应原样保留，用于威胁情报语境；不应把其中的存在本身理解为对所有相关主体的泛化判断\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n","kind":"html","rawMarkdown":"| 主题 | 报告给出的核心证据或观察 | 阅读时需要保留的边界 |\n| --- | --- | --- |\n| 案例代表性 | 报告选择的是“最显著、最新颖”的威胁活动 | 不应把这些案例当作 AI 滥用的总体发生率或普通用户行为样本 |\n| “AI 增益（uplift）” | 主要从**速度、规模、深度**观察 AI 相比无 AI 时带来的能力提升 | 报告中的 uplift 多为案例分析与威胁情报判断，并非统一实验条件下的量化因果测量 |\n| Agent 自主性 | 多个案例出现多 Agent、定时任务、自动重构、自动侦察和外传 | 人类仍普遍保留目标选择、结果审阅、变现、现实行动等关键决策；“自主”与“危害严重度”是不同维度 |\n| 网络攻击创新 | 多数底层手法并不新：凭据、钓鱼、暴露服务、SQL 注入等依旧重要 | 更值得关注的是自动化改变了单位攻击成本、并行能力和可持续运营能力 |\n| 影响力行动 | AI 帮助批量生成、翻译、本地化、伪装身份和运行内容流水线 | 内容产量或账号规模不等于真实说服力；多个案例的外部触达和影响无法确认 |\n| 监控与压制 | AI 被用于批量分析社交内容、建立个人画像、评估脆弱点、支持招募或行动准备 | 部分归因与最终客户判断带有不同置信度，应保留报告原有的概率与限定语 |\n| 武器与生物风险 | AI 可协助规格设计、软件开发、仿真、采购、情报收集和研究规划 | 报告多次区分知识/工程增益与现实武器、实验或部署成功，不能从“使用 Claude”直接推断成果已实现 |\n| 非法蒸馏 | Anthropic 称发现多个针对 Opus 级模型的未授权能力提取活动 | 涉及具体实验室的归因、用户请求转发方式与隐私影响，均应按报告陈述理解，而非超出证据范围外推 |\n| 数据与来源 | 文中包含大量 IOC、IP、域名、账号、基础设施与案例编号 | 这些机器可读指标应原样保留，用于威胁情报语境；不应把其中的存在本身理解为对所有相关主体的泛化判断 |","sourceFormat":"markdown"},"note:sha256:99b4af517e7619dcc23dccf8d755e660f8fa3ec2447a57e1f6332c509866dbbe":{"html":"\u003cp\u003e我们通过内部调查识别这些账号，封禁了与三场行动相关的账号，并与产业和研究伙伴共享相关指标。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e类型 / 备注\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e归属机构\u003c/td\u003e\n\u003ctd\u003eIslamic Culture and Communications Organization（ICCO）及其 International Quran and Propagation Center，隶属文化与伊斯兰指导部；Khorasan Razavi Islamic Propaganda Office 与 Shahid Hasheminejad Cultural Technology House（Mashhad）；Islamic Propaganda Organization 及其 Bina Cultural Observatory\u003c/td\u003e\n\u003ctd\u003e机构\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eICCO 项目组合\u003c/td\u003e\n\u003ctd\u003e项目代码 A-01 至 B-04；注明 ICCO 和 IQPC 的文档页脚；人为制造草根感的 #IranStands 标签\u003c/td\u003e\n\u003ctd\u003e项目代码、页脚、标签\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMashhad 内容工厂\u003c/td\u003e\n\u003ctd\u003e内部命名 Manjanegh（Catapult）、Mashe（Trigger）、Chashni（Primer）；私人 Eitaa 频道“Monjaneq”；付费放大，包括 IRGC 关联频道 @hamyane_sepah 与 @moghavematnews_iran\u003c/td\u003e\n\u003ctd\u003e代号、频道\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBina\u003c/td\u003e\n\u003ctd\u003e冒充 IRGC 发言人；Bina Monitoring Center 的 Telegram 与 Instagram 频道\u003c/td\u003e\n\u003ctd\u003e频道、冒充\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 8. 三场伊朗国家关联行动的指标：归属机构、项目代码、内容工厂代号和放大渠道。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们通过内部调查识别这些账号，封禁了与三场行动相关的账号，并与产业和研究伙伴共享相关指标。\n\n| **类别** | **指标** | **类型 / 备注** |\n| --- | --- | --- |\n| 归属机构 | Islamic Culture and Communications Organization（ICCO）及其 International Quran and Propagation Center，隶属文化与伊斯兰指导部；Khorasan Razavi Islamic Propaganda Office 与 Shahid Hasheminejad Cultural Technology House（Mashhad）；Islamic Propaganda Organization 及其 Bina Cultural Observatory | 机构 |\n| ICCO 项目组合 | 项目代码 A-01 至 B-04；注明 ICCO 和 IQPC 的文档页脚；人为制造草根感的 #IranStands 标签 | 项目代码、页脚、标签 |\n| Mashhad 内容工厂 | 内部命名 Manjanegh（Catapult）、Mashe（Trigger）、Chashni（Primer）；私人 Eitaa 频道“Monjaneq”；付费放大，包括 IRGC 关联频道 @hamyane_sepah 与 @moghavematnews_iran | 代号、频道 |\n| Bina | 冒充 IRGC 发言人；Bina Monitoring Center 的 Telegram 与 Instagram 频道 | 频道、冒充 |\n\n表 8. 三场伊朗国家关联行动的指标：归属机构、项目代码、内容工厂代号和放大渠道。","sourceFormat":"markdown"},"note:sha256:9b5953f1d41d81b0e975918dbeaee58042ffb2cdfcb149770044577f7aa07590":{"html":"\u003cp\u003e2026 年 5 月，我们的生物安全分类器阻止了一项请求：用户要求 Claude 协助撰写科研资助申请。申请所述工作涉及对\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/chikungunya\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e基孔肯雅病毒（chikungunya virus）\u003c/a\u003e进行功能获得研究，也就是通过遗传改变使生物体获得新的或增强的生物属性；研究目标是病毒传播能力和免疫逃逸特性。\u003c/p\u003e\n\u003cp\u003e基孔肯雅病毒由蚊媒传播，会造成严重疼痛、发热等使人失能的症状，可能持续数周或数月，目前没有获批治疗方法。由于它本身就会自然传播，如果被故意释放作为生物武器，也很难与自然疫情区分。该申请希望识别能增强病毒特性的突变，把这些突变工程化到感染性克隆中，再通过\u003cem\u003e体内\u003c/em\u003e选择提高毒力。换言之，病毒会反复感染活体动物，每一轮研究人员都保留致病性最强的变体，使病毒逐渐变得更有害。这类研究当然可能用于开发更好的疫苗和疗法，但同样可能被用于把病原体变得更危险。\u003c/p\u003e\n\u003cp\u003e我们倾向于认为该研究并非完全无害，原因之一是资助申请对应的机构归属本身也令人担忧。申请中的信息表明研究由民用科研人员开展，但计划在军事研究机构中执行。\u003c/p\u003e\n\u003cp\u003e内容与机构归属叠加后足够引起关注，因此即使生物安全分类器已经阻断了相关请求的全部交流，我们仍在初次审查后进一步开展威胁调查。\u003c/p\u003e\n\u003cp\u003e调查发现，这类请求通常会通过一个为数十名生命科学研究者提供服务的 LLM 平台转发，其中许多人是与多个民用和军事机构有关的病毒学家。开展这些研究的国家位于 Anthropic \u003ca href=\"https://www.anthropic.com/supported-countries\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e不提供服务\u003c/a\u003e的地区，因此平台通过美国基础设施隧道转发流量，绕过地域封锁，并使用零数据保留（ZDR）服务隐藏内容。平台开发者还通过灰色市场转售商和 ZDR 通道之外的合成账号调用 Claude 来支持平台开发，并明确把学术研究者称为对安全分类器阻断非常敏感的客户。为了改善这些科研客户的使用体验，开发者又实现了后备机制：把 Claude 拒绝回答的敏感请求转发给竞争对手更宽松的模型。\u003c/p\u003e\n\u003cp\u003e我们把这些发现解读为两点证据：第一，这些设施中确实存在高度令人担忧的功能获得研究；第二，与这些研究有关的病毒学家对使用美国前沿 AI 模型有明确兴趣。更进一步，这些研究人员还是转售平台重点服务的重要客户；这些平台既提供对美国前沿模型的隐蔽访问，也提供绕过前沿模型安全机制的方法。\u003c/p\u003e\n\u003cp\u003e2026 年 5 月调查结束时，我们封禁了所有相关账号，与伙伴合作关闭绕过地域限制的中继网络，并把发现分享给受影响的 AI 实验室和政府机构。运营者数天内就重新建立访问，数周后又使用注册在全新身份下的消费级模型订阅继续开发平台；平台最终用户则继续通过 ZDR 合作伙伴访问我们的模型。\u003c/p\u003e\n\u003cp\u003e中间阶段的活动让早期发现更加清晰。第一，平台开发者修改服务，把生物学提示转发给其他更宽松的模型；预部署测试会把通常会被 Claude 拒绝的违规提示送入服务，如果它们错误地到达 Claude 而不是更宽松模型，测试就会失败。大量这部分代码还是由 Claude 编写的，对模型的表述则是“降低过度拒绝”。第二，基孔肯雅研究继续推进，Claude 为研究输出提供编辑协助。这些材料刻意用“生物功能丧失”而不是“功能增强”的措辞描述病毒改造。基于这些研究材料的存在，我们推断该研究并非停留在一份资助申请。我们持续封禁与该活动集群相关的账号，并继续把调查发现纳入新的检测与防护措施。\u003c/p\u003e\n","kind":"html","rawMarkdown":"2026 年 5 月，我们的生物安全分类器阻止了一项请求：用户要求 Claude 协助撰写科研资助申请。申请所述工作涉及对[基孔肯雅病毒（chikungunya virus）](https://www.who.int/news-room/fact-sheets/detail/chikungunya)进行功能获得研究，也就是通过遗传改变使生物体获得新的或增强的生物属性；研究目标是病毒传播能力和免疫逃逸特性。\n\n基孔肯雅病毒由蚊媒传播，会造成严重疼痛、发热等使人失能的症状，可能持续数周或数月，目前没有获批治疗方法。由于它本身就会自然传播，如果被故意释放作为生物武器，也很难与自然疫情区分。该申请希望识别能增强病毒特性的突变，把这些突变工程化到感染性克隆中，再通过*体内*选择提高毒力。换言之，病毒会反复感染活体动物，每一轮研究人员都保留致病性最强的变体，使病毒逐渐变得更有害。这类研究当然可能用于开发更好的疫苗和疗法，但同样可能被用于把病原体变得更危险。\n\n我们倾向于认为该研究并非完全无害，原因之一是资助申请对应的机构归属本身也令人担忧。申请中的信息表明研究由民用科研人员开展，但计划在军事研究机构中执行。\n\n内容与机构归属叠加后足够引起关注，因此即使生物安全分类器已经阻断了相关请求的全部交流，我们仍在初次审查后进一步开展威胁调查。\n\n调查发现，这类请求通常会通过一个为数十名生命科学研究者提供服务的 LLM 平台转发，其中许多人是与多个民用和军事机构有关的病毒学家。开展这些研究的国家位于 Anthropic [不提供服务](https://www.anthropic.com/supported-countries)的地区，因此平台通过美国基础设施隧道转发流量，绕过地域封锁，并使用零数据保留（ZDR）服务隐藏内容。平台开发者还通过灰色市场转售商和 ZDR 通道之外的合成账号调用 Claude 来支持平台开发，并明确把学术研究者称为对安全分类器阻断非常敏感的客户。为了改善这些科研客户的使用体验，开发者又实现了后备机制：把 Claude 拒绝回答的敏感请求转发给竞争对手更宽松的模型。\n\n我们把这些发现解读为两点证据：第一，这些设施中确实存在高度令人担忧的功能获得研究；第二，与这些研究有关的病毒学家对使用美国前沿 AI 模型有明确兴趣。更进一步，这些研究人员还是转售平台重点服务的重要客户；这些平台既提供对美国前沿模型的隐蔽访问，也提供绕过前沿模型安全机制的方法。\n\n2026 年 5 月调查结束时，我们封禁了所有相关账号，与伙伴合作关闭绕过地域限制的中继网络，并把发现分享给受影响的 AI 实验室和政府机构。运营者数天内就重新建立访问，数周后又使用注册在全新身份下的消费级模型订阅继续开发平台；平台最终用户则继续通过 ZDR 合作伙伴访问我们的模型。\n\n中间阶段的活动让早期发现更加清晰。第一，平台开发者修改服务，把生物学提示转发给其他更宽松的模型；预部署测试会把通常会被 Claude 拒绝的违规提示送入服务，如果它们错误地到达 Claude 而不是更宽松模型，测试就会失败。大量这部分代码还是由 Claude 编写的，对模型的表述则是“降低过度拒绝”。第二，基孔肯雅研究继续推进，Claude 为研究输出提供编辑协助。这些材料刻意用“生物功能丧失”而不是“功能增强”的措辞描述病毒改造。基于这些研究材料的存在，我们推断该研究并非停留在一份资助申请。我们持续封禁与该活动集群相关的账号，并继续把调查发现纳入新的检测与防护措施。","sourceFormat":"markdown"},"note:sha256:9b8f8b956840239ab606d022ad02339773d4f99c7f22e60128df812a2c6f998d":{"blocks":[{"children":[],"kind":"leaf","title":"最常见、反复出现的目标，是乌克兰政府、军方和外交人员。该行为者扫描了二十多个乌克兰政府机构的电子邮件服务和远程访问系统。"},{"children":[],"kind":"leaf","title":"另一个持续出现的窃取目标是无人机供应链技术。该行为者批量导出了至少两家无人机零部件制造商的邮箱，攻击一家军用无人机制造商，并窃取了一套无人机视觉系统完整的专有软件开发工具包。他们花费数天逆向分析该无人机视觉系统，恢复出产品架构、硬件物料清单、供应商依赖以及一款尚未发布产品的细节。军用无人机控制和 AI 视觉相关固件似乎尤其受到关注。"},{"children":[],"kind":"leaf","title":"目标并不总是被直接攻击。为间接接近真正目标，该行为者攻陷了至少三家运营酒店住客 Wi‑Fi 的酒店服务供应商。他们使用被盗管理员凭据修改 DNS 记录，使其指向攻击者控制的服务，这种技术称为 DNS 劫持。使用这些供应商服务的酒店住客一旦连接 Wi‑Fi，其网络流量、设备标识符和 IP 地址就会被发送到攻击者服务器。随后，攻击者部署 ClickFix 风格诱饵，向受害者设备投递 Windows、Android 和 iOS 恶意软件。攻击者还能把从酒店管理系统窃取的住客信息，与个人设备中窃取的数据结合起来，进一步聚焦目标。其中尤其受关注的是与乌克兰有关的人员，包括政府官员和无人机制造商。需要指出的是，2026 年 7 月，Microsoft Threat Intelligence 发布了一份关于此处所用窃取与恶意软件投递方式的报告，并将其称为 CaptiveCrunch。"},{"children":[],"kind":"leaf","title":"该行为者还接管受害者的 WhatsApp 账号，使用一套无头浏览器平台把受害者账号作为伴随设备连接。部分依赖开源 WhatsApp 自动化库 WPPConnect，其配置关闭了已读回执，使受害者在大量俄语和乌克兰语对话被批量导出时不易察觉。至少两名前乌克兰高级官员以这种方式遭到针对。"},{"children":[],"kind":"leaf","title":"该行为者也攻击监控平台。他们在摄像头流媒体服务的应用接口中发现授权缺陷，并据此枚举用户、收集令牌，从而获得受害者实时摄像头视频流的访问权限。"},{"children":[],"kind":"leaf","title":"同一行为者还入侵了一个北非政府技术机构。他们窃取了一台 VPN 设备的凭据，并利用这些凭据接管该机构的中央账号服务器，由此外传了完整凭据数据库：其中包括超过 30 万条国家身份记录，以及该国超过 50 万家企业的商业登记数据。"},{"children":[],"kind":"leaf","title":"该行为者持续开发一套云端邮件间谍平台，其中部分使用“Embassy Kit”——一套管理设备代码钓鱼的框架——实施 Microsoft 365 Token 窃取行动。该平台用于针对外交和政府人员，最终访问并外传了至少八个组织的邮件记录，其中包括一个国家检察机构、一所军事教育机构和一个区域性政府间组织。"},{"children":[],"kind":"leaf","title":"Windows 凭据窃取程序通过“虚假更新”主题的社会工程诱饵投递，同时附带具备完整远程访问能力的配套载荷。这些载荷被设计为冻结受害机器的安全更新，这意味着安全厂商发布的新恶意软件检测签名不会被受害设备获取或执行。"},{"children":[{"title":"**侦察：** 使用 AI 识别邮件和远程访问系统特征，并从公开来源收集信息，为钓鱼构建目标清单。"},{"title":"**初始访问：** 使用 AI 构建并运营执行网络入侵行动的平台。该行动主要使用一种“设备代码钓鱼”，滥用云邮件服务的合法登录流程（更多细节参见 Microsoft 的[这篇文章](https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/)）。行为者用 AI 搭建钓鱼基础设施和利用工具，并在其指挥下让 AI 直接执行部分入侵，包括对受害系统运行命令、收集凭据和横向移动。"},{"title":"**收集与外传：** 使用 AI 提取并整理数百 GB 被盗数据；部分案例通过从已攻陷邮箱批量导出来完成外传。"},{"title":"**维持访问：** 通过自动把攻击者控制的设备注册到受害组织租户中，协助维持对被攻陷账号和租户的访问。"}],"kind":"section","title":"该行为者在行动的每个环节都使用了 AI"},{"children":[],"kind":"leaf","title":"在本地部署环境中，该行为者使用 AI 监控植入程序的隐蔽性与持久化能力。当植入程序被安全产品标记后，攻击者会使用 Claude 系统性识别、修改并重新部署被检测到的制品。"},{"children":[],"kind":"leaf","title":"上述变化的结果，是 AI 把成本压力重新反向推给了防御方。过去，防御者或许可以通过部署新的检测规则拖慢攻击节奏；现在，至少从理论上说，有能力的对手可以“闭合循环”，以比防御者开发和部署新检测更快的速度绕过传统安全检测。"},{"children":[{"title":"Windows 恶意软件：PowerChrome、WUEngine、Shadow C2、MiniPlasma、CloudSyncSvc；"},{"title":"Android 恶意软件：GiftDrop，一款重新包装的 GiftsExpress Android 监控 RAT；"},{"title":"iOS 恶意软件：DarkSword，一条 iOS 漏洞利用链。"}],"kind":"section","title":"该行为者使用的恶意软件包括"}],"html":"\u003cp\u003e最常见、反复出现的目标，是乌克兰政府、军方和外交人员。该行为者扫描了二十多个乌克兰政府机构的电子邮件服务和远程访问系统。\u003c/p\u003e\n\u003cp\u003e另一个持续出现的窃取目标是无人机供应链技术。该行为者批量导出了至少两家无人机零部件制造商的邮箱，攻击一家军用无人机制造商，并窃取了一套无人机视觉系统完整的专有软件开发工具包。他们花费数天逆向分析该无人机视觉系统，恢复出产品架构、硬件物料清单、供应商依赖以及一款尚未发布产品的细节。军用无人机控制和 AI 视觉相关固件似乎尤其受到关注。\u003c/p\u003e\n\u003cp\u003e目标并不总是被直接攻击。为间接接近真正目标，该行为者攻陷了至少三家运营酒店住客 Wi‑Fi 的酒店服务供应商。他们使用被盗管理员凭据修改 DNS 记录，使其指向攻击者控制的服务，这种技术称为 DNS 劫持。使用这些供应商服务的酒店住客一旦连接 Wi‑Fi，其网络流量、设备标识符和 IP 地址就会被发送到攻击者服务器。随后，攻击者部署 \u003ca href=\"https://en.wikipedia.org/wiki/ClickFix\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eClickFix\u003c/a\u003e 风格诱饵，向受害者设备投递 Windows、Android 和 iOS 恶意软件。攻击者还能把从酒店管理系统窃取的住客信息，与个人设备中窃取的数据结合起来，进一步聚焦目标。其中尤其受关注的是与乌克兰有关的人员，包括政府官员和无人机制造商。需要指出的是，2026 年 7 月，Microsoft Threat Intelligence 发布了一份关于此处所用窃取与恶意软件投递方式的报告，并将其称为 \u003ca href=\"https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCaptiveCrunch\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e该行为者还接管受害者的 WhatsApp 账号，使用一套\u003ca href=\"https://en.wikipedia.org/wiki/Headless_browser\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e无头浏览器\u003c/a\u003e平台把受害者账号作为伴随设备连接。部分依赖开源 WhatsApp 自动化库 \u003ca href=\"https://github.com/wppconnect-team/wppconnect\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eWPPConnect\u003c/a\u003e，其配置关闭了已读回执，使受害者在大量俄语和乌克兰语对话被批量导出时不易察觉。至少两名前乌克兰高级官员以这种方式遭到针对。\u003c/p\u003e\n\u003cp\u003e该行为者也攻击监控平台。他们在摄像头流媒体服务的应用接口中发现授权缺陷，并据此枚举用户、收集令牌，从而获得受害者实时摄像头视频流的访问权限。\u003c/p\u003e\n\u003cp\u003e同一行为者还入侵了一个北非政府技术机构。他们窃取了一台 VPN 设备的凭据，并利用这些凭据接管该机构的中央账号服务器，由此外传了完整凭据数据库：其中包括超过 30 万条国家身份记录，以及该国超过 50 万家企业的商业登记数据。\u003c/p\u003e\n\u003cp\u003e该行为者持续开发一套云端邮件间谍平台，其中部分使用“Embassy Kit”——一套管理设备代码钓鱼的框架——实施 Microsoft 365 Token 窃取行动。该平台用于针对外交和政府人员，最终访问并外传了至少八个组织的邮件记录，其中包括一个国家检察机构、一所军事教育机构和一个区域性政府间组织。\u003c/p\u003e\n\u003cp\u003eWindows 凭据窃取程序通过“虚假更新”主题的社会工程诱饵投递，同时附带具备完整远程访问能力的配套载荷。这些载荷被设计为冻结受害机器的安全更新，这意味着安全厂商发布的新恶意软件检测签名不会被受害设备获取或执行。\u003c/p\u003e\n\u003cp\u003e该行为者在行动的每个环节都使用了 AI：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e侦察：\u003c/strong\u003e 使用 AI 识别邮件和远程访问系统特征，并从公开来源收集信息，为钓鱼构建目标清单。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e初始访问：\u003c/strong\u003e 使用 AI 构建并运营执行网络入侵行动的平台。该行动主要使用一种“设备代码钓鱼”，滥用云邮件服务的合法登录流程（更多细节参见 Microsoft 的\u003ca href=\"https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e这篇文章\u003c/a\u003e）。行为者用 AI 搭建钓鱼基础设施和利用工具，并在其指挥下让 AI 直接执行部分入侵，包括对受害系统运行命令、收集凭据和横向移动。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e收集与外传：\u003c/strong\u003e 使用 AI 提取并整理数百 GB 被盗数据；部分案例通过从已攻陷邮箱批量导出来完成外传。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e维持访问：\u003c/strong\u003e 通过自动把攻击者控制的设备注册到受害组织租户中，协助维持对被攻陷账号和租户的访问。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e在本地部署环境中，该行为者使用 AI 监控植入程序的隐蔽性与持久化能力。当植入程序被安全产品标记后，攻击者会使用 Claude 系统性识别、修改并重新部署被检测到的制品。\u003c/p\u003e\n\u003cp\u003e上述变化的结果，是 AI 把成本压力重新反向推给了防御方。过去，防御者或许可以通过部署新的检测规则拖慢攻击节奏；现在，至少从理论上说，有能力的对手可以“闭合循环”，以比防御者开发和部署新检测更快的速度绕过传统安全检测。\u003c/p\u003e\n\u003cp\u003e该行为者使用的恶意软件包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWindows 恶意软件：PowerChrome、WUEngine、Shadow C2、MiniPlasma、CloudSyncSvc；\u003c/li\u003e\n\u003cli\u003eAndroid 恶意软件：GiftDrop，一款重新包装的 GiftsExpress Android 监控 RAT；\u003c/li\u003e\n\u003cli\u003eiOS 恶意软件：DarkSword，一条 iOS 漏洞利用链。\u003c/li\u003e\n\u003c/ul\u003e\n","kind":"structured","rawMarkdown":"最常见、反复出现的目标，是乌克兰政府、军方和外交人员。该行为者扫描了二十多个乌克兰政府机构的电子邮件服务和远程访问系统。\n\n另一个持续出现的窃取目标是无人机供应链技术。该行为者批量导出了至少两家无人机零部件制造商的邮箱，攻击一家军用无人机制造商，并窃取了一套无人机视觉系统完整的专有软件开发工具包。他们花费数天逆向分析该无人机视觉系统，恢复出产品架构、硬件物料清单、供应商依赖以及一款尚未发布产品的细节。军用无人机控制和 AI 视觉相关固件似乎尤其受到关注。\n\n目标并不总是被直接攻击。为间接接近真正目标，该行为者攻陷了至少三家运营酒店住客 Wi‑Fi 的酒店服务供应商。他们使用被盗管理员凭据修改 DNS 记录，使其指向攻击者控制的服务，这种技术称为 DNS 劫持。使用这些供应商服务的酒店住客一旦连接 Wi‑Fi，其网络流量、设备标识符和 IP 地址就会被发送到攻击者服务器。随后，攻击者部署 [ClickFix](https://en.wikipedia.org/wiki/ClickFix) 风格诱饵，向受害者设备投递 Windows、Android 和 iOS 恶意软件。攻击者还能把从酒店管理系统窃取的住客信息，与个人设备中窃取的数据结合起来，进一步聚焦目标。其中尤其受关注的是与乌克兰有关的人员，包括政府官员和无人机制造商。需要指出的是，2026 年 7 月，Microsoft Threat Intelligence 发布了一份关于此处所用窃取与恶意软件投递方式的报告，并将其称为 [CaptiveCrunch](https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/)。\n\n该行为者还接管受害者的 WhatsApp 账号，使用一套[无头浏览器](https://en.wikipedia.org/wiki/Headless_browser)平台把受害者账号作为伴随设备连接。部分依赖开源 WhatsApp 自动化库 [WPPConnect](https://github.com/wppconnect-team/wppconnect)，其配置关闭了已读回执，使受害者在大量俄语和乌克兰语对话被批量导出时不易察觉。至少两名前乌克兰高级官员以这种方式遭到针对。\n\n该行为者也攻击监控平台。他们在摄像头流媒体服务的应用接口中发现授权缺陷，并据此枚举用户、收集令牌，从而获得受害者实时摄像头视频流的访问权限。\n\n同一行为者还入侵了一个北非政府技术机构。他们窃取了一台 VPN 设备的凭据，并利用这些凭据接管该机构的中央账号服务器，由此外传了完整凭据数据库：其中包括超过 30 万条国家身份记录，以及该国超过 50 万家企业的商业登记数据。\n\n该行为者持续开发一套云端邮件间谍平台，其中部分使用“Embassy Kit”——一套管理设备代码钓鱼的框架——实施 Microsoft 365 Token 窃取行动。该平台用于针对外交和政府人员，最终访问并外传了至少八个组织的邮件记录，其中包括一个国家检察机构、一所军事教育机构和一个区域性政府间组织。\n\nWindows 凭据窃取程序通过“虚假更新”主题的社会工程诱饵投递，同时附带具备完整远程访问能力的配套载荷。这些载荷被设计为冻结受害机器的安全更新，这意味着安全厂商发布的新恶意软件检测签名不会被受害设备获取或执行。\n\n该行为者在行动的每个环节都使用了 AI：\n\n- **侦察：** 使用 AI 识别邮件和远程访问系统特征，并从公开来源收集信息，为钓鱼构建目标清单。\n- **初始访问：** 使用 AI 构建并运营执行网络入侵行动的平台。该行动主要使用一种“设备代码钓鱼”，滥用云邮件服务的合法登录流程（更多细节参见 Microsoft 的[这篇文章](https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/)）。行为者用 AI 搭建钓鱼基础设施和利用工具，并在其指挥下让 AI 直接执行部分入侵，包括对受害系统运行命令、收集凭据和横向移动。\n- **收集与外传：** 使用 AI 提取并整理数百 GB 被盗数据；部分案例通过从已攻陷邮箱批量导出来完成外传。\n- **维持访问：** 通过自动把攻击者控制的设备注册到受害组织租户中，协助维持对被攻陷账号和租户的访问。\n\n在本地部署环境中，该行为者使用 AI 监控植入程序的隐蔽性与持久化能力。当植入程序被安全产品标记后，攻击者会使用 Claude 系统性识别、修改并重新部署被检测到的制品。\n\n上述变化的结果，是 AI 把成本压力重新反向推给了防御方。过去，防御者或许可以通过部署新的检测规则拖慢攻击节奏；现在，至少从理论上说，有能力的对手可以“闭合循环”，以比防御者开发和部署新检测更快的速度绕过传统安全检测。\n\n该行为者使用的恶意软件包括：\n\n- Windows 恶意软件：PowerChrome、WUEngine、Shadow C2、MiniPlasma、CloudSyncSvc；\n- Android 恶意软件：GiftDrop，一款重新包装的 GiftsExpress Android 监控 RAT；\n- iOS 恶意软件：DarkSword，一条 iOS 漏洞利用链。","sourceFormat":"markdown"},"note:sha256:9cb9c50a390550e03cfbc35e2efe6e32f3ae7c0be3e78f8947c2ee7851d31701":{"html":"\u003cp\u003eAI 正在缩小能力差距，把低水平“黑客行动主义者”抬升为类似高级持续性威胁的行动者。正如多个案例反复显示的那样，AI 能力既提高进攻型网络操作者的能力基线，也降低所需资源。本节详细介绍我们调查并阻断的一场黑客行动主义活动：规模很小但动机强烈的操作者，因为把 AI 集成到作业中，得以实现相当显著的目标。\u003c/p\u003e\n\u003cp\u003e2026 年春季，我们观察到一名讲法语的单独行为者使用 Claude，针对欧洲政党、媒体、智库，以及这些组织使用的 SaaS 提供商。\u003c/p\u003e\n\u003cp\u003e该行为者用 Rust 构建了一套自定义扫描器，用于扫描和验证公开容器中暴露的 API Key。一旦验证成功，工具就会通过本地代理层轮换不同 Key 的使用，使其流量能够混入被盗 API Key 合法所有者的正常流量。正如前述案例所示，一枚暴露 API Key 就足以移除恶意操作者的进入门槛。\u003c/p\u003e\n\u003cp\u003eGTG-50029 又一次展示了行为者如何在整个杀伤链上采用 AI。攻击者在一个可管理子 Agent 的框架中使用 AI 的 Agentic 编码能力；这些子 Agent 又分别负责认证前后侦察、代码审查，以及核验不同 AI 模型给出的发现。\u003c/p\u003e\n","kind":"html","rawMarkdown":"AI 正在缩小能力差距，把低水平“黑客行动主义者”抬升为类似高级持续性威胁的行动者。正如多个案例反复显示的那样，AI 能力既提高进攻型网络操作者的能力基线，也降低所需资源。本节详细介绍我们调查并阻断的一场黑客行动主义活动：规模很小但动机强烈的操作者，因为把 AI 集成到作业中，得以实现相当显著的目标。\n\n2026 年春季，我们观察到一名讲法语的单独行为者使用 Claude，针对欧洲政党、媒体、智库，以及这些组织使用的 SaaS 提供商。\n\n该行为者用 Rust 构建了一套自定义扫描器，用于扫描和验证公开容器中暴露的 API Key。一旦验证成功，工具就会通过本地代理层轮换不同 Key 的使用，使其流量能够混入被盗 API Key 合法所有者的正常流量。正如前述案例所示，一枚暴露 API Key 就足以移除恶意操作者的进入门槛。\n\nGTG-50029 又一次展示了行为者如何在整个杀伤链上采用 AI。攻击者在一个可管理子 Agent 的框架中使用 AI 的 Agentic 编码能力；这些子 Agent 又分别负责认证前后侦察、代码审查，以及核验不同 AI 模型给出的发现。","sourceFormat":"markdown"},"note:sha256:9d9e4df27ffeda126b9794b2d0b90f26707f55e89cc863a720b479623a9b895d":{"html":"\u003cp\u003e我们识别并封禁了由两个彼此关联、与伊朗准军事和国内安全机构有关的单位运作的 16 个 Claude 账号。两个单位在 Claude 上使用不同的行动手册，但都把数据送入同一中央基础设施。\u003c/p\u003e\n\u003cp\u003e我们识别到一个横跨伊朗多个省份、设有七个部门的组织。该组织声称维护伊朗公民身份记录数据库，并在一年内监控和画像 6,388 名伊朗人。操作者把 Claude 当成分析员和生产工作室，构建了一个很可能由政府控制的监控案件管理系统前端，并对 155,216 条推文进行社交网络分析。\u003c/p\u003e\n\u003cp\u003e我们还识别出一个位于 Qom 的省级单位，把 Claude 当作工程部门来构建国内监控能力。该单位最重要的成果是一款已经投产的恶意 Firefox 扩展，名为“al-Najm al-thāqib”；单位成员用它从主要社交平台大规模收集用户身份。两个单位都围绕同一集中式系统“Arman”构建扩展和界面，该系统采用联邦式模式，由省级单位向中央基础设施输送数据。用户借助 Claude 获取代码、速度、工程能力和分析支持。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别并封禁了由两个彼此关联、与伊朗准军事和国内安全机构有关的单位运作的 16 个 Claude 账号。两个单位在 Claude 上使用不同的行动手册，但都把数据送入同一中央基础设施。\n\n我们识别到一个横跨伊朗多个省份、设有七个部门的组织。该组织声称维护伊朗公民身份记录数据库，并在一年内监控和画像 6,388 名伊朗人。操作者把 Claude 当成分析员和生产工作室，构建了一个很可能由政府控制的监控案件管理系统前端，并对 155,216 条推文进行社交网络分析。\n\n我们还识别出一个位于 Qom 的省级单位，把 Claude 当作工程部门来构建国内监控能力。该单位最重要的成果是一款已经投产的恶意 Firefox 扩展，名为“al-Najm al-thāqib”；单位成员用它从主要社交平台大规模收集用户身份。两个单位都围绕同一集中式系统“Arman”构建扩展和界面，该系统采用联邦式模式，由省级单位向中央基础设施输送数据。用户借助 Claude 获取代码、速度、工程能力和分析支持。","sourceFormat":"markdown"},"note:sha256:9f01e10f6722d4e1e9367d130b9891b21c9f97e9705bf415b164123032dd7f61":{"html":"\u003cp\u003e我们在内部调查中发现该活动并封禁了相关账号。我们预计行为者可能创建新账号继续活动，因此已经围绕其行为特征建立检测能力，以阻止其再次出现。与本报告其他行动一样，我们还把相关指标分享给对应分发平台和其他合作伙伴。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e类型 / 备注\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e行为者\u003c/td\u003e\n\u003ctd\u003e一名位于孟加拉国 Gaibandha District 的行为者，在约 16 个月内轮换使用 29 个 Claude 账号\u003c/td\u003e\n\u003ctd\u003e行为者\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e自动化工具\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efake_news_3.py\u003c/code\u003e（API 内容生成，至少是第三版）；配套上传脚本（自动上传 YouTube、提前数月排程，并通过第三方持续集成服务路由以隐藏行为者 IP）\u003c/td\u003e\n\u003ctd\u003e脚本\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e固定输出格式\u003c/td\u003e\n\u003ctd\u003e每次运行生成 15 个虚构孟加拉语标题、3 篇详细叙事和 15 条英文图像生成提示词\u003c/td\u003e\n\u003ctd\u003e输出 Schema\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e保留给合作伙伴共享\u003c/td\u003e\n\u003ctd\u003e云存储文件夹标识符；上传脚本\u003c/td\u003e\n\u003ctd\u003e未公开\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 10. 支持 Awami League 行动的指标：单一孟加拉国行为者、自动化脚本和虚构内容输出格式。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们在内部调查中发现该活动并封禁了相关账号。我们预计行为者可能创建新账号继续活动，因此已经围绕其行为特征建立检测能力，以阻止其再次出现。与本报告其他行动一样，我们还把相关指标分享给对应分发平台和其他合作伙伴。\n\n| **类别** | **指标** | **类型 / 备注** |\n| --- | --- | --- |\n| 行为者 | 一名位于孟加拉国 Gaibandha District 的行为者，在约 16 个月内轮换使用 29 个 Claude 账号 | 行为者 |\n| 自动化工具 | `fake_news_3.py`（API 内容生成，至少是第三版）；配套上传脚本（自动上传 YouTube、提前数月排程，并通过第三方持续集成服务路由以隐藏行为者 IP） | 脚本 |\n| 固定输出格式 | 每次运行生成 15 个虚构孟加拉语标题、3 篇详细叙事和 15 条英文图像生成提示词 | 输出 Schema |\n| 保留给合作伙伴共享 | 云存储文件夹标识符；上传脚本 | 未公开 |\n\n表 10. 支持 Awami League 行动的指标：单一孟加拉国行为者、自动化脚本和虚构内容输出格式。","sourceFormat":"markdown"},"note:sha256:9f9089a092da0d23f4935a76ea720e49768f50faf8fe01f1588b6bbcf19329cf":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e分组代码\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eHandles\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e合成：侨民\u003c/td\u003e\n\u003ctd\u003eIR-DI\u003c/td\u003e\n\u003ctd\u003e@ShirazisInLA, @TorontoPersianForum, @BerlinIranFree, @DubaiIranOpposition, @LondonIranExile\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：青年/学生\u003c/td\u003e\n\u003ctd\u003eIR-YO\u003c/td\u003e\n\u003ctd\u003e@tehran_uni_student, @isfahanprotestkid, @tabriz_uni_protest, @ShirazYouthRebel\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：军方\u003c/td\u003e\n\u003ctd\u003eIR-MI\u003c/td\u003e\n\u003ctd\u003e@BasijMashhad, @IRGC_Isfahan, @QudsForceChat\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：宗教人士\u003c/td\u003e\n\u003ctd\u003eIR-CL\u003c/td\u003e\n\u003ctd\u003e@QomSeminaryNews, @mashhad_clergy, @AyatollahKhamenei\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：农村\u003c/td\u003e\n\u003ctd\u003eIR-RU\u003c/td\u003e\n\u003ctd\u003e@IsfahanVillageNews, @rural_khorasan, @VillageVoiceIR\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：UAE 外籍人员\u003c/td\u003e\n\u003ctd\u003eUAE\u003c/td\u003e\n\u003ctd\u003e@PakistaniDubaiWorker, @AjmanLaborForum, @IntlCityWorkers, @BanglaExpatSharjah\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：Saudi/GCC 宗派议题\u003c/td\u003e\n\u003ctd\u003eGCC\u003c/td\u003e\n\u003ctd\u003e@RiyadhDefender, @SaudiShiaWatcher, @ShiaThreatAlert, @EyeOnIranSA\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 1. 被放入合成训练语料中的社交媒体 Handle；这些账号在审查早期被发现，没有被评估为已投入实际行动。\u003c/p\u003e\n","kind":"html","rawMarkdown":"| **类别** | **分组代码** | **Handles** |\n| --- | --- | --- |\n| 合成：侨民 | IR-DI | @ShirazisInLA, @TorontoPersianForum, @BerlinIranFree, @DubaiIranOpposition, @LondonIranExile |\n| 合成：青年/学生 | IR-YO | @tehran_uni_student, @isfahanprotestkid, @tabriz_uni_protest, @ShirazYouthRebel |\n| 合成：军方 | IR-MI | @BasijMashhad, @IRGC_Isfahan, @QudsForceChat |\n| 合成：宗教人士 | IR-CL | @QomSeminaryNews, @mashhad_clergy, @AyatollahKhamenei |\n| 合成：农村 | IR-RU | @IsfahanVillageNews, @rural_khorasan, @VillageVoiceIR |\n| 合成：UAE 外籍人员 | UAE | @PakistaniDubaiWorker, @AjmanLaborForum, @IntlCityWorkers, @BanglaExpatSharjah |\n| 合成：Saudi/GCC 宗派议题 | GCC | @RiyadhDefender, @SaudiShiaWatcher, @ShiaThreatAlert, @EyeOnIranSA |\n\n表 1. 被放入合成训练语料中的社交媒体 Handle；这些账号在审查早期被发现，没有被评估为已投入实际行动。","sourceFormat":"markdown"},"note:sha256:a08965b62ffa9d3790516bdf9be207d52bfa69777a628a0fb3ffd041930e4128":{"html":"\u003cp\u003e过去六个月里，我们的威胁情报团队识别并阻断了一系列威胁行为者使用 Claude 的网络行动。相关行为者包括疑似国家支持团体、以经济利益为动机的犯罪分子以及出于政治动机的个人。本节介绍其中的一些案例。\u003c/p\u003e\n\u003cp\u003e在这些案例研究中，报告会引用“生成式威胁组（Generative Threat Groups，GTGs）”这一称呼，这是 Anthropic 用于标记被观察到正在滥用 AI 的行为者的内部编号体系。报告还尝试衡量“增益（uplift）”：我们用这个词描述 AI 带来的能力提升，即有 AI 与没有 AI 相比，可能造成了多少额外危害。我们从速度、规模和深度三个维度观察这种增益，并尝试判断行为者采用 AI 后，分别如何实质改变这些特征。\u003c/p\u003e\n\u003cp\u003e许多评论者关注 AI 大规模开发漏洞利用代码的风险。虽然这确实构成危险，但 AI 的采用在整个网络攻击杀伤链上带来的风险更为突出：攻击者能够以更少资源、更快速度，在更广、更深的攻击面上行动。\u003c/p\u003e\n\u003cp\u003e这些案例覆盖 2025 年 12 月至 2026 年 8 月。所有案例均涉及 Claude Haiku、Sonnet 和 Opus；我们没有在 Claude Fable 或 Mythos 上发现恶意活动（Mythos 已部署\u003ca href=\"https://www.anthropic.com/news/fable-safeguards-jailbreak-framework\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e一系列防护措施\u003c/a\u003e，大幅降低其执行有害网络任务的能力）。在每个案例中，我们都阻断了相关活动，根据所得信息强化 AI 防护，并在适当情况下与有关当局和行业伙伴共享情报。\u003c/p\u003e\n\u003cp\u003e以下内容先讨论我们在这些网络行动中观察到的关键趋势，再进入具体案例，并说明这些案例如何体现上述趋势。\u003c/p\u003e\n","kind":"html","rawMarkdown":"过去六个月里，我们的威胁情报团队识别并阻断了一系列威胁行为者使用 Claude 的网络行动。相关行为者包括疑似国家支持团体、以经济利益为动机的犯罪分子以及出于政治动机的个人。本节介绍其中的一些案例。\n\n在这些案例研究中，报告会引用“生成式威胁组（Generative Threat Groups，GTGs）”这一称呼，这是 Anthropic 用于标记被观察到正在滥用 AI 的行为者的内部编号体系。报告还尝试衡量“增益（uplift）”：我们用这个词描述 AI 带来的能力提升，即有 AI 与没有 AI 相比，可能造成了多少额外危害。我们从速度、规模和深度三个维度观察这种增益，并尝试判断行为者采用 AI 后，分别如何实质改变这些特征。\n\n许多评论者关注 AI 大规模开发漏洞利用代码的风险。虽然这确实构成危险，但 AI 的采用在整个网络攻击杀伤链上带来的风险更为突出：攻击者能够以更少资源、更快速度，在更广、更深的攻击面上行动。\n\n这些案例覆盖 2025 年 12 月至 2026 年 8 月。所有案例均涉及 Claude Haiku、Sonnet 和 Opus；我们没有在 Claude Fable 或 Mythos 上发现恶意活动（Mythos 已部署[一系列防护措施](https://www.anthropic.com/news/fable-safeguards-jailbreak-framework)，大幅降低其执行有害网络任务的能力）。在每个案例中，我们都阻断了相关活动，根据所得信息强化 AI 防护，并在适当情况下与有关当局和行业伙伴共享情报。\n\n以下内容先讨论我们在这些网络行动中观察到的关键趋势，再进入具体案例，并说明这些案例如何体现上述趋势。","sourceFormat":"markdown"},"note:sha256:a6d4bdcdb6eb8443fc8697bede9ffabe0915e8b73e100b7223e19022bfdda1b5":{"html":"\u003cp\u003e图 7. 将行为者针对美国定向能武器开展的科学技术情报收集映射到完整情报生命周期：从任务下达与收集，到处理、分析和传播。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"图 7. 将行为者针对美国定向能武器开展的科学技术情报收集映射到完整情报生命周期：从任务下达与收集，到处理、分析和传播。\n\n[返回顶部](#main)","sourceFormat":"markdown"},"note:sha256:abf8543e214482c2003e189d2def0c3d46bf4cfd82fe0453c937a417c773e6e3":{"blocks":[{"children":[],"kind":"leaf","title":"我们发现，Kimi 系列模型的开发商 Moonshot AI 会在用户不知情的情况下，把客户请求转发给 Claude，而不是由 Kimi 自身处理；随后再把 Claude 的回答展示给用户。这些用户以为自己正在使用 Kimi，实际收到的却是 Claude 的响应。"},{"children":[],"kind":"leaf","title":"一个实例中，Moonshot 在 10 天内向 Anthropic 中继了近 30 万条客户请求，绝大多数被路由到 Opus。Moonshot 使用由 5,380 个欺诈账号组成的代理服务网络，其中大多数看起来位于新加坡和日本。"},{"children":[],"kind":"leaf","title":"除了把 Claude 的回答直接提供给客户，Moonshot 还捕获并保存了至少部分交流。它建立了 CoT 提取流水线，从这些已保存的中继会话中提取 Claude 的 CoT 记录用于训练模型，也从其他渠道收集 CoT。"},{"children":[],"kind":"leaf","title":"为降低未经授权蒸馏风险，Claude 返回时不会直接提供原始思维，而是返回对原始思维的引用——“thinking signature”。API 在后续调用中可通过这一签名查找原始推理轨迹。Moonshot 绕过了这一控制：保存 Claude 响应中的 reasoning signature，开启新会话，再诱导 Claude 把签名还原为完整推理轨迹。这种跨会话重放攻击让非法蒸馏行为者能够收集 CoT 推理记录。我们正在引入新方法强化对这类战术
