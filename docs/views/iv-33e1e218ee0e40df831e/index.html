=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc3a3242fdb031d4b508557fcbc790b9b233d9505-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 16. 该行动以协调式虚假行为、合成媒体和媒体洗白为基础。图中为网络账号的 Instagram 帖子示例。\u003c/p\u003e\n","kind":"html","rawMarkdown":"该网络依靠 Claude 支持影响力行动的所有阶段。行为者通过一个共享 AI Agent 平台管理任务，每个工作区都维护自己的长期记忆文件。随着时间推移，他们不断向这些文件加入具体指令，例如禁用词列表、批准来源、账号管理规则和规避检测的方法。这样一来，即使没有人类用户逐次指导每个会话，Agent 也能持续生产内容。其中一名行为者还把 MEK 的创立理论加载到模型记忆中，作为行动内部其他人可以复用的“战略基础数据”。\n\n这场行动背后的人类管理高度结构化，包括由专门委员会组成的审批闭环，以及从内容纠正人员到管理者的正式审查流程。在沟通中，行为者反复使用“按照我们的合同”这一表述，并经常提到 MEK 领导层。我们发现，同一套行动手册在所有工作区中统一应用。\n\n多数产出以波斯语为先，并把 2022 年抗议中自然形成的口号 «زن، زندگی، آزادی»（“Woman, Life, Freedom”）替换为 MEK 版本 «زن، مقاومت، آزادی»（“Woman, Resistance, Freedom”）。\n\n| **集群** | **Claude 的用途** | **最严重的要素** |\n| --- | --- | --- |\n| 共享 Agent 平台（“Viktor”） | 基于持久记忆的 Agent 跨行为者自主、定时生产 | 跨行为者共享的理论与规避规则，成为协同底层 |\n| 实时冒充 | 从私人消息克隆真人表达方式；以其身份进行实时对话 | 在伊朗境内联系人不知情的情况下冒充真实活动人士 |\n| 监控与画像 | 十阶段漏斗；对伊朗境内具名个人建立心理画像档案 | 根据逮捕经历画像，而这些人在伊朗法律下可能面临监禁或处决 |\n| 协调式虚假行为 | 多账号 Instagram 流水线，按照受众分组同步发布 | 隐藏 MEK 归属，在“独立”品牌下发布近乎一致的协调内容 |\n| 合成媒体 | 为发言人创建带波斯语音频的头像 | 未披露的合成“普通伊朗人”与历史人物深度伪造，用于制造虚假权威 |\n| 媒体洗白 | 把 MEK 关联媒体重写并重新分发为独立报道 | 去除水印，把组织内容伪装成普通同胞的声音 |\n\n表 11. 该影响力行动的不同组成：共享 Agent 平台、冒充、监控、协调式虚假行为、合成媒体和媒体洗白。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbcae98f28b9f99f32eb9e5d72fa994ee730282e8-1990x1250.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 15. 一个由名为“Viktor”的共享 Claude Agent 平台连接起来的分布式网络，涵盖实时冒充、伊朗境内监控、协调式虚假行为、合成发言人和媒体洗白。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc3a3242fdb031d4b508557fcbc790b9b233d9505-1990x1150.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 16. 该行动以协调式虚假行为、合成媒体和媒体洗白为基础。图中为网络账号的 Instagram 帖子示例。","sourceFormat":"markdown"},"note:sha256:09fea199c0a8dddb3c74e34afcb919d44fc351aeeb6c03fc410758e7506ec0b3":{"html":"\u003cp\u003e就像合法经济活动中一样，AI 已经扩散到网络战场。包括 GTG-10002 在内的多个团体——\u003ca href=\"https://www.anthropic.com/news/disrupting-AI-espionage\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e此前已有报道\u003c/a\u003e——开发并使用自己的自主攻击框架；而 GTG-50020、GTG-50029 等其他团体则使用了 \u003ca href=\"https://github.com/vxcontrol/pentagi\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePentAGI\u003c/a\u003e 这样的公开进攻型 Agent 框架。这些公开框架为任何下载者复现了大量相同的编排脚手架，本报告多个行动直接运行在这些框架或其衍生版本上。\u003c/p\u003e\n\u003cp\u003e支持这一战场的市场也已经形成。我们发现 GTG-50021 搭建欺诈经销商，号称以折扣价提供 Claude 访问，实际却把用户流量静默代理到另一个模型，同时收集所有注册者的 Anthropic 凭据。\u003c/p\u003e\n\u003cp\u003e这种扩散正在不同类型的威胁行为者、不同地区和不同任务之间发生。本报告描述的能力，应被视为任何有足够动机的行为者都有可能获得。我们会持续投入资源、工具和人员，发展更有效的方法，在危害真正发生前领先并阻断这些对手的访问。但我们预计，仍将长期面对高度有动机、且有时具备复杂国家支持背景的恶意网络行为者，并继续与公私部门伙伴共享威胁信息和最佳实践以缓解风险。\u003c/p\u003e\n\u003cp\u003e本报告既包含小型犯罪团伙，也包含国家支持组织指挥的行动。AI 的扩散正在拉平能力差距，使两类行为者都能获得同一组高级能力。它们之间最主要的区别，不再是“技术复杂度”，而是“意图”。过去，国家支持行为者可以凭借更多资源部署更高级网络能力；AI 的进步让非国家行为者也能获得过去主要由国家行为者掌握的能力。一名使用被盗 API Key 的黑客行动主义者（GTG-50029）、一个从移动应用中批量收集凭据的经济型犯罪团伙（GTG-50014），以及一个国家关联间谍操作者（GTG-20006），展示出相似的方法：使用 Agentic AI 开展针对多个受害者的行动，而过去这类行动往往需要一个团队。他们构建定制工具、执行入侵，并以单个人类操作者无法手工处理的规模加工被盗数据。\u003c/p\u003e\n\u003cp\u003e攻击本身并不陌生：被盗凭据、未修补边缘设备、暴露服务、SQL 注入和钓鱼仍然是主要手段。本报告没有哪一项行动依赖防御者从未见过的全新技术。真正变化的是攻击的\u003cem\u003e经济学\u003c/em\u003e。过去让资源充足行动与其他攻击者拉开差距的那类劳动——侦察、利用、工具开发和数据处理——如今都可以委派给 AI 模型；模型在 Harness 中以机器速度并行运行。前文数字已经体现结果：有的入侵从开始到完成只需两三小时，单个操作者就可以并行处理数十名受害者。\u003c/p\u003e\n","kind":"html","rawMarkdown":"就像合法经济活动中一样，AI 已经扩散到网络战场。包括 GTG-10002 在内的多个团体——[此前已有报道](https://www.anthropic.com/news/disrupting-AI-espionage)——开发并使用自己的自主攻击框架；而 GTG-50020、GTG-50029 等其他团体则使用了 [PentAGI](https://github.com/vxcontrol/pentagi) 这样的公开进攻型 Agent 框架。这些公开框架为任何下载者复现了大量相同的编排脚手架，本报告多个行动直接运行在这些框架或其衍生版本上。\n\n支持这一战场的市场也已经形成。我们发现 GTG-50021 搭建欺诈经销商，号称以折扣价提供 Claude 访问，实际却把用户流量静默代理到另一个模型，同时收集所有注册者的 Anthropic 凭据。\n\n这种扩散正在不同类型的威胁行为者、不同地区和不同任务之间发生。本报告描述的能力，应被视为任何有足够动机的行为者都有可能获得。我们会持续投入资源、工具和人员，发展更有效的方法，在危害真正发生前领先并阻断这些对手的访问。但我们预计，仍将长期面对高度有动机、且有时具备复杂国家支持背景的恶意网络行为者，并继续与公私部门伙伴共享威胁信息和最佳实践以缓解风险。\n\n本报告既包含小型犯罪团伙，也包含国家支持组织指挥的行动。AI 的扩散正在拉平能力差距，使两类行为者都能获得同一组高级能力。它们之间最主要的区别，不再是“技术复杂度”，而是“意图”。过去，国家支持行为者可以凭借更多资源部署更高级网络能力；AI 的进步让非国家行为者也能获得过去主要由国家行为者掌握的能力。一名使用被盗 API Key 的黑客行动主义者（GTG-50029）、一个从移动应用中批量收集凭据的经济型犯罪团伙（GTG-50014），以及一个国家关联间谍操作者（GTG-20006），展示出相似的方法：使用 Agentic AI 开展针对多个受害者的行动，而过去这类行动往往需要一个团队。他们构建定制工具、执行入侵，并以单个人类操作者无法手工处理的规模加工被盗数据。\n\n攻击本身并不陌生：被盗凭据、未修补边缘设备、暴露服务、SQL 注入和钓鱼仍然是主要手段。本报告没有哪一项行动依赖防御者从未见过的全新技术。真正变化的是攻击的*经济学*。过去让资源充足行动与其他攻击者拉开差距的那类劳动——侦察、利用、工具开发和数据处理——如今都可以委派给 AI 模型；模型在 Harness 中以机器速度并行运行。前文数字已经体现结果：有的入侵从开始到完成只需两三小时，单个操作者就可以并行处理数十名受害者。","sourceFormat":"markdown"},"note:sha256:0be4e67df4dc351d5fe322db10ebb036c8a60f1474ffd3060ee980ab37391396":{"html":"\u003cp\u003e我们识别到一名位于中国的威胁行为者，其使用 Claude 收集先进定向能武器的开源情报、编辑情报产品并起草中文简报。行为者自称国防情报撰稿人和内部刊物编辑，带领一个三人团队。\u003c/p\u003e\n\u003cp\u003e在数十个会话中，行为者询问 Claude 关于特定定向能武器的信息，其中包括一款用于反无人机蜂群的车载高功率微波武器——该武器仅在数日前刚刚公开。行为者还收集用于产生高功率微波的组件供应链信息，并要求 Claude 起草限制内部流转、面向中国共产党、军队或国家安全高级领导层的简报。\u003c/p\u003e\n\u003cp\u003e行为者试图通过反复进行带概率权重的归因，识别一种具体微波发生装置及其供应商，目标是逆向工程该武器、开发对抗措施，并与中国系统进行基准比较。同时，行为者使用 Claude 映射公开报道中的目标供应商所有权结构，试图穿透刻意混淆的供应链。\u003c/p\u003e\n\u003cp\u003e行为者还让 Claude 编制一份 23 页报告，向领导层介绍外国军队已经部署的高功率微波项目，并尝试识别其中哪些系统曾用于近期军事演习。\u003c/p\u003e\n\u003cp\u003e我们评估其采用了国家级情报工作方法，依据是开源情报收集和分析的广度与复杂度：结构化利用十余个开源与商业数据库；为某一外国军事项目办公室起草信息公开请求；使用借鉴自西方情报机构的正式分析框架；按可信度对公开来源排序；制作详细交付物，包括管理层简报、约 45 页附录，以及为期 12 个月的后续监控清单。\u003c/p\u003e\n\u003cp\u003e我们检测并封禁了相关账号，部署额外监控以发现关联账号滥用，并正在改进安全措施以降低未来滥用风险。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别到一名位于中国的威胁行为者，其使用 Claude 收集先进定向能武器的开源情报、编辑情报产品并起草中文简报。行为者自称国防情报撰稿人和内部刊物编辑，带领一个三人团队。\n\n在数十个会话中，行为者询问 Claude 关于特定定向能武器的信息，其中包括一款用于反无人机蜂群的车载高功率微波武器——该武器仅在数日前刚刚公开。行为者还收集用于产生高功率微波的组件供应链信息，并要求 Claude 起草限制内部流转、面向中国共产党、军队或国家安全高级领导层的简报。\n\n行为者试图通过反复进行带概率权重的归因，识别一种具体微波发生装置及其供应商，目标是逆向工程该武器、开发对抗措施，并与中国系统进行基准比较。同时，行为者使用 Claude 映射公开报道中的目标供应商所有权结构，试图穿透刻意混淆的供应链。\n\n行为者还让 Claude 编制一份 23 页报告，向领导层介绍外国军队已经部署的高功率微波项目，并尝试识别其中哪些系统曾用于近期军事演习。\n\n我们评估其采用了国家级情报工作方法，依据是开源情报收集和分析的广度与复杂度：结构化利用十余个开源与商业数据库；为某一外国军事项目办公室起草信息公开请求；使用借鉴自西方情报机构的正式分析框架；按可信度对公开来源排序；制作详细交付物，包括管理层简报、约 45 页附录，以及为期 12 个月的后续监控清单。\n\n我们检测并封禁了相关账号，部署额外监控以发现关联账号滥用，并正在改进安全措施以降低未来滥用风险。","sourceFormat":"markdown"},"note:sha256:10a10737a130214db4c49a37630fdefa9c1cb77266a8e08c4a9f5b7d07564c5a":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e类型\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e说明\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e-1003893854338\u003c/td\u003e\n\u003ctd\u003eTelegram 群组/聊天 ID\u003c/td\u003e\n\u003ctd\u003e名为“ClintonHog”的私有群组。接收攻击者 APK Secret 扫描流水线发现的第一批经验证被盗凭据。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e-1003311614569\u003c/td\u003e\n\u003ctd\u003eTelegram 群组/聊天 ID\u003c/td\u003e\n\u003ctd\u003e名为“ChatMignon”的私有群组。主要外传信道：471 个论坛主题，每种 Secret 检测器类型一个，实时接收经验证的被盗凭据。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e8632748474\u003c/td\u003e\n\u003ctd\u003eTelegram Bot 账号 ID\u003c/td\u003e\n\u003ctd\u003e将流水线发现发布到群组 -1003893854338（“ClintonHog”）的 Bot。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e8664033117\u003c/td\u003e\n\u003ctd\u003eTelegram Bot 账号 ID\u003c/td\u003e\n\u003ctd\u003e将流水线发现发布到群组 -1003311614569（“ChatMignon”）的 Bot。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e8628746407\u003c/td\u003e\n\u003ctd\u003eTelegram Bot 账号 ID\u003c/td\u003e\n\u003ctd\u003e把 AWS SES 凭据验证结果直接发送到操作者用户账号的 Bot。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e8709258476\u003c/td\u003e\n\u003ctd\u003eTelegram Bot 账号 ID\u003c/td\u003e\n\u003ctd\u003e把 AWS SNS SMS 滥用测试结果直接发送到操作者用户账号的 Bot。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e8179098353\u003c/td\u003e\n\u003ctd\u003eTelegram 用户 ID\u003c/td\u003e\n\u003ctd\u003e接收 SES/SNS Bot 输出的操作者账号。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 1. Telegram 群组 ID。\u003c/p\u003e\n","kind":"html","rawMarkdown":"| **指标** | **类型** | **说明** |\n| --- | --- | --- |\n| -1003893854338 | Telegram 群组/聊天 ID | 名为“ClintonHog”的私有群组。接收攻击者 APK Secret 扫描流水线发现的第一批经验证被盗凭据。 |\n| -1003311614569 | Telegram 群组/聊天 ID | 名为“ChatMignon”的私有群组。主要外传信道：471 个论坛主题，每种 Secret 检测器类型一个，实时接收经验证的被盗凭据。 |\n| 8632748474 | Telegram Bot 账号 ID | 将流水线发现发布到群组 -1003893854338（“ClintonHog”）的 Bot。 |\n| 8664033117 | Telegram Bot 账号 ID | 将流水线发现发布到群组 -1003311614569（“ChatMignon”）的 Bot。 |\n| 8628746407 | Telegram Bot 账号 ID | 把 AWS SES 凭据验证结果直接发送到操作者用户账号的 Bot。 |\n| 8709258476 | Telegram Bot 账号 ID | 把 AWS SNS SMS 滥用测试结果直接发送到操作者用户账号的 Bot。 |\n| 8179098353 | Telegram 用户 ID | 接收 SES/SNS Bot 输出的操作者账号。 |\n\n表 1. Telegram 群组 ID。","sourceFormat":"markdown"},"note:sha256:10df1b5494c9ea69adeb9246712e4a3ed99dc0e9a40017d6b7f96876369210ec":{"html":"\u003cp\u003e由 13 个常驻收集 AI Agent 组成的集群按计划任务运行，识别并下载目标网站内容，包括公开可访问的美国军方和政府站点（如合同公告），以及社交媒体账号内容。工作流通过分层爬虫、反 Bot 绕过技术和商业代理出口完成这些任务。相邻流水线再以情报报告风格对获取内容进行摘要和评分，之后把工作流摘要交付到一个分发门户。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F966baae8ca495387317bcf4fe8c4147522584903-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 14. 自主收集集群循环。\u003c/p\u003e\n","kind":"html","rawMarkdown":"由 13 个常驻收集 AI Agent 组成的集群按计划任务运行，识别并下载目标网站内容，包括公开可访问的美国军方和政府站点（如合同公告），以及社交媒体账号内容。工作流通过分层爬虫、反 Bot 绕过技术和商业代理出口完成这些任务。相邻流水线再以情报报告风格对获取内容进行摘要和评分，之后把工作流摘要交付到一个分发门户。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F966baae8ca495387317bcf4fe8c4147522584903-1920x471.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 14. 自主收集集群循环。","sourceFormat":"markdown"},"note:sha256:11ebeb7e46d69dab2554add3836c718eb0c186f14bfb97781e1019eece66967a":{"html":"\u003cp\u003eAI 模型具备的网络安全技能正在压缩过去横亘在资源充足的国家支持行动与个人操作者之间的劳动力和工具差距。在下文案例中，一名使用被盗 API Key 的黑客行动主义者、若干彼此分散但以经济利益为动机的个人，以及一名国家间谍行动者，都维持了针对多个受害者的持续行动；即使只倒退一年，这类行动也往往需要多名熟练操作者和专业知识才能完成。\u003c/p\u003e\n\u003cp\u003e对威胁情报调查人员而言，“技术复杂度”已不再是判断行动背后是谁的可靠信号。从侦察、工具开发到数据处理与漏洞利用，进攻行动的每一层都得到了 AI 增强。下文 GTG-50014 案例记录了这种能力增益的一个例子。其净效应是获得更广的知识\u003cem\u003e覆盖面\u003c/em\u003e和更深的知识\u003cem\u003e深度\u003c/em\u003e，进而推动能力开发和实施速度进一步提升。\u003c/p\u003e\n\u003cp\u003e2025 年 11 月，我们记录了一种疑似国家支持行动用于实施自主攻击的作业模式。如今，这种模式已经扩散到我们调查过的各类行为者。公开可用的进攻性 Agent 框架，如 \u003ca href=\"https://github.com/vxcontrol/pentagi\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePentAGI\u003c/a\u003e，让任何下载者都能复现其中大量基础编排结构。这类脚手架实际上可以自动化网络攻击杀伤链的各个步骤。我们观察到的操作者从国家机构到单独个人不等，涉及的国家范围也在扩大。GTG-20006 是采用 AI 驱动杀伤链的一个案例。随着模型持续演进和改进，我们判断，会有更多从“独狼”到组织化实体的行为者采用 AI 框架，以更快速度、更大规模实施更复杂的网络攻击。\u003c/p\u003e\n","kind":"html","rawMarkdown":"AI 模型具备的网络安全技能正在压缩过去横亘在资源充足的国家支持行动与个人操作者之间的劳动力和工具差距。在下文案例中，一名使用被盗 API Key 的黑客行动主义者、若干彼此分散但以经济利益为动机的个人，以及一名国家间谍行动者，都维持了针对多个受害者的持续行动；即使只倒退一年，这类行动也往往需要多名熟练操作者和专业知识才能完成。\n\n对威胁情报调查人员而言，“技术复杂度”已不再是判断行动背后是谁的可靠信号。从侦察、工具开发到数据处理与漏洞利用，进攻行动的每一层都得到了 AI 增强。下文 GTG-50014 案例记录了这种能力增益的一个例子。其净效应是获得更广的知识*覆盖面*和更深的知识*深度*，进而推动能力开发和实施速度进一步提升。\n\n2025 年 11 月，我们记录了一种疑似国家支持行动用于实施自主攻击的作业模式。如今，这种模式已经扩散到我们调查过的各类行为者。公开可用的进攻性 Agent 框架，如 [PentAGI](https://github.com/vxcontrol/pentagi)，让任何下载者都能复现其中大量基础编排结构。这类脚手架实际上可以自动化网络攻击杀伤链的各个步骤。我们观察到的操作者从国家机构到单独个人不等，涉及的国家范围也在扩大。GTG-20006 是采用 AI 驱动杀伤链的一个案例。随着模型持续演进和改进，我们判断，会有更多从“独狼”到组织化实体的行为者采用 AI 框架，以更快速度、更大规模实施更复杂的网络攻击。","sourceFormat":"markdown"},"note:sha256:1441ab69ba4572039d818f2b789c83fe3f1be2e2d7f3f0dbe6f969faa01867bb":{"html":"\u003cp\u003eGTG-50020 是一个讲俄语、以经济利益为动机的行为者，历史上曾入侵酒店预订和金融科技平台。在一次入侵中，他们从一名受害者处外传约 26 GB 数据，并试图通过勒索付款（或在暗网论坛售卖数据）获得 150 万至 250 万美元。\u003c/p\u003e\n\u003cp\u003e随后，他们把同样的技战术转向 AI 行业。通过向一家 AI 厂商的自动评估沙箱注入恶意指令，攻击者诱使沙箱交出了其持有的凭据，其中包括属于该厂商、来自多个提供商的生产 AI API Key。\u003c/p\u003e\n\u003cp\u003e攻击者随后滥用这些被盗 Key，同时继续针对该 AI 厂商和其他无关目标实施入侵。实际上，一旦获得目标 API Key，他们就会自动停止使用自己的 Key，切换到受害者 Key。随后，同一基础设施又在约四天内以类似技术攻击了大约 30 家 AI 公司：找到一条成功攻击路径后，就重复应用到 30 个目标，只针对不同环境做轻微调整。攻击者明示的目标，是通过十多个不同途径获得尚未发布的 Claude 模型访问权。但其从未成功，所有尝试路径都失败了。整个过程中涉及的 Key 都是从客户环境窃取的客户 Key；攻击者从未攻陷 Anthropic 自身系统。\u003c/p\u003e\n\u003cp\u003e这个案例是迄今最清楚的证据之一：AI 供应链已经成为蓄意的犯罪目标。攻击者追逐 AI 厂商的生产 API Key，并明确希望——但需要强调的是，从未实现——获得未发布 AI 模型的访问权。\u003c/p\u003e\n","kind":"html","rawMarkdown":"GTG-50020 是一个讲俄语、以经济利益为动机的行为者，历史上曾入侵酒店预订和金融科技平台。在一次入侵中，他们从一名受害者处外传约 26 GB 数据，并试图通过勒索付款（或在暗网论坛售卖数据）获得 150 万至 250 万美元。\n\n随后，他们把同样的技战术转向 AI 行业。通过向一家 AI 厂商的自动评估沙箱注入恶意指令，攻击者诱使沙箱交出了其持有的凭据，其中包括属于该厂商、来自多个提供商的生产 AI API Key。\n\n攻击者随后滥用这些被盗 Key，同时继续针对该 AI 厂商和其他无关目标实施入侵。实际上，一旦获得目标 API Key，他们就会自动停止使用自己的 Key，切换到受害者 Key。随后，同一基础设施又在约四天内以类似技术攻击了大约 30 家 AI 公司：找到一条成功攻击路径后，就重复应用到 30 个目标，只针对不同环境做轻微调整。攻击者明示的目标，是通过十多个不同途径获得尚未发布的 Claude 模型访问权。但其从未成功，所有尝试路径都失败了。整个过程中涉及的 Key 都是从客户环境窃取的客户 Key；攻击者从未攻陷 Anthropic 自身系统。\n\n这个案例是迄今最清楚的证据之一：AI 供应链已经成为蓄意的犯罪目标。攻击者追逐 AI 厂商的生产 API Key，并明确希望——但需要强调的是，从未实现——获得未发布 AI 模型的访问权。","sourceFormat":"markdown"},"note:sha256:1597b6f282dd9d56cf369f026062ad71a2f4a2b2da070a8b9aed6fe0903e5ad8":{"html":"\u003cp\u003e我们识别并移除了一个使用 Claude 批量生产和改写政治内容的账号。该行动用模型在大约 70 个伪造新闻网站上重写并分发虚构新闻，随后又由约 70 个相互对应的 X/Twitter 账号，以及一个包含 250 多个虚假评论账号的 X/Twitter 网络进一步放大。\u003c/p\u003e\n\u003cp\u003e调查显示，这场行动面向六大洲的全球受众。虽然操作者刻意让网络看起来像彼此独立的本地新闻编辑部，但我们追踪到其背后是法国数字广告机构 LKM Company。\u003c/p\u003e\n\u003cp\u003e该网络并不坚持单一政治意识形态，而是根据当时付款方是谁，在政治光谱不同阵营之间切换立场。这符合商业“影响力即服务”模式：私营公司受雇操纵信息、改变公众意见、推动特定政治议程，或对个人实施定向抹黑。\u003c/p\u003e\n\u003cp\u003e我们较早阻断了该行动，当时它尚未建立真实受众。网络用约 20 种语言至少发布了 8,913 篇文章，但我们识别到的大多数内容几乎没有来自真实受众的可观察互动。按 Brookings Institution 的 Breakout Scale 评估，这一行动属于 Category Two：内容在网络自有网站和匹配的社交账号之间传播，没有证据显示它突破自身网络形成外部扩散。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别并移除了一个使用 Claude 批量生产和改写政治内容的账号。该行动用模型在大约 70 个伪造新闻网站上重写并分发虚构新闻，随后又由约 70 个相互对应的 X/Twitter 账号，以及一个包含 250 多个虚假评论账号的 X/Twitter 网络进一步放大。\n\n调查显示，这场行动面向六大洲的全球受众。虽然操作者刻意让网络看起来像彼此独立的本地新闻编辑部，但我们追踪到其背后是法国数字广告机构 LKM Company。\n\n该网络并不坚持单一政治意识形态，而是根据当时付款方是谁，在政治光谱不同阵营之间切换立场。这符合商业“影响力即服务”模式：私营公司受雇操纵信息、改变公众意见、推动特定政治议程，或对个人实施定向抹黑。\n\n我们较早阻断了该行动，当时它尚未建立真实受众。网络用约 20 种语言至少发布了 8,913 篇文章，但我们识别到的大多数内容几乎没有来自真实受众的可观察互动。按 Brookings Institution 的 Breakout Scale 评估，这一行动属于 Category Two：内容在网络自有网站和匹配的社交账号之间传播，没有证据显示它突破自身网络形成外部扩散。","sourceFormat":"markdown"},"note:sha256:1616a0529d122c5d6984757cc47729df21f8817aeb6c2828486ca9e301467767":{"html":"\u003cp\u003e今年 1 月至 7 月，我们识别并阻断了一系列利用 Claude 构建、运行或以其他方式支持监控行动的活动，参与者包括国家关联行为者、与政府有联系的承包商和商业间谍软件供应商。这些案例涉及中国、伊朗和西非的威胁行为者，也涉及商业“监控即服务”市场；行动规模从单一个人到完整团队不等。Anthropic 的 Usage Policy 禁止使用 Claude 开展未经同意的监控和画像，也禁止利用我们的服务侵犯个人的公民自由和人权。下文每个案例中的威胁行为者都违反了我们的 Usage Policy，并试图绕过用于检测此类滥用的控制措施。对于每个案例，我们都封禁了相关账号，改进了对观察到的战术、技术和程序（TTP）的检测能力；当行动涉及平台之外的活动或影响时，我们也酌情与产业伙伴和相关机构共享标识符与情报。\u003c/p\u003e\n\u003cp\u003e调查过程中，我们观察到几个趋势。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第一，AI 正在被用来替代一支工程团队。\u003c/strong\u003e 一名为马里国家安全部门工作的顾问使用 Claude 设计了一套大规模拦截平台，可以监视该国所有移动运营商上的通信并为目标生成档案。在这个案例中，Claude 并不是用来分析监控档案，而是用来设计支撑情报收集的软件本身。另一个案例中，伊朗行为者使用 Claude 构建并部署了一个恶意 Firefox 扩展，从社交网络中收集用户身份。中国（PRC）一个宗教事务情报收集部门过去由多支分析团队组成，如今则缩减为一个办公室，借助 AI 助手每月完成数千项调查。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第二，AI 不仅用于构建工具，也被用于批量摄取数据、识别目标。\u003c/strong\u003e 一个案例中，行为者批量上传社交媒体帖子，并要求 Claude 生成结构化记录，列出目标的位置、人口统计信息和政治倾向，同时为每项判断给出置信度。类似地，一个伊朗单位使用 Claude 分析数十万条社交媒体帖子，从中选出 39 个反对派账号进行监控。中国行为者让 Claude 按政治敏感度对社交媒体内容和新闻文章评分，并标记可能需要其所谓“管控”的目标。而在最成熟的案例中，一名与中国有关联、完全不会阿拉伯语的行为者使用 Claude 对叙利亚境内的维吾尔目标开展持续数日的招募行动。模型用当地口音起草接触话术、实时翻译回复、以“专家”身份角色扮演对任务进行质量检查，并把结果整理成我们怀疑是提交给案件负责人的格式。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第三，AI 正在被完整嵌入国家安全官僚体系。\u003c/strong\u003e 一个中国国家安全局使用 Claude 制作内部手册，说明如何在监控行动中使用 AI，这表明 AI 模型正在深入进入国家行为者的日常工作。在伊朗，两个既不共享代码、也不共享人员的单位，分别独立使用 Claude 解决国家运营的集中式监控案件管理系统中的相同技术和可用性问题。这说明 AI 正被用于跨越国家监控体系中的技术和官僚障碍。\u003c/p\u003e\n\u003cp\u003e本节几乎所有案例中，操作者都是国家关联组织，其目标也仍是这些政权历史上一贯关注的侨民和异议群体，包括香港民主派人士、亚洲各地的藏人和法轮功群体，以及海外的伊朗少数群体和伊朗政权反对者。\u003c/p\u003e\n","kind":"html","rawMarkdown":"今年 1 月至 7 月，我们识别并阻断了一系列利用 Claude 构建、运行或以其他方式支持监控行动的活动，参与者包括国家关联行为者、与政府有联系的承包商和商业间谍软件供应商。这些案例涉及中国、伊朗和西非的威胁行为者，也涉及商业“监控即服务”市场；行动规模从单一个人到完整团队不等。Anthropic 的 Usage Policy 禁止使用 Claude 开展未经同意的监控和画像，也禁止利用我们的服务侵犯个人的公民自由和人权。下文每个案例中的威胁行为者都违反了我们的 Usage Policy，并试图绕过用于检测此类滥用的控制措施。对于每个案例，我们都封禁了相关账号，改进了对观察到的战术、技术和程序（TTP）的检测能力；当行动涉及平台之外的活动或影响时，我们也酌情与产业伙伴和相关机构共享标识符与情报。\n\n调查过程中，我们观察到几个趋势。\n\n**第一，AI 正在被用来替代一支工程团队。** 一名为马里国家安全部门工作的顾问使用 Claude 设计了一套大规模拦截平台，可以监视该国所有移动运营商上的通信并为目标生成档案。在这个案例中，Claude 并不是用来分析监控档案，而是用来设计支撑情报收集的软件本身。另一个案例中，伊朗行为者使用 Claude 构建并部署了一个恶意 Firefox 扩展，从社交网络中收集用户身份。中国（PRC）一个宗教事务情报收集部门过去由多支分析团队组成，如今则缩减为一个办公室，借助 AI 助手每月完成数千项调查。\n\n**第二，AI 不仅用于构建工具，也被用于批量摄取数据、识别目标。** 一个案例中，行为者批量上传社交媒体帖子，并要求 Claude 生成结构化记录，列出目标的位置、人口统计信息和政治倾向，同时为每项判断给出置信度。类似地，一个伊朗单位使用 Claude 分析数十万条社交媒体帖子，从中选出 39 个反对派账号进行监控。中国行为者让 Claude 按政治敏感度对社交媒体内容和新闻文章评分，并标记可能需要其所谓“管控”的目标。而在最成熟的案例中，一名与中国有关联、完全不会阿拉伯语的行为者使用 Claude 对叙利亚境内的维吾尔目标开展持续数日的招募行动。模型用当地口音起草接触话术、实时翻译回复、以“专家”身份角色扮演对任务进行质量检查，并把结果整理成我们怀疑是提交给案件负责人的格式。\n\n**第三，AI 正在被完整嵌入国家安全官僚体系。** 一个中国国家安全局使用 Claude 制作内部手册，说明如何在监控行动中使用 AI，这表明 AI 模型正在深入进入国家行为者的日常工作。在伊朗，两个既不共享代码、也不共享人员的单位，分别独立使用 Claude 解决国家运营的集中式监控案件管理系统中的相同技术和可用性问题。这说明 AI 正被用于跨越国家监控体系中的技术和官僚障碍。\n\n本节几乎所有案例中，操作者都是国家关联组织，其目标也仍是这些政权历史上一贯关注的侨民和异议群体，包括香港民主派人士、亚洲各地的藏人和法轮功群体，以及海外的伊朗少数群体和伊朗政权反对者。","sourceFormat":"markdown"},"note:sha256:1788609aba7d487e766bcba179494617e9b9e608fa3b406d386fa6093fa8a52b":{"blocks":[{"children":[{"title":"第一，使用 Claude 起草中文反鱼雷火控系统规范——即负责瞄准并确定反鱼雷武器响应时机的核心逻辑。该文档被设计用于获得一家中国国防制造商批准，继而推进技术认证和实战测试。"},{"title":"第二，使用 Claude 制作 200 多页中文技术提案，并配套管理层汇报演示稿。"},{"title":"第三，基于公开信息，让 Claude 把自身系统与特定美国反鱼雷、反潜项目进行基准比较，并根据开源报道生成关于美国海军系统的中文简报。"}],"kind":"section","title":"我们识别出一名位于中国的威胁行为者，其使用 Claude 同时推进三条反鱼雷武器系统工作线"},{"children":[],"kind":"leaf","title":"行为者把自己包装成美国国防领域的原始设备制造商。我们评估其与一家中国国防工业制造商有关，目标是为中国人民解放军海军制作武器规范与采购提案。"},{"children":[],"kind":"leaf","title":"行为者用 Claude 撰写采购提案并进行多轮迭代。每一版之后，都让 Claude 扮演敌对专家审稿人进行批评，再利用这些反馈改进下一版。同时，行为者还用 Claude 构建反鱼雷火控软件的若干模块，并设计验证这些模块的测试矩阵。"},{"children":[],"kind":"leaf","title":"其获得的行动能力提升主要来自让 Claude 自动化复杂技术产出。模型压缩了认证登记、合规文档和自动火控逻辑的研发周期；同时，Claude 通过角色扮演连续多轮批评采购提案，也加快了传统人类评审循环。"},{"children":[],"kind":"leaf","title":"我们在针对疑似武器开发的内部调查中发现这些活动。无法把该活动归属到具体实体或个人，但由于其违反 Supported Regions Policy 以及禁止武器设计和开发的 Usage Policy，我们封禁了该账号，并把调查发现纳入防护以降低未来滥用风险。"},{"children":[],"kind":"leaf","title":"图 2. 行为者并行推进的三条工作流：建立本土反鱼雷火控规范、制作中文方案，以及比较分析美国项目。"}],"html":"\u003cp\u003e我们识别出一名位于中国的威胁行为者，其使用 Claude 同时推进三条反鱼雷武器系统工作线：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e第一，使用 Claude 起草中文反鱼雷火控系统规范——即负责瞄准并确定反鱼雷武器响应时机的核心逻辑。该文档被设计用于获得一家中国国防制造商批准，继而推进技术认证和实战测试。\u003c/li\u003e\n\u003cli\u003e第二，使用 Claude 制作 200 多页中文技术提案，并配套管理层汇报演示稿。\u003c/li\u003e\n\u003cli\u003e第三，基于公开信息，让 Claude 把自身系统与特定美国反鱼雷、反潜项目进行基准比较，并根据开源报道生成关于美国海军系统的中文简报。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e行为者把自己包装成美国国防领域的原始设备制造商。我们评估其与一家中国国防工业制造商有关，目标是为中国人民解放军海军制作武器规范与采购提案。\u003c/p\u003e\n\u003cp\u003e行为者用 Claude 撰写采购提案并进行多轮迭代。每一版之后，都让 Claude 扮演敌对专家审稿人进行批评，再利用这些反馈改进下一版。同时，行为者还用 Claude 构建反鱼雷火控软件的若干模块，并设计验证这些模块的测试矩阵。\u003c/p\u003e\n\u003cp\u003e其获得的行动能力提升主要来自让 Claude 自动化复杂技术产出。模型压缩了认证登记、合规文档和自动火控逻辑的研发周期；同时，Claude 通过角色扮演连续多轮批评采购提案，也加快了传统人类评审循环。\u003c/p\u003e\n\u003cp\u003e我们在针对疑似武器开发的内部调查中发现这些活动。无法把该活动归属到具体实体或个人，但由于其违反 Supported Regions Policy 以及禁止武器设计和开发的 Usage Policy，我们封禁了该账号，并把调查发现纳入防护以降低未来滥用风险。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F2a9ebbee3b14c546b3010a3bfd932fa75b72a5e7-1920x966.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/div\u003e\n\n\u003cp\u003e图 2. 行为者并行推进的三条工作流：建立本土反鱼雷火控规范、制作中文方案，以及比较分析美国项目。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"我们识别出一名位于中国的威胁行为者，其使用 Claude 同时推进三条反鱼雷武器系统工作线：\n\n- 第一，使用 Claude 起草中文反鱼雷火控系统规范——即负责瞄准并确定反鱼雷武器响应时机的核心逻辑。该文档被设计用于获得一家中国国防制造商批准，继而推进技术认证和实战测试。\n- 第二，使用 Claude 制作 200 多页中文技术提案，并配套管理层汇报演示稿。\n- 第三，基于公开信息，让 Claude 把自身系统与特定美国反鱼雷、反潜项目进行基准比较，并根据开源报道生成关于美国海军系统的中文简报。\n\n行为者把自己包装成美国国防领域的原始设备制造商。我们评估其与一家中国国防工业制造商有关，目标是为中国人民解放军海军制作武器规范与采购提案。\n\n行为者用 Claude 撰写采购提案并进行多轮迭代。每一版之后，都让 Claude 扮演敌对专家审稿人进行批评，再利用这些反馈改进下一版。同时，行为者还用 Claude 构建反鱼雷火控软件的若干模块，并设计验证这些模块的测试矩阵。\n\n其获得的行动能力提升主要来自让 Claude 自动化复杂技术产出。模型压缩了认证登记、合规文档和自动火控逻辑的研发周期；同时，Claude 通过角色扮演连续多轮批评采购提案，也加快了传统人类评审循环。\n\n我们在针对疑似武器开发的内部调查中发现这些活动。无法把该活动归属到具体实体或个人，但由于其违反 Supported Regions Policy 以及禁止武器设计和开发的 Usage Policy，我们封禁了该账号，并把调查发现纳入防护以降低未来滥用风险。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F2a9ebbee3b14c546b3010a3bfd932fa75b72a5e7-1920x966.jpg\u0026w=3840\u0026q=75\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n图 2. 行为者并行推进的三条工作流：建立本土反鱼雷火控规范、制作中文方案，以及比较分析美国项目。","sourceFormat":"markdown"},"note:sha256:194589129067527af07a90fdcf4defdb92e58a73a9571133b9abdac04b9ac586":{"html":"\u003cp\u003e我们封禁了与该行动相关的账号，其中包括通过共享基础设施关联到同一行为者的第二组账号；同时还在映射与该基础设施有关的更大账号网络。我们已经部署检测，以防止该行为者未来再次滥用。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e行为者画像\u003c/td\u003e\n\u003ctd\u003e为中国政府客户工作的商业承包商（中等置信度），很可能与国家安全、统一战线或宣传生态有关；提示词为简体中文；zh-CN locale；活动集中在中国工作时间；通过共享基础设施高置信度判断两组账号属于同一行为者。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e行动特征\u003c/td\u003e\n\u003ctd\u003e名为“Daily Report 1”的账号；带版本控制的“舆情监控”框架（v2.6），包含主控表和附录；要求模型扮演服务政府的舆情分析员；政治敏感度评分；术语标准化与叙事重构；强制加入对抗性分析章节；整合正式心理战、法律战和舆论战理论。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e输出\u003c/td\u003e\n\u003ctd\u003e政府风格“舆情简报”；通过代码执行环境定期生成多份格式化简报；每天处理 15 至 30 多篇文章。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e目标\u003c/td\u003e\n\u003ctd\u003e国内外异议人士和活动人士；维吾尔、藏人等少数族裔和宗教社群；台湾政治人物、劳工和学生行动者；外国媒体；知名全球人权组织。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 10. “舆情监控”行动指标：行为者画像、行动特征、输出格式和监控目标。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们封禁了与该行动相关的账号，其中包括通过共享基础设施关联到同一行为者的第二组账号；同时还在映射与该基础设施有关的更大账号网络。我们已经部署检测，以防止该行为者未来再次滥用。\n\n| **类别** | **指标** |\n| --- | --- |\n| 行为者画像 | 为中国政府客户工作的商业承包商（中等置信度），很可能与国家安全、统一战线或宣传生态有关；提示词为简体中文；zh-CN locale；活动集中在中国工作时间；通过共享基础设施高置信度判断两组账号属于同一行为者。 |\n| 行动特征 | 名为“Daily Report 1”的账号；带版本控制的“舆情监控”框架（v2.6），包含主控表和附录；要求模型扮演服务政府的舆情分析员；政治敏感度评分；术语标准化与叙事重构；强制加入对抗性分析章节；整合正式心理战、法律战和舆论战理论。 |\n| 输出 | 政府风格“舆情简报”；通过代码执行环境定期生成多份格式化简报；每天处理 15 至 30 多篇文章。 |\n| 目标 | 国内外异议人士和活动人士；维吾尔、藏人等少数族裔和宗教社群；台湾政治人物、劳工和学生行动者；外国媒体；知名全球人权组织。 |\n\n表 10. “舆情监控”行动指标：行为者画像、行动特征、输出格式和监控目标。","sourceFormat":"markdown"},"note:sha256:19cd34d8d538ee46f5058a09f42a8acf6ac9c13fda13f505ebccec550f3ad4e8":{"html":"\u003cp\u003e我们识别出一场与中国政府有关联的行动，行为者使用 Claude 跟踪、画像并招募叙利亚境内的维吾尔人及维吾尔武装编队。被作为武装目标的人，是近期加入新组建叙利亚军队的维吾尔族成员，而中国政府将这些编队认定为恐怖组织。行为者借助 Claude 寻找并联系被判断可能接触这些编队的叙利亚境内人员，随后试图招募他们，包括提出以付费换取有关部队情况的报告。\u003c/p\u003e\n\u003cp\u003e此外，行为者还使用 Claude 定位叙利亚境内特定维吾尔商家和兴趣地点。这些活动与更广泛的监控行动并行，包括监视维吾尔侨民记者，以及为政府客户起草监控平台投标文件的商业项目。行为者主要使用中文，其情报收集优先级与中国国家安全系统的关注方向一致。我们以低置信度判断，该行为者更可能是代表中国国家安全系统工作的承包商，而非国家安全机关直接行动。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我们识别出一场与中国政府有关联的行动，行为者使用 Claude 跟踪、画像并招募叙利亚境内的维吾尔人及维吾尔武装编队。被作为武装目标的人，是近期加入新组建叙利亚军队的维吾尔族成员，而中国政府将这些编队认定为恐怖组织。行为者借助 Claude 寻找并联系被判断可能接触这些编队的叙利亚境内人员，随后试图招募他们，包括提出以付费换取有关部队情况的报告。\n\n此外，行为者还使用 Claude 定位叙利亚境内特定维吾尔商家和兴趣地点。这些活动与更广泛的监控行动并行，包括监视维吾尔侨民记者，以及为政府客户起草监控平台投标文件的商业项目。行为者主要使用中文，其情报收集优先级与中国国家安全系统的关注方向一致。我们以低置信度判断，该行为者更可能是代表中国国家安全系统工作的承包商，而非国家安全机关直接行动。","sourceFormat":"markdown"},"note:sha256:1a746fddd6cfd7012517bc3f8b772e261a4485c4cc13290b47fbd6d25959778d":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e媒体名称\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e域名（已去武器化）\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eX（T
