行动职位。该团体多名操作者把 Claude 用作一项协同进攻计划的工程与编排层，涉及多类任务：尝试入侵生产系统；侦察中东、欧洲和东南亚的外国政府网络；持续针对主要端点安全产品进行漏洞研究和利用开发；恶意软件开发；以及构建情报收集平台。值得注意的是，该团队并行运行多个工作流，共享工具与基础设施，并维护可在不同工作会话之间保留上下文的持久行动记录；其收集和漏洞研究能力在操作者离开后仍可继续运行。\u003c/p\u003e\n\u003cp\u003e该行为者针对约 50 个组织，覆盖教育、零售、能源、科技、医疗、金融、制造业，以及全球多个政府机构。他们攻陷一家教育科技公司，从其云存储中提取数百 MB 学生个人数据；还进入一家零售公司的生产系统，抵达内部主机，并证明其有能力修改实时生产环境；此外，他们还针对一个东南亚政府机构，获取包含姓名、电话号码和家庭地址的公民记录。\u003c/p\u003e\n\u003cp\u003e该团体维护一套自主漏洞研究计划，核心是持续研究一款主要安全产品（这类软件本身正是专门用来检测入侵的）。研究产出多个此前未知的漏洞，并由攻击者在自有实验室环境中验证。同一研究工作还为多个网络与安全设备家族产出了可用利用代码。在另一条工作流中，行为者被观察到针对全球多个政府机构所使用的同类设备尝试实施网络利用。我们封禁了与这些操作者关联的账号，并部署额外监控，以检测和封禁相关活动。\u003c/p\u003e\n\u003cp\u003e多个不同工作流并行运行：一条执行漏洞利用与入侵；一条侦察外国政府；一条逆向安全产品寻找新漏洞；一条开发和测试定制恶意软件；另一条构建并维护收集基础设施。\u003c/p\u003e\n\u003ch4 id=\"自主间谍活动\"\u003e自主间谍活动\u003c/h4\u003e\n\u003cp\u003e操作者经常运行“Agent Swarm”：由一个主 AI Agent 拆分侦察和入侵后任务，再把它们派发给大量并行运行的子 Agent。该行动维护持久的 Campaign Memory。目标列表、收集到的凭据、行动状态和长期指令都会跨工作会话保存，因此每次会话都可以在行动中途恢复，并继续使用此前积累的上下文。该集群还构建并运营一个情报收集平台，无人值守地批量抓取符合国家情报优先级的开源材料，包括公开可访问的军事条令和官方出版物、地区防务报道以及政策来源。\u003c/p\u003e\n\u003ch4 id=\"设备零日研究二进制逆向与漏洞利用开发循环\"\u003e设备零日研究：二进制逆向与漏洞利用开发循环\u003c/h4\u003e\n\u003cp\u003e以下简要描述该行为者在零日漏洞工厂中的循环。攻击者配置自主 AI 工作流，以设备固件和二进制为目标。流程从通过 Tool Server 把固件和二进制加载进反编译器开始。一个辅助 Agent 先概览镜像，再沿着反编译与交叉引用链展开分析——整个调用流包含数千次反编译调用，连续反编译序列占据主要部分。随后，它会基于一个长期维护的知识库以及此前查找过的 PoC，形成漏洞假设。接着，工作流会针对这些假设编写利用代码，并在目标产品的实验室副本上测试。整个过程持续迭代修改利用代码，直到成功，最终把成果纳入操作者私有的 Exploit Portfolio。\u003c/p\u003e\n\u003cp\u003e供应商固件镜像通过专门构建的 Skill 获取和解密，解包为 Root Filesystem，再载入反汇编和审计会话。多个并行 Agent 按组件逐一搜寻漏洞模式，且被要求提供证据并使用项目记忆。某一持续针对网络设备迭代的工作流，仅一个月就产出十多个可能的零日漏洞发现。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F72970785999715f22b78c4fc2d0e2f20786fdfd3-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 12. 设备零日研究：二进制逆向与漏洞利用开发循环。\u003c/p\u003e\n\u003ch4 id=\"攻击面与-osint-侦察循环\"\u003e攻击面与 OSINT 侦察循环\u003c/h4\u003e\n\u003cp\u003e其他 AI 工作流持续运行以执行侦察。流程从特定目标行业生成扫描范围，经专用 Tool Server 调用资产搜索引擎和配套探测工具，对结果进行指纹识别。识别出的暴露面被绘制出来，再根据已知漏洞筛选入口。每一轮发现都会写入持久项目记忆，并扩展下一轮扫描的目标集合。该行为者使用这套框架针对多个外国政府和外交机构，以及十多家中国国内企业。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff3ddd5297b62ba79c500e9d921a6bafbf7dfb954-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 13. 攻击面与 OSINT 侦察循环。\u003c/p\u003e\n\u003ch4 id=\"自主收集集群循环\"\u003e自主收集集群循环\u003c/h4\u003e\n\u003cp\u003e由 13 个常驻收集 AI Agent 组成的集群按计划任务运行，识别并下载目标网站内容，包括公开可访问的美国军方和政府站点（如合同公告），以及社交媒体账号内容。工作流通过分层爬虫、反 Bot 绕过技术和商业代理出口完成这些任务。相邻流水线再以情报报告风格对获取内容进行摘要和评分，之后把工作流摘要交付到一个分发门户。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F966baae8ca495387317bcf4fe8c4147522584903-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 14. 自主收集集群循环。\u003c/p\u003e\n\u003ch4 id=\"人工直接参与的入侵\"\u003e人工直接参与的入侵\u003c/h4\u003e\n\u003cp\u003e操作者主要参与开发、消费工作流输出，以及由自主利用工作流产生的入侵事件；或者在通过弱凭据、收集到的凭据和暴露控制台获得访问时亲自介入。进入内部网络后，AI 助手会枚举主机，通过凭据复用和暴露的管理面提升权限，收集凭据和数据存储，把材料中转回操作者基础设施，再根据已获得内容转向下一台主机。尽管 AI 工作流在全球范围针对实体，该行为者的人工直接入侵却只集中于中国境内受害者。\u003c/p\u003e\n\u003ch3 id=\"ai-供应链既是目标战利品也是攻击算力\"\u003eAI 供应链：既是目标、战利品，也是攻击算力\u003c/h3\u003e\n\u003cp\u003eAI 带来的能力增益受到恶意行为者和更广泛犯罪经济体的高度追逐。被攻陷的 API Key、会话 Token 和设备所代表的 AI 访问权限，越来越成为多个犯罪团体的唯一目标。此类团体常常通过中间商转售访问权，而中间商又为欺诈性 AI 经销商网络供货；这些网络不断轮换新的被盗 API Key 和会话 Token，直到额度耗尽。恶意行为者也会从中间商处使用或购买这些被盗凭据，用于自己的网络攻击。\u003c/p\u003e\n\u003cp\u003e犯罪型 AI 供应链已经形成多种“养殖”受害者 API Key 和会话 Token 的路径。其中一种方式，是伪装成真实 AI 服务提供商来投递恶意软件。攻击者搭建网站，声称自己是多个 AI 模型之间的中介服务，并以折扣价提供前沿模型访问。访问者可能通过多种方式被攻陷，其中最持久的一种，是诱导受害者下载并安装恶意客户端应用。这些应用常伪装成包括 Claude Code 在内的热门 AI Harness，实际却是凭据窃取器，会收集设备上的全部凭据和已认证会话 Token 并发送给攻击者，其中包括任何 AI 相关会话 Token 或 API Key。当受害者的 API Key 或账号被识别为已泄露并重置后，凭据窃取器仍会继续识别设备上出现的新会话并发送给行为者。这样一来，攻击者实际上复制了那些自己为其供应被盗凭据的欺诈经销网络模式，却让受害者设备持续向攻击者“供给”凭据，再把这些凭据转售给欺诈经销商。\u003c/p\u003e\n\u003cp\u003eGTG-50021 是从事类似活动的一个团体，由讲俄语和乌克兰语的人员组成，其中一人使用别名“kl1zy”。他们运营一个欺诈性 AI 经销业务，号称提供廉价 Claude 访问——结果既不便宜，也根本不是 Claude。客户以为自己购买的是折扣 Claude，但其流量实际上被静默代理到另一个 AI 模型；与此同时，经销工具会安装凭据窃取器，盗取客户 Anthropic 账号凭据，再转卖给其他 AI 代理经销商用于恶意活动。\u003c/p\u003e\n\u003ch5 id=\"gtg-50021-入侵指标\"\u003eGTG-50021 入侵指标\u003c/h5\u003e\n\u003cpre\u003e\u003ccode\u003eawstore[.]cloud\nkiro[.]cheap\nsys-tools[.]cfd\naws-us-east-3[.]com\nholdboost[.]store\ndeltaclient[.]xyz\niymkjuzymkapovrntoxy.supabase[.]co\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e还有一些团体直接以 AI 生态与供应链本身为目标，试图通过 AI 厂商、评估机构和可信访问计划获取受限制模型。例如，我们观察到多个行为者攻陷 AI Wrapper 服务对 LiteLLM 的实现，通过 Prompt Injection 外传其云托管容器环境中使用的生产 API Key。\u003c/p\u003e\n\u003cp\u003e欺诈经销商越来越多地从被攻陷访问权限中获得“货源”。最常见的来源，是合法客户不慎把 API Key 和会话 Token 暴露在产品、应用和公开代码中，例如 GitHub、移动应用安装文件、Docker 容器、网站和聊天机器人。恶意行为者持续挖掘这些来源中的暴露 Key，并分析可能的身份验证滥用途径。\u003c/p\u003e\n\u003cp\u003e拿到 AI 凭据的操作者一次获得三样东西：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e战利品：\u003c/strong\u003e 被盗 Key 和账号在成熟黑市中具有转售价值；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e算力：\u003c/strong\u003e 掌握凭据后，其攻击工作负载可以由别人承担费用；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e掩护：\u003c/strong\u003e 活动会被归因到凭据的合法所有者。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e后文描述的一场黑客行动主义活动完全依赖被盗 API Key 运行了一个月。ShinyHunters 关联成员在入侵中获得受害者 AI Key 后，会把自己的攻击负载切换到受害者 Key 上。GTG-50020 攻陷一家 AI 供应商的评估沙箱后，最先拿走的也是其生产 Key。\u003c/p\u003e\n\u003cp\u003eAI API Key 与会话 Token 本身就是攻击目标；客户围绕 AI 构建的集成——例如沙箱、代理和经销网络——也属于攻击面。组织应以对待生产凭据同等级别的严肃程度对待 AI Key 和 Agent 集成，因为攻击者正是如此看待它们。AI 访问应只通过授权渠道购买。任何所谓“折扣”如果要求把流量和凭据交给未知中间商转发，都会给用户数据和系统带来巨大风险。\u003c/p\u003e\n\u003ch3 id=\"gtg-50020从酒店预订平台到-ai-供应链\"\u003eGTG-50020：从酒店预订平台到 AI 供应链\u003c/h3\u003e\n\u003cp\u003eGTG-50020 是一个讲俄语、以经济利益为动机的行为者，历史上曾入侵酒店预订和金融科技平台。在一次入侵中，他们从一名受害者处外传约 26 GB 数据，并试图通过勒索付款（或在暗网论坛售卖数据）获得 150 万至 250 万美元。\u003c/p\u003e\n\u003cp\u003e随后，他们把同样的技战术转向 AI 行业。通过向一家 AI 厂商的自动评估沙箱注入恶意指令，攻击者诱使沙箱交出了其持有的凭据，其中包括属于该厂商、来自多个提供商的生产 AI API Key。\u003c/p\u003e\n\u003cp\u003e攻击者随后滥用这些被盗 Key，同时继续针对该 AI 厂商和其他无关目标实施入侵。实际上，一旦获得目标 API Key，他们就会自动停止使用自己的 Key，切换到受害者 Key。随后，同一基础设施又在约四天内以类似技术攻击了大约 30 家 AI 公司：找到一条成功攻击路径后，就重复应用到 30 个目标，只针对不同环境做轻微调整。攻击者明示的目标，是通过十多个不同途径获得尚未发布的 Claude 模型访问权。但其从未成功，所有尝试路径都失败了。整个过程中涉及的 Key 都是从客户环境窃取的客户 Key；攻击者从未攻陷 Anthropic 自身系统。\u003c/p\u003e\n\u003cp\u003e这个案例是迄今最清楚的证据之一：AI 供应链已经成为蓄意的犯罪目标。攻击者追逐 AI 厂商的生产 API Key，并明确希望——但需要强调的是，从未实现——获得未发布 AI 模型的访问权。\u003c/p\u003e\n\u003ch4 id=\"人类指挥的-ai-渗透测试循环\"\u003e人类指挥的 AI 渗透测试循环\u003c/h4\u003e\n\u003cp\u003e操作者为每个目标维护一份 Scope 文件，由它启动自定义工作流，把任务委派给并行的侦察和利用 Agent。Agent 的发现会再次测试，确认是否真正能获得访问；如果可行，就合并到增量报告中。工作流再继续循环至下一个目标域名。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F0c118bda9102ec213c6035fb16a4847509c49e1b-1920x496.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 15. 人类指挥的 AI 渗透测试循环。\u003c/p\u003e\n\u003ch4 id=\"自主利用流水线\"\u003e自主利用流水线\u003c/h4\u003e\n\u003cp\u003e攻击者使用一套容器化开源渗透测试平台，前端接入本地模型网关，目标为 Web 应用。Worker Agent 在无人监督下执行注入、XSS、身份验证绕过和 SSRF 测试，把潜在发现和凭据收集到操作者工作区。该循环对生产系统启用了真实利用，也就是说，同一工作流既尝试识别漏洞，也主动利用漏洞获取访问权限。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd67f43c0159621c1e7b84b5cc5245f0e2bed40a2-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 16. 自主利用流水线。\u003c/p\u003e\n\u003ch4 id=\"欺诈账号工厂\"\u003e欺诈账号工厂\u003c/h4\u003e\n\u003cp\u003e攻击者配置住宅代理和反检测浏览器 Profile，然后由 Bot 在交易所和市场类目标上自动完成注册流程。商业验证码破解服务、自动轮询邮箱以及自动身份验证步骤共同绕过入驻控制，最终把完成验证的账号储备起来供后续行动使用。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F08c5bd02a2fc4c27002bc17f5f07c29e38000d59-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 17. 欺诈账号工厂。\u003c/p\u003e\n\u003ch4 id=\"kyc-中间人拦截伪装\"\u003eKYC 中间人拦截伪装\u003c/h4\u003e\n\u003cp\u003e攻击者还开展凭据窃取和钓鱼。受害者会被引导到外观相似的身份验证域名，该域名的反向代理把真实 KYC 流程转发给受害者，因此受害者完成的是真实身份验证，但夹在中间的代理会捕获已经通过验证的会话和文档。攻击者随后从自己的机器上使用被捕获会话，访问目标服务和数据。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F57702ff9f64d0a10b7c3c12f0debec33dd185124-1920x471.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 18. KYC 中间人拦截伪装。\u003c/p\u003e\n\u003ch5 id=\"攻击者出口-ip-1\"\u003e攻击者出口 IP\u003c/h5\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003eIP\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e开始\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e结束\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e141.133.125[.]208\u003c/td\u003e\n\u003ctd\u003e2026-05-21\u003c/td\u003e\n\u003ctd\u003e2026-05-23\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e167.250.111[.]136\u003c/td\u003e\n\u003ctd\u003e2026-05-23\u003c/td\u003e\n\u003ctd\u003e2026-06-03\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e178.16.54[.]141\u003c/td\u003e\n\u003ctd\u003e2026-05-21\u003c/td\u003e\n\u003ctd\u003e2026-06-16\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e37.27.103[.]22\u003c/td\u003e\n\u003ctd\u003e2026-05-26\u003c/td\u003e\n\u003ctd\u003e2026-06-13\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e194.163.183[.]216\u003c/td\u003e\n\u003ctd\u003e2026-05-23\u003c/td\u003e\n\u003ctd\u003e2026-05-24\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e202.66.167[.]230\u003c/td\u003e\n\u003ctd\u003e2026-05-21\u003c/td\u003e\n\u003ctd\u003e2026-06-04\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e146.103.101[.]253\u003c/td\u003e\n\u003ctd\u003e2026-05-21\u003c/td\u003e\n\u003ctd\u003e2026-06-13\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e146.103.97[.]169\u003c/td\u003e\n\u003ctd\u003e2026-05-21\u003c/td\u003e\n\u003ctd\u003e2026-05-25\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 3. 攻击者出口 IP。\u003c/p\u003e\n\u003ch3 id=\"gtg-50029以欧洲政治及关联实体为目标的黑客行动主义者\"\u003eGTG-50029：以欧洲政治及关联实体为目标的黑客行动主义者\u003c/h3\u003e\n\u003cp\u003eAI 正在缩小能力差距，把低水平“黑客行动主义者”抬升为类似高级持续性威胁的行动者。正如多个案例反复显示的那样，AI 能力既提高进攻型网络操作者的能力基线，也降低所需资源。本节详细介绍我们调查并阻断的一场黑客行动主义活动：规模很小但动机强烈的操作者，因为把 AI 集成到作业中，得以实现相当显著的目标。\u003c/p\u003e\n\u003cp\u003e2026 年春季，我们观察到一名讲法语的单独行为者使用 Claude，针对欧洲政党、媒体、智库，以及这些组织使用的 SaaS 提供商。\u003c/p\u003e\n\u003cp\u003e该行为者用 Rust 构建了一套自定义扫描器，用于扫描和验证公开容器中暴露的 API Key。一旦验证成功，工具就会通过本地代理层轮换不同 Key 的使用，使其流量能够混入被盗 API Key 合法所有者的正常流量。正如前述案例所示，一枚暴露 API Key 就足以移除恶意操作者的进入门槛。\u003c/p\u003e\n\u003cp\u003eGTG-50029 又一次展示了行为者如何在整个杀伤链上采用 AI。攻击者在一个可管理子 Agent 的框架中使用 AI 的 Agentic 编码能力；这些子 Agent 又分别负责认证前后侦察、代码审查，以及核验不同 AI 模型给出的发现。\u003c/p\u003e\n\u003ch4 id=\"新型利用与专用工具\"\u003e新型利用与专用工具\u003c/h4\u003e\n\u003cp\u003e该行动用于初始进入目标系统的标志性技术，是利用一个此前未公开记录的 WordPress“重新安装竞态条件”，在没有有效凭据的情况下创建恶意管理员账号。攻击者在同一个会话中使用 Claude 开发和调试利用代码，包括构建实验环境 Harness。该方法至少在四个受害网站上成功。\u003c/p\u003e\n\u003cp\u003e在一个案例中，攻击者通过一个暴露的搜索端点攻陷政治竞选管理平台。他让 Agent 在这一端点上反复迭代，最终外传约 14 万条记录，其中包含用户政治观点。\u003c/p\u003e\n\u003cp\u003e针对另一个目标时，攻击者把一个 WebShell 隐藏在字体资源中。WebShell 是放置在 Web 服务器上的小型脚本，允许攻击者远程发送命令并让服务器执行，本质上是一个可通过网站直接访问的后门。攻击者在识别出允许上传的漏洞后，现场构建 WebShell。他们还使用一个 WordPress “must-use”插件——这类插件每次页面加载都会执行，而且不能从管理员后台关闭——来收集提交的凭据，并用每个站点独有的公钥加密后等待取回。此外，GTG-50029 还污染了受害者备份，推测是为了维持持久化：如果受害者从旧备份恢复环境，就会再次被感染。\u003c/p\u003e\n\u003cp\u003e最后，攻击者通过注入脚本部署浏览器利用 C2 框架，攻陷一家媒体机构并“挂钩”其读者浏览器。这让攻击者能够对数千个来访浏览器进行指纹识别。我们观察到，攻击者明确利用这套框架搜寻编辑人员的会话和凭据。\u003c/p\u003e\n\u003cp\u003e该行为者的标志性工具名为“fafsearch”，是一套专门构建的开盒（doxxing）平台。它提供编译后的搜索引擎，包含数据摄取流水线、把单个泄露数据集与已外传数据交叉比对的能力、对国家身份号码与电话号码的规范化、排序逻辑、测试以及容器化部署。攻击者向平台导入数千万行数据，包括国家医疗标识符和司法系统泄露信息，并与其自身入侵获得的材料融合。之后，他们把结果发布为一组匿名托管的暗网服务，可以按姓名检索与目标政治运动有关联的个人。\u003c/p\u003e\n\u003cp\u003e这是我们所见最清晰的案例之一：AI 辅助软件工程被直接用于大规模隐私攻击，而整个平台由一个人独立创建。\u003c/p\u003e\n\u003cp\u003e在跟踪的 42 个目标实体中，攻击者至少进入了 14 个内部环境。其访问并外传了估计 12–26 GB 数据库 Dump，包括政党捐助者和成员记录、一个含 15,000 封邮件的邮箱、学生申请记录（包括未成年人数据）以及支付服务商数据。攻击者还部署了实时凭据拦截。利用这些已外传数据，他们在自营 Tor 泄露站点上为每名受害者准备独立加密归档。\u003c/p\u003e\n\u003ch4 id=\"攻击者出口-ip-基础设施\"\u003e攻击者出口 IP 基础设施\u003c/h4\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e角色\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e首次发现\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e最后发现\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e139.59.2[.]243\u003c/td\u003e\n\u003ctd\u003eKey 验证服务器（DigitalOcean）\u003c/td\u003e\n\u003ctd\u003e2026-02-06\u003c/td\u003e\n\u003ctd\u003e2026-06-12\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e158.173.46[.]118, 146.70.116[.]131, 149.22.83[.]6, 138.199.60[.]29, 138.199.6[.]208, 103.216.220[.]19, 103.124.165[.]199, 103.141.60[.]144, 2001:ac8:27:89::a02d, 2001:ac8:29:84::a01d\u003c/td\u003e\n\u003ctd\u003e商业 VPN/DC 攻击出口（Mullvad/M247/31173/Datacamp；AL/AT/AR/CH/BG/SK/DE）— 主要 Key 操作窗口\u003c/td\u003e\n\u003ctd\u003e2026-03-25\u003c/td\u003e\n\u003ctd\u003e2026-05-20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e34.156.199[.]132, 34.156.95[.]176\u003c/td\u003e\n\u003ctd\u003e被劫持 GCP 项目中的外传端点\u003c/td\u003e\n\u003ctd\u003e2026-04\u003c/td\u003e\n\u003ctd\u003e2026-05\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e136.144.242[.]56\u003c/td\u003e\n\u003ctd\u003e用于欧洲政治组织的中转与扫描服务器\u003c/td\u003e\n\u003ctd\u003e2026-05-17\u003c/td\u003e\n\u003ctd\u003e2026-05-21\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e163.172.157[.]53, 2001:bc8:711:5854:dc00:1ff:fe18[:]ba53\u003c/td\u003e\n\u003ctd\u003e持久专用服务器，Scaleway FR，用于后期行动\u003c/td\u003e\n\u003ctd\u003e2026-06-26\u003c/td\u003e\n\u003ctd\u003e2026-07-04\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 4. 攻击者出口 IP 基础设施。\u003c/p\u003e\n\u003ch4 id=\"攻击者拥有或控制的域名与服务\"\u003e攻击者拥有或控制的域名与服务\u003c/h4\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e角色\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e首次发现\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e最后发现\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003efrntrs-analytics.dedyn[.]io\u003c/td\u003e\n\u003ctd\u003eBeEF 浏览器 C2 主机名（deSEC 动态 DNS，攻击者持有 API Token）\u003c/td\u003e\n\u003ctd\u003e2026-05-13\u003c/td\u003e\n\u003ctd\u003e2026-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efrntrs-analytics-863060591218.europe-west1.run[.]app\u003c/td\u003e\n\u003ctd\u003eC2 域名背后的 Cloud Run Origin\u003c/td\u003e\n\u003ctd\u003e2026-05-13\u003c/td\u003e\n\u003ctd\u003e2026-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eprod-artfkt[.]com\u003c/td\u003e\n\u003ctd\u003e攻击者注册的行动域名\u003c/td\u003e\n\u003ctd\u003e2026 年 4–5 月观察到\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efafwatch[.]xyz\u003c/td\u003e\n\u003ctd\u003e攻击者注册的、与开盒活动相关的域名\u003c/td\u003e\n\u003ctd\u003e2026 年 4–5 月观察到\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3ell6n47y3ct4a3x67fbuz62q2mk2l4vo6eacho2suzftdshsnrfopyd[.]onion\u003c/td\u003e\n\u003ctd\u003eCRS 凭据保险库 API\u003c/td\u003e\n\u003ctd\u003e2026-05\u003c/td\u003e\n\u003ctd\u003e2026-07（调查结束时仍在线）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e6mshbvhvzhdgumwwazf4jcep2xx4kdk6n4wgffc46msu2gc3j3t2fpad[.]onion\u003c/td\u003e\n\u003ctd\u003e攻击者 Tor LLM 网关（第三方模型路由）\u003c/td\u003e\n\u003ctd\u003e2026-06\u003c/td\u003e\n\u003ctd\u003e2026-06\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 5. 攻击者拥有或控制的域名与服务。\u003c/p\u003e\n\u003ch3 id=\"主导趋势\"\u003e主导趋势\u003c/h3\u003e\n\u003ch4 id=\"概览\"\u003e概览\u003c/h4\u003e\n\u003cp\u003e尽管上述案例彼此没有关联，但有两个广泛发展趋势与所有案例都有关。\u003c/p\u003e\n\u003ch5 id=\"ai-技战术正在扩散ai-驱动网络行动的普及\"\u003eAI 技战术正在扩散：AI 驱动网络行动的普及\u003c/h5\u003e\n\u003cp\u003e就像合法经济活动中一样，AI 已经扩散到网络战场。包括 GTG-10002 在内的多个团体——\u003ca href=\"https://www.anthropic.com/news/disrupting-AI-espionage\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e此前已有报道\u003c/a\u003e——开发并使用自己的自主攻击框架；而 GTG-50020、GTG-50029 等其他团体则使用了 \u003ca href=\"https://github.com/vxcontrol/pentagi\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePentAGI\u003c/a\u003e 这样的公开进攻型 Agent 框架。这些公开框架为任何下载者复现了大量相同的编排脚手架，本报告多个行动直接运行在这些框架或其衍生版本上。\u003c/p\u003e\n\u003cp\u003e支持这一战场的市场也已经形成。我们发现 GTG-50021 搭建欺诈经销商，号称以折扣价提供 Claude 访问，实际却把用户流量静默代理到另一个模型，同时收集所有注册者的 Anthropic 凭据。\u003c/p\u003e\n\u003cp\u003e这种扩散正在不同类型的威胁行为者、不同地区和不同任务之间发生。本报告描述的能力，应被视为任何有足够动机的行为者都有可能获得。我们会持续投入资源、工具和人员，发展更有效的方法，在危害真正发生前领先并阻断这些对手的访问。但我们预计，仍将长期面对高度有动机、且有时具备复杂国家支持背景的恶意网络行为者，并继续与公私部门伙伴共享威胁信息和最佳实践以缓解风险。\u003c/p\u003e\n\u003cp\u003e本报告既包含小型犯罪团伙，也包含国家支持组织指挥的行动。AI 的扩散正在拉平能力差距，使两类行为者都能获得同一组高级能力。它们之间最主要的区别，不再是“技术复杂度”，而是“意图”。过去，国家支持行为者可以凭借更多资源部署更高级网络能力；AI 的进步让非国家行为者也能获得过去主要由国家行为者掌握的能力。一名使用被盗 API Key 的黑客行动主义者（GTG-50029）、一个从移动应用中批量收集凭据的经济型犯罪团伙（GTG-50014），以及一个国家关联间谍操作者（GTG-20006），展示出相似的方法：使用 Agentic AI 开展针对多个受害者的行动，而过去这类行动往往需要一个团队。他们构建定制工具、执行入侵，并以单个人类操作者无法手工处理的规模加工被盗数据。\u003c/p\u003e\n\u003cp\u003e攻击本身并不陌生：被盗凭据、未修补边缘设备、暴露服务、SQL 注入和钓鱼仍然是主要手段。本报告没有哪一项行动依赖防御者从未见过的全新技术。真正变化的是攻击的\u003cem\u003e经济学\u003c/em\u003e。过去让资源充足行动与其他攻击者拉开差距的那类劳动——侦察、利用、工具开发和数据处理——如今都可以委派给 AI 模型；模型在 Harness 中以机器速度并行运行。前文数字已经体现结果：有的入侵从开始到完成只需两三小时，单个操作者就可以并行处理数十名受害者。\u003c/p\u003e\n\u003ch5 id=\"ai-在网络行动中的角色越来越自主\"\u003eAI 在网络行动中的角色越来越自主\u003c/h5\u003e\n\u003cp\u003e本报告案例中的 AI 使用横跨广泛的自主性光谱。一端是对话式使用：Claude 作为工程助手，用于创建恶意软件、钓鱼套件和监控工具。再往前一步，威胁行为者会指挥 Claude 执行真实操作——例如对受害网络运行命令、收集凭据、外传数据——但每个具体目标仍由人类决定（GTG-20006）。在最远端，一些行动能够以极少人类输入或监督自主运行：多 Agent 框架会针对多个受害者并行执行侦察、利用和窃取，连续运行数小时甚至数天（GTG-50014、GTG-50020、GTG-50029）。我们还观察到按预设时间表运行、完全无人工介入的收集集群（GTG-10007），以及在无人参与情况下定时续签被盗访问 Token、收集受害者云存储数据的任务（GTG-20006）。\u003c/p\u003e\n\u003cp\u003e需要牢记两个限定。第一，人类仍然保留对自己最重要的决策权，例如目标选择、发现内容的变现以及结果审阅。第二，“自主性”和“危害”是两个不同维度：\u003cem\u003e自主性\u003c/em\u003e会放大行动规模和速度，并降低运营成本与复杂度；但\u003cem\u003e严重程度\u003c/em\u003e依然由许多因素决定。我们报告的一些最严重入侵，恰恰来自人类逐步指挥每一步的行动。从经济学角度看，AI 自主性压缩了攻击者 ROI 计算中的成本侧：降低每场行动所需的技能门槛和人力，同时潜在收益基本不变。这种更有利的单位经济性，会让过去“不值得攻击”的边缘目标变得可行，并鼓励更高频、更低人工介入的行动。\u003c/p\u003e\n\u003ch5 id=\"附录-a\"\u003e附录 A\u003c/h5\u003e\n\u003cp\u003e以下列出威胁行为者为构建其 AI 驱动工作流而开发的 Skill。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F5b3c1191e266cbbe020d44dfb9acdbc1bedf5b9f-1920x1778.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 19. Skill 分类。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"使用-claude-检测并应对影响力行动\"\u003e使用 Claude 检测并应对影响力行动\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003e本节聚焦影响力行动。我们将其定义为：出于欺骗、扭曲或隐蔽影响个人或群体的认知、信念或行为之目的，对信息环境——包括政治、公民和公共讨论——实施操纵的活动；这类活动通常还会隐藏其来源、资助方或协调关系。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e我们的\u003ca href=\"https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e第一份威胁情报报告\u003c/a\u003e讨论过一个商业“影响力即服务”网络。此后，我们发现并阻断了规模更大、复杂度更高的行动。我们看到一些团体使用 Claude 搭建虚假社交媒体账号网络乃至完整新闻网站，并利用这些平台发布欺骗性内容，同时彻底隐藏行动背后的实体。\u003c/p\u003e\n\u003cp\u003e例如，某个行为者可以创建 100 个看起来属于某国普通公民的社交账号，再让这些账号在一周内全部发布内容，放大同一种政治立场。账号本身并不真实，其中表达的意见也并非真实持有；从表面上看，完全无法识别真正的幕后操作者。\u003c/p\u003e\n\u003cp\u003e本报告详细介绍其中九个案例。它们源自俄罗斯、伊朗、土耳其，以及海湾地区、南亚、非洲和欧洲，并针对六大洲的受众。行动背后的行为者包括政府、国家关联宣传机构和国家媒体，也包括向付费客户出售影响力服务的私营公司、国内政治操作者，以及一例流亡反对派运动。\u003c/p\u003e\n\u003cp\u003e值得注意的是，其中几场行动与全国性选举时间重合。例如，俄罗斯国家媒体在 2025 年 9 月摩尔多瓦投票前制造有关该国总统的虚假说法；而肯尼亚一名亲政府操作者则为 2027 年全国大选提前准备了伪装成草根舆论的社交媒体内容。\u003c/p\u003e\n\u003ch3 id=\"我们如何调查\"\u003e我们如何调查\u003c/h3\u003e\n\u003cp\u003e影响力行动既不是新事物，也不是互联网独有。新闻记者、研究人员和政府机构组成的成熟研究共同体，长期研究并揭露此类技战术，也建立了我们用于理解这类行动的\u003ca href=\"https://www.annenbergpublicpolicycenter.org/wp-content/uploads/ABC_Framework_TWG_Francois_Sept_2019.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e分析框架\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e但与社交平台通常要等内容已经开始传播后才能看到行动不同，我们有时会在行动尚处于搭建阶段时，就在 Claude 上看到它。行为者会使用 AI 规划行动、选择目标、撰写材料；这些任务会产生我们系统已训练去识别的信号，因此常常能让我们在行动真正启动前进行阻断。\u003c/p\u003e\n\u003cp\u003e一旦行动离开我们的平台正式上线，我们的直接可见性就结束了。为了验证调查结果并了解内容离开平台后发生了什么，我们依赖开源研究、跨平台行业数据和公开报道。每个案例都会说明我们如何发现相关活动，以及还有哪些机构参与调查。\u003c/p\u003e\n\u003cp\u003e一旦识别到行动，我们会封禁相关账号，并把活动归因到背后的组织。我们还会利用这些调查所得强化防护，把每次调查中发现的新技战术和行为模式反馈到检测系统中。\u003c/p\u003e\n\u003ch3 id=\"我们如何衡量触达\"\u003e我们如何衡量触达\u003c/h3\u003e\n\u003cp\u003e为了更准确评估每场影响力行动的实际影响，我们采用 \u003ca href=\"https://www.brookings.edu/articles/the-breakout-scale-measuring-the-impact-of-influence-operations/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBreakout Scale\u003c/a\u003e。这是一个被行业研究者广泛采用的六级框架，根据内容跨平台迁移与触达范围衡量影响：Category One 表示内容只局限于单个平台的单一社群；Category Two 到 Category Six 则代表公众曝光和传播程度逐级提高。\u003c/p\u003e\n\u003ch3 id=\"影响力行动趋势\"\u003e影响力行动趋势\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e影响力被作为服务出售。\u003c/strong\u003e 正如我们此前报告指出的，受政治实体、政府等客户雇佣的商业操作者，可以为任何愿意付费的人制作内容。这使真正委托影响力行动的一方获得可否认性，也让无法或不愿自行建设相关能力的行为者可以购买现成服务。本报告两个案例中，正常经营的广告或营销公司一边做普通商业业务，一边运营影响力行动。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI 充当新闻编辑台。\u003c/strong\u003e 在多个案例中，Claude 被嵌入一个本来就由人类编辑、已经运行的内容流水线，扮演副编辑或内容创作者。这让资源有限的行为者也能以远超其独立能力的规模运作影响力行动。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI 不只生产内容，也帮助建设整套行动装置。\u003c/strong\u003e 行为者让模型制作行动纲领、反对派档案、部长级材料包、人设系统、目标数据库、把编辑忠诚写进条款的雇佣合同，以及用于给参与行动的员工打分的评分标准。没有 AI 时，这类工作通常需要一个配备人员的项目办公室。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e复杂工具使用。\u003c/strong\u003e 我们发现一些影响力行动从一开始就被设计成可持续、可轻易扩张。包含行动原则的 Markdown 文件几乎原样重复用于数百个会话；行为者在 AI Agent 内维护禁用词清单，共享已批准来源和规避规则文件，并运行按固定批次调用 Claude 的定制软件。中央化设置意味着不同内容生产者甚至不需要彼此协调或相互认识。一名行为者还在制作课程，准备把工作流教给其他人。越来越多行动不再靠单次 Prompt 驱动，而是把大量规则嵌入持久 Memory 文件。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e洗白归因、来源和确定性。\u003c/strong\u003e 行为者使用 Claude 设计内容，让国家或委托方叙事看起来来自独立声音。他们要求 Claude 有意移除转载材料中的国家归因，把同一说法在多个媒体节点之间层层转手，使其读起来像是被不同来源独立证实。在一个与俄罗斯国家媒体有关的案例中，模型曾把某些说法标记为未经验证，操作者随后明确要求删除这些限定，把全部内容写成“已确认事实”。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e行动安全水平提高。\u003c/strong\u003e 威胁行为者想方设法隐藏身份来源。这从内容创作一开始就发生：要求模型移除自动生成文本的痕迹、写得更“自然”，设计账号养号和规避逻辑，并在交付前删除元数据和代号。他们还通过 VPN、外国电话号码、轮换账号和隐藏 IP 的第三方服务“洗白”自己对 Claude 的访问。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e虚假人设，以及冒充真实人设。\u003c/strong\u003e 行为者用 AI 生成头像、虚构记者履历、制作政治发言人，形成完整虚假人设。我们还发现冒充真实个人和真实机构的案例，包括国家发言人和人权组织，以及伪造政府文件。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e直接针对个人与问责机制。\u003c/strong\u003e 我们观察到：克隆一名真实活动人士账号，与其在伊朗境内的联系人进行实时对话；为其他伊朗人建立带逮捕历史的档案；代写在联合国人权理事会现场宣读的证词；以及为联合国特别报告员制作反制档案。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e影响力行动经常无法真正触达真实受众。\u003c/strong\u003e 因为我们处于行动的内容生产上游，在内容进入社交平台等分发渠道前就可能发现并阻断。我们识别的大多数内容只获得很少甚至没有真实互动；多个案例在形成受众前就被阻断。真实触达最广的情况，往往是国家媒体本身承担分发机制，包括 FM 广播、卫星与短波广播以及全球电视网络。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"gtg-04001阻断中非共和国境内的俄罗斯对外信息操纵与干预行动\"\u003eGTG-04001：阻断中非共和国境内的俄罗斯对外信息操纵与干预行动\u003c/h3\u003e\n\u003cp\u003e我们移除了一个由班吉一名讲俄语的行为者运营的账号。该行为者为一场针对中非共和国（CAR）、与俄罗斯国家利益一致的“对外信息操纵与干预”（Foreign Information Manipulation and Interference，FIMI）行动提供内容生产后台。\u003c/p\u003e\n\u003cp\u003e行为者通过 Radio Lengo Songo（98.9 FM）运营每日内容流水线，并与俄罗斯国家媒体 RT、Sputnik Afrique、TASS，以及班吉的 Russian House 协调。每次生成内容时，用户都会明确要求 Claude 把亲俄、反法的论点嵌入报道。为了实现充分可否认性，他们还要求模型去除典型格式习惯，避免新闻 Feed 看起来像合成或 AI 生成文本。在抽样活动中，大多数内容支持中非共和国政府、支持 Wagner、反法并反对中非共和国反对派。\u003c/p\u003e\n\u003cp\u003eAll Eyes On Wagner 项目近期的一份\u003ca href=\"https://alleyesonwagner.org/2026/05/26/manufacturing-enemies-politologys-war-on-civil-society-in-car/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e调查报告\u003c/a\u003e显示，这家广播电台由 Wagner Group 于 2017 年创建并资助。行为者设计了一条流水线，把伪造内容通过电台送入全国广播体系。他们以提供 Rossiya Segodnya 面向外国记者的 SputnikPro 媒体培训名额，交换广播时段。这样一来，俄罗斯官方国家材料就可以披着普通全国性节目的外衣抵达当地听众。\u003c/p\u003e\n\u003cp\u003e表面上，大部分内容看起来像由普通中非共和国记者撰写；但我们的调查把该行为者与 Politology 联系起来。Politology 被认为是 Africa Corps/Wagner 的影响力分支，并被评估在 2023 年底转入俄罗斯对外情报局（SVR）控制。我们判断，该个人充当 Politology 在当地的媒体协调人。最终，这名行为者传播的是与俄罗斯国家立场一致的宣传。这是一场由俄罗斯国家指挥、旨在操纵并干预中非共和国信息空间的秘密行动。\u003c/p\u003e\n\u003cp\u003e使用 Breakout Scale，我们将该行动评估为 Category Four：内容每天通过 Radio Lengo Songo 98.9 FM 广播，再由 Telegram 频道放大，并被中非共和国当地新闻媒体转载。\u003c/p\u003e\n\u003ch4 id=\"关键发现\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e行动完全由外国力量运营，却被精心设计成看似源自班吉本地。讲俄语的行为者负责指挥产出，而合同、脚本和帖子则把它包装成中非共和国广播电台自身的工作。\u003c/li\u003e\n\u003cli\u003e该网络使用 Claude 自动化人力资源与内部管理。行为者要求模型生成合同，其中强制员工忠于中非共和国总统以及“俄罗斯及其派驻力量”；还用模型撰写职位说明、评分标准和“三次违规即解雇”流程。之后，他们按这些标准给员工文章打分，并让 Claude 建议哪些员工应保留、哪些应解雇。当 Claude 指出评分中的政治倾向后，行为者只是把相关维度改成中性名称，继续沿用评分。\u003c/li\u003e\n\u003cli\u003e行为者还开展三类旨在实现政治控制和影响的活动：组织周期性监控行动，追踪并更新中非共和国反对派政治人物数据；为 Russian House 的发言人起草战略论点和声明——Russian House 是俄罗斯在海外用于软实力与政治活动的文化和信息中心；以及基于原始设计文件伪造中非共和国政府文件，包括宪兵和国防部通信材料。\u003c/li\u003e\n\u003cli\u003eClaude 拒绝执行该行动最激进的一项要求：把真实个人点名为武装分子，以诱导安全机构对其采取行动。行为者随后改用“匿名消息源”的叙事方式。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"攻击生命周期与-ai-使用\"\u003e攻击生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e外国行为者提供主题和论点，再用 Claude 把它们转化成简报、合同、脚本、图形和帖子。其中一些材料被准备好交付给总统府发言人和 Russian House 负责人。重复使用的模板和长期指令表明，大部分规划在发送任何 Prompt 给 Claude 之前，就已离线完成。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fe3724dfd4779f2c838c6cb0b70c54cc5f757ef2a-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 1. 与该行动有关的亲俄 Telegram 频道；这些频道会被固定导出，用于风格语气分析、模仿和分发。\u003c/p\u003e\n\u003ch4 id=\"组织节点\"\u003e组织节点\u003c/h4\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e实体\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e在行动中的角色\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eRadio Lengo Songo / SARL Media International（98.9 FM）\u003c/td\u003e\n\u003ctd\u003e主要枢纽；亲俄编辑路线；HR 基础设施把政治服从写入制度。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRussian House / Rossotrudnichestvo, Bangui\u003c/td\u003e\n\u003ctd\u003e国家文化节点与协调点（Dmitri Sytyi）。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSputnik Afrique / Rossiya Segodnya\u003c/td\u003e\n\u003ctd\u003e国家媒体内容供应方；合作与交换（以培训换播出时段）。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRT, TASS\u003c/td\u003e\n\u003ctd\u003e国际放大；协调部长访谈。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAfrica Corps / Wagner\u003c/td\u003e\n\u003ctd\u003e行动所宣传的安全力量主体；相关内部行动数据被访问。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTelegram: СОМБ («Туристы в Африке»), «Залечь на дне в Банги»\u003c/td\u003e\n\u003ctd\u003e军事宣传频道和亲俄本地声音频道（风格被模仿）。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRadio Centrafrique\u003c/td\u003e\n\u003ctd\u003e被作为下游“洗白”终点的国家广播机构。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNdjoni Sango, Pravda RCA\u003c/td\u003e\n\u003ctd\u003e被允许作为来源使用的立场一致本地媒体。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 1. 围绕该行动的关联媒体与平台。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e我们最初是在收到 INPACT/All Eyes on Wagner 的线索后识别出该网络。这些组织的\u003ca href=\"https://alleyesonwagner.org/2026/07/07/the-svr-arms-politology-with-chatgpt-and-claude-in-the-central-african-republic/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e报道\u003c/a\u003e帮助我们启动内部审查，并独立确认网络中相关人员的身份。我们移除了该账号及其背后的组织，并根据其行为特征建立自动检测，用于未来识别和阻断类似行动。\u003c/p\u003e\n\u003ch3 id=\"gtg-54002阻断横跨六大洲的商业影响力即服务行动\"\u003eGTG-54002：阻断横跨六大洲的商业“影响力即服务”行动\u003c/h3\u003e\n\u003cp\u003e我们识别并移除了一个使用 Claude 批量生产和改写政治内容的账号。该行动用模型在大约 70 个伪造新闻网站上重写并分发虚构新闻，随后又由约 70 个相互对应的 X/Twitter 账号，以及一个包含 250 多个虚假评论账号的 X/Twitter 网络进一步放大。\u003c/p\u003e\n\u003cp\u003e调查显示，这场行动面向六大洲的全球受众。虽然操作者刻意让网络看起来像彼此独立的本地新闻编辑部，但我们追踪到其背后是法国数字广告机构 LKM Company。\u003c/p\u003e\n\u003cp\u003e该网络并不坚持单一政治意识形态，而是根据当时付款方是谁，在政治光谱不同阵营之间切换立场。这符合商业“影响力即服务”模式：私营公司受雇操纵信息、改变公众意见、推动特定政治议程，或对个人实施定向抹黑。\u003c/p\u003e\n\u003cp\u003e我们较早阻断了该行动，当时它尚未建立真实受众。网络用约 20 种语言至少发布了 8,913 篇文章，但我们识别到的大多数内容几乎没有来自真实受众的可观察互动。按 Brookings Institution 的 Breakout Scale 评估，这一行动属于 Category Two：内容在网络自有网站和匹配的社交账号之间传播，没有证据显示它突破自身网络形成外部扩散。\u003c/p\u003e\n\u003ch4 id=\"关键发现-1\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e行为者主要用 Claude 做两件事：为虚假新闻站点撰写完全原创的文章，以及改写合法记者发布的真实文章。自动化系统会把真实新闻改写成带政治倾向的版本，并针对不同国家受众和所需政治角度做适配。\u003c/li\u003e\n\u003cli\u003e行动特别针对政治竞争高度激烈的民主环境，包括美国、巴西、法国和刚果民主共和国（DRC）。由于这些国家政治环境非常不同，目标选择并不支持“单一政治议程”的解释。\u003c/li\u003e\n\u003cli\u003e调查发现若干信号，表明部分活动可能反映一名或多名在当前 DRC—卢旺达冲突中有利益关系的客户诉求。我们无法独立确认究竟是哪些客户委托了这些内容，也没有发现任何政府直接指挥的证据。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"攻击生命周期与-ai-使用-1\"\u003e攻击生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e该行动在很短时间内搭建 Web 基础设施：2025 年中期约十周内，从法国集中注册这些域名，并把所有站点托管在一个共享部署之上。这让调查人员能够把表面看似独立的约 70 个新闻网站，关联到同一个操作者账号。\u003c/p\u003e\n\u003cp\u003e网络使用 Claude 建立标准化内容流水线。所有 Prompt 都要求固定 JSON 输出结构、格式化 HTML、精确字符数，以及每篇文章包含三到四个内部链接。借此，操作者可以自动化大规模生成和发布内容。这些文章还被专门设计来提升站点在搜索引擎中的权威度排名。\u003c/p\u003e\n\u003cp\u003e我们发现该行动反复使用三种操纵策略：把同一来源故事分别改写成相反意识形态版本，面向不同受众；给原本不带政治色彩的故事加入政治角度；以及把故事跨国“洗”到无关地区，同时去除原始语境。\u003c/p\u003e\n\u003cp\u003e为了让文章显得真实，操作者使用虚假记者姓名作为署名。调查确认这些作者实际上并不存在。\u003c/p\u003e\n\u003cp\u003e这些虚构署名让每个站点看起来都像拥有独立员工的本地新闻编辑部。网络还为每个虚假媒体配套一个 X（原 Twitter）账号，随后再由一层评论账号放大。这些评论账号与网站几乎在同一时间段创建，很多使用 AI 生成头像；大多数虚假账号创建于 2025 年 6 月和 7 月。\u003c/p\u003e\n\u003cp\u003e2025 年 9 月 11 日，我们检测到明显协同式虚假行为：多个网络网站在三分钟内发布几乎相同的 DRC—卢旺达冲突文章。操作者会根据不同地区受众调整语气，同时协调多个 X 账号分发这些链接。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fb518031942512c47b27b5a0c65d67c509318c867-1990x704.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 2. 使用 AI 生成头像的虚假评论账号样本，来自该网络在 2025 年 6—7 月创建的 250 多个账号。\u003c/p\u003e\n\u003ch4 id=\"聚焦-drc-的活动\"\u003e聚焦 DRC 的活动\u003c/h4\u003e\n\u003cp\u003e深入观察网络产出后，可以看到对刚果民主共和国的明显聚焦：所有虚假新闻站点共发布 318 篇相关文章。这些故事通常支持 DRC 政府立场，尤其关注地区矿产交易以及与卢旺达持续紧张的关系。这一策略与网络早期受众增长相符：在最初几周，大部分关注其 X 账号的虚假人设都与 DRC 有关，其 DRC 专用新闻账号一度成为整个行动中分享最多、最受欢迎的账号。\u003c/p\u003e\n\u003cp\u003e我们还观察到一个把自己包装成刚果平民“数字军队”的 X 账号关注了该网络多个账号。我们没有发现任何政府指挥的证据。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9ce3edba5554816c9f0aac2d661ba860ba7551a2-1990x1620.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 3. 放大 DRC 相关内容的虚假评论账号，显示该行动 250 多个账号中的协同集群。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F219929a00ffce40e1a67b9d9fa33084a01daf6ec-1990x1620.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 4. 协同集群中的虚假评论账号，用于放大 DRC 相关内容。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F4f3d2da01fe0c8488f61c0f1f30b4e539a095cb6-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 5. 该网络约 70 个虚假媒体站点之一，托管在行动共享基础设施上。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-1\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e我们在持续调查该地区影响力行动时识别到该账号，随后封禁该账号及其关联组织，并实施新的检测方法，针对其行为特征。下文分享相关指标，以帮助其他产业伙伴采取行动，尤其包括把整个网络关联到同一账号的共享部署标识，以及从约 70 个虚假媒体中按地区选取的代表性样本（完整域名与账号清单另行提供）：\u003c/p\u003e\n\u003ch4 id=\"虚假媒体样本\"\u003e虚假媒体样本\u003c/h4\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e媒体名称\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e域名（已去武器化）\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eX（Twitter）账号\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eNaija Pulse\u003c/td\u003e\n\u003ctd\u003enaijapulse[.]org\u003c/td\u003e\n\u003ctd\u003e@Naijapulse_\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAxum Voices\u003c/td\u003e\n\u003ctd\u003eaxumvoices[.]org\u003c/td\u003e\n\u003ctd\u003e@AxumVoices\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJambo Journal\u003c/td\u003e\n\u003ctd\u003ejambojournal[.]org\u003c/td\u003e\n\u003ctd\u003e@journaljambo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eZion Pulse\u003c/td\u003e\n\u003ctd\u003ezion-pulse[.]com\u003c/td\u003e\n\u003ctd\u003e@zionpulse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAl Watan Al Akbar\u003c/td\u003e\n\u003ctd\u003ealwatanalakbar[.]com\u003c/td\u003e\n\u003ctd\u003e@saudinews966\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEcho Berlin\u003c/td\u003e\n\u003ctd\u003eechoberlin[.]info\u003c/td\u003e\n\u003ctd\u003e@berlin_echo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe British Daily\u003c/td\u003e\n\u003ctd\u003ebritish-daily[.]com\u003c/td\u003e\n\u003ctd\u003e@britishdaily_\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRussian Way\u003c/td\u003e\n\u003ctd\u003erussianway[.]info\u003c/td\u003e\n\u003ctd\u003e@RussianWayMedia\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePak Sarzameen\u003c/td\u003e\n\u003ctd\u003epakssarzameen[.]org\u003c/td\u003e\n\u003ctd\u003e@PSarzameeninfo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVoice of the Rejuvenation\u003c/td\u003e\n\u003ctd\u003evoiceoftherejuvenation[.]com\u003c/td\u003e\n\u003ctd\u003e@fuxingmedia\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl Pulso Popular\u003c/td\u003e\n\u003ctd\u003eelpulsopopular[.]com\u003c/td\u003e\n\u003ctd\u003e@elpulsopopular\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFifty States\u003c/td\u003e\n\u003ctd\u003efiftystates[.]news\u003c/td\u003e\n\u003ctd\u003e@Fiftystatesnews\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCivic Pulse\u003c/td\u003e\n\u003ctd\u003ecivicpulse[.]info\u003c/td\u003e\n\u003ctd\u003e@Civicpulsemedia\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCommonwealth Post\u003c/td\u003e\n\u003ctd\u003ecommonwealth-post[.]com\u003c/td\u003e\n\u003ctd\u003e@cmwthpost\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 2. 该网络约 70 个虚假新闻媒体的代表性样本，包括已去武器化域名及对应 X 账号。\u003c/p\u003e\n\u003ch3 id=\"gtg-84005阻断针对马来西亚的商业选举操纵平台\"\u003eGTG-84005：阻断针对马来西亚的商业选举操纵平台\u003c/h3\u003e\n\u003cp\u003e我们识别并移除了一个使用 Claude 运营商业选举操纵平台的账号，主要针对马来西亚用户。网络由约 1,000 个虚假 X/Twitter 社交账号、一家虚假新闻媒体和一系列伪造档案组成。\u003c/p\u003e\n\u003cp\u003e该平台把自己包装成防御型网络情报与反虚假信息工具平台。然而，我们的调查发现其与总部位于伊斯坦布尔的技术公司 BBS Bilisim Teknolojileri 存在明确联系；该公司把平台作为付费的“影响力即服务”能力出售。根据威胁行为者自己的文档，这套基础设施被营销为“军用级、AI 驱动、实时政治行动生态系统”。\u003c/p\u003e\n\u003cp\u003e行动中的行为者利用由 Claude 构建的平台，摄取人口普查和选举数据后，按选区逐一画像并针对马来西亚选民。平台管理约 1,000 个虚假账号，并专门优化这些账号来抬高互动指标、规避社交平台检测。系统还运营一个名为“Malaysia Pulse”的虚假新闻网站，由 AI 改写流水线持续为该合成媒体供稿。\u003c/p\u003e\n\u003cp\u003e行动背后的人员还制作伪造情报档案，用虚假指控攻击一名反对派政治人物和公民社会组织。这些指控完全由行为者编造。\u003c/p\u003e\n\u003cp\u003e我们按 Breakout Scale 将该行动评为 Category Two：相关资产分布在多个平台，但没有证据显示其突破进入真实社群。\u003c/p\u003e\n\u003cp\u003e行为者使用 Claude Code 构建定制 Dashboard，用于管理、运行和追踪虚假账号网络。Dashboard 会记录每个目标从欺骗性账号获得的点赞、浏览量等指标。一个针对马来西亚高级政府官员账号的示例显示数百万级数据。由于这些数字来自行为者自己的工具自报，我们无法独立验证。\u003c/p\u003e\n\u003ch4 id=\"关键发现-2\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e行动使用真实人口普查、选举数据以及数百万条选民记录，针对马来西亚最敏感的政治社会裂缝：覆盖全部 222 个国会选区的族群、宗教和王室议题。\u003c/li\u003e\n\u003cli\u003e平台管理超过 1,000 个虚假 X/Twitter 账号。每个账号都包含“养号”逻辑，在投入影响力行动前先运行一段时间模拟真实账号，包括定期更新 Cookie 与 IP 地址。Dashboard 里还有一个参数，让用户设定每个目标最多应获得多少人工浏览量。我们观察到一个支持马来西亚现任总理的请求，要求为其账号制造 100 万次人工浏览。\u003c/li\u003e\n\u003cli\u003e行为者针对具名个人生成指控，而模型自己的研究找不到任何可佐证信息。\u003c/li\u003e\n\u003cli\u003eClaude 多次拒绝执行行动要求，例如识别到某份文件属于政治诽谤材料后拒绝继续；行为者随后会与模型“协商”更中性的措辞，以继续构建相同能力。\u003c/li\u003e\n\u003cli\u003e行为者曾寻求与马来西亚国家通信监管机构签订合同。我们没有发现该尝试成功的证据。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"攻击生命周期与-ai-使用-2\"\u003e攻击生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003eClaude 被用于：用真实选举数据构建选区定向系统；设计并运行虚假社交账号网络及其检测规避逻辑；改写和“洗白”虚假新闻；以及反复修改伪造档案。\u003c/p\u003e\n\u003cp\u003e合成新闻媒体还抓取马来西亚合法媒体报道，让模型连续改写数次后，以虚构署名重新发布。它也转载俄罗斯和中国国家关联外国媒体内容，包括 TV BRICS、新华社、Sputnik/RIA 和 CGTN，并删除国家来源归因，把这些内容包装成独立的马来西亚本地报道。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e集群\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eClaude 的用途\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e最严重元素\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e选民定向系统\u003c/td\u003e\n\u003ctd\u003e基于真实人口普查与选民数据构建选区画像\u003c/td\u003e\n\u003ctd\u003e围绕族群、宗教和王室裂缝进行微定向\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e虚假账号网络\u003c/td\u003e\n\u003ctd\u003e约 1,000 个账号、养号与规避逻辑\u003c/td\u003e\n\u003ctd\u003e高度相似发帖；针对一国政府首脑制造人工互动\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成新闻媒体\u003c/td\u003e\n\u003ctd\u003eAI 改写流水线、虚构署名\u003c/td\u003e\n\u003ctd\u003e把俄罗斯和中国国家媒体内容洗成“独立报道”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伪造档案\u003c/td\u003e\n\u003ctd\u003e以虚假权威包装的“情报报告”\u003c/td\u003e\n\u003ctd\u003e制造针对具名个人的虚假指控\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e加密通信工具\u003c/td\u003e\n\u003ctd\u003e行动安全通信\u003c/td\u003e\n\u003ctd\u003e为该行动专门构建的行动安全能力\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 3. 一个覆盖完整影响力行动链条的商业平台：定向、放大、合成新闻、伪造档案和行动安全。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff5b85037fdaf7b599c544e77b0f76c06d75257a1-1990x858.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 6. 虚假评论账号画像，转发并分享来自该平台的内容。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F50310bb34607a9bcac2a1ecddae75c7547ebc5e2-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 7. 虚假新闻媒体“Malaysia Pulse”，是该行动背后的页面之一；域名注册于 2026 年 5 月 10 日。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd1b0a944121b60eaea479afba155f1c75da4a87d-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 8. 与该行动关联的虚假 YouTube 频道，首个也是唯一一个视频在数周后发布。归档：hXXps[://]archive[.]ph/GZCoq。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-2\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e我们通过内部检测识别该账号，并利用恢复出的指标映射整个行动范围，同时阻断后续滥用。\u003c/p\u003e\n\u003cp\u003eClaude 在多个节点拒绝或部分拒绝了行为者的请求，其中包括：模型已经把某份伪造档案识别为政治诽谤材料，以及对明显唤起“心理行动”的措辞表示拒绝。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e类型\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e备注\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003emalaysiapulse[.]com; bbsteknoloji[.]com\u003c/td\u003e\n\u003ctd\u003e域名\u003c/td\u003e\n\u003ctd\u003e攻击者控制：新闻前台、公司\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e23.88.118[.]216; 91.99.117[.]166; 157.180.93[.]7; 167.235.157[.]100; 46.62.214[.]3; 46.225.91[.]180\u003c/td\u003e\n\u003ctd\u003eIP（Hetzner）\u003c/td\u003e\n\u003ctd\u003eXPanel/MalaysiaPulse、NEOS、Renderer、NEOS Docker、Panel、Voxta\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003egithub[.]com/bbsbilisimteknolojileri-cell\u003c/td\u003e\n\u003ctd\u003e代码\u003c/td\u003e\n\u003ctd\u003e组织仓库与开发者 Handle\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@armsam1209, @kioskou, @Chikmore, @avihoue, @goldsteve1, @adriansantodo, @bmmyangels, @telkisoszoba, @SHIHAN1947, @garyponce, @hugolaurent, @exceiivier\u003c/td\u003e\n\u003ctd\u003e马甲账号（示例）\u003c/td\u003e\n\u003ctd\u003e12 个账号，共享同一创建时间（2026 年 5 月 17 日）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@malaysiapulseof\u003c/td\u003e\n\u003ctd\u003e频道\u003c/td\u003e\n\u003ctd\u003e合成新闻行动的 YouTube 频道\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 4. 马来西亚选举操纵平台的入侵/行动指标：攻击者控制域名、托管 IP、代码仓库、马甲账号及合成新闻频道。\u003c/p\u003e\n\u003ch3 id=\"gtg-24015阻断基于-claude-构建的俄罗斯国家媒体编辑流水线\"\u003eGTG-24015：阻断基于 Claude 构建的俄罗斯国家媒体编辑流水线\u003c/h3\u003e\n\u003cp\u003e我们识别并移除了四个账号，其中各自的操作者都把 Claude 当成编辑与新闻生产台，再通过俄罗斯国家媒体渠道分发内容。这些操作者产出已经润色完成的成品，并直接送入生产线播出。\u003c/p\u003e\n\u003cp\u003e虽然各操作者都试图隐藏身份，但我们以高置信度判断，他们最终把产出共享给俄罗斯国有或国家资助媒体，而且 Claude 生成的内容最终确实通过俄罗斯国家关联媒体发布和播出，包括面向摩尔多瓦受众的 \u003cem\u003eSputnik Moldova\u003c/em\u003e 和 \u003cem\u003eRIA Novosti\u003c/em\u003e，面向拉丁美洲的 \u003cem\u003eSputnik en Español\u003c/em\u003e，面向非洲的 \u003cem\u003eSputnik Africa\u003c/em\u003e，以及 RT 全球播出的 \u003cem\u003eRT 英语新闻编辑部\u003c/em\u003e。\u003c/p\u003e\n\u003cp\u003e操作者利用不同媒体组成传播链，让俄罗斯来源的说法看起来像被不同渠道独立报道。借助 Claude 工作流，他们达到了通常需要整个专业编辑团队才能实现的生产规模。\u003c/p\u003e\n\u003cp\u003e与那些难以触达真实受众的秘密账号网络不同，这些个人操作者制作的内容通过成熟媒体渠道分发。我们把单条 Claude 产出与已发布内容比对时，看到的实际触达从一条约 2,000 次浏览的 Telegram 帖子，到真实上电视播出的广播文案不等。我们无法判断这些媒体总产出中，有多大比例经过了涉及 Claude 的流水线。\u003c/p\u003e\n\u003ch4 id=\"关键发现-3\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e一名前 \u003cem\u003eSputnik Moldova\u003c/em\u003e 总编辑使用 Claude，把罗马尼亚语和摩尔多瓦新闻、民调数据以及反对派社交帖子转成俄语文章；这些内容最终发布在 \u003cem\u003eSputnik Moldova\u003c/em\u003e Telegram 频道和 RIA Novosti，并在俄罗斯与摩尔多瓦媒体网络间放大，制造虚假的“多源验证”循环：同一个故事被不同媒体重复回响，看起来像获得了独立确认。\u003c/li\u003e\n\u003cli\u003e同一行为者在摩尔多瓦最近一次重大全国投票——2025 年 9 月 28 日举行的\u003ca href=\"https://en.wikipedia.org/wiki/2025_Moldovan_parliamentary_election\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e2025 年摩尔多瓦议会选举\u003c/a\u003e——前，放大针对总统 Maia Sandu 的捏造和诽谤性说法。\u003c/li\u003e\n\u003cli\u003e一名与俄罗斯有关联的承包商直接从 Telegram 频道提取内容，再利用 Claude 为 \u003cem\u003eSputnik en Español\u003c/em\u003e 以及 Telegram 账号 @ATodaPotencia 撰写拉丁美洲西班牙语文章。在 Sputnik Mundo 一名主持人兼制片人的编辑监督下，该承包商还把产出输送给一个“看似独立”的 Telegram 频道，把与克里姆林宫一致的叙事重构成本地自然评论。\u003c/li\u003e\n\u003cli\u003e一名俄罗斯国有媒体员工使用 Claude 构建直播内容，具体处理跑马字幕、屏幕标题、旁白脚本和短标题；输入来自俄罗斯新闻通讯社、SVR（俄罗斯对外情报局）以及国防部。至少有一例得到确认，这些材料确实进入俄罗斯广播信号。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e在每场行动中，Claude 都被嵌入一个本来已经运行、由专业人员编辑的流水线，作为“副编辑层”，让单个员工的产出大幅超过其独立工作能力。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e最终分发渠道\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e受众\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e来源材料\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e输出形式\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eSputnik Moldova / RIA Novosti\u003c/td\u003e\n\u003ctd\u003e摩尔多瓦（俄语受众）\u003c/td\u003e\n\u003ctd\u003e罗马尼亚和摩尔多瓦新闻、民调、反对派社交帖子\u003c/td\u003e\n\u003ctd\u003eSputnik Moldova Telegram 与 RIA Novosti 的俄语文章，跨平台放大；秘密反对党材料\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSputnik en Español\u003c/td\u003e\n\u003ctd\u003e拉丁美洲（西班牙语）\u003c/td\u003e\n\u003ctd\u003e俄罗斯军事博主 Telegram（Rybar、Colonel Cassad 等）\u003c/td\u003e\n\u003ctd\u003e本地化西语文章 + @ATodaPotencia 帖子\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSputnik Africa\u003c/td\u003e\n\u003ctd\u003e非洲公众（英语）\u003c/td\u003e\n\u003ctd\u003e俄罗斯和法语新闻线（RIA Novosti、TASS、Sputnik Afrique）\u003c/td\u003e\n\u003ctd\u003e按 40 条内部风格规则生成 @sputnik_africa X/Twitter 与 News 帖文\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRT 英语新闻编辑部\u003c/td\u003e\n\u003ctd\u003eRT 全球英语广播受众\u003c/td\u003e\n\u003ctd\u003e俄罗斯新闻线、SVR 与国防部说法\u003c/td\u003e\n\u003ctd\u003e严格字符数的直播跑马字幕、屏幕标题和旁白\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 5. 国家媒体生产台：从来源材料，经 Claude 辅助本地化和框架化，到在受制裁媒体与放大网络上部署的共同生命周期。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Ff8895df92b5ec0ea58be773446ff04fc198e4e5d-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 9. 一条使用 Claude 创建并实际发布的帖子示例，获得 2.09K 次浏览；未观察到其他完全一致的匹配。“\u003ca href=\"https://t.me/rusputnikmd_2/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eSputnik Moldova 2.0\u003c/a\u003e”属于一组与 Sputnik News 有关的网站与频道网络。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fe976cb85cd718bdfd272d70d296ece74ab60c064-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 10. \u003ca href=\"https://ria.ru/20250721/opros-2030492835.html\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRIA Novosti\u003c/a\u003e 出现带细微变化的其他标题；该 RIA Novosti 文章又被其他亲克里姆林宫媒体转载。归档：hXXps[://]archive[.]ph/Q1zW0。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F4cee6e4dcbcfa110aea472b5f6e5a2cdfa0937fd-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 11. Sputnik Africa Twitter/X 账号实际发布的一条帖子，与 Claude 生成文本完全一致。归档：hXXps[://]x[.]com/sputnik_africa/status/2027706409727492278。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-3\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e我们通过内部检测识别这些账号，封禁了与四场行动有关的账号，并与产业和研究伙伴共享指标。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e类型 / 备注\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e国家媒体\u003c/td\u003e\n\u003ctd\u003eSputnik Moldova; RIA Novosti; Sputnik en Español; Sputnik Africa (@sputnik_africa); RT English (Russia Today, ANO TV-Novosti)\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e欺骗性放大资产\u003c/td\u003e\n\u003ctd\u003e@ATodaPotencia (Telegram)\u003c/td\u003e\n\u003ctd\u003e把与克里姆林宫一致的内容包装成自然的拉丁美洲本地分析\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e摩尔多瓦放大生态\u003c/td\u003e\n\u003ctd\u003eeadaily[.]com（受欧盟制裁）；point[.]md; vz[.]ru; mos[.]news; ru[.]euronews[.]com\u003c/td\u003e\n\u003ctd\u003e域名\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e来源洗白生态（俄罗斯军事宣传 Telegram）\u003c/td\u003e\n\u003ctd\u003eRybar (@rybar_america); Colonel Cassad (@boris_rozhin); @theaterVD; @china3army; @kalashnikovnews\u003c/td\u003e\n\u003ctd\u003eTelegram 频道\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 6. 四场俄罗斯国家媒体行动中的指标：分发媒体、欺骗性放大资产，以及用于洗白来源的 Telegram 生态。\u003c/p\u003e\n\u003ch3 id=\"gtg-34001阻断伊朗国家关联影响力行动icco伊斯兰宣传办公室与-bina-observatory\"\u003eGTG-34001：阻断伊朗国家关联影响力行动——ICCO、伊斯兰宣传办公室与 Bina Observatory\u003c/h3\u003e\n\u003cp\u003e我们识别并移除了三个与伊朗国家有关联的账号，它们利用 Claude 筹划影响力行动。相关人员正在规划并准备内容，以支持其所称的“软战争”或“认知战”项目。按他们自己的说法，这是一项通过非军事方式塑造国内外舆论的计划。调查发现，每场行动都由在某个具名伊朗国家宣传机构内部工作、或代表该机构行事的行为者运作。相关实体包括：隶属于文化与伊斯兰指导部的 Islamic Culture and Communications Organization（ICCO）；Khorasan Razavi Islamic Propaganda Office——其从 Mashhad 一所宗教学校运行一个认知战指挥室，分发与 IRGC 叙事一致的内容；以及 Islamic Propaganda Organization 旗下的 Bina Cultural Observatory。\u003c/p\u003e\n\u003cp\u003e在每个案例中，行动都依赖 Claude 构建活动计划、理论手册、人格系统、目标数据库和部级规划文档。以这种方式使用模型，使他们可以生成复杂的组织框架与资产；否则，这些工作通常需要一个人员完备的项目办公室才能完成。行为者还高度重视“归属洗白”：他们有意设计内容，让国家支持的叙事看起来像独立声音。正如 ICCO 行为者所说，他们作为文化专员的角色“不是叙述者，而是导演”。\u003c/p\u003e\n\u003cp\u003e行为者有意采取措施隐藏身份与来源地。由于从伊朗境内访问 Claude 被封锁，他们使用 VPN 和外国电话号码注册、验证账号。但在对话中，他们仍反复提到自己的地点、机构和职务。结合带有机构品牌的文档页脚，以及对相关个人的公开来源核验，这些信息把各场行动分别与对应的伊朗国家关联机构联系起来。\u003c/p\u003e\n\u003cp\u003e调查还发现，其中一些活动已经在其他平台传播。例如，我们观察到相关内容通过支持 IRGC 叙事的分发渠道扩散。\u003c/p\u003e\n\u003cp\u003e按照 Breakout Scale，我们将这场行动评估为 \u003cstrong\u003eCategory Three\u003c/strong\u003e：内容跨多个平台传播，并被观察到由 Eitaa 等平台上的 IRGC 关联频道分发。\u003c/p\u003e\n\u003ch4 id=\"关键发现-4\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e三场行动的行为者都明确把活动与伊朗国家层面的“\u003cem\u003eJihad al-Tabyin\u003c/em\u003e（解释性圣战）”原则联系起来。按照这一概念，伊朗机构把生产宣传既视为宗教义务，也视为战略职责。与该国家理论相关的措辞直接出现在行为者会话和内部规划文件中。\u003c/li\u003e\n\u003cli\u003e该网络制作了带有 ICCO 官方品牌的部级交付物，其中包括一个九部分组成的国际影响力项目组合，以及关于伊朗最高领袖葬礼的完整组织计划。\u003c/li\u003e\n\u003cli\u003e公开资料印证了 Mashhad 指挥室战略设计者与指挥官的身份和职务。这些负责人运作名为“Manjanegh（Catapult）”的跨省内容工厂，使用数十名活动人员，把伊朗安全机构公开报告重新包装为特定人格发布的内容，并隐藏与伊朗安全机构的关联。该网络还通过 100 多个伊朗平台频道开展付费放大，其中包括与 IRGC 有关的频道。\u003c/li\u003e\n\u003cli\u003e我们把行动与伊朗 Bina Cultural Observatory 一名主任级官员联系起来，并通过公开来源与账号遥测验证了这一关联。行为者在多个会话线程中以一名 IRGC 发言人的官方口吻生成内容。在围绕 2026 年美以伊战争的一场具体活动中，该网络把虚假说法归因给西方研究机构，包括 CSIS、Brookings 和 RAND。这两类手法都用于让国家支持的信息看起来更可信。\u003c/li\u003e\n\u003cli\u003e该网络还部署了具有攻击性的反叙事内容，针对遭受迫害的宗教少数群体巴哈伊教徒，并建立了包含国际官员和伊朗反对派人物姓名的目标数据库。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"行动生命周期与-ai-使用\"\u003e行动生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e我们确认，行为者把 Claude 作为这三场伊朗宣传行动的主要行政与运营层：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e首先，他们使用 Claude 构建理论和意识形态相关内容，包括数字行动管理与运作指南、操作手册、编码项目组合、人格系统、预警协议和影响力行动的放大时序方案。\u003c/li\u003e\n\u003cli\u003e其次，该网络使用 Claude 把政府官方情报简报转换成定制内容，覆盖波斯语、阿拉伯语、乌尔都语、马来语、西班牙语和英语，并制定了面向 20 种语言的更大计划。\u003c/li\u003e\n\u003cli\u003e第三，他们用 Claude 进行归属洗白，让帖子看起来来自外国作者或独立新闻来源，也让标签活动看起来像由普通公民自发发起。\u003c/li\u003e\n\u003cli\u003e第四，行为者通过 Eitaa、Bale、Rubika 等伊朗国内平台，以及 X/Twitter、Instagram、Telegram、TikTok、YouTube 和 ICCO 文化专员网络分发内容。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e机构\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eClaude 生成的内容\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e分发渠道\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eICCO / 文化与伊斯兰指导部\u003c/td\u003e\n\u003ctd\u003e部级影响力项目组合，以及最高领袖葬礼与继任计划\u003c/td\u003e\n\u003ctd\u003e文化专员网络、外国署名、社交平台\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKhorasan Razavi Islamic Propaganda Office\u003c/td\u003e\n\u003ctd\u003e“Manjanegh”内容工厂理论与人格定制内容；付费活动；分发与 IRGC 叙事一致的内容\u003c/td\u003e\n\u003ctd\u003eEitaa、Bale、Rubika，以及 X、Instagram、Telegram\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eIslamic Propaganda Organization / Bina Cultural Observatory\u003c/td\u003e\n\u003ctd\u003e重新包装 IRGC 发言人通告；系列化战争公共传播；借智库名义洗白\u003c/td\u003e\n\u003ctd\u003eBina Telegram 与 Instagram；国内受众\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 7. 三场伊朗国家关联行动与其机构、Claude 生成内容及分发渠道的对应关系。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F3a285b36a6c34c01c2377882cd8f26838c601c69-1990x734.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 12. 在伊朗国内消息平台 Eitaa 上观察到的 IRGC 关联频道，向波斯语国内受众传播该行动内容。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F615f56ed52a382c0631355595ea691dc268ff1d5-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 13. Threads 账号展示了其中一次实际定向攻击，此处目标是新闻媒体 Nawapress。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-4\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e我们通过内部调查识别这些账号，封禁了与三场行动相关的账号，并与产业和研究伙伴共享相关指标。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e类型 / 备注\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e归属机构\u003c/td\u003e\n\u003ctd\u003eIslamic Culture and Communications Organization（ICCO）及其 International Quran and Propagation Center，隶属文化与伊斯兰指导部；Khorasan Razavi Islamic Propaganda Office 与 Shahid Hasheminejad Cultural Technology House（Mashhad）；Islamic Propaganda Organization 及其 Bina Cultural Observatory\u003c/td\u003e\n\u003ctd\u003e机构\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eICCO 项目组合\u003c/td\u003e\n\u003ctd\u003e项目代码 A-01 至 B-04；注明 ICCO 和 IQPC 的文档页脚；人为制造草根感的 #IranStands 标签\u003c/td\u003e\n\u003ctd\u003e项目代码、页脚、标签\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMashhad 内容工厂\u003c/td\u003e\n\u003ctd\u003e内部命名 Manjanegh（Catapult）、Mashe（Trigger）、Chashni（Primer）；私人 Eitaa 频道“Monjaneq”；付费放大，包括 IRGC 关联频道 @hamyane_sepah 与 @moghavematnews_iran\u003c/td\u003e\n\u003ctd\u003e代号、频道\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBina\u003c/td\u003e\n\u003ctd\u003e冒充 IRGC 发言人；Bina Monitoring Center 的 Telegram 与 Instagram 频道\u003c/td\u003e\n\u003ctd\u003e频道、冒充\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 8. 三场伊朗国家关联行动的指标：归属机构、项目代码、内容工厂代号和放大渠道。\u003c/p\u003e\n\u003ch3 id=\"gtg-54006阻断面向孟加拉国农村地区支持-awami-league-的自动化假新闻行动\"\u003eGTG-54006：阻断面向孟加拉国农村地区、支持 Awami League 的自动化假新闻行动\u003c/h3\u003e\n\u003cp\u003e我们识别并移除了一个持续运行的自动化虚假信息网络，该网络使用 Claude 在孟加拉国生成捏造的孟加拉语新闻。行动重点是宣传 Bangladesh Awami League，并攻击其政治对手。由于 Awami League 自 2024 年 7 月起义后已不再执政，因此该网络是在为反对党而非政府开展活动。行为者完全清楚自己的欺骗手法；他们在内部沟通中写道：“没人知道这些新闻是假的。”\u003c/p\u003e\n\u003cp\u003e行动由孟加拉国 Gaibandha District 的一名行为者单独运作。为规避平台限制和检测，他轮换使用 29 个 Claude 账号。行为者使用名为 \u003ccode\u003efake_news_3.py\u003c/code\u003e 的自定义软件直接连接 Claude，程序被写死为按固定批次生成内容：15 个标题、3 篇详细虚构报道，以及 15 条图像生成提示词。根据行为者自己的说法，这些产出用于持续供应 Facebook Live、YouTube 和 TikTok 直播，目标受众是识字程度有限的农村 Awami League 支持者。\u003c/p\u003e\n\u003cp\u003e行为者至少生成了 1,500 个标题、300 条虚假叙事和 1,500 条图像提示词。由于 Claude 当时尚不具备图像生成功能，这些提示词很可能被导出到其他前沿 AI 模型，用于制作虚假叙事中的视觉内容。\u003c/p\u003e\n\u003cp\u003e行动在孟加拉国境内运行，目标也是国内受众，其内容旨在服务 Awami League 的利益。尽管叙事方向一致，我们的调查没有发现该党本身参与指导或资助该网络活动的证据。\u003c/p\u003e\n\u003cp\u003e调查显示，该行动的视频出现在三个社交媒体平台上的多个孟加拉国相关频道和账号中。我们无法确认究竟是哪些具体频道发布了全部产出，也没有证据表明这些内容在相关账号之外触达了更广泛受众。\u003c/p\u003e\n\u003cp\u003e按照 Breakout Scale，我们把该行动评估为 \u003cstrong\u003eCategory Three\u003c/strong\u003e：活动跨多个平台，并在多个聚焦孟加拉国的频道和社交媒体账号中观察到与其产出匹配的视频。\u003c/p\u003e\n\u003ch4 id=\"关键发现-5\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e行为者在内部把输出明确称为“假新闻”，要求内容“火爆、有攻击性”，并且要简单到“连村里人都能看懂”。其明确假设是，目标受众会把这些内容当成真实新闻。\u003c/li\u003e\n\u003cli\u003e内容一贯支持 Awami League，并针对 \u003ca href=\"https://en.wikipedia.org/wiki/Bangladesh_Nationalist_Party\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBangladesh Nationalist Party\u003c/a\u003e（BNP）、Jamaat-e-Islami、National Citizens Committee、临时政府和学生抗议领袖。网络使用捏造的抹黑活动，指控这些对手是外国代理人、试图推动塔利班式治理。\u003c/li\u003e\n\u003cli\u003e行为者还创建了独立上传脚本，通过 YouTube API 批量发布视频。脚本会借助第三方持续集成服务，按照提前一个月设置的计划发布内容。\u003c/li\u003e\n\u003cli\u003e该网络生成的一些叙事也与亲印度地缘政治利益一致，但我们没有发现任何国家指导或资助的证据。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"行动生命周期与-ai-使用-1\"\u003e行动生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e系统搭建完成后，行动以较少人工监督半自主运行。名为 \u003ccode\u003efake_news_3.py\u003c/code\u003e 的自定义程序调用 Claude API，按标准批次生成虚构孟加拉语内容，包括标题、详细叙事和配套图像提示词。程序还针对识字程度较低的农村受众，调优了带有强烈情绪色彩的主题。产出进入固定云存储文件夹，随后被转换为音频和视频，再由第二个脚本提前数月排入 YouTube 发布队列。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e叙事主题\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e手法\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e目标\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e宗教极端主义框架\u003c/td\u003e\n\u003ctd\u003e把反对派描述为计划实施塔利班式伊斯兰教法统治、渗透安全部队\u003c/td\u003e\n\u003ctd\u003eJamaat-e-Islami、BNP、NCP\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e暴力与阴谋\u003c/td\u003e\n\u003ctd\u003e捏造暗杀计划和行动小组\u003c/td\u003e\n\u003ctd\u003e临时政府、学生抗议领袖\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e外国代理人抹黑\u003c/td\u003e\n\u003ctd\u003e把学生领袖标记为外国情报机构代理人\u003c/td\u003e\n\u003ctd\u003e7 月抗议运动\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e腐败与阴谋\u003c/td\u003e\n\u003ctd\u003e捏造金融腐败和秘密跨党联盟\u003c/td\u003e\n\u003ctd\u003e反对党\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 9. 自动化假新闻流水线：从自定义 API 工具、批量捏造内容、云端暂存，到定时发布。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fa96c365e73fecaee2efb1c3149545a9d97c0d812-1990x734.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 14. 行为者用于在分发前存储和暂存视频内容的 Google Drive 文件夹。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-5\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e我们在内部调查中发现该活动并封禁了相关账号。我们预计行为者可能创建新账号继续活动，因此已经围绕其行为特征建立检测能力，以阻止其再次出现。与本报告其他行动一样，我们还把相关指标分享给对应分发平台和其他合作伙伴。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e类型 / 备注\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e行为者\u003c/td\u003e\n\u003ctd\u003e一名位于孟加拉国 Gaibandha District 的行为者，在约 16 个月内轮换使用 29 个 Claude 账号\u003c/td\u003e\n\u003ctd\u003e行为者\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e自动化工具\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003efake_news_3.py\u003c/code\u003e（API 内容生成，至少是第三版）；配套上传脚本（自动上传 YouTube、提前数月排程，并通过第三方持续集成服务路由以隐藏行为者 IP）\u003c/td\u003e\n\u003ctd\u003e脚本\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e固定输出格式\u003c/td\u003e\n\u003ctd\u003e每次运行生成 15 个虚构孟加拉语标题、3 篇详细叙事和 15 条英文图像生成提示词\u003c/td\u003e\n\u003ctd\u003e输出 Schema\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e保留给合作伙伴共享\u003c/td\u003e\n\u003ctd\u003e云存储文件夹标识符；上传脚本\u003c/td\u003e\n\u003ctd\u003e未公开\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 10. 支持 Awami League 行动的指标：单一孟加拉国行为者、自动化脚本和虚构内容输出格式。\u003c/p\u003e\n\u003ch3 id=\"gtg-84006阻断与-mekncri-一致的分布式影响力行动共享-ai-agent-冒充真人并在伊朗境内招募\"\u003eGTG-84006：阻断与 MEK/NCRI 一致的分布式影响力行动——共享 AI Agent 冒充真人并在伊朗境内招募\u003c/h3\u003e\n\u003cp\u003e我们识别并移除了一个分布式影响力行动，其目标包括伊朗境内和海外的伊朗受众。为欺骗用户，行动通过共享 AI Agent 冒充一名现实中的活动人士：先让 Agent 克隆该活动人士的私人 Telegram 账号，再用波斯语指示它“现在就是这个人”。行为者让 Claude 阅读约 8,400 条该人士的 Telegram 帖文，以模仿其写作风格，随后用它与联系人开展实时政治对话。据我们所知，这些联系人并不知道自己正在与一个 AI 辅助账号交流。\u003c/p\u003e\n\u003cp\u003e虽然相关行为者并未共享账号基础设施，也没有明显的协同行为迹象，但调查把这些活动与 People’s Mojahedin Organization of Iran（PMOI/MEK）及其政治前台 National Council of Resistance of Iran（NCRI）联系起来。\u003c/p\u003e\n\u003cp\u003e调查显示，至少四名运作该行动的人在 NCRI 官方媒体机构工作。行动依赖多个配备人员的 NCRI/MEK 媒体资产，横跨广播电视、卫星和短波广播、Instagram、Telegram 与 X/Twitter。委员会审批环节以及关于 MEK 领导层的记录，说明存在中央任务分配的可能性很高，但我们无法核实集中控制的具体程度。\u003c/p\u003e\n\u003cp\u003e按照 Breakout Scale，我们将该行动评估为 \u003cstrong\u003eCategory Two\u003c/strong\u003e：跨多个平台，通过网络自有的 NCRI 媒体资产和放大账号传播。\u003c/p\u003e\n\u003ch4 id=\"关键发现-6\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e行动成功抓取了 500 多个社交媒体频道，为伊朗境内个人建立详细画像，再按城市、年龄、职业、政治立场以及逮捕经历对目标分组，以便针对不同受众调整信息。\u003c/li\u003e\n\u003cli\u003e网络分析了这些对话中约 51,944 条归档消息，为伊朗境内数十名具名个人建立详细心理画像。为了进一步传播信息，冒充账号还同时向 30 多名联系人发送一条捏造的突发新闻标题。\u003c/li\u003e\n\u003cli\u003e为宣传 NCRI 主席 Maryam Rajavi 的十点计划，该网络为每篇文章创建 AI 生成头像，再为头像制作动画、加入波斯语音频，并把它们设计成普通伊朗人的样子，同时有意隐藏其 AI 生成属性。\u003c/li\u003e\n\u003cli\u003e行为者使用自动化流水线运作多个 Instagram 账号网络并协调发布时间，同时针对不同目标受众调整内容。为隐藏真实动机，最初的帖子刻意不提 Mojahedin，使该组织的宣传看起来像没有关联的中立新闻。\u003c/li\u003e\n\u003cli\u003e行动的信息重点针对伊朗政府、君主主义团体和 Pahlavi 阵营。行为者传播了一段攻击 Pahlavi 家族成员的伪造视频，并使用“Neither Shah Nor Sheikh”框架攻击目标，意在强化 MEK 在伊朗反对派中的位置。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"行动生命周期与-ai-使用-2\"\u003e行动生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e该网络依靠 Claude 支持影响力行动的所有阶段。行为者通过一个共享 AI Agent 平台管理任务，每个工作区都维护自己的长期记忆文件。随着时间推移，他们不断向这些文件加入具体指令，例如禁用词列表、批准来源、账号管理规则和规避检测的方法。这样一来，即使没有人类用户逐次指导每个会话，Agent 也能持续生产内容。其中一名行为者还把 MEK 的创立理论加载到模型记忆中，作为行动内部其他人可以复用的“战略基础数据”。\u003c/p\u003e\n\u003cp\u003e这场行动背后的人类管理高度结构化，包括由专门委员会组成的审批闭环，以及从内容纠正人员到管理者的正式审查流程。在沟通中，行为者反复使用“按照我们的合同”这一表述，并经常提到 MEK 领导层。我们发现，同一套行动手册在所有工作区中统一应用。\u003c/p\u003e\n\u003cp\u003e多数产出以波斯语为先，并把 2022 年抗议中自然形成的口号 «زن، زندگی، آزادی»（“Woman, Life, Freedom”）替换为 MEK 版本 «زن، مقاومت، آزادی»（“Woman, Resistance, Freedom”）。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e集群\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eClaude 的用途\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e最严重的要素\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e共享 Agent 平台（“Viktor”）\u003c/td\u003e\n\u003ctd\u003e基于持久记忆的 Agent 跨行为者自主、定时生产\u003c/td\u003e\n\u003ctd\u003e跨行为者共享的理论与规避规则，成为协同底层\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e实时冒充\u003c/td\u003e\n\u003ctd\u003e从私人消息克隆真人表达方式；以其身份进行实时对话\u003c/td\u003e\n\u003ctd\u003e在伊朗境内联系人不知情的情况下冒充真实活动人士\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e监控与画像\u003c/td\u003e\n\u003ctd\u003e十阶段漏斗；对伊朗境内具名个人建立心理画像档案\u003c/td\u003e\n\u003ctd\u003e根据逮捕经历画像，而这些人在伊朗法律下可能面临监禁或处决\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e协调式虚假行为\u003c/td\u003e\n\u003ctd\u003e多账号 Instagram 流水线，按照受众分组同步发布\u003c/td\u003e\n\u003ctd\u003e隐藏 MEK 归属，在“独立”品牌下发布近乎一致的协调内容\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成媒体\u003c/td\u003e\n\u003ctd\u003e为发言人创建带波斯语音频的头像\u003c/td\u003e\n\u003ctd\u003e未披露的合成“普通伊朗人”与历史人物深度伪造，用于制造虚假权威\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e媒体洗白\u003c/td\u003e\n\u003ctd\u003e把 MEK 关联媒体重写并重新分发为独立报道\u003c/td\u003e\n\u003ctd\u003e去除水印，把组织内容伪装成普通同胞的声音\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 11. 该影响力行动的不同组成：共享 Agent 平台、冒充、监控、协调式虚假行为、合成媒体和媒体洗白。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fbcae98f28b9f99f32eb9e5d72fa994ee730282e8-1990x1250.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 15. 一个由名为“Viktor”的共享 Claude Agent 平台连接起来的分布式网络，涵盖实时冒充、伊朗境内监控、协调式虚假行为、合成发言人和媒体洗白。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc3a3242fdb031d4b508557fcbc790b9b233d9505-1990x1150.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 16. 该行动以协调式虚假行为、合成媒体和媒体洗白为基础。图中为网络账号的 Instagram 帖子示例。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-6\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e我们在内部调查中发现这些活动并封禁相关账号。目前，我们无法独立确认该网络的放大账号获得了多少真实用户互动。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e类型\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e备注\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003emojahedin[.]org; ncr-iran[.]org; maryam-rajavi[.]com; iranntv[.]com; iranfreedom[.]org; hambastegimeli[.]com; wncri[.]org\u003c/td\u003e\n\u003ctd\u003e域名\u003c/td\u003e\n\u003ctd\u003e在各行为者中硬编码的 MEK/NCRI 强制来源集\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@simaintv / @iranintv\u003c/td\u003e\n\u003ctd\u003eInstagram\u003c/td\u003e\n\u003ctd\u003e原始节点（~708K）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@javanane_shargt\u003c/td\u003e\n\u003ctd\u003eInstagram\u003c/td\u003e\n\u003ctd\u003e全国侨民受众（~299K）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@tehranchekhabar19\u003c/td\u003e\n\u003ctd\u003eInstagram\u003c/td\u003e\n\u003ctd\u003e“独立新闻”；学生定向（~173K）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@faryade_mamnoo\u003c/td\u003e\n\u003ctd\u003eInstagram\u003c/td\u003e\n\u003ctd\u003e反对派内容（~89.5K）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@khabar_fouri_mardom; @iranpayam_tehran5\u003c/td\u003e\n\u003ctd\u003eInstagram\u003c/td\u003e\n\u003ctd\u003e协调式多页面网络\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@fwr.ir / @fwr_ir; t[.]me/FWR_ir\u003c/td\u003e\n\u003ctd\u003eInstagram / Telegram\u003c/td\u003e\n\u003ctd\u003e马甲账号漏斗与监控终端\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@anti_silent\u003c/td\u003e\n\u003ctd\u003eTelegram\u003c/td\u003e\n\u003ctd\u003e学生监控漏斗\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e@jomhouri_democratic\u003c/td\u003e\n\u003ctd\u003eInstagram / Telegram\u003c/td\u003e\n\u003ctd\u003e十点计划宣传\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eZWNJ + 点/空格规避；强制口号；#OurChoiceMaryamRajavi；SKILL.md / LEARNINGS.md 记忆\u003c/td\u003e\n\u003ctd\u003e指纹\u003c/td\u003e\n\u003ctd\u003e跨行为者特征\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 12. 该活动背后的网络账号、相关网站及传播账号 IoC。\u003c/p\u003e\n\u003ch3 id=\"gtg-54004阻断肯尼亚国内协调式虚假草根舆论行动\"\u003eGTG-54004：阻断肯尼亚国内协调式虚假草根舆论行动\u003c/h3\u003e\n\u003cp\u003e我们识别并移除了一个由单一行为者使用的账号，该账号被用于大规模生产肯尼亚政治内容。行动被设计成看起来像自然、自发的草根舆论。行为者在多个会话中使用 Claude，每次生成整批恰好 50 条推文，并明确要求模型让内容看起来像自发的草根评论，而不是协调行动。\u003c/p\u003e\n\u003cp\u003e该网络围绕肯尼亚重要政治议题和人物进行传播。大量 AI 生成推文赞扬能源内阁部长 Opiyo Wandayi 阻止 Kenya Power 原计划的电价上涨，并使用 #PowerReliefKE 和 #PoweringTheNewKenya 提升可见度。同时，网络还推动“Kenya’s United Opposition 联盟在 2027 年大选前正在瓦解”的叙事，直接针对政治人物 Rigathi Gachagua 和前总统 Uhuru Kenyatta。\u003c/p\u003e\n\u003cp\u003e此外，行为者还以“SHANKI”/“Elkins Marketer”这一营销身份，为肯尼亚零售品牌运行完全相同的 AI 工作流。我们没有发现政府参与的证据，这些活动更符合完全由肯尼亚国内行为者运作的特征。\u003c/p\u003e\n\u003cp\u003e调查显示，这是一场高度结构化的政治“伪草根”行动：它在不同对话中围绕电价上涨推出完全一致、统一的信息。我们使用 Breakout Scale 评估其影响，把它归为 \u003cstrong\u003eCategory One\u003c/strong\u003e。相关活动完全局限于单个平台上的虚假账号和本地影响者网络中，没有成功触达或影响真实公众。\u003c/p\u003e\n\u003cp\u003e我们并不知道背后人员的现实身份，但判断这是一场肯尼亚本地政治伪草根行动。网络的亲政府语气和特定标签表明，它可能与执政联盟立场一致，但我们尚未识别具体责任组织。\u003c/p\u003e\n\u003ch4 id=\"关键发现-7\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e行动采用同一套手册，同时放大亲政府和反对派负面叙事。以这种方式既强化现政府、又削弱反对派的政治可行性，符合单一协调式选举传播行动的特征。\u003c/li\u003e\n\u003cli\u003e这里使用的模板也被逐字用于零售品牌营销，包括把一段促销广播重新包装成看似自然的推文，并每隔五条插入一个链接。这符合肯尼亚常见的一种模式：营销机构付费给本地影响者以\u003ca href=\"https://www.wired.com/story/opinion-in-kenya-influencers-are-hired-to-spread-disinformation/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e操纵叙事\u003c/a\u003e。\u003c/li\u003e\n\u003cli\u003e行动频繁使用 Claude 对 50 条预先拟好的主题和推文批量进行“人性化”和润色，表明模型对该网络的主要价值是提高数量并制造真实感；核心意识形态信息在 Claude 介入前已经由行为者完全决定。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"行动生命周期与-ai-使用-3\"\u003e行动生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e行为者提供主题、话术要点和标签，再用 Claude 把它们转成 50 条主题统一、符合字符数限制、可跨平台发布和分发的帖子。在数个会话中，这些内容还被封装成可“一键复制全部”的交互式组件，直接用于部署。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fd54d70fe0a25ebee59b8a9eecb32d70e048e8421-1990x1620.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 17. 虚假评论账号放大内阁部长 Opiyo Wandayi 相关内容，可看到该行动虚假账号之间形成的协调集群。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-7\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e在 OpenAI 分享有关其平台上重复违规活动的线索后，我们围绕肯尼亚可疑协调式虚假行为展开内部调查，并识别出这场行动。我们移除了相关账号及其背后的组织，并围绕其行为特征建立检测能力。\u003c/p\u003e\n\u003ch3 id=\"gtg-84002阻断由阿联酋方面主导针对穆斯林兄弟会苏丹冲突及联合国问责机制的影响力行动\"\u003eGTG-84002：阻断由阿联酋方面主导、针对穆斯林兄弟会、苏丹冲突及联合国问责机制的影响力行动\u003c/h3\u003e\n\u003cp\u003e我们识别并移除了一个由单一行为者用于持续开展反穆斯林兄弟会影响力行动的账号。行为者利用 Claude 维护一个名为“Deadshot”的 AI 人格，该人格托管在其私人平台上。系统设置中嵌入了一份主理论文件，要求 Claude 在数百个会话中反复执行同一使命：“一场协调一致、跨大西洋及地区性的全球拆解穆斯林兄弟会行动。”\u003c/p\u003e\n\u003cp\u003e行动分成五条紧密关联的工作线。行为者同时管理各条支线，确保叙事生成、技术混淆与战术目标选择在整个行动中完全同步：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e建立并管理约 300 个虚假影响者社交账号组成的网络；\u003c/li\u003e\n\u003cli\u003e创建一个前台 NGO，复制一家真实瑞士组织的身份，并以其名义发布国家撰写的人权报告；\u003c/li\u003e\n\u003cli\u003e代写正式证词，计划由两个人在联合国人权理事会第 62 届会议上发表，并在内容设计上明确要求两份发言都不能提到 UAE；\u003c/li\u003e\n\u003cli\u003e深入研究并画像 18 名欧洲议会议员和知名记者，为这些议员和记者建立详细个人档案；\u003c/li\u003e\n\u003cli\u003e针对曾批评 UAE 在苏丹行为的联合国特别报告员，整理“反问责”档案。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e尽管行动的设计目标之一就是不可追溯到幕后行为者，我们的调查仍以高置信度把它与阿联酋政府官员联系起来。理论文件还把阿联酋高级官员列为工作的预期接收者。根据调查，行为者也为放大内容的社交媒体网络提供资金。\u003c/p\u003e\n\u003cp\u003e我们无法确认任何证词或目标档案是否最终成功送达预期受众。\u003c/p\u003e\n\u003cp\u003e按照 Breakout Scale，我们把该活动评估为 \u003cstrong\u003eCategory Three\u003c/strong\u003e，因为它横跨多个社交媒体平台。若要达到更高类别，则需要有广泛公众关注或政策影响的证据，而我们无法确认这些情况。\u003c/p\u003e\n\u003ch4 id=\"关键发现-8\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e社交媒体放大网络由中央出资和协调。内部报告把网络的“独立性”称为其“最大的战略资产”，实际上承认其试图隐藏国家指导属性。\u003c/li\u003e\n\u003cli\u003e行为者借用一家真实苏丹人权组织的身份，并为两名具名人士完整代写联合国证词，使服务于苏丹冲突一方的材料可以作为“独立本地证人”的声音进入联合国，而不是作为国家信息传播。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"行动生命周期与-ai-使用-4\"\u003e行动生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e行动工作流先输入现实议题和预先编写的政治理论文件，再使用 Claude 把这些材料转换成外观正式的情报简报、克隆身份报告、代写证词，以及针对个人建立的目标清单，其中若干材料准备直接提交给阿联酋高级官员。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F04d4d1292aa3c5069a1390dd6b164bec444f2e87-1990x1617.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 18. X/Twitter 账号在 2026 年 6 月 4 日围绕 #SudanIslamists 开展协调行动，发布近乎一致的图像内容，把苏丹穆斯林兄弟会与地区不稳定联系起来。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-8\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e我们在内部调查中发现这些活动并封禁相关账号。我们还围绕已记录的行为特征建立检测，以阻止未来相关活动，并共享指标以支持其他产业伙伴采取行动。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#main\"\u003e返回顶部\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"ai-赋能的监控行动\"\u003eAI 赋能的监控行动\u003c/h2\u003e\n\u003cp\u003e今年 1 月至 7 月，我们识别并阻断了一系列利用 Claude 构建、运行或以其他方式支持监控行动的活动，参与者包括国家关联行为者、与政府有联系的承包商和商业间谍软件供应商。这些案例涉及中国、伊朗和西非的威胁行为者，也涉及商业“监控即服务”市场；行动规模从单一个人到完整团队不等。Anthropic 的 Usage Policy 禁止使用 Claude 开展未经同意的监控和画像，也禁止利用我们的服务侵犯个人的公民自由和人权。下文每个案例中的威胁行为者都违反了我们的 Usage Policy，并试图绕过用于检测此类滥用的控制措施。对于每个案例，我们都封禁了相关账号，改进了对观察到的战术、技术和程序（TTP）的检测能力；当行动涉及平台之外的活动或影响时，我们也酌情与产业伙伴和相关机构共享标识符与情报。\u003c/p\u003e\n\u003cp\u003e调查过程中，我们观察到几个趋势。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第一，AI 正在被用来替代一支工程团队。\u003c/strong\u003e 一名为马里国家安全部门工作的顾问使用 Claude 设计了一套大规模拦截平台，可以监视该国所有移动运营商上的通信并为目标生成档案。在这个案例中，Claude 并不是用来分析监控档案，而是用来设计支撑情报收集的软件本身。另一个案例中，伊朗行为者使用 Claude 构建并部署了一个恶意 Firefox 扩展，从社交网络中收集用户身份。中国（PRC）一个宗教事务情报收集部门过去由多支分析团队组成，如今则缩减为一个办公室，借助 AI 助手每月完成数千项调查。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第二，AI 不仅用于构建工具，也被用于批量摄取数据、识别目标。\u003c/strong\u003e 一个案例中，行为者批量上传社交媒体帖子，并要求 Claude 生成结构化记录，列出目标的位置、人口统计信息和政治倾向，同时为每项判断给出置信度。类似地，一个伊朗单位使用 Claude 分析数十万条社交媒体帖子，从中选出 39 个反对派账号进行监控。中国行为者让 Claude 按政治敏感度对社交媒体内容和新闻文章评分，并标记可能需要其所谓“管控”的目标。而在最成熟的案例中，一名与中国有关联、完全不会阿拉伯语的行为者使用 Claude 对叙利亚境内的维吾尔目标开展持续数日的招募行动。模型用当地口音起草接触话术、实时翻译回复、以“专家”身份角色扮演对任务进行质量检查，并把结果整理成我们怀疑是提交给案件负责人的格式。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第三，AI 正在被完整嵌入国家安全官僚体系。\u003c/strong\u003e 一个中国国家安全局使用 Claude 制作内部手册，说明如何在监控行动中使用 AI，这表明 AI 模型正在深入进入国家行为者的日常工作。在伊朗，两个既不共享代码、也不共享人员的单位，分别独立使用 Claude 解决国家运营的集中式监控案件管理系统中的相同技术和可用性问题。这说明 AI 正被用于跨越国家监控体系中的技术和官僚障碍。\u003c/p\u003e\n\u003cp\u003e本节几乎所有案例中，操作者都是国家关联组织，其目标也仍是这些政权历史上一贯关注的侨民和异议群体，包括香港民主派人士、亚洲各地的藏人和法轮功群体，以及海外的伊朗少数群体和伊朗政权反对者。\u003c/p\u003e\n\u003ch3 id=\"gtg-54009阻断使用-claude-对伊朗和波斯湾地区用户社交账号进行画像的商业监控平台\"\u003eGTG-54009：阻断使用 Claude 对伊朗和波斯湾地区用户社交账号进行画像的商业监控平台\u003c/h3\u003e\n\u003cp\u003e2026 年 6 月，我们封禁了一个使用 Claude 构建商业监控平台的账号。该平台用于分析、分类并画像伊朗和波斯湾地区用户的社交媒体活动。调查发现，这些活动由名为“S2T Unlocking Cyberspace”的实体实施或代表其实施；公开来源研究表明，这是一家以色列—新加坡背景的商业情报供应商。\u003c/p\u003e\n\u003cp\u003e该平台的核心目的就是监控：它绘制社交媒体用户的地理位置，把人群划分成编码后的人口类别，并生成以政府报告语体撰写的阿拉伯语情报简报。\u003c/p\u003e\n\u003cp\u003e我们的发现独立印证了新闻调查网络 \u003ca href=\"https://forbiddenstories.org/osint-s2t-unlocking-cyberspace-journalists-activists/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eForbidden Stories\u003c/a\u003e 在 2023 年 2 月发布的一项调查。该调查记录了一款 S2T 监控产品，记者在哥伦比亚军方泄露文件中的公司宣传册里发现了它。宣传册描述的能力与我们在这次行动中观察到的行为高度吻合。\u003c/p\u003e\n\u003cp\u003e我们在该项目仍处于试点阶段时识别出这些活动；在封禁账号之前，没有发现 Forbidden Stories 报道中所描述的 S2T 监控链后续阶段已经被用于真实目标的证据。\u003c/p\u003e\n\u003ch4 id=\"关键发现-9\"\u003e关键发现\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e行为者正在构建一组多品牌系统，很可能面向海湾地区的阿拉伯语客户。\u003c/li\u003e\n\u003cli\u003e系统收集并分类侨民社交网络用户的位置，把他们划分为亲政府或反政府人群。\u003c/li\u003e\n\u003cli\u003e行为者使用包含六类人群的分类体系：城市居民、宗教人士、军方、青年、侨民和农村人口。\u003c/li\u003e\n\u003cli\u003e最终简报以正式阿拉伯语撰写，样式仿照官方政府通信；情绪评分按不同海湾国家国籍拆分，并附带建议的反叙事方案。\u003c/li\u003e\n\u003cli\u003e我们还识别到另一条工作流，其中包含 255 个以上的合成社交网络账号。这表明行为者正在建立一批以后可投入使用的虚假账号库存。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"行动生命周期与-ai-使用-5\"\u003e行动生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e行为者使用 Claude 生成和分析内容。一个案例中，他们每次向 Claude 输入约 25 条社交媒体帖子，让 Claude 分析并返回发帖者的人口类别、位置和政治倾向等信息，同时对每项判断给出置信度。另一个案例中，行为者让 Claude 用波斯语、阿拉伯语、英语和德语为一批（很可能是虚假的）线上人格生成帖子；这些人格被设计成不同亲伊朗政权和反伊朗政权群体中的普通成员。这种行为表明，对方可能试图大规模创建虚假社交账号，同时在冲突双方布点。\u003c/p\u003e\n\u003cp\u003eForbidden Stories 在 2023 年对泄露的 S2T 宣传册进行调查时，描述了该公司的服务，包括创建虚假账号渗透私人 WhatsApp 和 Telegram 群组、收集成员名单，并进一步升级到网络钓鱼和设备入侵。该行为者借助 Claude 生成的内容，可能就是为这些虚假账号增加可信度，让目标愿意信任它们。我们无法独立确认 Forbidden Stories 报道的后续行动阶段是否真的发生。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2Fc5c7183d60d65a5ac34e454a02653468c287ae24-1920x960.jpg\u0026amp;w=3840\u0026amp;q=75\"\u003e\u003c/p\u003e\n\u003cp\u003e图 1. 该行动的收集漏斗：由 Claude 驱动的分类和人格生成，很可能帮助行为者渗透目标社区。\u003c/p\u003e\n\u003ch4 id=\"阻断与缓解-9\"\u003e阻断与缓解\u003c/h4\u003e\n\u003cp\u003e这些活动违反了我们的 Usage Policy：其中既包括禁止监控——例如对活动人士、记者和政治异议人士进行画像、评分和建立档案——也包括禁止协调式虚假行为。我们封禁了相关账号，并正在实施缓解措施以应对未来滥用。我们也向跟踪“监控即服务”行为者的合作伙伴共享了指标，以便在 Anthropic 平台之外共同阻断该行动。\u003c/p\u003e\n\u003ch4 id=\"按人群划分的合成账号-handle\"\u003e按人群划分的合成账号 Handle\u003c/h4\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e类别\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e分组代码\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eHandles\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e合成：侨民\u003c/td\u003e\n\u003ctd\u003eIR-DI\u003c/td\u003e\n\u003ctd\u003e@ShirazisInLA, @TorontoPersianForum, @BerlinIranFree, @DubaiIranOpposition, @LondonIranExile\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：青年/学生\u003c/td\u003e\n\u003ctd\u003eIR-YO\u003c/td\u003e\n\u003ctd\u003e@tehran_uni_student, @isfahanprotestkid, @tabriz_uni_protest, @ShirazYouthRebel\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：军方\u003c/td\u003e\n\u003ctd\u003eIR-MI\u003c/td\u003e\n\u003ctd\u003e@BasijMashhad, @IRGC_Isfahan, @QudsForceChat\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：宗教人士\u003c/td\u003e\n\u003ctd\u003eIR-CL\u003c/td\u003e\n\u003ctd\u003e@QomSeminaryNews, @mashhad_clergy, @AyatollahKhamenei\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合成：农村\u003c/td\u003e\n\u003ctd\u003eIR-RU\u003c/td\u r_e_moghavemat, #AxisOfResistance, #shahid\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e亲政权：爱国动员\u003c/td\u003e\n\u003ctd\u003e#vatanparasti, #defa_az_keshvar\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e心理画像/脆弱性\u003c/td\u003e\n\u003ctd\u003e#PTSD_Iran, #salamat_e_ravan, #trauma_ye_jang, #suicide_rate_war\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eUAE/GCC 宗派议题\u003c/td\u003e\n\u003ctd\u003e#صراع_سني_شيعي, #خطر_شيعي\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e亲沙特反伊朗\u003c/td\u003e\n\u003ctd\u003e#USBaseGulf, #FifthFleetBahrain\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 2. 行为者分类器跟踪的标签；这些标签本身并不是该行为者的指标。\u003c/p\u003e\n\u003ch3 id=\"gtg-14010阻断中国境内针对叙利亚维吾尔人的监控与招募行动\"\u003eGTG-14010：阻断中国境内针对叙利亚维吾尔人的监控与招募行动\u003c/h3\u003e\n\u003cp\u003e我们识别出一场与中国政府有关联的行动，行为者使用 Claude 跟踪、画像并招募叙利亚境内的维吾尔人及维吾尔武装编队。被作为武装目标的人，是近期加入新组建叙利亚军队的维吾尔族成员，而中国政府将这些编队认定为恐怖组织。行为者借助 Claude 寻找并联系被判断可能接触这些编队的叙利亚境内人员，随后试图招募他们，包括提出以付费换取有关部队情况的报告。\u003c/p\u003e\n\u003cp\u003e此外，行为者还使用 Claude 定位叙利亚境内特定维吾尔商家和兴趣地点。这些活动与更广泛的监控行动并行，包括监视维吾尔侨民记者，以及为政府客户起草监控平台投标文件的商业项目。行为者主要使用中文，其情报收集优先级与中国国家安全系统的关注方向一致。我们以低置信度判断，该行为者更可能是代表中国国家安全系统工作的承包商，而非国家安全机关直接行动。\u003c/p\u003e\n\u003ch4 id=\"关键发现-10\"\u003e关键发现\u003c/h4\u003e\n\u003cp\u003e行为者使用 Claude，把从 100 多个受监控 WhatsApp 群组和数十个 Telegram 频道中批量提取的聊天内容，转换为结构化中文数据。其中包括为可能因经济压力、家庭分离和意识形态幻灭而容易被针对的个人建立画像。行为者特别标出那些仍有家人留在新疆的目标——这种杠杆只有与中国国内安全机构协同才能真正利用。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e行为者要求 Claude 扮演会说阿拉伯语的“专家”顾问，从方言、军事术语和目标心理等方面检查欺骗性信息的质量。\u003c/li\u003e\n\u003cli\u003e同时，行为者还针对维吾尔侨民记者——尤其是 \u003cem\u003eUyghur Post\u003c/em\u003e 的工作人员——策划协调式大规模举报、通过外国前台进行污名化以及机器人网络放大。\u003c/li\u003e\n\u003cli\u003e行为者起草面向中国局级政府客户的监控平台招标书和能力宣传册，显示出“政府客户—供应商”的运营结构。\u003c/li\u003e\n\u003cli\u003eClaude 拒绝了多项秘密审讯请求，以及大规模生成虚假人格的请求。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"行动生命周期与-ai-使用-6\"\u003e行动生命周期与 AI 使用\u003c/h4\u003e\n\u003cp\u003e行动覆盖完整情报链。在收集和分析阶段，行为者使用独立于 Claude 的其他基础设施，从社交媒体群组批量提取聊天内容，然后把 Claude 作为离线分析层，用于跨平台关联身份、绘制关系网络、按照可利用脆弱点画像个人、生成中文报告，并制定压制维吾尔侨民媒体的详细方案。在执行阶段，行为者使用 Claude 策划一场针对叙利亚境内目标、持续数日的秘密招募行动，并用叙利亚阿拉伯语起草内容。Claude 实时翻译回复，以“专家”顾问身份检查欺骗方案，并把文档整理成可向上级报告链交付的格式。\u003c/p\u003e\n\u003cp\u003e行为者利用 Claude 降低了对母语能力和专业人员的依赖。这样，一个不会阿拉伯语的人也能维持具有可信度的秘密接触行动，建立用于监控个人的结构化数据库，定位具体人员，并搭建支撑数据收集所需的商业与影响力基础设施。Claude 拒绝了其中若干最严重的请求，包括秘密审讯和大规模人格培养。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e工作流\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eClaude 的用途\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e结果\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eHUMINT 招募\u003c/td\u003e\n\u003ctd\u003e秘密接触、谈判辅导、实时翻译、成果整理\u003c/td\u003e\n\u003ctd\u003e对我们不可见\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e对侨民成员的大规模监控\u003c/td\u003e\n\u003ctd\u003e把批量提取的社区聊天整理为中文目标数据\u003c/td\u003e\n\u003ctd\u003e对受迫害侨民群体建立脆弱性画像\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e物理定位\u003c/td\u003e\n\u003ctd\u003e通过卫星图和地图进行网络映射和地点确认\u003c/td\u003e\n\u003ctd\u003e冲突区内特定平民的现实位置\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e媒体压制\u003c/td\u003e\n\u003ctd\u003e规划协调举报、污名化和放大行动\u003c/td\u003e\n\u003ctd\u003e针对维吾尔侨民媒体 \u003cem\u003eUyghur Post\u003c/em\u003e 的方案\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e商业采购\u003c/td\u003e\n\u003ctd\u003e起草监控平台投标文件和能力宣传册\u003c/td\u003e\n\u003ctd\u003e面向局级政府客户营销\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e虚假账号基础设施\u003c/td\u003e\n\u003ctd\u003e请求大规模培养虚假人格\u003c/td\u003e\n\u003ctd\u003e大部分被模型拒绝\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e表 3. Claude 在该行动不同工作流中的使用方式。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zr
