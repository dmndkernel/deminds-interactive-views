。Canvas 数据采用开放的 JSON Canvas 格式保存。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQufVVYbAAAwS3I?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n它很适合研究者、写作者和需要长期积累专业知识的人。即使以后换工具，Markdown 文件仍然比较容易处理。\n\nObsidian 的难点也来自**自由**。\n\n插件、主题、标签、属性和链接玩法很多，新手很容易花几周搭建“完美系统”，真正写下来的内容却没多少。如果你选择 Obsidian，建议前一个月只使用文件夹、搜索、链接和模板，先确认自己的工作流，再决定要不要增加插件。","sourceFormat":"markdown"},"note:sha256:8f0d17405962d278b99368f8d23464b63109e7f34ebe06cd9e151ea01e050697":{"html":"\u003cp\u003e复制原文或保存链接，只留下了一份资料。\u003c/p\u003e\n\u003cp\u003e想让它变成可复用知识，至少补上三项：这条内容说了什么，我怎样理解，它可以在哪个任务里使用。\u003c/p\u003e\n\u003cp\u003e一张最小知识卡片可以这样写：\u003c/p\u003e\n\u003cp\u003ePlain Text\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-Plain\"\u003e标题：\n一句话结论：\n来源与日期：\n我的理解：\n适用场景：\n相关项目：\n需要核验的问题：\n更新时间：\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e“我的理解”不需要写得很长。有时一句反驳、一个例外或一个真实案例，比重新抄写五百字更有价值。\u003c/p\u003e\n","kind":"html","rawMarkdown":"复制原文或保存链接，只留下了一份资料。\n\n想让它变成可复用知识，至少补上三项：这条内容说了什么，我怎样理解，它可以在哪个任务里使用。\n\n一张最小知识卡片可以这样写：\n\nPlain Text\n\n```Plain\n标题：\n一句话结论：\n来源与日期：\n我的理解：\n适用场景：\n相关项目：\n需要核验的问题：\n更新时间：\n```\n\n“我的理解”不需要写得很长。有时一句反驳、一个例外或一个真实案例，比重新抄写五百字更有价值。","sourceFormat":"markdown"},"note:sha256:8fffc79025290e72a5afc9449cd56f511a05cd0e8d685c32247ca8776099b433":{"html":"\u003cp\u003e个人知识库\u003cstrong\u003e主要服务自己\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e你知道一篇笔记为什么写，也记得某个缩写来自哪个项目。偶尔有些分类不规范，不会立刻造成严重后果。\u003c/p\u003e\n\u003cp\u003e它最常见的目标包括学习、写作、研究、项目管理和个人复盘。评价它有没有用，可以问几个简单问题：写文章时能否找到旧素材？做决定时能否看到过去的经验？启动类似项目时，能否复用以前的模板和踩坑记录？\u003c/p\u003e\n\u003cp\u003e企业知识库\u003cstrong\u003e服务的是一群背景不同的人\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e销售口中的“有效客户”，可能和市场部门使用的定义不同；产品说“项目上线”，运营可能理解为已经全面开放。只要术语和口径没有写清，知识库就会把分歧保留下来。\u003c/p\u003e\n\u003cp\u003e企业知识还牵涉权限。\u003c/p\u003e\n\u003cp\u003e公开产品手册可以让全员查看，薪酬制度、客户合同和经营数据却不能如此。谁能看、谁能修改、谁来审核、离职后怎样交接，这些问题都必须进入系统设计。\u003c/p\u003e\n\u003cp\u003e两者的维护方式也不同。\u003c/p\u003e\n\u003cp\u003e个人可以凭兴趣更新笔记，企业内容需要明确负责人。一项制度如果没有生效时间、审核人和下次复查日期，时间一久就没人敢确认它还能不能用。\u003c/p\u003e\n\u003cp\u003e可以把二者的差异浓缩成一句话：\u003cstrong\u003e个人知识库追求“对我有用”，企业知识库还必须做到“对不同的人给出一致、合规、可追溯的答案”。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e企业知识库并不一定比个人知识库复杂很多。一个十人团队也可以从几十篇核心文档开始。复杂度通常来自组织本身，而不是工具。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e⚠️\u003c/strong\u003e \u003cstrong\u003e工具解决不了组织问题\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e如果公司内部职责不清、流程经常变化、部门口径互相矛盾，换一套更贵的知识库产品，并不会把这些问题自动修好。\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"个人知识库**主要服务自己**。\n\n你知道一篇笔记为什么写，也记得某个缩写来自哪个项目。偶尔有些分类不规范，不会立刻造成严重后果。\n\n它最常见的目标包括学习、写作、研究、项目管理和个人复盘。评价它有没有用，可以问几个简单问题：写文章时能否找到旧素材？做决定时能否看到过去的经验？启动类似项目时，能否复用以前的模板和踩坑记录？\n\n企业知识库**服务的是一群背景不同的人**。\n\n销售口中的“有效客户”，可能和市场部门使用的定义不同；产品说“项目上线”，运营可能理解为已经全面开放。只要术语和口径没有写清，知识库就会把分歧保留下来。\n\n企业知识还牵涉权限。\n\n公开产品手册可以让全员查看，薪酬制度、客户合同和经营数据却不能如此。谁能看、谁能修改、谁来审核、离职后怎样交接，这些问题都必须进入系统设计。\n\n两者的维护方式也不同。\n\n个人可以凭兴趣更新笔记，企业内容需要明确负责人。一项制度如果没有生效时间、审核人和下次复查日期，时间一久就没人敢确认它还能不能用。\n\n可以把二者的差异浓缩成一句话：**个人知识库追求“对我有用”，企业知识库还必须做到“对不同的人给出一致、合规、可追溯的答案”。**\n\n企业知识库并不一定比个人知识库复杂很多。一个十人团队也可以从几十篇核心文档开始。复杂度通常来自组织本身，而不是工具。\n\n\u003e **⚠️** **工具解决不了组织问题**\n\n\u003e 如果公司内部职责不清、流程经常变化、部门口径互相矛盾，换一套更贵的知识库产品，并不会把这些问题自动修好。","sourceFormat":"markdown"},"note:sha256:90b1b13ffb67be1b03356b659412d36061a13fb142eef0e7fc75a0daaf718633":{"html":"\u003cp\u003e企业内容从创建到退出，至少要经历创建、审核、发布、使用、反馈、更新和下线。\u003c/p\u003e\n\u003cp\u003e制度类内容可以设置固定复查周期；产品文档在版本发布时触发更新；项目经验则应在复盘结束后由负责人确认。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e⚠️\u003c/strong\u003e \u003cstrong\u003e注意\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“所有人共同维护”听上去很开放，实际经常意味着无人负责。每一类关键知识都应该有明确所有者。\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"企业内容从创建到退出，至少要经历创建、审核、发布、使用、反馈、更新和下线。\n\n制度类内容可以设置固定复查周期；产品文档在版本发布时触发更新；项目经验则应在复盘结束后由负责人确认。\n\n\u003e **⚠️** **注意**\n\n\u003e “所有人共同维护”听上去很开放，实际经常意味着无人负责。每一类关键知识都应该有明确所有者。","sourceFormat":"markdown"},"note:sha256:913b41d97af99e5d877bc9b2f5e6e9b18116a8b485c7660f07e0e5efdf17e326":{"html":"\u003cp\u003eNotion 适合小型团队、创业公司以及产品、设计、运营等跨职能协作。\u003c/p\u003e\n\u003cp\u003e它的优势是自由，风险也来自自由。如果任何人都能随意建立页面和数据库，却没有统一模板、归档规则和负责人，团队 Wiki 很快会变成另一座迷宫。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Notion 适合小型团队、创业公司以及产品、设计、运营等跨职能协作。\n\n它的优势是自由，风险也来自自由。如果任何人都能随意建立页面和数据库，却没有统一模板、归档规则和负责人，团队 Wiki 很快会变成另一座迷宫。","sourceFormat":"markdown"},"note:sha256:91df37a9c40d0d2037d8aa13cfc236fd26de95f986e7868012cc8b0a8ab20764":{"html":"\u003cp\u003e员工不能查看的原文件，不应该因为接入 AI 就能通过问答获得内容。\u003c/p\u003e\n\u003cp\u003e权限最好继承原始系统，并在检索阶段过滤，而不是等模型已经看到敏感片段后再要求它不要回答。\u003c/p\u003e\n","kind":"html","rawMarkdown":"员工不能查看的原文件，不应该因为接入 AI 就能通过问答获得内容。\n\n权限最好继承原始系统，并在检索阶段过滤，而不是等模型已经看到敏感片段后再要求它不要回答。","sourceFormat":"markdown"},"note:sha256:9b8053732f919317d661c8ad8d66f1731d026e4b7ec62149cff4f2f724e4b2f2":{"html":"\u003cp\u003e语雀适合以文档为中心的团队，例如技术文档、产品说明、培训资料和内容生产。\u003c/p\u003e\n\u003cp\u003e目录结构比较直观，团队可以较快完成从共享文档到结构化知识库的过渡。\u003c/p\u003e\n\u003cp\u003e工具选择时，最好优先考虑团队已经在哪里工作。\u003c/p\u003e\n\u003cp\u003e知识库如果要求员工额外登录另一套系统、重复搬运内容，又不能在真实流程中使用，推广成本会很高。\u003c/p\u003e\n","kind":"html","rawMarkdown":"语雀适合以文档为中心的团队，例如技术文档、产品说明、培训资料和内容生产。\n\n目录结构比较直观，团队可以较快完成从共享文档到结构化知识库的过渡。\n\n工具选择时，最好优先考虑团队已经在哪里工作。\n\n知识库如果要求员工额外登录另一套系统、重复搬运内容，又不能在真实流程中使用，推广成本会很高。","sourceFormat":"markdown"},"note:sha256:9f7a563af0fca4ee1bcc6b778b17dc5471c40e8776bccfa81bc3321b9928e62e":{"html":"\u003cp\u003e让目标用户实际提问，记录正确、部分正确、错误、冲突和无法回答五类结果。\u003c/p\u003e\n\u003cp\u003e检查检索到的原始片段，再决定是修改内容、切分、元数据、检索参数，还是提示词。\u003c/p\u003e\n\u003cp\u003e试点结束后再决定是否扩大范围。没有通过核心问题评测的系统，不要急着向全公司发布。\u003c/p\u003e\n","kind":"html","rawMarkdown":"让目标用户实际提问，记录正确、部分正确、错误、冲突和无法回答五类结果。\n\n检查检索到的原始片段，再决定是修改内容、切分、元数据、检索参数，还是提示词。\n\n试点结束后再决定是否扩大范围。没有通过核心问题评测的系统，不要急着向全公司发布。","sourceFormat":"markdown"},"note:sha256:a689b38b5c8f00bad70923012df590e39beb5f5a43f1ff0171db7ac033b244e7":{"html":"\u003cp\u003e使用场景\u003c/p\u003e\n\u003cp\u003e可以优先了解\u003c/p\u003e\n\u003cp\u003e初选以后，再问十个问题：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e✅\u003c/strong\u003e \u003cstrong\u003e实用提醒\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e工具选型检查清单\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e✅\u003c/strong\u003e \u003cstrong\u003e实用提醒\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e如果这些问题没有答案，功能对比表做得再详细，也很难选对工具。\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"使用场景\n\n可以优先了解\n\n初选以后，再问十个问题：\n\n\u003e **✅** **实用提醒**\n\n\u003e 工具选型检查清单\n\n\u003e **✅** **实用提醒**\n\n\u003e 如果这些问题没有答案，功能对比表做得再详细，也很难选对工具。","sourceFormat":"markdown"},"note:sha256:b126596973e63c17ad19273beff61e974c4dd6f05b932430df48723dfbda2485":{"html":"\u003cp\u003e用知识库完成一个真实结果：写一篇文章、准备一份报告，或者复盘一个项目。\u003c/p\u003e\n\u003cp\u003e记录哪些内容找不到，哪些分类没有帮助，以及哪些笔记只有原文、没有自己的判断。\u003c/p\u003e\n","kind":"html","rawMarkdown":"用知识库完成一个真实结果：写一篇文章、准备一份报告，或者复盘一个项目。\n\n记录哪些内容找不到，哪些分类没有帮助，以及哪些笔记只有原文、没有自己的判断。","sourceFormat":"markdown"},"note:sha256:b26bd52f406b2239535ebd04f29ce6668065e85d87fde9272f5e1512b705204d":{"html":"\u003cp\u003e以 Obsidian 为例，可以设计一套这样的工作流：\u003c/p\u003e\n\u003cp\u003etext\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e收藏网页或收到文件\n→ AI 提取核心结论和来源\n→ 检查是否与旧笔记重复\n→ 生成标准知识卡片\n→ 写入收件箱\n→ 添加项目链接与标签\n→ 每周整理时移动到正式目录\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e还可以直接向 AI 提出任务：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e搜索我的知识库中与“企业 AI 知识库”有关的笔记，找出重复内容和观点冲突。先生成整理方案，不要直接删除。确认后再合并，并把旧文件移入归档。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e这里最重要的一句话是：\u003cstrong\u003e先生成方案，不要直接删除。\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"以 Obsidian 为例，可以设计一套这样的工作流：\n\ntext\n\n```text\n收藏网页或收到文件\n→ AI 提取核心结论和来源\n→ 检查是否与旧笔记重复\n→ 生成标准知识卡片\n→ 写入收件箱\n→ 添加项目链接与标签\n→ 每周整理时移动到正式目录\n```\n\n还可以直接向 AI 提出任务：\n\n\u003e 搜索我的知识库中与“企业 AI 知识库”有关的笔记，找出重复内容和观点冲突。先生成整理方案，不要直接删除。确认后再合并，并把旧文件移入归档。\n\n这里最重要的一句话是：**先生成方案，不要直接删除。**","sourceFormat":"markdown"},"note:sha256:b3ef5d4a5710793e678bd71004cc74461494b9c89080338fdcd44bd4791f537a":{"html":"\u003cp\u003eNotebookLM 更像一名资料研究助手。\u003c/p\u003e\n\u003cp\u003e它支持 PDF、Word、Markdown、网页、Google 文档、音频和公开视频等多种来源。用户可以围绕上传材料提问，回答中带有引用，也可以生成学习指南、摘要、思维导图和音频概览等内容。\u003c/p\u003e\n\u003cp\u003e如果你准备研究一个行业、学习一门课程或分析一批访谈，它很合适。\u003c/p\u003e\n\u003cp\u003e但它不一定适合作为唯一的长期个人知识库。一个专题研究结束后，真正值得长期保留的结论，仍然需要进入自己的笔记或项目系统。\u003c/p\u003e\n","kind":"html","rawMarkdown":"NotebookLM 更像一名资料研究助手。\n\n它支持 PDF、Word、Markdown、网页、Google 文档、音频和公开视频等多种来源。用户可以围绕上传材料提问，回答中带有引用，也可以生成学习指南、摘要、思维导图和音频概览等内容。\n\n如果你准备研究一个行业、学习一门课程或分析一批访谈，它很合适。\n\n但它不一定适合作为唯一的长期个人知识库。一个专题研究结束后，真正值得长期保留的结论，仍然需要进入自己的笔记或项目系统。","sourceFormat":"markdown"},"note:sha256:b55e4ac0f07111bb50901c873aef2575f44be889886f74d70b3dfe92443f1663":{"html":"\u003cp\u003e企业场景可以进一步连接会议、群聊、项目系统和审批流程。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cp\u003etext\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e会议结束\n→ AI 提取正式决定和待办\n→ 检查知识库是否已有相关条目\n→ 生成新增或更新草稿\n→ 业务负责人审批\n→ 更新正式知识\n→ 旧版本自动归档\n→ 通知受影响的成员\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e另一个常见场景是制度更新。\u003c/p\u003e\n\u003cp\u003e新制度审批通过后，AI 可以定位所有引用旧制度的页面，生成影响清单，更新相关链接，并把旧版本标记为“已废止”。\u003c/p\u003e\n\u003cp\u003e知识库由此从一座等待搜索的仓库，变成一套持续进入业务流程的系统。\u003c/p\u003e\n","kind":"html","rawMarkdown":"企业场景可以进一步连接会议、群聊、项目系统和审批流程。\n\n例如：\n\ntext\n\n```text\n会议结束\n→ AI 提取正式决定和待办\n→ 检查知识库是否已有相关条目\n→ 生成新增或更新草稿\n→ 业务负责人审批\n→ 更新正式知识\n→ 旧版本自动归档\n→ 通知受影响的成员\n```\n\n另一个常见场景是制度更新。\n\n新制度审批通过后，AI 可以定位所有引用旧制度的页面，生成影响清单，更新相关链接，并把旧版本标记为“已废止”。\n\n知识库由此从一座等待搜索的仓库，变成一套持续进入业务流程的系统。","sourceFormat":"markdown"},"note:sha256:b92738506ff410464bca163616bc1de1ed6b6f2090c212857311a4445af5afdd":{"html":"\u003cp\u003eDify 是开源 AI 应用平台，提供模型接入、RAG、Agent、低代码工作流和 API 等能力。\u003c/p\u003e\n\u003cp\u003e它适合希望基于内部资料搭建问答，并继续连接业务工具或发布内部应用的团队。\u003c/p\u003e\n\u003cp\u003eDify 的自由度比单纯上传文件问答更高，也意味着使用者要理解知识切分、检索参数、模型配置和部署方式。没有技术团队时，可以先用小规模资料验证需求，再决定是否投入实施。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Dify 是开源 AI 应用平台，提供模型接入、RAG、Agent、低代码工作流和 API 等能力。\n\n它适合希望基于内部资料搭建问答，并继续连接业务工具或发布内部应用的团队。\n\nDify 的自由度比单纯上传文件问答更高，也意味着使用者要理解知识切分、检索参数、模型配置和部署方式。没有技术团队时，可以先用小规模资料验证需求，再决定是否投入实施。","sourceFormat":"markdown"},"note:sha256:ba84a8e8f47a1551b36e52046e0fba2646bdb2ff68707f206d7b6e94647e7f20":{"html":"\u003cp\u003e很多教程从标签、双向链接和目录结构讲起，我更建议\u003cstrong\u003e先写下三个高频任务\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e例如：每周写一篇文章，每月完成一份行业研究，持续记录客户项目。\u003c/p\u003e\n\u003cp\u003e知识库首先要服务这些任务。如果你说不出它将在哪个环节帮忙，后面的收集很容易失控。\u003c/p\u003e\n","kind":"html","rawMarkdown":"很多教程从标签、双向链接和目录结构讲起，我更建议**先写下三个高频任务**。\n\n例如：每周写一篇文章，每月完成一份行业研究，持续记录客户项目。\n\n知识库首先要服务这些任务。如果你说不出它将在哪个环节帮忙，后面的收集很容易失控。","sourceFormat":"markdown"},"note:sha256:bd32fe0d48bb7f0ba5e2a5c3a22921c33cac095b8e2491daf3c87b6b6a7eb5de":{"html":"\u003cp\u003e企业知识通常散落在网盘、邮件、即时通讯、会议记录、项目系统和员工个人电脑里。\u003c/p\u003e\n\u003cp\u003e盘点时不要只记录文件名称，还要确认内容负责人、使用对象、当前版本、敏感等级和更新频率。\u003c/p\u003e\n\u003cp\u003e对于重复、冲突和过期内容，应该先处理再导入。\u003c/p\u003e\n\u003cp\u003e同名文件不能自动视为同一版本；发布日期更晚，也不一定代表已经正式生效。遇到无法确认的材料，先标记“待审核”，不要让它直接进入正式问答范围。\u003c/p\u003e\n","kind":"html","rawMarkdown":"企业知识通常散落在网盘、邮件、即时通讯、会议记录、项目系统和员工个人电脑里。\n\n盘点时不要只记录文件名称，还要确认内容负责人、使用对象、当前版本、敏感等级和更新频率。\n\n对于重复、冲突和过期内容，应该先处理再导入。\n\n同名文件不能自动视为同一版本；发布日期更晚，也不一定代表已经正式生效。遇到无法确认的材料，先标记“待审核”，不要让它直接进入正式问答范围。","sourceFormat":"markdown"},"note:sha256:c0b560f91c121e402fe2bcecafb911ec09912a37d788da9436cb55fd28b9e301":{"html":"\u003cp\u003e从客服问答、新员工入职、销售产品资料或行政流程中选一个。\u003c/p\u003e\n\u003cp\u003e收集五十个左右真实问题，明确试点用户、内容负责人、权限范围和成功标准。\u003c/p\u003e\n","kind":"html","rawMarkdown":"从客服问答、新员工入职、销售产品资料或行政流程中选一个。\n\n收集五十个左右真实问题，明确试点用户、内容负责人、权限范围和成功标准。","sourceFormat":"markdown"},"note:sha256:c1e4e8945977105edbb08c67126eccf5a1b68f6596a2c75db924ee7a577663b6":{"html":"\u003cp\u003e2026 年，Andrej Karpathy 提出的 \u003cstrong\u003eLLM Wiki\u003c/strong\u003e 思路引起了很多讨论。\u003c/p\u003e\n\u003cp\u003e传统 RAG 更像“临时开卷考试”：每次收到问题，系统都从原始资料中检索几个片段，模型读完后给出一次性答案。问题答完，这次整理出来的关系和结论通常不会自动沉淀。\u003c/p\u003e\n\u003cp\u003eLLM Wiki 多了一道“编译知识”的过程。AI 先读取论文、文章、会议记录和项目资料，再把它们整理成结构化、相互链接的 Markdown 页面；以后有新资料进入时，它继续更新概念页、人物页、来源页和索引，并标记冲突或尚未确认的问题。\u003c/p\u003e\n\u003cp\u003etext\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e原始资料进入 raw 文件夹\n→ AI 提取来源、概念和关系\n→ 编译成相互链接的 Wiki 页面\n→ 人工检查重要结论\n→ 后续查询优先读取 Wiki\n→ 有价值的新答案再写回知识库\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRAG 的重点是\u003cstrong\u003e找到与当前问题相关的片段\u003c/strong\u003e，LLM Wiki 的重点是\u003cstrong\u003e把一次次阅读和研究沉淀成可继续维护的知识结构\u003c/strong\u003e。两者并不冲突：实际系统完全可以先让 LLM Wiki 整理知识，再用 RAG 从 Wiki 和原始来源中检索证据。\u003c/p\u003e\n\u003cp\u003eObsidian 很适合承载这种工作方式。它直接管理本地 Markdown 文件，支持双向链接、反向链接和图谱视图；AI 或 Agent 则可以通过文件、CLI、Skill 或 MCP 读取和更新这些页面。\u003c/p\u003e\n\u003cp\u003e不过，Obsidian 本身并不会自动把资料“变成 LLM Wiki”。真正起作用的是背后的工作流：保留原始来源，让 AI 生成或更新 Wiki 页面，再由人审核关键结论。\u003c/p\u003e\n\u003cp\u003eObsidian 更像这个系统的本地文件层和可视化界面。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eRAG 解决“这次去哪里找答案”，LLM Wiki 试图解决“这次研究之后，知识库有没有变得更好”。\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e所以，AI 知识库至少要能处理三种结果。\u003c/p\u003e\n\u003cp\u003e回答状态\u003c/p\u003e\n\u003cp\u003e系统应该怎样表现\u003c/p\u003e\n\u003cp\u003e第一种是“已确认”：存在清晰、有效、权限允许的来源。\u003c/p\u003e\n\u003cp\u003e第二种是“存在冲突”：几份仍然有效的材料给出不同说法，需要负责人判断。\u003c/p\u003e\n\u003cp\u003e第三种是“无法回答”：当前知识库没有足够证据。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e💡\u003c/strong\u003e \u003cstrong\u003e关键判断\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e敢于说不知道，比从相似材料中拼出一个答案更可靠。\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"2026 年，Andrej Karpathy 提出的 **LLM Wiki** 思路引起了很多讨论。\n\n传统 RAG 更像“临时开卷考试”：每次收到问题，系统都从原始资料中检索几个片段，模型读完后给出一次性答案。问题答完，这次整理出来的关系和结论通常不会自动沉淀。\n\nLLM Wiki 多了一道“编译知识”的过程。AI 先读取论文、文章、会议记录和项目资料，再把它们整理成结构化、相互链接的 Markdown 页面；以后有新资料进入时，它继续更新概念页、人物页、来源页和索引，并标记冲突或尚未确认的问题。\n\ntext\n\n```text\n原始资料进入 raw 文件夹\n→ AI 提取来源、概念和关系\n→ 编译成相互链接的 Wiki 页面\n→ 人工检查重要结论\n→ 后续查询优先读取 Wiki\n→ 有价值的新答案再写回知识库\n```\n\nRAG 的重点是**找到与当前问题相关的片段**，LLM Wiki 的重点是**把一次次阅读和研究沉淀成可继续维护的知识结构**。两者并不冲突：实际系统完全可以先让 LLM Wiki 整理知识，再用 RAG 从 Wiki 和原始来源中检索证据。\n\nObsidian 很适合承载这种工作方式。它直接管理本地 Markdown 文件，支持双向链接、反向链接和图谱视图；AI 或 Agent 则可以通过文件、CLI、Skill 或 MCP 读取和更新这些页面。\n\n不过，Obsidian 本身并不会自动把资料“变成 LLM Wiki”。真正起作用的是背后的工作流：保留原始来源，让 AI 生成或更新 Wiki 页面，再由人审核关键结论。\n\nObsidian 更像这个系统的本地文件层和可视化界面。\n\n\u003e **RAG 解决“这次去哪里找答案”，LLM Wiki 试图解决“这次研究之后，知识库有没有变得更好”。**\n\n所以，AI 知识库至少要能处理三种结果。\n\n回答状态\n\n系统应该怎样表现\n\n第一种是“已确认”：存在清晰、有效、权限允许的来源。\n\n第二种是“存在冲突”：几份仍然有效的材料给出不同说法，需要负责人判断。\n\n第三种是“无法回答”：当前知识库没有足够证据。\n\n\u003e **💡** **关键判断**\n\n\u003e **敢于说不知道，比从相似材料中拼出一个答案更可靠。**","sourceFormat":"markdown"},"note:sha256:cda058ab6fe1fca38b6ee65d556ad1fcebc93d81883c6d1342ec4f448d5657e7":{"html":"\u003cp\u003eAI 不知道一份旧制度已经失效，除非系统记录并应用了状态与日期。\u003c/p\u003e\n\u003cp\u003e正式知识需要生效、废止和复查机制。过期内容可以保留用于审计，但不应进入默认回答。\u003c/p\u003e\n","kind":"html","rawMarkdown":"AI 不知道一份旧制度已经失效，除非系统记录并应用了状态与日期。\n\n正式知识需要生效、废止和复查机制。过期内容可以保留用于审计，但不应进入默认回答。","sourceFormat":"markdown"},"note:sha256:d1859715e8fdb4143ff6c3a5a78e2c85294bfba2de5f2240201f58f98fe237f5":{"html":"\u003cp\u003e不要同时改造整家公司。\u003c/p\u003e\n\u003cp\u003e先选择问题频繁、资料相对集中、负责人愿意投入的场景，例如新员工入职、客服产品问答或销售合同流程。\u003c/p\u003e\n\u003cp\u003e用几十到几百条核心知识跑通创建、审核、搜索、反馈和更新，再逐步扩大范围。\u003c/p\u003e\n\u003cp\u003e第一阶段的成功标准也不应是“上传了多少文档”，而是员工能否更快找到答案，以及重复提问是否下降。\u003c/p\u003e\n","kind":"html","rawMarkdown":"不要同时改造整家公司。\n\n先选择问题频繁、资料相对集中、负责人愿意投入的场景，例如新员工入职、客服产品问答或销售合同流程。\n\n用几十到几百条核心知识跑通创建、审核、搜索、反馈和更新，再逐步扩大范围。\n\n第一阶段的成功标准也不应是“上传了多少文档”，而是员工能否更快找到答案，以及重复提问是否下降。","sourceFormat":"markdown"},"note:sha256:d23b9165e8b398982ffda8267b24eb7714eff45a623a1df3d8f9a336c0025794":{"html":"\u003cp\u003e知识问答只能复述已有依据，不能自动获得审批权。\u003c/p\u003e\n\u003cp\u003e涉及合同、财务、人事、医疗和法律等高风险事项，回答中应提示适用范围，并引导用户向负责人确认。\u003c/p\u003e\n","kind":"html","rawMarkdown":"知识问答只能复述已有依据，不能自动获得审批权。\n\n涉及合同、财务、人事、医疗和法律等高风险事项，回答中应提示适用范围，并引导用户向负责人确认。","sourceFormat":"markdown"},"note:sha256:d35c7b62c6c06d2cbfb9519d4058d61450034ab22819fe782f06ea2c21a2a1de":{"html":"\u003cp\u003e盘点来源，去重，确认版本，为每条关键知识补充负责人、生效时间和适用范围。\u003c/p\u003e\n\u003cp\u003e资料不求多，先保证核心答案可靠。\u003c/p\u003e\n","kind":"html","rawMarkdown":"盘点来源，去重，确认版本，为每条关键知识补充负责人、生效时间和适用范围。\n\n资料不求多，先保证核心答案可靠。","sourceFormat":"markdown"},"note:sha256:e857637191716d393f1342eaff4b11e8f478155b22a852a09fc851b8479374a1":{"html":"\u003cblockquote\u003e\n\u003cp\u003e@DZhao63405 · \u003ca href=\"https://x.com/DZhao63405/article/2092942969649463563\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX Article\u003c/a\u003e · 2026-08-27\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e📌\u003c/strong\u003e \u003cstrong\u003e文章导读\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e这篇文章会讲清楚个人知识库、企业知识库和 AI 知识库的区别，并对比 Obsidian、Notion、语雀、NotebookLM、飞书、Dify、FastGPT、扣子与阿里云百炼。文末附有个人版和企业版的 \u003cstrong\u003e30 天搭建计划\u003c/strong\u003e。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e大家好，我是朝朝。\u003c/p\u003e\n\u003cp\u003e今天想系统地讲一下知识库。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HQufUF6acAA7zVE?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e过去，我们把文档放进知识库，仍然要自己记住它在哪里、用什么关键词搜索、哪一版才有效。资料保存得再多，找不到、看不懂、不敢用，依然只是一堆文件。\u003c/p\u003e\n\u003cp\u003e现在，AI 开始进入这个过程。它可以理解自然语言问题，从多份资料中寻找依据，整理出带来源的答案；接入 Skill 或 MCP 后，还能在权限范围内创建页面、补充内容、更新状态和归档旧版本。\u003c/p\u003e\n\u003cp\u003e知识库因此从一个“等人来查”的资料仓库，\u003cstrong\u003e逐渐变成一个可以参与工作的系统\u003c/strong\u003e。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e真正的变化，不是 AI 更会回答问题了，而是它开始参与知识的读取、整理、更新与调用。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e这篇文章想讲透的，正是这套新知识库：个人如何建立自己的第二大脑，团队如何沉淀可靠经验，AI 又怎样在不越过权限边界的前提下，让知识真正流动起来。\u003c/p\u003e\n\u003cp\u003e我们保存过很多资料，却很少在真正需要时找到它们。\u003c/p\u003e\n\u003cp\u003e浏览器里躺着几百个收藏，网盘里堆着一排“最终版”“最终版2”和“真的最终版”，聊天记录里藏着同事发过的重要说明。遇到问题，我们还是习惯重新搜索，或者再问一次那个最懂业务的人。\u003c/p\u003e\n\u003cp\u003e公司里的情况也差不多。\u003c/p\u003e\n\u003cp\u003e制度发过，流程讲过，项目复盘也写过。可新人来了依旧不知道从哪里开始；同一个问题，行政、销售和产品给出三种答案；一位老员工离职，团队才发现真正有用的经验从来没有进入文档。\u003c/p\u003e\n\u003cp\u003e这就是知识库最值得解决的问题。\u003c/p\u003e\n\u003cp\u003e它不只负责把东西存起来，还要让已经形成的经验，在正确的时间被正确的人找到，能够核验，并继续推动工作。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e个人知识库帮助一个人减少重复思考，企业知识库帮助一个组织减少重复犯错。到了 AI 时代，我们还可以直接向资料提问，让系统从文档中检索证据、组织答案，甚至调用后续流程。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e工具越来越强，问题却没有自动消失。旧制度、冲突版本、模糊权限和错误材料一旦进入 AI 知识库，只会被更快地传播。\u003c/p\u003e\n\u003cp\u003e所以，这篇文章不准备给你一张“知识库工具排行榜”。我们从最基本的问题开始：什么才算知识，个人和企业各自要解决什么，工具怎么选，AI 知识库怎样工作，又该如何用 30 天搭出一个真正能用的版本。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e @DZhao63405 · [X Article](https://x.com/DZhao63405/article/2092942969649463563) · 2026-08-27\n\n\u003e **📌** **文章导读**\n\n\u003e 这篇文章会讲清楚个人知识库、企业知识库和 AI 知识库的区别，并对比 Obsidian、Notion、语雀、NotebookLM、飞书、Dify、FastGPT、扣子与阿里云百炼。文末附有个人版和企业版的 **30 天搭建计划**。\n\n大家好，我是朝朝。\n\n今天想系统地讲一下知识库。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HQufUF6acAA7zVE?format=jpg\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n过去，我们把文档放进知识库，仍然要自己记住它在哪里、用什么关键词搜索、哪一版才有效。资料保存得再多，找不到、看不懂、不敢用，依然只是一堆文件。\n\n现在，AI 开始进入这个过程。它可以理解自然语言问题，从多份资料中寻找依据，整理出带来源的答案；接入 Skill 或 MCP 后，还能在权限范围内创建页面、补充内容、更新状态和归档旧版本。\n\n知识库因此从一个“等人来查”的资料仓库，**逐渐变成一个可以参与工作的系统**。\n\n\u003e 真正的变化，不是 AI 更会回答问题了，而是它开始参与知识的读取、整理、更新与调用。\n\n这篇文章想讲透的，正是这套新知识库：个人如何建立自己的第二大脑，团队如何沉淀可靠经验，AI 又怎样在不越过权限边界的前提下，让知识真正流动起来。\n\n我们保存过很多资料，却很少在真正需要时找到它们。\n\n浏览器里躺着几百个收藏，网盘里堆着一排“最终版”“最终版2”和“真的最终版”，聊天记录里藏着同事发过的重要说明。遇到问题，我们还是习惯重新搜索，或者再问一次那个最懂业务的人。\n\n公司里的情况也差不多。\n\n制度发过，流程讲过，项目复盘也写过。可新人来了依旧不知道从哪里开始；同一个问题，行政、销售和产品给出三种答案；一位老员工离职，团队才发现真正有用的经验从来没有进入文档。\n\n这就是知识库最值得解决的问题。\n\n它不只负责把东西存起来，还要让已经形成的经验，在正确的时间被正确的人找到，能够核验，并继续推动工作。\n\n\u003e 个人知识库帮助一个人减少重复思考，企业知识库帮助一个组织减少重复犯错。到了 AI 时代，我们还可以直接向资料提问，让系统从文档中检索证据、组织答案，甚至调用后续流程。\n\n工具越来越强，问题却没有自动消失。旧制度、冲突版本、模糊权限和错误材料一旦进入 AI 知识库，只会被更快地传播。\n\n所以，这篇文章不准备给你一张“知识库工具排行榜”。我们从最基本的问题开始：什么才算知识，个人和企业各自要解决什么，工具怎么选，AI 知识库怎样工作，又该如何用 30 天搭出一个真正能用的版本。","sourceFormat":"markdown"},"note:sha256:eb01da0cffc51daff2fee5593f929424e4fb5c08041863bcd700bf3870592782":{"html":"\u003cp\u003e工具管理员负责账号和系统，不一定懂业务内容。\u003c/p\u003e\n\u003cp\u003e财务制度需要财务确认，产品口径需要产品负责人审核。技术团队可以维护平台，却不能代替业务部门为答案负责。\u003c/p\u003e\n","kind":"html","rawMarkdown":"工具管理员负责账号和系统，不一定懂业务内容。\n\n财务制度需要财务确认，产品口径需要产品负责人审核。技术团队可以维护平台，却不能代替业务部门为答案负责。","sourceFormat":"markdown"},"note:sha256:f00b8a3a613bf87d67383848db359e3111211bff786ebbe3ba3bac03d5cdffae":{"html":"\u003cp\u003e选择工具前，先回答三个问题。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e你的资料希望保存在本地还是云端？你主要独立使用，还是需要经常分享？你想长期积累一套知识网络，还是围绕一个专题快速研究？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e答案不同，适合的工具也不同。\u003c/p\u003e\n","kind":"html","rawMarkdown":"选择工具前，先回答三个问题。\n\n**你的资料希望保存在本地还是云端？你主要独立使用，还是需要经常分享？你想长期积累一套知识网络，还是围绕一个专题快速研究？**\n\n答案不同，适合的工具也不同。","sourceFormat":"markdown"},"note:sha256:f869969c17cf7b789cf6b919834fe853aef17cb1e9557096b5d68a176cb6f54b":{"html":"\u003cp\u003e搜索返回十份相似文档，用户仍然需要自己判断哪个有效。\u003c/p\u003e\n\u003cp\u003e正式知识应该标记状态，并把已废止版本移出默认结果。搜索数量不是越多越好。\u003c/p\u003e\n","kind":"html","rawMarkdown":"搜索返回十份相似文档，用户仍然需要自己判断哪个有效。\n\n正式知识应该标记状态，并把已废止版本移出默认结果。搜索数量不是越多越好。","sourceFormat":"markdown"},"note:sha256:fce8da0cd26ab3bd0de0a9b8cbd3ac018bfccc6b9e93dc67308fca9787ed1b8e":{"html":"\u003cp\u003e个人知识库最重要的动作不是整理，而是调用。\u003c/p\u003e\n\u003cp\u003e准备文章时，先搜索过去写过的相关判断；启动项目时，复制旧项目中的检查清单；做季度复盘时，回看当时的决策依据和实际结果。\u003c/p\u003e\n\u003cp\u003e如果某类笔记半年没有被使用，可以检查它是否真的值得继续收集。\u003c/p\u003e\n","kind":"html","rawMarkdown":"个人知识库最重要的动作不是整理，而是调用。\n\n准备文章时，先搜索过去写过的相关判断；启动项目时，复制旧项目中的检查清单；做季度复盘时，回看当时的决策依据和实际结果。\n\n如果某类笔记半年没有被使用，可以检查它是否真的值得继续收集。","sourceFormat":"markdown"},"note:sha256:fe05f977bc3dd961fa8c451531be313274fb4a5fd7385cf0caff1be13cc4075e":{"html":"\u003cp\u003e扣子适合个人、小团队和没有完整开发团队的业务人员快速验证知识 Agent。\u003c/p\u003e\n\u003cp\u003e低代码智能体可以关联知识库，并配置检索与召回。团队和企业工作空间中的智能体、插件、工作流和知识库等资源可以在空间成员之间共享，不同工作空间的数据相互隔离。\u003c/p\u003e\n\u003cp\u003e它的优势是起步快，可以把知识、插件和流程组合起来。\u003c/p\u003e\n\u003cp\u003e使用前需要确认账号版本、空间权限、知识库容量和发布范围。搭建门槛低，不代表答案可以跳过测试。正式上线前仍然要准备真实问题集，检查错误回答、无答案处理和来源引用。\u003c/p\u003e\n","kind":"html","rawMarkdown":"扣子适合个人、小团队和没有完整开发团队的业务人员快速验证知识 Agent。\n\n低代码智能体可以关联知识库，并配置检索与召回。团队和企业工作空间中的智能体、插件、工作流和知识库等资源可以在空间成员之间共享，不同工作空间的数据相互隔离。\n\n它的优势是起步快，可以把知识、插件和流程组合起来。\n\n使用前需要确认账号版本、空间权限、知识库容量和发布范围。搭建门槛低，不代表答案可以跳过测试。正式上线前仍然要准备真实问题集，检查错误回答、无答案处理和来源引用。","sourceFormat":"markdown"}},"sourceRevision":"sha256:20193d9fecf735df84a5e059c415161f295292b4d88bed62d3fd25582688c421"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(t,e,n)=>e in t?__defProp(t,e,{enumerable:!0,configurable:!0,writable:!0,value:n}):t[e]=n,__publicField=(t,e,n)=>__defNormalProp(t,"symbol"!=typeof e?e+"":e,n);!function(){"use strict";const t="deminds-interactive",e=["reading","map","asset-ref-v1"];class n extends Error{constructor(t,e){super(e),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=t}}function i(t,e){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${t}": ${e}`)}function r(t){const e=String(t||"").normalize("NFC").trim().replace(/\\/g,"/");e||i(e,"empty"),e.includes("\0")&&i(e,"nul_byte"),e.startsWith("/")&&i(e,"absolute"),/^[A-Za-z]:/.test(e)&&i(e,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*:/.test(e)&&i(e,"url_scheme"),e.endsWith("/")&&i(e,"directory");const n=e.split("/");return n.some(t=>!t||"."===t||".."===t)&&i(e,"unsafe_segment"),n.join("/")}function a(t){if(null===t||"string"==typeof t||"boolean"==typeof t)return JSON.stringify(t);if("number"==typeof t){if(!Number.isFinite(t))throw new n("unsupported_json_value","Canonical JSON does not allow non-finite numbers.");return JSON.stringify(t)}if(Array.isArray(t))return`[${t.map(t=>a(t)).join(",")}]`;if("object"==typeof t)return`{${Object.keys(t).sort().map(e=>`${JSON.stringify(e)}:${a(t[e])}`).join(",")}}`;throw new n("unsupported_json_value",`Canonical JSON does not support ${typeof t}.`)}function o(t){return a(t)}async function s(t){const e=g
