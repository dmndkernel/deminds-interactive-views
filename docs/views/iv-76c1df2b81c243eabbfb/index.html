</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-10-09T01:51:28.612Z","language":"zh-CN","name":"DeMinds","version":"1.0.48"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Skill Bundles：拆解新的应用层","outlineVersion":1},"sourceRevision":"sha256:a7c7cd70c31ad7092ce1c9dadd644795f4c86f09b918a66c2903d9e64fc18d0f","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Skill Bundles  Dissecting the New Application Layer.md","sourceUrl":"https://x.com/JoshARosen/status/2108276264763048104","title":"Skill Bundles：拆解新的应用层"},"files":[{"byteLength":14537,"content":"# Skill Bundles：拆解新的应用层\n\n![图像](https://pbs.twimg.com/media/HUIZ_fMXAAA5CbT?format=png\u0026name=medium)\n\n\u003e @JoshARosen · [X 文章](https://x.com/JoshARosen/article/2108276264763048104) · 2026-10-08\n\n企业开始发布的这些大型 Skill Bundle，到底是什么？OpenAI 的 [Data Analytics 插件](https://github.com/openai/plugins/blob/main/plugins/data-analytics/README.md)包含 16 个专门 Skill，同时还有规模更大的 [Public Equity Investing](https://github.com/openai/plugins/blob/main/plugins/public-equity-investing/README.md) Skill 集合。[Stripe](https://github.com/stripe/ai)、[Cloudflare](https://github.com/cloudflare/skills)、[Vercel](https://github.com/vercel-labs/agent-skills) 和 [Hugging Face](https://github.com/huggingface/skills) 也都在做不同版本的同一件事。\n\n微软也[刚刚宣布了 30 个预构建 CRM Skill](https://www.microsoft.com/en-us/copilot/blog/2026/10/08/bringing-crm-into-the-flow-of-work-and-agents-into-business-process-for-sales-and-service-teams/)，与 Dynamics 365 现有的数据、工具和业务系统配合使用。这其实是在相当明确地暗示：企业软件可能正在走向一个新的方向。\n\n但这些 Bundle 里面究竟有什么？企业只是在打包一组指令，还是正在构建某种接近应用程序的东西？这些 Skill 如何协同、访问工具、执行要求，以及在彼此之间传递结果？\n\n越来越清晰的一组架构模式正在浮现：企业开始用 Skill 拆解工作、在专门能力之间路由任务，并把这些能力连接到工具。\n\n## 拆解工作\n\n更成熟的 Bundle，是围绕**工作单元**而不是软件功能来组织的。OpenAI 的 [Data Analytics 插件](https://github.com/openai/plugins/tree/main/plugins/data-analytics)把分析工作拆成 KPI 设计、指标诊断、数据质量、市场规模估算、业务分析、可视化和报告等专门能力。\n\n### 可组合的职责，而不是固定流程\n\n这些能力不是预先定义好顺序的流水线步骤，而是可以根据任务独立调用或组合的职责。调查收入下降，可能需要指标诊断、数据源验证和报告；做市场规模估算，则会使用另一组能力组合。\n\nOpenAI 的 [Public Equity Investing 插件](https://github.com/openai/plugins/tree/main/plugins/public-equity-investing)更进一步，其中包括财报分析、估值模型、投资备忘录、投资逻辑追踪、组合风险和财务模型审计等 Skill。\n\n### 按专业工作来建模\n\n这种拆解方式对应的是投资专业人士能够识别的人类工作。分析师可能会更新财务模型、评估新财报会如何影响投资逻辑，再为投资组合经理准备一份备忘录。Bundle 会分别描述这些职责，包括什么情况下一个 Skill 应该引入另一个 Skill。\n\n这与一个仓库里塞进一百个彼此无关的 Skill 并不相同。这些 Bundle 正在把一类专业工作建模为一组可复用能力，同时又不预先规定每一次执行必须遵循的完整步骤。\n\n## 为工作做路由\n\nOpenAI 较大的 Bundle，会在专门 Skill 前面设置一个路由层。Data Analytics 插件使用一个 index Skill 作为入口，先判断请求是否属于分析领域，再选择主要 Skill，并识别需要配合的其他能力。\n\n### 入口、主能力与支持能力\n\n路由指令会区分真正的分析工作与普通文档格式处理，也会考虑当前可用的执行环境，并规定如何调用额外 Skill。有些分析工作流默认应该包含报告生成，除非用户明确选择不需要。\n\nPublic Equity Investing Bundle 采用了类似模式，但会进一步区分面向用户的工作流与内部支持能力。共享的路由 Playbook 用来挑选专家 Skill，而支持型 Skill 则负责来源解析、数据准备、格式处理和行业上下文。\n\n它看起来很像一种服务架构：有入口、有专门的内部能力，也有分配职责的策略。同时，它还实现了渐进式披露，因为 Agent 不必一次把整个 Bundle 的所有指令都放进上下文。\n\n### 路由本身仍由模型解释\n\n值得注意的是，这些路由大多——甚至可能几乎全部——仍然需要模型来解释。即便存在结构化路由信息，Agent 通常仍要自己决定具体应该怎样应用。\n\n## 协调 Skill\n\nOpenAI 的 [Public Equity Investing Bundle](https://github.com/openai/plugins/tree/main/plugins/public-equity-investing)会在多个专门 Skill 之间共享指令。换句话说，这些 Skill 的结构里开始出现我们熟悉的 Don’t Repeat Yourself（DRY）原则。\n\n### 用共享标准减少重复\n\n公共指令会统一规定来源选择、分析判断、交付物准备和产物格式等标准。各个 Skill 直接引用这些共享标准，而不是各自重新定义一遍。\n\n以[投资备忘录 Skill](https://github.com/openai/plugins/blob/main/plugins/public-equity-investing/skills/memo-builder/SKILL.md)为例，它负责正式书面研究，但会把其他职责委派给专门能力。财务模型相关工作流也有自己的职责，以及围绕来源、审阅和支持记录的要求。\n\n### 自然语言开始承担“接口”角色\n\nBundle 的设计会规定哪个 Skill 对结果负责、它需要哪些信息，以及应该适用哪些标准。有些指令还会明确：在工作被视为完成之前，必须先调用另一个能力。因此，Skill 之间的许多依赖关系，目前仍是用文字或简单的 Markdown 链接表达的。\n\n即便如此，这些关系已经开始像应用组件之间的接口，只不过大多数接口仍然是自然语言。\n\n## 把 Skill 连接到工具\n\n这些 Bundle 通常会把“如何工作”的指令，与真正执行操作的工具分开。OpenAI 的 [Data Analytics 插件](https://github.com/openai/plugins/tree/main/plugins/data-analytics)把 Skill、App 集成和 MCP 配置组合起来。根据已经连接的系统不同，Agent 可以访问数据仓库、BI 系统、电子表格和文档，同时使用 SQL、Python 及其他执行能力。\n\n### Skill 描述工作，工具提供能力\n\n[Stripe 的 Skill](https://github.com/stripe/ai)会说明如何实现支付功能，但真实的支付处理和认证操作仍然发生在 Stripe 服务里。[Cloudflare 的 Skill](https://github.com/cloudflare/skills)会说明如何使用 Workers、Durable Objects 和相关基础设施，但执行环境依然属于 Cloudflare 后端。\n\n有些 Bundle 还会附带用于数据处理、文档生成和验证的可执行脚本。只要可行，它们会把操作放进确定性代码，而不是试图把所有事情都写进 Skill 文本。\n\nSkill 与工具之间的边界相当一致：Skill 描述职责、流程和决策；工具提供能力。Agent harness 把两者连在一起，而模型则参与整个执行循环。\n\n## 为输出建立类型并进行验证\n\n一些 Skill Bundle 已经开始用**有类型的产物契约（typed artifact contracts）**替代自然语言交接。OpenAI 的 [Data Analytics 插件](https://github.com/openai/plugins/tree/main/plugins/data-analytics)为某些报告和仪表板定义了规范的 `artifact.json` 表示，其中包含结构化 manifest block、数据集、来源和访问信息。\n\n### 在渲染前验证产物\n\n系统会要求 Agent 在渲染前调用 `validate_artifact`，可视化也会引用规范的数据源。这样，在生成分析结果与渲染结果之间就形成了一个有类型的接口，validator 可以拒绝格式错误的产物。\n\n[Public Equity Investing Bundle](https://github.com/openai/plugins/tree/main/plugins/public-equity-investing)也采用了类似机制。它的仪表板 renderer 接收一个有类型的 `public_equity_investing_dashboard.v1` payload。财务模型工作流还会生成结构化支持文件，包括来源映射、变更日志、引用和 manifest。有些流程会把字段缺失或格式错误定义为硬失败条件。\n\n### 在概率软件与确定性软件之间建立边界\n\n尽管所有工作仍发生在 Agent loop 内部，但这给了 Agent 一种额外的自检方式：某些输出必须满足契约，确定性软件才会继续消费它们。实质上，这把非确定性软件与确定性软件之间的接口正式化了。\n\n目前，有类型的边界主要出现在模型生成结果与确定性软件相接的地方。Bundle 内部的大部分协调仍然依赖自然语言。\n\n## 开发与评估 Bundle\n\n只要看一眼这些 Bundle，就能判断它们背后投入了大量开发工作。它绝不是“把说明写出来、校对一下，然后发布”这么简单。这些产物看起来经过了高度优化和大量评估。\n\n### Skill Markdown 是开发结果，而不是起点\n\n这些 Skill 里的 Markdown 文件，是一套软件开发过程的最终产物。除了要把一个领域拆解成不同 Skill，还必须确保这些组成部分在 Agent 真正调用时能够协调工作。\n\n测试在 Skill package 的开发中占据很大比重，因为执行引擎本身具有概率性。模型可能犯各种错误：可能选错 Skill，也可能产出结构上正确、但并不满足底层业务要求的结果。同一套指令在不同模型、harness 和模型版本上也可能表现不同。\n\n### Evals 用来发现弱点和回归\n\nOpenAI 已经发布了一个 [Plugin Eval 工具包](https://github.com/openai/plugins/tree/main/plugins/plugin-eval)，用于分析 Skill 和完整插件。它包含结构检查、token budget 分析、benchmark 配置，以及用于识别薄弱环节和回归的对比机制。\n\n[Vercel 的 agent-browser evaluations](https://github.com/vercel-labs/agent-browser/blob/main/evals/README.md)则针对跨模型问题进行测试。它们会通过 Claude 和 Codex 测试 Skill 加载、选择和正确命令使用，并比较不同执行环境下的行为得分。\n\n仅凭公开仓库，不可能知道每家厂商究竟把 Bundle 评估到了什么程度。但从已经公开的部分来看，这些 Bundle 在设计深度和整体一致性上，都很像是经过严格开发与反复优化后的结果。\n\n## 发布业务逻辑\n\nSkill 正在变成企业知识产权的一种开放规范。\n\n### 被公开的不只是“功能”，还有工作方法\n\n从某种意义上说，Skill 会包含领域或公司特有的“工作应该怎样完成”的知识：如何拆解任务、公司如何理解决策规则、偏好的方法和策略，以及那些让产品真正有用的细小惯例。\n\nOpenAI 的投资 Bundle 公开了相当多这类内容：它不仅描述有哪些能力，还描述投资研究应该怎样真正开展。\n\n### 专有能力仍然可以留在工具和基础设施里\n\n这并不意味着企业会把让产品有价值的一切都公开出来。Stripe 可以发布非常详细的 Skill，同时继续把支付基础设施保留为专有系统；CRM 可以公开它的销售方法，而把数据、权限和交易系统继续放在工具后面。\n\n但某些东西确实已经改变。过去，企业会把大量这类逻辑编码在专有应用代码和界面中。如果新的应用架构逐渐变成 Skill + Tool，那么越来越多业务逻辑会变得可被模型读取，也因此更容易被公众读取。\n\n## Skill 仍然只是“建议”\n\n归根结底，无论这些 Skill Bundle 的设计多么严谨，真正解释并执行它们的仍然是一个概率模型。意外行为依然可能发生，用户指令或周围上下文也仍可能让模型产生偏移。\n\n### 跨 Skill 交接大多还没有类型化\n\nSkill 之间的 handoff 仍然主要是无类型的。一个 Skill 可以要求另一个能力先产出分析或完成审阅，但这种关系可能只存在于文字指令里。有类型的产物已经开始出现在某些具体位置，但还没有覆盖完整的工作模型。\n\n### 指令本身并不能强制执行\n\n指令天然并不具备强制力。一个 Skill 可以要求必须审阅、必须审批或必须满足证据要求，但如果 harness 或其他系统没有真正执行这些约束，模型依然可能跳过或重新解释它们。在实际场景里，后果可能小到漏掉一次格式检查，也可能严重到在外部操作前漏掉本应发生的审批。\n\n### 可复现性仍然是问题\n\n即便使用同一个 Agent 和同一组 Skill，也无法保证第二次一定按照完全相同的路径执行。用户消息或周围上下文只要有一点变化，模型就可能选择另一条路径。Evals 可以覆盖重要场景和失败模式，但不可能测试用户输入与上下文的所有组合。\n\n## 一个新的应用层\n\n很明显，大量工程与产品投入正在流向这些复杂的 Skill Bundle。每个新 Bundle 发布时都伴随着相当大的市场声量，而 Bundle 本身也越来越像产品，而不只是指令集合。\n\n企业越来越倾向于把 Skill Bundle 定位为面向 Agent 的应用层。这种说法并非错误，但我们必须理解它们是什么，以及不是什么。\n\nSkill 可以封装非常多的应用逻辑：工作如何被拆解、应该使用哪些能力、这些能力怎样协调，以及应该调用哪些工具。但归根结底，这个“应用”仍然由概率模型来解释。\n\n因此，Skill Bundle 构成的是一种与以往应用层非常不同的新应用层。\n\n---\n\n## ChatGPT 编辑附注 · `dmnd:editorial-insight:v1`\n\n这篇文章的核心不是“Skill 变多了”，而是 Skill Bundle 正逐步承担过去由应用代码与界面承载的一部分工作分解、路由、协同和业务逻辑。\n\n### 关键要点\n\n- 成熟 Bundle 按专业工作职责拆解能力，并通过路由层组合不同 Skill，而不是把任务写死成单一工作流。\n- Skill 与 Tool 的边界相对清晰：前者描述方法、职责和判断，后者提供执行能力；确定性代码正在承担更多验证和硬约束。\n- Typed artifact contract 把部分模型输出变成可验证接口，是连接概率执行与确定性软件的重要边界。\n- Bundle 内部的大量协同仍由模型解释，自然语言要求并不等于可强制规则，跨 Skill handoff 与可复现性仍是明显限制。\n\n### 可借鉴的新思路\n\n- 设计 Agent 应用层时，可把“模型应该理解什么”与“系统必须保证什么”分开：前者交给 Skill，后者尽量交给类型、验证器、权限和确定性工具。\n- Skill 的长期价值可能不只在提示词复用，而在于把专业工作的拆解方式、共享标准与接口关系显式化。\n\n---","encoding ","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eSkill 与 Tool 的边界相对清晰：前者描述方法、职责和判断，后者提供执行能力；确定性代码正在承担更多验证和硬约束。\u003c/span\u003e","payload":{"lines":"29,30","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eTyped artifact contract 把部分模型输出变成可验证接口，是连接概率执行与确定性软件的重要边界。\u003c/span\u003e","payload":{"lines":"30,31","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eBundle 内部的大量协同仍由模型解释，自然语言要求并不等于可强制规则，跨 Skill handoff 与可复现性仍是明显限制。\u003c/span\u003e","payload":{"lines":"31,32","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键要点\u003c/span\u003e","payload":{"fold":1,"lines":"27,28","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e设计 Agent 应用层时，可把“模型应该理解什么”与“系统必须保证什么”分开：前者交给 Skill，后者尽量交给类型、验证器、权限和确定性工具。\u003c/span\u003e","payload":{"lines":"33,34","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eSkill 的长期价值可能不只在提示词复用，而在于把专业工作的拆解方式、共享标准与接口关系显式化。\u003c/span\u003e","payload":{"lines":"34,35","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e可借鉴的新思路\u003c/span\u003e","payload":{"lines":"32,33","tag":"h3"}}],"content":"\u003cspan data-dmnd-editorial-insight=\"v1\" class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eChatGPT 编辑附注\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:a34ff7eda94f76cf520e5930e2710c96adbb9db8e37f2a171655f3a58a47f63b\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"26,27","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUIZ_fMXAAA5CbT?format=png\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eSkill Bundles：拆解新的应用层\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Skill Bundles：拆解新的应用层\" data-note-id=\"note:sha256:b19b72fb53ee83e3948e6c257a4d6eecb7b79ccf3ccbcf1bff6a48a72d685f88\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"skill-bundles拆解新的应用层\"\u003eSkill Bundles：拆解新的应用层\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUIZ_fMXAAA5CbT?format=png\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@JoshARosen · \u003ca href=\"https://x.com/JoshARosen/article/2108276264763048104\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-10-08\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e企业开始发布的这些大型 Skill Bundle，到底是什么？OpenAI 的 \u003ca href=\"https://github.com/openai/plugins/blob/main/plugins/data-analytics/README.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eData Analytics 插件\u003c/a\u003e包含 16 个专门 Skill，同时还有规模更大的 \u003ca href=\"https://github.com/openai/plugins/blob/main/plugins/public-equity-investing/README.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePublic Equity Investing\u003c/a\u003e Skill 集合。\u003ca href=\"https://github.com/stripe/ai\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eStripe\u003c/a\u003e、\u003ca href=\"https://github.com/cloudflare/skills\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCloudflare\u003c/a\u003e、\u003ca href=\"https://github.com/vercel-labs/agent-skills\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eVercel\u003c/a\u003e 和 \u003ca href=\"https://github.com/huggingface/skills\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHugging Face\u003c/a\u003e 也都在做不同版本的同一件事。\u003c/p\u003e\n\u003cp\u003e微软也\u003ca href=\"https://www.microsoft.com/en-us/copilot/blog/2026/10/08/bringing-crm-into-the-flow-of-work-and-agents-into-business-process-for-sales-and-service-teams/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e刚刚宣布了 30 个预构建 CRM Skill\u003c/a\u003e，与 Dynamics 365 现有的数据、工具和业务系统配合使用。这其实是在相当明确地暗示：企业软件可能正在走向一个新的方向。\u003c/p\u003e\n\u003cp\u003e但这些 Bundle 里面究竟有什么？企业只是在打包一组指令，还是正在构建某种接近应用程序的东西？这些 Skill 如何协同、访问工具、执行要求，以及在彼此之间传递结果？\u003c/p\u003e\n\u003cp\u003e越来越清晰的一组架构模式正在浮现：企业开始用 Skill 拆解工作、在专门能力之间路由任务，并把这些能力连接到工具。\u003c/p\u003e\n\u003ch2 id=\"拆解工作\"\u003e拆解工作\u003c/h2\u003e\n\u003cp\u003e更成熟的 Bundle，是围绕\u003cstrong\u003e工作单元\u003c/strong\u003e而不是软件功能来组织的。OpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/data-analytics\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eData Analytics 插件\u003c/a\u003e把分析工作拆成 KPI 设计、指标诊断、数据质量、市场规模估算、业务分析、可视化和报告等专门能力。\u003c/p\u003e\n\u003ch3 id=\"可组合的职责而不是固定流程\"\u003e可组合的职责，而不是固定流程\u003c/h3\u003e\n\u003cp\u003e这些能力不是预先定义好顺序的流水线步骤，而是可以根据任务独立调用或组合的职责。调查收入下降，可能需要指标诊断、数据源验证和报告；做市场规模估算，则会使用另一组能力组合。\u003c/p\u003e\n\u003cp\u003eOpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/public-equity-investing\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePublic Equity Investing 插件\u003c/a\u003e更进一步，其中包括财报分析、估值模型、投资备忘录、投资逻辑追踪、组合风险和财务模型审计等 Skill。\u003c/p\u003e\n\u003ch3 id=\"按专业工作来建模\"\u003e按专业工作来建模\u003c/h3\u003e\n\u003cp\u003e这种拆解方式对应的是投资专业人士能够识别的人类工作。分析师可能会更新财务模型、评估新财报会如何影响投资逻辑，再为投资组合经理准备一份备忘录。Bundle 会分别描述这些职责，包括什么情况下一个 Skill 应该引入另一个 Skill。\u003c/p\u003e\n\u003cp\u003e这与一个仓库里塞进一百个彼此无关的 Skill 并不相同。这些 Bundle 正在把一类专业工作建模为一组可复用能力，同时又不预先规定每一次执行必须遵循的完整步骤。\u003c/p\u003e\n\u003ch2 id=\"为工作做路由\"\u003e为工作做路由\u003c/h2\u003e\n\u003cp\u003eOpenAI 较大的 Bundle，会在专门 Skill 前面设置一个路由层。Data Analytics 插件使用一个 index Skill 作为入口，先判断请求是否属于分析领域，再选择主要 Skill，并识别需要配合的其他能力。\u003c/p\u003e\n\u003ch3 id=\"入口主能力与支持能力\"\u003e入口、主能力与支持能力\u003c/h3\u003e\n\u003cp\u003e路由指令会区分真正的分析工作与普通文档格式处理，也会考虑当前可用的执行环境，并规定如何调用额外 Skill。有些分析工作流默认应该包含报告生成，除非用户明确选择不需要。\u003c/p\u003e\n\u003cp\u003ePublic Equity Investing Bundle 采用了类似模式，但会进一步区分面向用户的工作流与内部支持能力。共享的路由 Playbook 用来挑选专家 Skill，而支持型 Skill 则负责来源解析、数据准备、格式处理和行业上下文。\u003c/p\u003e\n\u003cp\u003e它看起来很像一种服务架构：有入口、有专门的内部能力，也有分配职责的策略。同时，它还实现了渐进式披露，因为 Agent 不必一次把整个 Bundle 的所有指令都放进上下文。\u003c/p\u003e\n\u003ch3 id=\"路由本身仍由模型解释\"\u003e路由本身仍由模型解释\u003c/h3\u003e\n\u003cp\u003e值得注意的是，这些路由大多——甚至可能几乎全部——仍然需要模型来解释。即便存在结构化路由信息，Agent 通常仍要自己决定具体应该怎样应用。\u003c/p\u003e\n\u003ch2 id=\"协调-skill\"\u003e协调 Skill\u003c/h2\u003e\n\u003cp\u003eOpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/public-equity-investing\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePublic Equity Investing Bundle\u003c/a\u003e会在多个专门 Skill 之间共享指令。换句话说，这些 Skill 的结构里开始出现我们熟悉的 Don’t Repeat Yourself（DRY）原则。\u003c/p\u003e\n\u003ch3 id=\"用共享标准减少重复\"\u003e用共享标准减少重复\u003c/h3\u003e\n\u003cp\u003e公共指令会统一规定来源选择、分析判断、交付物准备和产物格式等标准。各个 Skill 直接引用这些共享标准，而不是各自重新定义一遍。\u003c/p\u003e\n\u003cp\u003e以\u003ca href=\"https://github.com/openai/plugins/blob/main/plugins/public-equity-investing/skills/memo-builder/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e投资备忘录 Skill\u003c/a\u003e为例，它负责正式书面研究，但会把其他职责委派给专门能力。财务模型相关工作流也有自己的职责，以及围绕来源、审阅和支持记录的要求。\u003c/p\u003e\n\u003ch3 id=\"自然语言开始承担接口角色\"\u003e自然语言开始承担“接口”角色\u003c/h3\u003e\n\u003cp\u003eBundle 的设计会规定哪个 Skill 对结果负责、它需要哪些信息，以及应该适用哪些标准。有些指令还会明确：在工作被视为完成之前，必须先调用另一个能力。因此，Skill 之间的许多依赖关系，目前仍是用文字或简单的 Markdown 链接表达的。\u003c/p\u003e\n\u003cp\u003e即便如此，这些关系已经开始像应用组件之间的接口，只不过大多数接口仍然是自然语言。\u003c/p\u003e\n\u003ch2 id=\"把-skill-连接到工具\"\u003e把 Skill 连接到工具\u003c/h2\u003e\n\u003cp\u003e这些 Bundle 通常会把“如何工作”的指令，与真正执行操作的工具分开。OpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/data-analytics\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eData Analytics 插件\u003c/a\u003e把 Skill、App 集成和 MCP 配置组合起来。根据已经连接的系统不同，Agent 可以访问数据仓库、BI 系统、电子表格和文档，同时使用 SQL、Python 及其他执行能力。\u003c/p\u003e\n\u003ch3 id=\"skill-描述工作工具提供能力\"\u003eSkill 描述工作，工具提供能力\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/stripe/ai\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eStripe 的 Skill\u003c/a\u003e会说明如何实现支付功能，但真实的支付处理和认证操作仍然发生在 Stripe 服务里。\u003ca href=\"https://github.com/cloudflare/skills\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCloudflare 的 Skill\u003c/a\u003e会说明如何使用 Workers、Durable Objects 和相关基础设施，但执行环境依然属于 Cloudflare 后端。\u003c/p\u003e\n\u003cp\u003e有些 Bundle 还会附带用于数据处理、文档生成和验证的可执行脚本。只要可行，它们会把操作放进确定性代码，而不是试图把所有事情都写进 Skill 文本。\u003c/p\u003e\n\u003cp\u003eSkill 与工具之间的边界相当一致：Skill 描述职责、流程和决策；工具提供能力。Agent harness 把两者连在一起，而模型则参与整个执行循环。\u003c/p\u003e\n\u003ch2 id=\"为输出建立类型并进行验证\"\u003e为输出建立类型并进行验证\u003c/h2\u003e\n\u003cp\u003e一些 Skill Bundle 已经开始用\u003cstrong\u003e有类型的产物契约（typed artifact contracts）\u003c/strong\u003e替代自然语言交接。OpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/data-analytics\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eData Analytics 插件\u003c/a\u003e为某些报告和仪表板定义了规范的 \u003ccode\u003eartifact.json\u003c/code\u003e 表示，其中包含结构化 manifest block、数据集、来源和访问信息。\u003c/p\u003e\n\u003ch3 id=\"在渲染前验证产物\"\u003e在渲染前验证产物\u003c/h3\u003e\n\u003cp\u003e系统会要求 Agent 在渲染前调用 \u003ccode\u003evalidate_artifact\u003c/code\u003e，可视化也会引用规范的数据源。这样，在生成分析结果与渲染结果之间就形成了一个有类型的接口，validator 可以拒绝格式错误的产物。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/public-equity-investing\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePublic Equity Investing Bundle\u003c/a\u003e也采用了类似机制。它的仪表板 renderer 接收一个有类型的 \u003ccode\u003epublic_equity_investing_dashboard.v1\u003c/code\u003e payload。财务模型工作流还会生成结构化支持文件，包括来源映射、变更日志、引用和 manifest。有些流程会把字段缺失或格式错误定义为硬失败条件。\u003c/p\u003e\n\u003ch3 id=\"在概率软件与确定性软件之间建立边界\"\u003e在概率软件与确定性软件之间建立边界\u003c/h3\u003e\n\u003cp\u003e尽管所有工作仍发生在 Agent loop 内部，但这给了 Agent 一种额外的自检方式：某些输出必须满足契约，确定性软件才会继续消费它们。实质上，这把非确定性软件与确定性软件之间的接口正式化了。\u003c/p\u003e\n\u003cp\u003e目前，有类型的边界主要出现在模型生成结果与确定性软件相接的地方。Bundle 内部的大部分协调仍然依赖自然语言。\u003c/p\u003e\n\u003ch2 id=\"开发与评估-bundle\"\u003e开发与评估 Bundle\u003c/h2\u003e\n\u003cp\u003e只要看一眼这些 Bundle，就能判断它们背后投入了大量开发工作。它绝不是“把说明写出来、校对一下，然后发布”这么简单。这些产物看起来经过了高度优化和大量评估。\u003c/p\u003e\n\u003ch3 id=\"skill-markdown-是开发结果而不是起点\"\u003eSkill Markdown 是开发结果，而不是起点\u003c/h3\u003e\n\u003cp\u003e这些 Skill 里的 Markdown 文件，是一套软件开发过程的最终产物。除了要把一个领域拆解成不同 Skill，还必须确保这些组成部分在 Agent 真正调用时能够协调工作。\u003c/p\u003e\n\u003cp\u003e测试在 Skill package 的开发中占据很大比重，因为执行引擎本身具有概率性。模型可能犯各种错误：可能选错 Skill，也可能产出结构上正确、但并不满足底层业务要求的结果。同一套指令在不同模型、harness 和模型版本上也可能表现不同。\u003c/p\u003e\n\u003ch3 id=\"evals-用来发现弱点和回归\"\u003eEvals 用来发现弱点和回归\u003c/h3\u003e\n\u003cp\u003eOpenAI 已经发布了一个 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/plugin-eval\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePlugin Eval 工具包\u003c/a\u003e，用于分析 Skill 和完整插件。它包含结构检查、token budget 分析、benchmark 配置，以及用于识别薄弱环节和回归的对比机制。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/vercel-labs/agent-browser/blob/main/evals/README.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eVercel 的 agent-browser evaluations\u003c/a\u003e则针对跨模型问题进行测试。它们会通过 Claude 和 Codex 测试 Skill 加载、选择和正确命令使用，并比较不同执行环境下的行为得分。\u003c/p\u003e\n\u003cp\u003e仅凭公开仓库，不可能知道每家厂商究竟把 Bundle 评估到了什么程度。但从已经公开的部分来看，这些 Bundle 在设计深度和整体一致性上，都很像是经过严格开发与反复优化后的结果。\u003c/p\u003e\n\u003ch2 id=\"发布业务逻辑\"\u003e发布业务逻辑\u003c/h2\u003e\n\u003cp\u003eSkill 正在变成企业知识产权的一种开放规范。\u003c/p\u003e\n\u003ch3 id=\"被公开的不只是功能还有工作方法\"\u003e被公开的不只是“功能”，还有工作方法\u003c/h3\u003e\n\u003cp\u003e从某种意义上说，Skill 会包含领域或公司特有的“工作应该怎样完成”的知识：如何拆解任务、公司如何理解决策规则、偏好的方法和策略，以及那些让产品真正有用的细小惯例。\u003c/p\u003e\n\u003cp\u003eOpenAI 的投资 Bundle 公开了相当多这类内容：它不仅描述有哪些能力，还描述投资研究应该怎样真正开展。\u003c/p\u003e\n\u003ch3 id=\"专有能力仍然可以留在工具和基础设施里\"\u003e专有能力仍然可以留在工具和基础设施里\u003c/h3\u003e\n\u003cp\u003e这并不意味着企业会把让产品有价值的一切都公开出来。Stripe 可以发布非常详细的 Skill，同时继续把支付基础设施保留为专有系统；CRM 可以公开它的销售方法，而把数据、权限和交易系统继续放在工具后面。\u003c/p\u003e\n\u003cp\u003e但某些东西确实已经改变。过去，企业会把大量这类逻辑编码在专有应用代码和界面中。如果新的应用架构逐渐变成 Skill + Tool，那么越来越多业务逻辑会变得可被模型读取，也因此更容易被公众读取。\u003c/p\u003e\n\u003ch2 id=\"skill-仍然只是建议\"\u003eSkill 仍然只是“建议”\u003c/h2\u003e\n\u003cp\u003e归根结底，无论这些 Skill Bundle 的设计多么严谨，真正解释并执行它们的仍然是一个概率模型。意外行为依然可能发生，用户指令或周围上下文也仍可能让模型产生偏移。\u003c/p\u003e\n\u003ch3 id=\"跨-skill-交接大多还没有类型化\"\u003e跨 Skill 交接大多还没有类型化\u003c/h3\u003e\n\u003cp\u003eSkill 之间的 handoff 仍然主要是无类型的。一个 Skill 可以要求另一个能力先产出分析或完成审阅，但这种关系可能只存在于文字指令里。有类型的产物已经开始出现在某些具体位置，但还没有覆盖完整的工作模型。\u003c/p\u003e\n\u003ch3 id=\"指令本身并不能强制执行\"\u003e指令本身并不能强制执行\u003c/h3\u003e\n\u003cp\u003e指令天然并不具备强制力。一个 Skill 可以要求必须审阅、必须审批或必须满足证据要求，但如果 harness 或其他系统没有真正执行这些约束，模型依然可能跳过或重新解释它们。在实际场景里，后果可能小到漏掉一次格式检查，也可能严重到在外部操作前漏掉本应发生的审批。\u003c/p\u003e\n\u003ch3 id=\"可复现性仍然是问题\"\u003e可复现性仍然是问题\u003c/h3\u003e\n\u003cp\u003e即便使用同一个 Agent 和同一组 Skill，也无法保证第二次一定按照完全相同的路径执行。用户消息或周围上下文只要有一点变化，模型就可能选择另一条路径。Evals 可以覆盖重要场景和失败模式，但不可能测试用户输入与上下文的所有组合。\u003c/p\u003e\n\u003ch2 id=\"一个新的应用层\"\u003e一个新的应用层\u003c/h2\u003e\n\u003cp\u003e很明显，大量工程与产品投入正在流向这些复杂的 Skill Bundle。每个新 Bundle 发布时都伴随着相当大的市场声量，而 Bundle 本身也越来越像产品，而不只是指令集合。\u003c/p\u003e\n\u003cp\u003e企业越来越倾向于把 Skill Bundle 定位为面向 Agent 的应用层。这种说法并非错误，但我们必须理解它们是什么，以及不是什么。\u003c/p\u003e\n\u003cp\u003eSkill 可以封装非常多的应用逻辑：工作如何被拆解、应该使用哪些能力、这些能力怎样协调，以及应该调用哪些工具。但归根结底，这个“应用”仍然由概率模型来解释。\u003c/p\u003e\n\u003cp\u003e因此，Skill Bundle 构成的是一种与以往应用层非常不同的新应用层。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"chatgpt-编辑附注-dmndeditorial-insightv1\" class=\"dmnd-editorial-block dmnd-editorial-start\"\u003eChatGPT 编辑附注\u003c/h2\u003e\n\u003cp class=\"dmnd-editorial-block\"\u003e这篇文章的核心不是“Skill 变多了”，而是 Skill Bundle 正逐步承担过去由应用代码与界面承载的一部分工作分解、路由、协同和业务逻辑。\u003c/p\u003e\n\u003ch3 id=\"关键要点\" class=\"dmnd-editorial-block\"\u003e关键要点\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e成熟 Bundle 按专业工作职责拆解能力，并通过路由层组合不同 Skill，而不是把任务写死成单一工作流。\u003c/li\u003e\n\u003cli\u003eSkill 与 Tool 的边界相对清晰：前者描述方法、职责和判断，后者提供执行能力；确定性代码正在承担更多验证和硬约束。\u003c/li\u003e\n\u003cli\u003eTyped artifact contract 把部分模型输出变成可验证接口，是连接概率执行与确定性软件的重要边界。\u003c/li\u003e\n\u003cli\u003eBundle 内部的大量协同仍由模型解释，自然语言要求并不等于可强制规则，跨 Skill handoff 与可复现性仍是明显限制。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"可借鉴的新思路\" class=\"dmnd-editorial-block\"\u003e可借鉴的新思路\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e设计 Agent 应用层时，可把“模型应该理解什么”与“系统必须保证什么”分开：前者交给 Skill，后者尽量交给类型、验证器、权限和确定性工具。\u003c/li\u003e\n\u003cli\u003eSkill 的长期价值可能不只在提示词复用，而在于把专业工作的拆解方式、共享标准与接口关系显式化。\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr class=\"dmnd-editorial-block dmnd-editorial-end\"\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:0604e87c828112e533bae7cd806f2d2a8255a1582540e990725100523c5e0c5d":{"html":"\u003cp\u003eOpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/public-equity-investing\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePublic Equity Investing Bundle\u003c/a\u003e会在多个专门 Skill 之间共享指令。换句话说，这些 Skill 的结构里开始出现我们熟悉的 Don’t Repeat Yourself（DRY）原则。\u003c/p\u003e\n","kind":"html","rawMarkdown":"OpenAI 的 [Public Equity Investing Bundle](https://github.com/openai/plugins/tree/main/plugins/public-equity-investing)会在多个专门 Skill 之间共享指令。换句话说，这些 Skill 的结构里开始出现我们熟悉的 Don’t Repeat Yourself（DRY）原则。","sourceFormat":"markdown"},"note:sha256:1238d15e524255316f4d9c57676f6151a26add30e69ac0c8f93e12f79839b49e":{"html":"\u003cp\u003e这些能力不是预先定义好顺序的流水线步骤，而是可以根据任务独立调用或组合的职责。调查收入下降，可能需要指标诊断、数据源验证和报告；做市场规模估算，则会使用另一组能力组合。\u003c/p\u003e\n\u003cp\u003eOpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/public-equity-investing\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePublic Equity Investing 插件\u003c/a\u003e更进一步，其中包括财报分析、估值模型、投资备忘录、投资逻辑追踪、组合风险和财务模型审计等 Skill。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这些能力不是预先定义好顺序的流水线步骤，而是可以根据任务独立调用或组合的职责。调查收入下降，可能需要指标诊断、数据源验证和报告；做市场规模估算，则会使用另一组能力组合。\n\nOpenAI 的 [Public Equity Investing 插件](https://github.com/openai/plugins/tree/main/plugins/public-equity-investing)更进一步，其中包括财报分析、估值模型、投资备忘录、投资逻辑追踪、组合风险和财务模型审计等 Skill。","sourceFormat":"markdown"},"note:sha256:1515889a20c1043b13b935fba4686cb2ae94172051f3c9a9109a196b314baa01":{"html":"\u003cp\u003e系统会要求 Agent 在渲染前调用 \u003ccode\u003evalidate_artifact\u003c/code\u003e，可视化也会引用规范的数据源。这样，在生成分析结果与渲染结果之间就形成了一个有类型的接口，validator 可以拒绝格式错误的产物。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/public-equity-investing\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePublic Equity Investing Bundle\u003c/a\u003e也采用了类似机制。它的仪表板 renderer 接收一个有类型的 \u003ccode\u003epublic_equity_investing_dashboard.v1\u003c/code\u003e payload。财务模型工作流还会生成结构化支持文件，包括来源映射、变更日志、引用和 manifest。有些流程会把字段缺失或格式错误定义为硬失败条件。\u003c/p\u003e\n","kind":"html","rawMarkdown":"系统会要求 Agent 在渲染前调用 `validate_artifact`，可视化也会引用规范的数据源。这样，在生成分析结果与渲染结果之间就形成了一个有类型的接口，validator 可以拒绝格式错误的产物。\n\n[Public Equity Investing Bundle](https://github.com/openai/plugins/tree/main/plugins/public-equity-investing)也采用了类似机制。它的仪表板 renderer 接收一个有类型的 `public_equity_investing_dashboard.v1` payload。财务模型工作流还会生成结构化支持文件，包括来源映射、变更日志、引用和 manifest。有些流程会把字段缺失或格式错误定义为硬失败条件。","sourceFormat":"markdown"},"note:sha256:1a78a7957a044bdd01e9bb9ac893b0a5de835d518db320bf689b51b26afef9b1":{"html":"\u003cp\u003e更成熟的 Bundle，是围绕\u003cstrong\u003e工作单元\u003c/strong\u003e而不是软件功能来组织的。OpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/data-analytics\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eData Analytics 插件\u003c/a\u003e把分析工作拆成 KPI 设计、指标诊断、数据质量、市场规模估算、业务分析、可视化和报告等专门能力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"更成熟的 Bundle，是围绕**工作单元**而不是软件功能来组织的。OpenAI 的 [Data Analytics 插件](https://github.com/openai/plugins/tree/main/plugins/data-analytics)把分析工作拆成 KPI 设计、指标诊断、数据质量、市场规模估算、业务分析、可视化和报告等专门能力。","sourceFormat":"markdown"},"note:sha256:1bbe0552e378030579fd8cf810d9cd7ed86a8e5dfe8326c2f6bef3c85747afd8":{"html":"\u003cp\u003e这些 Bundle 通常会把“如何工作”的指令，与真正执行操作的工具分开。OpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/data-analytics\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eData Analytics 插件\u003c/a\u003e把 Skill、App 集成和 MCP 配置组合起来。根据已经连接的系统不同，Agent 可以访问数据仓库、BI 系统、电子表格和文档，同时使用 SQL、Python 及其他执行能力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这些 Bundle 通常会把“如何工作”的指令，与真正执行操作的工具分开。OpenAI 的 [Data Analytics 插件](https://github.com/openai/plugins/tree/main/plugins/data-analytics)把 Skill、App 集成和 MCP 配置组合起来。根据已经连接的系统不同，Agent 可以访问数据仓库、BI 系统、电子表格和文档，同时使用 SQL、Python 及其他执行能力。","sourceFormat":"markdown"},"note:sha256:1ccc2dcbd0d43a4c119d13c6810ce523990e393cd7313f9c91fd802f25d4b943":{"html":"\u003cp\u003e指令天然并不具备强制力。一个 Skill 可以要求必须审阅、必须审批或必须满足证据要求，但如果 harness 或其他系统没有真正执行这些约束，模型依然可能跳过或重新解释它们。在实际场景里，后果可能小到漏掉一次格式检查，也可能严重到在外部操作前漏掉本应发生的审批。\u003c/p\u003e\n","kind":"html","rawMarkdown":"指令天然并不具备强制力。一个 Skill 可以要求必须审阅、必须审批或必须满足证据要求，但如果 harness 或其他系统没有真正执行这些约束，模型依然可能跳过或重新解释它们。在实际场景里，后果可能小到漏掉一次格式检查，也可能严重到在外部操作前漏掉本应发生的审批。","sourceFormat":"markdown"},"note:sha256:1ef33a686460539c4922968010c6b12722d5c2a56681586df004e57fd54bcacf":{"html":"\u003cp\u003e公共指令会统一规定来源选择、分析判断、交付物准备和产物格式等标准。各个 Skill 直接引用这些共享标准，而不是各自重新定义一遍。\u003c/p\u003e\n\u003cp\u003e以\u003ca href=\"https://github.com/openai/plugins/blob/main/plugins/public-equity-investing/skills/memo-builder/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e投资备忘录 Skill\u003c/a\u003e为例，它负责正式书面研究，但会把其他职责委派给专门能力。财务模型相关工作流也有自己的职责，以及围绕来源、审阅和支持记录的要求。\u003c/p\u003e\n","kind":"html","rawMarkdown":"公共指令会统一规定来源选择、分析判断、交付物准备和产物格式等标准。各个 Skill 直接引用这些共享标准，而不是各自重新定义一遍。\n\n以[投资备忘录 Skill](https://github.com/openai/plugins/blob/main/plugins/public-equity-investing/skills/memo-builder/SKILL.md)为例，它负责正式书面研究，但会把其他职责委派给专门能力。财务模型相关工作流也有自己的职责，以及围绕来源、审阅和支持记录的要求。","sourceFormat":"markdown"},"note:sha256:33412ca1b99c1d8f9f5c11bb10b9015517b5abad7230bd33ee9ba2912f5572c8":{"html":"\u003cp\u003eOpenAI 已经发布了一个 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/plugin-eval\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePlugin Eval 工具包\u003c/a\u003e，用于分析 Skill 和完整插件。它包含结构检查、token budget 分析、benchmark 配置，以及用于识别薄弱环节和回归的对比机制。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/vercel-labs/agent-browser/blob/main/evals/README.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eVercel 的 agent-browser evaluations\u003c/a\u003e则针对跨模型问题进行测试。它们会通过 Claude 和 Codex 测试 Skill 加载、选择和正确命令使用，并比较不同执行环境下的行为得分。\u003c/p\u003e\n\u003cp\u003e仅凭公开仓库，不可能知道每家厂商究竟把 Bundle 评估到了什么程度。但从已经公开的部分来看，这些 Bundle 在设计深度和整体一致性上，都很像是经过严格开发与反复优化后的结果。\u003c/p\u003e\n","kind":"html","rawMarkdown":"OpenAI 已经发布了一个 [Plugin Eval 工具包](https://github.com/openai/plugins/tree/main/plugins/plugin-eval)，用于分析 Skill 和完整插件。它包含结构检查、token budget 分析、benchmark 配置，以及用于识别薄弱环节和回归的对比机制。\n\n[Vercel 的 agent-browser evaluations](https://github.com/vercel-labs/agent-browser/blob/main/evals/README.md)则针对跨模型问题进行测试。它们会通过 Claude 和 Codex 测试 Skill 加载、选择和正确命令使用，并比较不同执行环境下的行为得分。\n\n仅凭公开仓库，不可能知道每家厂商究竟把 Bundle 评估到了什么程度。但从已经公开的部分来看，这些 Bundle 在设计深度和整体一致性上，都很像是经过严格开发与反复优化后的结果。","sourceFormat":"markdown"},"note:sha256:3d1a0632a33344e40b4351160415c509b0110fea1c645d4551861e67564d7d30":{"html":"\u003cp\u003eSkill 之间的 handoff 仍然主要是无类型的。一个 Skill 可以要求另一个能力先产出分析或完成审阅，但这种关系可能只存在于文字指令里。有类型的产物已经开始出现在某些具体位置，但还没有覆盖完整的工作模型。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Skill 之间的 handoff 仍然主要是无类型的。一个 Skill 可以要求另一个能力先产出分析或完成审阅，但这种关系可能只存在于文字指令里。有类型的产物已经开始出现在某些具体位置，但还没有覆盖完整的工作模型。","sourceFormat":"markdown"},"note:sha256:417d19e02203acf5304957bc2975a7c0d05ac03ebd218b793e68b65e386007e2":{"html":"\u003cp\u003eSkill 正在变成企业知识产权的一种开放规范。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Skill 正在变成企业知识产权的一种开放规范。","sourceFormat":"markdown"},"note:sha256:4e0d240f504fd4c689d54921be60e7cbf787cedc635ca396b319caf247c23e00":{"html":"\u003cp\u003eOpenAI 较大的 Bundle，会在专门 Skill 前面设置一个路由层。Data Analytics 插件使用一个 index Skill 作为入口，先判断请求是否属于分析领域，再选择主要 Skill，并识别需要配合的其他能力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"OpenAI 较大的 Bundle，会在专门 Skill 前面设置一个路由层。Data Analytics 插件使用一个 index Skill 作为入口，先判断请求是否属于分析领域，再选择主要 Skill，并识别需要配合的其他能力。","sourceFormat":"markdown"},"note:sha256:4e1f4af52c1fafcd22c6e8bca8d8f3f4bb80bac2ac805bc12aa27d0c4466f567":{"html":"\u003cp\u003e只要看一眼这些 Bundle，就能判断它们背后投入了大量开发工作。它绝不是“把说明写出来、校对一下，然后发布”这么简单。这些产物看起来经过了高度优化和大量评估。\u003c/p\u003e\n","kind":"html","rawMarkdown":"只要看一眼这些 Bundle，就能判断它们背后投入了大量开发工作。它绝不是“把说明写出来、校对一下，然后发布”这么简单。这些产物看起来经过了高度优化和大量评估。","sourceFormat":"markdown"},"note:sha256:535587923bf57c4863223ebeb804bfa74525d81714ff3a6661bc055ea3548043":{"html":"\u003cp\u003e一些 Skill Bundle 已经开始用\u003cstrong\u003e有类型的产物契约（typed artifact contracts）\u003c/strong\u003e替代自然语言交接。OpenAI 的 \u003ca href=\"https://github.com/openai/plugins/tree/main/plugins/data-analytics\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eData Analytics 插件\u003c/a\u003e为某些报告和仪表板定义了规范的 \u003ccode\u003eartifact.json\u003c/code\u003e 表示，其中包含结构化 manifest block、数据集、来源和访问信息。\u003c/p\u003e\n","kind":"html","rawMarkdown":"一些 Skill Bundle 已经开始用**有类型的产物契约（typed artifact contracts）**替代自然语言交接。OpenAI 的 [Data Analytics 插件](https://github.com/openai/plugins/tree/main/plugins/data-analytics)为某些报告和仪表板定义了规范的 `artifact.json` 表示，其中包含结构化 manifest block、数据集、来源和访问信息。","sourceFormat":"markdown"},"note:sha256:5a953f54fe9cf7642ddeafae0c5ac50e9eec080f03f7414cdc021d73e02d505d":{"html":"\u003cp\u003e\u003ca href=\"https://github.com/stripe/ai\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eStripe 的 Skill\u003c/a\u003e会说明如何实现支付功能，但真实的支付处理和认证操作仍然发生在 Stripe 服务里。\u003ca href=\"https://github.com/cloudflare/skills\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCloudflare 的 Skill\u003c/a\u003e会说明如何使用 Workers、Durable Objects 和相关基础设施，但执行环境依然属于 Cloudflare 后端。\u003c/p\u003e\n\u003cp\u003e有些 Bundle 还会附带用于数据处理、文档生成和验证的可执行脚本。只要可行，它们会把操作放进确定性代码，而不是试图把所有事情都写进 Skill 文本。\u003c/p\u003e\n\u003cp\u003eSkill 与工具之间的边界相当一致：Skill 描述职责、流程和决策；工具提供能力。Agent harness 把两者连在一起，而模型则参与整个执行循环。\u003c/p\u003e\n","kind":"html","rawMarkdown":"[Stripe 的 Skill](https://github.com/stripe/ai)会说明如何实现支付功能，但真实的支付处理和认证操作仍然发生在 Stripe 服务里。[Cloudflare 的 Skill](https://github.com/cloudflare/skills)会说明如何使用 Workers、Durable Objects 和相关基础设施，但执行环境依然属于 Cloudflare 后端。\n\n有些 Bundle 还会附带用于数据处理、文档生成和验证的可执行脚本。只要可行，它们会把操作放进确定性代码，而不是试图把所有事情都写进 Skill 文本。\n\nSkill 与工具之间的边界相当一致：Skill 描述职责、流程和决策；工具提供能力。Agent harness 把两者连在一起，而模型则参与整个执行循环。","sourceFormat":"markdown"},"note:sha256:791713b7106e399c42b2dd8cd5706b25157da044a9e67ee64573f66c888d0025":{"html":"\u003cp\u003e这并不意味着企业会把让产品有价值的一切都公开出来。Stripe 可以发布非常详细的 Skill，同时继续把支付基础设施保留为专有系统；CRM 可以公开它的销售方法，而把数据、权限和交易系统继续放在工具后面。\u003c/p\u003e\n\u003cp\u003e但某些东西确实已经改变。过去，企业会把大量这类逻辑编码在专有应用代码和界面中。如果新的应用架构逐渐变成 Skill + Tool，那么越来越多业务逻辑会变得可被模型读取，也因此更容易被公众读取。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这并不意味着企业会把让产品有价值的一切都公开出来。Stripe 可以发布非常详细的 Skill，同时继续把支付基础设施保留为专有系统；CRM 可以公开它的销售方法，而把数据、权限和交易系统继续放在工具后面。\n\n但某些东西确实已经改变。过去，企业会把大量这类逻辑编码在专有应用代码和界面中。如果新的应用架构逐渐变成 Skill + Tool，那么越来越多业务逻辑会变得可被模型读取，也因此更容易被公众读取。","sourceFormat":"markdown"},"note:sha256:84e720c9b1dc55c552d5858e9a9917db9205b331c8157b55b55b3e3a02c50801":{"html":"\u003cp\u003e即便使用同一个 Agent 和同一组 Skill，也无法保证第二次一定按照完全相同的路径执行。用户消息或周围上下文只要有一点变化，模型就可能选择另一条路径。Evals 可以覆盖重要场景和失败模式，但不可能测试用户输入与上下文的所有组合。\u003c/p\u003e\n","kind":"html","rawMarkdown":"即便使用同一个 Agent 和同一组 Skill，也无法保证第二次一定按照完全相同的路径执行。用户消息或周围上下文只要有一点变化，模型就可能选择另一条路径。Evals 可以覆盖重要场景和失败模式，但不可能测试用户输入与上下文的所有组合。","sourceFormat":"markdown"},"note:sha256:8a28ac9de8e56a7b840f3504d248fa0ce440a5af63433ba97024a07fcd6fb249":{"html":"\u003cp\u003e尽管所有工作仍发生在 Agent loop 内部，但这给了 Agent 一种额外的自检方式：某些输出必须满足契约，确定性软件才会继续消费它们。实质上，这把非确定性软件与确定性软件之间的接口正式化了。\u003c/p\u003e\n\u003cp\u003e目前，有类型的边界主要出现在模型生成结果与确定性软件相接的地方。Bundle 内部的大部分协调仍然依赖自然语言。\u003c/p\u003e\n","kind":"html","rawMarkdown":"尽管所有工作仍发生在 Agent loop 内部，但这给了 Agent 一种额外的自检方式：某些输出必须满足契约，确定性软件才会继续消费它们。实质上，这把非确定性软件与确定性软件之间的接口正式化了。\n\n目前，有类型的边界主要出现在模型生成结果与确定性软件相接的地方。Bundle 内部的大部分协调仍然依赖自然语言。","sourceFormat":"markdown"},"note:sha256:8e6478312cc09343e837fa876a4845a9f0be4db55fd8682713d7c6ada6c10594":{"html":"\u003cp\u003e值得注意的是，这些路由大多——甚至可能几乎全部——仍然需要模型来解释。即便存在结构化路由信息，Agent 通常仍要自己决定具体应该怎样应用。\u003c/p\u003e\n","kind":"html","rawMarkdown":"值得注意的是，这些路由大多——甚至可能几乎全部——仍然需要模型来解释。即便存在结构化路由信息，Agent 通常仍要自己决定具体应该怎样应用。","sourceFormat":"markdown"},"note:sha256:91141911ef34149865ee5fc796ed357a636874ae7f9740a36f397ee400406260":{"html":"\u003cp\u003e很明显，大量工程与产品投入正在流向这些复杂的 Skill Bundle。每个新 Bundle 发布时都伴随着相当大的市场声量，而 Bundle 本身也越来越像产品，而不只是指令集合。\u003c/p\u003e\n\u003cp\u003e企业越来越倾向于把 Skill Bundle 定位为面向 Agent 的应用层。这种说法并非错误，但我们必须理解它们是什么，以及不是什么。\u003c/p\u003e\n\u003cp\u003eSkill 可以封装非常多的应用逻辑：工作如何被拆解、应该使用哪些能力、这些能力怎样协调，以及应该调用哪些工具。但归根结底，这个“应用”仍然由概率模型来解释。\u003c/p\u003e\n\u003cp\u003e因此，Skill Bundle 构成的是一种与以往应用层非常不同的新应用层。\u003c/p\u003e\n","kind":"html","rawMarkdown":"很明显，大量工程与产品投入正在流向这些复杂的 Skill Bundle。每个新 Bundle 发布时都伴随着相当大的市场声量，而 Bundle 本身也越来越像产品，而不只是指令集合。\n\n企业越来越倾向于把 Skill Bundle 定位为面向 Agent 的应用层。这种说法并非错误，但我们必须理解它们是什么，以及不是什么。\n\nSkill 可以封装非常多的应用逻辑：工作如何被拆解、应该使用哪些能力、这些能力怎样协调，以及应该调用哪些工具。但归根结底，这个“应用”仍然由概率模型来解释。\n\n因此，Skill Bundle 构成的是一种与以往应用层非常不同的新应用层。","sourceFormat":"markdown"},"note:sha256:9893015ce6c11699e8bc7d7b75778383303a19420469d01e102c5cbe3e71364e":{"html":"\u003cp\u003e从某种意义上说，Skill 会包含领域或公司特有的“工作应该怎样完成”的知识：如何拆解任务、公司如何理解决策规则、偏好的方法和策略，以及那些让产品真正有用的细小惯例。\u003c/p\u003e\n\u003cp\u003eOpenAI 的投资 Bundle 公开了相当多这类内容：它不仅描述有哪些能力，还描述投资研究应该怎样真正开展。\u003c/p\u003e\n","kind":"html","rawMarkdown":"从某种意义上说，Skill 会包含领域或公司特有的“工作应该怎样完成”的知识：如何拆解任务、公司如何理解决策规则、偏好的方法和策略，以及那些让产品真正有用的细小惯例。\n\nOpenAI 的投资 Bundle 公开了相当多这类内容：它不仅描述有哪些能力，还描述投资研究应该怎样真正开展。","sourceFormat":"markdown"},"note:sha256:9a52523ffbad0dfd07242af6184f66e96f0d4bf403009e14e33a8107b012097b":{"html":"\u003cp\u003e归根结底，无论这些 Skill Bundle 的设计多么严谨，真正解释并执行它们的仍然是一个概率模型。意外行为依然可能发生，用户指令或周围上下文也仍可能让模型产生偏移。\u003c/p\u003e\n","kind":"html","rawMarkdown":"归根结底，无论这些 Skill Bundle 的设计多么严谨，真正解释并执行它们的仍然是一个概率模型。意外行为依然可能发生，用户指令或周围上下文也仍可能让模型产生偏移。","sourceFormat":"markdown"},"note:sha256:a34ff7eda94f76cf520e5930e2710c96adbb9db8e37f2a171655f3a58a47f63b":{"html":"\u003cp\u003e这篇文章的核心不是“Skill 变多了”，而是 Skill Bundle 正逐步承担过去由应用代码与界面承载的一部分工作分解、路由、协同和业务逻辑。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这篇文章的核心不是“Skill 变多了”，而是 Skill Bundle 正逐步承担过去由应用代码与界面承载的一部分工作分解、路由、协同和业务逻辑。","sourceFormat":"markdown"},"note:sha256:a5de9dc8bf566bccfffa11ccdaddf554e732ad3e5b6b51c667a09468005339a0":{"html":"\u003cp\u003e这种拆解方式对应的是投资专业人士能够识别的人类工作。分析师可能会更新财务模型、评估新财报会如何影响投资逻辑，再为投资组合经理准备一份备忘录。Bundle 会分别描述这些职责，包括什么情况下一个 Skill 应该引入另一个 Skill。\u003c/p\u003e\n\u003cp\u003e这与一个仓库里塞进一百个彼此无关的 Skill 并不相同。这些 Bundle 正在把一类专业工作建模为一组可复用能力，同时又不预先规定每一次执行必须遵循的完整步骤。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这种拆解方式对应的是投资专业人士能够识别的人类工作。分析师可能会更新财务模型、评估新财报会如何影响投资逻辑，再为投资组合经理准备一份备忘录。Bundle 会分别描述这些职责，包括什么情况下一个 Skill 应该引入另一个 Skill。\n\n这与一个仓库里塞进一百个彼此无关的 Skill 并不相同。这些 Bundle 正在把一类专业工作建模为一组可复用能力，同时又不预先规定每一次执行必须遵循的完整步骤。","sourceFormat":"markdown"},"note:sha256:a7757a071686184ffc2d0c022ef82b484f2889e7880b220146f068d33a922005":{"html":"\u003cp\u003eBundle 的设计会规定哪个 Skill 对结果负责、它需要哪些信息，以及应该适用哪些标准。有些指令还会明确：在工作被视为完成之前，必须先调用另一个能力。因此，Skill 之间的许多依赖关系，目前仍是用文字或简单的 Markdown 链接表达的。\u003c/p\u003e\n\u003cp\u003e即便如此，这些关系已经开始像应用组件之间的接口，只不过大多数接口仍然是自然语言。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Bundle 的设计会规定哪个 Skill 对结果负责、它需要哪些信息，以及应该适用哪些标准。有些指令还会明确：在工作被视为完成之前，必须先调用另一个能力。因此，Skill 之间的许多依赖关系，目前仍是用文字或简单的 Markdown 链接表达的。\n\n即便如此，这些关系已经开始像应用组件之间的接口，只不过大多数接口仍然是自然语言。","sourceFormat":"markdown"},"note:sha256:b19b72fb53ee83e3948e6c257a4d6eecb7b79ccf3ccbcf1bff6a48a72d685f88":{"html":"\u003cblockquote\u003e\n\u003cp\u003e@JoshARosen · \u003ca href=\"https://x.com/JoshARosen/article/2108276264763048104\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-10-08\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e企业开始发布的这些大型 Skill Bundle，到底是什么？OpenAI 的 \u003ca href=\"https://github.com/openai/plugins/blob/main/plugins/data-analytics/README.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eData Analytics 插件\u003c/a\u003e包含 16 个专门 Skill，同时还有规模更大的 \u003ca href=\"https://github.com/openai/plugins/blob/main/plugins/public-equity-investing/README.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePublic Equity Investing\u003c/a\u003e Skill 集合。\u003ca href=\"https://github.com/stripe/ai\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eStripe\u003c/a\u003e、\u003ca href=\"https://github.com/cloudflare/skills\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCloudflare\u003c/a\u003e、\u003ca href=\"https://github.com/vercel-labs/agent-skills\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eVercel\u003c/a\u003e 和 \u003ca href=\"https://github.com/huggingface/skills\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHugging Face\u003c/a\u003e 也都在做不同版本的同一件事。\u003c/p\u003e\n\u003cp\u003e微软也\u003ca href=\"https://www.microsoft.com/en-us/copilot/blog/2026/10/08/bringing-crm-into-the-flow-of-work-and-agents-into-business-process-for-sales-and-service-teams/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e刚刚宣布了 30 个预构建 CRM Skill\u003c/a\u003e，与 Dynamics 365 现有的数据、工具和业务系统配合使用。这其实是在相当明确地暗示：企业软件可能正在走向一个新的方向。\u003c/p\u003e\n\u003cp\u003e但这些 Bundle 里面究竟有什么？企业只是在打包一组指令，还是正在构建某种接近应用程序的东西？这些 Skill 如何协同、访问工具、执行要求，以及在彼此之间传递结果？\u003c/p\u003e\n\u003cp\u003e越来越清晰的一组架构模式正在浮现：企业开始用 Skill 拆解工作、在专门能力之间路由任务，并把这些能力连接到工具。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e @JoshARosen · [X 文章](https://x.com/JoshARosen/article/2108276264763048104) · 2026-10-08\n\n企业开始发布的这些大型 Skill Bundle，到底是什么？OpenAI 的 [Data Analytics 插件](https://github.com/openai/plugins/blob/main/plugins/data-analytics/README.md)包含 16 个专门 Skill，同时还有规模更大的 [Public Equity Investing](https://github.com/openai/plugins/blob/main/plugins/public-equity-investing/README.md) Skill 集合。[Stripe](https://github.com/stripe/ai)、[Cloudflare](https://github.com/cloudflare/skills)、[Vercel](https://github.com/vercel-labs/agent-skills) 和 [Hugging Face](https://github.com/huggingface/skills) 也都在做不同版本的同一件事。\n\n微软也[刚刚宣布了 30 个预构建 CRM Skill](https://www.microsoft.com/en-us/copilot/blog/2026/10/08/bringing-crm-into-the-flow-of-work-and-agents-into-business-process-for-sales-and-service-teams/)，与 Dynamics 365 现有的数据、工具和业务系统配合使用。这其实是在相当明确地暗示：企业软件可能正在走向一个新的方向。\n\n但这些 Bundle 里面究竟有什么？企业只是在打包一组指令，还是正在构建某种接近应用程序的东西？这些 Skill 如何协同、访问工具、执行要求，以及在彼此之间传递结果？\n\n越来越清晰的一组架构模式正在浮现：企业开始用 Skill 拆解工作、在专门能力之间路由任务，并把这些能力连接到工具。","sourceFormat":"markdown"},"note:sha256:ddc5af1b8bd4360e85960d76a810fc02135cd01eb1cf26c84f4486a09110f0d5":{"html":"\u003cp\u003e路由指令会区分真正的分析工作与普通文档格式处理，也会考虑当前可用的执行环境，并规定如何调用额外 Skill。有些分析工作流默认应该包含报告生成，除非用户明确选择不需要。\u003c/p\u003e\n\u003cp\u003ePublic Equity Investing Bundle 采用了类似模式，但会进一步区分面向用户的工作流与内部支持能力。共享的路由 Playbook 用来挑选专家 Skill，而支持型 Skill 则负责来源解析、数据准备、格式处理和行业上下文。\u003c/p\u003e\n\u003cp\u003e它看起来很像一种服务架构：有入口、有专门的内部能力，也有分配职责的策略。同时，它还实现了渐进式披露，因为 Agent 不必一次把整个 Bundle 的所有指令都放进上下文。\u003c/p\u003e\n","kind":"html","rawMarkdown":"路由指令会区分真正的分析工作与普通文档格式处理，也会考虑当前可用的执行环境，并规定如何调用额外 Skill。有些分析工作流默认应该包含报告生成，除非用户明确选择不需要。\n\nPublic Equity Investing Bundle 采用了类似模式，但会进一步区分面向用户的工作流与内部支持能力。共享的路由 Playbook 用来挑选专家 Skill，而支持型 Skill 则负责来源解析、数据准备、格式处理和行业上下文。\n\n它看起来很像一种服务架构：有入口、有专门的内部能力，也有分配职责的策略。同时，它还实现了渐进式披露，因为 Agent 不必一次把整个 Bundle 的所有指令都放进上下文。","sourceFormat":"markdown"},"note:sha256:f2189f2a9e057c05b7c6a82a8f49a4c2fb53a75d26cb4d9d8b896bc5898d2bec":{"html":"\u003cp\u003e这些 Skill 里的 Markdown 文件，是一套软件开发过程的最终产物。除了要把一个领域拆解成不同 Skill，还必须确保这些组成部分在 Agent 真正调用时能够协调工作。\u003c/p\u003e\n\u003cp\u003e测试在 Skill package 的开发中占据很大比重，因为执行引擎本身具有概率性。模型可能犯各种错误：可能选错 Skill，也可能产出结构上正确、但并不满足底层业务要求的结果。同一套指令在不同模型、harness 和模型版本上也可能表现不同。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这些 Skill 里的 Markdown 文件，是一套软件开发过程的最终产物。除了要把一个领域拆解成不同 Skill，还必须确保这些组成部分在 Agent 真正调用时能够协调工作。\n\n测试在 Skill package 的开发中占据很大比重，因为执行引擎本身具有概率性。模型可能犯各种错误：可能选错 Skill，也可能产出结构上正确、但并不满足底层业务要求的结果。同一套指令在不同模型、harness 和模型版本上也可能表现不同。","sourceFormat":"markdown"}},"sourceRevision":"sha256:a7c7cd70c31ad7092ce1c9dadd644795f4c86f09b918a66c2903d9e64fc18d0f"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,wri
