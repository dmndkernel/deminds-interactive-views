</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-05T02:19:17.872Z","language":"zh-CN","name":"DeMinds","version":"1.0.32"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"2026 我的 Obsidian 完整分享","outlineVersion":1},"sourceRevision":"sha256:92be481579764ae55d823208d259f73c1d82ddecd41196ce34e3f9978784117e","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"2026 我的 Obsidian 完整分享.md","sourceUrl":"https://x.com/Jackywine/status/2095750518941659567","title":"2026 我的 Obsidian 完整分享"},"files":[{"byteLength":45035,"content":"# 2026 我的 Obsidian 完整分享\n\n![Image](https://pbs.twimg.com/media/HRWZv9dbkAA_SgS?format=jpg\u0026name=medium)\n\n\u003e @Jackywine · [X Article](https://x.com/Jackywine/article/2095750518941659567) · 2026-09-04\n\n第一次知道 Obsidian，是 2020 年，知乎上有人发了一张紫色图标的截图\n\n![Image](https://pbs.twimg.com/media/HRWXeE-awAIsbyO?format=jpg\u0026name=900x900)\n\n我当时的第一反应是：这图标长得像块石头\n\n后来才知道，Obsidian 就是黑曜石的意思，火山玻璃，又硬又锋利，切开东西干净利落，和我的世界里那个硬硬的黑色石头一样\n\n那个比喻放到今天看，还挺准的\n\n我这个人有个毛病，喜欢一个工具，就会疯狂收集关于它的一切\n\nObsidian 是我收集得最凶的一个\n\n光是我这个 YouMind BOARD 里，跟 Obsidian 有关的内容，我数了数，有十几篇\n\n入门教程、深度研究、AI 接入实操、产品哲学、甚至我还给它做了表情包\n\n今天这篇，就是我把这些内容全部翻了一遍之后，想跟你说的话\n\n万字警告，建议先收藏\n\n## 从「工具崇拜」到「重器轻用」\n\n### 先说清楚我跟 Obsidian 的关系，你再决定要不要信我\n\n我是 Obsidian 的重度用户，从 2020 年用到现在，六年了\n\n我为了支持它，成为了 Obsidian VIP 支持者\n\n我写过 Obsidian 的踩坑经验，整理过 Obsidian 飞书知识库汇总，全公开，已经有超过五位数的网友学过了\n\n链接：[https://my.feishu.cn/wiki/PPW4w6eEYi01dfkUgc3cGYsVnkh](https://my.feishu.cn/wiki/PPW4w6eEYi01dfkUgc3cGYsVnkh)\n\n![Image](https://pbs.twimg.com/media/HRWXe6NaEAA2XM9?format=jpg\u0026name=900x900)\n\n我还把我现在自己在用的 Obsidian 库公开发布，包含我常用的插件、精选主题、Agent 系统提示词案例、记忆存档案例、还有让图谱更美观的自定义 CSS\n\n链接：[https://my.feishu.cn/wiki/GccZwP13MikuGJk07mTcOXAfnAg](https://my.feishu.cn/wiki/GccZwP13MikuGJk07mTcOXAfnAg)\n\n![Image](https://pbs.twimg.com/media/HRWXfs7bAAAnkum?format=jpg\u0026name=900x900)\n\n所以你可以带着一半怀疑看这篇文章\n\n夸的地方，我尽量给出处\n\n骂的地方，我尽量给证据\n\n### 先说痛点，再说工具\n\n你有没有过这种体验：明明记得自己存过一篇很好的文章，真要用的时候翻遍整个笔记库，就是找不到\n\n公众号、知乎、网页剪藏、PDF、视频转写、AI 对话截图，收藏夹越来越满\n\n三个月后想不起标题，记不得关键词，搜也搜不出来\n\n文件夹越建越乱，笔记记了却用不起来\n\n这个问题不是我一个人有\n\n我收集的那些教程里，几乎每一篇的开头都在讲同一件事\n\n收藏夹里躺着几百篇文章，笔记里堆着几十个半成品项目\n\n传统笔记最大的问题就在这：只进不出\n\n你存的不是知识库，是一个越来越大的仓库\n\n东西都在，但没人整理，没人索引，没人告诉你哪些互相关联、哪些已经过时\n\n我特别记得《2025 年 flomo+飞书 如何搭建个人极简知识管理系统？》那篇文章里的一句话：\n\n\u003e 终身学习者、自媒体、工程师、设计师等职业已经在记录属于自己的笔记，但是还没有体系化和系统化，需要一些案例来刺激自己搭建系统的想法\n\n链接：[https://my.feishu.cn/wiki/P7BSwiqqAi8tSNkbfPMcz6IFnic](https://my.feishu.cn/wiki/P7BSwiqqAi8tSNkbfPMcz6IFnic)\n\n### 47 个插件和一个删了十遍的库\n\n![Image](https://pbs.twimg.com/media/HRWXglbbQAAis9c?format=jpg\u0026name=900x900)\n\n2020 年，我遇见了 Obsidian\n\n我的第一反应是：哇，本地存储！双链笔记！知识图谱！\n\n我的第二反应是：一个笔记软件怎么这么科幻？\n\n然后我做了经典操作——建库\n\n然后是经典操作 2.0——疯狂装插件\n\n47 个，你们知道 47 个插件同时运行是什么概念吗？\n\n就是你打开 Obsidian 的时间，可以等到外卖送到\n\n接下来的几年，我陷入了一个死循环：发现新插件 → 兴奋 → 疯狂配置 → 一周后发现不好用 → 看到别人的库更好看 → 删库重建 → 回到第一步\n\n这个循环，我走了不下 10 遍\n\n有一次我甚至在凌晨 3 点，一边看 B 站 UP 主的教程，一边删掉了自己写了半年的笔记库\n\n第二天醒来看着空空的文件夹，我就说了一句话：我是谁？我在哪？我的笔记呢？\n\n5000 条笔记，堆在那里，成了赛博坦星球\n\n![Image](https://pbs.twimg.com/media/HRWXhWibAAALd3v?format=jpg\u0026name=900x900)\n\n上面就是我之前的库\n\n好看吗？好看\n\n有用吗？没有\n\n我在 flomo 里记过一句话：[「你花在 Obsidian 上 99% 的时间，都是浪费」](https://v.flomoapp.com/mine/?memo_id=MjE3NDUzNjY0)\n\n一个小时倒腾皮肤，两个小时倒腾插件，社区里看各种最佳实践，笔记库里写的东西嘛，寥寥无几\n\n这就是典型的「工具崇拜」——你以为自己在学习，其实只是在逃避\n\n（我知道这段话听起来像在骂人，但最该挨骂的其实是我自己）\n\n### 我收藏夹里的入门教程，比你们想象的还多\n\n先说结论：Obsidian 的**入门教程**，我收藏了不下六篇\n\n注意是“入门”，教你怎么下载安装建库以及插件同步的\n\n每一篇我都看完了，每一篇的侧重点都不一样\n\n《2026 年最强Obsidian保姆级教程，10分钟打造你的第二大脑》是我见过最克制的一篇，[原文在这里](https://x.com/ai_suxiaole/article/2080133894222057612)\n\n它全程只讲一件事：创建一个库、三种 Markdown 写法、两个快捷键和双向链接\n\nYAML、高级查询、主题和社区插件，它直接让你别研究\n\n它把 Obsidian 讲得很朴素：一个更适合长期保存、搜索和连接文字资料的文件夹\n\n每篇笔记都是你电脑里的真实文件，将来不用 Obsidian 了，还能用别的文本编辑器打开\n\n它没有把你的笔记锁在某种只能由它读取的特殊格式里\n\n文末有个 3 分钟练习，新建一篇笔记、写一个标题、写一个列表、建一个双链、看一次反向链接\n\n能做到，你的库、Markdown 和双向链接就都在正常工作\n\n《Obsidian 小白完整入门教程(本地知识库)》则是另一条路线，[原文在这里](https://x.com/ai_xiaomu/article/2057365060977390037)\n\n它上来就问你一个问题：AI 时代，人人都需要一个自己的知识库，为什么？\n\n因为 AI 本身没有立场、没有经历、没有审美\n\n直接问它一个问题，回答正确但没有灵魂\n\n差别在哪？在于你能不能把「你自己的素材、方法论、经历、判断」喂给它\n\n同样的模型，喂进去你的东西，输出的就是带你印记的东西\n\n这个观点我特别认\n\n它还讲了 MOC、PARA、Zettelkasten 三种组织方式怎么选\n\n答案是：先写半个月，看哪种需求自然冒出来，再有意识地用对应方法\n\n三种可以混着用\n\n还有《新手小白能看懂的 Obsidian 零基础大白话教程》，[原文在这里](https://x.com/cheery9998/article/2023662846048170464)\n\n它把 Obsidian 讲成「永远用不坏、极其安全、还能随意改装的电子笔记本」\n\n排版像说话一样简单，功能像搭乐高一样自由，对非程序员绝对友好\n\n库就是抽屉，界面就是书桌，插件就是家具城\n\n这套比喻，我妈都能听懂\n\n还有《Obsidian 别只装完就吃灰》，[原文在这里](https://x.com/AdrianPunk115/article/2087046395949973788)\n\n它直接从空仓库开始，创建仓库、填写名称、选择位置、建目录、写首页、做双向链接、开日记、看关系图谱，最后再把它交给 Codex 处理\n\n里面有一句话我记到现在：\n\n\u003e 仓库不是一种神秘数据库，它就是一个普通文件夹\n\n它把知识库的最小流程拆成了五步：随手收集 → 放进收件箱 → 整理成笔记 → 建立链接 → 从首页再次找到 → 输出文章或方案\n\n先把这条路跑通，插件、自动化和复杂方法论，等你真的遇到问题再加\n\n哦对了，还有一篇《Obsidian 零基础教程》，[原文在这里](https://x.com/bozhou_ai/article/2011738838767423983)\n\n它教的是用 GitHub 做云同步，还贴心地教了怎么加 .gitignore 防止把 workspace 文件传上去\n\n配图是高清的，步骤是截图级的，属于收藏了就能照着做的那种\n\n（我收藏教程有个习惯：看配图多不多，图多的一般靠谱）\n\n### 不要在到处找教程了，精华都在论坛里\n\n![Image](https://pbs.twimg.com/media/HRWXiHDb0AEJb00?format=jpg\u0026name=900x900)\n\n还有一篇推文我收藏了，标题就很有意思：《不要在到处找 Obsidian 的入门教程了，精华都在论坛里面》\n\n[地址在这里](https://forum-zh.obsidian.md/t/topic/3222)\n\n这句话是真的\n\n![Image](https://pbs.twimg.com/media/HRWXi7EbgAAQLNt?format=jpg\u0026name=900x900)\n\n如果你还想看一些更专业的内容，可以去 [https://community.obsidian.md/](https://community.obsidian.md/)\n\n这是官方的 Community，里面的插件、新闻更是全面\n\n## Obsidian 的底层价值：本地、链接与生态\n\n### 深度研究这份文档，把我对 Obsidian 的认知补齐了\n\n我有一份《Obsidian 深度研究》，信息量非常大\n\n它把 Obsidian 的家底都翻出来了\n\nObsidian 是 Shida Li 和 Erica Xu 在 2020 年新冠疫情隔离期间创建的\n\n两个人都是滑铁卢大学毕业的，之前一起做过一款叫 Dynalist 的大纲工具\n\nErica 在访谈里说过，Obsidian 的基本想法在她脑子里存了两年，她一度觉得自己是怪人，居然想要一个这样的个人知识库\n\n结果没想到，好多人跟她说，他们也想做同样的事，想了几年甚至几十年\n\n2020 年 3 月 30 日，Obsidian 发布公测版，恰好是 WHO 宣布 COVID-19 为全球大流行的同一周\n\n2023 年，以 Minimal 主题闻名的设计师 Steph Ango（网名 kepano）加入团队担任 CEO\n\n![Image](https://pbs.twimg.com/media/HRWXjrCa4AAriEj?format=jpg\u0026name=900x900)\n\n团队结构是：Shida Li 当 CTO，Erica Xu 当 COO，kepano 当 CEO，加上少数几名工程师，总共约 7 人，加一只小猫（是的，你没看错）\n\n![Image](https://pbs.twimg.com/media/HRWXkhiasAAZ0Bc?format=jpg\u0026name=900x900)\n\n就这几个人，做出了 3.5 亿美元估值的产品，超过 150 万月活用户\n\n而且完全依靠自己，从未接受外部融资\n\n这份文档里有一句官网标语，我看了很久：\n\n\u003e Your knowledge should last\n\n你的知识应当持久\n\n你的笔记以纯文本 Markdown 文件存储在本地设备上，即使 Obsidian 公司明天消失，你的数据依然完整可读\n\n你可以用 VS Code、Vim、任何文本编辑器打开它们，可以用 grep、sed 处理它们，可以零转换成本迁移到任何兼容 Markdown 的工具\n\n这种「数据持久性」承诺，在 SaaS 工具随时可能关闭或改变定价的时代，有着致命的吸引力\n\n而且，现在的 AI Agent 的能力，可以让 Agent 有操作工具的能力，Agent 访问这些纯文本 Markdown 文件，也变得很容易\n\n它的商业模式也很有意思：核心应用完全免费，Sync 同步服务 $4/月，Publish 发布服务 $8/月，Catalyst 一次性捐赠 $25 起\n\n只对增值服务收费，用极小的团队维持极高的利润率\n\n### 链接优先于分类，这句话值得单独讲\n\n![Image](https://pbs.twimg.com/media/HRWXlY6bQAADB6h?format=jpg\u0026name=900x900)\n\n深度研究文档里有一个核心观点：链接优先于分类\n\n传统笔记工具鼓励你把笔记放进文件夹，这是一种树状结构，每条笔记只能属于一个位置\n\nObsidian 的核心主张是：用双链把笔记连接起来，让知识自然形成网状结构\n\n每一个链接都会自动创建一条双向边，知识图谱从笔记本身涌现出来\n\n这种方式更接近人类大脑的联想机制\n\n说白了，文件夹只能告诉你「这篇笔记放在哪里」，链接还能告诉你「这篇笔记和什么有关」\n\n这就是 Obsidian 和 Word 最本质的区别\n\nWord 文档通常是彼此分开的，即使两份文档讨论的是同一件事，它们之间也没有明显联系\n\nObsidian 里，你可以用 [[笔记名]]把两篇笔记直接连起来\n\n以后打开其中一篇，不仅能跳到另一篇，还能看到有哪些旧笔记提到过它\n\n笔记越多，这张网越值钱\n\n### 它的插件生态，是一座家具城\n\n截至 2026 年 3 月，Obsidian 社区插件数量已超过 2500 个\n\n每周仍有 6-14 个新插件发布，80-100 个插件更新\n\nReddit 的 r/ObsidianMD 有超过 25.6 万订阅者\n\n代表性插件包括 Dataview（把 Vault 当数据库查询）、Templater（高级模板引擎）、Excalidraw（手绘风格图表）、Calendar（日历视图）、Kanban（Markdown 驱动的看板）\n\n还有一大堆 AI 集成插件\n\n2026 年 5 月，官方还推出了新的自动化审核系统，进一步提升插件生态的安全性和质量\n\n这标志着生态从「野蛮生长」走向「可持续治理」\n\n但插件多，也是陷阱\n\n过度定制的陷阱是真实存在的：2500+ 插件意味着无尽的配置可能性，许多用户陷入「折腾工具」而非「使用工具」的困境\n\n社区里有一句著名的自嘲：\n\n\u003e I spent 3 hours configuring my productivity system instead of being productive\n\n翻译成人话：花了三个小时调插件，一个字没写\n\n这句话，我懂，我真的太懂了\n\n### 竞品那块，它点名了 Notion、Logseq 和 Roam\n\nNotion 适合团队协作和项目管理；Obsidian 适合个人深度思考和长期知识积累\n\nNotion 的数据存在云端专有格式，Obsidian 是本地 Markdown 文件\n\nNotion 协作强，Obsidian 基本不支持协作\n\nNotion 学习曲线平缓，Obsidian 较陡\n\n数据所有权：Notion 的属于 Notion 服务器，Obsidian 的完全属于用户\n\nAI 功能：Notion 是原生 AI（$10/用户/月附加），Obsidian 靠插件集成\n\nLogseq 是 Obsidian 最接近的竞品，同样本地优先、同样基于 Markdown、同样免费\n\n核心区别：Logseq 是块级大纲工具，每个 bullet point 是独立可引用的单元；Obsidian 是文档级工具\n\nLogseq 更适合快速碎片化捕获和日记驱动的工作流；Obsidian 更适合长文写作和结构化文档\n\nLogseq 开源，Obsidian 专有但免费\n\nRoam Research 是 2019-2020 年「双向链接」热潮的引爆者\n\n但 $15/月的定价和云端专有存储让许多用户转向了 Obsidian\n\nRoam 的块级引用粒度更细，但 Obsidian 的免费策略、本地存储和插件生态在用户规模上完胜\n\n这三段对比，我建议每一个想换笔记工具的人都读一遍\n\n（深度研究这份文档的原文出处我一并贴出来：[PCMag 评测](https://www.pcmag.com/reviews/obsidian)、[Obsidian 官网](https://obsidian.md/)）\n\n## LLM-Wiki：把知识库当作可编译系统\n\n### Karpathy 的那条推文，让知识库变成了代码仓库 LLM-Wiki 来了\n\n![Image](https://pbs.twimg.com/media/HRWXmJrbUAAxrDj?format=jpg\u0026name=900x900)\n\nKarpathy 发了一条推文，讲他怎么用 LLM 构建和管理个人知识库\n\n他说，他现在大部分的 token 消耗，已经不是在写代码了，而是在「操控知识」\n\n我反复读了几遍\n\n他做的事和我这几个月在 Obsidian 里瞎折腾的东西，结构上撞了\n\n但他用了一个词来概括，我之前一直没找到：编译（Compile）\n\n把原始资料「编译」成结构化知识\n\nObsidian Vault 是代码仓库，LLM 是编译器\n\n这个类比一出来，好多之前说不清的感觉突然有名字了\n\n如果你写过代码，Karpathy 这套东西你会秒懂\n\n软件工程 → 知识库工程\n\nsrc/ → raw/（原始资料）\n\nbuild/ → wiki/（知识条目）\n\nlogs/ → outputs/（问答归档）\n\n编译器 → LLM\n\nIDE → Obsidian\n\nLint / CI → 健康检查\n\n增量编译 → 只处理新增/变更的 raw\n\n核心就三件事\n\n分层：原始资料、编译产物、运行时输出，三层分开，你不会把 .class 文件和 .java 文件混在一起，笔记也一样\n\n增量：不用每次全量重建，每天新进来几篇文章，增量编译就好\n\n可追溯：每个知识条目能追到原始来源，每个摘要保留原文引用，出了问题能查到根源\n\n不是「我好像在哪里看过这个说法」，是AI 告诉你，清清楚楚：「来源在 raw/articles/2026-03/ 那篇里，第三段」\n\n### 他把自己的 Vault 做成了什么样\n\n我把 Karpathy 的方法论落到了自己的 Vault 里\n\n目录结构长这样\n\nVault/ 下面分 raw/、wiki/、outputs/，还有 x/、公众号/、小红书/ 这些平台成品目录\n\nraw/ 放原始资料，不改\n\nwiki/ 放编译产物，LLM 维护，里面有 indexes、concepts、summaries\n\noutputs/ 放运行时输出\n\n成品是给读者看的，wiki 是给自己看的，这两个不能混\n\n摄取有三个入口：Web Clipper 管网页文章，模板里强制写入 source_url、author、published、tags；Podwise 管播客，自动转录加 AI 摘要；手动剪藏管 X 推文和零散内容\n\n这步很重要：没有元数据的剪藏跟没剪一样\n\n编译这步最关键\n\n攒了 5 到 10 篇 raw 之后，就可以做第一次「编译」了\n\n让 Claude 读一下 raw/articles/ 里最近新增的文章，为每篇生成摘要，提取概念，更新索引\n\n具体干三件事：逐篇摘要、概念抽取、索引更新\n\n质量怎么保证？靠 CLAUDE.md，里面写编译规范：摘要的结构模板、概念条目该有哪些字段、命名规则\n\n第一次编译可能要花半小时到一小时，但跑通一次之后，后面增量编译很快\n\n### AI Output 落文件，这是我见过最妙的设计\n\nKarpathy 方法论里有一个设计我觉得特别妙：AI Output 落文件\n\n以前我用 AI 的方式是：问一个问题，得到答案，关掉\n\n下次有类似问题再问一遍，答案全在聊天记录里，等于没有\n\n现在改了：每次对知识库做复杂提问，结果以 Markdown 文件存到 AI outputs/\n\n带问题、带时间、带来源、带结论、带不确定性\n\n三个月下来积累了几十份这样的文件，它们本身就是知识条目，因为带推理过程和原始来源\n\n你每跟 AI 聊一次，知识库就增加一层\n\n在此基础上，我强制让 AI 只能输出到 AI outputs 中，这样 AI 的生成和我自己的想法不会搞混\n\n这步是大部分人不会想到的\n\n![Image](https://pbs.twimg.com/media/HRWXnw_bEAAWLrt?format=jpg\u0026name=900x900)\n\n（我说实话，我自己以前也是聊完就关的那种人，这个习惯改了很久才改过来）\n\n### 知识库也有技术债，需要健康检查\n\nKarpathy 的建议是定期做 Health Checks\n\n检查三样东西：一致性、完整性、孤岛\n\n一致性：wiki/concepts/ 里有没有定义冲突？比如「RAG」在一个地方叫「检索增强生成」，另一个地方变成了「向量数据库搜索」\n\n完整性：哪些概念条目缺定义、缺例子、缺来源？\n\n孤岛：哪些笔记入链出链都少于 2？该连到哪？\n\n报告存到 outputs/health/，每周一份\n\n做了几周之后最大的感受是：搜到一条笔记，敢直接用了\n\n以前还得想想：这玩意靠谱吗\n\n这个我可太懂了哈哈\n\n### 别一上来就搭 RAG\n\n这点必须单独说，因为太多人在这儿走弯路\n\n一提「AI + 笔记」，很多人的第一反应是搭 RAG：选 Embedding 模型、搭向量数据库、调切片策略\n\n整套架构搞了一个月，笔记库里还是只有 20 篇文章\n\nKarpathy 推荐这样做：知识库规模不大的时候（100 篇文章，40 万词左右），维护几个索引文件就够了\n\nLLM 先读索引定位，再直接阅读相关内容，简单、可靠、零额外成本\n\n等你的笔记真的过了一万条，搜东西开始找不到、找不全了，再考虑 RAG\n\n先跑通流程，再优化基础设施\n\n这道理工程师老师们应该比我懂，但轮到自己搭知识库的时候就忘了\n\n现有知识，再有知识库\n\nKarpathy 推文最后一句话是：\n\n\u003e 这套东西目前仍然像一堆 hacky scripts，但有空间做成 incredible new product\n\n我想到了 2006 年前的版本控制，那时候也是 svn、cvs、git 命令行，只有程序员在用\n\n然后有人把它做成了 GitHub，整个协作方式都变了\n\n个人知识库可能正在类似的节点\n\n## 人与 AI 的边界：不把思考外包\n\n### Kepano 的回复，可能是 Obsidian 最值得思考的人机共生案例\n\n![Image](https://pbs.twimg.com/media/HRWXoeSaAAAc_QG?format=jpg\u0026name=900x900)\n\n然后 Obsidian 的 CEO Kepano 紧接着回了一条，语气很温和，但说的话让我深思\n\n![Image](https://pbs.twimg.com/media/HRWXpRnbcAAVE_l?format=jpg\u0026name=900x900)\n\n**Keep your personal vault clean and create a messy vault for your agents**\n\n保持你的个人库干净，给 AI 创建一个脏乱的库\n\n就这一句话\n\n他说他偏好自己的 Obsidian vault 保持高信噪比，所有内容都有已知的来源\n\n之前我也分享过：如果内容没有来源，那这个内容不记也罢\n\n第二，他认为应该保持个人创建的产物和 agent 创建的产物之间的分离，防止用你无法溯源的想法「污染」你的主库\n\n第三，如果你让两者混合太多，Obsidian 将不再是「你的思想」的代表\n\n搜索、反向链接、图谱、快速切换，这些功能将不再只关于你的知识，而是变成了你和 AI 的混合物\n\n**这时我们就分不清到底是 AI 的知识库，还是属于你自己的知识库**\n\n第四，只有当 agent 工作流产出了真正有用的东西时，才把它引入主 vault，而且放进 clippings 文件夹\n\n你看，他说的每一条都很温和\n\n但合在一起，指向了一个非常尖锐的问题：\n\n**如果你的知识库里都是 AI 写的东西，那它还是「你的」知识库吗？**\n\n这个问题击中了我\n\n因为我在过去 6 年里，恰好把这条弯路，走了一个完整的轮回\n\n### 当 AI 来了，我差点又犯同样的错\n\n当 Claude Code 可以直接操作 Obsidian 的时候，当 Claudian 插件让你在笔记侧边栏就能和 AI 对话的时候，当各种 Skills、MCP、自动化工作流铺天盖地的时候——\n\n我又兴奋了\n\n我真的又兴奋了\n\n我安装了 Claudian，让 AI 帮我整理笔记，发现笔记之间的隐藏关联，批量修复路径，生成知识地图，创建 MOC\n\n3 分钟完成原本需要 30 分钟的事情\n\n但某一天，我突然停下来了\n\n因为我打开自己的笔记库，看着那些 AI 帮我写的摘要、AI 帮我建的链接、AI 帮我整理的结构——\n\n![Image](https://pbs.twimg.com/media/HRWXqH0bQAANhpT?format=jpg\u0026name=900x900)\n\n我发现，我不认识这些东西了\n\n它们很整齐，很专业，逻辑很清晰\n\n但它们不像是从我脑子里长出来的\n\n就像小时候没写作业早上去教室抄一样，作业是写完了，但真的是我学会了吗\n\n那一刻我突然理解了 Kepano 说的那句话：\n\n如果混合太多，Obsidian 将不再是「你的思想」的代表\n\n我在 flomo 里写下：[「不要直接把 AI 回答放进来，不要被各种酷炫的 ClaudeCode+Obsidian+Skills 搞到焦虑，本质上这种‘提高效率’就是在外包思考」](https://v.flomoapp.com/mine/?memo_id=MjE3NjAyMDUz)\n\n### 两种知识库，两种哲学\n\n所以你看，Karpathy 和 Kepano 这两条推文，表面上在聊工具和工作流，本质上在讨论一个更深的命题：\n\n人和 AI 在知识管理中的边界，到底在哪？\n\nKarpathy 的方案代表了一种思路：让 AI 成为知识的主人，你只需要喂数据，AI 帮你编译、整理、检索、生成，你几乎不碰 wiki 本身\n\n这套方案对于研究型的知识管理来说，确实是降维打击\n\n100 篇文章、40 万字的知识库，你一个人维护不过来，但 LLM 可以\n\nKepano 的回应代表了另一种思路：你的知识库应该是你思想的镜子，每一条内容都应该有你能追溯的来源，AI 可以帮忙，但产物要隔离，只有经过你筛选的才能进入你的主库\n\n这两种思路并不矛盾\n\n但它们对应着两种完全不同的知识管理哲学\n\n一种是效率优先——让 AI 帮你处理信息洪流，你专注于提问和决策\n\n一种是思考优先——知识管理的核心价值在于思考的过程本身，整理和链接的动作就是在锻炼思维\n\n而我自己，经过 6 年的折腾，我越来越倾向于后者\n\n### 不把思考外包\n\n我在 flomo 里有一条记录：[「flomo 是我个人知识管理体系中的‘收集站’，我也愿意称它为‘数据湖’。……我将所有维度的信息全部进行文本化压缩，并记录在 flomo 中，这个压缩，我只用人力，在现在这个时代看起来有些‘蠢’，你可以视作我在践行——‘不把思考外包’这个原则」](https://v.flomoapp.com/mine/?memo_id=MTc5NjQzMjM1)\n\n是的，我知道 AI 可以帮我做这件事，而且做得更快更好\n\n但问题在于——\n\n当你把一段视频的核心观点用自己的话压缩成一句话的时候，那个压缩的过程，就是思考\n\n当你给一条笔记打标签、建链接的时候，你需要思考这条笔记和哪些已有的知识相关，这个判断的过程，就是在训练你的认知框架\n\n当你把散落的碎片串联成一篇文章的时候，那个组装的过程，就是创造\n\n如果这些全部交给 AI，你确实省了时间\n\n但你也省掉了思考本身\n\n我还记得我在 flomo 里写过另一条：[「知识管理不仅要解决信息的存取，更要关注知识的流动和创新——衡量知识管理是否成功的标准，不在于你整理了多少笔记，而在于这些知识是否帮助你更好地思考和行动」](https://v.flomoapp.com/mine/?memo_id=MTc3MzkzOTk1)\n\n讲真的，这段话我自己回顾的时候都觉得写得挺好的\n\n但更重要的是，这段话是我自己一个字一个字打出来的，经过了反复的琢磨和修改\n\n它就长在我的脑子里\n\n如果是 AI 帮我总结的，我可能看一眼就忘了\n\n### 常青笔记：我折腾 6 年找到的锚点\n\n![Image](https://pbs.twimg.com/media/HRWXq8FaQAAH2M9?format=jpg\u0026name=900x900)\n\n折腾了 6 年之后，我找到了一个锚点——常青笔记（Evergreen Notes）\n\n这个概念是 Andy Matuschak 在 2020 年提出的，他是前苹果的 iOS 工程师，后来专门研究「工具如何辅助思考」这个课题\n\n[原文在这里](https://notes.andymatuschak.org/Evergreen_notes)\n\n常青笔记的核心理念很简单：\n\n每一条笔记应该是概念性的——讲一个想法，一个洞察\n\n应该是原子化的——一条只说一件事\n\n应该通过链接而非标签来组织——让笔记和笔记之间建立有机的联系\n\n允许有半成品，允许有草稿，但要持续地写、持续地链接、持续地发现关系\n\n我给自己定了三条标准：[「1，必须有标题，标题加粗；2，必须讲清楚一件事，哪怕是一句话；3，必须有链接，可以没有标签」](https://v.flomoapp.com/mine/?memo_id=MjE2MDM4OTIy)\n\n就这么简单\n\n不需要 47 个插件，不需要花哨的主题皮肤，不需要 AI 帮你自动生成\n\n我甚至在 Obsidian 里开启了安全模式，第三方插件一个不装\n\n[「去写，去想，去输出——用最简单的方式，用最强大的软件，做最重要的事，这就是重器轻用」](https://v.flomoapp.com/mine/?memo_id=MjE3NjAyMDUz)\n\n有一天我在 flomo 里写下了一个比喻，现在想想还挺得意的：[「如果说第二大脑是金库，那常青笔记就是钞票，常青笔记的标准就是印钞机」](https://v.flomoapp.com/mine/?memo_id=MjIxMzQyODI0)\n\n你的知识库值多少钱，取决于你的「印钞机」——也就是你写常青笔记的标准——有多高\n\n而写常青笔记这个动作本身，就是知识工作者的基本功，就像运动员练体能、音乐家练音阶一样：[「写长青笔记，就是在做基本功，这是知识工作者的基本功」](https://v.flomoapp.com/mine/?memo_id=MjE2MTkwODMy)\n\n这种基本功，AI 替代不了你\n\n### AI 不是没用，但顺序很重要\n\n我说的「不把思考外包」，并不意味着拒绝 AI\n\nKarpathy 的方案对于特定场景来说确实是最优解\n\n如果你要快速消化 100 篇论文、建立一个研究领域的知识地图，让 LLM 去编译和索引，效率比人工高出几个数量级\n\n我自己也在用 AI 辅助知识管理\n\n我在 flomo 里记过一条：[「AI 只会帮助那些能分辨内容好坏的人，而不是每个人——建立基础认知框架之后，再用 AI 开始直接帮助自己构建一些内容」](https://v.flomoapp.com/mine/?memo_id=MjAwMzE2NTk4)\n\n这才是关键——你得先有判断力，AI 才能成为放大器\n\n如果你自己都不知道什么是好的知识、什么是有价值的洞察，AI 帮你整理出来的东西，你也分辨不了真伪\n\n就像我之前构建的那套知识管理系统：信息源是水源，flomo 是水渠，YouMind 是水库，AI 知识库是水厂，输出渠道是水龙头\n\n每一层都有它的作用，但水库必须有人看管，水厂必须有质检标准\n\nAI 可以帮你过滤、加工、分装\n\n但「什么水能喝」这个判断，得你自己来\n\n所以我现在的做法是：Kepano 说的那个思路——分离\n\n我的 Obsidian 主库只放我自己写的常青笔记，一字一句都是我的，每一条都有来源，每一个链接都是我手动建的\n\nAI 的工作空间另开\n\n只有当 AI 产出了真正让我觉得「嗯，这个洞察我认」的东西，我才会用自己的话重新写一遍，放进主库\n\n重写这个动作很关键\n\n因为重写的过程就是内化的过程\n\n### File over App，文件优于应用\n\nKepano 的另一个核心理念叫 File over App——文件优于应用\n\n我第一次注意到这个概念，是有一天早上 flomo 崩溃了——我当时慌了，因为我几千条笔记全在上面\n\n到后来我也经历过飞书崩了，以及昨天晚上 chatGPT、Claude、Grok 全部崩溃\n\n那一刻我突然意识到：[「所有软件，转瞬即逝，而文件则不同——你需要的是掌管你文件的可访问性」](https://v.flomoapp.com/mine/?memo_id=MTc5NzUzOTA3)\n\n这和 Karpathy 选择 Obsidian 作为前端的原因是一样的——所有数据都是本地的 .md 文件，不依赖任何云服务，不会因为某个公司倒闭而消失\n\n你的知识，应该存在你自己的硬盘上，以你能打开、能阅读、能迁移的格式\n\n这一点在 AI 时代尤其重要\n\n因为 AI 工具的迭代速度太快了，今天的最佳实践明天可能就过时了\n\n但 .md 文件不会过时\n\n它从 2004 年 John Gruber 创建 Markdown 到现在已经 22 年了，依然是互联网上最通用的文本格式之一\n\n（如果你感兴趣，也可以研究一下 Gruber 这个人，是个传奇）\n\n[「AI 与软件功能越强大，越是需要极简的思维方式来应对」](https://v.flomoapp.com/mine/?memo_id=MTgwMzUxNzcx)\n\n工具会变，格式会变，AI 模型会变\n\n但文件不变，你的思考不变\n\n## AI + Obsidian 的落地方案\n\n### 我收藏夹里那些 AI + Obsidian 的实操\n\n除了 Karpathy 和 Kepano 的争论，我收藏夹里还有一堆实操向的内容，全是把 LLM Wiki 落地的方案\n\n先说《告别手动整理：小白如何用 Obsidian 搭一个 AI 驱动的个人知识库》，[原文](https://x.com/jinchenma_ai/article/2059842551218422004) 金尘马老师的\n\n它把 AI 维护知识库总结成五件事：持续编译、跨资料连接、问答回流、巩固知识网、健康检查\n\n五件事加起来一句话：你的知识库从死的变成活的\n\n它给了一套可以直接复制的提示词，让 Codex 或 Claude Code 初始化目录结构、创建 index.md、log.md、AGENTS.md 或 CLAUDE.md\n\n目录分三层：raw/ 像仓库，wiki/ 像书架，outputs/ 像工作台\n\nAGENTS.md 像说明书：raw/ 不能改、每个判断要指向来源、不确定的信息要标「待核验」\n\n日常只需要做四件事：投喂、提问、回流、检查\n\n它还给了六个「别」：\n\n别一上来搭 RAG\n\n别只存正文不存来源\n\n别把 raw 和 wiki 混在一起\n\n别让 AI 覆盖原始资料\n\n别把问答留在聊天记录里\n\n别信 AI 编译一次就完事\n\n每一条都是踩过坑才写得出来的\n\n《一篇文章讲清楚，小白如何从 0 到 1 搭建自己的 AI 知识库》是同一作者的另一篇，[原文在这里](https://x.com/jinchenma_ai/article/2082495802640080899)\n\n它的核心观点是：AI 知识库是一套由文本文件、阅读软件、Agent、规则和真实任务组成的工作方式\n\n一个存放文本文件的开放文件夹，一个可以操控这些文件的 Agent 工具，一份清楚的工作规则，再加上一个真实任务场景，就可以启动了\n\n它特别强调：知识库要先服务一个明确的任务，再放入与它直接相关的资料\n\n没有实际用途，文件夹整理得再漂亮，也只是换了一个地方存资料\n\n（这句话我举双手赞成，我以前就干过这种事，建了二十个文件夹，一个都没用上）\n\n《Hermes+Obsidian+LLM Wiki 搭建本地知识库》讲的是另一套方案，[原文在这里](https://x.com/rwayne/article/2054523563248611675)\n\nHermes Agent 是 Nous Research 开发的自主 AI 代理，内置学习循环，能从经验中创建技能、改进技能\n\n它内置了 llm-wiki skill，你只需要说「把这篇文章写入知识库」，它就自动提取实体、提取概念、创建 Markdown 文件、添加双链、更新索引\n\n这里有个重要的使用规则：只有当你明确要求的时候，Hermes 才会操作知识库\n\n当你说「写入知识库」才会导入，当你说「结合知识库」才会检索\n\n日常的普通对话，Hermes 不会主动去动你的知识库\n\n这样做的好处是：你的知识库不会被无关的对话污染\n\n《用 Codex + Obsidian 搭建自生长的个人知识库实战》是苍何写的，[原文在这里](https://x.com/canghe/article/2086372334089462208)\n\n它把系统分成三层：Raw 层保存原始资料，Wiki 层沉淀 AI 整理出的概念、实体和主题，Schema 层规定 AI 如何归档、更新、引用，以及怎么处理冲突\n\n简单说：Raw 保存证据，Wiki 记录理解，Schema 负责定规则\n\n它给了 AGENTS.md 的十条规则，从「处理新资料前先搜索已有页面」到「信息不足时暂停执行并向我提问」，非常完整\n\n它还介绍了三种搭建方法：直接搭建法、claude-obsidian 插件法、WeSight 知识大脑\n\nWeSight 把知识库初始化、资料入库、Wiki 更新和智能检索整合到 Obsidian 内部，让人在熟悉的笔记界面中完成整个流程\n\n它还说了一句大实话：自生长并不意味着完全自动化\n\n哪些资料值得保留、规则如何设定、关键结论能否成立，仍然需要人的判断\n\nAI 更适合承担重复、耗时且结构化的维护工作\n\n还有一篇《在终端里养一只会整理笔记的 AI 鲸鱼：Codewhale + Obsidian 知识库搭建指南》，这篇是我自己整理的\n\nCodewhale 是一个跑在终端里的开源 AI 代理，前身叫 DeepSeek TUI\n\n它能读取、修改、创建你磁盘上的文件，能执行 shell 命令，能搜索文件内容\n\n它有三种模式：Plan 模式（只读）、Agent 模式（逐步确认）、YOLO 模式（全自动）\n\n还有一个救命功能：/restore，AI 改错了什么，可以回滚到之前的状态\n\n它还能通过 rules.md 让 AI 遵守你的规矩：文件名用中文、双链统一格式、不要删除重要笔记\n\n这套组合的本质，是把你的知识库从「一个被动的笔记仓库」变成了「一个 AI 可以动手整理的活的工作区」\n\n最后还有一篇《这是掌管 Obsidian 创作的神！》，[原文在这里](https://x.com/gengdaJ/article/2088831092379775198)\n\n作者打磨了一周，消耗了超过 100 亿 Tokens，做了一个镶嵌在 Obsidian 里面的超级助手 Ailu\n\n集记忆、创作和发布一体，能一键上传文章到公众号、飞书和 X\n\n虽然这种级别的工程化离普通人有点远，但它展示了 Obsidian 插件的上限：只要你想，你可以在里面造一个创作工作室\n\n（我看完这篇的第一反应是：人家消耗 100 亿 tokens 做了个助手，我消耗 100 亿 tokens 可能只是在问 AI 为什么我的插件装不上，人与人之间的差距啊）\n\n## 值不值得用：选择、劝退与结论\n\n### 所以，Obsidian 到底值不值得折腾？\n\n聊了这么多，回到开头那个问题\n\n我的答案是：值得，但别往「折腾」的方向值得\n\nObsidian 的上限极高，它是实践卡片盒笔记法和常青笔记的最佳数字工具之一\n\n双向链接、图谱视图和本地 Markdown 存储，为常青笔记的长期维护提供了理想的技术基础\n\n但它也有明显的短板：协作能力薄弱、学习曲线陡峭、移动端体验一般、没有 Web 版\n\n更重要的是，过度定制是一个真实的陷阱\n\n2500+ 插件意味着无尽的配置可能性，很多人陷入「折腾工具」而非「使用工具」的困境\n\n所以我现在对 Obsidian 的态度是：重器轻用\n\n用最简单的方式，用最强大的软件，做最重要的事\n\n### 劝退：这几种人，别用 Obsidian\n\n说点劝退的话，敢劝退比夸十句都真\n\n如果你只想要零门槛、打开就写的笔记软件，Obsidian 能用，就是无法发挥出它完整的能力\n\n它的学习曲线是真的陡，你要先理解 Markdown、再配置插件、再建立自己的工作流\n\nPCMag 的评测说得挺客气：a highly adaptable and free note-taking app for power users who don‘t need collaboration features\n\n翻译过来就是：这是给不需要协作的高级用户用的，普通人可能会被劝退\n\n如果你需要团队实时协作，别用 Obsidian\n\n它本质上是单人工具，虽然可以通过 Git 或共享文件夹实现粗糙的多人协作，但远不及 Notion 的实时协作体验\n\n如果你只想快速记录碎片想法，Obsidian 也不是最优解\n\n走路时记一个想法，flomo 这种轻量工具比它便捷多了\n\nObsidian 更适合的场景是：常青笔记的最终归宿\n\n那些经过 flomo 捕获、经过思考打磨、值得长期保留和持续更新的知识节点，最终沉淀在 Obsidian 的 Vault 里\n\n如果你没有输出的打算，那用什么工具都一样，别折腾\n\n还有，如果你是个完美主义者，总想先设计好完美的文件夹结构再开始写笔记，那 Obsidian 会把你逼疯\n\n先写再整理，先跑通最小流程，这是所有教程的共识\n\n笔记系统不是一次设计完成的作品，它应该随着你的内容和习惯逐步修改\n\n### 竞品点名，说点公道话\n\nNotion 很强，强在多维表格、强在团队协作、强在模板生态\n\n但它的数据在云端，网络卡顿的时候，你可能连自己写的字都打不出来\n\n而且它的 AI 是原生的，$10/用户/月，贵\n\nObsidian 的插件生态天下无敌，但它只帮你存，不帮你输出\n\nLogseq 很接近，块级大纲、开源、免费\n\n但它更适合碎片化捕获，长文写作和结构化文档还是 Obsidian 顺手\n\nRoam Research 是双向链接的引爆者，但这个价格和云端存储，让它在用户规模上输给了免费的 Obsidian\n\nflomo 我天天用，它是最好的收集站，但它不是知识库，它是数据湖\n\n一句话总结：没有完美的笔记工具，只有适合你的工作流\n\n（我知道有人会问 YouMind 呢，毕竟我天天用——这么说吧，我的系统里每层工具干每层的活，Obsidian 是常青笔记的最终归宿，这是它最不可替代的位置）\n\n### 回到最初的问题\n\n![Image](https://pbs.twimg.com/media/HRWXrymacAE76DQ?format=jpg\u0026name=900x900)\n\n所以回到开头那个问题：\n\n当 AI 可以替你整理一切的时候，你自己还需要思考吗？\n\n我的答案是：你比以前更需要\n\n因为当信息的获取成本趋近于零、整理成本趋近于零、甚至生成成本都趋近于零的时候，真正稀缺的东西变了\n\n以前稀缺的是信息本身，谁有信息谁就有优势\n\n后来稀缺的是整理能力，谁能把信息结构化谁就赢了\n\n现在呢？AI 可以帮你获取、整理、生成\n\n那什么变得稀缺了？判断力\n\n知道什么信息值得留下，什么应该丢掉\n\n知道哪个观点是深刻的，哪个只是看起来深刻\n\n知道两个看似无关的概念之间，存在一条隐秘的连接\n\n这些能力，来自于你日复一日地写、想、链接、输出\n\n来自于你坐在那里，面对一个模糊的想法，把它掰开揉碎，用自己的语言重新组装\n\n来自于你在整理笔记的时候，突然看到两条写于不同时间的记录，它们之间产生了某种化学反应——\n\n那个「啊哈」的瞬间\n\n这种瞬间，AI 给不了你\n\n它可以帮你找到那两条笔记，但那个连接的意义，那个顿悟的火花，只能在你自己的神经元里点燃\n\n[「你的第二大脑不是仓库，是厨房」](https://v.flomoapp.com/mine/?memo_id=MjE3NDUzNjY0)\n\n仓库只管存放，厨房才管创造\n\n而在厨房里站着的那个人，只能是你\n\n### 最后说点没用的\n\n这篇文章写到最后，我发现一个有意思的事\n\n我收藏的那些 Obsidian 内容，入门教程占了三分之一，AI 实操占了三分之一，剩下的三分之一，全是「别折腾」的劝诫\n\n连我自己写的文章，最后也落在了常青笔记和重器轻用上\n\n这说明\n\n这个工具圈的共识正在形成：工具只是手段，思考才是目的\n\nObsidian 值不值得折腾，取决于你折腾完之后，有没有留下真正属于你的东西\n\n如果留下了，它就是金库\n\n如果只是折腾，它就是一个越来越大的仓库\n\n我准备把我自己现在在用的 Obsidian 库公开发布了，包含常用插件、精选主题、Agent 系统提示词案例、记忆存档案例、还有自定义 CSS\n\n发布之前会在铁粉群里先内部测试一下\n\n如果你想围观，评论区告诉我，我挺好奇的\n\n也想知道：\n\n你的 Obsidian 里，现在躺着几篇笔记？\n\n有几篇是你自己一个字一个字写出来的？\n\n你的图谱长什么样？\n\n评论区见\n\n我是 Jackywine， AI 领域创作者，AI 产品设计师，Obsidian VIP，公众号同名认证科技自媒体，专注：AIGC、Agent 产品+设计、国产LLM 实测、AI 时代的个人 IP 以及品牌打造\n\n![Image](https://pbs.twimg.com/media/HRWXsozaoAAas0X?format=jpg\u0026name=900x900)\n\n### 资料来源汇总\n\n- [2026 年最强 Obsidian 保姆级教程](https://x.com/ai_suxiaole/article/2080133894222057612)\n- [Obsidian 小白完整入门教程](https://x.com/ai_xiaomu/article/2057365060977390037)\n- [Obsidian 零基础大白话教程](https://x.com/cheery9998/article/2023662846048170464)\n- [Obsidian 别只装完就吃灰](https://x.com/AdrianPunk115/article/2087046395949973788)\n- [Obsidian 零基础教程（泊舟）](https://x.com/bozhou_ai/article/2011738838767423983)\n- [不要在到处找 Obsidian 的入门教程了](https://forum-zh.obsidian.md/t/topic/3222)\n- [用 LLM + Obsidian 构建个人知识库（Karpathy 工作流）](https://x.com/yanhua1010/article/2039966047378583815)\n- [告别手动整理：AI 驱动的个人知识库](https://x.com/jinchenma_ai/article/2059842551218422004)\n- [一篇文章讲清楚，小白如何从 0 到 1 搭建 AI 知识库](https://x.com/jinchenma_ai/article/2082495802640080899)\n- [Hermes+Obsidian+LLM Wiki 搭建本地知识库](https://x.com/rwayne/article/2054523563248611675)\n- [用 Codex + Obsidian 搭建自生长的个人知识库实战](https://x.com/canghe/article/2086372334089462208)\n- [这是掌管 Obsidian 创作的神（Ailu）](https://x.com/gengdaJ/article/2088831092379775198)\n- [Andrej Karpathy 的 LLM Knowledge Bases 推文](https://x.com/karpathy/status/2039805659525644595)\n- [Andy Matuschak:Evergreen notes](https://notes.andymatuschak.org/Evergreen_notes)\n- [Obsidian 官网](https://obsidian.md/)\n- [PCMag 评测](https://www.pcmag.com/reviews/obsidian)\n- [The Verge 对 Steph Ango 的访谈](https://www.theverge.com/decoder-podcast-with-nilay-patel/760522/obsidian-ceo-steph-ango-kepano-productivity-software-notes-app)\n- [我的 Obsidian 飞书知识库汇总](https://t.co/xLfzcob0Cp)\n- 我的 Obsidian 推文汇总：[从入门到精通](https://x.com/Jackywine/status/2044356555865505989)、[我在用的主题](https://x.com/Jackywine/status/2042131360048128059)、[Skills/教程/书籍推荐](https://x.com/Jackywine/status/2045073603176354119)、[使用演示视频](https://x.com/Jackywine/status/2044566718924906646)、[Obsidian CEO 的笔记可视化 skills](https://x.com/Jackywine/status/2044061990172369097)、[为什么 99% 的 Obsidian 折腾都是在浪费时间](https://x.com/Jackywine/status/2053044838342496372)","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"ecad257d072b0d59384db0952fca5ab87255886b3fa92a9cca5b780a5963a1d6","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","s ","payload":{"lines":"28,29","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWZv9dbkAA_SgS?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e2026 我的 Obsidian 完整分享\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"2026 我的 Obsidian 完整分享\" data-note-id=\"note:sha256:ab961bac06f3ca9b04ee0a1ce40f77f249d594f7c321a10e60e259d93e1ab864\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"2026-我的-obsidian-完整分享\"\u003e2026 我的 Obsidian 完整分享\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWZv9dbkAA_SgS?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@Jackywine · \u003ca href=\"https://x.com/Jackywine/article/2095750518941659567\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX Article\u003c/a\u003e · 2026-09-04\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e第一次知道 Obsidian，是 2020 年，知乎上有人发了一张紫色图标的截图\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXeE-awAIsbyO?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e我当时的第一反应是：这图标长得像块石头\u003c/p\u003e\n\u003cp\u003e后来才知道，Obsidian 就是黑曜石的意思，火山玻璃，又硬又锋利，切开东西干净利落，和我的世界里那个硬硬的黑色石头一样\u003c/p\u003e\n\u003cp\u003e那个比喻放到今天看，还挺准的\u003c/p\u003e\n\u003cp\u003e我这个人有个毛病，喜欢一个工具，就会疯狂收集关于它的一切\u003c/p\u003e\n\u003cp\u003eObsidian 是我收集得最凶的一个\u003c/p\u003e\n\u003cp\u003e光是我这个 YouMind BOARD 里，跟 Obsidian 有关的内容，我数了数，有十几篇\u003c/p\u003e\n\u003cp\u003e入门教程、深度研究、AI 接入实操、产品哲学、甚至我还给它做了表情包\u003c/p\u003e\n\u003cp\u003e今天这篇，就是我把这些内容全部翻了一遍之后，想跟你说的话\u003c/p\u003e\n\u003cp\u003e万字警告，建议先收藏\u003c/p\u003e\n\u003ch2 id=\"从工具崇拜到重器轻用\"\u003e从「工具崇拜」到「重器轻用」\u003c/h2\u003e\n\u003ch3 id=\"先说清楚我跟-obsidian-的关系你再决定要不要信我\"\u003e先说清楚我跟 Obsidian 的关系，你再决定要不要信我\u003c/h3\u003e\n\u003cp\u003e我是 Obsidian 的重度用户，从 2020 年用到现在，六年了\u003c/p\u003e\n\u003cp\u003e我为了支持它，成为了 Obsidian VIP 支持者\u003c/p\u003e\n\u003cp\u003e我写过 Obsidian 的踩坑经验，整理过 Obsidian 飞书知识库汇总，全公开，已经有超过五位数的网友学过了\u003c/p\u003e\n\u003cp\u003e链接：\u003ca href=\"https://my.feishu.cn/wiki/PPW4w6eEYi01dfkUgc3cGYsVnkh\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://my.feishu.cn/wiki/PPW4w6eEYi01dfkUgc3cGYsVnkh\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXe6NaEAA2XM9?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e我还把我现在自己在用的 Obsidian 库公开发布，包含我常用的插件、精选主题、Agent 系统提示词案例、记忆存档案例、还有让图谱更美观的自定义 CSS\u003c/p\u003e\n\u003cp\u003e链接：\u003ca href=\"https://my.feishu.cn/wiki/GccZwP13MikuGJk07mTcOXAfnAg\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://my.feishu.cn/wiki/GccZwP13MikuGJk07mTcOXAfnAg\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXfs7bAAAnkum?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e所以你可以带着一半怀疑看这篇文章\u003c/p\u003e\n\u003cp\u003e夸的地方，我尽量给出处\u003c/p\u003e\n\u003cp\u003e骂的地方，我尽量给证据\u003c/p\u003e\n\u003ch3 id=\"先说痛点再说工具\"\u003e先说痛点，再说工具\u003c/h3\u003e\n\u003cp\u003e你有没有过这种体验：明明记得自己存过一篇很好的文章，真要用的时候翻遍整个笔记库，就是找不到\u003c/p\u003e\n\u003cp\u003e公众号、知乎、网页剪藏、PDF、视频转写、AI 对话截图，收藏夹越来越满\u003c/p\u003e\n\u003cp\u003e三个月后想不起标题，记不得关键词，搜也搜不出来\u003c/p\u003e\n\u003cp\u003e文件夹越建越乱，笔记记了却用不起来\u003c/p\u003e\n\u003cp\u003e这个问题不是我一个人有\u003c/p\u003e\n\u003cp\u003e我收集的那些教程里，几乎每一篇的开头都在讲同一件事\u003c/p\u003e\n\u003cp\u003e收藏夹里躺着几百篇文章，笔记里堆着几十个半成品项目\u003c/p\u003e\n\u003cp\u003e传统笔记最大的问题就在这：只进不出\u003c/p\u003e\n\u003cp\u003e你存的不是知识库，是一个越来越大的仓库\u003c/p\u003e\n\u003cp\u003e东西都在，但没人整理，没人索引，没人告诉你哪些互相关联、哪些已经过时\u003c/p\u003e\n\u003cp\u003e我特别记得《2025 年 flomo+飞书 如何搭建个人极简知识管理系统？》那篇文章里的一句话：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e终身学习者、自媒体、工程师、设计师等职业已经在记录属于自己的笔记，但是还没有体系化和系统化，需要一些案例来刺激自己搭建系统的想法\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e链接：\u003ca href=\"https://my.feishu.cn/wiki/P7BSwiqqAi8tSNkbfPMcz6IFnic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://my.feishu.cn/wiki/P7BSwiqqAi8tSNkbfPMcz6IFnic\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"47-个插件和一个删了十遍的库\"\u003e47 个插件和一个删了十遍的库\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXglbbQAAis9c?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e2020 年，我遇见了 Obsidian\u003c/p\u003e\n\u003cp\u003e我的第一反应是：哇，本地存储！双链笔记！知识图谱！\u003c/p\u003e\n\u003cp\u003e我的第二反应是：一个笔记软件怎么这么科幻？\u003c/p\u003e\n\u003cp\u003e然后我做了经典操作——建库\u003c/p\u003e\n\u003cp\u003e然后是经典操作 2.0——疯狂装插件\u003c/p\u003e\n\u003cp\u003e47 个，你们知道 47 个插件同时运行是什么概念吗？\u003c/p\u003e\n\u003cp\u003e就是你打开 Obsidian 的时间，可以等到外卖送到\u003c/p\u003e\n\u003cp\u003e接下来的几年，我陷入了一个死循环：发现新插件 → 兴奋 → 疯狂配置 → 一周后发现不好用 → 看到别人的库更好看 → 删库重建 → 回到第一步\u003c/p\u003e\n\u003cp\u003e这个循环，我走了不下 10 遍\u003c/p\u003e\n\u003cp\u003e有一次我甚至在凌晨 3 点，一边看 B 站 UP 主的教程，一边删掉了自己写了半年的笔记库\u003c/p\u003e\n\u003cp\u003e第二天醒来看着空空的文件夹，我就说了一句话：我是谁？我在哪？我的笔记呢？\u003c/p\u003e\n\u003cp\u003e5000 条笔记，堆在那里，成了赛博坦星球\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXhWibAAALd3v?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e上面就是我之前的库\u003c/p\u003e\n\u003cp\u003e好看吗？好看\u003c/p\u003e\n\u003cp\u003e有用吗？没有\u003c/p\u003e\n\u003cp\u003e我在 flomo 里记过一句话：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MjE3NDUzNjY0\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「你花在 Obsidian 上 99% 的时间，都是浪费」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e一个小时倒腾皮肤，两个小时倒腾插件，社区里看各种最佳实践，笔记库里写的东西嘛，寥寥无几\u003c/p\u003e\n\u003cp\u003e这就是典型的「工具崇拜」——你以为自己在学习，其实只是在逃避\u003c/p\u003e\n\u003cp\u003e（我知道这段话听起来像在骂人，但最该挨骂的其实是我自己）\u003c/p\u003e\n\u003ch3 id=\"我收藏夹里的入门教程比你们想象的还多\"\u003e我收藏夹里的入门教程，比你们想象的还多\u003c/h3\u003e\n\u003cp\u003e先说结论：Obsidian 的\u003cstrong\u003e入门教程\u003c/strong\u003e，我收藏了不下六篇\u003c/p\u003e\n\u003cp\u003e注意是“入门”，教你怎么下载安装建库以及插件同步的\u003c/p\u003e\n\u003cp\u003e每一篇我都看完了，每一篇的侧重点都不一样\u003c/p\u003e\n\u003cp\u003e《2026 年最强Obsidian保姆级教程，10分钟打造你的第二大脑》是我见过最克制的一篇，\u003ca href=\"https://x.com/ai_suxiaole/article/2080133894222057612\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e它全程只讲一件事：创建一个库、三种 Markdown 写法、两个快捷键和双向链接\u003c/p\u003e\n\u003cp\u003eYAML、高级查询、主题和社区插件，它直接让你别研究\u003c/p\u003e\n\u003cp\u003e它把 Obsidian 讲得很朴素：一个更适合长期保存、搜索和连接文字资料的文件夹\u003c/p\u003e\n\u003cp\u003e每篇笔记都是你电脑里的真实文件，将来不用 Obsidian 了，还能用别的文本编辑器打开\u003c/p\u003e\n\u003cp\u003e它没有把你的笔记锁在某种只能由它读取的特殊格式里\u003c/p\u003e\n\u003cp\u003e文末有个 3 分钟练习，新建一篇笔记、写一个标题、写一个列表、建一个双链、看一次反向链接\u003c/p\u003e\n\u003cp\u003e能做到，你的库、Markdown 和双向链接就都在正常工作\u003c/p\u003e\n\u003cp\u003e《Obsidian 小白完整入门教程(本地知识库)》则是另一条路线，\u003ca href=\"https://x.com/ai_xiaomu/article/2057365060977390037\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e它上来就问你一个问题：AI 时代，人人都需要一个自己的知识库，为什么？\u003c/p\u003e\n\u003cp\u003e因为 AI 本身没有立场、没有经历、没有审美\u003c/p\u003e\n\u003cp\u003e直接问它一个问题，回答正确但没有灵魂\u003c/p\u003e\n\u003cp\u003e差别在哪？在于你能不能把「你自己的素材、方法论、经历、判断」喂给它\u003c/p\u003e\n\u003cp\u003e同样的模型，喂进去你的东西，输出的就是带你印记的东西\u003c/p\u003e\n\u003cp\u003e这个观点我特别认\u003c/p\u003e\n\u003cp\u003e它还讲了 MOC、PARA、Zettelkasten 三种组织方式怎么选\u003c/p\u003e\n\u003cp\u003e答案是：先写半个月，看哪种需求自然冒出来，再有意识地用对应方法\u003c/p\u003e\n\u003cp\u003e三种可以混着用\u003c/p\u003e\n\u003cp\u003e还有《新手小白能看懂的 Obsidian 零基础大白话教程》，\u003ca href=\"https://x.com/cheery9998/article/2023662846048170464\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e它把 Obsidian 讲成「永远用不坏、极其安全、还能随意改装的电子笔记本」\u003c/p\u003e\n\u003cp\u003e排版像说话一样简单，功能像搭乐高一样自由，对非程序员绝对友好\u003c/p\u003e\n\u003cp\u003e库就是抽屉，界面就是书桌，插件就是家具城\u003c/p\u003e\n\u003cp\u003e这套比喻，我妈都能听懂\u003c/p\u003e\n\u003cp\u003e还有《Obsidian 别只装完就吃灰》，\u003ca href=\"https://x.com/AdrianPunk115/article/2087046395949973788\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e它直接从空仓库开始，创建仓库、填写名称、选择位置、建目录、写首页、做双向链接、开日记、看关系图谱，最后再把它交给 Codex 处理\u003c/p\u003e\n\u003cp\u003e里面有一句话我记到现在：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e仓库不是一种神秘数据库，它就是一个普通文件夹\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e它把知识库的最小流程拆成了五步：随手收集 → 放进收件箱 → 整理成笔记 → 建立链接 → 从首页再次找到 → 输出文章或方案\u003c/p\u003e\n\u003cp\u003e先把这条路跑通，插件、自动化和复杂方法论，等你真的遇到问题再加\u003c/p\u003e\n\u003cp\u003e哦对了，还有一篇《Obsidian 零基础教程》，\u003ca href=\"https://x.com/bozhou_ai/article/2011738838767423983\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e它教的是用 GitHub 做云同步，还贴心地教了怎么加 .gitignore 防止把 workspace 文件传上去\u003c/p\u003e\n\u003cp\u003e配图是高清的，步骤是截图级的，属于收藏了就能照着做的那种\u003c/p\u003e\n\u003cp\u003e（我收藏教程有个习惯：看配图多不多，图多的一般靠谱）\u003c/p\u003e\n\u003ch3 id=\"不要在到处找教程了精华都在论坛里\"\u003e不要在到处找教程了，精华都在论坛里\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXiHDb0AEJb00?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e还有一篇推文我收藏了，标题就很有意思：《不要在到处找 Obsidian 的入门教程了，精华都在论坛里面》\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://forum-zh.obsidian.md/t/topic/3222\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e地址在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这句话是真的\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXi7EbgAAQLNt?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e如果你还想看一些更专业的内容，可以去 \u003ca href=\"https://community.obsidian.md/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://community.obsidian.md/\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这是官方的 Community，里面的插件、新闻更是全面\u003c/p\u003e\n\u003ch2 id=\"obsidian-的底层价值本地链接与生态\"\u003eObsidian 的底层价值：本地、链接与生态\u003c/h2\u003e\n\u003ch3 id=\"深度研究这份文档把我对-obsidian-的认知补齐了\"\u003e深度研究这份文档，把我对 Obsidian 的认知补齐了\u003c/h3\u003e\n\u003cp\u003e我有一份《Obsidian 深度研究》，信息量非常大\u003c/p\u003e\n\u003cp\u003e它把 Obsidian 的家底都翻出来了\u003c/p\u003e\n\u003cp\u003eObsidian 是 Shida Li 和 Erica Xu 在 2020 年新冠疫情隔离期间创建的\u003c/p\u003e\n\u003cp\u003e两个人都是滑铁卢大学毕业的，之前一起做过一款叫 Dynalist 的大纲工具\u003c/p\u003e\n\u003cp\u003eErica 在访谈里说过，Obsidian 的基本想法在她脑子里存了两年，她一度觉得自己是怪人，居然想要一个这样的个人知识库\u003c/p\u003e\n\u003cp\u003e结果没想到，好多人跟她说，他们也想做同样的事，想了几年甚至几十年\u003c/p\u003e\n\u003cp\u003e2020 年 3 月 30 日，Obsidian 发布公测版，恰好是 WHO 宣布 COVID-19 为全球大流行的同一周\u003c/p\u003e\n\u003cp\u003e2023 年，以 Minimal 主题闻名的设计师 Steph Ango（网名 kepano）加入团队担任 CEO\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXjrCa4AAriEj?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e团队结构是：Shida Li 当 CTO，Erica Xu 当 COO，kepano 当 CEO，加上少数几名工程师，总共约 7 人，加一只小猫（是的，你没看错）\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXkhiasAAZ0Bc?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e就这几个人，做出了 3.5 亿美元估值的产品，超过 150 万月活用户\u003c/p\u003e\n\u003cp\u003e而且完全依靠自己，从未接受外部融资\u003c/p\u003e\n\u003cp\u003e这份文档里有一句官网标语，我看了很久：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eYour knowledge should last\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e你的知识应当持久\u003c/p\u003e\n\u003cp\u003e你的笔记以纯文本 Markdown 文件存储在本地设备上，即使 Obsidian 公司明天消失，你的数据依然完整可读\u003c/p\u003e\n\u003cp\u003e你可以用 VS Code、Vim、任何文本编辑器打开它们，可以用 grep、sed 处理它们，可以零转换成本迁移到任何兼容 Markdown 的工具\u003c/p\u003e\n\u003cp\u003e这种「数据持久性」承诺，在 SaaS 工具随时可能关闭或改变定价的时代，有着致命的吸引力\u003c/p\u003e\n\u003cp\u003e而且，现在的 AI Agent 的能力，可以让 Agent 有操作工具的能力，Agent 访问这些纯文本 Markdown 文件，也变得很容易\u003c/p\u003e\n\u003cp\u003e它的商业模式也很有意思：核心应用完全免费，Sync 同步服务 $4/月，Publish 发布服务 $8/月，Catalyst 一次性捐赠 $25 起\u003c/p\u003e\n\u003cp\u003e只对增值服务收费，用极小的团队维持极高的利润率\u003c/p\u003e\n\u003ch3 id=\"链接优先于分类这句话值得单独讲\"\u003e链接优先于分类，这句话值得单独讲\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXlY6bQAADB6h?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e深度研究文档里有一个核心观点：链接优先于分类\u003c/p\u003e\n\u003cp\u003e传统笔记工具鼓励你把笔记放进文件夹，这是一种树状结构，每条笔记只能属于一个位置\u003c/p\u003e\n\u003cp\u003eObsidian 的核心主张是：用双链把笔记连接起来，让知识自然形成网状结构\u003c/p\u003e\n\u003cp\u003e每一个链接都会自动创建一条双向边，知识图谱从笔记本身涌现出来\u003c/p\u003e\n\u003cp\u003e这种方式更接近人类大脑的联想机制\u003c/p\u003e\n\u003cp\u003e说白了，文件夹只能告诉你「这篇笔记放在哪里」，链接还能告诉你「这篇笔记和什么有关」\u003c/p\u003e\n\u003cp\u003e这就是 Obsidian 和 Word 最本质的区别\u003c/p\u003e\n\u003cp\u003eWord 文档通常是彼此分开的，即使两份文档讨论的是同一件事，它们之间也没有明显联系\u003c/p\u003e\n\u003cp\u003eObsidian 里，你可以用 [[笔记名]]把两篇笔记直接连起来\u003c/p\u003e\n\u003cp\u003e以后打开其中一篇，不仅能跳到另一篇，还能看到有哪些旧笔记提到过它\u003c/p\u003e\n\u003cp\u003e笔记越多，这张网越值钱\u003c/p\u003e\n\u003ch3 id=\"它的插件生态是一座家具城\"\u003e它的插件生态，是一座家具城\u003c/h3\u003e\n\u003cp\u003e截至 2026 年 3 月，Obsidian 社区插件数量已超过 2500 个\u003c/p\u003e\n\u003cp\u003e每周仍有 6-14 个新插件发布，80-100 个插件更新\u003c/p\u003e\n\u003cp\u003eReddit 的 r/ObsidianMD 有超过 25.6 万订阅者\u003c/p\u003e\n\u003cp\u003e代表性插件包括 Dataview（把 Vault 当数据库查询）、Templater（高级模板引擎）、Excalidraw（手绘风格图表）、Calendar（日历视图）、Kanban（Markdown 驱动的看板）\u003c/p\u003e\n\u003cp\u003e还有一大堆 AI 集成插件\u003c/p\u003e\n\u003cp\u003e2026 年 5 月，官方还推出了新的自动化审核系统，进一步提升插件生态的安全性和质量\u003c/p\u003e\n\u003cp\u003e这标志着生态从「野蛮生长」走向「可持续治理」\u003c/p\u003e\n\u003cp\u003e但插件多，也是陷阱\u003c/p\u003e\n\u003cp\u003e过度定制的陷阱是真实存在的：2500+ 插件意味着无尽的配置可能性，许多用户陷入「折腾工具」而非「使用工具」的困境\u003c/p\u003e\n\u003cp\u003e社区里有一句著名的自嘲：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eI spent 3 hours configuring my productivity system instead of being productive\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e翻译成人话：花了三个小时调插件，一个字没写\u003c/p\u003e\n\u003cp\u003e这句话，我懂，我真的太懂了\u003c/p\u003e\n\u003ch3 id=\"竞品那块它点名了-notionlogseq-和-roam\"\u003e竞品那块，它点名了 Notion、Logseq 和 Roam\u003c/h3\u003e\n\u003cp\u003eNotion 适合团队协作和项目管理；Obsidian 适合个人深度思考和长期知识积累\u003c/p\u003e\n\u003cp\u003eNotion 的数据存在云端专有格式，Obsidian 是本地 Markdown 文件\u003c/p\u003e\n\u003cp\u003eNotion 协作强，Obsidian 基本不支持协作\u003c/p\u003e\n\u003cp\u003eNotion 学习曲线平缓，Obsidian 较陡\u003c/p\u003e\n\u003cp\u003e数据所有权：Notion 的属于 Notion 服务器，Obsidian 的完全属于用户\u003c/p\u003e\n\u003cp\u003eAI 功能：Notion 是原生 AI（$10/用户/月附加），Obsidian 靠插件集成\u003c/p\u003e\n\u003cp\u003eLogseq 是 Obsidian 最接近的竞品，同样本地优先、同样基于 Markdown、同样免费\u003c/p\u003e\n\u003cp\u003e核心区别：Logseq 是块级大纲工具，每个 bullet point 是独立可引用的单元；Obsidian 是文档级工具\u003c/p\u003e\n\u003cp\u003eLogseq 更适合快速碎片化捕获和日记驱动的工作流；Obsidian 更适合长文写作和结构化文档\u003c/p\u003e\n\u003cp\u003eLogseq 开源，Obsidian 专有但免费\u003c/p\u003e\n\u003cp\u003eRoam Research 是 2019-2020 年「双向链接」热潮的引爆者\u003c/p\u003e\n\u003cp\u003e但 $15/月的定价和云端专有存储让许多用户转向了 Obsidian\u003c/p\u003e\n\u003cp\u003eRoam 的块级引用粒度更细，但 Obsidian 的免费策略、本地存储和插件生态在用户规模上完胜\u003c/p\u003e\n\u003cp\u003e这三段对比，我建议每一个想换笔记工具的人都读一遍\u003c/p\u003e\n\u003cp\u003e（深度研究这份文档的原文出处我一并贴出来：\u003ca href=\"https://www.pcmag.com/reviews/obsidian\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePCMag 评测\u003c/a\u003e、\u003ca href=\"https://obsidian.md/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eObsidian 官网\u003c/a\u003e）\u003c/p\u003e\n\u003ch2 id=\"llm-wiki把知识库当作可编译系统\"\u003eLLM-Wiki：把知识库当作可编译系统\u003c/h2\u003e\n\u003ch3 id=\"karpathy-的那条推文让知识库变成了代码仓库-llm-wiki-来了\"\u003eKarpathy 的那条推文，让知识库变成了代码仓库 LLM-Wiki 来了\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXmJrbUAAxrDj?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003eKarpathy 发了一条推文，讲他怎么用 LLM 构建和管理个人知识库\u003c/p\u003e\n\u003cp\u003e他说，他现在大部分的 token 消耗，已经不是在写代码了，而是在「操控知识」\u003c/p\u003e\n\u003cp\u003e我反复读了几遍\u003c/p\u003e\n\u003cp\u003e他做的事和我这几个月在 Obsidian 里瞎折腾的东西，结构上撞了\u003c/p\u003e\n\u003cp\u003e但他用了一个词来概括，我之前一直没找到：编译（Compile）\u003c/p\u003e\n\u003cp\u003e把原始资料「编译」成结构化知识\u003c/p\u003e\n\u003cp\u003eObsidian Vault 是代码仓库，LLM 是编译器\u003c/p\u003e\n\u003cp\u003e这个类比一出来，好多之前说不清的感觉突然有名字了\u003c/p\u003e\n\u003cp\u003e如果你写过代码，Karpathy 这套东西你会秒懂\u003c/p\u003e\n\u003cp\u003e软件工程 → 知识库工程\u003c/p\u003e\n\u003cp\u003esrc/ → raw/（原始资料）\u003c/p\u003e\n\u003cp\u003ebuild/ → wiki/（知识条目）\u003c/p\u003e\n\u003cp\u003elogs/ → outputs/（问答归档）\u003c/p\u003e\n\u003cp\u003e编译器 → LLM\u003c/p\u003e\n\u003cp\u003eIDE → Obsidian\u003c/p\u003e\n\u003cp\u003eLint / CI → 健康检查\u003c/p\u003e\n\u003cp\u003e增量编译 → 只处理新增/变更的 raw\u003c/p\u003e\n\u003cp\u003e核心就三件事\u003c/p\u003e\n\u003cp\u003e分层：原始资料、编译产物、运行时输出，三层分开，你不会把 .class 文件和 .java 文件混在一起，笔记也一样\u003c/p\u003e\n\u003cp\u003e增量：不用每次全量重建，每天新进来几篇文章，增量编译就好\u003c/p\u003e\n\u003cp\u003e可追溯：每个知识条目能追到原始来源，每个摘要保留原文引用，出了问题能查到根源\u003c/p\u003e\n\u003cp\u003e不是「我好像在哪里看过这个说法」，是AI 告诉你，清清楚楚：「来源在 raw/articles/2026-03/ 那篇里，第三段」\u003c/p\u003e\n\u003ch3 id=\"他把自己的-vault-做成了什么样\"\u003e他把自己的 Vault 做成了什么样\u003c/h3\u003e\n\u003cp\u003e我把 Karpathy 的方法论落到了自己的 Vault 里\u003c/p\u003e\n\u003cp\u003e目录结构长这样\u003c/p\u003e\n\u003cp\u003eVault/ 下面分 raw/、wiki/、outputs/，还有 x/、公众号/、小红书/ 这些平台成品目录\u003c/p\u003e\n\u003cp\u003eraw/ 放原始资料，不改\u003c/p\u003e\n\u003cp\u003ewiki/ 放编译产物，LLM 维护，里面有 indexes、concepts、summaries\u003c/p\u003e\n\u003cp\u003eoutputs/ 放运行时输出\u003c/p\u003e\n\u003cp\u003e成品是给读者看的，wiki 是给自己看的，这两个不能混\u003c/p\u003e\n\u003cp\u003e摄取有三个入口：Web Clipper 管网页文章，模板里强制写入 source_url、author、published、tags；Podwise 管播客，自动转录加 AI 摘要；手动剪藏管 X 推文和零散内容\u003c/p\u003e\n\u003cp\u003e这步很重要：没有元数据的剪藏跟没剪一样\u003c/p\u003e\n\u003cp\u003e编译这步最关键\u003c/p\u003e\n\u003cp\u003e攒了 5 到 10 篇 raw 之后，就可以做第一次「编译」了\u003c/p\u003e\n\u003cp\u003e让 Claude 读一下 raw/articles/ 里最近新增的文章，为每篇生成摘要，提取概念，更新索引\u003c/p\u003e\n\u003cp\u003e具体干三件事：逐篇摘要、概念抽取、索引更新\u003c/p\u003e\n\u003cp\u003e质量怎么保证？靠 CLAUDE.md，里面写编译规范：摘要的结构模板、概念条目该有哪些字段、命名规则\u003c/p\u003e\n\u003cp\u003e第一次编译可能要花半小时到一小时，但跑通一次之后，后面增量编译很快\u003c/p\u003e\n\u003ch3 id=\"ai-output-落文件这是我见过最妙的设计\"\u003eAI Output 落文件，这是我见过最妙的设计\u003c/h3\u003e\n\u003cp\u003eKarpathy 方法论里有一个设计我觉得特别妙：AI Output 落文件\u003c/p\u003e\n\u003cp\u003e以前我用 AI 的方式是：问一个问题，得到答案，关掉\u003c/p\u003e\n\u003cp\u003e下次有类似问题再问一遍，答案全在聊天记录里，等于没有\u003c/p\u003e\n\u003cp\u003e现在改了：每次对知识库做复杂提问，结果以 Markdown 文件存到 AI outputs/\u003c/p\u003e\n\u003cp\u003e带问题、带时间、带来源、带结论、带不确定性\u003c/p\u003e\n\u003cp\u003e三个月下来积累了几十份这样的文件，它们本身就是知识条目，因为带推理过程和原始来源\u003c/p\u003e\n\u003cp\u003e你每跟 AI 聊一次，知识库就增加一层\u003c/p\u003e\n\u003cp\u003e在此基础上，我强制让 AI 只能输出到 AI outputs 中，这样 AI 的生成和我自己的想法不会搞混\u003c/p\u003e\n\u003cp\u003e这步是大部分人不会想到的\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXnw_bEAAWLrt?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e（我说实话，我自己以前也是聊完就关的那种人，这个习惯改了很久才改过来）\u003c/p\u003e\n\u003ch3 id=\"知识库也有技术债需要健康检查\"\u003e知识库也有技术债，需要健康检查\u003c/h3\u003e\n\u003cp\u003eKarpathy 的建议是定期做 Health Checks\u003c/p\u003e\n\u003cp\u003e检查三样东西：一致性、完整性、孤岛\u003c/p\u003e\n\u003cp\u003e一致性：wiki/concepts/ 里有没有定义冲突？比如「RAG」在一个地方叫「检索增强生成」，另一个地方变成了「向量数据库搜索」\u003c/p\u003e\n\u003cp\u003e完整性：哪些概念条目缺定义、缺例子、缺来源？\u003c/p\u003e\n\u003cp\u003e孤岛：哪些笔记入链出链都少于 2？该连到哪？\u003c/p\u003e\n\u003cp\u003e报告存到 outputs/health/，每周一份\u003c/p\u003e\n\u003cp\u003e做了几周之后最大的感受是：搜到一条笔记，敢直接用了\u003c/p\u003e\n\u003cp\u003e以前还得想想：这玩意靠谱吗\u003c/p\u003e\n\u003cp\u003e这个我可太懂了哈哈\u003c/p\u003e\n\u003ch3 id=\"别一上来就搭-rag\"\u003e别一上来就搭 RAG\u003c/h3\u003e\n\u003cp\u003e这点必须单独说，因为太多人在这儿走弯路\u003c/p\u003e\n\u003cp\u003e一提「AI + 笔记」，很多人的第一反应是搭 RAG：选 Embedding 模型、搭向量数据库、调切片策略\u003c/p\u003e\n\u003cp\u003e整套架构搞了一个月，笔记库里还是只有 20 篇文章\u003c/p\u003e\n\u003cp\u003eKarpathy 推荐这样做：知识库规模不大的时候（100 篇文章，40 万词左右），维护几个索引文件就够了\u003c/p\u003e\n\u003cp\u003eLLM 先读索引定位，再直接阅读相关内容，简单、可靠、零额外成本\u003c/p\u003e\n\u003cp\u003e等你的笔记真的过了一万条，搜东西开始找不到、找不全了，再考虑 RAG\u003c/p\u003e\n\u003cp\u003e先跑通流程，再优化基础设施\u003c/p\u003e\n\u003cp\u003e这道理工程师老师们应该比我懂，但轮到自己搭知识库的时候就忘了\u003c/p\u003e\n\u003cp\u003e现有知识，再有知识库\u003c/p\u003e\n\u003cp\u003eKarpathy 推文最后一句话是：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e这套东西目前仍然像一堆 hacky scripts，但有空间做成 incredible new product\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e我想到了 2006 年前的版本控制，那时候也是 svn、cvs、git 命令行，只有程序员在用\u003c/p\u003e\n\u003cp\u003e然后有人把它做成了 GitHub，整个协作方式都变了\u003c/p\u003e\n\u003cp\u003e个人知识库可能正在类似的节点\u003c/p\u003e\n\u003ch2 id=\"人与-ai-的边界不把思考外包\"\u003e人与 AI 的边界：不把思考外包\u003c/h2\u003e\n\u003ch3 id=\"kepano-的回复可能是-obsidian-最值得思考的人机共生案例\"\u003eKepano 的回复，可能是 Obsidian 最值得思考的人机共生案例\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXoeSaAAAc_QG?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e然后 Obsidian 的 CEO Kepano 紧接着回了一条，语气很温和，但说的话让我深思\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXpRnbcAAVE_l?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKeep your personal vault clean and create a messy vault for your agents\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e保持你的个人库干净，给 AI 创建一个脏乱的库\u003c/p\u003e\n\u003cp\u003e就这一句话\u003c/p\u003e\n\u003cp\u003e他说他偏好自己的 Obsidian vault 保持高信噪比，所有内容都有已知的来源\u003c/p\u003e\n\u003cp\u003e之前我也分享过：如果内容没有来源，那这个内容不记也罢\u003c/p\u003e\n\u003cp\u003e第二，他认为应该保持个人创建的产物和 agent 创建的产物之间的分离，防止用你无法溯源的想法「污染」你的主库\u003c/p\u003e\n\u003cp\u003e第三，如果你让两者混合太多，Obsidian 将不再是「你的思想」的代表\u003c/p\u003e\n\u003cp\u003e搜索、反向链接、图谱、快速切换，这些功能将不再只关于你的知识，而是变成了你和 AI 的混合物\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e这时我们就分不清到底是 AI 的知识库，还是属于你自己的知识库\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e第四，只有当 agent 工作流产出了真正有用的东西时，才把它引入主 vault，而且放进 clippings 文件夹\u003c/p\u003e\n\u003cp\u003e你看，他说的每一条都很温和\u003c/p\u003e\n\u003cp\u003e但合在一起，指向了一个非常尖锐的问题：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e如果你的知识库里都是 AI 写的东西，那它还是「你的」知识库吗？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这个问题击中了我\u003c/p\u003e\n\u003cp\u003e因为我在过去 6 年里，恰好把这条弯路，走了一个完整的轮回\u003c/p\u003e\n\u003ch3 id=\"当-ai-来了我差点又犯同样的错\"\u003e当 AI 来了，我差点又犯同样的错\u003c/h3\u003e\n\u003cp\u003e当 Claude Code 可以直接操作 Obsidian 的时候，当 Claudian 插件让你在笔记侧边栏就能和 AI 对话的时候，当各种 Skills、MCP、自动化工作流铺天盖地的时候——\u003c/p\u003e\n\u003cp\u003e我又兴奋了\u003c/p\u003e\n\u003cp\u003e我真的又兴奋了\u003c/p\u003e\n\u003cp\u003e我安装了 Claudian，让 AI 帮我整理笔记，发现笔记之间的隐藏关联，批量修复路径，生成知识地图，创建 MOC\u003c/p\u003e\n\u003cp\u003e3 分钟完成原本需要 30 分钟的事情\u003c/p\u003e\n\u003cp\u003e但某一天，我突然停下来了\u003c/p\u003e\n\u003cp\u003e因为我打开自己的笔记库，看着那些 AI 帮我写的摘要、AI 帮我建的链接、AI 帮我整理的结构——\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXqH0bQAANhpT?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e我发现，我不认识这些东西了\u003c/p\u003e\n\u003cp\u003e它们很整齐，很专业，逻辑很清晰\u003c/p\u003e\n\u003cp\u003e但它们不像是从我脑子里长出来的\u003c/p\u003e\n\u003cp\u003e就像小时候没写作业早上去教室抄一样，作业是写完了，但真的是我学会了吗\u003c/p\u003e\n\u003cp\u003e那一刻我突然理解了 Kepano 说的那句话：\u003c/p\u003e\n\u003cp\u003e如果混合太多，Obsidian 将不再是「你的思想」的代表\u003c/p\u003e\n\u003cp\u003e我在 flomo 里写下：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MjE3NjAyMDUz\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「不要直接把 AI 回答放进来，不要被各种酷炫的 ClaudeCode+Obsidian+Skills 搞到焦虑，本质上这种‘提高效率’就是在外包思考」\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"两种知识库两种哲学\"\u003e两种知识库，两种哲学\u003c/h3\u003e\n\u003cp\u003e所以你看，Karpathy 和 Kepano 这两条推文，表面上在聊工具和工作流，本质上在讨论一个更深的命题：\u003c/p\u003e\n\u003cp\u003e人和 AI 在知识管理中的边界，到底在哪？\u003c/p\u003e\n\u003cp\u003eKarpathy 的方案代表了一种思路：让 AI 成为知识的主人，你只需要喂数据，AI 帮你编译、整理、检索、生成，你几乎不碰 wiki 本身\u003c/p\u003e\n\u003cp\u003e这套方案对于研究型的知识管理来说，确实是降维打击\u003c/p\u003e\n\u003cp\u003e100 篇文章、40 万字的知识库，你一个人维护不过来，但 LLM 可以\u003c/p\u003e\n\u003cp\u003eKepano 的回应代表了另一种思路：你的知识库应该是你思想的镜子，每一条内容都应该有你能追溯的来源，AI 可以帮忙，但产物要隔离，只有经过你筛选的才能进入你的主库\u003c/p\u003e\n\u003cp\u003e这两种思路并不矛盾\u003c/p\u003e\n\u003cp\u003e但它们对应着两种完全不同的知识管理哲学\u003c/p\u003e\n\u003cp\u003e一种是效率优先——让 AI 帮你处理信息洪流，你专注于提问和决策\u003c/p\u003e\n\u003cp\u003e一种是思考优先——知识管理的核心价值在于思考的过程本身，整理和链接的动作就是在锻炼思维\u003c/p\u003e\n\u003cp\u003e而我自己，经过 6 年的折腾，我越来越倾向于后者\u003c/p\u003e\n\u003ch3 id=\"不把思考外包\"\u003e不把思考外包\u003c/h3\u003e\n\u003cp\u003e我在 flomo 里有一条记录：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MTc5NjQzMjM1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「flomo 是我个人知识管理体系中的‘收集站’，我也愿意称它为‘数据湖’。……我将所有维度的信息全部进行文本化压缩，并记录在 flomo 中，这个压缩，我只用人力，在现在这个时代看起来有些‘蠢’，你可以视作我在践行——‘不把思考外包’这个原则」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e是的，我知道 AI 可以帮我做这件事，而且做得更快更好\u003c/p\u003e\n\u003cp\u003e但问题在于——\u003c/p\u003e\n\u003cp\u003e当你把一段视频的核心观点用自己的话压缩成一句话的时候，那个压缩的过程，就是思考\u003c/p\u003e\n\u003cp\u003e当你给一条笔记打标签、建链接的时候，你需要思考这条笔记和哪些已有的知识相关，这个判断的过程，就是在训练你的认知框架\u003c/p\u003e\n\u003cp\u003e当你把散落的碎片串联成一篇文章的时候，那个组装的过程，就是创造\u003c/p\u003e\n\u003cp\u003e如果这些全部交给 AI，你确实省了时间\u003c/p\u003e\n\u003cp\u003e但你也省掉了思考本身\u003c/p\u003e\n\u003cp\u003e我还记得我在 flomo 里写过另一条：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MTc3MzkzOTk1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「知识管理不仅要解决信息的存取，更要关注知识的流动和创新——衡量知识管理是否成功的标准，不在于你整理了多少笔记，而在于这些知识是否帮助你更好地思考和行动」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e讲真的，这段话我自己回顾的时候都觉得写得挺好的\u003c/p\u003e\n\u003cp\u003e但更重要的是，这段话是我自己一个字一个字打出来的，经过了反复的琢磨和修改\u003c/p\u003e\n\u003cp\u003e它就长在我的脑子里\u003c/p\u003e\n\u003cp\u003e如果是 AI 帮我总结的，我可能看一眼就忘了\u003c/p\u003e\n\u003ch3 id=\"常青笔记我折腾-6-年找到的锚点\"\u003e常青笔记：我折腾 6 年找到的锚点\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXq8FaQAAH2M9?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e折腾了 6 年之后，我找到了一个锚点——常青笔记（Evergreen Notes）\u003c/p\u003e\n\u003cp\u003e这个概念是 Andy Matuschak 在 2020 年提出的，他是前苹果的 iOS 工程师，后来专门研究「工具如何辅助思考」这个课题\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://notes.andymatuschak.org/Evergreen_notes\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e常青笔记的核心理念很简单：\u003c/p\u003e\n\u003cp\u003e每一条笔记应该是概念性的——讲一个想法，一个洞察\u003c/p\u003e\n\u003cp\u003e应该是原子化的——一条只说一件事\u003c/p\u003e\n\u003cp\u003e应该通过链接而非标签来组织——让笔记和笔记之间建立有机的联系\u003c/p\u003e\n\u003cp\u003e允许有半成品，允许有草稿，但要持续地写、持续地链接、持续地发现关系\u003c/p\u003e\n\u003cp\u003e我给自己定了三条标准：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MjE2MDM4OTIy\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「1，必须有标题，标题加粗；2，必须讲清楚一件事，哪怕是一句话；3，必须有链接，可以没有标签」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e就这么简单\u003c/p\u003e\n\u003cp\u003e不需要 47 个插件，不需要花哨的主题皮肤，不需要 AI 帮你自动生成\u003c/p\u003e\n\u003cp\u003e我甚至在 Obsidian 里开启了安全模式，第三方插件一个不装\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MjE3NjAyMDUz\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「去写，去想，去输出——用最简单的方式，用最强大的软件，做最重要的事，这就是重器轻用」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e有一天我在 flomo 里写下了一个比喻，现在想想还挺得意的：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MjIxMzQyODI0\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「如果说第二大脑是金库，那常青笔记就是钞票，常青笔记的标准就是印钞机」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e你的知识库值多少钱，取决于你的「印钞机」——也就是你写常青笔记的标准——有多高\u003c/p\u003e\n\u003cp\u003e而写常青笔记这个动作本身，就是知识工作者的基本功，就像运动员练体能、音乐家练音阶一样：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MjE2MTkwODMy\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「写长青笔记，就是在做基本功，这是知识工作者的基本功」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这种基本功，AI 替代不了你\u003c/p\u003e\n\u003ch3 id=\"ai-不是没用但顺序很重要\"\u003eAI 不是没用，但顺序很重要\u003c/h3\u003e\n\u003cp\u003e我说的「不把思考外包」，并不意味着拒绝 AI\u003c/p\u003e\n\u003cp\u003eKarpathy 的方案对于特定场景来说确实是最优解\u003c/p\u003e\n\u003cp\u003e如果你要快速消化 100 篇论文、建立一个研究领域的知识地图，让 LLM 去编译和索引，效率比人工高出几个数量级\u003c/p\u003e\n\u003cp\u003e我自己也在用 AI 辅助知识管理\u003c/p\u003e\n\u003cp\u003e我在 flomo 里记过一条：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MjAwMzE2NTk4\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「AI 只会帮助那些能分辨内容好坏的人，而不是每个人——建立基础认知框架之后，再用 AI 开始直接帮助自己构建一些内容」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这才是关键——你得先有判断力，AI 才能成为放大器\u003c/p\u003e\n\u003cp\u003e如果你自己都不知道什么是好的知识、什么是有价值的洞察，AI 帮你整理出来的东西，你也分辨不了真伪\u003c/p\u003e\n\u003cp\u003e就像我之前构建的那套知识管理系统：信息源是水源，flomo 是水渠，YouMind 是水库，AI 知识库是水厂，输出渠道是水龙头\u003c/p\u003e\n\u003cp\u003e每一层都有它的作用，但水库必须有人看管，水厂必须有质检标准\u003c/p\u003e\n\u003cp\u003eAI 可以帮你过滤、加工、分装\u003c/p\u003e\n\u003cp\u003e但「什么水能喝」这个判断，得你自己来\u003c/p\u003e\n\u003cp\u003e所以我现在的做法是：Kepano 说的那个思路——分离\u003c/p\u003e\n\u003cp\u003e我的 Obsidian 主库只放我自己写的常青笔记，一字一句都是我的，每一条都有来源，每一个链接都是我手动建的\u003c/p\u003e\n\u003cp\u003eAI 的工作空间另开\u003c/p\u003e\n\u003cp\u003e只有当 AI 产出了真正让我觉得「嗯，这个洞察我认」的东西，我才会用自己的话重新写一遍，放进主库\u003c/p\u003e\n\u003cp\u003e重写这个动作很关键\u003c/p\u003e\n\u003cp\u003e因为重写的过程就是内化的过程\u003c/p\u003e\n\u003ch3 id=\"file-over-app文件优于应用\"\u003eFile over App，文件优于应用\u003c/h3\u003e\n\u003cp\u003eKepano 的另一个核心理念叫 File over App——文件优于应用\u003c/p\u003e\n\u003cp\u003e我第一次注意到这个概念，是有一天早上 flomo 崩溃了——我当时慌了，因为我几千条笔记全在上面\u003c/p\u003e\n\u003cp\u003e到后来我也经历过飞书崩了，以及昨天晚上 chatGPT、Claude、Grok 全部崩溃\u003c/p\u003e\n\u003cp\u003e那一刻我突然意识到：\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MTc5NzUzOTA3\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「所有软件，转瞬即逝，而文件则不同——你需要的是掌管你文件的可访问性」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这和 Karpathy 选择 Obsidian 作为前端的原因是一样的——所有数据都是本地的 .md 文件，不依赖任何云服务，不会因为某个公司倒闭而消失\u003c/p\u003e\n\u003cp\u003e你的知识，应该存在你自己的硬盘上，以你能打开、能阅读、能迁移的格式\u003c/p\u003e\n\u003cp\u003e这一点在 AI 时代尤其重要\u003c/p\u003e\n\u003cp\u003e因为 AI 工具的迭代速度太快了，今天的最佳实践明天可能就过时了\u003c/p\u003e\n\u003cp\u003e但 .md 文件不会过时\u003c/p\u003e\n\u003cp\u003e它从 2004 年 John Gruber 创建 Markdown 到现在已经 22 年了，依然是互联网上最通用的文本格式之一\u003c/p\u003e\n\u003cp\u003e（如果你感兴趣，也可以研究一下 Gruber 这个人，是个传奇）\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MTgwMzUxNzcx\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「AI 与软件功能越强大，越是需要极简的思维方式来应对」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e工具会变，格式会变，AI 模型会变\u003c/p\u003e\n\u003cp\u003e但文件不变，你的思考不变\u003c/p\u003e\n\u003ch2 id=\"ai-obsidian-的落地方案\"\u003eAI + Obsidian 的落地方案\u003c/h2\u003e\n\u003ch3 id=\"我收藏夹里那些-ai-obsidian-的实操\"\u003e我收藏夹里那些 AI + Obsidian 的实操\u003c/h3\u003e\n\u003cp\u003e除了 Karpathy 和 Kepano 的争论，我收藏夹里还有一堆实操向的内容，全是把 LLM Wiki 落地的方案\u003c/p\u003e\n\u003cp\u003e先说《告别手动整理：小白如何用 Obsidian 搭一个 AI 驱动的个人知识库》，\u003ca href=\"https://x.com/jinchenma_ai/article/2059842551218422004\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文\u003c/a\u003e 金尘马老师的\u003c/p\u003e\n\u003cp\u003e它把 AI 维护知识库总结成五件事：持续编译、跨资料连接、问答回流、巩固知识网、健康检查\u003c/p\u003e\n\u003cp\u003e五件事加起来一句话：你的知识库从死的变成活的\u003c/p\u003e\n\u003cp\u003e它给了一套可以直接复制的提示词，让 Codex 或 Claude Code 初始化目录结构、创建 index.md、log.md、AGENTS.md 或 CLAUDE.md\u003c/p\u003e\n\u003cp\u003e目录分三层：raw/ 像仓库，wiki/ 像书架，outputs/ 像工作台\u003c/p\u003e\n\u003cp\u003eAGENTS.md 像说明书：raw/ 不能改、每个判断要指向来源、不确定的信息要标「待核验」\u003c/p\u003e\n\u003cp\u003e日常只需要做四件事：投喂、提问、回流、检查\u003c/p\u003e\n\u003cp\u003e它还给了六个「别」：\u003c/p\u003e\n\u003cp\u003e别一上来搭 RAG\u003c/p\u003e\n\u003cp\u003e别只存正文不存来源\u003c/p\u003e\n\u003cp\u003e别把 raw 和 wiki 混在一起\u003c/p\u003e\n\u003cp\u003e别让 AI 覆盖原始资料\u003c/p\u003e\n\u003cp\u003e别把问答留在聊天记录里\u003c/p\u003e\n\u003cp\u003e别信 AI 编译一次就完事\u003c/p\u003e\n\u003cp\u003e每一条都是踩过坑才写得出来的\u003c/p\u003e\n\u003cp\u003e《一篇文章讲清楚，小白如何从 0 到 1 搭建自己的 AI 知识库》是同一作者的另一篇，\u003ca href=\"https://x.com/jinchenma_ai/article/2082495802640080899\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e它的核心观点是：AI 知识库是一套由文本文件、阅读软件、Agent、规则和真实任务组成的工作方式\u003c/p\u003e\n\u003cp\u003e一个存放文本文件的开放文件夹，一个可以操控这些文件的 Agent 工具，一份清楚的工作规则，再加上一个真实任务场景，就可以启动了\u003c/p\u003e\n\u003cp\u003e它特别强调：知识库要先服务一个明确的任务，再放入与它直接相关的资料\u003c/p\u003e\n\u003cp\u003e没有实际用途，文件夹整理得再漂亮，也只是换了一个地方存资料\u003c/p\u003e\n\u003cp\u003e（这句话我举双手赞成，我以前就干过这种事，建了二十个文件夹，一个都没用上）\u003c/p\u003e\n\u003cp\u003e《Hermes+Obsidian+LLM Wiki 搭建本地知识库》讲的是另一套方案，\u003ca href=\"https://x.com/rwayne/article/2054523563248611675\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eHermes Agent 是 Nous Research 开发的自主 AI 代理，内置学习循环，能从经验中创建技能、改进技能\u003c/p\u003e\n\u003cp\u003e它内置了 llm-wiki skill，你只需要说「把这篇文章写入知识库」，它就自动提取实体、提取概念、创建 Markdown 文件、添加双链、更新索引\u003c/p\u003e\n\u003cp\u003e这里有个重要的使用规则：只有当你明确要求的时候，Hermes 才会操作知识库\u003c/p\u003e\n\u003cp\u003e当你说「写入知识库」才会导入，当你说「结合知识库」才会检索\u003c/p\u003e\n\u003cp\u003e日常的普通对话，Hermes 不会主动去动你的知识库\u003c/p\u003e\n\u003cp\u003e这样做的好处是：你的知识库不会被无关的对话污染\u003c/p\u003e\n\u003cp\u003e《用 Codex + Obsidian 搭建自生长的个人知识库实战》是苍何写的，\u003ca href=\"https://x.com/canghe/article/2086372334089462208\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e它把系统分成三层：Raw 层保存原始资料，Wiki 层沉淀 AI 整理出的概念、实体和主题，Schema 层规定 AI 如何归档、更新、引用，以及怎么处理冲突\u003c/p\u003e\n\u003cp\u003e简单说：Raw 保存证据，Wiki 记录理解，Schema 负责定规则\u003c/p\u003e\n\u003cp\u003e它给了 AGENTS.md 的十条规则，从「处理新资料前先搜索已有页面」到「信息不足时暂停执行并向我提问」，非常完整\u003c/p\u003e\n\u003cp\u003e它还介绍了三种搭建方法：直接搭建法、claude-obsidian 插件法、WeSight 知识大脑\u003c/p\u003e\n\u003cp\u003eWeSight 把知识库初始化、资料入库、Wiki 更新和智能检索整合到 Obsidian 内部，让人在熟悉的笔记界面中完成整个流程\u003c/p\u003e\n\u003cp\u003e它还说了一句大实话：自生长并不意味着完全自动化\u003c/p\u003e\n\u003cp\u003e哪些资料值得保留、规则如何设定、关键结论能否成立，仍然需要人的判断\u003c/p\u003e\n\u003cp\u003eAI 更适合承担重复、耗时且结构化的维护工作\u003c/p\u003e\n\u003cp\u003e还有一篇《在终端里养一只会整理笔记的 AI 鲸鱼：Codewhale + Obsidian 知识库搭建指南》，这篇是我自己整理的\u003c/p\u003e\n\u003cp\u003eCodewhale 是一个跑在终端里的开源 AI 代理，前身叫 DeepSeek TUI\u003c/p\u003e\n\u003cp\u003e它能读取、修改、创建你磁盘上的文件，能执行 shell 命令，能搜索文件内容\u003c/p\u003e\n\u003cp\u003e它有三种模式：Plan 模式（只读）、Agent 模式（逐步确认）、YOLO 模式（全自动）\u003c/p\u003e\n\u003cp\u003e还有一个救命功能：/restore，AI 改错了什么，可以回滚到之前的状态\u003c/p\u003e\n\u003cp\u003e它还能通过 rules.md 让 AI 遵守你的规矩：文件名用中文、双链统一格式、不要删除重要笔记\u003c/p\u003e\n\u003cp\u003e这套组合的本质，是把你的知识库从「一个被动的笔记仓库」变成了「一个 AI 可以动手整理的活的工作区」\u003c/p\u003e\n\u003cp\u003e最后还有一篇《这是掌管 Obsidian 创作的神！》，\u003ca href=\"https://x.com/gengdaJ/article/2088831092379775198\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e原文在这里\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e作者打磨了一周，消耗了超过 100 亿 Tokens，做了一个镶嵌在 Obsidian 里面的超级助手 Ailu\u003c/p\u003e\n\u003cp\u003e集记忆、创作和发布一体，能一键上传文章到公众号、飞书和 X\u003c/p\u003e\n\u003cp\u003e虽然这种级别的工程化离普通人有点远，但它展示了 Obsidian 插件的上限：只要你想，你可以在里面造一个创作工作室\u003c/p\u003e\n\u003cp\u003e（我看完这篇的第一反应是：人家消耗 100 亿 tokens 做了个助手，我消耗 100 亿 tokens 可能只是在问 AI 为什么我的插件装不上，人与人之间的差距啊）\u003c/p\u003e\n\u003ch2 id=\"值不值得用选择劝退与结论\"\u003e值不值得用：选择、劝退与结论\u003c/h2\u003e\n\u003ch3 id=\"所以obsidian-到底值不值得折腾\"\u003e所以，Obsidian 到底值不值得折腾？\u003c/h3\u003e\n\u003cp\u003e聊了这么多，回到开头那个问题\u003c/p\u003e\n\u003cp\u003e我的答案是：值得，但别往「折腾」的方向值得\u003c/p\u003e\n\u003cp\u003eObsidian 的上限极高，它是实践卡片盒笔记法和常青笔记的最佳数字工具之一\u003c/p\u003e\n\u003cp\u003e双向链接、图谱视图和本地 Markdown 存储，为常青笔记的长期维护提供了理想的技术基础\u003c/p\u003e\n\u003cp\u003e但它也有明显的短板：协作能力薄弱、学习曲线陡峭、移动端体验一般、没有 Web 版\u003c/p\u003e\n\u003cp\u003e更重要的是，过度定制是一个真实的陷阱\u003c/p\u003e\n\u003cp\u003e2500+ 插件意味着无尽的配置可能性，很多人陷入「折腾工具」而非「使用工具」的困境\u003c/p\u003e\n\u003cp\u003e所以我现在对 Obsidian 的态度是：重器轻用\u003c/p\u003e\n\u003cp\u003e用最简单的方式，用最强大的软件，做最重要的事\u003c/p\u003e\n\u003ch3 id=\"劝退这几种人别用-obsidian\"\u003e劝退：这几种人，别用 Obsidian\u003c/h3\u003e\n\u003cp\u003e说点劝退的话，敢劝退比夸十句都真\u003c/p\u003e\n\u003cp\u003e如果你只想要零门槛、打开就写的笔记软件，Obsidian 能用，就是无法发挥出它完整的能力\u003c/p\u003e\n\u003cp\u003e它的学习曲线是真的陡，你要先理解 Markdown、再配置插件、再建立自己的工作流\u003c/p\u003e\n\u003cp\u003ePCMag 的评测说得挺客气：a highly adaptable and free note-taking app for power users who don‘t need collaboration features\u003c/p\u003e\n\u003cp\u003e翻译过来就是：这是给不需要协作的高级用户用的，普通人可能会被劝退\u003c/p\u003e\n\u003cp\u003e如果你需要团队实时协作，别用 Obsidian\u003c/p\u003e\n\u003cp\u003e它本质上是单人工具，虽然可以通过 Git 或共享文件夹实现粗糙的多人协作，但远不及 Notion 的实时协作体验\u003c/p\u003e\n\u003cp\u003e如果你只想快速记录碎片想法，Obsidian 也不是最优解\u003c/p\u003e\n\u003cp\u003e走路时记一个想法，flomo 这种轻量工具比它便捷多了\u003c/p\u003e\n\u003cp\u003eObsidian 更适合的场景是：常青笔记的最终归宿\u003c/p\u003e\n\u003cp\u003e那些经过 flomo 捕获、经过思考打磨、值得长期保留和持续更新的知识节点，最终沉淀在 Obsidian 的 Vault 里\u003c/p\u003e\n\u003cp\u003e如果你没有输出的打算，那用什么工具都一样，别折腾\u003c/p\u003e\n\u003cp\u003e还有，如果你是个完美主义者，总想先设计好完美的文件夹结构再开始写笔记，那 Obsidian 会把你逼疯\u003c/p\u003e\n\u003cp\u003e先写再整理，先跑通最小流程，这是所有教程的共识\u003c/p\u003e\n\u003cp\u003e笔记系统不是一次设计完成的作品，它应该随着你的内容和习惯逐步修改\u003c/p\u003e\n\u003ch3 id=\"竞品点名说点公道话\"\u003e竞品点名，说点公道话\u003c/h3\u003e\n\u003cp\u003eNotion 很强，强在多维表格、强在团队协作、强在模板生态\u003c/p\u003e\n\u003cp\u003e但它的数据在云端，网络卡顿的时候，你可能连自己写的字都打不出来\u003c/p\u003e\n\u003cp\u003e而且它的 AI 是原生的，$10/用户/月，贵\u003c/p\u003e\n\u003cp\u003eObsidian 的插件生态天下无敌，但它只帮你存，不帮你输出\u003c/p\u003e\n\u003cp\u003eLogseq 很接近，块级大纲、开源、免费\u003c/p\u003e\n\u003cp\u003e但它更适合碎片化捕获，长文写作和结构化文档还是 Obsidian 顺手\u003c/p\u003e\n\u003cp\u003eRoam Research 是双向链接的引爆者，但这个价格和云端存储，让它在用户规模上输给了免费的 Obsidian\u003c/p\u003e\n\u003cp\u003eflomo 我天天用，它是最好的收集站，但它不是知识库，它是数据湖\u003c/p\u003e\n\u003cp\u003e一句话总结：没有完美的笔记工具，只有适合你的工作流\u003c/p\u003e\n\u003cp\u003e（我知道有人会问 YouMind 呢，毕竟我天天用——这么说吧，我的系统里每层工具干每层的活，Obsidian 是常青笔记的最终归宿，这是它最不可替代的位置）\u003c/p\u003e\n\u003ch3 id=\"回到最初的问题\"\u003e回到最初的问题\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXrymacAE76DQ?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003cp\u003e所以回到开头那个问题：\u003c/p\u003e\n\u003cp\u003e当 AI 可以替你整理一切的时候，你自己还需要思考吗？\u003c/p\u003e\n\u003cp\u003e我的答案是：你比以前更需要\u003c/p\u003e\n\u003cp\u003e因为当信息的获取成本趋近于零、整理成本趋近于零、甚至生成成本都趋近于零的时候，真正稀缺的东西变了\u003c/p\u003e\n\u003cp\u003e以前稀缺的是信息本身，谁有信息谁就有优势\u003c/p\u003e\n\u003cp\u003e后来稀缺的是整理能力，谁能把信息结构化谁就赢了\u003c/p\u003e\n\u003cp\u003e现在呢？AI 可以帮你获取、整理、生成\u003c/p\u003e\n\u003cp\u003e那什么变得稀缺了？判断力\u003c/p\u003e\n\u003cp\u003e知道什么信息值得留下，什么应该丢掉\u003c/p\u003e\n\u003cp\u003e知道哪个观点是深刻的，哪个只是看起来深刻\u003c/p\u003e\n\u003cp\u003e知道两个看似无关的概念之间，存在一条隐秘的连接\u003c/p\u003e\n\u003cp\u003e这些能力，来自于你日复一日地写、想、链接、输出\u003c/p\u003e\n\u003cp\u003e来自于你坐在那里，面对一个模糊的想法，把它掰开揉碎，用自己的语言重新组装\u003c/p\u003e\n\u003cp\u003e来自于你在整理笔记的时候，突然看到两条写于不同时间的记录，它们之间产生了某种化学反应——\u003c/p\u003e\n\u003cp\u003e那个「啊哈」的瞬间\u003c/p\u003e\n\u003cp\u003e这种瞬间，AI 给不了你\u003c/p\u003e\n\u003cp\u003e它可以帮你找到那两条笔记，但那个连接的意义，那个顿悟的火花，只能在你自己的神经元里点燃\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://v.flomoapp.com/mine/?memo_id=MjE3NDUzNjY0\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e「你的第二大脑不是仓库，是厨房」\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e仓库只管存放，厨房才管创造\u003c/p\u003e\n\u003cp\u003e而在厨房里站着的那个人，只能是你\u003c/p\u003e\n\u003ch3 id=\"最后说点没用的\"\u003e最后说点没用的\u003c/h3\u003e\n\u003cp\u003e这篇文章写到最后，我发现一个有意思的事\u003c/p\u003e\n\u003cp\u003e我收藏的那些 Obsidian 内容，入门教程占了三分之一，AI 实操占了三分之一，剩下的三分之一，全是「别折腾」的劝诫\u003c/p\u003e\n\u003cp\u003e连我自己写的文章，最后也落在了常青笔记和重器轻用上\u003c/p\u003e\n\u003cp\u003e这说明\u003c/p\u003e\n\u003cp\u003e这个工具圈的共识正在形成：工具只是手段，思考才是目的\u003c/p\u003e\n\u003cp\u003eObsidian 值不值得折腾，取决于你折腾完之后，有没有留下真正属于你的东西\u003c/p\u003e\n\u003cp\u003e如果留下了，它就是金库\u003c/p\u003e\n\u003cp\u003e如果只是折腾，它就是一个越来越大的仓库\u003c/p\u003e\n\u003cp\u003e我准备把我自己现在在用的 Obsidian 库公开发布了，包含常用插件、精选主题、Agent 系统提示词案例、记忆存档案例、还有自定义 CSS\u003c/p\u003e\n\u003cp\u003e发布之前会在铁粉群里先内部测试一下\u003c/p\u003e\n\u003cp\u003e如果你想围观，评论区告诉我，我挺好奇的\u003c/p\u003e\n\u003cp\u003e也想知道：\u003c/p\u003e\n\u003cp\u003e你的 Obsidian 里，现在躺着几篇笔记？\u003c/p\u003e\n\u003cp\u003e有几篇是你自己一个字一个字写出来的？\u003c/p\u003e\n\u003cp\u003e你的图谱长什么样？\u003c/p\u003e\n\u003cp\u003e评论区见\u003c/p\u003e\n\u003cp\u003e我是 Jackywine， AI 领域创作者，AI 产品设计师，Obsidian VIP，公众号同名认证科技自媒体，专注：AIGC、Agent 产品+设计、国产LLM 实测、AI 时代的个人 IP 以及品牌打造\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRWXsozaoAAas0X?format=jpg\u0026amp;name=900x900\"\u003e\u003c/p\u003e\n\u003ch3 id=\"资料来源汇总\"\u003e资料来源汇总\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/ai_suxiaole/article/2080133894222057612\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e2026 年最强 Obsidian 保姆级教程\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/ai_xiaomu/article/2057365060977390037\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eObsidian 小白完整入门教程\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/cheery9998/article/2023662846048170464\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eObsidian 零基础大白话教程\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/AdrianPunk115/article/2087046395949973788\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eObsidian 别只装完就吃灰\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/bozhou_ai/article/2011738838767423983\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eObsidian 零基础教程（泊舟）\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://forum-zh.obsidian.md/t/topic/3222\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e不要在到处找 Obsidian 的入门教程了\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/yanhua1010/article/2039966047378583815\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e用 LLM + Obsidian 构建个人知识库（Karpathy 工作流）\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/jinchenma_ai/article/2059842551218422004\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e告别手动整理：AI 驱动的个人知识库\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/jinchenma_ai/article/2082495802640080899\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e一篇文章讲清楚，小白如何从 0 到 1 搭建 AI 知识库\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/rwayne/article/2054523563248611675\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHermes+Obsidian+LLM Wiki 搭建本地知识库\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/canghe/article/2086372334089462208\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e用 Codex + Obsidian 搭建自生长的个人知识库实战\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/gengdaJ/article/2088831092379775198\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e这是掌管 Obsidian 创作的神（Ailu）\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/
