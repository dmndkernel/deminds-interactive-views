03e files are not supported.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The focus is on content and organization. Complex Word layouts, including headers, footers, columns, and floating objects, may not carry over faithfully. Older `.doc` files are not supported.","sourceFormat":"markdown"},"note:sha256:249cf12e6934082178d9786e406a029580dfece0aedc343c3d1677cbb584b03c":{"html":"\u003cp\u003eBefore sharing or publishing, make sure the text, images, and other material are suitable for others to see and that you have permission to share them. An Interactive View is a read-only file; it does not provide encryption or access controls.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Before sharing or publishing, make sure the text, images, and other material are suitable for others to see and that you have permission to share them. An Interactive View is a read-only file; it does not provide encryption or access controls.","sourceFormat":"markdown"},"note:sha256:275198695b710ccb0e670085b459ae8c73b6840f5331c91d99ced3c082c1fbb5":{"html":"\u003cp\u003eThese capabilities apply to recognized arXiv HTML structures. They do not imply the same fidelity for arbitrary HTML, DOCX, PDF, or TeX source files. Citation graphs and automatic paper-version updates are not included.\u003c/p\u003e\n\u003cp\u003eSome arXiv import links point to the HTML version even when their path contains \u003ccode\u003epdf\u003c/code\u003e. If the HTML version is unavailable, DeMinds does not automatically switch to PDF extraction, an abstract-only import, or OCR.\u003c/p\u003e\n","kind":"html","rawMarkdown":"These capabilities apply to recognized arXiv HTML structures. They do not imply the same fidelity for arbitrary HTML, DOCX, PDF, or TeX source files. Citation graphs and automatic paper-version updates are not included.\n\nSome arXiv import links point to the HTML version even when their path contains `pdf`. If the HTML version is unavailable, DeMinds does not automatically switch to PDF extraction, an abstract-only import, or OCR.","sourceFormat":"markdown"},"note:sha256:2bc8b50362eadfe608754bd437989e1cc0453566154dd7173583762a42a5e1d7":{"html":"\u003cp\u003eIf you are new to DeMinds, start with “Files and knowledge bases” or “Web and online content” to find the material you have. Then explore “Content and structure” to see what becomes a branch, stays in the body, or appears in a Note.\u003c/p\u003e\n\u003cp\u003eIf you already have content in DeMinds, “Content Sources and updates” and “Save, export, and continue” explain how to keep up with a source, take an editable copy elsewhere, or share a file for others to read.\u003c/p\u003e\n\u003cp\u003eFor each type of content, consider four questions: \u003cstrong\u003eWhat can I import? What carries over? How is it organized? What can I do next?\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"If you are new to DeMinds, start with “Files and knowledge bases” or “Web and online content” to find the material you have. Then explore “Content and structure” to see what becomes a branch, stays in the body, or appears in a Note.\n\nIf you already have content in DeMinds, “Content Sources and updates” and “Save, export, and continue” explain how to keep up with a source, take an editable copy elsewhere, or share a file for others to read.\n\nFor each type of content, consider four questions: **What can I import? What carries over? How is it organized? What can I do next?**","sourceFormat":"markdown"},"note:sha256:2fc1c350dac5874fd6094fdadbc0043d27d0b727c676a0ab7bbf5cdabd2fa4dd":{"html":"\u003cp\u003eFor each format, DeMinds aims to retain the main structure, node content, Notes, images, and links. It cannot reproduce every complex layout, proprietary style, or special object.\u003c/p\u003e\n\u003cp\u003eEdits apply to your Markdown Working Copy. They do not modify the external MindNode, XMind, or \u003ccode\u003e.mm\u003c/code\u003e file. You should not expect every change to export back into the original app's format.\u003c/p\u003e\n","kind":"html","rawMarkdown":"For each format, DeMinds aims to retain the main structure, node content, Notes, images, and links. It cannot reproduce every complex layout, proprietary style, or special object.\n\nEdits apply to your Markdown Working Copy. They do not modify the external MindNode, XMind, or `.mm` file. You should not expect every change to export back into the original app's format.","sourceFormat":"markdown"},"note:sha256:3519200fb2ca29888081926a01bca33084ea58c05ab7731fd61bbcda147bc5e7":{"html":"\u003cp\u003eSaved projects can be reopened and edited; Continue Working does more than list recently opened files. The number of projects you can retain depends on your plan.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Saved projects can be reopened and edited; Continue Working does more than list recently opened files. The number of projects you can retain depends on your plan.","sourceFormat":"markdown"},"note:sha256:3db7c4ef853e776606eb26bb26679224be5c4b13c02013737cbb586c9469c328":{"html":"\u003cp\u003eSome sources, including WeChat Official Account articles, Zhihu, Medium, Substack, and Sspai, have tailored rules for identifying and cleaning up articles. X Articles that display their text without sign-in also have dedicated handling.\u003c/p\u003e\n\u003cp\u003eThis applies to eligible articles, not every page on those sites. Home pages, profiles, and search results may not be importable.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Some sources, including WeChat Official Account articles, Zhihu, Medium, Substack, and Sspai, have tailored rules for identifying and cleaning up articles. X Articles that display their text without sign-in also have dedicated handling.\n\nThis applies to eligible articles, not every page on those sites. Home pages, profiles, and search results may not be importable.","sourceFormat":"markdown"},"note:sha256:3e055f5ca683c8e198317e8662a7391c3ff162766ae7e5bd6f239c66dfdaaaeb":{"html":"\u003cp\u003ePublic links to identifiable Markdown, text, HTML, DOCX, XMind, MindNode, FreeMind, and OPML files can use the corresponding import process after type, size, and download checks.\u003c/p\u003e\n\u003cp\u003eThis does not cover every download page, private link, or cloud-storage sharing link. GitHub support does not include private repository sign-in, browsing an entire repository, or importing all its files recursively.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Public links to identifiable Markdown, text, HTML, DOCX, XMind, MindNode, FreeMind, and OPML files can use the corresponding import process after type, size, and download checks.\n\nThis does not cover every download page, private link, or cloud-storage sharing link. GitHub support does not include private repository sign-in, browsing an entire repository, or importing all its files recursively.","sourceFormat":"markdown"},"note:sha256:3f56db3b62b9bcbb0f8feee3a50fbde96a2802d7e5fae434bd1b7892e7385d8e":{"html":"\u003cp\u003eAn imported mind map can become editable Markdown and a Universal Mind Map. The Universal Mind Map gives you a consistent way to read, review structure, and continue working across formats.\u003c/p\u003e\n\u003cp\u003eWith DeMinds Plus, mind map files whose original data can be recovered can also offer an Original Mind Map view. It shows the structure and visual presentation DeMinds can reconstruct from the source. Markdown and web articles do not have an Original Mind Map view.\u003c/p\u003e\n","kind":"html","rawMarkdown":"An imported mind map can become editable Markdown and a Universal Mind Map. The Universal Mind Map gives you a consistent way to read, review structure, and continue working across formats.\n\nWith DeMinds Plus, mind map files whose original data can be recovered can also offer an Original Mind Map view. It shows the structure and visual presentation DeMinds can reconstruct from the source. Markdown and web articles do not have an Original Mind Map view.","sourceFormat":"markdown"},"note:sha256:45d5fc72a53f1a70f4964979935360f6545ec8a33d562bdee64b83b6410582fa":{"html":"\u003cp\u003eValuable AI content can become a project you return to: explore it in the Universal Mind Map, read and edit the Markdown, or export it for further use.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Valuable AI content can become a project you return to: explore it in the Universal Mind Map, read and edit the Markdown, or export it for further use.","sourceFormat":"markdown"},"note:sha256:46bdcd5563a9083a8a5865ad271cde7ff93707ca8d711c80762efa2772acdcaa":{"html":"\u003cp\u003eBring headings, paragraphs, lists, convertible tables, images, and other supported content into a Markdown workflow. DeMinds also keeps the imported DOCX as the original source.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Bring headings, paragraphs, lists, convertible tables, images, and other supported content into a Markdown workflow. DeMinds also keeps the imported DOCX as the original source.","sourceFormat":"markdown"},"note:sha256:4a542dc4076d54cea7a0f7616d8ac091b7985b2a76487896da36cd0a2248c20f":{"html":"\u003cp\u003eDeMinds prepares files and accepts them when you bring them back. It does not automatically upload your content, call an external AI service, or fetch the result. You choose the tool, the task, and whether to apply the returned changes.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds prepares files and accepts them when you bring them back. It does not automatically upload your content, call an external AI service, or fetch the result. You choose the tool, the task, and whether to apply the returned changes.","sourceFormat":"markdown"},"note:sha256:4b5ec27a11a9530b5757077e02c820bacd6dddf3b9c735c0221db83b34f1629b":{"html":"\u003cp\u003eLocal images and images within a package can be displayed when DeMinds can resolve them, and included in exports that support bundling those assets. Missing files, unresolved paths, or unsupported assets may prevent an image from appearing.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Local images and images within a package can be displayed when DeMinds can resolve them, and included in exports that support bundling those assets. Missing files, unresolved paths, or unsupported assets may prevent an image from appearing.","sourceFormat":"markdown"},"note:sha256:4fdffea410ea25a86e7f02d68d6a83d6ead875b70373225d9ee8fc86851ec1ff":{"html":"\u003cp\u003eOn iPhone, iPad, and Designed for iPad on Mac, Web Import Preview lets you view a page before confirming the import.\u003c/p\u003e\n\u003cp\u003eAccess restrictions, complex page loading, and third-party sign-in requirements can still affect the result. Your Safari sign-in sessions do not automatically carry over to DeMinds, and signing in within the preview is not guaranteed to work on every site.\u003c/p\u003e\n","kind":"html","rawMarkdown":"On iPhone, iPad, and Designed for iPad on Mac, Web Import Preview lets you view a page before confirming the import.\n\nAccess restrictions, complex page loading, and third-party sign-in requirements can still affect the result. Your Safari sign-in sessions do not automatically carry over to DeMinds, and signing in within the preview is not guaranteed to work on every site.","sourceFormat":"markdown"},"note:sha256:51664256b5fe5c2c0c80ed6b5df158b84a1f164c1aa656626ca037a889b96190":{"html":"\u003cp\u003eZIP files and folders are containers. DeMinds examines their contents to identify a Markdown Package, mind map package, Workspace Backup, or other supported material, then opens it through the appropriate import process.\u003c/p\u003e\n\u003cp\u003ePutting an unsupported file in a ZIP does not make it supported. Restoring a Workspace Backup also serves a different purpose from importing a document; Workspace Backup import requires Plus.\u003c/p\u003e\n","kind":"html","rawMarkdown":"ZIP files and folders are containers. DeMinds examines their contents to identify a Markdown Package, mind map package, Workspace Backup, or other supported material, then opens it through the appropriate import process.\n\nPutting an unsupported file in a ZIP does not make it supported. Restoring a Workspace Backup also serves a different purpose from importing a document; Workspace Backup import requires Plus.","sourceFormat":"markdown"},"note:sha256:5b0243cdf2306bf48e9d6a9eba7090bd998155f76793bd88a0fff7b70b8b060d":{"html":"\u003cp\u003eOn iPhone, iPad, and compatible Macs, export your current Markdown document as a continuous PDF in Reading mode or a paginated PDF in Print mode. Available in Standard.\u003c/p\u003e\n\u003cp\u003ePDF export does not imply support for general PDF import, scanned-document recognition, or OCR.\u003c/p\u003e\n","kind":"html","rawMarkdown":"On iPhone, iPad, and compatible Macs, export your current Markdown document as a continuous PDF in Reading mode or a paginated PDF in Print mode. Available in Standard.\n\nPDF export does not imply support for general PDF import, scanned-document recognition, or OCR.","sourceFormat":"markdown"},"note:sha256:5d4ce216356ed6089401b595ae5d3a1138d3045f52406b3dcd813109ec5fa9d9":{"html":"\u003cp\u003eDeMinds handles public READMEs and Markdown documents, including heading anchors, relative image paths, and recognized links to related documents. Opening a document link processes that target; it does not scan the entire repository.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds handles public READMEs and Markdown documents, including heading anchors, relative image paths, and recognized links to related documents. Opening a document link processes that target; it does not scan the entire repository.","sourceFormat":"markdown"},"note:sha256:626d5e53a688f9a84a631435a6c64abb960b57c6f9bb03d8ee257c65fd0218a7":{"html":"\u003cp\u003eLong paragraphs, quotations, and detailed explanations stay in the body or in node Notes, keeping the main map manageable. Suitable Notes can also be explored in their own structure view.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Long paragraphs, quotations, and detailed explanations stay in the body or in node Notes, keeping the main map manageable. Suitable Notes can also be explored in their own structure view.","sourceFormat":"markdown"},"note:sha256:65dbee21477ce3704c0f6b2aaa83eaf02d7641325864c28ebcdae3465ce81010":{"html":"\u003cp\u003eA reference to an attachment does not guarantee that the file can be transferred in full, played offline, or included in every export format.\u003c/p\u003e\n\u003cp\u003ePreview availability depends on the assets, their formats, and your device or browser. This does not imply automatic media downloading, transcoding, repair, or recognition of text inside images.\u003c/p\u003e\n","kind":"html","rawMarkdown":"A reference to an attachment does not guarantee that the file can be transferred in full, played offline, or included in every export format.\n\nPreview availability depends on the assets, their formats, and your device or browser. This does not imply automatic media downloading, transcoding, repair, or recognition of text inside images.","sourceFormat":"markdown"},"note:sha256:66697e3ea96d7fc1edfd1c11ab1b9adecb5c21bd4cad8892d516bff22502541c":{"html":"\u003cp\u003eUse the file or folder picker available on your platform to open supported content. The file provider, package type, and availability of cloud files can affect whether DeMinds can read it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Use the file or folder picker available on your platform to open supported content. The file provider, package type, and availability of cloud files can affect whether DeMinds can read it.","sourceFormat":"markdown"},"note:sha256:69172425e8c731e73ff0b639d007f9524bb07e4e9fe1d9a7377fafb00f7d33af":{"html":"\u003cp\u003eThe import is limited to what the shared page makes public and what DeMinds can recognize. ChatGPT supports both full-conversation shares and certain public single-response shares; a single response is not expanded into a full conversation.\u003c/p\u003e\n\u003cp\u003eCode, lists, tables, and common math expressions are handled according to the content structure DeMinds can identify.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The import is limited to what the shared page makes public and what DeMinds can recognize. ChatGPT supports both full-conversation shares and certain public single-response shares; a single response is not expanded into a full conversation.\n\nCode, lists, tables, and common math expressions are handled according to the content structure DeMinds can identify.","sourceFormat":"markdown"},"note:sha256:6bdb84229cfffa3a9615a1bb5845a3188a76637c3db1df0c3712ca06aae8cb6a":{"html":"\u003cp\u003eTables that can be reliably reconstructed in standard Markdown use that format. Some tables with merged cells, multiple header levels, or grouped content are retained in a richer form that DeMinds can display.\u003c/p\u003e\n\u003cp\u003eThese complex tables are primarily read in Markdown Preview and Interactive View; each cell does not become a separate map node. Other Markdown tools may not display these special structures in the same way.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Tables that can be reliably reconstructed in standard Markdown use that format. Some tables with merged cells, multiple header levels, or grouped content are retained in a richer form that DeMinds can display.\n\nThese complex tables are primarily read in Markdown Preview and Interactive View; each cell does not become a separate map node. Other Markdown tools may not display these special structures in the same way.","sourceFormat":"markdown"},"note:sha256:6c5497f60dba3bd244937d6529864a34c4601f245f5aea24eb58279e1282225a":{"html":"\u003cp\u003eDeMinds imports compatible \u003ccode\u003e.html\u003c/code\u003e and \u003ccode\u003e.htm\u003c/code\u003e files. It recognizes ordinary HTML, web articles, or AI Share Pages, cleans up the content, and converts it to Markdown.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds imports compatible `.html` and `.htm` files. It recognizes ordinary HTML, web articles, or AI Share Pages, cleans up the content, and converts it to Markdown.","sourceFormat":"markdown"},"note:sha256:6ccb108311b372a513af633efbdb61f535e366650b15ba2215407e2b016c461b":{"html":"\u003cp\u003eTake your current Markdown into another editor or workflow. Image references are retained, but the full asset folder is not included automatically. Available in Standard.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Take your current Markdown into another editor or workflow. Image references are retained, but the full asset folder is not included automatically. Available in Standard.","sourceFormat":"markdown"},"note:sha256:6d9ab34a19c384787cfd63ba1a4e6f9d6310b5ed99c51c1afc698ea72551db6b":{"html":"\u003cp\u003ePublicly accessible articles, blog posts, technical writing, and some documentation pages are usually a good fit when the full text is available and clearly structured.\u003c/p\u003e\n\u003cp\u003eDeMinds looks for the title, author, date, body, images, and links while reducing clutter from navigation, recommendations, and page decoration.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Publicly accessible articles, blog posts, technical writing, and some documentation pages are usually a good fit when the full text is available and clearly structured.\n\nDeMinds looks for the title, author, date, body, images, and links while reducing clutter from navigation, recommendations, and page decoration.","sourceFormat":"markdown"},"note:sha256:6e5829f293645416e8dc45a534051e9054983c99f2c183c54b341efccf1e5fc0":{"html":"\u003cp\u003eDeMinds retains the title, authors, affiliations, arXiv identifier, abstract, references, and appendices it can recognize, helping you follow the paper's organization.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds retains the title, authors, affiliations, arXiv identifier, abstract, references, and appendices it can recognize, helping you follow the paper's organization.","sourceFormat":"markdown"},"note:sha256:748df9060efd65da06b280bf4eebcec1a248bb6c827767e7c6474a6ea5c9f1cc":{"html":"\u003cp\u003eThe core workflow does not require a DeMinds account. The web app uses local browser storage. On iPhone, iPad, and compatible Macs, you can choose a Local Workspace or an iCloud Workspace.\u003c/p\u003e\n\u003cp\u003eLocal-first does not mean every feature works offline. Online imports, remote images, Content Sources, and iCloud still require the relevant network or system services.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The core workflow does not require a DeMinds account. The web app uses local browser storage. On iPhone, iPad, and compatible Macs, you can choose a Local Workspace or an iCloud Workspace.\n\nLocal-first does not mean every feature works offline. Online imports, remote images, Content Sources, and iCloud still require the relevant network or system services.","sourceFormat":"markdown"},"note:sha256:76fa7157d50fcb3fdbb0020fcc6463a65ff58ff2c8e061c203480ef91fea9c53":{"html":"\u003cp\u003eRecognized links between sections, figures, tables, algorithms, and references are preserved, helping you move through the paper and between the map and the text.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Recognized links between sections, figures, tables, algorithms, and references are preserved, helping you move through the paper and between the map and the text.","sourceFormat":"markdown"},"note:sha256:7867469092e7a7ebfd47c6ec219268feb79da940c7c7b5a9b70f8df2191e2e06":{"html":"\u003cp\u003eOrdinary tables are mainly read in the body and Notes. Complex tables are handled according to their source and what can be recovered; the arXiv-specific support does not extend to complex tables in every format.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Ordinary tables are mainly read in the body and Notes. Complex tables are handled according to their source and what can be recovered; the arXiv-specific support does not extend to complex tables in every format.","sourceFormat":"markdown"},"note:sha256:7a5390d279a27d5a9c090adfb629f17cb579f697762499776b5cbb2ceb03508d":{"html":"\u003cp\u003eDeMinds reads \u003ccode\u003e.md\u003c/code\u003e, \u003ccode\u003e.markdown\u003c/code\u003e, and \u003ccode\u003e.txt\u003c/code\u003e files. Markdown is a natural fit for the app and the main format used to keep working with content from other sources. Text files are interpreted from their contents; the \u003ccode\u003e.txt\u003c/code\u003e extension alone does not give them a hierarchy.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds reads `.md`, `.markdown`, and `.txt` files. Markdown is a natural fit for the app and the main format used to keep working with content from other sources. Text files are interpreted from their contents; the `.txt` extension alone does not give them a hierarchy.","sourceFormat":"markdown"},"note:sha256:86ab0e0437ba86b37af1faf60523f6dee96036096c6985e33209280392ed2932":{"html":"\u003cp\u003eTake the Markdown together with local images and other assets that can be packaged, preserving applicable relative paths. A valid bundle exported from the current project can also carry information that DeMinds uses to recognize the project when the work returns. Available in Standard.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Take the Markdown together with local images and other assets that can be packaged, preserving applicable relative paths. A valid bundle exported from the current project can also carry information that DeMinds uses to recognize the project when the work returns. Available in Standard.","sourceFormat":"markdown"},"note:sha256:915e5164326819109ba6f5d63ff4386bc530ac1f4f947f3d7548d9f00e9ab334":{"html":"\u003cp\u003eDeMinds uses the headings, hierarchy, lists, paragraphs, and links it can recognize in the original. A clearly organized source usually produces a clearer map.\u003c/p\u003e\n\u003cp\u003eGenerating a map does not mean DeMinds has summarized, fact-checked, or reasoned through the document for you. Content that relies on font size, spacing, or visual layout to show its hierarchy may need some organizing after import.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds uses the headings, hierarchy, lists, paragraphs, and links it can recognize in the original. A clearly organized source usually produces a clearer map.\n\nGenerating a map does not mean DeMinds has summarized, fact-checked, or reasoned through the document for you. Content that relies on font size, spacing, or visual layout to show its hierarchy may need some organizing after import.","sourceFormat":"markdown"},"note:sha256:91cb836d8414b2a257e389b8d41463b145ddd611e19b13c72c07708bc7fd81b3":{"html":"\u003cp\u003eEligible Nature article pages can retain article information, body images, and links within the page to figures, tables, and references.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Eligible Nature article pages can retain article information, body images, and links within the page to figures, tables, and references.","sourceFormat":"markdown"},"note:sha256:92d30fc3ffdda0258b7dad54795377ebec1bb1dc12f601242bad7431d6b3c0bb":{"html":"\u003cp\u003eThe main import formats in this guide, the Universal Mind Map, Markdown reading and editing, Content Sources, Markdown File and Standard Markdown Bundle exports, and Continue with AI are included in Standard.\u003c/p\u003e\n\u003cp\u003eOriginal Mind Map, Full Mind Map PNG export, Portable Markdown File, and Interactive View creation are Plus features. The relevant sections explain their requirements. You can check the full feature comparison and retention limits in the app.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The main import formats in this guide, the Universal Mind Map, Markdown reading and editing, Content Sources, Markdown File and Standard Markdown Bundle exports, and Continue with AI are included in Standard.\n\nOriginal Mind Map, Full Mind Map PNG export, Portable Markdown File, and Interactive View creation are Plus features. The relevant sections explain their requirements. You can check the full feature comparison and retention limits in the app.","sourceFormat":"markdown"},"note:sha256:92fc0ab406385395d7d3162b6bcb319df21018c5244af127c25c2d41812e68c9":{"html":"\u003cp\u003eKeeping an online image reference does not save an offline copy. The image may still depend on its original host, your connection, and access permissions. Whether the image itself travels with an export depends on the export format.\u003c/p\u003e\n\u003cp\u003eWhen an Interactive View is opened as a local file or read inside DeMinds, you choose when to load eligible online images. When served as a public HTTPS page, it can load those images automatically. Failed images remain as placeholders that let you retry.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Keeping an online image reference does not save an offline copy. The image may still depend on its original host, your connection, and access permissions. Whether the image itself travels with an export depends on the export format.\n\nWhen an Interactive View is opened as a local file or read inside DeMinds, you choose when to load eligible online images. When served as a public HTTPS page, it can load those images automatically. Failed images remain as placeholders that let you retry.","sourceFormat":"markdown"},"note:sha256:98437ffb26e6d0a3bb0494909766f4f4a7ff8847a41a867b326e3b36478b2850":{"html":"\u003cp\u003eImport from Clipboard can recognize plain text, Markdown, rich text, HTML, and supported image content. What is available depends on what the source app places on the clipboard.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Import from Clipboard can recognize plain text, Markdown, rich text, HTML, and supported image content. What is available depends on what the source app places on the clipboard.","sourceFormat":"markdown"},"note:sha256:995017c146a17485b37929784d0b6465dfd9866e46960fbaafef510a7b2cf244":{"html":"\u003cp\u003eOn iPhone, iPad, and compatible Macs, use the system share sheet to send files, text, URLs, or supported combinations to DeMinds, then confirm the import.\u003c/p\u003e\n","kind":"html","rawMarkdown":"On iPhone, iPad, and compatible Macs, use the system share sheet to send files, text, URLs, or supported combinations to DeMinds, then confirm the import.","sourceFormat":"markdown"},"note:sha256:9991b909dd2fd3c99fecd8d9606e4f3e1a76ed1c9fce386245d04fb0f8e84f13":{"html":"\u003cp\u003eDeMinds aims to preserve external links, recognized document links, and jumps within a page. Accurate navigation depends on the target being available and the source link being resolvable.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds aims to preserve external links, recognized document links, and jumps within a page. Accurate navigation depends on the target being available and the source link being resolvable.","sourceFormat":"markdown"},"note:sha256:9b3edd575f09eb0716feb02179aab4058f91a546c78b8cd47ce75e8484a848f7":{"html":"\u003cp\u003eDeMinds uses the folder and note relationships within your selection, including recognized Folder Notes: notes that describe a folder. The result draws on the Vault's organization, rather than simply joining \u003ccode\u003e.md\u003c/code\u003e files end to end.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds uses the folder and note relationships within your selection, including recognized Folder Notes: notes that describe a folder. The result draws on the Vault's organization, rather than simply joining `.md` files end to end.","sourceFormat":"markdown"},"note:sha256:a2119704e7f73439a7c896bd77f9401869bae01bc24020632dd789ee2ba76096":{"html":"\u003cp\u003eRevise the text or reorganize headings and lists. Saving updates your Working Copy and the Universal Mind Map. Your original file outside DeMinds is left unchanged.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Revise the text or reorganize headings and lists. Saving updates your Working Copy and the Universal Mind Map. Your original file outside DeMinds is left unchanged.","sourceFormat":"markdown"},"note:sha256:a66c8c6c337c85d035d60724c7891c2ace43b74c3087e8b40288628fd95d9d0d":{"html":"\u003cp\u003eSupport for saved HTML does not cover every browser-specific web archive format. Page scripts, interactive controls, and decorative elements are not treated as editable document content.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Support for saved HTML does not cover every browser-specific web archive format. Page scripts, interactive controls, and decorative elements are not treated as editable document content.","sourceFormat":"markdown"},"note:sha256:a737b157cdfef6e2bfb61b770495c4dce9dbf986f735846fdf0d2da1699e549c":{"html":"\u003cp\u003eDeMinds supports specific sharing options from ChatGPT, DeepSeek, Gemini, and Doubao. Depending on the source, you can use a supported public share link, saved HTML, or the system share sheet.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds supports specific sharing options from ChatGPT, DeepSeek, Gemini, and Doubao. Depending on the source, you can use a supported public share link, saved HTML, or the system share sheet.","sourceFormat":"markdown"},"note:sha256:aa2cdb7585093546ceec7733aff1a19d0ae5534e7e0bdc9b004ba076650630df":{"html":"\u003cp\u003ePrepare your content as a Standard Markdown Bundle, or as a single AI Editing File for an external tool that does not accept ZIP files. Available in Standard.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Prepare your content as a Standard Markdown Bundle, or as a single AI Editing File for an external tool that does not accept ZIP files. Available in Standard.","sourceFormat":"markdown"},"note:sha256:abcb318cb6297632085ae6977cedb8db490c03e58d5e300888c7efc5b51cfa98":{"html":"\u003cp\u003eEligible web articles, AI Share Pages, and GitHub documents can retain source information and offer a way to revisit the original page. Visiting the source does not refresh or reimport your Working Copy.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Eligible web articles, AI Share Pages, and GitHub documents can retain source information and offer a way to revisit the original page. Visiting the source does not refresh or reimport your Working Copy.","sourceFormat":"markdown"},"note:sha256:b792b3e0df104f9ddc8f4cbfcade8c238c8be0a80800428237b528d6bd191272":{"html":"\u003cp\u003eList levels contribute to the structure where their relationships are clear. DeMinds does not infer a parent–child relationship between otherwise parallel items without sufficient evidence.\u003c/p\u003e\n","kind":"html","rawMarkdown":"List levels contribute to the structure where their relationships are clear. DeMinds does not infer a parent–child relationship between otherwise parallel items without sufficient evidence.","sourceFormat":"markdown"},"note:sha256:bb31f6e7e46c7209526a02538f9168d6ba09fa7ecadf285b09abca7c2da9fa15":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWorking document\u003c/th\u003e\n\u003cth\u003eContent Source\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eEdit and develop your own Working Copy\u003c/td\u003e\n\u003ctd\u003eRead the most recently retrieved content from an external source\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSave your changes\u003c/td\u003e\n\u003ctd\u003eCheck for source updates manually\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAn ordinary import does not track the original page\u003c/td\u003e\n\u003ctd\u003eRetains the supported source connection\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe body can be edited\u003c/td\u003e\n\u003ctd\u003eThe source content is read-only\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n","kind":"html","rawMarkdown":"| Working document | Content Source |\n| --- | --- |\n| Edit and develop your own Working Copy | Read the most recently retrieved content from an external source |\n| Save your changes | Check for source updates manually |\n| An ordinary import does not track the original page | Retains the supported source connection |\n| The body can be edited | The source content is read-only |","sourceFormat":"markdown"},"note:sha256:bbf1a22658c25cf04ac7ce1b20ff0a37b48dd89785d3b576469c66fe1a527fbf":{"html":"\u003cp\u003eThe result is an ordinary editable project. Even if the OPML contains subscription URLs, importing it does not automatically create or subscribe to Feed Content Sources.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The result is an ordinary editable project. Even if the OPML contains subscription URLs, importing it does not automatically create or subscribe to Feed Content Sources.","sourceFormat":"markdown"},"note:sha256:bc3cd0ad36c1408ea71cea1ab518bb6b8d5a9b8deff2b66d26b56e302d23ff4a":{"html":"\u003cp\u003eThe main map keeps the outline easy to browse, while the body and node Notes hold the detail. Long passages, quotations, and tables do not all need to become separate map nodes. Where a Note has a suitable structure, you can switch between its Markdown and Structure views.\u003c/p\u003e\n\u003cp\u003eLong branches may start collapsed. Collapsed content is still there when you expand the branch.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The main map keeps the outline easy to browse, while the body and node Notes hold the detail. Long passages, quotations, and tables do not all need to become separate map nodes. Where a Note has a suitable structure, you can switch between its Markdown and Structure views.\n\nLong branches may start collapsed. Collapsed content is still there when you expand the branch.","sourceFormat":"markdown"},"note:sha256:bcb1e5648518aa511884598c36e7b507bfec34c009a4deda1d0153100edbf296":{"html":"\u003cp\u003eDeMinds runs on the web, on iPhone and iPad, and on compatible Macs through Designed for iPad on Mac. File selection, system sharing, Web Import Preview, and some export options differ between platforms.\u003c/p\u003e\n\u003cp\u003eDesigned for iPad on Mac runs the iPad app on a compatible Mac; it is not a separate macOS app. The web app in a narrow window also differs from the iPhone app.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds runs on the web, on iPhone and iPad, and on compatible Macs through Designed for iPad on Mac. File selection, system sharing, Web Import Preview, and some export options differ between platforms.\n\nDesigned for iPad on Mac runs the iPad app on a compatible Mac; it is not a separate macOS app. The web app in a narrow window also differs from the iPhone app.","sourceFormat":"markdown"},"note:sha256:bf8bd26e3a62d815954f74a8ce4577a449664dac00d14662b69bfd4d28f0428e":{"html":"\u003cp\u003eSelect one or more Markdown documents from a folder or ZIP, along with the assets DeMinds can resolve. Your selection determines which documents are imported.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Select one or more Markdown documents from a folder or ZIP, along with the assets DeMinds can resolve. Your selection determines which documents are imported.","sourceFormat":"markdown"},"note:sha256:c09f5525eb7b1902f8cf45fec05e78686ecc5a56a0b9ce9f1e53a27975f461eb":{"html":"\u003cp\u003eRead the text, quotations, tables, code, common math expressions, and images in a continuous document. A detail you find in the map can be read alongside the surrounding text.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Read the text, quotations, tables, code, common math expressions, and images in a continuous document. A detail you find in the map can be read alongside the surrounding text.","sourceFormat":"markdown"},"note:sha256:c23bd495bdae890b44e9b073c278b0e21e0b05da0db5047200d584d61997ba3c":{"html":"\u003cp\u003eLinks are handled according to what they point to. Web articles, online documents, shared AI content, and Content Sources each follow their own import rules.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Links are handled according to what they point to. Web articles, online documents, shared AI content, and Content Sources each follow their own import rules.","sourceFormat":"markdown"},"note:sha256:c45e56544d5726e48c72aebcb6820a67b89eaa78edc77d9466bdf908f7db45ed":{"html":"\u003cp\u003eCode blocks and inline code remain code. Heading symbols inside code do not become document headings, and importing or reading code does not execute it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Code blocks and inline code remain code. Heading symbols inside code do not become document headings, and importing or reading code does not execute it.","sourceFormat":"markdown"},"note:sha256:c7144f394d12a1549e6e558c0748b30157d7cd42c6be8d55502442f6b195c557":{"html":"\u003cp\u003eMarkdown and the Universal Mind Map give you two ways to work with the same content. Markdown holds the text you can read and edit; the map makes its organization easier to see.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Markdown and the Universal Mind Map give you two ways to work with the same content. Markdown holds the text you can read and edit; the map makes its organization easier to see.","sourceFormat":"markdown"},"note:sha256:cbf37da239d3f4ff5b0cf9748dc57ef1d95a336058f17ef39ebefc4d5e133989":{"html":"\u003cp\u003eDeMinds helps turn worthwhile material from different sources into knowledge you can read, understand, edit, take with you, and return to over time.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds helps turn worthwhile material from different sources into knowledge you can read, understand, edit, take with you, and return to over time.","sourceFormat":"markdown"},"note:sha256:cd8061911be9c590308ebeaeabade5dcd03a43a72868cb573d0654c5a35613aa":{"html":"\u003cp\u003eWhen a valid result file returns and DeMinds can identify its project, you can compare the external version with your current Working Copy before confirming whether to apply it. You can also open it as new content.\u003c/p\u003e\n\u003cp\u003eIf the file lacks enough information to identify the original project, automatic reconnection is not guaranteed. DeMinds does not guess the association and silently overwrite your work.\u003c/p\u003e\n","kind":"html","rawMarkdown":"When a valid result file returns and DeMinds can identify its project, you can compare the external version with your current Working Copy before confirming whether to apply it. You can also open it as new content.\n\nIf the file lacks enough information to identify the original project, automatic reconnection is not guaranteed. DeMinds does not guess the association and silently overwrite your work.","sourceFormat":"markdown"},"note:sha256:d7b9246d1c8ce5f79d060b7b31a17eb9c72c235797cd24daff6eae9b74b17dc5":{"html":"\u003cp\u003eDeMinds checks that a feed uses a supported format—RSS, Atom, RDF, or JSON Feed—then saves its content as a read-only Content Source.\u003c/p\u003e\n\u003cp\u003eIf the feed provides full text, DeMinds can work with that text. If it provides only a summary, only the summary is available. DeMinds does not automatically follow each entry to retrieve the full article.\u003c/p\u003e\n\u003cp\u003eAn \u003ccode\u003e.xml\u003c/code\u003e or \u003ccode\u003e.json\u003c/code\u003e extension alone does not identify a feed; the contents must match a supported feed format.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds checks that a feed uses a supported format—RSS, Atom, RDF, or JSON Feed—then saves its content as a read-only Content Source.\n\nIf the feed provides full text, DeMinds can work with that text. If it provides only a summary, only the summary is available. DeMinds does not automatically follow each entry to retrieve the full article.\n\nAn `.xml` or `.json` extension alone does not identify a feed; the contents must match a supported feed format.","sourceFormat":"markdown"},"note:sha256:de9cc766ba37ef802c4b8cd1ceb42a9e66845f50e22f8a89aa71b57b1413e216":{"html":"\u003cp\u003eThis is a way to organize and bring across the selected content as it exists at import time. Wiki Links primarily navigate between selected documents; precise jumps to Obsidian headings or block references are not guaranteed.\u003c/p\u003e\n\u003cp\u003eDeMinds does not follow links to import unselected notes recursively, run plugins or Dataview, recreate the full graph, write changes back to the Vault, or provide two-way sync.\u003c/p\u003e\n\u003cp\u003eSupport for Wiki Image Embeds does not extend to every embed type, including embedded notes, PDFs, audio, and video.\u003c/p\u003e\n","kind":"html","rawMarkdown":"This is a way to organize and bring across the selected content as it exists at import time. Wiki Links primarily navigate between selected documents; precise jumps to Obsidian headings or block references are not guaranteed.\n\nDeMinds does not follow links to import unselected notes recursively, run plugins or Dataview, recreate the full graph, write changes back to the Vault, or provide two-way sync.\n\nSupport for Wiki Image Embeds does not extend to every embed type, including embedded notes, PDFs, audio, and video.","sourceFormat":"markdown"},"note:sha256:e304ffffa8c2c8d693bce2a35da119e06705758af2239c92d38fc3bdd21bad91":{"html":"\u003cp\u003eView, compare, and restore available versions of your Working Copy, with the imported Baseline kept distinct from later changes. The number of retained history versions is limited; this is not unlimited version control for every asset.\u003c/p\u003e\n","kind":"html","rawMarkdown":"View, compare, and restore available versions of your Working Copy, with the imported Baseline kept distinct from later changes. The number of retained history versions is limited; this is not unlimited version control for every asset.","sourceFormat":"markdown"},"note:sha256:e97b15a233d8f6a40b01d0daad9631ea1a14718410411254cb3608e6210df7ce":{"html":"\u003cp\u003eAfter importing and saving content, you can reopen it from Continue Working to read or edit it again. Categories, work stages, and Version History help you organize and develop it over time.\u003c/p\u003e\n\u003cp\u003eA typical flow is: \u003cstrong\u003eBring content in → Explore its structure → Read the details → Edit and organize → Save your work → Come back and continue.\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"After importing and saving content, you can reopen it from Continue Working to read or edit it again. Categories, work stages, and Version History help you organize and develop it over time.\n\nA typical flow is: **Bring content in → Explore its structure → Read the details → Edit and organize → Save your work → Come back and continue.**","sourceFormat":"markdown"},"note:sha256:eb9398186002f16180413684c4c5c8c9513ded40d9024551219acf7fb6babd28":{"html":"\u003cp\u003eSome static constructs, such as Callouts, can be presented as ordinary quotations or text. Their readable content carries over; the behavior of an Obsidian plugin does not.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Some static constructs, such as Callouts, can be presented as ordinary quotations or text. Their readable content carries over; the behavior of an Obsidian plugin does not.","sourceFormat":"markdown"},"note:sha256:ebb55bb53aef33d01f1462113862cb526bdb13ba9278658353fae8ea2bb212b5":{"html":"\u003cp\u003eImages that DeMinds can locate within the supported asset scope are processed with the selected content. Recognized standard Markdown links between selected documents can become navigation links within the result.\u003c/p\u003e\n\u003cp\u003eKeeping an image reference is different from including the image file. Missing assets, unresolved paths, or files outside the selected scope may prevent images from carrying over with the text.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Images that DeMinds can locate within the supported asset scope are processed with the selected content. Recognized standard Markdown links between selected documents can become navigation links within the result.\n\nKeeping an image reference is different from including the image file. Missing assets, unresolved paths, or files outside the selected scope may prevent images from carrying over with the text.","sourceFormat":"markdown"},"note:sha256:ed1d064635f40f67b44646a14c9f6911effb32d451dcb9e2baf45245e3a9ef30":{"html":"\u003cp\u003eOn a sufficiently wide workspace, you can place Markdown and the Universal Mind Map next to each other. The Markdown pane supports reading and editing; the map updates when you save. On iPhone and in narrow windows, you work in one view at a time.\u003c/p\u003e\n","kind":"html","rawMarkdown":"On a sufficiently wide workspace, you can place Markdown and the Universal Mind Map next to each other. The Markdown pane supports reading and editing; the map updates when you save. On iPhone and in narrow windows, you work in one view at a time.","sourceFormat":"markdown"},"note:sha256:ee586660abce607fa5bf9aeb8306e24bf1874e1cf87892c243d80f30c3cff60d":{"html":"\u003cp\u003eEmbed supported images in a single Markdown file when you want one file to carry with you. Requires Plus. Availability in the current document and Continue Working varies by platform, and other tools may differ in how they handle embedded images.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Embed supported images in a single Markdown file when you want one file to carry with you. Requires Plus. Availability in the current document and Continue Working varies by platform, and other tools may differ in how they handle embedded images.","sourceFormat":"markdown"},"note:sha256:f17bb1900ed4b9c5a8cc7b1598b1b89a94b3243118c76d3f1caaeda30699b8a7":{"html":"\u003cp\u003e\u003cstrong\u003eIf something is worth reading more closely, organizing, or coming back to, try bringing it into DeMinds.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eMarkdown, Obsidian notes, mind maps, DOCX documents, web articles, HTML papers, and shared AI conversations can all become material you keep working with. DeMinds brings across the content, structure, images, links, and source information it can recognize, so you can read, refine, and build on what matters.\u003c/p\u003e\n\u003cp\u003eThis guide explains what you can bring into DeMinds and what you can do with it once it is there.\u003c/p\u003e\n\u003cp\u003eApplies to DeMinds V1.0 / 1.0.38. What carries over varies by format. Available import options also depend on your platform and whether the source content is accessible.\u003c/p\u003e\n","kind":"html","rawMarkdown":"**If something is worth reading more closely, organizing, or coming back to, try bringing it into DeMinds.**\n\nMarkdown, Obsidian notes, mind maps, DOCX documents, web articles, HTML papers, and shared AI conversations can all become material you keep working with. DeMinds brings across the content, structure, images, links, and source information it can recognize, so you can read, refine, and build on what matters.\n\nThis guide explains what you can bring into DeMinds and what you can do with it once it is there.\n\nApplies to DeMinds V1.0 / 1.0.38. What carries over varies by format. Available import options also depend on your platform and whether the source content is accessible.","sourceFormat":"markdown"},"note:sha256:f48ee579701dcddfc4c649b64db3b4d67c45ba202f09918264d210a9db784d74":{"html":"\u003cp\u003eDeMinds preserves math it can reliably recover, code listings, numbered algorithms, and the steps, indentation, and explanations within them. Recognized prompt templates also retain a readable structure.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds preserves math it can reliably recover, code listings, numbered algorithms, and the steps, indentation, and explanations within them. Recognized prompt templates also retain a readable structure.","sourceFormat":"markdown"},"note:sha256:f5a72ceb16c82fb9a3caa5c0d0ded0c647f477b1500eb5f4b9c174d57adaf644":{"html":"\u003cp\u003eAsk for improvements to structure, or to both structure and wording. You can also request translation into a supported target language. The external AI tool you choose performs the work.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Ask for improvements to structure, or to both structure and wording. You can also request translation into a supported target language. The external AI tool you choose performs the work.","sourceFormat":"markdown"},"note:sha256:f629f2264eb52007d883b1fdaa1c4fb8bb8831d75095b80e9373be9de3bd0e2c":{"html":"\u003cp\u003eDeMinds reads the hierarchy, Notes, images, and supported theme, color, and branch styling information in \u003ccode\u003e.xmind\u003c/code\u003e files. What carries over depends on the package's structure and contents.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds reads the hierarchy, Notes, images, and supported theme, color, and branch styling information in `.xmind` files. What carries over depends on the package's structure and contents.","sourceFormat":"markdown"},"note:sha256:f64c0250ec91c6752034e45ed069dc44617df6a95863e2c964974ffbd569842e":{"html":"\u003cp\u003eExplore a structure built from the headings, lists, and relationships DeMinds can identify. Expand branches, search, jump to a topic, pan, and zoom to move from an overview to the details.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Explore a structure built from the headings, lists, and relationships DeMinds can identify. Expand branches, search, jump to a topic, pan, and zoom to move from an overview to the details.","sourceFormat":"markdown"},"note:sha256:f6c0f25334a19dcd3836dfed208ccb53ec3a50dfbec81614e086b168d854b125":{"html":"\u003cp\u003eDeMinds reads the tree structure, NOTE and DETAILS content, links, and resolvable image assets in \u003ccode\u003e.mm\u003c/code\u003e files.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds reads the tree structure, NOTE and DETAILS content, links, and resolvable image assets in `.mm` files.","sourceFormat":"markdown"},"note:sha256:fdf725f867e8911aec1038db10fef1fb985751f67a9ae7f3e181cb49895c894b":{"html":"\u003cp\u003eBring across outline levels, notes, and links for further work. Local files and supported online sources are accepted, including GitHub file links.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Bring across outline levels, notes, and links for further work. Local files and supported online sources are accepted, including GitHub file links.","sourceFormat":"markdown"},"note:sha256:fe2b2b6a367b941687bc4205c28c4c2774b6e2c77739545ddfccfc35ab1c5140":{"html":"\u003cp\u003eNo single level of fidelity applies to every source. Results depend on the original structure, available assets, access restrictions, file size, and the device or browser you use.\u003c/p\u003e\n\u003cp\u003eDeMinds does not bypass sign-in requirements, paywalls, or other access restrictions. If the full text cannot be retrieved reliably, the import may fail or the content may be incomplete.\u003c/p\u003e\n","kind":"html","rawMarkdown":"No single level of fidelity applies to every source. Results depend on the original structure, available assets, access restrictions, file size, and the device or browser you use.\n\nDeMinds does not bypass sign-in requirements, paywalls, or other access restrictions. If the full text cannot be retrieved reliably, the import may fail or the content may be incomplete.","sourceFormat":"markdown"},"note:sha256:ff20394025cc2d21faceac6f1039370f7aac9321f4f3a5c38e8fdad85a56ac56":{"html":"\u003cp\u003eOpen a file to read it, explore its Universal Mind Map, and edit it. You can also type or paste Markdown, refine it, and then create a project.\u003c/p\u003e\n\u003cp\u003eCode, tables, images, and common math expressions are handled where DeMinds recognizes the Markdown. Syntax specific to another tool is not automatically supported as standard Markdown.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Open a file to read it, explore
