</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-20T02:37:07.154Z","language":"en","name":"DeMinds","version":"1.0.41"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"DeMinds Guide to Formats and Content","outlineVersion":1},"sourceRevision":"sha256:8620f127dc26a2db09b9845539d816f74011a2fbc3a1ae5545f4f6134e6e9d25","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"DeMinds-Format-and-Content-Support-Marketing.en.md","title":"DeMinds Guide to Formats and Content"},"files":[{"byteLength":26945,"content":"# DeMinds Guide to Formats and Content\n\n**If something is worth reading more closely, organizing, or coming back to, try bringing it into DeMinds.**\n\nMarkdown, Obsidian notes, mind maps, DOCX documents, web articles, HTML papers, and shared AI conversations can all become material you keep working with. DeMinds brings across the content, structure, images, links, and source information it can recognize, so you can read, refine, and build on what matters.\n\nThis guide explains what you can bring into DeMinds and what you can do with it once it is there.\n\nApplies to DeMinds V1.0 / 1.0.38. What carries over varies by format. Available import options also depend on your platform and whether the source content is accessible.\n\n## Getting to know DeMinds\n\n### How to use this guide\n\nIf you are new to DeMinds, start with “Files and knowledge bases” or “Web and online content” to find the material you have. Then explore “Content and structure” to see what becomes a branch, stays in the body, or appears in a Note.\n\nIf you already have content in DeMinds, “Content Sources and updates” and “Save, export, and continue” explain how to keep up with a source, take an editable copy elsewhere, or share a file for others to read.\n\nFor each type of content, consider four questions: **What can I import? What carries over? How is it organized? What can I do next?**\n\n### Markdown and the Universal Mind Map\n\nMarkdown and the Universal Mind Map give you two ways to work with the same content. Markdown holds the text you can read and edit; the map makes its organization easier to see.\n\n#### Universal Mind Map: see the whole picture\n\nExplore a structure built from the headings, lists, and relationships DeMinds can identify. Expand branches, search, jump to a topic, pan, and zoom to move from an overview to the details.\n\n#### Markdown Preview: read in context\n\nRead the text, quotations, tables, code, common math expressions, and images in a continuous document. A detail you find in the map can be read alongside the surrounding text.\n\n#### Markdown editing: develop your work\n\nRevise the text or reorganize headings and lists. Saving updates your Working Copy and the Universal Mind Map. Your original file outside DeMinds is left unchanged.\n\n#### Side-by-side: read alongside the map\n\nOn a sufficiently wide workspace, you can place Markdown and the Universal Mind Map next to each other. The Markdown pane supports reading and editing; the map updates when you save. On iPhone and in narrow windows, you work in one view at a time.\n\n### The outline and the details\n\nThe main map keeps the outline easy to browse, while the body and node Notes hold the detail. Long passages, quotations, and tables do not all need to become separate map nodes. Where a Note has a suitable structure, you can switch between its Markdown and Structure views.\n\nLong branches may start collapsed. Collapsed content is still there when you expand the branch.\n\n### From import to ongoing work\n\nAfter importing and saving content, you can reopen it from Continue Working to read or edit it again. Categories, work stages, and Version History help you organize and develop it over time.\n\nA typical flow is: **Bring content in → Explore its structure → Read the details → Edit and organize → Save your work → Come back and continue.**\n\n### How DeMinds finds structure\n\nDeMinds uses the headings, hierarchy, lists, paragraphs, and links it can recognize in the original. A clearly organized source usually produces a clearer map.\n\nGenerating a map does not mean DeMinds has summarized, fact-checked, or reasoned through the document for you. Content that relies on font size, spacing, or visual layout to show its hierarchy may need some organizing after import.\n\n### Availability and sharing\n\n#### Standard and Plus\n\nThe main import formats in this guide, the Universal Mind Map, Markdown reading and editing, Content Sources, Markdown File and Standard Markdown Bundle exports, and Continue with AI are included in Standard.\n\nOriginal Mind Map, Full Mind Map PNG export, Portable Markdown File, and Interactive View creation are Plus features. The relevant sections explain their requirements. You can check the full feature comparison and retention limits in the app.\n\n#### Platform differences\n\nDeMinds runs on the web, on iPhone and iPad, and on compatible Macs through Designed for iPad on Mac. File selection, system sharing, Web Import Preview, and some export options differ between platforms.\n\nDesigned for iPad on Mac runs the iPad app on a compatible Mac; it is not a separate macOS app. The web app in a narrow window also differs from the iPhone app.\n\n#### What affects import quality\n\nNo single level of fidelity applies to every source. Results depend on the original structure, available assets, access restrictions, file size, and the device or browser you use.\n\nDeMinds does not bypass sign-in requirements, paywalls, or other access restrictions. If the full text cannot be retrieved reliably, the import may fail or the content may be incomplete.\n\n#### Sharing and publishing\n\nBefore sharing or publishing, make sure the text, images, and other material are suitable for others to see and that you have permission to share them. An Interactive View is a read-only file; it does not provide encryption or access controls.\n\n#### See the structure. Keep working.\n\nDeMinds helps turn worthwhile material from different sources into knowledge you can read, understand, edit, take with you, and return to over time.\n\n## Files and knowledge bases\n\n### Text and Markdown collections\n\n#### Markdown and plain text\n\n##### What you can bring in\n\nDeMinds reads `.md`, `.markdown`, and `.txt` files. Markdown is a natural fit for the app and the main format used to keep working with content from other sources. Text files are interpreted from their contents; the `.txt` extension alone does not give them a hierarchy.\n\n##### What you can do next\n\nOpen a file to read it, explore its Universal Mind Map, and edit it. You can also type or paste Markdown, refine it, and then create a project.\n\nCode, tables, images, and common math expressions are handled where DeMinds recognizes the Markdown. Syntax specific to another tool is not automatically supported as standard Markdown.\n\n#### Markdown Package\n\n##### Work with several documents together\n\nSelect one or more Markdown documents from a folder or ZIP, along with the assets DeMinds can resolve. Your selection determines which documents are imported.\n\n##### Three ways to organize them\n\n| Mode | Best suited to |\n| --- | --- |\n| Sequential merge | Documents you want to read in the order you select them |\n| Folder tree | A collection whose folder hierarchy you want to retain |\n| Vault structure | A recognized Obsidian Vault whose organization you want to use |\n\n##### Images and document links\n\nImages that DeMinds can locate within the supported asset scope are processed with the selected content. Recognized standard Markdown links between selected documents can become navigation links within the result.\n\nKeeping an image reference is different from including the image file. Missing assets, unresolved paths, or files outside the selected scope may prevent images from carrying over with the text.\n\n#### Obsidian Vault\n\n##### Structure and content\n\n###### Use the Vault's organization\n\nDeMinds uses the folder and note relationships within your selection, including recognized Folder Notes: notes that describe a folder. The result draws on the Vault's organization, rather than simply joining `.md` files end to end.\n\n###### Common links and static images\n\nDeMinds handles common Markdown document links, Wiki Links, and static Wiki Image Embeds such as `![[image.png]]` when the target image can be identified without ambiguity. Relative image paths are also handled where they can be resolved.\n\n###### Readable forms of Obsidian syntax\n\nSome static constructs, such as Callouts, can be presented as ordinary quotations or text. Their readable content carries over; the behavior of an Obsidian plugin does not.\n\n##### Where compatibility ends\n\nThis is a way to organize and bring across the selected content as it exists at import time. Wiki Links primarily navigate between selected documents; precise jumps to Obsidian headings or block references are not guaranteed.\n\nDeMinds does not follow links to import unselected notes recursively, run plugins or Dataview, recreate the full graph, write changes back to the Vault, or provide two-way sync.\n\nSupport for Wiki Image Embeds does not extend to every embed type, including embedded notes, PDFs, audio, and video.\n\n### Mind maps\n\n#### Supported formats\n\n##### MindNode\n\nDeMinds reads compatible `.mindnode` files and folder packages. It brings across the hierarchy, Notes, images, and some title formatting and styles that it can recover, including supported documents with multiple main nodes. How you select a folder package depends on the platform and file provider.\n\n##### XMind\n\nDeMinds reads the hierarchy, Notes, images, and supported theme, color, and branch styling information in `.xmind` files. What carries over depends on the package's structure and contents.\n\n##### FreeMind and Freeplane\n\nDeMinds reads the tree structure, NOTE and DETAILS content, links, and resolvable image assets in `.mm` files.\n\n#### Universal Mind Map and Original Mind Map\n\nAn imported mind map can become editable Markdown and a Universal Mind Map. The Universal Mind Map gives you a consistent way to read, review structure, and continue working across formats.\n\nWith DeMinds Plus, mind map files whose original data can be recovered can also offer an Original Mind Map view. It shows the structure and visual presentation DeMinds can reconstruct from the source. Markdown and web articles do not have an Original Mind Map view.\n\n#### Fidelity and editing\n\nFor each format, DeMinds aims to retain the main structure, node content, Notes, images, and links. It cannot reproduce every complex layout, proprietary style, or special object.\n\nEdits apply to your Markdown Working Copy. They do not modify the external MindNode, XMind, or `.mm` file. You should not expect every change to export back into the original app's format.\n\n### Documents and outlines\n\n#### DOCX\n\n##### Content and structure\n\nBring headings, paragraphs, lists, convertible tables, images, and other supported content into a Markdown workflow. DeMinds also keeps the imported DOCX as the original source.\n\n##### What to expect\n\nThe focus is on content and organization. Complex Word layouts, including headers, footers, columns, and floating objects, may not carry over faithfully. Older `.doc` files are not supported.\n\n#### HTML and HTM\n\n##### Content and structure\n\nDeMinds imports compatible `.html` and `.htm` files. It recognizes ordinary HTML, web articles, or AI Share Pages, cleans up the content, and converts it to Markdown.\n\n##### What to expect\n\nSupport for saved HTML does not cover every browser-specific web archive format. Page scripts, interactive controls, and decorative elements are not treated as editable document content.\n\n#### OPML\n\n##### Content and structure\n\nBring across outline levels, notes, and links for further work. Local files and supported online sources are accepted, including GitHub file links.\n\n##### What to expect\n\nThe result is an ordinary editable project. Even if the OPML contains subscription URLs, importing it does not automatically create or subscribe to Feed Content Sources.\n\n### ZIP and folders\n\nZIP files and folders are containers. DeMinds examines their contents to identify a Markdown Package, mind map package, Workspace Backup, or other supported material, then opens it through the appropriate import process.\n\nPutting an unsupported file in a ZIP does not make it supported. Restoring a Workspace Backup also serves a different purpose from importing a document; Workspace Backup import requires Plus.\n\n## Web and online content\n\n### Articles and long-form pages\n\n#### Pages that work best\n\nPublicly accessible articles, blog posts, technical writing, and some documentation pages are usually a good fit when the full text is available and clearly structured.\n\nDeMinds looks for the title, author, date, body, images, and links while reducing clutter from navigation, recommendations, and page decoration.\n\n#### Sources with tailored handling\n\nSome sources, including WeChat Official Account articles, Zhihu, Medium, Substack, and Sspai, have tailored rules for identifying and cleaning up articles. X Articles that display their text without sign-in also have dedicated handling.\n\nThis applies to eligible articles, not every page on those sites. Home pages, profiles, and search results may not be importable.\n\n#### Web Import Preview\n\nOn iPhone, iPad, and Designed for iPad on Mac, Web Import Preview lets you view a page before confirming the import.\n\nAccess restrictions, complex page loading, and third-party sign-in requirements can still affect the result. Your Safari sign-in sessions do not automatically carry over to DeMinds, and signing in within the preview is not guaranteed to work on every site.\n\n### GitHub and online files\n\n#### Public Markdown documents\n\nDeMinds handles public READMEs and Markdown documents, including heading anchors, relative image paths, and recognized links to related documents. Opening a document link processes that target; it does not scan the entire repository.\n\n#### File links and repository URLs\n\nA link to an individual Markdown file normally imports an editable document. A URL pointing to the repository root can create a GitHub README Content Source, so you can check for README updates later.\n\nA file does not become a repository-wide Content Source simply because it is hosted on GitHub.\n\n#### Links to supported files\n\nPublic links to identifiable Markdown, text, HTML, DOCX, XMind, MindNode, FreeMind, and OPML files can use the corresponding import process after type, size, and download checks.\n\nThis does not cover every download page, private link, or cloud-storage sharing link. GitHub support does not include private repository sign-in, browsing an entire repository, or importing all its files recursively.\n\n### Papers and research articles\n\n#### arXiv HTML papers\n\n##### Paper content and reading\n\n###### Paper details and sections\n\nDeMinds retains the title, authors, affiliations, arXiv identifier, abstract, references, and appendices it can recognize, helping you follow the paper's organization.\n\n###### Math, code, and algorithms\n\nDeMinds preserves math it can reliably recover, code listings, numbered algorithms, and the steps, indentation, and explanations within them. Recognized prompt templates also retain a readable structure.\n\n###### Table structure\n\nTables that can be reliably reconstructed in standard Markdown use that format. Some tables with merged cells, multiple header levels, or grouped content are retained in a richer form that DeMinds can display.\n\nThese complex tables are primarily read in Markdown Preview and Interactive View; each cell does not become a separate map node. Other Markdown tools may not display these special structures in the same way.\n\n###### Links within a paper\n\nRecognized links between sections, figures, tables, algorithms, and references are preserved, helping you move through the paper and between the map and the text.\n\n##### The limits of HTML support\n\nThese capabilities apply to recognized arXiv HTML structures. They do not imply the same fidelity for arbitrary HTML, DOCX, PDF, or TeX source files. Citation graphs and automatic paper-version updates are not included.\n\nSome arXiv import links point to the HTML version even when their path contains `pdf`. If the HTML version is unavailable, DeMinds does not automatically switch to PDF extraction, an abstract-only import, or OCR.\n\n#### Nature articles\n\n##### Article details and images\n\nEligible Nature article pages can retain article information, body images, and links within the page to figures, tables, and references.\n\n##### Bringing in tables\n\nIn Web Import Preview on iPhone, iPad, or a compatible Mac, DeMinds will try to include a simple table from a separate page of the same article when it can retrieve and verify it. Otherwise, the original table link remains, and the main article import can continue.\n\n##### When the full text is unavailable\n\nIf the article body contains an explicit access restriction, DeMinds does not import surrounding material, such as the abstract and references, as though it were the complete article.\n\n### Shared AI content\n\n#### Supported sources\n\nDeMinds supports specific sharing options from ChatGPT, DeepSeek, Gemini, and Doubao. Depending on the source, you can use a supported public share link, saved HTML, or the system share sheet.\n\n#### What the import includes\n\nThe import is limited to what the shared page makes public and what DeMinds can recognize. ChatGPT supports both full-conversation shares and certain public single-response shares; a single response is not expanded into a full conversation.\n\nCode, lists, tables, and common math expressions are handled according to the content structure DeMinds can identify.\n\n#### Keep working with useful answers\n\nValuable AI content can become a project you return to: explore it in the Universal Mind Map, read and edit the Markdown, or export it for further use.\n\n#### Accounts and private content\n\nImporting shared AI content does not connect to your AI account or read private chat history. Attachments, tool results, and hidden content that the shared page does not expose may not be recoverable.\n\n## Content and structure\n\n### Headings, lists, and text\n\n#### Headings and hierarchy\n\nRecognized headings form the main outline and branches. Folder structures, mind map nodes, and Markdown headings provide different kinds of hierarchy depending on the source.\n\n#### Lists and nesting\n\nList levels contribute to the structure where their relationships are clear. DeMinds does not infer a parent–child relationship between otherwise parallel items without sufficient evidence.\n\n#### Paragraphs, quotations, and Notes\n\nLong paragraphs, quotations, and detailed explanations stay in the body or in node Notes, keeping the main map manageable. Suitable Notes can also be explored in their own structure view.\n\n### Tables, code, and math\n\n#### Tables\n\nOrdinary tables are mainly read in the body and Notes. Complex tables are handled according to their source and what can be recovered; the arXiv-specific support does not extend to complex tables in every format.\n\n#### Code\n\nCode blocks and inline code remain code. Heading symbols inside code do not become document headings, and importing or reading code does not execute it.\n\n#### Math\n\nDeMinds supports common Markdown math and mathematical expressions it can recover during HTML import. Appearance can vary with the expression and the view you use. This is not a full TeX typesetting system.\n\n### Images, links, and sources\n\n#### Local and packaged images\n\nLocal images and images within a package can be displayed when DeMinds can resolve them, and included in exports that support bundling those assets. Missing files, unresolved paths, or unsupported assets may prevent an image from appearing.\n\n#### Online images\n\nKeeping an online image reference does not save an offline copy. The image may still depend on its original host, your connection, and access permissions. Whether the image itself travels with an export depends on the export format.\n\nWhen an Interactive View is opened as a local file or read inside DeMinds, you choose when to load eligible online images. When served as a public HTTPS page, it can load those images automatically. Failed images remain as placeholders that let you retry.\n\n#### Document links and page navigation\n\nDeMinds aims to preserve external links, recognized document links, and jumps within a page. Accurate navigation depends on the target being available and the source link being resolvable.\n\n#### Return to the source\n\nEligible web articles, AI Share Pages, and GitHub documents can retain source information and offer a way to revisit the original page. Visiting the source does not refresh or reimport your Working Copy.\n\n### Audio, video, and other attachments\n\nA reference to an attachment does not guarantee that the file can be transferred in full, played offline, or included in every export format.\n\nPreview availability depends on the assets, their formats, and your device or browser. This does not imply automatic media downloading, transcoding, repair, or recognition of text inside images.\n\n## Content Sources and updates\n\n### Feeds\n\nDeMinds checks that a feed uses a supported format—RSS, Atom, RDF, or JSON Feed—then saves its content as a read-only Content Source.\n\nIf the feed provides full text, DeMinds can work with that text. If it provides only a summary, only the summary is available. DeMinds does not automatically follow each entry to retrieve the full article.\n\nAn `.xml` or `.json` extension alone does not identify a feed; the contents must match a supported feed format.\n\n### GitHub README\n\nUse a URL pointing to a GitHub repository root, or choose to convert an eligible README, to create a GitHub README Content Source. It stays linked to the repository so you can check for updates manually.\n\nUpdates apply to the README, not the repository's entire file collection.\n\n### How sources differ from working documents\n\n| Working document | Content Source |\n| --- | --- |\n| Edit and develop your own Working Copy | Read the most recently retrieved content from an external source |\n| Save your changes | Check for source updates manually |\n| An ordinary import does not track the original page | Retains the supported source connection |\n| The body can be edited | The source content is read-only |\n\n### Check for updates\n\nSources appear under Content Sources in Continue Working. Updates run only when you ask; DeMinds does not poll for them in the background.\n\nIf a check fails or you cancel it, the last successfully retrieved content remains. If nothing has changed, no new history version is created. Content Sources do not currently include unread tracking, recommendations, or automatic full-article retrieval found in some feed readers.\n\n## Save, export, and continue\n\n### Bring content in\n\n#### Files and folders\n\nUse the file or folder picker available on your platform to open supported content. The file provider, package type, and availability of cloud files can affect whether DeMinds can read it.\n\n#### Clipboard\n\nImport from Clipboard can recognize plain text, Markdown, rich text, HTML, and supported image content. What is available depends on what the source app places on the clipboard.\n\n#### System sharing\n\nOn iPhone, iPad, and compatible Macs, use the system share sheet to send files, text, URLs, or supported combinations to DeMinds, then confirm the import.\n\n#### Web and file links\n\nLinks are handled according to what they point to. Web articles, online documents, shared AI content, and Content Sources each follow their own import rules.\n\n### Keep your work\n\n#### Continue Working\n\nSaved projects can be reopened and edited; Continue Working does more than list recently opened files. The number of projects you can retain depends on your plan.\n\n#### Version History\n\nView, compare, and restore available versions of your Working Copy, with the imported Baseline kept distinct from later changes. The number of retained history versions is limited; this is not unlimited version control for every asset.\n\n#### Local-first storage\n\nThe core workflow does not require a DeMinds account. The web app uses local browser storage. On iPhone, iPad, and compatible Macs, you can choose a Local Workspace or an iCloud Workspace.\n\nLocal-first does not mean every feature works offline. Online imports, remote images, Content Sources, and iCloud still require the relevant network or system services.\n\n### Choose an export\n\n#### For further editing\n\n##### Markdown File\n\nTake your current Markdown into another editor or workflow. Image references are retained, but the full asset folder is not included automatically. Available in Standard.\n\n##### Standard Markdown Bundle\n\nTake the Markdown together with local images and other assets that can be packaged, preserving applicable relative paths. A valid bundle exported from the current project can also carry information that DeMinds uses to recognize the project when the work returns. Available in Standard.\n\n##### Portable Markdown File\n\nEmbed supported images in a single Markdown file when you want one file to carry with you. Requires Plus. Availability in the current document and Continue Working varies by platform, and other tools may differ in how they handle embedded images.\n\n#### For reading and sharing\n\n##### PDF Document\n\nOn iPhone, iPad, and compatible Macs, export your current Markdown document as a continuous PDF in Reading mode or a paginated PDF in Print mode. Available in Standard.\n\nPDF export does not imply support for general PDF import, scanned-document recognition, or OCR.\n\n##### Full Mind Map PNG\n\nExport the entire current map as a static image, with a Notes Appendix where supported. Useful for presenting and sharing an overview. Requires Plus.\n\n##### Interactive View\n\nExport a single `.deminds.html` file containing the body, the Universal Mind Map, or both. Recipients can read it, fold branches, and open Notes without editing the file. Creating an Interactive View requires Plus; reading one does not.\n\nDeMinds initially opens the file read-only. Only when you explicitly choose to import it does DeMinds create editable content from its validated Markdown and assets. Neither read-only opening nor explicit import requires Plus.\n\n### Continue with AI\n\n#### Prepare a file\n\nPrepare your content as a Standard Markdown Bundle, or as a single AI Editing File for an external tool that does not accept ZIP files. Available in Standard.\n\n#### Choose what to improve\n\nAsk for improvements to structure, or to both structure and wording. You can also request translation into a supported target language. The external AI tool you choose performs the work.\n\n#### Bring the result back\n\nWhen a valid result file returns and DeMinds can identify its project, you can compare the external version with your current Working Copy before confirming whether to apply it. You can also open it as new content.\n\nIf the file lacks enough information to identify the original project, automatic reconnection is not guaranteed. DeMinds does not guess the association and silently overwrite your work.\n\n#### You control the handoff\n\nDeMinds prepares files and accepts them when you bring them back. It does not automatically upload your content, call an external AI service, or fetch the result. You choose the tool, the task, and whether to apply the returned changes.\n","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"a0a02ff1599cc2e76cdc799bbfc5cf9e7230bd7bb825229111773a8586a89984","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eHow to use this guide\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:2bc8b50362eadfe608754bd437989e1cc0453566154dd7173583762a42a5e1d7\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"2,3","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eUniversal Mind Map: see the whole picture\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:f64c0250ec91c6752034e45ed069dc44617df6a95863e2c964974ffbd569842e\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u00 svg\u003e\u003c/a\u003e","payload":{"lines":"119,120","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eContinue with AI\u003c/span\u003e","payload":{"lines":"115,116","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eSave, export, and continue\u003c/span\u003e","payload":{"fold":1,"lines":"96,97","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eDeMinds Guide to Formats and Content\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"DeMinds Guide to Formats and Content\" data-note-id=\"note:sha256:f17bb1900ed4b9c5a8cc7b1598b1b89a94b3243118c76d3f1caaeda30699b8a7\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"deminds-guide-to-formats-and-content\"\u003eDeMinds Guide to Formats and Content\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eIf something is worth reading more closely, organizing, or coming back to, try bringing it into DeMinds.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eMarkdown, Obsidian notes, mind maps, DOCX documents, web articles, HTML papers, and shared AI conversations can all become material you keep working with. DeMinds brings across the content, structure, images, links, and source information it can recognize, so you can read, refine, and build on what matters.\u003c/p\u003e\n\u003cp\u003eThis guide explains what you can bring into DeMinds and what you can do with it once it is there.\u003c/p\u003e\n\u003cp\u003eApplies to DeMinds V1.0 / 1.0.38. What carries over varies by format. Available import options also depend on your platform and whether the source content is accessible.\u003c/p\u003e\n\u003ch2 id=\"getting-to-know-deminds\"\u003eGetting to know DeMinds\u003c/h2\u003e\n\u003ch3 id=\"how-to-use-this-guide\"\u003eHow to use this guide\u003c/h3\u003e\n\u003cp\u003eIf you are new to DeMinds, start with “Files and knowledge bases” or “Web and online content” to find the material you have. Then explore “Content and structure” to see what becomes a branch, stays in the body, or appears in a Note.\u003c/p\u003e\n\u003cp\u003eIf you already have content in DeMinds, “Content Sources and updates” and “Save, export, and continue” explain how to keep up with a source, take an editable copy elsewhere, or share a file for others to read.\u003c/p\u003e\n\u003cp\u003eFor each type of content, consider four questions: \u003cstrong\u003eWhat can I import? What carries over? How is it organized? What can I do next?\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"markdown-and-the-universal-mind-map\"\u003eMarkdown and the Universal Mind Map\u003c/h3\u003e\n\u003cp\u003eMarkdown and the Universal Mind Map give you two ways to work with the same content. Markdown holds the text you can read and edit; the map makes its organization easier to see.\u003c/p\u003e\n\u003ch4 id=\"universal-mind-map-see-the-whole-picture\"\u003eUniversal Mind Map: see the whole picture\u003c/h4\u003e\n\u003cp\u003eExplore a structure built from the headings, lists, and relationships DeMinds can identify. Expand branches, search, jump to a topic, pan, and zoom to move from an overview to the details.\u003c/p\u003e\n\u003ch4 id=\"markdown-preview-read-in-context\"\u003eMarkdown Preview: read in context\u003c/h4\u003e\n\u003cp\u003eRead the text, quotations, tables, code, common math expressions, and images in a continuous document. A detail you find in the map can be read alongside the surrounding text.\u003c/p\u003e\n\u003ch4 id=\"markdown-editing-develop-your-work\"\u003eMarkdown editing: develop your work\u003c/h4\u003e\n\u003cp\u003eRevise the text or reorganize headings and lists. Saving updates your Working Copy and the Universal Mind Map. Your original file outside DeMinds is left unchanged.\u003c/p\u003e\n\u003ch4 id=\"side-by-side-read-alongside-the-map\"\u003eSide-by-side: read alongside the map\u003c/h4\u003e\n\u003cp\u003eOn a sufficiently wide workspace, you can place Markdown and the Universal Mind Map next to each other. The Markdown pane supports reading and editing; the map updates when you save. On iPhone and in narrow windows, you work in one view at a time.\u003c/p\u003e\n\u003ch3 id=\"the-outline-and-the-details\"\u003eThe outline and the details\u003c/h3\u003e\n\u003cp\u003eThe main map keeps the outline easy to browse, while the body and node Notes hold the detail. Long passages, quotations, and tables do not all need to become separate map nodes. Where a Note has a suitable structure, you can switch between its Markdown and Structure views.\u003c/p\u003e\n\u003cp\u003eLong branches may start collapsed. Collapsed content is still there when you expand the branch.\u003c/p\u003e\n\u003ch3 id=\"from-import-to-ongoing-work\"\u003eFrom import to ongoing work\u003c/h3\u003e\n\u003cp\u003eAfter importing and saving content, you can reopen it from Continue Working to read or edit it again. Categories, work stages, and Version History help you organize and develop it over time.\u003c/p\u003e\n\u003cp\u003eA typical flow is: \u003cstrong\u003eBring content in → Explore its structure → Read the details → Edit and organize → Save your work → Come back and continue.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"how-deminds-finds-structure\"\u003eHow DeMinds finds structure\u003c/h3\u003e\n\u003cp\u003eDeMinds uses the headings, hierarchy, lists, paragraphs, and links it can recognize in the original. A clearly organized source usually produces a clearer map.\u003c/p\u003e\n\u003cp\u003eGenerating a map does not mean DeMinds has summarized, fact-checked, or reasoned through the document for you. Content that relies on font size, spacing, or visual layout to show its hierarchy may need some organizing after import.\u003c/p\u003e\n\u003ch3 id=\"availability-and-sharing\"\u003eAvailability and sharing\u003c/h3\u003e\n\u003ch4 id=\"standard-and-plus\"\u003eStandard and Plus\u003c/h4\u003e\n\u003cp\u003eThe main import formats in this guide, the Universal Mind Map, Markdown reading and editing, Content Sources, Markdown File and Standard Markdown Bundle exports, and Continue with AI are included in Standard.\u003c/p\u003e\n\u003cp\u003eOriginal Mind Map, Full Mind Map PNG export, Portable Markdown File, and Interactive View creation are Plus features. The relevant sections explain their requirements. You can check the full feature comparison and retention limits in the app.\u003c/p\u003e\n\u003ch4 id=\"platform-differences\"\u003ePlatform differences\u003c/h4\u003e\n\u003cp\u003eDeMinds runs on the web, on iPhone and iPad, and on compatible Macs through Designed for iPad on Mac. File selection, system sharing, Web Import Preview, and some export options differ between platforms.\u003c/p\u003e\n\u003cp\u003eDesigned for iPad on Mac runs the iPad app on a compatible Mac; it is not a separate macOS app. The web app in a narrow window also differs from the iPhone app.\u003c/p\u003e\n\u003ch4 id=\"what-affects-import-quality\"\u003eWhat affects import quality\u003c/h4\u003e\n\u003cp\u003eNo single level of fidelity applies to every source. Results depend on the original structure, available assets, access restrictions, file size, and the device or browser you use.\u003c/p\u003e\n\u003cp\u003eDeMinds does not bypass sign-in requirements, paywalls, or other access restrictions. If the full text cannot be retrieved reliably, the import may fail or the content may be incomplete.\u003c/p\u003e\n\u003ch4 id=\"sharing-and-publishing\"\u003eSharing and publishing\u003c/h4\u003e\n\u003cp\u003eBefore sharing or publishing, make sure the text, images, and other material are suitable for others to see and that you have permission to share them. An Interactive View is a read-only file; it does not provide encryption or access controls.\u003c/p\u003e\n\u003ch4 id=\"see-the-structure-keep-working\"\u003eSee the structure. Keep working.\u003c/h4\u003e\n\u003cp\u003eDeMinds helps turn worthwhile material from different sources into knowledge you can read, understand, edit, take with you, and return to over time.\u003c/p\u003e\n\u003ch2 id=\"files-and-knowledge-bases\"\u003eFiles and knowledge bases\u003c/h2\u003e\n\u003ch3 id=\"text-and-markdown-collections\"\u003eText and Markdown collections\u003c/h3\u003e\n\u003ch4 id=\"markdown-and-plain-text\"\u003eMarkdown and plain text\u003c/h4\u003e\n\u003ch5 id=\"what-you-can-bring-in\"\u003eWhat you can bring in\u003c/h5\u003e\n\u003cp\u003eDeMinds reads \u003ccode\u003e.md\u003c/code\u003e, \u003ccode\u003e.markdown\u003c/code\u003e, and \u003ccode\u003e.txt\u003c/code\u003e files. Markdown is a natural fit for the app and the main format used to keep working with content from other sources. Text files are interpreted from their contents; the \u003ccode\u003e.txt\u003c/code\u003e extension alone does not give them a hierarchy.\u003c/p\u003e\n\u003ch5 id=\"what-you-can-do-next\"\u003eWhat you can do next\u003c/h5\u003e\n\u003cp\u003eOpen a file to read it, explore its Universal Mind Map, and edit it. You can also type or paste Markdown, refine it, and then create a project.\u003c/p\u003e\n\u003cp\u003eCode, tables, images, and common math expressions are handled where DeMinds recognizes the Markdown. Syntax specific to another tool is not automatically supported as standard Markdown.\u003c/p\u003e\n\u003ch4 id=\"markdown-package\"\u003eMarkdown Package\u003c/h4\u003e\n\u003ch5 id=\"work-with-several-documents-together\"\u003eWork with several documents together\u003c/h5\u003e\n\u003cp\u003eSelect one or more Markdown documents from a folder or ZIP, along with the assets DeMinds can resolve. Your selection determines which documents are imported.\u003c/p\u003e\n\u003ch5 id=\"three-ways-to-organize-them\"\u003eThree ways to organize them\u003c/h5\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMode\u003c/th\u003e\n\u003cth\u003eBest suited to\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eSequential merge\u003c/td\u003e\n\u003ctd\u003eDocuments you want to read in the order you select them\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFolder tree\u003c/td\u003e\n\u003ctd\u003eA collection whose folder hierarchy you want to retain\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVault structure\u003c/td\u003e\n\u003ctd\u003eA recognized Obsidian Vault whose organization you want to use\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch5 id=\"images-and-document-links\"\u003eImages and document links\u003c/h5\u003e\n\u003cp\u003eImages that DeMinds can locate within the supported asset scope are processed with the selected content. Recognized standard Markdown links between selected documents can become navigation links within the result.\u003c/p\u003e\n\u003cp\u003eKeeping an image reference is different from including the image file. Missing assets, unresolved paths, or files outside the selected scope may prevent images from carrying over with the text.\u003c/p\u003e\n\u003ch4 id=\"obsidian-vault\"\u003eObsidian Vault\u003c/h4\u003e\n\u003ch5 id=\"structure-and-content\"\u003eStructure and content\u003c/h5\u003e\n\u003ch6 id=\"use-the-vaults-organization\"\u003eUse the Vault's organization\u003c/h6\u003e\n\u003cp\u003eDeMinds uses the folder and note relationships within your selection, including recognized Folder Notes: notes that describe a folder. The result draws on the Vault's organization, rather than simply joining \u003ccode\u003e.md\u003c/code\u003e files end to end.\u003c/p\u003e\n\u003ch6 id=\"common-links-and-static-images\"\u003eCommon links and static images\u003c/h6\u003e\n\u003cp\u003eDeMinds handles common Markdown document links, Wiki Links, and static Wiki Image Embeds such as \u003ccode\u003e![[image.png]]\u003c/code\u003e when the target image can be identified without ambiguity. Relative image paths are also handled where they can be resolved.\u003c/p\u003e\n\u003ch6 id=\"readable-forms-of-obsidian-syntax\"\u003eReadable forms of Obsidian syntax\u003c/h6\u003e\n\u003cp\u003eSome static constructs, such as Callouts, can be presented as ordinary quotations or text. Their readable content carries over; the behavior of an Obsidian plugin does not.\u003c/p\u003e\n\u003ch5 id=\"where-compatibility-ends\"\u003eWhere compatibility ends\u003c/h5\u003e\n\u003cp\u003eThis is a way to organize and bring across the selected content as it exists at import time. Wiki Links primarily navigate between selected documents; precise jumps to Obsidian headings or block references are not guaranteed.\u003c/p\u003e\n\u003cp\u003eDeMinds does not follow links to import unselected notes recursively, run plugins or Dataview, recreate the full graph, write changes back to the Vault, or provide two-way sync.\u003c/p\u003e\n\u003cp\u003eSupport for Wiki Image Embeds does not extend to every embed type, including embedded notes, PDFs, audio, and video.\u003c/p\u003e\n\u003ch3 id=\"mind-maps\"\u003eMind maps\u003c/h3\u003e\n\u003ch4 id=\"supported-formats\"\u003eSupported formats\u003c/h4\u003e\n\u003ch5 id=\"mindnode\"\u003eMindNode\u003c/h5\u003e\n\u003cp\u003eDeMinds reads compatible \u003ccode\u003e.mindnode\u003c/code\u003e files and folder packages. It brings across the hierarchy, Notes, images, and some title formatting and styles that it can recover, including supported documents with multiple main nodes. How you select a folder package depends on the platform and file provider.\u003c/p\u003e\n\u003ch5 id=\"xmind\"\u003eXMind\u003c/h5\u003e\n\u003cp\u003eDeMinds reads the hierarchy, Notes, images, and supported theme, color, and branch styling information in \u003ccode\u003e.xmind\u003c/code\u003e files. What carries over depends on the package's structure and contents.\u003c/p\u003e\n\u003ch5 id=\"freemind-and-freeplane\"\u003eFreeMind and Freeplane\u003c/h5\u003e\n\u003cp\u003eDeMinds reads the tree structure, NOTE and DETAILS content, links, and resolvable image assets in \u003ccode\u003e.mm\u003c/code\u003e files.\u003c/p\u003e\n\u003ch4 id=\"universal-mind-map-and-original-mind-map\"\u003eUniversal Mind Map and Original Mind Map\u003c/h4\u003e\n\u003cp\u003eAn imported mind map can become editable Markdown and a Universal Mind Map. The Universal Mind Map gives you a consistent way to read, review structure, and continue working across formats.\u003c/p\u003e\n\u003cp\u003eWith DeMinds Plus, mind map files whose original data can be recovered can also offer an Original Mind Map view. It shows the structure and visual presentation DeMinds can reconstruct from the source. Markdown and web articles do not have an Original Mind Map view.\u003c/p\u003e\n\u003ch4 id=\"fidelity-and-editing\"\u003eFidelity and editing\u003c/h4\u003e\n\u003cp\u003eFor each format, DeMinds aims to retain the main structure, node content, Notes, images, and links. It cannot reproduce every complex layout, proprietary style, or special object.\u003c/p\u003e\n\u003cp\u003eEdits apply to your Markdown Working Copy. They do not modify the external MindNode, XMind, or \u003ccode\u003e.mm\u003c/code\u003e file. You should not expect every change to export back into the original app's format.\u003c/p\u003e\n\u003ch3 id=\"documents-and-outlines\"\u003eDocuments and outlines\u003c/h3\u003e\n\u003ch4 id=\"docx\"\u003eDOCX\u003c/h4\u003e\n\u003ch5 id=\"content-and-structure\"\u003eContent and structure\u003c/h5\u003e\n\u003cp\u003eBring headings, paragraphs, lists, convertible tables, images, and other supported content into a Markdown workflow. DeMinds also keeps the imported DOCX as the original source.\u003c/p\u003e\n\u003ch5 id=\"what-to-expect\"\u003eWhat to expect\u003c/h5\u003e\n\u003cp\u003eThe focus is on content and organization. Complex Word layouts, including headers, footers, columns, and floating objects, may not carry over faithfully. Older \u003ccode\u003e.doc\u003c/code\u003e files are not supported.\u003c/p\u003e\n\u003ch4 id=\"html-and-htm\"\u003eHTML and HTM\u003c/h4\u003e\n\u003ch5 id=\"content-and-structure-1\"\u003eContent and structure\u003c/h5\u003e\n\u003cp\u003eDeMinds imports compatible \u003ccode\u003e.html\u003c/code\u003e and \u003ccode\u003e.htm\u003c/code\u003e files. It recognizes ordinary HTML, web articles, or AI Share Pages, cleans up the content, and converts it to Markdown.\u003c/p\u003e\n\u003ch5 id=\"what-to-expect-1\"\u003eWhat to expect\u003c/h5\u003e\n\u003cp\u003eSupport for saved HTML does not cover every browser-specific web archive format. Page scripts, interactive controls, and decorative elements are not treated as editable document content.\u003c/p\u003e\n\u003ch4 id=\"opml\"\u003eOPML\u003c/h4\u003e\n\u003ch5 id=\"content-and-structure-2\"\u003eContent and structure\u003c/h5\u003e\n\u003cp\u003eBring across outline levels, notes, and links for further work. Local files and supported online sources are accepted, including GitHub file links.\u003c/p\u003e\n\u003ch5 id=\"what-to-expect-2\"\u003eWhat to expect\u003c/h5\u003e\n\u003cp\u003eThe result is an ordinary editable project. Even if the OPML contains subscription URLs, importing it does not automatically create or subscribe to Feed Content Sources.\u003c/p\u003e\n\u003ch3 id=\"zip-and-folders\"\u003eZIP and folders\u003c/h3\u003e\n\u003cp\u003eZIP files and folders are containers. DeMinds examines their contents to identify a Markdown Package, mind map package, Workspace Backup, or other supported material, then opens it through the appropriate import process.\u003c/p\u003e\n\u003cp\u003ePutting an unsupported file in a ZIP does not make it supported. Restoring a Workspace Backup also serves a different purpose from importing a document; Workspace Backup import requires Plus.\u003c/p\u003e\n\u003ch2 id=\"web-and-online-content\"\u003eWeb and online content\u003c/h2\u003e\n\u003ch3 id=\"articles-and-long-form-pages\"\u003eArticles and long-form pages\u003c/h3\u003e\n\u003ch4 id=\"pages-that-work-best\"\u003ePages that work best\u003c/h4\u003e\n\u003cp\u003ePublicly accessible articles, blog posts, technical writing, and some documentation pages are usually a good fit when the full text is available and clearly structured.\u003c/p\u003e\n\u003cp\u003eDeMinds looks for the title, author, date, body, images, and links while reducing clutter from navigation, recommendations, and page decoration.\u003c/p\u003e\n\u003ch4 id=\"sources-with-tailored-handling\"\u003eSources with tailored handling\u003c/h4\u003e\n\u003cp\u003eSome sources, including WeChat Official Account articles, Zhihu, Medium, Substack, and Sspai, have tailored rules for identifying and cleaning up articles. X Articles that display their text without sign-in also have dedicated handling.\u003c/p\u003e\n\u003cp\u003eThis applies to eligible articles, not every page on those sites. Home pages, profiles, and search results may not be importable.\u003c/p\u003e\n\u003ch4 id=\"web-import-preview\"\u003eWeb Import Preview\u003c/h4\u003e\n\u003cp\u003eOn iPhone, iPad, and Designed for iPad on Mac, Web Import Preview lets you view a page before confirming the import.\u003c/p\u003e\n\u003cp\u003eAccess restrictions, complex page loading, and third-party sign-in requirements can still affect the result. Your Safari sign-in sessions do not automatically carry over to DeMinds, and signing in within the preview is not guaranteed to work on every site.\u003c/p\u003e\n\u003ch3 id=\"github-and-online-files\"\u003eGitHub and online files\u003c/h3\u003e\n\u003ch4 id=\"public-markdown-documents\"\u003ePublic Markdown documents\u003c/h4\u003e\n\u003cp\u003eDeMinds handles public READMEs and Markdown documents, including heading anchors, relative image paths, and recognized links to related documents. Opening a document link processes that target; it does not scan the entire repository.\u003c/p\u003e\n\u003ch4 id=\"file-links-and-repository-urls\"\u003eFile links and repository URLs\u003c/h4\u003e\n\u003cp\u003eA link to an individual Markdown file normally imports an editable document. A URL pointing to the repository root can create a GitHub README Content Source, so you can check for README updates later.\u003c/p\u003e\n\u003cp\u003eA file does not become a repository-wide Content Source simply because it is hosted on GitHub.\u003c/p\u003e\n\u003ch4 id=\"links-to-supported-files\"\u003eLinks to supported files\u003c/h4\u003e\n\u003cp\u003ePublic links to identifiable Markdown, text, HTML, DOCX, XMind, MindNode, FreeMind, and OPML files can use the corresponding import process after type, size, and download checks.\u003c/p\u003e\n\u003cp\u003eThis does not cover every download page, private link, or cloud-storage sharing link. GitHub support does not include private repository sign-in, browsing an entire repository, or importing all its files recursively.\u003c/p\u003e\n\u003ch3 id=\"papers-and-research-articles\"\u003ePapers and research articles\u003c/h3\u003e\n\u003ch4 id=\"arxiv-html-papers\"\u003earXiv HTML papers\u003c/h4\u003e\n\u003ch5 id=\"paper-content-and-reading\"\u003ePaper content and reading\u003c/h5\u003e\n\u003ch6 id=\"paper-details-and-sections\"\u003ePaper details and sections\u003c/h6\u003e\n\u003cp\u003eDeMinds retains the title, authors, affiliations, arXiv identifier, abstract, references, and appendices it can recognize, helping you follow the paper's organization.\u003c/p\u003e\n\u003ch6 id=\"math-code-and-algorithms\"\u003eMath, code, and algorithms\u003c/h6\u003e\n\u003cp\u003eDeMinds preserves math it can reliably recover, code listings, numbered algorithms, and the steps, indentation, and explanations within them. Recognized prompt templates also retain a readable structure.\u003c/p\u003e\n\u003ch6 id=\"table-structure\"\u003eTable structure\u003c/h6\u003e\n\u003cp\u003eTables that can be reliably reconstructed in standard Markdown use that format. Some tables with merged cells, multiple header levels, or grouped content are retained in a richer form that DeMinds can display.\u003c/p\u003e\n\u003cp\u003eThese complex tables are primarily read in Markdown Preview and Interactive View; each cell does not become a separate map node. Other Markdown tools may not display these special structures in the same way.\u003c/p\u003e\n\u003ch6 id=\"links-within-a-paper\"\u003eLinks within a paper\u003c/h6\u003e\n\u003cp\u003eRecognized links between sections, figures, tables, algorithms, and references are preserved, helping you move through the paper and between the map and the text.\u003c/p\u003e\n\u003ch5 id=\"the-limits-of-html-support\"\u003eThe limits of HTML support\u003c/h5\u003e\n\u003cp\u003eThese capabilities apply to recognized arXiv HTML structures. They do not imply the same fidelity for arbitrary HTML, DOCX, PDF, or TeX source files. Citation graphs and automatic paper-version updates are not included.\u003c/p\u003e\n\u003cp\u003eSome arXiv import links point to the HTML version even when their path contains \u003ccode\u003epdf\u003c/code\u003e. If the HTML version is unavailable, DeMinds does not automatically switch to PDF extraction, an abstract-only import, or OCR.\u003c/p\u003e\n\u003ch4 id=\"nature-articles\"\u003eNature articles\u003c/h4\u003e\n\u003ch5 id=\"article-details-and-images\"\u003eArticle details and images\u003c/h5\u003e\n\u003cp\u003eEligible Nature article pages can retain article information, body images, and links within the page to figures, tables, and references.\u003c/p\u003e\n\u003ch5 id=\"bringing-in-tables\"\u003eBringing in tables\u003c/h5\u003e\n\u003cp\u003eIn Web Import Preview on iPhone, iPad, or a compatible Mac, DeMinds will try to include a simple table from a separate page of the same article when it can retrieve and verify it. Otherwise, the original table link remains, and the main article import can continue.\u003c/p\u003e\n\u003ch5 id=\"when-the-full-text-is-unavailable\"\u003eWhen the full text is unavailable\u003c/h5\u003e\n\u003cp\u003eIf the article body contains an explicit access restriction, DeMinds does not import surrounding material, such as the abstract and references, as though it were the complete article.\u003c/p\u003e\n\u003ch3 id=\"shared-ai-content\"\u003eShared AI content\u003c/h3\u003e\n\u003ch4 id=\"supported-sources\"\u003eSupported sources\u003c/h4\u003e\n\u003cp\u003eDeMinds supports specific sharing options from ChatGPT, DeepSeek, Gemini, and Doubao. Depending on the source, you can use a supported public share link, saved HTML, or the system share sheet.\u003c/p\u003e\n\u003ch4 id=\"what-the-import-includes\"\u003eWhat the import includes\u003c/h4\u003e\n\u003cp\u003eThe import is limited to what the shared page makes public and what DeMinds can recognize. ChatGPT supports both full-conversation shares and certain public single-response shares; a single response is not expanded into a full conversation.\u003c/p\u003e\n\u003cp\u003eCode, lists, tables, and common math expressions are handled according to the content structure DeMinds can identify.\u003c/p\u003e\n\u003ch4 id=\"keep-working-with-useful-answers\"\u003eKeep working with useful answers\u003c/h4\u003e\n\u003cp\u003eValuable AI content can become a project you return to: explore it in the Universal Mind Map, read and edit the Markdown, or export it for further use.\u003c/p\u003e\n\u003ch4 id=\"accounts-and-private-content\"\u003eAccounts and private content\u003c/h4\u003e\n\u003cp\u003eImporting shared AI content does not connect to your AI account or read private chat history. Attachments, tool results, and hidden content that the shared page does not expose may not be recoverable.\u003c/p\u003e\n\u003ch2 id=\"content-and-structure-3\"\u003eContent and structure\u003c/h2\u003e\n\u003ch3 id=\"headings-lists-and-text\"\u003eHeadings, lists, and text\u003c/h3\u003e\n\u003ch4 id=\"headings-and-hierarchy\"\u003eHeadings and hierarchy\u003c/h4\u003e\n\u003cp\u003eRecognized headings form the main outline and branches. Folder structures, mind map nodes, and Markdown headings provide different kinds of hierarchy depending on the source.\u003c/p\u003e\n\u003ch4 id=\"lists-and-nesting\"\u003eLists and nesting\u003c/h4\u003e\n\u003cp\u003eList levels contribute to the structure where their relationships are clear. DeMinds does not infer a parent–child relationship between otherwise parallel items without sufficient evidence.\u003c/p\u003e\n\u003ch4 id=\"paragraphs-quotations-and-notes\"\u003eParagraphs, quotations, and Notes\u003c/h4\u003e\n\u003cp\u003eLong paragraphs, quotations, and detailed explanations stay in the body or in node Notes, keeping the main map manageable. Suitable Notes can also be explored in their own structure view.\u003c/p\u003e\n\u003ch3 id=\"tables-code-and-math\"\u003eTables, code, and math\u003c/h3\u003e\n\u003ch4 id=\"tables\"\u003eTables\u003c/h4\u003e\n\u003cp\u003eOrdinary tables are mainly read in the body and Notes. Complex tables are handled according to their source and what can be recovered; the arXiv-specific support does not extend to complex tables in every format.\u003c/p\u003e\n\u003ch4 id=\"code\"\u003eCode\u003c/h4\u003e\n\u003cp\u003eCode blocks and inline code remain code. Heading symbols inside code do not become document headings, and importing or reading code does not execute it.\u003c/p\u003e\n\u003ch4 id=\"math\"\u003eMath\u003c/h4\u003e\n\u003cp\u003eDeMinds supports common Markdown math and mathematical expressions it can recover during HTML import. Appearance can vary with the expression and the view you use. This is not a full TeX typesetting system.\u003c/p\u003e\n\u003ch3 id=\"images-links-and-sources\"\u003eImages, links, and sources\u003c/h3\u003e\n\u003ch4 id=\"local-and-packaged-images\"\u003eLocal and packaged images\u003c/h4\u003e\n\u003cp\u003eLocal images and images within a package can be displayed when DeMinds can resolve them, and included in exports that support bundling those assets. Missing files, unresolved paths, or unsupported assets may prevent an image from appearing.\u003c/p\u003e\n\u003ch4 id=\"online-images\"\u003eOnline images\u003c/h4\u003e\n\u003cp\u003eKeeping an online image reference does not save an offline copy. The image may still depend on its original host, your connection, and access permissions. Whether the image itself travels with an export depends on the export format.\u003c/p\u003e\n\u003cp\u003eWhen an Interactive View is opened as a local file or read inside DeMinds, you choose when to load eligible online images. When served as a public HTTPS page, it can load those images automatically. Failed images remain as placeholders that let you retry.\u003c/p\u003e\n\u003ch4 id=\"document-links-and-page-navigation\"\u003eDocument links and page navigation\u003c/h4\u003e\n\u003cp\u003eDeMinds aims to preserve external links, recognized document links, and jumps within a page. Accurate navigation depends on the target being available and the source link being resolvable.\u003c/p\u003e\n\u003ch4 id=\"return-to-the-source\"\u003eReturn to the source\u003c/h4\u003e\n\u003cp\u003eEligible web articles, AI Share Pages, and GitHub documents can retain source information and offer a way to revisit the original page. Visiting the source does not refresh or reimport your Working Copy.\u003c/p\u003e\n\u003ch3 id=\"audio-video-and-other-attachments\"\u003eAudio, video, and other attachments\u003c/h3\u003e\n\u003cp\u003eA reference to an attachment does not guarantee that the file can be transferred in full, played offline, or included in every export format.\u003c/p\u003e\n\u003cp\u003ePreview availability depends on the assets, their formats, and your device or browser. This does not imply automatic media downloading, transcoding, repair, or recognition of text inside images.\u003c/p\u003e\n\u003ch2 id=\"content-sources-and-updates\"\u003eContent Sources and updates\u003c/h2\u003e\n\u003ch3 id=\"feeds\"\u003eFeeds\u003c/h3\u003e\n\u003cp\u003eDeMinds checks that a feed uses a supported format—RSS, Atom, RDF, or JSON Feed—then saves its content as a read-only Content Source.\u003c/p\u003e\n\u003cp\u003eIf the feed provides full text, DeMinds can work with that text. If it provides only a summary, only the summary is available. DeMinds does not automatically follow each entry to retrieve the full article.\u003c/p\u003e\n\u003cp\u003eAn \u003ccode\u003e.xml\u003c/code\u003e or \u003ccode\u003e.json\u003c/code\u003e extension alone does not identify a feed; the contents must match a supported feed format.\u003c/p\u003e\n\u003ch3 id=\"github-readme\"\u003eGitHub README\u003c/h3\u003e\n\u003cp\u003eUse a URL pointing to a GitHub repository root, or choose to convert an eligible README, to create a GitHub README Content Source. It stays linked to the repository so you can check for updates manually.\u003c/p\u003e\n\u003cp\u003eUpdates apply to the README, not the repository's entire file collection.\u003c/p\u003e\n\u003ch3 id=\"how-sources-differ-from-working-documents\"\u003eHow sources differ from working documents\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWorking document\u003c/th\u003e\n\u003cth\u003eContent Source\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eEdit and develop your own Working Copy\u003c/td\u003e\n\u003ctd\u003eRead the most recently retrieved content from an external source\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSave your changes\u003c/td\u003e\n\u003ctd\u003eCheck for source updates manually\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAn ordinary import does not track the original page\u003c/td\u003e\n\u003ctd\u003eRetains the supported source connection\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe body can be edited\u003c/td\u003e\n\u003ctd\u003eThe source content is read-only\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"check-for-updates\"\u003eCheck for updates\u003c/h3\u003e\n\u003cp\u003eSources appear under Content Sources in Continue Working. Updates run only when you ask; DeMinds does not poll for them in the background.\u003c/p\u003e\n\u003cp\u003eIf a check fails or you cancel it, the last successfully retrieved content remains. If nothing has changed, no new history version is created. Content Sources do not currently include unread tracking, recommendations, or automatic full-article retrieval found in some feed readers.\u003c/p\u003e\n\u003ch2 id=\"save-export-and-continue\"\u003eSave, export, and continue\u003c/h2\u003e\n\u003ch3 id=\"bring-content-in\"\u003eBring content in\u003c/h3\u003e\n\u003ch4 id=\"files-and-folders\"\u003eFiles and folders\u003c/h4\u003e\n\u003cp\u003eUse the file or folder picker available on your platform to open supported content. The file provider, package type, and availability of cloud files can affect whether DeMinds can read it.\u003c/p\u003e\n\u003ch4 id=\"clipboard\"\u003eClipboard\u003c/h4\u003e\n\u003cp\u003eImport from Clipboard can recognize plain text, Markdown, rich text, HTML, and supported image content. What is available depends on what the source app places on the clipboard.\u003c/p\u003e\n\u003ch4 id=\"system-sharing\"\u003eSystem sharing\u003c/h4\u003e\n\u003cp\u003eOn iPhone, iPad, and compatible Macs, use the system share sheet to send files, text, URLs, or supported combinations to DeMinds, then confirm the import.\u003c/p\u003e\n\u003ch4 id=\"web-and-file-links\"\u003eWeb and file links\u003c/h4\u003e\n\u003cp\u003eLinks are handled according to what they point to. Web articles, online documents, shared AI content, and Content Sources each follow their own import rules.\u003c/p\u003e\n\u003ch3 id=\"keep-your-work\"\u003eKeep your work\u003c/h3\u003e\n\u003ch4 id=\"continue-working\"\u003eContinue Working\u003c/h4\u003e\n\u003cp\u003eSaved projects can be reopened and edited; Continue Working does more than list recently opened files. The number of projects you can retain depends on your plan.\u003c/p\u003e\n\u003ch4 id=\"version-history\"\u003eVersion History\u003c/h4\u003e\n\u003cp\u003eView, compare, and restore available versions of your Working Copy, with the imported Baseline kept distinct from later changes. The number of retained history versions is limited; this is not unlimited version control for every asset.\u003c/p\u003e\n\u003ch4 id=\"local-first-storage\"\u003eLocal-first storage\u003c/h4\u003e\n\u003cp\u003eThe core workflow does not require a DeMinds account. The web app uses local browser storage. On iPhone, iPad, and compatible Macs, you can choose a Local Workspace or an iCloud Workspace.\u003c/p\u003e\n\u003cp\u003eLocal-first does not mean every feature works offline. Online imports, remote images, Content Sources, and iCloud still require the relevant network or system services.\u003c/p\u003e\n\u003ch3 id=\"choose-an-export\"\u003eChoose an export\u003c/h3\u003e\n\u003ch4 id=\"for-further-editing\"\u003eFor further editing\u003c/h4\u003e\n\u003ch5 id=\"markdown-file\"\u003eMarkdown File\u003c/h5\u003e\n\u003cp\u003eTake your current Markdown into another editor or workflow. Image references are retained, but the full asset folder is not included automatically. Available in Standard.\u003c/p\u003e\n\u003ch5 id=\"standard-markdown-bundle\"\u003eStandard Markdown Bundle\u003c/h5\u003e\n\u003cp\u003eTake the Markdown together with local images and other assets that can be packaged, preserving applicable relative paths. A valid bundle exported from the current project can also carry information that DeMinds uses to recognize the project when the work returns. Available in Standard.\u003c/p\u003e\n\u003ch5 id=\"portable-markdown-file\"\u003ePortable Markdown File\u003c/h5\u003e\n\u003cp\u003eEmbed supported images in a single Markdown file when you want one file to carry with you. Requires Plus. Availability in the current document and Continue Working varies by platform, and other tools may differ in how they handle embedded images.\u003c/p\u003e\n\u003ch4 id=\"for-reading-and-sharing\"\u003eFor reading and sharing\u003c/h4\u003e\n\u003ch5 id=\"pdf-document\"\u003ePDF Document\u003c/h5\u003e\n\u003cp\u003eOn iPhone, iPad, and compatible Macs, export your current Markdown document as a continuous PDF in Reading mode or a paginated PDF in Print mode. Available in Standard.\u003c/p\u003e\n\u003cp\u003ePDF export does not imply support for general PDF import, scanned-document recognition, or OCR.\u003c/p\u003e\n\u003ch5 id=\"full-mind-map-png\"\u003eFull Mind Map PNG\u003c/h5\u003e\n\u003cp\u003eExport the entire current map as a static image, with a Notes Appendix where supported. Useful for presenting and sharing an overview. Requires Plus.\u003c/p\u003e\n\u003ch5 id=\"interactive-view\"\u003eInteractive View\u003c/h5\u003e\n\u003cp\u003eExport a single \u003ccode\u003e.deminds.html\u003c/code\u003e file containing the body, the Universal Mind Map, or both. Recipients can read it, fold branches, and open Notes without editing the file. Creating an Interactive View requires Plus; reading one does not.\u003c/p\u003e\n\u003cp\u003eDeMinds initially opens the file read-only. Only when you explicitly choose to import it does DeMinds create editable content from its validated Markdown and assets. Neither read-only opening nor explicit import requires Plus.\u003c/p\u003e\n\u003ch3 id=\"continue-with-ai\"\u003eContinue with AI\u003c/h3\u003e\n\u003ch4 id=\"prepare-a-file\"\u003ePrepare a file\u003c/h4\u003e\n\u003cp\u003ePrepare your content as a Standard Markdown Bundle, or as a single AI Editing File for an external tool that does not accept ZIP files. Available in Standard.\u003c/p\u003e\n\u003ch4 id=\"choose-what-to-improve\"\u003eChoose what to improve\u003c/h4\u003e\n\u003cp\u003eAsk for improvements to structure, or to both structure and wording. You can also request translation into a supported target language. The external AI tool you choose performs the work.\u003c/p\u003e\n\u003ch4 id=\"bring-the-result-back\"\u003eBring the result back\u003c/h4\u003e\n\u003cp\u003eWhen a valid result file returns and DeMinds can identify its project, you can compare the external version with your current Working Copy before confirming whether to apply it. You can also open it as new content.\u003c/p\u003e\n\u003cp\u003eIf the file lacks enough information to identify the original project, automatic reconnection is not guaranteed. DeMinds does not guess the association and silently overwrite your work.\u003c/p\u003e\n\u003ch4 id=\"you-control-the-handoff\"\u003eYou control the handoff\u003c/h4\u003e\n\u003cp\u003eDeMinds prepares files and accepts them when you bring them back. It does not automatically upload your content, call an external AI service, or fetch the result. You choose the tool, the task, and whether to apply the returned changes.\u003c/p\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:002ed276e6811cf40e96b71628a0c88be997506eb0d14edab39ccc2bc24110dd":{"html":"\u003cp\u003eUse a URL pointing to a GitHub repository root, or choose to convert an eligible README, to create a GitHub README Content Source. It stays linked to the repository so you can check for updates manually.\u003c/p\u003e\n\u003cp\u003eUpdates apply to the README, not the repository's entire file collection.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Use a URL pointing to a GitHub repository root, or choose to convert an eligible README, to create a GitHub README Content Source. It stays linked to the repository so you can check for updates manually.\n\nUpdates apply to the README, not the repository's entire file collection.","sourceFormat":"markdown"},"note:sha256:009a45ce9b36559c69b17b73baac40d6f733ff7dcb02c7a9a588abaa295773d1":{"html":"\u003cp\u003eExport the entire current map as a static image, with a Notes Appendix where supported. Useful for presenting and sharing an overview. Requires Plus.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Export the entire current map as a static image, with a Notes Appendix where supported. Useful for presenting and sharing an overview. Requires Plus.","sourceFormat":"markdown"},"note:sha256:0580a96d925d47d85ee240aceaa347643ff25c5332aaabc8ee9b944e8bb8aeff":{"html":"\u003cp\u003eIf the article body contains an explicit access restriction, DeMinds does not import surrounding material, such as the abstract and references, as though it were the complete article.\u003c/p\u003e\n","kind":"html","rawMarkdown":"If the article body contains an explicit access restriction, DeMinds does not import surrounding material, such as the abstract and references, as though it were the complete article.","sourceFormat":"markdown"},"note:sha256:07d27bc9ad8147d1746f55a285928be13b638ed6f05644571bf2d41e47354b3f":{"html":"\u003cp\u003eDeMinds supports common Markdown math and mathematical expressions it can recover during HTML import. Appearance can vary with the expression and the view you use. This is not a full TeX typesetting system.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds supports common Markdown math and mathematical expressions it can recover during HTML import. Appearance can vary with the expression and the view you use. This is not a full TeX typesetting system.","sourceFormat":"markdown"},"note:sha256:0ec3e08a1dea6cf5f9ff75d64485c05c71902f0cd9c1491265f2075ef9a59431":{"html":"\u003cp\u003eA link to an individual Markdown file normally imports an editable document. A URL pointing to the repository root can create a GitHub README Content Source, so you can check for README updates later.\u003c/p\u003e\n\u003cp\u003eA file does not become a repository-wide Content Source simply because it is hosted on GitHub.\u003c/p\u003e\n","kind":"html","rawMarkdown":"A link to an individual Markdown file normally imports an editable document. A URL pointing to the repository root can create a GitHub README Content Source, so you can check for README updates later.\n\nA file does not become a repository-wide Content Source simply because it is hosted on GitHub.","sourceFormat":"markdown"},"note:sha256:0f0bfdc3916340bb400089a8252f6d425d8669db7bba5f56205de32284f7a57b":{"html":"\u003cp\u003eRecognized headings form the main outline and branches. Folder structures, mind map nodes, and Markdown headings provide different kinds of hierarchy depending on the source.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Recognized headings form the main outline and branches. Folder structures, mind map nodes, and Markdown headings provide different kinds of hierarchy depending on the source.","sourceFormat":"markdown"},"note:sha256:10654d8323494575f0746c49d4135eab7326ef7c26e502de3e86a655c757ca82":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMode\u003c/th\u003e\n\u003cth\u003eBest suited to\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eSequential merge\u003c/td\u003e\n\u003ctd\u003eDocuments you want to read in the order you select them\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFolder tree\u003c/td\u003e\n\u003ctd\u003eA collection whose folder hierarchy you want to retain\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVault structure\u003c/td\u003e\n\u003ctd\u003eA recognized Obsidian Vault whose organization you want to use\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n","kind":"html","rawMarkdown":"| Mode | Best suited to |\n| --- | --- |\n| Sequential merge | Documents you want to read in the order you select them |\n| Folder tree | A collection whose folder hierarchy you want to retain |\n| Vault structure | A recognized Obsidian Vault whose organization you want to use |","sourceFormat":"markdown"},"note:sha256:1401524df05d3b58dfa334066a0a5f0b00d0e17ae66f156276db19bbcbafaa1b":{"html":"\u003cp\u003eSources appear under Content Sources in Continue Working. Updates run only when you ask; DeMinds does not poll for them in the background.\u003c/p\u003e\n\u003cp\u003eIf a check fails or you cancel it, the last successfully retrieved content remains. If nothing has changed, no new history version is created. Content Sources do not currently include unread tracking, recommendations, or automatic full-article retrieval found in some feed readers.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Sources appear under Content Sources in Continue Working. Updates run only when you ask; DeMinds does not poll for them in the background.\n\nIf a check fails or you cancel it, the last successfully retrieved content remains. If nothing has changed, no new history version is created. Content Sources do not currently include unread tracking, recommendations, or automatic full-article retrieval found in some feed readers.","sourceFormat":"markdown"},"note:sha256:144f48e8f9904cc65fed26dd20d9909e564ac89c3734616e158ca320306cb8a9":{"html":"\u003cp\u003eDeMinds reads compatible \u003ccode\u003e.mindnode\u003c/code\u003e files and folder packages. It brings across the hierarchy, Notes, images, and some title formatting and styles that it can recover, including supported documents with multiple main nodes. How you select a folder package depends on the platform and file provider.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds reads compatible `.mindnode` files and folder packages. It brings across the hierarchy, Notes, images, and some title formatting and styles that it can recover, including supported documents with multiple main nodes. How you select a folder package depends on the platform and file provider.","sourceFormat":"markdown"},"note:sha256:188d96c93e52bdde61b445d59526be6bfbe52b72e6ec69497d85d43418a67dc4":{"html":"\u003cp\u003eIn Web Import Preview on iPhone, iPad, or a compatible Mac, DeMinds will try to include a simple table from a separate page of the same article when it can retrieve and verify it. Otherwise, the original table link remains, and the main article import can continue.\u003c/p\u003e\n","kind":"html","rawMarkdown":"In Web Import Preview on iPhone, iPad, or a compatible Mac, DeMinds will try to include a simple table from a separate page of the same article when it can retrieve and verify it. Otherwise, the original table link remains, and the main article import can continue.","sourceFormat":"markdown"},"note:sha256:1c29b5bfba9750bdd61d38aa511fd764a0a963df105f9939a1a67417bb59251b":{"html":"\u003cp\u003eDeMinds handles common Markdown document links, Wiki Links, and static Wiki Image Embeds such as \u003ccode\u003e![[image.png]]\u003c/code\u003e when the target image can be identified without ambiguity. Relative image paths are also handled where they can be resolved.\u003c/p\u003e\n","kind":"html","rawMarkdown":"DeMinds handles common Markdown document links, Wiki Links, and static Wiki Image Embeds such as `![[image.png]]` when the target image can be identified without ambiguity. Relative image paths are also handled where they can be resolved.","sourceFormat":"markdown"},"note:sha256:1f329b3585ac2c31c06cb9b638b6dd7bc3cb02a293a4e0601e59c6d18d0b2ccb":{"html":"\u003cp\u003eExport a single \u003ccode\u003e.deminds.html\u003c/code\u003e file containing the body, the Universal Mind Map, or both. Recipients can read it, fold branches, and open Notes without editing the file. Creating an Interactive View requires Plus; reading one does not.\u003c/p\u003e\n\u003cp\u003eDeMinds initially opens the file read-only. Only when you explicitly choose to import it does DeMinds create editable content from its validated Markdown and assets. Neither read-only opening nor explicit import requires Plus.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Export a single `.deminds.html` file containing the body, the Universal Mind Map, or both. Recipients can read it, fold branches, and open Notes without editing the file. Creating an Interactive View requires Plus; reading one does not.\n\nDeMinds initially opens the file read-only. Only when you explicitly choose to import it does DeMinds create editable content from its validated Markdown and assets. Neither read-only opening nor explicit import requires Plus.","sourceFormat":"markdown"},"note:sha256:1f82531f4a53f253eb62cba8f296ef69ee34939358bdd7f1231e66660f5f55e4":{"html":"\u003cp\u003eImporting shared AI content does not connect to your AI account or read private chat history. Attachments, tool results, and hidden content that the shared page does not expose may not be recoverable.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Importing shared AI content does not connect to your AI account or read private chat history. Attachments, tool results, and hidden content that the shared page does not expose may not be recoverable.","sourceFormat":"markdown"},"note:sha256:232297985a1de3317f9cd06dc9c23af36f332a4a1a35863e5bb84b3bceee8360":{"html":"\u003cp\u003eThe focus is on content and organization. Complex Word layouts, including headers, footers, columns, and floating objects, may not carry over faithfully. Older \u003ccode\u003e.doc\u003c/code\u0
