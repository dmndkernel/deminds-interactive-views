</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-10-08T16:27:33.125Z","language":"en","name":"DeMinds","version":"1.0.48"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Marketing Engineers 100x More Experiments with AI Agents","outlineVersion":1},"sourceRevision":"sha256:2620751aeccd9b6473f3336d7ea75f36deef701d8aed697d1bc99ede51edd94c","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Marketing Engineers  100x More Experiments with AI agents.md","sourceUrl":"https://x.com/gregisenberg/status/2108188646973313195","title":"Marketing Engineers 100x More Experiments with AI Agents"},"files":[{"byteLength":37109,"content":"# Marketing Engineers: 100x More Experiments with AI Agents\n\n![图像](https://pbs.twimg.com/media/HUHIMEwbYAAW70H?format=jpg\u0026name=medium)\n\n\u003e @gregisenberg · [X Article](https://x.com/gregisenberg/article/2108188646973313195) · 2026-10-08\n\nMarketing engineers are the NEW 10x employee, and most companies don't have one yet.\n\nIf you're growing a startup, a business or a side hustle, becoming one or hiring one is the biggest lever you have right now. It's the most exciting time to be in marketing since Google launched AdWords. Maybe ever.\n\nFor 20 years, marketing ideas were easy and shipping them was hard. Sales knew why deals closed. Support knew why customers left. But every idea had to survive a brief, a designer, a developer, an analyst and two meetings, and most died in a Slack thread.\n\nThat bottleneck just broke!\n\n![图像](https://pbs.twimg.com/media/HUCeZJxbcAED0KN?format=jpg\u0026name=medium)\n\nToday one agent reads last week's sales calls in ten minutes. Another turns what customers said into a landing page. Another launches thirty ads and kills the losers while you sleep. Another tells you on Monday which campaign brought in customers who paid. And the models are now good enough that if your idea is good, the output will be too.\n\nA marketing engineer wires those agents into a machine. Part marketer, part builder. And the best ones often come from outside marketing: founders, engineers, operators and solo builders.\n\n**So grab your coffee or tea, because here's the full playbook (15–20 min read):**\n\n## How we got here\n\n### The Mad Men era: a few expensive shots\n\nIn the Mad Men era, from the 1950s through the 1990s, marketing meant print, TV, radio and billboards. The job was big ideas and big budgets. A campaign cost millions, took months to produce, and you found out whether it worked a quarter later if you were lucky. A great marketer got a handful of real shots a year, so the whole profession ran on taste, persuasion and gut feel.\n\n### The digital marketer: measurable channels\n\nThen Google launched AdWords in 2000 and Facebook launched ads in 2007, and suddenly every click could be counted. The digital marketer was born. The job turned into managing channels like SEO, paid search, email and display. Marketers lived inside dashboards, and the best were the people who understood the platforms most deeply. You could run a few experiments a month.\n\n### The growth hacker: marketing starts to look like product\n\nIn the 2010s came the growth hacker, and I'll never forget it. Sean Ellis coined the term in 2010, and the decade's best tricks became folklore. Hotmail put \"P.S. I love you. Get your free email at Hotmail\" at the bottom of every message. Dropbox gave you and a friend free storage for every invite. Airbnb let hosts crosspost their listings to Craigslist. The growth hacker treated marketing like product, with funnels, loops and A/B tests. The catch was that every good idea needed an engineer, and engineers belonged to the product roadmap. Growth hackers spent half their lives writing tickets and waiting in line. A few experiments a week was a great week.\n\n### The AI-assisted marketer: faster drafts, same system\n\nWhen ChatGPT showed up at the end of 2022, we got the AI-assisted marketer. Copy came faster and images came faster, and everything else stayed the same. Same org chart, same meetings, same six-week cycle, just with better first drafts. This was kinda like the AI copilot era. Most marketing teams are still sitting right here.\n\n### The marketing engineer: idea and implementation converge\n\nThe marketing engineer is what happens when the person with the idea and the person who can build it become the same person. One marketer researches the customer, builds the page, generates the creative, wires up the data and launches the test. The unit of work shifts from a campaign to a system that keeps producing campaigns, and dozens of experiments a day becomes realistic for one person.\n\nZoom out and the whole history of marketing is one trend. The cost of an experiment keeps collapsing. Whoever runs the most good experiments learns the fastest, and whoever learns the fastest wins.\n\n![图像](https://pbs.twimg.com/media/HT88kbzbgAAnWtT?format=jpg\u0026name=medium)\n\n## Why this matters so much\n\n### Customer knowledge is fragmented\n\nEvery company is sitting on a pile of gold it rarely uses (I know it's hard to believe but it's true).\n\n![图像](https://pbs.twimg.com/media/HUCehtAbwAAOKjs?format=jpg\u0026name=medium)\n\nSales hears the same five objections every week. Support knows exactly which promises lead to refunds. The founder has strong opinions about the category that live in their head and a few podcast clips. Analytics knows which pages bring in customers who stick around. All of it lives in different tools, owned by different people, and it reaches a campaign maybe once a quarter.\n\n### Small, specific ideas used to be too expensive\n\nMeanwhile the small ideas that would put that knowledge to work keep losing to the big launch. A pricing calculator for one niche. A campaign built from yesterday's sales calls. A note to forty old prospects on the day the feature they asked for finally ships. Each one needed a designer, a developer, an analyst and two meetings, so each one sat in the backlog forever.\n\n### When specific marketing gets cheap\n\nA marketing engineer can do every one of those in an afternoon. Specific marketing got cheap, and when specific gets cheap, the company that understands its customer best starts winning. Agencies that sell hours will feel this first. Big marketing teams will start to look like committees. Founders and solo marketers will suddenly have the output of a whole department.\n\nNote: My partner just launched [Boring Funnels](https://boringfunnels.com/), the idea being that the biggest opportunity is helping businesses turn what they know about their customers into clear offers, useful landing pages and follow ups that lead to sales. A marketing engineer can build the whole thing, see where people drop off and keep improving it as more customers come through.\n\nHere's exactly how to build it.\n\n## Step 1: Set up your desk\n\n### Start with an agent workspace\n\nEverything starts with an agent workspace. Claude Code, Codex and Cursor are the common ones. The easiest way to think about these tools is as a very fast junior employee who lives inside a folder on your computer. It can read every file in that folder, write new ones, run code, and use any tool you connect to it.\n\n### Connect the tools your agent needs\n\nThat last part is where the magic is. Tools connect through something called MCP, which is basically a universal plug for AI. HubSpot, Stripe, Notion, Slack and hundreds of other tools have MCP servers, so your agent can read your CRM or pull last week's revenue the same way you would. When a tool only has an API, the agent can usually write the code to call it.\n\n### Add scheduling without removing approval\n\nYou'll also want your agents running on a schedule while you sleep. A year ago that meant stitching things together in a workflow tool like Zapier or n8n. Today you can just ask your coding agent to build it. Say \"run this every Monday at 7am, post the report to Slack, and wait for my thumbs up before sending anything,\" and it writes the scheduled job, the Slack message with an approve button, and the code that only acts once you tap it. Or use an always on agent like Hermes or OpenClaw that already runs in the background. Either way, it's your code, in your folder, and you can change any part of it with a sentence.\n\n## Step 2: Write the brain\n\n### Context before agents\n\nHere's the mistake I see over and over. Someone gets excited, spins up ten agents, gets back a mountain of generic slop, and decides AI marketing is overhyped.\n\nThe agents were fine but the context was thin.\n\nIt's like hiring a brilliant marketer and skipping onboarding. They'll write something smart about your industry, and it'll sound exactly like your competitors. So before you build a single agent, build the brain: a folder that explains your business the way you'd explain it to a sharp new hire on their first day.\n\nHere's the structure I'd use:\n\n![图像](https://pbs.twimg.com/media/HUCa05XacAAtaHo?format=jpg\u0026name=medium)\n\nSix files do most of the heavy lifting.\n\n### 1. `START-HERE.md`\n\n`START-HERE.md` is the one page every agent reads first. It says what the company does, who it serves, what this quarter's priorities are, and where everything else lives.\n\n### 2. `company/customer-fit.md`\n\n`company/customer-fit.md` describes who buys, who stays, and who you can serve profitably. Be painfully specific. \"Shopify stores doing $1M to $10M a year, where the founder still does the books and has been burned by a bookkeeper before\" gives an agent something to work with. \"SMBs\" gives it very little.\n\n### 3. `company/offers.md`\n\n`company/offers.md` lists what you sell, what it costs, what you're allowed to promise, and what needs approval before anyone says it out loud.\n\n### 4. `brand/voice.md`\n\n`brand/voice.md` is where most people get lazy. \"Friendly but professional\" is useless to an agent. Paste in three emails or ads you loved, with a sentence on why each one works, and two you rejected, with the reason. \"We killed this one because it promises results in 30 days and we can't guarantee that.\" Agents learn far more from examples than from adjectives.\n\n### 5. `brand/founder-opinions.md`\n\n`brand/founder-opinions.md` is your unfair advantage. Every competitor has access to the same models. Only you have your founder's takes on the category, the customer and the competition. Spend two hours interviewing your founder, or yourself, and write down every strong opinion. \"Most agencies in our space overcharge for onboarding.\" \"Our best customers come from accountant referrals.\" Those opinions are what make the output sound like you.\n\n### 6. `decisions/failed-campaigns.md`\n\n`decisions/failed-campaigns.md` holds the lessons that cost real money. \"The free audit attracted companies too small to afford us.\" \"LinkedIn brought lots of leads and very few closes.\" One line like that saves an agent from repeating a $20,000 mistake.\n\n### Keep guesses separate from company truth\n\nOne rule keeps the brain healthy: agents can add guesses to `evidence/`, but only a human moves something into `company/`. Otherwise one agent's hunch quietly becomes company policy.\n\n## Step 3: Connect your data\n\n### Connect the places where customer truth lives\n\nNext, give the brain eyes. Connect the places where customer truth lives: call recordings in Gong or Fathom, support tickets in Intercom or Zendesk, deals in HubSpot or Salesforce, behavior in PostHog or Google Analytics, and revenue in Stripe.\n\n### Start read-only\n\nStart with read-only access everywhere. An agent that can read your CRM is useful on day one. An agent that can edit your CRM is something it earns over time.\n\n### Give every campaign an ID\n\nThen do the boring thing almost every company skips. Give every campaign an ID and carry it everywhere. Put it in the UTM tags on every link, in the name of every ad, in the name of every email sequence, and in a field on every deal in the CRM. Then keep one simple table, in Supabase or even a spreadsheet to start, with a row per campaign: ID, spend, leads, qualified calls, deals, revenue and churn.\n\n### Connect marketing activity to customers who paid and stayed\n\nIt sounds unglamorous, and it's the most valuable thing in the whole setup. Most companies can tell you clicks by campaign and revenue by customer, and very few can connect the two. Once you join those tables, your agents can answer the question that actually matters: which marketing brought in customers who paid and stayed?\n\n## Step 4: Build your first agent\n\n### Start with one reliable agent\n\nBuild one agent and get it great before you build a second. Six agents talking to each other on day one is how you end up spending your weekend debugging a group chat.\n\n### Start with customer language\n\nYour first one should be the customer language agent, because everything else feeds off what it finds. Its job is to read what customers actually say and pull out the exact words they use to describe their problems.\n\nExport your last 20 to 50 sales call transcripts into evidence/calls/ and give it an instruction like this:\n\nRead every transcript in evidence/calls/.\n\n![图像](https://pbs.twimg.com/media/HUCa6rbbkAAhB9C?format=png\u0026name=medium)\n\n### Correct the instruction until the output improves\n\nThen read the report next to your own memory of those calls. The first version will be about 70% right. It'll probably overweight one chatty customer, or name the groups in marketing speak. Every time you spot a mistake, fix the instruction and save the fix in decisions/ so it sticks. After three or four rounds it'll read calls better than most people on your team.\n\nHere's the kind of thing it finds. Say you sell scheduling software to plumbers and HVAC companies. The agent notices owners keep saying some version of \"I'm tired of taking calls during dinner.\" That one line is your ad, your headline and your sales opener. It beats \"automated scheduling\" every time, because people buy the situation more than the feature.\n\n### Put it on a schedule only after it is reliable\n\nOnce it's reliable, put it on a schedule. Every Monday it reads last week's calls and tickets and drops a fresh report into evidence/customer-language/. Now your entire marketing operation runs on what customers said last week, instead of what someone guessed last year.\n\n## Step 5: Add the other five agents\n\nOnce your first agent is solid, add the rest one at a time. Each one gets its own folder in workflows/, its own instructions and its own schedule.\n\n### The buying trigger agent\n\nIt watches for moments that create demand overnight. A company opens a second location. A brand starts selling wholesale. A startup raises a round and posts five sales jobs. A tool you integrate with ships something new. The easiest way to build this is in Clay. Pull a list of accounts that match customer-fit.md, then add columns that check for each trigger, like new job postings, funding news, new locations or new pages on their website. Apollo is handy for the contact data.\n\nFor every account with a fresh trigger, the agent checks the CRM to skip anyone your team is already talking to, then finishes one sentence: \"This event creates this problem, and our product solves it in this specific way.\" If the sentence comes out mushy, the account waits. If it comes out sharp, the agent drafts a short email that leads with the event and saves it as a draft for you to review. That one sentence filter is what makes outreach feel like good timing instead of spam.\n\n### The search agent\n\nIt finds the questions people ask right before they buy and builds the best page on the internet for each one. Feed it three sources: your Search Console data, the questions that come up on sales calls, and what ChatGPT, Claude and Perplexity say when you ask them about your category. That last one is new and wildly underrated. Every week, ask the AI engines the questions your buyers ask and record which companies and sources they recommend. It shows you what the models trust and where you're invisible.\n\nThen build pages that are more useful than anything else out there, because AI search rewards the most useful page more than the most optimized one. A commercial kitchen supplier that builds a guide to opening your first restaurant, with a calculator for what equipment fits your space and budget, gets ranked, gets cited by the AI engines, and gets bookmarked by buyers who come back when they're ready. Your agent can write that calculator in an afternoon and publish it on Next.js and Vercel, or on Framer if you want speed.\n\n### The creative agent\n\nIt makes and tests ads. Give it the latest customer language report, the approved claims from offers.md, real product footage and screenshots, and a folder of ads you love. Ask it for different reasons to buy, instead of fifty versions of the same headline: one ad that walks through a worked example, one that tells a customer story, one that's a raw demo of the product. Image models like Nano Banana and video models like Veo make the production almost free.\n\nName every ad with what it's testing, like BK014_dinner-angle_ugc_v2, so the campaign ID, the idea and the format live right in the name. A month later, \"the dinner angle beat the price angle\" is a lesson you can use everywhere. \"video_final_7 won\" is trivia.\n\nThe agent uploads ads through the Meta Ads API in a paused state, so a human hits go. Then a small script checks results every morning and pauses anything under 1% CTR after a set amount of spend. Decide your evidence bar before you launch: how much spend, how many days, and what counts as a win. Skip that step and 200 ads just gives you 200 inconclusive experiments.\n\n### The closed-lost agent\n\nIt is the one that pays for everything else. Pull every lost deal from your CRM along with its notes and call transcripts. \"Not interested\" is a lazy summary of a real conversation, so have the agent reread each one and record the actual reason plus a reopen condition. \"Went with a competitor, contract renews in March.\" \"Needed SSO.\" \"Champion left the company.\"\n\nThen it watches for those conditions. The day your changelog says SSO shipped, every prospect who asked for it gets a personal draft that quotes their original call. When the renewal date gets close, you show up. When the champion lands at a new company, you congratulate them and reintroduce yourself. Respect optouts and contact preferences, and you'll find most companies have a pile of unfinished revenue sitting in their own CRM.\n\n### The performance agent\n\nIt reads your campaign table every Monday and writes you a short memo, the way a sharp analyst would. \"The profitability review page converted at 4%, and half those leads were too small to serve. The dinner ad has the lowest cost per qualified call. Retargeting has spent $3,000 and produced two sales conversations.\" Every line ends in a decision for you: keep, kill, change or test.\n\nWire it all the way through to retention, refunds and profit. A campaign that brings in cheap customers who churn in sixty days looks amazing on a dashboard and quietly loses you money. This is the agent that catches it.\n\n## Step 6: Put the guardrails in the tools\n\n### Prompts are not guardrails\n\nThe fastest way to get burned is to trust a sentence in a prompt. \"Always ask me before sending\" is a polite suggestion to a model. Real guardrails live in the tools.\n\n### Use least privilege and hard approval steps\n\nGive every agent the smallest set of permissions it needs. The outreach agent gets draft only access to email. The ads agent creates ads in a paused state, and budgets stay with you. Approval steps live inside the code itself, like a Slack message with an approve button that the action waits on. Use plain code for exact rules like spend caps, suppression lists and deduping, and save the model for judgment calls like whether an account fits or whether a message sounds like you.\n\n### Give each agent a contract\n\nThen write each agent a short contract, like a job description with guardrails. Here's one for the buying trigger agent:\n\n![图像](https://pbs.twimg.com/media/HUCbFV0bsAAfDqN?format=jpg\u0026name=medium)\n\n### Make failure visible\n\n\"Done\" means it checked every source within its limits and told you what broke. An agent that says \"this source failed today\" is worth ten that quietly skip it.\n\n## Step 7: Run a campaign end to end\n\n### A worked example: from customer language to revenue\n\n![图像](https://pbs.twimg.com/media/HUHH3H-aMAArNw1?format=jpg\u0026name=medium)\n\nHere's what it looks like when all of it works together. Picture a bookkeeping firm that wants more ecommerce clients.\n\n### Monday: turn customer language into an offer\n\nOn Monday, the customer language report shows that store owners keep saying the same thing: \"I can't tell if I actually made money after returns, shipping and fees.\" Eleven different customers said it last month. You walk it over to the person who delivers the service and ask whether the firm can really solve this. They say yes, and that it's the first thing they fix for every new client. You approve an offer in offers.md: a free profitability review for stores doing $1M to $10M a year.\n\n### Give the campaign an identity that survives every step\n\nThe campaign gets an ID, BK014, and everything from here carries it.\n\n### Tuesday: let the agents build from the same evidence\n\nOn Tuesday, the creative agent makes three angles from the customer's own words: where your profit disappears, a sample monthly report, and a short story from a real client. The search agent builds a page with a simple profit calculator that uses numbers the firm has checked. The closed-lost agent finds 60 old prospects who said \"maybe after year-end\" and drafts each of them a personal note. The buying trigger agent flags stores that just launched on Amazon, because multichannel selling makes the books messier.\n\n### Wednesday: human review before launch\n\nOn Wednesday, you review everything in one sitting. You cut one ad that promises savings the firm can't guarantee, approve the rest, and launch a $2,000 test.\n\n### Two weeks later: connect spend to signed clients\n\nTwo weeks later the performance agent connects the spend to booked reviews and the reviews to signed clients. The calculator page converts best. The Amazon trigger list books the most calls. It also reminds you the sample is still small.\n\n### Keep the original customer language attached to the campaign\n\nYou'll notice that the customer's original words survived every step. Normally a sharp insight goes through a research summary, a brief and five rounds of edits, and comes out sounding like every other bookkeeping ad on the internet. Here the quotes traveled with the campaign folder, so every agent saw them.\n\n![图像](https://pbs.twimg.com/media/HUCamhEaAAAzHyA?format=jpg\u0026name=medium)\n\n## Step 8: Run the weekly loop\n\n### The job becomes editing the system\n\nOnce the machine is built, the job looks a lot more like editing than making.\n\nMonday you read the performance memo and make the keep, kill and change calls. Tuesday and Wednesday you build, fix the workflows that produced weak work last week, and launch new tests. Thursday you get on calls with sales and support, because that's where next week's best ideas are hiding. Friday you review what the agents made and update the files.\n\n### Build a fast review queue\n\nThe heart of the whole thing is a review queue. Every item in it should take under a minute to decide. \"Approve this revised offer. It changes these two ads and this email.\" Show the change, what it touches, and the evidence behind it.\n\n### Every rejection should improve the next run\n\nAnd the system only gets smarter when you change its inputs. Every time you reject something, write down why and put it where the next run will see it. Rejected an ad because it pulls in businesses too small for you? Update customer-fit.md. A prospect misread an offer? Add a check for it. Keep an experiment log with what you tested, why, what happened and what you'll do next. Keep ten example inputs for each agent with the output you expect, and rerun them every time you change an instruction, so you know right away if something got worse.\n\n### If output is weak, fix the brain or the contract\n\nIf you find yourself spending all day fixing agent output, the problem is upstream. It's almost always the brain or the contract.\n\n## The creative engine\n\nHere's what most people still haven't caught up to: creative is the new targeting.\n\nMeta rebuilt how it decides which ads to show. Its new system, called Andromeda, finished rolling out globally in late 2025, and it reads the ad itself to figure out who should see it. Your image, your hook and your script now do the job that interest targeting used to do. One side effect is brutal for lazy advertisers. Andromeda groups ads that look alike and treats them as one, so fifty versions of the same headline get you roughly the reach of a single ad. And winning ads now burn out in two or three weeks instead of six.\n\nSo the job is a steady stream of truly different ideas. Until recently that needed a production team. Now it needs a creative engine, and here's how I'd set one up.\n\n### Start with the words\n\nLoad `voice.md` and the latest customer language report into a frontier model like Claude or GPT and have it write scripts for 8 to 12 distinct concepts: a pain point, a worked example, a customer story, a founder rant, a comparison, a myth you're busting. Give each concept two or three hooks. The strategy lives in this step, so spend your time here.\n\n### Start from a funnel that's already working\n\nMy partner hasn't publicly talked about it much but [@BoringMarketer](https://x.com/@BoringMarketer) just launched [Boring Funnels](https://boringfunnels.com/), which breaks down a real, live funnel every week, from the ad to the last email, and turns each step into a prompt you can hand to your coding agent. It's a much better starting point than a blank page.\n\n![图像](https://pbs.twimg.com/media/HUChi1tboAAm1GF?format=jpg\u0026name=medium)\n\n### Then make the images\n\nNano Banana, GPT Image and Midjourney now produce product shots, lifestyle scenes and static ads that hold up on a phone screen. The trick is to feed them your real product photos so the product stays accurate, and let the model change everything around it.\n\n### Then make the video\n\nVeo, Kling and fal turn a script or a still image into a short clip. For talking-head ads, Arcads, HeyGen and Creatify generate AI actors reading your script in dozens of languages. ElevenLabs handles voiceover, and CapCut or Captions handles the edit.\n\n### Use AI actors to test, then pay humans to win\n\nThis is the inside sauce on AI UGC. AI actors let you test twenty scripts in a day for the price of one creator video. Once you know which script works, a real person saying it usually performs even better, builds more trust, and keeps you on the right side of platforms that require AI content to be labeled.\n\n### Let the agent run the loop\n\nIt launches each concept paused, a human hits go, a script pauses the losers after a set amount of spend, and every Monday the performance agent tells you which concepts won and which hooks to try next. Your job becomes picking ideas and judging taste, and the machine handles the volume.\n\nThe marketing engineers winning on paid social right now are shipping dozens of truly different concepts a month, and they're doing it without a production team.\n\n## The social engine\n\nPaid gets all the attention, but organic social is where marketing engineers quietly build an unfair advantage. It's free distribution, and it's the cheapest creative testing lab ever invented.\n\n### Treat organic as your test kitchen\n\nPost ten hooks as organic TikToks, Reels or X posts, see which ones the algorithm picks up, and only then put money behind the winners. You find out what works for free, and your ad budget only goes to ideas that already proved themselves.\n\n### Clip everything\n\nOne long piece of content, like a podcast, a webinar or a founder rant on a walk, can become twenty short clips. Tools like Opus Clip find the best moments and caption them, and an agent can schedule them across every platform. This is how most of the biggest podcasts grow.\n\n### Use formats that scale without a face\n\nSlideshows and carousels on TikTok and Instagram, built from your customer language report, are some of the easiest posts to make and some of the most saved. An agent writes the slides, a model makes the images, and you approve the batch on Sunday.\n\n### Listen before you talk\n\nPoint an agent at Reddit, X, TikTok comments and your competitors' reviews, and have it report what people are complaining about, asking for and getting excited about each week. Then have it draft helpful replies for threads where your product truly helps, and post them yourself. On Reddit especially, a useful answer from a real person beats any ad, and a spammy one gets you banned.\n\n### Put the founder to work\n\nWhen every brand can generate content, the scarcest thing on the feed is a real person with real opinions. Turn founder-opinions.md into a content engine: the agent drafts a post a day from your takes, and you edit it into your voice and hit publish. AI makes the founder more valuable, because they're the one thing nobody else can generate.\n\nTwo rules keep this clean. Label AI-generated people and scenes wherever the platform asks, and keep a human on the publish button.\n\n## How to become a top 1% marketing engineer\n\nOnce the basics run on their own, this is where it gets fun.\n\n### Build decision tools\n\nThe first is building decision tools. A packaging company builds a calculator that shows which box size cuts your shipping bill. A software company builds a migration checker that scans your setup and shows exactly what moves over cleanly. These used to be six-month engineering projects, so they rarely happened. Now a marketing engineer can ship a scrappy version in a week, and buyers bookmark it and come back right when they're ready to buy.\n\n### Market to the people who influence the purchase\n\nThe second is marketing to the people who influence the purchase. The accountant who recommends software to forty clients. The agency that picks tools for its customers. The IT person who gets asked \"is this safe?\" Build a campaign just for them, with exactly the material they need to say yes.\n\n### Fix acquisition inside onboarding\n\nThe third is fixing acquisition inside onboarding. Sometimes the ads are working fine and new customers churn because the first week is confusing. An agent that reads onboarding tickets and finds where people get stuck can do more for growth than your next ad set.\n\n### Give every channel its own job\n\nThe fourth is giving every channel its own job. Search answers questions. Social starts conversations. Email shows up at a specific moment. When every channel repeats the same message, you're paying for the same impression five times.\n\n## The stack\n\nHere's the full toolkit, by job. Tools change every few months, so learn the categories and swap the names as you go.\n\n- **Agent workspace:** Claude Code, Codex, Cursor, Google AI Studio\n- **Always-on agents:** Hermes, GrokBot, Codex\n- **Writing and strategy:** Claude, ChatGPT, Gemini\n- **Images:** Nano Banana, GPT Image, Midjourney\n- **Video:** Veo, Sora, Kling, Runway, Fal\n- **AI actors and UGC:** Arcads, HeyGen, Creatify\n- **Voice:** ElevenLabs\n- **Funnels**: [BoringFunnels.com](https://boringfunnels.com/)\n- **Editing and clipping:** CapCut, Captions, Opus Clip\n- **Customer voice:** Gong, Fathom, Intercom, Zendesk, G2\n- **CRM:** HubSpot, Salesforce\n- **Signals and enrichment:** Clay, Apollo\n- **Search and AI visibility:** Ahrefs, Semrush, Google Search Console\n- **Ads:** Meta Ads API, Google Ads API\n- **Email and outbound:** [Customer.io](https://customer.io/), Resend, Instantly\n- **Web:** Next.js on Vercel, Framer, Webflow\n- **Measurement:** PostHog, Stripe, Supabase\n\n## What you need to learn\n\nThe job is half marketer and half builder, and you need both halves.\n\n### The marketer half\n\nThe marketer half is the stuff great marketers have always known. How to run a customer interview and hear the phrase that matters. How to position a product so the right people feel it was made for them. How to build an offer that's a real reason to buy, as opposed to a discount in a costume. How to write a headline that stops a scroll. How each channel decides who sees what. And enough statistics to know when a result is real and when it's a fluke.\n\n### The builder half\n\nThe builder half is newer, and it's much easier to learn than people think. You need to write context that an agent can actually use, which is the most underrated skill on this whole list. You need to read code well enough to judge whether it does what you asked, because the agent writes it and you own it. You need to understand how APIs and MCP connect tools, write basic SQL to pull your own numbers, ship a page, use git, write test cases, and know roughly what each agent run costs you.\n\n### Learn by shipping\n\nThe fastest way to learn the builder half is to ship one ugly landing page this weekend with an AI coding tool. One deployed page teaches you more than ten courses.\n\n## Where this goes\n\n### If you started this week\n\n![图像](https://pbs.twimg.com/media/HUHHn_3bsAATORV?format=jpg\u0026name=medium)\n\nIf I had to start this week, here's what I'd do. If you're a marketer, build the customer language agent and run it on your last 20 sales calls. If you're an engineer, sit in on five sales calls, then build a calculator for one customer segment. If you're a founder, block two hours this weekend and write founder-opinions.md, because every agent you build after that gets sharper.\n\n### Earn trust one workflow at a time\n\nKeep publishing, outreach and spending behind approval until each workflow earns your trust. Get one workflow reliable before you add the next. A confused workflow running every morning just gives you a reliable supply of confusion.\n\n### The author's bet on where marketing teams go next\n\nFor most of the history of marketing, the winner was whoever had the biggest budget and the most people. I think the next decade belongs to whoever understands their customer best and can act on it fastest. My guess is that by 2028 the best marketing teams will be one or two marketing engineers running dozens of agents, and they'll outship departments ten times their size.\n\nMost of those people are sitting in growth, content and ops roles right now. They're one weekend of building away from becoming one.\n\n### Further resources and ways to work together\n\nIf you want to go deeper, I did a full episode on marketing engineers on the [@startupideaspod](https://x.com/@startupideaspod) podcast: [https://youtube.com/watch?v=8ZC1G1ezN5o](https://youtube.com/watch?v=8ZC1G1ezN5o)\n\nDM me if I can ever be helpful. Can't respond to everyone but will respond to some!\n\n**I'm rooting for you.**\n\nGreg Isenberg\n\nBtw, ways we could work together:\n\n1. **Hire** [LCA](https://latecheckout.agency)**.** We're the leading product design firm for AI. If you want your AI product to look and feel world class, reach out. Strategy, design, product, engineering, the whole thing.\n2. **Use** [**Ideabrowser.com**](https://ideabrowser.com/)**.** Find your next startup idea, backed by real data. Over 200k founders use it.\n3. **Try** [Boring Funnels.](https://boringfunnels.com) My partner just launched [Boring Funnels](https://boringfunnels.com/). Every week it breaks down a real funnel that's working and turns it into prompts for your coding agent.\n4. [@startupideaspod](https://x.com/@startupideaspod) - listen on [Spotify](https://open.spotify.com/show/6aB0v6amo3a8hgTCjlTlvh?si=b5f1586b30b44d51), [Apple](https://podcasts.apple.com/us/podcast/the-startup-ideas-podcast/id1593424985), [YouTube](https://www.youtube.com/@GregIsenberg/videos) for startup ideas, growth tactics and practical AI tutorials.\n\n---\n\n## ChatGPT Editorial Note · `dmnd:editorial-insight:v1`\n\nThe article argues that AI changes marketing less by producing faster drafts than by collapsing the cost of running specific, measurable experiments, turning a strong marketer-builder into the operator of a system that continuously converts customer evidence into campaigns, decisions and learning.\n\n### Key takeaways\n\n- The core advantage is not “more AI content,” but faster learning: customer language, offers, creative, campaign identity, revenue and retention are connected so experiments can be judged by business outcomes.\n- The proposed system depends on a maintained “brain”: explicit customer fit, offers, brand voice, founder opinions and failed-campaign lessons. Weak context produces generic output even when the underlying models are capable.\n- The article repeatedly keeps humans at critical control points: start with read-only access, use least privilege, create ads paused, preserve approval steps in code and keep a human on the publish button.\n- Reliability comes from one workflow at a time, visible failures, review queues, experiment logs and updating upstream context or contracts when output is weak—not from adding more agents immediately.\n- The “100x” framing is directional rather than measured here; the source presents it as a thesis about als.\u003c/span\u003e","payload":{"lines":"106,107","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eFurther resources and ways to work together\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:3c8a1d5f5f156e18a27b68823b57085292cf43bf0e3d2110e927638cdfa8454b\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"102,103","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eWhere this goes\u003c/span\u003e","payload":{"fold":1,"lines":"98,99","tag":"h2"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eThe core advantage is not “more AI content,” but faster learning: customer language, offers, creative, campaign identity, revenue and retention are connected so experiments can be judged by business outcomes.\u003c/span\u003e","payload":{"lines":"109,110","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eThe proposed system depends on a maintained “brain”: explicit customer fit, offers, brand voice, founder opinions and failed-campaign lessons. Weak context produces generic output even when the underlying models are capable.\u003c/span\u003e","payload":{"lines":"110,111","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eThe article repeatedly keeps humans at critical control points: start with read-only access, use least privilege, create ads paused, preserve approval steps in code and keep a human on the publish button.\u003c/span\u003e","payload":{"lines":"111,112","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eReliability comes from one workflow at a time, visible failures, review queues, experiment logs and updating upstream context or contracts when output is weak—not from adding more agents immediately.\u003c/span\u003e","payload":{"lines":"112,113","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eThe “100x” framing is directional rather than measured here; the source presents it as a thesis about experiment throughput and organizational leverage, not as a demonstrated benchmark across companies.\u003c/span\u003e","payload":{"lines":"113,114","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eKey takeaways\u003c/span\u003e","payload":{"fold":1,"lines":"108,109","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eTreat customer evidence as a reusable operating asset that stays attached to campaigns instead of being compressed into briefs and lost through handoffs.\u003c/span\u003e","payload":{"lines":"115,116","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eSeparate model judgment from deterministic rules: use agents for interpretation, while code enforces permissions, spend caps, suppression lists, deduplication and approvals.\u003c/span\u003e","payload":{"lines":"116,117","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIdeas worth borrowing\u003c/span\u003e","payload":{"fold":1,"lines":"114,115","tag":"h3"}}],"content":"\u003cspan data-dmnd-editorial-insight=\"v1\" class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eChatGPT Editorial Note\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:60b8a42788a6bebce75d35d9b9309744959ad315b74eae8e77a543c619316b0f\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"107,108","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHIMEwbYAAW70H?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eMarketing Engineers: 100x More Experiments with AI Agents\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Marketing Engineers: 100x More Experiments with AI Agents\" data-note-id=\"note:sha256:cc6edf713fc4570ddb4af04b8d8bd78c28372e721f45528c50b5f1f65879e916\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"marketing-engineers-100x-more-experiments-with-ai-agents\"\u003eMarketing Engineers: 100x More Experiments with AI Agents\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHIMEwbYAAW70H?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@gregisenberg · \u003ca href=\"https://x.com/gregisenberg/article/2108188646973313195\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX Article\u003c/a\u003e · 2026-10-08\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eMarketing engineers are the NEW 10x employee, and most companies don't have one yet.\u003c/p\u003e\n\u003cp\u003eIf you're growing a startup, a business or a side hustle, becoming one or hiring one is the biggest lever you have right now. It's the most exciting time to be in marketing since Google launched AdWords. Maybe ever.\u003c/p\u003e\n\u003cp\u003eFor 20 years, marketing ideas were easy and shipping them was hard. Sales knew why deals closed. Support knew why customers left. But every idea had to survive a brief, a designer, a developer, an analyst and two meetings, and most died in a Slack thread.\u003c/p\u003e\n\u003cp\u003eThat bottleneck just broke!\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCeZJxbcAED0KN?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003eToday one agent reads last week's sales calls in ten minutes. Another turns what customers said into a landing page. Another launches thirty ads and kills the losers while you sleep. Another tells you on Monday which campaign brought in customers who paid. And the models are now good enough that if your idea is good, the output will be too.\u003c/p\u003e\n\u003cp\u003eA marketing engineer wires those agents into a machine. Part marketer, part builder. And the best ones often come from outside marketing: founders, engineers, operators and solo builders.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSo grab your coffee or tea, because here's the full playbook (15–20 min read):\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"how-we-got-here\"\u003eHow we got here\u003c/h2\u003e\n\u003ch3 id=\"the-mad-men-era-a-few-expensive-shots\"\u003eThe Mad Men era: a few expensive shots\u003c/h3\u003e\n\u003cp\u003eIn the Mad Men era, from the 1950s through the 1990s, marketing meant print, TV, radio and billboards. The job was big ideas and big budgets. A campaign cost millions, took months to produce, and you found out whether it worked a quarter later if you were lucky. A great marketer got a handful of real shots a year, so the whole profession ran on taste, persuasion and gut feel.\u003c/p\u003e\n\u003ch3 id=\"the-digital-marketer-measurable-channels\"\u003eThe digital marketer: measurable channels\u003c/h3\u003e\n\u003cp\u003eThen Google launched AdWords in 2000 and Facebook launched ads in 2007, and suddenly every click could be counted. The digital marketer was born. The job turned into managing channels like SEO, paid search, email and display. Marketers lived inside dashboards, and the best were the people who understood the platforms most deeply. You could run a few experiments a month.\u003c/p\u003e\n\u003ch3 id=\"the-growth-hacker-marketing-starts-to-look-like-product\"\u003eThe growth hacker: marketing starts to look like product\u003c/h3\u003e\n\u003cp\u003eIn the 2010s came the growth hacker, and I'll never forget it. Sean Ellis coined the term in 2010, and the decade's best tricks became folklore. Hotmail put \"P.S. I love you. Get your free email at Hotmail\" at the bottom of every message. Dropbox gave you and a friend free storage for every invite. Airbnb let hosts crosspost their listings to Craigslist. The growth hacker treated marketing like product, with funnels, loops and A/B tests. The catch was that every good idea needed an engineer, and engineers belonged to the product roadmap. Growth hackers spent half their lives writing tickets and waiting in line. A few experiments a week was a great week.\u003c/p\u003e\n\u003ch3 id=\"the-ai-assisted-marketer-faster-drafts-same-system\"\u003eThe AI-assisted marketer: faster drafts, same system\u003c/h3\u003e\n\u003cp\u003eWhen ChatGPT showed up at the end of 2022, we got the AI-assisted marketer. Copy came faster and images came faster, and everything else stayed the same. Same org chart, same meetings, same six-week cycle, just with better first drafts. This was kinda like the AI copilot era. Most marketing teams are still sitting right here.\u003c/p\u003e\n\u003ch3 id=\"the-marketing-engineer-idea-and-implementation-converge\"\u003eThe marketing engineer: idea and implementation converge\u003c/h3\u003e\n\u003cp\u003eThe marketing engineer is what happens when the person with the idea and the person who can build it become the same person. One marketer researches the customer, builds the page, generates the creative, wires up the data and launches the test. The unit of work shifts from a campaign to a system that keeps producing campaigns, and dozens of experiments a day becomes realistic for one person.\u003c/p\u003e\n\u003cp\u003eZoom out and the whole history of marketing is one trend. The cost of an experiment keeps collapsing. Whoever runs the most good experiments learns the fastest, and whoever learns the fastest wins.\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT88kbzbgAAnWtT?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch2 id=\"why-this-matters-so-much\"\u003eWhy this matters so much\u003c/h2\u003e\n\u003ch3 id=\"customer-knowledge-is-fragmented\"\u003eCustomer knowledge is fragmented\u003c/h3\u003e\n\u003cp\u003eEvery company is sitting on a pile of gold it rarely uses (I know it's hard to believe but it's true).\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCehtAbwAAOKjs?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003eSales hears the same five objections every week. Support knows exactly which promises lead to refunds. The founder has strong opinions about the category that live in their head and a few podcast clips. Analytics knows which pages bring in customers who stick around. All of it lives in different tools, owned by different people, and it reaches a campaign maybe once a quarter.\u003c/p\u003e\n\u003ch3 id=\"small-specific-ideas-used-to-be-too-expensive\"\u003eSmall, specific ideas used to be too expensive\u003c/h3\u003e\n\u003cp\u003eMeanwhile the small ideas that would put that knowledge to work keep losing to the big launch. A pricing calculator for one niche. A campaign built from yesterday's sales calls. A note to forty old prospects on the day the feature they asked for finally ships. Each one needed a designer, a developer, an analyst and two meetings, so each one sat in the backlog forever.\u003c/p\u003e\n\u003ch3 id=\"when-specific-marketing-gets-cheap\"\u003eWhen specific marketing gets cheap\u003c/h3\u003e\n\u003cp\u003eA marketing engineer can do every one of those in an afternoon. Specific marketing got cheap, and when specific gets cheap, the company that understands its customer best starts winning. Agencies that sell hours will feel this first. Big marketing teams will start to look like committees. Founders and solo marketers will suddenly have the output of a whole department.\u003c/p\u003e\n\u003cp\u003eNote: My partner just launched \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e, the idea being that the biggest opportunity is helping businesses turn what they know about their customers into clear offers, useful landing pages and follow ups that lead to sales. A marketing engineer can build the whole thing, see where people drop off and keep improving it as more customers come through.\u003c/p\u003e\n\u003cp\u003eHere's exactly how to build it.\u003c/p\u003e\n\u003ch2 id=\"step-1-set-up-your-desk\"\u003eStep 1: Set up your desk\u003c/h2\u003e\n\u003ch3 id=\"start-with-an-agent-workspace\"\u003eStart with an agent workspace\u003c/h3\u003e\n\u003cp\u003eEverything starts with an agent workspace. Claude Code, Codex and Cursor are the common ones. The easiest way to think about these tools is as a very fast junior employee who lives inside a folder on your computer. It can read every file in that folder, write new ones, run code, and use any tool you connect to it.\u003c/p\u003e\n\u003ch3 id=\"connect-the-tools-your-agent-needs\"\u003eConnect the tools your agent needs\u003c/h3\u003e\n\u003cp\u003eThat last part is where the magic is. Tools connect through something called MCP, which is basically a universal plug for AI. HubSpot, Stripe, Notion, Slack and hundreds of other tools have MCP servers, so your agent can read your CRM or pull last week's revenue the same way you would. When a tool only has an API, the agent can usually write the code to call it.\u003c/p\u003e\n\u003ch3 id=\"add-scheduling-without-removing-approval\"\u003eAdd scheduling without removing approval\u003c/h3\u003e\n\u003cp\u003eYou'll also want your agents running on a schedule while you sleep. A year ago that meant stitching things together in a workflow tool like Zapier or n8n. Today you can just ask your coding agent to build it. Say \"run this every Monday at 7am, post the report to Slack, and wait for my thumbs up before sending anything,\" and it writes the scheduled job, the Slack message with an approve button, and the code that only acts once you tap it. Or use an always on agent like Hermes or OpenClaw that already runs in the background. Either way, it's your code, in your folder, and you can change any part of it with a sentence.\u003c/p\u003e\n\u003ch2 id=\"step-2-write-the-brain\"\u003eStep 2: Write the brain\u003c/h2\u003e\n\u003ch3 id=\"context-before-agents\"\u003eContext before agents\u003c/h3\u003e\n\u003cp\u003eHere's the mistake I see over and over. Someone gets excited, spins up ten agents, gets back a mountain of generic slop, and decides AI marketing is overhyped.\u003c/p\u003e\n\u003cp\u003eThe agents were fine but the context was thin.\u003c/p\u003e\n\u003cp\u003eIt's like hiring a brilliant marketer and skipping onboarding. They'll write something smart about your industry, and it'll sound exactly like your competitors. So before you build a single agent, build the brain: a folder that explains your business the way you'd explain it to a sharp new hire on their first day.\u003c/p\u003e\n\u003cp\u003eHere's the structure I'd use:\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCa05XacAAtaHo?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003eSix files do most of the heavy lifting.\u003c/p\u003e\n\u003ch3 id=\"1-start-heremd\"\u003e1. \u003ccode\u003eSTART-HERE.md\u003c/code\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003eSTART-HERE.md\u003c/code\u003e is the one page every agent reads first. It says what the company does, who it serves, what this quarter's priorities are, and where everything else lives.\u003c/p\u003e\n\u003ch3 id=\"2-companycustomer-fitmd\"\u003e2. \u003ccode\u003ecompany/customer-fit.md\u003c/code\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003ecompany/customer-fit.md\u003c/code\u003e describes who buys, who stays, and who you can serve profitably. Be painfully specific. \"Shopify stores doing $1M to $10M a year, where the founder still does the books and has been burned by a bookkeeper before\" gives an agent something to work with. \"SMBs\" gives it very little.\u003c/p\u003e\n\u003ch3 id=\"3-companyoffersmd\"\u003e3. \u003ccode\u003ecompany/offers.md\u003c/code\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003ecompany/offers.md\u003c/code\u003e lists what you sell, what it costs, what you're allowed to promise, and what needs approval before anyone says it out loud.\u003c/p\u003e\n\u003ch3 id=\"4-brandvoicemd\"\u003e4. \u003ccode\u003ebrand/voice.md\u003c/code\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003ebrand/voice.md\u003c/code\u003e is where most people get lazy. \"Friendly but professional\" is useless to an agent. Paste in three emails or ads you loved, with a sentence on why each one works, and two you rejected, with the reason. \"We killed this one because it promises results in 30 days and we can't guarantee that.\" Agents learn far more from examples than from adjectives.\u003c/p\u003e\n\u003ch3 id=\"5-brandfounder-opinionsmd\"\u003e5. \u003ccode\u003ebrand/founder-opinions.md\u003c/code\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003ebrand/founder-opinions.md\u003c/code\u003e is your unfair advantage. Every competitor has access to the same models. Only you have your founder's takes on the category, the customer and the competition. Spend two hours interviewing your founder, or yourself, and write down every strong opinion. \"Most agencies in our space overcharge for onboarding.\" \"Our best customers come from accountant referrals.\" Those opinions are what make the output sound like you.\u003c/p\u003e\n\u003ch3 id=\"6-decisionsfailed-campaignsmd\"\u003e6. \u003ccode\u003edecisions/failed-campaigns.md\u003c/code\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003edecisions/failed-campaigns.md\u003c/code\u003e holds the lessons that cost real money. \"The free audit attracted companies too small to afford us.\" \"LinkedIn brought lots of leads and very few closes.\" One line like that saves an agent from repeating a $20,000 mistake.\u003c/p\u003e\n\u003ch3 id=\"keep-guesses-separate-from-company-truth\"\u003eKeep guesses separate from company truth\u003c/h3\u003e\n\u003cp\u003eOne rule keeps the brain healthy: agents can add guesses to \u003ccode\u003eevidence/\u003c/code\u003e, but only a human moves something into \u003ccode\u003ecompany/\u003c/code\u003e. Otherwise one agent's hunch quietly becomes company policy.\u003c/p\u003e\n\u003ch2 id=\"step-3-connect-your-data\"\u003eStep 3: Connect your data\u003c/h2\u003e\n\u003ch3 id=\"connect-the-places-where-customer-truth-lives\"\u003eConnect the places where customer truth lives\u003c/h3\u003e\n\u003cp\u003eNext, give the brain eyes. Connect the places where customer truth lives: call recordings in Gong or Fathom, support tickets in Intercom or Zendesk, deals in HubSpot or Salesforce, behavior in PostHog or Google Analytics, and revenue in Stripe.\u003c/p\u003e\n\u003ch3 id=\"start-read-only\"\u003eStart read-only\u003c/h3\u003e\n\u003cp\u003eStart with read-only access everywhere. An agent that can read your CRM is useful on day one. An agent that can edit your CRM is something it earns over time.\u003c/p\u003e\n\u003ch3 id=\"give-every-campaign-an-id\"\u003eGive every campaign an ID\u003c/h3\u003e\n\u003cp\u003eThen do the boring thing almost every company skips. Give every campaign an ID and carry it everywhere. Put it in the UTM tags on every link, in the name of every ad, in the name of every email sequence, and in a field on every deal in the CRM. Then keep one simple table, in Supabase or even a spreadsheet to start, with a row per campaign: ID, spend, leads, qualified calls, deals, revenue and churn.\u003c/p\u003e\n\u003ch3 id=\"connect-marketing-activity-to-customers-who-paid-and-stayed\"\u003eConnect marketing activity to customers who paid and stayed\u003c/h3\u003e\n\u003cp\u003eIt sounds unglamorous, and it's the most valuable thing in the whole setup. Most companies can tell you clicks by campaign and revenue by customer, and very few can connect the two. Once you join those tables, your agents can answer the question that actually matters: which marketing brought in customers who paid and stayed?\u003c/p\u003e\n\u003ch2 id=\"step-4-build-your-first-agent\"\u003eStep 4: Build your first agent\u003c/h2\u003e\n\u003ch3 id=\"start-with-one-reliable-agent\"\u003eStart with one reliable agent\u003c/h3\u003e\n\u003cp\u003eBuild one agent and get it great before you build a second. Six agents talking to each other on day one is how you end up spending your weekend debugging a group chat.\u003c/p\u003e\n\u003ch3 id=\"start-with-customer-language\"\u003eStart with customer language\u003c/h3\u003e\n\u003cp\u003eYour first one should be the customer language agent, because everything else feeds off what it finds. Its job is to read what customers actually say and pull out the exact words they use to describe their problems.\u003c/p\u003e\n\u003cp\u003eExport your last 20 to 50 sales call transcripts into evidence/calls/ and give it an instruction like this:\u003c/p\u003e\n\u003cp\u003eRead every transcript in evidence/calls/.\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCa6rbbkAAhB9C?format=png\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"correct-the-instruction-until-the-output-improves\"\u003eCorrect the instruction until the output improves\u003c/h3\u003e\n\u003cp\u003eThen read the report next to your own memory of those calls. The first version will be about 70% right. It'll probably overweight one chatty customer, or name the groups in marketing speak. Every time you spot a mistake, fix the instruction and save the fix in decisions/ so it sticks. After three or four rounds it'll read calls better than most people on your team.\u003c/p\u003e\n\u003cp\u003eHere's the kind of thing it finds. Say you sell scheduling software to plumbers and HVAC companies. The agent notices owners keep saying some version of \"I'm tired of taking calls during dinner.\" That one line is your ad, your headline and your sales opener. It beats \"automated scheduling\" every time, because people buy the situation more than the feature.\u003c/p\u003e\n\u003ch3 id=\"put-it-on-a-schedule-only-after-it-is-reliable\"\u003ePut it on a schedule only after it is reliable\u003c/h3\u003e\n\u003cp\u003eOnce it's reliable, put it on a schedule. Every Monday it reads last week's calls and tickets and drops a fresh report into evidence/customer-language/. Now your entire marketing operation runs on what customers said last week, instead of what someone guessed last year.\u003c/p\u003e\n\u003ch2 id=\"step-5-add-the-other-five-agents\"\u003eStep 5: Add the other five agents\u003c/h2\u003e\n\u003cp\u003eOnce your first agent is solid, add the rest one at a time. Each one gets its own folder in workflows/, its own instructions and its own schedule.\u003c/p\u003e\n\u003ch3 id=\"the-buying-trigger-agent\"\u003eThe buying trigger agent\u003c/h3\u003e\n\u003cp\u003eIt watches for moments that create demand overnight. A company opens a second location. A brand starts selling wholesale. A startup raises a round and posts five sales jobs. A tool you integrate with ships something new. The easiest way to build this is in Clay. Pull a list of accounts that match customer-fit.md, then add columns that check for each trigger, like new job postings, funding news, new locations or new pages on their website. Apollo is handy for the contact data.\u003c/p\u003e\n\u003cp\u003eFor every account with a fresh trigger, the agent checks the CRM to skip anyone your team is already talking to, then finishes one sentence: \"This event creates this problem, and our product solves it in this specific way.\" If the sentence comes out mushy, the account waits. If it comes out sharp, the agent drafts a short email that leads with the event and saves it as a draft for you to review. That one sentence filter is what makes outreach feel like good timing instead of spam.\u003c/p\u003e\n\u003ch3 id=\"the-search-agent\"\u003eThe search agent\u003c/h3\u003e\n\u003cp\u003eIt finds the questions people ask right before they buy and builds the best page on the internet for each one. Feed it three sources: your Search Console data, the questions that come up on sales calls, and what ChatGPT, Claude and Perplexity say when you ask them about your category. That last one is new and wildly underrated. Every week, ask the AI engines the questions your buyers ask and record which companies and sources they recommend. It shows you what the models trust and where you're invisible.\u003c/p\u003e\n\u003cp\u003eThen build pages that are more useful than anything else out there, because AI search rewards the most useful page more than the most optimized one. A commercial kitchen supplier that builds a guide to opening your first restaurant, with a calculator for what equipment fits your space and budget, gets ranked, gets cited by the AI engines, and gets bookmarked by buyers who come back when they're ready. Your agent can write that calculator in an afternoon and publish it on Next.js and Vercel, or on Framer if you want speed.\u003c/p\u003e\n\u003ch3 id=\"the-creative-agent\"\u003eThe creative agent\u003c/h3\u003e\n\u003cp\u003eIt makes and tests ads. Give it the latest customer language report, the approved claims from offers.md, real product footage and screenshots, and a folder of ads you love. Ask it for different reasons to buy, instead of fifty versions of the same headline: one ad that walks through a worked example, one that tells a customer story, one that's a raw demo of the product. Image models like Nano Banana and video models like Veo make the production almost free.\u003c/p\u003e\n\u003cp\u003eName every ad with what it's testing, like BK014_dinner-angle_ugc_v2, so the campaign ID, the idea and the format live right in the name. A month later, \"the dinner angle beat the price angle\" is a lesson you can use everywhere. \"video_final_7 won\" is trivia.\u003c/p\u003e\n\u003cp\u003eThe agent uploads ads through the Meta Ads API in a paused state, so a human hits go. Then a small script checks results every morning and pauses anything under 1% CTR after a set amount of spend. Decide your evidence bar before you launch: how much spend, how many days, and what counts as a win. Skip that step and 200 ads just gives you 200 inconclusive experiments.\u003c/p\u003e\n\u003ch3 id=\"the-closed-lost-agent\"\u003eThe closed-lost agent\u003c/h3\u003e\n\u003cp\u003eIt is the one that pays for everything else. Pull every lost deal from your CRM along with its notes and call transcripts. \"Not interested\" is a lazy summary of a real conversation, so have the agent reread each one and record the actual reason plus a reopen condition. \"Went with a competitor, contract renews in March.\" \"Needed SSO.\" \"Champion left the company.\"\u003c/p\u003e\n\u003cp\u003eThen it watches for those conditions. The day your changelog says SSO shipped, every prospect who asked for it gets a personal draft that quotes their original call. When the renewal date gets close, you show up. When the champion lands at a new company, you congratulate them and reintroduce yourself. Respect optouts and contact preferences, and you'll find most companies have a pile of unfinished revenue sitting in their own CRM.\u003c/p\u003e\n\u003ch3 id=\"the-performance-agent\"\u003eThe performance agent\u003c/h3\u003e\n\u003cp\u003eIt reads your campaign table every Monday and writes you a short memo, the way a sharp analyst would. \"The profitability review page converted at 4%, and half those leads were too small to serve. The dinner ad has the lowest cost per qualified call. Retargeting has spent $3,000 and produced two sales conversations.\" Every line ends in a decision for you: keep, kill, change or test.\u003c/p\u003e\n\u003cp\u003eWire it all the way through to retention, refunds and profit. A campaign that brings in cheap customers who churn in sixty days looks amazing on a dashboard and quietly loses you money. This is the agent that catches it.\u003c/p\u003e\n\u003ch2 id=\"step-6-put-the-guardrails-in-the-tools\"\u003eStep 6: Put the guardrails in the tools\u003c/h2\u003e\n\u003ch3 id=\"prompts-are-not-guardrails\"\u003ePrompts are not guardrails\u003c/h3\u003e\n\u003cp\u003eThe fastest way to get burned is to trust a sentence in a prompt. \"Always ask me before sending\" is a polite suggestion to a model. Real guardrails live in the tools.\u003c/p\u003e\n\u003ch3 id=\"use-least-privilege-and-hard-approval-steps\"\u003eUse least privilege and hard approval steps\u003c/h3\u003e\n\u003cp\u003eGive every agent the smallest set of permissions it needs. The outreach agent gets draft only access to email. The ads agent creates ads in a paused state, and budgets stay with you. Approval steps live inside the code itself, like a Slack message with an approve button that the action waits on. Use plain code for exact rules like spend caps, suppression lists and deduping, and save the model for judgment calls like whether an account fits or whether a message sounds like you.\u003c/p\u003e\n\u003ch3 id=\"give-each-agent-a-contract\"\u003eGive each agent a contract\u003c/h3\u003e\n\u003cp\u003eThen write each agent a short contract, like a job description with guardrails. Here's one for the buying trigger agent:\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCbFV0bsAAfDqN?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"make-failure-visible\"\u003eMake failure visible\u003c/h3\u003e\n\u003cp\u003e\"Done\" means it checked every source within its limits and told you what broke. An agent that says \"this source failed today\" is worth ten that quietly skip it.\u003c/p\u003e\n\u003ch2 id=\"step-7-run-a-campaign-end-to-end\"\u003eStep 7: Run a campaign end to end\u003c/h2\u003e\n\u003ch3 id=\"a-worked-example-from-customer-language-to-revenue\"\u003eA worked example: from customer language to revenue\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHH3H-aMAArNw1?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003eHere's what it looks like when all of it works together. Picture a bookkeeping firm that wants more ecommerce clients.\u003c/p\u003e\n\u003ch3 id=\"monday-turn-customer-language-into-an-offer\"\u003eMonday: turn customer language into an offer\u003c/h3\u003e\n\u003cp\u003eOn Monday, the customer language report shows that store owners keep saying the same thing: \"I can't tell if I actually made money after returns, shipping and fees.\" Eleven different customers said it last month. You walk it over to the person who delivers the service and ask whether the firm can really solve this. They say yes, and that it's the first thing they fix for every new client. You approve an offer in offers.md: a free profitability review for stores doing $1M to $10M a year.\u003c/p\u003e\n\u003ch3 id=\"give-the-campaign-an-identity-that-survives-every-step\"\u003eGive the campaign an identity that survives every step\u003c/h3\u003e\n\u003cp\u003eThe campaign gets an ID, BK014, and everything from here carries it.\u003c/p\u003e\n\u003ch3 id=\"tuesday-let-the-agents-build-from-the-same-evidence\"\u003eTuesday: let the agents build from the same evidence\u003c/h3\u003e\n\u003cp\u003eOn Tuesday, the creative agent makes three angles from the customer's own words: where your profit disappears, a sample monthly report, and a short story from a real client. The search agent builds a page with a simple profit calculator that uses numbers the firm has checked. The closed-lost agent finds 60 old prospects who said \"maybe after year-end\" and drafts each of them a personal note. The buying trigger agent flags stores that just launched on Amazon, because multichannel selling makes the books messier.\u003c/p\u003e\n\u003ch3 id=\"wednesday-human-review-before-launch\"\u003eWednesday: human review before launch\u003c/h3\u003e\n\u003cp\u003eOn Wednesday, you review everything in one sitting. You cut one ad that promises savings the firm can't guarantee, approve the rest, and launch a $2,000 test.\u003c/p\u003e\n\u003ch3 id=\"two-weeks-later-connect-spend-to-signed-clients\"\u003eTwo weeks later: connect spend to signed clients\u003c/h3\u003e\n\u003cp\u003eTwo weeks later the performance agent connects the spend to booked reviews and the reviews to signed clients. The calculator page converts best. The Amazon trigger list books the most calls. It also reminds you the sample is still small.\u003c/p\u003e\n\u003ch3 id=\"keep-the-original-customer-language-attached-to-the-campaign\"\u003eKeep the original customer language attached to the campaign\u003c/h3\u003e\n\u003cp\u003eYou'll notice that the customer's original words survived every step. Normally a sharp insight goes through a research summary, a brief and five rounds of edits, and comes out sounding like every other bookkeeping ad on the internet. Here the quotes traveled with the campaign folder, so every agent saw them.\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCamhEaAAAzHyA?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch2 id=\"step-8-run-the-weekly-loop\"\u003eStep 8: Run the weekly loop\u003c/h2\u003e\n\u003ch3 id=\"the-job-becomes-editing-the-system\"\u003eThe job becomes editing the system\u003c/h3\u003e\n\u003cp\u003eOnce the machine is built, the job looks a lot more like editing than making.\u003c/p\u003e\n\u003cp\u003eMonday you read the performance memo and make the keep, kill and change calls. Tuesday and Wednesday you build, fix the workflows that produced weak work last week, and launch new tests. Thursday you get on calls with sales and support, because that's where next week's best ideas are hiding. Friday you review what the agents made and update the files.\u003c/p\u003e\n\u003ch3 id=\"build-a-fast-review-queue\"\u003eBuild a fast review queue\u003c/h3\u003e\n\u003cp\u003eThe heart of the whole thing is a review queue. Every item in it should take under a minute to decide. \"Approve this revised offer. It changes these two ads and this email.\" Show the change, what it touches, and the evidence behind it.\u003c/p\u003e\n\u003ch3 id=\"every-rejection-should-improve-the-next-run\"\u003eEvery rejection should improve the next run\u003c/h3\u003e\n\u003cp\u003eAnd the system only gets smarter when you change its inputs. Every time you reject something, write down why and put it where the next run will see it. Rejected an ad because it pulls in businesses too small for you? Update customer-fit.md. A prospect misread an offer? Add a check for it. Keep an experiment log with what you tested, why, what happened and what you'll do next. Keep ten example inputs for each agent with the output you expect, and rerun them every time you change an instruction, so you know right away if something got worse.\u003c/p\u003e\n\u003ch3 id=\"if-output-is-weak-fix-the-brain-or-the-contract\"\u003eIf output is weak, fix the brain or the contract\u003c/h3\u003e\n\u003cp\u003eIf you find yourself spending all day fixing agent output, the problem is upstream. It's almost always the brain or the contract.\u003c/p\u003e\n\u003ch2 id=\"the-creative-engine\"\u003eThe creative engine\u003c/h2\u003e\n\u003cp\u003eHere's what most people still haven't caught up to: creative is the new targeting.\u003c/p\u003e\n\u003cp\u003eMeta rebuilt how it decides which ads to show. Its new system, called Andromeda, finished rolling out globally in late 2025, and it reads the ad itself to figure out who should see it. Your image, your hook and your script now do the job that interest targeting used to do. One side effect is brutal for lazy advertisers. Andromeda groups ads that look alike and treats them as one, so fifty versions of the same headline get you roughly the reach of a single ad. And winning ads now burn out in two or three weeks instead of six.\u003c/p\u003e\n\u003cp\u003eSo the job is a steady stream of truly different ideas. Until recently that needed a production team. Now it needs a creative engine, and here's how I'd set one up.\u003c/p\u003e\n\u003ch3 id=\"start-with-the-words\"\u003eStart with the words\u003c/h3\u003e\n\u003cp\u003eLoad \u003ccode\u003evoice.md\u003c/code\u003e and the latest customer language report into a frontier model like Claude or GPT and have it write scripts for 8 to 12 distinct concepts: a pain point, a worked example, a customer story, a founder rant, a comparison, a myth you're busting. Give each concept two or three hooks. The strategy lives in this step, so spend your time here.\u003c/p\u003e\n\u003ch3 id=\"start-from-a-funnel-thats-already-working\"\u003eStart from a funnel that's already working\u003c/h3\u003e\n\u003cp\u003eMy partner hasn't publicly talked about it much but \u003ca href=\"https://x.com/@BoringMarketer\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@BoringMarketer\u003c/a\u003e just launched \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e, which breaks down a real, live funnel every week, from the ad to the last email, and turns each step into a prompt you can hand to your coding agent. It's a much better starting point than a blank page.\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUChi1tboAAm1GF?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"then-make-the-images\"\u003eThen make the images\u003c/h3\u003e\n\u003cp\u003eNano Banana, GPT Image and Midjourney now produce product shots, lifestyle scenes and static ads that hold up on a phone screen. The trick is to feed them your real product photos so the product stays accurate, and let the model change everything around it.\u003c/p\u003e\n\u003ch3 id=\"then-make-the-video\"\u003eThen make the video\u003c/h3\u003e\n\u003cp\u003eVeo, Kling and fal turn a script or a still image into a short clip. For talking-head ads, Arcads, HeyGen and Creatify generate AI actors r
