eading your script in dozens of languages. ElevenLabs handles voiceover, and CapCut or Captions handles the edit.\u003c/p\u003e\n\u003ch3 id=\"use-ai-actors-to-test-then-pay-humans-to-win\"\u003eUse AI actors to test, then pay humans to win\u003c/h3\u003e\n\u003cp\u003eThis is the inside sauce on AI UGC. AI actors let you test twenty scripts in a day for the price of one creator video. Once you know which script works, a real person saying it usually performs even better, builds more trust, and keeps you on the right side of platforms that require AI content to be labeled.\u003c/p\u003e\n\u003ch3 id=\"let-the-agent-run-the-loop\"\u003eLet the agent run the loop\u003c/h3\u003e\n\u003cp\u003eIt launches each concept paused, a human hits go, a script pauses the losers after a set amount of spend, and every Monday the performance agent tells you which concepts won and which hooks to try next. Your job becomes picking ideas and judging taste, and the machine handles the volume.\u003c/p\u003e\n\u003cp\u003eThe marketing engineers winning on paid social right now are shipping dozens of truly different concepts a month, and they're doing it without a production team.\u003c/p\u003e\n\u003ch2 id=\"the-social-engine\"\u003eThe social engine\u003c/h2\u003e\n\u003cp\u003ePaid gets all the attention, but organic social is where marketing engineers quietly build an unfair advantage. It's free distribution, and it's the cheapest creative testing lab ever invented.\u003c/p\u003e\n\u003ch3 id=\"treat-organic-as-your-test-kitchen\"\u003eTreat organic as your test kitchen\u003c/h3\u003e\n\u003cp\u003ePost ten hooks as organic TikToks, Reels or X posts, see which ones the algorithm picks up, and only then put money behind the winners. You find out what works for free, and your ad budget only goes to ideas that already proved themselves.\u003c/p\u003e\n\u003ch3 id=\"clip-everything\"\u003eClip everything\u003c/h3\u003e\n\u003cp\u003eOne long piece of content, like a podcast, a webinar or a founder rant on a walk, can become twenty short clips. Tools like Opus Clip find the best moments and caption them, and an agent can schedule them across every platform. This is how most of the biggest podcasts grow.\u003c/p\u003e\n\u003ch3 id=\"use-formats-that-scale-without-a-face\"\u003eUse formats that scale without a face\u003c/h3\u003e\n\u003cp\u003eSlideshows and carousels on TikTok and Instagram, built from your customer language report, are some of the easiest posts to make and some of the most saved. An agent writes the slides, a model makes the images, and you approve the batch on Sunday.\u003c/p\u003e\n\u003ch3 id=\"listen-before-you-talk\"\u003eListen before you talk\u003c/h3\u003e\n\u003cp\u003ePoint an agent at Reddit, X, TikTok comments and your competitors' reviews, and have it report what people are complaining about, asking for and getting excited about each week. Then have it draft helpful replies for threads where your product truly helps, and post them yourself. On Reddit especially, a useful answer from a real person beats any ad, and a spammy one gets you banned.\u003c/p\u003e\n\u003ch3 id=\"put-the-founder-to-work\"\u003ePut the founder to work\u003c/h3\u003e\n\u003cp\u003eWhen every brand can generate content, the scarcest thing on the feed is a real person with real opinions. Turn founder-opinions.md into a content engine: the agent drafts a post a day from your takes, and you edit it into your voice and hit publish. AI makes the founder more valuable, because they're the one thing nobody else can generate.\u003c/p\u003e\n\u003cp\u003eTwo rules keep this clean. Label AI-generated people and scenes wherever the platform asks, and keep a human on the publish button.\u003c/p\u003e\n\u003ch2 id=\"how-to-become-a-top-1-marketing-engineer\"\u003eHow to become a top 1% marketing engineer\u003c/h2\u003e\n\u003cp\u003eOnce the basics run on their own, this is where it gets fun.\u003c/p\u003e\n\u003ch3 id=\"build-decision-tools\"\u003eBuild decision tools\u003c/h3\u003e\n\u003cp\u003eThe first is building decision tools. A packaging company builds a calculator that shows which box size cuts your shipping bill. A software company builds a migration checker that scans your setup and shows exactly what moves over cleanly. These used to be six-month engineering projects, so they rarely happened. Now a marketing engineer can ship a scrappy version in a week, and buyers bookmark it and come back right when they're ready to buy.\u003c/p\u003e\n\u003ch3 id=\"market-to-the-people-who-influence-the-purchase\"\u003eMarket to the people who influence the purchase\u003c/h3\u003e\n\u003cp\u003eThe second is marketing to the people who influence the purchase. The accountant who recommends software to forty clients. The agency that picks tools for its customers. The IT person who gets asked \"is this safe?\" Build a campaign just for them, with exactly the material they need to say yes.\u003c/p\u003e\n\u003ch3 id=\"fix-acquisition-inside-onboarding\"\u003eFix acquisition inside onboarding\u003c/h3\u003e\n\u003cp\u003eThe third is fixing acquisition inside onboarding. Sometimes the ads are working fine and new customers churn because the first week is confusing. An agent that reads onboarding tickets and finds where people get stuck can do more for growth than your next ad set.\u003c/p\u003e\n\u003ch3 id=\"give-every-channel-its-own-job\"\u003eGive every channel its own job\u003c/h3\u003e\n\u003cp\u003eThe fourth is giving every channel its own job. Search answers questions. Social starts conversations. Email shows up at a specific moment. When every channel repeats the same message, you're paying for the same impression five times.\u003c/p\u003e\n\u003ch2 id=\"the-stack\"\u003eThe stack\u003c/h2\u003e\n\u003cp\u003eHere's the full toolkit, by job. Tools change every few months, so learn the categories and swap the names as you go.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAgent workspace:\u003c/strong\u003e Claude Code, Codex, Cursor, Google AI Studio\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAlways-on agents:\u003c/strong\u003e Hermes, GrokBot, Codex\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWriting and strategy:\u003c/strong\u003e Claude, ChatGPT, Gemini\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eImages:\u003c/strong\u003e Nano Banana, GPT Image, Midjourney\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVideo:\u003c/strong\u003e Veo, Sora, Kling, Runway, Fal\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI actors and UGC:\u003c/strong\u003e Arcads, HeyGen, Creatify\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVoice:\u003c/strong\u003e ElevenLabs\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFunnels\u003c/strong\u003e: \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoringFunnels.com\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEditing and clipping:\u003c/strong\u003e CapCut, Captions, Opus Clip\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCustomer voice:\u003c/strong\u003e Gong, Fathom, Intercom, Zendesk, G2\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCRM:\u003c/strong\u003e HubSpot, Salesforce\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSignals and enrichment:\u003c/strong\u003e Clay, Apollo\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSearch and AI visibility:\u003c/strong\u003e Ahrefs, Semrush, Google Search Console\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAds:\u003c/strong\u003e Meta Ads API, Google Ads API\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEmail and outbound:\u003c/strong\u003e \u003ca href=\"https://customer.io/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCustomer.io\u003c/a\u003e, Resend, Instantly\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWeb:\u003c/strong\u003e Next.js on Vercel, Framer, Webflow\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMeasurement:\u003c/strong\u003e PostHog, Stripe, Supabase\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"what-you-need-to-learn\"\u003eWhat you need to learn\u003c/h2\u003e\n\u003cp\u003eThe job is half marketer and half builder, and you need both halves.\u003c/p\u003e\n\u003ch3 id=\"the-marketer-half\"\u003eThe marketer half\u003c/h3\u003e\n\u003cp\u003eThe marketer half is the stuff great marketers have always known. How to run a customer interview and hear the phrase that matters. How to position a product so the right people feel it was made for them. How to build an offer that's a real reason to buy, as opposed to a discount in a costume. How to write a headline that stops a scroll. How each channel decides who sees what. And enough statistics to know when a result is real and when it's a fluke.\u003c/p\u003e\n\u003ch3 id=\"the-builder-half\"\u003eThe builder half\u003c/h3\u003e\n\u003cp\u003eThe builder half is newer, and it's much easier to learn than people think. You need to write context that an agent can actually use, which is the most underrated skill on this whole list. You need to read code well enough to judge whether it does what you asked, because the agent writes it and you own it. You need to understand how APIs and MCP connect tools, write basic SQL to pull your own numbers, ship a page, use git, write test cases, and know roughly what each agent run costs you.\u003c/p\u003e\n\u003ch3 id=\"learn-by-shipping\"\u003eLearn by shipping\u003c/h3\u003e\n\u003cp\u003eThe fastest way to learn the builder half is to ship one ugly landing page this weekend with an AI coding tool. One deployed page teaches you more than ten courses.\u003c/p\u003e\n\u003ch2 id=\"where-this-goes\"\u003eWhere this goes\u003c/h2\u003e\n\u003ch3 id=\"if-you-started-this-week\"\u003eIf you started this week\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHHn_3bsAATORV?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003eIf I had to start this week, here's what I'd do. If you're a marketer, build the customer language agent and run it on your last 20 sales calls. If you're an engineer, sit in on five sales calls, then build a calculator for one customer segment. If you're a founder, block two hours this weekend and write founder-opinions.md, because every agent you build after that gets sharper.\u003c/p\u003e\n\u003ch3 id=\"earn-trust-one-workflow-at-a-time\"\u003eEarn trust one workflow at a time\u003c/h3\u003e\n\u003cp\u003eKeep publishing, outreach and spending behind approval until each workflow earns your trust. Get one workflow reliable before you add the next. A confused workflow running every morning just gives you a reliable supply of confusion.\u003c/p\u003e\n\u003ch3 id=\"the-authors-bet-on-where-marketing-teams-go-next\"\u003eThe author's bet on where marketing teams go next\u003c/h3\u003e\n\u003cp\u003eFor most of the history of marketing, the winner was whoever had the biggest budget and the most people. I think the next decade belongs to whoever understands their customer best and can act on it fastest. My guess is that by 2028 the best marketing teams will be one or two marketing engineers running dozens of agents, and they'll outship departments ten times their size.\u003c/p\u003e\n\u003cp\u003eMost of those people are sitting in growth, content and ops roles right now. They're one weekend of building away from becoming one.\u003c/p\u003e\n\u003ch3 id=\"further-resources-and-ways-to-work-together\"\u003eFurther resources and ways to work together\u003c/h3\u003e\n\u003cp\u003eIf you want to go deeper, I did a full episode on marketing engineers on the \u003ca href=\"https://x.com/@startupideaspod\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@startupideaspod\u003c/a\u003e podcast: \u003ca href=\"https://youtube.com/watch?v=8ZC1G1ezN5o\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://youtube.com/watch?v=8ZC1G1ezN5o\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDM me if I can ever be helpful. Can't respond to everyone but will respond to some!\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eI'm rooting for you.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eGreg Isenberg\u003c/p\u003e\n\u003cp\u003eBtw, ways we could work together:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eHire\u003c/strong\u003e \u003ca href=\"https://latecheckout.agency\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLCA\u003c/a\u003e\u003cstrong\u003e.\u003c/strong\u003e We're the leading product design firm for AI. If you want your AI product to look and feel world class, reach out. Strategy, design, product, engineering, the whole thing.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUse\u003c/strong\u003e \u003ca href=\"https://ideabrowser.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003eIdeabrowser.com\u003c/strong\u003e\u003c/a\u003e\u003cstrong\u003e.\u003c/strong\u003e Find your next startup idea, backed by real data. Over 200k founders use it.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTry\u003c/strong\u003e \u003ca href=\"https://boringfunnels.com\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels.\u003c/a\u003e My partner just launched \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e. Every week it breaks down a real funnel that's working and turns it into prompts for your coding agent.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/@startupideaspod\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@startupideaspod\u003c/a\u003e - listen on \u003ca href=\"https://open.spotify.com/show/6aB0v6amo3a8hgTCjlTlvh?si=b5f1586b30b44d51\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eSpotify\u003c/a\u003e, \u003ca href=\"https://podcasts.apple.com/us/podcast/the-startup-ideas-podcast/id1593424985\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eApple\u003c/a\u003e, \u003ca href=\"https://www.youtube.com/@GregIsenberg/videos\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eYouTube\u003c/a\u003e for startup ideas, growth tactics and practical AI tutorials.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"chatgpt-editorial-note-dmndeditorial-insightv1\" class=\"dmnd-editorial-block dmnd-editorial-start\"\u003eChatGPT Editorial Note\u003c/h2\u003e\n\u003cp class=\"dmnd-editorial-block\"\u003eThe article argues that AI changes marketing less by producing faster drafts than by collapsing the cost of running specific, measurable experiments, turning a strong marketer-builder into the operator of a system that continuously converts customer evidence into campaigns, decisions and learning.\u003c/p\u003e\n\u003ch3 id=\"key-takeaways\" class=\"dmnd-editorial-block\"\u003eKey takeaways\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003eThe core advantage is not “more AI content,” but faster learning: customer language, offers, creative, campaign identity, revenue and retention are connected so experiments can be judged by business outcomes.\u003c/li\u003e\n\u003cli\u003eThe proposed system depends on a maintained “brain”: explicit customer fit, offers, brand voice, founder opinions and failed-campaign lessons. Weak context produces generic output even when the underlying models are capable.\u003c/li\u003e\n\u003cli\u003eThe article repeatedly keeps humans at critical control points: start with read-only access, use least privilege, create ads paused, preserve approval steps in code and keep a human on the publish button.\u003c/li\u003e\n\u003cli\u003eReliability comes from one workflow at a time, visible failures, review queues, experiment logs and updating upstream context or contracts when output is weak—not from adding more agents immediately.\u003c/li\u003e\n\u003cli\u003eThe “100x” framing is directional rather than measured here; the source presents it as a thesis about experiment throughput and organizational leverage, not as a demonstrated benchmark across companies.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"ideas-worth-borrowing\" class=\"dmnd-editorial-block\"\u003eIdeas worth borrowing\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003eTreat customer evidence as a reusable operating asset that stays attached to campaigns instead of being compressed into briefs and lost through handoffs.\u003c/li\u003e\n\u003cli\u003eSeparate model judgment from deterministic rules: use agents for interpretation, while code enforces permissions, spend caps, suppression lists, deduplication and approvals.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr class=\"dmnd-editorial-block dmnd-editorial-end\"\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:01b328b976c910fae7fcac98607ed78a7c553c9782823c14ea36a10b8fd5def9":{"html":"\u003cp\u003eEvery company is sitting on a pile of gold it rarely uses (I know it's hard to believe but it's true).\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCehtAbwAAOKjs?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003eSales hears the same five objections every week. Support knows exactly which promises lead to refunds. The founder has strong opinions about the category that live in their head and a few podcast clips. Analytics knows which pages bring in customers who stick around. All of it lives in different tools, owned by different people, and it reaches a campaign maybe once a quarter.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Every company is sitting on a pile of gold it rarely uses (I know it's hard to believe but it's true).\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCehtAbwAAOKjs?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\nSales hears the same five objections every week. Support knows exactly which promises lead to refunds. The founder has strong opinions about the category that live in their head and a few podcast clips. Analytics knows which pages bring in customers who stick around. All of it lives in different tools, owned by different people, and it reaches a campaign maybe once a quarter.","sourceFormat":"markdown"},"note:sha256:0857476ab74cf09c0034a31b49b69f848d9944aee2ee1a3e5d15b0d4900b8504":{"html":"\u003cp\u003e\u003ccode\u003eSTART-HERE.md\u003c/code\u003e is the one page every agent reads first. It says what the company does, who it serves, what this quarter's priorities are, and where everything else lives.\u003c/p\u003e\n","kind":"html","rawMarkdown":"`START-HERE.md` is the one page every agent reads first. It says what the company does, who it serves, what this quarter's priorities are, and where everything else lives.","sourceFormat":"markdown"},"note:sha256:20052a94ab0da3f24c40ea1f407153ef00ffd9642d5b20a6fe99dc942a191b8a":{"html":"\u003cp\u003eEverything starts with an agent workspace. Claude Code, Codex and Cursor are the common ones. The easiest way to think about these tools is as a very fast junior employee who lives inside a folder on your computer. It can read every file in that folder, write new ones, run code, and use any tool you connect to it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Everything starts with an agent workspace. Claude Code, Codex and Cursor are the common ones. The easiest way to think about these tools is as a very fast junior employee who lives inside a folder on your computer. It can read every file in that folder, write new ones, run code, and use any tool you connect to it.","sourceFormat":"markdown"},"note:sha256:2a82d8820b63be72ff4d9584c57123dcf9d5abe5bbacad55f2118673ce6c50b8":{"html":"\u003cp\u003ePaid gets all the attention, but organic social is where marketing engineers quietly build an unfair advantage. It's free distribution, and it's the cheapest creative testing lab ever invented.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Paid gets all the attention, but organic social is where marketing engineers quietly build an unfair advantage. It's free distribution, and it's the cheapest creative testing lab ever invented.","sourceFormat":"markdown"},"note:sha256:2a8534ea8a47fda009ee2b26f0d210dd1c998dcae483ae3e3a42dcc077ff7307":{"html":"\u003cp\u003e\u003ccode\u003ecompany/customer-fit.md\u003c/code\u003e describes who buys, who stays, and who you can serve profitably. Be painfully specific. \"Shopify stores doing $1M to $10M a year, where the founder still does the books and has been burned by a bookkeeper before\" gives an agent something to work with. \"SMBs\" gives it very little.\u003c/p\u003e\n","kind":"html","rawMarkdown":"`company/customer-fit.md` describes who buys, who stays, and who you can serve profitably. Be painfully specific. \"Shopify stores doing $1M to $10M a year, where the founder still does the books and has been burned by a bookkeeper before\" gives an agent something to work with. \"SMBs\" gives it very little.","sourceFormat":"markdown"},"note:sha256:2d89d06f7a8f1b234f0c6f9191a2df24ad1d4917bdd0a6b87ff0424692067470":{"html":"\u003cp\u003eYour first one should be the customer language agent, because everything else feeds off what it finds. Its job is to read what customers actually say and pull out the exact words they use to describe their problems.\u003c/p\u003e\n\u003cp\u003eExport your last 20 to 50 sales call transcripts into evidence/calls/ and give it an instruction like this:\u003c/p\u003e\n\u003cp\u003eRead every transcript in evidence/calls/.\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCa6rbbkAAhB9C?format=png\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"Your first one should be the customer language agent, because everything else feeds off what it finds. Its job is to read what customers actually say and pull out the exact words they use to describe their problems.\n\nExport your last 20 to 50 sales call transcripts into evidence/calls/ and give it an instruction like this:\n\nRead every transcript in evidence/calls/.\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCa6rbbkAAhB9C?format=png\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:2f4ff35c564fa6210d05c186cd03ed048d99fba63f6bbd1a6e8bf81f1368c1c9":{"html":"\u003cp\u003eThe heart of the whole thing is a review queue. Every item in it should take under a minute to decide. \"Approve this revised offer. It changes these two ads and this email.\" Show the change, what it touches, and the evidence behind it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The heart of the whole thing is a review queue. Every item in it should take under a minute to decide. \"Approve this revised offer. It changes these two ads and this email.\" Show the change, what it touches, and the evidence behind it.","sourceFormat":"markdown"},"note:sha256:2fc57e66a47c088147e3a2765005f833b9127b29e19a4a218744a503ac0e33cd":{"html":"\u003cp\u003eOnce your first agent is solid, add the rest one at a time. Each one gets its own folder in workflows/, its own instructions and its own schedule.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Once your first agent is solid, add the rest one at a time. Each one gets its own folder in workflows/, its own instructions and its own schedule.","sourceFormat":"markdown"},"note:sha256:3096ab362e0f0f399f0f5486bd508eba0f793327b37b0d76f6c4be7e1fb532c9":{"html":"\u003cp\u003e\u003ccode\u003ecompany/offers.md\u003c/code\u003e lists what you sell, what it costs, what you're allowed to promise, and what needs approval before anyone says it out loud.\u003c/p\u003e\n","kind":"html","rawMarkdown":"`company/offers.md` lists what you sell, what it costs, what you're allowed to promise, and what needs approval before anyone says it out loud.","sourceFormat":"markdown"},"note:sha256:339950f512c083e7759587c52e37fe78b8c55a85a497c74c7161166031caa5e6":{"html":"\u003cp\u003eBuild one agent and get it great before you build a second. Six agents talking to each other on day one is how you end up spending your weekend debugging a group chat.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Build one agent and get it great before you build a second. Six agents talking to each other on day one is how you end up spending your weekend debugging a group chat.","sourceFormat":"markdown"},"note:sha256:33cf873391e4a8d3f58131ad63ea966048328b4166f9a9bc8c5652d24caec4fa":{"html":"\u003cp\u003eHere's what most people still haven't caught up to: creative is the new targeting.\u003c/p\u003e\n\u003cp\u003eMeta rebuilt how it decides which ads to show. Its new system, called Andromeda, finished rolling out globally in late 2025, and it reads the ad itself to figure out who should see it. Your image, your hook and your script now do the job that interest targeting used to do. One side effect is brutal for lazy advertisers. Andromeda groups ads that look alike and treats them as one, so fifty versions of the same headline get you roughly the reach of a single ad. And winning ads now burn out in two or three weeks instead of six.\u003c/p\u003e\n\u003cp\u003eSo the job is a steady stream of truly different ideas. Until recently that needed a production team. Now it needs a creative engine, and here's how I'd set one up.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Here's what most people still haven't caught up to: creative is the new targeting.\n\nMeta rebuilt how it decides which ads to show. Its new system, called Andromeda, finished rolling out globally in late 2025, and it reads the ad itself to figure out who should see it. Your image, your hook and your script now do the job that interest targeting used to do. One side effect is brutal for lazy advertisers. Andromeda groups ads that look alike and treats them as one, so fifty versions of the same headline get you roughly the reach of a single ad. And winning ads now burn out in two or three weeks instead of six.\n\nSo the job is a steady stream of truly different ideas. Until recently that needed a production team. Now it needs a creative engine, and here's how I'd set one up.","sourceFormat":"markdown"},"note:sha256:385f9292e2ce278463c825e53c7f5ad8cec608eb1c6a00a6ee129eb874f4df77":{"html":"\u003cp\u003eThe fourth is giving every channel its own job. Search answers questions. Social starts conversations. Email shows up at a specific moment. When every channel repeats the same message, you're paying for the same impression five times.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The fourth is giving every channel its own job. Search answers questions. Social starts conversations. Email shows up at a specific moment. When every channel repeats the same message, you're paying for the same impression five times.","sourceFormat":"markdown"},"note:sha256:3c8a1d5f5f156e18a27b68823b57085292cf43bf0e3d2110e927638cdfa8454b":{"html":"\u003cp\u003eIf you want to go deeper, I did a full episode on marketing engineers on the \u003ca href=\"https://x.com/@startupideaspod\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@startupideaspod\u003c/a\u003e podcast: \u003ca href=\"https://youtube.com/watch?v=8ZC1G1ezN5o\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://youtube.com/watch?v=8ZC1G1ezN5o\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDM me if I can ever be helpful. Can't respond to everyone but will respond to some!\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eI'm rooting for you.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eGreg Isenberg\u003c/p\u003e\n\u003cp\u003eBtw, ways we could work together:\u003c/p\u003e\n","kind":"html","rawMarkdown":"If you want to go deeper, I did a full episode on marketing engineers on the [@startupideaspod](https://x.com/@startupideaspod) podcast: [https://youtube.com/watch?v=8ZC1G1ezN5o](https://youtube.com/watch?v=8ZC1G1ezN5o)\n\nDM me if I can ever be helpful. Can't respond to everyone but will respond to some!\n\n**I'm rooting for you.**\n\nGreg Isenberg\n\nBtw, ways we could work together:","sourceFormat":"markdown"},"note:sha256:3cdbaa304a68869f0107cfe50fa7c2dd2183e786810905e9097b59ffbccaf1bd":{"html":"\u003cp\u003eOn Wednesday, you review everything in one sitting. You cut one ad that promises savings the firm can't guarantee, approve the rest, and launch a $2,000 test.\u003c/p\u003e\n","kind":"html","rawMarkdown":"On Wednesday, you review everything in one sitting. You cut one ad that promises savings the firm can't guarantee, approve the rest, and launch a $2,000 test.","sourceFormat":"markdown"},"note:sha256:404104a8de6102eb517da947174336f7f94327cc54c455b0d018e3ce126a4832":{"html":"\u003cp\u003eThe first is building decision tools. A packaging company builds a calculator that shows which box size cuts your shipping bill. A software company builds a migration checker that scans your setup and shows exactly what moves over cleanly. These used to be six-month engineering projects, so they rarely happened. Now a marketing engineer can ship a scrappy version in a week, and buyers bookmark it and come back right when they're ready to buy.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The first is building decision tools. A packaging company builds a calculator that shows which box size cuts your shipping bill. A software company builds a migration checker that scans your setup and shows exactly what moves over cleanly. These used to be six-month engineering projects, so they rarely happened. Now a marketing engineer can ship a scrappy version in a week, and buyers bookmark it and come back right when they're ready to buy.","sourceFormat":"markdown"},"note:sha256:42733459e0426df5f7f85450e6ef443d5203b9037ea44fc22ec033d74b194288":{"html":"\u003cp\u003eOnce it's reliable, put it on a schedule. Every Monday it reads last week's calls and tickets and drops a fresh report into evidence/customer-language/. Now your entire marketing operation runs on what customers said last week, instead of what someone guessed last year.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Once it's reliable, put it on a schedule. Every Monday it reads last week's calls and tickets and drops a fresh report into evidence/customer-language/. Now your entire marketing operation runs on what customers said last week, instead of what someone guessed last year.","sourceFormat":"markdown"},"note:sha256:480090bbedb19eae880f47011cadcc33f1dfb4a2151da1a18001d706b5880f48":{"html":"\u003cp\u003eIf I had to start this week, here's what I'd do. If you're a marketer, build the customer language agent and run it on your last 20 sales calls. If you're an engineer, sit in on five sales calls, then build a calculator for one customer segment. If you're a founder, block two hours this weekend and write founder-opinions.md, because every agent you build after that gets sharper.\u003c/p\u003e\n","kind":"html","rawMarkdown":"If I had to start this week, here's what I'd do. If you're a marketer, build the customer language agent and run it on your last 20 sales calls. If you're an engineer, sit in on five sales calls, then build a calculator for one customer segment. If you're a founder, block two hours this weekend and write founder-opinions.md, because every agent you build after that gets sharper.","sourceFormat":"markdown"},"note:sha256:4a71ca1c23a6a208f38022b019baba6f92dc29d5a2a7dc6a6262f0d7fa1ef6d4":{"html":"\u003cp\u003eGive every agent the smallest set of permissions it needs. The outreach agent gets draft only access to email. The ads agent creates ads in a paused state, and budgets stay with you. Approval steps live inside the code itself, like a Slack message with an approve button that the action waits on. Use plain code for exact rules like spend caps, suppression lists and deduping, and save the model for judgment calls like whether an account fits or whether a message sounds like you.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Give every agent the smallest set of permissions it needs. The outreach agent gets draft only access to email. The ads agent creates ads in a paused state, and budgets stay with you. Approval steps live inside the code itself, like a Slack message with an approve button that the action waits on. Use plain code for exact rules like spend caps, suppression lists and deduping, and save the model for judgment calls like whether an account fits or whether a message sounds like you.","sourceFormat":"markdown"},"note:sha256:53506db44f716258d5014ec1e8a9902aabc26be300f70a4106ab1ae87a55a0ba":{"html":"\u003cp\u003eOn Monday, the customer language report shows that store owners keep saying the same thing: \"I can't tell if I actually made money after returns, shipping and fees.\" Eleven different customers said it last month. You walk it over to the person who delivers the service and ask whether the firm can really solve this. They say yes, and that it's the first thing they fix for every new client. You approve an offer in offers.md: a free profitability review for stores doing $1M to $10M a year.\u003c/p\u003e\n","kind":"html","rawMarkdown":"On Monday, the customer language report shows that store owners keep saying the same thing: \"I can't tell if I actually made money after returns, shipping and fees.\" Eleven different customers said it last month. You walk it over to the person who delivers the service and ask whether the firm can really solve this. They say yes, and that it's the first thing they fix for every new client. You approve an offer in offers.md: a free profitability review for stores doing $1M to $10M a year.","sourceFormat":"markdown"},"note:sha256:5b5b626cde3a65ec044c57df12af9c597328360a10065b8040917fef58790ecb":{"html":"\u003cp\u003eNano Banana, GPT Image and Midjourney now produce product shots, lifestyle scenes and static ads that hold up on a phone screen. The trick is to feed them your real product photos so the product stays accurate, and let the model change everything around it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Nano Banana, GPT Image and Midjourney now produce product shots, lifestyle scenes and static ads that hold up on a phone screen. The trick is to feed them your real product photos so the product stays accurate, and let the model change everything around it.","sourceFormat":"markdown"},"note:sha256:5e98313248a5ef4bf3bfb4df6322895192ab0b1ceb98e8d0960c8fcb1d075a0a":{"html":"\u003cp\u003eThat last part is where the magic is. Tools connect through something called MCP, which is basically a universal plug for AI. HubSpot, Stripe, Notion, Slack and hundreds of other tools have MCP servers, so your agent can read your CRM or pull last week's revenue the same way you would. When a tool only has an API, the agent can usually write the code to call it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"That last part is where the magic is. Tools connect through something called MCP, which is basically a universal plug for AI. HubSpot, Stripe, Notion, Slack and hundreds of other tools have MCP servers, so your agent can read your CRM or pull last week's revenue the same way you would. When a tool only has an API, the agent can usually write the code to call it.","sourceFormat":"markdown"},"note:sha256:60b8a42788a6bebce75d35d9b9309744959ad315b74eae8e77a543c619316b0f":{"html":"\u003cp\u003eThe article argues that AI changes marketing less by producing faster drafts than by collapsing the cost of running specific, measurable experiments, turning a strong marketer-builder into the operator of a system that continuously converts customer evidence into campaigns, decisions and learning.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The article argues that AI changes marketing less by producing faster drafts than by collapsing the cost of running specific, measurable experiments, turning a strong marketer-builder into the operator of a system that continuously converts customer evidence into campaigns, decisions and learning.","sourceFormat":"markdown"},"note:sha256:616b6881170f928665068541d604f4bc76551fc62c563ca474f70d5732e594cc":{"html":"\u003cp\u003eOne long piece of content, like a podcast, a webinar or a founder rant on a walk, can become twenty short clips. Tools like Opus Clip find the best moments and caption them, and an agent can schedule them across every platform. This is how most of the biggest podcasts grow.\u003c/p\u003e\n","kind":"html","rawMarkdown":"One long piece of content, like a podcast, a webinar or a founder rant on a walk, can become twenty short clips. Tools like Opus Clip find the best moments and caption them, and an agent can schedule them across every platform. This is how most of the biggest podcasts grow.","sourceFormat":"markdown"},"note:sha256:632be7daa67584d2d0ae3af9553f3c73c5b471c38fcce64638a01b1fb6ce4908":{"html":"\u003cp\u003ePoint an agent at Reddit, X, TikTok comments and your competitors' reviews, and have it report what people are complaining about, asking for and getting excited about each week. Then have it draft helpful replies for threads where your product truly helps, and post them yourself. On Reddit especially, a useful answer from a real person beats any ad, and a spammy one gets you banned.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Point an agent at Reddit, X, TikTok comments and your competitors' reviews, and have it report what people are complaining about, asking for and getting excited about each week. Then have it draft helpful replies for threads where your product truly helps, and post them yourself. On Reddit especially, a useful answer from a real person beats any ad, and a spammy one gets you banned.","sourceFormat":"markdown"},"note:sha256:64e2d73c8930584f00b5eb72aa9abdaefb85db85ec2571c4d3e40d861dd62720":{"html":"\u003cp\u003eOn Tuesday, the creative agent makes three angles from the customer's own words: where your profit disappears, a sample monthly report, and a short story from a real client. The search agent builds a page with a simple profit calculator that uses numbers the firm has checked. The closed-lost agent finds 60 old prospects who said \"maybe after year-end\" and drafts each of them a personal note. The buying trigger agent flags stores that just launched on Amazon, because multichannel selling makes the books messier.\u003c/p\u003e\n","kind":"html","rawMarkdown":"On Tuesday, the creative agent makes three angles from the customer's own words: where your profit disappears, a sample monthly report, and a short story from a real client. The search agent builds a page with a simple profit calculator that uses numbers the firm has checked. The closed-lost agent finds 60 old prospects who said \"maybe after year-end\" and drafts each of them a personal note. The buying trigger agent flags stores that just launched on Amazon, because multichannel selling makes the books messier.","sourceFormat":"markdown"},"note:sha256:6a84988625140e79442d98589adf4fc1bcb7d2a13e72b156e30470b3ac379e70":{"html":"\u003cp\u003eMeanwhile the small ideas that would put that knowledge to work keep losing to the big launch. A pricing calculator for one niche. A campaign built from yesterday's sales calls. A note to forty old prospects on the day the feature they asked for finally ships. Each one needed a designer, a developer, an analyst and two meetings, so each one sat in the backlog forever.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Meanwhile the small ideas that would put that knowledge to work keep losing to the big launch. A pricing calculator for one niche. A campaign built from yesterday's sales calls. A note to forty old prospects on the day the feature they asked for finally ships. Each one needed a designer, a developer, an analyst and two meetings, so each one sat in the backlog forever.","sourceFormat":"markdown"},"note:sha256:6b352cda26b3c73c61d153f420c0a394632f542030da280be43bc825304ce454":{"html":"\u003cp\u003eThen do the boring thing almost every company skips. Give every campaign an ID and carry it everywhere. Put it in the UTM tags on every link, in the name of every ad, in the name of every email sequence, and in a field on every deal in the CRM. Then keep one simple table, in Supabase or even a spreadsheet to start, with a row per campaign: ID, spend, leads, qualified calls, deals, revenue and churn.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Then do the boring thing almost every company skips. Give every campaign an ID and carry it everywhere. Put it in the UTM tags on every link, in the name of every ad, in the name of every email sequence, and in a field on every deal in the CRM. Then keep one simple table, in Supabase or even a spreadsheet to start, with a row per campaign: ID, spend, leads, qualified calls, deals, revenue and churn.","sourceFormat":"markdown"},"note:sha256:6d43adc344e26de6c2eea737735e3eedf0fd58005cc853ea2edc54399f5c92d6":{"html":"\u003cp\u003eVeo, Kling and fal turn a script or a still image into a short clip. For talking-head ads, Arcads, HeyGen and Creatify generate AI actors reading your script in dozens of languages. ElevenLabs handles voiceover, and CapCut or Captions handles the edit.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Veo, Kling and fal turn a script or a still image into a short clip. For talking-head ads, Arcads, HeyGen and Creatify generate AI actors reading your script in dozens of languages. ElevenLabs handles voiceover, and CapCut or Captions handles the edit.","sourceFormat":"markdown"},"note:sha256:71bed5bbd82db36dc490e7a667d80637e1fb560380b81eaf7d953fb3be818823":{"html":"\u003cp\u003eWhen every brand can generate content, the scarcest thing on the feed is a real person with real opinions. Turn founder-opinions.md into a content engine: the agent drafts a post a day from your takes, and you edit it into your voice and hit publish. AI makes the founder more valuable, because they're the one thing nobody else can generate.\u003c/p\u003e\n\u003cp\u003eTwo rules keep this clean. Label AI-generated people and scenes wherever the platform asks, and keep a human on the publish button.\u003c/p\u003e\n","kind":"html","rawMarkdown":"When every brand can generate content, the scarcest thing on the feed is a real person with real opinions. Turn founder-opinions.md into a content engine: the agent drafts a post a day from your takes, and you edit it into your voice and hit publish. AI makes the founder more valuable, because they're the one thing nobody else can generate.\n\nTwo rules keep this clean. Label AI-generated people and scenes wherever the platform asks, and keep a human on the publish button.","sourceFormat":"markdown"},"note:sha256:72679380a4e54fad9a34a788b0f6b0e73e30768eaf3e730dc465d5126fe8e3da":{"html":"\u003cp\u003eThe third is fixing acquisition inside onboarding. Sometimes the ads are working fine and new customers churn because the first week is confusing. An agent that reads onboarding tickets and finds where people get stuck can do more for growth than your next ad set.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The third is fixing acquisition inside onboarding. Sometimes the ads are working fine and new customers churn because the first week is confusing. An agent that reads onboarding tickets and finds where people get stuck can do more for growth than your next ad set.","sourceFormat":"markdown"},"note:sha256:75a1d1069f116d565bcf85d7f35fbb847ece2a307e481d1d2104c2f8ddd8b69f":{"html":"\u003cp\u003eThe second is marketing to the people who influence the purchase. The accountant who recommends software to forty clients. The agency that picks tools for its customers. The IT person who gets asked \"is this safe?\" Build a campaign just for them, with exactly the material they need to say yes.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The second is marketing to the people who influence the purchase. The accountant who recommends software to forty clients. The agency that picks tools for its customers. The IT person who gets asked \"is this safe?\" Build a campaign just for them, with exactly the material they need to say yes.","sourceFormat":"markdown"},"note:sha256:85aa08fa3b4a6cde8b85cfeb24a64be192ffe2f94b42160d319c69d3316d82d5":{"html":"\u003cp\u003eStart with read-only access everywhere. An agent that can read your CRM is useful on day one. An agent that can edit your CRM is something it earns over time.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Start with read-only access everywhere. An agent that can read your CRM is useful on day one. An agent that can edit your CRM is something it earns over time.","sourceFormat":"markdown"},"note:sha256:8826e2057dc97cd062e510efed95ccc863e8d97e9c17c8ac857b786f1bd0a27f":{"html":"\u003cp\u003eKeep publishing, outreach and spending behind approval until each workflow earns your trust. Get one workflow reliable before you add the next. A confused workflow running every morning just gives you a reliable supply of confusion.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Keep publishing, outreach and spending behind approval until each workflow earns your trust. Get one workflow reliable before you add the next. A confused workflow running every morning just gives you a reliable supply of confusion.","sourceFormat":"markdown"},"note:sha256:8ef33eb90d0d4bf97a0db84457ce6f8bd899a10d1f7af0790ea0f2b540d5bbe4":{"html":"\u003cp\u003eSlideshows and carousels on TikTok and Instagram, built from your customer language report, are some of the easiest posts to make and some of the most saved. An agent writes the slides, a model makes the images, and you approve the batch on Sunday.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Slideshows and carousels on TikTok and Instagram, built from your customer language report, are some of the easiest posts to make and some of the most saved. An agent writes the slides, a model makes the images, and you approve the batch on Sunday.","sourceFormat":"markdown"},"note:sha256:91ea551b122c9825608a26012ffcc3a9d10690538df548cde24041089afd4818":{"html":"\u003cp\u003eIf you find yourself spending all day fixing agent output, the problem is upstream. It's almost always the brain or the contract.\u003c/p\u003e\n","kind":"html","rawMarkdown":"If you find yourself spending all day fixing agent output, the problem is upstream. It's almost always the brain or the contract.","sourceFormat":"markdown"},"note:sha256:941b3fd61f0729a93dab838296b88a6e21e88bbb2d863e6feb9d2d0cd662e8f4":{"html":"\u003cp\u003eThis is the inside sauce on AI UGC. AI actors let you test twenty scripts in a day for the price of one creator video. Once you know which script works, a real person saying it usually performs even better, builds more trust, and keeps you on the right side of platforms that require AI content to be labeled.\u003c/p\u003e\n","kind":"html","rawMarkdown":"This is the inside sauce on AI UGC. AI actors let you test twenty scripts in a day for the price of one creator video. Once you know which script works, a real person saying it usually performs even better, builds more trust, and keeps you on the right side of platforms that require AI content to be labeled.","sourceFormat":"markdown"},"note:sha256:950e03267595eb8bce0a2e43997a16f462f597bb4b06dc008a3a7393e98027d6":{"html":"\u003cp\u003eThe job is half marketer and half builder, and you need both halves.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The job is half marketer and half builder, and you need both halves.","sourceFormat":"markdown"},"note:sha256:9a6fc14a536a7a0f03f555fd649171679da2035dfa7c390b66d9143a5eb5ce9f":{"html":"\u003cp\u003e\"Done\" means it checked every source within its limits and told you what broke. An agent that says \"this source failed today\" is worth ten that quietly skip it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\"Done\" means it checked every source within its limits and told you what broke. An agent that says \"this source failed today\" is worth ten that quietly skip it.","sourceFormat":"markdown"},"note:sha256:a02c7bd327e9092ee9062dac811aea9c78972e1c8507f3f9ab0735ff0cebf696":{"html":"\u003cp\u003eYou'll also want your agents running on a schedule while you sleep. A year ago that meant stitching things together in a workflow tool like Zapier or n8n. Today you can just ask your coding agent to build it. Say \"run this every Monday at 7am, post the report to Slack, and wait for my thumbs up before sending anything,\" and it writes the scheduled job, the Slack message with an approve button, and the code that only acts once you tap it. Or use an always on agent like Hermes or OpenClaw that already runs in the background. Either way, it's your code, in your folder, and you can change any part of it with a sentence.\u003c/p\u003e\n","kind":"html","rawMarkdown":"You'll also want your agents running on a schedule while you sleep. A year ago that meant stitching things together in a workflow tool like Zapier or n8n. Today you can just ask your coding agent to build it. Say \"run this every Monday at 7am, post the report to Slack, and wait for my thumbs up before sending anything,\" and it writes the scheduled job, the Slack message with an approve button, and the code that only acts once you tap it. Or use an always on agent like Hermes or OpenClaw that already runs in the background. Either way, it's your code, in your folder, and you can change any part of it with a sentence.","sourceFormat":"markdown"},"note:sha256:a1fe996add10a813f14ab08ea65e793f3bce5e834588a3df312d3a15138396d7":{"html":"\u003cp\u003eLoad \u003ccode\u003evoice.md\u003c/code\u003e and the latest customer language report into a frontier model like Claude or GPT and have it write scripts for 8 to 12 distinct concepts: a pain point, a worked example, a customer story, a founder rant, a comparison, a myth you're busting. Give each concept two or three hooks. The strategy lives in this step, so spend your time here.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Load `voice.md` and the latest customer language report into a frontier model like Claude or GPT and have it write scripts for 8 to 12 distinct concepts: a pain point, a worked example, a customer story, a founder rant, a comparison, a myth you're busting. Give each concept two or three hooks. The strategy lives in this step, so spend your time here.","sourceFormat":"markdown"},"note:sha256:a4519ebc60da2b1213770d009161f560268c906cf468e0583448b6b75296e103":{"html":"\u003cp\u003eIt finds the questions people ask right before they buy and builds the best page on the internet for each one. Feed it three sources: your Search Console data, the questions that come up on sales calls, and what ChatGPT, Claude and Perplexity say when you ask them about your category. That last one is new and wildly underrated. Every week, ask the AI engines the questions your buyers ask and record which companies and sources they recommend. It shows you what the models trust and where you're invisible.\u003c/p\u003e\n\u003cp\u003eThen build pages that are more useful than anything else out there, because AI search rewards the most useful page more than the most optimized one. A commercial kitchen supplier that builds a guide to opening your first restaurant, with a calculator for what equipment fits your space and budget, gets ranked, gets cited by the AI engines, and gets bookmarked by buyers who come back when they're ready. Your agent can write that calculator in an afternoon and publish it on Next.js and Vercel, or on Framer if you want speed.\u003c/p\u003e\n","kind":"html","rawMarkdown":"It finds the questions people ask right before they buy and builds the best page on the internet for each one. Feed it three sources: your Search Console data, the questions that come up on sales calls, and what ChatGPT, Claude and Perplexity say when you ask them about your category. That last one is new and wildly underrated. Every week, ask the AI engines the questions your buyers ask and record which companies and sources they recommend. It shows you what the models trust and where you're invisible.\n\nThen build pages that are more useful than anything else out there, because AI search rewards the most useful page more than the most optimized one. A commercial kitchen supplier that builds a guide to opening your first restaurant, with a calculator for what equipment fits your space and budget, gets ranked, gets cited by the AI engines, and gets bookmarked by buyers who come back when they're ready. Your agent can write that calculator in an afternoon and publish it on Next.js and Vercel, or on Framer if you want speed.","sourceFormat":"markdown"},"note:sha256:a7083946d1793a07f9ea342786fb91189583fcb8a7f3f06533b90cff2c21adb4":{"html":"\u003cp\u003eOnce the machine is built, the job looks a lot more like editing than making.\u003c/p\u003e\n\u003cp\u003eMonday you read the performance memo and make the keep, kill and change calls. Tuesday and Wednesday you build, fix the workflows that produced weak work last week, and launch new tests. Thursday you get on calls with sales and support, because that's where next week's best ideas are hiding. Friday you review what the agents made and update the files.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Once the machine is built, the job looks a lot more like editing than making.\n\nMonday you read the performance memo and make the keep, kill and change calls. Tuesday and Wednesday you build, fix the workflows that produced weak work last week, and launch new tests. Thursday you get on calls with sales and support, because that's where next week's best ideas are hiding. Friday you review what the agents made and update the files.","sourceFormat":"markdown"},"note:sha256:aa45a2862c3e2518e821fe6c37123b4952110a5afab7f5ea3b30d592b077673e":{"html":"\u003cp\u003eHere's the mistake I see over and over. Someone gets excited, spins up ten agents, gets back a mountain of generic slop, and decides AI marketing is overhyped.\u003c/p\u003e\n\u003cp\u003eThe agents were fine but the context was thin.\u003c/p\u003e\n\u003cp\u003eIt's like hiring a brilliant marketer and skipping onboarding. They'll write something smart about your industry, and it'll sound exactly like your competitors. So before you build a single agent, build the brain: a folder that explains your business the way you'd explain it to a sharp new hire on their first day.\u003c/p\u003e\n\u003cp\u003eHere's the structure I'd use:\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCa05XacAAtaHo?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003eSix files do most of the heavy lifting.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Here's the mistake I see over and over. Someone gets excited, spins up ten agents, gets back a mountain of generic slop, and decides AI marketing is overhyped.\n\nThe agents were fine but the context was thin.\n\nIt's like hiring a brilliant marketer and skipping onboarding. They'll write something smart about your industry, and it'll sound exactly like your competitors. So before you build a single agent, build the brain: a folder that explains your business the way you'd explain it to a sharp new hire on their first day.\n\nHere's the structure I'd use:\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCa05XacAAtaHo?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\nSix files do most of the heavy lifting.","sourceFormat":"markdown"},"note:sha256:ac7882be93bfa5ebef1e69173facba602f5891785ba2c8035ec2240145fc9047":{"html":"\u003cp\u003eFor most of the history of marketing, the winner was whoever had the biggest budget and the most people. I think the next decade belongs to whoever understands their customer best and can act on it fastest. My guess is that by 2028 the best marketing teams will be one or two marketing engineers running dozens of agents, and they'll outship departments ten times their size.\u003c/p\u003e\n\u003cp\u003eMost of those people are sitting in growth, content and ops roles right now. They're one weekend of building away from becoming one.\u003c/p\u003e\n","kind":"html","rawMarkdown":"For most of the history of marketing, the winner was whoever had the biggest budget and the most people. I think the next decade belongs to whoever understands their customer best and can act on it fastest. My guess is that by 2028 the best marketing teams will be one or two marketing engineers running dozens of agents, and they'll outship departments ten times their size.\n\nMost of those people are sitting in growth, content and ops roles right now. They're one weekend of building away from becoming one.","sourceFormat":"markdown"},"note:sha256:ac8832ade4a9bd6634988a42bf42f4fe8c15682070cf5a31b7cb41f631a87666":{"html":"\u003cp\u003eOnce the basics run on their own, this is where it gets fun.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Once the basics run on their own, this is where it gets fun.","sourceFormat":"markdown"},"note:sha256:add2353abd29190fac5605ff900d97bf058e87edae5263444d84d81f2daf6373":{"html":"\u003cp\u003eOne rule keeps the brain healthy: agents can add guesses to \u003ccode\u003eevidence/\u003c/code\u003e, but only a human moves something into \u003ccode\u003ecompany/\u003c/code\u003e. Otherwise one agent's hunch quietly becomes company policy.\u003c/p\u003e\n","kind":"html","rawMarkdown":"One rule keeps the brain healthy: agents can add guesses to `evidence/`, but only a human moves something into `company/`. Otherwise one agent's hunch quietly becomes company policy.","sourceFormat":"markdown"},"note:sha256:b4ba11467a5cf9792de7a72c83b76a2ec98fd77e2455375613a5c2b9f17ffc02":{"html":"\u003cp\u003eIt sounds unglamorous, and it's the most valuable thing in the whole setup. Most companies can tell you clicks by campaign and revenue by customer, and very few can connect the two. Once you join those tables, your agents can answer the question that actually matters: which marketing brought in customers who paid and stayed?\u003c/p\u003e\n","kind":"html","rawMarkdown":"It sounds unglamorous, and it's the most valuable thing in the whole setup. Most companies can tell you clicks by campaign and revenue by customer, and very few can connect the two. Once you join those tables, your agents can answer the question that actually matters: which marketing brought in customers who paid and stayed?","sourceFormat":"markdown"},"note:sha256:b6e638e0496d9d2d34efbc074d6f3afc60e3f4113f86b88ac9385dc28f0a29b4":{"html":"\u003cp\u003eTwo weeks later the performance agent connects the spend to booked reviews and the reviews to signed clients. The calculator page converts best. The Amazon trigger list books the most calls. It also reminds you the sample is still small.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Two weeks later the performance agent connects the spend to booked reviews and the reviews to signed clients. The calculator page converts best. The Amazon trigger list books the most calls. It also reminds you the sample is still small.","sourceFormat":"markdown"},"note:sha256:bacf25e6c7d982d264278ee584037a0c263e11ee3ffe0074b898251f2a8ce515":{"html":"\u003cp\u003eThe fastest way to learn the builder half is to ship one ugly landing page this weekend with an AI coding tool. One deployed page teaches you more than ten courses.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The fastest way to learn the builder half is to ship one ugly landing page this weekend with an AI coding tool. One deployed page teaches you more than ten courses.","sourceFormat":"markdown"},"note:sha256:bd8bf63b816f0c7a32c37ca8022a51e76af2517c958d0bcdd266d2f0e3beb603":{"html":"\u003cp\u003eA marketing engineer can do every one of those in an afternoon. Specific marketing got cheap, and when specific gets cheap, the company that understands its customer best starts winning. Agencies that sell hours will feel this first. Big marketing teams will start to look like committees. Founders and solo marketers will suddenly have the output of a whole department.\u003c/p\u003e\n\u003cp\u003eNote: My partner just launched \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e, the idea being that the biggest opportunity is helping businesses turn what they know about their customers into clear offers, useful landing pages and follow ups that lead to sales. A marketing engineer can build the whole thing, see where people drop off and keep improving it as more customers come through.\u003c/p\u003e\n\u003cp\u003eHere's exactly how to build it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"A marketing engineer can do every one of those in an afternoon. Specific marketing got cheap, and when specific gets cheap, the company that understands its customer best starts winning. Agencies that sell hours will feel this first. Big marketing teams will start to look like committees. Founders and solo marketers will suddenly have the output of a whole department.\n\nNote: My partner just launched [Boring Funnels](https://boringfunnels.com/), the idea being that the biggest opportunity is helping businesses turn what they know about their customers into clear offers, useful landing pages and follow ups that lead to sales. A marketing engineer can build the whole thing, see where people drop off and keep improving it as more customers come through.\n\nHere's exactly how to build it.","sourceFormat":"markdown"},"note:sha256:c21548b2384741c06c915d34cb4057b4a9c247fdd9575c3ca167f69853c1a8a2":{"html":"\u003cp\u003eHere's the full toolkit, by job. Tools change every few months, so learn the categories and swap the names as you go.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Here's the full toolkit, by job. Tools change every few months, so learn the categories and swap the names as you go.","sourceFormat":"markdown"},"note:sha256:c31c702f62ded224a268d3797f1454394d88eaefb4c687ff3fa75971d755553b":{"html":"\u003cp\u003eAnd the system only gets smarter when you change its inputs. Every time you reject something, write down why and put it where the next run will see it. Rejected an ad because it pulls in businesses too small for you? Update customer-fit.md. A prospect misread an offer? Add a check for it. Keep an experiment log with what you tested, why, what happened and what you'll do next. Keep ten example inputs for each agent with the output you expect, and rerun them every time you change an instruction, so you know right away if something got worse.\u003c/p\u003e\n","kind":"html","rawMarkdown":"And the system only gets smarter when you change its inputs. Every time you reject something, write down why and put it where the next run will see it. Rejected an ad because it pulls in businesses too small for you? Update customer-fit.md. A prospect misread an offer? Add a check for it. Keep an experiment log with what you tested, why, what happened and what you'll do next. Keep ten example inputs for each agent with the output you expect, and rerun them every time you change an instruction, so you know right away if something got worse.","sourceFormat":"markdown"},"note:sha256:c530947c89a332720147bd377472d99aceda04090d359a0e12cd78ef16fb3af5":{"html":"\u003cp\u003e\u003ccode\u003ebrand/voice.md\u003c/code\u003e is where most people get lazy. \"Friendly but professional\" is useless to an agent. Paste in three emails or ads you loved, with a sentence on why each one works, and two you rejected, with the reason. \"We killed this one because it promises results in 30 days and we can't guarantee that.\" Agents learn far more from examples than from adjectives.\u003c/p\u003e\n","kind":"html","rawMarkdown":"`brand/voice.md` is where most people get lazy. \"Friendly but professional\" is useless to an agent. Paste in three emails or ads you loved, with a sentence on why each one works, and two you rejected, with the reason. \"We killed this one because it promises results in 30 days and we can't guarantee that.\" Agents learn far more from examples than from adjectives.","sourceFormat":"markdown"},"note:sha256:c58479485dd530d0a3dbd6e4116cacc558052618e04bcbf6eb3ffde98b512834":{"html":"\u003cp\u003eWhen ChatGPT showed up at the end of 2022, we got the AI-assisted marketer. Copy came faster and images came faster, and everything else stayed the same. Same org chart, same meetings, same six-week cycle, just with better first drafts. This was kinda like the AI copilot era. Most marketing teams are still sitting right here.\u003c/p\u003e\n","kind":"html","rawMarkdown":"When ChatGPT showed up at the end of 2022, we got the AI-assisted marketer. Copy came faster and images came faster, and everything else stayed the same. Same org chart, same meetings, same six-week cycle, just with better first drafts. This was kinda like the AI copilot era. Most marketing teams are still sitting right here.","sourceFormat":"markdown"},"note:sha256:c632d805b519c47ae332b065d8e8dc7f81343fa806532cababca84c5adb2604a":{"html":"\u003cp\u003eThe fastest way to get burned is to trust a sentence in a prompt. \"Always ask me before sending\" is a polite suggestion to a model. Real guardrails live in the tools.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The fastest way to get burned is to trust a sentence in a prompt. \"Always ask me before sending\" is a polite suggestion to a model. Real guardrails live in the tools.","sourceFormat":"markdown"},"note:sha256:cc6edf713fc4570ddb4af04b8d8bd78c28372e721f45528c50b5f1f65879e916":{"html":"\u003cblockquote\u003e\n\u003cp\u003e@gregisenberg · \u003ca href=\"https://x.com/gregisenberg/article/2108188646973313195\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX Article\u003c/a\u003e · 2026-10-08\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eMarketing engineers are the NEW 10x employee, and most companies don't have one yet.\u003c/p\u003e\n\u003cp\u003eIf you're growing a startup, a business or a side hustle, becoming one or hiring one is the biggest lever you have right now. It's the most exciting time to be in marketing since Google launched AdWords. Maybe ever.\u003c/p\u003e\n\u003cp\u003eFor 20 years, marketing ideas were easy and shipping them was hard. Sales knew why deals closed. Support knew why customers left. But every idea had to survive a brief, a designer, a developer, an analyst and two meetings, and most died in a Slack thread.\u003c/p\u003e\n\u003cp\u003eThat bottleneck just broke!\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCeZJxbcAED0KN?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003eToday one agent reads last week's sales calls in ten minutes. Another turns what customers said into a landing page. Another launches thirty ads and kills the losers while you sleep. Another tells you on Monday which campaign brought in customers who paid. And the models are now good enough that if your idea is good, the output will be too.\u003c/p\u003e\n\u003cp\u003eA marketing engineer wires those agents into a machine. Part marketer, part builder. And the best ones often come from outside marketing: founders, engineers, operators and solo builders.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSo grab your coffee or tea, because here's the full playbook (15–20 min read):\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e @gregisenberg · [X Article](https://x.com/gregisenberg/article/2108188646973313195) · 2026-10-08\n\nMarketing engineers are the NEW 10x employee, and most companies don't have one yet.\n\nIf you're growing a startup, a business or a side hustle, becoming one or hiring one is the biggest lever you have right now. It's the most exciting time to be in marketing since Google launched AdWords. Maybe ever.\n\nFor 20 years, marketing ideas were easy and shipping them was hard. Sales knew why deals closed. Support knew why customers left. But every idea had to survive a brief, a designer, a developer, an analyst and two meetings, and most died in a Slack thread.\n\nThat bottleneck just broke!\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCeZJxbcAED0KN?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\nToday one agent reads last week's sales calls in ten minutes. Another turns what customers said into a landing page. Another launches thirty ads and kills the losers while you sleep. Another tells you on Monday which campaign brought in customers who paid. And the models are now good enough that if your idea is good, the output will be too.\n\nA marketing engineer wires those agents into a machine. Part marketer, part builder. And the best ones often come from outside marketing: founders, engineers, operators and solo builders.\n\n**So grab your coffee or tea, because here's the full playbook (15–20 min read):**","sourceFormat":"markdown"},"note:sha256:ce06070b582228382f4ffcc15f68aa54aa3913ccecf9cb2d289a6843c833f7b5":{"html":"\u003cp\u003e\u003ccode\u003edecisions/failed-campaigns.md\u003c/code\u003e holds the lessons that cost real money. \"The free audit attracted companies too small to afford us.\" \"LinkedIn brought lots of leads and very few closes.\" One line like that saves an agent from repeating a $20,000 mistake.\u003c/p\u003e\n","kind":"html","rawMarkdown":"`decisions/failed-campaigns.md` holds the lessons that cost real money. \"The free audit attracted companies too small to afford us.\" \"LinkedIn brought lots of leads and very few closes.\" One line like that saves an agent from repeating a $20,000 mistake.","sourceFormat":"markdown"},"note:sha256:cfebf29fc30a186d10d9ccd8bec051ca95c95927b8c72c9f8bbc9a1cafc20055":{"html":"\u003cp\u003eYou'll notice that the customer's original words survived every step. Normally a sharp insight goes through a research summary, a brief and five rounds of edits, and comes out sounding like every other bookkeeping ad on the internet. Here the quotes traveled with the campaign folder, so every agent saw them.\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCamhEaAAAzHyA?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"You'll notice that the customer's original words survived every step. Normally a sharp insight goes through a research summary, a brief and five rounds of edits, and comes out sounding like every other bookkeeping ad on the internet. Here the quotes traveled with the campaign folder, so every agent saw them.\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCamhEaAAAzHyA?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:d4b04d1779c5583e8fa4384a3362fa2e9b1db00aa9350b572c9f3219d0f92318":{"html":"\u003cp\u003ePost ten hooks as organic TikToks, Reels or X posts, see which ones the algorithm picks up, and only then put money behind the winners. You find out what works for free, and your ad budget only goes to ideas that already proved themselves.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Post ten hooks as organic TikToks, Reels or X posts, see which ones the algorithm picks up, and only then put money behind the winners. You find out what works for free, and your ad budget only goes to ideas that already proved themselves.","sourceFormat":"markdown"},"note:sha256:d5ebe6ddd7d1c236fe28591dae1f89421d45b2fb2123660dfd295aa8f0d89778":{"html":"\u003cp\u003eIt makes and tests ads. Give it the latest customer language report, the approved claims from offers.md, real product footage and screenshots, and a folder of ads you love. Ask it for different reasons to buy, instead of fifty versions of the same headline: one ad that walks through a worked example, one that tells a customer story, one that's a raw demo of the product. Image models like Nano Banana and video models like Veo make the production almost free.\u003c/p\u003e\n\u003cp\u003eName every ad with what it's testing, like BK014_dinner-angle_ugc_v2, so the campaign ID, the idea and the format live right in the name. A month later, \"the dinner angle beat the price angle\" is a lesson you can use everywhere. \"video_final_7 won\" is trivia.\u003c/p\u003e\n\u003cp\u003eThe agent uploads ads through the Meta Ads API in a paused state, so a human hits go. Then a small script checks results every morning and pauses anything under 1% CTR after a set amount of spend. Decide your evidence bar before you launch: how much spend, how many days, and what counts as a win. Skip that step and 200 ads just gives you 200 inconclusive experiments.\u003c/p\u003e\n","kind":"html","rawMarkdown":"It makes and tests ads. Give it the latest customer language report, the approved claims from offers.md, real product footage and screenshots, and a folder of ads you love. Ask it for different reasons to buy, instead of fifty versions of the same headline: one ad that walks through a worked example, one that tells a customer story, one that's a raw demo of the product. Image models like Nano Banana and video models like Veo make the production almost free.\n\nName every ad with what it's testing, like BK014_dinner-angle_ugc_v2, so the campaign ID, the idea and the format live right in the name. A month later, \"the dinner angle beat the price angle\" is a lesson you can use everywhere. \"video_final_7 won\" is trivia.\n\nThe agent uploads ads through the Meta Ads API in a paused state, so a human hits go. Then a small script checks results every morning and pauses anything under 1% CTR after a set amount of spend. Decide your evidence bar before you launch: how much spend, how many days, and what counts as a win. Skip that step and 200 ads just gives you 200 inconclusive experiments.","sourceFormat":"markdown"},"note:sha256:d62e0dd58abacef78e60520e00a26f470a77c114c789aa339820d6a88bf9611d":{"html":"\u003cp\u003eIt launches each concept paused, a human hits go, a script pauses the losers after a set amount of spend, and every Monday the performance agent tells you which concepts won and which hooks to try next. Your job becomes picking ideas and judging taste, and the machine handles the volume.\u003c/p\u003e\n\u003cp\u003eThe marketing engineers winning on paid social right now are shipping dozens of truly different concepts a month, and they're doing it without a production team.\u003c/p\u003e\n","kind":"html","rawMarkdown":"It launches each concept paused, a human hits go, a script pauses the losers after a set amount of spend, and every Monday the performance agent tells you which concepts won and which hooks to try next. Your job becomes picking ideas and judging taste, and the machine handles the volume.\n\nThe marketing engineers winning on paid social right now are shipping dozens of truly different concepts a month, and they're doing it without a production team.","sourceFormat":"markdown"},"note:sha256:dcd853d2b9e7b5f5b2d49f5ad31513bd74eff8d20b6a97d32155a074d1e1222d":{"html":"\u003cp\u003eThe campaign gets an ID, BK014, and everything from here carries it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The campaign gets an ID, BK014, and everything from here carries it.","sourceFormat":"markdown"},"note:sha256:e0ea016006631633abe79812427d8e51e62326ec458f8a6d6c868a768cb0abcf":{"html":"\u003cp\u003eThe builder half is newer, and it's much easier to learn than people think. You need to write context that an agent can actually use, which is the most underrated skill on this whole list. You need to read code well enough to judge whether it does what you asked, because the agent writes it and you own it. You need to understand how APIs and MCP connect tools, write basic SQL to pull your own numbers, ship a page, use git, write test cases, and know roughly what each agent run costs you.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The builder half is newer, and it's much easier to learn than people think. You need to write context that an agent can actually use, which is the most underrated skill on this whole list. You need to read code well enough to judge whether it does what you asked, because the agent writes it and you own it. You need to understand how APIs and MCP connect tools, write basic SQL to pull your own numbers, ship a page, use git, write test cases, and know roughly what each agent run costs you.","sourceFormat":"markdown"},"note:sha256:e17219f24409cfc5f41a3513c632bf99235f5845a5175d7e26c5fc74068808e8":{"html":"\u003cp\u003eThen write each agent a short contract, like a job description with guardrails. Here's one for the buying trigger agent:\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCbFV0bsAAfDqN?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"Then write each agent a short contract, like a job description with guardrails. Here's one for the buying trigger agent:\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCbFV0bsAAfDqN?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:e512121f5bb0293bcce4096f6a24290424a169a89333a98ffa0c36d5c60b6222":{"html":"\u003cp\u003eIn the Mad Men era, from the 1950s through the 1990s, marketing meant print, TV, radio and billboards. The job was big ideas and big budgets. A campaign cost millions, took months to produce, and you found out whether it worked a quarter later if you were lucky. A great marketer got a handful of real shots a year, so the whole profession ran on taste, persuasion and gut feel.\u003c/p\u003e\n","kind":"html","rawMarkdown":"In the Mad Men era, from the 1950s through the 1990s, marketing meant print, TV, radio and billboards. The job was big ideas and big budgets. A campaign cost millions, took months to produce, and you found out whether it worked a quarter later if you were lucky. A great marketer got a handful of real shots a year, so the whole profession ran on taste, persuasion and gut feel.","sourceFormat":"markdown"},"note:sha256:e54acb0103da41927f7932294c0922b9e350d0cc99be7035b2c2ea1386062195":{"html":"\u003cp\u003eThe marketing engineer is what happens when the person with the idea and the person who can build it become the same person. One marketer researches the customer, builds the page, generates the creative, wires up the data and launches the test. The unit of work shifts from a campaign to a system that keeps producing campaigns, and dozens of experiments a day becomes realistic for one person.\u003c/p\u003e\n\u003cp\u003eZoom out and the whole history of marketing is one trend. The cost of an experiment keeps collapsing. Whoever runs the most good experiments learns the fastest, and whoever learns the fastest wins.\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT88kbzbgAAnWtT?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"The marketing engineer is what happens when the person with the idea and the person who can build it become the same person. One marketer researches the customer, builds the page, generates the creative, wires up the data and launches the test. The unit of work shifts from a campaign to a system that keeps producing campaigns, and dozens of experiments a day becomes realistic for one person.\n\nZoom out and the whole history of marketing is one trend. The cost of an experiment keeps collapsing. Whoever runs the most good experiments learns the fastest, and whoever learns the fastest wins.\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cim
