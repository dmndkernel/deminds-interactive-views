g src=\"https://pbs.twimg.com/media/HT88kbzbgAAnWtT?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:e86d5abe79dc182e412c5eb79adfecc6206f66ddc4601784f2038c3ba41a84f0":{"html":"\u003cp\u003eNext, give the brain eyes. Connect the places where customer truth lives: call recordings in Gong or Fathom, support tickets in Intercom or Zendesk, deals in HubSpot or Salesforce, behavior in PostHog or Google Analytics, and revenue in Stripe.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Next, give the brain eyes. Connect the places where customer truth lives: call recordings in Gong or Fathom, support tickets in Intercom or Zendesk, deals in HubSpot or Salesforce, behavior in PostHog or Google Analytics, and revenue in Stripe.","sourceFormat":"markdown"},"note:sha256:eb93512cfeb0142814e7c6abfacb8ce3211081a10925d24b62642bca60222d9a":{"html":"\u003cp\u003eThen Google launched AdWords in 2000 and Facebook launched ads in 2007, and suddenly every click could be counted. The digital marketer was born. The job turned into managing channels like SEO, paid search, email and display. Marketers lived inside dashboards, and the best were the people who understood the platforms most deeply. You could run a few experiments a month.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Then Google launched AdWords in 2000 and Facebook launched ads in 2007, and suddenly every click could be counted. The digital marketer was born. The job turned into managing channels like SEO, paid search, email and display. Marketers lived inside dashboards, and the best were the people who understood the platforms most deeply. You could run a few experiments a month.","sourceFormat":"markdown"},"note:sha256:f3406a18c86ee02dd1e1a17e19dc45e8e1eea367812cdc30c8a8dc94ce0aac46":{"html":"\u003cp\u003eIn the 2010s came the growth hacker, and I'll never forget it. Sean Ellis coined the term in 2010, and the decade's best tricks became folklore. Hotmail put \"P.S. I love you. Get your free email at Hotmail\" at the bottom of every message. Dropbox gave you and a friend free storage for every invite. Airbnb let hosts crosspost their listings to Craigslist. The growth hacker treated marketing like product, with funnels, loops and A/B tests. The catch was that every good idea needed an engineer, and engineers belonged to the product roadmap. Growth hackers spent half their lives writing tickets and waiting in line. A few experiments a week was a great week.\u003c/p\u003e\n","kind":"html","rawMarkdown":"In the 2010s came the growth hacker, and I'll never forget it. Sean Ellis coined the term in 2010, and the decade's best tricks became folklore. Hotmail put \"P.S. I love you. Get your free email at Hotmail\" at the bottom of every message. Dropbox gave you and a friend free storage for every invite. Airbnb let hosts crosspost their listings to Craigslist. The growth hacker treated marketing like product, with funnels, loops and A/B tests. The catch was that every good idea needed an engineer, and engineers belonged to the product roadmap. Growth hackers spent half their lives writing tickets and waiting in line. A few experiments a week was a great week.","sourceFormat":"markdown"},"note:sha256:f41338a5c5e282dbb10e1caa879c39c94ec7a518b7281001b742b88e3b112ef9":{"html":"\u003cp\u003eMy partner hasn't publicly talked about it much but \u003ca href=\"https://x.com/@BoringMarketer\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@BoringMarketer\u003c/a\u003e just launched \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e, which breaks down a real, live funnel every week, from the ad to the last email, and turns each step into a prompt you can hand to your coding agent. It's a much better starting point than a blank page.\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUChi1tboAAm1GF?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"My partner hasn't publicly talked about it much but [@BoringMarketer](https://x.com/@BoringMarketer) just launched [Boring Funnels](https://boringfunnels.com/), which breaks down a real, live funnel every week, from the ad to the last email, and turns each step into a prompt you can hand to your coding agent. It's a much better starting point than a blank page.\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUChi1tboAAm1GF?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:f598c3ece595be2fc8a4aa8f5af8876c9fe3d0bd010e6aadeae1828fbb3e7fa8":{"html":"\u003cp\u003eIt is the one that pays for everything else. Pull every lost deal from your CRM along with its notes and call transcripts. \"Not interested\" is a lazy summary of a real conversation, so have the agent reread each one and record the actual reason plus a reopen condition. \"Went with a competitor, contract renews in March.\" \"Needed SSO.\" \"Champion left the company.\"\u003c/p\u003e\n\u003cp\u003eThen it watches for those conditions. The day your changelog says SSO shipped, every prospect who asked for it gets a personal draft that quotes their original call. When the renewal date gets close, you show up. When the champion lands at a new company, you congratulate them and reintroduce yourself. Respect optouts and contact preferences, and you'll find most companies have a pile of unfinished revenue sitting in their own CRM.\u003c/p\u003e\n","kind":"html","rawMarkdown":"It is the one that pays for everything else. Pull every lost deal from your CRM along with its notes and call transcripts. \"Not interested\" is a lazy summary of a real conversation, so have the agent reread each one and record the actual reason plus a reopen condition. \"Went with a competitor, contract renews in March.\" \"Needed SSO.\" \"Champion left the company.\"\n\nThen it watches for those conditions. The day your changelog says SSO shipped, every prospect who asked for it gets a personal draft that quotes their original call. When the renewal date gets close, you show up. When the champion lands at a new company, you congratulate them and reintroduce yourself. Respect optouts and contact preferences, and you'll find most companies have a pile of unfinished revenue sitting in their own CRM.","sourceFormat":"markdown"},"note:sha256:f62eb1b309de5cdc8a3955c078f258c4c6ee71dbcb7c40d424ebaaf81cf3d153":{"html":"\u003cp\u003eIt reads your campaign table every Monday and writes you a short memo, the way a sharp analyst would. \"The profitability review page converted at 4%, and half those leads were too small to serve. The dinner ad has the lowest cost per qualified call. Retargeting has spent $3,000 and produced two sales conversations.\" Every line ends in a decision for you: keep, kill, change or test.\u003c/p\u003e\n\u003cp\u003eWire it all the way through to retention, refunds and profit. A campaign that brings in cheap customers who churn in sixty days looks amazing on a dashboard and quietly loses you money. This is the agent that catches it.\u003c/p\u003e\n","kind":"html","rawMarkdown":"It reads your campaign table every Monday and writes you a short memo, the way a sharp analyst would. \"The profitability review page converted at 4%, and half those leads were too small to serve. The dinner ad has the lowest cost per qualified call. Retargeting has spent $3,000 and produced two sales conversations.\" Every line ends in a decision for you: keep, kill, change or test.\n\nWire it all the way through to retention, refunds and profit. A campaign that brings in cheap customers who churn in sixty days looks amazing on a dashboard and quietly loses you money. This is the agent that catches it.","sourceFormat":"markdown"},"note:sha256:f6925c4ceb857968daa41d7f1957bd5494a9d4c75ea9ab20ad1aae0be21a3dc9":{"html":"\u003cp\u003eIt watches for moments that create demand overnight. A company opens a second location. A brand starts selling wholesale. A startup raises a round and posts five sales jobs. A tool you integrate with ships something new. The easiest way to build this is in Clay. Pull a list of accounts that match customer-fit.md, then add columns that check for each trigger, like new job postings, funding news, new locations or new pages on their website. Apollo is handy for the contact data.\u003c/p\u003e\n\u003cp\u003eFor every account with a fresh trigger, the agent checks the CRM to skip anyone your team is already talking to, then finishes one sentence: \"This event creates this problem, and our product solves it in this specific way.\" If the sentence comes out mushy, the account waits. If it comes out sharp, the agent drafts a short email that leads with the event and saves it as a draft for you to review. That one sentence filter is what makes outreach feel like good timing instead of spam.\u003c/p\u003e\n","kind":"html","rawMarkdown":"It watches for moments that create demand overnight. A company opens a second location. A brand starts selling wholesale. A startup raises a round and posts five sales jobs. A tool you integrate with ships something new. The easiest way to build this is in Clay. Pull a list of accounts that match customer-fit.md, then add columns that check for each trigger, like new job postings, funding news, new locations or new pages on their website. Apollo is handy for the contact data.\n\nFor every account with a fresh trigger, the agent checks the CRM to skip anyone your team is already talking to, then finishes one sentence: \"This event creates this problem, and our product solves it in this specific way.\" If the sentence comes out mushy, the account waits. If it comes out sharp, the agent drafts a short email that leads with the event and saves it as a draft for you to review. That one sentence filter is what makes outreach feel like good timing instead of spam.","sourceFormat":"markdown"},"note:sha256:f6aa8dfb7a7395a2f384c030fae3034831a1b50a3b4ba8ce942088c08eb9a2a7":{"html":"\u003cp\u003eThen read the report next to your own memory of those calls. The first version will be about 70% right. It'll probably overweight one chatty customer, or name the groups in marketing speak. Every time you spot a mistake, fix the instruction and save the fix in decisions/ so it sticks. After three or four rounds it'll read calls better than most people on your team.\u003c/p\u003e\n\u003cp\u003eHere's the kind of thing it finds. Say you sell scheduling software to plumbers and HVAC companies. The agent notices owners keep saying some version of \"I'm tired of taking calls during dinner.\" That one line is your ad, your headline and your sales opener. It beats \"automated scheduling\" every time, because people buy the situation more than the feature.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Then read the report next to your own memory of those calls. The first version will be about 70% right. It'll probably overweight one chatty customer, or name the groups in marketing speak. Every time you spot a mistake, fix the instruction and save the fix in decisions/ so it sticks. After three or four rounds it'll read calls better than most people on your team.\n\nHere's the kind of thing it finds. Say you sell scheduling software to plumbers and HVAC companies. The agent notices owners keep saying some version of \"I'm tired of taking calls during dinner.\" That one line is your ad, your headline and your sales opener. It beats \"automated scheduling\" every time, because people buy the situation more than the feature.","sourceFormat":"markdown"},"note:sha256:f7fe2cc1da452efdb60f33cf91746084078f5a77e7ffb1b6713fd32313332542":{"html":"\u003cp\u003eHere's what it looks like when all of it works together. Picture a bookkeeping firm that wants more ecommerce clients.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Here's what it looks like when all of it works together. Picture a bookkeeping firm that wants more ecommerce clients.","sourceFormat":"markdown"},"note:sha256:f95afb19be00c86b5b3ad912a48e3c603f5c75dffcb173ca4cfb396afe0fa642":{"html":"\u003cp\u003e\u003ccode\u003ebrand/founder-opinions.md\u003c/code\u003e is your unfair advantage. Every competitor has access to the same models. Only you have your founder's takes on the category, the customer and the competition. Spend two hours interviewing your founder, or yourself, and write down every strong opinion. \"Most agencies in our space overcharge for onboarding.\" \"Our best customers come from accountant referrals.\" Those opinions are what make the output sound like you.\u003c/p\u003e\n","kind":"html","rawMarkdown":"`brand/founder-opinions.md` is your unfair advantage. Every competitor has access to the same models. Only you have your founder's takes on the category, the customer and the competition. Spend two hours interviewing your founder, or yourself, and write down every strong opinion. \"Most agencies in our space overcharge for onboarding.\" \"Our best customers come from accountant referrals.\" Those opinions are what make the output sound like you.","sourceFormat":"markdown"},"note:sha256:fe61171e325a4f0a730dba9f1e80171759198ac54335e33de2ba4aa331747df8":{"html":"\u003cp\u003eThe marketer half is the stuff great marketers have always known. How to run a customer interview and hear the phrase that matters. How to position a product so the right people feel it was made for them. How to build an offer that's a real reason to buy, as opposed to a discount in a costume. How to write a headline that stops a scroll. How each channel decides who sees what. And enough statistics to know when a result is real and when it's a fluke.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The marketer half is the stuff great marketers have always known. How to run a customer interview and hear the phrase that matters. How to position a product so the right people feel it was made for them. How to build an offer that's a real reason to buy, as opposed to a discount in a costume. How to write a headline that stops a scroll. How each channel decides who sees what. And enough statistics to know when a result is real and when it's a fluke.","sourceFormat":"markdown"}},"sourceRevision":"sha256:2620751aeccd9b6473f3336d7ea75f36deef701d8aed697d1bc99ede51edd94c"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=e}}function i(e,t){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${e}": ${t}`)}function r(e){const t=String(e||"").normalize("NFC").trim().replace(/\\/g,"/");t||i(t,"empty"),t.includes("\0")&&i(t,"nul_byte"),t.startsWith("/")&&i(t,"absolute"),/^[A-Za-z]:/.test(t)&&i(t,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*:/.test(t)&&i(t,"url_scheme"),t.endsWith("/")&&i(t,"directory");const n=t.split("/");return n.some(e=>!e||"."===e||".."===e)&&i(t,"unsafe_segment"),n.join("/")}function o(e){if(null===e||"string"==typeof e||"boolean"==typeof e)return JSON.stringify(e);if("number"==typeof e){if(!Number.isFinite(e))throw new n("unsupported_json_value","Canonical JSON does not allow non-finite numbers.");return JSON.stringify(e)}if(Array.isArray(e))return`[${e.map(e=>o(e)).join(",")}]`;if("object"==typeof e)return`{${Object.keys(e).sort().map(t=>`${JSON.stringify(t)}:${o(e[t])}`).join(",")}}`;throw new n("unsupported_json_value",`Canonical JSON does not support ${typeof e}.`)}function a(e){return o(e)}async function s(e){const t=globalThis.crypto?.subtle;if(!t)throw new n("crypto_unavailable","SHA-256 req
