</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-10-08T12:22:06.491Z","language":"zh-CN","name":"DeMinds","version":"1.0.48"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"如何变得极度自驱","outlineVersion":1},"sourceRevision":"sha256:c5796a83ea88dd2dce63aa47b538367961ba89c162782fb14a8a4c2fb39e0b36","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"How to Become Dangerously Self-Motivated.md","sourceUrl":"https://x.com/stijnnoorman/status/2107795151699456358","title":"如何变得极度自驱"},"files":[{"byteLength":16600,"content":"# 如何变得极度自驱\n\n![图像](https://pbs.twimg.com/media/HTXNU4lWgAAax6l?format=jpg\u0026name=medium)\n\n\u003e @stijnnoorman · [X 文章](https://x.com/stijnnoorman/article/2107795151699456358) · 2026-10-07\n\n关于动力，你一直被灌输了一个错误观念。\n\n大多数人以为，动力要么有，要么没有。\n\n但动力并不是这样运作的。\n\n我经历过这样的阶段：可以工作一整天，甚至得强迫自己停下来；也经历过几乎完全提不起劲工作的阶段。我并没有突然变成另一个人。但把人生中这些时期放在一起比较后，我很清楚地发现，有几件事我做得不一样。\n\n我读过很多有关动力的神经科学和心理学内容，也在十多年“自我提升”的过程中试过大量习惯与策略。这让我意识到一件事：\n\n**动力是可以被设计出来的。**\n\n从第一性原理来看，动力本质上就是“想去做某件事”。有 5 个原则，可以帮助你把生活设计成一种状态：那些你*应该*做的事，逐渐变成你*想要*做的事。这篇文章就来拆解这 5 个原则。\n\n我会尽量写得简洁，但你还是得先说服自己花几分钟读下去，而不是继续刷屏。这不是一篇短文。如果现在不是合适的时间，可以先保存下来；它会把如何变得极度自驱这件事完整讲清楚。\n\n开始吧。\n\n## 1. 找到你的“为什么”\n\n\u003e 知道为什么而活的人，几乎可以忍受任何一种生活。 **– Friedrich Nietzsche**\n\n### 愿景先于动力\n\n我人生中动力最强的那些阶段，往往也是我最清楚自己想实现什么的时候。\n\n正如 Arnold Schwarzenegger 所说，愿景必须先出现，因为它会带来“想要的力量”（want power）。我们天生会倾向于保存能量，从这个角度看，懒惰也有其生存意义。要突破这种惯性，就需要一个足够清晰、足够值得你投入能量的愿景。\n\n换句话说，你需要一个目标。我知道，这听起来像最普通不过的建议，但它非常关键。没有目标，你就没有前进的方向。而动力很大一部分来自朝一个值得向往的目标靠近；没有目标，也就失去了这部分动力来源。\n\n### 用“天堂”和“地狱”定义 Why\n\n所以，你得先弄清楚自己真正想要什么。我建议各选一个：一个你真心想实现的未来，也就是你的“天堂”；以及一个你真心想避开的未来，也就是你的“地狱”。\n\n你的“天堂”在前面拉着你走，你的“地狱”在后面推着你走。\n\n两者结合，调动的是两种最强的驱动力：渴望与恐惧。\n\n![图像](https://pbs.twimg.com/media/HTXNrG0W4AAVt25?format=jpg\u0026name=medium)\n\n此时，你的“天堂”和“地狱”合在一起，就构成了你的 **Why（为什么）**。\n\n它会随着时间变化，这很正常。不要执着于一开始就把它定义得完美——它永远不会完美。先做到足够好，然后在行动中逐渐看清自己想要什么、不想要什么，再不断调整。\n\n### 把愿景拆成今天的行动\n\n当愿景足够清晰后，下一步是把它拆解到可以行动。\n\n从你的“天堂”倒推目标、里程碑和具体行动，直到你明确知道今天应该做什么。\n\n![图像](https://pbs.twimg.com/media/HTXNtN4XQAA-e_-?format=jpg\u0026name=medium)\n\n这样做会增强动力，因为它把每天的行动与你的长期愿景连接起来。每一个动作都变成朝理想未来迈出的一步。这可能促使大脑释放多巴胺，让你更有动力继续前进。\n\n### 让未来在感受上变得真实\n\n接下来还有一件事：让未来在感受上变得真实。\n\n在 *Psycho-Cybernetics* 一书中，Maxwell Maltz 认为，想象中的经历可以用与真实经历相似的方式影响我们。因为一次经历会带来思想、情绪和身体反应，而这些反应会逐渐改变一个人。\n\n视觉化想象可以在事情尚未真实发生时，先唤起其中一部分反应。关键在于，尽量去感受当你实现目标时会出现的那些情绪。\n\n不要只在理性层面“想一想”未来。闭上眼睛，想象自己已经身处其中：看见你会看见的，感受你会感受的。尽量让它清晰，并带有真实的情绪。\n\nJoe Dispenza 也强调过类似的想法：把对理想未来的清晰意图，与“如果未来已经实现，你会感受到的积极情绪”结合起来。\n\n重点不是靠想象神奇地把未来吸引过来，而是不停体验与那个未来相关的思想和情绪。人会受到经历以及经历所产生情绪的塑造。\n\n久而久之，这可能影响你的自我形象、预期和行为。你不再只是“想要”那个未来，而是在心理和情绪上排练：为了创造那个未来，你需要成为什么样的人。\n\n你不再让过去决定自己此刻怎么感受、怎么行动，而开始用想要的未来，反过来塑造现在的感受和行为。\n\n视觉化不会替你实现目标。但它可能改变你行动时所处的状态，而状态的变化又可能改变你最终采取的行动。\n\n关于愿景的部分就到这里，但它只是整个拼图中的一块。\n\n## 2. 把工作变成一场游戏\n\n\u003e 最美好的时刻，往往出现在一个人自愿投入某件困难而有价值的事情，并让身体或心智发挥到极限的时候。 **– Mihaly Csikszentmihalyi**\n\n### 动力并没有消失\n\n最近，我对那些总说自己“缺乏动力”的人有了一个看似反直觉的观察：\n\n**他们并不缺动力。**\n\n听起来有点奇怪，但我的意思是：很多抱怨自己没动力的人，并不是对所有事情都没有动力。他们可以连续打几个小时电子游戏。那同样需要投入大量精力，却常常让人觉得毫不费力。\n\n原因在于游戏的设计方式。电子游戏会利用一些内在驱动力，因此让行动本身变得近乎自然。\n\n### 把游戏机制带进工作\n\n游戏最常利用的内在动机包括：\n\n- **进展：** 你持续看见自己向前移动。\n- **精通：** 你通过练习不断变得更好。\n- **挑战：** 总有一个困难但可实现的下一步。\n- **自主：** 你可以选择做什么、怎么做。\n- **好奇：** 你想知道接下来会发生什么。\n- **胜任感：** 你不断获得“自己正在进步”的证据。\n- **反馈：** 行动会迅速产生清晰结果。\n- **成就：** 目标、等级、里程碑和胜利，让你始终有东西可以追逐。\n\n这些因素让游戏变得让人上瘾、也让人觉得好玩。所以关键在于：把同样的机制重新放进工作里，让工作本身更有吸引力。\n\n第一步是让进展变得可见。游戏不断向你展示分数、等级、连续记录和已完成任务。你的目标也可以这样设计。现实生活当然没有自动出现的经验条，但你可以追踪那些真正让你前进的行动，让自己看见进展。\n\n我做了一个 Habit Tracker 来帮助你做到这一点。它是 Purpose Planner 的一部分，[可以在这里免费获取](https://www.stijnnoorman.com/purpose-planner)。\n\n### 让挑战略高于当前能力\n\n你还需要找到合适的挑战难度。把它想成一场游戏。\n\n如果你是 50 级角色，却一直在打 5 级怪物，经验值几乎不会增长，你也会觉得无聊。反过来，如果你只有 5 级，却去挑战 50 级怪物，当前能力又不足以应对，就会变得压力过大。所以你需要选择一个略高于自己当前能力的挑战。\n\n根据 Steven Kotler 的说法，一个理想的挑战大约比当前能力高 4%。太容易会无聊，太难会不堪重负；当挑战只比现有能力略高时，人更容易全情投入，并进入心流状态。\n\n![图像](https://pbs.twimg.com/media/HTXNwJfWgAAP8ba?format=png\u0026name=medium)\n\n这种难度会拉伸你的能力，也更容易让你进入心流。\n\n### 建立可重复的游戏循环\n\n最后，为自己建立一个游戏循环：\n\n**目标 → 挑战 → 行动 → 反馈 → 进展 → 奖励 → 下一关**\n\n设定清晰目标，给自己一个挑战，采取行动，获得反馈，记录进展，在完成后给予奖励，然后把挑战稍微提高，再重复一遍。\n\n与其依赖动力去硬做一件无聊的事，不如把工作设计成一种你*愿意*继续玩下去的东西。当工作开始像游戏一样运转，它就更接近“玩”，你也更容易自然地产生继续做下去的动力。\n\n## 3. 痛苦与快乐原则\n\n\u003e 长期、反复暴露在愉悦刺激中，会降低我们对痛苦的耐受能力，同时提高体验快乐所需的阈值。 **– Dr. Anna Lembke**\n\n### 为什么重要的事会显得无聊\n\n提高动力的一种有效方式，是限制自己对即时满足型活动的消费。\n\n前面简单提到过多巴胺与动力的关系。当我们看到自己离目标更近时，会获得多巴胺相关的奖励感。但如果大脑长期暴露在高度刺激的奖励中，那么相比之下，那些普通、缓慢的奖励就会显得没那么有吸引力。\n\n![图像](https://pbs.twimg.com/media/HTXNyK2XoAATPT1?format=jpg\u0026name=medium)\n\n可以这样理解——下面这些数字并不科学，只是用来说明我的观点：\n\n朝目标迈进一步，也许相当于得到 10 个单位的多巴胺。这本身说不上多或少，关键取决于你从其他活动里得到多少刺激。刷 30 分钟信息流，也许像是 50 个单位；如果看色情内容、抽几支烟，或者喝掉六罐啤酒，也许就像 100 个单位。\n\n这样一来，对大脑而言，为目标努力似乎成了一笔不划算的交易：它消耗大量能量，带来的刺激却明显低于那些投入更少的活动。\n\n高多巴胺刺激会抬高你对“什么才够刺激”的标准。\n\n这也是为什么读一本书、去健身，或者真正推进自己的目标，会让人觉得困难。当大脑习惯了高刺激奖励后，刺激较低的活动相比之下就更容易显得无聊，也更难开始。\n\n### 降低对高刺激奖励的依赖\n\n所以，如果你想变得极度自驱，一件很有力量的事就是减少这些高刺激活动。当你这样做时，其他事情会在相对意义上变得更有趣，因为大脑对“有趣”和“刺激”的门槛会下降。\n\n### 用“痛苦与快乐”看长期回报\n\n我很喜欢 After Skool 用这张图表达这个关系：\n\n![图像](https://pbs.twimg.com/media/HTXN0D5WsAAIhF9?format=jpg\u0026name=medium)\n\n现在承受更多有意义的痛苦，往往会换来之后更多的快乐；现在追逐更多廉价、无意义的快乐，往往会带来之后更多的痛苦。\n\n同样，这并不是一个科学上完全精确的模型，但这不妨碍它成为一种有用的思考方式。\n\n一般来说，你减少的无意义快感越多，长期状态往往越好。你不必戒掉一切，但去掉得越多，通常会越容易感受到变化。这并不轻松，但也正因为如此，大多数人不会去做。如果你想得到超过 99% 的人的结果，就得愿意做 99% 的人不愿意做的事，而减少即时满足型活动就是其中之一。\n\n没人强迫你这么做。但如果你想变得极度自驱，这就是你需要面对的一部分：别把多巴胺浪费在廉价刺激上。学会和无聊相处，让真正重要的工作重新变得有回报。\n\n我觉得把多巴胺想成一种货币很有用：把它花掉，你现在得到快乐；把它投资出去，你以后得到动力。\n\n## 4. 让你的生理状态为你服务\n\n\u003e 保持身体健康是一种责任，否则我们就无法让心智保持强健与清明。 **– Buddha**\n\n### 先修好生理基础\n\n大多数时候，我的动力都很高。\n\n但只要睡眠不足，我的动力马上就会明显下降。身体和心智是相互关联的。糟糕的睡眠、缺乏运动和不健康的饮食，并不是靠意志就能完全抵消的。你可以是世界上最有动力的人，但如果只睡 3 个小时、饮食一团糟、喝酒又不运动，动力很快就会消退。\n\n所以，你必须先修好这些生理基础。这听起来既不酷，也不新鲜，但非常重要。\n\n### 最重要的基础习惯\n\n最重要的习惯包括：\n\n- 睡够 8 小时\n- 吃健康的食物\n- 几乎每天运动\n- 限制廉价多巴胺刺激\n- 冥想，并安排短暂休息\n- 不要坐太久，每天做拉伸\n\n当然还有其他事情，但这些是最重要的。我建议做一个习惯追踪表，因为它能清楚显示你什么时候没有做到自己本该做的事，从而更容易重新回到正轨。同样，[你可以在这里获取我的 Habit Tracker](https://www.stijnnoorman.com/purpose-planner)。\n\n### 在状态最好的时间做最重要的事\n\n同样重要的是，把最重要的工作安排在你状态最好的时间。每个人都有自己的睡眠时间型（sleep chronotype），也就是说，你天然会在一天中的某些时段更清醒、更高效。\n\n最重要的是，先找出最重要的事，再在你状态最好的时候完成它。如果那是凌晨 4 点，很好；如果是下午 1 点或晚上 10 点，也很好。关键是弄清楚那个时间，然后把事情做完。如果你既能做到这一点，又把前面的基础习惯处理好，你通常会更有动力，也能完成更多事情。\n\n## 5. 让开始工作变得更容易\n\n\u003e 环境是一只塑造人类行为的无形之手。 **– James Clear**\n\n### 用环境减少意志力消耗\n\n无论我们多么专注，动力和意志力依然有上限。它可以很高，但不可能无限。所以，还需要把那些可能消耗它的东西尽量移走。\n\n换句话说，我们要设计环境，让自己更容易完成原本打算做的事：给坏习惯增加阻力，让好习惯减少阻力。\n\n无论是物理环境还是数字环境，都是如此。\n\n干扰和诱惑越少，真正开始工作就越容易。\n\n### 一套对作者有效的环境设计\n\n有很多方法可以做到这一点。下面是对我有效的一整套做法：\n\n- 今天就规划好明天\n- 关闭所有通知\n- 上午尽量保持独处\n- 隐藏书签，并尽量减少打开的标签页\n- 使用升降桌切换姿势\n- 不要多任务处理，也不要频繁切换任务\n- 每个工作时段只聚焦一个最重要的行动步骤\n- 中午之前不碰手机、邮件或社交媒体\n- 深度工作期间保持空腹，并摄入咖啡因\n- 使用耳塞或降噪耳机\n- 保持桌面空旷，只留下电脑和水或咖啡\n- 以 90 分钟为一个工作区块，之后恢复 10 分钟\n- 把浅层任务集中到当天稍晚的一个时间段批量处理\n- 在精力峰值时完成最重要的工作（对我来说通常是早晨）\n- 通过固定大部分饮食、穿简单的衣服、自动化小决策等方式减少决策疲劳\n\n你不需要把这些全部照做。但采用得越多，通常就越容易专注；越容易专注，你浪费在错误事情上的动力也就越少。\n\n这就是如何变得极度自驱。它并不容易，所以大多数人不会这么做。但如果你真的能做到，就会远远超过竞争者。\n\n## 作者后记与资源\n\nStijn\n\n**PS：** 如果你还想看更多类似内容，[**可以订阅我的免费 Newsletter。**](https://www.stijnnoorman.com/subscribe)\n\n### 我能如何帮助你\n\n[**1. Thread Mastery。**](https://www.stijnnoorman.com/thread-mastery) 学习如何为 X 和 Threads 写出具有传播力的长帖。\n\n[**2. X Growth System。**](https://xgrowthsystem.com/) 学习如何通过写作在 X 和 Threads 上建立受众。\n\n---\n\n## ChatGPT 编辑附注 · `dmnd:editorial-insight:v1`\n\n这篇文章把“动力”从一种等待出现的感觉，重新理解为可以通过目标、反馈、刺激管理、生理状态和环境共同塑造的系统。\n\n### 关键要点\n\n- 清晰的长期愿景只有被拆成今天可执行的行动，才真正参与日常动力形成。\n- 游戏化的核心不是娱乐化，而是让进展、挑战、反馈、成就与下一步持续可见。\n- 原文把减少高刺激即时满足视为恢复低刺激任务吸引力的重要手段，同时明确其中的数字示例并非科学测量。\n- 睡眠、运动、饮食与工作时段构成动力的生理基础；环境设计则通过减少摩擦和诱惑降低对意志力的依赖。\n\n### 可借鉴的新思路\n\n- 与其反复要求自己“更有动力”，不如分别检查愿景、反馈、刺激、生理状态和环境这五个可设计变量。\n- 把重要工作做成“目标 → 挑战 → 行动 → 反馈 → 进展 → 奖励”的闭环，比单纯依赖意志更容易持续。\n\n---","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"80461a38d3dfa42116dc58332f776cb5b05a17a5cdf369a574cdab5aced3801d","type":"text/markdown"}],"kind":"demi ayload":{"fold":1,"lines":"25,26","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e与其反复要求自己“更有动力”，不如分别检查愿景、反馈、刺激、生理状态和环境这五个可设计变量。\u003c/span\u003e","payload":{"lines":"31,32","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e把重要工作做成“目标 → 挑战 → 行动 → 反馈 → 进展 → 奖励”的闭环，比单纯依赖意志更容易持续。\u003c/span\u003e","payload":{"lines":"32,33","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e可借鉴的新思路\u003c/span\u003e","payload":{"lines":"30,31","tag":"h3"}}],"content":"\u003cspan data-dmnd-editorial-insight=\"v1\" class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eChatGPT 编辑附注\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:822d46d4fd023955b906449d4ebf25a2f4c647957fb89b6bbf1b25fdef6d3664\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"24,25","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNU4lWgAAax6l?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e如何变得极度自驱\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"如何变得极度自驱\" data-note-id=\"note:sha256:abbf1bf344b07281f6f7a8a21ebdc8ccdc107f8f6d7ebdc352acc5c9cdab263e\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"如何变得极度自驱\"\u003e如何变得极度自驱\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNU4lWgAAax6l?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@stijnnoorman · \u003ca href=\"https://x.com/stijnnoorman/article/2107795151699456358\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-10-07\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e关于动力，你一直被灌输了一个错误观念。\u003c/p\u003e\n\u003cp\u003e大多数人以为，动力要么有，要么没有。\u003c/p\u003e\n\u003cp\u003e但动力并不是这样运作的。\u003c/p\u003e\n\u003cp\u003e我经历过这样的阶段：可以工作一整天，甚至得强迫自己停下来；也经历过几乎完全提不起劲工作的阶段。我并没有突然变成另一个人。但把人生中这些时期放在一起比较后，我很清楚地发现，有几件事我做得不一样。\u003c/p\u003e\n\u003cp\u003e我读过很多有关动力的神经科学和心理学内容，也在十多年“自我提升”的过程中试过大量习惯与策略。这让我意识到一件事：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e动力是可以被设计出来的。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从第一性原理来看，动力本质上就是“想去做某件事”。有 5 个原则，可以帮助你把生活设计成一种状态：那些你\u003cem\u003e应该\u003c/em\u003e做的事，逐渐变成你\u003cem\u003e想要\u003c/em\u003e做的事。这篇文章就来拆解这 5 个原则。\u003c/p\u003e\n\u003cp\u003e我会尽量写得简洁，但你还是得先说服自己花几分钟读下去，而不是继续刷屏。这不是一篇短文。如果现在不是合适的时间，可以先保存下来；它会把如何变得极度自驱这件事完整讲清楚。\u003c/p\u003e\n\u003cp\u003e开始吧。\u003c/p\u003e\n\u003ch2 id=\"1-找到你的为什么\"\u003e1. 找到你的“为什么”\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e知道为什么而活的人，几乎可以忍受任何一种生活。 \u003cstrong\u003e– Friedrich Nietzsche\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"愿景先于动力\"\u003e愿景先于动力\u003c/h3\u003e\n\u003cp\u003e我人生中动力最强的那些阶段，往往也是我最清楚自己想实现什么的时候。\u003c/p\u003e\n\u003cp\u003e正如 Arnold Schwarzenegger 所说，愿景必须先出现，因为它会带来“想要的力量”（want power）。我们天生会倾向于保存能量，从这个角度看，懒惰也有其生存意义。要突破这种惯性，就需要一个足够清晰、足够值得你投入能量的愿景。\u003c/p\u003e\n\u003cp\u003e换句话说，你需要一个目标。我知道，这听起来像最普通不过的建议，但它非常关键。没有目标，你就没有前进的方向。而动力很大一部分来自朝一个值得向往的目标靠近；没有目标，也就失去了这部分动力来源。\u003c/p\u003e\n\u003ch3 id=\"用天堂和地狱定义-why\"\u003e用“天堂”和“地狱”定义 Why\u003c/h3\u003e\n\u003cp\u003e所以，你得先弄清楚自己真正想要什么。我建议各选一个：一个你真心想实现的未来，也就是你的“天堂”；以及一个你真心想避开的未来，也就是你的“地狱”。\u003c/p\u003e\n\u003cp\u003e你的“天堂”在前面拉着你走，你的“地狱”在后面推着你走。\u003c/p\u003e\n\u003cp\u003e两者结合，调动的是两种最强的驱动力：渴望与恐惧。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNrG0W4AAVt25?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e此时，你的“天堂”和“地狱”合在一起，就构成了你的 \u003cstrong\u003eWhy（为什么）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e它会随着时间变化，这很正常。不要执着于一开始就把它定义得完美——它永远不会完美。先做到足够好，然后在行动中逐渐看清自己想要什么、不想要什么，再不断调整。\u003c/p\u003e\n\u003ch3 id=\"把愿景拆成今天的行动\"\u003e把愿景拆成今天的行动\u003c/h3\u003e\n\u003cp\u003e当愿景足够清晰后，下一步是把它拆解到可以行动。\u003c/p\u003e\n\u003cp\u003e从你的“天堂”倒推目标、里程碑和具体行动，直到你明确知道今天应该做什么。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNtN4XQAA-e_-?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e这样做会增强动力，因为它把每天的行动与你的长期愿景连接起来。每一个动作都变成朝理想未来迈出的一步。这可能促使大脑释放多巴胺，让你更有动力继续前进。\u003c/p\u003e\n\u003ch3 id=\"让未来在感受上变得真实\"\u003e让未来在感受上变得真实\u003c/h3\u003e\n\u003cp\u003e接下来还有一件事：让未来在感受上变得真实。\u003c/p\u003e\n\u003cp\u003e在 \u003cem\u003ePsycho-Cybernetics\u003c/em\u003e 一书中，Maxwell Maltz 认为，想象中的经历可以用与真实经历相似的方式影响我们。因为一次经历会带来思想、情绪和身体反应，而这些反应会逐渐改变一个人。\u003c/p\u003e\n\u003cp\u003e视觉化想象可以在事情尚未真实发生时，先唤起其中一部分反应。关键在于，尽量去感受当你实现目标时会出现的那些情绪。\u003c/p\u003e\n\u003cp\u003e不要只在理性层面“想一想”未来。闭上眼睛，想象自己已经身处其中：看见你会看见的，感受你会感受的。尽量让它清晰，并带有真实的情绪。\u003c/p\u003e\n\u003cp\u003eJoe Dispenza 也强调过类似的想法：把对理想未来的清晰意图，与“如果未来已经实现，你会感受到的积极情绪”结合起来。\u003c/p\u003e\n\u003cp\u003e重点不是靠想象神奇地把未来吸引过来，而是不停体验与那个未来相关的思想和情绪。人会受到经历以及经历所产生情绪的塑造。\u003c/p\u003e\n\u003cp\u003e久而久之，这可能影响你的自我形象、预期和行为。你不再只是“想要”那个未来，而是在心理和情绪上排练：为了创造那个未来，你需要成为什么样的人。\u003c/p\u003e\n\u003cp\u003e你不再让过去决定自己此刻怎么感受、怎么行动，而开始用想要的未来，反过来塑造现在的感受和行为。\u003c/p\u003e\n\u003cp\u003e视觉化不会替你实现目标。但它可能改变你行动时所处的状态，而状态的变化又可能改变你最终采取的行动。\u003c/p\u003e\n\u003cp\u003e关于愿景的部分就到这里，但它只是整个拼图中的一块。\u003c/p\u003e\n\u003ch2 id=\"2-把工作变成一场游戏\"\u003e2. 把工作变成一场游戏\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e最美好的时刻，往往出现在一个人自愿投入某件困难而有价值的事情，并让身体或心智发挥到极限的时候。 \u003cstrong\u003e– Mihaly Csikszentmihalyi\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"动力并没有消失\"\u003e动力并没有消失\u003c/h3\u003e\n\u003cp\u003e最近，我对那些总说自己“缺乏动力”的人有了一个看似反直觉的观察：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e他们并不缺动力。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e听起来有点奇怪，但我的意思是：很多抱怨自己没动力的人，并不是对所有事情都没有动力。他们可以连续打几个小时电子游戏。那同样需要投入大量精力，却常常让人觉得毫不费力。\u003c/p\u003e\n\u003cp\u003e原因在于游戏的设计方式。电子游戏会利用一些内在驱动力，因此让行动本身变得近乎自然。\u003c/p\u003e\n\u003ch3 id=\"把游戏机制带进工作\"\u003e把游戏机制带进工作\u003c/h3\u003e\n\u003cp\u003e游戏最常利用的内在动机包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e进展：\u003c/strong\u003e 你持续看见自己向前移动。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e精通：\u003c/strong\u003e 你通过练习不断变得更好。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e挑战：\u003c/strong\u003e 总有一个困难但可实现的下一步。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e自主：\u003c/strong\u003e 你可以选择做什么、怎么做。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e好奇：\u003c/strong\u003e 你想知道接下来会发生什么。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e胜任感：\u003c/strong\u003e 你不断获得“自己正在进步”的证据。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e反馈：\u003c/strong\u003e 行动会迅速产生清晰结果。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e成就：\u003c/strong\u003e 目标、等级、里程碑和胜利，让你始终有东西可以追逐。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e这些因素让游戏变得让人上瘾、也让人觉得好玩。所以关键在于：把同样的机制重新放进工作里，让工作本身更有吸引力。\u003c/p\u003e\n\u003cp\u003e第一步是让进展变得可见。游戏不断向你展示分数、等级、连续记录和已完成任务。你的目标也可以这样设计。现实生活当然没有自动出现的经验条，但你可以追踪那些真正让你前进的行动，让自己看见进展。\u003c/p\u003e\n\u003cp\u003e我做了一个 Habit Tracker 来帮助你做到这一点。它是 Purpose Planner 的一部分，\u003ca href=\"https://www.stijnnoorman.com/purpose-planner\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e可以在这里免费获取\u003c/a\u003e。\u003c/p\u003e\n\u003ch3 id=\"让挑战略高于当前能力\"\u003e让挑战略高于当前能力\u003c/h3\u003e\n\u003cp\u003e你还需要找到合适的挑战难度。把它想成一场游戏。\u003c/p\u003e\n\u003cp\u003e如果你是 50 级角色，却一直在打 5 级怪物，经验值几乎不会增长，你也会觉得无聊。反过来，如果你只有 5 级，却去挑战 50 级怪物，当前能力又不足以应对，就会变得压力过大。所以你需要选择一个略高于自己当前能力的挑战。\u003c/p\u003e\n\u003cp\u003e根据 Steven Kotler 的说法，一个理想的挑战大约比当前能力高 4%。太容易会无聊，太难会不堪重负；当挑战只比现有能力略高时，人更容易全情投入，并进入心流状态。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNwJfWgAAP8ba?format=png\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e这种难度会拉伸你的能力，也更容易让你进入心流。\u003c/p\u003e\n\u003ch3 id=\"建立可重复的游戏循环\"\u003e建立可重复的游戏循环\u003c/h3\u003e\n\u003cp\u003e最后，为自己建立一个游戏循环：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e目标 → 挑战 → 行动 → 反馈 → 进展 → 奖励 → 下一关\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e设定清晰目标，给自己一个挑战，采取行动，获得反馈，记录进展，在完成后给予奖励，然后把挑战稍微提高，再重复一遍。\u003c/p\u003e\n\u003cp\u003e与其依赖动力去硬做一件无聊的事，不如把工作设计成一种你\u003cem\u003e愿意\u003c/em\u003e继续玩下去的东西。当工作开始像游戏一样运转，它就更接近“玩”，你也更容易自然地产生继续做下去的动力。\u003c/p\u003e\n\u003ch2 id=\"3-痛苦与快乐原则\"\u003e3. 痛苦与快乐原则\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e长期、反复暴露在愉悦刺激中，会降低我们对痛苦的耐受能力，同时提高体验快乐所需的阈值。 \u003cstrong\u003e– Dr. Anna Lembke\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"为什么重要的事会显得无聊\"\u003e为什么重要的事会显得无聊\u003c/h3\u003e\n\u003cp\u003e提高动力的一种有效方式，是限制自己对即时满足型活动的消费。\u003c/p\u003e\n\u003cp\u003e前面简单提到过多巴胺与动力的关系。当我们看到自己离目标更近时，会获得多巴胺相关的奖励感。但如果大脑长期暴露在高度刺激的奖励中，那么相比之下，那些普通、缓慢的奖励就会显得没那么有吸引力。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNyK2XoAATPT1?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e可以这样理解——下面这些数字并不科学，只是用来说明我的观点：\u003c/p\u003e\n\u003cp\u003e朝目标迈进一步，也许相当于得到 10 个单位的多巴胺。这本身说不上多或少，关键取决于你从其他活动里得到多少刺激。刷 30 分钟信息流，也许像是 50 个单位；如果看色情内容、抽几支烟，或者喝掉六罐啤酒，也许就像 100 个单位。\u003c/p\u003e\n\u003cp\u003e这样一来，对大脑而言，为目标努力似乎成了一笔不划算的交易：它消耗大量能量，带来的刺激却明显低于那些投入更少的活动。\u003c/p\u003e\n\u003cp\u003e高多巴胺刺激会抬高你对“什么才够刺激”的标准。\u003c/p\u003e\n\u003cp\u003e这也是为什么读一本书、去健身，或者真正推进自己的目标，会让人觉得困难。当大脑习惯了高刺激奖励后，刺激较低的活动相比之下就更容易显得无聊，也更难开始。\u003c/p\u003e\n\u003ch3 id=\"降低对高刺激奖励的依赖\"\u003e降低对高刺激奖励的依赖\u003c/h3\u003e\n\u003cp\u003e所以，如果你想变得极度自驱，一件很有力量的事就是减少这些高刺激活动。当你这样做时，其他事情会在相对意义上变得更有趣，因为大脑对“有趣”和“刺激”的门槛会下降。\u003c/p\u003e\n\u003ch3 id=\"用痛苦与快乐看长期回报\"\u003e用“痛苦与快乐”看长期回报\u003c/h3\u003e\n\u003cp\u003e我很喜欢 After Skool 用这张图表达这个关系：\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXN0D5WsAAIhF9?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e现在承受更多有意义的痛苦，往往会换来之后更多的快乐；现在追逐更多廉价、无意义的快乐，往往会带来之后更多的痛苦。\u003c/p\u003e\n\u003cp\u003e同样，这并不是一个科学上完全精确的模型，但这不妨碍它成为一种有用的思考方式。\u003c/p\u003e\n\u003cp\u003e一般来说，你减少的无意义快感越多，长期状态往往越好。你不必戒掉一切，但去掉得越多，通常会越容易感受到变化。这并不轻松，但也正因为如此，大多数人不会去做。如果你想得到超过 99% 的人的结果，就得愿意做 99% 的人不愿意做的事，而减少即时满足型活动就是其中之一。\u003c/p\u003e\n\u003cp\u003e没人强迫你这么做。但如果你想变得极度自驱，这就是你需要面对的一部分：别把多巴胺浪费在廉价刺激上。学会和无聊相处，让真正重要的工作重新变得有回报。\u003c/p\u003e\n\u003cp\u003e我觉得把多巴胺想成一种货币很有用：把它花掉，你现在得到快乐；把它投资出去，你以后得到动力。\u003c/p\u003e\n\u003ch2 id=\"4-让你的生理状态为你服务\"\u003e4. 让你的生理状态为你服务\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e保持身体健康是一种责任，否则我们就无法让心智保持强健与清明。 \u003cstrong\u003e– Buddha\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"先修好生理基础\"\u003e先修好生理基础\u003c/h3\u003e\n\u003cp\u003e大多数时候，我的动力都很高。\u003c/p\u003e\n\u003cp\u003e但只要睡眠不足，我的动力马上就会明显下降。身体和心智是相互关联的。糟糕的睡眠、缺乏运动和不健康的饮食，并不是靠意志就能完全抵消的。你可以是世界上最有动力的人，但如果只睡 3 个小时、饮食一团糟、喝酒又不运动，动力很快就会消退。\u003c/p\u003e\n\u003cp\u003e所以，你必须先修好这些生理基础。这听起来既不酷，也不新鲜，但非常重要。\u003c/p\u003e\n\u003ch3 id=\"最重要的基础习惯\"\u003e最重要的基础习惯\u003c/h3\u003e\n\u003cp\u003e最重要的习惯包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e睡够 8 小时\u003c/li\u003e\n\u003cli\u003e吃健康的食物\u003c/li\u003e\n\u003cli\u003e几乎每天运动\u003c/li\u003e\n\u003cli\u003e限制廉价多巴胺刺激\u003c/li\u003e\n\u003cli\u003e冥想，并安排短暂休息\u003c/li\u003e\n\u003cli\u003e不要坐太久，每天做拉伸\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e当然还有其他事情，但这些是最重要的。我建议做一个习惯追踪表，因为它能清楚显示你什么时候没有做到自己本该做的事，从而更容易重新回到正轨。同样，\u003ca href=\"https://www.stijnnoorman.com/purpose-planner\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e你可以在这里获取我的 Habit Tracker\u003c/a\u003e。\u003c/p\u003e\n\u003ch3 id=\"在状态最好的时间做最重要的事\"\u003e在状态最好的时间做最重要的事\u003c/h3\u003e\n\u003cp\u003e同样重要的是，把最重要的工作安排在你状态最好的时间。每个人都有自己的睡眠时间型（sleep chronotype），也就是说，你天然会在一天中的某些时段更清醒、更高效。\u003c/p\u003e\n\u003cp\u003e最重要的是，先找出最重要的事，再在你状态最好的时候完成它。如果那是凌晨 4 点，很好；如果是下午 1 点或晚上 10 点，也很好。关键是弄清楚那个时间，然后把事情做完。如果你既能做到这一点，又把前面的基础习惯处理好，你通常会更有动力，也能完成更多事情。\u003c/p\u003e\n\u003ch2 id=\"5-让开始工作变得更容易\"\u003e5. 让开始工作变得更容易\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e环境是一只塑造人类行为的无形之手。 \u003cstrong\u003e– James Clear\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"用环境减少意志力消耗\"\u003e用环境减少意志力消耗\u003c/h3\u003e\n\u003cp\u003e无论我们多么专注，动力和意志力依然有上限。它可以很高，但不可能无限。所以，还需要把那些可能消耗它的东西尽量移走。\u003c/p\u003e\n\u003cp\u003e换句话说，我们要设计环境，让自己更容易完成原本打算做的事：给坏习惯增加阻力，让好习惯减少阻力。\u003c/p\u003e\n\u003cp\u003e无论是物理环境还是数字环境，都是如此。\u003c/p\u003e\n\u003cp\u003e干扰和诱惑越少，真正开始工作就越容易。\u003c/p\u003e\n\u003ch3 id=\"一套对作者有效的环境设计\"\u003e一套对作者有效的环境设计\u003c/h3\u003e\n\u003cp\u003e有很多方法可以做到这一点。下面是对我有效的一整套做法：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e今天就规划好明天\u003c/li\u003e\n\u003cli\u003e关闭所有通知\u003c/li\u003e\n\u003cli\u003e上午尽量保持独处\u003c/li\u003e\n\u003cli\u003e隐藏书签，并尽量减少打开的标签页\u003c/li\u003e\n\u003cli\u003e使用升降桌切换姿势\u003c/li\u003e\n\u003cli\u003e不要多任务处理，也不要频繁切换任务\u003c/li\u003e\n\u003cli\u003e每个工作时段只聚焦一个最重要的行动步骤\u003c/li\u003e\n\u003cli\u003e中午之前不碰手机、邮件或社交媒体\u003c/li\u003e\n\u003cli\u003e深度工作期间保持空腹，并摄入咖啡因\u003c/li\u003e\n\u003cli\u003e使用耳塞或降噪耳机\u003c/li\u003e\n\u003cli\u003e保持桌面空旷，只留下电脑和水或咖啡\u003c/li\u003e\n\u003cli\u003e以 90 分钟为一个工作区块，之后恢复 10 分钟\u003c/li\u003e\n\u003cli\u003e把浅层任务集中到当天稍晚的一个时间段批量处理\u003c/li\u003e\n\u003cli\u003e在精力峰值时完成最重要的工作（对我来说通常是早晨）\u003c/li\u003e\n\u003cli\u003e通过固定大部分饮食、穿简单的衣服、自动化小决策等方式减少决策疲劳\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e你不需要把这些全部照做。但采用得越多，通常就越容易专注；越容易专注，你浪费在错误事情上的动力也就越少。\u003c/p\u003e\n\u003cp\u003e这就是如何变得极度自驱。它并不容易，所以大多数人不会这么做。但如果你真的能做到，就会远远超过竞争者。\u003c/p\u003e\n\u003ch2 id=\"作者后记与资源\"\u003e作者后记与资源\u003c/h2\u003e\n\u003cp\u003eStijn\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePS：\u003c/strong\u003e 如果你还想看更多类似内容，\u003ca href=\"https://www.stijnnoorman.com/subscribe\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003e可以订阅我的免费 Newsletter。\u003c/strong\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"我能如何帮助你\"\u003e我能如何帮助你\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.stijnnoorman.com/thread-mastery\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003e1. Thread Mastery。\u003c/strong\u003e\u003c/a\u003e 学习如何为 X 和 Threads 写出具有传播力的长帖。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://xgrowthsystem.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003e2. X Growth System。\u003c/strong\u003e\u003c/a\u003e 学习如何通过写作在 X 和 Threads 上建立受众。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"chatgpt-编辑附注-dmndeditorial-insightv1\" class=\"dmnd-editorial-block dmnd-editorial-start\"\u003eChatGPT 编辑附注\u003c/h2\u003e\n\u003cp class=\"dmnd-editorial-block\"\u003e这篇文章把“动力”从一种等待出现的感觉，重新理解为可以通过目标、反馈、刺激管理、生理状态和环境共同塑造的系统。\u003c/p\u003e\n\u003ch3 id=\"关键要点\" class=\"dmnd-editorial-block\"\u003e关键要点\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e清晰的长期愿景只有被拆成今天可执行的行动，才真正参与日常动力形成。\u003c/li\u003e\n\u003cli\u003e游戏化的核心不是娱乐化，而是让进展、挑战、反馈、成就与下一步持续可见。\u003c/li\u003e\n\u003cli\u003e原文把减少高刺激即时满足视为恢复低刺激任务吸引力的重要手段，同时明确其中的数字示例并非科学测量。\u003c/li\u003e\n\u003cli\u003e睡眠、运动、饮食与工作时段构成动力的生理基础；环境设计则通过减少摩擦和诱惑降低对意志力的依赖。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"可借鉴的新思路\" class=\"dmnd-editorial-block\"\u003e可借鉴的新思路\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e与其反复要求自己“更有动力”，不如分别检查愿景、反馈、刺激、生理状态和环境这五个可设计变量。\u003c/li\u003e\n\u003cli\u003e把重要工作做成“目标 → 挑战 → 行动 → 反馈 → 进展 → 奖励”的闭环，比单纯依赖意志更容易持续。\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr class=\"dmnd-editorial-block dmnd-editorial-end\"\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:03dbacb1455217e19090e9eb3a4ce1b625bc864a4368a8806644979e82b0b50d":{"html":"\u003cp\u003e接下来还有一件事：让未来在感受上变得真实。\u003c/p\u003e\n\u003cp\u003e在 \u003cem\u003ePsycho-Cybernetics\u003c/em\u003e 一书中，Maxwell Maltz 认为，想象中的经历可以用与真实经历相似的方式影响我们。因为一次经历会带来思想、情绪和身体反应，而这些反应会逐渐改变一个人。\u003c/p\u003e\n\u003cp\u003e视觉化想象可以在事情尚未真实发生时，先唤起其中一部分反应。关键在于，尽量去感受当你实现目标时会出现的那些情绪。\u003c/p\u003e\n\u003cp\u003e不要只在理性层面“想一想”未来。闭上眼睛，想象自己已经身处其中：看见你会看见的，感受你会感受的。尽量让它清晰，并带有真实的情绪。\u003c/p\u003e\n\u003cp\u003eJoe Dispenza 也强调过类似的想法：把对理想未来的清晰意图，与“如果未来已经实现，你会感受到的积极情绪”结合起来。\u003c/p\u003e\n\u003cp\u003e重点不是靠想象神奇地把未来吸引过来，而是不停体验与那个未来相关的思想和情绪。人会受到经历以及经历所产生情绪的塑造。\u003c/p\u003e\n\u003cp\u003e久而久之，这可能影响你的自我形象、预期和行为。你不再只是“想要”那个未来，而是在心理和情绪上排练：为了创造那个未来，你需要成为什么样的人。\u003c/p\u003e\n\u003cp\u003e你不再让过去决定自己此刻怎么感受、怎么行动，而开始用想要的未来，反过来塑造现在的感受和行为。\u003c/p\u003e\n\u003cp\u003e视觉化不会替你实现目标。但它可能改变你行动时所处的状态，而状态的变化又可能改变你最终采取的行动。\u003c/p\u003e\n\u003cp\u003e关于愿景的部分就到这里，但它只是整个拼图中的一块。\u003c/p\u003e\n","kind":"html","rawMarkdown":"接下来还有一件事：让未来在感受上变得真实。\n\n在 *Psycho-Cybernetics* 一书中，Maxwell Maltz 认为，想象中的经历可以用与真实经历相似的方式影响我们。因为一次经历会带来思想、情绪和身体反应，而这些反应会逐渐改变一个人。\n\n视觉化想象可以在事情尚未真实发生时，先唤起其中一部分反应。关键在于，尽量去感受当你实现目标时会出现的那些情绪。\n\n不要只在理性层面“想一想”未来。闭上眼睛，想象自己已经身处其中：看见你会看见的，感受你会感受的。尽量让它清晰，并带有真实的情绪。\n\nJoe Dispenza 也强调过类似的想法：把对理想未来的清晰意图，与“如果未来已经实现，你会感受到的积极情绪”结合起来。\n\n重点不是靠想象神奇地把未来吸引过来，而是不停体验与那个未来相关的思想和情绪。人会受到经历以及经历所产生情绪的塑造。\n\n久而久之，这可能影响你的自我形象、预期和行为。你不再只是“想要”那个未来，而是在心理和情绪上排练：为了创造那个未来，你需要成为什么样的人。\n\n你不再让过去决定自己此刻怎么感受、怎么行动，而开始用想要的未来，反过来塑造现在的感受和行为。\n\n视觉化不会替你实现目标。但它可能改变你行动时所处的状态，而状态的变化又可能改变你最终采取的行动。\n\n关于愿景的部分就到这里，但它只是整个拼图中的一块。","sourceFormat":"markdown"},"note:sha256:191287b42a5e2ab1e27874d72dfc793c9091a5d0439d6ebaaa7e07afd444f6cb":{"html":"\u003cp\u003e我人生中动力最强的那些阶段，往往也是我最清楚自己想实现什么的时候。\u003c/p\u003e\n\u003cp\u003e正如 Arnold Schwarzenegger 所说，愿景必须先出现，因为它会带来“想要的力量”（want power）。我们天生会倾向于保存能量，从这个角度看，懒惰也有其生存意义。要突破这种惯性，就需要一个足够清晰、足够值得你投入能量的愿景。\u003c/p\u003e\n\u003cp\u003e换句话说，你需要一个目标。我知道，这听起来像最普通不过的建议，但它非常关键。没有目标，你就没有前进的方向。而动力很大一部分来自朝一个值得向往的目标靠近；没有目标，也就失去了这部分动力来源。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我人生中动力最强的那些阶段，往往也是我最清楚自己想实现什么的时候。\n\n正如 Arnold Schwarzenegger 所说，愿景必须先出现，因为它会带来“想要的力量”（want power）。我们天生会倾向于保存能量，从这个角度看，懒惰也有其生存意义。要突破这种惯性，就需要一个足够清晰、足够值得你投入能量的愿景。\n\n换句话说，你需要一个目标。我知道，这听起来像最普通不过的建议，但它非常关键。没有目标，你就没有前进的方向。而动力很大一部分来自朝一个值得向往的目标靠近；没有目标，也就失去了这部分动力来源。","sourceFormat":"markdown"},"note:sha256:2938d675d1a5d5072e773d0e2ff6e92f9e7d1744e4d5a2e5ccf5c8d3382f5f08":{"html":"\u003cp\u003e大多数时候，我的动力都很高。\u003c/p\u003e\n\u003cp\u003e但只要睡眠不足，我的动力马上就会明显下降。身体和心智是相互关联的。糟糕的睡眠、缺乏运动和不健康的饮食，并不是靠意志就能完全抵消的。你可以是世界上最有动力的人，但如果只睡 3 个小时、饮食一团糟、喝酒又不运动，动力很快就会消退。\u003c/p\u003e\n\u003cp\u003e所以，你必须先修好这些生理基础。这听起来既不酷，也不新鲜，但非常重要。\u003c/p\u003e\n","kind":"html","rawMarkdown":"大多数时候，我的动力都很高。\n\n但只要睡眠不足，我的动力马上就会明显下降。身体和心智是相互关联的。糟糕的睡眠、缺乏运动和不健康的饮食，并不是靠意志就能完全抵消的。你可以是世界上最有动力的人，但如果只睡 3 个小时、饮食一团糟、喝酒又不运动，动力很快就会消退。\n\n所以，你必须先修好这些生理基础。这听起来既不酷，也不新鲜，但非常重要。","sourceFormat":"markdown"},"note:sha256:2da351ce3c479d68b9613b7c2f855f06361b0b27281b3d312b032f020be2e753":{"html":"\u003cblockquote\u003e\n\u003cp\u003e知道为什么而活的人，几乎可以忍受任何一种生活。 \u003cstrong\u003e– Friedrich Nietzsche\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e 知道为什么而活的人，几乎可以忍受任何一种生活。 **– Friedrich Nietzsche**","sourceFormat":"markdown"},"note:sha256:2e14ad40fdf08ba9acb4ef90ae6466252529f40573ec2e3ae2930513a4f9c1a5":{"blocks":[{"children":[{"title":"**进展：** 你持续看见自己向前移动。"},{"title":"**精通：** 你通过练习不断变得更好。"},{"title":"**挑战：** 总有一个困难但可实现的下一步。"},{"title":"**自主：** 你可以选择做什么、怎么做。"},{"title":"**好奇：** 你想知道接下来会发生什么。"},{"title":"**胜任感：** 你不断获得“自己正在进步”的证据。"},{"title":"**反馈：** 行动会迅速产生清晰结果。"},{"title":"**成就：** 目标、等级、里程碑和胜利，让你始终有东西可以追逐。"}],"kind":"section","title":"游戏最常利用的内在动机包括"},{"children":[],"kind":"leaf","title":"这些因素让游戏变得让人上瘾、也让人觉得好玩。所以关键在于：把同样的机制重新放进工作里，让工作本身更有吸引力。"},{"children":[],"kind":"leaf","title":"第一步是让进展变得可见。游戏不断向你展示分数、等级、连续记录和已完成任务。你的目标也可以这样设计。现实生活当然没有自动出现的经验条，但你可以追踪那些真正让你前进的行动，让自己看见进展。"},{"children":[],"kind":"leaf","title":"我做了一个 Habit Tracker 来帮助你做到这一点。它是 Purpose Planner 的一部分，可以在这里免费获取。"}],"html":"\u003cp\u003e游戏最常利用的内在动机包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e进展：\u003c/strong\u003e 你持续看见自己向前移动。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e精通：\u003c/strong\u003e 你通过练习不断变得更好。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e挑战：\u003c/strong\u003e 总有一个困难但可实现的下一步。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e自主：\u003c/strong\u003e 你可以选择做什么、怎么做。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e好奇：\u003c/strong\u003e 你想知道接下来会发生什么。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e胜任感：\u003c/strong\u003e 你不断获得“自己正在进步”的证据。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e反馈：\u003c/strong\u003e 行动会迅速产生清晰结果。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e成就：\u003c/strong\u003e 目标、等级、里程碑和胜利，让你始终有东西可以追逐。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e这些因素让游戏变得让人上瘾、也让人觉得好玩。所以关键在于：把同样的机制重新放进工作里，让工作本身更有吸引力。\u003c/p\u003e\n\u003cp\u003e第一步是让进展变得可见。游戏不断向你展示分数、等级、连续记录和已完成任务。你的目标也可以这样设计。现实生活当然没有自动出现的经验条，但你可以追踪那些真正让你前进的行动，让自己看见进展。\u003c/p\u003e\n\u003cp\u003e我做了一个 Habit Tracker 来帮助你做到这一点。它是 Purpose Planner 的一部分，\u003ca href=\"https://www.stijnnoorman.com/purpose-planner\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e可以在这里免费获取\u003c/a\u003e。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"游戏最常利用的内在动机包括：\n\n- **进展：** 你持续看见自己向前移动。\n- **精通：** 你通过练习不断变得更好。\n- **挑战：** 总有一个困难但可实现的下一步。\n- **自主：** 你可以选择做什么、怎么做。\n- **好奇：** 你想知道接下来会发生什么。\n- **胜任感：** 你不断获得“自己正在进步”的证据。\n- **反馈：** 行动会迅速产生清晰结果。\n- **成就：** 目标、等级、里程碑和胜利，让你始终有东西可以追逐。\n\n这些因素让游戏变得让人上瘾、也让人觉得好玩。所以关键在于：把同样的机制重新放进工作里，让工作本身更有吸引力。\n\n第一步是让进展变得可见。游戏不断向你展示分数、等级、连续记录和已完成任务。你的目标也可以这样设计。现实生活当然没有自动出现的经验条，但你可以追踪那些真正让你前进的行动，让自己看见进展。\n\n我做了一个 Habit Tracker 来帮助你做到这一点。它是 Purpose Planner 的一部分，[可以在这里免费获取](https://www.stijnnoorman.com/purpose-planner)。","sourceFormat":"markdown"},"note:sha256:348fd11e9bf7a7b5dfa96cc3b9e059c4167554fcf5640ac13d6f001508c8cec3":{"html":"\u003cblockquote\u003e\n\u003cp\u003e长期、反复暴露在愉悦刺激中，会降低我们对痛苦的耐受能力，同时提高体验快乐所需的阈值。 \u003cstrong\u003e– Dr. Anna Lembke\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e 长期、反复暴露在愉悦刺激中，会降低我们对痛苦的耐受能力，同时提高体验快乐所需的阈值。 **– Dr. Anna Lembke**","sourceFormat":"markdown"},"note:sha256:3df4e2f9a0e6a839df34f8036b8e3d329cbe03519926bc351dc3f97f06bf319e":{"html":"\u003cp\u003e提高动力的一种有效方式，是限制自己对即时满足型活动的消费。\u003c/p\u003e\n\u003cp\u003e前面简单提到过多巴胺与动力的关系。当我们看到自己离目标更近时，会获得多巴胺相关的奖励感。但如果大脑长期暴露在高度刺激的奖励中，那么相比之下，那些普通、缓慢的奖励就会显得没那么有吸引力。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNyK2XoAATPT1?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e可以这样理解——下面这些数字并不科学，只是用来说明我的观点：\u003c/p\u003e\n\u003cp\u003e朝目标迈进一步，也许相当于得到 10 个单位的多巴胺。这本身说不上多或少，关键取决于你从其他活动里得到多少刺激。刷 30 分钟信息流，也许像是 50 个单位；如果看色情内容、抽几支烟，或者喝掉六罐啤酒，也许就像 100 个单位。\u003c/p\u003e\n\u003cp\u003e这样一来，对大脑而言，为目标努力似乎成了一笔不划算的交易：它消耗大量能量，带来的刺激却明显低于那些投入更少的活动。\u003c/p\u003e\n\u003cp\u003e高多巴胺刺激会抬高你对“什么才够刺激”的标准。\u003c/p\u003e\n\u003cp\u003e这也是为什么读一本书、去健身，或者真正推进自己的目标，会让人觉得困难。当大脑习惯了高刺激奖励后，刺激较低的活动相比之下就更容易显得无聊，也更难开始。\u003c/p\u003e\n","kind":"html","rawMarkdown":"提高动力的一种有效方式，是限制自己对即时满足型活动的消费。\n\n前面简单提到过多巴胺与动力的关系。当我们看到自己离目标更近时，会获得多巴胺相关的奖励感。但如果大脑长期暴露在高度刺激的奖励中，那么相比之下，那些普通、缓慢的奖励就会显得没那么有吸引力。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HTXNyK2XoAATPT1?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n可以这样理解——下面这些数字并不科学，只是用来说明我的观点：\n\n朝目标迈进一步，也许相当于得到 10 个单位的多巴胺。这本身说不上多或少，关键取决于你从其他活动里得到多少刺激。刷 30 分钟信息流，也许像是 50 个单位；如果看色情内容、抽几支烟，或者喝掉六罐啤酒，也许就像 100 个单位。\n\n这样一来，对大脑而言，为目标努力似乎成了一笔不划算的交易：它消耗大量能量，带来的刺激却明显低于那些投入更少的活动。\n\n高多巴胺刺激会抬高你对“什么才够刺激”的标准。\n\n这也是为什么读一本书、去健身，或者真正推进自己的目标，会让人觉得困难。当大脑习惯了高刺激奖励后，刺激较低的活动相比之下就更容易显得无聊，也更难开始。","sourceFormat":"markdown"},"note:sha256:565ce43814432f38cd552f017b617674681c9c3efe143c4c9261704f3db6113f":{"html":"\u003cp\u003e所以，你得先弄清楚自己真正想要什么。我建议各选一个：一个你真心想实现的未来，也就是你的“天堂”；以及一个你真心想避开的未来，也就是你的“地狱”。\u003c/p\u003e\n\u003cp\u003e你的“天堂”在前面拉着你走，你的“地狱”在后面推着你走。\u003c/p\u003e\n\u003cp\u003e两者结合，调动的是两种最强的驱动力：渴望与恐惧。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNrG0W4AAVt25?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e此时，你的“天堂”和“地狱”合在一起，就构成了你的 \u003cstrong\u003eWhy（为什么）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e它会随着时间变化，这很正常。不要执着于一开始就把它定义得完美——它永远不会完美。先做到足够好，然后在行动中逐渐看清自己想要什么、不想要什么，再不断调整。\u003c/p\u003e\n","kind":"html","rawMarkdown":"所以，你得先弄清楚自己真正想要什么。我建议各选一个：一个你真心想实现的未来，也就是你的“天堂”；以及一个你真心想避开的未来，也就是你的“地狱”。\n\n你的“天堂”在前面拉着你走，你的“地狱”在后面推着你走。\n\n两者结合，调动的是两种最强的驱动力：渴望与恐惧。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HTXNrG0W4AAVt25?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n此时，你的“天堂”和“地狱”合在一起，就构成了你的 **Why（为什么）**。\n\n它会随着时间变化，这很正常。不要执着于一开始就把它定义得完美——它永远不会完美。先做到足够好，然后在行动中逐渐看清自己想要什么、不想要什么，再不断调整。","sourceFormat":"markdown"},"note:sha256:6ad41e5fb6480b8e65bcf567f248d571665e03abb187f3b94888825d9599ebdd":{"html":"\u003cp\u003e你还需要找到合适的挑战难度。把它想成一场游戏。\u003c/p\u003e\n\u003cp\u003e如果你是 50 级角色，却一直在打 5 级怪物，经验值几乎不会增长，你也会觉得无聊。反过来，如果你只有 5 级，却去挑战 50 级怪物，当前能力又不足以应对，就会变得压力过大。所以你需要选择一个略高于自己当前能力的挑战。\u003c/p\u003e\n\u003cp\u003e根据 Steven Kotler 的说法，一个理想的挑战大约比当前能力高 4%。太容易会无聊，太难会不堪重负；当挑战只比现有能力略高时，人更容易全情投入，并进入心流状态。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNwJfWgAAP8ba?format=png\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e这种难度会拉伸你的能力，也更容易让你进入心流。\u003c/p\u003e\n","kind":"html","rawMarkdown":"你还需要找到合适的挑战难度。把它想成一场游戏。\n\n如果你是 50 级角色，却一直在打 5 级怪物，经验值几乎不会增长，你也会觉得无聊。反过来，如果你只有 5 级，却去挑战 50 级怪物，当前能力又不足以应对，就会变得压力过大。所以你需要选择一个略高于自己当前能力的挑战。\n\n根据 Steven Kotler 的说法，一个理想的挑战大约比当前能力高 4%。太容易会无聊，太难会不堪重负；当挑战只比现有能力略高时，人更容易全情投入，并进入心流状态。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HTXNwJfWgAAP8ba?format=png\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n这种难度会拉伸你的能力，也更容易让你进入心流。","sourceFormat":"markdown"},"note:sha256:6fd522ebc6c5a861c483687fa00924d86adadc5e3404dd92566189d200f2e6b1":{"html":"\u003cblockquote\u003e\n\u003cp\u003e环境是一只塑造人类行为的无形之手。 \u003cstrong\u003e– James Clear\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e 环境是一只塑造人类行为的无形之手。 **– James Clear**","sourceFormat":"markdown"},"note:sha256:7bb016144737d102b166a4fe510fdd81cdac907b11adcb5f00baf601895c4957":{"html":"\u003cp\u003e无论我们多么专注，动力和意志力依然有上限。它可以很高，但不可能无限。所以，还需要把那些可能消耗它的东西尽量移走。\u003c/p\u003e\n\u003cp\u003e换句话说，我们要设计环境，让自己更容易完成原本打算做的事：给坏习惯增加阻力，让好习惯减少阻力。\u003c/p\u003e\n\u003cp\u003e无论是物理环境还是数字环境，都是如此。\u003c/p\u003e\n\u003cp\u003e干扰和诱惑越少，真正开始工作就越容易。\u003c/p\u003e\n","kind":"html","rawMarkdown":"无论我们多么专注，动力和意志力依然有上限。它可以很高，但不可能无限。所以，还需要把那些可能消耗它的东西尽量移走。\n\n换句话说，我们要设计环境，让自己更容易完成原本打算做的事：给坏习惯增加阻力，让好习惯减少阻力。\n\n无论是物理环境还是数字环境，都是如此。\n\n干扰和诱惑越少，真正开始工作就越容易。","sourceFormat":"markdown"},"note:sha256:7bf5630d23213c04aac0a0e7cd1f9b67020b57db1899bf9f79a8e98537c598d1":{"html":"\u003cp\u003e同样重要的是，把最重要的工作安排在你状态最好的时间。每个人都有自己的睡眠时间型（sleep chronotype），也就是说，你天然会在一天中的某些时段更清醒、更高效。\u003c/p\u003e\n\u003cp\u003e最重要的是，先找出最重要的事，再在你状态最好的时候完成它。如果那是凌晨 4 点，很好；如果是下午 1 点或晚上 10 点，也很好。关键是弄清楚那个时间，然后把事情做完。如果你既能做到这一点，又把前面的基础习惯处理好，你通常会更有动力，也能完成更多事情。\u003c/p\u003e\n","kind":"html","rawMarkdown":"同样重要的是，把最重要的工作安排在你状态最好的时间。每个人都有自己的睡眠时间型（sleep chronotype），也就是说，你天然会在一天中的某些时段更清醒、更高效。\n\n最重要的是，先找出最重要的事，再在你状态最好的时候完成它。如果那是凌晨 4 点，很好；如果是下午 1 点或晚上 10 点，也很好。关键是弄清楚那个时间，然后把事情做完。如果你既能做到这一点，又把前面的基础习惯处理好，你通常会更有动力，也能完成更多事情。","sourceFormat":"markdown"},"note:sha256:822d46d4fd023955b906449d4ebf25a2f4c647957fb89b6bbf1b25fdef6d3664":{"html":"\u003cp\u003e这篇文章把“动力”从一种等待出现的感觉，重新理解为可以通过目标、反馈、刺激管理、生理状态和环境共同塑造的系统。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这篇文章把“动力”从一种等待出现的感觉，重新理解为可以通过目标、反馈、刺激管理、生理状态和环境共同塑造的系统。","sourceFormat":"markdown"},"note:sha256:91ffbd96c34caa4e6cbdff50d3db86c466963dc820deadfc47492dad3610661e":{"html":"\u003cp\u003eStijn\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePS：\u003c/strong\u003e 如果你还想看更多类似内容，\u003ca href=\"https://www.stijnnoorman.com/subscribe\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003e可以订阅我的免费 Newsletter。\u003c/strong\u003e\u003c/a\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"Stijn\n\n**PS：** 如果你还想看更多类似内容，[**可以订阅我的免费 Newsletter。**](https://www.stijnnoorman.com/subscribe)","sourceFormat":"markdown"},"note:sha256:9577db4b4bf5fe00ef291eb74f57ab645a9abc937fb975d34fe0ceb02ddeefbb":{"blocks":[{"children":[{"title":"睡够 8 小时"},{"title":"吃健康的食物"},{"title":"几乎每天运动"},{"title":"限制廉价多巴胺刺激"},{"title":"冥想，并安排短暂休息"},{"title":"不要坐太久，每天做拉伸"}],"kind":"section","title":"最重要的习惯包括"},{"children":[],"kind":"leaf","title":"当然还有其他事情，但这些是最重要的。我建议做一个习惯追踪表，因为它能清楚显示你什么时候没有做到自己本该做的事，从而更容易重新回到正轨。同样，你可以在这里获取我的 Habit Tracker。"}],"html":"\u003cp\u003e最重要的习惯包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e睡够 8 小时\u003c/li\u003e\n\u003cli\u003e吃健康的食物\u003c/li\u003e\n\u003cli\u003e几乎每天运动\u003c/li\u003e\n\u003cli\u003e限制廉价多巴胺刺激\u003c/li\u003e\n\u003cli\u003e冥想，并安排短暂休息\u003c/li\u003e\n\u003cli\u003e不要坐太久，每天做拉伸\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e当然还有其他事情，但这些是最重要的。我建议做一个习惯追踪表，因为它能清楚显示你什么时候没有做到自己本该做的事，从而更容易重新回到正轨。同样，\u003ca href=\"https://www.stijnnoorman.com/purpose-planner\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e你可以在这里获取我的 Habit Tracker\u003c/a\u003e。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"最重要的习惯包括：\n\n- 睡够 8 小时\n- 吃健康的食物\n- 几乎每天运动\n- 限制廉价多巴胺刺激\n- 冥想，并安排短暂休息\n- 不要坐太久，每天做拉伸\n\n当然还有其他事情，但这些是最重要的。我建议做一个习惯追踪表，因为它能清楚显示你什么时候没有做到自己本该做的事，从而更容易重新回到正轨。同样，[你可以在这里获取我的 Habit Tracker](https://www.stijnnoorman.com/purpose-planner)。","sourceFormat":"markdown"},"note:sha256:9932b41b86839c932a493e2a69238748f9d1e1aa1274a2e3b1abdbaf6c12fa33":{"html":"\u003cp\u003e最近，我对那些总说自己“缺乏动力”的人有了一个看似反直觉的观察：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e他们并不缺动力。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e听起来有点奇怪，但我的意思是：很多抱怨自己没动力的人，并不是对所有事情都没有动力。他们可以连续打几个小时电子游戏。那同样需要投入大量精力，却常常让人觉得毫不费力。\u003c/p\u003e\n\u003cp\u003e原因在于游戏的设计方式。电子游戏会利用一些内在驱动力，因此让行动本身变得近乎自然。\u003c/p\u003e\n","kind":"html","rawMarkdown":"最近，我对那些总说自己“缺乏动力”的人有了一个看似反直觉的观察：\n\n**他们并不缺动力。**\n\n听起来有点奇怪，但我的意思是：很多抱怨自己没动力的人，并不是对所有事情都没有动力。他们可以连续打几个小时电子游戏。那同样需要投入大量精力，却常常让人觉得毫不费力。\n\n原因在于游戏的设计方式。电子游戏会利用一些内在驱动力，因此让行动本身变得近乎自然。","sourceFormat":"markdown"},"note:sha256:a330d1637a29311704546291552cd04a6acd977bf3c40a2ea657491d5d96e276":{"html":"\u003cp\u003e我很喜欢 After Skool 用这张图表达这个关系：\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXN0D5WsAAIhF9?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e现在承受更多有意义的痛苦，往往会换来之后更多的快乐；现在追逐更多廉价、无意义的快乐，往往会带来之后更多的痛苦。\u003c/p\u003e\n\u003cp\u003e同样，这并不是一个科学上完全精确的模型，但这不妨碍它成为一种有用的思考方式。\u003c/p\u003e\n\u003cp\u003e一般来说，你减少的无意义快感越多，长期状态往往越好。你不必戒掉一切，但去掉得越多，通常会越容易感受到变化。这并不轻松，但也正因为如此，大多数人不会去做。如果你想得到超过 99% 的人的结果，就得愿意做 99% 的人不愿意做的事，而减少即时满足型活动就是其中之一。\u003c/p\u003e\n\u003cp\u003e没人强迫你这么做。但如果你想变得极度自驱，这就是你需要面对的一部分：别把多巴胺浪费在廉价刺激上。学会和无聊相处，让真正重要的工作重新变得有回报。\u003c/p\u003e\n\u003cp\u003e我觉得把多巴胺想成一种货币很有用：把它花掉，你现在得到快乐；把它投资出去，你以后得到动力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我很喜欢 After Skool 用这张图表达这个关系：\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HTXN0D5WsAAIhF9?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n现在承受更多有意义的痛苦，往往会换来之后更多的快乐；现在追逐更多廉价、无意义的快乐，往往会带来之后更多的痛苦。\n\n同样，这并不是一个科学上完全精确的模型，但这不妨碍它成为一种有用的思考方式。\n\n一般来说，你减少的无意义快感越多，长期状态往往越好。你不必戒掉一切，但去掉得越多，通常会越容易感受到变化。这并不轻松，但也正因为如此，大多数人不会去做。如果你想得到超过 99% 的人的结果，就得愿意做 99% 的人不愿意做的事，而减少即时满足型活动就是其中之一。\n\n没人强迫你这么做。但如果你想变得极度自驱，这就是你需要面对的一部分：别把多巴胺浪费在廉价刺激上。学会和无聊相处，让真正重要的工作重新变得有回报。\n\n我觉得把多巴胺想成一种货币很有用：把它花掉，你现在得到快乐；把它投资出去，你以后得到动力。","sourceFormat":"markdown"},"note:sha256:abbf1bf344b07281f6f7a8a21ebdc8ccdc107f8f6d7ebdc352acc5c9cdab263e":{"html":"\u003cblockquote\u003e\n\u003cp\u003e@stijnnoorman · \u003ca href=\"https://x.com/stijnnoorman/article/2107795151699456358\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-10-07\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e关于动力，你一直被灌输了一个错误观念。\u003c/p\u003e\n\u003cp\u003e大多数人以为，动力要么有，要么没有。\u003c/p\u003e\n\u003cp\u003e但动力并不是这样运作的。\u003c/p\u003e\n\u003cp\u003e我经历过这样的阶段：可以工作一整天，甚至得强迫自己停下来；也经历过几乎完全提不起劲工作的阶段。我并没有突然变成另一个人。但把人生中这些时期放在一起比较后，我很清楚地发现，有几件事我做得不一样。\u003c/p\u003e\n\u003cp\u003e我读过很多有关动力的神经科学和心理学内容，也在十多年“自我提升”的过程中试过大量习惯与策略。这让我意识到一件事：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e动力是可以被设计出来的。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从第一性原理来看，动力本质上就是“想去做某件事”。有 5 个原则，可以帮助你把生活设计成一种状态：那些你\u003cem\u003e应该\u003c/em\u003e做的事，逐渐变成你\u003cem\u003e想要\u003c/em\u003e做的事。这篇文章就来拆解这 5 个原则。\u003c/p\u003e\n\u003cp\u003e我会尽量写得简洁，但你还是得先说服自己花几分钟读下去，而不是继续刷屏。这不是一篇短文。如果现在不是合适的时间，可以先保存下来；它会把如何变得极度自驱这件事完整讲清楚。\u003c/p\u003e\n\u003cp\u003e开始吧。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e @stijnnoorman · [X 文章](https://x.com/stijnnoorman/article/2107795151699456358) · 2026-10-07\n\n关于动力，你一直被灌输了一个错误观念。\n\n大多数人以为，动力要么有，要么没有。\n\n但动力并不是这样运作的。\n\n我经历过这样的阶段：可以工作一整天，甚至得强迫自己停下来；也经历过几乎完全提不起劲工作的阶段。我并没有突然变成另一个人。但把人生中这些时期放在一起比较后，我很清楚地发现，有几件事我做得不一样。\n\n我读过很多有关动力的神经科学和心理学内容，也在十多年“自我提升”的过程中试过大量习惯与策略。这让我意识到一件事：\n\n**动力是可以被设计出来的。**\n\n从第一性原理来看，动力本质上就是“想去做某件事”。有 5 个原则，可以帮助你把生活设计成一种状态：那些你*应该*做的事，逐渐变成你*想要*做的事。这篇文章就来拆解这 5 个原则。\n\n我会尽量写得简洁，但你还是得先说服自己花几分钟读下去，而不是继续刷屏。这不是一篇短文。如果现在不是合适的时间，可以先保存下来；它会把如何变得极度自驱这件事完整讲清楚。\n\n开始吧。","sourceFormat":"markdown"},"note:sha256:b18440148548282504613c9b4b2d84f4f78dbc922a640f30f57ea6af677cc3e7":{"html":"\u003cp\u003e最后，为自己建立一个游戏循环：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e目标 → 挑战 → 行动 → 反馈 → 进展 → 奖励 → 下一关\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e设定清晰目标，给自己一个挑战，采取行动，获得反馈，记录进展，在完成后给予奖励，然后把挑战稍微提高，再重复一遍。\u003c/p\u003e\n\u003cp\u003e与其依赖动力去硬做一件无聊的事，不如把工作设计成一种你\u003cem\u003e愿意\u003c/em\u003e继续玩下去的东西。当工作开始像游戏一样运转，它就更接近“玩”，你也更容易自然地产生继续做下去的动力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"最后，为自己建立一个游戏循环：\n\n**目标 → 挑战 → 行动 → 反馈 → 进展 → 奖励 → 下一关**\n\n设定清晰目标，给自己一个挑战，采取行动，获得反馈，记录进展，在完成后给予奖励，然后把挑战稍微提高，再重复一遍。\n\n与其依赖动力去硬做一件无聊的事，不如把工作设计成一种你*愿意*继续玩下去的东西。当工作开始像游戏一样运转，它就更接近“玩”，你也更容易自然地产生继续做下去的动力。","sourceFormat":"markdown"},"note:sha256:befcc1bff50f01a2cf40f0042de52492241743ba3060cb8914df34c2a97083d5":{"blocks":[{"children":[{"title":"今天就规划好明天"},{"title":"关闭所有通知"},{"title":"上午尽量保持独处"},{"title":"隐藏书签，并尽量减少打开的标签页"},{"title":"使用升降桌切换姿势"},{"title":"不要多任务处理，也不要频繁切换任务"},{"title":"每个工作时段只聚焦一个最重要的行动步骤"},{"title":"中午之前不碰手机、邮件或社交媒体"},{"title":"深度工作期间保持空腹，并摄入咖啡因"},{"title":"使用耳塞或降噪耳机"},{"title":"保持桌面空旷，只留下电脑和水或咖啡"},{"title":"以 90 分钟为一个工作区块，之后恢复 10 分钟"},{"title":"把浅层任务集中到当天稍晚的一个时间段批量处理"},{"title":"在精力峰值时完成最重要的工作（对我来说通常是早晨）"},{"title":"通过固定大部分饮食、穿简单的衣服、自动化小决策等方式减少决策疲劳"}],"kind":"section","title":"有很多方法可以做到这一点。下面是对我有效的一整套做法"},{"children":[],"kind":"leaf","title":"你不需要把这些全部照做。但采用得越多，通常就越容易专注；越容易专注，你浪费在错误事情上的动力也就越少。"},{"children":[],"kind":"leaf","title":"这就是如何变得极度自驱。它并不容易，所以大多数人不会这么做。但如果你真的能做到，就会远远超过竞争者。"}],"html":"\u003cp\u003e有很多方法可以做到这一点。下面是对我有效的一整套做法：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e今天就规划好明天\u003c/li\u003e\n\u003cli\u003e关闭所有通知\u003c/li\u003e\n\u003cli\u003e上午尽量保持独处\u003c/li\u003e\n\u003cli\u003e隐藏书签，并尽量减少打开的标签页\u003c/li\u003e\n\u003cli\u003e使用升降桌切换姿势\u003c/li\u003e\n\u003cli\u003e不要多任务处理，也不要频繁切换任务\u003c/li\u003e\n\u003cli\u003e每个工作时段只聚焦一个最重要的行动步骤\u003c/li\u003e\n\u003cli\u003e中午之前不碰手机、邮件或社交媒体\u003c/li\u003e\n\u003cli\u003e深度工作期间保持空腹，并摄入咖啡因\u003c/li\u003e\n\u003cli\u003e使用耳塞或降噪耳机\u003c/li\u003e\n\u003cli\u003e保持桌面空旷，只留下电脑和水或咖啡\u003c/li\u003e\n\u003cli\u003e以 90 分钟为一个工作区块，之后恢复 10 分钟\u003c/li\u003e\n\u003cli\u003e把浅层任务集中到当天稍晚的一个时间段批量处理\u003c/li\u003e\n\u003cli\u003e在精力峰值时完成最重要的工作（对我来说通常是早晨）\u003c/li\u003e\n\u003cli\u003e通过固定大部分饮食、穿简单的衣服、自动化小决策等方式减少决策疲劳\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e你不需要把这些全部照做。但采用得越多，通常就越容易专注；越容易专注，你浪费在错误事情上的动力也就越少。\u003c/p\u003e\n\u003cp\u003e这就是如何变得极度自驱。它并不容易，所以大多数人不会这么做。但如果你真的能做到，就会远远超过竞争者。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"有很多方法可以做到这一点。下面是对我有效的一整套做法：\n\n- 今天就规划好明天\n- 关闭所有通知\n- 上午尽量保持独处\n- 隐藏书签，并尽量减少打开的标签页\n- 使用升降桌切换姿势\n- 不要多任务处理，也不要频繁切换任务\n- 每个工作时段只聚焦一个最重要的行动步骤\n- 中午之前不碰手机、邮件或社交媒体\n- 深度工作期间保持空腹，并摄入咖啡因\n- 使用耳塞或降噪耳机\n- 保持桌面空旷，只留下电脑和水或咖啡\n- 以 90 分钟为一个工作区块，之后恢复 10 分钟\n- 把浅层任务集中到当天稍晚的一个时间段批量处理\n- 在精力峰值时完成最重要的工作（对我来说通常是早晨）\n- 通过固定大部分饮食、穿简单的衣服、自动化小决策等方式减少决策疲劳\n\n你不需要把这些全部照做。但采用得越多，通常就越容易专注；越容易专注，你浪费在错误事情上的动力也就越少。\n\n这就是如何变得极度自驱。它并不容易，所以大多数人不会这么做。但如果你真的能做到，就会远远超过竞争者。","sourceFormat":"markdown"},"note:sha256:c56046d1e94710f6644af074d6f8ac28c886fd5cc416750a38ff2e27da8ca547":{"html":"\u003cp\u003e当愿景足够清晰后，下一步是把它拆解到可以行动。\u003c/p\u003e\n\u003cp\u003e从你的“天堂”倒推目标、里程碑和具体行动，直到你明确知道今天应该做什么。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HTXNtN4XQAA-e_-?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e这样做会增强动力，因为它把每天的行动与你的长期愿景连接起来。每一个动作都变成朝理想未来迈出的一步。这可能促使大脑释放多巴胺，让你更有动力继续前进。\u003c/p\u003e\n","kind":"html","rawMarkdown":"当愿景足够清晰后，下一步是把它拆解到可以行动。\n\n从你的“天堂”倒推目标、里程碑和具体行动，直到你明确知道今天应该做什么。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HTXNtN4XQAA-e_-?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n这样做会增强动力，因为它把每天的行动与你的长期愿景连接起来。每一个动作都变成朝理想未来迈出的一步。这可能促使大脑释放多巴胺，让你更有动力继续前进。","sourceFormat":"markdown"},"note:sha256:c882d2e4ba9c68b0a719087208882d946006c1b791821feabd6759b1d1b419ba":{"html":"\u003cp\u003e所以，如果你想变得极度自驱，一件很有力量的事就是减少这些高刺激活动。当你这样做时，其他事情会在相对意义上变得更有趣，因为大脑对“有趣”和“刺激”的门槛会下降。\u003c/p\u003e\n","kind":"html","rawMarkdown":"所以，如果你想变得极度自驱，一件很有力量的事就是减少这些高刺激活动。当你这样做时，其他事情会在相对意义上变得更有趣，因为大脑对“有趣”和“刺激”的门槛会下降。","sourceFormat":"markdown"},"note:sha256:da50dbd4fa21730e664e752da82b3ae28d8394136220d72179db6279a9526eea":{"html":"\u003cblockquote\u003e\n\u003cp\u003e保持身体健康是一种责任，否则我们就无法让心智保持强健与清明。 \u003cstrong\u003e– Buddha\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e 保持身体健康是一种责任，否则我们就无法让心智保持强健与清明。 **– Buddha**","sourceFormat":"markdown"},"note:sha256:eaf0b3eebc0ccaf1addcaa7db1608dd14657ce04d49b613e84083840bbb3fce2":{"html":"\u003cblockquote\u003e\n\u003cp\u003e最美好的时刻，往往出现在一个人自愿投入某件困难而有价值的事情，并让身体或心智发挥到极限的时候。 \u003cstrong\u003e– Mihaly Csikszentmihalyi\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e 最美好的时刻，往往出现在一个人自愿投入某件困难而有价值的事情，并让身体或心智发挥到极限的时候。 **– Mihaly Csikszentmihalyi**","sourceFormat":"markdown"},"note:sha256:fc4f755dfd37d218eb9b88bff1df6aa1fe69dff7cee4f5d6f0b3ebd4c28b0d82":{"blocks":[{"children":[],"kind":"leaf","title":"1. Thread Mastery。 学习如何为 X 和 Threads 写出具有传播力的长帖。"},{"children":[],"kind":"leaf","title":"2. X Growth System。 学习如何通过写作在 X 和 Threads 上建立受众。"}],"html":"\u003cp\u003e\u003ca href=\"https://www.stijnnoorman.com/thread-mastery\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003e1. Thread Mastery。\u003c/strong\u003e\u003c/a\u003e 学习如何为 X 和 Threads 写出具有传播力的长帖。\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://xgrowthsystem.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003e2. X Growth System。\u003c/strong\u
