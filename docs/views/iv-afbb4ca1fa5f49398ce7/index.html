wer-info-privacy{color:#a5b0ba;text-decoration-color:#a5b0ba75}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-info-privacy:hover{color:#d0d7de}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-copyright{border-top-color:#94a3b880;color:#a5b0ba}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog .dmnd-viewer-dialog-body{color:var(--md-text)}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog a{color:var(--md-link)}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog a:hover{color:var(--md-link-hover)}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog img{border-color:#46515a}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog .dmnd-viewer-asset-placeholder,#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-remote-image-placeholder{border-color:#52606b;background:#20262c;color:#aeb7c2}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-remote-image-placeholder:hover{border-color:#38bdf894;background:#38bdf814;color:var(--primary)}@media(prefers-reduced-motion:reduce){.dmnd-viewer-remote-images-button svg,.dmnd-viewer-remote-image-placeholder svg{animation:none!important}}
</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-06T02:22:09.961Z","language":"en","name":"DeMinds","version":"1.0.33"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"If you have multiple interests, do not waste the next 2-3 years","outlineVersion":1},"sourceRevision":"sha256:548e83733942045452c0a0ee3a858608e7547db6d99ddd2287f7e5429d1834f8","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"If you have multiple interests, do not waste the next 2-3 years.md","sourceUrl":"https://x.com/thedankoe/status/2010042119121957316","title":"If you have multiple interests, do not waste the next 2-3 years"},"files":[{"byteLength":31382,"content":"# If you have multiple interests, do not waste the next 2-3 years\n\n![Image](https://pbs.twimg.com/media/G-UaHxDXYAAa4VR?format=jpg\u0026name=medium)\n\n\u003e @thedankoe · [X Article](https://x.com/thedankoe/article/2010042119121957316) · 2026-01-10\n\nSociety made you think that having multiple interests was a weakness.\n\nGo to school.\n\nGet a degree.\n\nGet a job.\n\nRetire at some point.\n\nBut there is so much wrong with that sequence of events.\n\nWe don’t live in the Industrial Age anymore. Specializing in one skill is almost certain death. I feel like we all know by this point how dangerous mechanical living and siloed learning is for your psyche and soul. And people can feel that we’re going through a *second renaissance*. Your curiosity and love for learning are your advantages in today’s world, but there is something missing.\n\nFor the longest time, I learned and learned and learned. I was stuck in tutorial hell. Some may call it shiny object syndrome to point out your lack of focus. I got my dopamine from feeling smart, but my life didn’t change all that much. Honestly, I felt like I was just falling behind. I tried so many different things in college. I had dreams of doing my own thing... earning an income from something creative... but after spending 5 years “learning,” I was met with the reality that I had to get the best job I could find just so I could survive.\n\nThe missing piece was a *vessel*.\n\nA vessel that would allow me to *channel* all of my interests into meaningful work that I could earn a decent income from.\n\nIf you’ve ever felt guilty for not being able to pick one thing, if you’ve been told to niche down when your mind wants to expand, if you’ve wondered whether there’s a path you can take that doesn’t lead to the misery you see in everyone else’s eyes – this is the greatest time to be alive.\n\nHere are 7 of the most compelling ideas I could come up with. We’ll start by understanding why having multiple interests is a superpower in today's world, then I’ll give you practical steps to turn that into your life’s work. We have *a lot* to talk about, so I hope you’re here for the ride.\n\n## I – The 3 ingredients of individual success \u0026 the death of the expert\n\n\u003e The man whose whole life is spent in performing a few simple operations... generally becomes as stupid and ignorant as it is possible for a human creature to become. — Adam Smith\n\nFunny you say that Mr. Smith, because you created those people, and we’re still dealing with the backlash.\n\nSpecialization took over during industrialization because, in a pin factory, for example, one worker doing every step could make 20 pins a day. Then workers, each doing one step, could make 48,000.\n\nSo we built an entire world around this model.\n\nHumans became assembly lines working 9 to 5 because frankly, governments don’t serve the national interest, they serve their own interest. Corporations don’t serve the employees interest, they serve their own.\n\nSchools were designed to serve that interest. Their sole purpose was to create factory workers who were punctual and obedient.\n\nBut this is no way to live.\n\nIf you want to have specialized knowledge so that you could never run an operation, especially your own operation, then be dependent on schools for your education and jobs for your wage. Be duped into believing the promise that specialization is what makes a human valuable when it is clear that the system does not need you, specifically, to perform that task.\n\nIn lies the distinction.\n\nIf pure specialization makes people stupid and dependent, what makes an individual smart and sovereign?\n\n**Three ingredients**: Self-education, self-interest, self-sufficiency.\n\nSelf-education is clear, because if you want to achieve a result different from that of traditional education, you must direct your own learning.\n\nSelf-interest raises some flags. It sounds selfish and short-sighted, which many people view as bad without thinking through it, but it simply means “concern with one’s own interest,” because the only other option is to serve the interest of the organizations that compose society as it is, which we’ve discussed. In other words, follow your interest, because your interest can very well benefit others in a selfless way - depending on your level of cognitive and moral development. Oh, and by the way, indulging in short-lived pleasures (cheap dopamine) is usually not your interest, but the interest of corporations that benefit from your mindlessness.\n\n\u003e The truly selfish person, in Ayn Rand’s view, is a self-respecting, self-supporting human being who neither sacrifices others to himself nor sacrifices himself to others. This rejects both the predator *and* the doormat.\n\nSelf-sufficiency is the refusal to outsource your judgment, learning, and agency. If self-education is the engine and self-interest is the compass, self-sufficiency is the foundation that prevents your life direction from being hijacked by another force. They collaborate, but are not fully dependent.\n\nThe generalist emerges naturally from this triad.\n\n**Self-interest** **motivates** **self-education.**\n\nYou learn because it genuinely serves your flourishing, not because someone assigned it.\n\n**Self-education** **enables** **self-sufficiency.**\n\nYou can only be sovereign over domains you understand.\n\n**Self-sufficiency** **clarifies** **self-interest.**\n\nWhen you’re not dependent on others’ interpretations, you can actually perceive what serves you. Most people pursue multiple interests as an escape from their work. When your interests become your work, or your life’s work, most of them start to filter out.\n\nWhen we look at every CEO, founder, or creative that we actually admire, they are generalists.\n\nThey understand enough about marketing to direct it, enough about product to build it, and enough about people to lead them. But they also need to direct the ship. They need to learn and adapt when circumstances change.\n\nMore importantly, they understand that ideas across domains complement each other and create a unique way of viewing the world, which allows them to catch novel ideas from the aether and translate them into market value.\n\nWhen we look at where the world is today, and if you understand the opportunities available to singular individuals, not just leaders, you will find that the options you have as a natural polymath are extensive. It should spark an immense amount of excitement in you.\n\n## II – You are living through the second renaissance, take advantage of it\n\n\u003e Study the science of art. Study the art of science. Develop your senses—especially learn how to see. Realize that everything connects to everything else. — Leonardo da Vinci\n\nThe ultimate moat, or the final competitive edge worth paying for, in my opinion, is an opinion.\n\nA perspective that only you can see, because the uniqueness of your life experience created it. That may just be the last thing anyone else can replicate.\n\nAnd since that’s always been the case, why not prioritize that now? Especially when automation is at our doorstep?\n\nBut how do you prioritize it? How do you develop it?\n\nBy pursuing multiple interests and building something with them.\n\nYou see, every interest you’ve ever pursued leaves behind a residue. Every interest increases the number of connections that can be made. Every interest expands and increases the complexity of how you model and interpret reality. The more complex your model of reality, the more problems you can solve, opportunities you can see, and value you can create. *Specialism completely halts this process, and your shiny object syndrome has been trying to tell you this whole time.*\n\nFrom birth until now, you are cultivating a way of seeing things that others can’t. A way of seeing things that AI can only think if you tell it what to think.\n\nA person who studied psychology and design sees user behavior differently from the pure designer. A person who learned sales and philosophy closes deals differently than the pure salesman. A person who understands fitness and business builds health companies that MBAs can’t comprehend.\n\nYour edge lies more in intersection than it does in expertise.\n\nThis is the exact pattern we see in the Renaissance that is coming back with a much stronger force now.\n\nConsider what made it possible...\n\nBefore the printing press, knowledge was scarce.\n\nBooks were copied by hand. A single text could take a scribe months to reproduce. Libraries were rare. Literacy was rarer. If you wanted to learn something outside your trade, you either had access to a monastery or you didn’t learn it.\n\nThen Gutenberg changed everything.\n\nWithin 50 years, 20 million books flooded Europe. Ideas that once took generations to spread now moved in months. Literacy exploded. The cost of knowledge collapsed.\n\nFor the first time in history, a person could realistically pursue *multiple* domains of mastery in a single lifetime.\n\nThe Renaissance was the result.\n\nDa Vinci didn’t pick one thing. He painted, sculpted, engineered, studied anatomy, designed war machines, and mapped the human body. Michelangelo was a painter, sculptor, architect, and poet.\n\nUnique minds are finally free to operate the way they are supposed to.\n\nThey were supposed to cross disciplines, synthesize connections, and follow curiosity wherever it led, but most of us never realized that.\n\nThe printing press was the catalyst for a new type of person to emerge. A person who could learn anything, combine everything, and create what no specialist ever could.\n\nIf you enjoy these letters, I send them out 1-2x a week. [Join here](https://letters.thedankoe.com) if you want to be notified when they go out (because the algorithm probably won't show you them).\n\n## III – How to turn multiple interests into a lucrative way of life\n\nThere are a few things we know so far:\n\n- You have multiple interests but feel like you can’t keep learning forever\n- You have a love for interest-based self-education but have to carve out time *outside* of your career to do it\n- You understand the need to become self-sufficient but you feel like you don’t have value worth paying for, yet\n- You need to be able to adapt *fast* because we don’t know what the future of work looks like\n\nThe question then is, how do we combine all of these things into one *way of life?*\n\nHow do we combine learning and earning into something you can do for work?\n\nI’ll try to make this as logical as I can.\n\nTo make money from your interests, you need other people to become interested in them too. That part is trivial. If you became interested in something, other people can too, you simply must learn to *persuade.*\n\nFurther, you need a way for them to pay you. In this context, that usually means you need to sell a product, because you probably aren’t going to find a job that allows you to express your interests, and investing in stocks or real estate (to any effective degree) requires a good amount of capital.\n\nIn other words, you need attention.\n\nAttention is one of the last moats.\n\nBecause when anyone can write anything or build any software, which ones are going to win? The ones that people *know about.* You can have the greatest product in the world, but if nobody knows about it, the person who can capture and hold attention will run laps around you.\n\nAs an aside, and if you’ve been keeping up with the tech space, no, I don’t think everyone will just “build their own software.” Most people don’t even spend 20 minutes cooking their own food. They would rather pay a few bucks for Uber Eats. And people have their own things they want to spend their time on.\n\nBack to the point:\n\n*You need to become a creator.*\n\nNow, before you cringe and leave, I don’t exactly mean becoming a content creator (well… it’s complicated).\n\nI mean that the solution to stop creating for someone else because you need them to give you a paycheck is to create for yourself.\n\nHumans, by nature, are creators who were convinced that being a machine would lead to the American Dream. We are tool builders at our core. We thrive in any niche because we create solutions to problems. If a lion were put in Alaska, it would not build shelter and clothing. It would die. A lion belongs in its own niche.\n\nThe thing is, every business is a media business now. And remember, you need attention. Where is the attention? Mostly on social media until the next attention preference platform comes around - you’ll need to adapt at that point. So yes, if you have multiple interests, it would be wise to become a “content creator,” but it may be easier to think of social media as a mechanism to get your interests in front of other people. It is one piece of the puzzle to do independent work.\n\nPlus, that covers all of our bases.\n\n**You love learning?** Great, reframe it as “research” and now that’s literally your main job. Most of the things I write about simply come from me learning about my interests and treating social media like I’m “taking notes in public.”\n\n(You’re already spending time learning, now just spend that time learning in public and boom you have the foundation of a business).\n\n**You need to become self-sufficient?** Well, you’d need a business to do that, and every business needs to attract customers, and you probably don’t give two f*cks about paid ads, SEO, or any other form of marketing. This is what trips many people up because they are only used to doing one specialized task within a business as an employee.\n\n**You need to be able to adapt?** Amazing, you can build and launch new products to your audience as fast as you can build them. I have a solid audience, and if my next product were to fail, I have people who would be willing to invest, be a part of the team, or support the next product. You can build your little SaaS company, but if you don’t have distribution, you are putting in marathons of extra leg work into getting capital, finding talent, and getting things off the ground.\n\nNo other job or business model allows you to do just that with so much freedom.\n\nBut how do you actually start building it?\n\nHow do you tie all of this together?\n\n## IV – How to turn yourself into a business\n\n![Image](https://pbs.twimg.com/media/G-UVJ89asAM6k6F?format=png\u0026name=medium)\n\nIt’s unfortunate that “entrepreneurship” and “business” have become dirty words that make people think they aren’t qualified to take that path, so much so that when an opportunity comes up, they don’t even notice it.\n\n\u003e If you’ve ever helped someone with your interests, you’re qualified to start a business.\n\nThey no longer require upfront capital. They are not reserved for unethical elites. They are not only for people who want to make a lot of money. And they are not only for talented or special people.\n\nThe reality is that entrepreneurship is in our nature. It is modern survival. We are wired to create and distribute value to a tribe of like-minded people. We are wired to hunt, explore the unknown, seek novelty, and never stagnate. Psychologically, this is the most enjoyable way of life, even if there are low periods, because those are what allow the (non-artificial) highs to exist.\n\nFurther, the barrier of entry has collapsed.\n\nAll you really need is a laptop and internet connection.\n\nDistribution is now free thanks to social media (well, not free, but skill-based, which can be expensive in time). Anyone can post an idea that reaches millions, and if they have a product, those millions of eyes can result in millions of dollars if you know what you’re doing, and that’s a big if. Most people just love becoming really good at an interest or skill that doesn’t directly impact their success, potentially because they’re afraid of it.\n\nTools and technology now handle what used to require teams of people. You have access to AI and a plethora of useful software.\n\nNow, there are 2 paths you can take to start.\n\n**Path 1) Skill-Based**\n\nThis is what dominated the internet for the longest time. You “learn a marketable skill.” You teach that skill through content. Then you sell a product or service related to that skill.\n\nThe limitation here is the limitation of being a specialist. It is one-dimensional. You put yourself in a box. You “niche down” because you were told it is more profitable, and since you’re chasing profit over interest, you tend to build yourself into a second 9-5 where you do work you don’t care about for people you don’t care about.\n\n**Path 2) Development-Based**\n\nThe creators that win right now are those without a niche they can be pinned down to. Typically, they are focused on one of the 4 eternal markets: health, wealth, relationships, happiness. Or even all of them. Technically, everyone’s niche is self-actualization, they are just all taking infinitely unique paths to get there.\n\n- They pursue your own goals (brand).\n- They teach what you learn (content).\n- They help others achieve the goal faster (product).\n\nFor those with multiple interests, I obviously recommend this path, because it goes a bit deeper.\n\nFirst, when you take this path, you are also taking the first path. Because building your brand, content, and product requires you to become good at *all of the relevant marketable skills, so even if you fail, you have something worth paying for.* You are building your business, and you can help others with a specific part of theirs if you are good at it.\n\nSecond, it flips the traditional model on its head.\n\nYou don’t create a customer avatar so that you can niche down and only focus on that. You *turn yourself into the customer avatar.*\n\nThat makes things much more palatable.\n\nYou pursue your goals in life and develop yourself → you have already validated the usefulness of what you will offer → you help the past version of yourself reach that same goal.\n\nDon’t be a YouTube creator.\n\nDon’t be a personal brand.\n\nDon’t be an influencer.\n\nBe you. But in a place where your work can be discovered, followed, and supported. Right now and for the foreseeable future, that’s on the internet.\n\nJordan Peterson (or others like him) isn’t a “content creator,” even though that’s how it seems on the surface.\n\nHe goes on tours, writes books, leverages social media as a base, and uses all of the *tools* at his disposal to **spread his life’s work**. He isn’t worried about the latest content idea trend. His mind outperforms any of those myopic growth strategies. The quality of his ideas is what sets him apart and changes people’s lives (regardless of your opinion on Peterson).\n\nWith that, I want to provide a different perspective on brand, content, and product. That way you can use this as a vessel for your life’s work.\n\n## V – Brand is an environment\n\nStop thinking of your brand as a profile picture and social media bio.\n\n*Brand is an environment where people come to transform.*\n\nBrand is the little world you are inviting others into.\n\nBrand isn’t illustrated when a reader first visits your profile.\n\nBrand is the accumulation of ideas in your reader’s mind after 3-6 months of following you.\n\nYou illustrate your worldview, story, and philosophy for life across every single touchpoint. Your banner, profile picture, bio, link in bio, landing page design, pinned content, posts, threads, newsletters, videos, and the rest.\n\nIn other words, your brand is this:\n\n![Image](https://pbs.twimg.com/media/G-UVCNja0AAu07X?format=png\u0026name=medium)\n\nYour brand is your story.\n\nIt would help to spend a day writing out where you came from, the “low” points of your life, the experiences you’ve had and skills you’ve acquired, and how those things have helped you the most.\n\nWhen you’re thinking of ideas, content, or products, you should filter them through your story. This doesn’t mean you have to talk about yourself all the time. It means you have to align what you’re saying so that your brand is cohesive.\n\nThe difficult part is realizing that your story is worth telling, even if you think it’s boring or haven’t reflected on your growth.\n\nThe point:\n\nYour bio and profile picture do not matter. There are literal people with one word in their bio and a singular color for their profile picture.\n\nMy recommendation:\n\n- Make a list of 5-10 people you respect online\n- Look at their profile picture, bio, and content\n- Take mental note of patterns between them\n- Start formulating what you should do for your own brand, with your own little spin\n\nIn all honesty, I wouldn’t overcomplicate this or even worry about it. Your brand will take shape as you start writing content. We could even say that brand *is* content, so we need to get that right.\n\nThis article on the [content ecosystem to build your own](https://letters.thedankoe.com/p/how-to-build-a-world-the-2-hour-content?lli=1) world may help.\n\n## VI – Content is novel perspectives\n\nThe internet is a fire hose of information.\n\nAI is only adding more noise.\n\nThat means trust and signal are more important than ever.\n\nIn my opinion, the guiding light for your content should be to curate the best possible ideas in one place. *Your brand is a collection of all the ideas you care about, in your own words, under one account on the internet.*\n\nIf you have any plans to do podcasts or public speaking, notice how the best speakers always have 5-10 of their best arguments or ideas top of mind. They repeat these over and over and that’s how they build influence. If you don’t have a set of those 5-10 ideas, then you won’t be as impactful as you could be. Writing a truckload of content is how you discover those ideas.\n\nOnce the “idea density” of your content increases with time and effort, that’s what creates a brand worth following and paying for.\n\nThe goal of curating ideas to include under your brand should fall at the intersection of:\n\n- **Performance** – the ideas have the potential to “do well.” This is the measure of how much other people will care.\n- **Excitement** – the ideas give you a sense of excitement to write about them. This is the measure of how much you care.\n\nArt and business.\n\nMetrics and performance shouldn’t determine everything, but they do mean something.\n\n**Step 1) Build an idea museum**\n\nThe secret of most creatives you love is that they keep a ruthless curation of notes, ideas, and sources of inspiration.\n\nIn other words, they have a “swipe file,” as marketers call it.\n\nYou can use [Eden](https://eden.so/) (if you have access), Apple Notes, Notion, or whatever else you want, but I want to make this very clear:\n\nYou need somewhere to jot down ideas *as soon as they come to mind.*\n\nThis is a critical habit.\n\nWhenever you find an idea that is useful, either now or in the near future, write it down. You don’t need content pillars or 2-3 topics to talk about. The ideas you curate should simply be important to you. That alone means they are relevant to a specific niche of a person: you. However, you can create a [content map](https://letters.thedankoe.com/p/the-content-map-how-to-never-run) if you’d like.\n\nI don’t care how you structure this. It can be a neat and organized set of documents, or it can be a messy running note without structure. The habit matters more than the format.\n\nYou gauge performance by glancing at the likes, views, or general engagement of a post to see if it has the potential to resonate. If the idea falls flat or does worse than their other content, it probably won’t do well for you.\n\nYou gauge excitement by noticing when you feel as if you are wasting something valuable if you don’t write it down.\n\n**Step 2) Curate based on idea density**\n\nHow do you start filling your idea museum?\n\nYou need 3-5 sources of information that have high idea density.\n\nWhen I say “idea density,” I mean an idea that is high signal.\n\nIt’s difficult to explain how to find something that is high signal, because that is subjective. It’s dependent on your level of development (what’s useful for you), your audience’s level of development (what’s useful for them), and your translation from one to another.\n\nThe most basic piece of advice could be the most valuable thing in the world for someone else, but it may seem like common knowledge to you.\n\nWith time, you will tune your own signal-to-noise ratio by seeing what ideas resonate with your audience and which don’t.\n\nThe most idea-dense sources of information:\n\n- **Old or little-known books** – I have 5 books that I reread over and over again because the ideas are so good. These are where the timeless principles live, untouched by trends.\n- **Curated blogs, accounts, or books** – Blogs like Farnam Street curate the best ideas from modern intellectuals. Accounts like Navalism curate Naval’s best ideas. Books like *The Maxwell Daily Reader* have one of Maxwell’s best ideas one day at a time for a year. These do a lot of the heavy lifting for you, allowing you to pick and choose the best of the best.\n- **Heavy-hitting social accounts** – I have a list of maybe 5 social accounts that always post great ideas. If I don’t have something to write about, I’ll scroll through their page and find something I have an opinion on and write about that.\n\nFinding these sources takes a few months of discovery. But the result of maintaining an idea museum of dense ideas leads to you creating idea-dense content.\n\nYour idea museum becomes a representation of the mind you are attempting to create.\n\nThat’s the ultimate goal.\n\nTo have a library of content so good that people can’t help but open your emails, turn on post notifications, share your ideas with friends, and think about your ideas often.\n\n\u003e You become a *curator* of ideas that people wouldn’t even think to ask AI for, and that people would never come across organically.\n\nThat’s how you become less dependent on the algorithm for your success.\n\n**Step 3) Write 1 idea 1000 different ways**\n\nBecoming a good writer or speaker isn’t only about the idea, but *how the idea is articulated.*\n\nThe idea does a lot of the heavy lifting, but the structure is what makes it engaging, unique, and impactful.\n\nLet me show you what I mean.\n\nTake this post structure:\n\n\u003e *One pattern I’ve noticed in happy people: They’re obsessive about maintaining their mental clarity.*\n\nThe idea here is that happy people maintain their mental clarity.\n\nThe structure is formatted in 2 parts: a hook in the form of an observation, and the delivery of what the observation is.\n\nIt seems simple, but the difference in the structure of an idea can make all the difference.\n\nNow, if I take the same idea but use a “list” structure:\n\n\u003e *Happy people are clear-minded people:* *– They take time for rest* *– They focus on one singular goal* *– They ruthlessly eliminate distractions* *In other words, happy people are obsessive about maintaining their mental clarity.*\n\nSame idea. Different structure. Different impact.\n\nIf you wanted to, you could practice writing the same idea with every single post structure you come across.\n\nHere’s how to practice this:\n\n**First**, break down 3 ideas into their structure.\n\nChoose 3 posts from your idea museum that resonated with you. Then, try to break down each part of the idea and write why it works.\n\nIf you don’t have experience with content psychology, that’s okay. You learn it as you practice.\n\nThis is the perfect time to employ AI for help. Try this prompt for each post:\n\n\u003e *Do a comprehensive analysis on this social post. The overall idea, how the sentences are structured, and choice of words. Analyze why people engage with it, why it works so well, what psychological tactics are being used, and how I can replicate this style step-by-step with my own ideas.*\n\nThen paste the post below the prompt.\n\nI’d recommend Claude as the model to use for this over ChatGPT or Gemini.\n\nContinue doing this for any idea you find along your journey that you want to incorporate as part of your writing style. You can use this for videos as well, not just posts.\n\n**Second**, rewrite 3 ideas with different structures.\n\nGo back to your idea museum and choose one idea you didn’t use in step one.\n\nThen, try rewriting that idea with the 3 post structures you just broke down.\n\nThis is how you develop range.\n\nThis is how you stop staring at blank screens.\n\nThis is how you turn one idea into a week’s worth of content.\n\nWhy are we doing this?\n\nWell, you now have all of the secrets to creating content that stands out and coming up with good ideas.\n\nSeriously, those are the secrets. Any results that come from them are a matter of practice.\n\n## VII – Systems are the new product\n\nOkay, this is getting long so I’m going to speed things up.\n\nAnd I have an entire guide on [creating your first product here](https://letters.thedankoe.com/p/mega-guide-how-to-create-your-first)... so don’t want to be redundant.\n\nAt this point in time, we are in a systems economy.\n\nPeople don’t want *a* solution to their problems.\n\nThey want *your* solution to their problems.\n\nThere are tons of writing products out there, so what’s different about my 2 Hour Writer product, as an example? Or even Eden, the software that I’m building that could “easily be replaced by Google Drive or Dropbox,” according to super smart people who have definitely built successful products in the YouTube comments?\n\nThey’re systems that I created by getting results for myself.\n\n2HW doesn’t teach a bunch of academic writing nonsense that doesn’t help you achieve our shared vision of living a creative and meaningful life.\n\nI had a few problems:\n\n- I had trouble having an endless source of content ideas.\n- I didn’t want to waste a ton of time creating content for all different platforms.\n\nSo, I started experimenting with my own system.\n\nMy goal for the system was clear: write all of the content I need to in under 2 hours a day. That way my audience growth is handled and I can focus on building better products and enjoying life.\n\nI started testing solutions to have more content ideas.\n\nI created swipe files, steps to generate ideas, and templates if I still couldn’t think of anything.\n\nI mapped out exactly what I was going to attempt to write each week: 3 posts a day, 1 thread a week, and 1 newsletter a week.\n\nDuring that process, I realized I could cross-post my writing to all social platforms (this is public, you can see it). I also realized that threads could be turned into carousels, and newsletters could be turned into YouTube videos.\n\nIf the system didn’t flow, I would try new things the next week.\n\nFrom there, I realized I could copy paste my newsletter to my blog, embed the YT video in that blog, promote my products in that blog, and turn that blog into more content ideas.\n\nThen, I could link that blog under my content each day.\n\nThis led to more newsletter subscribers, YouTube subscribers, and product sales.\n\nI realized that if everything I did was newsletter centric, that’s all I had to worry about for both growing my audience and promoting my products.\n\nThat’s how you stand out in a world of copy paste products.\n\nYes, it takes time and experience.\n\nBut the end result is so worth it.\n\nThat’s it for this letter.\n\nThank you for reading.\n\n– Dan","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"cde7c20d251e16e6822d34af3f09b8c0b969a23897ad7959111fc756913cb3bd","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eI – The 3 ingredients of individual success \u0026amp; the death of the expert\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:78311f9dcf26dca3d29c484f163c257a0f1e867f170e98777f729a3422b060f7\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"1,2","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eII – You are living through the second renaissance, take advantage of it\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:8ca08f8007390b055a5d467aa7ccfdb957667ffd0c484f848a1271fa9b36427c\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"2,3","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIII – How to turn multiple interests into a lucrative way of life\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:7a0a951f70e8444d9867148176d030ac0470d9222ee745bbf6cbc916902d42ff\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"3,4","tag":"h2"}},{"children":[],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-UVJ89asAM6k6F?format=png\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIV – How to turn yourself into a business\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:e67f7a2b9f1087cbedfcd82b7848f867a73297e41f9f788853b4de2a73ccc1fe\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"4,5","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eV – Brand is an environment\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:ae18caa6c1b45ca8644a47c0dc5b584ab6882738016017d26e1956aa18976101\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"5,6","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eVI – Content is novel perspectives\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:c29cf65c532ca414275596e214f337d034b725fe1be007e5a45b9fdd6e14175a\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"6,7","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eVII – Systems are the new product\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:b0c972c4f84f08f91f8c4321c97dd304c224d278b01ee4348fbd89d8a58e5d5f\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"7,8","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-UaHxDXYAAa4VR?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eIf you have multiple interests, do not waste the next 2-3 years\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"If you have multiple interests, do not waste the next 2-3 years\" data-note-id=\"note:sha256:ec64c55bbbbde05a253e8c3016192949336f0717d9c2289849fedea959ecf005\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"if-you-have-multiple-interests-do-not-waste-the-next-2-3-years\"\u003eIf you have multiple interests, do not waste the next 2-3 years\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-UaHxDXYAAa4VR?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@thedankoe · \u003ca href=\"https://x.com/thedankoe/article/2010042119121957316\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX Article\u003c/a\u003e · 2026-01-10\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSociety made you think that having multiple interests was a weakness.\u003c/p\u003e\n\u003cp\u003eGo to school.\u003c/p\u003e\n\u003cp\u003eGet a degree.\u003c/p\u003e\n\u003cp\u003eGet a job.\u003c/p\u003e\n\u003cp\u003eRetire at some point.\u003c/p\u003e\n\u003cp\u003eBut there is so much wrong with that sequence of events.\u003c/p\u003e\n\u003cp\u003eWe don’t live in the Industrial Age anymore. Specializing in one skill is almost certain death. I feel like we all know by this point how dangerous mechanical living and siloed learning is for your psyche and soul. And people can feel that we’re going through a \u003cem\u003esecond renaissance\u003c/em\u003e. Your curiosity and love for learning are your advantages in today’s world, but there is something missing.\u003c/p\u003e\n\u003cp\u003eFor the longest time, I learned and learned and learned. I was stuck in tutorial hell. Some may call it shiny object syndrome to point out your lack of focus. I got my dopamine from feeling smart, but my life didn’t change all that much. Honestly, I felt like I was just falling behind. I tried so many different things in college. I had dreams of doing my own thing... earning an income from something creative... but after spending 5 years “learning,” I was met with the reality that I had to get the best job I could find just so I could survive.\u003c/p\u003e\n\u003cp\u003eThe missing piece was a \u003cem\u003evessel\u003c/em\u003e.\u003c/p\u003e\n\u003cp\u003eA vessel that would allow me to \u003cem\u003echannel\u003c/em\u003e all of my interests into meaningful work that I could earn a decent income from.\u003c/p\u003e\n\u003cp\u003eIf you’ve ever felt guilty for not being able to pick one thing, if you’ve been told to niche down when your mind wants to expand, if you’ve wondered whether there’s a path you can take that doesn’t lead to the misery you see in everyone else’s eyes – this is the greatest time to be alive.\u003c/p\u003e\n\u003cp\u003eHere are 7 of the most compelling ideas I could come up with. We’ll start by understanding why having multiple interests is a superpower in today's world, then I’ll give you practical steps to turn that into your life’s work. We have \u003cem\u003ea lot\u003c/em\u003e to talk about, so I hope you’re here for the ride.\u003c/p\u003e\n\u003ch2 id=\"i-the-3-ingredients-of-individual-success-the-death-of-the-expert\"\u003eI – The 3 ingredients of individual success \u0026amp; the death of the expert\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eThe man whose whole life is spent in performing a few simple operations... generally becomes as stupid and ignorant as it is possible for a human creature to become. — Adam Smith\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eFunny you say that Mr. Smith, because you created those people, and we’re still dealing with the backlash.\u003c/p\u003e\n\u003cp\u003eSpecialization took over during industrialization because, in a pin factory, for example, one worker doing every step could make 20 pins a day. Then workers, each doing one step, could make 48,000.\u003c/p\u003e\n\u003cp\u003eSo we built an entire world around this model.\u003c/p\u003e\n\u003cp\u003eHumans became assembly lines working 9 to 5 because frankly, governments don’t serve the national interest, they serve their own interest. Corporations don’t serve the employees interest, they serve their own.\u003c/p\u003e\n\u003cp\u003eSchools were designed to serve that interest. Their sole purpose was to create factory workers who were punctual and obedient.\u003c/p\u003e\n\u003cp\u003eBut this is no way to live.\u003c/p\u003e\n\u003cp\u003eIf you want to have specialized knowledge so that you could never run an operation, especially your own operation, then be dependent on schools for your education and jobs for your wage. Be duped into believing the promise that specialization is what makes a human valuable when it is clear that the system does not need you, specifically, to perform that task.\u003c/p\u003e\n\u003cp\u003eIn lies the distinction.\u003c/p\u003e\n\u003cp\u003eIf pure specialization makes people stupid and dependent, what makes an individual smart and sovereign?\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThree ingredients\u003c/strong\u003e: Self-education, self-interest, self-sufficiency.\u003c/p\u003e\n\u003cp\u003eSelf-education is clear, because if you want to achieve a result different from that of traditional education, you must direct your own learning.\u003c/p\u003e\n\u003cp\u003eSelf-interest raises some flags. It sounds selfish and short-sighted, which many people view as bad without thinking through it, but it simply means “concern with one’s own interest,” because the only other option is to serve the interest of the organizations that compose society as it is, which we’ve discussed. In other words, follow your interest, because your interest can very well benefit others in a selfless way - depending on your level of cognitive and moral development. Oh, and by the way, indulging in short-lived pleasures (cheap dopamine) is usually not your interest, but the interest of corporations that benefit from your mindlessness.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eThe truly selfish person, in Ayn Rand’s view, is a self-respecting, self-supporting human being who neither sacrifices others to himself nor sacrifices himself to others. This rejects both the predator \u003cem\u003eand\u003c/em\u003e the doormat.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSelf-sufficiency is the refusal to outsource your judgment, learning, and agency. If self-education is the engine and self-interest is the compass, self-sufficiency is the foundation that prevents your life direction from being hijacked by another force. They collaborate, but are not fully dependent.\u003c/p\u003e\n\u003cp\u003eThe generalist emerges naturally from this triad.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSelf-interest\u003c/strong\u003e \u003cstrong\u003emotivates\u003c/strong\u003e \u003cstrong\u003eself-education.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYou learn because it genuinely serves your flourishing, not because someone assigned it.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSelf-education\u003c/strong\u003e \u003cstrong\u003eenables\u003c/strong\u003e \u003cstrong\u003eself-sufficiency.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYou can only be sovereign over domains you understand.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSelf-sufficiency\u003c/strong\u003e \u003cstrong\u003eclarifies\u003c/strong\u003e \u003cstrong\u003eself-interest.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWhen you’re not dependent on others’ interpretations, you can actually perceive what serves you. Most people pursue multiple interests as an escape from their work. When your interests become your work, or your life’s work, most of them start to filter out.\u003c/p\u003e\n\u003cp\u003eWhen we look at every CEO, founder, or creative that we actually admire, they are generalists.\u003c/p\u003e\n\u003cp\u003eThey understand enough about marketing to direct it, enough about product to build it, and enough about people to lead them. But they also need to direct the ship. They need to learn and adapt when circumstances change.\u003c/p\u003e\n\u003cp\u003eMore importantly, they understand that ideas across domains complement each other and create a unique way of viewing the world, which allows them to catch novel ideas from the aether and translate them into market value.\u003c/p\u003e\n\u003cp\u003eWhen we look at where the world is today, and if you understand the opportunities available to singular individuals, not just leaders, you will find that the options you have as a natural polymath are extensive. It should spark an immense amount of excitement in you.\u003c/p\u003e\n\u003ch2 id=\"ii-you-are-living-through-the-second-renaissance-take-advantage-of-it\"\u003eII – You are living through the second renaissance, take advantage of it\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eStudy the science of art. Study the art of science. Develop your senses—especially learn how to see. Realize that everything connects to everything else. — Leonardo da Vinci\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eThe ultimate moat, or the final competitive edge worth paying for, in my opinion, is an opinion.\u003c/p\u003e\n\u003cp\u003eA perspective that only you can see, because the uniqueness of your life experience created it. That may just be the last thing anyone else can replicate.\u003c/p\u003e\n\u003cp\u003eAnd since that’s always been the case, why not prioritize that now? Especially when automation is at our doorstep?\u003c/p\u003e\n\u003cp\u003eBut how do you prioritize it? How do you develop it?\u003c/p\u003e\n\u003cp\u003eBy pursuing multiple interests and building something with them.\u003c/p\u003e\n\u003cp\u003eYou see, every interest you’ve ever pursued leaves behind a residue. Every interest increases the number of connections that can be made. Every interest expands and increases the complexity of how you model and interpret reality. The more complex your model of reality, the more problems you can solve, opportunities you can see, and value you can create. \u003cem\u003eSpecialism completely halts this process, and your shiny object syndrome has been trying to tell you this whole time.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eFrom birth until now, you are cultivating a way of seeing things that others can’t. A way of seeing things that AI can only think if you tell it what to think.\u003c/p\u003e\n\u003cp\u003eA person who studied psychology and design sees user behavior differently from the pure designer. A person who learned sales and philosophy closes deals differently than the pure salesman. A person who understands fitness and business builds health companies that MBAs can’t comprehend.\u003c/p\u003e\n\u003cp\u003eYour edge lies more in intersection than it does in expertise.\u003c/p\u003e\n\u003cp\u003eThis is the exact pattern we see in the Renaissance that is coming back with a much stronger force now.\u003c/p\u003e\n\u003cp\u003eConsider what made it possible...\u003c/p\u003e\n\u003cp\u003eBefore the printing press, knowledge was scarce.\u003c/p\u003e\n\u003cp\u003eBooks were copied by hand. A single text could take a scribe months to reproduce. Libraries were rare. Literacy was rarer. If you wanted to learn something outside your trade, you either had access to a monastery or you didn’t learn it.\u003c/p\u003e\n\u003cp\u003eThen Gutenberg changed everything.\u003c/p\u003e\n\u003cp\u003eWithin 50 years, 20 million books flooded Europe. Ideas that once took generations to spread now moved in months. Literacy exploded. The cost of knowledge collapsed.\u003c/p\u003e\n\u003cp\u003eFor the first time in history, a person could realistically pursue \u003cem\u003emultiple\u003c/em\u003e domains of mastery in a single lifetime.\u003c/p\u003e\n\u003cp\u003eThe Renaissance was the result.\u003c/p\u003e\n\u003cp\u003eDa Vinci didn’t pick one thing. He painted, sculpted, engineered, studied anatomy, designed war machines, and mapped the human body. Michelangelo was a painter, sculptor, architect, and poet.\u003c/p\u003e\n\u003cp\u003eUnique minds are finally free to operate the way they are supposed to.\u003c/p\u003e\n\u003cp\u003eThey were supposed to cross disciplines, synthesize connections, and follow curiosity wherever it led, but most of us never realized that.\u003c/p\u003e\n\u003cp\u003eThe printing press was the catalyst for a new type of person to emerge. A person who could learn anything, combine everything, and create what no specialist ever could.\u003c/p\u003e\n\u003cp\u003eIf you enjoy these letters, I send them out 1-2x a week. \u003ca href=\"https://letters.thedankoe.com\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJoin here\u003c/a\u003e if you want to be notified when they go out (because the algorithm probably won't show you them).\u003c/p\u003e\n\u003ch2 id=\"iii-how-to-turn-multiple-interests-into-a-lucrative-way-of-life\"\u003eIII – How to turn multiple interests into a lucrative way of life\u003c/h2\u003e\n\u003cp\u003eThere are a few things we know so far:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYou have multiple interests but feel like you can’t keep learning forever\u003c/li\u003e\n\u003cli\u003eYou have a love for interest-based self-education but have to carve out time \u003cem\u003eoutside\u003c/em\u003e of your career to do it\u003c/li\u003e\n\u003cli\u003eYou understand the need to become self-sufficient but you feel like you don’t have value worth paying for, yet\u003c/li\u003e\n\u003cli\u003eYou need to be able to adapt \u003cem\u003efast\u003c/em\u003e because we don’t know what the future of work looks like\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe question then is, how do we combine all of these things into one \u003cem\u003eway of life?\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eHow do we combine learning and earning into something you can do for work?\u003c/p\u003e\n\u003cp\u003eI’ll try to make this as logical as I can.\u003c/p\u003e\n\u003cp\u003eTo make money from your interests, you need other people to become interested in them too. That part is trivial. If you became interested in something, other people can too, you simply must learn to \u003cem\u003epersuade.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eFurther, you need a way for them to pay you. In this context, that usually means you need to sell a product, because you probably aren’t going to find a job that allows you to express your interests, and investing in stocks or real estate (to any effective degree) requires a good amount of capital.\u003c/p\u003e\n\u003cp\u003eIn other words, you need attention.\u003c/p\u003e\n\u003cp\u003eAttention is one of the last moats.\u003c/p\u003e\n\u003cp\u003eBecause when anyone can write anything or build any software, which ones are going to win? The ones that people \u003cem\u003eknow about.\u003c/em\u003e You can have the greatest product in the world, but if nobody knows about it, the person who can capture and hold attention will run laps around you.\u003c/p\u003e\n\u003cp\u003eAs an aside, and if you’ve been keeping up with the tech space, no, I don’t think everyone will just “build their own software.” Most people don’t even spend 20 minutes cooking their own food. They would rather pay a few bucks for Uber Eats. And people have their own things they want to spend their time on.\u003c/p\u003e\n\u003cp\u003eBack to the point:\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eYou need to become a creator.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eNow, before you cringe and leave, I don’t exactly mean becoming a content creator (well… it’s complicated).\u003c/p\u003e\n\u003cp\u003eI mean that the solution to stop creating for someone else because you need them to give you a paycheck is to create for yourself.\u003c/p\u003e\n\u003cp\u003eHumans, by nature, are creators who were convinced that being a machine would lead to the American Dream. We are tool builders at our core. We thrive in any niche because we create solutions to problems. If a lion were put in Alaska, it would not build shelter and clothing. It would die. A lion belongs in its own niche.\u003c/p\u003e\n\u003cp\u003eThe thing is, every business is a media business now. And remember, you need attention. Where is the attention? Mostly on social media until the next attention preference platform comes around - you’ll need to adapt at that point. So yes, if you have multiple interests, it would be wise to become a “content creator,” but it may be easier to think of social media as a mechanism to get your interests in front of other people. It is one piece of the puzzle to do independent work.\u003c/p\u003e\n\u003cp\u003ePlus, that covers all of our bases.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYou love learning?\u003c/strong\u003e Great, reframe it as “research” and now that’s literally your main job. Most of the things I write about simply come from me learning about my interests and treating social media like I’m “taking notes in public.”\u003c/p\u003e\n\u003cp\u003e(You’re already spending time learning, now just spend that time learning in public and boom you have the foundation of a business).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYou need to become self-sufficient?\u003c/strong\u003e Well, you’d need a business to do that, and every business needs to attract customers, and you probably don’t give two f*cks about paid ads, SEO, or any other form of marketing. This is what trips many people up because they are only used to doing one specialized task within a business as an employee.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYou need to be able to adapt?\u003c/strong\u003e Amazing, you can build and launch new products to your audience as fast as you can build them. I have a solid audience, and if my next product were to fail, I have people who would be willing to invest, be a part of the team, or support the next product. You can build your little SaaS company, but if you don’t have distribution, you are putting in marathons of extra leg work into getting capital, finding talent, and getting things off the ground.\u003c/p\u003e\n\u003cp\u003eNo other job or business model allows you to do just that with so much freedom.\u003c/p\u003e\n\u003cp\u003eBut how do you actually start building it?\u003c/p\u003e\n\u003cp\u003eHow do you tie all of this together?\u003c/p\u003e\n\u003ch2 id=\"iv-how-to-turn-yourself-into-a-business\"\u003eIV – How to turn yourself into a business\u003c/h2\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-UVJ89asAM6k6F?format=png\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003eIt’s unfortunate that “entrepreneurship” and “business” have become dirty words that make people think they aren’t qualified to take that path, so much so that when an opportunity comes up, they don’t even notice it.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eIf you’ve ever helped someone with your interests, you’re qualified to start a business.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eThey no longer require upfront capital. They are not reserved for unethical elites. They are not only for people who want to make a lot of money. And they are not only for talented or special people.\u003c/p\u003e\n\u003cp\u003eThe reality is that entrepreneurship is in our nature. It is modern survival. We are wired to create and distribute value to a tribe of like-minded people. We are wired to hunt, explore the unknown, seek novelty, and never stagnate. Psychologically, this is the most enjoyable way of life, even if there are low periods, because those are what allow the (non-artificial) highs to exist.\u003c/p\u003e\n\u003cp\u003eFurther, the barrier of entry has collapsed.\u003c/p\u003e\n\u003cp\u003eAll you really need is a laptop and internet connection.\u003c/p\u003e\n\u003cp\u003eDistribution is now free thanks to social media (well, not free, but skill-based, which can be expensive in time). Anyone can post an idea that reaches millions, and if they have a product, those millions of eyes can result in millions of dollars if you know what you’re doing, and that’s a big if. Most people just love becoming really good at an interest or skill that doesn’t directly impact their success, potentially because they’re afraid of it.\u003c/p\u003e\n\u003cp\u003eTools and technology now handle what used to require teams of people. You have access to AI and a plethora of useful software.\u003c/p\u003e\n\u003cp\u003eNow, there are 2 paths you can take to start.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePath 1) Skill-Based\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis is what dominated the internet for the longest time. You “learn a marketable skill.” You teach that skill through content. Then you sell a product or service related to that skill.\u003c/p\u003e\n\u003cp\u003eThe limitation here is the limitation of being a specialist. It is one-dimensional. You put yourself in a box. You “niche down” because you were told it is more profitable, and since you’re chasing profit over interest, you tend to build yourself into a second 9-5 where you do work you don’t care about for people you don’t care about.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePath 2) Development-Based\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe creators that win right now are those without a niche they can be pinned down to. Typically, they are focused on one of the 4 eternal markets: health, wealth, relationships, happiness. Or even all of them. Technically, everyone’s niche is self-actualization, they are just all taking infinitely unique paths to get there.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThey pursue your own goals (brand).\u003c/li\u003e\n\u003cli\u003eThey teach what you learn (content).\u003c/li\u003e\n\u003cli\u003eThey help others achieve the goal faster (product).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFor those with multiple interests, I obviously recommend this path, because it goes a bit deeper.\u003c/p\u003e\n\u003cp\u003eFirst, when you take this path, you are also taking the first path. Because building your brand, content, and product requires you to become good at \u003cem\u003eall of the relevant marketable skills, so even if you fail, you have something worth paying for.\u003c/em\u003e You are building your business, and you can help others with a specific part of theirs if you are good at it.\u003c/p\u003e\n\u003cp\u003eSecond, it flips the traditional model on its head.\u003c/p\u003e\n\u003cp\u003eYou don’t create a customer avatar so that you can niche down and only focus on that. You \u003cem\u003eturn yourself into the customer avatar.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThat makes things much more palatable.\u003c/p\u003e\n\u003cp\u003eYou pursue your goals in life and develop yourself → you have already validated the usefulness of what you will offer → you help the past version of yourself reach that same goal.\u003c/p\u003e\n\u003cp\u003eDon’t be a YouTube creator.\u003c/p\u003e\n\u003cp\u003eDon’t be a personal brand.\u003c/p\u003e\n\u003cp\u003eDon’t be an influencer.\u003c/p\u003e\n\u003cp\u003eBe you. But in a place where your work can be discovered, followed, and supported. Right now and for the foreseeable future, that’s on the internet.\u003c/p\u003e\n\u003cp\u003eJordan Peterson (or others like him) isn’t a “content creator,” even though that’s how it seems on the surface.\u003c/p\u003e\n\u003cp\u003eHe goes on tours, writes books, leverages social media as a base, and uses all of the \u003cem\u003etools\u003c/em\u003e at his disposal to \u003cstrong\u003espread his life’s work\u003c/strong\u003e. He isn’t worried about the latest content idea trend. His mind outperforms any of those myopic growth strategies. The quality of his ideas is what sets him apart and changes people’s lives (regardless of your opinion on Peterson).\u003c/p\u003e\n\u003cp\u003eWith that, I want to provide a different perspective on brand, content, and product. That way you can use this as a vessel for your life’s work.\u003c/p\u003e\n\u003ch2 id=\"v-brand-is-an-environment\"\u003eV – Brand is an environment\u003c/h2\u003e\n\u003cp\u003eStop thinking of your brand as a profile picture and social media bio.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBrand is an environment where people come to transform.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eBrand is the little world you are inviting others into.\u003c/p\u003e\n\u003cp\u003eBrand isn’t illustrated when a reader first visits your profile.\u003c/p\u003e\n\u003cp\u003eBrand is the accumulation of ideas in your reader’s mind after 3-6 months of following you.\u003c/p\u003e\n\u003cp\u003eYou illustrate your worldview, story, and philosophy for life across every single touchpoint. Your banner, profile picture, bio, link in bio, landing page design, pinned content, posts, threads, newsletters, videos, and the rest.\u003c/p\u003e\n\u003cp\u003eIn other words, your brand is this:\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-UVCNja0AAu07X?format=png\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003eYour brand is your story.\u003c/p\u003e\n\u003cp\u003eIt would help to spend a day writing out where you came from, the “low” points of your life, the experiences you’ve had and skills you’ve acquired, and how those things have helped you the most.\u003c/p\u003e\n\u003cp\u003eWhen you’re thinking of ideas, content, or products, you should filter them through your story. This doesn’t mean you have to talk about yourself all the time. It means you have to align what you’re saying so that your brand is cohesive.\u003c/p\u003e\n\u003cp\u003eThe difficult part is realizing that your story is worth telling, even if you think it’s boring or haven’t reflected on your growth.\u003c/p\u003e\n\u003cp\u003eThe point:\u003c/p\u003e\n\u003cp\u003eYour bio and profile picture do not matter. There are literal people with one word in their bio and a singular color for their profile picture.\u003c/p\u003e\n\u003cp\u003eMy recommendation:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMake a list of 5-10 people you respect online\u003c/li\u003e\n\u003cli\u003eLook at their profile picture, bio, and content\u003c/li\u003e\n\u003cli\u003eTake mental note of patterns between them\u003c/li\u003e\n\u003cli\u003eStart formulating what you should do for your own brand, with your own little spin\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIn all honesty, I wouldn’t overcomplicate this or even worry about it. Your brand will take shape as you start writing content. We could even say that brand \u003cem\u003eis\u003c/em\u003e content, so we need to get that right.\u003c/p\u003e\n\u003cp\u003eThis article on the \u003ca href=\"https://letters.thedankoe.com/p/how-to-build-a-world-the-2-hour-content?lli=1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003econtent ecosystem to build your own\u003c/a\u003e world may help.\u003c/p\u003e\n\u003ch2 id=\"vi-content-is-novel-perspectives\"\u003eVI – Content is novel perspectives\u003c/h2\u003e\n\u003cp\u003eThe internet is a fire hose of information.\u003c/p\u003e\n\u003cp\u003eAI is only adding more noise.\u003c/p\u003e\n\u003cp\u003eThat means trust and signal are more important than ever.\u003c/p\u003e\n\u003cp\u003eIn my opinion, the guiding light for your content should be to curate the best possible ideas in one place. \u003cem\u003eYour brand is a collection of all the ideas you care about, in your own words, under one account on the internet.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eIf you have any plans to do podcasts or public speaking, notice how the best speakers always have 5-10 of their best arguments or ideas top of mind. They repeat these over and over and that’s how they build influence. If you don’t have a set of those 5-10 ideas, then you won’t be as impactful as you could be. Writing a truckload of content is how you discover those ideas.\u003c/p\u003e\n\u003cp\u003eOnce the “idea density” of your content increases with time and effort, that’s what creates a brand worth following and paying for.\u003c/p\u003e\n\u003cp\u003eThe goal of curating ideas to include under your brand should fall at the intersection of:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePerformance\u003c/strong\u003e – the ideas have the potential to “do well.” This is the measure of how much other people will care.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eExcitement\u003c/strong\u003e – the ideas give you a sense of excitement to write about them. This is the measure of how much you care.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArt and business.\u003c/p\u003e\n\u003cp\u003eMetrics and performance shouldn’t determine everything, but they do mean something.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eStep 1) Build an idea museum\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe secret of most creatives you love is that they keep a ruthless curation of notes, ideas, and sources of inspiration.\u003c/p\u003e\n\u003cp\u003eIn other words, they have a “swipe file,” as marketers call it.\u003c/p\u003e\n\u003cp\u003eYou can use \u003ca href=\"https://eden.so/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eEden\u003c/a\u003e (if you have access), Apple Notes, Notion, or whatever else you want, but I want to make this very clear:\u003c/p\u003e\n\u003cp\u003eYou need somewhere to jot down ideas \u003cem\u003eas soon as they come to mind.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThis is a critical habit.\u003c/p\u003e\n\u003cp\u003eWhenever you find an idea that is useful, either now or in the near future, write it down. You don’t need content pillars or 2-3 topics to talk about. The ideas you curate should simply be important to you. That alone means they are relevant to a specific niche of a person: you. However, you can create a \u003ca href=\"https://letters.thedankoe.com/p/the-content-map-how-to-never-run\" target=\"_blank\" rel=\"noopener noreferrer\"\u003econtent map\u003c/a\u003e if you’d like.\u003c/p\u003e\n\u003cp\u003eI don’t care how you structure this. It can be a neat and organized set of documents, or it can be a messy running note without structure. The habit matters more than the format.\u003c/p\u003e\n\u003cp\u003eYou gauge performance by glancing at the likes, views, or general engagement of a post to see if it has the potential to resonate. If the idea falls flat or does worse than their other content, it probably won’t do well for you.\u003c/p\u003e\n\u003cp\u003eYou gauge excitement by noticing when you feel as if you are wasting something valuable if you don’t write it down.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eStep 2) Curate based on idea density\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eHow do you start filling your idea museum?\u003c/p\u003e\n\u003cp\u003eYou need 3-5 sources of information that have high idea density.\u003c/p\u003e\n\u003cp\u003eWhen I say “idea density,” I mean an idea that is high signal.\u003c/p\u003e\n\u003cp\u003eIt’s difficult to explain how to find something that is high signal, because that is subjective. It’s dependent on your level of development (what’s useful for you), your audience’s level of development (what’s useful for them), and your translation from one to another.\u003c/p\u003e\n\u003cp\u003eThe most basic piece of advice could be the most valuable thing in the world for someone else, but it may seem like common knowledge to you.\u003c/p\u003e\n\u003cp\u003eWith time, you will tune your own signal-to-noise ratio by seeing what ideas resonate with your audience and which don’t.\u003c/p\u003e\n\u003cp\u003eThe most idea-dense sources of information:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eOld or little-known books\u003c/strong\u003e – I have 5 books that I reread over and over again because the ideas are so good. These are where the timeless principles live, untouched by trends.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCurated blogs, accounts, or books\u003c/strong\u003e – Blogs like Farnam Street curate the best ideas from modern intellectuals. Accounts like Navalism curate Naval’s best ideas. Books like \u003cem\u003eThe Maxwell Daily Reader\u003c/em\u003e have one of Maxwell’s best ideas one day at a time for a year. These do a lot of the heavy lifting for you, allowing you to pick and choose the best of the best.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHeavy-hitting social accounts\u003c/strong\u003e – I have a list of maybe 5 social accounts that always post great ideas. If I don’t have something to write about, I’ll scroll through their page and find something I have an opinion on and write about that.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFinding these sources takes a few months of discovery. But the result of maintaining an idea museum of dense ideas leads to you creating idea-dense content.\u003c/p\u003e\n\u003cp\u003eYour idea museum becomes a representation of the mind you are attempting to create.\u003c/p\u003e\n\u003cp\u003eThat’s the ultimate goal.\u003c/p\u003e\n\u003cp\u003eTo have a library of content so good that people can’t help but open your emails, turn on post notifications, share your ideas with friends, and think about your ideas often.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eYou become a \u003cem\u003ecurator\u003c/em\u003e of ideas that people wouldn’t even think to ask AI for, and that people would never come across organically.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eThat’s how you become less dependent on the algorithm for your success.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eStep 3) Write 1 idea 1000 different ways\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBecoming a good writer or speaker isn’t only about the idea, but \u003cem\u003ehow the idea is articulated.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eThe idea does a lot of the heavy lifting, but the structure is what makes it engaging, unique, and impactful.\u003c/p\u003e\n\u003cp\u003eLet me show you what I mean.\u003c/p\u003e\n\u003cp\u003eTake this post structure:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003eOne pattern I’ve noticed in happy people: They’re obsessive about maintaining their mental clarity.\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eThe idea here is that happy people maintain their mental clarity.\u003c/p\u003e\n\u003cp\u003eThe structure is formatted in 2 parts: a hook in the form of an observation, and the delivery of what the observation is.\u003c/p\u003e\n\u003cp\u003eIt seems simple, but the difference in the structure of an idea can make all the difference.\u003c/p\u003e\n\u003cp\u003eNow, if I take the same idea but use a “list” structure:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003eHappy people are clear-minded people:\u003c/em\u003e \u003cem\u003e– They take time for rest\u003c/em\u003e \u003cem\u003e– They focus on one singular goal\u003c/em\u003e \u003cem\u003e– They ruthlessly eliminate distractions\u003c/em\u003e \u003cem\u003eIn other words, happy people are obsessive about maintaining their mental clarity.\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSame idea. Different structure. Different impact.\u003c/p\u003e\n\u003cp\u003eIf you wanted to, you could practice writing the same idea with every single post structure you come across.\u003c/p\u003e\n\u003cp\u003eHere’s how to practice this:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFirst\u003c/strong\u003e, break down 3 ideas into their structure.\u003c/p\u003e\n\u003cp\u003eChoose 3 posts from your idea museum that resonated with you. Then, try to break down each part of the idea and write why it works.\u003c/p\u003e\n\u003cp\u003eIf you don’t have experience with content psychology, that’s okay. You learn it as you practice.\u003c/p\u003e\n\u003cp\u003eThis is the perfect time to employ AI for help. Try this prompt for each post:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003eDo a comprehensive analysis on this social post. The overall idea, how the sentences are structured, and choice of words. Analyze why people engage with it, why it works so well, what psychological tactics are being used, and how I can replicate this style step-by-step with my own ideas.\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eThen paste the post below the prompt.\u003c/p\u003e\n\u003cp\u003eI’d recommend Claude as the model to use for this over ChatGPT or Gemini.\u003c/p\u003e\n\u003cp\u003eContinue doing this for any idea you find along your journey that you want to incorporate as part of your writing style. You can use this for videos as well, not just posts.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSecond\u003c/strong\u003e, rewrite 3 ideas with different structures.\u003c/p\u003e\n\u003cp\u003eGo back to your idea museum and choose one idea you didn’t use in step one.\u003c/p\u003e\n\u003cp\u003eThen, try rewriting that idea with the 3 post structures you just broke down.\u003c/p\u003e\n\u003cp\u003eThis is how you develop range.\u003c/p\u003e\n\u003cp\u003eThis is how you stop staring at blank screens.\u003c/p\u003e\n\u003cp\u003eThis is how you turn one idea into a week’s worth of content.\u003c/p\u003e\n\u003cp\u003eWhy are we doing this?\u003c/p\u003e\n\u003cp\u003eWell, you now have all of the secrets to creating content that stands out and coming up with good ideas.\u003c/p\u003e\n\u003cp\u003eSeriously, those are the secrets. Any results that come from them are a matter of practice.\u003c/p\u003e\n\u003ch2 id=\"vii-systems-are-the-new-product\"\u003eVII – Systems are the new product\u003c/h2\u003e\n\u003cp\u003eOkay, this is getting long so I’m going to speed things up.\u003c/p\u003e\n\u003cp\u003eAnd I have an entire guide on \u003ca href=\"https://letters.thedankoe.com/p/mega-guide-how-to-create-your-first\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ecreating your first product here\u003c/a\u003e... so don’t want to be redundant.\u003c/p\u003e\n\u003cp\u003eAt this point in time, we are in a systems economy.\u003c/p\u003e\n\u003cp\u003ePeople don’t want \u003cem\u003ea\u003c/em\u003e solution to their problems.\u003c/p\u003e\n\u003cp\u003eThey want \u003cem\u003eyour\u003c/em\u003e solution to their problems.\u003c/p\u003e\n\u003cp\u003eThere are tons of writing products out there, so what’s different about my 2 Hour Writer product, as an example? Or even Eden, the software that I’m building that could “easily b
