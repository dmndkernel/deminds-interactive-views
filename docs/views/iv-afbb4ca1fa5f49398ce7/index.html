e replaced by Google Drive or Dropbox,” according to super smart people who have definitely built successful products in the YouTube comments?\u003c/p\u003e\n\u003cp\u003eThey’re systems that I created by getting results for myself.\u003c/p\u003e\n\u003cp\u003e2HW doesn’t teach a bunch of academic writing nonsense that doesn’t help you achieve our shared vision of living a creative and meaningful life.\u003c/p\u003e\n\u003cp\u003eI had a few problems:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eI had trouble having an endless source of content ideas.\u003c/li\u003e\n\u003cli\u003eI didn’t want to waste a ton of time creating content for all different platforms.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSo, I started experimenting with my own system.\u003c/p\u003e\n\u003cp\u003eMy goal for the system was clear: write all of the content I need to in under 2 hours a day. That way my audience growth is handled and I can focus on building better products and enjoying life.\u003c/p\u003e\n\u003cp\u003eI started testing solutions to have more content ideas.\u003c/p\u003e\n\u003cp\u003eI created swipe files, steps to generate ideas, and templates if I still couldn’t think of anything.\u003c/p\u003e\n\u003cp\u003eI mapped out exactly what I was going to attempt to write each week: 3 posts a day, 1 thread a week, and 1 newsletter a week.\u003c/p\u003e\n\u003cp\u003eDuring that process, I realized I could cross-post my writing to all social platforms (this is public, you can see it). I also realized that threads could be turned into carousels, and newsletters could be turned into YouTube videos.\u003c/p\u003e\n\u003cp\u003eIf the system didn’t flow, I would try new things the next week.\u003c/p\u003e\n\u003cp\u003eFrom there, I realized I could copy paste my newsletter to my blog, embed the YT video in that blog, promote my products in that blog, and turn that blog into more content ideas.\u003c/p\u003e\n\u003cp\u003eThen, I could link that blog under my content each day.\u003c/p\u003e\n\u003cp\u003eThis led to more newsletter subscribers, YouTube subscribers, and product sales.\u003c/p\u003e\n\u003cp\u003eI realized that if everything I did was newsletter centric, that’s all I had to worry about for both growing my audience and promoting my products.\u003c/p\u003e\n\u003cp\u003eThat’s how you stand out in a world of copy paste products.\u003c/p\u003e\n\u003cp\u003eYes, it takes time and experience.\u003c/p\u003e\n\u003cp\u003eBut the end result is so worth it.\u003c/p\u003e\n\u003cp\u003eThat’s it for this letter.\u003c/p\u003e\n\u003cp\u003eThank you for reading.\u003c/p\u003e\n\u003cp\u003e– Dan\u003c/p\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:78311f9dcf26dca3d29c484f163c257a0f1e867f170e98777f729a3422b060f7":{"html":"\u003cblockquote\u003e\n\u003cp\u003eThe man whose whole life is spent in performing a few simple operations... generally becomes as stupid and ignorant as it is possible for a human creature to become. — Adam Smith\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eFunny you say that Mr. Smith, because you created those people, and we’re still dealing with the backlash.\u003c/p\u003e\n\u003cp\u003eSpecialization took over during industrialization because, in a pin factory, for example, one worker doing every step could make 20 pins a day. Then workers, each doing one step, could make 48,000.\u003c/p\u003e\n\u003cp\u003eSo we built an entire world around this model.\u003c/p\u003e\n\u003cp\u003eHumans became assembly lines working 9 to 5 because frankly, governments don’t serve the national interest, they serve their own interest. Corporations don’t serve the employees interest, they serve their own.\u003c/p\u003e\n\u003cp\u003eSchools were designed to serve that interest. Their sole purpose was to create factory workers who were punctual and obedient.\u003c/p\u003e\n\u003cp\u003eBut this is no way to live.\u003c/p\u003e\n\u003cp\u003eIf you want to have specialized knowledge so that you could never run an operation, especially your own operation, then be dependent on schools for your education and jobs for your wage. Be duped into believing the promise that specialization is what makes a human valuable when it is clear that the system does not need you, specifically, to perform that task.\u003c/p\u003e\n\u003cp\u003eIn lies the distinction.\u003c/p\u003e\n\u003cp\u003eIf pure specialization makes people stupid and dependent, what makes an individual smart and sovereign?\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThree ingredients\u003c/strong\u003e: Self-education, self-interest, self-sufficiency.\u003c/p\u003e\n\u003cp\u003eSelf-education is clear, because if you want to achieve a result different from that of traditional education, you must direct your own learning.\u003c/p\u003e\n\u003cp\u003eSelf-interest raises some flags. It sounds selfish and short-sighted, which many people view as bad without thinking through it, but it simply means “concern with one’s own interest,” because the only other option is to serve the interest of the organizations that compose society as it is, which we’ve discussed. In other words, follow your interest, because your interest can very well benefit others in a selfless way - depending on your level of cognitive and moral development. Oh, and by the way, indulging in short-lived pleasures (cheap dopamine) is usually not your interest, but the interest of corporations that benefit from your mindlessness.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eThe truly selfish person, in Ayn Rand’s view, is a self-respecting, self-supporting human being who neither sacrifices others to himself nor sacrifices himself to others. This rejects both the predator \u003cem\u003eand\u003c/em\u003e the doormat.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSelf-sufficiency is the refusal to outsource your judgment, learning, and agency. If self-education is the engine and self-interest is the compass, self-sufficiency is the foundation that prevents your life direction from being hijacked by another force. They collaborate, but are not fully dependent.\u003c/p\u003e\n\u003cp\u003eThe generalist emerges naturally from this triad.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSelf-interest\u003c/strong\u003e \u003cstrong\u003emotivates\u003c/strong\u003e \u003cstrong\u003eself-education.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYou learn because it genuinely serves your flourishing, not because someone assigned it.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSelf-education\u003c/strong\u003e \u003cstrong\u003eenables\u003c/strong\u003e \u003cstrong\u003eself-sufficiency.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYou can only be sovereign over domains you understand.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSelf-sufficiency\u003c/strong\u003e \u003cstrong\u003eclarifies\u003c/strong\u003e \u003cstrong\u003eself-interest.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWhen you’re not dependent on others’ interpretations, you can actually perceive what serves you. Most people pursue multiple interests as an escape from their work. When your interests become your work, or your life’s work, most of them start to filter out.\u003c/p\u003e\n\u003cp\u003eWhen we look at every CEO, founder, or creative that we actually admire, they are generalists.\u003c/p\u003e\n\u003cp\u003eThey understand enough about marketing to direct it, enough about product to build it, and enough about people to lead them. But they also need to direct the ship. They need to learn and adapt when circumstances change.\u003c/p\u003e\n\u003cp\u003eMore importantly, they understand that ideas across domains complement each other and create a unique way of viewing the world, which allows them to catch novel ideas from the aether and translate them into market value.\u003c/p\u003e\n\u003cp\u003eWhen we look at where the world is today, and if you understand the opportunities available to singular individuals, not just leaders, you will find that the options you have as a natural polymath are extensive. It should spark an immense amount of excitement in you.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e The man whose whole life is spent in performing a few simple operations... generally becomes as stupid and ignorant as it is possible for a human creature to become. — Adam Smith\n\nFunny you say that Mr. Smith, because you created those people, and we’re still dealing with the backlash.\n\nSpecialization took over during industrialization because, in a pin factory, for example, one worker doing every step could make 20 pins a day. Then workers, each doing one step, could make 48,000.\n\nSo we built an entire world around this model.\n\nHumans became assembly lines working 9 to 5 because frankly, governments don’t serve the national interest, they serve their own interest. Corporations don’t serve the employees interest, they serve their own.\n\nSchools were designed to serve that interest. Their sole purpose was to create factory workers who were punctual and obedient.\n\nBut this is no way to live.\n\nIf you want to have specialized knowledge so that you could never run an operation, especially your own operation, then be dependent on schools for your education and jobs for your wage. Be duped into believing the promise that specialization is what makes a human valuable when it is clear that the system does not need you, specifically, to perform that task.\n\nIn lies the distinction.\n\nIf pure specialization makes people stupid and dependent, what makes an individual smart and sovereign?\n\n**Three ingredients**: Self-education, self-interest, self-sufficiency.\n\nSelf-education is clear, because if you want to achieve a result different from that of traditional education, you must direct your own learning.\n\nSelf-interest raises some flags. It sounds selfish and short-sighted, which many people view as bad without thinking through it, but it simply means “concern with one’s own interest,” because the only other option is to serve the interest of the organizations that compose society as it is, which we’ve discussed. In other words, follow your interest, because your interest can very well benefit others in a selfless way - depending on your level of cognitive and moral development. Oh, and by the way, indulging in short-lived pleasures (cheap dopamine) is usually not your interest, but the interest of corporations that benefit from your mindlessness.\n\n\u003e The truly selfish person, in Ayn Rand’s view, is a self-respecting, self-supporting human being who neither sacrifices others to himself nor sacrifices himself to others. This rejects both the predator *and* the doormat.\n\nSelf-sufficiency is the refusal to outsource your judgment, learning, and agency. If self-education is the engine and self-interest is the compass, self-sufficiency is the foundation that prevents your life direction from being hijacked by another force. They collaborate, but are not fully dependent.\n\nThe generalist emerges naturally from this triad.\n\n**Self-interest** **motivates** **self-education.**\n\nYou learn because it genuinely serves your flourishing, not because someone assigned it.\n\n**Self-education** **enables** **self-sufficiency.**\n\nYou can only be sovereign over domains you understand.\n\n**Self-sufficiency** **clarifies** **self-interest.**\n\nWhen you’re not dependent on others’ interpretations, you can actually perceive what serves you. Most people pursue multiple interests as an escape from their work. When your interests become your work, or your life’s work, most of them start to filter out.\n\nWhen we look at every CEO, founder, or creative that we actually admire, they are generalists.\n\nThey understand enough about marketing to direct it, enough about product to build it, and enough about people to lead them. But they also need to direct the ship. They need to learn and adapt when circumstances change.\n\nMore importantly, they understand that ideas across domains complement each other and create a unique way of viewing the world, which allows them to catch novel ideas from the aether and translate them into market value.\n\nWhen we look at where the world is today, and if you understand the opportunities available to singular individuals, not just leaders, you will find that the options you have as a natural polymath are extensive. It should spark an immense amount of excitement in you.","sourceFormat":"markdown"},"note:sha256:7a0a951f70e8444d9867148176d030ac0470d9222ee745bbf6cbc916902d42ff":{"blocks":[{"children":[{"title":"You have multiple interests but feel like you can’t keep learning forever"},{"title":"You have a love for interest-based self-education but have to carve out time *outside* of your career to do it"},{"title":"You understand the need to become self-sufficient but you feel like you don’t have value worth paying for, yet"},{"title":"You need to be able to adapt *fast* because we don’t know what the future of work looks like"}],"kind":"section","title":"There are a few things we know so far"},{"children":[],"kind":"leaf","title":"The question then is, how do we combine all of these things into one way of life?"},{"children":[],"kind":"leaf","title":"How do we combine learning and earning into something you can do for work?"},{"children":[],"kind":"leaf","title":"I’ll try to make this as logical as I can."},{"children":[],"kind":"leaf","title":"To make money from your interests, you need other people to become interested in them too. That part is trivial. If you became interested in something, other people can too, you simply must learn to persuade."},{"children":[],"kind":"leaf","title":"Further, you need a way for them to pay you. In this context, that usually means you need to sell a product, because you probably aren’t going to find a job that allows you to express your interests, and investing in stocks or real estate (to any effective degree) requires a good amount of capital."},{"children":[],"kind":"leaf","title":"In other words, you need attention."},{"children":[],"kind":"leaf","title":"Attention is one of the last moats."},{"children":[],"kind":"leaf","title":"Because when anyone can write anything or build any software, which ones are going to win? The ones that people know about. You can have the greatest product in the world, but if nobody knows about it, the person who can capture and hold attention will run laps around you."},{"children":[],"kind":"leaf","title":"As an aside, and if you’ve been keeping up with the tech space, no, I don’t think everyone will just “build their own software.” Most people don’t even spend 20 minutes cooking their own food. They would rather pay a few bucks for Uber Eats. And people have their own things they want to spend their time on."},{"bodyBlocks":[{"kind":"paragraph","text":"You need to become a creator."}],"children":[],"kind":"compound_leaf","lead":"Back to the point:"},{"children":[],"kind":"leaf","title":"Now, before you cringe and leave, I don’t exactly mean becoming a content creator (well… it’s complicated)."},{"children":[],"kind":"leaf","title":"I mean that the solution to stop creating for someone else because you need them to give you a paycheck is to create for yourself."},{"children":[],"kind":"leaf","title":"Humans, by nature, are creators who were convinced that being a machine would lead to the American Dream. We are tool builders at our core. We thrive in any niche because we create solutions to problems. If a lion were put in Alaska, it would not build shelter and clothing. It would die. A lion belongs in its own niche."},{"children":[],"kind":"leaf","title":"The thing is, every business is a media business now. And remember, you need attention. Where is the attention? Mostly on social media until the next attention preference platform comes around - you’ll need to adapt at that point. So yes, if you have multiple interests, it would be wise to become a “content creator,” but it may be easier to think of social media as a mechanism to get your interests in front of other people. It is one piece of the puzzle to do independent work."},{"children":[],"kind":"leaf","title":"Plus, that covers all of our bases."},{"children":[],"kind":"leaf","title":"You love learning? Great, reframe it as “research” and now that’s literally your main job. Most of the things I write about simply come from me learning about my interests and treating social media like I’m “taking notes in public.”"},{"children":[],"kind":"leaf","title":"(You’re already spending time learning, now just spend that time learning in public and boom you have the foundation of a business)."},{"children":[],"kind":"leaf","title":"You need to become self-sufficient? Well, you’d need a business to do that, and every business needs to attract customers, and you probably don’t give two fcks about paid ads, SEO, or any other form of marketing. This is what trips many people up because they are only used to doing one specialized task within a business as an employee."},{"children":[],"kind":"leaf","title":"You need to be able to adapt? Amazing, you can build and launch new products to your audience as fast as you can build them. I have a solid audience, and if my next product were to fail, I have people who would be willing to invest, be a part of the team, or support the next product. You can build your little SaaS company, but if you don’t have distribution, you are putting in marathons of extra leg work into getting capital, finding talent, and getting things off the ground."},{"children":[],"kind":"leaf","title":"No other job or business model allows you to do just that with so much freedom."},{"children":[],"kind":"leaf","title":"But how do you actually start building it?"},{"children":[],"kind":"leaf","title":"How do you tie all of this together?"}],"html":"\u003cp\u003eThere are a few things we know so far:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYou have multiple interests but feel like you can’t keep learning forever\u003c/li\u003e\n\u003cli\u003eYou have a love for interest-based self-education but have to carve out time \u003cem\u003eoutside\u003c/em\u003e of your career to do it\u003c/li\u003e\n\u003cli\u003eYou understand the need to become self-sufficient but you feel like you don’t have value worth paying for, yet\u003c/li\u003e\n\u003cli\u003eYou need to be able to adapt \u003cem\u003efast\u003c/em\u003e because we don’t know what the future of work looks like\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe question then is, how do we combine all of these things into one \u003cem\u003eway of life?\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eHow do we combine learning and earning into something you can do for work?\u003c/p\u003e\n\u003cp\u003eI’ll try to make this as logical as I can.\u003c/p\u003e\n\u003cp\u003eTo make money from your interests, you need other people to become interested in them too. That part is trivial. If you became interested in something, other people can too, you simply must learn to \u003cem\u003epersuade.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eFurther, you need a way for them to pay you. In this context, that usually means you need to sell a product, because you probably aren’t going to find a job that allows you to express your interests, and investing in stocks or real estate (to any effective degree) requires a good amount of capital.\u003c/p\u003e\n\u003cp\u003eIn other words, you need attention.\u003c/p\u003e\n\u003cp\u003eAttention is one of the last moats.\u003c/p\u003e\n\u003cp\u003eBecause when anyone can write anything or build any software, which ones are going to win? The ones that people \u003cem\u003eknow about.\u003c/em\u003e You can have the greatest product in the world, but if nobody knows about it, the person who can capture and hold attention will run laps around you.\u003c/p\u003e\n\u003cp\u003eAs an aside, and if you’ve been keeping up with the tech space, no, I don’t think everyone will just “build their own software.” Most people don’t even spend 20 minutes cooking their own food. They would rather pay a few bucks for Uber Eats. And people have their own things they want to spend their time on.\u003c/p\u003e\n\u003cp\u003eBack to the point:\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eYou need to become a creator.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eNow, before you cringe and leave, I don’t exactly mean becoming a content creator (well… it’s complicated).\u003c/p\u003e\n\u003cp\u003eI mean that the solution to stop creating for someone else because you need them to give you a paycheck is to create for yourself.\u003c/p\u003e\n\u003cp\u003eHumans, by nature, are creators who were convinced that being a machine would lead to the American Dream. We are tool builders at our core. We thrive in any niche because we create solutions to problems. If a lion were put in Alaska, it would not build shelter and clothing. It would die. A lion belongs in its own niche.\u003c/p\u003e\n\u003cp\u003eThe thing is, every business is a media business now. And remember, you need attention. Where is the attention? Mostly on social media until the next attention preference platform comes around - you’ll need to adapt at that point. So yes, if you have multiple interests, it would be wise to become a “content creator,” but it may be easier to think of social media as a mechanism to get your interests in front of other people. It is one piece of the puzzle to do independent work.\u003c/p\u003e\n\u003cp\u003ePlus, that covers all of our bases.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYou love learning?\u003c/strong\u003e Great, reframe it as “research” and now that’s literally your main job. Most of the things I write about simply come from me learning about my interests and treating social media like I’m “taking notes in public.”\u003c/p\u003e\n\u003cp\u003e(You’re already spending time learning, now just spend that time learning in public and boom you have the foundation of a business).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYou need to become self-sufficient?\u003c/strong\u003e Well, you’d need a business to do that, and every business needs to attract customers, and you probably don’t give two f*cks about paid ads, SEO, or any other form of marketing. This is what trips many people up because they are only used to doing one specialized task within a business as an employee.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYou need to be able to adapt?\u003c/strong\u003e Amazing, you can build and launch new products to your audience as fast as you can build them. I have a solid audience, and if my next product were to fail, I have people who would be willing to invest, be a part of the team, or support the next product. You can build your little SaaS company, but if you don’t have distribution, you are putting in marathons of extra leg work into getting capital, finding talent, and getting things off the ground.\u003c/p\u003e\n\u003cp\u003eNo other job or business model allows you to do just that with so much freedom.\u003c/p\u003e\n\u003cp\u003eBut how do you actually start building it?\u003c/p\u003e\n\u003cp\u003eHow do you tie all of this together?\u003c/p\u003e\n","kind":"structured","rawMarkdown":"There are a few things we know so far:\n\n- You have multiple interests but feel like you can’t keep learning forever\n- You have a love for interest-based self-education but have to carve out time *outside* of your career to do it\n- You understand the need to become self-sufficient but you feel like you don’t have value worth paying for, yet\n- You need to be able to adapt *fast* because we don’t know what the future of work looks like\n\nThe question then is, how do we combine all of these things into one *way of life?*\n\nHow do we combine learning and earning into something you can do for work?\n\nI’ll try to make this as logical as I can.\n\nTo make money from your interests, you need other people to become interested in them too. That part is trivial. If you became interested in something, other people can too, you simply must learn to *persuade.*\n\nFurther, you need a way for them to pay you. In this context, that usually means you need to sell a product, because you probably aren’t going to find a job that allows you to express your interests, and investing in stocks or real estate (to any effective degree) requires a good amount of capital.\n\nIn other words, you need attention.\n\nAttention is one of the last moats.\n\nBecause when anyone can write anything or build any software, which ones are going to win? The ones that people *know about.* You can have the greatest product in the world, but if nobody knows about it, the person who can capture and hold attention will run laps around you.\n\nAs an aside, and if you’ve been keeping up with the tech space, no, I don’t think everyone will just “build their own software.” Most people don’t even spend 20 minutes cooking their own food. They would rather pay a few bucks for Uber Eats. And people have their own things they want to spend their time on.\n\nBack to the point:\n\n*You need to become a creator.*\n\nNow, before you cringe and leave, I don’t exactly mean becoming a content creator (well… it’s complicated).\n\nI mean that the solution to stop creating for someone else because you need them to give you a paycheck is to create for yourself.\n\nHumans, by nature, are creators who were convinced that being a machine would lead to the American Dream. We are tool builders at our core. We thrive in any niche because we create solutions to problems. If a lion were put in Alaska, it would not build shelter and clothing. It would die. A lion belongs in its own niche.\n\nThe thing is, every business is a media business now. And remember, you need attention. Where is the attention? Mostly on social media until the next attention preference platform comes around - you’ll need to adapt at that point. So yes, if you have multiple interests, it would be wise to become a “content creator,” but it may be easier to think of social media as a mechanism to get your interests in front of other people. It is one piece of the puzzle to do independent work.\n\nPlus, that covers all of our bases.\n\n**You love learning?** Great, reframe it as “research” and now that’s literally your main job. Most of the things I write about simply come from me learning about my interests and treating social media like I’m “taking notes in public.”\n\n(You’re already spending time learning, now just spend that time learning in public and boom you have the foundation of a business).\n\n**You need to become self-sufficient?** Well, you’d need a business to do that, and every business needs to attract customers, and you probably don’t give two f*cks about paid ads, SEO, or any other form of marketing. This is what trips many people up because they are only used to doing one specialized task within a business as an employee.\n\n**You need to be able to adapt?** Amazing, you can build and launch new products to your audience as fast as you can build them. I have a solid audience, and if my next product were to fail, I have people who would be willing to invest, be a part of the team, or support the next product. You can build your little SaaS company, but if you don’t have distribution, you are putting in marathons of extra leg work into getting capital, finding talent, and getting things off the ground.\n\nNo other job or business model allows you to do just that with so much freedom.\n\nBut how do you actually start building it?\n\nHow do you tie all of this together?","sourceFormat":"markdown"},"note:sha256:8ca08f8007390b055a5d467aa7ccfdb957667ffd0c484f848a1271fa9b36427c":{"html":"\u003cblockquote\u003e\n\u003cp\u003eStudy the science of art. Study the art of science. Develop your senses—especially learn how to see. Realize that everything connects to everything else. — Leonardo da Vinci\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eThe ultimate moat, or the final competitive edge worth paying for, in my opinion, is an opinion.\u003c/p\u003e\n\u003cp\u003eA perspective that only you can see, because the uniqueness of your life experience created it. That may just be the last thing anyone else can replicate.\u003c/p\u003e\n\u003cp\u003eAnd since that’s always been the case, why not prioritize that now? Especially when automation is at our doorstep?\u003c/p\u003e\n\u003cp\u003eBut how do you prioritize it? How do you develop it?\u003c/p\u003e\n\u003cp\u003eBy pursuing multiple interests and building something with them.\u003c/p\u003e\n\u003cp\u003eYou see, every interest you’ve ever pursued leaves behind a residue. Every interest increases the number of connections that can be made. Every interest expands and increases the complexity of how you model and interpret reality. The more complex your model of reality, the more problems you can solve, opportunities you can see, and value you can create. \u003cem\u003eSpecialism completely halts this process, and your shiny object syndrome has been trying to tell you this whole time.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eFrom birth until now, you are cultivating a way of seeing things that others can’t. A way of seeing things that AI can only think if you tell it what to think.\u003c/p\u003e\n\u003cp\u003eA person who studied psychology and design sees user behavior differently from the pure designer. A person who learned sales and philosophy closes deals differently than the pure salesman. A person who understands fitness and business builds health companies that MBAs can’t comprehend.\u003c/p\u003e\n\u003cp\u003eYour edge lies more in intersection than it does in expertise.\u003c/p\u003e\n\u003cp\u003eThis is the exact pattern we see in the Renaissance that is coming back with a much stronger force now.\u003c/p\u003e\n\u003cp\u003eConsider what made it possible...\u003c/p\u003e\n\u003cp\u003eBefore the printing press, knowledge was scarce.\u003c/p\u003e\n\u003cp\u003eBooks were copied by hand. A single text could take a scribe months to reproduce. Libraries were rare. Literacy was rarer. If you wanted to learn something outside your trade, you either had access to a monastery or you didn’t learn it.\u003c/p\u003e\n\u003cp\u003eThen Gutenberg changed everything.\u003c/p\u003e\n\u003cp\u003eWithin 50 years, 20 million books flooded Europe. Ideas that once took generations to spread now moved in months. Literacy exploded. The cost of knowledge collapsed.\u003c/p\u003e\n\u003cp\u003eFor the first time in history, a person could realistically pursue \u003cem\u003emultiple\u003c/em\u003e domains of mastery in a single lifetime.\u003c/p\u003e\n\u003cp\u003eThe Renaissance was the result.\u003c/p\u003e\n\u003cp\u003eDa Vinci didn’t pick one thing. He painted, sculpted, engineered, studied anatomy, designed war machines, and mapped the human body. Michelangelo was a painter, sculptor, architect, and poet.\u003c/p\u003e\n\u003cp\u003eUnique minds are finally free to operate the way they are supposed to.\u003c/p\u003e\n\u003cp\u003eThey were supposed to cross disciplines, synthesize connections, and follow curiosity wherever it led, but most of us never realized that.\u003c/p\u003e\n\u003cp\u003eThe printing press was the catalyst for a new type of person to emerge. A person who could learn anything, combine everything, and create what no specialist ever could.\u003c/p\u003e\n\u003cp\u003eIf you enjoy these letters, I send them out 1-2x a week. \u003ca href=\"https://letters.thedankoe.com\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJoin here\u003c/a\u003e if you want to be notified when they go out (because the algorithm probably won't show you them).\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e Study the science of art. Study the art of science. Develop your senses—especially learn how to see. Realize that everything connects to everything else. — Leonardo da Vinci\n\nThe ultimate moat, or the final competitive edge worth paying for, in my opinion, is an opinion.\n\nA perspective that only you can see, because the uniqueness of your life experience created it. That may just be the last thing anyone else can replicate.\n\nAnd since that’s always been the case, why not prioritize that now? Especially when automation is at our doorstep?\n\nBut how do you prioritize it? How do you develop it?\n\nBy pursuing multiple interests and building something with them.\n\nYou see, every interest you’ve ever pursued leaves behind a residue. Every interest increases the number of connections that can be made. Every interest expands and increases the complexity of how you model and interpret reality. The more complex your model of reality, the more problems you can solve, opportunities you can see, and value you can create. *Specialism completely halts this process, and your shiny object syndrome has been trying to tell you this whole time.*\n\nFrom birth until now, you are cultivating a way of seeing things that others can’t. A way of seeing things that AI can only think if you tell it what to think.\n\nA person who studied psychology and design sees user behavior differently from the pure designer. A person who learned sales and philosophy closes deals differently than the pure salesman. A person who understands fitness and business builds health companies that MBAs can’t comprehend.\n\nYour edge lies more in intersection than it does in expertise.\n\nThis is the exact pattern we see in the Renaissance that is coming back with a much stronger force now.\n\nConsider what made it possible...\n\nBefore the printing press, knowledge was scarce.\n\nBooks were copied by hand. A single text could take a scribe months to reproduce. Libraries were rare. Literacy was rarer. If you wanted to learn something outside your trade, you either had access to a monastery or you didn’t learn it.\n\nThen Gutenberg changed everything.\n\nWithin 50 years, 20 million books flooded Europe. Ideas that once took generations to spread now moved in months. Literacy exploded. The cost of knowledge collapsed.\n\nFor the first time in history, a person could realistically pursue *multiple* domains of mastery in a single lifetime.\n\nThe Renaissance was the result.\n\nDa Vinci didn’t pick one thing. He painted, sculpted, engineered, studied anatomy, designed war machines, and mapped the human body. Michelangelo was a painter, sculptor, architect, and poet.\n\nUnique minds are finally free to operate the way they are supposed to.\n\nThey were supposed to cross disciplines, synthesize connections, and follow curiosity wherever it led, but most of us never realized that.\n\nThe printing press was the catalyst for a new type of person to emerge. A person who could learn anything, combine everything, and create what no specialist ever could.\n\nIf you enjoy these letters, I send them out 1-2x a week. [Join here](https://letters.thedankoe.com) if you want to be notified when they go out (because the algorithm probably won't show you them).","sourceFormat":"markdown"},"note:sha256:ae18caa6c1b45ca8644a47c0dc5b584ab6882738016017d26e1956aa18976101":{"blocks":[{"children":[],"kind":"leaf","title":"Stop thinking of your brand as a profile picture and social media bio."},{"children":[],"kind":"leaf","title":"Brand is an environment where people come to transform."},{"children":[],"kind":"leaf","title":"Brand is the little world you are inviting others into."},{"children":[],"kind":"leaf","title":"Brand isn’t illustrated when a reader first visits your profile."},{"children":[],"kind":"leaf","title":"Brand is the accumulation of ideas in your reader’s mind after 3-6 months of following you."},{"children":[],"kind":"leaf","title":"You illustrate your worldview, story, and philosophy for life across every single touchpoint. Your banner, profile picture, bio, link in bio, landing page design, pinned content, posts, threads, newsletters, videos, and the rest."},{"bodyBlocks":[{"blockType":"image","kind":"markdown","raw":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/G-UVCNja0AAu07X?format=png\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e"}],"children":[],"kind":"compound_leaf","lead":"In other words, your brand is this:"},{"children":[],"kind":"leaf","title":"Your brand is your story."},{"children":[],"kind":"leaf","title":"It would help to spend a day writing out where you came from, the “low” points of your life, the experiences you’ve had and skills you’ve acquired, and how those things have helped you the most."},{"children":[],"kind":"leaf","title":"When you’re thinking of ideas, content, or products, you should filter them through your story. This doesn’t mean you have to talk about yourself all the time. It means you have to align what you’re saying so that your brand is cohesive."},{"children":[],"kind":"leaf","title":"The difficult part is realizing that your story is worth telling, even if you think it’s boring or haven’t reflected on your growth."},{"bodyBlocks":[{"kind":"paragraph","text":"Your bio and profile picture do not matter. There are literal people with one word in their bio and a singular color for their profile picture."}],"children":[],"kind":"compound_leaf","lead":"The point:"},{"children":[{"title":"Make a list of 5-10 people you respect online"},{"title":"Look at their profile picture, bio, and content"},{"title":"Take mental note of patterns between them"},{"title":"Start formulating what you should do for your own brand, with your own little spin"}],"kind":"section","title":"My recommendation"},{"children":[],"kind":"leaf","title":"In all honesty, I wouldn’t overcomplicate this or even worry about it. Your brand will take shape as you start writing content. We could even say that brand is content, so we need to get that right."},{"children":[],"kind":"leaf","title":"This article on the content ecosystem to build your own world may help."}],"html":"\u003cp\u003eStop thinking of your brand as a profile picture and social media bio.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBrand is an environment where people come to transform.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eBrand is the little world you are inviting others into.\u003c/p\u003e\n\u003cp\u003eBrand isn’t illustrated when a reader first visits your profile.\u003c/p\u003e\n\u003cp\u003eBrand is the accumulation of ideas in your reader’s mind after 3-6 months of following you.\u003c/p\u003e\n\u003cp\u003eYou illustrate your worldview, story, and philosophy for life across every single touchpoint. Your banner, profile picture, bio, link in bio, landing page design, pinned content, posts, threads, newsletters, videos, and the rest.\u003c/p\u003e\n\u003cp\u003eIn other words, your brand is this:\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-UVCNja0AAu07X?format=png\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003eYour brand is your story.\u003c/p\u003e\n\u003cp\u003eIt would help to spend a day writing out where you came from, the “low” points of your life, the experiences you’ve had and skills you’ve acquired, and how those things have helped you the most.\u003c/p\u003e\n\u003cp\u003eWhen you’re thinking of ideas, content, or products, you should filter them through your story. This doesn’t mean you have to talk about yourself all the time. It means you have to align what you’re saying so that your brand is cohesive.\u003c/p\u003e\n\u003cp\u003eThe difficult part is realizing that your story is worth telling, even if you think it’s boring or haven’t reflected on your growth.\u003c/p\u003e\n\u003cp\u003eThe point:\u003c/p\u003e\n\u003cp\u003eYour bio and profile picture do not matter. There are literal people with one word in their bio and a singular color for their profile picture.\u003c/p\u003e\n\u003cp\u003eMy recommendation:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMake a list of 5-10 people you respect online\u003c/li\u003e\n\u003cli\u003eLook at their profile picture, bio, and content\u003c/li\u003e\n\u003cli\u003eTake mental note of patterns between them\u003c/li\u003e\n\u003cli\u003eStart formulating what you should do for your own brand, with your own little spin\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIn all honesty, I wouldn’t overcomplicate this or even worry about it. Your brand will take shape as you start writing content. We could even say that brand \u003cem\u003eis\u003c/em\u003e content, so we need to get that right.\u003c/p\u003e\n\u003cp\u003eThis article on the \u003ca href=\"https://letters.thedankoe.com/p/how-to-build-a-world-the-2-hour-content?lli=1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003econtent ecosystem to build your own\u003c/a\u003e world may help.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Stop thinking of your brand as a profile picture and social media bio.\n\n*Brand is an environment where people come to transform.*\n\nBrand is the little world you are inviting others into.\n\nBrand isn’t illustrated when a reader first visits your profile.\n\nBrand is the accumulation of ideas in your reader’s mind after 3-6 months of following you.\n\nYou illustrate your worldview, story, and philosophy for life across every single touchpoint. Your banner, profile picture, bio, link in bio, landing page design, pinned content, posts, threads, newsletters, videos, and the rest.\n\nIn other words, your brand is this:\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/G-UVCNja0AAu07X?format=png\u0026name=medium\" alt=\"Image\" /\u003e\u003c/div\u003e\n\nYour brand is your story.\n\nIt would help to spend a day writing out where you came from, the “low” points of your life, the experiences you’ve had and skills you’ve acquired, and how those things have helped you the most.\n\nWhen you’re thinking of ideas, content, or products, you should filter them through your story. This doesn’t mean you have to talk about yourself all the time. It means you have to align what you’re saying so that your brand is cohesive.\n\nThe difficult part is realizing that your story is worth telling, even if you think it’s boring or haven’t reflected on your growth.\n\nThe point:\n\nYour bio and profile picture do not matter. There are literal people with one word in their bio and a singular color for their profile picture.\n\nMy recommendation:\n\n- Make a list of 5-10 people you respect online\n- Look at their profile picture, bio, and content\n- Take mental note of patterns between them\n- Start formulating what you should do for your own brand, with your own little spin\n\nIn all honesty, I wouldn’t overcomplicate this or even worry about it. Your brand will take shape as you start writing content. We could even say that brand *is* content, so we need to get that right.\n\nThis article on the [content ecosystem to build your own](https://letters.thedankoe.com/p/how-to-build-a-world-the-2-hour-content?lli=1) world may help.","sourceFormat":"markdown"},"note:sha256:b0c972c4f84f08f91f8c4321c97dd304c224d278b01ee4348fbd89d8a58e5d5f":{"blocks":[{"children":[],"kind":"leaf","title":"Okay, this is getting long so I’m going to speed things up."},{"children":[],"kind":"leaf","title":"And I have an entire guide on creating your first product here... so don’t want to be redundant."},{"children":[],"kind":"leaf","title":"At this point in time, we are in a systems economy."},{"children":[],"kind":"leaf","title":"People don’t want a solution to their problems."},{"children":[],"kind":"leaf","title":"They want your solution to their problems."},{"children":[],"kind":"leaf","title":"There are tons of writing products out there, so what’s different about my 2 Hour Writer product, as an example? Or even Eden, the software that I’m building that could “easily be replaced by Google Drive or Dropbox,” according to super smart people who have definitely built successful products in the YouTube comments?"},{"children":[],"kind":"leaf","title":"They’re systems that I created by getting results for myself."},{"children":[],"kind":"leaf","title":"2HW doesn’t teach a bunch of academic writing nonsense that doesn’t help you achieve our shared vision of living a creative and meaningful life."},{"children":[{"title":"I had trouble having an endless source of content ideas."},{"title":"I didn’t want to waste a ton of time creating content for all different platforms."}],"kind":"section","title":"I had a few problems"},{"children":[],"kind":"leaf","title":"So, I started experimenting with my own system."},{"children":[],"kind":"leaf","title":"My goal for the system was clear: write all of the content I need to in under 2 hours a day. That way my audience growth is handled and I can focus on building better products and enjoying life."},{"children":[],"kind":"leaf","title":"I started testing solutions to have more content ideas."},{"children":[],"kind":"leaf","title":"I created swipe files, steps to generate ideas, and templates if I still couldn’t think of anything."},{"children":[],"kind":"leaf","title":"I mapped out exactly what I was going to attempt to write each week: 3 posts a day, 1 thread a week, and 1 newsletter a week."},{"children":[],"kind":"leaf","title":"During that process, I realized I could cross-post my writing to all social platforms (this is public, you can see it). I also realized that threads could be turned into carousels, and newsletters could be turned into YouTube videos."},{"children":[],"kind":"leaf","title":"If the system didn’t flow, I would try new things the next week."},{"children":[],"kind":"leaf","title":"From there, I realized I could copy paste my newsletter to my blog, embed the YT video in that blog, promote my products in that blog, and turn that blog into more content ideas."},{"children":[],"kind":"leaf","title":"Then, I could link that blog under my content each day."},{"children":[],"kind":"leaf","title":"This led to more newsletter subscribers, YouTube subscribers, and product sales."},{"children":[],"kind":"leaf","title":"I realized that if everything I did was newsletter centric, that’s all I had to worry about for both growing my audience and promoting my products."},{"children":[],"kind":"leaf","title":"That’s how you stand out in a world of copy paste products."},{"children":[],"kind":"leaf","title":"Yes, it takes time and experience."},{"children":[],"kind":"leaf","title":"But the end result is so worth it."},{"children":[],"kind":"leaf","title":"That’s it for this letter."},{"children":[],"kind":"leaf","title":"Thank you for reading."},{"children":[],"kind":"leaf","title":"– Dan"}],"html":"\u003cp\u003eOkay, this is getting long so I’m going to speed things up.\u003c/p\u003e\n\u003cp\u003eAnd I have an entire guide on \u003ca href=\"https://letters.thedankoe.com/p/mega-guide-how-to-create-your-first\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ecreating your first product here\u003c/a\u003e... so don’t want to be redundant.\u003c/p\u003e\n\u003cp\u003eAt this point in time, we are in a systems economy.\u003c/p\u003e\n\u003cp\u003ePeople don’t want \u003cem\u003ea\u003c/em\u003e solution to their problems.\u003c/p\u003e\n\u003cp\u003eThey want \u003cem\u003eyour\u003c/em\u003e solution to their problems.\u003c/p\u003e\n\u003cp\u003eThere are tons of writing products out there, so what’s different about my 2 Hour Writer product, as an example? Or even Eden, the software that I’m building that could “easily be replaced by Google Drive or Dropbox,” according to super smart people who have definitely built successful products in the YouTube comments?\u003c/p\u003e\n\u003cp\u003eThey’re systems that I created by getting results for myself.\u003c/p\u003e\n\u003cp\u003e2HW doesn’t teach a bunch of academic writing nonsense that doesn’t help you achieve our shared vision of living a creative and meaningful life.\u003c/p\u003e\n\u003cp\u003eI had a few problems:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eI had trouble having an endless source of content ideas.\u003c/li\u003e\n\u003cli\u003eI didn’t want to waste a ton of time creating content for all different platforms.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSo, I started experimenting with my own system.\u003c/p\u003e\n\u003cp\u003eMy goal for the system was clear: write all of the content I need to in under 2 hours a day. That way my audience growth is handled and I can focus on building better products and enjoying life.\u003c/p\u003e\n\u003cp\u003eI started testing solutions to have more content ideas.\u003c/p\u003e\n\u003cp\u003eI created swipe files, steps to generate ideas, and templates if I still couldn’t think of anything.\u003c/p\u003e\n\u003cp\u003eI mapped out exactly what I was going to attempt to write each week: 3 posts a day, 1 thread a week, and 1 newsletter a week.\u003c/p\u003e\n\u003cp\u003eDuring that process, I realized I could cross-post my writing to all social platforms (this is public, you can see it). I also realized that threads could be turned into carousels, and newsletters could be turned into YouTube videos.\u003c/p\u003e\n\u003cp\u003eIf the system didn’t flow, I would try new things the next week.\u003c/p\u003e\n\u003cp\u003eFrom there, I realized I could copy paste my newsletter to my blog, embed the YT video in that blog, promote my products in that blog, and turn that blog into more content ideas.\u003c/p\u003e\n\u003cp\u003eThen, I could link that blog under my content each day.\u003c/p\u003e\n\u003cp\u003eThis led to more newsletter subscribers, YouTube subscribers, and product sales.\u003c/p\u003e\n\u003cp\u003eI realized that if everything I did was newsletter centric, that’s all I had to worry about for both growing my audience and promoting my products.\u003c/p\u003e\n\u003cp\u003eThat’s how you stand out in a world of copy paste products.\u003c/p\u003e\n\u003cp\u003eYes, it takes time and experience.\u003c/p\u003e\n\u003cp\u003eBut the end result is so worth it.\u003c/p\u003e\n\u003cp\u003eThat’s it for this letter.\u003c/p\u003e\n\u003cp\u003eThank you for reading.\u003c/p\u003e\n\u003cp\u003e– Dan\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Okay, this is getting long so I’m going to speed things up.\n\nAnd I have an entire guide on [creating your first product here](https://letters.thedankoe.com/p/mega-guide-how-to-create-your-first)... so don’t want to be redundant.\n\nAt this point in time, we are in a systems economy.\n\nPeople don’t want *a* solution to their problems.\n\nThey want *your* solution to their problems.\n\nThere are tons of writing products out there, so what’s different about my 2 Hour Writer product, as an example? Or even Eden, the software that I’m building that could “easily be replaced by Google Drive or Dropbox,” according to super smart people who have definitely built successful products in the YouTube comments?\n\nThey’re systems that I created by getting results for myself.\n\n2HW doesn’t teach a bunch of academic writing nonsense that doesn’t help you achieve our shared vision of living a creative and meaningful life.\n\nI had a few problems:\n\n- I had trouble having an endless source of content ideas.\n- I didn’t want to waste a ton of time creating content for all different platforms.\n\nSo, I started experimenting with my own system.\n\nMy goal for the system was clear: write all of the content I need to in under 2 hours a day. That way my audience growth is handled and I can focus on building better products and enjoying life.\n\nI started testing solutions to have more content ideas.\n\nI created swipe files, steps to generate ideas, and templates if I still couldn’t think of anything.\n\nI mapped out exactly what I was going to attempt to write each week: 3 posts a day, 1 thread a week, and 1 newsletter a week.\n\nDuring that process, I realized I could cross-post my writing to all social platforms (this is public, you can see it). I also realized that threads could be turned into carousels, and newsletters could be turned into YouTube videos.\n\nIf the system didn’t flow, I would try new things the next week.\n\nFrom there, I realized I could copy paste my newsletter to my blog, embed the YT video in that blog, promote my products in that blog, and turn that blog into more content ideas.\n\nThen, I could link that blog under my content each day.\n\nThis led to more newsletter subscribers, YouTube subscribers, and product sales.\n\nI realized that if everything I did was newsletter centric, that’s all I had to worry about for both growing my audience and promoting my products.\n\nThat’s how you stand out in a world of copy paste products.\n\nYes, it takes time and experience.\n\nBut the end result is so worth it.\n\nThat’s it for this letter.\n\nThank you for reading.\n\n– Dan","sourceFormat":"markdown"},"note:sha256:c29cf65c532ca414275596e214f337d034b725fe1be007e5a45b9fdd6e14175a":{"blocks":[{"children":[],"kind":"leaf","title":"The internet is a fire hose of information."},{"children":[],"kind":"leaf","title":"AI is only adding more noise."},{"children":[],"kind":"leaf","title":"That means trust and signal are more important than ever."},{"children":[],"kind":"leaf","title":"In my opinion, the guiding light for your content should be to curate the best possible ideas in one place. Your brand is a collection of all the ideas you care about, in your own words, under one account on the internet."},{"children":[],"kind":"leaf","title":"If you have any plans to do podcasts or public speaking, notice how the best speakers always have 5-10 of their best arguments or ideas top of mind. They repeat these over and over and that’s how they build influence. If you don’t have a set of those 5-10 ideas, then you won’t be as impactful as you could be. Writing a truckload of content is how you discover those ideas.
