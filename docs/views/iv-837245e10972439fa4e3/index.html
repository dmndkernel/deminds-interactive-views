</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-08-28T11:46:06.823Z","language":"en","name":"DeMinds","version":"1.0.27"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Zep：面向智能体记忆的时序知识图谱架构","outlineVersion":1},"sourceRevision":"sha256:ef28a5adcfb07b1fdaf598a3c6666d48a72d70c181abf7a3b9da3980a451c014","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Zep  A Temporal Knowledge Graph Architecture for Agent Memory.md","sourceUrl":"https://arxiv.org/html/2501.13956v1","title":"Zep：面向智能体记忆的时序知识图谱架构"},"files":[{"byteLength":38172,"content":"# Zep：面向智能体记忆的时序知识图谱架构\n\n\u003e 作者：Preston Rasmussen, Pavlo Paliychuk, Travis Beauvais, Jack Ryan, Daniel Chalef\n\u003e 单位：Zep AI\n\u003e [arXiv:2501.13956v1](https://arxiv.org/html/2501.13956v1) · cs.CL · 2025-01-20\n\n## 摘要\n\n我们介绍 Zep，这是一种面向 AI 智能体的新型记忆层服务。在 Deep Memory Retrieval（DMR）基准上，Zep 的表现优于当前最先进系统 MemGPT。此外，在比 DMR 更全面、更具挑战性、也更能反映真实企业应用场景的评测中，Zep 同样表现出色。现有面向基于大语言模型（LLM）的智能体的检索增强生成（RAG）框架，主要局限于静态文档检索；而企业应用要求系统能够从持续对话、业务数据等多种来源动态整合知识。Zep 通过其核心组件 Graphiti 解决了这一根本限制。Graphiti 是一个具备时间感知能力的知识图谱引擎，可动态综合非结构化对话数据与结构化业务数据，同时保留历史关系。在 MemGPT 团队设定为主要评测指标的 DMR 基准中，Zep 展现出更优性能（94.8% 对 93.4%）。除 DMR 外，我们还通过更具挑战性的 LongMemEval 基准进一步验证了 Zep 的能力；该基准通过复杂的时间推理任务，更贴近企业实际使用场景。在这项评测中，相比基线实现，Zep 的准确率最高提升 18.5%，同时响应延迟降低 90%。这种优势在跨会话信息综合、长期上下文维持等企业关键任务中尤为明显，表明 Zep 适合部署于真实世界应用。\n\n## 1 引言\n\n近年来，基于 Transformer 的大语言模型（LLM）对产业界和研究界产生了广泛影响 [[1](#bib.bib1)]。LLM 的一个重要应用方向是构建基于聊天的智能体。然而，这类智能体的能力受到 LLM 上下文窗口、有效上下文利用能力以及预训练阶段获得知识的限制。因此，需要引入额外上下文，以提供分布外（OOD）知识并减少幻觉。\n\n检索增强生成（Retrieval-Augmented Generation，RAG）已成为 LLM 应用中的一个重要研究方向。RAG 利用过去五十年发展起来的信息检索（IR）技术 [[2](#bib.bib2)]，为 LLM 提供所需的领域知识。\n\n现有 RAG 方法主要关注广泛的领域知识和基本静态的语料库，也就是说，加入语料库后的文档内容很少发生变化。要让智能体真正普及到日常生活中，并能够自主解决从简单到高度复杂的问题，它们就需要访问一个持续演化的大型数据语料库，其中既包括用户与智能体之间的交互，也包括相关业务数据与世界数据。我们认为，让智能体拥有这种广泛且动态的“记忆”能力，是实现这一愿景的关键构件；同时我们主张，现有 RAG 方法并不适合这一未来。由于完整对话历史、业务数据集以及其他领域特定内容无法有效装入 LLM 的上下文窗口，因此必须为智能体记忆开发新的方法。为 LLM 驱动的智能体加入记忆并非新概念，此前 MemGPT 已对此进行探索 [[3](#bib.bib3)]。\n\n近期，知识图谱（Knowledge Graph，KG）被用于增强 RAG 架构，以解决传统 IR 技术的诸多不足 [[4](#bib.bib4)]。本文介绍 Zep [[5](#bib.bib5)]，一种由 Graphiti [[6](#bib.bib6)] 驱动的记忆层服务。Graphiti 是一个动态、具备时间感知能力的知识图谱引擎。Zep 可摄取并综合非结构化消息数据与结构化业务数据。Graphiti KG 引擎以无损方式根据新信息动态更新知识图谱，同时维护事实与关系的时间线，包括其有效期间。借助这种方法，知识图谱能够表示一个复杂且不断演化的世界。\n\n由于 Zep 是一个生产系统，我们尤其重视其记忆检索机制的准确性、延迟和可扩展性。我们使用两个现有基准评估这些机制的有效性：MemGPT [[3](#bib.bib3)] 提出的 Deep Memory Retrieval（DMR）任务，以及 LongMemEval 基准 [[7](#bib.bib7)]。\n\n## 2 知识图谱构建\n\n在 Zep 中，记忆由一个具备时间感知能力的动态知识图谱 $\\mathcal{G}=(\\mathcal{N},\\mathcal{E},\\phi)$ 驱动，其中 $\\mathcal{N}$ 表示节点，$\\mathcal{E}$ 表示边，$\\phi:\\mathcal{E}\\to\\mathcal{N}\\times\\mathcal{N}$ 表示形式化关联函数。该图由三个具有层级关系的子图组成：情节子图、语义实体子图和社区子图。\n\n- **情节子图 $\\mathcal{G}_{e}$：** 情节节点（episodes）$n_{i}\\in\\mathcal{N}_{e}$ 以消息、文本或 JSON 的形式保存原始输入数据。情节作为无损数据存储，语义实体和关系从中提取。情节边 $e_{i}\\in\\mathcal{E}_{e}\\subseteq\\phi^{*}(\\mathcal{N}_{e}\\times\\mathcal{N}_{s})$ 将情节与其引用的语义实体连接起来。\n- **语义实体子图 $\\mathcal{G}_{s}$：** 语义实体子图建立在情节子图之上。实体节点（entities）$n_{i}\\in\\mathcal{N}_{s}$ 表示从情节中提取、并与图中现有实体完成消歧解析后的实体。实体边（semantic edges）$e_{i}\\in\\mathcal{E}_{s}\\subseteq\\phi^{*}(\\mathcal{N}_{s}\\times\\mathcal{N}_{s})$ 表示从情节中提取出的实体之间的关系。\n- **社区子图 $\\mathcal{G}_{c}$：** 社区子图构成 Zep 知识图谱的最高层。社区节点（communities）$n_{i}\\in\\mathcal{N}_{c}$ 表示强连接实体的聚类。社区包含对这些聚类的高层摘要，并对 $\\mathcal{G}_{s}$ 的结构提供更全面、更互联的视角。社区边 $e_{i}\\in\\mathcal{E}_{c}\\subseteq\\phi^{*}(\\mathcal{N}_{c}\\times\\mathcal{N}_{s})$ 将社区与其成员实体连接起来。\n\n同时保存原始情节数据和派生的语义实体信息，与人类记忆的心理学模型相呼应。此类模型区分情节记忆和语义记忆：前者表示独立事件，后者则捕捉概念及其含义之间的关联 [[8](#bib.bib8)]。这种方法使使用 Zep 的 LLM 智能体能够形成更复杂、更细致的记忆结构，并更贴近我们对人类记忆系统的理解。知识图谱为表示这类记忆结构提供了有效媒介，而我们将情节子图与语义子图区分开的实现，也借鉴了 AriGraph 中的类似方法 [[9](#bib.bib9)]。\n\n我们使用社区节点表示高层结构和领域概念，这一设计建立在 GraphRAG [[4](#bib.bib4)] 的工作之上，使系统能够形成更全面的领域全局理解。由情节到事实、实体再到社区的层级组织，进一步扩展了现有的分层 RAG 策略 [[10](#bib.bib10)][[11](#bib.bib11)]。\n\n### 2.1 情节\n\nZep 的图谱构建始于摄取称为 Episodes 的原始数据单元。Episode 有三种核心类型：message、text 或 JSON。虽然不同类型在图谱构建过程中需要不同处理方式，但本文重点讨论 message 类型，因为我们的实验聚焦于对话记忆。在本文语境下，一条消息由相对较短的文本组成（一个 LLM 上下文窗口内可容纳多条消息），并带有产生该发言的对应参与者信息。\n\n每条消息都包含一个引用时间戳 $t_{\\text{ref}}$，表示该消息发送的时间。借助这一时间信息，Zep 能够准确识别和提取消息内容中提及的相对日期或不完整日期，例如“下周四”“两周后”或“去年夏天”。Zep 实现了双时态模型，其中时间线 $T$ 表示事件的时间顺序，而时间线 $T^{\\prime}$ 表示 Zep 数据摄取的事务顺序。$T^{\\prime}$ 时间线承担传统数据库审计功能，而 $T$ 时间线则提供额外维度，用于建模对话数据和记忆的动态性质。这种双时态方法是基于 LLM 的知识图谱构建中的一项新进展，也是 Zep 相比此前图谱型 RAG 方案具备多项独特能力的基础。\n\n情节边 $\\mathcal{E}_{e}$ 将情节与从中提取出的实体节点连接起来。情节及其派生语义边维护双向索引，用于追踪边与其来源情节之间的关系。这种设计强化了 Graphiti 情节子图的无损特性，使系统能够同时进行正向和反向遍历：语义产物可以追溯到其来源以便引用或摘录，而情节也可以快速检索相关实体与事实。虽然本文实验并未直接考察这些连接，但我们将在未来工作中进一步研究。\n\n### 2.2 语义实体与事实\n\n#### 2.2.1 实体\n\n实体提取是情节处理的第一阶段。摄取过程中，系统会同时处理当前消息内容和最近 $n$ 条消息，为命名实体识别提供上下文。本文以及 Zep 的通用实现均设置 $n=4$，即提供两个完整对话轮次的上下文用于评估。由于我们重点处理消息，因此说话者会被自动提取为一个实体。完成初步实体提取后，我们采用受 reflexion [[12](#bib.bib12)] 启发的反思技术，以减少幻觉并提高提取覆盖率。系统还会从情节中提取实体摘要，以支持后续实体解析与检索操作。\n\n提取完成后，系统将每个实体名称嵌入到 1024 维向量空间中。借助该嵌入，可以通过余弦相似度搜索在现有图实体节点中检索相似节点。系统还会针对已有实体名称与摘要执行独立的全文搜索，以识别额外候选节点。随后，这些候选节点连同情节上下文一起交由 LLM，并使用我们的实体解析提示词进行处理。当系统识别出重复实体时，会生成更新后的名称和摘要。\n\n完成实体提取与解析后，系统使用预定义 Cypher 查询将数据写入知识图谱。相比让 LLM 生成数据库查询，我们选择这种方式，以确保 schema 格式一致，并降低产生幻觉的可能性。\n\n附录中提供了部分用于图谱构建的提示词。\n\n#### 2.2.2 事实\n\n对于每个包含其关键谓词的事实。重要的是，同一事实可以在不同实体之间被多次提取，使 Graphiti 能够通过超边（hyper-edges）的实现方式对复杂的多实体事实进行建模。\n\n提取完成后，系统会为事实生成嵌入，以便后续整合进图谱。系统采用与实体解析相似的流程执行边去重。用于查找相关边的混合搜索会被限制在拟新增边所连接的同一实体对之间。这个约束不仅可以避免把不同实体之间的相似边错误合并，也能把搜索空间限定为与特定实体对相关的一组边，从而显著降低去重过程的计算复杂度。\n\n#### 2.2.3 时间信息提取与边失效\n\nGraphiti 相比其他知识图谱引擎的一项关键差异化能力，是通过时间信息提取与边失效机制管理动态信息更新。\n\n系统利用 $t_{\\text{ref}}$ 从情节上下文中提取与事实有关的时间信息，因此能够准确提取并以 datetime 形式表示绝对时间戳（例如“Alan Turing was born on June 23, 1912”）和相对时间戳（例如“I started my new job two weeks ago”）。与我们的双时态建模方法一致，系统追踪四个时间戳：$t^{\\prime}\\text{created}$ 和 $t^{\\prime}\\text{expired}\\in T^{\\prime}$ 用于记录事实在系统中被创建或失效的时间；$t_{\\text{valid}}$ 和 $t_{\\text{invalid}}\\in T$ 则记录事实成立的时间范围。这些时间数据与其他事实信息一起存储在边上。\n\n新边的引入可能使数据库中的既有边失效。系统使用 LLM 将新边与语义相关的已有边进行比较，以识别潜在矛盾。当系统发现时间上重叠的矛盾时，会将受影响边的 $t_{\\text{invalid}}$ 设置为使其失效的新边的 $t_{\\text{valid}}$，从而令其失效。按照事务时间线 $T^{\\prime}$，Graphiti 在判断边失效时始终优先采用新信息。\n\n这套完整方法使 Graphiti 能够随着对话演进动态加入数据，同时保留关系的当前状态以及关系随时间演化的历史记录。\n\n### 2.3 社区\n\n建立情节子图与语义子图后，系统通过社区检测构建社区子图。我们的社区检测方法建立在 GraphRAG [[4](#bib.bib4)] 所描述技术的基础之上，但我们采用标签传播算法 [[13](#bib.bib13)]，而非 Leiden 算法 [[14](#bib.bib14)]。之所以做出这一选择，是因为标签传播易于进行动态扩展；随着新数据进入图谱，系统可以在更长时间内维持较准确的社区表示，从而推迟执行完整社区刷新。\n\n这种动态扩展实现了标签传播单次递归步骤的逻辑。当系统向图中加入新的实体节点 $n_{i}\\in\\mathcal{N}_{s}$ 时，会检查其邻居节点所属的社区。系统把新节点分配给其邻居中占相对多数的社区，然后相应更新社区摘要和图谱。尽管这种动态更新能够在数据持续流入系统时高效扩展社区，但得到的社区会逐渐偏离完整运行一次标签传播算法所生成的结果。因此，仍然需要周期性刷新社区。不过，这种动态更新策略提供了一种实用启发式方法，可显著降低延迟与 LLM 推理成本。\n\n遵循 [[4](#bib.bib4)] 的方法，我们的社区节点包含通过迭代式 map-reduce 风格摘要得到的成员节点概述。不过，我们的检索方法与 GraphRAG 的 map-reduce 方法 [[4](#bib.bib4)] 存在显著差异。为支持我们的检索方法，我们会生成社区名称，其中包含社区摘要里的关键词和相关主题。这些名称随后会被嵌入并存储，以支持余弦相似度搜索。\n\n## 3 记忆检索\n\nZep 的记忆检索系统提供强大、复杂且高度可配置的功能。从高层来看，Zep 图搜索 API 实现了这样一个函数：接受文本字符串查询 $\\alpha\\in S$ 作为输入，并返回文本字符串上下文 $\\beta\\in S$ 作为输出。输出 $\\beta$ 包含来自节点和边的格式化数据，LLM 智能体需要这些数据才能对查询 $\\alpha$ 生成准确响应。过程 $f(\\alpha)\\to\\beta$ 由三个不同步骤组成：\n\n- **搜索（$\\varphi$）：** 首先识别可能包含相关信息的候选节点和边。虽然 Zep 使用多种不同的搜索方法，但整体搜索函数可以表示为 $\\varphi:S\\to\\mathcal{E}_{s}^{n}\\times\\mathcal{N}_{s}^{n}\\times\\mathcal{N}_{c}^{n}$。因此，$\\varphi$ 将查询转换为一个三元组，其中包含语义边、实体节点和社区节点列表——这三类图对象均包含相关文本信息。\n- **重排序器（$\\rho$）：** 第二步对搜索结果重新排序。重排序函数或模型接受一组搜索结果，并输出这些结果重排后的版本：$\\rho:{\\varphi(\\alpha),...}\\to\\mathcal{E}_{s}^{n}\\times\\mathcal{N}_{s}^{n}\\times\\mathcal{N}_{c}^{n}$。\n- **构造器（$\\chi$）：** 最后一步由构造器把相关节点和边转换为文本上下文：$\\chi:\\mathcal{E}_{s}^{n}\\times\\mathcal{N}_{s}^{n}\\times\\mathcal{N}c^{n}\\to S$。对于每个 $e_{i}\\in\\mathcal{E}s$，$\\chi$ 返回 fact 以及 $t\\text{valid},t\\text{invalid}$ 字段；对于每个 $n_{i}\\in\\mathcal{N}_{s}$，返回 name 和 summary 字段；对于每个 $n_{i}\\in\\mathcal{N}_{c}$，返回 summary 字段。\n\n基于上述定义，可以将 $f$ 表示为这三个组件的组合：$f(\\alpha)=\\chi(\\rho(\\varphi(\\alpha)))=\\beta$。\n\n上下文字符串模板示例：\n\nFACTS and ENTITIES represent relevant context to the current conversation. These are the most relevant facts and their valid date ranges. If the fact is about an event, the event takes place during this time. format: FACT (Date range: from - to) \u003cFACTS\u003e {facts} \u003c/FACTS\u003e These are the most relevant entities ENTITY_NAME: entity summary \u003cENTITIES\u003e {entities} \u003c/ENTITIES\u003e\n\n### 3.1 搜索\n\nZep 实现了三种搜索函数：余弦语义相似度搜索 $(\\varphi_{\\text{cos}})$、Okapi BM25 全文搜索 $(\\varphi_{\\text{bm25}})$ 和广度优先搜索 $(\\varphi_{\\text{bfs}})$。前两种函数使用 Neo4j 对 Lucene 的实现 [[15](#bib.bib15)][[16](#bib.bib16)]。每种搜索函数在识别相关文档方面都有不同能力，三者共同使用，可在重排序前实现对候选结果的全面覆盖。三类对象对应不同搜索字段：对于 $\\mathcal{E}_{s}$，搜索 fact 字段；对于 $\\mathcal{N}_{s}$，搜索实体名称；对于 $\\mathcal{N}_{c}$，则搜索社区名称，该名称由社区覆盖的相关关键词和短语构成。尽管两者是独立开发的，我们的社区搜索方法在高层上与 LightRAG [[17](#bib.bib17)] 的关键词搜索方法相似。将 LightRAG 的方法与 Graphiti 这类基于图的系统进行混合，是一个值得未来研究的方向。\n\n虽然余弦相似度和全文搜索方法已经在 RAG 中得到充分研究 [[18](#bib.bib18)]，但在 RAG 领域，对知识图谱执行广度优先搜索所受到的关注相对有限，少数例外包括 AriGraph [[9](#bib.bib9)] 和 Distill-SynthKG [[19](#bib.bib19)] 等基于图的 RAG 系统。在 Graphiti 中，广度优先搜索通过识别 $n$ 跳范围内的其他节点和边来扩展初始搜索结果。此外，$\\varphi_{\\text{bfs}}$ 可以接收节点作为搜索参数，从而提供更高的搜索控制能力。这一功能在使用近期情节作为广度优先搜索的种子时尤其有价值，因为系统由此可以把最近提及的实体和关系纳入检索上下文。\n\n三种搜索方法分别针对不同类型的相似性：全文搜索识别词语相似性，余弦相似度捕捉语义相似性，而广度优先搜索揭示上下文相似性——图中距离更近的节点和边往往出现在更相似的对话上下文中。这种多维度的候选结果识别方式，最大化了发现最优上下文的可能性。\n\n### 3.2 重排序器\n\n初始搜索方法的目标是实现高召回率，而重排序器则通过优先排列最相关结果来提高精确率。Zep 支持 Reciprocal Rank Fusion（RRF）[[20](#bib.bib20)] 和 Maximal Marginal Relevance（MMR）[[21](#bib.bib21)] 等现有重排序方法。此外，Zep 还实现了基于图的 episode-mentions 重排序器，它会根据实体或事实在对话中被提及的频率对结果排序，使经常被引用的信息更容易被访问。系统也包含 node distance 重排序器，它根据结果与指定中心节点之间的图距离进行重排，从而提供局部化到知识图谱特定区域的上下文。系统最复杂的重排序能力使用 cross-encoder：这类 LLM 通过交叉注意力对节点和边与查询之间的相关性进行评估，并生成相关性分数，但这种方式的计算成本也最高。\n\n## 4 实验\n\n本节分析两个使用基于 LLM 记忆基准开展的实验。第一项评测采用 [[3](#bib.bib3)] 提出的 Deep Memory Retrieval（DMR）任务，该任务使用论文 “Beyond Goldfish Memory: Long-Term Open-Domain Conversation” [[22](#bib.bib22)] 所引入 Multi-Session Chat 数据集中的 500 个对话子集。第二项评测使用 “LongMemEval: Benchmarking Chat Assistants on Long-Term Interactive Memory” [[7](#bib.bib7)] 提出的 LongMemEval 基准。具体而言，我们使用 LongMemEvals 数据集，其提供平均约 115,000 tokens 的大规模对话上下文。\n\n在两个实验中，我们都通过 Zep API 将对话历史整合进 Zep 知识图谱。随后，使用第 3 节所述技术检索最相关的 20 条边（facts）和实体节点（entity summaries）。系统随后将这些数据重新格式化为上下文字符串，与 Zep 记忆 API 所提供的功能保持一致。\n\n虽然这些实验展示了 Graphiti 的关键检索能力，但它们只覆盖系统完整搜索功能的一个子集。这样的聚焦范围便于与现有基准进行清晰比较，同时将更多知识图谱能力的探索留待未来工作。\n\n### 4.1 模型选择\n\n实验实现同时使用 BAAI 的 BGE-m3 模型执行重排序和嵌入任务 [[23](#bib.bib23)] [[24](#bib.bib24)]。图谱构建与响应生成方面，我们使用 gpt-4o-mini-2024-07-18 进行图谱构建，并分别使用 gpt-4o-mini-2024-07-18 和 gpt-4o-2024-11-20 作为聊天智能体，根据给定上下文生成响应。\n\n为确保可与 MemGPT 的 DMR 结果直接比较，我们还使用 gpt-4-turbo-2024-04-09 执行了 DMR 评测。\n\n实验 notebook 将通过我们的 GitHub 仓库公开，相关实验提示词也收录于附录。\n\n### 4.2 Deep Memory Retrieval（DMR）\n\n[[3](#bib.bib3)] 提出的 Deep Memory Retrieval 评测包含 500 个多会话对话，每个对话由 5 个聊天会话构成，每个会话最多 12 条消息。每个对话都包含一组用于记忆评估的问答对。MemGPT 框架 [[3](#bib.bib3)] 当前以 gpt-4-turbo 达到 93.4% 准确率，在性能指标上处于领先位置；相比之下，递归摘要基线仅为 35.3%。\n\n为了建立可比较的基线，我们实现了两种常见的 LLM 记忆方法：完整对话上下文和会话摘要。使用 gpt-4-turbo 时，完整对话基线达到 94.4% 准确率，略高于 MemGPT 报告的结果；会话摘要基线则达到 78.6%。使用 gpt-4o-mini 时，两种方法均取得更高表现：完整对话为 98.0%，会话摘要为 88.0%。由于 MemGPT 已发表工作中提供的方法细节不足，我们无法使用 gpt-4o-mini 复现其结果。\n\n随后，我们通过摄取对话并使用 Zep 搜索函数检索最相关的前 10 个节点和边，对 Zep 的性能进行评估。LLM judge 将智能体响应与给定的标准答案进行比较。Zep 使用 gpt-4-turbo 时达到 94.8% 准确率，使用 gpt-4o-mini 时达到 98.2%，相较 MemGPT 以及各自对应的完整对话基线均有小幅提升。不过，这些结果需要结合具体背景理解：每个对话只有 60 条消息，很容易放入当前 LLM 的上下文窗口。\n\nDMR 评测的局限性不止在于规模较小。我们的分析发现，该基准在设计上存在明显不足。评测完全依赖单轮事实检索问题，无法考察复杂的记忆理解能力。许多问题采用含糊表述，例如“最喜欢用来放松的饮料”或“奇怪的爱好”，但这些概念在对话中并未被明确描述为此类属性。最关键的是，该数据集无法很好代表真实企业环境中的 LLM 智能体用例。现代 LLM 仅使用简单的完整上下文方法就能取得很高性能，这进一步凸显了该基准在评估记忆系统方面的不足。\n\n[[7](#bib.bib7)] 的研究结果进一步印证了这一不足：随着对话长度增加，LLM 在 LongMemEval 基准上的性能快速下降。LongMemEval 数据集 [[7](#bib.bib7)] 通过更长、更连贯的对话和更多样化的评测问题解决了许多上述缺陷，也因此更贴近企业应用场景。\n\n表 1：Deep Memory Retrieval\n\n| 记忆方法 | 模型 | 得分 |\n| --- | --- | --- |\n| 递归摘要 † | gpt-4-turbo | 35.3% |\n| 对话摘要 | gpt-4-turbo | 78.6% |\n| MemGPT † | gpt-4-turbo | 93.4% |\n| 完整对话 | gpt-4-turbo | 94.4% |\n| Zep | gpt-4-turbo | 94.8% |\n| 对话摘要 | gpt-4o-mini | 88.0% |\n| 完整对话 | gpt-4o-mini | 98.0% |\n| Zep | gpt-4o-mini | 98.2% |\n\n- † 结果来自 [[3](#bib.bib3)]。\n\n### 4.3 LongMemEval（LME）\n\n我们使用 LongMemEval${s}$ 数据集评估 Zep。该数据集提供能够代表 LLM 智能体真实业务应用的对话与问题。LongMemEval${s}$ 数据集对现有 LLM 和商业记忆解决方案构成显著挑战 [[7](#bib.bib7)]，其中对话平均长度约为 115,000 tokens。尽管这一长度已经相当可观，但仍位于当前前沿模型的上下文窗口范围内，因此我们可以为评估 Zep 性能建立具有意义的基线。\n\n该数据集包含六种不同问题类型：single-session-user、single-session-assistant、single-session-preference、multi-session、knowledge-update 和 temporal-reasoning。这些类别在数据集中的分布并不均匀；详细分布信息请参见 [[7](#bib.bib7)]。\n\n所有实验均在 2024 年 12 月至 2025 年 1 月期间完成。测试使用一台位于美国马萨诸塞州波士顿住宅网络中的消费级笔记本电脑，并连接到托管于 AWS us-west-2 的 Zep 服务。这种分布式架构在评测 Zep 性能时引入了额外网络延迟，而基线评测不存在该延迟。\n\n答案评测方面，我们使用 GPT-4o，并采用 [[7](#bib.bib7)] 提供的针对不同问题类型的专用提示词；这些提示词已显示出与人工评估者较高的一致性。\n\n#### 4.3.1 LongMemEval 与 MemGPT\n\n为了建立 Zep 与当前最先进 MemGPT 系统 [[3](#bib.bib3)] 之间的对比基准，我们尝试使用 LongMemEval 数据集评估 MemGPT。由于当前 MemGPT 框架不支持直接摄取已有消息历史，我们通过将对话消息加入 archival history 的方式实现了一个变通方案。然而，使用这种方法时，我们无法成功得到问题回答。我们期待其他研究团队未来对该基准开展评测，因为更多对比性能数据将有助于整个 LLM 记忆系统领域的发展。\n\n#### 4.3.2 LongMemEval 结果\n\n在两种模型配置下，相比基线，Zep 都在准确率和延迟方面取得显著改善。使用 gpt-4o-mini 时，Zep 的准确率相比基线提高 15.2%；使用 gpt-4o 时，提高 18.5%。更小的 prompt 规模也使延迟和成本相较基线实现显著下降。\n\n表 2：LongMemEvals\n\n按问题类型分析可见，使用 Zep 的 gpt-4o-mini 在六个类别中的四个类别取得提升，其中在更复杂的问题类型——single-session-preference、multi-session 和 temporal-reasoning——上的提升最为显著。使用 gpt-4o 时，Zep 在 knowledge-update 类别也表现出进一步提升，表明其与能力更强的模型搭配时效果更好。不过，要提升能力较弱模型对 Zep 时间数据的理解，仍可能需要进一步开发。\n\n表 3：LongMemEvals 问题类型细分\n\n这些结果表明，Zep 能够在不同模型规模上提升性能；与能力更强的模型搭配时，复杂且细致的问题类型中表现提升最为明显。延迟改善尤其值得关注：在保持更高准确率的同时，Zep 将响应时间缩短了约 90%。\n\nsingle-session-assistant 类问题的性能下降——gpt-4o 下降 17.7%，gpt-4o-mini 下降 9.06%——是 Zep 整体持续提升趋势中的一个显著例外，也表明仍需要进一步的研究与工程工作。\n\n## 5 结论\n\n本文介绍了 Zep，一种面向 LLM 记忆的图结构方法，它将语义记忆和情节记忆与实体摘要、社区摘要结合起来。评测结果表明，Zep 在现有记忆基准上达到最先进性能，同时降低了 token 成本，并以显著更低的延迟运行。\n\nGraphiti 与 Zep 当前取得的结果虽然令人瞩目，但很可能只是图结构记忆系统发展的早期成果。未来可以沿多个研究方向继续扩展这些框架，包括将其他 GraphRAG 方法集成到 Zep 范式中，以及对我们的工作进行新的拓展。\n\n已有研究证明，在 GraphRAG 范式中使用微调模型执行基于 LLM 的实体与边提取具有价值，既可提高准确率，也可降低成本与延迟 [[19](#bib.bib19)][[25](#bib.bib25)]。针对 Graphiti 提示词进行类似微调的模型，可能进一步增强知识提取能力，尤其是在复杂对话中。此外，尽管当前关于 LLM 生成知识图谱的研究主要在没有形式化 ontology 的情况下开展 [[9](#bib.bib9)][[4](#bib.bib4)][[17](#bib.bib17)][[19](#bib.bib19)][[26](#bib.bib26)]，领域特定 ontology 仍具有很大潜力。图 ontology 是前 LLM 时代知识图谱工作的基础之一，值得在 Graphiti 框架内进一步研究。\n\n在寻找合适的记忆基准时，我们发现可用选项十分有限。现有基准往往缺乏稳健性与复杂性，并经常退化为简单的“大海捞针”式事实检索问题 [[3](#bib.bib3)]。该领域需要更多记忆基准，尤其是能够反映客户体验等业务应用的基准，以有效评估并区分不同记忆方法。值得注意的是，目前没有现有基准能够充分评估 Zep 将对话历史与结构化业务数据共同处理和综合的能力。虽然 Zep 聚焦于 LLM 记忆，但其传统 RAG 能力也应在 [[17](#bib.bib17)]、[[27](#bib.bib27)] 和 [[28](#bib.bib28)] 等工作中的成熟基准上接受评估。\n\n当前关于 LLM 记忆和 RAG 系统的文献，对生产系统在成本和延迟方面的可扩展性关注不足。我们在本文中加入了检索机制的延迟基准，以开始填补这一空白，并沿用了 LightRAG 作者重视这些指标的做法。\n\n## 6 附录\n\n### 6.1 图谱构建提示词\n\n#### 6.1.1 实体提取\n\n\u003cPREVIOUS MESSAGES\u003e {previous_messages} \u003c/PREVIOUS MESSAGES\u003e \u003cCURRENT MESSAGE\u003e {current_message} \u003c/CURRENT MESSAGE\u003e Given the above conversation, extract entity nodes from the CURRENT MESSAGE that are explicitly or implicitly mentioned: Guidelines: 1. ALWAYS extract the speaker/actor as the first node. The speaker is the part before the colon in each line of dialogue. 2. Extract other significant entities, concepts, or actors mentioned in the CURRENT MESSAGE. 3. DO NOT create nodes for relationships or actions. 4. DO NOT create nodes for temporal information like dates, times or years (these will be added to edges later). 5. Be as explicit as possible in your node names, using full names. 6. DO NOT extract entities mentioned only\n\n#### 6.1.2 实体解析\n\n\u003cPREVIOUS MESSAGES\u003e {previous_messages} \u003c/PREVIOUS MESSAGES\u003e \u003cCURRENT MESSAGE\u003e {current_message} \u003c/CURRENT MESSAGE\u003e \u003cEXISTING NODES\u003e {existing_nodes} \u003c/EXISTING NODES\u003e Given the above EXISTING NODES, MESSAGE, and PREVIOUS MESSAGES. Determine if the NEW NODE extracted from the conversation is a duplicate entity of one of the EXISTING NODES. \u003cNEW NODE\u003e {new_node} \u003c/NEW NODE\u003e Task: 1. If the New Node represents the same entity as any node in Existing Nodes, return ’is_duplicate: true’ in the response. Otherwise, return ’is_duplicate: false’ 2. If is_duplicate is true, also return the uuid of the existing node in the response 3. If is_duplicate is true, return a name for the node that is the most complete full name. Guidelines: 1. Use both the name and summary of nodes to determine if the entities are duplicates, duplicate nodes may have different names\n\n#### 6.1.3 事实提取\n\n\u003cPREVIOUS MESSAGES\u003e {previous_messages} \u003c/PREVIOUS MESSAGES\u003e \u003cCURRENT MESSAGE\u003e {current_message} \u003c/CURRENT MESSAGE\u003e \u003cENTITIES\u003e {entities} \u003c/ENTITIES\u003e Given the above MESSAGES and ENTITIES, extract all facts pertaining to the listed ENTITIES from the CURRENT MESSAGE. Guidelines: 1. Extract facts only between the provided entities. 2. Each fact should represent a clear relationship between two DISTINCT nodes. 3. The relation_type should be a concise, all-caps description of the fact (e.g., LOVES, IS_FRIENDS_WITH, WORKS_FOR). 4. Provide a more detailed fact containing all relevant information. 5. Consider temporal aspects of relationships when relevant.\n\n#### 6.1.4 事实解析\n\nGiven the following context, determine whether the New Edge represents any of the edges in the list of Existing Edges. \u003cEXISTING EDGES\u003e {existing_edges} \u003c/EXISTING EDGES\u003e \u003cNEW EDGE\u003e {new_edge} \u003c/NEW EDGE\u003e Task: 1. If the New Edges represents the same factual information as any edge in Existing Edges, return ’is_duplicate: true’ in the response. Otherwise, return ’is_duplicate: false’ 2. If is_duplicate is true, also return the uuid of the existing edge in the response Guidelines: 1. The facts do not need to be completely identical to be duplicates, they just need to express the same information.\n\n#### 6.1.5 时间信息提取\n\n\u003cPREVIOUS MESSAGES\u003e {previous_messages} \u003c/PREVIOUS MESSAGES\u003e \u003cCURRENT MESSAGE\u003e {current_message} \u003c/CURRENT MESSAGE\u003e \u003cREFERENCE TIMESTAMP\u003e {reference_timestamp} \u003c/REFERENCE TIMESTAMP\u003e \u003cFACT\u003e {fact} \u003c/FACT\u003e IMPORTANT: Only extract time information if it is part of the provided fact. Otherwise ignore the time mentioned. Make sure to do your best to determine the dates if only the relative time is mentioned. (eg 10 years ago, 2 mins ago) based on the provided reference timestamp If the relationship is not of spanning nature, but you are still able to determine the dates, set the valid_at only. Definitions: - valid_at: The date and time when the relationship described by the edge fact became true or was established. - invalid_at: The date and time when the relationship described by the edge fact stopped being true or ended. Task: Analyze the conversation and determine if there are dates that are part of the edge fact. Only set dates if they explicitly relate to the formation or alteration of the relationship itself. Guidelines: 1. Use ISO 8601 format (YYYY-MM-DDTHH:MM:SS.SSSSSSZ) for datetimes. 2. Use the reference timestamp as the current time when determining the valid_at and invalid_at dates. 3. If the fact is written in the present tense, use the Reference Timestamp for the valid_at date 4. If no temporal information is found that establishes or changes the relationship, leave the fields as null. 5. Do not infer dates from related events. Only use dates that are directly stated to establish or change the relationship. 6. For relative time mentions directly related to the relationship, calculate the actual datetime based on the reference timestamp. 7. If only a date is mentioned without a specific time, use 00:00:00 (midnight) for that date. 8. If only year is mentioned, use January 1st of that year at 00:00:00. 9. Always include the time zone offset (use Z for UTC if no specific time zone is mentioned).\n\n## 参考文献\n\n- [1] Ashish Vaswani, Noam Shazeer, Niki Parmar, J \u003e[28] Nandan Thakur, Nils Reimers, Andreas Rücklé, Abhishek Srivastava, and Iryna Gurevych. Beir: A heterogenous benchmark for zero-shot evaluation of information retrieval models, 2021.\u003c/span\u003e","payload":{"lines":"55,56","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e参考文献\u003c/span\u003e","payload":{"fold":1,"lines":"27,28","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eZep：面向智能体记忆的时序知识图谱架构\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Zep：面向智能体记忆的时序知识图谱架构\" data-note-id=\"note:sha256:e2fe29d3aa71d82f414a3012a41495a959152b0f15ea3fd9d827906ac831fe20\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"zep面向智能体记忆的时序知识图谱架构\"\u003eZep：面向智能体记忆的时序知识图谱架构\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e作者：Preston Rasmussen, Pavlo Paliychuk, Travis Beauvais, Jack Ryan, Daniel Chalef\u003cbr\u003e单位：Zep AI\u003cbr\u003e\u003ca href=\"https://arxiv.org/html/2501.13956v1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003earXiv:2501.13956v1\u003c/a\u003e · cs.CL · 2025-01-20\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"摘要\"\u003e摘要\u003c/h2\u003e\n\u003cp\u003e我们介绍 Zep，这是一种面向 AI 智能体的新型记忆层服务。在 Deep Memory Retrieval（DMR）基准上，Zep 的表现优于当前最先进系统 MemGPT。此外，在比 DMR 更全面、更具挑战性、也更能反映真实企业应用场景的评测中，Zep 同样表现出色。现有面向基于大语言模型（LLM）的智能体的检索增强生成（RAG）框架，主要局限于静态文档检索；而企业应用要求系统能够从持续对话、业务数据等多种来源动态整合知识。Zep 通过其核心组件 Graphiti 解决了这一根本限制。Graphiti 是一个具备时间感知能力的知识图谱引擎，可动态综合非结构化对话数据与结构化业务数据，同时保留历史关系。在 MemGPT 团队设定为主要评测指标的 DMR 基准中，Zep 展现出更优性能（94.8% 对 93.4%）。除 DMR 外，我们还通过更具挑战性的 LongMemEval 基准进一步验证了 Zep 的能力；该基准通过复杂的时间推理任务，更贴近企业实际使用场景。在这项评测中，相比基线实现，Zep 的准确率最高提升 18.5%，同时响应延迟降低 90%。这种优势在跨会话信息综合、长期上下文维持等企业关键任务中尤为明显，表明 Zep 适合部署于真实世界应用。\u003c/p\u003e\n\u003ch2 id=\"1-引言\"\u003e1 引言\u003c/h2\u003e\n\u003cp\u003e近年来，基于 Transformer 的大语言模型（LLM）对产业界和研究界产生了广泛影响 [\u003ca href=\"#bib.bib1\"\u003e1\u003c/a\u003e]。LLM 的一个重要应用方向是构建基于聊天的智能体。然而，这类智能体的能力受到 LLM 上下文窗口、有效上下文利用能力以及预训练阶段获得知识的限制。因此，需要引入额外上下文，以提供分布外（OOD）知识并减少幻觉。\u003c/p\u003e\n\u003cp\u003e检索增强生成（Retrieval-Augmented Generation，RAG）已成为 LLM 应用中的一个重要研究方向。RAG 利用过去五十年发展起来的信息检索（IR）技术 [\u003ca href=\"#bib.bib2\"\u003e2\u003c/a\u003e]，为 LLM 提供所需的领域知识。\u003c/p\u003e\n\u003cp\u003e现有 RAG 方法主要关注广泛的领域知识和基本静态的语料库，也就是说，加入语料库后的文档内容很少发生变化。要让智能体真正普及到日常生活中，并能够自主解决从简单到高度复杂的问题，它们就需要访问一个持续演化的大型数据语料库，其中既包括用户与智能体之间的交互，也包括相关业务数据与世界数据。我们认为，让智能体拥有这种广泛且动态的“记忆”能力，是实现这一愿景的关键构件；同时我们主张，现有 RAG 方法并不适合这一未来。由于完整对话历史、业务数据集以及其他领域特定内容无法有效装入 LLM 的上下文窗口，因此必须为智能体记忆开发新的方法。为 LLM 驱动的智能体加入记忆并非新概念，此前 MemGPT 已对此进行探索 [\u003ca href=\"#bib.bib3\"\u003e3\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e近期，知识图谱（Knowledge Graph，KG）被用于增强 RAG 架构，以解决传统 IR 技术的诸多不足 [\u003ca href=\"#bib.bib4\"\u003e4\u003c/a\u003e]。本文介绍 Zep [\u003ca href=\"#bib.bib5\"\u003e5\u003c/a\u003e]，一种由 Graphiti [\u003ca href=\"#bib.bib6\"\u003e6\u003c/a\u003e] 驱动的记忆层服务。Graphiti 是一个动态、具备时间感知能力的知识图谱引擎。Zep 可摄取并综合非结构化消息数据与结构化业务数据。Graphiti KG 引擎以无损方式根据新信息动态更新知识图谱，同时维护事实与关系的时间线，包括其有效期间。借助这种方法，知识图谱能够表示一个复杂且不断演化的世界。\u003c/p\u003e\n\u003cp\u003e由于 Zep 是一个生产系统，我们尤其重视其记忆检索机制的准确性、延迟和可扩展性。我们使用两个现有基准评估这些机制的有效性：MemGPT [\u003ca href=\"#bib.bib3\"\u003e3\u003c/a\u003e] 提出的 Deep Memory Retrieval（DMR）任务，以及 LongMemEval 基准 [\u003ca href=\"#bib.bib7\"\u003e7\u003c/a\u003e]。\u003c/p\u003e\n\u003ch2 id=\"2-知识图谱构建\"\u003e2 知识图谱构建\u003c/h2\u003e\n\u003cp\u003e在 Zep 中，记忆由一个具备时间感知能力的动态知识图谱 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"\\mathcal{G}=(\\mathcal{N},\\mathcal{E},\\phi)\" role=\"img\" aria-label=\"\\mathcal{G}=(\\mathcal{N},\\mathcal{E},\\phi)\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi mathvariant=\"script\"\u003eG\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi mathvariant=\"script\"\u003eN\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi mathvariant=\"script\"\u003eE\u003c/mi\u003e\u003cmo separator=\"true\"\u003e,\u003c/mo\u003e\u003cmi\u003eϕ\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003c/mrow\u003e\\mathcal{G}=(\\mathcal{N},\\mathcal{E},\\phi)\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7805em;vertical-align:-0.0972em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathcal\" style=\"margin-right:0.0593em;\"\u003eG\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e=\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:1em;vertical-align:-0.25em;\"\u003e\u003c/span\u003e\u003cspan class=\"mopen\"\u003e(\u003c/span\u003e\u003cspan class=\"mord mathcal\" style=\"margin-right:0.1474em;\"\u003eN\u003c/span\u003e\u003cspan class=\"mpunct\"\u003e,\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathcal\" style=\"margin-right:0.0894em;\"\u003eE\u003c/span\u003e\u003cspan class=\"mpunct\"\u003e,\u003c/span\u003e\u003cspan class= u003e\u003cspan class=\"vlist\" style=\"height:0.1514em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:-0.1474em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord mathnormal mtight\"\u003es\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"mclose\"\u003e)\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 将社区与其成员实体连接起来。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e同时保存原始情节数据和派生的语义实体信息，与人类记忆的心理学模型相呼应。此类模型区分情节记忆和语义记忆：前者表示独立事件，后者则捕捉概念及其含义之间的关联 [\u003ca href=\"#bib.bib8\"\u003e8\u003c/a\u003e]。这种方法使使用 Zep 的 LLM 智能体能够形成更复杂、更细致的记忆结构，并更贴近我们对人类记忆系统的理解。知识图谱为表示这类记忆结构提供了有效媒介，而我们将情节子图与语义子图区分开的实现，也借鉴了 AriGraph 中的类似方法 [\u003ca href=\"#bib.bib9\"\u003e9\u003c/a\u003e]。\u003c/p\u003e\n\u003cp\u003e我们使用社区节点表示高层结构和领域概念，这一设计建立在 GraphRAG [\u003ca href=\"#bib.bib4\"\u003e4\u003c/a\u003e] 的工作之上，使系统能够形成更全面的领域全局理解。由情节到事实、实体再到社区的层级组织，进一步扩展了现有的分层 RAG 策略 [\u003ca href=\"#bib.bib10\"\u003e10\u003c/a\u003e][\u003ca href=\"#bib.bib11\"\u003e11\u003c/a\u003e]。\u003c/p\u003e\n\u003ch3 id=\"21-情节\"\u003e2.1 情节\u003c/h3\u003e\n\u003cp\u003eZep 的图谱构建始于摄取称为 Episodes 的原始数据单元。Episode 有三种核心类型：message、text 或 JSON。虽然不同类型在图谱构建过程中需要不同处理方式，但本文重点讨论 message 类型，因为我们的实验聚焦于对话记忆。在本文语境下，一条消息由相对较短的文本组成（一个 LLM 上下文窗口内可容纳多条消息），并带有产生该发言的对应参与者信息。\u003c/p\u003e\n\u003cp\u003e每条消息都包含一个引用时间戳 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"t_{\\text{ref}}\" role=\"img\" aria-label=\"t_{\\text{ref}}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmtext\u003eref\u003c/mtext\u003e\u003c/msub\u003e\u003c/mrow\u003et_{\\text{ref}}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7651em;vertical-align:-0.15em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\"\u003et\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.3361em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord text mtight\"\u003e\u003cspan class=\"mord mtight\"\u003eref\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e，表示该消息发送的时间。借助这一时间信息，Zep 能够准确识别和提取消息内容中提及的相对日期或不完整日期，例如“下周四”“两周后”或“去年夏天”。Zep 实现了双时态模型，其中时间线 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"T\" role=\"img\" aria-label=\"T\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003c/mrow\u003eT\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.6833em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\"\u003eT\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 表示事件的时间顺序，而时间线 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"T^{\\prime}\" role=\"img\" aria-label=\"T^{\\prime}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\"\u003e′\u003c/mo\u003e\u003c/msup\u003e\u003c/mrow\u003eT^{\\prime}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7519em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\"\u003eT\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.7519em;\"\u003e\u003cspan style=\"top:-3.063em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e′\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 表示 Zep 数据摄取的事务顺序。\u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"T^{\\prime}\" role=\"img\" aria-label=\"T^{\\prime}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\"\u003e′\u003c/mo\u003e\u003c/msup\u003e\u003c/mrow\u003eT^{\\prime}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7519em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\"\u003eT\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.7519em;\"\u003e\u003cspan style=\"top:-3.063em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e′\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 时间线承担传统数据库审计功能，而 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"T\" role=\"img\" aria-label=\"T\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003eT\u003c/mi\u003e\u003c/mrow\u003eT\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.6833em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\"\u003eT\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 时间线则提供额外维度，用于建模对话数据和记忆的动态性质。这种双时态方法是基于 LLM 的知识图谱构建中的一项新进展，也是 Zep 相比此前图谱型 RAG 方案具备多项独特能力的基础。\u003c/p\u003e\n\u003cp\u003e情节边 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"\\mathcal{E}_{e}\" role=\"img\" aria-label=\"\\mathcal{E}_{e}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi mathvariant=\"script\"\u003eE\u003c/mi\u003e\u003cmi\u003ee\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003e\\mathcal{E}_{e}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathcal\" style=\"margin-right:0.0894em;\"\u003eE\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.1514em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:-0.0894em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord mathnormal mtight\"\u003ee\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 将情节与从中提取出的实体节点连接起来。情节及其派生语义边维护双向索引，用于追踪边与其来源情节之间的关系。这种设计强化了 Graphiti 情节子图的无损特性，使系统能够同时进行正向和反向遍历：语义产物可以追溯到其来源以便引用或摘录，而情节也可以快速检索相关实体与事实。虽然本文实验并未直接考察这些连接，但我们将在未来工作中进一步研究。\u003c/p\u003e\n\u003ch3 id=\"22-语义实体与事实\"\u003e2.2 语义实体与事实\u003c/h3\u003e\n\u003ch4 id=\"221-实体\"\u003e2.2.1 实体\u003c/h4\u003e\n\u003cp\u003e实体提取是情节处理的第一阶段。摄取过程中，系统会同时处理当前消息内容和最近 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"n\" role=\"img\" aria-label=\"n\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/mrow\u003en\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.4306em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\"\u003en\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 条消息，为命名实体识别提供上下文。本文以及 Zep 的通用实现均设置 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"n=4\" role=\"img\" aria-label=\"n=4\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e4\u003c/mn\u003e\u003c/mrow\u003en=4\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.4306em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\"\u003en\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e=\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.6444em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e4\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e，即提供两个完整对话轮次的上下文用于评估。由于我们重点处理消息，因此说话者会被自动提取为一个实体。完成初步实体提取后，我们采用受 reflexion [\u003ca href=\"#bib.bib12\"\u003e12\u003c/a\u003e] 启发的反思技术，以减少幻觉并提高提取覆盖率。系统还会从情节中提取实体摘要，以支持后续实体解析与检索操作。\u003c/p\u003e\n\u003cp\u003e提取完成后，系统将每个实体名称嵌入到 1024 维向量空间中。借助该嵌入，可以通过余弦相似度搜索在现有图实体节点中检索相似节点。系统还会针对已有实体名称与摘要执行独立的全文搜索，以识别额外候选节点。随后，这些候选节点连同情节上下文一起交由 LLM，并使用我们的实体解析提示词进行处理。当系统识别出重复实体时，会生成更新后的名称和摘要。\u003c/p\u003e\n\u003cp\u003e完成实体提取与解析后，系统使用预定义 Cypher 查询将数据写入知识图谱。相比让 LLM 生成数据库查询，我们选择这种方式，以确保 schema 格式一致，并降低产生幻觉的可能性。\u003c/p\u003e\n\u003cp\u003e附录中提供了部分用于图谱构建的提示词。\u003c/p\u003e\n\u003ch4 id=\"222-事实\"\u003e2.2.2 事实\u003c/h4\u003e\n\u003cp\u003e对于每个包含其关键谓词的事实。重要的是，同一事实可以在不同实体之间被多次提取，使 Graphiti 能够通过超边（hyper-edges）的实现方式对复杂的多实体事实进行建模。\u003c/p\u003e\n\u003cp\u003e提取完成后，系统会为事实生成嵌入，以便后续整合进图谱。系统采用与实体解析相似的流程执行边去重。用于查找相关边的混合搜索会被限制在拟新增边所连接的同一实体对之间。这个约束不仅可以避免把不同实体之间的相似边错误合并，也能把搜索空间限定为与特定实体对相关的一组边，从而显著降低去重过程的计算复杂度。\u003c/p\u003e\n\u003ch4 id=\"223-时间信息提取与边失效\"\u003e2.2.3 时间信息提取与边失效\u003c/h4\u003e\n\u003cp\u003eGraphiti 相比其他知识图谱引擎的一项关键差异化能力，是通过时间信息提取与边失效机制管理动态信息更新。\u003c/p\u003e\n\u003cp\u003e系统利用 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"t_{\\text{ref}}\" role=\"img\" aria-label=\"t_{\\text{ref}}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmtext\u003eref\u003c/mtext\u003e\u003c/msub\u003e\u003c/mrow\u003et_{\\text{ref}}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7651em;vertical-align:-0.15em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\"\u003et\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.3361em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord text mtight\"\u003e\u003cspan class=\"mord mtight\"\u003eref\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 从情节上下文中提取与事实有关的时间信息，因此能够准确提取并以 datetime 形式表示绝对时间戳（例如“Alan Turing was born on June 23, 1912”）和相对时间戳（例如“I started my new job two weeks ago”）。与我们的双时态建模方法一致，系统追踪四个时间戳：\u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"t^{\\prime}\\text{created}\" role=\"img\" aria-label=\"t^{\\prime}\\text{created}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\"\u003e′\u003c/mo\u003e\u003c/msup\u003e\u003cmtext\u003ecreated\u003c/mtext\u003e\u003c/mrow\u003et^{\\prime}\\text{created}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7519em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\"\u003et\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.7519em;\"\u003e\u003cspan style=\"top:-3.063em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset- "\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7651em;vertical-align:-0.15em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\"\u003et\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.3361em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord text mtight\"\u003e\u003cspan class=\"mord mtight\"\u003einvalid\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 设置为使其失效的新边的 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"t_{\\text{valid}}\" role=\"img\" aria-label=\"t_{\\text{valid}}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003et\u003c/mi\u003e\u003cmtext\u003evalid\u003c/mtext\u003e\u003c/msub\u003e\u003c/mrow\u003et_{\\text{valid}}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7651em;vertical-align:-0.15em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\"\u003et\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.3361em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord text mtight\"\u003e\u003cspan class=\"mord mtight\"\u003evalid\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e，从而令其失效。按照事务时间线 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"T^{\\prime}\" role=\"img\" aria-label=\"T^{\\prime}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsup\u003e\u003cmi\u003eT\u003c/mi\u003e\u003cmo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\"\u003e′\u003c/mo\u003e\u003c/msup\u003e\u003c/mrow\u003eT^{\\prime}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.7519em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\"\u003eT\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.7519em;\"\u003e\u003cspan style=\"top:-3.063em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e′\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e，Graphiti 在判断边失效时始终优先采用新信息。\u003c/p\u003e\n\u003cp\u003e这套完整方法使 Graphiti 能够随着对话演进动态加入数据，同时保留关系的当前状态以及关系随时间演化的历史记录。\u003c/p\u003e\n\u003ch3 id=\"23-社区\"\u003e2.3 社区\u003c/h3\u003e\n\u003cp\u003e建立情节子图与语义子图后，系统通过社区检测构建社区子图。我们的社区检测方法建立在 GraphRAG [\u003ca href=\"#bib.bib4\"\u003e4\u003c/a\u003e] 所描述技术的基础之上，但我们采用标签传播算法 [\u003ca href=\"#bib.bib13\"\u003e13\u003c/a\u003e]，而非 Leiden 算法 [\u003ca href=\"#bib.bib14\"\u003e14\u003c/a\u003e]。之所以做出这一选择，是因为标签传播易于进行动态扩展；随着新数据进入图谱，系统可以在更长时间内维持较准确的社区表示，从而推迟执行完整社区刷新。\u003c/p\u003e\n\u003cp\u003e这种动态扩展实现了标签传播单次递归步骤的逻辑。当系统向图中加入新的实体节点 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"n_{i}\\in\\mathcal{N}_{s}\" role=\"img\" aria-label=\"n_{i}\\in\\mathcal{N}_{s}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003en\u003c/mi\u003e\u003cmi\u003ei\u003c/mi\u003e\u003c/msub\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmsub\u003e\u003cmi mathvariant=\"script\"\u003eN\u003c/mi\u003e\u003cmi\u003es\u003c/mi\u003e\u003c/msub\u003e\u003c/mrow\u003en_{i}\\in\\mathcal{N}_{s}\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.6891em;vertical-align:-0.15em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathnormal\"\u003en\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.3117em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord mathnormal mtight\"\u003ei\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e∈\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mord mathcal\" style=\"margin-right:0.1474em;\"\u003eN\u003c/span\u003e\u003cspan class=\"msupsub\"\u003e\u003cspan class=\"vlist-t vlist-t2\"\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.1514em;\"\u003e\u003cspan style=\"top:-2.55em;margin-left:-0.1474em;margin-right:0.05em;\"\u003e\u003cspan class=\"pstrut\" style=\"height:2.7em;\"\u003e\u003c/span\u003e\u003cspan class=\"katex-sizing reset-size6 size3 mtight\"\u003e\u003cspan class=\"mord mtight\"\u003e\u003cspan class=\"mord mathnormal mtight\"\u003es\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-s\"\u003e​\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"vlist-r\"\u003e\u003cspan class=\"vlist\" style=\"height:0.15em;\"\u003e\u003cspan\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 时，会检查其邻居节点所属的社区。系统把新节点分配给其邻居中占相对多数的社区，然后相应更新社区摘要和图谱。尽管这种动态更新能够在数据持续流入系统时高效扩展社区，但得到的社区会逐渐偏离完整运行一次标签传播算法所生成的结果。因此，仍然需要周期性刷新社区。不过，这种动态更新策略提供了一种实用启发式方法，可显著降低延迟与 LLM 推理成本。\u003c/p\u003e\n\u003cp\u003e遵循 [\u003ca href=\"#bib.bib4\"\u003e4\u003c/a\u003e] 的方法，我们的社区节点包含通过迭代式 map-reduce 风格摘要得到的成员节点概述。不过，我们的检索方法与 GraphRAG 的 map-reduce 方法 [\u003ca href=\"#bib.bib4\"\u003e4\u003c/a\u003e] 存在显著差异。为支持我们的检索方法，我们会生成社区名称，其中包含社区摘要里的关键词和相关主题。这些名称随后会被嵌入并存储，以支持余弦相似度搜索。\u003c/p\u003e\n\u003ch2 id=\"3-记忆检索\"\u003e3 记忆检索\u003c/h2\u003e\n\u003cp\u003eZep 的记忆检索系统提供强大、复杂且高度可配置的功能。从高层来看，Zep 图搜索 API 实现了这样一个函数：接受文本字符串查询 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"\\alpha\\in S\" role=\"img\" aria-label=\"\\alpha\\in S\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmi\u003eS\u003c/mi\u003e\u003c/mrow\u003e\\alpha\\in S\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.5782em;vertical-align:-0.0391em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0037em;\"\u003eα\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e∈\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.6833em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\"\u003eS\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 作为输入，并返回文本字符串上下文 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"\\beta\\in S\" role=\"img\" aria-label=\"\\beta\\in S\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003cmo\u003e∈\u003c/mo\u003e\u003cmi\u003eS\u003c/mi\u003e\u003c/mrow\u003e\\beta\\in S\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0528em;\"\u003eβ\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e∈\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.6833em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\"\u003eS\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 作为输出。输出 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"\\beta\" role=\"img\" aria-label=\"\\beta\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mrow\u003e\\beta\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0528em;\"\u003eβ\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 包含来自节点和边的格式化数据，LLM 智能体需要这些数据才能对查询 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"\\alpha\" role=\"img\" aria-label=\"\\alpha\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003eα\u003c/mi\u003e\u003c/mrow\u003e\\alpha\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.4306em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0037em;\"\u003eα\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 生成准确响应。过程 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"f(\\alpha)\\to\\beta\" role=\"img\" aria-label=\"f(\\alpha)\\to\\beta\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003eα\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e→\u003c/mo\u003e\u003cmi\u003eβ\u003c/mi\u003e\u003c/mrow\u003ef(\\alpha)\\to\\beta\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:1em;vertical-align:-0.25em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.1076em;\"\u003ef\u003c/span\u003e\u003cspan class=\"mopen\"\u003e(\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0037em;\"\u003eα\u003c/span\u003e\u003cspan class=\"mclose\"\u003e)\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\"\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0528em;\"\u003eβ\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e 由三个不同步骤组成：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e搜索（\u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"\\varphi\" role=\"img\" aria-label=\"\\varphi\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003eφ\u003c/mi\u003e\u003c/mrow\u003e\\varphi\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"katex-base\"\u003e\u003cspan class=\"katex-strut\" style=\"height:0.625em;vertical-align:-0.1944em;\"\u003e\u003c/span\u003e\u003cspan class=\"mord mathnormal\"\u003eφ\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e）：\u003c/strong\u003e 首先识别可能包含相关信息的候选节点和边。虽然 Zep 使用多种不同的搜索方法，但整体搜索函数可以表示为 \u003cspan class=\"dmnd-math dmnd-math-inline dmnd-math-katex\" data-tex=\"\\varphi:S\\to\\mathcal{E}_{s}^{n}\\times\\mathcal{N}_{s}^{n}\\times\\mathcal{N}_{c}^{n}\" role=\"img\" aria-label=\"\\varphi:S\\to\\mathcal{E}_{s}^{n}\\times\\mathcal{N}_{s}^{n}\\times\\mathcal{N}_{c}^{n}\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003eφ\u003c/mi\u003e\u003cmo\u003e:\u003c/mo\u003e\u003cmi\u003eS\u003c/mi\u003e\u003cmo\u003e→\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"script\"\u003eE\u003c/mi\u003e\u003cmi\u003es\u003c/mi\u003e\u003cmi\u003en\u003c/mi\u003e\u003c/msubsup\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmsubsup\u003e\u003cmi mathvariant=\"script\"\u003eN\u003c/mi\u003e\u003cmi\u003es\u003c/mi\u003e\u003cmi\u003e
