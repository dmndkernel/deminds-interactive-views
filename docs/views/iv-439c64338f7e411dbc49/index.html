ying anchors such as a hand on a handlebar, one bent leg, a wheel arc, loose fabric, or hair direction. Build the subject from a partial editorial crop, simplified screened fragment, and one ordinary in-between gesture. For movement subjects, the object or cropped body relationship may carry the focal event while the person remains incomplete. Avoid advertising poses, victory gestures, athletic hero angles, catalog-style full bodies, and the safe headline-left/photo-right split unless the user asks for them.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Convert photographs and illustrations into the selected ink plate or plates plus substrate. Choose reproduction intensity from the subject instead of automatically aging every image:\n\n- crisp screening or clean plate separation for contemporary work; coarse halftone, risograph grain, cyanotype-like exposure, photocopy breakup, or newspaper screening when materially useful or explicitly requested;\n- visible dots at close range, recognizable subject at thumbnail scale;\n- clipped highlights where paper shows through and dense shadows where ink pools;\n- optional mild ink bleed, uneven coverage, scan noise, paper fibers, or 1-2 mm registration drift between plates; use fewer imperfections for contemporary branding and clean editorial work;\n- medium contrast; avoid glossy photographic depth.\n\nWhen no source image is supplied, do not default to a polished photorealistic hero person or a complete stock-photo figure. Prefer 2-4 identifying anchors such as a hand on a handlebar, one bent leg, a wheel arc, loose fabric, or hair direction. Build the subject from a partial editorial crop, simplified screened fragment, and one ordinary in-between gesture. For movement subjects, the object or cropped body relationship may carry the focal event while the person remains incomplete. Avoid advertising poses, victory gestures, athletic hero angles, catalog-style full bodies, and the safe headline-left/photo-right split unless the user asks for them.","sourceFormat":"markdown"},"note:sha256:c1d5d2d1278bdfad76d64aa97f9ff9736e51b0e91aac48d378e146dc9b5a7a57":{"blocks":[{"children":[],"kind":"leaf","title":"Typography is a responsive cast, not a fixed house font. Read design-system/typography.json and choose one primary display skeleton from the subject, wording, and information structure. A series may move between literary serif, wide cultural grotesk, compressed civic sans, engineered program type, rotated display, and word-as-object typography. Consistency across a set comes from ink, spacing, plate logic, and disciplined microtype; do not force every image into the same serif-plus-mono treatment."},{"children":[],"kind":"leaf","title":"Build each image with one primary display voice and one functional support voice. A third voice is allowed only as one short handwritten interjection. Handwriting supplies human interruption, never dates, locations, essential facts, or long copy."},{"children":[{"title":"natural lowercase sentence breaks for intimate language;"},{"title":"wide or interlocked capitals for music, movement, and contemporary culture;"},{"title":"compressed stacked lines for public events;"},{"title":"tabular numerals and unequal ruled blocks for programs or schedules;"},{"title":"one 90-degree rotation or vertical title for a bold cover;"},{"title":"one circled handwritten aside for an invitation or personal note;"},{"title":"oversized cropped letterforms when the words are the dominant object."}],"kind":"section","title":"Choose at most one typographic behavior per image"},{"children":[],"kind":"leaf","title":"Do not repeat the same display category across every item in a multi-scene request unless the user explicitly asks for a unified typographic campaign."},{"children":[{"title":"Use one dramatic scale jump: largest text is 5-12 times the microcopy size."},{"title":"Prefer lowercase for intimate statements and uppercase for public declarations."},{"title":"Keep display copy to 2-8 words and all other copy sparse."},{"title":"Default all invented words to natural English, even when the user's request is written in another language. Preserve user-supplied wording exactly and do not translate it unless asked."},{"title":"Use exact readable wording only when the user supplies it or it carries the concept. Otherwise use plausible microtype as texture and do not invent organizations, URLs, sponsors, or event facts."},{"title":"No gradient type, outline effects, drop shadows, inflated 3D letters, or generic luxury-fashion spacing."},{"title":"Oversized type is valid when selected as the one focal event. Otherwise keep it subordinate to the selected image, object, crop, or overprint event."},{"title":"In `relaxed` work, create a clear strength difference: one typographic move may be audacious while all supporting type becomes sparse and functional."},{"title":"Do not copy a reference's distinctive lettering, exact line breaks, or word arrangement. Translate only the broader contrast, orientation, and voice relationship into an original solution."}],"kind":"section","title":"Rules"}],"html":"\u003cp\u003eTypography is a responsive cast, not a fixed house font. Read \u003ccode\u003edesign-system/typography.json\u003c/code\u003e and choose one primary display skeleton from the subject, wording, and information structure. A series may move between literary serif, wide cultural grotesk, compressed civic sans, engineered program type, rotated display, and word-as-object typography. Consistency across a set comes from ink, spacing, plate logic, and disciplined microtype; do not force every image into the same serif-plus-mono treatment.\u003c/p\u003e\n\u003cp\u003eBuild each image with one primary display voice and one functional support voice. A third voice is allowed only as one short handwritten interjection. Handwriting supplies human interruption, never dates, locations, essential facts, or long copy.\u003c/p\u003e\n\u003cp\u003eChoose at most one typographic behavior per image:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enatural lowercase sentence breaks for intimate language;\u003c/li\u003e\n\u003cli\u003ewide or interlocked capitals for music, movement, and contemporary culture;\u003c/li\u003e\n\u003cli\u003ecompressed stacked lines for public events;\u003c/li\u003e\n\u003cli\u003etabular numerals and unequal ruled blocks for programs or schedules;\u003c/li\u003e\n\u003cli\u003eone 90-degree rotation or vertical title for a bold cover;\u003c/li\u003e\n\u003cli\u003eone circled handwritten aside for an invitation or personal note;\u003c/li\u003e\n\u003cli\u003eoversized cropped letterforms when the words are the dominant object.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDo not repeat the same display category across every item in a multi-scene request unless the user explicitly asks for a unified typographic campaign.\u003c/p\u003e\n\u003cp\u003eRules:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUse one dramatic scale jump: largest text is 5-12 times the microcopy size.\u003c/li\u003e\n\u003cli\u003ePrefer lowercase for intimate statements and uppercase for public declarations.\u003c/li\u003e\n\u003cli\u003eKeep display copy to 2-8 words and all other copy sparse.\u003c/li\u003e\n\u003cli\u003eDefault all invented words to natural English, even when the user's request is written in another language. Preserve user-supplied wording exactly and do not translate it unless asked.\u003c/li\u003e\n\u003cli\u003eUse exact readable wording only when the user supplies it or it carries the concept. Otherwise use plausible microtype as texture and do not invent organizations, URLs, sponsors, or event facts.\u003c/li\u003e\n\u003cli\u003eNo gradient type, outline effects, drop shadows, inflated 3D letters, or generic luxury-fashion spacing.\u003c/li\u003e\n\u003cli\u003eOversized type is valid when selected as the one focal event. Otherwise keep it subordinate to the selected image, object, crop, or overprint event.\u003c/li\u003e\n\u003cli\u003eIn \u003ccode\u003erelaxed\u003c/code\u003e work, create a clear strength difference: one typographic move may be audacious while all supporting type becomes sparse and functional.\u003c/li\u003e\n\u003cli\u003eDo not copy a reference's distinctive lettering, exact line breaks, or word arrangement. Translate only the broader contrast, orientation, and voice relationship into an original solution.\u003c/li\u003e\n\u003c/ul\u003e\n","kind":"structured","rawMarkdown":"Typography is a responsive cast, not a fixed house font. Read `design-system/typography.json` and choose one primary display skeleton from the subject, wording, and information structure. A series may move between literary serif, wide cultural grotesk, compressed civic sans, engineered program type, rotated display, and word-as-object typography. Consistency across a set comes from ink, spacing, plate logic, and disciplined microtype; do not force every image into the same serif-plus-mono treatment.\n\nBuild each image with one primary display voice and one functional support voice. A third voice is allowed only as one short handwritten interjection. Handwriting supplies human interruption, never dates, locations, essential facts, or long copy.\n\nChoose at most one typographic behavior per image:\n\n- natural lowercase sentence breaks for intimate language;\n- wide or interlocked capitals for music, movement, and contemporary culture;\n- compressed stacked lines for public events;\n- tabular numerals and unequal ruled blocks for programs or schedules;\n- one 90-degree rotation or vertical title for a bold cover;\n- one circled handwritten aside for an invitation or personal note;\n- oversized cropped letterforms when the words are the dominant object.\n\nDo not repeat the same display category across every item in a multi-scene request unless the user explicitly asks for a unified typographic campaign.\n\nRules:\n\n- Use one dramatic scale jump: largest text is 5-12 times the microcopy size.\n- Prefer lowercase for intimate statements and uppercase for public declarations.\n- Keep display copy to 2-8 words and all other copy sparse.\n- Default all invented words to natural English, even when the user's request is written in another language. Preserve user-supplied wording exactly and do not translate it unless asked.\n- Use exact readable wording only when the user supplies it or it carries the concept. Otherwise use plausible microtype as texture and do not invent organizations, URLs, sponsors, or event facts.\n- No gradient type, outline effects, drop shadows, inflated 3D letters, or generic luxury-fashion spacing.\n- Oversized type is valid when selected as the one focal event. Otherwise keep it subordinate to the selected image, object, crop, or overprint event.\n- In `relaxed` work, create a clear strength difference: one typographic move may be audacious while all supporting type becomes sparse and functional.\n- Do not copy a reference's distinctive lettering, exact line breaks, or word arrangement. Translate only the broader contrast, orientation, and voice relationship into an original solution.","sourceFormat":"markdown"},"note:sha256:c23e36f3be2eb7fa10593d2a79b6da70f08fc43f4b302ecbbae2265a76903ecf":{"html":"\u003cp\u003eChoose the layout from the content, not at random. Walk this list from top to bottom and use the first matching rule unless the user explicitly requests a layout:\u003c/p\u003e\n","kind":"html","rawMarkdown":"Choose the layout from the content, not at random. Walk this list from top to bottom and use the first matching rule unless the user explicitly requests a layout:","sourceFormat":"markdown"},"note:sha256:c36d58fdc3a3240066fdb4ffeb50642afbea9bc5f13bc48d99a2f0863b070e2f":{"html":"\u003cpre\u003e\u003ccode class=\"language-markdown\"\u003e**生成图**\n\n![Monocolor editorial print](absolute-image-path-or-rendered-image)\n\n**最终 Prompt**\n\n```text\n[prompt used for generation]\n```\n\n**本次配方**\n\n- Mode: [pure one-ink / chromatic + black / complementary duotone / overprint duotone]\n- Ink: [exact one- or two-ink palette and hex values]\n- Layout: [layout family]\n- Type: [editorial voice + utility voice]\n- Process: [halftone/risograph/cyanotype/photocopy treatment]\n- Originality: [one sentence naming the major structural departures from references]\n\u003c/code\u003e\u003c/pre\u003e\n","kind":"html","rawMarkdown":"````markdown\n**生成图**\n\n![Monocolor editorial print](absolute-image-path-or-rendered-image)\n\n**最终 Prompt**\n\n```text\n[prompt used for generation]\n```\n\n**本次配方**\n\n- Mode: [pure one-ink / chromatic + black / complementary duotone / overprint duotone]\n- Ink: [exact one- or two-ink palette and hex values]\n- Layout: [layout family]\n- Type: [editorial voice + utility voice]\n- Process: [halftone/risograph/cyanotype/photocopy treatment]\n- Originality: [one sentence naming the major structural departures from references]\n````","sourceFormat":"markdown"},"note:sha256:e4fbe380201adb97f241f230d81fbf3ed8c59221fd04bb37bf80a80b85c55c2f":{"blocks":[{"children":[],"kind":"leaf","title":"1. **Pure one-ink:** one ink carries image, typography, and rules through density changes. Use this when the user explicitly requests one ink, monochrome, or one named ink without a second color."},{"children":[],"kind":"leaf","title":"2. **Chromatic ink + black:** the chromatic plate carries the photograph or dominant graphic; carbon or charcoal carries long text and precision labels. This is the default branch for quiet, observational, natural, architectural, and long-form subjects."},{"children":[],"kind":"leaf","title":"3. **Complementary duotone:** one dominant ink occupies 70%-85% of the printed area; the accent ink occupies 15%-30% and has a specific role such as dates, annotations, or selected objects. This is the general default, with Cobalt + Terracotta as the fallback pair."},{"children":[],"kind":"leaf","title":"4. **Overprint duotone:** two plates may overlap. The darker mixed appearance in overlap zones is a physical consequence of two inks and does not count as a third ink."},{"children":[],"kind":"leaf","title":"Assign each plate a role before composing. Never scatter two colors as arbitrary decoration. These constraints keep the result mechanically printed rather than digitally color-graded."}],"html":"\u003col\u003e\n\u003cli\u003e\u003cstrong\u003ePure one-ink:\u003c/strong\u003e one ink carries image, typography, and rules through density changes. Use this when the user explicitly requests one ink, monochrome, or one named ink without a second color.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eChromatic ink + black:\u003c/strong\u003e the chromatic plate carries the photograph or dominant graphic; carbon or charcoal carries long text and precision labels. This is the default branch for quiet, observational, natural, architectural, and long-form subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eComplementary duotone:\u003c/strong\u003e one dominant ink occupies 70%-85% of the printed area; the accent ink occupies 15%-30% and has a specific role such as dates, annotations, or selected objects. This is the general default, with Cobalt + Terracotta as the fallback pair.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOverprint duotone:\u003c/strong\u003e two plates may overlap. The darker mixed appearance in overlap zones is a physical consequence of two inks and does not count as a third ink.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eAssign each plate a role before composing. Never scatter two colors as arbitrary decoration. These constraints keep the result mechanically printed rather than digitally color-graded.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"1. **Pure one-ink:** one ink carries image, typography, and rules through density changes. Use this when the user explicitly requests one ink, monochrome, or one named ink without a second color.\n2. **Chromatic ink + black:** the chromatic plate carries the photograph or dominant graphic; carbon or charcoal carries long text and precision labels. This is the default branch for quiet, observational, natural, architectural, and long-form subjects.\n3. **Complementary duotone:** one dominant ink occupies 70%-85% of the printed area; the accent ink occupies 15%-30% and has a specific role such as dates, annotations, or selected objects. This is the general default, with Cobalt + Terracotta as the fallback pair.\n4. **Overprint duotone:** two plates may overlap. The darker mixed appearance in overlap zones is a physical consequence of two inks and does not count as a third ink.\n\nAssign each plate a role before composing. Never scatter two colors as arbitrary decoration. These constraints keep the result mechanically printed rather than digitally color-graded.","sourceFormat":"markdown"},"note:sha256:ea8f87a765901714ee3ffb0390c0e6a5b8901eb450ec0d8f4baefb6bf8905479":{"html":"\u003cp\u003eDefault to controlled two-ink. Give the dominant and accent plates separate content roles before composing; never use the second ink merely to decorate the page. Switch to pure one-ink when the user explicitly requests one ink, monochrome, or one named ink without a second color. The paper substrate does not count as an ink.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Default to controlled two-ink. Give the dominant and accent plates separate content roles before composing; never use the second ink merely to decorate the page. Switch to pure one-ink when the user explicitly requests one ink, monochrome, or one named ink without a second color. The paper substrate does not count as an ink.","sourceFormat":"markdown"}},"sourceRevision":"sha256:ccc7fb8d5b4ee59307a0982163ecc26472356b08caab94889d06a626f58494d7"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typ
