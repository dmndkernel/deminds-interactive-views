 whole photograph:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eName 2-4 \u003cstrong\u003eidentity anchors\u003c/strong\u003e that make the subject recognizable, such as a square sail, curved hull, mast, and wave direction. Preserve their relationship, not their photographic detail.\u003c/li\u003e\n\u003cli\u003eConvert the anchors into \u003cstrong\u003eone dominant mass\u003c/strong\u003e, \u003cstrong\u003eone structural contour\u003c/strong\u003e, and \u003cstrong\u003eone repeated rhythm\u003c/strong\u003e. Use flat plate shapes, broken hand-drawn lines, short strokes, dots, or paper cutouts; omit incidental scenery and fine surface description.\u003c/li\u003e\n\u003cli\u003eLet paper replace at least 35% of the source scene. Crop one anchor at a page edge and allow one type or line element to cross it. Abstraction must create active space, not merely blur or posterize the photo.\u003c/li\u003e\n\u003cli\u003eKeep the abstract geometry deterministic. Apply looseness through slightly irregular contours, uneven repeated marks, and the recipe's style-appropriate controlled print imperfections; do not randomly move anchors between retries.\u003c/li\u003e\n\u003cli\u003eStop before the subject becomes generic. At thumbnail scale, at least two identity anchors must still communicate the original subject without relying on the caption.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eFor complementary duotone abstraction, assign the dominant ink to structure and rhythm, and reserve the accent ink for one identity anchor or one annotation. Do not distribute the accent evenly across the page.\u003c/p\u003e\n\u003ch4 id=\"controlled-chance\"\u003eControlled Chance\u003c/h4\u003e\n\u003cp\u003eKeep composition, wording, palette, and hierarchy deterministic. Introduce looseness only in the reproduction layer. Contemporary work selects 0-2 restrained effects; tactile, vintage, or archival-aging work selects 2-3 effects from \u003ccode\u003edesign-system/imperfections.json\u003c/code\u003e with the resolved recipe's stable seed.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLet uneven ink density, dry-edge breakup, halftone drift, registration drift, or one broken manual gesture create the analog variation.\u003c/li\u003e\n\u003cli\u003eApply variation to large type, image plates, solid shapes, or the single gesture family; never distort microcopy or factual text.\u003c/li\u003e\n\u003cli\u003eKeep all effect values inside the catalog ranges. The same resolved input must reproduce the same marks and offsets.\u003c/li\u003e\n\u003cli\u003eIn one-ink work, registration drift may appear only as a pale second impression of the same ink. It does not add another color.\u003c/li\u003e\n\u003cli\u003eDo not use controlled chance to move the dominant object, change line breaks, alter the grid, or compensate for an unresolved composition.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse one dominant image zone occupying 45%-80% of the page, 1-3 isolated specimens whose combined area stays in that range, or one repeated object system. A ruled information poster may reduce the image zone to 32%-55% only when real supplied information needs the space. Dense overlap is allowed only in the \u003cstrong\u003eoverprint collage\u003c/strong\u003e family; it must still read as two printing plates rather than scrapbook decoration.\u003c/p\u003e\n\u003ch3 id=\"4-typography\"\u003e4. Typography\u003c/h3\u003e\n\u003cp\u003eTypography is a responsive cast, not a fixed house font. Read \u003ccode\u003edesign-system/typography.json\u003c/code\u003e and choose one primary display skeleton from the subject, wording, and information structure. A series may move between literary serif, wide cultural grotesk, compressed civic sans, engineered program type, rotated display, and word-as-object typography. Consistency across a set comes from ink, spacing, plate logic, and disciplined microtype; do not force every image into the same serif-plus-mono treatment.\u003c/p\u003e\n\u003cp\u003eBuild each image with one primary display voice and one functional support voice. A third voice is allowed only as one short handwritten interjection. Handwriting supplies human interruption, never dates, locations, essential facts, or long copy.\u003c/p\u003e\n\u003cp\u003eChoose at most one typographic behavior per image:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enatural lowercase sentence breaks for intimate language;\u003c/li\u003e\n\u003cli\u003ewide or interlocked capitals for music, movement, and contemporary culture;\u003c/li\u003e\n\u003cli\u003ecompressed stacked lines for public events;\u003c/li\u003e\n\u003cli\u003etabular numerals and unequal ruled blocks for programs or schedules;\u003c/li\u003e\n\u003cli\u003eone 90-degree rotation or vertical title for a bold cover;\u003c/li\u003e\n\u003cli\u003eone circled handwritten aside for an invitation or personal note;\u003c/li\u003e\n\u003cli\u003eoversized cropped letterforms when the words are the dominant object.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDo not repeat the same display category across every item in a multi-scene request unless the user explicitly asks for a unified typographic campaign.\u003c/p\u003e\n\u003cp\u003eRules:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUse one dramatic scale jump: largest text is 5-12 times the microcopy size.\u003c/li\u003e\n\u003cli\u003ePrefer lowercase for intimate statements and uppercase for public declarations.\u003c/li\u003e\n\u003cli\u003eKeep display copy to 2-8 words and all other copy sparse.\u003c/li\u003e\n\u003cli\u003eDefault all invented words to natural English, even when the user's request is written in another language. Preserve user-supplied wording exactly and do not translate it unless asked.\u003c/li\u003e\n\u003cli\u003eUse exact readable wording only when the user supplies it or it carries the concept. Otherwise use plausible microtype as texture and do not invent organizations, URLs, sponsors, or event facts.\u003c/li\u003e\n\u003cli\u003eNo gradient type, outline effects, drop shadows, inflated 3D letters, or generic luxury-fashion spacing.\u003c/li\u003e\n\u003cli\u003eOversized type is valid when selected as the one focal event. Otherwise keep it subordinate to the selected image, object, crop, or overprint event.\u003c/li\u003e\n\u003cli\u003eIn \u003ccode\u003erelaxed\u003c/code\u003e work, create a clear strength difference: one typographic move may be audacious while all supporting type becomes sparse and functional.\u003c/li\u003e\n\u003cli\u003eDo not copy a reference's distinctive lettering, exact line breaks, or word arrangement. Translate only the broader contrast, orientation, and voice relationship into an original solution.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"5-communication-tone\"\u003e5. Communication Tone\u003c/h3\u003e\n\u003cp\u003eWrite like an independent cultural poster, field journal, or community print notice:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eterse, observant, romantic, and free-spirited without becoming sentimental;\u003c/li\u003e\n\u003cli\u003ehuman and specific rather than inspirational;\u003c/li\u003e\n\u003cli\u003equiet confidence, dry wit, or factual clarity;\u003c/li\u003e\n\u003cli\u003eno sales language, CTA, hype, productivity slogans, or brand manifesto voice.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFor summer, movement, travel, leisure, music, and night subjects, make romantic freedom the default emotional register. Express it through a physical sensation, an open direction, an unhurried gesture, or a small relationship between subject and space. Favor fresh English fragments such as an observation or invitation, never a generic motivational slogan. For factual, civic, scientific, or archival subjects, let clarity override this romantic default.\u003c/p\u003e\n\u003cp\u003eIf text must be invented, prefer an English observation, plain declaration, object label, or small contradiction. Never reuse wording visible in reference images or repeat a stock phrase across unrelated outputs.\u003c/p\u003e\n\u003cp\u003eFor romantic, intimate, nostalgic, or poetic prompts, express feeling through one observable relationship: two figures sharing one edge, an object carrying signs of use, a crop that implies closeness, or a small distance between forms. Do not default to string lights, wine glasses, fluttering fabric, stars, flowers, sunset silhouettes, or cinematic haze. Those props describe a romance category; a specific relationship creates romance while preserving the reference set's graphic directness.\u003c/p\u003e\n\u003ch2 id=\"composition-decision-flow\"\u003eComposition Decision Flow\u003c/h2\u003e\n\u003cp\u003eChoose the layout from the content, not at random. Walk this list from top to bottom and use the first matching rule unless the user explicitly requests a layout:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eIs the content an event, method, schedule, or factual announcement?\u003cul\u003e\n\u003cli\u003eYes: choose \u003cstrong\u003eruled information poster\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eIs the subject botanical, collected, or taxonomic?\u003cul\u003e\n\u003cli\u003eYes: choose \u003cstrong\u003earchival plate\u003c/strong\u003e and consider botanical green.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eIs one ordinary object explicitly requested as a repeated rhythm?\u003cul\u003e\n\u003cli\u003eYes: choose \u003cstrong\u003eobject field\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eDoes the concept explicitly depend on two images, colors, or type layers physically crossing?\u003cul\u003e\n\u003cli\u003eYes: choose \u003cstrong\u003eoverprint collage\u003c/strong\u003e and use overprint duotone.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eIs there one supplied portrait or scene photograph?\u003cul\u003e\n\u003cli\u003eYes, and representation is faithful reproduction: choose \u003cstrong\u003eimage field\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eYes, and representation is abstract symbol extraction: choose \u003cstrong\u003eeditorial cover\u003c/strong\u003e by default; choose \u003cstrong\u003eoverprint collage\u003c/strong\u003e only when two extracted layers must physically cross.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eAre there 1-3 supplied isolated objects intended for labels or comparison?\u003cul\u003e\n\u003cli\u003eYes: choose \u003cstrong\u003especimen annotation\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eIs the user's phrase itself the main visual subject?\u003cul\u003e\n\u003cli\u003eYes: choose \u003cstrong\u003etype-led declaration\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eIs the content reflective, dated, or essay-like with a primary photograph and readable text?\u003cul\u003e\n\u003cli\u003eYes: choose \u003cstrong\u003eeditorial journal\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eOtherwise choose \u003cstrong\u003eeditorial cover\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"layout-families\"\u003eLayout Families\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eImage field:\u003c/strong\u003e large screened image crossing at least one page edge; headline overlaps or locks tightly to it; compact footer.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSpecimen annotation:\u003c/strong\u003e 1-3 isolated cutouts with numbered labels, one oversized phrase, and asymmetric empty space.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eType-led declaration:\u003c/strong\u003e headline controls the page; a smaller screened image interrupts or grounds it.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRuled information poster:\u003c/strong\u003e one dominant screened object or scene is crossed by a headline; thin one-ink rules form one metadata band and the date remains subordinate.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eArchival plate:\u003c/strong\u003e title, one rectangular image plate, and a disciplined multi-column caption block.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEditorial cover:\u003c/strong\u003e title near one edge, one dominant image zone, sparse issue-like microcopy, no fake masthead brand.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eObject field:\u003c/strong\u003e one recognizable object repeated at varied scale, crop, or angle to form a printed rhythm; keep one open zone for title and facts.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOverprint collage:\u003c/strong\u003e two ink plates carry separate object, image, geometric, or typographic layers and cross in selected zones; use overlap deliberately, not everywhere.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEditorial journal:\u003c/strong\u003e one primary screened photograph, a strong title or date, and 2-3 disciplined text columns with enough size and contrast for real reading.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"prompt-compiler\"\u003ePrompt Compiler\u003c/h2\u003e\n\u003cp\u003eWrite the final prompt in five compact paragraphs, in this order:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCanvas and ink:\u003c/strong\u003e ratio, exact neutral substrate and reason for choosing it, exact one- or two-ink palette, print mode, plate roles, and flat front-facing page.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOriginal composition:\u003c/strong\u003e chosen layout family, visual-tension profile, one focal event, one release zone, margins, empty-space percentage, grid, dominant object scale and edge crop, optional unresolved edge, and one manual gesture.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSubject:\u003c/strong\u003e what appears; for faithful reproduction, describe preservation, crop, size, halftone treatment, and paper exposure; for abstract symbol extraction, name the 2-4 identity anchors, dominant mass, structural contour, repeated rhythm, omitted detail, and where exposed paper cuts through the scene.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTypography and words:\u003c/strong\u003e hierarchy, type voices, exact short display text, and the explicit overlap, crossing, split, or tight alignment between headline and dominant object; include a ruled data strip only when needed.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMaterial and avoids:\u003c/strong\u003e dots, fibers, bleed, misregistration, plus the hard negative constraints and any topic-specific cliches to exclude.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDescribe only visible outcomes. Do not mention reference artists, studios, sample posters, or “in the style of.”\u003c/p\u003e\n\u003ch2 id=\"originality-firewall\"\u003eOriginality Firewall\u003c/h2\u003e\n\u003cp\u003eThe reference is evidence for a visual grammar, never a layout to trace.\u003c/p\u003e\n\u003cp\u003eBefore generation, change at least four of these from any supplied reference:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esubject and crop;\u003c/li\u003e\n\u003cli\u003elayout family;\u003c/li\u003e\n\u003cli\u003eheadline wording;\u003c/li\u003e\n\u003cli\u003eheadline location;\u003c/li\u003e\n\u003cli\u003eimage shape or count;\u003c/li\u003e\n\u003cli\u003egrid structure;\u003c/li\u003e\n\u003cli\u003etype pairing;\u003c/li\u003e\n\u003cli\u003emetadata treatment;\u003c/li\u003e\n\u003cli\u003eratio;\u003c/li\u003e\n\u003cli\u003edisruption device.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNever reproduce a reference's exact object arrangement, line breaks, labels, dates, logos, border system, or distinctive slogan. Never include fake signatures or publication marks. If the user's source image contains protected or branded material, transform only the user's provided material and avoid presenting the result as an official artifact.\u003c/p\u003e\n\u003ch2 id=\"hard-avoids\"\u003eHard Avoids\u003c/h2\u003e\n\u003cp\u003eAlways exclude:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emore than two printing inks, unassigned accent colors, gradients, rainbow accents, neon, or full-color photography;\u003c/li\u003e\n\u003cli\u003eclean vector-flat digital poster aesthetics;\u003c/li\u003e\n\u003cli\u003ebeige lifestyle minimalism or monochrome color wash;\u003c/li\u003e\n\u003cli\u003eglossy mockups, 3D depth, cinematic lighting, lens blur, hard shadows;\u003c/li\u003e\n\u003cli\u003ecentered template symmetry, card grids, UI panels, stickers, decorative blobs;\u003c/li\u003e\n\u003cli\u003escrapbook collage, uncontrolled overlap, grunge overload, or torn-paper styling;\u003c/li\u003e\n\u003cli\u003eautomatic vintage styling, yellowed paper, sepia aging, distressed borders, nostalgic props, or retro type merely because the image uses halftone or limited inks;\u003c/li\u003e\n\u003cli\u003elong paragraphs, marketing copy, CTA buttons, logos, URLs, QR codes;\u003c/li\u003e\n\u003cli\u003eexact imitation of a supplied poster or recognizable artist signature.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"generation-and-inspection\"\u003eGeneration and Inspection\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eGenerate the image with the compiled prompt.\u003c/li\u003e\n\u003cli\u003eInspect it at full size and thumbnail size.\u003c/li\u003e\n\u003cli\u003eRegenerate once when any of these fail:\u003cul\u003e\n\u003cli\u003ea one-ink composition shows a second ink, or a two-ink composition shows a third printing ink;\u003c/li\u003e\n\u003cli\u003ea two-ink composition lacks clear plate roles or uses the accent across more than 30% without a subject-driven reason;\u003c/li\u003e\n\u003cli\u003ethe page reads as digitally color-graded rather than physically printed;\u003c/li\u003e\n\u003cli\u003eempty paper falls outside 25%-55%;\u003c/li\u003e\n\u003cli\u003ethe subject is unrecognizable;\u003c/li\u003e\n\u003cli\u003etypography lacks a clear 5x or greater scale jump;\u003c/li\u003e\n\u003cli\u003elong text is garbled or invented branding appears;\u003c/li\u003e\n\u003cli\u003ethe composition closely follows a supplied reference.\u003c/li\u003e\n\u003cli\u003ea relaxed result has no immediately identifiable focal event or distributes equal emphasis across the whole page;\u003c/li\u003e\n\u003cli\u003ea theme-only person becomes a complete stock-photo figure or the page falls into a safe headline-left/photo-right split;\u003c/li\u003e\n\u003cli\u003ethe release zone is filled with decorative microcopy, gestures, or secondary focal points.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eIf exact text renders incorrectly after one retry, generate a text-light base image and state that typography should be overlaid in a layout tool. Do not pretend distorted text is correct.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"output-format\"\u003eOutput Format\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-markdown\"\u003e**生成图**\n\n![Monocolor editorial print](data:image/gif;base64,R0lGODlhAQABAAAAACw=#dmnd-missing=absolute-image-path-or-rendered-image)\n\n**最终 Prompt**\n\n```text\n[prompt used for generation]\n```\n\n**本次配方**\n\n- Mode: [pure one-ink / chromatic + black / complementary duotone / overprint duotone]\n- Ink: [exact one- or two-ink palette and hex values]\n- Layout: [layout family]\n- Type: [editorial voice + utility voice]\n- Process: [halftone/risograph/cyanotype/photocopy treatment]\n- Originality: [one sentence naming the major structural departures from references]\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"final-quality-gate\"\u003eFinal Quality Gate\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eIs there one intentionally selected white, gray, or pale-beige substrate and no more than two printing inks?\u003c/li\u003e\n\u003cli\u003eDoes the result read as contemporary editorial by default, with vintage or aged styling present only when requested?\u003c/li\u003e\n\u003cli\u003eIf there are two inks, does each plate have a clear role and does the accent remain controlled?\u003c/li\u003e\n\u003cli\u003eDoes 25%-55% of the page remain visibly empty?\u003c/li\u003e\n\u003cli\u003eIs the image reproduced through dots or mechanical print texture rather than a color filter?\u003c/li\u003e\n\u003cli\u003eDoes one object occupy 45%-80% of the page, except for a justified information-heavy layout?\u003c/li\u003e\n\u003cli\u003eDoes the headline visibly cross, cover, split around, or lock tightly to the dominant object?\u003c/li\u003e\n\u003cli\u003eDoes exposed paper form a visible shape inside the image through highlights, gaps, fade-outs, or knockouts?\u003c/li\u003e\n\u003cli\u003eIs there exactly one manual gesture family rather than several decorative doodle styles?\u003c/li\u003e\n\u003cli\u003eDoes the type hierarchy use a 5x-12x scale jump and no more than three type voices?\u003c/li\u003e\n\u003cli\u003eDoes the page have exactly one immediately identifiable focal event?\u003c/li\u003e\n\u003cli\u003eIs there one visibly quieter release zone rather than evenly distributed emptiness?\u003c/li\u003e\n\u003cli\u003eFor relaxed work, is energy concentrated in the focal event rather than reduced everywhere?\u003c/li\u003e\n\u003cli\u003eIf no source image was supplied, does the figure feel observed in an ordinary in-between moment rather than posed as an advertisement?\u003c/li\u003e\n\u003cli\u003eIf type is page-filling, is it the selected focal event while the remaining devices retreat?\u003c/li\u003e\n\u003cli\u003eIs the language terse, specific, and non-commercial?\u003c/li\u003e\n\u003cli\u003eIs the user's supplied subject preserved?\u003c/li\u003e\n\u003cli\u003eAre at least four structural features different from every supplied reference?\u003c/li\u003e\n\u003cli\u003eDid the run generate an image unless prompt-only was requested?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"example-triggers\"\u003eExample Triggers\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e“用 mono-color 做一张关于夏天散步的海报。”\u003c/li\u003e\n\u003cli\u003e“把这张咖啡照片变成蓝色网点编辑封面。”\u003c/li\u003e\n\u003cli\u003e“做一个绿色植物主题的孔版印刷 poster。”\u003c/li\u003e\n\u003cli\u003e“沿用之前那套单色、留白、复古印刷的视觉。”\u003c/li\u003e\n\u003cli\u003e“Make this portrait into a one-ink editorial zine cover.”\u003c/li\u003e\n\u003cli\u003e“用蓝橙双色叠印做一张城市骑行活动视觉。”\u003c/li\u003e\n\u003cli\u003e“把这个产品做成重复物件构图的双色孔版印刷封面。”\u003c/li\u003e\n\u003cli\u003e“用绿色照片和黑色正文做一页观察日志。”\u003c/li\u003e\n\u003c/ul\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:05dd9bb0c48b6560880d0ded9789ca8a0f070fd8d8a699071d2c24f5ea0208b9":{"blocks":[{"children":[{"title":"1. **Canvas and ink:** ratio, exact neutral substrate and reason for choosing it, exact one- or two-ink palette, print mode, plate roles, and flat front-facing page."},{"title":"2. **Original composition:** chosen layout family, visual-tension profile, one focal event, one release zone, margins, empty-space percentage, grid, dominant object scale and edge crop, optional unresolved edge, and one manual gesture."},{"title":"3. **Subject:** what appears; for faithful reproduction, describe preservation, crop, size, halftone treatment, and paper exposure; for abstract symbol extraction, name the 2-4 identity anchors, dominant mass, structural contour, repeated rhythm, omitted detail, and where exposed paper cuts through the scene."},{"title":"4. **Typography and words:** hierarchy, type voices, exact short display text, and the explicit overlap, crossing, split, or tight alignment between headline and dominant object; include a ruled data strip only when needed."},{"title":"5. **Material and avoids:** dots, fibers, bleed, misregistration, plus the hard negative constraints and any topic-specific cliches to exclude."}],"kind":"section","title":"Write the final prompt in five compact paragraphs, in this order"},{"children":[],"kind":"leaf","title":"Describe only visible outcomes. Do not mention reference artists, studios, sample posters, or “in the style of.”"}],"html":"\u003cp\u003eWrite the final prompt in five compact paragraphs, in this order:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCanvas and ink:\u003c/strong\u003e ratio, exact neutral substrate and reason for choosing it, exact one- or two-ink palette, print mode, plate roles, and flat front-facing page.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOriginal composition:\u003c/strong\u003e chosen layout family, visual-tension profile, one focal event, one release zone, margins, empty-space percentage, grid, dominant object scale and edge crop, optional unresolved edge, and one manual gesture.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSubject:\u003c/strong\u003e what appears; for faithful reproduction, describe preservation, crop, size, halftone treatment, and paper exposure; for abstract symbol extraction, name the 2-4 identity anchors, dominant mass, structural contour, repeated rhythm, omitted detail, and where exposed paper cuts through the scene.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTypography and words:\u003c/strong\u003e hierarchy, type voices, exact short display text, and the explicit overlap, crossing, split, or tight alignment between headline and dominant object; include a ruled data strip only when needed.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMaterial and avoids:\u003c/strong\u003e dots, fibers, bleed, misregistration, plus the hard negative constraints and any topic-specific cliches to exclude.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDescribe only visible outcomes. Do not mention reference artists, studios, sample posters, or “in the style of.”\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Write the final prompt in five compact paragraphs, in this order:\n\n1. **Canvas and ink:** ratio, exact neutral substrate and reason for choosing it, exact one- or two-ink palette, print mode, plate roles, and flat front-facing page.\n2. **Original composition:** chosen layout family, visual-tension profile, one focal event, one release zone, margins, empty-space percentage, grid, dominant object scale and edge crop, optional unresolved edge, and one manual gesture.\n3. **Subject:** what appears; for faithful reproduction, describe preservation, crop, size, halftone treatment, and paper exposure; for abstract symbol extraction, name the 2-4 identity anchors, dominant mass, structural contour, repeated rhythm, omitted detail, and where exposed paper cuts through the scene.\n4. **Typography and words:** hierarchy, type voices, exact short display text, and the explicit overlap, crossing, split, or tight alignment between headline and dominant object; include a ruled data strip only when needed.\n5. **Material and avoids:** dots, fibers, bleed, misregistration, plus the hard negative constraints and any topic-specific cliches to exclude.\n\nDescribe only visible outcomes. Do not mention reference artists, studios, sample posters, or “in the style of.”","sourceFormat":"markdown"},"note:sha256:0bedf6d61778ad346a9327e92d485e713f914578ec4e6d1014647a746b1e2c22":{"blocks":[{"children":[{"title":"**Subject:** the one person, object, scene, or idea that must remain recognizable."},{"title":"**Intent:** poetic observation, announcement, field note, personal statement, cultural poster, or specimen page."},{"title":"**Words:** preserve exact supplied text in its original language. When no text is supplied, invent one English display phrase of 2-8 words and preserve it across retries. Omit display text only when the user explicitly requests a text-free image."},{"title":"**Image role:** hero photograph, isolated specimen, cropped fragment, texture source, or no supplied image."},{"title":"**Representation:** faithful reproduction or abstract symbol extraction. Choose abstract symbol extraction when the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment."}],"kind":"section","title":"Extract four things before composing"},{"children":[],"kind":"leaf","title":"For a complex topic, choose one concrete visual metaphor. Do not illustrate every point."},{"children":[],"kind":"leaf","title":"When the user supplies an image, preserve its identity and core factual content. In faithful reproduction, crop, isolate, enlarge, simplify, or convert it to halftone. In abstract symbol extraction, preserve 2-4 identifying anchors while replacing photographic description with simplified masses, contours, repeated marks, and exposed paper. Never replace the subject or invent branded details."}],"html":"\u003cp\u003eExtract four things before composing:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSubject:\u003c/strong\u003e the one person, object, scene, or idea that must remain recognizable.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIntent:\u003c/strong\u003e poetic observation, announcement, field note, personal statement, cultural poster, or specimen page.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWords:\u003c/strong\u003e preserve exact supplied text in its original language. When no text is supplied, invent one English display phrase of 2-8 words and preserve it across retries. Omit display text only when the user explicitly requests a text-free image.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eImage role:\u003c/strong\u003e hero photograph, isolated specimen, cropped fragment, texture source, or no supplied image.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRepresentation:\u003c/strong\u003e faithful reproduction or abstract symbol extraction. Choose abstract symbol extraction when the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFor a complex topic, choose one concrete visual metaphor. Do not illustrate every point.\u003c/p\u003e\n\u003cp\u003eWhen the user supplies an image, preserve its identity and core factual content. In faithful reproduction, crop, isolate, enlarge, simplify, or convert it to halftone. In abstract symbol extraction, preserve 2-4 identifying anchors while replacing photographic description with simplified masses, contours, repeated marks, and exposed paper. Never replace the subject or invent branded details.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Extract four things before composing:\n\n- **Subject:** the one person, object, scene, or idea that must remain recognizable.\n- **Intent:** poetic observation, announcement, field note, personal statement, cultural poster, or specimen page.\n- **Words:** preserve exact supplied text in its original language. When no text is supplied, invent one English display phrase of 2-8 words and preserve it across retries. Omit display text only when the user explicitly requests a text-free image.\n- **Image role:** hero photograph, isolated specimen, cropped fragment, texture source, or no supplied image.\n- **Representation:** faithful reproduction or abstract symbol extraction. Choose abstract symbol extraction when the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment.\n\nFor a complex topic, choose one concrete visual metaphor. Do not illustrate every point.\n\nWhen the user supplies an image, preserve its identity and core factual content. In faithful reproduction, crop, isolate, enlarge, simplify, or convert it to halftone. In abstract symbol extraction, preserve 2-4 identifying anchors while replacing photographic description with simplified masses, contours, repeated marks, and exposed paper. Never replace the subject or invent branded details.","sourceFormat":"markdown"},"note:sha256:110401a65d7f87098435f45e49123891afa081dceb67a87eb416fb189086de17":{"blocks":[{"children":[{"title":"Let uneven ink density, dry-edge breakup, halftone drift, registration drift, or one broken manual gesture create the analog variation."},{"title":"Apply variation to large type, image plates, solid shapes, or the single gesture family; never distort microcopy or factual text."},{"title":"Keep all effect values inside the catalog ranges. The same resolved input must reproduce the same marks and offsets."},{"title":"In one-ink work, registration drift may appear only as a pale second impression of the same ink. It does not add another color."},{"title":"Do not use controlled chance to move the dominant object, change line breaks, alter the grid, or compensate for an unresolved composition."}],"kind":"section","title":"Keep composition, wording, palette, and hierarchy deterministic. Introduce looseness only in the reproduction layer. Contemporary work selects 0-2 restrained effects; tactile, vintage, or archival-aging work selects 2-3 effects from design-system/imperfections.json with the resolved recipe's stable seed."},{"children":[],"kind":"leaf","title":"Use one dominant image zone occupying 45%-80% of the page, 1-3 isolated specimens whose combined area stays in that range, or one repeated object system. A ruled information poster may reduce the image zone to 32%-55% only when real supplied information needs the space. Dense overlap is allowed only in the overprint collage family; it must still read as two printing plates rather than scrapbook decoration."}],"html":"\u003cp\u003eKeep composition, wording, palette, and hierarchy deterministic. Introduce looseness only in the reproduction layer. Contemporary work selects 0-2 restrained effects; tactile, vintage, or archival-aging work selects 2-3 effects from \u003ccode\u003edesign-system/imperfections.json\u003c/code\u003e with the resolved recipe's stable seed.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLet uneven ink density, dry-edge breakup, halftone drift, registration drift, or one broken manual gesture create the analog variation.\u003c/li\u003e\n\u003cli\u003eApply variation to large type, image plates, solid shapes, or the single gesture family; never distort microcopy or factual text.\u003c/li\u003e\n\u003cli\u003eKeep all effect values inside the catalog ranges. The same resolved input must reproduce the same marks and offsets.\u003c/li\u003e\n\u003cli\u003eIn one-ink work, registration drift may appear only as a pale second impression of the same ink. It does not add another color.\u003c/li\u003e\n\u003cli\u003eDo not use controlled chance to move the dominant object, change line breaks, alter the grid, or compensate for an unresolved composition.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUse one dominant image zone occupying 45%-80% of the page, 1-3 isolated specimens whose combined area stays in that range, or one repeated object system. A ruled information poster may reduce the image zone to 32%-55% only when real supplied information needs the space. Dense overlap is allowed only in the \u003cstrong\u003eoverprint collage\u003c/strong\u003e family; it must still read as two printing plates rather than scrapbook decoration.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Keep composition, wording, palette, and hierarchy deterministic. Introduce looseness only in the reproduction layer. Contemporary work selects 0-2 restrained effects; tactile, vintage, or archival-aging work selects 2-3 effects from `design-system/imperfections.json` with the resolved recipe's stable seed.\n\n- Let uneven ink density, dry-edge breakup, halftone drift, registration drift, or one broken manual gesture create the analog variation.\n- Apply variation to large type, image plates, solid shapes, or the single gesture family; never distort microcopy or factual text.\n- Keep all effect values inside the catalog ranges. The same resolved input must reproduce the same marks and offsets.\n- In one-ink work, registration drift may appear only as a pale second impression of the same ink. It does not add another color.\n- Do not use controlled chance to move the dominant object, change line breaks, alter the grid, or compensate for an unresolved composition.\n\nUse one dominant image zone occupying 45%-80% of the page, 1-3 isolated specimens whose combined area stays in that range, or one repeated object system. A ruled information poster may reduce the image zone to 32%-55% only when real supplied information needs the space. Dense overlap is allowed only in the **overprint collage** family; it must still read as two printing plates rather than scrapbook decoration.","sourceFormat":"markdown"},"note:sha256:121c4ccfa989e2623357112a21b86e4d5ebef68e6b6eb737fb30471d25fb0fc8":{"blocks":[{"children":[{"title":"1. **One object dominates.** Use one person, animal, ordinary object, or repeated specimen as the visual anchor. Let it occupy 45%-80% of the page and crop it decisively at one or more edges when scale creates tension. Do not spread several small atmospheric props across the page."},{"title":"2. **Type collides with the object.** Let one headline cross, cover, split around, or align tightly against the dominant image. Keep enough contrast for the words to remain readable. Do not place every line in a detached safe zone above the image."},{"title":"3. **Paper cuts through the image.** Use clipped highlights, irregular cutout gaps, halftone fade-outs, or plate knockouts so exposed paper becomes a visible shape inside the composition, not only an outer margin."},{"title":"4. **One manual gesture interrupts the system.** Choose one circled fact, hand-drawn line, registration mark, tiny symbol, rotated label, or ruled data strip. Use one gesture family only; multiple doodle styles turn the page into scrapbook decoration."}],"kind":"section","title":"The reference set shares an object-and-type construction, not a generic retro mood. Build every page from these four moves"},{"children":[],"kind":"leaf","title":"Choose one dominant object and one dominant typographic event before adding secondary information. If either is missing, simplify rather than filling the page with mood-setting decoration."}],"html":"\u003cp\u003eThe reference set shares an object-and-type construction, not a generic retro mood. Build every page from these four moves:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eOne object dominates.\u003c/strong\u003e Use one person, animal, ordinary object, or repeated specimen as the visual anchor. Let it occupy 45%-80% of the page and crop it decisively at one or more edges when scale creates tension. Do not spread several small atmospheric props across the page.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eType collides with the object.\u003c/strong\u003e Let one headline cross, cover, split around, or align tightly against the dominant image. Keep enough contrast for the words to remain readable. Do not place every line in a detached safe zone above the image.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePaper cuts through the image.\u003c/strong\u003e Use clipped highlights, irregular cutout gaps, halftone fade-outs, or plate knockouts so exposed paper becomes a visible shape inside the composition, not only an outer margin.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOne manual gesture interrupts the system.\u003c/strong\u003e Choose one circled fact, hand-drawn line, registration mark, tiny symbol, rotated label, or ruled data strip. Use one gesture family only; multiple doodle styles turn the page into scrapbook decoration.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eChoose one dominant object and one dominant typographic event before adding secondary information. If either is missing, simplify rather than filling the page with mood-setting decoration.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"The reference set shares an object-and-type construction, not a generic retro mood. Build every page from these four moves:\n\n1. **One object dominates.** Use one person, animal, ordinary object, or repeated specimen as the visual anchor. Let it occupy 45%-80% of the page and crop it decisively at one or more edges when scale creates tension. Do not spread several small atmospheric props across the page.\n2. **Type collides with the object.** Let one headline cross, cover, split around, or align tightly against the dominant image. Keep enough contrast for the words to remain readable. Do not place every line in a detached safe zone above the image.\n3. **Paper cuts through the image.** Use clipped highlights, irregular cutout gaps, halftone fade-outs, or plate knockouts so exposed paper becomes a visible shape inside the composition, not only an outer margin.\n4. **One manual gesture interrupts the system.** Choose one circled fact, hand-drawn line, registration mark, tiny symbol, rotated label, or ruled data strip. Use one gesture family only; multiple doodle styles turn the page into scrapbook decoration.\n\nChoose one dominant object and one dominant typographic event before adding secondary information. If either is missing, simplify rather than filling the page with mood-setting decoration.","sourceFormat":"markdown"},"note:sha256:13e3169175c27b6731d9cb45395c2f8ca5ea598748c7dfd180068cb6b40659e1":{"blocks":[{"children":[{"title":"1. Name 2-4 **identity anchors** that make the subject recognizable, such as a square sail, curved hull, mast, and wave direction. Preserve their relationship, not their photographic detail."},{"title":"2. Convert the anchors into **one dominant mass**, **one structural contour**, and **one repeated rhythm**. Use flat plate shapes, broken hand-drawn lines, short strokes, dots, or paper cutouts; omit incidental scenery and fine surface description."},{"title":"3. Let paper replace at least 35% of the source scene. Crop one anchor at a page edge and allow one type or line element to cross it. Abstraction must create active space, not merely blur or posterize the photo."},{"title":"4. Keep the abstract geometry deterministic. Apply looseness through slightly irregular contours, uneven repeated marks, and the recipe's style-appropriate controlled print imperfections; do not randomly move anchors between retries."},{"title":"5. Stop before the subject becomes generic. At thumbnail scale, at least two identity anchors must still communicate the original subject without relying on the caption."}],"kind":"section","title":"When representation is abstract symbol extraction, transform the supplied image into a small visual vocabulary instead of applying a stylized filter to the whole photograph"},{"children":[],"kind":"leaf","title":"For complementary duotone abstraction, assign the dominant ink to structure and rhythm, and reserve the accent ink for one identity anchor or one annotation. Do not distribute the accent evenly across the page."}],"html":"\u003cp\u003eWhen \u003ccode\u003erepresentation\u003c/code\u003e is \u003ccode\u003eabstract symbol extraction\u003c/code\u003e, transform the supplied image into a small visual vocabulary instead of applying a stylized filter to the whole photograph:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eName 2-4 \u003cstrong\u003eidentity anchors\u003c/strong\u003e that make the subject recognizable, such as a square sail, curved hull, mast, and wave direction. Preserve their relationship, not their photographic detail.\u003c/li\u003e\n\u003cli\u003eConvert the anchors into \u003cstrong\u003eone dominant mass\u003c/strong\u003e, \u003cstrong\u003eone structural contour\u003c/strong\u003e, and \u003cstrong\u003eone repeated rhythm\u003c/strong\u003e. Use flat plate shapes, broken hand-drawn lines, short strokes, dots, or paper cutouts; omit incidental scenery and fine surface description.\u003c/li\u003e\n\u003cli\u003eLet paper replace at least 35% of the source scene. Crop one anchor at a page edge and allow one type or line element to cross it. Abstraction must create active space, not merely blur or posterize the photo.\u003c/li\u003e\n\u003cli\u003eKeep the abstract geometry deterministic. Apply looseness through slightly irregular contours, uneven repeated marks, and the recipe's style-appropriate controlled print imperfections; do not randomly move anchors between retries.\u003c/li\u003e\n\u003cli\u003eStop before the subject becomes generic. At thumbnail scale, at least two identity anchors must still communicate the original subject without relying on the caption.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eFor complementary duotone abstraction, assign the dominant ink to structure and rhythm, and reserve the accent ink for one identity anchor or one annotation. Do not distribute the accent evenly across the page.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"When `representation` is `abstract symbol extraction`, transform the supplied image into a small visual vocabulary instead of applying a stylized filter to the whole photograph:\n\n1. Name 2-4 **identity anchors** that make the subject recognizable, such as a square sail, curved hull, mast, and wave direction. Preserve their relationship, not their photographic detail.\n2. Convert the anchors into **one dominant mass**, **one structural contour**, and **one repeated rhythm**. Use flat plate shapes, broken hand-drawn lines, short strokes, dots, or paper cutouts; omit incidental scenery and fine surface description.\n3. Let paper replace at least 35% of the source scene. Crop one anchor at a page edge and allow one type or line element to cross it. Abstraction must create active space, not merely blur or posterize the photo.\n4. Keep the abstract geometry deterministic. Apply looseness through slightly irregular contours, uneven repeated marks, and the recipe's style-appropriate controlled print imperfections; do not randomly move anchors between retries.\n5. Stop before the subject becomes generic. At thumbnail scale, at least two identity anchors must still communicate the original subject without relying on the caption.\n\nFor complementary duotone abstraction, assign the dominant ink to structure and rhythm, and reserve the accent ink for one identity anchor or one annotation. Do not distribute the accent evenly across the page.","sourceFormat":"markdown"},"note:sha256:166b86c8c5a4d981c8f63681bb52dd15761c0a1dc801ba13a97661d4315aa524":{"html":"\u003cp\u003eAlways exclude:\u003c/p\u003e\n","kind":"html","rawMarkdown":"Always exclude:","sourceFormat":"markdown"},"note:sha256:43194e8ebd7fe56794af5c8c62b5d29f1ad757a1710fe502005c7b4267b4b2d7":{"blocks":[{"children":[],"kind":"leaf","title":"Before writing the generation prompt, resolve the input into this manifest. Do not skip fields and do not expose the manifest unless the user asks for process details."},{"children":[],"kind":"leaf","title":"Use the machine-readable catalogs in design-system/ as the source of truth for palette IDs, typography roles, composition geometry, carrier signals, visual rhythm, and controlled print imperfections. Read only the relevant catalog for the current decision. The prose below explains intent; when an exact value differs, the catalog wins."},{"children":[],"kind":"leaf","title":"yaml subject: intent: exact_text: text_language: representation: ratio: carrier: substrate: mode: palette: inks: plate_roles: layout: empty_paper: visual_tension: focal_event: release_zone: unresolved_edge: image_treatment: type_hierarchy: disruption: imperfection_seed: imperfections:"},{"children":[{"title":"ratio: `3:4`;"},{"title":"representation: `faithful reproduction`, unless the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment;"},{"title":"text language: English for all invented display text, labels, and microcopy;"},{"title":"substrate: select from Neutral White `#FAFAF7`, Cool Gray `#E9E9E5`, or Pale Beige `#F5F1E8` according to the subject, image values, and ink contrast. Neutral White is the unspecified default; never assume beige or aged paper merely because the work uses halftone or risograph language;"},{"title":"mode and ink: controlled two-ink by default. Use Cobalt + Terracotta `#2148B8` + `#C65F38` for an unspecified subject, then select the closest approved pair for the subject. The dominant plate carries 70%-85% and the accent plate carries 15%-30%. Switch to pure one-ink only when the user explicitly requests one ink, monochrome, or one named ink without a second color;"},{"title":"empty paper: `35%`;"},{"title":"visual tension: `relaxed` for reflective, travel, summer, leisure, lifestyle, and unspecified cultural subjects; `balanced` for ordinary events and editorial information; `assertive` only when the user requests a forceful declaration or the phrase itself is the subject;"},{"title":"focal event: choose exactly one strong visual event and make all other devices support or release it;"},{"title":"release zone: reserve one large quiet region with low information density; its size follows the composition rather than a universal percentage;"},{"title":"unresolved edge: use one only when it strengthens the focal event or release zone; otherwise use none;"},{"title":"image treatment: clean plate separation or medium screening for contemporary work; coarse halftone only when the subject, supplied image, or user request benefits from it;"},{"title":"type hierarchy: resolve the role from `design-system/typography.json`. Use Literary for intimate or quiet subjects, Cultural Grotesk for music and contemporary culture, Condensed Civic for public events, Programmatic when dates or structured facts lead, Rotated Display for bold covers, Handwritten Interjection only as a secondary human voice, and Typographic Object when the phrase itself is the image;"},{"title":"disruption: one off-center image crop; use one oversized word instead when there is no image."},{"title":"imperfections: choose 0-2 subtle effects for contemporary editorial work and 2-3 effects for tactile, vintage, archival-aging, or explicitly rough work, using a stable hash of subject, exact text, palette, and layout; preserve the same seed across retries."}],"kind":"section","title":"Use these defaults whenever the user has not made the choice"},{"children":[],"kind":"leaf","title":"Explicit user choices override defaults unless they violate the two-ink limit or the originality firewall. For identical inputs, resolve the same manifest; do not vary palette, layout, percentages, or process merely for novelty. This stabilizes the design procedure while image-generation details may still vary."},{"children":[],"kind":"leaf","title":"Resolve generic color words consistently: blue to Cobalt, green to Botanical Green, orange to Terracotta Orange, red to Signal Red, purple to Aubergine, and black to Charcoal. For generic green + black, use Mint Green + Charcoal. For generic blue + orange, use Cobalt + Terracotta. Exact named inks always take precedence over these aliases."}],"html":"\u003cp\u003eBefore writing the generation prompt, resolve the input into this manifest. Do not skip fields and do not expose the manifest unless the user asks for process details.\u003c/p\u003e\n\u003cp\u003eUse the machine-readable catalogs in \u003ccode\u003edesign-system/\u003c/code\u003e as the source of truth for palette IDs, typography roles, composition geometry, carrier signals, visual rhythm, and controlled print imperfections. Read only the relevant catalog for the current decision. The prose below explains intent; when an exact value differs, the catalog wins.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-yaml\"\u003esubject: \u0026lt;one recognizable subject\u0026gt;\nintent: \u0026lt;one intent from Input Reading\u0026gt;\nexact_text: \u0026lt;user text, generated 2-8 word phrase, or none\u0026gt;\ntext_language: \u0026lt;language of supplied text, otherwise English\u0026gt;\nrepresentation: \u0026lt;faithful reproduction or abstract symbol extraction\u0026gt;\nratio: \u0026lt;explicit ratio or 3:4\u0026gt;\ncarrier: \u0026lt;one carrier ID from design-system/carriers.json or none\u0026gt;\nsubstrate: \u0026lt;one substrate ID and exact hex from design-system/colors.json\u0026gt;\nmode: \u0026lt;pure one-ink, chromatic + black, complementary duotone, or overprint duotone\u0026gt;\npalette: \u0026lt;one palette ID from design-system/colors.json\u0026gt;\ninks: \u0026lt;the palette's named ink or approved pair with exact hex values\u0026gt;\nplate_roles: \u0026lt;one explicit role per ink plate\u0026gt;\nlayout: \u0026lt;one composition ID from design-system/compositions.json\u0026gt;\nempty_paper: \u0026lt;explicit percentage\u0026gt;\nvisual_tension: \u0026lt;relaxed, balanced, or assertive from design-system/rhythm.json\u0026gt;\nfocal_event: \u0026lt;one strong visual event from design-system/rhythm.json\u0026gt;\nrelease_zone: \u0026lt;one deliberately quiet region that gives the focal event room\u0026gt;\nunresolved_edge: \u0026lt;one optional edge behavior from design-system/rhythm.json or none\u0026gt;\nimage_treatment: \u0026lt;one mechanical reproduction process\u0026gt;\ntype_hierarchy: \u0026lt;one role ID from design-system/typography.json\u0026gt;\ndisruption: \u0026lt;one deliberate disruption\u0026gt;\nimperfection_seed: \u0026lt;stable hash derived from the resolved recipe\u0026gt;\nimperfections: \u0026lt;0-2 restrained effect IDs for contemporary work, or 2-3 for tactile/vintage work\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUse these defaults whenever the user has not made the choice:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eratio: \u003ccode\u003e3:4\u003c/code\u003e;\u003c/li\u003e\n\u003cli\u003erepresentation: \u003ccode\u003efaithful reproduction\u003c/code\u003e, unless the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment;\u003c/li\u003e\n\u003cli\u003etext language: English for all invented display text, labels, and microcopy;\u003c/li\u003e\n\u003cli\u003esubstrate: select from Neutral White \u003ccode\u003e#FAFAF7\u003c/code\u003e, Cool Gray \u003ccode\u003e#E9E9E5\u003c/code\u003e, or Pale Beige \u003ccode\u003e#F5F1E8\u003c/code\u003e according to the subject, image values, and ink contrast. Neutral White is the unspecified default; never assume beige or aged paper merely because the work uses halftone or risograph language;\u003c/li\u003e\n\u003cli\u003emode and ink: controlled two-ink by default. Use Cobalt + Terracotta \u003ccode\u003e#2148B8\u003c/code\u003e + \u003ccode\u003e#C65F38\u003c/code\u003e for an unspecified subject, then select the closest approved pair for the subject. The dominant plate carries 70%-85% and the accent plate carries 15%-30%. Switch to pure one-ink only when the user explicitly requests one ink, monochrome, or one named ink without a second color;\u003c/li\u003e\n\u003cli\u003eempty paper: \u003ccode\u003e35%\u003c/code\u003e;\u003c/li\u003e\n\u003cli\u003evisual tension: \u003ccode\u003erelaxed\u003c/code\u003e for reflective, travel, summer, leisure, lifestyle, and unspecified cultural subjects; \u003ccode\u003ebalanced\u003c/code\u003e for ordinary events and editorial information; \u003ccode\u003eassertive\u003c/code\u003e only when the user requests a forceful declaration or the phrase itself is the subject;\u003c/li\u003e\n\u003cli\u003efocal event: choose exactly one strong visual event and make all other devices support or release it;\u003c/li\u003e\n\u003cli\u003erelease zone: reserve one large quiet region with low information density; its size follows the composition rather than a universal percentage;\u003c/li\u003e\n\u003cli\u003eunresolved edge: use one only when it strengthens the focal event or release zone; otherwise use none;\u003c/li\u003e\n\u003cli\u003eimage treatment: clean plate separation or medium screening for contemporary work; coarse halftone only when the subject, supplied image, or user request benefits from it;\u003c/li\u003e\n\u003cli\u003etype hierarchy: resolve the role from \u003ccode\u003edesign-system/typography.json\u003c/code\u003e. Use Literary for intimate or quiet subjects, Cultural Grotesk for music and contemporary culture, Condensed Civic for public events, Programmatic when dates or structured facts lead, Rotated Display for bold covers, Handwritten Interjection only as a secondary human voice, and Typographic Object when the phrase itself is the image;\u003c/li\u003e\n\u003cli\u003edisruption: one off-center image crop; use one oversized word instead when there is no image.\u003c/li\u003e\n\u003cli\u003eimperfections: choose 0-2 subtle effects for contemporary editorial work and 2-3 effects for tactile, vintage, archival-aging, or explicitly rough work, using a stable hash of subject, exact text, palette, and layout; preserve the same seed across retries.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eExplicit user choices override defaults unless they violate the two-ink limit or the originality firewall. For identical inputs, resolve the same manifest; do not vary palette, layout, percentages, or process merely for novelty. This stabilizes the design procedure while image-generation details may still vary.\u003c/p\u003e\n\u003cp\u003eResolve generic color words consistently: blue to Cobalt, green to Botanical Green, orange to Terracotta Orange, red to Signal Red, purple to Aubergine, and black to Charcoal. For generic green + black, use Mint Green + Charcoal. For generic blue + orange, use Cobalt + Terracotta. Exact named inks always take precedence over these aliases.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Before writing the generation prompt, resolve the input into this manifest. Do not skip fields and do not expose the manifest unless the user asks for process details.\n\nUse the machine-readable catalogs in `design-system/` as the source of truth for palette IDs, typography roles, composition geometry, carrier signals, visual rhythm, and controlled print imperfections. Read only the relevant catalog for the current decision. The prose below explains intent; when an exact value differs, the catalog wins.\n\n```yaml\nsubject: \u003cone recognizable subject\u003e\nintent: \u003cone intent from Input Reading\u003e\nexact_text: \u003cuser text, generated 2-8 word phrase, or none\u003e\ntext_language: \u003clanguage of supplied text, otherwise English\u003e\nrepresentation: \u003cfaithful reproduction or abstract symbol extraction\u003e\nratio: \u003cexplicit ratio or 3:4\u003e\ncarrier: \u003cone carrier ID from design-system/carriers.json or none\u003e\nsubstrate: \u003cone substrate ID and exact hex from design-system/colors.json\u003e\nmode: \u003cpure one-ink, chromatic + black, complementary duotone, or overprint duotone\u003e\npalette: \u003cone palette ID from design-system/colors.json\u003e\ninks: \u003cthe palette's named ink or approved pair with exact hex values\u003e\nplate_roles: \u003cone explicit role per ink plate\u003e\nlayout: \u003cone composition ID from design-system/compositions.json\u003e\nempty_paper: \u003cexplicit percentage\u003e\nvisual_tension: \u003crelaxed, balanced, or assertive from design-system/rhythm.json\u003e\nfocal_event: \u003cone strong visual event from design-system/rhythm.json\u003e\nrelease_zone: \u003cone deliberately quiet region that gives the focal event room\u003e\nunresolved_edge: \u003cone optional edge behavior from design-system/rhythm.json or none\u003e\nimage_treatment: \u003cone mechanical reproduction process\u003e\ntype_hierarchy: \u003cone role ID from design-system/typography.json\u003e\ndisruption: \u003cone deliberate disruption\u003e\nimperfection_seed: \u003cstable hash derived from the resolved recipe\u003e\nimperfections: \u003c0-2 restrained effect IDs for contemporary work, or 2-3 for tactile/vintage work\u003e\n```\n\nUse these defaults whenever the user has not made the choice:\n\n- ratio: `3:4`;\n- representation: `faithful reproduction`, unless the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment;\n- text language: English for all invented display text, labels, and microcopy;\n- substrate: select from Neutral White `#FAFAF7`, Cool Gray `#E9E9E5`, or Pale Beige `#F5F1E8` according to the subject, image values, and ink contrast. Neutral White is the unspecified default; never assume beige or aged paper merely because the work uses halftone or risograph language;\n- mode and ink: controlled two-ink by default. Use Cobalt + Terracotta `#2148B8` + `#C65F38` for an unspecified subject, then select the closest approved pair for the subject. The dominant plate carries 70%-85% and the accent plate carries 15%-30%. Switch to pure one-ink only when the user explicitly requests one ink, monochrome, or one named ink without a second color;\n- empty paper: `35%`;\n- visual tension: `relaxed` for reflective, travel, summer, leisure, lifestyle, and unspecified cultural subjects; `balanced` for ordinary events and editorial information; `assertive` only when the user requests a forceful declaration or the phrase itself is the subject;\n- focal event: choose exactly one strong visual event and make all other devices support or release it;\n- release zone: reserve one large quiet region with low information density; its size follows the composition rather than a universal percentage;\n- unresolved edge: use one only when it strengthens the focal event or release zone; otherwise use none;\n- image treatment: clean plate separation or medium screening for contemporary work; coarse halftone only when the subject, supplied image, or user request benefits from it;\n- type hierarchy: resolve the role from `design-system/typography.json`. Use Literary for intimate or quiet subjects, Cultural Grotesk for music and contemporary culture, Condensed Civic for public events, Programmatic when dates or structured facts lead, Rotated Display for bold covers, Handwritten Interjection only as a secondary human voice, and Typographic Object when the phrase itself is the image;\n- disruption: one off-center image crop; use one oversized word instead when there is no image.\n- imperfections: choose 0-2 subtle effects for contemporary editorial work and 2-3 effects for tactile, vintage, archival-aging, or explicitly rough work, using a stable hash of subject, exact text, palette, and layout; preserve the same seed across retries.\n\nExplicit user choices override defaults unless they violate the two-ink limit or the originality firewall. For identical inputs, resolve the same manifest; do not vary palette, layout, percentages, or process merely for novelty. This stabilizes the design procedure while image-generation details may still vary.\n\nResolve generic color words consistently: blue to Cobalt, green to Botanical Green, orange to Terracotta Orange, red to Signal Red, purple to Aubergine, and black to Charcoal. For generic green + black, use Mint Green + Charcoal. For generic blue + orange, use Cobalt + Terracotta. Exact named inks always take precedence over these aliases.","sourceFormat":"markdown"},"note:sha256:660d816614f7585f18dbd50ea7ceb40f0b0cc8eda8f997d0e2437225aad40a97":{"blocks":[{"children":[{"title":"1. one final image-generation prompt;"},{"title":"2. one generated raster image;"},{"title":"3. a short recipe note naming palette, layout family, type pairing, and print process."}],"kind":"section","title":"Create"},{"children":[],"kind":"leaf","title":"Save generated files under /Desktop/Claude skills/mono-color/ when a file path is available. Create the folder if needed. Stop at prompt-only only when the user explicitly asks for it or no image-generation capability is available."}],"html":"\u003cp\u003eCreate:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eone final image-generation prompt;\u003c/li\u003e\n\u003cli\u003eone generated raster image;\u003c/li\u003e\n\u003cli\u003ea short recipe note naming palette, layout family, type pairing, and print process.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eSave generated files under \u003ccode\u003e~/Desktop/Claude skills/mono-color/\u003c/code\u003e when a file path is available. Create the folder if needed. Stop at prompt-only only when the user explicitly asks for it or no image-generation capability is available.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Create:\n\n1. one final image-generation prompt;\n2. one generated raster image;\n3. a short recipe note naming palette, layout family, type pairing, and print process.\n\nSave generated files under `~/Desktop/Claude skills/mono-color/` when a file path is available. Create the folder if needed. Stop at prompt-only only when the user explicitly asks for it or no image-generation capability is available.","sourceFormat":"markdown"},"note:sha256:6ad829af415136e8f7f6bd493eccb1d438a92ef887a66528ca4065906b93195b":{"html":"\u003cp\u003eRead \u003ccode\u003edesign-system/rhythm.json\u003c/code\u003e whenever the user asks for relaxed, loose, effortless, casual, quiet, breezy, or understated work, or when the default intent maps to \u003ccode\u003erelaxed\u003c/code\u003e. Treat relaxation as a compositional decision, not a soft-focus mood.\u003c/p\u003e\n\u003cp\u003eRelaxation is uneven energy, not low energy. For \u003ccode\u003erelaxed\u003c/code\u003e work, choose exactly one strong focal event: oversized type, an extreme crop, one giant object or detail, a concentrated overprint collision, or one abnormal scale relationship. Let it feel decisive. Then release the rest of the page with open paper, pale screening, sparse support type, or one quiet alignment. Do not make every element tasteful, small, or equally calm.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Read `design-system/rhythm.json` whenever the user asks for relaxed, loose, effortless, casual, quiet, breezy, or understated work, or when the default intent maps to `relaxed`. Treat relaxation as a compositional decision, not a soft-focus mood.\n\nRelaxation is uneven energy, not low energy. For `relaxed` work, choose exactly one strong focal event: oversized type, an extreme crop, one giant object or detail, a concentrated overprint collision, or one abnormal scale relationship. Let it feel decisive. Then release the rest of the page with open paper, pale screening, sparse support type, or one quiet alignment. Do not make every element tasteful, small, or equally calm.","sourceFormat":"markdown"},"note:sha256:7d01d78bfa0823a05468ec4aae7b624edd2998aeb402ebbc4d101ae01b6022b3":{"html":"\u003cul\u003e\n\u003cli\u003eUse a flat, front-facing paper canvas with no mockup, frame, desk, or cast shadow.\u003c/li\u003e\n\u003cli\u003eDefault to a \u003ccode\u003e3:4\u003c/code\u003e vertical poster. Respect a user-specified ratio.\u003c/li\u003e\n\u003cli\u003eKeep 25%-55% of the canvas as visibly empty paper.\u003c/li\u003e\n\u003cli\u003eUse generous outer margins: 5%-9% of page width.\u003c/li\u003e\n\u003cli\u003eAlign most elements to one invisible left edge or a simple 2-3 column editorial grid.\u003c/li\u003e\n\u003cli\u003eCreate one deliberate disruption: a floating word, off-center image, oversized title, circular mark, or tiny annotation.\u003c/li\u003e\n\u003cli\u003eNever center every element. Never distribute objects evenly like a template.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNegative space is active pacing, not leftover room.\u003c/p\u003e\n","kind":"html","rawMarkdown":"- Use a flat, front-facing paper canvas with no mockup, frame, desk, or cast shadow.\n- Default to a `3:4` vertical poster. Respect a user-specified ratio.\n- Keep 25%-55% of the canvas as visibly empty paper.\n- Use generous outer margins: 5%-9% of page width.\n- Align most elements to one invisible left edge or a simple 2-3 column editorial grid.\n- Create one deliberate disruption: a floating word, off-center image, oversized title, circular mark, or tiny annotation.\n- Never center every element. Never distribute objects evenly like a template.\n\nNegative space is active pacing, not leftover room.","sourceFormat":"markdown"},"note:sha256:82f8fedd5504266e15dd59baad3727934894e065345ed0378446f0c01659bcee":{"html":"\u003cp\u003eUse a known pair rather than improvising arbitrary colors:\u003c/p\u003e\n","kind":"html","rawMarkdown":"Use a known pair rather than improvising arbitrary colors:","sourceFormat":"markdown"},"note:sha256:9b72b26f87a2c29122611d643201010488263affa1080e06f5bea3dd4026264a":{"blocks":[{"children":[],"kind":"leaf","title":"The reference is evidence for a visual grammar, never a layout to trace."},{"children":[{"title":"subject and crop;"},{"title":"layout family;"},{"title":"headline wording;"},{"title":"headline location;"},{"title":"image shape or count;"},{"title":"grid structure;"},{"title":"type pairing;"},{"title":"metadata treatment;"},{"title":"ratio;"},{"title":"disruption device."}],"kind":"section","title":"Before generation, change at least four of these from any supplied reference"},{"children":[],"kind":"leaf","title":"Never reproduce a reference's exact object arrangement, line breaks, labels, dates, logos, border system, or distinctive slogan. Never include fake signatures or publication marks. If the user's source image contains protected or branded material, transform only the user's provided material and avoid presenting the result as an official artifact."}],"html":"\u003cp\u003eThe reference is evidence for a visual grammar, never a layout to trace.\u003c/p\u003e\n\u003cp\u003eBefore generation, change at least four of these from any supplied reference:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esubject and crop;\u003c/li\u003e\n\u003cli\u003elayout family;\u003c/li\u003e\n\u003cli\u003eheadline wording;\u003c/li\u003e\n\u003cli\u003eheadline location;\u003c/li\u003e\n\u003cli\u003eimage shape or count;\u003c/li\u003e\n\u003cli\u003egrid structure;\u003c/li\u003e\n\u003cli\u003etype pairing;\u003c/li\u003e\n\u003cli\u003emetadata treatment;\u003c/li\u003e\n\u003cli\u003eratio;\u003c/li\u003e\n\u003cli\u003edisruption device.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNever reproduce a reference's exact object arrangement, line breaks, labels, dates, logos, border system, or distinctive slogan. Never include fake signatures or publication marks. If the user's source image contains protected or branded material, transform only the user's provided material and avoid presenting the result as an official artifact.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"The reference is evidence for a visual grammar, never a layout to trace.\n\nBefore generation, change at least four of these from any supplied reference:\n\n- subject and crop;\n- layout family;\n- headline wording;\n- headline location;\n- image shape or count;\n- grid structure;\n- type pairing;\n- metadata treatment;\n- ratio;\n- disruption device.\n\nNever reproduce a reference's exact object arrangement, line breaks, labels, dates, logos, border system, or distinctive slogan. Never include fake signatures or publication marks. If the user's source image contains protected or branded material, transform only the user's provided material and avoid presenting the result as an official artifact.","sourceFormat":"markdown"},"note:sha256:9c3f5d54b2cbbaac421c5f825d2d802ae2c66ba710d2a2b9e6127397ad5b9e54":{"html":"\u003cp\u003eTurn any user theme or image into an original printed editorial artifact with one stable visual language:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eadaptive neutral substrate + one or two inks + reproduced image + typographic tension + concise human voice\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDo not imitate any one reference. Recombine the system below into a new composition every time.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Turn any user theme or image into an original printed editorial artifact with one stable visual language:\n\n\u003e adaptive neutral substrate + one or two inks + reproduced image + typographic tension + concise human voice\n\nDo not imitate any one reference. Recombine the system below into a new composition every time.","sourceFormat":"markdown"},"note:sha256:a6d231d69d22a844992807f3f0e9e221c0fcc832a86460b63edf84fb91eba5a6":{"blocks":[{"children":[{"title":"terse, observant, romantic, and free-spirited without becoming sentimental;"},{"title":"human and specific rather than inspirational;"},{"title":"quiet confidence, dry wit, or factual clarity;"},{"title":"no sales language, CTA, hype, productivity slogans, or brand manifesto voice."}],"kind":"section","title":"Write like an independent cultural poster, field journal, or community print notice"},{"children":[],"kind":"leaf","title":"For summer, movement, travel, leisure, music, and night subjects, make romantic freedom the default emotional register. Express it through a physical sensation, an open direction, an unhurried gesture, or a small relationship between subject and space. Favor fresh English fragments such as an observation or invitation, never a generic motivational slogan. For factual, civic, scientific, or archival subjects, let clarity override this romantic default."},{"children":[],"kind":"leaf","title":"If text must be invented, prefer an English observation, plain declaration, object label, or small contradiction. Never reuse wording visible in reference images or repeat a stock phrase across unrelated outputs."},{"children":[],"kind":"leaf","title":"For romantic, intimate, nostalgic, or poetic prompts, express feeling through one observable relationship: two figures sharing one edge, an object carrying signs of use, a crop that implies closeness, or a small distance between forms. Do not default to string lights, wine glasses, fluttering fabric, stars, flowers, sunset silhouettes, or cinematic haze. Those props describe a romance category; a specific relationship creates romance while preserving the reference set's graphic directness."}],"html":"\u003cp\u003eWrite like an independent cultural poster, field journal, or community print notice:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eterse, observant, romantic, and free-spirited without becoming sentimental;\u003c/li\u003e\n\u003cli\u003ehuman and specific rather than inspirational;\u003c/li\u003e\n\u003cli\u003equiet confidence, dry wit, or factual clarity;\u003c/li\u003e\n\u003cli\u003eno sales language, CTA, hype, productivity slogans, or brand manifesto voice.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFor summer, movement, travel, leisure, music, and night subjects, make romantic freedom the default emotional register. Express it through a physical sensation, an open direction, an unhurried gesture, or a small relationship between subject and space. Favor fresh English fragments such as an observation or invitation, never a generic motivational slogan. For factual, civic, scientific, or archival subjects, let clarity override this romantic default.\u003c/p\u003e\n\u003cp\u003eIf text must be invented, prefer an English observation, plain declaration, object label, or small contradiction. Never reuse wording visible in reference images or repeat a stock phrase across unrelated outputs.\u003c/p\u003e\n\u003cp\u003eFor romantic, intimate, nostalgic, or poetic prompts, express feeling through one observable relationship: two figures sharing one edge, an object carrying signs of use, a crop that implies closeness, or a small distance between forms. Do not default to string lights, wine glasses, fluttering fabric, stars, flowers, sunset silhouettes, or cinematic haze. Those props describe a romance category; a specific relationship creates romance while preserving the reference set's graphic directness.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Write like an independent cultural poster, field journal, or community print notice:\n\n- terse, observant, romantic, and free-spirited without becoming sentimental;\n- human and specific rather than inspirational;\n- quiet confidence, dry wit, or factual clarity;\n- no sales language, CTA, hype, productivity slogans, or brand manifesto voice.\n\nFor summer, movement, travel, leisure, music, and night subjects, make romantic freedom the default emotional register. Express it through a physical sensation, an open direction, an unhurried gesture, or a small relationship between subject and space. Favor fresh English fragments such as an observation or invitation, never a generic motivational slogan. For factual, civic, scientific, or archival subjects, let clarity override this romantic default.\n\nIf text must be invented, prefer an English observation, plain declaration, object label, or small contradiction. Never reuse wording visible in reference images or repeat a stock phrase across unrelated outputs.\n\nFor romantic, intimate, nostalgic, or poetic prompts, express feeling through one observable relationship: two figures sharing one edge, an object carrying signs of use, a crop that implies closeness, or a small distance between forms. Do not default to string lights, wine glasses, fluttering fabric, stars, flowers, sunset silhouettes, or cinematic haze. Those props describe a romance category; a specific relationship creates romance while preserving the reference set's graphic directness.","sourceFormat":"markdown"},"note:sha256:a7d09bd92c7ad405f274b84a138c45bb3901e4f37ed829dc31b8a1e2c7348c66":{"blocks":[{"children":[{"title":"crisp screening or clean plate separation for contemporary work; coarse halftone, risograph grain, cyanotype-like exposure, photocopy breakup, or newspaper screening when materially useful or explicitly requested;"},{"title":"visible dots at close range, recognizable subject at thumbnail scale;"},{"title":"clipped highlights where paper shows through and dense shadows where ink pools;"},{"title":"optional mild ink bleed, uneven coverage, scan noise, paper fibers, or 1-2 mm registration drift between plates; use fewer imperfections for contemporary branding and clean editorial work;"},{"title":"medium contrast; avoid glossy photographic depth."}],"kind":"section","title":"Convert photographs and illustrations into the selected ink plate or plates plus substrate. Choose reproduction intensity from the subject instead of automatically aging every image"},{"children":[],"kind":"leaf","title":"When no source image is supplied, do not default to a polished photorealistic hero person or a complete stock-photo figure. Prefer 2-4 identifying anchors such as a hand on a handlebar, one bent leg, a wheel arc, loose fabric, or hair direction. Build the subject from a partial editorial crop, simplified screened fragment, and one ordinary in-between gesture. For movement subjects, the object or cropped body relationship may carry the focal event while the person remains incomplete. Avoid advertising poses, victory gestures, athletic hero angles, catalog-style full bodies, and the safe headline-left/photo-right split unless the user asks for them."}],"html":"\u003cp\u003eConvert photographs and illustrations into the selected ink plate or plates plus substrate. Choose reproduction intensity from the subject instead of automatically aging every image:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecrisp screening or clean plate separation for contemporary work; coarse halftone, risograph grain, cyanotype-like exposure, photocopy breakup, or newspaper screening when materially useful or explicitly requested;\u003c/li\u003e\n\u003cli\u003evisible dots at close range, recognizable subject at thumbnail scale;\u003c/li\u003e\n\u003cli\u003eclipped highlights where paper shows through and dense shadows where ink pools;\u003c/li\u003e\n\u003cli\u003eoptional mild ink bleed, uneven coverage, scan noise, paper fibers, or 1-2 mm registration drift between plates; use fewer imperfections for contemporary branding and clean editorial work;\u003c/li\u003e\n\u003cli\u003emedium contrast; avoid glossy photographic depth.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWhen no source image is supplied, do not default to a polished photorealistic hero person or a complete stock-photo figure. Prefer 2-4 identif
