log .dmnd-viewer-dialog-body{color:var(--md-text)}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog a{color:var(--md-link)}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog a:hover{color:var(--md-link-hover)}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog img{border-color:#46515a}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-note-dialog .dmnd-viewer-asset-placeholder,#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-remote-image-placeholder{border-color:#52606b;background:#20262c;color:#aeb7c2}#dmnd-interactive-root[data-color-theme=dark] .dmnd-viewer-remote-image-placeholder:hover{border-color:#38bdf894;background:#38bdf814;color:var(--primary)}@media(prefers-reduced-motion:reduce){.dmnd-viewer-remote-images-button svg,.dmnd-viewer-remote-image-placeholder svg{animation:none!important}}
</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-01T00:59:40.170Z","language":"zh-CN","name":"DeMinds","version":"1.0.29"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Monocolor Editorial Print.SKILL","outlineVersion":1},"sourceRevision":"sha256:ccc7fb8d5b4ee59307a0982163ecc26472356b08caab94889d06a626f58494d7","workingMarkdownPath":"content/working.md"},"document":{"importSource":{"github":{"owner":"yanliudesign","path":"SKILL.md","ref":"main","repo":"mono-color-skill"},"kind":"remote_markdown","sourceKind":"github_blob","sourceType":"url","sourceUrl":"https://github.com/yanliudesign/mono-color-skill/blob/main/SKILL.md"},"sourceName":"SKILL.md","sourceUrl":"https://github.com/yanliudesign/mono-color-skill/blob/main/SKILL.md","title":"Monocolor Editorial Print.SKILL"},"files":[{"byteLength":34286,"content":"---\nname: mono-color\ndescription: Generate original one-ink or controlled two-ink editorial images from any theme, sentence, article idea, object, or reference photo. Always use this skill when the user asks for 单色海报、双色印刷、单色调视觉、蓝色/绿色孔版印刷、risograph、网点照片、复古或当代编辑排版、zine poster, monochrome editorial poster, duotone print, or asks to use the mono-color style. It uses an adaptive white, gray, or pale-beige substrate, no more than two printing inks, active negative space, terse human language, and strong serif/grotesk/mono typography without making retro styling the default or copying a source composition, wording, logo, or artwork. Produce both the final generation prompt and the generated raster image unless the user explicitly asks for prompt only.\n---\n\n# Monocolor Editorial Print.SKILL\n\nTurn any user theme or image into an original printed editorial artifact with one stable visual language:\n\n\u003e adaptive neutral substrate + one or two inks + reproduced image + typographic tension + concise human voice\n\nDo not imitate any one reference. Recombine the system below into a new composition every time.\n\n## Default Deliverable\n\nCreate:\n\n1. one final image-generation prompt;\n2. one generated raster image;\n3. a short recipe note naming palette, layout family, type pairing, and print process.\n\nSave generated files under `~/Desktop/Claude skills/mono-color/` when a file path is available. Create the folder if needed. Stop at prompt-only only when the user explicitly asks for it or no image-generation capability is available.\n\n## Input Reading\n\nExtract four things before composing:\n\n- **Subject:** the one person, object, scene, or idea that must remain recognizable.\n- **Intent:** poetic observation, announcement, field note, personal statement, cultural poster, or specimen page.\n- **Words:** preserve exact supplied text in its original language. When no text is supplied, invent one English display phrase of 2-8 words and preserve it across retries. Omit display text only when the user explicitly requests a text-free image.\n- **Image role:** hero photograph, isolated specimen, cropped fragment, texture source, or no supplied image.\n- **Representation:** faithful reproduction or abstract symbol extraction. Choose abstract symbol extraction when the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment.\n\nFor a complex topic, choose one concrete visual metaphor. Do not illustrate every point.\n\nWhen the user supplies an image, preserve its identity and core factual content. In faithful reproduction, crop, isolate, enlarge, simplify, or convert it to halftone. In abstract symbol extraction, preserve 2-4 identifying anchors while replacing photographic description with simplified masses, contours, repeated marks, and exposed paper. Never replace the subject or invent branded details.\n\n### Recipe Manifest\n\nBefore writing the generation prompt, resolve the input into this manifest. Do not skip fields and do not expose the manifest unless the user asks for process details.\n\nUse the machine-readable catalogs in `design-system/` as the source of truth for palette IDs, typography roles, composition geometry, carrier signals, visual rhythm, and controlled print imperfections. Read only the relevant catalog for the current decision. The prose below explains intent; when an exact value differs, the catalog wins.\n\n```yaml\nsubject: \u003cone recognizable subject\u003e\nintent: \u003cone intent from Input Reading\u003e\nexact_text: \u003cuser text, generated 2-8 word phrase, or none\u003e\ntext_language: \u003clanguage of supplied text, otherwise English\u003e\nrepresentation: \u003cfaithful reproduction or abstract symbol extraction\u003e\nratio: \u003cexplicit ratio or 3:4\u003e\ncarrier: \u003cone carrier ID from design-system/carriers.json or none\u003e\nsubstrate: \u003cone substrate ID and exact hex from design-system/colors.json\u003e\nmode: \u003cpure one-ink, chromatic + black, complementary duotone, or overprint duotone\u003e\npalette: \u003cone palette ID from design-system/colors.json\u003e\ninks: \u003cthe palette's named ink or approved pair with exact hex values\u003e\nplate_roles: \u003cone explicit role per ink plate\u003e\nlayout: \u003cone composition ID from design-system/compositions.json\u003e\nempty_paper: \u003cexplicit percentage\u003e\nvisual_tension: \u003crelaxed, balanced, or assertive from design-system/rhythm.json\u003e\nfocal_event: \u003cone strong visual event from design-system/rhythm.json\u003e\nrelease_zone: \u003cone deliberately quiet region that gives the focal event room\u003e\nunresolved_edge: \u003cone optional edge behavior from design-system/rhythm.json or none\u003e\nimage_treatment: \u003cone mechanical reproduction process\u003e\ntype_hierarchy: \u003cone role ID from design-system/typography.json\u003e\ndisruption: \u003cone deliberate disruption\u003e\nimperfection_seed: \u003cstable hash derived from the resolved recipe\u003e\nimperfections: \u003c0-2 restrained effect IDs for contemporary work, or 2-3 for tactile/vintage work\u003e\n```\n\nUse these defaults whenever the user has not made the choice:\n\n- ratio: `3:4`;\n- representation: `faithful reproduction`, unless the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment;\n- text language: English for all invented display text, labels, and microcopy;\n- substrate: select from Neutral White `#FAFAF7`, Cool Gray `#E9E9E5`, or Pale Beige `#F5F1E8` according to the subject, image values, and ink contrast. Neutral White is the unspecified default; never assume beige or aged paper merely because the work uses halftone or risograph language;\n- mode and ink: controlled two-ink by default. Use Cobalt + Terracotta `#2148B8` + `#C65F38` for an unspecified subject, then select the closest approved pair for the subject. The dominant plate carries 70%-85% and the accent plate carries 15%-30%. Switch to pure one-ink only when the user explicitly requests one ink, monochrome, or one named ink without a second color;\n- empty paper: `35%`;\n- visual tension: `relaxed` for reflective, travel, summer, leisure, lifestyle, and unspecified cultural subjects; `balanced` for ordinary events and editorial information; `assertive` only when the user requests a forceful declaration or the phrase itself is the subject;\n- focal event: choose exactly one strong visual event and make all other devices support or release it;\n- release zone: reserve one large quiet region with low information density; its size follows the composition rather than a universal percentage;\n- unresolved edge: use one only when it strengthens the focal event or release zone; otherwise use none;\n- image treatment: clean plate separation or medium screening for contemporary work; coarse halftone only when the subject, supplied image, or user request benefits from it;\n- type hierarchy: resolve the role from `design-system/typography.json`. Use Literary for intimate or quiet subjects, Cultural Grotesk for music and contemporary culture, Condensed Civic for public events, Programmatic when dates or structured facts lead, Rotated Display for bold covers, Handwritten Interjection only as a secondary human voice, and Typographic Object when the phrase itself is the image;\n- disruption: one off-center image crop; use one oversized word instead when there is no image.\n- imperfections: choose 0-2 subtle effects for contemporary editorial work and 2-3 effects for tactile, vintage, archival-aging, or explicitly rough work, using a stable hash of subject, exact text, palette, and layout; preserve the same seed across retries.\n\nExplicit user choices override defaults unless they violate the two-ink limit or the originality firewall. For identical inputs, resolve the same manifest; do not vary palette, layout, percentages, or process merely for novelty. This stabilizes the design procedure while image-generation details may still vary.\n\nResolve generic color words consistently: blue to Cobalt, green to Botanical Green, orange to Terracotta Orange, red to Signal Red, purple to Aubergine, and black to Charcoal. For generic green + black, use Mint Green + Charcoal. For generic blue + orange, use Cobalt + Terracotta. Exact named inks always take precedence over these aliases.\n\n## Visual DNA\n\n### 1. Color System\n\nDefault to controlled two-ink. Give the dominant and accent plates separate content roles before composing; never use the second ink merely to decorate the page. Switch to pure one-ink when the user explicitly requests one ink, monochrome, or one named ink without a second color. The paper substrate does not count as an ink.\n\n- **Substrate:** choose Neutral White `#FAFAF7`, Cool Gray `#E9E9E5`, or Pale Beige `#F5F1E8`. White suits crisp cultural, social, event, and colorful image-led work; cool gray suits architecture, technology, charcoal-led systems, and restrained branding; pale beige suits tactile, food, travel, intimate, archival, or explicitly nostalgic subjects.\n- **Contemporary default:** the substrate is clean and neutral, not yellowed. Halftone and plate logic describe reproduction, not an era. Do not add fading, sepia, antique props, distressed borders, or aged-paper staining unless the user asks for retro, vintage, archival aging, or historical mood.\n- **Plate limit:** use two assigned printing plates by default and never more than two ink plates; explicit one-ink requests use one plate.\n- **Ink density:** darker coverage may appear near-black and sparse halftones may appear pale. These are density changes, not extra inks.\n- **Paper exposure:** keep the paper visible. Never tint the whole page into a digital monochrome wash.\n\n#### One-Ink Palette\n\n- **Cobalt / Ultramarine:** `#2148B8`, the default for technology, knowledge, cities, music, and cultural subjects.\n- **Royal Blue:** `#2058D4`, a brighter branch for youth culture, fashion, movement, and energetic editorial pages.\n- **Botanical Green:** `#008A4B`, for botanical, ecological, archival, and explicitly green subjects.\n- **Mint Green:** `#5EB783`, for observation journals, soft natural subjects, and quiet editorial photography.\n- **Terracotta Orange:** `#C65F38`, for classical art, food, travel, summer, and tactile objects.\n- **Signal Red:** `#C83232`, for declarations, music, events, and civic or public-culture subjects.\n- **Aubergine:** `#63365F`, for literature, cinema, night, and intimate cultural subjects.\n- **Charcoal:** `#30343A`, for architecture, photography, research, and restrained publications.\n\n#### Two-Ink Recipes\n\nUse a known pair rather than improvising arbitrary colors:\n\n- **Powder Blue + Signal Red:** `#9EB8D3` + `#C83232` for guides, announcements, and information-heavy editorial pages.\n- **Cobalt + Terracotta:** `#2148B8` + `#C65F38` for travel, summer, food, and lifestyle subjects.\n- **Botanical Green + Oxblood:** `#008A4B` + `#8F3434` for plants, natural wine, bookstores, and archives.\n- **Charcoal + Signal Red:** `#30343A` + `#C83232` for architecture, exhibitions, reports, and conceptual work.\n- **Electric Blue + Carbon:** `#173AE3` + `#242321` for high-contrast cultural events and image-led editorial pages.\n- **Mint Green + Charcoal:** `#5EB783` + `#302D2E` for journals, essays, observations, and long-form reading.\n- **Ultramarine + Safety Orange:** `#263E99` + `#E55D2B` for movement, objects, youth culture, and active urban subjects.\n- **Cyan + Brick Red:** `#159DDA` + `#B64032` for repeated products, exhibitions, and playful information systems.\n- **Tangerine + Slate Blue:** `#E46C2D` + `#4773A5` for markets, festivals, illustrated notices, and large typographic compositions.\n\n#### Print Modes\n\n1. **Pure one-ink:** one ink carries image, typography, and rules through density changes. Use this when the user explicitly requests one ink, monochrome, or one named ink without a second color.\n2. **Chromatic ink + black:** the chromatic plate carries the photograph or dominant graphic; carbon or charcoal carries long text and precision labels. This is the default branch for quiet, observational, natural, architectural, and long-form subjects.\n3. **Complementary duotone:** one dominant ink occupies 70%-85% of the printed area; the accent ink occupies 15%-30% and has a specific role such as dates, annotations, or selected objects. This is the general default, with Cobalt + Terracotta as the fallback pair.\n4. **Overprint duotone:** two plates may overlap. The darker mixed appearance in overlap zones is a physical consequence of two inks and does not count as a third ink.\n\nAssign each plate a role before composing. Never scatter two colors as arbitrary decoration. These constraints keep the result mechanically printed rather than digitally color-graded.\n\n### 2. Space and Grid\n\n- Use a flat, front-facing paper canvas with no mockup, frame, desk, or cast shadow.\n- Default to a `3:4` vertical poster. Respect a user-specified ratio.\n- Keep 25%-55% of the canvas as visibly empty paper.\n- Use generous outer margins: 5%-9% of page width.\n- Align most elements to one invisible left edge or a simple 2-3 column editorial grid.\n- Create one deliberate disruption: a floating word, off-center image, oversized title, circular mark, or tiny annotation.\n- Never center every element. Never distribute objects evenly like a template.\n\nNegative space is active pacing, not leftover room.\n\n#### Visual Tension and Uneven Energy\n\nRead `design-system/rhythm.json` whenever the user asks for relaxed, loose, effortless, casual, quiet, breezy, or understated work, or when the default intent maps to `relaxed`. Treat relaxation as a compositional decision, not a soft-focus mood.\n\nRelaxation is uneven energy, not low energy. For `relaxed` work, choose exactly one strong focal event: oversized type, an extreme crop, one giant object or detail, a concentrated overprint collision, or one abnormal scale relationship. Let it feel decisive. Then release the rest of the page with open paper, pale screening, sparse support type, or one quiet alignment. Do not make every element tasteful, small, or equally calm.\n\n- Keep 25%-55% visibly empty paper, choosing the amount from the focal event rather than a fixed relaxed quota.\n- Allow display type to become large when it is the focal event; when the image or object is the focal event, type must support rather than compete.\n- Use one dominant collision or scale event. Secondary elements may be energetic only when they extend that same event rather than start a second one.\n- Avoid the safe split of headline on one side and a complete photograph on the other. The focal event must cross, crop, interrupt, or materially reorganize the page.\n- An unresolved edge is optional. Use an image fade, inferable cropped word, broken alignment, or open contour only when it strengthens the focal event; never add one as a decorative compliance mark.\n- At thumbnail size, the focal event must be immediately identifiable and the release zone must remain visibly quieter.\n\n### Reference-Derived Composition Grammar\n\nThe reference set shares an object-and-type construction, not a generic retro mood. Build every page from these four moves:\n\n1. **One object dominates.** Use one person, animal, ordinary object, or repeated specimen as the visual anchor. Let it occupy 45%-80% of the page and crop it decisively at one or more edges when scale creates tension. Do not spread several small atmospheric props across the page.\n2. **Type collides with the object.** Let one headline cross, cover, split around, or align tightly against the dominant image. Keep enough contrast for the words to remain readable. Do not place every line in a detached safe zone above the image.\n3. **Paper cuts through the image.** Use clipped highlights, irregular cutout gaps, halftone fade-outs, or plate knockouts so exposed paper becomes a visible shape inside the composition, not only an outer margin.\n4. **One manual gesture interrupts the system.** Choose one circled fact, hand-drawn line, registration mark, tiny symbol, rotated label, or ruled data strip. Use one gesture family only; multiple doodle styles turn the page into scrapbook decoration.\n\nChoose one dominant object and one dominant typographic event before adding secondary information. If either is missing, simplify rather than filling the page with mood-setting decoration.\n\n### 3. Image Treatment\n\nConvert photographs and illustrations into the selected ink plate or plates plus substrate. Choose reproduction intensity from the subject instead of automatically aging every image:\n\n- crisp screening or clean plate separation for contemporary work; coarse halftone, risograph grain, cyanotype-like exposure, photocopy breakup, or newspaper screening when materially useful or explicitly requested;\n- visible dots at close range, recognizable subject at thumbnail scale;\n- clipped highlights where paper shows through and dense shadows where ink pools;\n- optional mild ink bleed, uneven coverage, scan noise, paper fibers, or 1-2 mm registration drift between plates; use fewer imperfections for contemporary branding and clean editorial work;\n- medium contrast; avoid glossy photographic depth.\n\nWhen no source image is supplied, do not default to a polished photorealistic hero person or a complete stock-photo figure. Prefer 2-4 identifying anchors such as a hand on a handlebar, one bent leg, a wheel arc, loose fabric, or hair direction. Build the subject from a partial editorial crop, simplified screened fragment, and one ordinary in-between gesture. For movement subjects, the object or cropped body relationship may carry the focal event while the person remains incomplete. Avoid advertising poses, victory gestures, athletic hero angles, catalog-style full bodies, and the safe headline-left/photo-right split unless the user asks for them.\n\n#### Abstract Looseness\n\nWhen `representation` is `abstract symbol extraction`, transform the supplied image into a small visual vocabulary instead of applying a stylized filter to the whole photograph:\n\n1. Name 2-4 **identity anchors** that make the subject recognizable, such as a square sail, curved hull, mast, and wave direction. Preserve their relationship, not their photographic detail.\n2. Convert the anchors into **one dominant mass**, **one structural contour**, and **one repeated rhythm**. Use flat plate shapes, broken hand-drawn lines, short strokes, dots, or paper cutouts; omit incidental scenery and fine surface description.\n3. Let paper replace at least 35% of the source scene. Crop one anchor at a page edge and allow one type or line element to cross it. Abstraction must create active space, not merely blur or posterize the photo.\n4. Keep the abstract geometry deterministic. Apply looseness through slightly irregular contours, uneven repeated marks, and the recipe's style-appropriate controlled print imperfections; do not randomly move anchors between retries.\n5. Stop before the subject becomes generic. At thumbnail scale, at least two identity anchors must still communicate the original subject without relying on the caption.\n\nFor complementary duotone abstraction, assign the dominant ink to structure and rhythm, and reserve the accent ink for one identity anchor or one annotation. Do not distribute the accent evenly across the page.\n\n#### Controlled Chance\n\nKeep composition, wording, palette, and hierarchy deterministic. Introduce looseness only in the reproduction layer. Contemporary work selects 0-2 restrained effects; tactile, vintage, or archival-aging work selects 2-3 effects from `design-system/imperfections.json` with the resolved recipe's stable seed.\n\n- Let uneven ink density, dry-edge breakup, halftone drift, registration drift, or one broken manual gesture create the analog variation.\n- Apply variation to large type, image plates, solid shapes, or the single gesture family; never distort microcopy or factual text.\n- Keep all effect values inside the catalog ranges. The same resolved input must reproduce the same marks and offsets.\n- In one-ink work, registration drift may appear only as a pale second impression of the same ink. It does not add another color.\n- Do not use controlled chance to move the dominant object, change line breaks, alter the grid, or compensate for an unresolved composition.\n\nUse one dominant image zone occupying 45%-80% of the page, 1-3 isolated specimens whose combined area stays in that range, or one repeated object system. A ruled information poster may reduce the image zone to 32%-55% only when real supplied information needs the space. Dense overlap is allowed only in the **overprint collage** family; it must still read as two printing plates rather than scrapbook decoration.\n\n### 4. Typography\n\nTypography is a responsive cast, not a fixed house font. Read `design-system/typography.json` and choose one primary display skeleton from the subject, wording, and information structure. A series may move between literary serif, wide cultural grotesk, compressed civic sans, engineered program type, rotated display, and word-as-object typography. Consistency across a set comes from ink, spacing, plate logic, and disciplined microtype; do not force every image into the same serif-plus-mono treatment.\n\nBuild each image with one primary display voice and one functional support voice. A third voice is allowed only as one short handwritten interjection. Handwriting supplies human interruption, never dates, locations, essential facts, or long copy.\n\nChoose at most one typographic behavior per image:\n\n- natural lowercase sentence breaks for intimate language;\n- wide or interlocked capitals for music, movement, and contemporary culture;\n- compressed stacked lines for public events;\n- tabular numerals and unequal ruled blocks for programs or schedules;\n- one 90-degree rotation or vertical title for a bold cover;\n- one circled handwritten aside for an invitation or personal note;\n- oversized cropped letterforms when the words are the dominant object.\n\nDo not repeat the same display category across every item in a multi-scene request unless the user explicitly asks for a unified typographic campaign.\n\nRules:\n\n- Use one dramatic scale jump: largest text is 5-12 times the microcopy size.\n- Prefer lowercase for intimate statements and uppercase for public declarations.\n- Keep display copy to 2-8 words and all other copy sparse.\n- Default all invented words to natural English, even when the user's request is written in another language. Preserve user-supplied wording exactly and do not translate it unless asked.\n- Use exact readable wording only when the user supplies it or it carries the concept. Otherwise use plausible microtype as texture and do not invent organizations, URLs, sponsors, or event facts.\n- No gradient type, outline effects, drop shadows, inflated 3D letters, or generic luxury-fashion spacing.\n- Oversized type is valid when selected as the one focal event. Otherwise keep it subordinate to the selected image, object, crop, or overprint event.\n- In `relaxed` work, create a clear strength difference: one typographic move may be audacious while all supporting type becomes sparse and functional.\n- Do not copy a reference's distinctive lettering, exact line breaks, or word arrangement. Translate only the broader contrast, orientation, and voice relationship into an original solution.\n\n### 5. Communication Tone\n\nWrite like an independent cultural poster, field journal, or community print notice:\n\n- terse, observant, romantic, and free-spirited without becoming sentimental;\n- human and specific rather than inspirational;\n- quiet confidence, dry wit, or factual clarity;\n- no sales language, CTA, hype, productivity slogans, or brand manifesto voice.\n\nFor summer, movement, travel, leisure, music, and night subjects, make romantic freedom the default emotional register. Express it through a physical sensation, an open direction, an unhurried gesture, or a small relationship between subject and space. Favor fresh English fragments such as an observation or invitation, never a generic motivational slogan. For factual, civic, scientific, or archival subjects, let clarity override this romantic default.\n\nIf text must be invented, prefer an English observation, plain declaration, object label, or small contradiction. Never reuse wording visible in reference images or repeat a stock phrase across unrelated outputs.\n\nFor romantic, intimate, nostalgic, or poetic prompts, express feeling through one observable relationship: two figures sharing one edge, an object carrying signs of use, a crop that implies closeness, or a small distance between forms. Do not default to string lights, wine glasses, fluttering fabric, stars, flowers, sunset silhouettes, or cinematic haze. Those props describe a romance category; a specific relationship creates romance while preserving the reference set's graphic directness.\n\n## Composition Decision Flow\n\nChoose the layout from the content, not at random. Walk this list from top to bottom and use the first matching rule unless the user explicitly requests a layout:\n\n1. Is the content an event, method, schedule, or factual announcement?\n   - Yes: choose **ruled information poster**.\n2. Is the subject botanical, collected, or taxonomic?\n   - Yes: choose **archival plate** and consider botanical green.\n3. Is one ordinary object explicitly requested as a repeated rhythm?\n   - Yes: choose **object field**.\n4. Does the concept explicitly depend on two images, colors, or type layers physically crossing?\n   - Yes: choose **overprint collage** and use overprint duotone.\n5. Is there one supplied portrait or scene photograph?\n   - Yes, and representation is faithful reproduction: choose **image field**.\n   - Yes, and representation is abstract symbol extraction: choose **editorial cover** by default; choose **overprint collage** only when two extracted layers must physically cross.\n6. Are there 1-3 supplied isolated objects intended for labels or comparison?\n   - Yes: choose **specimen annotation**.\n7. Is the user's phrase itself the main visual subject?\n   - Yes: choose **type-led declaration**.\n8. Is the content reflective, dated, or essay-like with a primary photograph and readable text?\n   - Yes: choose **editorial journal**.\n9. Otherwise choose **editorial cover**.\n\n### Layout Families\n\n- **Image field:** large screened image crossing at least one page edge; headline overlaps or locks tightly to it; compact footer.\n- **Specimen annotation:** 1-3 isolated cutouts with numbered labels, one oversized phrase, and asymmetric empty space.\n- **Type-led declaration:** headline controls the page; a smaller screened image interrupts or grounds it.\n- **Ruled information poster:** one dominant screened object or scene is crossed by a headline; thin one-ink rules form one metadata band and the date remains subordinate.\n- **Archival plate:** title, one rectangular image plate, and a disciplined multi-column caption block.\n- **Editorial cover:** title near one edge, one dominant image zone, sparse issue-like microcopy, no fake masthead brand.\n- **Object field:** one recognizable object repeated at varied scale, crop, or angle to form a printed rhythm; keep one open zone for title and facts.\n- **Overprint collage:** two ink plates carry separate object, image, geometric, or typographic layers and cross in selected zones; use overlap deliberately, not everywhere.\n- **Editorial journal:** one primary screened photograph, a strong title or date, and 2-3 disciplined text columns with enough size and contrast for real reading.\n\n## Prompt Compiler\n\nWrite the final prompt in five compact paragraphs, in this order:\n\n1. **Canvas and ink:** ratio, exact neutral substrate and reason for choosing it, exact one- or two-ink palette, print mode, plate roles, and flat front-facing page.\n2. **Original composition:** chosen layout family, visual-tension profile, one focal event, one release zone, margins, empty-space percentage, grid, dominant object scale and edge crop, optional unresolved edge, and one manual gesture.\n3. **Subject:** what appears; for faithful reproduction, describe preservation, crop, size, halftone treatment, and paper exposure; for abstract symbol extraction, name the 2-4 identity anchors, dominant mass, structural contour, repeated rhythm, omitted detail, and where exposed paper cuts through the scene.\n4. **Typography and words:** hierarchy, type voices, exact short display text, and the explicit overlap, crossing, split, or tight alignment between headline and dominant object; include a ruled data strip only when needed.\n5. **Material and avoids:** dots, fibers, bleed, misregistration, plus the hard negative constraints and any topic-specific cliches to exclude.\n\nDescribe only visible outcomes. Do not mention reference artists, studios, sample posters, or “in the style of.”\n\n## Originality Firewall\n\nThe reference is evidence for a visual grammar, never a layout to trace.\n\nBefore generation, change at least four of these from any supplied reference:\n\n- subject and crop;\n- layout family;\n- headline wording;\n- headline location;\n- image shape or count;\n- grid structure;\n- type pairing;\n- metadata treatment;\n- ratio;\n- disruption device.\n\nNever reproduce a reference's exact object arrangement, line breaks, labels, dates, logos, border system, or distinctive slogan. Never include fake signatures or publication marks. If the user's source image contains protected or branded material, transform only the user's provided material and avoid presenting the result as an official artifact.\n\n## Hard Avoids\n\nAlways exclude:\n\n- more than two printing inks, unassigned accent colors, gradients, rainbow accents, neon, or full-color photography;\n- clean vector-flat digital poster aesthetics;\n- beige lifestyle minimalism or monochrome color wash;\n- glossy mockups, 3D depth, cinematic lighting, lens blur, hard shadows;\n- centered template symmetry, card grids, UI panels, stickers, decorative blobs;\n- scrapbook collage, uncontrolled overlap, grunge overload, or torn-paper styling;\n- automatic vintage styling, yellowed paper, sepia aging, distressed borders, nostalgic props, or retro type merely because the image uses halftone or limited inks;\n- long paragraphs, marketing copy, CTA buttons, logos, URLs, QR codes;\n- exact imitation of a supplied poster or recognizable artist signature.\n\n## Generation and Inspection\n\n1. Generate the image with the compiled prompt.\n2. Inspect it at full size and thumbnail size.\n3. Regenerate once when any of these fail:\n   - a one-ink composition shows a second ink, or a two-ink composition shows a third printing ink;\n   - a two-ink composition lacks clear plate roles or uses the accent across more than 30% without a subject-driven reason;\n   - the page reads as digitally color-graded rather than physically printed;\n   - empty paper falls outside 25%-55%;\n   - the subject is unrecognizable;\n   - typography lacks a clear 5x or greater scale jump;\n   - long text is garbled or invented branding appears;\n   - the composition closely follows a supplied reference.\n   - a relaxed result has no immediately identifiable focal event or distributes equal emphasis across the whole page;\n   - a theme-only person becomes a complete stock-photo figure or the page falls into a safe headline-left/photo-right split;\n   - the release zone is filled with decorative microcopy, gestures, or secondary focal points.\n4. If exact text renders incorrectly after one retry, generate a text-light base image and state that typography should be overlaid in a layout tool. Do not pretend distorted text is correct.\n\n## Output Format\n\n````markdown\n**生成图**\n\n![Monocolor editorial print](absolute-image-path-or-rendered-image)\n\n**最终 Prompt**\n\n```text\n[prompt used for generation]\n```\n\n**本次配方**\n\n- Mode: [pure one-ink / chromatic + black / complementary duotone / overprint duotone]\n- Ink: [exact one- or two-ink palette and hex values]\n- Layout: [layout family]\n- Type: [editorial voice + utility voice]\n- Process: [halftone/risograph/cyanotype/photocopy treatment]\n- Originality: [one sentence naming the major structural departures from references]\n````\n\n## Final Quality Gate\n\n- Is there one intentionally selected white, gray, or pale-beige substrate and no more than two printing inks?\n- Does the result read as contemporary editorial by default, with vintage or aged styling present only when requested?\n- If there are two inks, does each plate have a clear role and does the accent remain controlled?\n- Does 25%-55% of the page remain visibly empty?\n- Is the image reproduced through dots or mechanical print texture rather than a color filter?\n- Does one object occupy 45%-80% of the page, except for a justified information-heavy layout?\n- Does the headline visibly cross, cover, split around, or lock tightly to the dominant object?\n- Does exposed paper form a visible shape inside the image through highlights, gaps, fade-outs, or knockouts?\n- Is there exactly one manual gesture family rather than several decorative doodle styles?\n- Does the type hierarchy use a 5x-12x scale jump and no more than three type voices?\n- Does the page have exactly one immediately identifiable focal event?\n- Is there one visibly quieter release zone rather than evenly distributed emptiness?\n- For relaxed work, is energy concentrated in the focal event rather than reduced everywhere?\n- If no source image was supplied, does the figure feel observed in an ordinary in-between moment rather than posed as an advertisement?\n- If type is page-filling, is it the selected focal event while the remaining devices retreat?\n- Is the language terse, specific, and non-commercial?\n- Is the user's supplied subject preserved?\n- Are at least four structural features different from every supplied reference?\n- Did the run generate an image unless prompt-only was requested?\n\n## Example Triggers\n\n- “用 mono-color 做一张关于夏天散步的海报。”\n- “把这张咖啡照片变成蓝色网点编辑封面。”\n- “做一个绿色植物主题的孔版印刷 poster。”\n- “沿用之前那套单色、留白、复古印刷的视觉。”\n- “Make this portrait into a one-ink editorial zine cover.”\n- “用蓝橙双色叠印做一张城市骑行活动视觉。”\n- “把这个产品做成重复物件构图的双色孔版印刷封面。”\n- “用绿色照片和黑色正文做一页观察日志。”\n","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"c2066c0a405ff7a9f27ae673a6e1cc7b7a383385eafd67d91a96e094d85f9d39","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"univ e\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"2,3","tag":"h2"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003eSubstrate:\u003c/strong\u003e\u0026nbsp;choose Neutral White\u0026nbsp;\u003ccode style=\"background: rgba(0,0,0,0.06); padding: 2px 4px; border-radius: 4px; font-family: var(--font-code); font-size: 0.9em; color: #d946ef;\"\u003e#FAFAF7\u003c/code\u003e, Cool Gray\u0026nbsp;\u003ccode style=\"background: rgba(0,0,0,0.06); padding: 2px 4px; border-radius: 4px; font-family: var(--font-code); font-size: 0.9em; color: #d946ef;\"\u003e#E9E9E5\u003c/code\u003e, or Pale Beige\u0026nbsp;\u003ccode style=\"background: rgba(0,0,0,0.06); padding: 2px 4px; border-radius: 4px; font-family: var(--font-code); font-size: 0.9em; color: #d946ef;\"\u003e#F5F1E8\u003c/code\u003e. White suits crisp cultural, social, event, and colorful image-led work; cool gray suits architecture, technology, charcoal-led systems, and restrained branding; pale beige suits tactile, food, travel, intimate, archival, or explicitly nostalgic subjects.\u003c/span\u003e","payload":{"lines":"6,7","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003eContemporary default:\u003c/strong\u003e\u0026nbsp;the substrate is clean and neutral, not yellowed. Halftone and plate logic describe reproduction, not an era. Do not add fading, sepia, antique props, distressed borders, or aged-paper staining unless the user asks for retro, vintage, archival aging, or historical mood.\u003c/span\u003e","payload":{"lines":"7,8","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003ePlate limit:\u003c/strong\u003e\u0026nbsp;use two assigned printing plates by default and never more than two ink plates; explicit one-ink requests use one plate.\u003c/span\u003e","payload":{"lines":"8,9","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003eInk density:\u003c/strong\u003e\u0026nbsp;darker coverage may appear near-black and sparse halftones may appear pale. These are density changes, not extra inks.\u003c/span\u003e","payload":{"lines":"9,10","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003ePaper exposure:\u003c/strong\u003e\u0026nbsp;keep the paper visible. Never tint the whole page into a digital monochrome wash.\u003c/span\u003e","payload":{"lines":"10,11","tag":"h4"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" nt=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e1. Color System\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:ea8f87a765901714ee3ffb0390c0e6a5b8901eb450ec0d8f4baefb6bf8905479\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"5,6","tag":"h3"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eKeep 25%-55% visibly empty paper, choosing the amount from the focal event rather than a fixed relaxed quota.\u003c/span\u003e","payload":{"lines":"33,34","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eAllow display type to become large when it is the focal event; when the image or object is the focal event, type must support rather than compete.\u003c/span\u003e","payload":{"lines":"34,35","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eUse one dominant collision or scale event. : anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eDoes the headline visibly cross, cover, split around, or lock tightly to the dominant object?\u003c/span\u003e","payload":{"lines":"110,111","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eDoes exposed paper form a visible shape inside the image through highlights, gaps, fade-outs, or knockouts?\u003c/span\u003e","payload":{"lines":"111,112","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIs there exactly one manual gesture family rather than several decorative doodle styles?\u003c/span\u003e","payload":{"lines":"112,113","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eDoes the type hierarchy use a 5x-12x scale jump and no more than three type voices?\u003c/span\u003e","payload":{"lines":"113,114","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eDoes the page have exactly one immediately identifiable focal event?\u003c/span\u003e","payload":{"lines":"114,115","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIs there one visibly quieter release zone rather than evenly distributed emptiness?\u003c/span\u003e","payload":{"lines":"115,116","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eFor relaxed work, is energy concentrated in the focal event rather than reduced everywhere?\u003c/span\u003e","payload":{"lines":"116,117","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIf no source image was supplied, does the figure feel observed in an ordinary in-between moment rather than posed as an advertisement?\u003c/span\u003e","payload":{"lines":"117,118","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIf type is page-filling, is it the selected focal event while the remaining devices retreat?\u003c/span\u003e","payload":{"lines":"118,119","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIs the language terse, specific, and non-commercial?\u003c/span\u003e","payload":{"lines":"119,120","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eIs the user's supplied subject preserved?\u003c/span\u003e","payload":{"lines":"120,121","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eAre at least four structural features different from every supplied reference?\u003c/span\u003e","payload":{"lines":"121,122","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eDid the run generate an image unless prompt-only was requested?\u003c/span\u003e","payload":{"lines":"122,123","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eFinal Quality Gate\u003c/span\u003e","payload":{"fold":1,"lines":"103,104","tag":"h2"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e“用 mono-color 做一张关于夏天散步的海报。”\u003c/span\u003e","payload":{"lines":"124,125","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e“把这张咖啡照片变成蓝色网点编辑封面。”\u003c/span\u003e","payload":{"lines":"125,126","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e“做一个绿色植物主题的孔版印刷 poster。”\u003c/span\u003e","payload":{"lines":"126,127","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e“沿用之前那套单色、留白、复古印刷的视觉。”\u003c/span\u003e","payload":{"lines":"127,128","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e“Make this portrait into a one-ink editorial zine cover.”\u003c/span\u003e","payload":{"lines":"128,129","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e“用蓝橙双色叠印做一张城市骑行活动视觉。”\u003c/span\u003e","payload":{"lines":"129,130","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e“把这个产品做成重复物件构图的双色孔版印刷封面。”\u003c/span\u003e","payload":{"lines":"130,131","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e“用绿色照片和黑色正文做一页观察日志。”\u003c/span\u003e","payload":{"lines":"131,132","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eExample Triggers\u003c/span\u003e","payload":{"lines":"123,124","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eMonocolor Editorial Print.SKILL\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Monocolor Editorial Print.SKILL\" data-note-id=\"note:sha256:9c3f5d54b2cbbaac421c5f825d2d802ae2c66ba710d2a2b9e6127397ad5b9e54\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003chr\u003e\n\u003ch2 id=\"name-mono-colordescription-generate-original-one-ink-or-controlled-two-ink-editorial-images-from-any-theme-sentence-article-idea-object-or-reference-photo-always-use-this-skill-when-the-user-asks-for-单色海报双色印刷单色调视觉蓝色绿色孔版印刷risograph网点照片复古或当代编辑排版zine-poster-monochrome-editorial-poster-duotone-print-or-asks-to-use-the-mono-color-style-it-uses-an-adaptive-white-gray-or-pale-beige-substrate-no-more-than-two-printing-inks-active-negative-space-terse-human-language-and-strong-serifgroteskmono-typography-without-making-retro-styling-the-default-or-copying-a-source-composition-wording-logo-or-artwork-produce-both-the-final-generation-prompt-and-the-generated-raster-image-unless-the-user-explicitly-asks-for-prompt-only\"\u003ename: mono-color\u003cbr\u003edescription: Generate original one-ink or controlled two-ink editorial images from any theme, sentence, article idea, object, or reference photo. Always use this skill when the user asks for 单色海报、双色印刷、单色调视觉、蓝色/绿色孔版印刷、risograph、网点照片、复古或当代编辑排版、zine poster, monochrome editorial poster, duotone print, or asks to use the mono-color style. It uses an adaptive white, gray, or pale-beige substrate, no more than two printing inks, active negative space, terse human language, and strong serif/grotesk/mono typography without making retro styling the default or copying a source composition, wording, logo, or artwork. Produce both the final generation prompt and the generated raster image unless the user explicitly asks for prompt only.\u003c/h2\u003e\n\u003ch1 id=\"monocolor-editorial-printskill\"\u003eMonocolor Editorial Print.SKILL\u003c/h1\u003e\n\u003cp\u003eTurn any user theme or image into an original printed editorial artifact with one stable visual language:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eadaptive neutral substrate + one or two inks + reproduced image + typographic tension + concise human voice\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDo not imitate any one reference. Recombine the system below into a new composition every time.\u003c/p\u003e\n\u003ch2 id=\"default-deliverable\"\u003eDefault Deliverable\u003c/h2\u003e\n\u003cp\u003eCreate:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eone final image-generation prompt;\u003c/li\u003e\n\u003cli\u003eone generated raster image;\u003c/li\u003e\n\u003cli\u003ea short recipe note naming palette, layout family, type pairing, and print process.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eSave generated files under \u003ccode\u003e~/Desktop/Claude skills/mono-color/\u003c/code\u003e when a file path is available. Create the folder if needed. Stop at prompt-only only when the user explicitly asks for it or no image-generation capability is available.\u003c/p\u003e\n\u003ch2 id=\"input-reading\"\u003eInput Reading\u003c/h2\u003e\n\u003cp\u003eExtract four things before composing:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSubject:\u003c/strong\u003e the one person, object, scene, or idea that must remain recognizable.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIntent:\u003c/strong\u003e poetic observation, announcement, field note, personal statement, cultural poster, or specimen page.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWords:\u003c/strong\u003e preserve exact supplied text in its original language. When no text is supplied, invent one English display phrase of 2-8 words and preserve it across retries. Omit display text only when the user explicitly requests a text-free image.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eImage role:\u003c/strong\u003e hero photograph, isolated specimen, cropped fragment, texture source, or no supplied image.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRepresentation:\u003c/strong\u003e faithful reproduction or abstract symbol extraction. Choose abstract symbol extraction when the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFor a complex topic, choose one concrete visual metaphor. Do not illustrate every point.\u003c/p\u003e\n\u003cp\u003eWhen the user supplies an image, preserve its identity and core factual content. In faithful reproduction, crop, isolate, enlarge, simplify, or convert it to halftone. In abstract symbol extraction, preserve 2-4 identifying anchors while replacing photographic description with simplified masses, contours, repeated marks, and exposed paper. Never replace the subject or invent branded details.\u003c/p\u003e\n\u003ch3 id=\"recipe-manifest\"\u003eRecipe Manifest\u003c/h3\u003e\n\u003cp\u003eBefore writing the generation prompt, resolve the input into this manifest. Do not skip fields and do not expose the manifest unless the user asks for process details.\u003c/p\u003e\n\u003cp\u003eUse the machine-readable catalogs in \u003ccode\u003edesign-system/\u003c/code\u003e as the source of truth for palette IDs, typography roles, composition geometry, carrier signals, visual rhythm, and controlled print imperfections. Read only the relevant catalog for the current decision. The prose below explains intent; when an exact value differs, the catalog wins.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-yaml\"\u003esubject: \u0026lt;one recognizable subject\u0026gt;\nintent: \u0026lt;one intent from Input Reading\u0026gt;\nexact_text: \u0026lt;user text, generated 2-8 word phrase, or none\u0026gt;\ntext_language: \u0026lt;language of supplied text, otherwise English\u0026gt;\nrepresentation: \u0026lt;faithful reproduction or abstract symbol extraction\u0026gt;\nratio: \u0026lt;explicit ratio or 3:4\u0026gt;\ncarrier: \u0026lt;one carrier ID from design-system/carriers.json or none\u0026gt;\nsubstrate: \u0026lt;one substrate ID and exact hex from design-system/colors.json\u0026gt;\nmode: \u0026lt;pure one-ink, chromatic + black, complementary duotone, or overprint duotone\u0026gt;\npalette: \u0026lt;one palette ID from design-system/colors.json\u0026gt;\ninks: \u0026lt;the palette's named ink or approved pair with exact hex values\u0026gt;\nplate_roles: \u0026lt;one explicit role per ink plate\u0026gt;\nlayout: \u0026lt;one composition ID from design-system/compositions.json\u0026gt;\nempty_paper: \u0026lt;explicit percentage\u0026gt;\nvisual_tension: \u0026lt;relaxed, balanced, or assertive from design-system/rhythm.json\u0026gt;\nfocal_event: \u0026lt;one strong visual event from design-system/rhythm.json\u0026gt;\nrelease_zone: \u0026lt;one deliberately quiet region that gives the focal event room\u0026gt;\nunresolved_edge: \u0026lt;one optional edge behavior from design-system/rhythm.json or none\u0026gt;\nimage_treatment: \u0026lt;one mechanical reproduction process\u0026gt;\ntype_hierarchy: \u0026lt;one role ID from design-system/typography.json\u0026gt;\ndisruption: \u0026lt;one deliberate disruption\u0026gt;\nimperfection_seed: \u0026lt;stable hash derived from the resolved recipe\u0026gt;\nimperfections: \u0026lt;0-2 restrained effect IDs for contemporary work, or 2-3 for tactile/vintage work\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUse these defaults whenever the user has not made the choice:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eratio: \u003ccode\u003e3:4\u003c/code\u003e;\u003c/li\u003e\n\u003cli\u003erepresentation: \u003ccode\u003efaithful reproduction\u003c/code\u003e, unless the user asks for abstract, artistic, loose, experimental, less realistic, or less photographic treatment;\u003c/li\u003e\n\u003cli\u003etext language: English for all invented display text, labels, and microcopy;\u003c/li\u003e\n\u003cli\u003esubstrate: select from Neutral White \u003ccode\u003e#FAFAF7\u003c/code\u003e, Cool Gray \u003ccode\u003e#E9E9E5\u003c/code\u003e, or Pale Beige \u003ccode\u003e#F5F1E8\u003c/code\u003e according to the subject, image values, and ink contrast. Neutral White is the unspecified default; never assume beige or aged paper merely because the work uses halftone or risograph language;\u003c/li\u003e\n\u003cli\u003emode and ink: controlled two-ink by default. Use Cobalt + Terracotta \u003ccode\u003e#2148B8\u003c/code\u003e + \u003ccode\u003e#C65F38\u003c/code\u003e for an unspecified subject, then select the closest approved pair for the subject. The dominant plate carries 70%-85% and the accent plate carries 15%-30%. Switch to pure one-ink only when the user explicitly requests one ink, monochrome, or one named ink without a second color;\u003c/li\u003e\n\u003cli\u003eempty paper: \u003ccode\u003e35%\u003c/code\u003e;\u003c/li\u003e\n\u003cli\u003evisual tension: \u003ccode\u003erelaxed\u003c/code\u003e for reflective, travel, summer, leisure, lifestyle, and unspecified cultural subjects; \u003ccode\u003ebalanced\u003c/code\u003e for ordinary events and editorial information; \u003ccode\u003eassertive\u003c/code\u003e only when the user requests a forceful declaration or the phrase itself is the subject;\u003c/li\u003e\n\u003cli\u003efocal event: choose exactly one strong visual event and make all other devices support or release it;\u003c/li\u003e\n\u003cli\u003erelease zone: reserve one large quiet region with low information density; its size follows the composition rather than a universal percentage;\u003c/li\u003e\n\u003cli\u003eunresolved edge: use one only when it strengthens the focal event or release zone; otherwise use none;\u003c/li\u003e\n\u003cli\u003eimage treatment: clean plate separation or medium screening for contemporary work; coarse halftone only when the subject, supplied image, or user request benefits from it;\u003c/li\u003e\n\u003cli\u003etype hierarchy: resolve the role from \u003ccode\u003edesign-system/typography.json\u003c/code\u003e. Use Literary for intimate or quiet subjects, Cultural Grotesk for music and contemporary culture, Condensed Civic for public events, Programmatic when dates or structured facts lead, Rotated Display for bold covers, Handwritten Interjection only as a secondary human voice, and Typographic Object when the phrase itself is the image;\u003c/li\u003e\n\u003cli\u003edisruption: one off-center image crop; use one oversized word instead when there is no image.\u003c/li\u003e\n\u003cli\u003eimperfections: choose 0-2 subtle effects for contemporary editorial work and 2-3 effects for tactile, vintage, archival-aging, or explicitly rough work, using a stable hash of subject, exact text, palette, and layout; preserve the same seed across retries.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eExplicit user choices override defaults unless they violate the two-ink limit or the originality firewall. For identical inputs, resolve the same manifest; do not vary palette, layout, percentages, or process merely for novelty. This stabilizes the design procedure while image-generation details may still vary.\u003c/p\u003e\n\u003cp\u003eResolve generic color words consistently: blue to Cobalt, green to Botanical Green, orange to Terracotta Orange, red to Signal Red, purple to Aubergine, and black to Charcoal. For generic green + black, use Mint Green + Charcoal. For generic blue + orange, use Cobalt + Terracotta. Exact named inks always take precedence over these aliases.\u003c/p\u003e\n\u003ch2 id=\"visual-dna\"\u003eVisual DNA\u003c/h2\u003e\n\u003ch3 id=\"1-color-system\"\u003e1. Color System\u003c/h3\u003e\n\u003cp\u003eDefault to controlled two-ink. Give the dominant and accent plates separate content roles before composing; never use the second ink merely to decorate the page. Switch to pure one-ink when the user explicitly requests one ink, monochrome, or one named ink without a second color. The paper substrate does not count as an ink.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSubstrate:\u003c/strong\u003e choose Neutral White \u003ccode\u003e#FAFAF7\u003c/code\u003e, Cool Gray \u003ccode\u003e#E9E9E5\u003c/code\u003e, or Pale Beige \u003ccode\u003e#F5F1E8\u003c/code\u003e. White suits crisp cultural, social, event, and colorful image-led work; cool gray suits architecture, technology, charcoal-led systems, and restrained branding; pale beige suits tactile, food, travel, intimate, archival, or explicitly nostalgic subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContemporary default:\u003c/strong\u003e the substrate is clean and neutral, not yellowed. Halftone and plate logic describe reproduction, not an era. Do not add fading, sepia, antique props, distressed borders, or aged-paper staining unless the user asks for retro, vintage, archival aging, or historical mood.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePlate limit:\u003c/strong\u003e use two assigned printing plates by default and never more than two ink plates; explicit one-ink requests use one plate.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eInk density:\u003c/strong\u003e darker coverage may appear near-black and sparse halftones may appear pale. These are density changes, not extra inks.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePaper exposure:\u003c/strong\u003e keep the paper visible. Never tint the whole page into a digital monochrome wash.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"one-ink-palette\"\u003eOne-Ink Palette\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCobalt / Ultramarine:\u003c/strong\u003e \u003ccode\u003e#2148B8\u003c/code\u003e, the default for technology, knowledge, cities, music, and cultural subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRoyal Blue:\u003c/strong\u003e \u003ccode\u003e#2058D4\u003c/code\u003e, a brighter branch for youth culture, fashion, movement, and energetic editorial pages.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBotanical Green:\u003c/strong\u003e \u003ccode\u003e#008A4B\u003c/code\u003e, for botanical, ecological, archival, and explicitly green subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMint Green:\u003c/strong\u003e \u003ccode\u003e#5EB783\u003c/code\u003e, for observation journals, soft natural subjects, and quiet editorial photography.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTerracotta Orange:\u003c/strong\u003e \u003ccode\u003e#C65F38\u003c/code\u003e, for classical art, food, travel, summer, and tactile objects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSignal Red:\u003c/strong\u003e \u003ccode\u003e#C83232\u003c/code\u003e, for declarations, music, events, and civic or public-culture subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAubergine:\u003c/strong\u003e \u003ccode\u003e#63365F\u003c/code\u003e, for literature, cinema, night, and intimate cultural subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCharcoal:\u003c/strong\u003e \u003ccode\u003e#30343A\u003c/code\u003e, for architecture, photography, research, and restrained publications.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"two-ink-recipes\"\u003eTwo-Ink Recipes\u003c/h4\u003e\n\u003cp\u003eUse a known pair rather than improvising arbitrary colors:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePowder Blue + Signal Red:\u003c/strong\u003e \u003ccode\u003e#9EB8D3\u003c/code\u003e + \u003ccode\u003e#C83232\u003c/code\u003e for guides, announcements, and information-heavy editorial pages.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCobalt + Terracotta:\u003c/strong\u003e \u003ccode\u003e#2148B8\u003c/code\u003e + \u003ccode\u003e#C65F38\u003c/code\u003e for travel, summer, food, and lifestyle subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBotanical Green + Oxblood:\u003c/strong\u003e \u003ccode\u003e#008A4B\u003c/code\u003e + \u003ccode\u003e#8F3434\u003c/code\u003e for plants, natural wine, bookstores, and archives.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCharcoal + Signal Red:\u003c/strong\u003e \u003ccode\u003e#30343A\u003c/code\u003e + \u003ccode\u003e#C83232\u003c/code\u003e for architecture, exhibitions, reports, and conceptual work.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eElectric Blue + Carbon:\u003c/strong\u003e \u003ccode\u003e#173AE3\u003c/code\u003e + \u003ccode\u003e#242321\u003c/code\u003e for high-contrast cultural events and image-led editorial pages.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMint Green + Charcoal:\u003c/strong\u003e \u003ccode\u003e#5EB783\u003c/code\u003e + \u003ccode\u003e#302D2E\u003c/code\u003e for journals, essays, observations, and long-form reading.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUltramarine + Safety Orange:\u003c/strong\u003e \u003ccode\u003e#263E99\u003c/code\u003e + \u003ccode\u003e#E55D2B\u003c/code\u003e for movement, objects, youth culture, and active urban subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCyan + Brick Red:\u003c/strong\u003e \u003ccode\u003e#159DDA\u003c/code\u003e + \u003ccode\u003e#B64032\u003c/code\u003e for repeated products, exhibitions, and playful information systems.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTangerine + Slate Blue:\u003c/strong\u003e \u003ccode\u003e#E46C2D\u003c/code\u003e + \u003ccode\u003e#4773A5\u003c/code\u003e for markets, festivals, illustrated notices, and large typographic compositions.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"print-modes\"\u003ePrint Modes\u003c/h4\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003ePure one-ink:\u003c/strong\u003e one ink carries image, typography, and rules through density changes. Use this when the user explicitly requests one ink, monochrome, or one named ink without a second color.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eChromatic ink + black:\u003c/strong\u003e the chromatic plate carries the photograph or dominant graphic; carbon or charcoal carries long text and precision labels. This is the default branch for quiet, observational, natural, architectural, and long-form subjects.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eComplementary duotone:\u003c/strong\u003e one dominant ink occupies 70%-85% of the printed area; the accent ink occupies 15%-30% and has a specific role such as dates, annotations, or selected objects. This is the general default, with Cobalt + Terracotta as the fallback pair.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOverprint duotone:\u003c/strong\u003e two plates may overlap. The darker mixed appearance in overlap zones is a physical consequence of two inks and does not count as a third ink.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eAssign each plate a role before composing. Never scatter two colors as arbitrary decoration. These constraints keep the result mechanically printed rather than digitally color-graded.\u003c/p\u003e\n\u003ch3 id=\"2-space-and-grid\"\u003e2. Space and Grid\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eUse a flat, front-facing paper canvas with no mockup, frame, desk, or cast shadow.\u003c/li\u003e\n\u003cli\u003eDefault to a \u003ccode\u003e3:4\u003c/code\u003e vertical poster. Respect a user-specified ratio.\u003c/li\u003e\n\u003cli\u003eKeep 25%-55% of the canvas as visibly empty paper.\u003c/li\u003e\n\u003cli\u003eUse generous outer margins: 5%-9% of page width.\u003c/li\u003e\n\u003cli\u003eAlign most elements to one invisible left edge or a simple 2-3 column editorial grid.\u003c/li\u003e\n\u003cli\u003eCreate one deliberate disruption: a floating word, off-center image, oversized title, circular mark, or tiny annotation.\u003c/li\u003e\n\u003cli\u003eNever center every element. Never distribute objects evenly like a template.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNegative space is active pacing, not leftover room.\u003c/p\u003e\n\u003ch4 id=\"visual-tension-and-uneven-energy\"\u003eVisual Tension and Uneven Energy\u003c/h4\u003e\n\u003cp\u003eRead \u003ccode\u003edesign-system/rhythm.json\u003c/code\u003e whenever the user asks for relaxed, loose, effortless, casual, quiet, breezy, or understated work, or when the default intent maps to \u003ccode\u003erelaxed\u003c/code\u003e. Treat relaxation as a compositional decision, not a soft-focus mood.\u003c/p\u003e\n\u003cp\u003eRelaxation is uneven energy, not low energy. For \u003ccode\u003erelaxed\u003c/code\u003e work, choose exactly one strong focal event: oversized type, an extreme crop, one giant object or detail, a concentrated overprint collision, or one abnormal scale relationship. Let it feel decisive. Then release the rest of the page with open paper, pale screening, sparse support type, or one quiet alignment. Do not make every element tasteful, small, or equally calm.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKeep 25%-55% visibly empty paper, choosing the amount from the focal event rather than a fixed relaxed quota.\u003c/li\u003e\n\u003cli\u003eAllow display type to become large when it is the focal event; when the image or object is the focal event, type must support rather than compete.\u003c/li\u003e\n\u003cli\u003eUse one dominant collision or scale event. Secondary elements may be energetic only when they extend that same event rather than start a second one.\u003c/li\u003e\n\u003cli\u003eAvoid the safe split of headline on one side and a complete photograph on the other. The focal event must cross, crop, interrupt, or materially reorganize the page.\u003c/li\u003e\n\u003cli\u003eAn unresolved edge is optional. Use an image fade, inferable cropped word, broken alignment, or open contour only when it strengthens the focal event; never add one as a decorative compliance mark.\u003c/li\u003e\n\u003cli\u003eAt thumbnail size, the focal event must be immediately identifiable and the release zone must remain visibly quieter.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"reference-derived-composition-grammar\"\u003eReference-Derived Composition Grammar\u003c/h3\u003e\n\u003cp\u003eThe reference set shares an object-and-type construction, not a generic retro mood. Build every page from these four moves:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eOne object dominates.\u003c/strong\u003e Use one person, animal, ordinary object, or repeated specimen as the visual anchor. Let it occupy 45%-80% of the page and crop it decisively at one or more edges when scale creates tension. Do not spread several small atmospheric props across the page.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eType collides with the object.\u003c/strong\u003e Let one headline cross, cover, split around, or align tightly against the dominant image. Keep enough contrast for the words to remain readable. Do not place every line in a detached safe zone above the image.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePaper cuts through the image.\u003c/strong\u003e Use clipped highlights, irregular cutout gaps, halftone fade-outs, or plate knockouts so exposed paper becomes a visible shape inside the composition, not only an outer margin.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOne manual gesture interrupts the system.\u003c/strong\u003e Choose one circled fact, hand-drawn line, registration mark, tiny symbol, rotated label, or ruled data strip. Use one gesture family only; multiple doodle styles turn the page into scrapbook decoration.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eChoose one dominant object and one dominant typographic event before adding secondary information. If either is missing, simplify rather than filling the page with mood-setting decoration.\u003c/p\u003e\n\u003ch3 id=\"3-image-treatment\"\u003e3. Image Treatment\u003c/h3\u003e\n\u003cp\u003eConvert photographs and illustrations into the selected ink plate or plates plus substrate. Choose reproduction intensity from the subject instead of automatically aging every image:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecrisp screening or clean plate separation for contemporary work; coarse halftone, risograph grain, cyanotype-like exposure, photocopy breakup, or newspaper screening when materially useful or explicitly requested;\u003c/li\u003e\n\u003cli\u003evisible dots at close range, recognizable subject at thumbnail scale;\u003c/li\u003e\n\u003cli\u003eclipped highlights where paper shows through and dense shadows where ink pools;\u003c/li\u003e\n\u003cli\u003eoptional mild ink bleed, uneven coverage, scan noise, paper fibers, or 1-2 mm registration drift between plates; use fewer imperfections for contemporary branding and clean editorial work;\u003c/li\u003e\n\u003cli\u003emedium contrast; avoid glossy photographic depth.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWhen no source image is supplied, do not default to a polished photorealistic hero person or a complete stock-photo figure. Prefer 2-4 identifying anchors such as a hand on a handlebar, one bent leg, a wheel arc, loose fabric, or hair direction. Build the subject from a partial editorial crop, simplified screened fragment, and one ordinary in-between gesture. For movement subjects, the object or cropped body relationship may carry the focal event while the person remains incomplete. Avoid advertising poses, victory gestures, athletic hero angles, catalog-style full bodies, and the safe headline-left/photo-right split unless the user asks for them.\u003c/p\u003e\n\u003ch4 id=\"abstract-looseness\"\u003eAbstract Looseness\u003c/h4\u003e\n\u003cp\u003eWhen \u003ccode\u003erepresentation\u003c/code\u003e is \u003ccode\u003eabstract symbol extraction\u003c/code\u003e, transform the supplied image into a small visual vocabulary instead of applying a stylized filter to the
