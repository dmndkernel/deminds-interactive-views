ad":{"lines":"264,265","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eC. 劳动与生产分配筛查\u003c/span\u003e","payload":{"lines":"259,260","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e附：体系筛查的简化判定框架\u003c/span\u003e","payload":{"lines":"249,250","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e附录\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:21f90fcf1b5f1af13267c211295c834bcf5f9019d1193b96f2470f2b68cc5a74\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"265,266","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e社会人际与生产分配的规范公理体系研究｜\u003cbr\u003e作者：王凯宁及其 AI 团队\u003c/span\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"社会人际与生产分配的规范公理体系研究作者王凯宁及其-ai-团队\"\u003e社会人际与生产分配的规范公理体系研究｜\u003cbr\u003e作者：王凯宁及其 AI 团队\u003c/h1\u003e\n\u003ch2 id=\"摘要\"\u003e摘要\u003c/h2\u003e\n\u003cp\u003e本文以五条基础规范公理为唯一规范性元起点，采用公理化规范推演方法，在既定分析域内构建一个自洽、闭合、可筛查的社会制度规范体系。研究覆盖两大核心社会领域：其一为亲密联结、共同生活、亲子抚育的人际秩序；其二为劳动组织、生产资料支配、剩余产出分配的物质生产秩序。\u003c/p\u003e\n\u003cp\u003e本文不以经验归纳、历史叙事或价值偏好择优作为主要论证路径，也不预设任何单一社会制度、家庭形态或经济模式为最优范式，而是从基础公理逐层导出刚性规范原则，进而划分社会制度的绝对禁止边界与合法自由空间。\u003c/p\u003e\n\u003cp\u003e体系严格区分四层逻辑结构：\u003cstrong\u003e公理 → 规范原则 → 制度规则 → 可行制度集合\u003c/strong\u003e。凡违背人格平等、持续自愿、非占有支配与生存保障底线的制度化人格依附、强制绑定、结构性劳动剩余掠夺及基本权利剥夺结构，均被排除在可行制度集合之外；凡不突破公理刚性红线的多元制度形态，均保留为社会自由度。\u003c/p\u003e\n\u003cp\u003e本研究最终论证：规范公理的功能在于划定社会秩序的正义边界，而非唯一锁定社会形态。合法社会秩序具有多元可能性；任何突破底层规范底线的结构性压迫体系，均不具备规范正当性。\u003c/p\u003e\n\u003ch2 id=\"关键要点总结\"\u003e关键要点总结\u003c/h2\u003e\n\u003ch3 id=\"可行性研究边界\"\u003e可行性研究边界\u003c/h3\u003e\n\u003cp\u003e本节仅研究\u003cstrong\u003e未触碰五条基础公理刚性红线、因而仍处于制度自由度范围内的制度形态\u003c/strong\u003e。凡已由公理直接推出为“绝对禁止”的结构，不再作为“可行 / 不可行”的备选方案进入可行性比较，而仅在正文中作为\u003cstrong\u003e规范排除项\u003c/strong\u003e保留。\u003c/p\u003e\n\u003cp\u003e因此，本节中的“可行性”专指：某一制度形态在通过公理红线筛查之后，是否能够在该规范体系内部成立，以及其成立所需的条件、风险控制与制度约束。它不等同于现实世界中的法律可行性、政治可行性、经济效率或社会接受度判断。\u003c/p\u003e\n\u003ch4 id=\"研究流程\"\u003e研究流程\u003c/h4\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e第一步：红线筛查。\u003c/strong\u003e 若制度形态触及人格占有、强制绑定、退出权剥夺、身份层级、结构性垄断剥削、无保障的强制劳动等绝对禁止项，直接排除，不进入可行性研究。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e第二步：条件识别。\u003c/strong\u003e 对通过红线筛查的制度形态，分析其持续自愿、人格平等、资源结构、退出机制、责任基础等成立条件。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e第三步：风险评估。\u003c/strong\u003e 判断合法结构在运行过程中是否可能异化为资源垄断、隐性胁迫、权力固化或事实上的退出阻断。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e第四步：可行空间确认。\u003c/strong\u003e 仅对仍能满足公理约束的制度方案确认其体系内可行性与制度自由度。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"通过红线筛查后的关键制度形态及可行性\"\u003e通过红线筛查后的关键制度形态及可行性\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e制度形态 / 规范安排\u003c/th\u003e\n\u003cth\u003e体系内可行性\u003c/th\u003e\n\u003cth\u003e核心成立条件\u003c/th\u003e\n\u003cth\u003e主要风险与控制要求\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e主体自主决定是否建立亲密联结\u003c/td\u003e\n\u003ctd\u003e基础可行\u003c/td\u003e\n\u003ctd\u003e持续自愿、人格平等、无外部强制\u003c/td\u003e\n\u003ctd\u003e防止传统、身份、舆论转化为事实强制\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e亲密关系保有单方退出权\u003c/td\u003e\n\u003ctd\u003e基础可行\u003c/td\u003e\n\u003ctd\u003e当前同意可撤回，存在实质退出通道\u003c/td\u003e\n\u003ctd\u003e退出成本不得被制度设计为事实上的不可退出\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e自愿排他的一对一亲密关系\u003c/td\u003e\n\u003ctd\u003e可行\u003c/td\u003e\n\u003ctd\u003e双向知情、持续自愿、无永久锁定\u003c/td\u003e\n\u003ctd\u003e排他义务不得在关系终止后被强制延续\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多主体自愿亲密关系\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e全员持续自愿、人格平等、独立退出\u003c/td\u003e\n\u003ctd\u003e防止核心/附属身份、资源垄断及隐性胁迫\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e无亲密关系的独居生活\u003c/td\u003e\n\u003ctd\u003e可行\u003c/td\u003e\n\u003ctd\u003e主体自主选择并具备基本生存条件\u003c/td\u003e\n\u003ctd\u003e防止制度把婚姻、家庭或共同生活设为成年义务\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e无亲密关系的共同生活共同体\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e自愿共享资源与事务、保有退出权\u003c/td\u003e\n\u003ctd\u003e资源集中不得异化为人格支配或退出阻断\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCommons–Consortship（共侣）\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e全员自愿、平等、资源透明、权责可追溯、完整退出\u003c/td\u003e\n\u003ctd\u003e重点防控层级化、资源垄断、退出阻断与隐性剥削\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e儿童抚育与保护责任\u003c/td\u003e\n\u003ctd\u003e必要且可制度化\u003c/td\u003e\n\u003ctd\u003e生存、身心完整与发展得到保障，监护以儿童利益为目的\u003c/td\u003e\n\u003ctd\u003e抚育责任不得转化为人格所有权或永久支配权\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多元儿童抚育结构\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e儿童人格独立、生存有保障、无占有支配\u003c/td\u003e\n\u003ctd\u003e组织形态可以多元，但保护底线不可降低\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e自愿劳动共同体\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e自愿分工、协商分配、经济退出权、再生产保障\u003c/td\u003e\n\u003ctd\u003e防止资源垄断、权力固化与剩余无偿攫取\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e核心生产资料公共共享\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e公平配置、按需使用、共同维护、无层级支配\u003c/td\u003e\n\u003ctd\u003e公共统筹本身不得演化为新型垄断或退出阻断\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e个体小额资源与生产工具差异\u003c/td\u003e\n\u003ctd\u003e可行\u003c/td\u003e\n\u003ctd\u003e不形成垄断性支配，不破坏他人基本生存与退出空间\u003c/td\u003e\n\u003ctd\u003e关注资源差异是否逐渐转化为结构性控制\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可协商、可修订、可退出的分配规则\u003c/td\u003e\n\u003ctd\u003e可行\u003c/td\u003e\n\u003ctd\u003e持续同意、规则透明、可修订、有真实退出机制\u003c/td\u003e\n\u003ctd\u003e防止一次性同意演化为长期固化地位\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多元社会制度并存\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e各制度均先通过五条公理红线筛查\u003c/td\u003e\n\u003ctd\u003e多元性只能存在于刚性规范边界之内\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"不进入可行性研究的绝对排除项\"\u003e不进入可行性研究的绝对排除项\u003c/h3\u003e\n\u003cp\u003e以下类型在本体系中属于\u003cstrong\u003e前置排除对象\u003c/strong\u003e，其功能是界定研究边界，而不是作为候选制度参与可行性比较：制度化人格占有、奴役与人格买卖、强制且不可退出的亲密绑定、身份自动生成的无限责任、以先天身份固化劳动义务、彻底消灭经济退出权的核心资源垄断、无偿且结构化的劳动剩余掠夺，以及其他直接突破五条基础公理的结构。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"第一编体系基础逻辑层级与元规则\"\u003e第一编：体系基础、逻辑层级与元规则\u003c/h2\u003e\n\u003ch3 id=\"一基础规范公理\"\u003e一、基础规范公理\u003c/h3\u003e\n\u003ch4 id=\"11-公理一基本生存身体完整与精神连续性\"\u003e1.1 公理一：基本生存、身体完整与精神连续性\u003c/h4\u003e\n\u003cp\u003e所有主体享有基本生存保障、身体完整与精神连续性的正当权利。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e规范核心\u003c/strong\u003e：任何社会制度不得以组织运行、身份关系或资源分配为由，使主体陷入基本生存失保、身体完整受侵害或人格连续性被摧毁的状态。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e体系功能\u003c/strong\u003e：为儿童保护、劳动再生产保障、经济退出权等后续原则提供底线依据。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"12-公理二公共生存基础不得转化为私人支配权力\"\u003e1.2 公理二：公共生存基础不得转化为私人支配权力\u003c/h4\u003e\n\u003cp\u003e社会公共资源、基础生存资源与公共生产条件，不归属任何个人排他私有；禁止通过私人垄断与世袭固化，将全民生存基础转化为私人支配权力。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e规范核心\u003c/strong\u003e：禁止以核心公共资源的排他控制制造稳定的人格依附与结构性支配。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e适用边界\u003c/strong\u003e：并不等同于否定一切个人生活资料、小型生产工具或合理资源差异；禁止对象是能够转化为系统性支配的垄断结构。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"13-公理三亲密联结以持续自愿为基础\"\u003e1.3 公理三：亲密联结以持续自愿为基础\u003c/h4\u003e\n\u003cp\u003e一切亲密人际联结的正当规范性基础为持续自愿，禁止一切人格占有。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e规范核心\u003c/strong\u003e：亲密关系的正当性不是来自一次性同意，而来自持续有效的当前同意。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e直接推论\u003c/strong\u003e：亲密关系不得被永久锁定，退出权属于其内生属性。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"14-公理四人格主体天然平等\"\u003e1.4 公理四：人格主体天然平等\u003c/h4\u003e\n\u003cp\u003e所有人格主体天然地位平等，不存在主体对其他主体的人格所有权与人格层级。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e规范核心\u003c/strong\u003e：任何身份、资源贡献、历史关系或照护付出，均不能自然生成对他人人格的支配权。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e禁止结构\u003c/strong\u003e：奴役、人格买卖、身份层级、终身人格从属等。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"15-公理五无害前提下的自愿协作自由\"\u003e1.5 公理五：无害前提下的自愿协作自由\u003c/h4\u003e\n\u003cp\u003e主体在无害前提下，拥有自愿缔结协作、建立约定、安排共同事务的自由。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e规范核心\u003c/strong\u003e：公理体系不仅规定禁止边界，也保留广泛的社会制度自由度。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e直接推论\u003c/strong\u003e：只要不突破生存保障、人格平等、持续自愿与非占有边界，多元亲密关系、共同生活和生产协作形态均可进入可行制度集合。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"二体系逻辑层级\"\u003e二、体系逻辑层级\u003c/h3\u003e\n\u003ch4 id=\"21-第一层公理\"\u003e2.1 第一层：公理\u003c/h4\u003e\n\u003cp\u003e公理提供不可被下位制度规则否定的规范起点，构成全部推演的底层边界。\u003c/p\u003e\n\u003ch4 id=\"22-第二层规范原则\"\u003e2.2 第二层：规范原则\u003c/h4\u003e\n\u003cp\u003e规范原则由公理推出，例如持续自愿推出退出权，人格平等推出人格不可占有，生存保障推出儿童保护与劳动再生产保障。\u003c/p\u003e\n\u003ch4 id=\"23-第三层制度规则\"\u003e2.3 第三层：制度规则\u003c/h4\u003e\n\u003cp\u003e制度规则将规范原则转换为可执行的制度边界，例如禁止强制锁定亲密关系、禁止身份自动产生无限义务、要求分配规则可协商与可退出。\u003c/p\u003e\n\u003ch4 id=\"24-第四层可行制度集合\"\u003e2.4 第四层：可行制度集合\u003c/h4\u003e\n\u003cp\u003e制度形态通过前述规则筛查后进入可行集合。该集合可以包含多种彼此不同甚至竞争的制度形态，只要它们均不突破公理红线。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"第二编亲密联结共同生活与照护秩序\"\u003e第二编：亲密联结、共同生活与照护秩序\u003c/h2\u003e\n\u003ch3 id=\"三亲密联结与主体选择权规范体系\"\u003e三、亲密联结与主体选择权规范体系\u003c/h3\u003e\n\u003ch4 id=\"31-基础定义\"\u003e3.1 基础定义\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e亲密联结\u003c/strong\u003e：成年主体之间以持续自愿为基础形成的深度人际联结形态。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e亲密选择权\u003c/strong\u003e：主体自主决定是否、与谁、以何种形式建立、维持或终止亲密联结的基本权利。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"32-亲密选择自主基础原则\"\u003e3.2 亲密选择自主基础原则\u003c/h4\u003e\n\u003ch5 id=\"321-规范命题\"\u003e3.2.1 规范命题\u003c/h5\u003e\n\u003cp\u003e人格平等前提下，亲密联结的建立与存续不接受任何外在强制依据。社会身份、他人需求、传统习俗与公共舆论，均不具备强制主体进入或维持亲密关系的规范效力；亲密状态的最终决定权归属主体自身。\u003c/p\u003e\n\u003ch5 id=\"322-推演逻辑\"\u003e3.2.2 推演逻辑\u003c/h5\u003e\n\u003cp\u003e若亲密联结可由外部力量强制建立或维持，主体的人格选择空间即被外部意志支配，进而形成人格从属或人格占有，违反人格平等与持续自愿两项基础公理。\u003c/p\u003e\n\u003ch5 id=\"323-筛查结论\"\u003e3.2.3 筛查结论\u003c/h5\u003e\n\u003cp\u003e任何非自愿的亲密安排均不具备规范正当性。\u003c/p\u003e\n\u003ch4 id=\"33-亲密联结不可永久锁定原则\"\u003e3.3 亲密联结不可永久锁定原则\u003c/h4\u003e\n\u003ch5 id=\"331-规范命题\"\u003e3.3.1 规范命题\u003c/h5\u003e\n\u003cp\u003e亲密联结的规范性依托主体持续同意而成立。主体过去某一时刻作出的同意，不足以永久绑定其未来人格状态与关系状态。\u003c/p\u003e\n\u003ch5 id=\"332-推演逻辑\"\u003e3.3.2 推演逻辑\u003c/h5\u003e\n\u003cp\u003e若单次同意足以永久锁定关系，则持续自愿退化为一次性准入机制，主体未来人格自主被历史行为剥夺，最终形成制度化终身人格绑定。\u003c/p\u003e\n\u003ch5 id=\"333-筛查结论\"\u003e3.3.3 筛查结论\u003c/h5\u003e\n\u003cp\u003e任何以一次性同意为依据、永久锁定亲密联结的制度安排均被排除。\u003c/p\u003e\n\u003ch3 id=\"四关系退出权规范体系\"\u003e四、关系退出权规范体系\u003c/h3\u003e\n\u003ch4 id=\"41-基础定义\"\u003e4.1 基础定义\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e关系退出权\u003c/strong\u003e：已进入亲密联结的主体，可单方面撤回自身同意并合法终止亲密联结的基本规范权利。\u003c/p\u003e\n\u003ch4 id=\"42-亲密关系固有退出权原则\"\u003e4.2 亲密关系固有退出权原则\u003c/h4\u003e\n\u003ch5 id=\"421-规范命题\"\u003e4.2.1 规范命题\u003c/h5\u003e\n\u003cp\u003e持续自愿必然包含撤回同意和终止联结的权利。退出权不是外部制度额外赋予的优待，而是自愿亲密关系的内生属性。\u003c/p\u003e\n\u003ch5 id=\"422-推演逻辑\"\u003e4.2.2 推演逻辑\u003c/h5\u003e\n\u003cp\u003e若关系不存在合法退出权，则联结一经建立即转化为永久强制存续结构，持续自愿的规范基础被消解。\u003c/p\u003e\n\u003ch4 id=\"43-退出权不可剥夺原则\"\u003e4.3 退出权不可剥夺原则\u003c/h4\u003e\n\u003ch5 id=\"431-规范命题\"\u003e4.3.1 规范命题\u003c/h5\u003e\n\u003cp\u003e主体的人格平等与人格自主地位，不因进入亲密联结而降级、让渡或消失；进入关系不产生放弃退出自由或人格自主的规范效果。\u003c/p\u003e\n\u003ch5 id=\"432-禁止结果\"\u003e4.3.2 禁止结果\u003c/h5\u003e\n\u003cp\u003e若缔结亲密关系即可剥夺退出权，关系内部将天然形成支配—从属人格层级，因此该结构不具备规范正当性。\u003c/p\u003e\n\u003ch4 id=\"44-隐性胁迫判定原则\"\u003e4.4 隐性胁迫判定原则\u003c/h4\u003e\n\u003ch5 id=\"441-风险与违规的区分\"\u003e4.4.1 风险与违规的区分\u003c/h5\u003e\n\u003cp\u003e生活依附、资源依赖、经济成本升高本身只是关系的现实附带状态，并不自动构成规范性胁迫。\u003c/p\u003e\n\u003ch5 id=\"442-结构性胁迫的判定条件\"\u003e4.4.2 结构性胁迫的判定条件\u003c/h5\u003e\n\u003cp\u003e只有当制度结构、资源结构或生活结构实质消灭主体退出通道，使退出在现实层面不可实现、主体同意完全流于形式时，才构成违背公理的结构性胁迫。\u003c/p\u003e\n\u003ch5 id=\"443-筛查边界\"\u003e4.4.3 筛查边界\u003c/h5\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e允许\u003c/strong\u003e：退出成本上升、生活便利度下降、一般经济代价增加。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e禁止\u003c/strong\u003e：系统性消灭退出可能、制造永久人格依附。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"五自愿排他的规范边界体系\"\u003e五、自愿排他的规范边界体系\u003c/h3\u003e\n\u003ch4 id=\"51-基础定义\"\u003e5.1 基础定义\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e自愿排他约定\u003c/strong\u003e：成年主体在全程持续自愿、双向知情并保留退出权的前提下，自主约定联结存续期间保持亲密排他的自我约束形态。\u003c/p\u003e\n\u003ch4 id=\"52-自愿排他约定许可原则\"\u003e5.2 自愿排他约定许可原则\u003c/h4\u003e\n\u003ch5 id=\"521-规范命题\"\u003e5.2.1 规范命题\u003c/h5\u003e\n\u003cp\u003e主体在无害范围内，可以对自身未来亲密行为作出自愿约束。自愿排他属于主体对自身行为的自我规制，不等同于对他人人格的占有或支配。\u003c/p\u003e\n\u003ch5 id=\"522-成立条件\"\u003e5.2.2 成立条件\u003c/h5\u003e\n\u003cp\u003e双向自愿达成的排他约定，只有在以下条件同时成立时具有规范正当性：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e双方持续同意；\u003c/li\u003e\n\u003cli\u003e无单方强制权力；\u003c/li\u003e\n\u003cli\u003e无人格层级与支配结构；\u003c/li\u003e\n\u003cli\u003e无永久锁定属性；\u003c/li\u003e\n\u003cli\u003e退出权保持完整。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"53-高退出代价非胁迫原则\"\u003e5.3 高退出代价非胁迫原则\u003c/h4\u003e\n\u003ch5 id=\"531-规范命题\"\u003e5.3.1 规范命题\u003c/h5\u003e\n\u003cp\u003e共同生活、资源合并、事务协作会客观提高退出成本，但该成本增量属于合作行为的正常附带结果，并不直接构成违规胁迫。\u003c/p\u003e\n\u003ch5 id=\"532-判定标准\"\u003e5.3.2 判定标准\u003c/h5\u003e\n\u003cp\u003e只要主体仍具有实质退出选项、同意状态真实有效，且不存在人格强制锁定结构，高退出代价不改变关系的自愿属性。\u003c/p\u003e\n\u003ch4 id=\"54-排他强制边界原则\"\u003e5.4 排他强制边界原则\u003c/h4\u003e\n\u003ch5 id=\"541-关系终止后的边界\"\u003e5.4.1 关系终止后的边界\u003c/h5\u003e\n\u003cp\u003e当主体已经撤回亲密同意并终止亲密联结后，外部制度不得继续强制维持其排他身份与排他义务。\u003c/p\u003e\n\u003ch5 id=\"542-责任与身份分离\"\u003e5.4.2 责任与身份分离\u003c/h5\u003e\n\u003cp\u003e民事财产责任、损害责任、抚育责任的持续存在，与亲密身份是否持续属于不同规范领域。责任追究不能转化为重开、锁定或强制延续亲密关系的制度工具。\u003c/p\u003e\n\u003ch3 id=\"六亲密责任与照护规范体系\"\u003e六、亲密责任与照护规范体系\u003c/h3\u003e\n\u003ch4 id=\"61-基础定义\"\u003e6.1 基础定义\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e亲密责任\u003c/strong\u003e：主体依托自愿联结、自主约定或特定事实行为形成的对等约束义务。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e照护责任\u003c/strong\u003e：维持他者身心完整、生活存续与基本发展条件的支持性义务。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e既有责任\u003c/strong\u003e：关系存续期间依托独立规范基础形成、不会因关系终止而自动消灭的稳定正当义务。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"62-亲密联结不产生无限一般责任原则\"\u003e6.2 亲密联结不产生无限一般责任原则\u003c/h4\u003e\n\u003ch5 id=\"621-规范命题\"\u003e6.2.1 规范命题\u003c/h5\u003e\n\u003cp\u003e单纯的亲密身份或亲密联结状态，不具备生成无限供养、无限付出、无限从属义务的规范效力。\u003c/p\u003e\n\u003ch5 id=\"622-责任成立依据\"\u003e6.2.2 责任成立依据\u003c/h5\u003e\n\u003cp\u003e合法责任必须至少依托以下一类独立基础：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e自愿约定；\u003c/li\u003e\n\u003cli\u003e事实付出；\u003c/li\u003e\n\u003cli\u003e行为关联；\u003c/li\u003e\n\u003cli\u003e弱势保护或其他保护性必要条件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch5 id=\"623-禁止结果\"\u003e6.2.3 禁止结果\u003c/h5\u003e\n\u003cp\u003e仅凭身份自动创设无边界义务，会使主体人格、劳动与资源成为他人可无限索取的对象，形成制度化人格从属与剥削，因此被排除。\u003c/p\u003e\n\u003ch4 id=\"63-责任与人格占有分离原则\"\u003e6.3 责任与人格占有分离原则\u003c/h4\u003e\n\u003ch5 id=\"631-规范命题\"\u003e6.3.1 规范命题\u003c/h5\u003e\n\u003cp\u003e承担照护、协作与互助义务，不会衍生对他人人格、人生选择、身体自主或亲密选择的支配权力。\u003c/p\u003e\n\u003ch5 id=\"632-禁止推论\"\u003e6.3.2 禁止推论\u003c/h5\u003e\n\u003cp\u003e付出越多不意味着支配权越大；否则互助与照护将转化为层级压迫工具。\u003c/p\u003e\n\u003ch4 id=\"64-自愿照护许可原则\"\u003e6.4 自愿照护许可原则\u003c/h4\u003e\n\u003ch5 id=\"641-合法条件\"\u003e6.4.1 合法条件\u003c/h5\u003e\n\u003cp\u003e主体可在无害、自愿、无胁迫、无绑定的条件下，自主承担照护事务、参与互助协作并提供生活支持。\u003c/p\u003e\n\u003ch5 id=\"642-边界\"\u003e6.4.2 边界\u003c/h5\u003e\n\u003cp\u003e自愿照护不产生强制对等回报，也不产生强制终身绑定的次生效力。\u003c/p\u003e\n\u003ch4 id=\"65-既有责任不消灭退出权原则\"\u003e6.5 既有责任不消灭退出权原则\u003c/h4\u003e\n\u003ch5 id=\"651-规范命题\"\u003e6.5.1 规范命题\u003c/h5\u003e\n\u003cp\u003e已经合法形成的责任、协作义务或抚育义务，不能反向锁定亲密关系的存续，也不能剥夺主体的亲密退出自由。\u003c/p\u003e\n\u003ch5 id=\"652-逻辑关系\"\u003e6.5.2 逻辑关系\u003c/h5\u003e\n\u003cp\u003e责任存续与关系存续是两套独立规范维度。\u003c/p\u003e\n\u003ch4 id=\"66-关系退出不消灭既有责任原则\"\u003e6.6 关系退出不消灭既有责任原则\u003c/h4\u003e\n\u003ch5 id=\"661-规范命题\"\u003e6.6.1 规范命题\u003c/h5\u003e\n\u003cp\u003e亲密联结终止，只终止亲密身份与亲密约束，不自动消灭已经依托独立事实生成的正当责任。\u003c/p\u003e\n\u003ch5 id=\"662-推演依据\"\u003e6.6.2 推演依据\u003c/h5\u003e\n\u003cp\u003e责任来源于事实行为、有效约定或保护必要性，而不是亲密身份本身。因此关系解除不能自动构成免责依据。\u003c/p\u003e\n\u003ch4 id=\"67-责任必须具备独立基础原则\"\u003e6.7 责任必须具备独立基础原则\u003c/h4\u003e\n\u003ch5 id=\"671-允许基础\"\u003e6.7.1 允许基础\u003c/h5\u003e\n\u003cp\u003e自愿约定、事实付出、行为关联与弱势保护必要条件等，可构成可追溯的责任基础。\u003c/p\u003e\n\u003ch5 id=\"672-禁止基础\"\u003e6.7.2 禁止基础\u003c/h5\u003e\n\u003cp\u003e仅凭身份层级、传统习俗、性别身份或家庭归属创设无限责任，属于制度化无偿剥夺与人格从属，应被排除。\u003c/p\u003e\n\u003ch3 id=\"七共同生活与结构性风险规范体系\"\u003e七、共同生活与结构性风险规范体系\u003c/h3\u003e\n\u003ch4 id=\"71-基础定义\"\u003e7.1 基础定义\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e共同生活共同体\u003c/strong\u003e：多名主体自愿共享居住空间、生活资源并协作处理日常事务的社会组织形态。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e结构性支配\u003c/strong\u003e：依托资源配置、权力集中或生活依附形成的系统性、持续性人格压制与选择锁定结构。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"72-共同生活不等同于亲密联结原则\"\u003e7.2 共同生活不等同于亲密联结原则\u003c/h4\u003e\n\u003ch5 id=\"721-概念分离\"\u003e7.2.1 概念分离\u003c/h5\u003e\n\u003cp\u003e共同生活属于居住、资源与事务层面的合作形态；亲密联结属于深度人格亲密层面的人际形态。二者相互独立。\u003c/p\u003e\n\u003ch5 id=\"722-制度边界\"\u003e7.2.2 制度边界\u003c/h5\u003e\n\u003cp\u003e共同生活的建立不自动生成亲密关系，亲密关系的存在也不强制要求共同生活。若制度强制绑定二者，将不必要地压缩主体居住自由、合作自由与人格自主空间。\u003c/p\u003e\n\u003ch4 id=\"73-资源合并自愿合法原则\"\u003e7.3 资源合并自愿合法原则\u003c/h4\u003e\n\u003ch5 id=\"731-规范命题\"\u003e7.3.1 规范命题\u003c/h5\u003e\n\u003cp\u003e主体可基于自愿开展资源共享、资源合并与统筹分配；自愿资源协作属于无害合作自由的范畴。\u003c/p\u003e\n\u003ch5 id=\"732-失效条件\"\u003e7.3.2 失效条件\u003c/h5\u003e\n\u003cp\u003e资源合并本身不构成支配。只有当资源统筹被改造为垄断工具、退出阻断工具或人格压制工具时，合法合作才转化为违规支配。\u003c/p\u003e\n\u003ch4 id=\"74-共同体风险区分原则\"\u003e7.4 共同体风险区分原则\u003c/h4\u003e\n\u003ch5 id=\"741-风险状态\"\u003e7.4.1 风险状态\u003c/h5\u003e\n\u003cp\u003e共同体规模扩大、权力集中、资源统一统筹，会提高个体依附度与退出成本，但风险存在本身不等于结构违规。\u003c/p\u003e\n\u003ch5 id=\"742-违规门槛\"\u003e7.4.2 违规门槛\u003c/h5\u003e\n\u003cp\u003e只有当共同体权力与资源结构实质消灭成员退出权，制造不可挣脱的生存依附与人格从属时，才进入公理禁止区。\u003c/p\u003e\n\u003ch3 id=\"八儿童主体与亲子抚育规范体系\"\u003e八、儿童主体与亲子抚育规范体系\u003c/h3\u003e\n\u003ch4 id=\"81-基础定义\"\u003e8.1 基础定义\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e儿童\u003c/strong\u003e：尚未具备完整自主决策、独立生存与完整社会行为能力的弱势人格主体。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e亲子照护责任\u003c/strong\u003e：针对儿童生存、身心完整与人格发展的刚性保护义务。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e有限监护权\u003c/strong\u003e：以儿童利益为唯一目标、严格限定范围，并随儿童成长逐步退让的保护性决策权限。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"82-儿童人格平等独立原则\"\u003e8.2 儿童人格平等独立原则\u003c/h4\u003e\n\u003ch5 id=\"821-规范命题\"\u003e8.2.1 规范命题\u003c/h5\u003e\n\u003cp\u003e儿童虽存在能力与生存弱势，但仍属于平等人格主体，不具有可被占有、支配或物化的属性。\u003c/p\u003e\n\u003ch5 id=\"822-禁止结果\"\u003e8.2.2 禁止结果\u003c/h5\u003e\n\u003cp\u003e将儿童视为私有物、附属物或支配对象的制度结构违反人格平等与非占有公理。\u003c/p\u003e\n\u003ch4 id=\"83-儿童生存保障刚性原则\"\u003e8.3 儿童生存保障刚性原则\u003c/h4\u003e\n\u003ch5 id=\"831-规范命题\"\u003e8.3.1 规范命题\u003c/h5\u003e\n\u003cp\u003e儿童不具备独立生存能力，因此社会与成年主体必须形成有效、稳定的照护责任结构，保障其基本生存、身心完整与发展条件。\u003c/p\u003e\n\u003ch5 id=\"832-优先性\"\u003e8.3.2 优先性\u003c/h5\u003e\n\u003cp\u003e儿童生存权具有规范优先性。任何允许儿童生存无保障、发展无支撑、弱势无保护的制度安排，均突破公理一的刚性边界。\u003c/p\u003e\n\u003ch4 id=\"84-亲子责任非占有原则\"\u003e8.4 亲子责任非占有原则\u003c/h4\u003e\n\u003ch5 id=\"841-责任与权力分离\"\u003e8.4.1 责任与权力分离\u003c/h5\u003e\n\u003cp\u003e成人承担抚育、监护、教育和保障责任，不转化为对儿童人格、身体、人生或未来的所有权与支配权。\u003c/p\u003e\n\u003ch5 id=\"842-监护目的\"\u003e8.4.2 监护目的\u003c/h5\u003e\n\u003cp\u003e监护是保护性义务而非占有性权利，其唯一正当目标是儿童自身利益。\u003c/p\u003e\n\u003ch4 id=\"85-抚育责任不可任意抛弃原则\"\u003e8.5 抚育责任不可任意抛弃原则\u003c/h4\u003e\n\u003ch5 id=\"851-规范命题\"\u003e8.5.1 规范命题\u003c/h5\u003e\n\u003cp\u003e儿童未完成能力自立前，已成立的抚育照护责任，不得因成人亲密关系变化、共同体变化或个人意愿变化而被任意抛弃。\u003c/p\u003e\n\u003ch5 id=\"852-自由边界\"\u003e8.5.2 自由边界\u003c/h5\u003e\n\u003cp\u003e成人拥有退出亲密关系的自由，但该自由不能覆盖或取消儿童保护义务。\u003c/p\u003e\n\u003ch4 id=\"86-监护权限渐进退让原则\"\u003e8.6 监护权限渐进退让原则\u003c/h4\u003e\n\u003ch5 id=\"861-规范命题\"\u003e8.6.1 规范命题\u003c/h5\u003e\n\u003cp\u003e随着儿童自主能力提升，成人监护权限应持续缩减、逐步退出，并最终让渡完整的人格自主。\u003c/p\u003e\n\u003ch5 id=\"862-禁止结构\"\u003e8.6.2 禁止结构\u003c/h5\u003e\n\u003cp\u003e终身监护、终身管控或永久未成年化会制造终身人格从属，因此违反人格平等与自由公理。\u003c/p\u003e\n\u003ch4 id=\"87-抚育结构多元合法原则\"\u003e8.7 抚育结构多元合法原则\u003c/h4\u003e\n\u003ch5 id=\"871-可行形态\"\u003e8.7.1 可行形态\u003c/h5\u003e\n\u003cp\u003e在满足儿童人格独立、生存保障、无占有支配的前提下，生物父母抚育、共同体集体抚育、社会公共抚育、分工协作抚育等多元形态均可进入合法制度空间。\u003c/p\u003e\n\u003ch5 id=\"872-元规则\"\u003e8.7.2 元规则\u003c/h5\u003e\n\u003cp\u003e亲密关系结构或家庭形态，不决定抚育结构的唯一合法性。\u003c/p\u003e\n\u003ch3 id=\"九亲密关系可行集合筛查原则体系\"\u003e九、亲密关系可行集合筛查原则体系\u003c/h3\u003e\n\u003ch4 id=\"91-独居形态合法原则\"\u003e9.1 独居形态合法原则\u003c/h4\u003e\n\u003cp\u003e成年主体选择无亲密联结、无共同生活并独立自主生活，完全符合公理体系。独居不产生人格占有、强制绑定或结构性支配，因此属于合法可行形态。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e制度不得将共同生活、婚姻或组建家庭设为成年人的强制义务。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"92-自愿一对一亲密结构合法原则\"\u003e9.2 自愿一对一亲密结构合法原则\u003c/h4\u003e\n\u003cp\u003e两名成年主体在全程持续自愿、双向知情、保留完整退出权、无支配绑定的条件下建立一对一亲密联结与自愿排他约定，可通过公理筛查。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e共同生活或异地分居不改变其合规属性。\u003c/li\u003e\n\u003cli\u003e关键不是形式，而是是否存在占有、强制存续、层级支配与无限责任绑定。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"93-多主体自愿亲密结构合法原则\"\u003e9.3 多主体自愿亲密结构合法原则\u003c/h4\u003e\n\u003cp\u003e三名及以上成年主体，在全员持续自愿、全员保有独立选择权和实质退出权、无人格强制与结构性支配的前提下，可形成具有规范正当性的多主体亲密联结。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e公理禁止的是强制、占有、支配与非自愿，而不对亲密联结人数作刚性限定。\u003c/li\u003e\n\u003cli\u003e因此多主体自愿结构、一对一自愿结构与独居结构，在公理层面可具有同等合法地位。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"94-无亲密共同生活合法原则\"\u003e9.4 无亲密共同生活合法原则\u003c/h4\u003e\n\u003cp\u003e多主体可自愿开展共同生活、资源协作和事务共建，而不建立亲密联结或绑定亲密身份。共同生活与亲密关系的制度解绑，属于人格多元自由的合法协作形态。\u003c/p\u003e\n\u003ch4 id=\"95-强制不可退出亲密结构禁止原则\"\u003e9.5 强制不可退出亲密结构禁止原则\u003c/h4\u003e\n\u003cp\u003e通过制度、法律、契约或习俗强制锁定关系、禁止退出，或在主体撤回同意后继续强制维持亲密关系的结构，违背持续自愿公理，应被完全排除出可行制度集合。\u003c/p\u003e\n\u003ch4 id=\"96-身份自动无限责任结构禁止原则\"\u003e9.6 身份自动无限责任结构禁止原则\u003c/h4\u003e\n\u003cp\u003e仅凭亲密身份、家庭身份或伴侣身份自动创设无限供养、无限从属、无限代偿责任的制度安排，违反责任独立基础原则与人格平等原则，属于禁止结构。\u003c/p\u003e\n\u003ch4 id=\"97-commonsconsortship共侣合规规范与风险防控原则\"\u003e9.7 Commons–Consortship（共侣）合规规范与风险防控原则\u003c/h4\u003e\n\u003ch5 id=\"971-核心定义\"\u003e9.7.1 核心定义\u003c/h5\u003e\n\u003cp\u003e\u003cstrong\u003eCommons–Consortship\u003c/strong\u003e refers to the normative organization of shared subsistence and intimate partnership.\u003c/p\u003e\n\u003cp\u003e“共侣”（Commons–Consortship）是两名及以上成年主体，在全员持续自愿、完全知情、人格平等的前提下，自愿缔结的常态化共生伴侣规范组织形态。其核心同时覆盖：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e生存资源共建共享；\u003c/li\u003e\n\u003cli\u003e平等亲密伴侣联结。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e该结构无先天身份层级、无人格从属绑定；只要持续满足五条基础公理，即可作为体系内合法的多元亲密共生形态。\u003c/p\u003e\n\u003ch5 id=\"972-全员自愿无强制底线\"\u003e9.7.2 全员自愿无强制底线\u003c/h5\u003e\n\u003cp\u003eCommons–Consortship 的成立、存续、调整与终止必须得到每一位参与主体的主动同意，不得存在默认绑定、舆论裹挟、道德胁迫或利益绑架。\u003c/p\u003e\n\u003cp\u003e任何利用既有关系身份、生活依附或资源捆绑强制他人加入或留存于该结构的行为，均违反持续自愿公理。\u003c/p\u003e\n\u003ch5 id=\"973-全员平等无层级底线\"\u003e9.7.3 全员平等无层级底线\u003c/h5\u003e\n\u003cp\u003e体系内部所有主体人格地位完全平等，不设置核心主体、附属主体、主次伴侣等人格等级。\u003c/p\u003e\n\u003cp\u003e相处时长、资源付出、抚育贡献与情感投入均不得转化为人格层级、支配权限或优先话语权。\u003c/p\u003e\n\u003ch5 id=\"974-完整退出权刚性保障\"\u003e9.7.4 完整退出权刚性保障\u003c/h5\u003e\n\u003cp\u003e所有参与主体始终保留独立、实质的关系退出权。单次缔结同意不能永久锁定关系。\u003c/p\u003e\n\u003cp\u003e共同体不得通过冻结资源、惩罚性索赔、舆论施压或切断生存支撑等方式阻断退出。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e注：这里的“无惩罚”应理解为不得以惩罚机制阻断退出；已经独立成立的民事、抚育或损害责任仍可继续存在。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch5 id=\"975-权责对等与无无限绑定底线\"\u003e9.7.5 权责对等与无无限绑定底线\u003c/h5\u003e\n\u003cp\u003eCommons–Consortship 所衍生的互助、照护与协作责任，必须具备独立事实基础，不得仅凭共同体身份自动生成无限义务。\u003c/p\u003e\n\u003cp\u003e应防止部分主体长期承担全部生活、劳动与抚育成本，而另一部分主体持续无偿获益的结构性失衡。\u003c/p\u003e\n\u003ch5 id=\"976-资源透明与无垄断风险底线\"\u003e9.7.6 资源透明与无垄断风险底线\u003c/h5\u003e\n\u003cp\u003e共同体的资源共享、合并统筹与劳动分配应保持透明，并由全员共同协商控制资源支配规则。\u003c/p\u003e\n\u003cp\u003e禁止单一或少数主体垄断核心资源、独占分配权限，并借此构造结构性依附。\u003c/p\u003e\n\u003ch5 id=\"977-关系边界清晰分离底线\"\u003e9.7.7 关系边界清晰分离底线\u003c/h5\u003e\n\u003cp\u003eCommons–Consortship 中的亲密身份、共同生活协作、民事责任与抚育责任应相互区分。\u003c/p\u003e\n\u003cp\u003e主体退出关系，终止的是亲密联结与共生协作；已经独立形成的合法抚育责任、民事责任并不随关系解体自动消灭。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"第三编劳动组织生产资料与分配秩序\"\u003e第三编：劳动组织、生产资料与分配秩序\u003c/h2\u003e\n\u003ch3 id=\"十劳动组织生产资料支配与生产分配规范体系\"\u003e十、劳动组织、生产资料支配与生产分配规范体系\u003c/h3\u003e\n\u003ch4 id=\"101-基础定义\"\u003e10.1 基础定义\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e劳动\u003c/strong\u003e：主体以自身身心能力主动投入，用以维护生存、改造环境、创造可用物资与公共价值的社会性活动。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e劳动主体\u003c/strong\u003e：具备自主意志、可承担劳动行为并享有人格平等与生存保障权的社会主体。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e生产资料\u003c/strong\u003e：劳动开展所依托的工具、设备、场地、能源、基础设施、技术平台、原料储备等客观条件总和。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e个体再生产\u003c/strong\u003e：主体维持生命存续、身心完整与劳动能力持续延续所需的必要生活条件。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e劳动剩余产出\u003c/strong\u003e：劳动总产出扣除个体再生产必需消耗后的可积累价值增量。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e生产共同体\u003c/strong\u003e：多主体协作共享生产条件、分工劳动、合并产出的社会组织形态。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e分配制度\u003c/strong\u003e：共同体内部关于劳动负担、生产资料使用权、剩余归属和风险承担的稳定规则体系。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e制度化剥削\u003c/strong\u003e：依托生产资料垄断，在缺乏相应劳动投入的情况下持续无偿占有他人劳动剩余，并制造长期生存依附的制度结构。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e经济退出权\u003c/strong\u003e：主体在不发生生存崩塌、不过度承受极端惩罚的前提下，退出劳动岗位、合作模式或分配体系的实质权利。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"102-劳动主体人格不可占有原则\"\u003e10.2 劳动主体人格不可占有原则\u003c/h4\u003e\n\u003ch5 id=\"1021-规范命题\"\u003e10.2.1 规范命题\u003c/h5\u003e\n\u003cp\u003e所有劳动承担者均为平等人格主体。既然人格禁止占有，劳动主体就绝对禁止被奴役、买卖、人身绑定或制度化物化。\u003c/p\u003e\n\u003ch5 id=\"1022-禁止结构\"\u003e10.2.2 禁止结构\u003c/h5\u003e\n\u003cp\u003e奴隶制、农奴制、终身人身依附、可交易劳动力主体等制度，直接突破人格平等与不可占有的刚性边界。\u003c/p\u003e\n\u003ch4 id=\"103-劳动无先天强制义务原则\"\u003e10.3 劳动无先天强制义务原则\u003c/h4\u003e\n\u003ch5 id=\"1031-规范命题\"\u003e10.3.1 规范命题\u003c/h5\u003e\n\u003cp\u003e人格主体不存在由出身、性别、阶层、种族或其他先天身份直接产生的无条件劳动义务。\u003c/p\u003e\n\u003ch5 id=\"1032-正当来源\"\u003e10.3.2 正当来源\u003c/h5\u003e\n\u003cp\u003e劳动的正当来源只能是自愿参与、自愿协作与自愿契约。\u003c/p\u003e\n\u003ch5 id=\"1033-禁止结果\"\u003e10.3.3 禁止结果\u003c/h5\u003e\n\u003cp\u003e无条件强制劳动相当于阶段性人格征用，违反持续自愿与人格平等公理。\u003c/p\u003e\n\u003ch4 id=\"104-劳动再生产刚性保障原则\"\u003e10.4 劳动再生产刚性保障原则\u003c/h4\u003e\n\u003ch5 id=\"1041-规范命题\"\u003e10.4.1 规范命题\u003c/h5\u003e\n\u003cp\u003e任何制度若组织、征用或安排主体劳动，必须保障其基本生存与劳动能力可持续再生产，劳动不得被常态化设计为透支生命、摧毁身心存续的活动。\u003c/p\u003e\n\u003ch5 id=\"1042-禁止结构\"\u003e10.4.2 禁止结构\u003c/h5\u003e\n\u003cp\u003e要求劳动却不保障生存再生产的制度，构成系统性侵权，应被排除。\u003c/p\u003e\n\u003ch4 id=\"105-劳动剩余归属主体原则\"\u003e10.5 劳动剩余归属主体原则\u003c/h4\u003e\n\u003ch5 id=\"1051-规范命题\"\u003e10.5.1 规范命题\u003c/h5\u003e\n\u003cp\u003e劳动产出与劳动剩余的本源规范归属为劳动主体自身。制度不得默认将劳动者剩余自动归属于非劳动者。\u003c/p\u003e\n\u003ch5 id=\"1052-禁止结构\"\u003e10.5.2 禁止结构\u003c/h5\u003e\n\u003cp\u003e仅凭身份、地位或所有权即可持续无偿攫取他人劳动剩余的结构，会制造制度化人格层级与依附，违反平等与非占有公理。\u003c/p\u003e\n\u003ch4 id=\"106-小额资源差异合法原则\"\u003e10.6 小额资源差异合法原则\u003c/h4\u003e\n\u003ch5 id=\"1061-规范命题\"\u003e10.6.1 规范命题\u003c/h5\u003e\n\u003cp\u003e个体小型生产工具、个人技艺设备、私人生活物资等资源差异，本身不构成违规支配。\u003c/p\u003e\n\u003ch5 id=\"1062-核心区分\"\u003e10.6.2 核心区分\u003c/h5\u003e\n\u003cp\u003e公理禁止的是\u003cstrong\u003e垄断性支配结构\u003c/strong\u003e，而不是一切数量差异。人格平等指人格地位平等，并不意味着物资绝对平均。\u003c/p\u003e\n\u003ch5 id=\"1063-可行空间\"\u003e10.6.3 可行空间\u003c/h5\u003e\n\u003cp\u003e个体劳动积累与自愿交换形成的合理差异，属于合法自由范畴。\u003c/p\u003e\n\u003ch4 id=\"107-核心生产资料垄断禁止原则\"\u003e10.7 核心生产资料垄断禁止原则\u003c/h4\u003e\n\u003ch5 id=\"1071-禁止条件\"\u003e10.7.1 禁止条件\u003c/h5\u003e\n\u003cp\u003e若社会核心生产资料、基础生存产业与全民必需基础设施被少数主体排他性、永久性垄断，进而使多数主体缺乏独立劳动通道与替代生存体系，即会形成结构性经济支配与人格依附。\u003c/p\u003e\n\u003ch5 id=\"1072-筛查结论\"\u003e10.7.2 筛查结论\u003c/h5\u003e\n\u003cp\u003e能够消解劳动自愿性、消灭经济退出权并固化人格层级的核心资源垄断结构，应被排除出可行制度集合。\u003c/p\u003e\n\u003ch4 id=\"108-生产资料公共共享合法原则\"\u003e10.8 生产资料公共共享合法原则\u003c/h4\u003e\n\u003ch5 id=\"1081-规范命题\"\u003e10.8.1 规范命题\u003c/h5\u003e\n\u003cp\u003e共同体可自愿将核心生产资料设置为公共共有、公平配置、按需使用与共同维护。\u003c/p\u003e\n\u003ch5 id=\"1082-成立条件\"\u003e10.8.2 成立条件\u003c/h5\u003e\n\u003cp\u003e只要该公共共享结构不存在私人垄断、人格层级支配与劳动剩余掠夺，即可作为合法制度形态。\u003c/p\u003e\n\u003ch4 id=\"109-纯所有权无自动剩余索取权原则\"\u003e10.9 纯所有权无自动剩余索取权原则\u003c/h4\u003e\n\u003ch5 id=\"1091-规范命题\"\u003e10.9.1 规范命题\u003c/h5\u003e\n\u003cp\u003e单纯静态资产持有、场地持有或设备持有，不自动生成无偿攫取他人劳动剩余的规范权利。\u003c/p\u003e\n\u003ch5 id=\"1092-剩余索取的正当基础\"\u003e10.9.2 剩余索取的正当基础\u003c/h5\u003e\n\u003cp\u003e剩余索取权必须能够对应于劳动投入、风险承担、协作贡献或自愿契约等独立基础。\u003c/p\u003e\n\u003ch5 id=\"1093-禁止结构\"\u003e10.9.3 禁止结构\u003c/h5\u003e\n\u003cp\u003e若纯粹所有权无需对应任何贡献即可稳定获取他人劳动剩余，将构成稳态剥削结构。\u003c/p\u003e\n\u003ch4 id=\"1010-分配规则可协商可修订原则\"\u003e10.10 分配规则可协商、可修订原则\u003c/h4\u003e\n\u003ch5 id=\"10101-规范命题\"\u003e10.10.1 规范命题\u003c/h5\u003e\n\u003cp\u003e分配制度不得永久固化、不得不可质疑、不得不可退出。所有经济合作规则必须保留持续同意、协商修订与退出终止的空间。\u003c/p\u003e\n\u003ch5 id=\"10102-禁止结构\"\u003e10.10.2 禁止结构\u003c/h5\u003e\n\u003cp\u003e一次性同意即锁定终身分配地位的体系，会消灭持续自愿属性，因此属于禁止结构。\u003c/p\u003e\n\u003ch4 id=\"1011-身份固化劳动分工禁止原则\"\u003e10.11 身份固化劳动分工禁止原则\u003c/h4\u003e\n\u003ch5 id=\"10111-规范命题\"\u003e10.11.1 规范命题\u003c/h5\u003e\n\u003cp\u003e不得依托出身、世袭、性别、种族等先天身份，永久固化底层高强度劳动层级、终身劳动义务或人格层级。\u003c/p\u003e\n\u003ch5 id=\"10112-禁止理由\"\u003e10.11.2 禁止理由\u003c/h5\u003e\n\u003cp\u003e先天身份决定终身劳动地位，直接违反人格平等公理。\u003c/p\u003e\n\u003ch4 id=\"1012-自愿劳动共同体合法原则\"\u003e10.12 自愿劳动共同体合法原则\u003c/h4\u003e\n\u003ch5 id=\"10121-可行条件\"\u003e10.12.1 可行条件\u003c/h5\u003e\n\u003cp\u003e多主体可以自愿分工、协作生产、合并资源与共享产出，只要共同体同时满足：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e保留全员退出通道；\u003c/li\u003e\n\u003cli\u003e保留协商与修订分配规则的权利；\u003c/li\u003e\n\u003cli\u003e不实行人格强制；\u003c/li\u003e\n\u003cli\u003e不形成核心资源垄断；\u003c/li\u003e\n\u003cli\u003e不存在制度化剩余剥夺。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch5 id=\"10122-筛查结论\"\u003e10.12.2 筛查结论\u003c/h5\u003e\n\u003cp\u003e满足上述条件的劳动共同体属于合法可行制度形态。\u003c/p\u003e\n\u003ch4 id=\"1013-共同体权力集中风险区分原则\"\u003e10.13 共同体权力集中风险区分原则\u003c/h4\u003e\n\u003ch5 id=\"10131-风险状态\"\u003e10.13.1 风险状态\u003c/h5\u003e\n\u003cp\u003e共同体规模扩张、决策权集中、资源统筹集中，只意味着结构性风险增加，并不必然构成违规结构。\u003c/p\u003e\n\u003ch5 id=\"10132-违规门槛\"\u003e10.13.2 违规门槛\u003c/h5\u003e\n\u003cp\u003e只有当权力集中实质消灭成员经济退出权、制造永久生存依附并固化少数人支配地位时，该结构才违反公理体系。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"第四编终局规范制度筛查与体系边界\"\u003e第四编：终局规范、制度筛查与体系边界\u003c/h2\u003e\n\u003ch3 id=\"十一体系终局规范原则\"\u003e十一、体系终局规范原则\u003c/h3\u003e\n\u003ch4 id=\"111-多元制度可行原则\"\u003e11.1 多元制度可行原则\u003c/h4\u003e\n\u003ch5 id=\"1111-规范命题\"\u003e11.1.1 规范命题\u003c/h5\u003e\n\u003cp\u003e本公理体系仅划定社会制度的刚性正义边界，并不唯一锁定亲密形态、家庭形态、劳动形态、分配形态与总体社会形态。\u003c/p\u003e\n\u003ch5 id=\"1112-可行集合\"\u003e11.1.2 可行集合\u003c/h5\u003e\n\u003cp\u003e在满足公理约束的前提下，下列形态均可获得规范上的可行性：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e独居；\u003c/li\u003e\n\u003cli\u003e自愿一对一亲密关系；\u003c/li\u003e\n\u003cli\u003e自愿多主体亲密关系；\u003c/li\u003e\n\u003cli\u003e多元共同生活模式；\u003c/li\u003e\n\u003cli\u003e多元儿童抚育结构；\u003c/li\u003e\n\u003cli\u003e多元合法生产协作与分配模式。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"112-结构性压迫绝对禁止原则\"\u003e11.2 结构性压迫绝对禁止原则\u003c/h4\u003e\n\u003ch5 id=\"1121-禁止对象\"\u003e11.2.1 禁止对象\u003c/h5\u003e\n\u003cp\u003e一切制度化的人格占有、强制绑定、退出权剥夺、身份层级、生产资料垄断剥削、无偿剩余掠夺和人身奴役结构，无论其传统习俗、制度惯例或历史惯性如何，均不具备规范正当性。\u003c/p\u003e\n\u003ch5 id=\"1122-筛查结果\"\u003e11.2.2 筛查结果\u003c/h5\u003e\n\u003cp\u003e上述结构被永久排除出可行社会制度集合。\u003c/p\u003e\n\u003ch4 id=\"113-公理边界优先原则\"\u003e11.3 公理边界优先原则\u003c/h4\u003e\n\u003ch5 id=\"1131-层级优先性\"\u003e11.3.1 层级优先性\u003c/h5\u003e\n\u003cp\u003e所有社会制度规则、共同体安排、人际秩序与经济秩序，都必须服从五条底层公理的刚性约束。\u003c/p\u003e\n\u003ch5 id=\"1132-自由空间\"\u003e11.3.2 自由空间\u003c/h5\u003e\n\u003cp\u003e制度自由只存在于公理红线以内；任何下位制度安排均不得以效率、传统、稳定、身份或历史惯例为由突破基础规范边界。\u003c/p\u003e\n\u003ch3 id=\"十二体系元结构\"\u003e十二、体系元结构\u003c/h3\u003e\n\u003ch4 id=\"121-规范推演链\"\u003e12.1 规范推演链\u003c/h4\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e公理 → 规范原则 → 制度规则 → 可行制度集合\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch4 id=\"122-公理层\"\u003e12.2 公理层\u003c/h4\u003e\n\u003cp\u003e规定不可突破的底层规范条件：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e基本生存与身心完整；\u003c/li\u003e\n\u003cli\u003e公共生存基础不得私人化为支配权力；\u003c/li\u003e\n\u003cli\u003e亲密联结持续自愿；\u003c/li\u003e\n\u003cli\u003e人格天然平等；\u003c/li\u003e\n\u003cli\u003e无害前提下的自愿协作自由。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"123-原则层\"\u003e12.3 原则层\u003c/h4\u003e\n\u003cp\u003e从公理导出关系退出权、责任独立性、儿童保护、劳动主体不可占有、经济退出权、反垄断性支配等原则。\u003c/p\u003e\n\u003ch4 id=\"124-制度规则层\"\u003e12.4 制度规则层\u003c/h4\u003e\n\u003cp\u003e将规范原则转化为具体筛查规则，例如：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e禁止不可退出的亲密绑定；\u003c/li\u003e\n\u003cli\u003e禁止身份自动产生无限义务；\u003c/li\u003e\n\u003cli\u003e禁止监护异化为人格所有权；\u003c/li\u003e\n\u003cli\u003e禁止核心生产资料垄断造成生存依附；\u003c/li\u003e\n\u003cli\u003e要求分配规则保留协商、修订与退出空间。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"125-可行制度集合层\"\u003e12.5 可行制度集合层\u003c/h4\u003e\n\u003cp\u003e通过筛查的制度形态并不唯一。体系允许多元制度并存，但其共同条件是：不突破生存保障、人格平等、持续自愿、非占有支配与实质退出权等底层边界。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"附体系筛查的简化判定框架\"\u003e附：体系筛查的简化判定框架\u003c/h2\u003e\n\u003ch3 id=\"a-人际关系筛查\"\u003eA. 人际关系筛查\u003c/h3\u003e\n\u003ch4 id=\"a1-第一问是否持续自愿\"\u003eA.1 第一问：是否持续自愿？\u003c/h4\u003e\n\u003cp\u003e若否，则排除。\u003c/p\u003e\n\u003ch4 id=\"a2-第二问是否保有实质退出权\"\u003eA.2 第二问：是否保有实质退出权？\u003c/h4\u003e\n\u003cp\u003e若退出在现实层面被制度性消灭，则排除。\u003c/p\u003e\n\u003ch4 id=\"a3-第三问是否存在人格层级或人格占有\"\u003eA.3 第三问：是否存在人格层级或人格占有？\u003c/h4\u003e\n\u003cp\u003e若存在，则排除。\u003c/p\u003e\n\u003ch4 id=\"a4-第四问责任是否具有独立基础\"\u003eA.4 第四问：责任是否具有独立基础？\u003c/h4\u003e\n\u003cp\u003e若仅凭身份自动生成无限义务，则排除。\u003c/p\u003e\n\u003ch3 id=\"b-儿童与照护筛查\"\u003eB. 儿童与照护筛查\u003c/h3\u003e\n\u003ch4 id=\"b1-第一问儿童基本生存与身心发展是否得到有效保障\"\u003eB.1 第一问：儿童基本生存与身心发展是否得到有效保障？\u003c/h4\u003e\n\u003cp\u003e若否，则排除。\u003c/p\u003e\n\u003ch4 id=\"b2-第二问监护是否以保护为目的而非占有为目的\"\u003eB.2 第二问：监护是否以保护为目的而非占有为目的？\u003c/h4\u003e\n\u003cp\u003e若监护转化为人格支配，则排除。\u003c/p\u003e\n\u003ch4 id=\"b3-第三问监护权限是否随儿童自主能力提升而退让\"\u003eB.3 第三问：监护权限是否随儿童自主能力提升而退让？\u003c/h4\u003e\n\u003cp\u003e若被设计为终身管控，则排除。\u003c/p\u003e\n\u003ch3 id=\"c-劳动与生产分配筛查\"\u003eC. 劳动与生产分配筛查\u003c/h3\u003e\n\u003ch4 id=\"c1-第一问劳动主体是否保持人格平等与自由\"\u003eC.1 第一问：劳动主体是否保持人格平等与自由？\u003c/h4\u003e\n\u003cp\u003e若存在奴役、买卖或终身身份绑定，则排除。\u003c/p\u003e\n\u003ch4 id=\"c2-第二问基本生存与劳动再生产是否得到保障\"\u003eC.2 第二问：基本生存与劳动再生产是否得到保障？\u003c/h4\u003e\n\u003cp\u003e若劳动制度系统性摧毁主体生存基础，则排除。\u003c/p\u003e\n\u003ch4 id=\"c3-第三问核心生产资料是否被用于形成垄断性支配\"\u003eC.3 第三问：核心生产资料是否被用于形成垄断性支配？\u003c/h4\u003e\n\u003cp\u003e若垄断实质消灭多数主体独立生存与经济退出通道，则排除。\u003c/p\u003e\n\u003ch4 id=\"c4-第四问剩余分配是否存在可追溯的正当基础\"\u003eC.4 第四问：剩余分配是否存在可追溯的正当基础？\u003c/h4\u003e\n\u003cp\u003e若仅凭静态所有权或身份即可持续无偿攫取他人剩余，则排除。\u003c/p\u003e\n\u003ch4 id=\"c5-第五问分配规则是否可协商可修订可退出\"\u003eC.5 第五问：分配规则是否可协商、可修订、可退出？\u003c/h4\u003e\n\u003cp\u003e若一次性同意永久锁定分配地位，则排除。\u003c/p\u003e\n\u003chr\u003e\n\u003cblockquote\u003e\n\u003cp\u003e注：本文为规范公理体系的结构化整理稿。其“可行/不可行”结论均指该体系内部的规范筛查结论，而非对现实法律、经济制度或政策实践的经验性结论。原始材料标注“部分内容可能由 AI 生成”。\u003c/p\u003e\n\u003c/blockquote\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:00cdedec38329ff58c79d678ebcbf86ce7eba2ec9832248b04e34b9f8bf8ff96":{"html":"\u003cp\u003e若被设计为终身管控，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若被设计为终身管控，则排除。","sourceFormat":"markdown"},"note:sha256:032cdfc42a109c50b78d278e893ccaa4f2f33ea5d292157d26a68ce1d2e1810c":{"html":"\u003cp\u003e从公理导出关系退出权、责任独立性、儿童保护、劳动主体不可占有、经济退出权、反垄断性支配等原则。\u003c/p\u003e\n","kind":"html","rawMarkdown":"从公理导出关系退出权、责任独立性、儿童保护、劳动主体不可占有、经济退出权、反垄断性支配等原则。","sourceFormat":"markdown"},"note:sha256:065e3cc14eaa10eccb6d98385a28f133d0d99ffa578c9f5b0b7fe27e1f4e2a24":{"html":"\u003cp\u003e成人承担抚育、监护、教育和保障责任，不转化为对儿童人格、身体、人生或未来的所有权与支配权。\u003c/p\u003e\n","kind":"html","rawMarkdown":"成人承担抚育、监护、教育和保障责任，不转化为对儿童人格、身体、人生或未来的所有权与支配权。","sourceFormat":"markdown"},"note:sha256:0675d13f8b1637323468855eb4209796ec468cd23c2a1881ac546cc2522adc52":{"html":"\u003cp\u003e社会公共资源、基础生存资源与公共生产条件，不归属任何个人排他私有；禁止通过私人垄断与世袭固化，将全民生存基础转化为私人支配权力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"社会公共资源、基础生存资源与公共生产条件，不归属任何个人排他私有；禁止通过私人垄断与世袭固化，将全民生存基础转化为私人支配权力。","sourceFormat":"markdown"},"note:sha256:0940e9293c19f88df3196ab17af3f5304ea923382e8ed7689c693ef30db945b1":{"html":"\u003cp\u003e共同体规模扩大、权力集中、资源统一统筹，会提高个体依附度与退出成本，但风险存在本身不等于结构违规。\u003c/p\u003e\n","kind":"html","rawMarkdown":"共同体规模扩大、权力集中、资源统一统筹，会提高个体依附度与退出成本，但风险存在本身不等于结构违规。","sourceFormat":"markdown"},"note:sha256:0a1114c4a7c96815cc09907d9dcf23d7e2088b18d07fc9c4a27c90b6fc84b69b":{"html":"\u003cp\u003e人格平等前提下，亲密联结的建立与存续不接受任何外在强制依据。社会身份、他人需求、传统习俗与公共舆论，均不具备强制主体进入或维持亲密关系的规范效力；亲密状态的最终决定权归属主体自身。\u003c/p\u003e\n","kind":"html","rawMarkdown":"人格平等前提下，亲密联结的建立与存续不接受任何外在强制依据。社会身份、他人需求、传统习俗与公共舆论，均不具备强制主体进入或维持亲密关系的规范效力；亲密状态的最终决定权归属主体自身。","sourceFormat":"markdown"},"note:sha256:0f8057ccecf896230a68fbe5327468c5526c849173e23017f5ba19c6c5cfc8b7":{"html":"\u003cp\u003e分配制度不得永久固化、不得不可质疑、不得不可退出。所有经济合作规则必须保留持续同意、协商修订与退出终止的空间。\u003c/p\u003e\n","kind":"html","rawMarkdown":"分配制度不得永久固化、不得不可质疑、不得不可退出。所有经济合作规则必须保留持续同意、协商修订与退出终止的空间。","sourceFormat":"markdown"},"note:sha256:1296aead9c6306329eda2ab9c24b4c6faf895b7cfcb0faf774da97d4f73edba0":{"html":"\u003cp\u003e生活依附、资源依赖、经济成本升高本身只是关系的现实附带状态，并不自动构成规范性胁迫。\u003c/p\u003e\n","kind":"html","rawMarkdown":"生活依附、资源依赖、经济成本升高本身只是关系的现实附带状态，并不自动构成规范性胁迫。","sourceFormat":"markdown"},"note:sha256:1568a1cea64c7580eef708a056ace5c7ef170b6561114385e1f28bc3efc41709":{"html":"\u003cp\u003e若纯粹所有权无需对应任何贡献即可稳定获取他人劳动剩余，将构成稳态剥削结构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若纯粹所有权无需对应任何贡献即可稳定获取他人劳动剩余，将构成稳态剥削结构。","sourceFormat":"markdown"},"note:sha256:176643e18bab2467c2bf187b61b6cc0d88b5d5c4a19528cd411ecb096c64a7f8":{"html":"\u003cp\u003eCommons–Consortship 的成立、存续、调整与终止必须得到每一位参与主体的主动同意，不得存在默认绑定、舆论裹挟、道德胁迫或利益绑架。\u003c/p\u003e\n\u003cp\u003e任何利用既有关系身份、生活依附或资源捆绑强制他人加入或留存于该结构的行为，均违反持续自愿公理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Commons–Consortship 的成立、存续、调整与终止必须得到每一位参与主体的主动同意，不得存在默认绑定、舆论裹挟、道德胁迫或利益绑架。\n\n任何利用既有关系身份、生活依附或资源捆绑强制他人加入或留存于该结构的行为，均违反持续自愿公理。","sourceFormat":"markdown"},"note:sha256:17fb8223e6d3e5eca3f34d9f683439f19c74a3c73a78264545a5276543d0775d":{"html":"\u003cp\u003e共同体可自愿将核心生产资料设置为公共共有、公平配置、按需使用与共同维护。\u003c/p\u003e\n","kind":"html","rawMarkdown":"共同体可自愿将核心生产资料设置为公共共有、公平配置、按需使用与共同维护。","sourceFormat":"markdown"},"note:sha256:1b0b997539ba0fd4f962788fa10a671906badf1ad13518b3dab9bb13677499e3":{"html":"\u003cp\u003e只有当权力集中实质消灭成员经济退出权、制造永久生存依附并固化少数人支配地位时，该结构才违反公理体系。\u003c/p\u003e\n","kind":"html","rawMarkdown":"只有当权力集中实质消灭成员经济退出权、制造永久生存依附并固化少数人支配地位时，该结构才违反公理体系。","sourceFormat":"markdown"},"note:sha256:1f7055b6c552c0368eec1062811538350d668b24b4314c96cee8b173478c4665":{"html":"\u003cp\u003e上述结构被永久排除出可行社会制度集合。\u003c/p\u003e\n","kind":"html","rawMarkdown":"上述结构被永久排除出可行社会制度集合。","sourceFormat":"markdown"},"note:sha256:1f79800959c3b8c098fbdf79aeba17af71cec25a50d1af4d007b07f82cf70950":{"html":"\u003cp\u003e随着儿童自主能力提升，成人监护权限应持续缩减、逐步退出，并最终让渡完整的人格自主。\u003c/p\u003e\n","kind":"html","rawMarkdown":"随着儿童自主能力提升，成人监护权限应持续缩减、逐步退出，并最终让渡完整的人格自主。","sourceFormat":"markdown"},"note:sha256:20ce3d564e08b889850fa87e232e95014db43915696056946c0901c9a1d1604a":{"html":"\u003cp\u003e只有当制度结构、资源结构或生活结构实质消灭主体退出通道，使退出在现实层面不可实现、主体同意完全流于形式时，才构成违背公理的结构性胁迫。\u003c/p\u003e\n","kind":"html","rawMarkdown":"只有当制度结构、资源结构或生活结构实质消灭主体退出通道，使退出在现实层面不可实现、主体同意完全流于形式时，才构成违背公理的结构性胁迫。","sourceFormat":"markdown"},"note:sha256:21a0b5661d300fb69b4f853ecac30202823b46098d2f7eee8cb2302047a96e06":{"html":"\u003cp\u003e共同生活属于居住、资源与事务层面的合作形态；亲密联结属于深度人格亲密层面的人际形态。二者相互独立。\u003c/p\u003e\n","kind":"html","rawMarkdown":"共同生活属于居住、资源与事务层面的合作形态；亲密联结属于深度人格亲密层面的人际形态。二者相互独立。","sourceFormat":"markdown"},"note:sha256:21f90fcf1b5f1af13267c211295c834bcf5f9019d1193b96f2470f2b68cc5a74":{"html":"\u003cblockquote\u003e\n\u003cp\u003e注：本文为规范公理体系的结构化整理稿。其“可行/不可行”结论均指该体系内部的规范筛查结论，而非对现实法律、经济制度或政策实践的经验性结论。原始材料标注“部分内容可能由 AI 生成”。\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e 注：本文为规范公理体系的结构化整理稿。其“可行/不可行”结论均指该体系内部的规范筛查结论，而非对现实法律、经济制度或政策实践的经验性结论。原始材料标注“部分内容可能由 AI 生成”。","sourceFormat":"markdown"},"note:sha256:235cec111f113c118691d45de6c85c890280d7ba45dfaf0a35ab0570e0cd5419":{"html":"\u003cp\u003eCommons–Consortship 所衍生的互助、照护与协作责任，必须具备独立事实基础，不得仅凭共同体身份自动生成无限义务。\u003c/p\u003e\n\u003cp\u003e应防止部分主体长期承担全部生活、劳动与抚育成本，而另一部分主体持续无偿获益的结构性失衡。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Commons–Consortship 所衍生的互助、照护与协作责任，必须具备独立事实基础，不得仅凭共同体身份自动生成无限义务。\n\n应防止部分主体长期承担全部生活、劳动与抚育成本，而另一部分主体持续无偿获益的结构性失衡。","sourceFormat":"markdown"},"note:sha256:24657a4f167af7fbe39b556e0ba9a7134996fde7df9b468e02c1f7794680056b":{"html":"\u003cp\u003e儿童不具备独立生存能力，因此社会与成年主体必须形成有效、稳定的照护责任结构，保障其基本生存、身心完整与发展条件。\u003c/p\u003e\n","kind":"html","rawMarkdown":"儿童不具备独立生存能力，因此社会与成年主体必须形成有效、稳定的照护责任结构，保障其基本生存、身心完整与发展条件。","sourceFormat":"markdown"},"note:sha256:2873e530cbe43b40e574c7b7b9acccc1b6aef2320462f86eb90aae531dbd8da9":{"html":"\u003cp\u003e资源合并本身不构成支配。只有当资源统筹被改造为垄断工具、退出阻断工具或人格压制工具时，合法合作才转化为违规支配。\u003c/p\u003e\n","kind":"html","rawMarkdown":"资源合并本身不构成支配。只有当资源统筹被改造为垄断工具、退出阻断工具或人格压制工具时，合法合作才转化为违规支配。","sourceFormat":"markdown"},"note:sha256:2aae93f21f651af6bdc7f9318780349b8ec7b4b24b529cce429daa58580cec75":{"html":"\u003cp\u003e劳动的正当来源只能是自愿参与、自愿协作与自愿契约。\u003c/p\u003e\n","kind":"html","rawMarkdown":"劳动的正当来源只能是自愿参与、自愿协作与自愿契约。","sourceFormat":"markdown"},"note:sha256:2e3f5b033a402728cc1238c129c1c34379919df94b318f683d99c17bf4666681":{"html":"\u003cp\u003e自愿约定、事实付出、行为关联与弱势保护必要条件等，可构成可追溯的责任基础。\u003c/p\u003e\n","kind":"html","rawMarkdown":"自愿约定、事实付出、行为关联与弱势保护必要条件等，可构成可追溯的责任基础。","sourceFormat":"markdown"},"note:sha256:2e9785a3e8de18d2774df86283990f79f543bf71253b2b7e5c699e388f471480":{"html":"\u003cp\u003e一切亲密人际联结的正当规范性基础为持续自愿，禁止一切人格占有。\u003c/p\u003e\n","kind":"html","rawMarkdown":"一切亲密人际联结的正当规范性基础为持续自愿，禁止一切人格占有。","sourceFormat":"markdown"},"note:sha256:33365206832d29d008adae11967924997eab1d361beb1c5d185d88677e14868a":{"html":"\u003cp\u003e个体小型生产工具、个人技艺设备、私人生活物资等资源差异，本身不构成违规支配。\u003c/p\u003e\n","kind":"html","rawMarkdown":"个体小型生产工具、个人技艺设备、私人生活物资等资源差异，本身不构成违规支配。","sourceFormat":"markdown"},"note:sha256:35b3a52defd2583c42477b83c96b7ab1a705885d7c868883b9e91339e9ac63cc":{"html":"\u003cp\u003e能够消解劳动自愿性、消灭经济退出权并固化人格层级的核心资源垄断结构，应被排除出可行制度集合。\u003c/p\u003e\n","kind":"html","rawMarkdown":"能够消解劳动自愿性、消灭经济退出权并固化人格层级的核心资源垄断结构，应被排除出可行制度集合。","sourceFormat":"markdown"},"note:sha256:38284af9cb236677ae8b940cc788370735719cab9d324291cba7e77a92e2ca62":{"html":"\u003cp\u003e在满足公理约束的前提下，下列形态均可获得规范上的可行性：\u003c/p\u003e\n","kind":"html","rawMarkdown":"在满足公理约束的前提下，下列形态均可获得规范上的可行性：","sourceFormat":"markdown"},"note:sha256:394a59057a4bc18e889d5b9ff63c8152bee723e318987628e803f68804c62425":{"html":"\u003cp\u003e若否，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若否，则排除。","sourceFormat":"markdown"},"note:sha256:3a230a8db54d24feef067705ba28da51212c05944c4a4f1bd2686e81f80825bc":{"html":"\u003cp\u003e制度规则将规范原则转换为可执行的制度边界，例如禁止强制锁定亲密关系、禁止身份自动产生无限义务、要求分配规则可协商与可退出。\u003c/p\u003e\n","kind":"html","rawMarkdown":"制度规则将规范原则转换为可执行的制度边界，例如禁止强制锁定亲密关系、禁止身份自动产生无限义务、要求分配规则可协商与可退出。","sourceFormat":"markdown"},"note:sha256:3a6b80c9df955062385c064ef36a16aa17459ab4ec63cae0fccaf21341001b39":{"html":"\u003cp\u003e监护是保护性义务而非占有性权利，其唯一正当目标是儿童自身利益。\u003c/p\u003e\n","kind":"html","rawMarkdown":"监护是保护性义务而非占有性权利，其唯一正当目标是儿童自身利益。","sourceFormat":"markdown"},"note:sha256:3eea293e8ff171f7bd5187cd16abbacb53abdedc1d6b896e30c1f55f75c690f8":{"html":"\u003cp\u003e终身监护、终身管控或永久未成年化会制造终身人格从属，因此违反人格平等与自由公理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"终身监护、终身管控或永久未成年化会制造终身人格从属，因此违反人格平等与自由公理。","sourceFormat":"markdown"},"note:sha256:42c2588a760d23f3ebe2d8c6fbc14cb2eacbe4901f3c2868e583865541550a84":{"html":"\u003cp\u003e只要主体仍具有实质退出选项、同意状态真实有效，且不存在人格强制锁定结构，高退出代价不改变关系的自愿属性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"只要主体仍具有实质退出选项、同意状态真实有效，且不存在人格强制锁定结构，高退出代价不改变关系的自愿属性。","sourceFormat":"markdown"},"note:sha256:483220fe4755a7ecb696e916583e62a7f7ea85b22fcfce7c13ce5ddcc8084396":{"html":"\u003cp\u003e所有劳动承担者均为平等人格主体。既然人格禁止占有，劳动主体就绝对禁止被奴役、买卖、人身绑定或制度化物化。\u003c/p\u003e\n","kind":"html","rawMarkdown":"所有劳动承担者均为平等人格主体。既然人格禁止占有，劳动主体就绝对禁止被奴役、买卖、人身绑定或制度化物化。","sourceFormat":"markdown"},"note:sha256:494b082b44b389e6768db5bd687c0954d56af4ec20c03cd6cf0f6129dc7114ae":{"html":"\u003cp\u003e单纯静态资产持有、场地持有或设备持有，不自动生成无偿攫取他人劳动剩余的规范权利。\u003c/p\u003e\n","kind":"html","rawMarkdown":"单纯静态资产持有、场地持有或设备持有，不自动生成无偿攫取他人劳动剩余的规范权利。","sourceFormat":"markdown"},"note:sha256:4a4a33be39ebfe9fa8196bbbae012a7377a332379634fa0d85919d3b5b53a4ef":{"html":"\u003cp\u003e共同生活、资源合并、事务协作会客观提高退出成本，但该成本增量属于合作行为的正常附带结果，并不直接构成违规胁迫。\u003c/p\u003e\n","kind":"html","rawMarkdown":"共同生活、资源合并、事务协作会客观提高退出成本，但该成本增量属于合作行为的正常附带结果，并不直接构成违规胁迫。","sourceFormat":"markdown"},"note:sha256:4da915a040bb8f49502cbb7e2f1e07dbc479c4332b5470f17ea7bc1684a25bf6":{"html":"\u003cp\u003e民事财产责任、损害责任、抚育责任的持续存在，与亲密身份是否持续属于不同规范领域。责任追究不能转化为重开、锁定或强制延续亲密关系的制度工具。\u003c/p\u003e\n","kind":"html","rawMarkdown":"民事财产责任、损害责任、抚育责任的持续存在，与亲密身份是否持续属于不同规范领域。责任追究不能转化为重开、锁定或强制延续亲密关系的制度工具。","sourceFormat":"markdown"},"note:sha256:4dc799e9daddcb80f70c37fa6ba2477b2c93d72040062813d6b73476fd5a7f1b":{"html":"\u003cp\u003e在满足儿童人格独立、生存保障、无占有支配的前提下，生物父母抚育、共同体集体抚育、社会公共抚育、分工协作抚育等多元形态均可进入合法制度空间。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在满足儿童人格独立、生存保障、无占有支配的前提下，生物父母抚育、共同体集体抚育、社会公共抚育、分工协作抚育等多元形态均可进入合法制度空间。","sourceFormat":"markdown"},"note:sha256:4eaa897f90b35fb4b532d0fe86cf22c2c9fbf7615a65f91710485a4382f7b74c":{"html":"\u003cp\u003e若垄断实质消灭多数主体独立生存与经济退出通道，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若垄断实质消灭多数主体独立生存与经济退出通道，则排除。","sourceFormat":"markdown"},"note:sha256:4f0746c88df151acb80339dc2eb42856c2208de6ce26a871c3f50af7631aeaf3":{"html":"\u003cp\u003e将儿童视为私有物、附属物或支配对象的制度结构违反人格平等与非占有公理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"将儿童视为私有物、附属物或支配对象的制度结构违反人格平等与非占有公理。","sourceFormat":"markdown"},"note:sha256:55480f21a0ce0b2fc67cc21fce4a5d7617bf097a975c080c92e6014a96cd3a2f":{"html":"\u003cp\u003e儿童虽存在能力与生存弱势，但仍属于平等人格主体，不具有可被占有、支配或物化的属性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"儿童虽存在能力与生存弱势，但仍属于平等人格主体，不具有可被占有、支配或物化的属性。","sourceFormat":"markdown"},"note:sha256:57eaa27491a213b5ad64c3a1029ca0b6ff2bb8eeae3064a1f39dd15f0e2dddf7":{"html":"\u003cp\u003e劳动产出与劳动剩余的本源规范归属为劳动主体自身。制度不得默认将劳动者剩余自动归属于非劳动者。\u003c/p\u003e\n","kind":"html","rawMarkdown":"劳动产出与劳动剩余的本源规范归属为劳动主体自身。制度不得默认将劳动者剩余自动归属于非劳动者。","sourceFormat":"markdown"},"note:sha256:57efda6de1f42d6c65d7ce843e3e3fcd3a732b553963f3e82a35ad0dab66b5c5":{"html":"\u003cp\u003e多主体可以自愿分工、协作生产、合并资源与共享产出，只要共同体同时满足：\u003c/p\u003e\n","kind":"html","rawMarkdown":"多主体可以自愿分工、协作生产、合并资源与共享产出，只要共同体同时满足：","sourceFormat":"markdown"},"note:sha256:581363476105a4505afa8f6fe043442592dc6f2fb261b0635794f6e495f60af3":{"html":"\u003cp\u003e仅凭亲密身份、家庭身份或伴侣身份自动创设无限供养、无限从属、无限代偿责任的制度安排，违反责任独立基础原则与人格平等原则，属于禁止结构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"仅凭亲密身份、家庭身份或伴侣身份自动创设无限供养、无限从属、无限代偿责任的制度安排，违反责任独立基础原则与人格平等原则，属于禁止结构。","sourceFormat":"markdown"},"note:sha256:5a0b75cb524b0b881327b0c33935fe036b9bf63ae4d616f730eb50a24ff1cc0c":{"html":"\u003cp\u003e规定不可突破的底层规范条件：\u003c/p\u003e\n","kind":"html","rawMarkdown":"规定不可突破的底层规范条件：","sourceFormat":"markdown"},"note:sha256:5b9db909f6e995137404d2c363d3050a5a7f461ba52b434b63816805119ebed5":{"html":"\u003cp\u003e个体劳动积累与自愿交换形成的合理差异，属于合法自由范畴。\u003c/p\u003e\n","kind":"html","rawMarkdown":"个体劳动积累与自愿交换形成的合理差异，属于合法自由范畴。","sourceFormat":"markdown"},"note:sha256:5c3bef481843da547bfad8a26e0a27f89856fe159036b952cb78ccb75fa5e638":{"html":"\u003cp\u003e若亲密联结可由外部力量强制建立或维持，主体的人格选择空间即被外部意志支配，进而形成人格从属或人格占有，违反人格平等与持续自愿两项基础公理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若亲密联结可由外部力量强制建立或维持，主体的人格选择空间即被外部意志支配，进而形成人格从属或人格占有，违反人格平等与持续自愿两项基础公理。","sourceFormat":"markdown"},"note:sha256:5cf87b1d567ae9f39d7e41fe30d086dededf526f379e2d94daebe3d60464e68c":{"html":"\u003cp\u003e若缔结亲密关系即可剥夺退出权，关系内部将天然形成支配—从属人格层级，因此该结构不具备规范正当性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若缔结亲密关系即可剥夺退出权，关系内部将天然形成支配—从属人格层级，因此该结构不具备规范正当性。","sourceFormat":"markdown"},"note:sha256:5e822da20047bc5a4a20861a566769194af9fd446721323a0f9fb079278a2b8a":{"html":"\u003cp\u003e一切制度化的人格占有、强制绑定、退出权剥夺、身份层级、生产资料垄断剥削、无偿剩余掠夺和人身奴役结构，无论其传统习俗、制度惯例或历史惯性如何，均不具备规范正当性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"一切制度化的人格占有、强制绑定、退出权剥夺、身份层级、生产资料垄断剥削、无偿剩余掠夺和人身奴役结构，无论其传统习俗、制度惯例或历史惯性如何，均不具备规范正当性。","sourceFormat":"markdown"},"note:sha256:61824b13bd282e65171300444d9f0cb8e42b288ba1e69c3514c2a801fb33bb57":{"html":"\u003cp\u003e所有社会制度规则、共同体安排、人际秩序与经济秩序，都必须服从五条底层公理的刚性约束。\u003c/p\u003e\n","kind":"html","rawMarkdown":"所有社会制度规则、共同体安排、人际秩序与经济秩序，都必须服从五条底层公理的刚性约束。","sourceFormat":"markdown"},"note:sha256:6215bc2077d7948b511132e5ab358a68526703d67b3083f4e267849e8ee9c778":{"html":"\u003cp\u003e儿童生存权具有规范优先性。任何允许儿童生存无保障、发展无支撑、弱势无保护的制度安排，均突破公理一的刚性边界。\u003c/p\u003e\n","kind":"html","rawMarkdown":"儿童生存权具有规范优先性。任何允许儿童生存无保障、发展无支撑、弱势无保护的制度安排，均突破公理一的刚性边界。","sourceFormat":"markdown"},"note:sha256:636cfe2ccce2168e28ec362b2a3023ef76c61af30024c6bc8a01f8e239f0c6c8":{"html":"\u003cp\u003e公理禁止的是\u003cstrong\u003e垄断性支配结构\u003c/strong\u003e，而不是一切数量差异。人格平等指人格地位平等，并不意味着物资绝对平均。\u003c/p\u003e\n","kind":"html","rawMarkdown":"公理禁止的是**垄断性支配结构**，而不是一切数量差异。人格平等指人格地位平等，并不意味着物资绝对平均。","sourceFormat":"markdown"},"note:sha256:64cbd14bf6ff3dc3628a13201c67c8f84d33455bb671ca8a23a967cf5db2def7":{"html":"\u003cp\u003e剩余索取权必须能够对应于劳动投入、风险承担、协作贡献或自愿契约等独立基础。\u003c/p\u003e\n","kind":"html","rawMarkdown":"剩余索取权必须能够对应于劳动投入、风险承担、协作贡献或自愿契约等独立基础。","sourceFormat":"markdown"},"note:sha256:64f6938c1e2f5b817ea71c89a9b55ae0b005b706c256e8f7e774ac644caa618e":{"html":"\u003cp\u003e成人拥有退出亲密关系的自由，但该自由不能覆盖或取消儿童保护义务。\u003c/p\u003e\n","kind":"html","rawMarkdown":"成人拥有退出亲密关系的自由，但该自由不能覆盖或取消儿童保护义务。","sourceFormat":"markdown"},"note:sha256:684688df3e5be3b7b3bb56710ce737db3fa9c10a174e5745b209c8c0fd199dd8":{"html":"\u003cp\u003e责任存续与关系存续是两套独立规范维度。\u003c/p\u003e\n","kind":"html","rawMarkdown":"责任存续与关系存续是两套独立规范维度。","sourceFormat":"markdown"},"note:sha256:6893582a37f2132e1d09cfe7f8ee558582a89730b1744de5974992e1c574956d":{"html":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e制度形态 / 规范安排\u003c/th\u003e\n\u003cth\u003e体系内可行性\u003c/th\u003e\n\u003cth\u003e核心成立条件\u003c/th\u003e\n\u003cth\u003e主要风险与控制要求\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e主体自主决定是否建立亲密联结\u003c/td\u003e\n\u003ctd\u003e基础可行\u003c/td\u003e\n\u003ctd\u003e持续自愿、人格平等、无外部强制\u003c/td\u003e\n\u003ctd\u003e防止传统、身份、舆论转化为事实强制\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e亲密关系保有单方退出权\u003c/td\u003e\n\u003ctd\u003e基础可行\u003c/td\u003e\n\u003ctd\u003e当前同意可撤回，存在实质退出通道\u003c/td\u003e\n\u003ctd\u003e退出成本不得被制度设计为事实上的不可退出\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e自愿排他的一对一亲密关系\u003c/td\u003e\n\u003ctd\u003e可行\u003c/td\u003e\n\u003ctd\u003e双向知情、持续自愿、无永久锁定\u003c/td\u003e\n\u003ctd\u003e排他义务不得在关系终止后被强制延续\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多主体自愿亲密关系\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e全员持续自愿、人格平等、独立退出\u003c/td\u003e\n\u003ctd\u003e防止核心/附属身份、资源垄断及隐性胁迫\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e无亲密关系的独居生活\u003c/td\u003e\n\u003ctd\u003e可行\u003c/td\u003e\n\u003ctd\u003e主体自主选择并具备基本生存条件\u003c/td\u003e\n\u003ctd\u003e防止制度把婚姻、家庭或共同生活设为成年义务\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e无亲密关系的共同生活共同体\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e自愿共享资源与事务、保有退出权\u003c/td\u003e\n\u003ctd\u003e资源集中不得异化为人格支配或退出阻断\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCommons–Consortship（共侣）\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e全员自愿、平等、资源透明、权责可追溯、完整退出\u003c/td\u003e\n\u003ctd\u003e重点防控层级化、资源垄断、退出阻断与隐性剥削\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e儿童抚育与保护责任\u003c/td\u003e\n\u003ctd\u003e必要且可制度化\u003c/td\u003e\n\u003ctd\u003e生存、身心完整与发展得到保障，监护以儿童利益为目的\u003c/td\u003e\n\u003ctd\u003e抚育责任不得转化为人格所有权或永久支配权\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多元儿童抚育结构\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e儿童人格独立、生存有保障、无占有支配\u003c/td\u003e\n\u003ctd\u003e组织形态可以多元，但保护底线不可降低\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e自愿劳动共同体\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e自愿分工、协商分配、经济退出权、再生产保障\u003c/td\u003e\n\u003ctd\u003e防止资源垄断、权力固化与剩余无偿攫取\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e核心生产资料公共共享\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e公平配置、按需使用、共同维护、无层级支配\u003c/td\u003e\n\u003ctd\u003e公共统筹本身不得演化为新型垄断或退出阻断\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e个体小额资源与生产工具差异\u003c/td\u003e\n\u003ctd\u003e可行\u003c/td\u003e\n\u003ctd\u003e不形成垄断性支配，不破坏他人基本生存与退出空间\u003c/td\u003e\n\u003ctd\u003e关注资源差异是否逐渐转化为结构性控制\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e可协商、可修订、可退出的分配规则\u003c/td\u003e\n\u003ctd\u003e可行\u003c/td\u003e\n\u003ctd\u003e持续同意、规则透明、可修订、有真实退出机制\u003c/td\u003e\n\u003ctd\u003e防止一次性同意演化为长期固化地位\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多元社会制度并存\u003c/td\u003e\n\u003ctd\u003e条件可行\u003c/td\u003e\n\u003ctd\u003e各制度均先通过五条公理红线筛查\u003c/td\u003e\n\u003ctd\u003e多元性只能存在于刚性规范边界之内\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n","kind":"html","rawMarkdown":"| 制度形态 / 规范安排 | 体系内可行性 | 核心成立条件 | 主要风险与控制要求 |\n|---|---|---|---|\n| 主体自主决定是否建立亲密联结 | 基础可行 | 持续自愿、人格平等、无外部强制 | 防止传统、身份、舆论转化为事实强制 |\n| 亲密关系保有单方退出权 | 基础可行 | 当前同意可撤回，存在实质退出通道 | 退出成本不得被制度设计为事实上的不可退出 |\n| 自愿排他的一对一亲密关系 | 可行 | 双向知情、持续自愿、无永久锁定 | 排他义务不得在关系终止后被强制延续 |\n| 多主体自愿亲密关系 | 条件可行 | 全员持续自愿、人格平等、独立退出 | 防止核心/附属身份、资源垄断及隐性胁迫 |\n| 无亲密关系的独居生活 | 可行 | 主体自主选择并具备基本生存条件 | 防止制度把婚姻、家庭或共同生活设为成年义务 |\n| 无亲密关系的共同生活共同体 | 条件可行 | 自愿共享资源与事务、保有退出权 | 资源集中不得异化为人格支配或退出阻断 |\n| Commons–Consortship（共侣） | 条件可行 | 全员自愿、平等、资源透明、权责可追溯、完整退出 | 重点防控层级化、资源垄断、退出阻断与隐性剥削 |\n| 儿童抚育与保护责任 | 必要且可制度化 | 生存、身心完整与发展得到保障，监护以儿童利益为目的 | 抚育责任不得转化为人格所有权或永久支配权 |\n| 多元儿童抚育结构 | 条件可行 | 儿童人格独立、生存有保障、无占有支配 | 组织形态可以多元，但保护底线不可降低 |\n| 自愿劳动共同体 | 条件可行 | 自愿分工、协商分配、经济退出权、再生产保障 | 防止资源垄断、权力固化与剩余无偿攫取 |\n| 核心生产资料公共共享 | 条件可行 | 公平配置、按需使用、共同维护、无层级支配 | 公共统筹本身不得演化为新型垄断或退出阻断 |\n| 个体小额资源与生产工具差异 | 可行 | 不形成垄断性支配，不破坏他人基本生存与退出空间 | 关注资源差异是否逐渐转化为结构性控制 |\n| 可协商、可修订、可退出的分配规则 | 可行 | 持续同意、规则透明、可修订、有真实退出机制 | 防止一次性同意演化为长期固化地位 |\n| 多元社会制度并存 | 条件可行 | 各制度均先通过五条公理红线筛查 | 多元性只能存在于刚性规范边界之内 |","sourceFormat":"markdown"},"note:sha256:6e20bd8ef80979accdf15dbd1cbecec1245997911fff1409509ad9ed6ce4a4bf":{"html":"\u003cp\u003e成年主体选择无亲密联结、无共同生活并独立自主生活，完全符合公理体系。独居不产生人格占有、强制绑定或结构性支配，因此属于合法可行形态。\u003c/p\u003e\n","kind":"html","rawMarkdown":"成年主体选择无亲密联结、无共同生活并独立自主生活，完全符合公理体系。独居不产生人格占有、强制绑定或结构性支配，因此属于合法可行形态。","sourceFormat":"markdown"},"note:sha256:707c3edab410cb75721920cffc249b1d8795b60afed830004a28021c51c6449b":{"html":"\u003cp\u003e本节仅研究\u003cstrong\u003e未触碰五条基础公理刚性红线、因而仍处于制度自由度范围内的制度形态\u003c/strong\u003e。凡已由公理直接推出为“绝对禁止”的结构，不再作为“可行 / 不可行”的备选方案进入可行性比较，而仅在正文中作为\u003cstrong\u003e规范排除项\u003c/strong\u003e保留。\u003c/p\u003e\n\u003cp\u003e因此，本节中的“可行性”专指：某一制度形态在通过公理红线筛查之后，是否能够在该规范体系内部成立，以及其成立所需的条件、风险控制与制度约束。它不等同于现实世界中的法律可行性、政治可行性、经济效率或社会接受度判断。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本节仅研究**未触碰五条基础公理刚性红线、因而仍处于制度自由度范围内的制度形态**。凡已由公理直接推出为“绝对禁止”的结构，不再作为“可行 / 不可行”的备选方案进入可行性比较，而仅在正文中作为**规范排除项**保留。\n\n因此，本节中的“可行性”专指：某一制度形态在通过公理红线筛查之后，是否能够在该规范体系内部成立，以及其成立所需的条件、风险控制与制度约束。它不等同于现实世界中的法律可行性、政治可行性、经济效率或社会接受度判断。","sourceFormat":"markdown"},"note:sha256:7086194af71077decc79a85d52bdf4d28048026b9e88582218423654cfe08157":{"html":"\u003cp\u003e若单次同意足以永久锁定关系，则持续自愿退化为一次性准入机制，主体未来人格自主被历史行为剥夺，最终形成制度化终身人格绑定。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若单次同意足以永久锁定关系，则持续自愿退化为一次性准入机制，主体未来人格自主被历史行为剥夺，最终形成制度化终身人格绑定。","sourceFormat":"markdown"},"note:sha256:7156f614f9e926ea79b0a7cd412da0f5d10da723186990e3a50ed811db6a806b":{"html":"\u003cp\u003e任何以一次性同意为依据、永久锁定亲密联结的制度安排均被排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"任何以一次性同意为依据、永久锁定亲密联结的制度安排均被排除。","sourceFormat":"markdown"},"note:sha256:72389bc5ecfa9f53629b7baba3f8b95461d55fc627be348d8d3f32dd1befbf1f":{"html":"\u003cp\u003e不得依托出身、世袭、性别、种族等先天身份，永久固化底层高强度劳动层级、终身劳动义务或人格层级。\u003c/p\u003e\n","kind":"html","rawMarkdown":"不得依托出身、世袭、性别、种族等先天身份，永久固化底层高强度劳动层级、终身劳动义务或人格层级。","sourceFormat":"markdown"},"note:sha256:7696bb7c3452e373f53cfc5d3e34f9b8160ad33f29c8f98e485e96bf600ac239":{"html":"\u003cp\u003e共同生活的建立不自动生成亲密关系，亲密关系的存在也不强制要求共同生活。若制度强制绑定二者，将不必要地压缩主体居住自由、合作自由与人格自主空间。\u003c/p\u003e\n","kind":"html","rawMarkdown":"共同生活的建立不自动生成亲密关系，亲密关系的存在也不强制要求共同生活。若制度强制绑定二者，将不必要地压缩主体居住自由、合作自由与人格自主空间。","sourceFormat":"markdown"},"note:sha256:773c193aaca5d3c4c5fde9e78a547a601b3fd003ef492ea11a1ddd7c0fe3ae39":{"html":"\u003cp\u003e主体可在无害、自愿、无胁迫、无绑定的条件下，自主承担照护事务、参与互助协作并提供生活支持。\u003c/p\u003e\n","kind":"html","rawMarkdown":"主体可在无害、自愿、无胁迫、无绑定的条件下，自主承担照护事务、参与互助协作并提供生活支持。","sourceFormat":"markdown"},"note:sha256:7c3e64df10e1ff1959b5d7d0f9fd1d45d91e333d6244702b5f97b115b23a78d2":{"html":"\u003cp\u003e若仅凭静态所有权或身份即可持续无偿攫取他人剩余，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若仅凭静态所有权或身份即可持续无偿攫取他人剩余，则排除。","sourceFormat":"markdown"},"note:sha256:7c7d283f579ca676c486fa9644f868ff30a10dae4e2c05178ec5060e744ed617":{"html":"\u003cp\u003e儿童未完成能力自立前，已成立的抚育照护责任，不得因成人亲密关系变化、共同体变化或个人意愿变化而被任意抛弃。\u003c/p\u003e\n","kind":"html","rawMarkdown":"儿童未完成能力自立前，已成立的抚育照护责任，不得因成人亲密关系变化、共同体变化或个人意愿变化而被任意抛弃。","sourceFormat":"markdown"},"note:sha256:7f3d858e6e777f51856bd1519a2abd5571a36df053588733e2d393ec8df6ca21":{"html":"\u003cp\u003e若退出在现实层面被制度性消灭，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若退出在现实层面被制度性消灭，则排除。","sourceFormat":"markdown"},"note:sha256:8090579c8ea5a75efba6bc65a0b2943c8487c970c4c6fdee56723d1294f37ee6":{"html":"\u003cp\u003e共同体规模扩张、决策权集中、资源统筹集中，只意味着结构性风险增加，并不必然构成违规结构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"共同体规模扩张、决策权集中、资源统筹集中，只意味着结构性风险增加，并不必然构成违规结构。","sourceFormat":"markdown"},"note:sha256:829260c10f6930a0cf1074d51fd35963c829e3363ea667e00080382f6d206cff":{"html":"\u003cp\u003e只要该公共共享结构不存在私人垄断、人格层级支配与劳动剩余掠夺，即可作为合法制度形态。\u003c/p\u003e\n","kind":"html","rawMarkdown":"只要该公共共享结构不存在私人垄断、人格层级支配与劳动剩余掠夺，即可作为合法制度形态。","sourceFormat":"markdown"},"note:sha256:849a9bdf2b125871c005224cd00446c44d2cff1e3244a7d74b7e35955e161ed5":{"html":"\u003cp\u003e仅凭身份层级、传统习俗、性别身份或家庭归属创设无限责任，属于制度化无偿剥夺与人格从属，应被排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"仅凭身份层级、传统习俗、性别身份或家庭归属创设无限责任，属于制度化无偿剥夺与人格从属，应被排除。","sourceFormat":"markdown"},"note:sha256:84ea3b60a5660542d7a1e03a471129725e9fcbc299c1f8a284b897858ab74b69":{"html":"\u003cp\u003e将规范原则转化为具体筛查规则，例如：\u003c/p\u003e\n","kind":"html","rawMarkdown":"将规范原则转化为具体筛查规则，例如：","sourceFormat":"markdown"},"note:sha256:8558ed622645650d6b25c1ab6368713331d7a865813189b6653104e06afb68cc":{"html":"\u003cp\u003e多主体可自愿开展共同生活、资源协作和事务共建，而不建立亲密联结或绑定亲密身份。共同生活与亲密关系的制度解绑，属于人格多元自由的合法协作形态。\u003c/p\u003e\n","kind":"html","rawMarkdown":"多主体可自愿开展共同生活、资源协作和事务共建，而不建立亲密联结或绑定亲密身份。共同生活与亲密关系的制度解绑，属于人格多元自由的合法协作形态。","sourceFormat":"markdown"},"note:sha256:86849e868bff911165c56c7c09ea4adfb18aad221a2b448f0d7c71dd41d2ade6":{"html":"\u003cp\u003e承担照护、协作与互助义务，不会衍生对他人人格、人生选择、身体自主或亲密选择的支配权力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"承担照护、协作与互助义务，不会衍生对他人人格、人生选择、身体自主或亲密选择的支配权力。","sourceFormat":"markdown"},"note:sha256:8b27609a8395425770317c86447476650143bb643192f8295b15af848eacd704":{"html":"\u003cp\u003e通过制度、法律、契约或习俗强制锁定关系、禁止退出，或在主体撤回同意后继续强制维持亲密关系的结构，违背持续自愿公理，应被完全排除出可行制度集合。\u003c/p\u003e\n","kind":"html","rawMarkdown":"通过制度、法律、契约或习俗强制锁定关系、禁止退出，或在主体撤回同意后继续强制维持亲密关系的结构，违背持续自愿公理，应被完全排除出可行制度集合。","sourceFormat":"markdown"},"note:sha256:8b6e527b5d9996fe6ff86c82a52c97f929e4dfb2031609275c67d801de64e13a":{"html":"\u003cp\u003e主体可基于自愿开展资源共享、资源合并与统筹分配；自愿资源协作属于无害合作自由的范畴。\u003c/p\u003e\n","kind":"html","rawMarkdown":"主体可基于自愿开展资源共享、资源合并与统筹分配；自愿资源协作属于无害合作自由的范畴。","sourceFormat":"markdown"},"note:sha256:8da023d6de42d6c9a64f4c63f53f1a51ea23b9a35d9e7fcc8adcb305bf8d56bf":{"html":"\u003cp\u003e亲密联结终止，只终止亲密身份与亲密约束，不自动消灭已经依托独立事实生成的正当责任。\u003c/p\u003e\n","kind":"html","rawMarkdown":"亲密联结终止，只终止亲密身份与亲密约束，不自动消灭已经依托独立事实生成的正当责任。","sourceFormat":"markdown"},"note:sha256:8db7f35113de039e0a6b5c73af4e42ff105a23b8c84beae95ca7ee0c583c107f":{"html":"\u003cp\u003e若社会核心生产资料、基础生存产业与全民必需基础设施被少数主体排他性、永久性垄断，进而使多数主体缺乏独立劳动通道与替代生存体系，即会形成结构性经济支配与人格依附。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若社会核心生产资料、基础生存产业与全民必需基础设施被少数主体排他性、永久性垄断，进而使多数主体缺乏独立劳动通道与替代生存体系，即会形成结构性经济支配与人格依附。","sourceFormat":"markdown"},"note:sha256:8e0d3aa85a0e6b4b42dc8403334032e4ddd4f3049b0e0aa11226c60c83d11860":{"html":"\u003cp\u003e本公理体系仅划定社会制度的刚性正义边界，并不唯一锁定亲密形态、家庭形态、劳动形态、分配形态与总体社会形态。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本公理体系仅划定社会制度的刚性正义边界，并不唯一锁定亲密形态、家庭形态、劳动形态、分配形态与总体社会形态。","sourceFormat":"markdown"},"note:sha256:9186c44c708b05f722c08254f1ebbebf13bc6620489ef48b2e6057252b54ef0f":{"html":"\u003cp\u003e无条件强制劳动相当于阶段性人格征用，违反持续自愿与人格平等公理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"无条件强制劳动相当于阶段性人格征用，违反持续自愿与人格平等公理。","sourceFormat":"markdown"},"note:sha256:92b364145e2e6ccb30669bd7286a1cc2d20c2b527c55f1b7cf81e2d9da124f1b":{"html":"\u003cp\u003e合法责任必须至少依托以下一类独立基础：\u003c/p\u003e\n","kind":"html","rawMarkdown":"合法责任必须至少依托以下一类独立基础：","sourceFormat":"markdown"},"note:sha256:99171d3f6d906a11c4ab5cab0c512f7f5976e3f4d1449db8a43be7406a55913a":{"html":"\u003cp\u003eCommons–Consortship 中的亲密身份、共同生活协作、民事责任与抚育责任应相互区分。\u003c/p\u003e\n\u003cp\u003e主体退出关系，终止的是亲密联结与共生协作；已经独立形成的合法抚育责任、民事责任并不随关系解体自动消灭。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Commons–Consortship 中的亲密身份、共同生活协作、民事责任与抚育责任应相互区分。\n\n主体退出关系，终止的是亲密联结与共生协作；已经独立形成的合法抚育责任、民事责任并不随关系解体自动消灭。","sourceFormat":"markdown"},"note:sha256:9a0ea9ce806e0da67ddc7fdf75ff48ce6a184a3aa5c2aafb66a43631cf0657d4":{"blocks":[{"children":[],"kind":"leaf","title":"Commons–Consortship refers to the normative organization of shared subsistence and intimate partnership."},{"children":[{"title":"生存资源共建共享；"},{"title":"平等亲密伴侣联结。"}],"kind":"section","title":"“共侣”（Commons–Consortship）是两名及以上成年主体，在全员持续自愿、完全知情、人格平等的前提下，自愿缔结的常态化共生伴侣规范组织形态。其核心同时覆盖"},{"children":[],"kind":"leaf","title":"该结构无先天身份层级、无人格从属绑定；只要持续满足五条基础公理，即可作为体系内合法的多元亲密共生形态。"}],"html":"\u003cp\u003e\u003cstrong\u003eCommons–Consortship\u003c/strong\u003e refers to the normative organization of shared subsistence and intimate partnership.\u003c/p\u003e\n\u003cp\u003e“共侣”（Commons–Consortship）是两名及以上成年主体，在全员持续自愿、完全知情、人格平等的前提下，自愿缔结的常态化共生伴侣规范组织形态。其核心同时覆盖：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e生存资源共建共享；\u003c/li\u003e\n\u003cli\u003e平等亲密伴侣联结。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e该结构无先天身份层级、无人格从属绑定；只要持续满足五条基础公理，即可作为体系内合法的多元亲密共生形态。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"**Commons–Consortship** refers to the normative organization of shared subsistence and intimate partnership.\n\n“共侣”（Commons–Consortship）是两名及以上成年主体，在全员持续自愿、完全知情、人格平等的前提下，自愿缔结的常态化共生伴侣规范组织形态。其核心同时覆盖：\n\n- 生存资源共建共享；\n- 平等亲密伴侣联结。\n\n该结构无先天身份层级、无人格从属绑定；只要持续满足五条基础公理，即可作为体系内合法的多元亲密共生形态。","sourceFormat":"markdown"},"note:sha256:9a7ec4ff4d6985b31c6627335f8aece0c2780b4834bf0151156a7d640bf896f0":{"html":"\u003cp\u003e责任来源于事实行为、有效约定或保护必要性，而不是亲密身份本身。因此关系解除不能自动构成免责依据。\u003c/p\u003e\n","kind":"html","rawMarkdown":"责任来源于事实行为、有效约定或保护必要性，而不是亲密身份本身。因此关系解除不能自动构成免责依据。","sourceFormat":"markdown"},"note:sha256:a0e5ad3025c5c94bbc2bbdc61a98347bccfabdf9287139df71aa71ada9a5d7de":{"html":"\u003cp\u003e主体在无害前提下，拥有自愿缔结协作、建立约定、安排共同事务的自由。\u003c/p\u003e\n","kind":"html","rawMarkdown":"主体在无害前提下，拥有自愿缔结协作、建立约定、安排共同事务的自由。","sourceFormat":"markdown"},"note:sha256:a3f4292497f3d519b63294dea6f474838c19ee217c6d1eb1bd347557df117ab4":{"html":"\u003cp\u003e持续自愿必然包含撤回同意和终止联结的权利。退出权不是外部制度额外赋予的优待，而是自愿亲密关系的内生属性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"持续自愿必然包含撤回同意和终止联结的权利。退出权不是外部制度额外赋予的优待，而是自愿亲密关系的内生属性。","sourceFormat":"markdown"},"note:sha256:a4d5c3e93aa1dfaedb6f6a2fd98a0e2588c9d7e369d0d2b911ec2b18728c5bc8":{"html":"\u003cp\u003e若劳动制度系统性摧毁主体生存基础，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若劳动制度系统性摧毁主体生存基础，则排除。","sourceFormat":"markdown"},"note:sha256:a75c13b1c8205429ef56fce866e8698a3ef8c556a28bf2135b3467e52deb30a9":{"html":"\u003cp\u003e若一次性同意永久锁定分配地位，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若一次性同意永久锁定分配地位，则排除。","sourceFormat":"markdown"},"note:sha256:aa83629e8563cb0256a9edff894c60dc5e04e3e602b11eb8018869025a171679":{"html":"\u003cp\u003e所有人格主体天然地位平等，不存在主体对其他主体的人格所有权与人格层级。\u003c/p\u003e\n","kind":"html","rawMarkdown":"所有人格主体天然地位平等，不存在主体对其他主体的人格所有权与人格层级。","sourceFormat":"markdown"},"note:sha256:b66c42695ad5363ef8e8df5872f95dc84e52a4c029e304de47d30b4bf16147ea":{"html":"\u003cp\u003e当主体已经撤回亲密同意并终止亲密联结后，外部制度不得继续强制维持其排他身份与排他义务。\u003c/p\u003e\n","kind":"html","rawMarkdown":"当主体已经撤回亲密同意并终止亲密联结后，外部制度不得继续强制维持其排他身份与排他义务。","sourceFormat":"markdown"},"note:sha256:b70411b96bd7b20e92464fa3139e2e7e3e26f1e61e685e518ace64ef676e6bb8":{"html":"\u003cp\u003e单纯的亲密身份或亲密联结状态，不具备生成无限供养、无限付出、无限从属义务的规范效力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"单纯的亲密身份或亲密联结状态，不具备生成无限供养、无限付出、无限从属义务的规范效力。","sourceFormat":"markdown"},"note:sha256:b785b4a102061f8b6db2c2ac322f544a689d656d91728e279e6c2e6a4e995f7c":{"html":"\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e公理 → 规范原则 → 制度规则 → 可行制度集合\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e **公理 → 规范原则 → 制度规则 → 可行制度集合**","sourceFormat":"markdown"},"note:sha256:b8d2ed2adb7e46d61411b432d55bc6e995d53fdf15238b68343bdebce24999a0":{"html":"\u003cp\u003e主体的人格平等与人格自主地位，不因进入亲密联结而降级、让渡或消失；进入关系不产生放弃退出自由或人格自主的规范效果。\u003c/p\u003e\n","kind":"html","rawMarkdown":"主体的人格平等与人格自主地位，不因进入亲密联结而降级、让渡或消失；进入关系不产生放弃退出自由或人格自主的规范效果。","sourceFormat":"markdown"},"note:sha256:bca943c0528248c3855b9c473fc148537d56c06a713c5a87acb63bfb57f2d190":{"html":"\u003cp\u003e任何制度若组织、征用或安排主体劳动，必须保障其基本生存与劳动能力可持续再生产，劳动不得被常态化设计为透支生命、摧毁身心存续的活动。\u003c/p\u003e\n","kind":"html","rawMarkdown":"任何制度若组织、征用或安排主体劳动，必须保障其基本生存与劳动能力可持续再生产，劳动不得被常态化设计为透支生命、摧毁身心存续的活动。","sourceFormat":"markdown"},"note:sha256:bd4d827ef8eea684e4ea170795dba40c238b85124154afd6b465c770ce325432":{"html":"\u003cp\u003e若仅凭身份自动生成无限义务，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若仅凭身份自动生成无限义务，则排除。","sourceFormat":"markdown"},"note:sha256:beafa1b8ee03acacdf651f7df953781b2e6840c0e9b3ce9da494385205842e65":{"html":"\u003cp\u003e仅凭身份自动创设无边界义务，会使主体人格、劳动与资源成为他人可无限索取的对象，形成制度化人格从属与剥削，因此被排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"仅凭身份自动创设无边界义务，会使主体人格、劳动与资源成为他人可无限索取的对象，形成制度化人格从属与剥削，因此被排除。","sourceFormat":"markdown"},"note:sha256:bfd6243d1733e2f7a8fbe3a345f93ca12c76b48443dd8d34c3b476d769a987f4":{"html":"\u003cp\u003e若存在奴役、买卖或终身身份绑定，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若存在奴役、买卖或终身身份绑定，则排除。","sourceFormat":"markdown"},"note:sha256:c015573fc911e3ad303d15edfac69beb301f45af06465841c19d5e6d6e50ccae":{"html":"\u003cp\u003e先天身份决定终身劳动地位，直接违反人格平等公理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"先天身份决定终身劳动地位，直接违反人格平等公理。","sourceFormat":"markdown"},"note:sha256:c247351216ea77cbe795430217075478f8b2f1952720c546e0124ef8d27dd8f9":{"html":"\u003cp\u003e要求劳动却不保障生存再生产的制度，构成系统性侵权，应被排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"要求劳动却不保障生存再生产的制度，构成系统性侵权，应被排除。","sourceFormat":"markdown"},"note:sha256:c27c7652e5cfd950c3d32d34e140e4ba9b0341cf8eaa702db1ae6ea3e83bc7a9":{"html":"\u003cp\u003e三名及以上成年主体，在全员持续自愿、全员保有独立选择权和实质退出权、无人格强制与结构性支配的前提下，可形成具有规范正当性的多主体亲密联结。\u003c/p\u003e\n","kind":"html","rawMarkdown":"三名及以上成年主体，在全员持续自愿、全员保有独立选择权和实质退出权、无人格强制与结构性支配的前提下，可形成具有规范正当性的多主体亲密联结。","sourceFormat":"markdown"},"note:sha256:c6b37ac255e9e2050833e7d1bb6272a98c710f7447bcb0a4f23b622257c66f73":{"html":"\u003cp\u003e体系内部所有主体人格地位完全平等，不设置核心主体、附属主体、主次伴侣等人格等级。\u003c/p\u003e\n\u003cp\u003e相处时长、资源付出、抚育贡献与情感投入均不得转化为人格层级、支配权限或优先话语权。\u003c/p\u003e\n","kind":"html","rawMarkdown":"体系内部所有主体人格地位完全平等，不设置核心主体、附属主体、主次伴侣等人格等级。\n\n相处时长、资源付出、抚育贡献与情感投入均不得转化为人格层级、支配权限或优先话语权。","sourceFormat":"markdown"},"note:sha256:cdc074d91c0fa9f90fb3210e5fee3f1ca1aa1f94c40961ba19da915882e259b9":{"html":"\u003cp\u003e制度自由只存在于公理红线以内；任何下位制度安排均不得以效率、传统、稳定、身份或历史惯例为由突破基础规范边界。\u003c/p\u003e\n","kind":"html","rawMarkdown":"制度自由只存在于公理红线以内；任何下位制度安排均不得以效率、传统、稳定、身份或历史惯例为由突破基础规范边界。","sourceFormat":"markdown"},"note:sha256:cdef842b54fd6caa9ff5fbeeaca71c747d523e91bd462077c68a5d853e00caef":{"html":"\u003cp\u003e若关系不存在合法退出权，则联结一经建立即转化为永久强制存续结构，持续自愿的规范基础被消解。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若关系不存在合法退出权，则联结一经建立即转化为永久强制存续结构，持续自愿的规范基础被消解。","sourceFormat":"markdown"},"note:sha256:cf3f988694690e0d2b63a398bb5f07f4c153b27ea326031ed422b2bdbf0aa9e6":{"html":"\u003cp\u003e\u003cstrong\u003e关系退出权\u003c/strong\u003e：已进入亲密联结的主体，可单方面撤回自身同意并合法终止亲密联结的基本规范权利。\u003c/p\u003e\n","kind":"html","rawMarkdown":"**关系退出权**：已进入亲密联结的主体，可单方面撤回自身同意并合法终止亲密联结的基本规范权利。","sourceFormat":"markdown"},"note:sha256:cfb4a342f60358b9a37e39de2f56e85faf33965541a0216d219c2df58965ac9f":{"html":"\u003cp\u003e两名成年主体在全程持续自愿、双向知情、保留完整退出权、无支配绑定的条件下建立一对一亲密联结与自愿排他约定，可通过公理筛查。\u003c/p\u003e\n","kind":"html","rawMarkdown":"两名成年主体在全程持续自愿、双向知情、保留完整退出权、无支配绑定的条件下建立一对一亲密联结与自愿排他约定，可通过公理筛查。","sourceFormat":"markdown"},"note:sha256:d0c37bba391a7844966264a40a2b44c85825cca03714c3196465beee31870726":{"html":"\u003cp\u003e通过筛查的制度形态并不唯一。体系允许多元制度并存，但其共同条件是：不突破生存保障、人格平等、持续自愿、非占有支配与实质退出权等底层边界。\u003c/p\u003e\n","kind":"html","rawMarkdown":"通过筛查的制度形态并不唯一。体系允许多元制度并存，但其共同条件是：不突破生存保障、人格平等、持续自愿、非占有支配与实质退出权等底层边界。","sourceFormat":"markdown"},"note:sha256:d2172998122329fd5b0d246a2b74d0e9529a4addade3ade5b7923d12b591bb36":{"html":"\u003cp\u003e主体在无害范围内，可以对自身未来亲密行为作出自愿约束。自愿排他属于主体对自身行为的自我规制，不等同于对他人人格的占有或支配。\u003c/p\u003e\n","kind":"html","rawMarkdown":"主体在无害范围内，可以对自身未来亲密行为作出自愿约束。自愿排他属于主体对自身行为的自我规制，不等同于对他人人格的占有或支配。","sourceFormat":"markdown"},"note:sha256:d5997e2f1cdb75d00efea56f3a5417449ab528ff0383143636ca0d7d206a1f53":{"html":"\u003cp\u003e若存在，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若存在，则排除。","sourceFormat":"markdown"},"note:sha256:d7d9f7e748b1ac9112be5eab02798b53117a53c713dc2de9cf1ec97f961de98e":{"html":"\u003cp\u003e所有参与主体始终保留独立、实质的关系退出权。单次缔结同意不能永久锁定关系。\u003c/p\u003e\n\u003cp\u003e共同体不得通过冻结资源、惩罚性索赔、舆论施压或切断生存支撑等方式阻断退出。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e注：这里的“无惩罚”应理解为不得以惩罚机制阻断退出；已经独立成立的民事、抚育或损害责任仍可继续存在。\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"所有参与主体始终保留独立、实质的关系退出权。单次缔结同意不能永久锁定关系。\n\n共同体不得通过冻结资源、惩罚性索赔、舆论施压或切断生存支撑等方式阻断退出。\n\n\u003e 注：这里的“无惩罚”应理解为不得以惩罚机制阻断退出；已经独立成立的民事、抚育或损害责任仍可继续存在。","sourceFormat":"markdown"},"note:sha256:d8ec274c48f50e7d74a327bc2342ed8da6b85e83eaf6fd4c4b0dd4d4cf059f5d":{"html":"\u003cp\u003e自愿照护不产生强制对等回报，也不产生强制终身绑定的次生效力。\u003c/p\u003e\n","kind":"html","rawMarkdown":"自愿照护不产生强制对等回报，也不产生强制终身绑定的次生效力。","sourceFormat":"markdown"},"note:sha256:d98cbfc3c9dd89963f6b2b04e13855b58d7f6bcbe4f5f14dc659a835263b0315":{"html":"\u003cp\u003e双向自愿达成的排他约定，只有在以下条件同时成立时具有规范正当性：\u003c/p\u003e\n","kind":"html","rawMarkdown":"双向自愿达成的排他约定，只有在以下条件同时成立时具有规范正当性：","sourceFormat":"markdown"},"note:sha256:d9db61b6d67569ac8a5c582c685f2e13f7046e6e01a011d54241131dc2af216e":{"html":"\u003cp\u003e奴隶制、农奴制、终身人身依附、可交易劳动力主体等制度，直接突破人格平等与不可占有的刚性边界。\u003c/p\u003e\n","kind":"html","rawMarkdown":"奴隶制、农奴制、终身人身依附、可交易劳动力主体等制度，直接突破人格平等与不可占有的刚性边界。","sourceFormat":"markdown"},"note:sha256:dc28fc5ca9761f7b39f1c46d705a1c221239a28fa8db9cfc27a8303c0ecfaa76":{"html":"\u003cp\u003e已经合法形成的责任、协作义务或抚育义务，不能反向锁定亲密关系的存续，也不能剥夺主体的亲密退出自由。\u003c/p\u003e\n","kind":"html","rawMarkdown":"已经合法形成的责任、协作义务或抚育义务，不能反向锁定亲密关系的存续，也不能剥夺主体的亲密退出自由。","sourceFormat":"markdown"},"note:sha256:dd7fb946d1234c390eb1ca8ea0a45a2064ded5ed2ba7b6043287cab9fb579a09":{"html":"\u003cp\u003e若监护转化为人格支配，则排除。\u003c/p\u003e\n","kind":"html","rawMarkdown":"若监护转化为人格支配，则排除。","sourceFormat":"markdown"},"note:sha256:e040d89b6c5d4e70bbb1d934a2ee720f8651fbe2a62365a37cf25fcf31ff52e6":{"html":"\u003cp\u003e亲密联结的规范性依托主体持续同意而成立。主体过去某一时刻作出的同意，不足以永久绑定其未来人格状态与关系状态。\u003c/p\u003e\n","kind":"html","rawMarkdown":"亲密联结的规范性依托主体持续同意而成立。主体过去某一时刻作出的同意，不足以永久绑定其未来人格状态与关系状态。","sourceFormat":"markdown"},"note:sha256:e33220c1b15fdfc69b3dacebc07b1b86eba3863012343ee2daef62871b1e408f":{"html":"\u003cp\u003e付出越多不意味着支配权越大；否则互助与照护将转化为层级压迫工具。\u003c/p\u003e\n","kind":"html","rawMarkdown":"付出越多不意味着支配权越大；否则互助与照护将转化为层级压迫工具。","sourceFormat":"markdown"},"note:sha256:e3ebd38d8b995356afc6a32b0cebce597f044900aae339ea6d939d054c9ca817":{"html":"\u003cp\u003e任何非自愿的亲密安排均不具备规范正当性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"任何非自愿的亲密安排均不具备规范正当性。","sourceFormat":"markdown"},"note:sha256:e4aba0f8ebf7287c54300237dc6ddbfe4a5daa3b69cc9a0ddbba7ac966e74a27":{"html":"\u003cp\u003e所有主体享有基本生存保障、身体完整与精神连续性的正当权利。\u003c/p\u003e\n","kind":"html","rawMarkdown":"所有主体享有基本生存保障、身体完整与精神连续性的正当权利。","sourceFormat":"markdown"},"note:sha256:e51d9e4c6768eae6ebb252fb51eb6f64c0acb19f1effcab185997a38e7209211":{"html":"\u003cp\u003e制度形态通过前述规则筛查后进入可行集合。该集合可以包含多种彼此不同甚至竞争的制度形态，只要它们均不突破公理红线。\u003c/p\u003e\n","kind":"html","rawMarkdown":"制度形态通过前述规则筛查后进入可行集合。该集合可以包含多种彼此不同甚至竞争的制度形态，只要它们均不突破公理红线。","sourceFormat":"markdown"},"note:sha256:e691b531fcebee2d664852ec0a90296aab95b2f0a98186b19d647d2cf9203b4b":{"html":"\u003cp\u003e本文以五条基础规范公理为唯一规范性元起点，采用公理化规范推演方法，在既定分析域内构建一个自洽、闭合、可筛查的社会制度规范体系。研究覆盖两大核心社会领域：其一为亲密联结、共同生活、亲子抚育的人际秩序；其二为劳动组织、生产资料支配、剩余产出分配的物质生产秩序。\u003c/p\u003e\n\u003cp\u003e本文不以经验归纳、历史叙事或价值偏好择优作为主要论证路径，也不预设任何单一社会制度、家庭形态或经济模式为最优范式，而是从基础公理逐层导出刚性规范原则，进而划分社会制度的绝对禁止边界与合法自由空间。\u003c/p\u003e\n\u003cp\u003e体系严格区分四层逻辑结构：\u003cstrong\u003e公理 → 规范原则 → 制度规则 → 可行制度集合\u003c/strong\u003e。凡违背人格平等、持续自愿、非占有支配与生存保障底线的制度化人格依附、强制绑定、结构性劳动剩余掠夺及基本权利剥夺结构，均被排除在可行制度集合之外；凡不突破公理刚性红线的多元制度形态，均保留为社会自由度。\u003c/p\u003e\n\u003cp\u003e本研究最终论证：规范公理的功能在于划定社会秩序的正义边界，而非唯一锁定社会形态。合法社会秩序具有多元可能性；任何突破底层规范底线的结构性压迫体系，均不具备规范正当性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本文以五条基础规范公理为唯一规范性元起点，采用公理化规范推演方法，在既定分析域内构建一个自洽、闭合、可筛查的社会制度规范体系。研究覆盖两大核心社会领域：其一为亲密联结、共同生活、亲子抚育的人际秩序；其二为劳动组织、生产资料支配、剩余产出分配的物质生产秩序。\n\n本文不以经验归纳、历史叙事或价值偏好择优作为主要论证路径，也不预设任何单一社会制度、家庭形态或经济模式为最优范式，而是从基础公理逐层导出刚性规范原则，进而划分社会制度的绝对禁止边界与合法自由空间。\n\n体系严格区分四层逻辑结构：**公理 → 规范原则 → 制度规则 → 可行制度集合**。凡违背人格平等、持续自愿、非占有支配与生存保障底线的制度化人格依附、强制绑定、结构性劳动剩余掠夺及基本权利剥夺结构，均被排除在可行制度集合之外；凡不突破公理刚性红线的多元制度形态，均保留为社会自由度。\n\n本研究最终论证：规范公理的功能在于划定社会秩序的正义边界，而非唯一锁定社会形态。合法社会秩序具有多元可能性；任何突破底层规范底线的结构性压迫体系，均不具备规范正当性。","sourceFormat":"markdown"},"note:sha256:e79769be7f3282c06118e8bb094a8de270dde24e0f51c7d89bd87105dbe9fe93":{"html":"\u003cp\u003e人格主体不存在由出身、性别、阶层、种族或其他先天身份直接产生的无条件劳动义务。\u003c/p\u003e\n","kind":"html","rawMarkdown":"人格主体不存在由出身、性别、阶层、种族或其他先天身份直接产生的无条件劳动义务。","sourceFormat":"markdown"},"note:sha256:e8a8f07fc975cc45bed33ebfada52cbfe8f6f509d269cd09afc9ef9c3ea34b13":{"html":"\u003cp\u003e公理提供不可被下位制度规则否定的规范起点，构成全部推演的底层边界。\u003c/p\u003e\n","kind":"html","rawMarkdown":"公理提供不可被下位制度规则否定的规范起点，构成全部推演的底层边界。","sourceFormat":"markdown"},"note:sha256:e8f8aab87c8864ed85ff19a6e0c6b84cd50aa1d0a73e333ee127bb33719437b3":{"html":"\u003cp\u003e满足上述条件的劳动共同体属于合法可行制度形态。\u003c/p\u003e\n","kind":"html","rawMarkdown":"满足上述条件的劳动共同体属于合法可行制度形态。","sourceFormat":"markdown"},"note:sha256:ea3922d95fcbc505f9e3c2a97331ea4483bfa2d2507b43e0242712ffbc5efbc5":{"html":"\u003cp\u003e一次性同意即锁定终身分配地位的体系，会消灭持续自愿属性，因此属于禁止结构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"一次性同意即锁定终身分配地位的体系，会消灭持续自愿属性，因此属于禁止结构。","sourceFormat":"markdown"},"note:sha256:ee2fec2c8b46d1f6992dd2ccfddbdc02beec9672f6649b9e0d96f88194effb66":{"html":"\u003cp\u003e仅凭身份、地位或所有权即可持续无偿攫取他人劳动剩余的结构，会制造制度化人格层级与依附，违反平等与非占有公理。\u003c/p\u003e\n","kind":"html","rawMarkdown":"仅凭身份、地位或所有权即可持续无偿攫取他人劳动剩余的结构，会制造制度化人格层级与依附，违反平等与非占有公理。","sourceFormat":"markdown"},"note:sha256:ee5a1f240d5bf1fdaf27e4a7c16b03af3f903ee4d9d05d086318bd67964d1980":{"html":"\u003cp\u003e规范原则由公理推出，例如持续自愿推出退出权，人格平等推出人格不可占有，生存保障推出儿童保护与劳动再生产保障。\u003c/p\u003e\n","kind":"html","rawMarkdown":"规范原则由公理推出，例如持续自愿推出退出权，人格平等推出人格不可占有，生存保障推出儿童保护与劳动再生产保障。","sourceFormat":"markdown"},"note:sha256:f0d5c4193c2e3e36409d8badde6d58f7a116af4fa9fbca6694b4d6275d1b7679":{"html":"\u003cp\u003e亲密关系结构或家庭形态，不决定抚育结构的唯一合法性。\u003c/p\u003e\n","kind":"html","rawMarkdown":"亲密关系结构或家庭形态，不决定抚育结构的唯一合法性。","sourceFormat":"markdown"},"note:sha256:f2b3e7cd62817c01a8adcfdfa371a99930677b9abbbf1d2eada09b00afa108e4":{"html":"\u003cp\u003e共同体的资源共享、合并统筹与劳动分配应保持透明，并由全员共同协商控制资源支配规则。\u003c/p\u003e\n\u003cp\u003e禁止单一或少数主体垄断核心资源、独占分配权限，并借此构造结构性依附。\u003c/p\u003e\n","kind":"html","rawMarkdown":"共同体的资源共享、合并统筹与劳动分配应保持透明，并由全员共同协商控制资源支配规则。\n\n禁止单一或少数主体垄断核心资源、独占分配权限，并借此构造结构性依附。","sourceFormat":"markdown"},"note:sha256:f51c16e3f6257128d2e47308c5b04d2bba3c59c13857647673594e2f148d7ab9":{"html":"\u003cp\u003e\u003cstrong\u003e自愿排他约定\u003c/strong\u003e：成年主体在全程持续自愿、双向知情并保留退出权的前提下，自主约定联结存续期间保持亲密排他的自我约束形态。\u003c/p\u003e\n","kind":"html","rawMarkdown":"**自愿排他约定**：成年主体在全程持续自愿、双向知情并保留退出权的前提下，自主约定联结存续期间保持亲密排他的自我约束形态。","sourceFormat":"markdown"},"note:sha256:fb43d2066a7655a5e3b0e91796d5b3ff32aa26efad8c3ae5f761ace8f92fc203":{"html":"\u003cp\u003e以下类型在本体系中属于\u003cstrong\u003e前置排除对象\u003c/strong\u003e，其功能是界定研究边界，而不是作为候选制度参与可行性比较：制度化人格占有、奴役与人格买卖、强制且不可退出的亲密绑定、身份自动生成的无限责任、以先天身份固化劳动义务、彻底消灭经济退出权的核心资源垄断、无偿且结构化的劳动剩余掠夺，以及其他直接突破五条基础公理的结构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"以下类型在本体系中属于**前置排除对象**，其功能是界定研究边界，而不是作为候选制度参与可行性比较：制度化人格占有、奴役与人格买卖、强制且不可退出的亲密绑定、身份自动生成的无限责任、以先天身份固化劳动义务、彻底消灭经济退出权的核心资源垄断、无偿且结构化的劳动剩余掠夺，以及其他直接突破五条基础公理的结构。","sourceFormat":"markdown"},"note:sha256:fd3a3d88b9f162a9f6b1f3289359a38a1f9b26a85e53ef7d407f98b1a2207b9c":{"html":"\u003cp\u003e只有当共同体权力与资源结构实质消灭成员退出权，制造不可挣脱的生存依附与人格从属时，才进入公理禁止区。\u003c/p\u003e\n","kind":"html","rawMarkdown":"只有当共同体权力与资源结构实质消灭成员退出权，制造不可挣脱的生存依附与人格从属时，才进入公理禁止区。","sourceFormat":"markdown"}},"sourceRevision":"sha256:87029ac9edc22b0ac04cd185b17bd24eb4c102509936cef8cfb5667a7aadf8f0"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=e}}function i(e,t){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${e}": ${t}`)}function r(e){const t=String(e||"").normalize("NFC").trim().replace(/\\/g,"/");t||i(t,"empty"),t.includes("\0")&&i(t,"nul_byte"),t.startsWith("/")&&i(t,"absolute"),/^[A-Za-z]:/.test(t)&&i(t,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*:/.test(t)&&i(t,"url_scheme"),t.endsWith("/")&&i(t,"directory");const n=t.split("/");return n.some(e=>!e||"."===e||".."===e)&&i(t,"unsafe_segment"),n.join("/")}function a(e){if(null===e||"s
