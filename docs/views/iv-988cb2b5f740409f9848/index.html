</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-11T09:01:22.254Z","language":"zh-CN","name":"DeMinds","version":"1.0.36"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"社会人际与生产分配的规范公理体系研究｜ 作者：王凯宁及其 AI 团队","outlineVersion":1},"sourceRevision":"sha256:87029ac9edc22b0ac04cd185b17bd24eb4c102509936cef8cfb5667a7aadf8f0","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"社会人际与生产分配的规范公理体系研究_结构化版_v2.md","title":"社会人际与生产分配的规范公理体系研究｜ 作者：王凯宁及其 AI 团队"},"files":[{"byteLength":36159,"content":"# 社会人际与生产分配的规范公理体系研究｜\u003cbr\u003e作者：王凯宁及其 AI 团队\n## 摘要\n\n本文以五条基础规范公理为唯一规范性元起点，采用公理化规范推演方法，在既定分析域内构建一个自洽、闭合、可筛查的社会制度规范体系。研究覆盖两大核心社会领域：其一为亲密联结、共同生活、亲子抚育的人际秩序；其二为劳动组织、生产资料支配、剩余产出分配的物质生产秩序。\n\n本文不以经验归纳、历史叙事或价值偏好择优作为主要论证路径，也不预设任何单一社会制度、家庭形态或经济模式为最优范式，而是从基础公理逐层导出刚性规范原则，进而划分社会制度的绝对禁止边界与合法自由空间。\n\n体系严格区分四层逻辑结构：**公理 → 规范原则 → 制度规则 → 可行制度集合**。凡违背人格平等、持续自愿、非占有支配与生存保障底线的制度化人格依附、强制绑定、结构性劳动剩余掠夺及基本权利剥夺结构，均被排除在可行制度集合之外；凡不突破公理刚性红线的多元制度形态，均保留为社会自由度。\n\n本研究最终论证：规范公理的功能在于划定社会秩序的正义边界，而非唯一锁定社会形态。合法社会秩序具有多元可能性；任何突破底层规范底线的结构性压迫体系，均不具备规范正当性。\n\n## 关键要点总结\n\n### 可行性研究边界\n\n本节仅研究**未触碰五条基础公理刚性红线、因而仍处于制度自由度范围内的制度形态**。凡已由公理直接推出为“绝对禁止”的结构，不再作为“可行 / 不可行”的备选方案进入可行性比较，而仅在正文中作为**规范排除项**保留。\n\n因此，本节中的“可行性”专指：某一制度形态在通过公理红线筛查之后，是否能够在该规范体系内部成立，以及其成立所需的条件、风险控制与制度约束。它不等同于现实世界中的法律可行性、政治可行性、经济效率或社会接受度判断。\n\n#### 研究流程\n\n1. **第一步：红线筛查。** 若制度形态触及人格占有、强制绑定、退出权剥夺、身份层级、结构性垄断剥削、无保障的强制劳动等绝对禁止项，直接排除，不进入可行性研究。\n2. **第二步：条件识别。** 对通过红线筛查的制度形态，分析其持续自愿、人格平等、资源结构、退出机制、责任基础等成立条件。\n3. **第三步：风险评估。** 判断合法结构在运行过程中是否可能异化为资源垄断、隐性胁迫、权力固化或事实上的退出阻断。\n4. **第四步：可行空间确认。** 仅对仍能满足公理约束的制度方案确认其体系内可行性与制度自由度。\n\n### 通过红线筛查后的关键制度形态及可行性\n\n| 制度形态 / 规范安排 | 体系内可行性 | 核心成立条件 | 主要风险与控制要求 |\n|---|---|---|---|\n| 主体自主决定是否建立亲密联结 | 基础可行 | 持续自愿、人格平等、无外部强制 | 防止传统、身份、舆论转化为事实强制 |\n| 亲密关系保有单方退出权 | 基础可行 | 当前同意可撤回，存在实质退出通道 | 退出成本不得被制度设计为事实上的不可退出 |\n| 自愿排他的一对一亲密关系 | 可行 | 双向知情、持续自愿、无永久锁定 | 排他义务不得在关系终止后被强制延续 |\n| 多主体自愿亲密关系 | 条件可行 | 全员持续自愿、人格平等、独立退出 | 防止核心/附属身份、资源垄断及隐性胁迫 |\n| 无亲密关系的独居生活 | 可行 | 主体自主选择并具备基本生存条件 | 防止制度把婚姻、家庭或共同生活设为成年义务 |\n| 无亲密关系的共同生活共同体 | 条件可行 | 自愿共享资源与事务、保有退出权 | 资源集中不得异化为人格支配或退出阻断 |\n| Commons–Consortship（共侣） | 条件可行 | 全员自愿、平等、资源透明、权责可追溯、完整退出 | 重点防控层级化、资源垄断、退出阻断与隐性剥削 |\n| 儿童抚育与保护责任 | 必要且可制度化 | 生存、身心完整与发展得到保障，监护以儿童利益为目的 | 抚育责任不得转化为人格所有权或永久支配权 |\n| 多元儿童抚育结构 | 条件可行 | 儿童人格独立、生存有保障、无占有支配 | 组织形态可以多元，但保护底线不可降低 |\n| 自愿劳动共同体 | 条件可行 | 自愿分工、协商分配、经济退出权、再生产保障 | 防止资源垄断、权力固化与剩余无偿攫取 |\n| 核心生产资料公共共享 | 条件可行 | 公平配置、按需使用、共同维护、无层级支配 | 公共统筹本身不得演化为新型垄断或退出阻断 |\n| 个体小额资源与生产工具差异 | 可行 | 不形成垄断性支配，不破坏他人基本生存与退出空间 | 关注资源差异是否逐渐转化为结构性控制 |\n| 可协商、可修订、可退出的分配规则 | 可行 | 持续同意、规则透明、可修订、有真实退出机制 | 防止一次性同意演化为长期固化地位 |\n| 多元社会制度并存 | 条件可行 | 各制度均先通过五条公理红线筛查 | 多元性只能存在于刚性规范边界之内 |\n\n### 不进入可行性研究的绝对排除项\n\n以下类型在本体系中属于**前置排除对象**，其功能是界定研究边界，而不是作为候选制度参与可行性比较：制度化人格占有、奴役与人格买卖、强制且不可退出的亲密绑定、身份自动生成的无限责任、以先天身份固化劳动义务、彻底消灭经济退出权的核心资源垄断、无偿且结构化的劳动剩余掠夺，以及其他直接突破五条基础公理的结构。\n\n---\n\n## 第一编：体系基础、逻辑层级与元规则\n\n### 一、基础规范公理\n\n#### 1.1 公理一：基本生存、身体完整与精神连续性\n\n所有主体享有基本生存保障、身体完整与精神连续性的正当权利。\n\n- **规范核心**：任何社会制度不得以组织运行、身份关系或资源分配为由，使主体陷入基本生存失保、身体完整受侵害或人格连续性被摧毁的状态。\n- **体系功能**：为儿童保护、劳动再生产保障、经济退出权等后续原则提供底线依据。\n\n#### 1.2 公理二：公共生存基础不得转化为私人支配权力\n\n社会公共资源、基础生存资源与公共生产条件，不归属任何个人排他私有；禁止通过私人垄断与世袭固化，将全民生存基础转化为私人支配权力。\n\n- **规范核心**：禁止以核心公共资源的排他控制制造稳定的人格依附与结构性支配。\n- **适用边界**：并不等同于否定一切个人生活资料、小型生产工具或合理资源差异；禁止对象是能够转化为系统性支配的垄断结构。\n\n#### 1.3 公理三：亲密联结以持续自愿为基础\n\n一切亲密人际联结的正当规范性基础为持续自愿，禁止一切人格占有。\n\n- **规范核心**：亲密关系的正当性不是来自一次性同意，而来自持续有效的当前同意。\n- **直接推论**：亲密关系不得被永久锁定，退出权属于其内生属性。\n\n#### 1.4 公理四：人格主体天然平等\n\n所有人格主体天然地位平等，不存在主体对其他主体的人格所有权与人格层级。\n\n- **规范核心**：任何身份、资源贡献、历史关系或照护付出，均不能自然生成对他人人格的支配权。\n- **禁止结构**：奴役、人格买卖、身份层级、终身人格从属等。\n\n#### 1.5 公理五：无害前提下的自愿协作自由\n\n主体在无害前提下，拥有自愿缔结协作、建立约定、安排共同事务的自由。\n\n- **规范核心**：公理体系不仅规定禁止边界，也保留广泛的社会制度自由度。\n- **直接推论**：只要不突破生存保障、人格平等、持续自愿与非占有边界，多元亲密关系、共同生活和生产协作形态均可进入可行制度集合。\n\n### 二、体系逻辑层级\n\n#### 2.1 第一层：公理\n\n公理提供不可被下位制度规则否定的规范起点，构成全部推演的底层边界。\n\n#### 2.2 第二层：规范原则\n\n规范原则由公理推出，例如持续自愿推出退出权，人格平等推出人格不可占有，生存保障推出儿童保护与劳动再生产保障。\n\n#### 2.3 第三层：制度规则\n\n制度规则将规范原则转换为可执行的制度边界，例如禁止强制锁定亲密关系、禁止身份自动产生无限义务、要求分配规则可协商与可退出。\n\n#### 2.4 第四层：可行制度集合\n\n制度形态通过前述规则筛查后进入可行集合。该集合可以包含多种彼此不同甚至竞争的制度形态，只要它们均不突破公理红线。\n\n---\n\n## 第二编：亲密联结、共同生活与照护秩序\n\n### 三、亲密联结与主体选择权规范体系\n\n#### 3.1 基础定义\n\n- **亲密联结**：成年主体之间以持续自愿为基础形成的深度人际联结形态。\n- **亲密选择权**：主体自主决定是否、与谁、以何种形式建立、维持或终止亲密联结的基本权利。\n\n#### 3.2 亲密选择自主基础原则\n\n##### 3.2.1 规范命题\n\n人格平等前提下，亲密联结的建立与存续不接受任何外在强制依据。社会身份、他人需求、传统习俗与公共舆论，均不具备强制主体进入或维持亲密关系的规范效力；亲密状态的最终决定权归属主体自身。\n\n##### 3.2.2 推演逻辑\n\n若亲密联结可由外部力量强制建立或维持，主体的人格选择空间即被外部意志支配，进而形成人格从属或人格占有，违反人格平等与持续自愿两项基础公理。\n\n##### 3.2.3 筛查结论\n\n任何非自愿的亲密安排均不具备规范正当性。\n\n#### 3.3 亲密联结不可永久锁定原则\n\n##### 3.3.1 规范命题\n\n亲密联结的规范性依托主体持续同意而成立。主体过去某一时刻作出的同意，不足以永久绑定其未来人格状态与关系状态。\n\n##### 3.3.2 推演逻辑\n\n若单次同意足以永久锁定关系，则持续自愿退化为一次性准入机制，主体未来人格自主被历史行为剥夺，最终形成制度化终身人格绑定。\n\n##### 3.3.3 筛查结论\n\n任何以一次性同意为依据、永久锁定亲密联结的制度安排均被排除。\n\n### 四、关系退出权规范体系\n\n#### 4.1 基础定义\n\n**关系退出权**：已进入亲密联结的主体，可单方面撤回自身同意并合法终止亲密联结的基本规范权利。\n\n#### 4.2 亲密关系固有退出权原则\n\n##### 4.2.1 规范命题\n\n持续自愿必然包含撤回同意和终止联结的权利。退出权不是外部制度额外赋予的优待，而是自愿亲密关系的内生属性。\n\n##### 4.2.2 推演逻辑\n\n若关系不存在合法退出权，则联结一经建立即转化为永久强制存续结构，持续自愿的规范基础被消解。\n\n#### 4.3 退出权不可剥夺原则\n\n##### 4.3.1 规范命题\n\n主体的人格平等与人格自主地位，不因进入亲密联结而降级、让渡或消失；进入关系不产生放弃退出自由或人格自主的规范效果。\n\n##### 4.3.2 禁止结果\n\n若缔结亲密关系即可剥夺退出权，关系内部将天然形成支配—从属人格层级，因此该结构不具备规范正当性。\n\n#### 4.4 隐性胁迫判定原则\n\n##### 4.4.1 风险与违规的区分\n\n生活依附、资源依赖、经济成本升高本身只是关系的现实附带状态，并不自动构成规范性胁迫。\n\n##### 4.4.2 结构性胁迫的判定条件\n\n只有当制度结构、资源结构或生活结构实质消灭主体退出通道，使退出在现实层面不可实现、主体同意完全流于形式时，才构成违背公理的结构性胁迫。\n\n##### 4.4.3 筛查边界\n\n- **允许**：退出成本上升、生活便利度下降、一般经济代价增加。\n- **禁止**：系统性消灭退出可能、制造永久人格依附。\n\n### 五、自愿排他的规范边界体系\n\n#### 5.1 基础定义\n\n**自愿排他约定**：成年主体在全程持续自愿、双向知情并保留退出权的前提下，自主约定联结存续期间保持亲密排他的自我约束形态。\n\n#### 5.2 自愿排他约定许可原则\n\n##### 5.2.1 规范命题\n\n主体在无害范围内，可以对自身未来亲密行为作出自愿约束。自愿排他属于主体对自身行为的自我规制，不等同于对他人人格的占有或支配。\n\n##### 5.2.2 成立条件\n\n双向自愿达成的排他约定，只有在以下条件同时成立时具有规范正当性：\n\n- 双方持续同意；\n- 无单方强制权力；\n- 无人格层级与支配结构；\n- 无永久锁定属性；\n- 退出权保持完整。\n\n#### 5.3 高退出代价非胁迫原则\n\n##### 5.3.1 规范命题\n\n共同生活、资源合并、事务协作会客观提高退出成本，但该成本增量属于合作行为的正常附带结果，并不直接构成违规胁迫。\n\n##### 5.3.2 判定标准\n\n只要主体仍具有实质退出选项、同意状态真实有效，且不存在人格强制锁定结构，高退出代价不改变关系的自愿属性。\n\n#### 5.4 排他强制边界原则\n\n##### 5.4.1 关系终止后的边界\n\n当主体已经撤回亲密同意并终止亲密联结后，外部制度不得继续强制维持其排他身份与排他义务。\n\n##### 5.4.2 责任与身份分离\n\n民事财产责任、损害责任、抚育责任的持续存在，与亲密身份是否持续属于不同规范领域。责任追究不能转化为重开、锁定或强制延续亲密关系的制度工具。\n\n### 六、亲密责任与照护规范体系\n\n#### 6.1 基础定义\n\n- **亲密责任**：主体依托自愿联结、自主约定或特定事实行为形成的对等约束义务。\n- **照护责任**：维持他者身心完整、生活存续与基本发展条件的支持性义务。\n- **既有责任**：关系存续期间依托独立规范基础形成、不会因关系终止而自动消灭的稳定正当义务。\n\n#### 6.2 亲密联结不产生无限一般责任原则\n\n##### 6.2.1 规范命题\n\n单纯的亲密身份或亲密联结状态，不具备生成无限供养、无限付出、无限从属义务的规范效力。\n\n##### 6.2.2 责任成立依据\n\n合法责任必须至少依托以下一类独立基础：\n\n- 自愿约定；\n- 事实付出；\n- 行为关联；\n- 弱势保护或其他保护性必要条件。\n\n##### 6.2.3 禁止结果\n\n仅凭身份自动创设无边界义务，会使主体人格、劳动与资源成为他人可无限索取的对象，形成制度化人格从属与剥削，因此被排除。\n\n#### 6.3 责任与人格占有分离原则\n\n##### 6.3.1 规范命题\n\n承担照护、协作与互助义务，不会衍生对他人人格、人生选择、身体自主或亲密选择的支配权力。\n\n##### 6.3.2 禁止推论\n\n付出越多不意味着支配权越大；否则互助与照护将转化为层级压迫工具。\n\n#### 6.4 自愿照护许可原则\n\n##### 6.4.1 合法条件\n\n主体可在无害、自愿、无胁迫、无绑定的条件下，自主承担照护事务、参与互助协作并提供生活支持。\n\n##### 6.4.2 边界\n\n自愿照护不产生强制对等回报，也不产生强制终身绑定的次生效力。\n\n#### 6.5 既有责任不消灭退出权原则\n\n##### 6.5.1 规范命题\n\n已经合法形成的责任、协作义务或抚育义务，不能反向锁定亲密关系的存续，也不能剥夺主体的亲密退出自由。\n\n##### 6.5.2 逻辑关系\n\n责任存续与关系存续是两套独立规范维度。\n\n#### 6.6 关系退出不消灭既有责任原则\n\n##### 6.6.1 规范命题\n\n亲密联结终止，只终止亲密身份与亲密约束，不自动消灭已经依托独立事实生成的正当责任。\n\n##### 6.6.2 推演依据\n\n责任来源于事实行为、有效约定或保护必要性，而不是亲密身份本身。因此关系解除不能自动构成免责依据。\n\n#### 6.7 责任必须具备独立基础原则\n\n##### 6.7.1 允许基础\n\n自愿约定、事实付出、行为关联与弱势保护必要条件等，可构成可追溯的责任基础。\n\n##### 6.7.2 禁止基础\n\n仅凭身份层级、传统习俗、性别身份或家庭归属创设无限责任，属于制度化无偿剥夺与人格从属，应被排除。\n\n### 七、共同生活与结构性风险规范体系\n\n#### 7.1 基础定义\n\n- **共同生活共同体**：多名主体自愿共享居住空间、生活资源并协作处理日常事务的社会组织形态。\n- **结构性支配**：依托资源配置、权力集中或生活依附形成的系统性、持续性人格压制与选择锁定结构。\n\n#### 7.2 共同生活不等同于亲密联结原则\n\n##### 7.2.1 概念分离\n\n共同生活属于居住、资源与事务层面的合作形态；亲密联结属于深度人格亲密层面的人际形态。二者相互独立。\n\n##### 7.2.2 制度边界\n\n共同生活的建立不自动生成亲密关系，亲密关系的存在也不强制要求共同生活。若制度强制绑定二者，将不必要地压缩主体居住自由、合作自由与人格自主空间。\n\n#### 7.3 资源合并自愿合法原则\n\n##### 7.3.1 规范命题\n\n主体可基于自愿开展资源共享、资源合并与统筹分配；自愿资源协作属于无害合作自由的范畴。\n\n##### 7.3.2 失效条件\n\n资源合并本身不构成支配。只有当资源统筹被改造为垄断工具、退出阻断工具或人格压制工具时，合法合作才转化为违规支配。\n\n#### 7.4 共同体风险区分原则\n\n##### 7.4.1 风险状态\n\n共同体规模扩大、权力集中、资源统一统筹，会提高个体依附度与退出成本，但风险存在本身不等于结构违规。\n\n##### 7.4.2 违规门槛\n\n只有当共同体权力与资源结构实质消灭成员退出权，制造不可挣脱的生存依附与人格从属时，才进入公理禁止区。\n\n### 八、儿童主体与亲子抚育规范体系\n\n#### 8.1 基础定义\n\n- **儿童**：尚未具备完整自主决策、独立生存与完整社会行为能力的弱势人格主体。\n- **亲子照护责任**：针对儿童生存、身心完整与人格发展的刚性保护义务。\n- **有限监护权**：以儿童利益为唯一目标、严格限定范围，并随儿童成长逐步退让的保护性决策权限。\n\n#### 8.2 儿童人格平等独立原则\n\n##### 8.2.1 规范命题\n\n儿童虽存在能力与生存弱势，但仍属于平等人格主体，不具有可被占有、支配或物化的属性。\n\n##### 8.2.2 禁止结果\n\n将儿童视为私有物、附属物或支配对象的制度结构违反人格平等与非占有公理。\n\n#### 8.3 儿童生存保障刚性原则\n\n##### 8.3.1 规范命题\n\n儿童不具备独立生存能力，因此社会与成年主体必须形成有效、稳定的照护责任结构，保障其基本生存、身心完整与发展条件。\n\n##### 8.3.2 优先性\n\n儿童生存权具有规范优先性。任何允许儿童生存无保障、发展无支撑、弱势无保护的制度安排，均突破公理一的刚性边界。\n\n#### 8.4 亲子责任非占有原则\n\n##### 8.4.1 责任与权力分离\n\n成人承担抚育、监护、教育和保障责任，不转化为对儿童人格、身体、人生或未来的所有权与支配权。\n\n##### 8.4.2 监护目的\n\n监护是保护性义务而非占有性权利，其唯一正当目标是儿童自身利益。\n\n#### 8.5 抚育责任不可任意抛弃原则\n\n##### 8.5.1 规范命题\n\n儿童未完成能力自立前，已成立的抚育照护责任，不得因成人亲密关系变化、共同体变化或个人意愿变化而被任意抛弃。\n\n##### 8.5.2 自由边界\n\n成人拥有退出亲密关系的自由，但该自由不能覆盖或取消儿童保护义务。\n\n#### 8.6 监护权限渐进退让原则\n\n##### 8.6.1 规范命题\n\n随着儿童自主能力提升，成人监护权限应持续缩减、逐步退出，并最终让渡完整的人格自主。\n\n##### 8.6.2 禁止结构\n\n终身监护、终身管控或永久未成年化会制造终身人格从属，因此违反人格平等与自由公理。\n\n#### 8.7 抚育结构多元合法原则\n\n##### 8.7.1 可行形态\n\n在满足儿童人格独立、生存保障、无占有支配的前提下，生物父母抚育、共同体集体抚育、社会公共抚育、分工协作抚育等多元形态均可进入合法制度空间。\n\n##### 8.7.2 元规则\n\n亲密关系结构或家庭形态，不决定抚育结构的唯一合法性。\n\n### 九、亲密关系可行集合筛查原则体系\n\n#### 9.1 独居形态合法原则\n\n成年主体选择无亲密联结、无共同生活并独立自主生活，完全符合公理体系。独居不产生人格占有、强制绑定或结构性支配，因此属于合法可行形态。\n\n- 制度不得将共同生活、婚姻或组建家庭设为成年人的强制义务。\n\n#### 9.2 自愿一对一亲密结构合法原则\n\n两名成年主体在全程持续自愿、双向知情、保留完整退出权、无支配绑定的条件下建立一对一亲密联结与自愿排他约定，可通过公理筛查。\n\n- 共同生活或异地分居不改变其合规属性。\n- 关键不是形式，而是是否存在占有、强制存续、层级支配与无限责任绑定。\n\n#### 9.3 多主体自愿亲密结构合法原则\n\n三名及以上成年主体，在全员持续自愿、全员保有独立选择权和实质退出权、无人格强制与结构性支配的前提下，可形成具有规范正当性的多主体亲密联结。\n\n- 公理禁止的是强制、占有、支配与非自愿，而不对亲密联结人数作刚性限定。\n- 因此多主体自愿结构、一对一自愿结构与独居结构，在公理层面可具有同等合法地位。\n\n#### 9.4 无亲密共同生活合法原则\n\n多主体可自愿开展共同生活、资源协作和事务共建，而不建立亲密联结或绑定亲密身份。共同生活与亲密关系的制度解绑，属于人格多元自由的合法协作形态。\n\n#### 9.5 强制不可退出亲密结构禁止原则\n\n通过制度、法律、契约或习俗强制锁定关系、禁止退出，或在主体撤回同意后继续强制维持亲密关系的结构，违背持续自愿公理，应被完全排除出可行制度集合。\n\n#### 9.6 身份自动无限责任结构禁止原则\n\n仅凭亲密身份、家庭身份或伴侣身份自动创设无限供养、无限从属、无限代偿责任的制度安排，违反责任独立基础原则与人格平等原则，属于禁止结构。\n\n#### 9.7 Commons–Consortship（共侣）合规规范与风险防控原则\n\n##### 9.7.1 核心定义\n\n**Commons–Consortship** refers to the normative organization of shared subsistence and intimate partnership.\n\n“共侣”（Commons–Consortship）是两名及以上成年主体，在全员持续自愿、完全知情、人格平等的前提下，自愿缔结的常态化共生伴侣规范组织形态。其核心同时覆盖：\n\n- 生存资源共建共享；\n- 平等亲密伴侣联结。\n\n该结构无先天身份层级、无人格从属绑定；只要持续满足五条基础公理，即可作为体系内合法的多元亲密共生形态。\n\n##### 9.7.2 全员自愿无强制底线\n\nCommons–Consortship 的成立、存续、调整与终止必须得到每一位参与主体的主动同意，不得存在默认绑定、舆论裹挟、道德胁迫或利益绑架。\n\n任何利用既有关系身份、生活依附或资源捆绑强制他人加入或留存于该结构的行为，均违反持续自愿公理。\n\n##### 9.7.3 全员平等无层级底线\n\n体系内部所有主体人格地位完全平等，不设置核心主体、附属主体、主次伴侣等人格等级。\n\n相处时长、资源付出、抚育贡献与情感投入均不得转化为人格层级、支配权限或优先话语权。\n\n##### 9.7.4 完整退出权刚性保障\n\n所有参与主体始终保留独立、实质的关系退出权。单次缔结同意不能永久锁定关系。\n\n共同体不得通过冻结资源、惩罚性索赔、舆论施压或切断生存支撑等方式阻断退出。\n\n\u003e 注：这里的“无惩罚”应理解为不得以惩罚机制阻断退出；已经独立成立的民事、抚育或损害责任仍可继续存在。\n\n##### 9.7.5 权责对等与无无限绑定底线\n\nCommons–Consortship 所衍生的互助、照护与协作责任，必须具备独立事实基础，不得仅凭共同体身份自动生成无限义务。\n\n应防止部分主体长期承担全部生活、劳动与抚育成本，而另一部分主体持续无偿获益的结构性失衡。\n\n##### 9.7.6 资源透明与无垄断风险底线\n\n共同体的资源共享、合并统筹与劳动分配应保持透明，并由全员共同协商控制资源支配规则。\n\n禁止单一或少数主体垄断核心资源、独占分配权限，并借此构造结构性依附。\n\n##### 9.7.7 关系边界清晰分离底线\n\nCommons–Consortship 中的亲密身份、共同生活协作、民事责任与抚育责任应相互区分。\n\n主体退出关系，终止的是亲密联结与共生协作；已经独立形成的合法抚育责任、民事责任并不随关系解体自动消灭。\n\n---\n\n## 第三编：劳动组织、生产资料与分配秩序\n\n### 十、劳动组织、生产资料支配与生产分配规范体系\n\n#### 10.1 基础定义\n\n- **劳动**：主体以自身身心能力主动投入，用以维护生存、改造环境、创造可用物资与公共价值的社会性活动。\n- **劳动主体**：具备自主意志、可承担劳动行为并享有人格平等与生存保障权的社会主体。\n- **生产资料**：劳动开展所依托的工具、设备、场地、能源、基础设施、技术平台、原料储备等客观条件总和。\n- **个体再生产**：主体维持生命存续、身心完整与劳动能力持续延续所需的必要生活条件。\n- **劳动剩余产出**：劳动总产出扣除个体再生产必需消耗后的可积累价值增量。\n- **生产共同体**：多主体协作共享生产条件、分工劳动、合并产出的社会组织形态。\n- **分配制度**：共同体内部关于劳动负担、生产资料使用权、剩余归属和风险承担的稳定规则体系。\n- **制度化剥削**：依托生产资料垄断，在缺乏相应劳动投入的情况下持续无偿占有他人劳动剩余，并制造长期生存依附的制度结构。\n- **经济退出权**：主体在不发生生存崩塌、不过度承受极端惩罚的前提下，退出劳动岗位、合作模式或分配体系的实质权利。\n\n#### 10.2 劳动主体人格不可占有原则\n\n##### 10.2.1 规范命题\n\n所有劳动承担者均为平等人格主体。既然人格禁止占有，劳动主体就绝对禁止被奴役、买卖、人身绑定或制度化物化。\n\n##### 10.2.2 禁止结构\n\n奴隶制、农奴制、终身人身依附、可交易劳动力主体等制度，直接突破人格平等与不可占有的刚性边界。\n\n#### 10.3 劳动无先天强制义务原则\n\n##### 10.3.1 规范命题\n\n人格主体不存在由出身、性别、阶层、种族或其他先天身份直接产生的无条件劳动义务。\n\n##### 10.3.2 正当来源\n\n劳动的正当来源只能是自愿参与、自愿协作与自愿契约。\n\n##### 10.3.3 禁止结果\n\n无条件强制劳动相当于阶段性人格征用，违反持续自愿与人格平等公理。\n\n#### 10.4 劳动再生产刚性保障原则\n\n##### 10.4.1 规范命题\n\n任何制度若组织、征用或安排主体劳动，必须保障其基本生存与劳动能力可持续再生产，劳动不得被常态化设计为透支生命、摧毁身心存续的活动。\n\n##### 10.4.2 禁止结构\n\n要求劳动却不保障生存再生产的制度，构成系统性侵权，应被排除。\n\n#### 10.5 劳动剩余归属主体原则\n\n##### 10.5.1 规范命题\n\n劳动产出与劳动剩余的本源规范归属为劳动主体自身。制度不得默认将劳动者剩余自动归属于非劳动者。\n\n##### 10.5.2 禁止结构\n\n仅凭身份、地位或所有权即可持续无偿攫取他人劳动剩余的结构，会制造制度化人格层级与依附，违反平等与非占有公理。\n\n#### 10.6 小额资源差异合法原则\n\n##### 10.6.1 规范命题\n\n个体小型生产工具、个人技艺设备、私人生活物资等资源差异，本身不构成违规支配。\n\n##### 10.6.2 核心区分\n\n公理禁止的是**垄断性支配结构**，而不是一切数量差异。人格平等指人格地位平等，并不意味着物资绝对平均。\n\n##### 10.6.3 可行空间\n\n个体劳动积累与自愿交换形成的合理差异，属于合法自由范畴。\n\n#### 10.7 核心生产资料垄断禁止原则\n\n##### 10.7.1 禁止条件\n\n若社会核心生产资料、基础生存产业与全民必需基础设施被少数主体排他性、永久性垄断，进而使多数主体缺乏独立劳动通道与替代生存体系，即会形成结构性经济支配与人格依附。\n\n##### 10.7.2 筛查结论\n\n能够消解劳动自愿性、消灭经济退出权并固化人格层级的核心资源垄断结构，应被排除出可行制度集合。\n\n#### 10.8 生产资料公共共享合法原则\n\n##### 10.8.1 规范命题\n\n共同体可自愿将核心生产资料设置为公共共有、公平配置、按需使用与共同维护。\n\n##### 10.8.2 成立条件\n\n只要该公共共享结构不存在私人垄断、人格层级支配与劳动剩余掠夺，即可作为合法制度形态。\n\n#### 10.9 纯所有权无自动剩余索取权原则\n\n##### 10.9.1 规范命题\n\n单纯静态资产持有、场地持有或设备持有，不自动生成无偿攫取他人劳动剩余的规范权利。\n\n##### 10.9.2 剩余索取的正当基础\n\n剩余索取权必须能够对应于劳动投入、风险承担、协作贡献或自愿契约等独立基础。\n\n##### 10.9.3 禁止结构\n\n若纯粹所有权无需对应任何贡献即可稳定获取他人劳动剩余，将构成稳态剥削结构。\n\n#### 10.10 分配规则可协商、可修订原则\n\n##### 10.10.1 规范命题\n\n分配制度不得永久固化、不得不可质疑、不得不可退出。所有经济合作规则必须保留持续同意、协商修订与退出终止的空间。\n\n##### 10.10.2 禁止结构\n\n一次性同意即锁定终身分配地位的体系，会消灭持续自愿属性，因此属于禁止结构。\n\n#### 10.11 身份固化劳动分工禁止原则\n\n##### 10.11.1 规范命题\n\n不得依托出身、世袭、性别、种族等先天身份，永久固化底层高强度劳动层级、终身劳动义务或人格层级。\n\n##### 10.11.2 禁止理由\n\n先天身份决定终身劳动地位，直接违反人格平等公理。\n\n#### 10.12 自愿劳动共同体合法原则\n\n##### 10.12.1 可行条件\n\n多主体可以自愿分工、协作生产、合并资源与共享产出，只要共同体同时满足：\n\n- 保留全员退出通道；\n- 保留协商与修订分配规则的权利；\n- 不实行人格强制；\n- 不形成核心资源垄断；\n- 不存在制度化剩余剥夺。\n\n##### 10.12.2 筛查结论\n\n满足上述条件的劳动共同体属于合法可行制度形态。\n\n#### 10.13 共同体权力集中风险区分原则\n\n##### 10.13.1 风险状态\n\n共同体规模扩张、决策权集中、资源统筹集中，只意味着结构性风险增加，并不必然构成违规结构。\n\n##### 10.13.2 违规门槛\n\n只有当权力集中实质消灭成员经济退出权、制造永久生存依附并固化少数人支配地位时，该结构才违反公理体系。\n\n---\n\n## 第四编：终局规范、制度筛查与体系边界\n\n### 十一、体系终局规范原则\n\n#### 11.1 多元制度可行原则\n\n##### 11.1.1 规范命题\n\n本公理体系仅划定社会制度的刚性正义边界，并不唯一锁定亲密形态、家庭形态、劳动形态、分配形态与总体社会形态。\n\n##### 11.1.2 可行集合\n\n在满足公理约束的前提下，下列形态均可获得规范上的可行性：\n\n- 独居；\n- 自愿一对一亲密关系；\n- 自愿多主体亲密关系；\n- 多元共同生活模式；\n- 多元儿童抚育结构；\n- 多元合法生产协作与分配模式。\n\n#### 11.2 结构性压迫绝对禁止原则\n\n##### 11.2.1 禁止对象\n\n一切制度化的人格占有、强制绑定、退出权剥夺、身份层级、生产资料垄断剥削、无偿剩余掠夺和人身奴役结构，无论其传统习俗、制度惯例或历史惯性如何，均不具备规范正当性。\n\n##### 11.2.2 筛查结果\n\n上述结构被永久排除出可行社会制度集合。\n\n#### 11.3 公理边界优先原则\n\n##### 11.3.1 层级优先性\n\n所有社会制度规则、共同体安排、人际秩序与经济秩序，都必须服从五条底层公理的刚性约束。\n\n##### 11.3.2 自由空间\n\n制度自由只存在于公理红线以内；任何下位制度安排均不得以效率、传统、稳定、身份或历史惯例为由突破基础规范边界。\n\n### 十二、体系元结构\n\n#### 12.1 规范推演链\n\n\u003e **公理 → 规范原则 → 制度规则 → 可行制度集合**\n\n#### 12.2 公理层\n\n规定不可突破的底层规范条件：\n\n- 基本生存与身心完整；\n- 公共生存基础不得私人化为支配权力；\n- 亲密联结持续自愿；\n- 人格天然平等；\n- 无害前提下的自愿协作自由。\n\n#### 12.3 原则层\n\n从公理导出关系退出权、责任独立性、儿童保护、劳动主体不可占有、经济退出权、反垄断性支配等原则。\n\n#### 12.4 制度规则层\n\n将规范原则转化为具体筛查规则，例如：\n\n- 禁止不可退出的亲密绑定；\n- 禁止身份自动产生无限义务；\n- 禁止监护异化为人格所有权；\n- 禁止核心生产资料垄断造成生存依附；\n- 要求分配规则保留协商、修订与退出空间。\n\n#### 12.5 可行制度集合层\n\n通过筛查的制度形态并不唯一。体系允许多元制度并存，但其共同条件是：不突破生存保障、人格平等、持续自愿、非占有支配与实质退出权等底层边界。\n\n---\n\n## 附：体系筛查的简化判定框架\n\n### A. 人际关系筛查\n\n#### A.1 第一问：是否持续自愿？\n\n若否，则排除。\n\n#### A.2 第二问：是否保有实质退出权？\n\n若退出在现实层面被制度性消灭，则排除。\n\n#### A.3 第三问：是否存在人格层级或人格占有？\n\n若存在，则排除。\n\n#### A.4 第四问：责任是否具有独立基础？\n\n若仅凭身份自动生成无限义务，则排除。\n\n### B. 儿童与照护筛查\n\n#### B.1 第一问：儿童基本生存与身心发展是否得到有效保障？\n\n若否，则排除。\n\n#### B.2 第二问：监护是否以保护为目的而非占有为目的？\n\n若监护转化为人格支配，则排除。\n\n#### B.3 第三问：监护权限是否随儿童自主能力提升而退让？\n\n若被设计为终身管控，则排除。\n\n### C. 劳动与生产分配筛查\n\n#### C.1 第一问：劳动主体是否保持人格平等与自由？\n\n若存在奴役、买卖或终身身份绑定，则排除。\n\n#### C.2 第二问：基本生存与劳动再生产是否得到保障？\n\n若劳动制度系统性摧毁主体生存基础，则排除。\n\n#### C.3 第三问：核心生产资料是否被用于形成垄断性支配？\n\n若垄断实质消灭多数主体独立生存与经济退出通道，则排除。\n\n#### C.4 第四问：剩余分配是否存在可追溯的正当基础？\n\n若仅凭静态所有权或身份即可持续无偿攫取他人剩余，则排除。\n\n#### C.5 第五问：分配规则是否可协商、可修订、可退出？\n\n若一次性同意永久锁定分配地位，则排除。\n\n---\n\n\u003e 注：本文为规范公理体系的结构化整理稿。其“可行/不可行”结论均指该体系内部的规范筛查结论，而非对现实法律、经济制度或政策实践的经验性结论。原始材料标注“部分内容可能由 AI 生成”。\n","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"1679385217b4c906969980a73617d946ef119643bd49a8c355053045c915a243","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e摘要\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:e691b531fcebee2d664852ec0a90296aab95b2f0a98186b19d647d2cf9203b4b\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"1,2","tag":"h2"}},{"children":[{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e1.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e第一步：红线筛查。\u003c/strong\u003e\u0026nbsp;若制度形态触及人格占有、强制绑定、退出权剥夺、身份层级、结构性垄断剥削、无保障的强制劳动等绝对禁止项，直接排除，不进入可行性研究。\u003c/span\u003e","payload":{"lines":"5,6","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e2.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e第二步：条件识别。\u003c/strong\u003e\u0026nbsp;对通过红线筛查的制度形态，分析其持续自愿、人格平等、资源结构、退出机制、责任基础等成立条件。\u003c/span\u003e","payload":{"lines":"6,7","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e第三步：风险评估。\u003c/strong\u003e\u0026nbsp;判断合法结构在运行过程中是否可能异化为资源垄断、隐性胁迫、权力固化或事实上的退出阻断。\u003c/span\u003e","payload":{"lines":"7,8","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e4.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e第四步：可行空间确认。\u003c/strong\u003e\u0026nbsp;仅对仍能满足公理约束的制度方案确认其体系内可行性与制度自由度。\u003c/span\u003e","payload":{"lines":"8,9","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e研究流程\u003c/span\u003e","payload":{"lines":"4,5","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e可行性研究边界\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:707c3edab410cb75721920cffc
