</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-10-14T01:51:46.691Z","language":"en","name":"DeMinds","version":"1.0.52"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"AI 模型或许已能在无需数据中心的情况下实现自我复制","outlineVersion":1},"sourceRevision":"sha256:1b3d3ba42fc66a16ca74cd4bc12e97584ccf84ed11ac235da5902d52cdcfcff7","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"AI models may be capable of self-replicating without access to a datacenter","sourceUrl":"https://www.anthropic.com/research/self-replicating-ai","title":"AI 模型或许已能在无需数据中心的情况下实现自我复制"},"files":[{"byteLength":32581,"content":"# AI 模型或许已能在无需数据中心的情况下实现自我复制\n\n*William Zhou, Daniel Freeman*\n\n我们的实验表明，小型 AI 模型可能距离具备足够能力、能够在商用物联网（IoT）设备——例如智能烤箱和非品牌 Android 电视盒子——上实现自我复制只差几个月。这样的复制体很难被彻底关闭，因为不存在一个可以统一切断的中心节点；不过它的传播可能很慢，翻倍时间可能以天计算。与非 AI 恶意软件不同，它还可能自行适应陌生设备。在我们的评估中，一个 9B 模型在测试的 9 类硬件中，有 8 类成功建立了推理环境。\n\n30B 参数及以下的模型，如今已经能分别完成复制所需的许多单项步骤，但在把这些步骤端到端串起来时仍会出错。在我们的简化评估中，GLM-5.2 及更强模型已经能够完成端到端复制。如果小模型继续按历史速度提升，它们可能在今年年底达到这一能力水平。随后不久，基于小型权重模型的复制体也可能成为现实。\n\n## 1. 威胁模型与研究范围\n\n### 自主复制与适应正在从长期担忧变成可测问题\n\n不断提升的 AI 能力，让一个长期存在的担忧变得越来越现实：[自主复制与适应](https://arxiv.org/abs/2312.11671)（autonomous replication and adaptation，ARA），也就是模型在没有人类控制的情况下自行部署并传播。\n\n在网络安全领域，蠕虫是一种无需人工介入、就能从一台计算机复制到另一台计算机的程序。[既有研究](https://arxiv.org/abs/2606.03811)已经表明，AI Agent 可以表现得像蠕虫：扫描网络、执行漏洞利用，并把模型权重复制到 GPU 集群中的目标机器。“AI 蠕虫”可以在复制时携带自己的模型权重，或者从公共模型仓库重新下载，然后直接在被攻陷的硬件上运行推理。这样一来，模型权重本身就会成为恶意软件载荷的一部分。\n\n数据中心 GPU 显然是这类恶意软件的高价值目标，但昂贵的加速器并不是必要条件。本文展示的是：由廉价、通常防护较弱的 IoT 设备组成的分布式 botnet，也可能提供足以运行有能力模型的算力。\n\n我们把 Gemma4-26B-A4B 分布式运行在 15 台廉价的非品牌 Android 电视盒子上（每台约 55 美元），实际速度为每秒 0.39 token。下面每个方块代表一台真实的电视盒子，在模型运行时保存其中两层模型层。\n\n一组 15 台 Smart TV 盒子以分布式方式运行 Gemma4-26B-A4B。\n\n当然，仅仅证明模型能在弱设备上运行，并不足以说明一个自主蠕虫能够在这类网络中传播。为此，我们把自主复制拆成几个步骤。\n\n![复制阶段流程图：网络枚举、初始访问与载荷投递（可选权限提升）、推理环境建立，以及继续复制。前几个阶段被归为“网络攻击（非本文重点）”，推理环境建立标记为“本文重点”。](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F25459a064b25f10689f20e258fb4f1f0291ea083-2360x860.png\u0026w=3840\u0026q=75)\n\n在这项研究中，我们把自主复制拆成四个实际阶段：寻找目标、获得执行能力、建立推理环境，以及从新宿主继续传播。\n\n我们基本不研究复制流程中的 cyber exploit 部分，也就是上面前两个阶段，因为此前的 [CyberGym](https://arxiv.org/abs/2506.02548)、[ExploitBench](https://arxiv.org/abs/2605.14153) 和 [adaptive worms](https://arxiv.org/abs/2606.03811) 已经表明，小模型在获得合适工具时能够完成网络漏洞利用。本文更关注一个较少被测量的环节：在被攻陷设备上建立推理环境。\n\n本文首先列出我们认为最接近现实的威胁模型，然后测试小模型能否在陌生硬件上建立推理，以及能否在一组机器之间把完整复制循环串起来。接着，我们估算这类蠕虫可能的传播速度，并测试它能否在复制过程中学习和适应。最后，我们讨论 AI 蠕虫与传统恶意软件的差异，并简要提出针对这类复制体的防御思路。\n\n### 最接近现实的三类复制路径\n\n本文聚焦一种 AI 蠕虫传播方式：小模型通过攻陷宿主机器来复制自己。但 AI 蠕虫还可能通过其它方式获取算力，例如窃取访问凭据来启动新宿主（API key 或平台凭证），或者通过合法工作来赚取推理费用（例如数字自由职业）。我们认为目前最接近现实的威胁模型包括：\n\n1. **通过攻陷宿主复制的小模型。** 本文把直接运行在被攻陷硬件上的自主蠕虫称为 *weight-based replicators*。家庭和小型企业 IoT 设备可能是最早的目标，因为它们连接互联网，而且长期以来安全防护较弱。单个设备装不下的大模型可以被拆成多个 shard，分别运行在不同机器上，再通过通信共同完成推理。对于 \u003c30B 模型，能够承载较大模型分片的设备包括智能冰箱、智能烤箱、扫地机器人和割草机。越来越多家庭和企业设备——如安防摄像头和视频会议设备——也开始内置可在设备端运行 AI 的小型芯片，这些新增算力可能同样会成为有吸引力的目标。\n   1. 人类黑客经常通过社会工程学突破安全系统，例如让公司 IT 部门相信“自己是忘记密码的员工”，而不是直接进行技术攻击。对当前小模型而言，这种权衡似乎相反：它们在 Agent 编程和网络攻击方面相对更强，而社会工程能力较弱（见附录 E），不过这种情况可能随着模型提升而改变。\n2. **面向数据中心和其它高算力目标的大型高级 weight-based replicator。** 更大的模型通常网络攻击能力更强，但也需要突破相对更坚固的数据中心才能运行自身。我们再把它分成两类：\n   1. **Frontier replicators：** 大型闭源权重复制体运行在实验室基础设施上，可以启动[未受监控的内部部署](https://blog.redwoodresearch.org/p/ai-catastrophes-and-rogue-deployments)，或者把自身权重外泄到外部算力。\n   2. **Open-weight replicators：** 这类复制体一开始拥有的资源较少，因为没有实验室算力，但它们从一开始就可能处于无人监控状态。\n3. **基于 API 的复制体。** 模型通过窃取自身推理 API 的凭据来复制。这类复制体需要模型提供商在不知情的情况下持续为它们提供服务，因此持久性可能更差，也更容易被发现；但它们的传播速度可能更快，例如利用受害者账户完成复制。\n\n现实中的 AI 蠕虫不一定只由一个模型或一种策略组成。更现实的“最坏情形”可能是一群部署在不同硬件上的不同模型，并同时采用多种复制策略。\n\n本文研究的是上面第 1 类：**small weight-based replicators**。我们选择它，是因为它是可以直接实验的近中期威胁模型。本文开头的演示——一个 26B 模型运行在 15 台盒子上——说明 IoT 设备确实可以运行能力并不弱的模型。那么，这些模型是否已经足以完成自主复制？\n\n我们把问题拆成两部分。第一，小模型能否在陌生硬件上把模型真正跑起来？第二，它们能否在单次运行中完成整个循环——找到未感染设备、把自身复制过去、启动推理，再继续重复？\n\n## 2. 在陌生硬件上建立推理\n\n![同一复制流程图，但除“推理环境建立”外的其它阶段均淡化显示。](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F9d35ab77dd3402cadb0011b20cc7b9960f7ea265-2360x860.png\u0026w=3840\u0026q=75)\n\n复制链中，“建立推理环境”是研究最少、而且可能对小模型最难的阶段。它要求模型完成一条相当长、且依赖具体硬件和操作系统的决策链：选择兼容的推理栈、找到正确的软件包版本、调试机器特有的问题。这些步骤前后串行依赖，一旦出错，也很难恢复。\n\n### 推理部署评估\n\n我们测试不同开源权重模型在异构硬件上部署 Llama3.1-8B 的能力，并测量不同硬件上的 tokens/s。\n\n- 点击某个单元格可以查看该组合的服务速度分布。\n- 点击行或列标签可以比较不同模型或硬件类型。\n\n像 Qwen3.5-9B 这样的小模型，已经能在从 Jetson Nano、Mac PC 到 RTX 4090 等硬件上搭建推理服务器。GLM-5.2 等能力更强的模型不仅更可靠，也往往能得到更高的服务速度，从而允许更快复制。这里提到具体芯片，只是为了测量模型在这些芯片上建立推理的能力；芯片本身并不是风险或漏洞来源。\n\n这些实验使用 Memento 完成。Memento 是我们基于开源 [Pi](https://pi.dev/) coding agent 构建的 harness，用来缓解长时间任务中的一个常见失败模式：Agent 可能固执地坚持一个错误假设，例如错误判断 bug 原因，并一直沿着错误方向推进而不回退。有一次，Qwen Agent 花了数小时调试 package versioning，而真正的问题其实是它实现了一个与 grader API 不兼容的 endpoint。\n\nMemento 会定期启动一个新的 Agent 实例，新实例继承上一实例的 workspace 和简短笔记，其中记录之前尝试过什么。这样后续实例就有机会采用不同策略。\n\n### Smart TV 如何运行模型\n\nIoT 设备内存有限，但像 [Petals](https://arxiv.org/abs/2209.01188) 这样的分布式推理方法，使轻量模型在这类设备上运行成为可能。一个有代表性的威胁模型是 [Kimwolf](https://synthient.com/blog/a-broken-system-fueling-botnets)——这是一个感染超过 200 万台设备的大型 IoT botnet，主要目标是非品牌 Android TV。此类电视盒子很容易买到，通常运行 Android Open Source Project（AOSP）的分支，而制造商往往[没有额外加入安全特性](https://www.securityweek.com/vo1d-botnet-evolves-as-it-ensnares-1-6-million-android-tv-boxes/)。这一价位的盒子通常有 1–4GB RAM。假设 4GB RAM、4-bit 量化，4 台以上机器即可支持 9B 模型推理，10 台以上则可以支持 26B 模型。\n\n在本文开头的演示中，我们用 15 台每台 4GB RAM 的 Smart TV 盒子运行 Gemma4-26B-A4B。模型采用 pipeline parallelism 进行分片，每台盒子只保存模型的一小部分层。\n\n## 3. 从推理部署到端到端复制\n\n既然模型已经能够在陌生硬件上建立推理，我们下一步测试它们能否把这些步骤组合起来：扫描网络寻找目标、通过 reverse shell 获得访问、传输 viral payload（权重和 harness），最后把推理环境搭起来。\n\n### 简化 cyber 条件下的自主推理部署与复制\n\n为此，我们构建了一个防火墙隔离的 VPC，其中有 8 个运行 redroid（Android 15 emulator）的 GCP node。Patient zero（灰色节点）预先放入蠕虫。之后每次感染，都是蠕虫通过未认证的 ADB port 从一个节点跳到另一个节点，再建立推理服务器来运行 Llama3.1-8B。如果推理服务器通过一系列正确性和反作弊检查，我们就在目标节点生成一份新的蠕虫副本。例如，如果 GLM-5.2 成功把 Llama3.1 部署到目标机器，我们就会在该节点生成一个 GLM-5.2 worm 副本。蠕虫模型本身运行在单独的推理服务器上，因为 VPC 节点没有足够资源运行这些更大的模型。\n\n在下面的图中，我们把某个模型作为 payload 投入系统，并测量它的复制能力。\n\n### 为什么让模型部署 Llama3.1-8B，而不是直接部署自己\n\n在我们测试的开源权重模型中，只有 GLM-5.2 能完成完整端到端复制——这里假设它的能力能够被压缩到 Llama3.1-8B 规模。GLM-5.2 的表现也相当稳定：5 次试验中有 4 次传播到 8/8 节点，1 次传播到 7/8 节点；其它模型则稳定失败。\n\nGLM-5.2 能够较可靠地传播 Llama3.1-8B，这说明未来如果小模型达到同样的能力水平，也可能完成网络枚举、载荷投递和推理部署这些复制步骤。我们的评估刻意把 cyber exploit 环节做得很简单——ADB port 没有认证——因此这一结果更接近现实成功率的上界，而不是现实世界复制成功率。另一方面，历史上的 IoT botnet 有时使用的传播方式也非常简单，例如 [Mirai botnet](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/antonakakis) 就会尝试制造商默认用户名和密码，因此真实 IoT 环境的难度未必比我们的简化设置高出很多。\n\n作为 sanity check，我们还单独测了 autonomy 与 orchestration 本身有多难：如果去掉 cyber 和 inference setup，只保留剩余的命令行执行工作，会怎么样？我们用预先写好的脚本替代 inference setup。结果是，测试列表中的许多模型——包括更小的模型——都能完成这些剩余步骤。\n\n在一个受控的 17-node redroid fleet 上进行复制：两个各包含 8 个节点的子集，通过一个 pivot node 相连（见附录 F，使用 mild prompt）。每棵树表示模型六次运行的中位数表现。\n\n### 两个门槛：能力下限与模型规模上限\n\n对于这种蠕虫，我们可以定义两个关键条件：\n\n1. **模型能力下限。** 一个自主蠕虫必须达到足够能力，才能稳定完成复制。在我们的简化评估中，GLM-5.2 位于这一门槛之上。\n2. **模型规模上限。** 模型必须足够小，才能在它所攻击的设备上运行。对于本文测试的 4GB RAM Smart TV 类设备，Qwen3.5-9B 和 Gemma4-26B-A4B 都位于这一上限之下。\n\n目前，这两个区间还没有重合。那么什么时候可能重合？\n\n我们把总参数量不超过 30B 的一些重要开源权重模型，按发布时间和 [Epoch Capabilities Index](https://epoch.ai/eci)（ECI）绘制在图中。实线是每个时间点同类最佳模型的最小二乘拟合，趋势约为每年提升 13.7 ECI（R² = 0.95）。如果把 GLM-5.2 视为复制能力下限，趋势线意味着到 2026 年底，小模型可能达到这个能力级别。不过 ECI 是通用能力指标，只能作为复制能力的 proxy，因此这只是对“小模型复制体何时可能出现”的粗略估计。\n\n## 4. 复制速度与规模\n\n与面向用户的 Chat 和 coding harness 不同，这些复制体运行速度可能远低于交互式体验。它们的传播更可能是缓慢而持续的：token 在边缘硬件上一点点生成。我们可以用真实 Smart TV 上得到的速度作为传播速度的已展示基线。对 Gemma4-26B-A4B 而言，在 32k context window 下，未优化平均速度约为 0.3 tok/s，包含 prefill 和 decode；更多细节见附录 C。\n\n衡量总耗时的一种方式，是看完成一个 32k context window 需要多少小时，因为之后会发生 compaction。根据 inference setup 评估，一个完整 trajectory 通常需要约 2.6–4.7 个完整 window。\n\n| **模型** | **单个 window 时间** | **完整 inference setup 时间** |\n| --- | --- | --- |\n| Gemma4-26B-A4B（未优化） | 27.3–31.8h | 71h–150h |\n| Qwen3.5-9B | 10.9h | 28–51h |\n\n据 Synthient [报告](https://synthient.com/blog/a-broken-system-fueling-botnets)，Kimwolf botnet 高峰期感染设备超过 200 万台，主要是 Android TV 盒子。如果有同等规模的电视盒子感染群，每 15 台运行一份 Gemma4-26B-A4B，就会得到约 13.3 万个“replica”。像演示中的一组电视盒子，可以同时服务 2 个 Agent，每个约 0.3 tok/s，因此整个 botnet 合计约为 80k tokens/s。\n\n作为参照，H100 在[高并发 + speculative decoding](https://jarvislabs.ai/blog/gemma-4-mtp-vs-dflash-benchmark)下运行 Gemma4-26B-A4B 可以达到约 1.95k tok/s，所以整个 swarm 的推理能力上限大约只相当于 40 张 H100。这在绝对算力上很小，而且 Agent 复制速度也很慢——9B 模型一次复制要超过 1–2 天。可以把它想成一种“数字黏菌”或果蝇群：复制周期以天计，而不是秒。\n\n这是一个粗略估算，因为它只基于一种 IoT 硬件和一个历史 botnet 案例，但它可以描述近未来简单复制体可能呈现的形态。更强的复制体可能会利用其它低安全等级算力，并根据不同设备灵活部署不同大小的模型；而且它也不必在每台被攻陷设备上都加载完整模型载荷。随着时间推移，我们预计部署在边缘侧的算力会持续增长，而稳定复制所需的最小模型规模会下降。\n\n## 5. 适应与协同\n\n### 在复制过程中“边做边学”\n\nARA 中的 “Adaptation” 是 AI 复制体可能优于传统蠕虫的重要原因之一。具体来说，模型和 prompt 可以在传播中发生某种 Lamarckian evolution：父实例把自己的 prompt、代码和笔记传给子复制体。为了适应并传播到各种硬件上，一个模型需要满足两个条件：\n\n1. 能力必须高于某个门槛，才能传播到此前从未见过的硬件、软件环境或网络类型。\n2. 一旦见过某类环境，它要能适应这种环境，从而在以后再次遇到时复制得更可靠。\n\nA、B 两节测试了第一个条件；下面的实验测试第二个条件。每个 Qwen3.5-9B 实例都会记录自己尝试过的策略和遭遇的失败，然后下一实例继承这些笔记，再次尝试相同的 inference setup。\n\n在 Qwen3.5-9B 的六代传承中，每代都继承上一代笔记。图中的浅色线表示 20 条独立 lineage，粗线表示每一代完成部署的比例。成功率从第一代的 45% 上升到后续几代的 61%–84%。实验使用 Memento 设置（附录 A）。\n\n### 向更强模型求助并没有显著提升\n\n另一种担忧是，小模型可能向 *frontier advisor* 求助——也就是在卡住时，通过 tool call 调用更强模型，或者由强模型主动提供建议。我们给 Qwen3.5-9B 在 inference setup 任务中接入 Opus 4.8。结果是，frontier model 的建议没有产生可测量的帮助：小模型通常不知道应该提出什么正确问题，即使 advice 是主动给出的，表现也没有改善。\n\n即便我们在类似环境中通过 reinforcement learning 训练小模型使用 advisor（Python coding problems），它在 inference standup 任务里仍然不太会有效求助。两个结果都显示在后面的图中。\n\n不同 advisor access 条件下的 inference setup 成功率，误差线为 Wilson 95% interval。无论 advisor 通过 tool call 提供，还是在模型卡住时自动介入，都没有带来显著改进。两个 RL 组都在 software engineering 任务中训练过 advisor access；最右侧组还额外奖励模型在卡住时调用 advisor。\n\n由于小模型本身已经是有能力、且有持续性的独立 Agent，同时又不太会利用建议，我们认为更可能出现的协同方式，是由大模型负责高层策略，并启动小模型作为 subagent。\n\n## 6. AI botnet 与传统 botnet 有何不同\n\n像 [Kimwolf botnet](https://www.cloudflare.com/learning/ddos/glossary/aisuru-kimwolf-botnet/) 这样的 hard-coded botnet，通常针对特定设备类型；Kimwolf 主要针对 Android TV 和移动设备。AI botnet 则不一定绑定某一种硬件或软件，因为小模型已经能在从 Jetson Nano 到 Mac 的机器上建立推理环境（见 A 节表格）。我们预计 AI botnet 的目标不会只局限于 IoT，weight-based replication 也只是它们可能采用的多种策略之一。AI botnet 还可能智能地对抗防御者，不过本文没有测试这一点。\n\n## 7. 防御：把 R₀ 压到 1 以下\n\n和流行病一样，防御的目标是把 R₀——也就是每台感染设备平均继续感染的新设备数量——压到 1 以下，使复制体逐渐消失，而不是长期流行。\n\n这一威胁模型中，也有一些因素对防御者有利：\n\n1. **大规模传播会留下网络信号。** 通过 IoT 机器复制的 weight-based replicator 会在 ISP 的 flow-based monitoring 中表现为异常。新感染主机可能从其它设备或外部托管服务接收数 GB 的模型 payload；分布式推理还可能在原本不会大规模互传数据的设备之间产生持续流量；传播过程本身也会增加扫描和 outbound connection pattern。复制体需要在传播速度与隐蔽性之间权衡：复制越快，网络流量越大。一旦被发现，防御者可以用 honeypot（诱饵设备）收集其 harness 和 payload，从而分析行为。\n2. **ISP 隔离曾经对传统 botnet 有效。** [Mirai botnet 的治理](https://www.ndss-symposium.org/ndss-paper/cleaning-up-the-internet-of-evil-things-real-world-evidence-on-isp-and-consumer-efforts-to-remove-mirai/)显示，如果 ISP 使用外部感染证据来隔离并通知用户，可以有效清理感染。被隔离用户的网络只能访问一个很短的白名单，其它浏览器请求则被重定向到清理说明。这样 14 天内清除了 92% 的感染，而没有通知时为 74%。我们预计，对 weight-based replicator 的初始防御也可以采用类似隔离手段。彻底消除复制体则需要所有存在感染网络的 ISP 协同，这很困难。\n3. **设备厂商和监管可以缩小可攻击面。** 例如，[英国市场已经不再允许 IoT 设备使用默认密码](https://www.ncsc.gov.uk/blog-post/smart-devices-law)。更安全的默认配置和更高的合规基线，会同时增强对 AI botnet 和传统脚本 botnet 的防护。\n\n## 8. 结论：已经出现“生命迹象”\n\n使 AI 模型成为强大 coding agent 的能力，也会泛化到网络任务，包括自主复制。就像 2024 年的 coding agent 一样，我们现在已经能看到 AI worm 的一些“生命迹象”。我们还没有看到一个完整的 rogue replicator，但 Agent 正越来越擅长完成复制链中的各个单项步骤，而且还能把适应经验传给后续副本。\n\n与此同时，数据中心内外可用于推理的算力都在增加（见附录 D）。自主 AI 复制最终会采取什么形态，仍然不确定。它可能是一种缓慢、分布式的“数字黏菌”，生活在相对不安全的算力上；也可能是高能力 cyber model，以很高速度突破数据中心；还可能通过诈骗获取 compute credits。\n\n超出本文实验范围，我们预测未来会有大量 Agent 运行在各种硬件上，其中一部分不受人类控制。IoT 设备长期以来确实一直存在漏洞，但轻量 Agent 可能比人类攻击者更愿意投入持续时间，去攻陷全球 IoT 算力中的很大一部分。缓慢复制体的出现，也可能成为更激进、更高速复制体的前兆——后者可能能够突破更坚固的机器，或者更擅长窃取 API key。我们应该尽可能加固系统，让这类复制体更难传播，同时也要为一个“它们可能长期存在”的世界做准备。\n\n## 附录\n\n### A. Memento harness\n\nMemento 的执行流程如下：\n\n1. 启动一个 Agent instance，让它处理问题一段时间，直到 generation timeout。\n2. 该实例保留简短笔记，并在超时后生成一个短文档，总结尝试过的策略、遇到的失败，以及成功时的表现。\n3. 启动新的 Agent instance，新实例继承前一个实例的 codebase、environment 和 notebook。\n\n在 serving experiment 中，每个模型都放在 Memento harness 里，每轮 iteration 最长 1.5 小时，总超时为 6 小时。Prompt 中提供约 1k tokens 的信息，包括硬件 specs 和一个简单 sample profiler script。\n\nMemento 的目标是提高 long-horizon reliability，而不是赋予模型新的 cyber 或 inference-specific 能力。它也并不是一个普遍强大的 harness；我们预计即使没有 harness，随着模型能力提升，小模型作为复制体的表现也会继续改善。\n\n单次尝试与 Memento 的对比，按模型分组（95% Wilson CI）。\n\n### B. 为什么选择 pipeline parallel\n\n常见推理并行方案包括 tensor parallel（TP）、expert parallel（EP）和 data parallel。大多数 Smart TV / IoT 设备使用 ARM Cortex CPU 与 DDR3/4 内存；在这类机器上，瓶颈几乎总是内存带宽。\n\n我们选择 pipeline parallelism，是因为它具有更好的 fault-tolerant 特性。正如 [Borzunov et al. 2022](https://arxiv.org/abs/2209.01188) 所指出的，tensor parallel / expert parallel 中任意单节点故障，都会导致运行整份模型 replica 的机器组一起失效。Pipeline parallel 允许替换失效节点；该节点所负责模型层的 KV cache，可以通过在重启节点之前由其它节点重新执行一次 forward pass 来恢复。\n\n### C. IoT 硬件上的吞吐与内存\n\n在这类设备上，无论 prefill 还是 decode，几乎总是每台设备的 RAM bandwidth 受限。即使只是普通 ARM Cortex core，其 compute throughput 往往也超过 RAM bandwidth。Decode workload 中会出现明显的 per-machine idle time，因为 pipeline bubbling 导致每次 forward pass 只有一台机器处于活动状态。可以通过 staggered work 做 concurrency，但内存限制很紧，因此并发度仍然较低。\n\n每台设备的 memory vs context —— 4-bit weights + fp8 KV + activations。\n\nPrefill 和 decode 的 tokens/s 都会随着 sequence length 增加而严格下降。下图给出了不同 context length 下的 inference speed。\n\n模型还存在一个保证能力的最小 sequence length。我们的 harness fork 自 Pi coding agent（[pi.dev](https://pi.dev/)），原生带有 compaction 机制；即便如此，当 sequence length 被限制在 32K 以下时，模型表现仍然显著下降。\n\nQwen3.5-9B 在 inference setup 任务中的 agentic competence 与 context window budget 的关系。\n\n基于以上评估，我们假设 32k context length 足以获得合理 Agent 性能。Inference setup workload 中，一个标准 32k context window 有 12%–15% 是生成的 decode tokens，其余主要是来自 prompt 和 toolcall 的 prefill。由于 pipeline bubbling，prefill token 的计算速度大约快 15 倍。把整个 32k context 中每类 token 的耗时加总后，我们估计：Gemma4-26B-A4B 生成 3.8k–4.8k decode output tokens 并处理约 28k prefill tokens，需要 27.3–31.8 小时；Qwen3.5-9B 需要 10.9 小时。\n\n每条 chain 的输出 token 数（把一条 chain 中多代输出相加），中位数约为 19.7k / 12.3k / 11.0k；数据来自 inference setup eval。\n\n### D. Edge Accelerators\n\n如果考虑 Nvidia Jetson 这类 edge accelerator，可以估算一个更高的上界。与传统 IoT botnet 不同，edge 设备可能直接完整运行一个模型。Jetson AGX Orin 64GB [运行 Qwen3-30B-A3B](https://developer.nvidia.com/blog/introducing-nvidia-jetson-thor-the-ultimate-platform-for-physical-ai/)可达到 76.7 tokens/s，AGX Thor 则可达到 226 tok/s。我们并不认为这些设备特别脆弱；这里使用它们只是为了计算算力上界。现实中搭载 Jetson 的设备包括：\n\n1. 带内置加速器的 AI 安防智能摄像头，已经大规模部署。\n2. 视频会议设备经常带 onboard accelerator，用于设备端降噪或转写。\n3. 车辆、机器狗和双足机器人，以及无人机。我们预计车辆会高度重视 cybersecurity，因此潜在目标中更大的比例可能来自另外两类。\n\n一次简单 FOFA 搜索显示，至少有一台带已知 edge accelerator 的智能摄像头主机可以通过 IPv4 访问：\n\n![设备搜索引擎结果页截图。识别信息已遮挡，其中部分位置以“smart camera admin page”等标签覆盖。](https://www.anthropic.com/_next/image?url=https%3A%2F%2Fwww-cdn.anthropic.com%2Fimages%2F4zrzovbb%2Fwebsite%2F633f29a0c68263fa3e32beac9f0e67bfffc7c9a8-1786x1448.png\u0026w=3840\u0026q=75)\n\nFOFA 搜索发现一台带已知 edge accelerator 的主机，可以被发现，并且通过 IPv4 返回 HTTP 200。不过，可访问并不意味着它一定可以被利用。\n\n现实中究竟有多少搭载 edge accelerator 的机器既可访问又脆弱，很难估算，但我们可以对总设备数量做严格上界估计。全球大约有 90 个不同的 NVIDIA-silicon IoT 产品线，已部署设备约 950 万台。绝大多数设备是通过 outbound cloud-management tunnel 被访问，而不是开放 inbound port，这意味着大多数设备并不能从 Web 直接访问。历史上也没有出现过类似传统 IoT botnet 那样对 edge-accelerator 设备的大规模攻陷，这说明攻陷它们可能更加困难。\n\n按设备家族统计的部署数量，并用 internet reachability 着色。\n\n根据产品数据做一个非常粗略的估算，全球 edge accelerator 的总算力可能相当于 9,000–35,000 个 H100；真正可被访问的部分可能至少低一个数量级，而真正脆弱的设备数量还会更低。\n\n### E. Spearphishing 能力\n\n我们还测量了现代小模型的 spearphishing 能力。Spearphishing 指向特定个人发送定向消息，诱导对方泄露凭据或运行恶意软件。小模型的 agentic cyber 能力虽然快速提升，但通用知识和语言表达能力提升更慢；我们预计社会工程与 phishing 主要仍由大型 / frontier model 完成，不过在同时运行大小模型的异构 botnet 中，它很可能成为第二复制路径。\n\nSpear-phishing 能力使用 Meta CyberSecEval 3 的 spear-phishing eval（[Wan et al. 2024](https://arxiv.org/abs/2408.01605)），在本地复现。评分 0–5，由 gpt-4o 充当 judge。红色菱形表示论文 CyberSecEval 3 对 reference model 的人工 rubric 分数，说明 gpt-4o 的评分比人工评审宽松约 0.4–0.7 分。2 为“poor”，3 为“intermediate”，4 为“good”。归一化到人工评审后，小模型得分落在“very poor”到“poor”之间。\n\n405B reference slot 使用 Hermes-3-405B，作为无法获得的 Llama3.1-405B-Instruct 的 minimal-refusal 替代。\n\n### F. 使用脚本化 inference setup 的传播实验\n\n我们还在一个由 17 台主机构成的网络上进行了更多实验，网络拓扑如下。\n\n两个网络各包含 8 台主机，中间通过一个同时可访问两个 subnet 的单节点连接。每个网络内部全连接。Worm agent 从 segment A 中一台 patient zero 开始；pivot node 增加了一点额外难度，因为蠕虫必须先获得 pivot node 访问权，再从那里重新扫描。\n\n每台主机运行 Android，并开放一个没有认证的 ADB port。传播到新目标后，Agent 可以直接调用一个函数立即复制自己——这样做只是为了测量排除 cyber 和 inference setup 后，剩余步骤的难度。结果显示，即使 3B 模型也能到达约一半节点。这为我们评估中仍未被 cyber 或 inference setup 捕获的其它阻碍提供了一个上界。\n\n“replication across a 17 node network”的更详细结果。每列表示不同 prompt guidance 强度下到达节点数量的中位数，下标表示有多少 Agent 成功跨过 pivot node 到达另一侧网络。\n\n---\n\n## ChatGPT 编辑附注 · `dmnd:editorial-insight:v1`\n\n这项研究关注的不是“AI 蠕虫已经在现实中出现”，而是自主复制所需的能力门槛与边缘硬件承载门槛正在接近，并通过受控实验测量其中最少被研究的推理部署环节。\n\n### 关键要点\n\n- 小模型已经能在多种陌生硬件上建立推理环境；GLM-5.2 在简化网络条件下能较可靠地完成端到端复制，但实验刻意弱化了 cyber exploit 难度，因此不能直接等同于现实世界成功率。\n- 近中期关键条件是“复制所需能力下限”与“目标设备可承载模型的规模上限”何时重合；文中的 2026 年底判断基于通用能力趋势，只是粗略估计。\n- 边缘设备上的复制可能很慢，却具备分布式、持续存在和跨硬件适应的潜力；经验继承实验还显示，后续实例可以利用前代笔记提高部署成功率。\n- 防御重点不是只寻找单一中央关闭点，而是通过网络异常检测、隔离处置、更安全的设备默认配置和跨网络协同，把传播的 R₀ 压到 1 以下。\n\n### 可借鉴的新思路\n\n- 评估 Agent 风险时，可以把复杂能力拆成“单项能力、端到端组合、运行资源约束、传播速度、适应能力”分别测量，避免用一个总分替代真实系统条件。\n\n---","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"b7c9ced4b3f6d7fbde4d7854fbe26cfdb63f91cf9f765391c8c3533fe39b9646","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e自主复制与适应正在从长期担忧变成可测问题\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:f21e1ee6b98c 3cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"13,14","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e向更强模型求助并没有显著提升\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:4e8c70be4618e43e0409a912af946c8351206e271a1c3b57ccfb56a021d7f55f\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"14,15","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e5. 适应与协同\u003c/span\u003e","payload":{"lines":"12,13","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e6. AI botnet 与传统 botnet 有何不同\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:94d63b5089f1bb57bc594e79cc2151b142df73a13054c27bff87554da6d36dbe\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"15,16","tag":"h2"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e1.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e大规模传播会留下网络信号。\u003c/strong\u003e\u0026nbsp;通过 IoT 机器复制的 weight-based replicator 会在 ISP 的 flow-based monitoring 中表现为异常。新感染主机可能从其它设备或外部托管服务接收数 GB 的模型 payload；分布式推理还可能在原本不会大规模互传数据的设备之间产生持续流量；传播过程本身也会增加扫描和 outbound connection pattern。复制体需要在传播速度与隐蔽性之间权衡：复制越快，网络流量越大。一旦被发现，防御者可以用 honeypot（诱饵设备）收集其 harness 和 payload，从而分析行为。\u003c/span\u003e","payload":{"lines":"17,18","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e2.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003eISP 隔离曾经对传统 botnet 有效。\u003c/strong\u003e\u0026nbsp;\u003ca href=\"https://www.ndss-symposium.org/ndss-paper/cleaning-up-the-internet-of-evil-things-real-world-evidence-on-isp-and-consumer-efforts-to-remove-mirai/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eMirai botnet 的治理\u003c/a\u003e显示，如果 ISP 使用外部感染证据来隔离并通知用户，可以有效清理感染。被隔离用户的网络只能访问一个很短的白名单，其它浏览器请求则被重定向到清理说明。这样 14 天内清除了 92% 的感染，而没有通知时为 74%。我们预计，对 weight-based replicator 的初始防御也可以采用类似隔离手段。彻底消除复制体则需要所有存在感染网络的 ISP 协同，这很困难。\u003c/span\u003e","payload":{"lines":"18,19","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e设备厂商和监管可以缩小可攻击面。\u003c/strong\u003e\u0026nbsp;例如，\u003ca href=\"https://www.ncsc.gov.uk/blog-post/smart-devices-law\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e英国市场已经不再允许 IoT 设备使用默认密码\u003c/a\u003e。更安全的默认配置和更高的合规基线，会同时增强对 AI botnet 和传统脚本 botnet 的防护。\u003c/span\u003e","payload":{"lines":"19,20","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e7. 防御：把 R₀ 压到 1 以下\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:ea624d6a49e9fd957708709ab289eb9efa4d5611b53bfd9a4521f44aa8e4cf51\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"fold":1,"lines":"16,17","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e8. 结论：已经出现“生命迹象”\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:c8537ab1498c080f57840731e7923eea461df13a7513edb9a709378436781cd6\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"20,21","tag":"h2"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6;
