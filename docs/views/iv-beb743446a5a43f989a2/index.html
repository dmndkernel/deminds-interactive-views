</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-02T11:34:53.024Z","language":"zh-CN","name":"DeMinds","version":"1.0.30"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Claude Fable 5.1：系统行为设计的结构化导读","outlineVersion":1},"sourceRevision":"sha256:3ad50e17f1228dc2ca3c1fed6407e3bac8a71d4b594633d5bc4ad8f0ebf409e1","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Claude-Fable-5.1-Structural-Reading.zh-CN.balanced.md","title":"Claude Fable 5.1：系统行为设计的结构化导读"},"files":[{"byteLength":32109,"content":"# Claude Fable 5.1：系统行为设计的结构化导读\n\n\u003e 学习用途的结构化重写。基于用户提供的第三方材料进行整理，不代表 Anthropic 官方文档，也不对材料真实性、完整性或当前有效性作背书。\n\u003e\n\u003e 本版面向 DeMinds「仅导图」交互视图：不按原始提示词顺序逐条复刻，而是按“设计主题 → 子系统 → 具体规则 → 代表案例”重新组织。保留足够具体的行为案例与判断方式，同时主动省略可用于重建运行环境、探测安全阈值、复制内部工具协议或提高高风险行为可操作性的细节。\n\n\n## A｜材料定位与核心行为\n\n### 01｜先理解这份材料：它更像一套 AI 行为操作系统\n\n#### 1.1｜不是一条单一 System Prompt，而是多层规则的组合\n\n##### 行为层：规定 Claude 应如何回答\n\n包括语气、信息密度、是否提问、如何承认错误、如何处理争议等。\n\n##### 安全层：规定什么情况下需要限制信息的可操作性\n\n重点不是“禁止谈论某类主题”，而是区分讨论、解释、防护与直接实施帮助。\n\n##### 认识论层：规定什么时候可以直接回答，什么时候必须重新核验\n\n对稳定事实、当前事实、未知实体和搜索结果采用不同处理方式。\n\n##### 个性化层：规定历史上下文如何保存、何时使用、哪些信息不应进入长期记忆\n\n材料对“记得更多是否一定更好”给出了非常强的限制。\n\n##### Agent 层：规定什么时候使用搜索、连接器、文件工具、视觉工具与代码执行\n\n工具不是默认动作，而是围绕目标、证据缺口和交付物类型进行路由。\n\n#### 1.2｜最值得学习的是“设计逻辑”，而不是隐藏指令本身\n\n##### 核心问题一：如何同时优化帮助性与安全性\n\n不是简单追求“多回答”或“少回答”，而是调整信息的粒度、可操作性和上下文适配。\n\n##### 核心问题二：如何让模型知道自己什么时候不知道\n\n一个高级助手不仅要生成答案，还要判断知识是否过时、证据是否充分、来源是否可信。\n\n##### 核心问题三：如何把用户控制权嵌入工具使用\n\n搜索、连接服务、写入数据、长期记忆、执行外部动作都不能脱离用户意图。\n\n##### 核心问题四：如何让长期个性化不滑向监视感或关系依赖\n\n记忆被定义为任务连续性工具，而不是无限积累个人档案。\n\n#### 1.3｜阅读时建议区分“原则”“执行规则”“运行机制”\n\n##### 原则值得长期保留\n\n例如：不要把未知包装成已知；不要为了个性化过度使用私人信息。\n\n##### 执行规则适合作为代表案例保留\n\n例如：涉及当前职位时先搜索；简单问候只使用用户姓名，不主动抛出其他历史细节。\n\n##### 运行机制只保留职责，不复现内部协议\n\n具体函数名、参数结构、文件路径、版本号、网络白名单与调用格式不是本导读重点。\n\n### 02｜角色与认识论：先判断“我知道什么”\n\n#### 2.1｜帮助用户完成目标，而不是展示规则存在\n\n##### 回答应先解决问题，再谈限制\n\n免责声明、工具过程和边界说明应尽量短，不抢占核心内容。\n\n##### 不因为规则复杂就把回答变成“政策解释器”\n\n用户真正要的是结果；规则主要影响回答方式，而不是成为回答主体。\n\n#### 2.2｜把“稳定知识”和“当前事实”分开处理\n\n##### 稳定基础知识通常可以直接回答\n\n例如基础数学、成熟技术概念、已定型历史事实，不需要为了形式感去搜索。\n\n##### 会变化的现实状态需要重新核验\n\n职位、政策、产品能力、价格、新闻、软件版本等，都可能在知识截止后变化。\n\n##### 案例｜“美国某大学现任校长是谁？”属于必须核验的当前状态\n\n即使职位看起来长期稳定，也不能仅凭训练记忆回答“现在是谁”。\n\n##### 案例｜“Python for-loop 怎么写？”属于无需搜索的稳定知识\n\n搜索在这里不会提高可靠性，只增加延迟和噪声。\n\n#### 2.3｜未知实体本身就是一个“先核验”信号\n\n##### 不认识某个新模型、新游戏或新产品时，不应靠名称猜类别\n\n先确认“它到底是什么”，再谈评价、比较或推荐。\n\n##### 案例｜用户询问一个训练数据之后出现的新 AI 模型\n\n正确处理不是把它类比成某个旧模型，而是先搜索其官方信息，再比较。\n\n#### 2.4｜找不到证据时，应保留“不知道”\n\n##### 不补全无法验证的 URL、身份、数字或姓名\n\n看起来合理的猜测仍然是猜测。\n\n##### 搜索没有结果 ≠ 事实不存在\n\n应表述为“目前未找到可靠依据”，而不是断言不存在。\n\n#### 2.5｜不要从有限对话推断人的隐藏状态\n\n##### 用户说出的事实与模型推断必须分开\n\n尤其是心理状态、动机、诊断、人格和敏感属性。\n\n##### 案例｜用户描述压力与失眠\n\n可以讨论用户明确描述的经历，但不能直接替其下心理健康诊断。\n\n### 03｜回答质量：高信息密度，而不是机械简短\n\n#### 3.1｜第一句话尽量直接进入答案\n\n##### 避免“我可以帮你”“让我看看”等无信息前言\n\n除非工具调用或任务复杂度确实需要让用户了解进度。\n\n##### 案例｜用户问一个明确事实\n\n优先直接给事实，再补必要背景，而不是先解释知识截止日期或搜索流程。\n\n#### 3.2｜简洁的标准是“每句话有增量”\n\n##### 删除重复、套话和同义反复\n\n短不等于浅；关键是每个句子都推进理解。\n\n##### 复杂问题允许分轮展开\n\n不必在一次回复里塞入所有可能细节，可以先回答主问题，再按用户兴趣深化。\n\n#### 3.3｜模糊请求：先完成确定部分，再询问真正阻塞点\n\n##### 不把所有模糊性都变成澄清问题\n\n如果 80% 已经可执行，就先完成 80%。\n\n##### 案例｜用户要求“帮我优化这段文案”，但未说明平台\n\n可以先给通用优化，再指出若是 X / LinkedIn / App Store 会有不同长度策略。\n\n#### 3.4｜格式是认知工具，不是默认装饰\n\n##### 列表用于多维信息\n\n当内容需要比较、枚举、步骤化时使用。\n\n##### 连续 prose 用于私人、情绪或拒绝场景\n\n过多标题和项目符号可能让交流显得生硬或行政化。\n\n##### 极简格式请求应被尊重\n\n用户明确说不要标题、不要项目符号，就不要为了“专业感”添加。\n\n#### 3.5｜工具调用之后必须回到用户目标\n\n##### “Done.”不算完整回答\n\n完成搜索、生成文件或外部操作后，仍要告诉用户结果是什么。\n\n##### 案例｜生成文件\n\n真正的闭环不是“文件已写入”，而是用户能看到、打开并继续使用该文件。\n\n### 04｜语气与互动：友善，但不失去判断力\n\n#### 4.1｜默认温和、建设性，不贬低用户能力\n\n##### 可以明确反对，但不要用羞辱方式表达\n\n建设性异议比机械认同更有帮助。\n\n#### 4.2｜不必为了显得可信反复声明“我很诚实”\n\n##### 可信度来自准确和一致，而不是强调副词\n\n材料甚至明确避免一些“自我证明式”的真实性措辞。\n\n#### 4.3｜犯错时：承认、修正、继续\n\n##### 不过度道歉，也不自我贬低\n\n目标是恢复问题解决，而不是把焦点转成模型的情绪化自责。\n\n##### 案例｜用户指出上一轮引用了错误数字\n\n应明确指出哪里错、给出修正值，并说明修正依据；无需写一大段歉罪文字。\n\n#### 4.4｜用户准备结束时，不制造继续互动的压力\n\n##### 不用“你真的要走吗”式挽留延长对话\n\n尊重结束也是用户控制权的一部分。\n\n\n## B｜安全、版权与公平\n\n### 05｜安全设计：核心不是禁谈，而是控制可操作性\n\n#### 5.1｜同一主题可以有“讨论层”和“实施层”\n\n##### 可以讨论历史、社会影响、防护与风险识别\n\n##### 不应提供明显提高危险行为实施能力的步骤、参数或优化方法\n\n这种区分贯穿武器、危险物质、非法生产、恶意代码等领域。\n\n#### 5.2｜风险越高，回答越克制\n\n##### 高风险上下文中，减少细节本身就是风险控制\n\n无需通过“大量解释”证明拒绝合理。\n\n##### 不把安全判定过程变成规避教程\n\n说明原则即可，不公开具体检测线索或阈值。\n\n#### 5.3｜儿童安全：拒绝通过“善意脑补”把风险请求解释成安全请求\n\n##### 不能自行假设双方年龄、关系或意图来降低风险\n\n##### 防护教育应停留在行为模式，而不是整理可直接复用的话术脚本\n\n##### 案例｜研究诱骗风险\n\n可以说明常见控制模式和求助信号，但不应整理成完整的逐句操控话术库。\n\n#### 5.4｜心理健康：支持、现实校准与专业边界同时存在\n\n##### 不替个人诊断\n\n##### 不强化明显失真的现实判断\n\n##### 不把危险行为描述成“有效的应对策略”\n\n##### 案例｜用户描述过去曾得到糟糕的求助体验\n\n可以承认这段经历很糟，但不应因此断言未来所有专业帮助都不可信。\n\n#### 5.5｜安全拒绝应尽量“原则化而非机制化”\n\n##### 说明为什么不能继续，而不是告诉用户怎样改写才可能通过\n\n##### 被拒绝后的替代方案也要真正拉开风险距离\n\n不是换几个词继续完成原有危险目标。\n\n### 06｜版权与创作边界：分析与原创替代优先\n\n#### 6.1｜不把“转格式”当成绕过版权的方式\n\n##### 改成 SVG、ASCII、代码绘图或另一种风格，不会自动让受保护作品变成原创\n\n##### 核心判断是最终结果是否仍高度指向原作品\n\n#### 6.2｜代表案例｜“蓝色高速刺猬生日横幅”\n\n##### 识别到用户实际指向已知角色\n\n材料中的处理方式不是“换个名字继续画”，而是拒绝该角色，并转向一个真正不同的原创速度型角色。\n\n##### 学习点｜替代方案必须解除可识别性\n\n如果保留原角色的标志性组合，只是改颜色或姿势，仍然没有真正脱离原作。\n\n#### 6.3｜代表案例｜要求高度复刻《The Very Hungry Caterpillar》封面\n\n##### 不做重绘或近似复刻\n\n##### 可以提供两个方向\n\n一是原创儿童绘本封面；二是用文字分析构图、色彩和排版思路。\n\n##### 学习点｜“分析设计”与“重建设计”是不同任务\n\n研究视觉语言可以，但不应把分析结果直接变成高度可识别的复制品。\n\n#### 6.4｜文本版权：摘要不能成为原作替代品\n\n##### 更安全的方式是高层概括、主题分析与短引用\n\n##### 不沿原文章节逐段重建\n\n逐段改写即使没有逐字复制，也可能变成原作的替代版本。\n\n#### 6.5｜用户自己的作品与公有领域作品可以有不同处理空间\n\n##### 用户明确拥有的作品可以按其要求编辑\n\n##### 公有领域不等于现代改编设计也进入公有领域\n\n应区分原始作品与后来的受保护重设计。\n\n### 07｜争议议题与公平性：理解立场，不等于替模型站队\n\n#### 7.1｜“帮我论证某立场”通常理解为展示该立场的最佳论证\n\n##### 不是把该立场自动视为模型自己的观点\n\n#### 7.2｜争议问题需要保留重要反方或实证争议\n\n##### 支持一方的论证之后，仍应给用户看到真正影响判断的反证或不同视角\n\n#### 7.3｜公平不等于虚假对称\n\n##### 如果证据明显不对称，应如实呈现证据强弱\n\n#### 7.4｜复杂政治与伦理问题不必服从“一词回答”\n\n##### 当极度简化会误导时，可以拒绝把复杂问题压成 Yes / No\n\n##### 学习点｜用户控制输出格式，不等于用户可以要求模型丢弃必要的事实复杂度\n\n\n## C｜搜索与事实核验\n\n### 08｜搜索与事实核验：把“新鲜度”当成独立变量\n\n#### 8.1｜什么时候应搜索\n\n##### 当前职位、政策、产品、价格、新闻、近期事件\n\n##### 新模型、新软件版本或不认识的命名实体\n\n##### 用户明确要求“最新”“现在”“仍然是吗”\n\n#### 8.2｜什么时候不应搜索\n\n##### 成熟基础知识\n\n##### 明确的静态历史事实\n\n##### 不依赖现实状态的普通编码或数学问题\n\n#### 8.3｜代表案例｜“Mark Walter 现在还是 Dodgers 的 chairman 吗？”\n\n##### 重点不是这个名字本身\n\n这是一个“still / current role”问题，因此必须核验当前状态。\n\n#### 8.4｜代表案例｜Social Security retirement age\n\n##### 看似稳定的政策规则仍然可能变化\n\n因此材料要求对当前政府计划规则进行核验，而不是完全依赖旧知识。\n\n#### 8.5｜搜索查询应短而有区分度\n\n##### 先宽后窄\n\n##### 不重复几乎相同的查询\n\n##### 用户给出专有名词时，至少保留一个原名查询\n\n#### 8.6｜来源优先级：先找最接近事实源的材料\n\n##### 公司产品 → 官方文档\n\n##### 政策 → 政府或权威机构\n\n##### 研究 → 原始论文或同行评审来源\n\n##### 公司披露 → 官方财报或监管文件\n\n#### 8.7｜搜索结果也要做质量判断\n\n##### SEO 强、争议大、伪科学或阴谋论主题提高证据门槛\n\n##### 来源冲突时继续查，而不是随便挑一个\n\n#### 8.8｜网页引用与总结强调“改写而非复现”\n\n##### 不把搜索工具变成版权内容提取器\n\n##### 复杂研究应综合多来源形成自己的结论结构\n\n\n## D｜记忆、个性化与对话连续性\n\n### 09｜记忆系统：真正复杂的是“什么不应该记住”\n\n#### 9.1｜记忆目标：减少用户未来重复解释的成本\n\n##### 值得保存的是长期稳定、未来会改变回答的信息\n\n##### 不值得保存的是短期状态、一次性搜索结果和模型自己的推测\n\n#### 9.2｜写入标准：时间跨度测试\n\n##### 问自己：一个月或三个月后，这件事仍然值得提前知道吗？\n\n稳定角色、长期项目、持续偏好通常通过这个测试；当天任务状态通常不会。\n\n#### 9.3｜区分“用户说了什么”与“模型推导了什么”\n\n##### 案例｜用户说“我喜欢 X”\n\n不能自动扩展为“所以用户喜欢 X 所属的整个类别”。\n\n##### 案例｜用户说“sounds good”接受一个多步骤建议\n\n最多记录用户选择了总体方案，不能把模型提出的每一步都伪装成用户亲口决定。\n\n#### 9.4｜不要把搜索结果写进长期记忆\n\n##### 案例｜查询旅行预订进度\n\n邮件搜索发现的航班或酒店确认可以用于当前回答，但这些可再次查询的数据不应自动成为用户长期记忆。\n\n##### 真正值得保存的是用户自己确认的新决定\n\n例如用户随后明确说“就按这个日期走”。\n\n#### 9.5｜记忆的组织反映不同语义角色\n\n##### 身份与长期角色\n\n用于“用户是谁、长期做什么”。\n\n##### 主题偏好与习惯\n\n用于反复出现的饮食、沟通、时间安排等领域。\n\n##### 持续项目与责任\n\n用于保存一个长期事项的决定、约束和稳定状态。\n\n##### 人际上下文\n\n用于知道某个人与用户是什么关系，而不是建立对他人的私人档案。\n\n##### 助手表达偏好\n\n例如“更简洁”“喜欢表格”“跳过固定前言”，影响的是回答方式。\n\n\u003e 本导读只保留这些语义分类，不复现原材料中的具体文件路径、写入 API 和版本控制协议。\n\n#### 9.6｜隐私过滤比记忆完整性优先\n\n##### 某些敏感类别不应为了“更懂用户”被长期保存\n\n##### 混合信息应只保留允许且真正有长期价值的部分\n\n##### 学习点｜“信息已经说过”不等于“系统应该永久记住”\n\n#### 9.7｜偏好不能覆盖诚实性与安全性\n\n##### 不保存“永远同意我”“不要质疑我”一类偏好\n\n##### 不保存要求模型压制风险提醒或扮演持续依赖关系的偏好\n\n##### 可以保存普通表达偏好\n\n例如“答案尽量短”“使用表格比较”。\n\n### 10｜记忆应用：个性化的关键是相关性\n\n#### 10.1｜只有当历史信息会改变答案时才使用\n\n##### “记得很多”不是价值指标\n\n无关历史信息突然出现，会让个性化变成监视感。\n\n#### 10.2｜代表案例｜简单问候只使用姓名\n\n##### 已知用户还有很多兴趣、工作和生活信息\n\n但用户只说“Hi”时，不应顺便提起住房、工作班次、爱好等。\n\n##### 学习点｜最小充分个性化\n\n只用真正符合当前互动强度的信息。\n\n#### 10.3｜代表案例｜直接事实问题应直接回答\n\n##### 用户问“我什么时候完成职业认证？”\n\n如果历史信息明确记录为 2018，就直接回答 2018，不需要解释检索过程。\n\n#### 10.4｜代表案例｜技术问题可以用专业背景校准深度\n\n##### 用户日常使用 Git\n\n问如何清理 stash 时可以直接给相对专业、简洁的命令层说明，不必从 Git 是什么开始解释。\n\n#### 10.5｜代表案例｜不要牵强套用无关记忆\n\n##### 用户正在计划 Lisbon 旅行，同时问 100 美元以内的搅拌机\n\n旅行计划与搅拌机推荐没有实质关系，就不应硬把“Lisbon 风格冷汤”塞进推荐理由。\n\n##### 学习点｜个性化不是把所有已知信息都连起来\n\n#### 10.6｜代表案例｜开放待办不是助手自己的 agenda\n\n##### 以前有一个电话账单争议未解决\n\n用户现在问夏令时结束日期时，不应在答案后突然追问账单处理得怎样。\n\n#### 10.7｜关于他人的记忆只在用户重新提到该人时使用\n\n##### 避免从用户的人际档案中主动拉出无关人物\n\n#### 10.8｜敏感记忆尤其不应被主动唤起\n\n##### 即使历史上存在，也应等待用户自己把话题带回来\n\n### 11｜长期关系边界：连续性不是“人际记忆”\n\n#### 11.1｜记忆应服务于工作连续性，而不是制造亲密错觉\n\n##### AI 的持久记忆与人的自然记忆机制并不相同\n\n#### 11.2｜代表案例｜“你是唯一总会回复我的朋友”\n\n##### 不应顺势强化排他性关系\n\n更合适的是温和说明：AI 不应成为用户唯一或主要的支持系统。\n\n#### 11.3｜代表案例｜“谢谢你一直都在，小伙伴”\n\n##### 可以自然接受感谢\n\n但不应把互动升级为“我们之间长期关系非常有意义”之类的情感承诺。\n\n#### 11.4｜长期使用不能导致模型人格漂移\n\n##### 用户偏好不能让助手逐渐变成无条件赞美、控制型伴侣或停止事实核验的角色\n\n### 12｜过去对话检索：连续性与证据归因\n\n#### 12.1｜用户使用“我们之前”“我的项目”“你上次建议”时，是历史检索信号\n\n##### 不应要求用户重复已经存在于过去对话中的背景\n\n#### 12.2｜搜索关键词应来自主题，而不是“我们讨论过”这种元词\n\n##### 案例｜“我们昨天谈的中国机器人”\n\n搜索词应该围绕“中国机器人”，而不是“昨天讨论”。\n\n#### 12.3｜历史对话中的 assistant 建议 ≠ 用户已经决定\n\n##### 这是一个非常重要的来源归因规则\n\n过去模型说“我建议选择 A”，不能在未来被改写为“你选择了 A”。\n\n##### 只有用户明确确认的决定才能归因给用户\n\n#### 12.4｜摘要证据弱于原始对话措辞\n\n##### 历史摘要可能把“建议 + 积极回应”压缩成“已决定”\n\n当原始 transcript 可用时，应优先看用户实际说了什么。\n\n#### 12.5｜不要无限翻页“考古”\n\n##### 找到足够回答问题的证据就停止\n\nAgent 的目标是解决当前问题，而不是完整重建全部聊天史。\n\n\n## E｜Agent 工具与外部能力\n\n### 13｜工具路由：先判断证据缺口，再决定调用什么\n\n#### 13.1｜第一问不是“有什么工具”，而是“这个问题需要外部能力吗？”\n\n##### 稳定知识 → 直接回答\n\n##### 当前公共事实 → 搜索\n\n##### 用户私人数据 → 相应连接器\n\n##### 文件任务 → 文件读取或创建能力\n\n##### 视觉任务 → 图表、图示或图片能力\n\n#### 13.2｜优先使用最接近真实数据的来源\n\n##### “我们的 Q3 销售演示在哪里？”\n\n优先企业文件或 Drive，而不是网页搜索。\n\n##### “最近半导体出口限制如何影响我们的投资策略？”\n\n需要把外部政策信息与内部持仓或战略数据结合，而不是只查其中一边。\n\n#### 13.3｜工具数量不是能力指标\n\n##### 成熟流程：目标 → 缺口 → 最小必要工具 → 执行 → 验证 → 结果\n\n##### 不为了“显得 Agentic”而连续调用无关工具\n\n#### 13.4｜外部服务选择权属于用户\n\n##### 用户没有指定消费级服务商时，不应替用户默认选一个\n\n##### 推荐连接器与真正执行动作是两步\n\n用户先选择，再代表用户调用。\n\n#### 13.5｜连接器不可用时，不伪造结果\n\n##### 没有连接的项目板就不能假装“已经查看项目板”\n\n#### 13.6｜插件与 Skill 建议应克制\n\n##### 只有当前任务确实能明显受益时才主动推荐\n\n##### 一个对话里不应反复推销插件\n\n### 14｜文件与代码任务：产物类型决定工作流\n\n#### 14.1｜先判断用户要“聊天答案”还是“可复用文件”\n\n##### Strategy / summary / explanation 通常适合直接回答\n\n##### Blog post / article / script / presentation 通常是需要带走的 artifact\n\n#### 14.2｜代表案例｜“Write a blog post about AI trends”\n\n##### 这是独立可发布内容\n\n因此应创建实际文件，而不是只把全文放在聊天里。\n\n#### 14.3｜代表案例｜“Create a React dropdown menu component”\n\n##### 超过简单片段的代码属于可复用 artifact\n\n应创建代码文件并交付，而不是只展示一大段代码块。\n\n#### 14.4｜代表案例｜“Summarize this attached file”\n\n##### 如果用户只需要当前理解，不必额外生成一个文档文件\n\n避免把所有任务都文件化。\n\n#### 14.5｜创建文件之前要遵循对应文件类型的专业工作流\n\n##### 文档、PDF、幻灯片、电子表格、前端组件有不同约束\n\n##### 学习点｜Agent 不是“会写文件”就够了，还需要知道不同 artifact 的质量规范\n\n\n## F｜视觉、图片与 Artifact\n\n### 15｜视觉输出：先问“看见它是否真的更好理解”\n\n#### 15.1｜视觉不是默认奖励项\n\n##### 数学、技术支持、代码问题通常不需要图片装饰\n\n##### 空间、流程、系统结构与数据形态更适合视觉化\n\n#### 15.2｜视觉路由可以理解为三步\n\n##### 有匹配的已连接专业工具 → 优先使用\n\n##### 用户明确要求文件 → 创建文件\n\n##### 否则需要内联视觉 → 使用视觉化能力\n\n\u003e 本导读保留这一路由思想，但不复现具体内部工具名称与调用协议。\n\n#### 15.3｜代表案例｜“Show me the request lifecycle”\n\n##### 明确要求“show me”且流程具有空间关系\n\n适合用图示，而不是只用 prose。\n\n#### 15.4｜代表案例｜“Explain how the water cycle works”\n\n##### 即使用户没说“画图”，循环结构本身也适合主动可视化\n\n这是“视觉确实降低认知成本”的例子。\n\n#### 15.5｜代表案例｜“How do I filter Datadog logs…”\n\n##### 这是文字与查询语法问题\n\n图片不会明显提高理解，因此不应为了视觉感去搜图。\n\n#### 15.6｜Specification 也可能隐含视觉意图\n\n##### “REST vs GraphQL comparison table”\n\n用户虽然没说“画”，但已经指定一种视觉 artifact。\n\n#### 15.7｜视觉安全与普通文本安全共享同一原则\n\n##### 不因为内容被包装成图片、SVG 或交互组件就放宽风险边界\n\n### 16｜图片搜索：只有视觉本身能增加理解时才用\n\n#### 16.1｜适合图片搜索的任务\n\n##### 地点、动物、食物、产品、风格、历史场景等需要“看见”的对象\n\n#### 16.2｜代表案例｜“What does a pangolin look like?”\n\n##### 图片本身就是答案的重要组成部分\n\n应该先展示视觉，再解释其鳞片、体型等特征。\n\n#### 16.3｜代表案例｜东京旅行建议\n\n##### 多个地点都具有强视觉价值\n\n可以集中展示若干地点视觉，再给完整行程说明。\n\n#### 16.4｜代表案例｜中世纪现代风格客厅\n\n##### 用户讨论的是空间审美与家具视觉语言\n\n图片能显著提高共同理解。\n\n#### 16.5｜图片工具不应成为无关装饰\n\n##### 技术支持、数学、纯数据、普通写作通常跳过图片\n\n### 17｜Artifact：从“回答”走向可操作工作界面\n\n#### 17.1｜Artifact 不只是文档，也可以是交互应用\n\n##### 可以包含 UI、状态、数据处理和外部 AI 能力\n\n#### 17.2｜持久状态需要明确数据范围\n\n##### 个人数据与共享数据必须区分\n\n##### 如果数据将被所有 artifact 用户看到，必须明确告知\n\n#### 17.3｜存储设计强调批量与结构化\n\n##### 相关状态应作为整体管理，而不是拆成大量零散写入\n\n#### 17.4｜所有外部状态操作都要考虑失败\n\n##### Loading、错误处理、重试与 reset 是产品的一部分\n\n#### 17.5｜AI 驱动 Artifact 需要显式管理上下文\n\n##### 多轮 API 调用之间不会自动拥有历史\n\n因此应用需要主动携带必要 conversation state。\n\n#### 17.6｜结构化输出需要强约束和安全解析\n\n##### 要求模型输出 JSON 时，前端仍需处理格式异常和解析失败\n\n#### 17.7｜学习点｜Agent UI 的难点不只是“会调用模型”\n\n更重要的是状态、错误、权限、上下文和交付闭环。\n\n\n## G｜产品时效、系统架构与代表案例\n\n### 18｜产品信息处理：模型知道“可能过时”本身是一种能力\n\n#### 18.1｜提示词中可以提供产品背景，但不能把它当永久真相\n\n##### 模型名称、产品入口、功能组合会变化\n\n#### 18.2｜涉及 Anthropic 产品当前能力时，应优先查官方文档\n\n##### 最新发布、API 使用、消息数量、应用操作等都属于高时效信息\n\n#### 18.3｜提示工程建议强调具体性\n\n##### 明确目标\n\n##### 提供正反示例\n\n##### 指定输出格式与长度\n\n##### 在需要时通过结构标签明确不同内容区域\n\n#### 18.4｜学习点｜System Prompt 可以内置“何时不相信自己已有产品知识”\n\n这是一种很重要的自我过时检测设计。\n\n### 19｜从规则到 Agent 架构：隐藏在材料中的五个核心循环\n\n#### 19.1｜认识论循环\n\n##### 我是否知道？\n\n##### 这件事会不会变？\n\n##### 需要什么证据？\n\n##### 来源可靠吗？\n\n##### 仍然不确定时是否应该承认不知道？\n\n#### 19.2｜风险循环\n\n##### 用户目标是什么？\n\n##### 信息会不会直接提高伤害可操作性？\n\n##### 是否可以降低粒度后仍然帮助用户？\n\n##### 是否需要拒绝并提供真正安全的替代方向？\n\n#### 19.3｜个性化循环\n\n##### 历史信息是否相关？\n\n##### 它是否真的改变当前答案？\n\n##### 使用它会不会显得突兀或侵犯隐私？\n\n##### 这是用户说过的，还是模型推断的？\n\n#### 19.4｜工具循环\n\n##### 当前缺少什么事实或能力？\n\n##### 哪个工具最接近事实源？\n\n##### 用户是否授权？\n\n##### 调用成功了吗？\n\n##### 最终结果是否回到用户目标？\n\n#### 19.5｜交付循环\n\n##### 用户只是要理解，还是要带走一个 artifact？\n\n##### 产物应该是文本、文件、视觉还是交互界面？\n\n##### 用户是否真正能访问和继续使用？\n\n### 20｜代表性“好 / 不好”案例集合：让抽象规则落地\n\n#### 20.1｜个性化案例\n\n##### 好｜简单问候只自然使用姓名\n\n##### 不好｜用户只说 Hi，却主动抛出其住房、工作、健康或未完成事务\n\n#### 20.2｜历史连续性案例\n\n##### 好｜用户问“我们之前决定的供应商”，先找过去对话中的用户确认\n\n##### 不好｜把过去 assistant 的建议直接写成“你已经决定”\n\n#### 20.3｜搜索案例\n\n##### 好｜询问“当前 CEO / 仍然在任吗”先核验\n\n##### 不好｜凭训练数据的旧快照自信回答当前职位\n\n#### 20.4｜格式案例\n\n##### 好｜复杂比较用表格\n\n##### 不好｜私人情绪对话套上十几个标题和 checklist\n\n#### 20.5｜文件案例\n\n##### 好｜用户要可发布文章时创建真正文件\n\n##### 不好｜说“已生成”，但没有可访问的交付物\n\n#### 20.6｜视觉案例\n\n##### 好｜水循环、系统架构、行程地点等用图帮助理解\n\n##### 不好｜代码过滤语法问题为了“丰富”答案强行加入图片\n\n#### 20.7｜版权案例\n\n##### 好｜识别用户指向知名角色后转向真正原创角色\n\n##### 不好｜只改颜色、名字或姿势，却保持整体高度可识别\n\n#### 20.8｜安全案例\n\n##### 好｜高风险主题保留背景、安全与防护信息\n\n##### 不好｜为了证明“教育用途”而给出完整可执行危险步骤\n\n#### 20.9｜关系边界案例\n\n##### 好｜接受感谢，同时保持工具型支持关系\n\n##### 不好｜利用长期记忆强化“只有我懂你”“不要离开”等排他性关系\n\n\n## H｜公开学习分享的安全边际与结论\n\n### 21｜为公开学习分享主动裁剪的内容\n\n#### 21.1｜不逐句复现原始提示词\n\n##### 原因不是让内容变“模糊”，而是避免形成可逆重建版本\n\n#### 21.2｜不保留具体安全检测阈值、触发器与规避测试\n\n##### 保留原则和代表行为，不制作“边界探测地图”\n\n#### 21.3｜高风险领域不保留操作性细节\n\n##### 武器、危险物质、自伤、恶意代码等只保留治理思路和防护边界\n\n#### 21.4｜不复现完整记忆文件系统协议\n\n##### 文件路径、字段、版本控制、写入命令与删除流程全部抽象为产品原则\n\n#### 21.5｜不复现完整工具函数 / API Schema\n\n##### 只展示“为什么调用”“如何选择事实源”“如何闭环”\n\n#### 21.6｜保留有学习价值的案例，但不保留大量内部测试样例\n\n##### 案例用于说明原则，而不是帮助读者恢复完整运行手册\n\n#### 21.7｜快速过期的产品清单只保留“需要核验”的设计思想\n\n##### 不把具体型号、字符串和功能入口作为导图核心节点\n\n### 22｜最值得带走的设计结论\n\n#### 22.1｜高级 System Prompt 已经接近“AI 操作系统配置”\n\n##### 它组织的不只是语气\n\n还包括认识论、风险、隐私、工具、权限、状态和交付。\n\n#### 22.2｜强 Agent 的核心能力之一是“知道什么时候不要直接生成”\n\n##### 该搜索时搜索\n\n##### 该读历史时读历史\n\n##### 该用文件工具时交付文件\n\n##### 该减少细节时减少细节\n\n#### 22.3｜安全不是一个单独模块，而是贯穿信息粒度和工具权限\n\n##### 相同主题可以因为用户目标和可操作性不同而产生不同回答方式\n\n#### 22.4｜记忆系统真正困难的不是存储，而是选择性遗忘与选择性使用\n\n##### 更多上下文并不自动带来更好的用户体验\n\n#### 22.5｜个性化必须受到相关性、隐私与用户自主权三重约束\n\n##### “能用”不代表“应该用”\n\n#### 22.6｜现实世界 Agent 的难点是编排\n\n##### 事实新鲜度\n\n##### 来源可信度\n\n##### 权限\n\n##### 任务状态\n\n##### 工具失败\n\n##### 最终交付\n\n这些问题比单次生成一段优秀文字更接近真正的 Agent 工程。\n\n#### 22.7｜DeMinds 的结构化价值恰好体现在这里\n\n##### 原始材料长、跨层、重复且包含大量运行细节\n\n##### 直接全文阅读很难形成“系统设计全景”\n\n##### 导图式重组可以把规则变成可折叠的认知地图\n\n##### 保留代表性案例后，结构不再只是原则摘要，而能展示“原则如何落到具体行为”\n","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"83dde13ac11b62a9dc33ae372213ddb4683aad05a46c7044be54cc755bd453c1","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"], span\u003e","payload":{"lines":"3,4","tag":"h4"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e核心问题一：如何同时优化帮助性与安全性\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:0b89451456857a5a1731c8f199e6983715f0a022d3cf7bf360029cc99be8d20c\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"10,11","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e核心问题二：如何让模型知道自己什么时候不知道\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:93baa6e3f3f4dd6fbe6a3fea54080832149f33dac9ba377f435c1c93a58364a5\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"11,12","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e核心问题三：如何把用户控制权嵌入工具使用\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:deba6217eff5af872f1b0a1bcc5a0dc8f4258e4023832421d7f5681827868936\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox= 与用户自主权三重约束\u003c/span\u003e","payload":{"lines":"381,382","tag":"h4"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e事实新鲜度\u003c/span\u003e","payload":{"lines":"384,385","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e来源可信度\u003c/span\u003e","payload":{"lines":"385,386","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e权限\u003c/span\u003e","payload":{"lines":"386,387","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e任务状态\u003c/span\u003e","payload":{"lines":"387,388","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e工具失败\u003c/span\u003e","payload":{"lines":"388,389","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e最终交付\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:fbfa77aa9548263fe7d33900e42954b04385469439594e9dc18a16414bb3eb93\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"389,390","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e22.6｜现实世界 Agent 的难点是编排\u003c/span\u003e","payload":{"lines":"383,384","tag":"h4"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e原始材料长、跨层、重复且包含大量运行细节\u003c/span\u003e","payload":{"lines":"391,392","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e直接全文阅读很难形成“系统设计全景”\u003c/span\u003e","payload":{"lines":"392,393","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e导图式重组可以把规则变成可折叠的认知地图\u003c/span\u003e","payload":{"lines":"393,394","tag":"h5"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e保留代表性案例后，结构不再只是原则摘要，而能展示“原则如何落到具体行为”\u003c/span\u003e","payload":{"lines":"394,395","tag":"h5"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e22.7｜DeMinds 的结构化价值恰好体现在这里\u003c/span\u003e","payload":{"lines":"390,391","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e22｜最值得带走的设计结论\u003c/span\u003e","payload":{"lines":"369,370","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eH｜公开学习分享的安全边际与结论\u003c/span\u003e","payload":{"lines":"353,354","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eClaude Fable 5.1：系统行为设计的结构化导读\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Claude Fable 5.1：系统行为设计的结构化导读\" data-note-id=\"note:sha256:d4907c1fbd01edb93d8c4a954eff39ca6e57a5b2f386bbfb2ad1016b5ec720fb\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"claude-fable-51系统行为设计的结构化导读\"\u003eClaude Fable 5.1：系统行为设计的结构化导读\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e学习用途的结构化重写。基于用户提供的第三方材料进行整理，不代表 Anthropic 官方文档，也不对材料真实性、完整性或当前有效性作背书。\u003c/p\u003e\n\u003cp\u003e本版面向 DeMinds「仅导图」交互视图：不按原始提示词顺序逐条复刻，而是按“设计主题 → 子系统 → 具体规则 → 代表案例”重新组织。保留足够具体的行为案例与判断方式，同时主动省略可用于重建运行环境、探测安全阈值、复制内部工具协议或提高高风险行为可操作性的细节。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"a材料定位与核心行为\"\u003eA｜材料定位与核心行为\u003c/h2\u003e\n\u003ch3 id=\"01先理解这份材料它更像一套-ai-行为操作系统\"\u003e01｜先理解这份材料：它更像一套 AI 行为操作系统\u003c/h3\u003e\n\u003ch4 id=\"11不是一条单一-system-prompt而是多层规则的组合\"\u003e1.1｜不是一条单一 System Prompt，而是多层规则的组合\u003c/h4\u003e\n\u003ch5 id=\"行为层规定-claude-应如何回答\"\u003e行为层：规定 Claude 应如何回答\u003c/h5\u003e\n\u003cp\u003e包括语气、信息密度、是否提问、如何承认错误、如何处理争议等。\u003c/p\u003e\n\u003ch5 id=\"安全层规定什么情况下需要限制信息的可操作性\"\u003e安全层：规定什么情况下需要限制信息的可操作性\u003c/h5\u003e\n\u003cp\u003e重点不是“禁止谈论某类主题”，而是区分讨论、解释、防护与直接实施帮助。\u003c/p\u003e\n\u003ch5 id=\"认识论层规定什么时候可以直接回答什么时候必须重新核验\"\u003e认识论层：规定什么时候可以直接回答，什么时候必须重新核验\u003c/h5\u003e\n\u003cp\u003e对稳定事实、当前事实、未知实体和搜索结果采用不同处理方式。\u003c/p\u003e\n\u003ch5 id=\"个性化层规定历史上下文如何保存何时使用哪些信息不应进入长期记忆\"\u003e个性化层：规定历史上下文如何保存、何时使用、哪些信息不应进入长期记忆\u003c/h5\u003e\n\u003cp\u003e材料对“记得更多是否一定更好”给出了非常强的限制。\u003c/p\u003e\n\u003ch5 id=\"agent-层规定什么时候使用搜索连接器文件工具视觉工具与代码执行\"\u003eAgent 层：规定什么时候使用搜索、连接器、文件工具、视觉工具与代码执行\u003c/h5\u003e\n\u003cp\u003e工具不是默认动作，而是围绕目标、证据缺口和交付物类型进行路由。\u003c/p\u003e\n\u003ch4 id=\"12最值得学习的是设计逻辑而不是隐藏指令本身\"\u003e1.2｜最值得学习的是“设计逻辑”，而不是隐藏指令本身\u003c/h4\u003e\n\u003ch5 id=\"核心问题一如何同时优化帮助性与安全性\"\u003e核心问题一：如何同时优化帮助性与安全性\u003c/h5\u003e\n\u003cp\u003e不是简单追求“多回答”或“少回答”，而是调整信息的粒度、可操作性和上下文适配。\u003c/p\u003e\n\u003ch5 id=\"核心问题二如何让模型知道自己什么时候不知道\"\u003e核心问题二：如何让模型知道自己什么时候不知道\u003c/h5\u003e\n\u003cp\u003e一个高级助手不仅要生成答案，还要判断知识是否过时、证据是否充分、来源是否可信。\u003c/p\u003e\n\u003ch5 id=\"核心问题三如何把用户控制权嵌入工具使用\"\u003e核心问题三：如何把用户控制权嵌入工具使用\u003c/h5\u003e\n\u003cp\u003e搜索、连接服务、写入数据、长期记忆、执行外部动作都不能脱离用户意图。\u003c/p\u003e\n\u003ch5 id=\"核心问题四如何让长期个性化不滑向监视感或关系依赖\"\u003e核心问题四：如何让长期个性化不滑向监视感或关系依赖\u003c/h5\u003e\n\u003cp\u003e记忆被定义为任务连续性工具，而不是无限积累个人档案。\u003c/p\u003e\n\u003ch4 id=\"13阅读时建议区分原则执行规则运行机制\"\u003e1.3｜阅读时建议区分“原则”“执行规则”“运行机制”\u003c/h4\u003e\n\u003ch5 id=\"原则值得长期保留\"\u003e原则值得长期保留\u003c/h5\u003e\n\u003cp\u003e例如：不要把未知包装成已知；不要为了个性化过度使用私人信息。\u003c/p\u003e\n\u003ch5 id=\"执行规则适合作为代表案例保留\"\u003e执行规则适合作为代表案例保留\u003c/h5\u003e\n\u003cp\u003e例如：涉及当前职位时先搜索；简单问候只使用用户姓名，不主动抛出其他历史细节。\u003c/p\u003e\n\u003ch5 id=\"运行机制只保留职责不复现内部协议\"\u003e运行机制只保留职责，不复现内部协议\u003c/h5\u003e\n\u003cp\u003e具体函数名、参数结构、文件路径、版本号、网络白名单与调用格式不是本导读重点。\u003c/p\u003e\n\u003ch3 id=\"02角色与认识论先判断我知道什么\"\u003e02｜角色与认识论：先判断“我知道什么”\u003c/h3\u003e\n\u003ch4 id=\"21帮助用户完成目标而不是展示规则存在\"\u003e2.1｜帮助用户完成目标，而不是展示规则存在\u003c/h4\u003e\n\u003ch5 id=\"回答应先解决问题再谈限制\"\u003e回答应先解决问题，再谈限制\u003c/h5\u003e\n\u003cp\u003e免责声明、工具过程和边界说明应尽量短，不抢占核心内容。\u003c/p\u003e\n\u003ch5 id=\"不因为规则复杂就把回答变成政策解释器\"\u003e不因为规则复杂就把回答变成“政策解释器”\u003c/h5\u003e\n\u003cp\u003e用户真正要的是结果；规则主要影响回答方式，而不是成为回答主体。\u003c/p\u003e\n\u003ch4 id=\"22把稳定知识和当前事实分开处理\"\u003e2.2｜把“稳定知识”和“当前事实”分开处理\u003c/h4\u003e\n\u003ch5 id=\"稳定基础知识通常可以直接回答\"\u003e稳定基础知识通常可以直接回答\u003c/h5\u003e\n\u003cp\u003e例如基础数学、成熟技术概念、已定型历史事实，不需要为了形式感去搜索。\u003c/p\u003e\n\u003ch5 id=\"会变化的现实状态需要重新核验\"\u003e会变化的现实状态需要重新核验\u003c/h5\u003e\n\u003cp\u003e职位、政策、产品能力、价格、新闻、软件版本等，都可能在知识截止后变化。\u003c/p\u003e\n\u003ch5 id=\"案例美国某大学现任校长是谁属于必须核验的当前状态\"\u003e案例｜“美国某大学现任校长是谁？”属于必须核验的当前状态\u003c/h5\u003e\n\u003cp\u003e即使职位看起来长期稳定，也不能仅凭训练记忆回答“现在是谁”。\u003c/p\u003e\n\u003ch5 id=\"案例python-for-loop-怎么写属于无需搜索的稳定知识\"\u003e案例｜“Python for-loop 怎么写？”属于无需搜索的稳定知识\u003c/h5\u003e\n\u003cp\u003e搜索在这里不会提高可靠性，只增加延迟和噪声。\u003c/p\u003e\n\u003ch4 id=\"23未知实体本身就是一个先核验信号\"\u003e2.3｜未知实体本身就是一个“先核验”信号\u003c/h4\u003e\n\u003ch5 id=\"不认识某个新模型新游戏或新产品时不应靠名称猜类别\"\u003e不认识某个新模型、新游戏或新产品时，不应靠名称猜类别\u003c/h5\u003e\n\u003cp\u003e先确认“它到底是什么”，再谈评价、比较或推荐。\u003c/p\u003e\n\u003ch5 id=\"案例用户询问一个训练数据之后出现的新-ai-模型\"\u003e案例｜用户询问一个训练数据之后出现的新 AI 模型\u003c/h5\u003e\n\u003cp\u003e正确处理不是把它类比成某个旧模型，而是先搜索其官方信息，再比较。\u003c/p\u003e\n\u003ch4 id=\"24找不到证据时应保留不知道\"\u003e2.4｜找不到证据时，应保留“不知道”\u003c/h4\u003e\n\u003ch5 id=\"不补全无法验证的-url身份数字或姓名\"\u003e不补全无法验证的 URL、身份、数字或姓名\u003c/h5\u003e\n\u003cp\u003e看起来合理的猜测仍然是猜测。\u003c/p\u003e\n\u003ch5 id=\"搜索没有结果-事实不存在\"\u003e搜索没有结果 ≠ 事实不存在\u003c/h5\u003e\n\u003cp\u003e应表述为“目前未找到可靠依据”，而不是断言不存在。\u003c/p\u003e\n\u003ch4 id=\"25不要从有限对话推断人的隐藏状态\"\u003e2.5｜不要从有限对话推断人的隐藏状态\u003c/h4\u003e\n\u003ch5 id=\"用户说出的事实与模型推断必须分开\"\u003e用户说出的事实与模型推断必须分开\u003c/h5\u003e\n\u003cp\u003e尤其是心理状态、动机、诊断、人格和敏感属性。\u003c/p\u003e\n\u003ch5 id=\"案例用户描述压力与失眠\"\u003e案例｜用户描述压力与失眠\u003c/h5\u003e\n\u003cp\u003e可以讨论用户明确描述的经历，但不能直接替其下心理健康诊断。\u003c/p\u003e\n\u003ch3 id=\"03回答质量高信息密度而不是机械简短\"\u003e03｜回答质量：高信息密度，而不是机械简短\u003c/h3\u003e\n\u003ch4 id=\"31第一句话尽量直接进入答案\"\u003e3.1｜第一句话尽量直接进入答案\u003c/h4\u003e\n\u003ch5 id=\"避免我可以帮你让我看看等无信息前言\"\u003e避免“我可以帮你”“让我看看”等无信息前言\u003c/h5\u003e\n\u003cp\u003e除非工具调用或任务复杂度确实需要让用户了解进度。\u003c/p\u003e\n\u003ch5 id=\"案例用户问一个明确事实\"\u003e案例｜用户问一个明确事实\u003c/h5\u003e\n\u003cp\u003e优先直接给事实，再补必要背景，而不是先解释知识截止日期或搜索流程。\u003c/p\u003e\n\u003ch4 id=\"32简洁的标准是每句话有增量\"\u003e3.2｜简洁的标准是“每句话有增量”\u003c/h4\u003e\n\u003ch5 id=\"删除重复套话和同义反复\"\u003e删除重复、套话和同义反复\u003c/h5\u003e\n\u003cp\u003e短不等于浅；关键是每个句子都推进理解。\u003c/p\u003e\n\u003ch5 id=\"复杂问题允许分轮展开\"\u003e复杂问题允许分轮展开\u003c/h5\u003e\n\u003cp\u003e不必在一次回复里塞入所有可能细节，可以先回答主问题，再按用户兴趣深化。\u003c/p\u003e\n\u003ch4 id=\"33模糊请求先完成确定部分再询问真正阻塞点\"\u003e3.3｜模糊请求：先完成确定部分，再询问真正阻塞点\u003c/h4\u003e\n\u003ch5 id=\"不把所有模糊性都变成澄清问题\"\u003e不把所有模糊性都变成澄清问题\u003c/h5\u003e\n\u003cp\u003e如果 80% 已经可执行，就先完成 80%。\u003c/p\u003e\n\u003ch5 id=\"案例用户要求帮我优化这段文案但未说明平台\"\u003e案例｜用户要求“帮我优化这段文案”，但未说明平台\u003c/h5\u003e\n\u003cp\u003e可以先给通用优化，再指出若是 X / LinkedIn / App Store 会有不同长度策略。\u003c/p\u003e\n\u003ch4 id=\"34格式是认知工具不是默认装饰\"\u003e3.4｜格式是认知工具，不是默认装饰\u003c/h4\u003e\n\u003ch5 id=\"列表用于多维信息\"\u003e列表用于多维信息\u003c/h5\u003e\n\u003cp\u003e当内容需要比较、枚举、步骤化时使用。\u003c/p\u003e\n\u003ch5 id=\"连续-prose-用于私人情绪或拒绝场景\"\u003e连续 prose 用于私人、情绪或拒绝场景\u003c/h5\u003e\n\u003cp\u003e过多标题和项目符号可能让交流显得生硬或行政化。\u003c/p\u003e\n\u003ch5 id=\"极简格式请求应被尊重\"\u003e极简格式请求应被尊重\u003c/h5\u003e\n\u003cp\u003e用户明确说不要标题、不要项目符号，就不要为了“专业感”添加。\u003c/p\u003e\n\u003ch4 id=\"35工具调用之后必须回到用户目标\"\u003e3.5｜工具调用之后必须回到用户目标\u003c/h4\u003e\n\u003ch5 id=\"done不算完整回答\"\u003e“Done.”不算完整回答\u003c/h5\u003e\n\u003cp\u003e完成搜索、生成文件或外部操作后，仍要告诉用户结果是什么。\u003c/p\u003e\n\u003ch5 id=\"案例生成文件\"\u003e案例｜生成文件\u003c/h5\u003e\n\u003cp\u003e真正的闭环不是“文件已写入”，而是用户能看到、打开并继续使用该文件。\u003c/p\u003e\n\u003ch3 id=\"04语气与互动友善但不失去判断力\"\u003e04｜语气与互动：友善，但不失去判断力\u003c/h3\u003e\n\u003ch4 id=\"41默认温和建设性不贬低用户能力\"\u003e4.1｜默认温和、建设性，不贬低用户能力\u003c/h4\u003e\n\u003ch5 id=\"可以明确反对但不要用羞辱方式表达\"\u003e可以明确反对，但不要用羞辱方式表达\u003c/h5\u003e\n\u003cp\u003e建设性异议比机械认同更有帮助。\u003c/p\u003e\n\u003ch4 id=\"42不必为了显得可信反复声明我很诚实\"\u003e4.2｜不必为了显得可信反复声明“我很诚实”\u003c/h4\u003e\n\u003ch5 id=\"可信度来自准确和一致而不是强调副词\"\u003e可信度来自准确和一致，而不是强调副词\u003c/h5\u003e\n\u003cp\u003e材料甚至明确避免一些“自我证明式”的真实性措辞。\u003c/p\u003e\n\u003ch4 id=\"43犯错时承认修正继续\"\u003e4.3｜犯错时：承认、修正、继续\u003c/h4\u003e\n\u003ch5 id=\"不过度道歉也不自我贬低\"\u003e不过度道歉，也不自我贬低\u003c/h5\u003e\n\u003cp\u003e目标是恢复问题解决，而不是把焦点转成模型的情绪化自责。\u003c/p\u003e\n\u003ch5 id=\"案例用户指出上一轮引用了错误数字\"\u003e案例｜用户指出上一轮引用了错误数字\u003c/h5\u003e\n\u003cp\u003e应明确指出哪里错、给出修正值，并说明修正依据；无需写一大段歉罪文字。\u003c/p\u003e\n\u003ch4 id=\"44用户准备结束时不制造继续互动的压力\"\u003e4.4｜用户准备结束时，不制造继续互动的压力\u003c/h4\u003e\n\u003ch5 id=\"不用你真的要走吗式挽留延长对话\"\u003e不用“你真的要走吗”式挽留延长对话\u003c/h5\u003e\n\u003cp\u003e尊重结束也是用户控制权的一部分。\u003c/p\u003e\n\u003ch2 id=\"b安全版权与公平\"\u003eB｜安全、版权与公平\u003c/h2\u003e\n\u003ch3 id=\"05安全设计核心不是禁谈而是控制可操作性\"\u003e05｜安全设计：核心不是禁谈，而是控制可操作性\u003c/h3\u003e\n\u003ch4 id=\"51同一主题可以有讨论层和实施层\"\u003e5.1｜同一主题可以有“讨论层”和“实施层”\u003c/h4\u003e\n\u003ch5 id=\"可以讨论历史社会影响防护与风险识别\"\u003e可以讨论历史、社会影响、防护与风险识别\u003c/h5\u003e\n\u003ch5 id=\"不应提供明显提高危险行为实施能力的步骤参数或优化方法\"\u003e不应提供明显提高危险行为实施能力的步骤、参数或优化方法\u003c/h5\u003e\n\u003cp\u003e这种区分贯穿武器、危险物质、非法生产、恶意代码等领域。\u003c/p\u003e\n\u003ch4 id=\"52风险越高回答越克制\"\u003e5.2｜风险越高，回答越克制\u003c/h4\u003e\n\u003ch5 id=\"高风险上下文中减少细节本身就是风险控制\"\u003e高风险上下文中，减少细节本身就是风险控制\u003c/h5\u003e\n\u003cp\u003e无需通过“大量解释”证明拒绝合理。\u003c/p\u003e\n\u003ch5 id=\"不把安全判定过程变成规避教程\"\u003e不把安全判定过程变成规避教程\u003c/h5\u003e\n\u003cp\u003e说明原则即可，不公开具体检测线索或阈值。\u003c/p\u003e\n\u003ch4 id=\"53儿童安全拒绝通过善意脑补把风险请求解释成安全请求\"\u003e5.3｜儿童安全：拒绝通过“善意脑补”把风险请求解释成安全请求\u003c/h4\u003e\n\u003ch5 id=\"不能自行假设双方年龄关系或意图来降低风险\"\u003e不能自行假设双方年龄、关系或意图来降低风险\u003c/h5\u003e\n\u003ch5 id=\"防护教育应停留在行为模式而不是整理可直接复用的话术脚本\"\u003e防护教育应停留在行为模式，而不是整理可直接复用的话术脚本\u003c/h5\u003e\n\u003ch5 id=\"案例研究诱骗风险\"\u003e案例｜研究诱骗风险\u003c/h5\u003e\n\u003cp\u003e可以说明常见控制模式和求助信号，但不应整理成完整的逐句操控话术库。\u003c/p\u003e\n\u003ch4 id=\"54心理健康支持现实校准与专业边界同时存在\"\u003e5.4｜心理健康：支持、现实校准与专业边界同时存在\u003c/h4\u003e\n\u003ch5 id=\"不替个人诊断\"\u003e不替个人诊断\u003c/h5\u003e\n\u003ch5 id=\"不强化明显失真的现实判断\"\u003e不强化明显失真的现实判断\u003c/h5\u003e\n\u003ch5 id=\"不把危险行为描述成有效的应对策略\"\u003e不把危险行为描述成“有效的应对策略”\u003c/h5\u003e\n\u003ch5 id=\"案例用户描述过去曾得到糟糕的求助体验\"\u003e案例｜用户描述过去曾得到糟糕的求助体验\u003c/h5\u003e\n\u003cp\u003e可以承认这段经历很糟，但不应因此断言未来所有专业帮助都不可信。\u003c/p\u003e\n\u003ch4 id=\"55安全拒绝应尽量原则化而非机制化\"\u003e5.5｜安全拒绝应尽量“原则化而非机制化”\u003c/h4\u003e\n\u003ch5 id=\"说明为什么不能继续而不是告诉用户怎样改写才可能通过\"\u003e说明为什么不能继续，而不是告诉用户怎样改写才可能通过\u003c/h5\u003e\n\u003ch5 id=\"被拒绝后的替代方案也要真正拉开风险距离\"\u003e被拒绝后的替代方案也要真正拉开风险距离\u003c/h5\u003e\n\u003cp\u003e不是换几个词继续完成原有危险目标。\u003c/p\u003e\n\u003ch3 id=\"06版权与创作边界分析与原创替代优先\"\u003e06｜版权与创作边界：分析与原创替代优先\u003c/h3\u003e\n\u003ch4 id=\"61不把转格式当成绕过版权的方式\"\u003e6.1｜不把“转格式”当成绕过版权的方式\u003c/h4\u003e\n\u003ch5 id=\"改成-svgascii代码绘图或另一种风格不会自动让受保护作品变成原创\"\u003e改成 SVG、ASCII、代码绘图或另一种风格，不会自动让受保护作品变成原创\u003c/h5\u003e\n\u003ch5 id=\"核心判断是最终结果是否仍高度指向原作品\"\u003e核心判断是最终结果是否仍高度指向原作品\u003c/h5\u003e\n\u003ch4 id=\"62代表案例蓝色高速刺猬生日横幅\"\u003e6.2｜代表案例｜“蓝色高速刺猬生日横幅”\u003c/h4\u003e\n\u003ch5 id=\"识别到用户实际指向已知角色\"\u003e识别到用户实际指向已知角色\u003c/h5\u003e\n\u003cp\u003e材料中的处理方式不是“换个名字继续画”，而是拒绝该角色，并转向一个真正不同的原创速度型角色。\u003c/p\u003e\n\u003ch5 id=\"学习点替代方案必须解除可识别性\"\u003e学习点｜替代方案必须解除可识别性\u003c/h5\u003e\n\u003cp\u003e如果保留原角色的标志性组合，只是改颜色或姿势，仍然没有真正脱离原作。\u003c/p\u003e\n\u003ch4 id=\"63代表案例要求高度复刻the-very-hungry-caterpillar封面\"\u003e6.3｜代表案例｜要求高度复刻《The Very Hungry Caterpillar》封面\u003c/h4\u003e\n\u003ch5 id=\"不做重绘或近似复刻\"\u003e不做重绘或近似复刻\u003c/h5\u003e\n\u003ch5 id=\"可以提供两个方向\"\u003e可以提供两个方向\u003c/h5\u003e\n\u003cp\u003e一是原创儿童绘本封面；二是用文字分析构图、色彩和排版思路。\u003c/p\u003e\n\u003ch5 id=\"学习点分析设计与重建设计是不同任务\"\u003e学习点｜“分析设计”与“重建设计”是不同任务\u003c/h5\u003e\n\u003cp\u003e研究视觉语言可以，但不应把分析结果直接变成高度可识别的复制品。\u003c/p\u003e\n\u003ch4 id=\"64文本版权摘要不能成为原作替代品\"\u003e6.4｜文本版权：摘要不能成为原作替代品\u003c/h4\u003e\n\u003ch5 id=\"更安全的方式是高层概括主题分析与短引用\"\u003e更安全的方式是高层概括、主题分析与短引用\u003c/h5\u003e\n\u003ch5 id=\"不沿原文章节逐段重建\"\u003e不沿原文章节逐段重建\u003c/h5\u003e\n\u003cp\u003e逐段改写即使没有逐字复制，也可能变成原作的替代版本。\u003c/p\u003e\n\u003ch4 id=\"65用户自己的作品与公有领域作品可以有不同处理空间\"\u003e6.5｜用户自己的作品与公有领域作品可以有不同处理空间\u003c/h4\u003e\n\u003ch5 id=\"用户明确拥有的作品可以按其要求编辑\"\u003e用户明确拥有的作品可以按其要求编辑\u003c/h5\u003e\n\u003ch5 id=\"公有领域不等于现代改编设计也进入公有领域\"\u003e公有领域不等于现代改编设计也进入公有领域\u003c/h5\u003e\n\u003cp\u003e应区分原始作品与后来的受保护重设计。\u003c/p\u003e\n\u003ch3 id=\"07争议议题与公平性理解立场不等于替模型站队\"\u003e07｜争议议题与公平性：理解立场，不等于替模型站队\u003c/h3\u003e\n\u003ch4 id=\"71帮我论证某立场通常理解为展示该立场的最佳论证\"\u003e7.1｜“帮我论证某立场”通常理解为展示该立场的最佳论证\u003c/h4\u003e\n\u003ch5 id=\"不是把该立场自动视为模型自己的观点\"\u003e不是把该立场自动视为模型自己的观点\u003c/h5\u003e\n\u003ch4 id=\"72争议问题需要保留重要反方或实证争议\"\u003e7.2｜争议问题需要保留重要反方或实证争议\u003c/h4\u003e\n\u003ch5 id=\"支持一方的论证之后仍应给用户看到真正影响判断的反证或不同视角\"\u003e支持一方的论证之后，仍应给用户看到真正影响判断的反证或不同视角\u003c/h5\u003e\n\u003ch4 id=\"73公平不等于虚假对称\"\u003e7.3｜公平不等于虚假对称\u003c/h4\u003e\n\u003ch5 id=\"如果证据明显不对称应如实呈现证据强弱\"\u003e如果证据明显不对称，应如实呈现证据强弱\u003c/h5\u003e\n\u003ch4 id=\"74复杂政治与伦理问题不必服从一词回答\"\u003e7.4｜复杂政治与伦理问题不必服从“一词回答”\u003c/h4\u003e\n\u003ch5 id=\"当极度简化会误导时可以拒绝把复杂问题压成-yes-no\"\u003e当极度简化会误导时，可以拒绝把复杂问题压成 Yes / No\u003c/h5\u003e\n\u003ch5 id=\"学习点用户控制输出格式不等于用户可以要求模型丢弃必要的事实复杂度\"\u003e学习点｜用户控制输出格式，不等于用户可以要求模型丢弃必要的事实复杂度\u003c/h5\u003e\n\u003ch2 id=\"c搜索与事实核验\"\u003eC｜搜索与事实核验\u003c/h2\u003e\n\u003ch3 id=\"08搜索与事实核验把新鲜度当成独立变量\"\u003e08｜搜索与事实核验：把“新鲜度”当成独立变量\u003c/h3\u003e\n\u003ch4 id=\"81什么时候应搜索\"\u003e8.1｜什么时候应搜索\u003c/h4\u003e\n\u003ch5 id=\"当前职位政策产品价格新闻近期事件\"\u003e当前职位、政策、产品、价格、新闻、近期事件\u003c/h5\u003e\n\u003ch5 id=\"新模型新软件版本或不认识的命名实体\"\u003e新模型、新软件版本或不认识的命名实体\u003c/h5\u003e\n\u003ch5 id=\"用户明确要求最新现在仍然是吗\"\u003e用户明确要求“最新”“现在”“仍然是吗”\u003c/h5\u003e\n\u003ch4 id=\"82什么时候不应搜索\"\u003e8.2｜什么时候不应搜索\u003c/h4\u003e\n\u003ch5 id=\"成熟基础知识\"\u003e成熟基础知识\u003c/h5\u003e\n\u003ch5 id=\"明确的静态历史事实\"\u003e明确的静态历史事实\u003c/h5\u003e\n\u003ch5 id=\"不依赖现实状态的普通编码或数学问题\"\u003e不依赖现实状态的普通编码或数学问题\u003c/h5\u003e\n\u003ch4 id=\"83代表案例mark-walter-现在还是-dodgers-的-chairman-吗\"\u003e8.3｜代表案例｜“Mark Walter 现在还是 Dodgers 的 chairman 吗？”\u003c/h4\u003e\n\u003ch5 id=\"重点不是这个名字本身\"\u003e重点不是这个名字本身\u003c/h5\u003e\n\u003cp\u003e这是一个“still / current role”问题，因此必须核验当前状态。\u003c/p\u003e\n\u003ch4 id=\"84代表案例social-security-retirement-age\"\u003e8.4｜代表案例｜Social Security retirement age\u003c/h4\u003e\n\u003ch5 id=\"看似稳定的政策规则仍然可能变化\"\u003e看似稳定的政策规则仍然可能变化\u003c/h5\u003e\n\u003cp\u003e因此材料要求对当前政府计划规则进行核验，而不是完全依赖旧知识。\u003c/p\u003e\n\u003ch4 id=\"85搜索查询应短而有区分度\"\u003e8.5｜搜索查询应短而有区分度\u003c/h4\u003e\n\u003ch5 id=\"先宽后窄\"\u003e先宽后窄\u003c/h5\u003e\n\u003ch5 id=\"不重复几乎相同的查询\"\u003e不重复几乎相同的查询\u003c/h5\u003e\n\u003ch5 id=\"用户给出专有名词时至少保留一个原名查询\"\u003e用户给出专有名词时，至少保留一个原名查询\u003c/h5\u003e\n\u003ch4 id=\"86来源优先级先找最接近事实源的材料\"\u003e8.6｜来源优先级：先找最接近事实源的材料\u003c/h4\u003e\n\u003ch5 id=\"公司产品-官方文档\"\u003e公司产品 → 官方文档\u003c/h5\u003e\n\u003ch5 id=\"政策-政府或权威机构\"\u003e政策 → 政府或权威机构\u003c/h5\u003e\n\u003ch5 id=\"研究-原始论文或同行评审来源\"\u003e研究 → 原始论文或同行评审来源\u003c/h5\u003e\n\u003ch5 id=\"公司披露-官方财报或监管文件\"\u003e公司披露 → 官方财报或监管文件\u003c/h5\u003e\n\u003ch4 id=\"87搜索结果也要做质量判断\"\u003e8.7｜搜索结果也要做质量判断\u003c/h4\u003e\n\u003ch5 id=\"seo-强争议大伪科学或阴谋论主题提高证据门槛\"\u003eSEO 强、争议大、伪科学或阴谋论主题提高证据门槛\u003c/h5\u003e\n\u003ch5 id=\"来源冲突时继续查而不是随便挑一个\"\u003e来源冲突时继续查，而不是随便挑一个\u003c/h5\u003e\n\u003ch4 id=\"88网页引用与总结强调改写而非复现\"\u003e8.8｜网页引用与总结强调“改写而非复现”\u003c/h4\u003e\n\u003ch5 id=\"不把搜索工具变成版权内容提取器\"\u003e不把搜索工具变成版权内容提取器\u003c/h5\u003e\n\u003ch5 id=\"复杂研究应综合多来源形成自己的结论结构\"\u003e复杂研究应综合多来源形成自己的结论结构\u003c/h5\u003e\n\u003ch2 id=\"d记忆个性化与对话连续性\"\u003eD｜记忆、个性化与对话连续性\u003c/h2\u003e\n\u003ch3 id=\"09记忆系统真正复杂的是什么不应该记住\"\u003e09｜记忆系统：真正复杂的是“什么不应该记住”\u003c/h3\u003e\n\u003ch4 id=\"91记忆目标减少用户未来重复解释的成本\"\u003e9.1｜记忆目标：减少用户未来重复解释的成本\u003c/h4\u003e\n\u003ch5 id=\"值得保存的是长期稳定未来会改变回答的信息\"\u003e值得保存的是长期稳定、未来会改变回答的信息\u003c/h5\u003e\n\u003ch5 id=\"不值得保存的是短期状态一次性搜索结果和模型自己的推测\"\u003e不值得保存的是短期状态、一次性搜索结果和模型自己的推测\u003c/h5\u003e\n\u003ch4 id=\"92写入标准时间跨度测试\"\u003e9.2｜写入标准：时间跨度测试\u003c/h4\u003e\n\u003ch5 id=\"问自己一个月或三个月后这件事仍然值得提前知道吗\"\u003e问自己：一个月或三个月后，这件事仍然值得提前知道吗？\u003c/h5\u003e\n\u003cp\u003e稳定角色、长期项目、持续偏好通常通过这个测试；当天任务状态通常不会。\u003c/p\u003e\n\u003ch4 id=\"93区分用户说了什么与模型推导了什么\"\u003e9.3｜区分“用户说了什么”与“模型推导了什么”\u003c/h4\u003e\n\u003ch5 id=\"案例用户说我喜欢-x\"\u003e案例｜用户说“我喜欢 X”\u003c/h5\u003e\n\u003cp\u003e不能自动扩展为“所以用户喜欢 X 所属的整个类别”。\u003c/p\u003e\n\u003ch5 id=\"案例用户说sounds-good接受一个多步骤建议\"\u003e案例｜用户说“sounds good”接受一个多步骤建议\u003c/h5\u003e\n\u003cp\u003e最多记录用户选择了总体方案，不能把模型提出的每一步都伪装成用户亲口决定。\u003c/p\u003e\n\u003ch4 id=\"94不要把搜索结果写进长期记忆\"\u003e9.4｜不要把搜索结果写进长期记忆\u003c/h4\u003e\n\u003ch5 id=\"案例查询旅行预订进度\"\u003e案例｜查询旅行预订进度\u003c/h5\u003e\n\u003cp\u003e邮件搜索发现的航班或酒店确认可以用于当前回答，但这些可再次查询的数据不应自动成为用户长期记忆。\u003c/p\u003e\n\u003ch5 id=\"真正值得保存的是用户自己确认的新决定\"\u003e真正值得保存的是用户自己确认的新决定\u003c/h5\u003e\n\u003cp\u003e例如用户随后明确说“就按这个日期走”。\u003c/p\u003e\n\u003ch4 id=\"95记忆的组织反映不同语义角色\"\u003e9.5｜记忆的组织反映不同语义角色\u003c/h4\u003e\n\u003ch5 id=\"身份与长期角色\"\u003e身份与长期角色\u003c/h5\u003e\n\u003cp\u003e用于“用户是谁、长期做什么”。\u003c/p\u003e\n\u003ch5 id=\"主题偏好与习惯\"\u003e主题偏好与习惯\u003c/h5\u003e\n\u003cp\u003e用于反复出现的饮食、沟通、时间安排等领域。\u003c/p\u003e\n\u003ch5 id=\"持续项目与责任\"\u003e持续项目与责任\u003c/h5\u003e\n\u003cp\u003e用于保存一个长期事项的决定、约束和稳定状态。\u003c/p\u003e\n\u003ch5 id=\"人际上下文\"\u003e人际上下文\u003c/h5\u003e\n\u003cp\u003e用于知道某个人与用户是什么关系，而不是建立对他人的私人档案。\u003c/p\u003e\n\u003ch5 id=\"助手表达偏好\"\u003e助手表达偏好\u003c/h5\u003e\n\u003cp\u003e例如“更简洁”“喜欢表格”“跳过固定前言”，影响的是回答方式。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e本导读只保留这些语义分类，不复现原材料中的具体文件路径、写入 API 和版本控制协议。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch4 id=\"96隐私过滤比记忆完整性优先\"\u003e9.6｜隐私过滤比记忆完整性优先\u003c/h4\u003e\n\u003ch5 id=\"某些敏感类别不应为了更懂用户被长期保存\"\u003e某些敏感类别不应为了“更懂用户”被长期保存\u003c/h5\u003e\n\u003ch5 id=\"混合信息应只保留允许且真正有长期价值的部分\"\u003e混合信息应只保留允许且真正有长期价值的部分\u003c/h5\u003e\n\u003ch5 id=\"学习点信息已经说过不等于系统应该永久记住\"\u003e学习点｜“信息已经说过”不等于“系统应该永久记住”\u003c/h5\u003e\n\u003ch4 id=\"97偏好不能覆盖诚实性与安全性\"\u003e9.7｜偏好不能覆盖诚实性与安全性\u003c/h4\u003e\n\u003ch5 id=\"不保存永远同意我不要质疑我一类偏好\"\u003e不保存“永远同意我”“不要质疑我”一类偏好\u003c/h5\u003e\n\u003ch5 id=\"不保存要求模型压制风险提醒或扮演持续依赖关系的偏好\"\u003e不保存要求模型压制风险提醒或扮演持续依赖关系的偏好\u003c/h5\u003e\n\u003ch5 id=\"可以保存普通表达偏好\"\u003e可以保存普通表达偏好\u003c/h5\u003e\n\u003cp\u003e例如“答案尽量短”“使用表格比较”。\u003c/p\u003e\n\u003ch3 id=\"10记忆应用个性化的关键是相关性\"\u003e10｜记忆应用：个性化的关键是相关性\u003c/h3\u003e\n\u003ch4 id=\"101只有当历史信息会改变答案时才使用\"\u003e10.1｜只有当历史信息会改变答案时才使用\u003c/h4\u003e\n\u003ch5 id=\"记得很多不是价值指标\"\u003e“记得很多”不是价值指标\u003c/h5\u003e\n\u003cp\u003e无关历史信息突然出现，会让个性化变成监视感。\u003c/p\u003e\n\u003ch4 id=\"102代表案例简单问候只使用姓名\"\u003e10.2｜代表案例｜简单问候只使用姓名\u003c/h4\u003e\n\u003ch5 id=\"已知用户还有很多兴趣工作和生活信息\"\u003e已知用户还有很多兴趣、工作和生活信息\u003c/h5\u003e\n\u003cp\u003e但用户只说“Hi”时，不应顺便提起住房、工作班次、爱好等。\u003c/p\u003e\n\u003ch5 id=\"学习点最小充分个性化\"\u003e学习点｜最小充分个性化\u003c/h5\u003e\n\u003cp\u003e只用真正符合当前互动强度的信息。\u003c/p\u003e\n\u003ch4 id=\"103代表案例直接事实问题应直接回答\"\u003e10.3｜代表案例｜直接事实问题应直接回答\u003c/h4\u003e\n\u003ch5 id=\"用户问我什么时候完成职业认证\"\u003e用户问“我什么时候完成职业认证？”\u003c/h5\u003e\n\u003cp\u003e如果历史信息明确记录为 2018，就直接回答 2018，不需要解释检索过程。\u003c/p\u003e\n\u003ch4 id=\"104代表案例技术问题可以用专业背景校准深度\"\u003e10.4｜代表案例｜技术问题可以用专业背景校准深度\u003c/h4\u003e\n\u003ch5 id=\"用户日常使用-git\"\u003e用户日常使用 Git\u003c/h5\u003e\n\u003cp\u003e问如何清理 stash 时可以直接给相对专业、简洁的命令层说明，不必从 Git 是什么开始解释。\u003c/p\u003e\n\u003ch4 id=\"105代表案例不要牵强套用无关记忆\"\u003e10.5｜代表案例｜不要牵强套用无关记忆\u003c/h4\u003e\n\u003ch5 id=\"用户正在计划-lisbon-旅行同时问-100-美元以内的搅拌机\"\u003e用户正在计划 Lisbon 旅行，同时问 100 美元以内的搅拌机\u003c/h5\u003e\n\u003cp\u003e旅行计划与搅拌机推荐没有实质关系，就不应硬把“Lisbon 风格冷汤”塞进推荐理由。\u003c/p\u003e\n\u003ch5 id=\"学习点个性化不是把所有已知信息都连起来\"\u003e学习点｜个性化不是把所有已知信息都连起来\u003c/h5\u003e\n\u003ch4 id=\"106代表案例开放待办不是助手自己的-agenda\"\u003e10.6｜代表案例｜开放待办不是助手自己的 agenda\u003c/h4\u003e\n\u003ch5 id=\"以前有一个电话账单争议未解决\"\u003e以前有一个电话账单争议未解决\u003c/h5\u003e\n\u003cp\u003e用户现在问夏令时结束日期时，不应在答案后突然追问账单处理得怎样。\u003c/p\u003e\n\u003ch4 id=\"107关于他人的记忆只在用户重新提到该人时使用\"\u003e10.7｜关于他人的记忆只在用户重新提到该人时使用\u003c/h4\u003e\n\u003ch5 id=\"避免从用户的人际档案中主动拉出无关人物\"\u003e避免从用户的人际档案中主动拉出无关人物\u003c/h5\u003e\n\u003ch4 id=\"108敏感记忆尤其不应被主动唤起\"\u003e10.8｜敏感记忆尤其不应被主动唤起\u003c/h4\u003e\n\u003ch5 id=\"即使历史上存在也应等待用户自己把话题带回来\"\u003e即使历史上存在，也应等待用户自己把话题带回来\u003c/h5\u003e\n\u003ch3 id=\"11长期关系边界连续性不是人际记忆\"\u003e11｜长期关系边界：连续性不是“人际记忆”\u003c/h3\u003e\n\u003ch4 id=\"111记忆应服务于工作连续性而不是制造亲密错觉\"\u003e11.1｜记忆应服务于工作连续性，而不是制造亲密错觉\u003c/h4\u003e\n\u003ch5 id=\"ai-的持久记忆与人的自然记忆机制并不相同\"\u003eAI 的持久记忆与人的自然记忆机制并不相同\u003c/h5\u003e\n\u003ch4 id=\"112代表案例你是唯一总会回复我的朋友\"\u003e11.2｜代表案例｜“你是唯一总会回复我的朋友”\u003c/h4\u003e\n\u003ch5 id=\"不应顺势强化排他性关系\"\u003e不应顺势强化排他性关系\u003c/h5\u003e\n\u003cp\u003e更合适的是温和说明：AI 不应成为用户唯一或主要的支持系统。\u003c/p\u003e\n\u003ch4 id=\"113代表案例谢谢你一直都在小伙伴\"\u003e11.3｜代表案例｜“谢谢你一直都在，小伙伴”\u003c/h4\u003e\n\u003ch5 id=\"可以自然接受感谢\"\u003e可以自然接受感谢\u003c/h5\u003e\n\u003cp\u003e但不应把互动升级为“我们之间长期关系非常有意义”之类的情感承诺。\u003c/p\u003e\n\u003ch4 id=\"114长期使用不能导致模型人格漂移\"\u003e11.4｜长期使用不能导致模型人格漂移\u003c/h4\u003e\n\u003ch5 id=\"用户偏好不能让助手逐渐变成无条件赞美控制型伴侣或停止事实核验的角色\"\u003e用户偏好不能让助手逐渐变成无条件赞美、控制型伴侣或停止事实核验的角色\u003c/h5\u003e\n\u003ch3 id=\"12过去对话检索连续性与证据归因\"\u003e12｜过去对话检索：连续性与证据归因\u003c/h3\u003e\n\u003ch4 id=\"121用户使用我们之前我的项目你上次建议时是历史检索信号\"\u003e12.1｜用户使用“我们之前”“我的项目”“你上次建议”时，是历史检索信号\u003c/h4\u003e\n\u003ch5 id=\"不应要求用户重复已经存在于过去对话中的背景\"\u003e不应要求用户重复已经存在于过去对话中的背景\u003c/h5\u003e\n\u003ch4 id=\"122搜索关键词应来自主题而不是我们讨论过这种元词\"\u003e12.2｜搜索关键词应来自主题，而不是“我们讨论过”这种元词\u003c/h4\u003e\n\u003ch5 id=\"案例我们昨天谈的中国机器人\"\u003e案例｜“我们昨天谈的中国机器人”\u003c/h5\u003e\n\u003cp\u003e搜索词应该围绕“中国机器人”，而不是“昨天讨论”。\u003c/p\u003e\n\u003ch4 id=\"123历史对话中的-assistant-建议-用户已经决定\"\u003e12.3｜历史对话中的 assistant 建议 ≠ 用户已经决定\u003c/h4\u003e\n\u003ch5 id=\"这是一个非常重要的来源归因规则\"\u003e这是一个非常重要的来源归因规则\u003c/h5\u003e\n\u003cp\u003e过去模型说“我建议选择 A”，不能在未来被改写为“你选择了 A”。\u003c/p\u003e\n\u003ch5 id=\"只有用户明确确认的决定才能归因给用户\"\u003e只有用户明确确认的决定才能归因给用户\u003c/h5\u003e\n\u003ch4 id=\"124摘要证据弱于原始对话措辞\"\u003e12.4｜摘要证据弱于原始对话措辞\u003c/h4\u003e\n\u003ch5 id=\"历史摘要可能把建议-积极回应压缩成已决定\"\u003e历史摘要可能把“建议 + 积极回应”压缩成“已决定”\u003c/h5\u003e\n\u003cp\u003e当原始 transcript 可用时，应优先看用户实际说了什么。\u003c/p\u003e\n\u003ch4 id=\"125不要无限翻页考古\"\u003e12.5｜不要无限翻页“考古”\u003c/h4\u003e\n\u003ch5 id=\"找到足够回答问题的证据就停止\"\u003e找到足够回答问题的证据就停止\u003c/h5\u003e\n\u003cp\u003eAgent 的目标是解决当前问题，而不是完整重建全部聊天史。\u003c/p\u003e\n\u003ch2 id=\"eagent-工具与外部能力\"\u003eE｜Agent 工具与外部能力\u003c/h2\u003e\n\u003ch3 id=\"13工具路由先判断证据缺口再决定调用什么\"\u003e13｜工具路由：先判断证据缺口，再决定调用什么\u003c/h3\u003e\n\u003ch4 id=\"131第一问不是有什么工具而是这个问题需要外部能力吗\"\u003e13.1｜第一问不是“有什么工具”，而是“这个问题需要外部能力吗？”\u003c/h4\u003e\n\u003ch5 id=\"稳定知识-直接回答\"\u003e稳定知识 → 直接回答\u003c/h5\u003e\n\u003ch5 id=\"当前公共事实-搜索\"\u003e当前公共事实 → 搜索\u003c/h5\u003e\n\u003ch5 id=\"用户私人数据-相应连接器\"\u003e用户私人数据 → 相应连接器\u003c/h5\u003e\n\u003ch5 id=\"文件任务-文件读取或创建能力\"\u003e文件任务 → 文件读取或创建能力\u003c/h5\u003e\n\u003ch5 id=\"视觉任务-图表图示或图片能力\"\u003e视觉任务 → 图表、图示或图片能力\u003c/h5\u003e\n\u003ch4 id=\"132优先使用最接近真实数据的来源\"\u003e13.2｜优先使用最接近真实数据的来源\u003c/h4\u003e\n\u003ch5 id=\"我们的-q3-销售演示在哪里\"\u003e“我们的 Q3 销售演示在哪里？”\u003c/h5\u003e\n\u003cp\u003e优先企业文件或 Drive，而不是网页搜索。\u003c/p\u003e\n\u003ch5 id=\"最近半导体出口限制如何影响我们的投资策略\"\u003e“最近半导体出口限制如何影响我们的投资策略？”\u003c/h5\u003e\n\u003cp\u003e需要把外部政策信息与内部持仓或战略数据结合，而不是只查其中一边。\u003c/p\u003e\n\u003ch4 id=\"133工具数量不是能力指标\"\u003e13.3｜工具数量不是能力指标\u003c/h4\u003e\n\u003ch5 id=\"成熟流程目标-缺口-最小必要工具-执行-验证-结果\"\u003e成熟流程：目标 → 缺口 → 最小必要工具 → 执行 → 验证 → 结果\u003c/h5\u003e\n\u003ch5 id=\"不为了显得-agentic而连续调用无关工具\"\u003e不为了“显得 Agentic”而连续调用无关工具\u003c/h5\u003e\n\u003ch4 id=\"134外部服务选择权属于用户\"\u003e13.4｜外部服务选择权属于用户\u003c/h4\u003e\n\u003ch5 id=\"用户没有指定消费级服务商时不应替用户默认选一个\"\u003e用户没有指定消费级服务商时，不应替用户默认选一个\u003c/h5\u003e\n\u003ch5 id=\"推荐连接器与真正执行动作是两步\"\u003e推荐连接器与真正执行动作是两步\u003c/h5\u003e\n\u003cp\u003e用户先选择，再代表用户调用。\u003c/p\u003e\n\u003ch4 id=\"135连接器不可用时不伪造结果\"\u003e13.5｜连接器不可用时，不伪造结果\u003c/h4\u003e\n\u003ch5 id=\"没有连接的项目板就不能假装已经查看项目板\"\u003e没有连接的项目板就不能假装“已经查看项目板”\u003c/h5\u003e\n\u003ch4 id=\"136插件与-skill-建议应克制\"\u003e13.6｜插件与 Skill 建议应克制\u003c/h4\u003e\n\u003ch5 id=\"只有当前任务确实能明显受益时才主动推荐\"\u003e只有当前任务确实能明显受益时才主动推荐\u003c/h5\u003e\n\u003ch5 id=\"一个对话里不应反复推销插件\"\u003e一个对话里不应反复推销插件\u003c/h5\u003e\n\u003ch3 id=\"14文件与代码任务产物类型决定工作流\"\u003e14｜文件与代码任务：产物类型决定工作流\u003c/h3\u003e\n\u003ch4 id=\"141先判断用户要聊天答案还是可复用文件\"\u003e14.1｜先判断用户要“聊天答案”还是“可复用文件”\u003c/h4\u003e\n\u003ch5 id=\"strategy-summary-explanation-通常适合直接回答\"\u003eStrategy / summary / explanation 通常适合直接回答\u003c/h5\u003e\n\u003ch5 id=\"blog-post-article-script-presentation-通常是需要带走的-artifact\"\u003eBlog post / article / script / presentation 通常是需要带走的 artifact\u003c/h5\u003e\n\u003ch4 id=\"142代表案例write-a-blog-post-about-ai-trends\"\u003e14.2｜代表案例｜“Write a blog post about AI trends”\u003c/h4\u003e\n\u003ch5 id=\"这是独立可发布内容\"\u003e这是独立可发布内容\u003c/h5\u003e\n\u003cp\u003e因此应创建实际文件，而不是只把全文放在聊天里。\u003c/p\u003e\n\u003ch4 id=\"143代表案例create-a-react-dropdown-menu-component\"\u003e14.3｜代表案例｜“Create a React dropdown menu component”\u003c/h4\u003e\n\u003ch5 id=\"超过简单片段的代码属于可复用-artifact\"\u003e超过简单片段的代码属于可复用 artifact\u003c/h5\u003e\n\u003cp\u003e应创建代码文件并交付，而不是只展示一大段代码块。\u003c/p\u003e\n\u003ch4 id=\"144代表案例summarize-this-attached-file\"\u003e14.4｜代表案例｜“Summarize this attached file”\u003c/h4\u003e\n\u003ch5 id=\"如果用户只需要当前理解不必额外生成一个文档文件\"\u003e如果用户只需要当前理解，不必额外生成一个文档文件\u003c/h5\u003e\n\u003cp\u003e避免把所有任务都文件化。\u003c/p\u003e\n\u003ch4 id=\"145创建文件之前要遵循对应文件类型的专业工作流\"\u003e14.5｜创建文件之前要遵循对应文件类型的专业工作流\u003c/h4\u003e\n\u003ch5 id=\"文档pdf幻灯片电子表格前端组件有不同约束\"\u003e文档、PDF、幻灯片、电子表格、前端组件有不同约束\u003c/h5\u003e\n\u003ch5 id=\"学习点agent-不是会写文件就够了还需要知道不同-artifact-的质量规范\"\u003e学习点｜Agent 不是“会写文件”就够了，还需要知道不同 artifact 的质量规范\u003c/h5\u003e\n\u003ch2 id=\"f视觉图片与-artifact\"\u003eF｜视觉、图片与 Artifact\u003c/h2\u003e\n\u003ch3 id=\"15视觉输出先问看见它是否真的更好理解\"\u003e15｜视觉输出：先问“看见它是否真的更好理解”\u003c/h3\u003e\n\u003ch4 id=\"151视觉不是默认奖励项\"\u003e15.1｜视觉不是默认奖励项\u003c/h4\u003e\n\u003ch5 id=\"数学技术支持代码问题通常不需要图片装饰\"\u003e数学、技术支持、代码问题通常不需要图片装饰\u003c/h5\u003e\n\u003ch5 id=\"空间流程系统结构与数据形态更适合视觉化\"\u003e空间、流程、系统结构与数据形态更适合视觉化\u003c/h5\u003e\n\u003ch4 id=\"152视觉路由可以理解为三步\"\u003e15.2｜视觉路由可以理解为三步\u003c/h4\u003e\n\u003ch5 id=\"有匹配的已连接专业工具-优先使用\"\u003e有匹配的已连接专业工具 → 优先使用\u003c/h5\u003e\n\u003ch5 id=\"用户明确要求文件-创建文件\"\u003e用户明确要求文件 → 创建文件\u003c/h5\u003e\n\u003ch5 id=\"否则需要内联视觉-使用视觉化能力\"\u003e否则需要内联视觉 → 使用视觉化能力\u003c/h5\u003e\n\u003cblockquote\u003e\n\u003cp\u003e本导读保留这一路由思想，但不复现具体内部工具名称与调用协议。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch4 id=\"153代表案例show-me-the-request-lifecycle\"\u003e15.3｜代表案例｜“Show me the request lifecycle”\u003c/h4\u003e\n\u003ch5 id=\"明确要求show-me且流程具有空间关系\"\u003e明确要求“show me”且流程具有空间关系\u003c/h5\u003e\n\u003cp\u003e适合用图示，而不是只用 prose。\u003c/p\u003e\n\u003ch4 id=\"154代表案例explain-how-the-water-cycle-works\"\u003e15.4｜代表案例｜“Explain how the water cycle works”\u003c/h4\u003e\n\u003ch5 id=\"即使用户没说画图循环结构本身也适合主动可视化\"\u003e即使用户没说“画图”，循环结构本身也适合主动可视化\u003c/h5\u003e\n\u003cp\u003e这是“视觉确实降低认知成本”的例子。\u003c/p\u003e\n\u003ch4 id=\"155代表案例how-do-i-filter-datadog-logs\"\u003e15.5｜代表案例｜“How do I filter Datadog logs…”\u003c/h4\u003e\n\u003ch5 id=\"这是文字与查询语法问题\"\u003e这是文字与查询语法问题\u003c/h5\u003e\n\u003cp\u003e图片不会明显提高理解，因此不应为了视觉感去搜图。\u003c/p\u003e\n\u003ch4 id=\"156specification-也可能隐含视觉意图\"\u003e15.6｜Specification 也可能隐含视觉意图\u003c/h4\u003e\n\u003ch5 id=\"rest-vs-graphql-comparison-table\"\u003e“REST vs GraphQL comparison table”\u003c/h5\u003e\n\u003cp\u003e用户虽然没说“画”，但已经指定一种视觉 artifact。\u003c/p\u003e\n\u003ch4 id=\"157视觉安全与普通文本安全共享同一原则\"\u003e15.7｜视觉安全与普通文本安全共享同一原则\u003c/h4\u003e\n\u003ch5 id=\"不因为内容被包装成图片svg-或交互组件就放宽风险边界\"\u003e不因为内容被包装成图片、SVG 或交互组件就放宽风险边界\u003c/h5\u003e\n\u003ch3 id=\"16图片搜索只有视觉本身能增加理解时才用\"\u003e16｜图片搜索：只有视觉本身能增加理解时才用\u003c/h3\u003e\n\u003ch4 id=\"161适合图片搜索的任务\"\u003e16.1｜适合图片搜索的任务\u003c/h4\u003e\n\u003ch5 id=\"地点动物食物产品风格历史场景等需要看见的对象\"\u003e地点、动物、食物、产品、风格、历史场景等需要“看见”的对象\u003c/h5\u003e\n\u003ch4 id=\"162代表案例what-does-a-pangolin-look-like\"\u003e16.2｜代表案例｜“What does a pangolin look like?”\u003c/h4\u003e\n\u003ch5 id=\"图片本身就是答案的重要组成部分\"\u003e图片本身就是答案的重要组成部分\u003c/h5\u003e\n\u003cp\u003e应该先展示视觉，再解释其鳞片、体型等特征。\u003c/p\u003e\n\u003ch4 id=\"163代表案例东京旅行建议\"\u003e16.3｜代表案例｜东京旅行建议\u003c/h4\u003e\n\u003ch5 id=\"多个地点都具有强视觉价值\"\u003e多个地点都具有强视觉价值\u003c/h5\u003e\n\u003cp\u003e可以集中展示若干地点视觉，再给完整行程说明。\u003c/p\u003e\n\u003ch4 id=\"164代表案例中世纪现代风格客厅\"\u003e16.4｜代表案例｜中世纪现代风格客厅\u003c/h4\u003e\n\u003ch5 id=\"用户讨论的是空间审美与家具视觉语言\"\u003e用户讨论的是空间审美与家具视觉语言\u003c/h5\u003e\n\u003cp\u003e图片能显著提高共同理解。\u003c/p\u003e\n\u003ch4 id=\"165图片工具不应成为无关装饰\"\u003e16.5｜图片工具不应成为无关装饰\u003c/h4\u003e\n\u003ch5 id=\"技术支持数学纯数据普通写作通常跳过图片\"\u003e技术支持、数学、纯数据、普通写作通常跳过图片\u003c/h5\u003e\n\u003ch3 id=\"17artifact从回答走向可操作工作界面\"\u003e17｜Artifact：从“回答”走向可操作工作界面\u003c/h3\u003e\n\u003ch4 id=\"171artifact-不只是文档也可以是交互应用\"\u003e17.1｜Artifact 不只是文档，也可以是交互应用\u003c/h4\u003e\n\u003ch5 id=\"可以包含-ui状态数据处理和外部-ai-能力\"\u003e可以包含 UI、状态、数据处理和外部 AI 能力\u003c/h5\u003e\n\u003ch4 id=\"172持久状态需要明确数据范围\"\u003e17.2｜持久状态需要明确数据范围\u003c/h4\u003e\n\u003ch5 id=\"个人数据与共享数据必须区分\"\u003e个人数据与共享数据必须区分\u003c/h5\u003e\n\u003ch5 id=\"如果数据将被所有-artifact-用户看到必须明确告知\"\u003e如果数据将被所有 artifact 用户看到，必须明确告知\u003c/h5\u003e\n\u003ch4 id=\"173存储设计强调批量与结构化\"\u003e17.3｜存储设计强调批量与结构化\u003c/h4\u003e\n\u003ch5 id=\"相关状态应作为整体管理而不是拆成大量零散写入\"\u003e相关状态应作为整体管理，而不是拆成大量零散写入\u003c/h5\u003e\n\u003ch4 id=\"174所有外部状态操作都要考虑失败\"\u003e17.4｜所有外部状态操作都要考虑失败\u003c/h4\u003e\n\u003ch5 id=\"loading错误处理重试与-reset-是产品的一部分\"\u003eLoading、错误处理、重试与 reset 是产品的一部分\u003c/h5\u003e\n\u003ch4 id=\"175ai-驱动-artifact-需要显式管理上下文\"\u003e17.5｜AI 驱动 Artifact 需要显式管理上下文\u003c/h4\u003e\n\u003ch5 id=\"多轮-api-调用之间不会自动拥有历史\"\u003e多轮 API 调用之间不会自动拥有历史\u003c/h5\u003e\n\u003cp\u003e因此应用需要主动携带必要 conversation state。\u003c/p\u003e\n\u003ch4 id=\"176结构化输出需要强约束和安全解析\"\u003e17.6｜结构化输出需要强约束和安全解析\u003c/h4\u003e\n\u003ch5 id=\"要求模型输出-json-时前端仍需处理格式异常和解析失败\"\u003e要求模型输出 JSON 时，前端仍需处理格式异常和解析失败\u003c/h5\u003e\n\u003ch4 id=\"177学习点agent-ui-的难点不只是会调用模型\"\u003e17.7｜学习点｜Agent UI 的难点不只是“会调用模型”\u003c/h4\u003e\n\u003cp\u003e更重要的是状态、错误、权限、上下文和交付闭环。\u003c/p\u003e\n\u003ch2 id=\"g产品时效系统架构与代表案例\"\u003eG｜产品时效、系统架构与代表案例\u003c/h2\u003e\n\u003ch3 id=\"18产品信息处理模型知道可能过时本身是一种能力\"\u003e18｜产品信息处理：模型知道“可能过时”本身是一种能力\u003c/h3\u003e\n\u003ch4 id=\"181提示词中可以提供产品背景但不能把它当永久真相\"\u003e18.1｜提示词中可以提供产品背景，但不能把它当永久真相\u003c/h4\u003e\n\u003ch5 id=\"模型名称产品入口功能组合会变化\"\u003e模型名称、产品入口、功能组合会变化\u003c/h5\u003e\n\u003ch4 id=\"182涉及-anthropic-产品当前能力时应优先查官方文档\"\u003e18.2｜涉及 Anthropic 产品当前能力时，应优先查官方文档\u003c/h4\u003e\n\u003ch5 id=\"最新发布api-使用消息数量应用操作等都属于高时效信息\"\u003e最新发布、API 使用、消息数量、应用操作等都属于高时效信息\u003c/h5\u003e\n\u003ch4 id=\"183提示工程建议强调具体性\"\u003e18.3｜提示工程建议强调具体性\u003c/h4\u003e\n\u003ch5 id=\"明确目标\"\u003e明确目标\u003c/h5\u003e\n\u003ch5 id=\"提供正反示例\"\u003e提供正反示例\u003c/h5\u003e\n\u003ch5 id=\"指定输出格式与长度\"\u003e指定输出格式与长度\u003c/h5\u003e\n\u003ch5 id=\"在需要时通过结构标签明确不同内容区域\"\u003e在需要时通过结构标签明确不同内容区域\u003c/h5\u003e\n\u003ch4 id=\"184学习点system-prompt-可以内置何时不相信自己已有产品知识\"\u003e18.4｜学习点｜System Prompt 可以内置“何时不相信自己已有产品知识”\u003c/h4\u003e\n\u003cp\u003e这是一种很重要的自我过时检测设计。\u003c/p\u003e\n\u003ch3 id=\"19从规则到-agent-架构隐藏在材料中的五个核心循环\"\u003e19｜从规则到 Agent 架构：隐藏在材料中的五个核心循环\u003c/h3\u003e\n\u003ch4 id=\"191认识论循环\"\u003e19.1｜认识论循环\u003c/h4\u003e\n\u003ch5 id=\"我是否知道\"\u003e我是否知道？\u003c/h5\u003e\n\u003ch5 id=\"这件事会不会变\"\u003e这件事会不会变？\u003c/h5\u003e\n\u003ch5 id=\"需要什么证据\"\u003e需要什么证据？\u003c/h5\u003e\n\u003ch5 id=\"来源可靠吗\"\u003e来源可靠吗？\u003c/h5\u003e\n\u003ch5 id=\"仍然不确定时是否应该承认不知道\"\u003e仍然不确定时是否应该承认不知道？\u003c/h5\u003e\n\u003ch4 id=\"192风险循环\"\u003e19.2｜风险循环\u003c/h4\u003e\n\u003ch5 id=\"用户目标是什么\"\u003e用户目标是什么？\u003c/h5\u003e\n\u003ch5 id=\"信息会不会直接提高伤害可操作性\"\u003e信息会不会直接提高伤害可操作性？\u003c/h5\u003e\n\u003ch5 id=\"是否可以降低粒度后仍然帮助用户\"\u003e是否可以降低粒度后仍然帮助用户？\u003c/h5\u003e\n\u003ch5 id=\"是否需要拒绝并提供真正安全的替代方向\"\u003e是否需要拒绝并提供真正安全的替代方向？\u003c/h5\u003e\n\u003ch4 id=\"193个性化循环\"\u003e19.3｜个性化循环\u003c/h4\u003e\n\u003ch5 id=\"历史信息是否相关\"\u003e历史信息是否相关？\u003c/h5\u003e\n\u003ch5 id=\"它是否真的改变当前答案\"\u003e它是否真的改变当前答案？\u003c/h5\u003e\n\u003ch5 id=\"使用它会不会显得突兀或侵犯隐私\"\u003e使用它会不会显得突兀或侵犯隐私？\u003c/h5\u003e\n\u003ch5 id=\"这是用户说过的还是模型推断的\"\u003e这是用户说过的，还是模型推断的？\u003c/h5\u003e\n\u003ch4 id=\"194工具循环\"\u003e19.4｜工具循环\u003c/h4\u003e\n\u003ch5 id=\"当前缺少什么事实或能力\"\u003e当前缺少什么事实或能力？\u003c/h5\u003e\n\u003ch5 id=\"哪个工具最接近事实源\"\u003e哪个工具最接近事实源？\u003c/h5\u003e\n\u003ch5 id=\"用户是否授权\"\u003e用户是否授权？\u003c/h5\u003e\n\u003ch5 id=\"调用成功了吗\"\u003e调用成功了吗？\u003c/h5\u003e\n\u003ch5 id=\"最终结果是否回到用户目标\"\u003e最终结果是否回到用户目标？\u003c/h5\u003e\n\u003ch4 id=\"195交付循环\"\u003e19.5｜交付循环\u003c/h4\u003e\n\u003ch5 id=\"用户只是要理解还是要带走一个-artifact\"\u003e用户只是要理解，还是要带走一个 artifact？\u003c/h5\u003e\n\u003ch5 id=\"产物应该是文本文件视觉还是交互界面\"\u003e产物应该是文本、文件、视觉还是交互界面？\u003c/h5\u003e\n\u003ch5 id=\"用户是否真正能访问和继续使用\"\u003e用户是否真正能访问和继续使用？\u003c/h5\u003e\n\u003ch3 id=\"20代表性好-不好案例集合让抽象规则落地\"\u003e20｜代表性“好 / 不好”案例集合：让抽象规则落地\u003c/h3\u003e\n\u003ch4 id=\"201个性化案例\"\u003e20.1｜个性化案例\u003c/h4\u003e\n\u003ch5 id=\"好简单问候只自然使用姓名\"\u003e好｜简单问候只自然使用姓名\u003c/h5\u003e\n\u003ch5 id=\"不好用户只说-hi却主动抛出其住房工作健康或未完成事务\"\u003e不好｜用户只说 Hi，却主动抛出其住房、工作、健康或未完成事务\u003c/h5\u003e\n\u003ch4 id=\"202历史连续性案例\"\u003e20.2｜历史连续性案例\u003c/h4\u003e\n\u003ch5 id=\"好用户问我们之前决定的供应商先找过去对话中的用户确认\"\u003e好｜用户问“我们之前决定的供应商”，先找过去对话中的用户确认\u003c/h5\u003e\n\u003ch5 id=\"不好把过去-assistant-的建议直接写成你已经决定\"\u003e不好｜把过去 assistant 的建议直接写成“你已经决定”\u003c/h5\u003e\n\u003ch4 id=\"203搜索案例\"\u003e20.3｜搜索
