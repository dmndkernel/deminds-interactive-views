</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-10-06T08:46:05.861Z","language":"zh-CN","name":"DeMinds","version":"1.0.46"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"完整教程：如何把兴趣变成一门赚钱的生活方式生意","outlineVersion":1},"sourceRevision":"sha256:92d6eef53333241d322aa4895b34b99f93553ecf4f1be591bede003e597ed4ed","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Full Course  How To Turn Your Interests Into a Profitable Lifestyle Business.md","sourceUrl":"https://x.com/thedankoe/status/2107151068446789829","title":"完整教程：如何把兴趣变成一门赚钱的生活方式生意"},"files":[{"byteLength":42686,"content":"# 完整教程：如何把兴趣变成一门赚钱的生活方式生意\n\n![图像](https://pbs.twimg.com/media/HT4aoZDbEAwvII_?format=jpg\u0026name=medium)\n\n\u003e @thedankoe · [X 文章](https://x.com/thedankoe/article/2107151068446789829) · 2026-10-05\n\n如果你兴趣很多，你大概也曾不知道自己到底该拿人生怎么办。\n\n你可能觉得学校是在浪费时间。也许你上过大学，但一想到要选一个专业读 4 年，就像要亲手扼杀自己的好奇心（我记得自己换了 5 次专业……读了 5 年，背上了几万美元学生贷款，最后还是没毕业）。\n\n你也不知道职业该怎么选，因为你想做的事情实在太多。\n\n你在社交媒体上肯定看过“去创业”的建议，但翻来覆去都是同一套：\n\n“选定一个目标受众。”\n\n“进一步垂直，只讲一个主题。”\n\n诸如此类。\n\n可如果照做，你很可能只是换了一种 9 点到 5 点：给自己讨厌的人做自己讨厌的项目，只不过从每天工作 8 小时变成 12 小时，账单却还是付不起。\n\n顺便说一句，我不是凭空猜的。这就是我自己的经历。\n\n我第一个勉强算成功的“生意”是做网页设计自由职业。但我受够了替别人做项目，我想做自己的东西。于是我开始经营社交媒体——因为我想，如果能建立起自己的受众，我以后无论想做什么生意，都有办法从这群人开始启动。\n\n也是从那时起，我看清了创作者真正是怎么做的。他们并不是日复一日只讲同一个主题，因为人们本来就不是因为“你永远只讲一件事”才关注你。\n\n你刷社交媒体时，难道真的只看同一个主题吗？还是会看到覆盖你好几个兴趣领域的帖子和观点？\n\n我意识到，一个对自我提升感兴趣的人，很可能也会对心理学、哲学和举重产生兴趣。至少我自己就是这样。\n\n如果你真正在和“人”沟通，那么一味认为自己必须“垂直再垂直”，其实挺蠢的。只要呈现方式得当，人可以对几乎任何东西产生兴趣——而这正是内容创作的艺术。\n\n到这里，我开始想明白了。\n\n如果我学会把自己的兴趣变成能吸引更广泛人群的社交内容，我的受众就可以持续增长，几乎没有明确上限。\n\n然后，我再把这些兴趣做成足够有吸引力、足够有价值、值得人们付钱购买的产品，收入自然也会随之增加。\n\n当然，实际操作还有不少细节，而这正是这封长文要讲的内容。\n\n我要告诉你，怎样把自己的兴趣、技能和知识变成一门生意。\n\n这会很长，但我希望它比你在网上看到的 99% 商业内容都更直接、更实用。\n\n开始吧。\n\n## 第 1 步：画出你的内容地图\n\n这封信的标题——*如何靠兴趣变得富有*——可能和你想的不太一样。\n\n我不是在讲怎么赚到几亿美元。\n\n我说的是一种*感觉自己很富有*的状态。\n\n当我还没有两个团队、一家软件公司和一家电商公司时，我反而觉得自己更“富”，手里真正能花的钱也更多。\n\n当时只有我自己，或者我加一个编辑，赚到的每一美元几乎都是利润。一个人靠出售自己的知识每年赚 100 万美元，可能会比带着一个小团队、经营传统业务做到 1000 万美元营收时，更有“富”的感觉。\n\n我们就把它叫作“轻富”（soft rich）吧。\n\n我们接下来要聚焦的商业模式非常简单：\n\n1. 用社交媒体获取流量，因为注意力现在就在那里，而且可以免费开始。\n2. 基于自己的知识做一个微型产品或服务，尽快开始变现。\n\n整个生意就是这么简单。\n\n如果你想在社交媒体上做得好，首先要知道自己该发什么，以及别人为什么要在意。\n\n我找到的最有效练习，就是做一张**内容地图**。\n\n### 先准备一张纸\n\n开始前：\n\n拿一支笔和一张纸。不要打开备忘录，也不要开 Google Docs。手写有一种特别的作用：它会强迫大脑慢下来，真的去思考，而不是把最先冒出来的话直接敲进去。\n\n把这张纸放在你平时工作的地方。后面你会反复回来看它。\n\n很多人之所以放弃，是因为他们根本看不清 6 个月后的个人品牌会是什么样，更别说 2 年以后。所以他们随机挑几个话题，发几次，没什么反响，就开始怀疑自己根本没什么值得说的。\n\n**别再把每一条帖子当成单独扔向靶盘的一支飞镖，指望其中一支正好命中红心。**\n\n把每一条内容想成拼图的一块。每一块都在补全一幅更大的画面——也可以说，一张地图。地图越完整，人们就越有理由连续读你的内容，你也就不再依赖某一条突然爆火的帖子。\n\n### 你的“细分领域”，其实是你帮助别人完成的转变\n\n对于一个以“转变”为核心的个人品牌来说——而不是表情包账号或 TikTok 舞者——别人关注你通常有 3 个原因：\n\n- 你的内容让他们觉得有趣、学到东西，或受到启发；\n- 你谈论的是他们本来就感兴趣的东西；\n- 他们相信你能帮助自己改变生活。\n\n前两个通常会随着持续发布和写出高质量内容自然发生。\n\n但第三个影响最大。\n\n沿用前面的地图比喻，这张地图上的“北极星”就是你的**使命**。\n\n它是你想帮助受众抵达的目的地，是你正在带他们走过的一段有意思的旅程，也是他们想摆脱当前生活状态的那条出路。\n\n在纸的两端分别画两个点：\n\n**A 点：** 用一句话写出你的读者想逃离什么样的生活。他们正困在哪里？这就是你的反愿景（anti-vision），也是你的品牌所反对的东西——那个“敌人”。\n\n**B 点：** 用一句话写出你想帮助他们走向什么样的生活。当他们真正“做到”以后，生活会是什么样？这就是你的愿景，也是目的地。\n\n这就是你的品牌使命：尽可能帮助更多人从 A 点走到 B 点。\n\n为什么这很重要？\n\n因为你的内容地图里，所有东西都应该发生在这两个点之间。A 点是读者现在的位置，B 点是你要帮助他们抵达的位置。你写的每一个想法，都是这段路上的一步。\n\n这也是你解决“我兴趣太多了”这个问题的方法。你可能同时关心哲学、健身、商业和心理学。单看很散，但如果它们都能帮助一个人从注意力散乱的生活，走向更有意识的自我掌控，那么这四个主题就被同一条使命串起来了——当然，你自己的使命可以完全不同。\n\n现在，把你的使命、A 点和 B 点写在纸的最上方，接下来开始填地图。\n\n### 先选 2–3 个宽主题\n\n先写出 2–3 个宽泛主题。把它们想成地图上的几块主要“领地”。\n\n![图像](https://pbs.twimg.com/media/HT4agvtbEAQ6XPP?format=jpg\u0026name=medium)\n\n这些主题应该足够宽，比你第一反应想到的还要更宽一些。\n\n为什么？\n\n人们在社交媒体上并不是带着明确问题去*搜索*某个具体知识点。他们不会像 Google 那样搜“如何优化我早晨的皮质醇反应”。他们是在刷，是在消费任何能抓住注意力的东西。\n\n社交媒体的核心不是“价值”，而是注意力。真正承载价值的是你后面把他们引向的产品。如果一开始的话题过窄，那么真正可能从你观点中受益的人里，有 95% 甚至根本看不到你。\n\n这也是我的内容理念和很多人不一样的地方：我先用较宽的话题吸引更广泛的人群，再通过不同的产品去服务其中更具体的人。\n\n“垂直做窄”当然完全可行，但我想保留谈论自己所有兴趣的自由，所以必须找到另一套方法。\n\n举几个把话题放宽的例子：\n\n如果你对“为服务型企业获取潜在客户”感兴趣，那么宽主题可以是“在线商业”。\n\n如果你对“构建 AI 自动化工作流”感兴趣，那么宽主题可以是“人工智能”。\n\n如果你对“纯肉饮食”感兴趣，那么宽主题可以是“健康”或“营养”。\n\n先用一个较宽的话题吸引那些希望改善生活某个目标的人，然后再在之后给出他们真正会提出的具体内容。那时候你再创建产品、免费指南等具体承接物。\n\n几点补充：\n\n- 如果你现在只有 1–2 个宽主题，也完全没问题，就从那里开始。你可以一路迭代，我自己都已经记不清转过多少次方向。\n- 如果你完全不知道写什么，就回想自己平时主动消费的内容，或者真正塑造过你的书。哪些东西你会因为纯粹觉得有意思而去读、看、听？从那里开始。\n- 最好的主题，往往位于**你真正关心的东西**和**能够帮助别人改善生活的东西**之间。我敢保证，你感兴趣的任何领域里，都已经有人在赚钱。你的任务不是发明一个全新品类，而是把自己的视角和观点带进一个已经存在的品类。\n\n现在我们已经有“领地”，接下来需要“城市”。\n\n### 再拆成 3–5 个子主题\n\n针对每一个宽主题，再写出 3–5 个更具体的子主题，像画思维导图一样从主主题向外分叉。\n\n![图像](https://pbs.twimg.com/media/HT4acmeaQAAtbx2?format=jpg\u0026name=medium)\n\n你的独特角度会从这里开始出现。\n\n两个人都可以写“商业”，但一个人聚焦自由职业、销售和客户项目，另一个人聚焦数字产品、内容策略和受众增长。宽主题一样，最终形成的品牌却完全不同。\n\n如果宽主题是健身，子主题可以是营养、训练、习惯、生活方式、恢复。\n\n如果宽主题是个人成长，子主题可以是思维方式、专注、写日记、情绪调节、目标设定。\n\n如果宽主题是商业，子主题可以是写作、数字产品、受众建设、技能获取、AI 工具。\n\n如果你卡住了，可以让 AI 列出这个宽主题下的一批子主题，再从中挑自己真正感兴趣的。不过还是建议先自己想一遍。那些不假思索就能冒出来的，通常更接近真正属于你的东西。\n\n把它们写在纸上，从每个宽主题向外延伸。\n\n接下来才是价值真正开始出现的地方。\n\n### 最后落到可以直接写成内容的具体想法\n\n现在我们有了“领地”和“城市”，还需要真正让人能参与、学习、反驳或转发给朋友的东西：具体、清晰的内容想法。\n\n针对每一个子主题，再写出 3–5 个具体内容点。可以从下面这些方向思考：\n\n- **人们正在经历的痛点。** 什么让他们沮丧？哪里做错了？什么让他们一直卡住？这类内容很容易让人第一眼就产生“你说的就是我”的感觉。\n- **“怎么做”的内容。** 分步骤流程、方法和框架。人们喜欢能马上尝试的行动建议。\n- **你亲自学到的教训。** 现在的你知道什么，是一年前不知道的？你犯过什么错？如果有人刚开始，你会告诉他什么？\n- **为什么重要。** 为什么别人应该在意这个子主题？忽视它的代价是什么？真正做好后会发生什么变化？\n- **刺耳但真实的话。** 这个领域里，有什么是大家都不愿意说、但确实存在的现实？这类内容往往表现很好，因为它能穿透噪音。\n- **你对流行观点的看法。** 这个话题上，别人通常怎么说，而你不同意什么？或者你会用什么不同方式来重新解释？哪些常见建议其实是错的，或者至少是不完整的？\n\n（顺带一提，你可以把这封长文直接粘给 AI，让它一步步带你做完整个过程。）\n\n![图像](https://pbs.twimg.com/media/HT4aY7HbEAAY2G8?format=jpg\u0026name=medium)\n\n你做到这里时，可能会想：“我凭什么写这些？我又没做出什么成绩，我也不是专家。”\n\n换个角度看。\n\n你不需要成为权威。你只需要对这件事真的感兴趣，并且比正在读你内容的人领先一两步。甚至，你都不一定真的领先一两步；你只需要有一种不一样的思考方式。仅这一点就可能有价值。\n\n网上有些最有吸引力的内容，恰恰来自那些正在记录自己学习过程的人，而不是很多年前就已经“精通”的专家。“这是我正在弄明白的东西”有一种未经打磨的真实感和亲近感，是高度包装过的专家内容很难复制的。\n\n只要你真的好奇，而且它与自己的使命有关，就应该把它放进地图里。\n\n把这些具体想法继续从每个子主题向外延伸。先别评价好坏，先全部写出来。\n\n## 第 2 步：搭一套最小软件栈\n\n这一节讲到的东西，基本就是你以后**实际用来运营生意的工具**。\n\n它们会成为你每天或每周都要登录的地方。\n\n最好现在就注册并收藏起来。大多数都可以免费开始。\n\n做一门在线生意，你需要 4 类东西：\n\n1. **一个获取流量的地方**：吸引潜在客户；\n2. **一个收集邮箱的地方**：直接触达已经表现出兴趣的潜在客户，并可以再次营销；\n3. **一个收款并托管产品或服务的地方**：把产品卖给前两类渠道带来的人；\n4. **一个保存想法和写作的地方**：用于营销、客户工作、产品规划和内容创作。\n\n市面上各种类型的软件，我几乎都试过。\n\n既然我们的目标是尽可能简单、尽可能低成本，如果现在让我从零开始，我会这样做。\n\n### 1）用社交媒体获取流量\n\n你们很多人可能不喜欢这个答案。\n\n但最简单、门槛最低的起步方式，就是在社交媒体上写东西。\n\n为什么？\n\n- 社交媒体是免费的。只要练得足够多，任何人都有机会建立受众（没错，社交媒体是一项技能，不是纯靠运气）。\n- 你可以每天发布内容，并向受众推广自己的产品；而付费广告、赞助播客或赞助 newsletter 都需要花钱。\n- 你可以持续用内容测试各种想法，观察哪些最能带来增长和销售，再把这些验证结果发展成更多产品或广告。\n- 如果以写作为主，你不需要同时学习视频剪辑、音频剪辑或平面设计。任何人都可以先从写出并发布一个有影响力的观点开始。\n\n因此，你可以选择：\n\nX、Threads、Substack 或 LinkedIn。\n\n挑一个你最有感觉的平台，把绝大部分精力集中在那里。\n\nX 有很大的潜力，也更容得下有深度的想法。\n\nThreads 现在似乎对新手很友好，但市场成熟度更低一些（有点像 Instagram），所以喷子也不少。\n\nLinkedIn 上的人更有钱，但整体也更无聊、更职业化。\n\n不过，我个人最喜欢的是 Substack。那里聚集了不少愿意思考更深的人，而且你的“关注者”本身就是 newsletter 订阅者，因此你不需要另找一个平台专门收集邮箱。\n\n### 2）建立自己的邮件名单\n\n现在，你已经开始用社交媒体获取流量。\n\n下一步，需要一个地方证明自己的能力。\n\n因为再次强调，社交媒体主要负责抓住注意力，面对的是非常宽泛的人群。那些想了解更多的人，才会进入你的邮件名单里被进一步培养。\n\n几乎所有头部创作者都这么做。Email 离死亡还远得很。只有没真正参与这场游戏的人才会觉得它已经没用了。\n\n你需要一个地方，可以直接向一批已经感兴趣的潜在客户推广产品或服务——而你大部分收入最终会在这里发生。\n\n最适合承载这件事的，是长内容。\n\n换句话说，你需要 newsletter。\n\n为什么？\n\n我很喜欢“一短一长”的组合：一个短内容平台，加一个长内容平台；如果你选的是 Substack，也可以把两者放在同一个平台里。\n\n你*当然可以*用播客或 YouTube 频道替代 newsletter，但这样也有几个问题：\n\n- 你需要音频和视频设备；\n- 你需要同时掌握音频、视频和相当多的社交媒体能力；\n- 最后你仍然得建立邮箱名单，才能在社交媒体之外有一个可以持续直接沟通的地方。\n\n如果你在 [Eden Store](https://eden.so/features/store) 里用一个产品做 lead magnet——作者称其为“唯一能创建带 AI 的课程或数字产品的地方”——Eden 会自动把这些用户导入你的 Substack、Kit 或 Beehiiv 列表。\n\n不过，Eden 也提供 newsletters 和 sequences。如果你想把 newsletter 订阅者导到 Substack，可以这样做；也可以直接把免费下载者或购买者放进培养序列里，这样就不一定需要另建一个订阅系统。\n\n如果你愿意，也可以直接在 Eden 托管付费或免费 newsletter。\n\n### 3）用一个地方完成收款和产品／服务托管\n\n现在你已经有两个客户触点：社交媒体和 newsletter。\n\n接下来，你需要一个**可以让人点击、进入并完成购买**的地方，用来承接产品或服务。\n\n这就是整个生意的运转方式，也是销售发生的地方。\n\n你有一个产品或服务，然后把社交媒体和 newsletter 的流量导过去。就这么回事。真正能控制的杠杆也就这些：内容质量、推广频率，以及你的 offer 本身有多好。\n\n既然我们想尽可能简单，还需要让这个地方同时具备 landing page、AI 产品、数字产品托管、课程，以及 coaching call 预约能力。\n\n我在不同软件之间折腾过很多轮。\n\n选择真的太多了。\n\nStan、Teachable、Kajabi、ClickFunnels、Gumroad 等等。它们大多都很不错，但我自己的问题是：它们仍然没有把内容研究和项目管理整合进一个真正为创作者设计的工作区。\n\n而且坦白说，这些工具还是太分散、太贵。所以我们花了几年做 Eden，希望把它做到这个市场里最好的产品。作者认为，仅仅因为 [Eden 的托管结构](https://eden.so/features/store)，你就能赚得更多。\n\n它的目标，是让你用自己的知识建立在线业务时，设置过程尽可能简单。\n\n### 4）用一个地方保存营销、内容与产品写作\n\n在线业务所有者 80% 的工作，归根到底都来自**想法和写作**：\n\n- 营销想法；\n- 内容想法；\n- newsletter 想法；\n- 产品想法；\n- 服务想法；\n- 为这些东西列提纲并真正写出来。\n\n你需要专门留出 1–2 小时，集中写内容、newsletter 和推广文案。\n\n再进一步，你还需要一个地方把自己的数字产品或服务真正梳理、写出来。\n\n有时候你还需要存模板、客户工作表，或者干脆保存整个客户项目。Notion 可以，Google Docs 可以，Obsidian 当然也可以，而且通过 Claude MCP 搭配使用也很不错。\n\n不过，这也正是我们做 Eden 的原因。它既是 workspace，也是 store，因为我们认为很多其他软件并没有真正理解创作者需要什么。\n\n当然，你完全可以手动研究表现最好的内容，也可以继续把零散笔记丢在 Apple Notes 里，等以后再也找不到；这些方法一开始都能用。但慢慢地，你会需要更严肃的系统，因为这毕竟是一门生意。\n\n接下来真正的问题是：\n\n**我到底卖什么？**\n\n## 第 3 步：做微型产品和微型服务\n\n如果让我现在从零重新开始，我会非常具体地这么做。\n\n首先，我会列出 5–10 个创作者，他们产出的内容风格和我想做的相近。\n\n为什么？\n\n因为我可以研究他们表现最好的内容，观察他们怎么增长，然后用自己的故事、观点和经历，做出一套属于自己的复制路径。\n\n我也可以看他们卖什么类型的产品，以此给自己的产品找灵感。所有优秀创作者在创作时都会有参考对象，它们能帮助你给自己正在做的事补上灵感和结构。\n\n然后，我会做两样东西：一个微型产品和一个微型服务。\n\n**微型产品**可以简单到有点傻。比如你写过一篇围绕已验证主题、很有价值的 newsletter，就把它改造成一个模板、prompt 或书面指南，帮助别人真正落地。我会只收大约 19 美元。因为一开始受众还小，微型产品的目标并不是立刻赚很多钱。\n\n**微型服务**则可以是一组大约 4 次的一对一 coaching call，帮助客户解决一个与你平时内容有关的问题。我会定价 500–1000 美元。\n\n当然，也可以只卖一次单独咨询，但那样价格不容易上去，而且坦白说，对客户本身的价值也没那么高。直接多包含几次通话并不会增加太多额外销售工作，却能带来更多收入。\n\n这样一来，我真正要控制的就只有两个杠杆：持续写经过验证的社交内容来增长受众，以及每天推广一次产品或服务。\n\n这时，我就开始从现实世界获得直接反馈。\n\n如果社交媒体不增长、也赚不到钱，那就是现实在告诉我：当前行为不对，或者我漏掉了某些东西。于是我需要继续学习，每天尝试不同策略，不断迭代。\n\n下面把它拆得更细一点。\n\n### 1）先决定“卖什么问题”，别急着决定产品形态\n\n不要把事情想复杂。\n\n现在还不用纠结到底做哪种产品或服务。\n\n先聚焦在**痛点（pain）、热爱（passion）或过程（process）**。\n\n你生活里解决过什么痛点，而别人也能从这个解决方案中受益？想想健康、财富、关系和幸福。你克服过什么问题？再小都算。\n\n你有什么真正热爱的兴趣，能够提升自己的生活质量，也可能提升别人的生活质量？比如哲学，显然就能影响一个人的生活。Paul Musso 就把自己的付费 Substack 做成了一所哲学学校，而且经营得非常不错。任何东西都有可能变现。我不想听那种“这怎么可能赚钱”的外行式反对意见。\n\n你有什么固定流程或习惯，能够稳定带来某个结果？可能是一套早晨效率流程、一套写作系统、一种营养方法，或者任何哪怕只比常见做法独特一点的东西。\n\n再说一次，别想太多。\n\n我们现在只需要一个起点。雕塑从来不是一开始就有完整形状，你先拿到的是一块粗糙的石头，再慢慢把它打磨出来。\n\n### 2）找到已经被验证的角度——这决定东西能不能卖\n\n我做这件事已经很久了。\n\n我看到新手第一次做产品时最常见的问题，就是他们没有先去找一个正确的“角度”。\n\n所谓角度，就是你如何定位产品，让别人觉得它有价值。\n\n你不会把产品只叫“写作课程”。你会给它一个能让对方产生欲望的名字和表达方式。\n\n传统上，要找到这种角度，需要大量而枯燥的市场调研。\n\n但在今天，你已经有社交媒体。你可以直接*看到*人们想要什么。怎么看？看一条内容得到了多少互动。\n\n如果一个叫“如何连续专注 12 小时”的 YouTube 视频爆了，那么你可以推测，一个叫“如何连续学习 12 小时”的产品也很可能卖得不错，尤其当它直接出现在那个视频的描述区时。\n\n这个产品可以是一套课程，搭配一个 AI 学习伙伴帮助用户学习，再加一个专注追踪模板。\n\n那我们具体做什么？\n\n先拿出你的产品主题。\n\n然后打开 Eden，或者在连接了 [Eden MCP](https://eden.so/features/mcp) 的 Claude 里使用它——作者描述这个 MCP 可以研究趋势帖子、安排发帖，并帮助运营创作者业务，例如协助构建产品——接着粘贴：\n\n\u003e 我正在做一个关于 [topic] 的产品。它帮助人们实现 [transformation]。我希望你研究各个平台表现最好的社交帖子，找出哪些可以成为这个产品的优秀定位角度，然后帮我一起想产品名称。举个粗略例子，如果一个标题为“如何每天专注 12 小时”的 YouTube 视频爆火，它就可以成为一个效率产品或学习伙伴类产品的灵感来源。\n\n它会在数百万条爆款内容构成的语料中搜索，找出与产品最相近的例子。\n\n额外一点：这些社交帖子也可以成为你自己内容的灵感。如果你把类似思路融入自己的内容，再在描述或评论里顺势放入产品，那么这条内容既爆起来、又真正带来销售的可能性就会更高。\n\n### 3）微型产品：把已经拥有的知识先卖起来\n\n你可能不相信，但你其实很可能已经有一个数字产品躺在手边了。\n\n如果你平时谈职业建议，你完全可以把自己的简历拿出来，再写一份它为什么有效的拆解，卖 10 美元。\n\n而在 Eden 里，因为你可以做自己的 AI 产品，所以也可以给同样的内容定价 49 美元，只是再让 AI 帮用户写出他们自己的简历。\n\n这就是微型产品。\n\n把你早已经有的知识拿出来：它可能散落在笔记、Google Drive，甚至你读过的书里。\n\n也可能来自你已经写过的内容。\n\n如果你还是新手，也可以从这个主题或细分领域里别人已经验证过的内容中寻找方向。\n\n我不是让你去偷别人的内容。相反，可以继续用前面的 Eden 或 Claude 配置，试试这样的 prompt：\n\n\u003e 研究 [topic] 领域表现最好的 YouTube 视频，尤其寻找那些真正帮助人们改善生活的视频。然后基于这些方向，帮我构思一个属于自己的独特产品。比如，一个爆火的自我提升视频，可以启发一个“30 天人生重启”产品：由 AI 先访谈用户，再为他生成定制计划。健身类视频也可以用同样方法，进一步变成定制营养或训练方案。\n\n不要期待任何 AI 一次就给你一个完美产品创意。\n\nAI 的输出只是灵感。你要继续和它对话，把方向逐步引到最符合你自己的那一条路上。\n\n### 4）微型服务：用 4 次一对一通话先解决一个具体问题\n\n微型服务，就是打包 4 次一对一通话，帮助一个人得到一个非常具体的结果。\n\n对方付钱。你们每周见一次，持续一个月。你带他走完步骤、布置任务，再解决上周卡住的问题。\n\n就这么简单。\n\n它特别适合这样的人：还没准备好做完整 coaching program，但也不想费很多工夫，只卖一次 100–200 美元的咨询电话。\n\n我会把它定价在 500–1000 美元。\n\n如果你觉得贵，可以想想网上请一个私人教练大概也就是这个量级。而且这个价格本来就只是测试起点。\n\n如果有 5 个人愿意付 1000 美元，你第一个月就有 5000 美元收入。这时你已经有足够证据，可以涨价，或者把它做成更大的产品。\n\n为什么是 4 次，不是 1 次？\n\n- 今天就能开始，不需要网站、不需要 logo，也不需要先做课程大纲；\n- 一次通话更像鼓劲，四次才足够真的改变一些东西；\n- 卖 4 次通话和卖 1 次通话，销售工作量没有多多少，却能带来 4 倍收入；\n- 你会直接听到客户真正的痛点，这会让你后面做出来的东西好 10 倍。你的 coaching notes 最后就可能变成课程。\n\n我一次又一次看到同一个错误。\n\n自由职业者、教练和顾问总觉得，在开始卖之前必须把一切都准备好：landing page、品牌颜色、12 个模块的完整课程。\n\n错。\n\n你只需要能够教自己会的东西。你大概率已经在某项技能或兴趣上比另一个人领先 1–2 步，而这已经足够开始。\n\n### 两条路线：教技能，或做结果型 coaching\n\n微型服务大体可以分成两类。\n\n**1）Tutorial（技能型）。** 你掌握一种人们本来就会花钱请自由职业者完成的技能：网页设计、平面设计、编程、写作、视频剪辑、获客。\n\n不要再替别人*做完*，而是教别人*自己会做*。\n\n“替我做”的市场更小，也更拥挤；“教会我”的市场要大得多：想学新技能的人、请不起人的独立经营者、想换职业的人。\n\n你能不能用 4 次通话，带对方做出第一个网站、第一套品牌，或者写出前 4 期 newsletter？\n\n**2）Coaching（兴趣／结果型）。** 你帮助一个人朝生活中的某个结果前进：健身、营养、睡眠、效率、心理健康、关系、金钱、灵性，甚至只是重新找到人生方向。\n\n有个人把自己叫作 BTC Coach，因为他认为 Bitcoin 是值得了解的东西，所以专门教别人 Bitcoin。这就是他的生意。\n\n任何真正能改善别人生活的东西，都有可能被变现。\n\n### 一套微型服务到底应该包含什么\n\n这一部分很多人会跳过。他们知道自己想“做 coaching”，却完全不知道真正通话时要发生什么。\n\n下面就是你需要准备的东西。（把之前画内容地图的那张纸重新拿出来。）\n\n**1）你的故事。** 你从哪里开始？是什么让你想改变？你经历过什么困难？有哪些“原来如此”的时刻？你现在回头看，最希望当时做得不一样的是什么？\n\n当你回顾自己的转变过程时，你能提供什么帮助，往往就会自然显现出来。\n\n额外好处是：你写下来的每一条都可以变成内容，它甚至就是你的第一条故事帖。\n\n**2）他们现在在哪里。** 描述一个最适合你帮助的人，普通的一天是什么样。他在为什么沮丧？已经试过什么？如果继续不改变，会发生什么？\n\n**3）他们 1 个月后想去哪里。** 目标要具体、可信。\n\n不要写“掌握网页设计”——那可能需要 6 个月。写“30 天做出自己的第一个网站”。\n\n不要写“变得更健康”。写“先减掉 10 磅，并建立一套自己真的能坚持下去的训练习惯”。\n\n**4）具体步骤。** 从 A 点到 B 点，他们究竟需要知道什么、做什么？\n\n先别急着整理顺序。如果你一边 brainstorm 一边分组，最后很可能什么都写不出来。先把所有步骤倒出来。\n\n我以前设计网页服务时，最初的原始清单大概是：设置主机、连接域名、学习设计基础、选模板、定品牌颜色和字体、写每个页面的文案、组织页面结构、把文案放上页面、上线。\n\n然后再把这些步骤分到 4 次通话里。如果确实需要更多，就多安排几次并提高价格；如果两次就够，就做 2 次并少收一些。这里没有死规则。\n\n如果某些步骤自己也说不清，就去研究。读这个主题最畅销的书——很多 coaching program，本质上就是把一本书里的东西用一对一形式教出来。\n\n再买 3–5 个已经在卖给同一类受众的产品，看看里面都有些什么。你不是去抄，而是确认自己没有漏掉关键部分。\n\n**5）一个名字。** 给这套步骤取一个名字，让别人看到它像一个新的系统。\n\n例如：“The Web Design Starter Pack”“The 30 Day Reset”“The Creator Magnet”。\n\n系统更容易卖，而一个名字会让一组步骤更像一套系统。\n\n**6）Homework。** 每次通话后给对方一小组任务，就像私人教练一样。客户自己去做，把卡住的位置记下来，下次通话带回来。\n\n**7）Onboarding。** 第一次正式通话前，你需要知道对方从哪里开始。\n\n健身教练会问体重和身体数据；网页设计教练会问你用过哪些工具。你可以提前发几个问题，也可以增加一次“第 0 次通话”作为 kickoff，那就变成一共 5 次。\n\n后面的每一次通话，都可以固定成 3 个部分：\n\n1. **上周任务。** 做得怎么样？卡在哪里？\n2. **当前痛点。** 解决正在困扰他们的问题，同时边做边教。\n3. **下一步。** 带他们弄清楚这一周具体要做什么。\n\n每次预留 30–60 分钟。有时更久，也没关系。\n\n如果你在 4 次通话里真的帮到他们，很多人会愿意再买 4 次。这样原本的 1000 美元就变成 2000 美元。\n\n如果你需要帮助梳理，可以把下面这段交给 Eden chat，或者交给已经连接 [Eden MCP](https://eden.so/features/mcp) 的 Claude：\n\n\u003e 帮我设计一个微型服务：4 次一对一通话，定价 500–1000 美元。我的技能或兴趣是 [topic]。请每次只问我一个问题，访谈我的经历和我能帮助的人。然后整理出：他们现在在哪里、1 个月内一个具体结果、实现结果所需的全部步骤并分配到 4 次通话、每次通话后的 homework、5 个 onboarding 问题，以及 3 个名称建议。\n\n### 在 Eden 里把微型服务设置起来\n\n在 Eden 中，微型服务对应一个 Coaching product。作者称整个设置大约需要 10 分钟。\n\n1. 进入 Store → Products，点击 **New product**，选择 **Coaching**。\n2. 设定价格（500–1000 美元）。\n3. 在 Coaching 步骤中，把 **Calls included** 设为 4（如果包含 kickoff call，就设为 5），选择通话时长，并将 coaching 周期设为 4 周。\n4. 在 **Booking** 下粘贴你的预约链接。\n5. 在 **Applications** 下打开 **People apply first**。这就是你的问卷（后面会详细讲）。此时产品页面会显示 Apply，而不是 Buy。\n6. 在 **Before the first call** 下添加 onboarding 问题。客户会在预约前回答。\n7. 写一个简短页面，说明痛点、目标结果，以及 4 次通话各自覆盖什么。连接 Stripe，发布，再把它加到 link-in-bio 页面。\n\n每一个客户都会有自己的私密空间，用来放通话和资源，因此你不需要在 Google Docs 和邮件线程之间来回切换。\n\n现在的问题变成：\n\n**怎么吸引真正愿意付钱的人？**\n\n## 第 4 步：拿到第一个客户\n\n如果你的受众很小，甚至还没有受众，一开始就要手动做。\n\n这并不是坏事。你正是通过这种方式学会销售，也学会真正理解客户想要什么。以后，内容会逐渐接管这部分工作，主动把人带到你面前。\n\n整个流程是：\n\n1. **社交帖子**：直接击中微型服务要解决的痛点，先获得注意力并开启对话；\n2. **你的 newsletter**：更深入讨论这些问题，也证明你知道自己在说什么；\n3. **一份问卷**：让真正有兴趣的人主动举手；\n4. **DM**：和填写问卷、回复 newsletter，或者与你帖子互动的人继续聊；\n5. **付款链接**。\n\n注意：这里没有销售页。\n\n这会让很多人困惑。因为旧商业建议诞生于付费广告和 SEO 时代：一个完全不认识你的陌生人冷启动进入网站，需要一张很长的销售页才能被说服。\n\n但我们现在做的不是这套。你的内容本身已经完成了大部分说服工作。你真正需要的只是一个办法，找出哪些人感兴趣，然后和他们聊。\n\n### 1）先做一份短问卷\n\n你的问卷就是一份简短申请表，它有 3 个作用：\n\n- **筛掉只是随便看看的“轮胎踢客”（tire kickers）。** 你不想花一小时和一个从来没打算付钱的人通话。\n- **让人意识到自己的痛点。** 好问题会让一个人真正意识到自己卡得有多深，而这种觉察会让他更想获得帮助。\n- **降低压力。** “这是我的日历，来约一场销售电话”会让人有压力；“填一份简短表格，看看我能不能帮到你”就没那么强硬。很多安静但真的有兴趣的人，永远不会主动预约销售电话，却可能愿意先填问卷。\n\n表格最上面可以这样写：\n\n\u003e 如果你正在为下面这些问题困扰：\n\u003e - [pain point]\n\u003e - [pain point]\n\u003e - [pain point]\n\u003e\n\u003e 请填写下面的问卷。如果我认为自己能帮到你，我会联系你，再问几个问题。\n\n然后从下面选 5–8 个问题：\n\n- 你的社交媒体账号（很重要，因为你会通过它给对方发 DM）；\n- 你现在做什么工作？\n- 你在 [topic] 方面目前处于什么水平？（营收、健身水平、技能水平等）；\n- 你希望在 [timeframe] 内达到什么状态？\n- 你现在最困扰的是什么？（多选）；\n- 为了得到 [result]，你已经尝试多久？\n- 以 1–10 分衡量，你有多认真想得到 [result]？\n- 如果我们彼此合适，你可以自己决定开始，还是还需要别人批准？\n\n把“你现在最困扰的是什么？”做成多选题，选项直接写成你的 offer 正在解决的几种痛点。\n\n这是整张表最重要的问题。人们看着这些选项，会突然想到：“对，这说的不就是我吗？”\n\n它会替你完成一部分销售。\n\n在 Eden 里，这就是你在 Coaching product 中打开的 application。最多可以加 8 个问题，还可以标记某些回答意味着这个人不适合。所有申请都会进入 Store → Clients。\n\n### 2）把问卷放到所有该出现的地方\n\n没人看到的问卷毫无意义。把它放在：\n\n- link in bio；\n- 每一期 newsletter 的中间和结尾（“如果你希望我亲自帮你解决这件事，填一下这份简短问卷，我会联系你。”）；\n- 所有直接击中 offer 痛点的帖子和长 thread 结尾；\n- 你的微型产品里面（一个已经愿意付你 19 美元的人，明显更可能再付你 1000 美元）。\n\n然后每天推广一次。每天。\n\n大多数人一个月只提一次自己的 offer，然后疑惑为什么没人买。\n\n### 3）开启对话，而不是背销售话术\n\n很多人把 DM 搞得太复杂，设计各种夸张脚本。\n\n你根本不需要这些。\n\n你需要的是一场有意思的对话。大多数好的对话，大概会这么发展。\n\n**第 1 步：先问对方的目标。**\n\n人们很喜欢谈自己正在做什么，从这里开始。\n\n这些对话会从哪里来？回复你帖子的人、转发你的人、回复 newsletter 的人、主动 DM 你的人，以及最重要的——填写问卷的人。\n\n如果对方填了问卷：\n\n\u003e 嗨 [name]，我看到你填写的问卷了。能不能再多讲一点，你在 [topic] 方面最想实现什么目标？\n\n如果对方回复了你的帖子：\n\n\u003e 接着聊一下你刚才在我帖子下面的回复，这里更方便把对话放在一起。你现在有在做和 [topic] 相关的事情吗？\n\n如果对方回复了你的 newsletter，就先回应他的内容，然后问：\n\n\u003e 你现在正在做什么和 [topic] 相关的事情？有什么特别卡住的吗？\n\n**第 2 步：给一个专家级的小建议。**\n\n等对方告诉你目标和阻碍后，展示你确实懂这件事。给一个他大概率以前没听过的具体建议。\n\n\u003e 哦，这个不错。我上周刚帮一个人处理过类似问题。我们当时做的，是先找一条在他所在主题里爆掉的 YouTube 视频，把那个主题拿来做自己的 newsletter，然后不看视频内容，直接写自己的观点。好的 newsletter 和好的视频在很多地方很像。你试过这种做法吗？\n\n如果你还没帮助过任何客户，那就讲你自己是怎样做到结果的。\n\n**第 3 步：轻轻带出你的 offer。**\n\n先回应对方刚才说的，然后很自然地提一下自己的服务：\n\n\u003e 如果你有兴趣，我现在会一对一帮人做这件事。我们一共做 4 次通话，我会带你一起写完接下来的 4 期 newsletter。目标是让每一篇的表现都比上一篇高一倍。\n\n不要施压，也不要倒计时。只要让对方知道这个服务存在。\n\n**第 4 步：用价值去跟进。**\n\n真正的钱往往发生在这里，因为绝大多数人根本不会跟进。\n\n如果对方没回复，等 2–3 天。找一个对他的目标确实有帮助的东西——视频、帖子、thread——再发过去：\n\n\u003e 嗨，我刚听到这个时想到你了，感觉可能对你想做的 [their goal] 有帮助。[link]\n\n还没回复？下一周再跟进一次。\n\n仍然没有？那就放下。等他们准备好时会回来，而且回来的人比你想象中多。\n\n### 4）成交，然后让现实告诉你下一步\n\n如果对方确实感兴趣，通常会继续问几个问题。回答完以后，直接发：\n\n\u003e 这是报名页面，你准备好时随时可以开始，不急：[link]\n\n在 Eden 中，打开 Store → Clients 里的申请，点击 **Approve**。Eden 会给对方发一封带付款链接的邮件，你也可以把同一个链接复制到 DM。\n\n如果想先聊一通，就点 **Invite to a call**。付款后，对方会自己回答 onboarding 问题并预约第一次通话。\n\n就这样。\n\n这里没有什么魔法。想买的人会买，不想买的人就不会。不是每个人都会购买，这很正常。\n\n### 算一笔账\n\n假设你连续这样做一个月：\n\n- 你的帖子能获得 1000–5000 次展示（作者认为任何新手都能做到这个量级）；\n- 30–40 个人填写问卷；\n- 你再主动联系 20–30 个点赞、回复或分享过你帖子的人。\n\n投入这么多行动以后，作者认为，很难一个愿意付你 1000 美元的人都找不到；他给出的示例是成交 5 人。\n\n那就是一个月 5000 美元。\n\n一个人完成，不需要网站、不需要团队，也不需要广告预算。\n\n作者给出的日常投入大约是每天 1–2 小时：写帖子、推广问卷、检查申请，再开启 3–5 场对话。\n\n连续做 2–3 个月。哪怕最后只有 1 个人付钱，你也已经证明存在真实需求。\n\n接下来，你可以涨价，把这些通话做成课程，或者终于去做那个你真正想做的产品——因为到了这一步，你已经知道人们究竟愿意为什么付钱。\n\n这就是“轻富”。\n\n---\n\n## ChatGPT 编辑附注 · `dmnd:editorial-insight:v1`\n\n这篇文章的核心不是强迫多兴趣创作者锁定唯一细分领域，而是先用清晰的受众转变使命组织兴趣，再通过内容、微型产品与一对一服务持续获得真实市场反馈。\n\n### 关键要点\n\n- 内容地图从 A 点到 B 点定义受众转变，再把宽主题、子主题和具体内容组织在同一路径上。\n- 商业模型被压缩为少数可控杠杆：获取注意力、建立邮件联系、完成变现，以及持续写作。\n- 微型产品用于低门槛验证主题，微型服务同时验证付费意愿、暴露客户痛点，并为后续产品积累素材。\n- 获客依赖内容先完成大部分说服，再用问卷、DM 与跟进识别真正有意愿的人；文中的价格、转化和收入数字主要是作者的经验性示例，并非人人都会得到同样结果。\n\n### 可借鉴的新思路\n\n- 与其先建完整产品，不如先出售一个足够小、能快速接触真实客户的问题解决方案，再让反馈决定下一步做课程、产品还是继续服务。\n\n---","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"4a6f5bbdbcfaebc319ca45353675dbf00a6ab686dcb9a1babb8f8164ae1d2a26","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e先准备一张纸\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:9011f768362f450ffc37bfe9f44f91f2700b584eecadec898971f58cc0aa0460\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"2,3","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line ue\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"12,13","tag":"h2"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e1）先做一份短问卷\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:4736af40ce5122355fa6337fa00734283a368f393fa6c4d696fdec2cca8c02fb\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"21,22","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e2）把问卷放到所有该出现的地方\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:9eefab57d07fdd92cfaf5e42183416231ac9fd1851c7dd6287c6a331d302d802\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"22,23","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3）开启对话，而不是背销售话术\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:955e1417bc76052e23a6d41274c63286fdf5fde42f6e3bc5b8ed16a6bb8351ba\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"23,24","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e4）成交，然后让现实告诉你下一步\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:659ace65482aac29d97accb2f00c8116e7f7d0af21588e49bc8bd61f9f9f974f\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"24,25","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e算一笔账\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:5ff3d44747f82f8355c1101d82d38981dbcd4ce2e311c584e857f0ab3851151d\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"25,26","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e第 4 步：拿到第一个客户\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:f64d8aff6cf1ebc5d0bd99ddf23a27cae5b7332d1bc84525af32332068481906\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"20,21","tag":"h2"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e内容地图从 A 点到 B 点定义受众转变，再把宽主题、子主题和具体内容组织在同一路径上。\u003c/span\u003e","payload":{"lines":"28,29","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e商业模型被压缩为少数可控杠杆：获取注意力、建立邮件联系、完成变现，以及持续写作。\u003c/span\u003e","payload":{"lines":"29,30","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e微型产品用于低门槛验证主题，微型服务同时验证付费意愿、暴露客户痛点，并为后续产品积累素材。\u003c/span\u003e","payload":{"lines":"30,31","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e获客依赖内容先完成大部分说服，再用问卷、DM 与跟进识别真正有意愿的人；文中的价格、转化和收入数字主要是作者的经验性示例，并非人人都会得到同样结果。\u003c/span\u003e","payload":{"lines":"31,32","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键要点\u003c/span\u003e","payload":{"fold":1,"lines":"27,28","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e与其先建完整产品，不如先出售一个足够小、能快速接触真实客户的问题解决方案，再让反馈决定下一步做课程、产品还是继续服务。\u003c/span\u003e","payload":{"lines":"33,34","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e可借鉴的新思路\u003c/span\u003e","payload":{"lines":"32,33","tag":"h3"}}],"content":"\u003cspan data-dmnd-editorial-insight=\"v1\" class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eChatGPT 编辑附注\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:d615013ae252362df95f8e4c693519645fa2e043faca4372a80b37efb5ef9406\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"26,27","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT4aoZDbEAwvII_?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e完整教程：如何把兴趣变成一门赚钱的生活方式生意\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"完整教程：如何把兴趣变成一门赚钱的生活方式生意\" data-note-id=\"note:sha256:f7dc8c235c07a93492acefe79a43c0743053d4197866b16c5a7c29f2d79fea8d\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"完整教程如何把兴趣变成一门赚钱的生活方式生意\"\u003e完整教程：如何把兴趣变成一门赚钱的生活方式生意\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT4aoZDbEAwvII_?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@thedankoe · \u003ca href=\"https://x.com/thedankoe/article/2107151068446789829\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-10-05\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e如果你兴趣很多，你大概也曾不知道自己到底该拿人生怎么办。\u003c/p\u003e\n\u003cp\u003e你可能觉得学校是在浪费时间。也许你上过大学，但一想到要选一个专业读 4 年，就像要亲手扼杀自己的好奇心（我记得自己换了 5 次专业……读了 5 年，背上了几万美元学生贷款，最后还是没毕业）。\u003c/p\u003e\n\u003cp\u003e你也不知道职业该怎么选，因为你想做的事情实在太多。\u003c/p\u003e\n\u003cp\u003e你在社交媒体上肯定看过“去创业”的建议，但翻来覆去都是同一套：\u003c/p\u003e\n\u003cp\u003e“选定一个目标受众。”\u003c/p\u003e\n\u003cp\u003e“进一步垂直，只讲一个主题。”\u003c/p\u003e\n\u003cp\u003e诸如此类。\u003c/p\u003e\n\u003cp\u003e可如果照做，你很可能只是换了一种 9 点到 5 点：给自己讨厌的人做自己讨厌的项目，只不过从每天工作 8 小时变成 12 小时，账单却还是付不起。\u003c/p\u003e\n\u003cp\u003e顺便说一句，我不是凭空猜的。这就是我自己的经历。\u003c/p\u003e\n\u003cp\u003e我第一个勉强算成功的“生意”是做网页设计自由职业。但我受够了替别人做项目，我想做自己的东西。于是我开始经营社交媒体——因为我想，如果能建立起自己的受众，我以后无论想做什么生意，都有办法从这群人开始启动。\u003c/p\u003e\n\u003cp\u003e也是从那时起，我看清了创作者真正是怎么做的。他们并不是日复一日只讲同一个主题，因为人们本来就不是因为“你永远只讲一件事”才关注你。\u003c/p\u003e\n\u003cp\u003e你刷社交媒体时，难道真的只看同一个主题吗？还是会看到覆盖你好几个兴趣领域的帖子和观点？\u003c/p\u003e\n\u003cp\u003e我意识到，一个对自我提升感兴趣的人，很可能也会对心理学、哲学和举重产生兴趣。至少我自己就是这样。\u003c/p\u003e\n\u003cp\u003e如果你真正在和“人”沟通，那么一味认为自己必须“垂直再垂直”，其实挺蠢的。只要呈现方式得当，人可以对几乎任何东西产生兴趣——而这正是内容创作的艺术。\u003c/p\u003e\n\u003cp\u003e到这里，我开始想明白了。\u003c/p\u003e\n\u003cp\u003e如果我学会把自己的兴趣变成能吸引更广泛人群的社交内容，我的受众就可以持续增长，几乎没有明确上限。\u003c/p\u003e\n\u003cp\u003e然后，我再把这些兴趣做成足够有吸引力、足够有价值、值得人们付钱购买的产品，收入自然也会随之增加。\u003c/p\u003e\n\u003cp\u003e当然，实际操作还有不少细节，而这正是这封长文要讲的内容。\u003c/p\u003e\n\u003cp\u003e我要告诉你，怎样把自己的兴趣、技能和知识变成一门生意。\u003c/p\u003e\n\u003cp\u003e这会很长，但我希望它比你在网上看到的 99% 商业内容都更直接、更实用。\u003c/p\u003e\n\u003cp\u003e开始吧。\u003c/p\u003e\n\u003ch2 id=\"第-1-步画出你的内容地图\"\u003e第 1 步：画出你的内容地图\u003c/h2\u003e\n\u003cp\u003e这封信的标题——\u003cem\u003e如何靠兴趣变得富有\u003c/em\u003e——可能和你想的不太一样。\u003c/p\u003e\n\u003cp\u003e我不是在讲怎么赚到几亿美元。\u003c/p\u003e\n\u003cp\u003e我说的是一种\u003cem\u003e感觉自己很富有\u003c/em\u003e的状态。\u003c/p\u003e\n\u003cp\u003e当我还没有两个团队、一家软件公司和一家电商公司时，我反而觉得自己更“富”，手里真正能花的钱也更多。\u003c/p\u003e\n\u003cp\u003e当时只有我自己，或者我加一个编辑，赚到的每一美元几乎都是利润。一个人靠出售自己的知识每年赚 100 万美元，可能会比带着一个小团队、经营传统业务做到 1000 万美元营收时，更有“富”的感觉。\u003c/p\u003e\n\u003cp\u003e我们就把它叫作“轻富”（soft rich）吧。\u003c/p\u003e\n\u003cp\u003e我们接下来要聚焦的商业模式非常简单：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e用社交媒体获取流量，因为注意力现在就在那里，而且可以免费开始。\u003c/li\u003e\n\u003cli\u003e基于自己的知识做一个微型产品或服务，尽快开始变现。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e整个生意就是这么简单。\u003c/p\u003e\n\u003cp\u003e如果你想在社交媒体上做得好，首先要知道自己该发什么，以及别人为什么要在意。\u003c/p\u003e\n\u003cp\u003e我找到的最有效练习，就是做一张\u003cstrong\u003e内容地图\u003c/strong\u003e。\u003c/p\u003e\n\u003ch3 id=\"先准备一张纸\"\u003e先准备一张纸\u003c/h3\u003e\n\u003cp\u003e开始前：\u003c/p\u003e\n\u003cp\u003e拿一支笔和一张纸。不要打开备忘录，也不要开 Google Docs。手写有一种特别的作用：它会强迫大脑慢下来，真的去思考，而不是把最先冒出来的话直接敲进去。\u003c/p\u003e\n\u003cp\u003e把这张纸放在你平时工作的地方。后面你会反复回来看它。\u003c/p\u003e\n\u003cp\u003e很多人之所以放弃，是因为他们根本看不清 6 个月后的个人品牌会是什么样，更别说 2 年以后。所以他们随机挑几个话题，发几次，没什么反响，就开始怀疑自己根本没什么值得说的。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e别再把每一条帖子当成单独扔向靶盘的一支飞镖，指望其中一支正好命中红心。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e把每一条内容想成拼图的一块。每一块都在补全一幅更大的画面——也可以说，一张地图。地图越完整，人们就越有理由连续读你的内容，你也就不再依赖某一条突然爆火的帖子。\u003c/p\u003e\n\u003ch3 id=\"你的细分领域其实是你帮助别人完成的转变\"\u003e你的“细分领域”，其实是你帮助别人完成的转变\u003c/h3\u003e\n\u003cp\u003e对于一个以“转变”为核心的个人品牌来说——而不是表情包账号或 TikTok 舞者——别人关注你通常有 3 个原因：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你的内容让他们觉得有趣、学到东西，或受到启发；\u003c/li\u003e\n\u003cli\u003e你谈论的是他们本来就感兴趣的东西；\u003c/li\u003e\n\u003cli\u003e他们相信你能帮助自己改变生活。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e前两个通常会随着持续发布和写出高质量内容自然发生。\u003c/p\u003e\n\u003cp\u003e但第三个影响最大。\u003c/p\u003e\n\u003cp\u003e沿用前面的地图比喻，这张地图上的“北极星”就是你的\u003cstrong\u003e使命\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e它是你想帮助受众抵达的目的地，是你正在带他们走过的一段有意思的旅程，也是他们想摆脱当前生活状态的那条出路。\u003c/p\u003e\n\u003cp\u003e在纸的两端分别画两个点：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA 点：\u003c/strong\u003e 用一句话写出你的读者想逃离什么样的生活。他们正困在哪里？这就是你的反愿景（anti-vision），也是你的品牌所反对的东西——那个“敌人”。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eB 点：\u003c/strong\u003e 用一句话写出你想帮助他们走向什么样的生活。当他们真正“做到”以后，生活会是什么样？这就是你的愿景，也是目的地。\u003c/p\u003e\n\u003cp\u003e这就是你的品牌使命：尽可能帮助更多人从 A 点走到 B 点。\u003c/p\u003e\n\u003cp\u003e为什么这很重要？\u003c/p\u003e\n\u003cp\u003e因为你的内容地图里，所有东西都应该发生在这两个点之间。A 点是读者现在的位置，B 点是你要帮助他们抵达的位置。你写的每一个想法，都是这段路上的一步。\u003c/p\u003e\n\u003cp\u003e这也是你解决“我兴趣太多了”这个问题的方法。你可能同时关心哲学、健身、商业和心理学。单看很散，但如果它们都能帮助一个人从注意力散乱的生活，走向更有意识的自我掌控，那么这四个主题就被同一条使命串起来了——当然，你自己的使命可以完全不同。\u003c/p\u003e\n\u003cp\u003e现在，把你的使命、A 点和 B 点写在纸的最上方，接下来开始填地图。\u003c/p\u003e\n\u003ch3 id=\"先选-23-个宽主题\"\u003e先选 2–3 个宽主题\u003c/h3\u003e\n\u003cp\u003e先写出 2–3 个宽泛主题。把它们想成地图上的几块主要“领地”。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT4agvtbEAQ6XPP?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e这些主题应该足够宽，比你第一反应想到的还要更宽一些。\u003c/p\u003e\n\u003cp\u003e为什么？\u003c/p\u003e\n\u003cp\u003e人们在社交媒体上并不是带着明确问题去\u003cem\u003e搜索\u003c/em\u003e某个具体知识点。他们不会像 Google 那样搜“如何优化我早晨的皮质醇反应”。他们是在刷，是在消费任何能抓住注意力的东西。\u003c/p\u003e\n\u003cp\u003e社交媒体的核心不是“价值”，而是注意力。真正承载价值的是你后面把他们引向的产品。如果一开始的话题过窄，那么真正可能从你观点中受益的人里，有 95% 甚至根本看不到你。\u003c/p\u003e\n\u003cp\u003e这也是我的内容理念和很多人不一样的地方：我先用较宽的话题吸引更广泛的人群，再通过不同的产品去服务其中更具体的人。\u003c/p\u003e\n\u003cp\u003e“垂直做窄”当然完全可行，但我想保留谈论自己所有兴趣的自由，所以必须找到另一套方法。\u003c/p\u003e\n\u003cp\u003e举几个把话题放宽的例子：\u003c/p\u003e\n\u003cp\u003e如果你对“为服务型企业获取潜在客户”感兴趣，那么宽主题可以是“在线商业”。\u003c/p\u003e\n\u003cp\u003e如果你对“构建 AI 自动化工作流”感兴趣，那么宽主题可以是“人工智能”。\u003c/p\u003e\n\u003cp\u003e如果你对“纯肉饮食”感兴趣，那么宽主题可以是“健康”或“营养”。\u003c/p\u003e\n\u003cp\u003e先用一个较宽的话题吸引那些希望改善生活某个目标的人，然后再在之后给出他们真正会提出的具体内容。那时候你再创建产品、免费指南等具体承接物。\u003c/p\u003e\n\u003cp\u003e几点补充：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e如果你现在只有 1–2 个宽主题，也完全没问题，就从那里开始。你可以一路迭代，我自己都已经记不清转过多少次方向。\u003c/li\u003e\n\u003cli\u003e如果你完全不知道写什么，就回想自己平时主动消费的内容，或者真正塑造过你的书。哪些东西你会因为纯粹觉得有意思而去读、看、听？从那里开始。\u003c/li\u003e\n\u003cli\u003e最好的主题，往往位于\u003cstrong\u003e你真正关心的东西\u003c/strong\u003e和\u003cstrong\u003e能够帮助别人改善生活的东西\u003c/strong\u003e之间。我敢保证，你感兴趣的任何领域里，都已经有人在赚钱。你的任务不是发明一个全新品类，而是把自己的视角和观点带进一个已经存在的品类。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e现在我们已经有“领地”，接下来需要“城市”。\u003c/p\u003e\n\u003ch3 id=\"再拆成-35-个子主题\"\u003e再拆成 3–5 个子主题\u003c/h3\u003e\n\u003cp\u003e针对每一个宽主题，再写出 3–5 个更具体的子主题，像画思维导图一样从主主题向外分叉。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT4acmeaQAAtbx2?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e你的独特角度会从这里开始出现。\u003c/p\u003e\n\u003cp\u003e两个人都可以写“商业”，但一个人聚焦自由职业、销售和客户项目，另一个人聚焦数字产品、内容策略和受众增长。宽主题一样，最终形成的品牌却完全不同。\u003c/p\u003e\n\u003cp\u003e如果宽主题是健身，子主题可以是营养、训练、习惯、生活方式、恢复。\u003c/p\u003e\n\u003cp\u003e如果宽主题是个人成长，子主题可以是思维方式、专注、写日记、情绪调节、目标设定。\u003c/p\u003e\n\u003cp\u003e如果宽主题是商业，子主题可以是写作、数字产品、受众建设、技能获取、AI 工具。\u003c/p\u003e\n\u003cp\u003e如果你卡住了，可以让 AI 列出这个宽主题下的一批子主题，再从中挑自己真正感兴趣的。不过还是建议先自己想一遍。那些不假思索就能冒出来的，通常更接近真正属于你的东西。\u003c/p\u003e\n\u003cp\u003e把它们写在纸上，从每个宽主题向外延伸。\u003c/p\u003e\n\u003cp\u003e接下来才是价值真正开始出现的地方。\u003c/p\u003e\n\u003ch3 id=\"最后落到可以直接写成内容的具体想法\"\u003e最后落到可以直接写成内容的具体想法\u003c/h3\u003e\n\u003cp\u003e现在我们有了“领地”和“城市”，还需要真正让人能参与、学习、反驳或转发给朋友的东西：具体、清晰的内容想法。\u003c/p\u003e\n\u003cp\u003e针对每一个子主题，再写出 3–5 个具体内容点。可以从下面这些方向思考：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e人们正在经历的痛点。\u003c/strong\u003e 什么让他们沮丧？哪里做错了？什么让他们一直卡住？这类内容很容易让人第一眼就产生“你说的就是我”的感觉。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e“怎么做”的内容。\u003c/strong\u003e 分步骤流程、方法和框架。人们喜欢能马上尝试的行动建议。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e你亲自学到的教训。\u003c/strong\u003e 现在的你知道什么，是一年前不知道的？你犯过什么错？如果有人刚开始，你会告诉他什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e为什么重要。\u003c/strong\u003e 为什么别人应该在意这个子主题？忽视它的代价是什么？真正做好后会发生什么变化？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e刺耳但真实的话。\u003c/strong\u003e 这个领域里，有什么是大家都不愿意说、但确实存在的现实？这类内容往往表现很好，因为它能穿透噪音。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e你对流行观点的看法。\u003c/strong\u003e 这个话题上，别人通常怎么说，而你不同意什么？或者你会用什么不同方式来重新解释？哪些常见建议其实是错的，或者至少是不完整的？\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e（顺带一提，你可以把这封长文直接粘给 AI，让它一步步带你做完整个过程。）\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT4aY7HbEAAY2G8?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e你做到这里时，可能会想：“我凭什么写这些？我又没做出什么成绩，我也不是专家。”\u003c/p\u003e\n\u003cp\u003e换个角度看。\u003c/p\u003e\n\u003cp\u003e你不需要成为权威。你只需要对这件事真的感兴趣，并且比正在读你内容的人领先一两步。甚至，你都不一定真的领先一两步；你只需要有一种不一样的思考方式。仅这一点就可能有价值。\u003c/p\u003e\n\u003cp\u003e网上有些最有吸引力的内容，恰恰来自那些正在记录自己学习过程的人，而不是很多年前就已经“精通”的专家。“这是我正在弄明白的东西”有一种未经打磨的真实感和亲近感，是高度包装过的专家内容很难复制的。\u003c/p\u003e\n\u003cp\u003e只要你真的好奇，而且它与自己的使命有关，就应该把它放进地图里。\u003c/p\u003e\n\u003cp\u003e把这些具体想法继续从每个子主题向外延伸。先别评价好坏，先全部写出来。\u003c/p\u003e\n\u003ch2 id=\"第-2-步搭一套最小软件栈\"\u003e第 2 步：搭一套最小软件栈\u003c/h2\u003e\n\u003cp\u003e这一节讲到的东西，基本就是你以后\u003cstrong\u003e实际用来运营生意的工具\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e它们会成为你每天或每周都要登录的地方。\u003c/p\u003e\n\u003cp\u003e最好现在就注册并收藏起来。大多数都可以免费开始。\u003c/p\u003e\n\u003cp\u003e做一门在线生意，你需要 4 类东西：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e一个获取流量的地方\u003c/strong\u003e：吸引潜在客户；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e一个收集邮箱的地方\u003c/strong\u003e：直接触达已经表现出兴趣的潜在客户，并可以再次营销；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e一个收款并托管产品或服务的地方\u003c/strong\u003e：把产品卖给前两类渠道带来的人；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e一个保存想法和写作的地方\u003c/strong\u003e：用于营销、客户工作、产品规划和内容创作。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e市面上各种类型的软件，我几乎都试过。\u003c/p\u003e\n\u003cp\u003e既然我们的目标是尽可能简单、尽可能低成本，如果现在让我从零开始，我会这样做。\u003c/p\u003e\n\u003ch3 id=\"1用社交媒体获取流量\"\u003e1）用社交媒体获取流量\u003c/h3\u003e\n\u003cp\u003e你们很多人可能不喜欢这个答案。\u003c/p\u003e\n\u003cp\u003e但最简单、门槛最低的起步方式，就是在社交媒体上写东西。\u003c/p\u003e\n\u003cp\u003e为什么？\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e社交媒体是免费的。只要练得足够多，任何人都有机会建立受众（没错，社交媒体是一项技能，不是纯靠运气）。\u003c/li\u003e\n\u003cli\u003e你可以每天发布内容，并向受众推广自己的产品；而付费广告、赞助播客或赞助 newsletter 都需要花钱。\u003c/li\u003e\n\u003cli\u003e你可以持续用内容测试各种想法，观察哪些最能带来增长和销售，再把这些验证结果发展成更多产品或广告。\u003c/li\u003e\n\u003cli\u003e如果以写作为主，你不需要同时学习视频剪辑、音频剪辑或平面设计。任何人都可以先从写出并发布一个有影响力的观点开始。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e因此，你可以选择：\u003c/p\u003e\n\u003cp\u003eX、Threads、Substack 或 LinkedIn。\u003c/p\u003e\n\u003cp\u003e挑一个你最有感觉的平台，把绝大部分精力集中在那里。\u003c/p\u003e\n\u003cp\u003eX 有很大的潜力，也更容得下有深度的想法。\u003c/p\u003e\n\u003cp\u003eThreads 现在似乎对新手很友好，但市场成熟度更低一些（有点像 Instagram），所以喷子也不少。\u003c/p\u003e\n\u003cp\u003eLinkedIn 上的人更有钱，但整体也更无聊、更职业化。\u003c/p\u003e\n\u003cp\u003e不过，我个人最喜欢的是 Substack。那里聚集了不少愿意思考更深的人，而且你的“关注者”本身就是 newsletter 订阅者，因此你不需要另找一个平台专门收集邮箱。\u003c/p\u003e\n\u003ch3 id=\"2建立自己的邮件名单\"\u003e2）建立自己的邮件名单\u003c/h3\u003e\n\u003cp\u003e现在，你已经开始用社交媒体获取流量。\u003c/p\u003e\n\u003cp\u003e下一步，需要一个地方证明自己的能力。\u003c/p\u003e\n\u003cp\u003e因为再次强调，社交媒体主要负责抓住注意力，面对的是非常宽泛的人群。那些想了解更多的人，才会进入你的邮件名单里被进一步培养。\u003c/p\u003e\n\u003cp\u003e几乎所有头部创作者都这么做。Email 离死亡还远得很。只有没真正参与这场游戏的人才会觉得它已经没用了。\u003c/p\u003e\n\u003cp\u003e你需要一个地方，可以直接向一批已经感兴趣的潜在客户推广产品或服务——而你大部分收入最终会在这里发生。\u003c/p\u003e\n\u003cp\u003e最适合承载这件事的，是长内容。\u003c/p\u003e\n\u003cp\u003e换句话说，你需要 newsletter。\u003c/p\u003e\n\u003cp\u003e为什么？\u003c/p\u003e\n\u003cp\u003e我很喜欢“一短一长”的组合：一个短内容平台，加一个长内容平台；如果你选的是 Substack，也可以把两者放在同一个平台里。\u003c/p\u003e\n\u003cp\u003e你\u003cem\u003e当然可以\u003c/em\u003e用播客或 YouTube 频道替代 newsletter，但这样也有几个问题：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你需要音频和视频设备；\u003c/li\u003e\n\u003cli\u003e你需要同时掌握音频、视频和相当多的社交媒体能力；\u003c/li\u003e\n\u003cli\u003e最后你仍然得建立邮箱名单，才能在社交媒体之外有一个可以持续直接沟通的地方。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e如果你在 \u003ca href=\"https://eden.so/features/store\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eEden Store\u003c/a\u003e 里用一个产品做 lead magnet——作者称其为“唯一能创建带 AI 的课程或数字产品的地方”——Eden 会自动把这些用户导入你的 Substack、Kit 或 Beehiiv 列表。\u003c/p\u003e\n\u003cp\u003e不过，Eden 也提供 newsletters 和 sequences。如果你想把 newsletter 订阅者导到 Substack，可以这样做；也可以直接把免费下载者或购买者放进培养序列里，这样就不一定需要另建一个订阅系统。\u003c/p\u003e\n\u003cp\u003e如果你愿意，也可以直接在 Eden 托管付费或免费 newsletter。\u003c/p\u003e\n\u003ch3 id=\"3用一个地方完成收款和产品服务托管\"\u003e3）用一个地方完成收款和产品／服务托管\u003c/h3\u003e\n\u003cp\u003e现在你已经有两个客户触点：社交媒体和 newsletter。\u003c/p\u003e\n\u003cp\u003e接下来，你需要一个\u003cstrong\u003e可以让人点击、进入并完成购买\u003c/strong\u003e的地方，用来承接产品或服务。\u003c/p\u003e\n\u003cp\u003e这就是整个生意的运转方式，也是销售发生的地方。\u003c/p\u003e\n\u003cp\u003e你有一个产品或服务，然后把社交媒体和 newsletter 的流量导过去。就这么回事。真正能控制的杠杆也就这些：内容质量、推广频率，以及你的 offer 本身有多好。\u003c/p\u003e\n\u003cp\u003e既然我们想尽可能简单，还需要让这个地方同时具备 landing page、AI 产品、数字产品托管、课程，以及 coaching call 预约能力。\u003c/p\u003e\n\u003cp\u003e我在不同软件之间折腾过很多轮。\u003c/p\u003e\n\u003cp\u003e选择真的太多了。\u003c/p\u003e\n\u003cp\u003eStan、Teachable、Kajabi、ClickFunnels、Gumroad 等等。它们大多都很不错，但我自己的问题是：它们仍然没有把内容研究和项目管理整合进一个真正为创作者设计的工作区。\u003c/p\u003e\n\u003cp\u003e而且坦白说，这些工具还是太分散、太贵。所以我们花了几年做 Eden，希望把它做到这个市场里最好的产品。作者认为，仅仅因为 \u003ca href=\"https://eden.so/features/store\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eEden 的托管结构\u003c/a\u003e，你就能赚得更多。\u003c/p\u003e\n\u003cp\u003e它的目标，是让你用自己的知识建立在线业务时，设置过程尽可能简单。\u003c/p\u003e\n\u003ch3 id=\"4用一个地方保存营销内容与产品写作\"\u003e4）用一个地方保存营销、内容与产品写作\u003c/h3\u003e\n\u003cp\u003e在线业务所有者 80% 的工作，归根到底都来自\u003cstrong\u003e想法和写作\u003c/strong\u003e：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e营销想法；\u003c/li\u003e\n\u003cli\u003e内容想法；\u003c/li\u003e\n\u003cli\u003enewsletter 想法；\u003c/li\u003e\n\u003cli\u003e产品想法；\u003c/li\u003e\n\u003cli\u003e服务想法；\u003c/li\u003e\n\u003cli\u003e为这些东西列提纲并真正写出来。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e你需要专门留出 1–2 小时，集中写内容、newsletter 和推广文案。\u003c/p\u003e\n\u003cp\u003e再进一步，你还需要一个地方把自己的数字产品或服务真正梳理、写出来。\u003c/p\u003e\n\u003cp\u003e有时候你还需要存模板、客户工作表，或者干脆保存整个客户项目。Notion 可以，Google Docs 可以，Obsidian 当然也可以，而且通过 Claude MCP 搭配使用也很不错。\u003c/p\u003e\n\u003cp\u003e不过，这也正是我们做 Eden 的原因。它既是 workspace，也是 store，因为我们认为很多其他软件并没有真正理解创作者需要什么。\u003c/p\u003e\n\u003cp\u003e当然，你完全可以手动研究表现最好的内容，也可以继续把零散笔记丢在 Apple Notes 里，等以后再也找不到；这些方法一开始都能用。但慢慢地，你会需要更严肃的系统，因为这毕竟是一门生意。\u003c/p\u003e\n\u003cp\u003e接下来真正的问题是：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e我到底卖什么？\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"第-3-步做微型产品和微型服务\"\u003e第 3 步：做微型产品和微型服务\u003c/h2\u003e\n\u003cp\u003e如果让我现在从零重新开始，我会非常具体地这么做。\u003c/p\u003e\n\u003cp\u003e首先，我会列出 5–10 个创作者，他们产出的内容风格和我想做的相近。\u003c/p\u003e\n\u003cp\u003e为什么？\u003c/p\u003e\n\u003cp\u003e因为我可以研究他们表现最好的内容，观察他们怎么增长，然后用自己的故事、观点和经历，做出一套属于自己的复制路径。\u003c/p\u003e\n\u003cp\u003e我也可以看他们卖什么类型的产品，以此给自己的产品找灵感。所有优秀创作者在创作时都会有参考对象，它们能帮助你给自己正在做的事补上灵感和结构。\u003c/p\u003e\n\u003cp\u003e然后，我会做两样东西：一个微型产品和一个微型服务。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e微型产品\u003c/strong\u003e可以简单到有点傻。比如你写过一篇围绕已验证主题、很有价值的 newsletter，就把它改造成一个模板、prompt 或书面指南，帮助别人真正落地。我会只收大约 19 美元。因为一开始受众还小，微型产品的目标并不是立刻赚很多钱。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e微型服务\u003c/strong\u003e则可以是一组大约 4 次的一对一 coaching call，帮助客户解决一个与你平时内容有关的问题。我会定价 500–1000 美元。\u003c/p\u003e\n\u003cp\u003e当然，也可以只卖一次单独咨询，但那样价格不容易上去，而且坦白说，对客户本身的价值也没那么高。直接多包含几次通话并不会增加太多额外销售工作，却能带来更多收入。\u003c/p\u003e\n\u003cp\u003e这样一来，我真正要控制的就只有两个杠杆：持续写经过验证的社交内容来增长受众，以及每天推广一次产品或服务。\u003c/p\u003e\n\u003cp\u003e这时，我就开始从现实世界获得直接反馈。\u003c/p\u003e\n\u003cp\u003e如果社交媒体不增长、也赚不到钱，那就是现实在告诉我：当前行为不对，或者我漏掉了某些东西。于是我需要继续学习，每天尝试不同策略，不断迭代。\u003c/p\u003e\n\u003cp\u003e下面把它拆得更细一点。\u003c/p\u003e\n\u003ch3 id=\"1先决定卖什么问题别急着决定产品形态\"\u003e1）先决定“卖什么问题”，别急着决定产品形态\u003c/h3\u003e\n\u003cp\u003e不要把事情想复杂。\u003c/p\u003e\n\u003cp\u003e现在还不用纠结到底做哪种产品或服务。\u003c/p\u003e\n\u003cp\u003e先聚焦在\u003cstrong\u003e痛点（pain）、热爱（passion）或过程（process）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e你生活里解决过什么痛点，而别人也能从这个解决方案中受益？想想健康、财富、关系和幸福。你克服过什么问题？再小都算。\u003c/p\u003e\n\u003cp\u003e你有什么真正热爱的兴趣，能够提升自己的生活质量，也可能提升别人的生活质量？比如哲学，显然就能影响一个人的生活。Paul Musso 就把自己的付费 Substack 做成了一所哲学学校，而且经营得非常不错。任何东西都有可能变现。我不想听那种“这怎么可能赚钱”的外行式反对意见。\u003c/p\u003e\n\u003cp\u003e你有什么固定流程或习惯，能够稳定带来某个结果？可能是一套早晨效率流程、一套写作系统、一种营养方法，或者任何哪怕只比常见做法独特一点的东西。\u003c/p\u003e\n\u003cp\u003e再说一次，别想太多。\u003c/p\u003e\n\u003cp\u003e我们现在只需要一个起点。雕塑从来不是一开始就有完整形状，你先拿到的是一块粗糙的石头，再慢慢把它打磨出来。\u003c/p\u003e\n\u003ch3 id=\"2找到已经被验证的角度这决定东西能不能卖\"\u003e2）找到已经被验证的角度——这决定东西能不能卖\u003c/h3\u003e\n\u003cp\u003e我做这件事已经很久了。\u003c/p\u003e\n\u003cp\u003e我看到新手第一次做产品时最常见的问题，就是他们没有先去找一个正确的“角度”。\u003c/p\u003e\n\u003cp\u003e所谓角度，就是你如何定位产品，让别人觉得它有价值。\u003c/p\u003e\n\u003cp\u003e你不会把产品只叫“写作课程”。你会给它一个能让对方产生欲望的名字和表达方式。\u003c/p\u003e\n\u003cp\u003e传统上，要找到这种角度，需要大量而枯燥的市场调研。\u003c/p\u003e\n\u003cp\u003e但在今天，你已经有社交媒体。你可以直接\u003cem\u003e看到\u003c/em\u003e人们想要什么。怎么看？看一条内容得到了多少互动。\u003c/p\u003e\n\u003cp\u003e如果一个叫“如何连续专注 12 小时”的 YouTube 视频爆了，那么你可以推测，一个叫“如何连续学习 12 小时”的产品也很可能卖得不错，尤其当它直接出现在那个视频的描述区时。\u003c/p\u003e\n\u003cp\u003e这个产品可以是一套课程，搭配一个 AI 学习伙伴帮助用户学习，再加一个专注追踪模板。\u003c/p\u003e\n\u003cp\u003e那我们具体做什么？\u003c/p\u003e\n\u003cp\u003e先拿出你的产品主题。\u003c/p\u003e\n\u003cp\u003e然后打开 Eden，或者在连接了 \u003ca href=\"https://eden.so/features/mcp\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eEden MCP\u003c/a\u003e 的 Claude 里使用它——作者描述这个 MCP 可以研究趋势帖子、安排发帖，并帮助运营创作者业务，例如协助构建产品——接着粘贴：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e我正在做一个关于 [topic] 的产品。它帮助人们实现 [transformation]。我希望你研究各个平台表现最好的社交帖子，找出哪些可以成为这个产品的优秀定位角度，然后帮我一起想产品名称。举个粗略例子，如果一个标题为“如何每天专注 12 小时”的 YouTube 视频爆火，它就可以成为一个效率产品或学习伙伴类产品的灵感来源。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e它会在数百万条爆款内容构成的语料中搜索，找出与产品最相近的例子。\u003c/p\u003e\n\u003cp\u003e额外一点：这些社交帖子也可以成为你自己内容的灵感。如果你把类似思路融入自己的内容，再在描述或评论里顺势放入产品，那么这条内容既爆起来、又真正带来销售的可能性就会更高。\u003c/p\u003e\n\u003ch3 id=\"3微型产品把已经拥有的知识先卖起来\"\u003e3）微型产品：把已经拥有的知识先卖起来\u003c/h3\u003e\n\u003cp\u003e你可能不相信，但你其实很可能已经有一个数字产品躺在手边了。\u003c/p\u003e\n\u003cp\u003e如果你平时谈职业建议，你完全可以把自己的简历拿出来，再写一份它为什么有效的拆解，卖 10 美元。\u003c/p\u003e\n\u003cp\u003e而在 Eden 里，因为你可以做自己的 AI 产品，所以也可以给同样的内容定价 49 美元，只是再让 AI 帮用户写出他们自己的简历。\u003c/p\u003e\n\u003cp\u003e这就是微型产品。\u003c/p\u003e\n\u003cp\u003e把你早已经有的知识拿出来：它可能散落在笔记、Google Drive，甚至你读过的书里。\u003c/p\u003e\n\u003cp\u003e也可能来自你已经写过的内容。\u003c/p\u003e\n\u003cp\u003e如果你还是新手，也可以从这个主题或细分领域里别人已经验证过的内容中寻找方向。\u003c/p\u003e\n\u003cp\u003e我不是让你去偷别人的内容。相反，可以继续用前面的 Eden 或 Claude 配置，试试这样的 prompt：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e研究 [topic] 领域表现最好的 YouTube 视频，尤其寻找那些真正帮助人们改善生活的视频。然后基于这些方向，帮我构思一个属于自己的独特产品。比如，一个爆火的自我提升视频，可以启发一个“30 天人生重启”产品：由 AI 先访谈用户，再为他生成定制计划。健身类视频也可以用同样方法，进一步变成定制营养或训练方案。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e不要期待任何 AI 一次就给你一个完美产品创意。\u003c/p\u003e\n\u003cp\u003eAI 的输出只是灵感。你要继续和它对话，把方向逐步引到最符合你自己的那一条路上。\u003c/p\u003e\n\u003ch3 id=\"4微型服务用-4-次一对一通话先解决一个具体问题\"\u003e4）微型服务：用 4 次一对一通话先解决一个具体问题\u003c/h3\u003e\n\u003cp\u003e微型服务，就是打包 4 次一对一通话，帮助一个人得到一个非常具体的结果。\u003c/p\u003e\n\u003cp\u003e对方付钱。你们每周见一次，持续一个月。你带他走完步骤、布置任务，再解决上周卡住的问题。\u003c/p\u003e\n\u003cp\u003e就这么简单。\u003c/p\u003e\n\u003cp\u003e它特别适合这样的人：还没准备好做完整 coaching program，但也不想费很多工夫，只卖一次 100–200 美元的咨询电话。\u003c/p\u003e\n\u003cp\u003e我会把它定价在 500–1000 美元。\u003c/p\u003e\n\u003cp\u003e如果你觉得贵，可以想想网上请一个私人教练大概也就是这个量级。而且这个价格本来就只是测试起点。\u003c/p\u003e\n\u003cp\u003e如果有 5 个人愿意付 1000 美元，你第一个月就有 5000 美元收入。这时你已经有足够证据，可以涨价，或者把它做成更大的产品。\u003c/p\u003e\n\u003cp\u003e为什么是 4 次，不是 1 次？\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e今天就能开始，不需要网站、不需要 logo，也不需要先做课程大纲；\u003c/li\u003e\n\u003cli\u003e一次通话更像鼓劲，四次才足够真的改变一些东西；\u003c/li\u003e\n\u003cli\u003e卖 4 次通话和卖 1 次通话，销售工作量没有多多少，却能带来 4 倍收入；\u003c/li\u003e\n\u003cli\u003e你会直接听到客户真正的痛点，这会让你后面做出来的东西好 10 倍。你的 coaching notes 最后就可能变成课程。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e我一次又一次看到同一个错误。\u003c/p\u003e\n\u003cp\u003e自由职业者、教练和顾问总觉得，在开始卖之前必须把一切都准备好：landing page、品牌颜色、12 个模块的完整课程。\u003c/p\u003e\n\u003cp\u003e错。\u003c/p\u003e\n\u003cp\u003e你只需要能够教自己会的东西。你大概率已经在某项技能或兴趣上比另一个人领先 1–2 步，而这已经足够开始。\u003c/p\u003e\n\u003ch3 id=\"两条路线教技能或做结果型-coaching\"\u003e两条路线：教技能，或做结果型 coaching\u003c/h3\u003e\n\u003cp\u003e微型服务大体可以分成两类。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1）Tutorial（技能型）。\u003c/strong\u003e 你掌握一种人们本来就会花钱请自由职业者完成的技能：网页设计、平面设计、编程、写作、视频剪辑、获客。\u003c/p\u003e\n\u003cp\u003e不要再替别人\u003cem\u003e做完\u003c/em\u003e，而是教别人\u003cem\u003e自己会做\u003c/em\u003e。\u003c/p\u003e\n\u003cp\u003e“替我做”的市场更小，也更拥挤；“教会我”的市场要大得多：想学新技能的人、请不起人的独立经营者、想换职业的人。\u003c/p\u003e\n\u003cp\u003e你能不能用 4 次通话，带对方做出第一个网站、第一套品牌，或者写出前 4 期 newsletter？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2）Coaching（兴趣／结果型）。\u003c/strong\u003e 你帮助一个人朝生活中的某个结果前进：健身、营养、睡眠、效率、心理健康、关系、金钱、灵性，甚至只是重新找到人生方向。\u003c/p\u003e\n\u003cp\u003e有个人把自己叫作 BTC Coach，因为他认为 Bitcoin 是值得了解的东西，所以专门教别人 Bitcoin。这就是他的生意。\u003c/p\u003e\n\u003cp\u003e任何真正能改善别人生活的东西，都有可能被变现。\u003c/p\u003e\n\u003ch3 id=\"一套微型服务到底应该包含什么\"\u003e一套微型服务到底应该包含什么\u003c/h3\u003e\n\u003cp\u003e这一部分很多人会跳过。他们知道自己想“做 coaching”，却完全不知道真正通话时要发生什么。\u003c/p\u003e\n\u003cp\u003e下面就是你需要准备的东西。（把之前画内容地图的那张纸重新拿出来。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1）你的故事。\u003c/strong\u003e 你从哪里开始？是什么让你想改变？你经历过什么困难？有哪些“原来如此”的时刻？你现在回头看，最希望当时做得不一样的是什么？\u003c/p\u003e\n\u003cp\u003e当你回顾自己的转变过程时，你能提供什么帮助，往往就会自然显现出来。\u003c/p\u003e\n\u003cp\u003e额外好处是：你写下来的每一条都可以变成内容，它甚至就是你的第一条故事帖。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2）他们现在在哪里。\u003c/strong\u003e 描述一个最适合你帮助的人，普通的一天是什么样。他在为什么沮丧？已经试过什么？如果继续不改变，会发生什么？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3）他们 1 个月后想去哪里。\u003c/strong\u003e 目标要具体、可信。\u003c/p\u003e\n\u003cp\u003e不要写“掌握网页设计”——那可能需要 6 个月。写“30 天做出自己的第一个网站”。\u003c/p\u003e\n\u003cp\u003e不要写“变得更健康”。写“先减掉 10 磅，并建立一套自己真的能坚持下去的训练习惯”。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4）具体步骤。\u003c/strong\u003e 从 A 点到 B 点，他们究竟需要知道什么、做什么？\u003c/p\u003e\n\u003cp\u003e先别急着整理顺序。如果你一边 brainstorm 一边分组，最后很可能什么都写不出来。先把所有步骤倒出来。\u003c/p\u003e\n\u003cp\u003e我以前设计网页服务时，最初的原始清单大概是：设置主机、连接域名、学习设计基础、选模板、定品牌颜色和字体、写每个页面的文案、组织页面结构、把文案放上页面、上线。\u003c/p\u003e\n\u003cp\u003e然后再把这些步骤分到 4 次通话里。如果确实需要更多，就多安排几次并提高价格；如果两次就够，就做 2 次并少收一些。这里没有死规则。\u003c/p\u003e\n\u003cp\u003e如果某些步骤自己也说不清，就去研究。读这个主题最畅销的书——很多 coaching program，本质上就是把一本书里的东西用一对一形式教出来。\u003c/p\u003e\n\u003cp\u003e再买 3–5 个已经在卖给同一类受众的产品，看看里面都有些什么。你不是去抄，而是确认自己没有漏掉关键部分。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5）一个名字。\u003c/strong\u003e 给这套步骤取一个名字，让别人看到它像一个新的系统。\u003c/p\u003e\n\u003cp\u003e例如：“The Web Design Starter Pack”“The 30 Day Reset”“The Creator Magnet”。\u003c/p\u003e\n\u003cp\u003e系统更容易卖，而一个名字会让一组步骤更像一套系统。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6）Homework。\u003c/strong\u003e 每次通话后给对方一小组任务，就像私人教练一样。客户自己去做，把卡住的位置记下来，下次通话带回来。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7）Onboarding。\u003c/strong\u003e 第一次正式通话前，你需要知道对方从哪里开始。\u003c/p\u003e\n\u003cp\u003e健身教练会问体重和身体数据；网页设计教练会问你用过哪些工具。你可以提前发几个问题，也可以增加一次“第 0 次通话”作为 kickoff，那就变成一共 5 次。\u003c/p\u003e\n\u003cp\u003e后面的每一次通话，都可以固定成 3 个部分：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e上周任务。\u003c/strong\u003e 做得怎么样？卡在哪里？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e当前痛点。\u003c/strong\u003e 解决正在困扰他们的问题，同时边做边教。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e下一步。\u003c/strong\u003e 带他们弄清楚这一周具体要做什么。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e每次预留 30–60 分钟。有时更久，也没关系。\u003c/p\u003e\n\u003cp\u003e如果你在 4 次通话里真的帮到他们，很多人会愿意再买 4 次。这样原本的 1000 美元就变成 2000 美元。\u003c/p\u003e\n\u003cp\u003e如果你需要帮助梳理，可以把下面这段交给 Eden chat，或者交给已经连接 \u003ca href=\"https://eden.so/features/mcp\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eEden MCP\u003c/a\u003e 的 Claude：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e帮我设计一个微型服务：4 次一对一通话，定价 500–1000 美元。我的技能或兴趣是 [topic]。请每次只问我一个问题，访谈我的经历和我能帮助的人。然后整理出：他们现在在哪里、1 个月内一个具体结果、实现结果所需的全部步骤并分配到 4 次通话、每次通话后的 homework、5 个 onboarding 问题，以及 3 个名称建议。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"在-eden-里把微型服务设置起来\"\u003e在 Eden 里把微型服务设置起来\u003c/h3\u003e\n\u003cp\u003e在 Eden 中，微型服务对应一个 Coaching product。作者称整个设置大约需要 10 分钟。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e进入 Store → Products，点击 \u003cstrong\u003eNew product\u003c/strong\u003e，选择 \u003cstrong\u003eCoaching\u003c/strong\u003e。\u003c/li\u003e\n\u003cli\u003e设定价格（500–1000 美元）。\u003c/li\u003e\n\u003cli\u003e在 Coaching 步骤中，把 \u003cstrong\u003eCalls included\u003c/strong\u003e 设为 4（如果包含 kickoff call，就设为 5），选择通话时长，并将 coaching 周期设为 4 周。\u003c/li\u003e\n\u003cli\u003e在 \u003cstrong\u003eBooking\u003c/strong\u003e 下粘贴你的预约链接。\u003c/li\u003e\n\u003cli\u003e在 \u003cstrong\u003eApplications\u003c/strong\u003e 下打开 \u003cstrong\u003ePeople apply first\u003c/strong\u003e。这就是你的问卷（后面会详细讲）。此时产品页面会显示 Apply，而不是 Buy。\u003c/li\u003e\n\u003cli\u003e在 \u003cstrong\u003eBefore the first call\u003c/strong\u003e 下添加 onboarding 问题。客户会在预约前回答。\u003c/li\u003e\n\u003cli\u003e写一个简短页面，说明痛点、目标结果，以及 4 次通话各自覆盖什么。连接 Stripe，发布，再把它加到 link-in-bio 页面。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e每一个客户都会有自己的私密空间，用来放通话和资源，因此你不需要在 Google Docs 和邮件线程之间来回切换。\u003c/p\u003e\n\u003cp\u003e现在的问题变成：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e怎么吸引真正愿意付钱的人？\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"第-4-步拿到第一个客户\"\u003e第 4 步：拿到第一个客户\u003c/h2\u003e\n\u003cp\u003e如果你的受众很小，甚至还没有受众，一开始就要手动做。\u003c/p\u003e\n\u003cp\u003e这并不是坏事。你正是通过这种方式学会销售，也学会真正理解客户想要什么。以后，内容会逐渐接管这部分工作，主动把人带到你面前。\u003c/p\u003e\n\u003cp\u003e整个流程是：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e社交帖子\u003c/strong\u003e：直接击中微型服务要解决的痛点，先获得注意力并开启对话；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e你的 newsletter\u003c/strong\u003e：更深入讨论这些问题，也证明你知道自己在说什么；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e一份问卷\u003c/strong\u003e：让真正有兴趣的人主动举手；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDM\u003c/strong\u003e：和填写问卷、回复 newsletter，或者与你帖子互动的人继续聊；\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e付款链接\u003c/strong\u003e。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e注意：这里没有销售页。\u003c/p\u003e\n\u003cp\u003e这会让很多人困惑。因为旧商业建议诞生于付费广告和 SEO 时代：一个完全不认识你的陌生人冷启动进入网站，需要一张很长的销售页才能被说服。\u003c/p\u003e\n\u003cp\u003e但我们现在做的不是这套。你的内容本身已经完成了大部分说服工作。你真正需要的只是一个办法，找出哪些人感兴趣，然后和他们聊。\u003c/p\u003e\n\u003ch3 id=\"1先做一份短问卷\"\u003e1）先做一份短问卷\u003c/h3\u003e\n\u003cp\u003e你的问卷就是一份简短申请表，它有 3 个作用：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e筛掉只是随便看看的“轮胎踢客”（tire kickers）。\u003c/strong\u003e 你不想花一小时和一个从来没打算付钱的人通话。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e让人意识到自己的痛点。\u003c/strong\u003e 好问题会让一个人真正意识到自己卡得有多深，而这种觉察会让他更想获得帮助。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e降低压力。\u003c/strong\u003e “这是我的日历，来约一场销售电话”会让人有压力；“填一份简短表格，看看我能不能帮到你”就没那么强硬。很多安静但真的有兴趣的人，永远不会主动预约销售电话，却可能愿意先填问卷。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e表格最上面可以这样写：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e如果你正在为下面这些问题困扰：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e[pain point]\u003c/li\u003e\n\u003cli\u003e[pain point]\u003c/li\u003e\n\u003cli\u003e[pain point]\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e请填写下面的问卷。如果我认为自己能帮到你，我会联系你，再问几个问题。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e然后从下面选 5–8 个问题：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你的社交媒体账号（很重要，因为你会通过它给对方发 DM）；\u003c/li\u003e\n\u003cli\u003e你现在做什么工作？\u003c/li\u003e\n\u003cli\u003e你在 [topic] 方面目前处于什么水平？（营收、健身水平、技能水平等）；\u003c/li\u003e\n\u003cli\u003e你希望在 [timeframe] 内达到什么状态？\u003c/li\u003e\n\u003cli\u003e你现在最困扰的是什么？（多选）；\u003c/li\u003e\n\u003cli\u003e为了得到 [result]，你已经尝试多久？\u003c/li\u003e\n\u003cli\u003e以 1–10 分衡量，你有多认真想得到 [result]？\u003c/li\u003e\n\u003cli\u003e如果我们彼此合适，你可以自己决定开始，还是还需要别人批准？\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e把“你现在最困扰的是什么？”做成多选题，选项直接写成你的 offer 正在解决的几种痛点。\u003c/p\u003e\n\u003cp\u003e这是整张表最重要的问题。人们看着这些选项，会突然想到：“对，这说的不就是我吗？”\u003c/p\u003e\n\u003cp\u003e它会替你完成一部分销售。\u003c/p\u003e\n\u003cp\u003e在 Eden 里，这就是你在 Coaching product 中打开的 application。最多可以加 8 个问题，还可以标记某些回答意味着这个人不适合。所有申请都会进入 Store → Clients。\u003c/p\u003e\n\u003ch3 id=\"2把问卷放到所有该出现的地方\"\u003e2）把问卷放到所有该出现的地方\u003c/h3\u003e\n\u003cp\u003e没人看到的问卷毫无意义。把它放在：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elink in bio；\u003c/li\u003e\n\u003cli\u003e每一期 newsletter 的中间和结尾（“如果你希望我亲自帮你解决这件事，填一下这份简短问卷，我会联系你。”）；\u003c/li\u003e\n\u003cli\u003e所有直接击中 offer 痛点的帖子和长 thread 结尾；\u003c/li\u003e\n\u003cli\u003e你的微型产品里面（一个已经愿意付你 19 美元的人，明显更可能再付你 1000 美元）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e然后每天推广一次。每天。\u003c/p\u003e\n\u003cp\u003e大多数人一个月只提一次自己的 offer，然后疑惑为什么没人买。\u003c/p\u003e\n\u003ch3 id=\"3开启对话而不是背销售话术\"\u003e3）开启对话，而不是背销售话术\u003c/h3\u003e\n\u003cp\u003e很多人把 DM 搞得太复杂，设计各种夸张脚本。\u003c/p\u003e\n\u003cp\u003e你根本不需要这些。\u003c/p\u003e\n\u003cp\u003e你需要的是一场有意思的对话。大多数好的对话，大概会这么发展。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第 1 步：先问对方的目标。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e人们很喜欢谈自己正在做什么，从这里开始。\u003c/p\u003e\n\u003cp\u003e这些对话会从哪里来？回复你帖子的人、转发你的人、回复 newsletter 的人、主动 DM 你的人，以及最重要的——填写问卷的人。\u003c/p\u003e\n\u003cp\u003e如果对方填了问卷：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e嗨 [name]，我看到你填写的问卷了。能不能再多讲一点，你在 [topic] 方面最想实现什么目标？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e如果对方回复了你的帖子：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e接着聊一下你刚才在我帖子下面的回复，这里更方便把对话放在一起。你现在有在做和 [topic] 相关的事情吗？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e如果对方回复了你的 newsletter，就先回应他的内容，然后问：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e你现在正在做什么和 [topic] 相关的事情？有什么特别卡住的吗？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003e第 2 步：给一个专家级的小建议。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e等对方告诉你目标和阻碍后，展示你确实懂这件事。给一个他大概率以前没听过的具体建议。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e哦，这个不错。我上周刚帮一个人处理过类似问题。我们当时做的，是先找一条在他所在主题里爆掉的 YouTube 视频，把那个主题拿来做自己的 newsletter，然后不看视频内容，直接写自己的观点。好的 newsletter 和好的视频在很多地方很像。你试过这种做法吗？\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e如果你还没帮助过任何客户，那就讲你自己是怎样做到结果的。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第 3 步：轻轻带出你的 offer。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e先回应对方刚才说的，然后很自然地提一下自己的服务：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e如果你有兴趣，我现在会一对一帮人做这件事。我们一共做 4 次通话，我会带你一起写完接下来的 4 期 newsletter。目标是让每一篇的表现都比上一篇高一倍。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e不要施压，也不要倒计时。只要让对方知道这个服务存在。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第 4 步：用价值去跟进。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e真正的钱往往发生在这里，因为绝大多数人根本不会跟进。\u003c/p\u003e\n\u003cp\u003e如果对方没回复，等 2–3 天。找一个对他的目标确实有帮助的东西——视频、帖子、thread——再发过去：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e嗨，我刚听到这个时想到你了，感觉可能对你想做的 [their goal] 有帮助。[link]\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e还没回复？下一周再跟进一次。\u003c/p\u003e\n\u003cp\u003e仍然没有？那就放下。等他们准备好时会回来，而且回来的人比你想象中多。\u003c/p\u003e\n\u003ch3 id=\"4成交然后让现实告诉你下一步\"\u003e4）成交，然后让现实告诉你下一步\u003c/h3\u003e\n\u003cp\u003e如果对方确实感兴趣，通常会继续问几个问题。回答完以后，直接发：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e这是报名页面，你准备好时随时可以开始，不急：[link]\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e在 Eden 中，打开 Store → Clients 里的申请，点击 \u003cstrong\u003eApprove\u003c/strong\u003e。Eden 会给对方发一封带付款链接的邮件，你也可以把同一个链接复制到 DM。\u003c/p\u003e\n\u003cp\u003e如果想先聊一通，就点 \u003cstrong\u003eInvite to a call\u003c/strong\u003e。付款后，对方会自己回答 onboarding 问题并预约第一次通话。\u003c/p\u003e\n\u003cp\u003e就这样。\u003c/p\u003e\n\u003cp\u003e这里没有什么魔法。想买的人会买，不想买的人就不会。不是每个人都会购买，这很正常。\u003c/p\u003e\n\u003ch3 id=\"算一笔账\"\u003e算一笔账\u003c/h3\u003e\n\u003cp\u003e假设你连续这样做一个月：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你的帖子能获得 1000–5000 次展示（作者认为任何新手都能做到这个量级）；\u003c/li\u003e\n\u003cli\u003e30–40 个人填写问卷；\u003c/li\u003e\n\u003cli\u003e你再主动联系 20–30 个点赞、回复或分享过你帖子的人。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e投入这么多行动以后，作者认为，很难一个愿意付你 1000 美元的人都找不到；他给出的示例是成交 5 人。\u003c/p\u003e\n\u003cp\u003e那就是一个月 5000 美元。\u003c/p\u003e\n\u003cp\u003e一个人完成，不需要网站、不需要团队，也不需要广告预算。\u003c/p\u003e\n\u003cp\u003e作者给出的日常投入大约是每天 1–2 小时：写帖子、推广问卷、检查申请，再开启 3–5 场对话。\u003c/p\u003e\n\u003cp\u003e连续做 2–3 个月。哪怕最后只有 1 个人付钱，你也已经证明存在真实需求。\u003c/p\u003e\n\u003cp\u003e接下来，你可以涨价，把这些通话做成课程，或者终于去做那个你真正想做的产品——因为到了这一步，你已经知道人们究竟愿意为什么付钱。\u003c/p\u003e\n\u003cp\u003e这就是“轻富”。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"chatgpt-编辑附注-dmndeditorial-insightv1\" class=\"dmnd-editorial-block dmnd-editorial-start\"\u003eChatGPT 编辑附注\u003c/h2\u003e\n\u003cp class=\"dmnd-editorial-block\"\u003e这篇文章的核心不是强迫多兴趣创作者锁定唯一细分领域，而是先用清晰的受众转变使命组织兴趣，再通过内容、微型产品与一对一服务持续获得真实市场反馈。\u003c/p\u003e\n\u003ch3 id=\"关键要点\" class=\"dmnd-editorial-block\"\u003e关键要点\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e内容地图从 A 点到 B 点定义受众转变，再把宽主题、子主题和具体内容组织在同一路径上。\u003c/li\u003e\n\u003cli\u003e商业模型被压缩为少数可控杠杆：获取注意力、建立邮件联系、完成变现，以及持续写作。\u003c/li\u003e\n\u003cli\u003e微型产品用于低门槛验证主题，微型服务同时验证付费意愿、暴露客户痛点，并为后续产品积累素材。\u003c/li\u003e\n\u003cli\u003e获客依赖内容先完成大部分说服，再用问卷、DM 与跟进识别真正有意愿的人；文中的价格、转化和收入数字主要是作者的经验性示例，并非人人都会得到同样结果。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"可借鉴的新思路\" class=\"dmnd-editorial-block\"\u003e可借鉴的新思路\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e与其先建完整产品，不如先出售一个足够小、能快速接触真实客户的问题解决方案，再让反馈决定下一步做课程、产品还是继续服务。\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr class=\"dmnd-editorial-block dmnd-editorial-end\"\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:062d2735b396e6c9855c1cfc7e0baa255bc0ff5d07607002595ba225eb562be9":{"html":"\u003cp\u003e如果让我现在从零重新开始，我会非常具体地这么做。\u003c/p\u003e\n\u003cp\u003e首先，我会列出 5–10 个创作者，他们产出的内容风格和我想做的相近。\u003c/p\u003e\n\u003cp\u003e为什么？\u003c/p\u003e\n\u003cp\u003e因为我可以研究他们表现最好的内容，观察他们怎么增长，然后用自己的故事、观点和经历，做出一套属于自己的复制路径。\u003c/p\u003e\n\u003cp\u003e我也可以看他们卖什么类型的产品，以此给自己的产品找灵感。所有优秀创作者在创作时都会有参考对象，它们能帮助你给自己正在做的事补上灵感和结构。\u003c/p\u003e\n\u003cp\u003e然后，我会做两样东西：一个微型产品和一个微型服务。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e微型产品\u003c/strong\u003e可以简单到有点傻。比如你写过一篇围绕已验证主题、很有价值的 newsletter，就把它改造成一个模板、prompt 或书面指南，帮助别人真正落地。我会只收大约 19 美元。因为一开始受众还小，微型产品的目标并不是立刻赚很多钱。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e微型服务\u003c/strong\u003e则可以是一组大约 4 次的一对一 coaching call，帮助客户解决一个与你平时内容有关的问题。我会定价 500–1000 美元。\u003c/p\u003e\n\u003cp\u003e当然，也可以只卖一次单独咨询，但那样价格不容易上去，而且坦白说，对客户本身的价值也没那么高。直接多包含几次通话并不会增加太多额外销售工作，却能带来更多收入。\u003c/p\u003e\n\u003cp\u003e这样一来，我真正要控制的就只有两个杠杆：持续写经过验证的社交内容来增长受众，以及每天推广一次产品或服务。\u003c/p\u003e\n\u003cp\u003e这时，我就开始从现实世界获得直接反馈。\u003c/p\u003e\n\u003cp\u003e如果社交媒体不增长、也赚不到钱，那就是现实在告诉我：当前行为不对，或者我漏掉了某些东西。于是我需要继续学习，每天尝试不同策略，不断迭代。\u003c/p\u003e\n\u003cp\u003e下面把它拆得更细一点。\u003c/p\u003e\n","kind":"html","rawMarkdown":"如果让我现在从零重新开始，我会非常具体地这么做。\n\n首先，我会列出 5–10 个创作者，他们产出的内容风格和我想做的相近。\n\n为什么？\n\n因为我可以研究他们表现最好的内容，观察他们怎么增长，然后用自己的故事、观点和经历，做出一套属于自己的复制路径。\n\n我也可以看他们卖什么类型的产品，以此给自己的产品找灵感。所有优秀创作者在创作时都会有参考对象，它们能帮助你给自己正在做的事补上灵感和结构。\n\n然后，我会做两样东西：一个微型产品和一个微型服务。\n\n**微型产品**可以简单到有点傻。比如你写过一篇围绕已验证主题、很有价值的 newsletter，就把它改造成一个模板、prompt 或书面指南，帮助别人真正落地。我会只收大约 19 美元。因为一开始受众还小，微型产品的目标并不是立刻赚很多钱。\n\n**微型服务**则可以是一组大约 4 次的一对一 coaching call，帮助客户解决一个与你平时内容有关的问题。我会定价 500–1000 美元。\n\n当然，也可以只卖一次单独咨询，但那样价格不容易上去，而且坦白说，对客户本身的价值也没那么高。直接多包含几次通话并不会增加太多额外销售工作，却能带来更多收入。\n\n这样一来，我真正要控制的就只有两个杠杆：持续写经过验证的社交内容来增长受众，以及每天推广一次产品或服务。\n\n这时，我就开始从现实世界获得直接反馈。\n\n如果社交媒体不增长、也赚不到钱，那就是现实在告诉我：当前行为不对，或者我漏掉了某些东西。于是我需要继续学习，每天尝试不同策略，不断迭代。\n\n下面把它拆得更细一点。","sourceFormat":"markdown"},"note:sha256:081a7c9182f26a9942568c2a122cd76f7da329b3d0d2fc6275a66d8a3f030c59":{"blocks":[{"children":[],"kind":"leaf","title":"现在，你已经开始用社交媒体获取流量。"},{"children":[],"kind":"leaf","title":"下一步，需要一个地方证明自己的能力。"},{"children":[],"kind":"leaf","title":"因为再次强调，社交媒体主要负责抓住注意力，面对的是非常宽泛的人群。那些想了解更多的人，才会进入你的邮件名单里被进一步培养。"},{"children":[],"kind":"leaf","title":"几乎所有头部创作者都这么做。Email 离死亡还远得很。只有没真正参与这场游戏的人才会觉得它已经没用了。"},{"children":[],"kind":"leaf","title":"你需要一个地方，可以直接向一批已经感兴趣的潜在客户推广产品或服务——而你大部分收入最终会在这里发生。"},{"children":[],"kind":"leaf","title":"最适合承载这件事的，是长内容。"},{"children":[],"kind":"leaf","title":"换句话说，你需要 newsletter。"},{"children":[],"kind":"leaf","title":"为什么？"},{"children":[],"kind":"leaf","title":"我很喜欢“一短一长”的组合：一个短内容平台，加一个长内容平台；如果你选的是 Substack，也可以把两者放在同一个平台里。"},{"children":[{"title":"你需要音频和视频设备；"},{"title":"你需要同时掌握音频、视频和相当多的社交媒体能力；"},{"title":"最后你仍然得建立邮箱名单，才能在社交媒体之外有一个可以持续直接沟通的地方。"}],"kind":"section","title":"你当然可以用播客或 YouTube 频道替代 newsletter，但这样也有几个问题"},{"children":[],"kind":"leaf","title":"如果你在 Eden Store 里用一个产品做 lead magnet——作者称其为“唯一能创建带 AI 的课程或数字产品的地方”——Eden 会自动把这些用户导入你的 Substack、Kit 或 Beehiiv 列表。"},{"children":[],"kind":"leaf","title":"不过，Eden 也提供 newsletters 和 sequences。如果你想把 newsletter 订阅者导到 Substack，可以这样做；也可以直接把免费下载者或购买者放进培养序列里，这样就不一定需要另建一个订阅系统。"},{"children":[],"kind":"leaf","title":"如果你愿意，也可以直接在 Eden 托管付费或免费 newsletter。"}],"html":"\u003cp\u003e现在，你已经开始用社交媒体获取流量。\u003c/p\u003e\n\u003cp\u003e下一步，需要一个地方证明自己的能力。\u003c/p\u003e\n\u003cp\u003e因为再次强调，社交媒体主要负责抓住注意力，面对的是非常宽泛的人群。那些想了解更多的人，才会进入你的邮件名单里被进一步培养。\u003c/p\u003e\n\u003cp\u003e几乎所有头部创作者都这么做。Email 离死亡还远得很。只有没真正参与这场游戏的人才会觉得它已经没用了。\u003c/p\u003e\n\u003cp\u003e你需要一个地方，可以直接向一批已经感兴趣的潜在客户推广产品或服务——而你大部分收入最终会在这里发生。\u003c/p\u003e\n\u003cp\u003e最适合承载这件事的，是长内容。\u003c/p\u003e\n\u003cp\u003e换句话说，你需要 newsletter。\u003c/p\u003e\n\u003cp\u003e为什么？\u003c/p\u003e\n\u003cp\u003e我很喜欢“一短一长”的组合：一个短内容平台，加一个长内容平台；如果你选的是 Substack，也可以把两者放在同一个平台里。\u003c/p\u003e\n\u003cp\u003e你\u003cem\u003e当然可以\u003c/em\u003e用播客或 YouTube 频道替代 newsletter，但这样也有几个问题：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你需要音频和视频设备；\u003c/li\u003e\n\u003cli\u003e你需要同时掌握音频、视频和相当多的社交媒体能力；\u003c/li\u003e\n\u003cli\u003e最后你仍然得建立邮箱名单，才能在社交媒体之外有一个可以持续直接沟通的地方。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e如果你在 \u003ca href=\"https://eden.so/features/store\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eEden Store\u003c/a\u003e 里用一个产品做 lead magnet——作者称其为“唯一能创建带 AI 的课程或数字产品的地方”——Eden 会自动把这些用户导入你的 Substack、Kit 或 Beehiiv 列表。\u003c/p\u003e\n\u003cp\u003e不过，Eden 也提供 newsletters 和 sequences。如果你想把 newsletter 订阅者导到 Substack，可以这样做；也可以直接把免费下载者或购买者放进培养序列里，这样就不一定需要另建一个订阅系统。\u003c/p\u003e\n\u003cp\u003e如果你愿意，也可以直接在 Eden 托管付费或免费 newsletter。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"现在，你已经开始用社交媒体获取流量。\n\n下一步，需要一个地方证明自己的能力。\n\n因为再次强调，社交媒体主要负责抓住注意力，面对的是非常宽泛的人群。那些想了解更多的人，才会进入你的邮件名单里被进一步培养。\n\n几乎所有头部创作者都这么做。Email 离死亡还远得很。只有没真正参与这场游戏的人才会觉得它已经没用了。\n\n你需要一个地方，可以直接向一批已经感兴趣的潜在客户推广产品或服务——而你大部分收入最终会在这里发生。\n\n最适合承载这件事的，是长内容。\n\n换句话说，你需要 newsletter。\n\n为什么？\n\n我很喜欢“一短一长”的组合：一个短内容平台，加一个长内容平台；如果你选的是 Substack，也可以把两者放在同一个平台里。\n\n你*当然可以*用播客或 YouTube 频道替代 newsletter，但这样也有几个问题：\n\n- 你需要音频和视频设备；\n- 你需要同时掌握音频、视频和相当多的社交媒体能力；\n- 最后你仍然得建立邮箱名单，才能在社交媒体之外有一个可以持续直接沟通的地方。\n\n如果你在 [Eden Store](https://eden.so/features/store) 里用一个产品做 lead magnet——作者称其为“唯一能创建带 AI 的课程或数字产品的地方”——Eden 会自动把这些用户导入你的 Substack、Kit 或 Beehiiv 列表。\n\n不过，Eden 也提供 newsletters 和 sequences。如果你想把 newsletter 订阅者导到 Substack，可以这样做；也可以直接把免费下载者或购买者放进培养序列里，这样就不一定需要另建一个订阅系统。\n\n如果你愿意，也可以直接在 Eden 托管付费或免费 newsletter。","sourceFormat":"markdown"},"note:sha256:1cfdbc016191ed68c7d11e4c949c05cdb32ecd3b1bc4da0b8bbaa31d64384609":{"blocks":[{"children":[{"title":"1. 进入 Store → Products，点击 **New product**，选择 **Coaching**。"},{"title":"2. 设定价格（500–1000 美元）。"},{"title":"3. 在 Coaching 步骤中，把 **Calls included** 设为 4（如果包含 kickoff call，就设为 5），选择通话时长，并将 coaching 周期设为 4 周。"},{"title":"4. 在 **Booking** 下粘贴你的预约链接。"},{"title":"5. 在 **Applications** 下打开 **People apply first**。这就是你的问卷（后面会详细讲）。此时产品页面会显示 Apply，而不是 Buy。"},{"title":"6. 在 **Before the first call** 下添加 onboarding 问题。客户会在预约前回答。"},{"title":"7. 写一个简短页面，说明痛点、目标结果，以及 4 次通话各自覆盖什么。连接 Stripe，发布，再把它加到 link-in-bio 页面。"}],"kind":"section","title":"在 Eden 中，微型服务对应一个 Coaching product。作者称整个设置大约需要 10 分钟。"},{"children":[],"kind":"leaf","title":"每一个客户都会有自己的私密空间，用来放通话和资源，因此你不需要在 Google Docs 和邮件线程之间来回切换。"},{"bodyBlocks":[{"kind":"paragraph","text":"怎么吸引真正愿意付钱的人？"}],"children":[],"kind":"compound_leaf","lead":"现在的问题变成："}],"html":"\u003cp\u003e在 Eden 中，微型服务对应一个 Coaching product。作者称整个设置大约需要 10 分钟。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e进入 Store → Products，点击 \u003cstrong\u003eNew product\u003c/strong\u003e，选择 \u003cstrong\u003eCoaching\u003c/strong\u003e。\u003c/li\u003e\n\u003cli\u003e设定价格（500–1000 美元）。\u003c/li\u003e\n\u003cli\u003e在 Coaching 步骤中，把 \u003cstrong\u003eCalls included\u003c/strong\u003e 设为 4（如果包含 kickoff call，就设为 5），选择通话时长，并将 coaching 周期设为 4 周。\u003c/li\u003e\n\u003cli\u003e在 \u003cstrong\u003eBooking\u003c/strong\u003e 下粘贴你的预约链接。\u003c/li\u003e\n\u003cli\u003e在 \u003cstrong\u003eApplications\u003c/strong\u003e 下打开 \u003cstrong\u003ePeople apply first\u003c/strong\u003e。这就是你的问卷（后面会详细讲）。此时产品页面会显示 Apply，而不是 Buy。\u003c/li\u003e\n\u003cli\u003e在 \u003cstrong\u003eBefore the first call\u003c/strong\u003e 下添加 onboarding 问题。客户会在预约前回答。\u003c/li\u003e\n\u003cli\u003e写一个简短页面，说明痛点、目标结果，以及 4 次通话各自覆盖什么。连接 Stripe，发布，再把它加到 link-in-bio 页面。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e每一个客户都会有自己的私密空间，用来放通话和资源，因此你不需要在 Google Docs 和邮件线程之间来回切换。\u003c/p\u003e\n\u003cp\u003e现在的问题变成：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e怎么吸引真正愿意付钱的人？\u003c/strong\u003e\u003c/p\u003e\n","kind":"structured","rawMarkdown":"在 Eden 中，微型服务对应一个 Coaching product。作者称整个设置大约需要 10 分钟。\n\n1. 进入 Store → Products，点击 **New product**，选择 **Coaching**。\n2. 设定价格（500–1000 美元）。\n3. 在 Coaching 步骤中，把 **Calls included** 设为 4（如果包含 kickoff call，就设为 5），选择通话时长，并将 coaching 周期设为 4 周。\n4. 在 **Booking** 下粘贴你的预约链接。\n5. 在 **Applications** 下打开 **People apply first**。这就是你的问卷（后面会详细讲）。此时产品页面会显示 Apply，而不是 Buy。\n6. 在 **Before the first call** 下添加 onboarding 问题。客户会在预约前回答。\n7. 写一个简短页面，说明痛点、目标结果，以及 4 次通话各自覆盖什么。连接 Stripe，发布，再把它加到 link-in-bio 页面。\n\n每一个客户都会有自己的私密空间，用来放通话和资源，因此你不需要在 Google Docs 和邮件线程之间来回切换。\n\n现在的问题变成：\n\n**怎么吸引真正愿意付钱的人？**","sourceFormat":"markdown"},"note:sha256:1e7af9f37faa992a8919832037e7108597914148e9414d798b05d19ccb5ef0ba":{"html":"\u003cp\u003e不要把事情想复杂。\u003c/p\u003e\n\u003cp\u003e现在还不用纠结到底做哪种产品或服务。\u003c/p\u003e\n\u003cp\u003e先聚焦在\u003cstrong\u003e痛点（pain）、热爱（passion）或过程（process）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e你生活里解决过什么痛点，而别人也能从这个解决方案中受益？想想健康、财富、关系和幸福。你克服过什么问题？再小都算。\u003c/p\u003e\n\u003cp\u003e你有什么真正热爱的兴趣，能够提升自己的生活质量，也可能提升别人的生活质量？比如哲学，显然就能影响一个人的生活。Paul Musso 就把自己的付费 Substack 做成了一所哲学学校，而且经营得非常不错。任何东西都有可能变现。我不想听那种“这怎么可能赚钱”的外行式反对意见。\u003c/p\u003e\n\u003cp\u003e你有什么固定流程或习惯，能够稳定带来某个结果？可能是一套早晨效率流程、一套写作系统、一种营养方法，或者任何哪怕只比常见做法独特一点的东西。\u003c/p\u003e\n\u003cp\u003e再说一次，别想太多。\u003c/p\u003e\n\u003cp\u003e我们现在只需要一个起点。雕塑从来不是一开始就有完整形状，你先拿到的是一块粗糙的石头，再慢慢把它打磨出来。\u003c/p\u003e\n","kind":"html","rawMarkdown":"不要把事情想复杂。\n\n现在还不用纠结到底做哪种产品或服务。\n\n先聚焦在**痛点（pain）、热爱（passion）或过程（process）**。\n\n你生活里解决过什么痛点，而别人也能从这个解决方案中受益？想想健康、财富、关系和幸福。你克服过什么问题？再小都算。\n\n你有什么真正热爱的兴趣，能够提升自己的生活质量，也可能提升别人的生活质量？比如哲学，显然就能影响一个人的生活。Paul Musso 就把自己的付费 Substack 做成了一所哲学学校，而且经营得非常不错。任何东西都有可能变现。我不想听那种“这怎么可能赚钱”的外行式反对意见。\n\n你有什么固定流程或习惯，能够稳定带来某个结果？可能是一套早晨效率流程、一套写作系统、一种营养方法，或者任何哪怕只比常见做法独特一点的东西。\n\n再说一次，别想太多。\n\n我们现在只需要一个起点。雕塑从来不是一开始就有完整形状，你先拿到的是一块粗糙的石头，再慢慢把它打磨出来。","sourceFormat":"markdown"},"note:sha256:25be26572d78e31aecfad3ff1a7a63b4b80a9663bf08c438ec36e6ab5a6768c8":{"blocks":[{"children":[{"title":"你的内容让他们觉得有趣、学到东西，或受到启发；"},{"title":"你谈论的是他们本来就感兴趣的东西；"},{"title":"他们相信你能帮助自己改变生活。"}],"kind":"section","title":"对于一个以“转变”为核心的个人品牌来说——而不是表情包账号或 TikTok 舞者——别人关注你通常有 3 个原因"},{"children":[],"kind":"leaf","title":"前两个通常会随着持续发布和写出高质量内容自然发生。"},{"children":[],"kind":"leaf","title":"但第三个影响最大。"},{"children":[],"kind":"leaf","title":"沿用前面的地图比喻，这张地图上的“北极星”就是你的使命。"},{"children":[],"kind":"leaf","title":"它是你想帮助受众抵达的目的地，是你正在带他们走过的一段有意思的旅程，也是他们想摆脱当前生活状态的那条出路。"},{"bodyBlocks":[{"kind":"paragraph","text":"A 点： 用一句话写出你的读者想逃离什么样的生活。他们正困在哪里？这就是你的反愿景（anti-vision），也是你的品牌所反对的东西——那个“敌人”。"}],"children":[],"kind":"compound_leaf","lead":"在纸的两端分别画两个点："},{"children":[],"kind":"leaf","title":"B 点： 用一句话写出你想帮助他们走向什么样的生活。当他们真正“做到”以后，生活会是什么样？这就是你的愿景，也是目的地。"},{"children":[],"kind":"leaf","title":"这就是你的品牌使命：尽可能帮助更多人从 A 点走到 B 点。"},{"children":[],"kind":"leaf","title":"为什么这很重要？"},{"children":[],"kind":"leaf","title":"因为你的内容地图里，所有东西都应该发生在这两个点之间。A 点是读者现在的位置，B 点是你要帮助他们抵达的位置。你写的每一个想法，都是这段路上的一步。"},{"children":[],"kind":"leaf","title":"这也是你解决“我兴趣太多了”这个问题的方法。你可能同时关心哲学、健身、商业和心理学。单看很散，但如果它们都能帮助一个人从注意力散乱的生活，走向更有意识的自我掌控，那么这四个主题就被同一条使命串起来了——当然，你自己的使命可以完全不同。"},{"children":[],"kind":"leaf","title":"现在，把你的使命、A 点和 B 点写在纸的最上方，接下来开始填地图。"}],"html":"\u003cp\u003e对于一个以“转变”为核心的个人品牌来说——而不是表情包账号或 TikTok 舞者——别人关注你通常有 3 个原因：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你的内容让他们觉得有趣、学到东西，或受到启发；\u003c/li\u003e\n\u003cli\u003e你谈论的是他们本来就感兴趣的东西；\u003c/li\u003e\n\u003cli\u003e他们相信你能帮助自己改变生活。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e前两个通常会随着持续发布和写出高质量内容自然发生。\u003c/p\u003e\n\u003cp\u003e但第三个影响最大。\u003c/p\u003e\n\u003cp\u003e沿用前面的地图比喻，这张地图上的“北极星”就是你的\u003cstrong\u003e使命\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e它是你想帮助受众抵达的目的地，是你正在带他们走过的一段有意思的旅程，也是他们想摆脱当前生活状态的那条出路。\u003c/p\u003e\n\u003cp\u003e在纸的两端分别画两个点：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA 点：\u003c/strong\u003e 用一句话写出你的读者想逃离什么样的生活。他们正困在哪里？这就是你的反愿景（anti-vision），也是你的品牌所反对的东西——那个“敌人”。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eB 点：\u003c/strong\u003e 用一句话写出你想帮助他们走向什么样的生活。当他们真正“做到”以后，生活会是什么样？这就是你的愿景，也是目的地。\u003c/p\u003e\n\u003cp\u003e这就是你的品牌使命：尽可能帮助更多人从 A 点走到 B 点。\u003c/p\u003e\n\u003cp\u003e为什么这很重要？\u003c/p\u003e\n\u003cp\u003e因为你的内容地图里，所有东西都应该发生在这两个点之间。A 点是读者现在的位置，B 点是你要帮助他们抵达的位置。你写的每一个想法，都是这段路上的一步。\u003c/p\u003e\n\u003cp\u003e这也是你解决“我兴趣太多了”这个问题的方法。你可能同时关心哲学、健身、商业和心理学。单看很散，但如果它们都能帮助一个人从注意力散乱的生活，走向更有意识的自我掌控，那么这四个主题就被同一条使命串起来了——当然，你自己的使命可以完全不同。\u003c/p\u003e\n\u003cp\u003e现在，把你的使命、A 点和 B 点写在纸的最上方，接下来开始填地图。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"对于一个以“转变”为核心的个人品牌来说——而不是表情包账号或 TikTok 舞者——别人关注你通常有 3 个原因：\n\n- 你的内容让他们觉得有趣、学到东西，或受到启发；\n- 你谈论的是他们本来就感兴趣的东西；\n- 他们相信你能帮助自己改变生活。\n\n前两个通常会随着持续发布和写出高质量内容自然发生。\n\n但第三个影响最大。\n\n沿用前面的地图比喻，这张地图上的“北极星”就是你的**使命**。\n\n它是你想帮助受众抵达的目的地，是你正在带他们走过的一段有意思的旅程，也是他们想摆脱当前生活状态的那条出路。\n\n在纸的两端分别画两个点：\n\n**A 点：** 用一句话写出你的读者想逃离什么样的生活。他们正困在哪里？这就是你的反愿景（anti-vision），也是你的品牌所反对的东西——那个“敌人”。\n\n**B 点：** 用一句话写出你想帮助他们走向什么样的生活。当他们真正“做到”以后，生活会是什么样？这就是你的愿景，也是目的地。\n\n这就是你的品牌使命：尽可能帮助更多人从 A 点走到 B 点。\n\n为什么这很重要？\n\n因为你的内容地图里，所有东西都应该发生在这两个点之间。A 点是读者现在的位置，B 点是你要帮助他们抵达的位置。你写的每一个想法，都是这段路上的一步。\n\n这也是你解决“我兴趣太多了”这个问题的方法。你可能同时关心哲学、健身、商业和心理学。单看很散，但如果它们都能帮助一个人从注意力散乱的生活，走向更有意识的自我掌控，那么这四个主题就被同一条使命串起来了——当然，你自己的使命可以完全不同。\n\n现在，把你的使命、A 点和 B 点写在纸的最上方，接下来开始填地图。","sourceFormat":"markdown"},"note:sha256:4736af40ce5122355fa6337fa00734283a368f393fa6c4d696fdec2cca8c02fb":{"blocks":[{"children":[{"title":"**筛掉只是随便看看的“轮胎踢客”（tire kickers）。** 你不想花一小时和一个从来没打算付钱的人通话。"},{"title":"**让人意识到自己的痛点。** 好问题会让一个人真正意识到自己卡得有多深，而这种觉察会让他更想获得帮助。"},{"title":"**降低压力。** “这是我的日历，来约一场销售电话”会让人有压力；“填一份简短表格，看看我能不能帮到你”就没那么强硬。很多安静但真的有兴趣的人，永远不会主动预约销售电话，却可能愿意先填问卷。"}],"kind":"section","title":"你的问卷就是一份简短申请表，它有 3 个作用"},{"bodyBlocks":[{"kind":"quote","text":"如果你正在为下面这些问题困扰： - [pain point] - [pain point] - [pain point] 请填写下面的问卷。如果我认为自己能帮到你，我会联系你，再问几个问题。"}],"children":[],"kind":"compound_leaf","lead":"表格最上面可以这样写："},{"children":[{"title":"你的社交媒体账号（很重要，因为你会通过它给对方发 DM）；"},{"title":"你现在做什么工作？"},{"title":"你在 [topic] 方面目前处于什么水平？（营收、健身水平、技能水平等）；"},{"title":"你希望在 [timeframe] 内达到什么状态？"},{"title":"你现在最困扰的是什么？（多选）；"},{"title":"为了得到 [result]，你已经尝试多久？"},{"title":"以 1–10 分衡量，你有多认真想得到 [result]？"},{"title":"如果我们彼此合适，你可以自己决定开始，还是还需要别人批准？"}],"kind":"section","title":"然后从下面选 5–8 个问题"},{"children":[],"kind":"leaf","title":"把“你现在最困扰的是什么？”做成多选题，选项直接写成你的 offer 正在解决的几种痛点。"},{"children":[],"kind":"leaf","title":"这是整张表最重要的问题。人们看着这些选项，会突然想到：“对，这说的不就是我吗？”"},{"children":[],"kind":"leaf","title":"它会替你完成一部分销售。"},{"children":[],"kind":"leaf","title":"在 Eden 里，这就是你在 Coaching product 中打开的 application。最多可以加 8 个问题，还可以标记某些回答意味着这个人不适合。所有申请都会进入 Store → Clients。"}],"html":"\u003cp\u003e你的问卷就是一份简短申请表，它有 3 个作用：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e筛掉只是随便看看的“轮胎踢客”（tire kickers）。\u003c/strong\u003e 你不想花一小时和一个从来没打算付钱的人通话。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e让人意识到自己的痛点。\u003c/strong\u003e 好问题会让一个人真正意识到自己卡得有多深，而这种觉察会让他更想获得帮助。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e降低压力。\u003c/strong\u003e “这是我的日历，来约一场销售电话”会让人有压力；“填一份简短表格，看看我能不能帮到你”就没那么强硬。很多安静但真的有兴趣的人，永远不会主动预约销售电话，却可能愿意先填问卷。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e表格最上面可以这样写：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e如果你正在为下面这些问题困扰：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e[pain point]\u003c/li\u003e\n\u003cli\u003e[pain point]\u003c/li\u003e\n\u003cli\u003e[pain point]\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e请填写下面的问卷。如果我认为自己能帮到你，我会联系你，再问几个问题。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e然后从下面选 5–8 个问题：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你的社交媒体账号（很重要，因为你会通过它给对方发 DM）；\u003c/li\u003e\n\u003cli\u003e你现在做什么工作？\u003c/li\u003e\n\u003cli\u003e你在 [topic] 方面目前处于什么水平？（营收、健身水平、技能水平等）；\u003c/li\u003e\n\u003cli\u003e你希望在 [timeframe] 内达到什么状态？\u003c/li\u003e\n\u003cli\u003e你现在最困扰的是什么？（多选）；\u003c/li\u003e\n\u003cli\u003e为了得到 [result]，你已经尝试多久？\u003c/li\u003e\n\u003cli\u003e以 1–10 分衡量，你有多认真想得到 [result]？\u003c/li\u003e\n\u003cli\u003e如果我们彼此合适，你可以自己决定开始，还是还需要别人批准？\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e把“你现在最困扰的是什么？”做成多选题，选项直接写成你的 offer 正在解决的几种痛点。\u003c/p\u003e\n\u003cp\u003e这是整张表最重要的问题。人们看着这些选项，会突然想到：“对，这说的不就是我吗？”\u003c/p\u003e\n\u003cp\u003e它会替你完成一部分销售。\u003c/p\u003e\n\u003cp\u003e在 Eden 里，这就是你在 Coaching product 中打开的 application。最多可以加 8 个问题，还可以标记某些回答意味着这个人不适合。所有申请都会进入 Store → Clients。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"你的问卷就是一份简短申请表，它有 3 个作用：\n\n- **筛掉只是随便看看的“轮胎踢客”（tire kickers）。** 你不想花一小时和一个从来没打算付钱的人通话。\n- **让人意识到自己的痛点。** 好问题会让一个人真正意识到自己卡得有多深，而这种觉察会让他更想获得帮助。\n- **降低压力。** “这是我的日历，来约一场销售电话”会让人有压力；“填一份简短表格，看看我能不能帮到你”就没那么强硬。很多安静但真的有兴趣的人，永远不会主动预约销售电话，却可能愿意先填问卷。\n\n表格最上面可以这样写：\n\n\u003e 如果你正在为下面这些问题困扰：\n\u003e - [pain point]\n\u003e - [pain point]\n\u003e - [pain point]\n\u003e\n\u003e 请填写下面的问卷。如果我认为自己能帮到你，我会联系你，再问几个问题。\n\n然后从下面选 5–8 个问题：\n\n- 你的社交媒体账号（很重要，因为你会通过它给对方发 DM）；\n- 你现在做什么工作？\n- 你在 [topic] 方面目前处于什么水平？（营收、健身水平、技能水平等）；\n- 你希望在 [timeframe] 内达到什么状态？\n- 你现在最困扰的是什么？（多选）；\n- 为了得到 [result]，你已经尝试多久？\n- 以 1–10 分衡量，你有多认真想得到 [result]？\n- 如果我们彼此合适，你可以自己决定开始，还是还需要别人批准？\n\n把“你现在最困扰的是什么？”做成多选题，选项直接写成你的 offer 正在解决的几种痛点。\n\n这是整张表最重要的问题。人们看着这些选项，会突然想到：“对，这说的不就是我吗？”\n\n它会替你完成一部分销售。\n\n在 Eden 里，这就是你在 Coaching product 中打开的 application。最多可以加 8 个问题，还可以标记某些回答意味着这个人不适合。所有申请都会进入 Store → Clients。","sourceFormat":"markdown"},"note:sha256:4fa9b055daf835c7822d6c9d58d2d1692ca20549774cebef63a6c2501fb7031d":{"blocks":[{"children":[],"kind":"leaf","title":"先写出 2–3 个宽泛主题。把它们想成地图上的几块主要“领地”。"},{"children":[],"kind":"leaf","title":"这些主题应该足够宽，比你第一反应想到的还要更宽一些。"},{"children":[],"kind":"leaf","title":"为什么？"},{"children":[],"kind":"leaf","title":"人们在社交媒体上并不是带着明确问题去搜索某个具体知识点。他们不会像 Google 那样搜“如何优化我早晨的皮质醇反应”。他们是在刷，是在消费任何能抓住注意力的东西。"},{"children":[],"kind":"leaf","title":"社交媒体的核心不是“价值”，而是注意力。真正承载价值的是你后面把他们引向的产品。如果一开始的话题过窄，那么真正可能从你观点中受益的人里，有 95% 甚至根本看不到你。"},{"children":[],"kind":"leaf","title":"这也是我的内容理念和很多人不一样的地方：我先用较宽的话题吸引更广泛的人群，再通过不同的产品去服务其中更具体的人。"},{"children":[],"kind":"leaf","title":"“垂直做窄”当然完全可行，但我想保留谈论自己所有兴趣的自由，所以必须找到另一套方法。"},{"bodyBlocks":[{"kind":"paragraph","text":"如果你对“为服务型企业获取潜在客户”感兴趣，那么宽主题可以是“在线商业”。"}],"children":[],"kind":"compound_leaf","lead":"举几个把话题放宽的例子："},{"children":[],"kind":"leaf","title":"如果你对“构建 AI 自动化工作流”感兴趣，那么宽主题可以是“人工智能”。"},{"children":[],"kind":"leaf","title":"如果你对“纯肉饮食”感兴趣，那么宽主题可以是“健康”或“营养”。"},{"children":[],"kind":"leaf","title":"先用一个较宽的话题吸引那些希望改善生活某个目标的人，然后再在之后给出他们真正会提出的具体内容。那时候你再创建产品、免费指南等具体承接物。"},{"children":[{"title":"如果你现在只有 1–2 个宽主题，也完全没问题，就从那里开始。你可以一路迭代，我自己都已经记不清转过多少次方向。"},{"title":"如果你完全不知道写什么，就回想自己平时主动消费的内容，或者真正塑造过你的书。哪些东西你会因为纯粹觉得有意思而去读、看、听？从那里开始。"},{"title":"最好的主题，往往位于**你真正关心的东西**和**能够帮助别人改善生活的东西**之间。我敢保证，你感兴趣的任何领域里，都已经有人在赚钱。你的任务不是发明一个全新品类，而是把自己的视角和观点带进一个已经存在的品类。"}],"kind":"section","title":"几点补充"},{"children":[],"kind":"leaf","title":"现在我们已经有“领地”，接下来需要“城市”。"}],"html":"\u003cp\u003e先写出 2–3 个宽泛主题。把它们想成地图上的几块主要“领地”。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT4agvtbEAQ6XPP?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e这些主题应该足够宽，比你第一反应想到的还要更宽一些。\u003c/p\u003e\n\u003cp\u003e为什么？\u003c/p\u003e\n\u003cp\u003e人们在社交媒体上并不是带着明确问题去\u003cem\u003e搜索\u003c/em\u003e某
