些东西可以顺利迁移。\n\n过去，这些通常是六个月的工程项目，所以很少有人会做。\n\n现在，一个营销工程师可能一周就能上线一个粗糙但可用的版本。买家会收藏它，并在真正准备购买时回来。","sourceFormat":"markdown"},"note:sha256:23aa12860f1f37767b30bae38f5465c74f9d370b7a172187f879756adbf12d2e":{"html":"\u003cp\u003e基础系统能够自行运行以后，真正有意思的部分才开始。\u003c/p\u003e\n","kind":"html","rawMarkdown":"基础系统能够自行运行以后，真正有意思的部分才开始。","sourceFormat":"markdown"},"note:sha256:24246004fb5942dd05b1a8f60423068fde8638d09f03a7d91dabf4ad28429e53":{"html":"\u003cp\u003e这一半更新，但其实比很多人想象中更容易学。\u003c/p\u003e\n\u003cp\u003e你需要：\u003c/p\u003e\n","kind":"html","rawMarkdown":"这一半更新，但其实比很多人想象中更容易学。\n\n你需要：","sourceFormat":"markdown"},"note:sha256:27f85ea19da0832e07b16d327fd58f8f3627bb16b05e4b84e34f62699d03f25c":{"html":"\u003cp\u003e每家公司都坐在一堆几乎没被真正利用的金矿上（我知道这听起来难以置信，但确实如此）。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCehtAbwAAOKjs?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e销售每周都会听到同样五种异议；客服非常清楚哪些承诺最容易导致退款；创始人对品类有很多鲜明观点，却只存在脑子里和几段播客里；分析团队知道哪些页面带来的客户留存最好。\u003c/p\u003e\n\u003cp\u003e这些信息散落在不同工具里，由不同的人掌握，往往一个季度才有机会真正进入一次 campaign。\u003c/p\u003e\n","kind":"html","rawMarkdown":"每家公司都坐在一堆几乎没被真正利用的金矿上（我知道这听起来难以置信，但确实如此）。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCehtAbwAAOKjs?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n销售每周都会听到同样五种异议；客服非常清楚哪些承诺最容易导致退款；创始人对品类有很多鲜明观点，却只存在脑子里和几段播客里；分析团队知道哪些页面带来的客户留存最好。\n\n这些信息散落在不同工具里，由不同的人掌握，往往一个季度才有机会真正进入一次 campaign。","sourceFormat":"markdown"},"note:sha256:2c0142fd8d2a330356a2483d4fc40fa7554fa0c483f971bab9a55c66547a5a52":{"html":"\u003cp\u003e然后把报告和你自己对这些通话的记忆放在一起对照。\u003c/p\u003e\n\u003cp\u003e第一版可能只有大约 70% 正确。它也许会过度放大某个特别健谈的客户，或者用营销术语给客户群体起名字。\u003c/p\u003e\n\u003cp\u003e每发现一个错误，就修正指令，并把这次修正写进 \u003ccode\u003edecisions/\u003c/code\u003e，让它下次还记得。\u003c/p\u003e\n\u003cp\u003e三四轮之后，它读取销售通话的质量可能会超过团队里的大多数人。\u003c/p\u003e\n","kind":"html","rawMarkdown":"然后把报告和你自己对这些通话的记忆放在一起对照。\n\n第一版可能只有大约 70% 正确。它也许会过度放大某个特别健谈的客户，或者用营销术语给客户群体起名字。\n\n每发现一个错误，就修正指令，并把这次修正写进 `decisions/`，让它下次还记得。\n\n三四轮之后，它读取销售通话的质量可能会超过团队里的大多数人。","sourceFormat":"markdown"},"note:sha256:31550fbaf89cc2b11dfe6fa8d40c084aca2404b45db714482347ca3527758c70":{"html":"\u003cp\u003e先把 10 个 hook 做成 organic TikTok、Reels 或 X post。\u003c/p\u003e\n\u003cp\u003e观察 algorithm 会把哪些推起来，再把预算投到 winner 上。\u003c/p\u003e\n\u003cp\u003e你先免费知道什么有效，然后 ad budget 只花在已经证明过的 idea 上。\u003c/p\u003e\n","kind":"html","rawMarkdown":"先把 10 个 hook 做成 organic TikTok、Reels 或 X post。\n\n观察 algorithm 会把哪些推起来，再把预算投到 winner 上。\n\n你先免费知道什么有效，然后 ad budget 只花在已经证明过的 idea 上。","sourceFormat":"markdown"},"note:sha256:3202d42a24dcd2bc57d16801516603332ac65bf2ad6189e3db4d28f794899a4f":{"html":"\u003cp\u003e等第一个 Agent 稳定后，再一个一个加入其它 Agent。每个 Agent 都有自己位于 \u003ccode\u003eworkflows/\u003c/code\u003e 下的文件夹、自己的 instructions 和自己的 schedule。\u003c/p\u003e\n","kind":"html","rawMarkdown":"等第一个 Agent 稳定后，再一个一个加入其它 Agent。每个 Agent 都有自己位于 `workflows/` 下的文件夹、自己的 instructions 和自己的 schedule。","sourceFormat":"markdown"},"note:sha256:3360848486d8c7311cc1471429dabdeff25d01531f12c7d5e1bc4332a89455d0":{"blocks":[{"children":[],"kind":"leaf","title":"搜索 Agent 找出人们在购买前最常问的问题，并为每个问题做出互联网上最好的页面。"},{"children":[{"title":"1. Search Console 数据；"},{"title":"2. 销售通话里出现的问题；"},{"title":"3. 当你向 ChatGPT、Claude 和 Perplexity 询问所在品类时，它们给出的回答。"}],"kind":"section","title":"给它三个信息源"},{"children":[],"kind":"leaf","title":"第三个来源很新，而且被严重低估了。"},{"children":[],"kind":"leaf","title":"每周都向这些 AI engine 提问你的买家会问的问题，并记录它们推荐哪些公司和来源。这样你能看到模型信任什么，也能看到你自己在哪里“不可见”。"},{"children":[],"kind":"leaf","title":"然后，做出比现有页面更有用的内容，因为 AI search 更偏爱真正有用的页面，而不只是“最优化”的页面。"},{"children":[],"kind":"leaf","title":"比如，一家商用厨房设备供应商可以写一份“如何开第一家餐厅”的指南，再加一个计算器，根据空间和预算推荐适合的设备。"},{"children":[],"kind":"leaf","title":"这样的页面既能获得排名，也可能被 AI engine 引用，还会被真正的买家收藏，等到准备购买时再回来。"},{"children":[],"kind":"leaf","title":"Agent 可以在一个下午把这个 calculator 写出来，并发布到 Next.js + Vercel；如果追求速度，也可以用 Framer。"}],"html":"\u003cp\u003e搜索 Agent 找出人们在购买前最常问的问题，并为每个问题做出互联网上最好的页面。\u003c/p\u003e\n\u003cp\u003e给它三个信息源：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eSearch Console 数据；\u003c/li\u003e\n\u003cli\u003e销售通话里出现的问题；\u003c/li\u003e\n\u003cli\u003e当你向 ChatGPT、Claude 和 Perplexity 询问所在品类时，它们给出的回答。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e第三个来源很新，而且被严重低估了。\u003c/p\u003e\n\u003cp\u003e每周都向这些 AI engine 提问你的买家会问的问题，并记录它们推荐哪些公司和来源。这样你能看到模型信任什么，也能看到你自己在哪里“不可见”。\u003c/p\u003e\n\u003cp\u003e然后，做出比现有页面更有用的内容，因为 AI search 更偏爱真正有用的页面，而不只是“最优化”的页面。\u003c/p\u003e\n\u003cp\u003e比如，一家商用厨房设备供应商可以写一份“如何开第一家餐厅”的指南，再加一个计算器，根据空间和预算推荐适合的设备。\u003c/p\u003e\n\u003cp\u003e这样的页面既能获得排名，也可能被 AI engine 引用，还会被真正的买家收藏，等到准备购买时再回来。\u003c/p\u003e\n\u003cp\u003eAgent 可以在一个下午把这个 calculator 写出来，并发布到 Next.js + Vercel；如果追求速度，也可以用 Framer。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"搜索 Agent 找出人们在购买前最常问的问题，并为每个问题做出互联网上最好的页面。\n\n给它三个信息源：\n\n1. Search Console 数据；\n2. 销售通话里出现的问题；\n3. 当你向 ChatGPT、Claude 和 Perplexity 询问所在品类时，它们给出的回答。\n\n第三个来源很新，而且被严重低估了。\n\n每周都向这些 AI engine 提问你的买家会问的问题，并记录它们推荐哪些公司和来源。这样你能看到模型信任什么，也能看到你自己在哪里“不可见”。\n\n然后，做出比现有页面更有用的内容，因为 AI search 更偏爱真正有用的页面，而不只是“最优化”的页面。\n\n比如，一家商用厨房设备供应商可以写一份“如何开第一家餐厅”的指南，再加一个计算器，根据空间和预算推荐适合的设备。\n\n这样的页面既能获得排名，也可能被 AI engine 引用，还会被真正的买家收藏，等到准备购买时再回来。\n\nAgent 可以在一个下午把这个 calculator 写出来，并发布到 Next.js + Vercel；如果追求速度，也可以用 Framer。","sourceFormat":"markdown"},"note:sha256:38008495d41a236c4953f78cadbe6ed64e429c2efad02d34ccd51ddc0363527b":{"html":"\u003cp\u003e这条 campaign 获得 ID：\u003ccode\u003eBK014\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e从这里开始，所有内容都带着它。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这条 campaign 获得 ID：`BK014`。\n\n从这里开始，所有内容都带着它。","sourceFormat":"markdown"},"note:sha256:3ad318bc60627958f82c4fdada87afd2888bb15c33795e4f096ed24507549a0f":{"html":"\u003cp\u003e所有系统先从 read-only access 开始。\u003c/p\u003e\n\u003cp\u003e一个能读取 CRM 的 Agent，从第一天就已经很有用；一个能修改 CRM 的 Agent，则应该随着可靠性逐步“赢得”这个权限。\u003c/p\u003e\n","kind":"html","rawMarkdown":"所有系统先从 read-only access 开始。\n\n一个能读取 CRM 的 Agent，从第一天就已经很有用；一个能修改 CRM 的 Agent，则应该随着可靠性逐步“赢得”这个权限。","sourceFormat":"markdown"},"note:sha256:3b21958c415766795500405763a8d4b11db005d38618456890690037fd03bec2":{"html":"\u003cp\u003ePaid 往往最吸引注意力，但 organic social 才是营销工程师悄悄建立不公平优势的地方。\u003c/p\u003e\n\u003cp\u003e它是免费 distribution，也是目前最便宜的 creative testing lab。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Paid 往往最吸引注意力，但 organic social 才是营销工程师悄悄建立不公平优势的地方。\n\n它是免费 distribution，也是目前最便宜的 creative testing lab。","sourceFormat":"markdown"},"note:sha256:3bc69c97a4aa767ea7259711ef2a78a6fcb97bf83c4016cf7a69e9899663cbf1":{"html":"\u003cp\u003e只有当你改变输入，系统才会真正变聪明。\u003c/p\u003e\n\u003cp\u003e如果你拒绝一条广告，是因为它吸引来的公司规模太小，就更新 \u003ccode\u003ecustomer-fit.md\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e如果一个 prospect 误读了 offer，就加入相应检查。\u003c/p\u003e\n\u003cp\u003e维护一份 experiment log，记录测试了什么、为什么测、发生了什么、下一步怎么做。\u003c/p\u003e\n\u003cp\u003e还要为每个 Agent 保存 10 个 example input，以及对应的 expected output。每次修改 instruction 后，把这组 example 重新跑一遍，这样你能立刻知道系统是不是变差了。\u003c/p\u003e\n","kind":"html","rawMarkdown":"只有当你改变输入，系统才会真正变聪明。\n\n如果你拒绝一条广告，是因为它吸引来的公司规模太小，就更新 `customer-fit.md`。\n\n如果一个 prospect 误读了 offer，就加入相应检查。\n\n维护一份 experiment log，记录测试了什么、为什么测、发生了什么、下一步怎么做。\n\n还要为每个 Agent 保存 10 个 example input，以及对应的 expected output。每次修改 instruction 后，把这组 example 重新跑一遍，这样你能立刻知道系统是不是变差了。","sourceFormat":"markdown"},"note:sha256:3e9076fc92c31f2c4173370b377e6de6d57d0343f3cb6420f682efe6d8da02dc":{"html":"\u003cp\u003e如果是我这周从零开始，我会这样做：\u003c/p\u003e\n\u003cp\u003e如果你是 marketer：构建客户语言 Agent，并用最近 20 次销售通话来跑它。\u003c/p\u003e\n\u003cp\u003e如果你是 engineer：参加 5 次销售通话，然后为一个具体 customer segment 做一个 calculator。\u003c/p\u003e\n\u003cp\u003e如果你是 founder：这个周末留出两个小时写 \u003ccode\u003efounder-opinions.md\u003c/code\u003e，因为你之后构建的每一个 Agent 都会因此变得更锋利。\u003c/p\u003e\n","kind":"html","rawMarkdown":"如果是我这周从零开始，我会这样做：\n\n如果你是 marketer：构建客户语言 Agent，并用最近 20 次销售通话来跑它。\n\n如果你是 engineer：参加 5 次销售通话，然后为一个具体 customer segment 做一个 calculator。\n\n如果你是 founder：这个周末留出两个小时写 `founder-opinions.md`，因为你之后构建的每一个 Agent 都会因此变得更锋利。","sourceFormat":"markdown"},"note:sha256:42e177f75f305376af5bfd4e0edf181a7f1791eb65182b999b89511a27fe9018":{"html":"\u003cp\u003e下面看看整套系统协同起来会是什么样。\u003c/p\u003e\n\u003cp\u003e假设一家 bookkeeping firm 想获得更多 ecommerce 客户。\u003c/p\u003e\n","kind":"html","rawMarkdown":"下面看看整套系统协同起来会是什么样。\n\n假设一家 bookkeeping firm 想获得更多 ecommerce 客户。","sourceFormat":"markdown"},"note:sha256:4d335a27284dc05460acc438ca788ab486297c5d1a18c489361b0ce80780fdeb":{"html":"\u003cp\u003e真正神奇的是最后这一点。\u003c/p\u003e\n\u003cp\u003e工具通过 MCP 之类的方式连接，可以把它粗略理解为给 AI 用的通用插口。HubSpot、Stripe、Notion、Slack 等大量工具都有 MCP server，于是 Agent 可以像你一样读取 CRM，或者拉取上周收入数据。\u003c/p\u003e\n\u003cp\u003e如果某个工具只有 API，Agent 通常也可以写出调用它的代码。\u003c/p\u003e\n","kind":"html","rawMarkdown":"真正神奇的是最后这一点。\n\n工具通过 MCP 之类的方式连接，可以把它粗略理解为给 AI 用的通用插口。HubSpot、Stripe、Notion、Slack 等大量工具都有 MCP server，于是 Agent 可以像你一样读取 CRM，或者拉取上周收入数据。\n\n如果某个工具只有 API，Agent 通常也可以写出调用它的代码。","sourceFormat":"markdown"},"note:sha256:502f383c8b487795f914923f2bfa5b8c8aa291e27021b45ff6c221f5919295f1":{"html":"\u003cp\u003e这份工作一半是 marketer，一半是 builder，两边都要懂。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这份工作一半是 marketer，一半是 builder，两边都要懂。","sourceFormat":"markdown"},"note:sha256:5167ac7e5e887853563b4e0beb7d3bf96c8ade3d06be7d0c0fa4112394a0989e":{"html":"\u003cp\u003e如果你发现自己整天都在修 Agent output，那么问题通常发生在上游。\u003c/p\u003e\n\u003cp\u003e几乎总是“大脑”或者 contract 有问题。\u003c/p\u003e\n","kind":"html","rawMarkdown":"如果你发现自己整天都在修 Agent output，那么问题通常发生在上游。\n\n几乎总是“大脑”或者 contract 有问题。","sourceFormat":"markdown"},"note:sha256:54a35f3fa74111d6d080544c9c1adb88814055df304340d232b32023f85d43cc":{"html":"\u003cp\u003e一切都从 Agent workspace 开始。Claude Code、Codex 和 Cursor 是比较常见的选择。\u003c/p\u003e\n\u003cp\u003e最简单的理解方式是：把这些工具想成一个住在你电脑某个文件夹里的超高速 junior employee。它能读取那个文件夹里的所有文件、创建新文件、运行代码，也能使用你连接给它的任何工具。\u003c/p\u003e\n","kind":"html","rawMarkdown":"一切都从 Agent workspace 开始。Claude Code、Codex 和 Cursor 是比较常见的选择。\n\n最简单的理解方式是：把这些工具想成一个住在你电脑某个文件夹里的超高速 junior employee。它能读取那个文件夹里的所有文件、创建新文件、运行代码，也能使用你连接给它的任何工具。","sourceFormat":"markdown"},"note:sha256:58772dd3da58a0e9a69f6702bd7174370d7780fb5c031cc5cfe31cd94b97c38b":{"html":"\u003cp\u003e最快的翻车方式，就是相信 Prompt 里的一句话。\u003c/p\u003e\n\u003cp\u003e“发送之前永远先问我”对模型来说只是一个礼貌建议。\u003c/p\u003e\n\u003cp\u003e真正的 guardrail 应该存在于工具里。\u003c/p\u003e\n","kind":"html","rawMarkdown":"最快的翻车方式，就是相信 Prompt 里的一句话。\n\n“发送之前永远先问我”对模型来说只是一个礼貌建议。\n\n真正的 guardrail 应该存在于工具里。","sourceFormat":"markdown"},"note:sha256:5e8728a2c907362d0a27bf2f1be0038db07d22dd3af4b9f8d7ee1d4b7d65e11a":{"html":"\u003cp\u003eChatGPT 在 2022 年底出现后，我们进入了 AI 辅助营销人的阶段。文案更快，图片更快，但其它东西基本没变。\u003c/p\u003e\n\u003cp\u003e还是同样的组织结构、同样的会议、同样六周一个周期，只不过第一版草稿更好了。这有点像 AI Copilot 时代。大多数营销团队现在其实仍然停留在这里。\u003c/p\u003e\n","kind":"html","rawMarkdown":"ChatGPT 在 2022 年底出现后，我们进入了 AI 辅助营销人的阶段。文案更快，图片更快，但其它东西基本没变。\n\n还是同样的组织结构、同样的会议、同样六周一个周期，只不过第一版草稿更好了。这有点像 AI Copilot 时代。大多数营销团队现在其实仍然停留在这里。","sourceFormat":"markdown"},"note:sha256:60aa92dffb8b914fec0cbee2e0ce795fbf6d863f66a26e30a0cdaf7f6888cc24":{"html":"\u003cp\u003e给每个 Agent 它真正需要的最小权限。\u003c/p\u003e\n\u003cp\u003eoutreach Agent 只有 email draft 权限；广告 Agent 只能创建 paused 状态的广告；预算仍然掌握在你手里。\u003c/p\u003e\n\u003cp\u003eapproval step 直接存在代码里。比如 Slack 消息带一个 approve 按钮，action 会一直等待，直到你真正点击。\u003c/p\u003e\n\u003cp\u003e像 spend cap、suppression list、deduplication 这样的精确规则，交给普通代码。\u003c/p\u003e\n\u003cp\u003e而像“这个 account 是否合适”“这条 message 是否听起来像我们”这类判断，则交给模型。\u003c/p\u003e\n","kind":"html","rawMarkdown":"给每个 Agent 它真正需要的最小权限。\n\noutreach Agent 只有 email draft 权限；广告 Agent 只能创建 paused 状态的广告；预算仍然掌握在你手里。\n\napproval step 直接存在代码里。比如 Slack 消息带一个 approve 按钮，action 会一直等待，直到你真正点击。\n\n像 spend cap、suppression list、deduplication 这样的精确规则，交给普通代码。\n\n而像“这个 account 是否合适”“这条 message 是否听起来像我们”这类判断，则交给模型。","sourceFormat":"markdown"},"note:sha256:622166f2bbf31b0ebe6c120d634d676fdbe82de4260fc78e803b331bec4bd2a4":{"html":"\u003cp\u003e你还会希望 Agent 在你睡觉时按计划执行任务。\u003c/p\u003e\n\u003cp\u003e一年前，这通常意味着要用 Zapier 或 n8n 之类的 workflow 工具把各个环节串起来。现在，你可以直接让 coding agent 帮你把它写出来。\u003c/p\u003e\n\u003cp\u003e比如告诉它：“每周一早上 7 点运行，把报告发到 Slack，在任何内容真正发送前等我点 👍。”它可以写出定时任务、带 approve 按钮的 Slack 消息，以及只有在你点击之后才继续执行的代码。\u003c/p\u003e\n\u003cp\u003e或者你也可以使用 Hermes、OpenClaw 这类常驻后台的 Agent。无论哪种方式，代码都在你的文件夹里，你可以用一句话修改其中任何部分。\u003c/p\u003e\n","kind":"html","rawMarkdown":"你还会希望 Agent 在你睡觉时按计划执行任务。\n\n一年前，这通常意味着要用 Zapier 或 n8n 之类的 workflow 工具把各个环节串起来。现在，你可以直接让 coding agent 帮你把它写出来。\n\n比如告诉它：“每周一早上 7 点运行，把报告发到 Slack，在任何内容真正发送前等我点 👍。”它可以写出定时任务、带 approve 按钮的 Slack 消息，以及只有在你点击之后才继续执行的代码。\n\n或者你也可以使用 Hermes、OpenClaw 这类常驻后台的 Agent。无论哪种方式，代码都在你的文件夹里，你可以用一句话修改其中任何部分。","sourceFormat":"markdown"},"note:sha256:65404f59174ea228c0417cacace473d365751296412d1629b1b6ee4a6dcb99e2":{"html":"\u003cp\u003e接下来，给“大脑”装上眼睛。\u003c/p\u003e\n\u003cp\u003e把真正存在客户事实的地方连接起来：Gong 或 Fathom 里的通话录音，Intercom 或 Zendesk 里的客服工单，HubSpot 或 Salesforce 里的交易，PostHog 或 Google Analytics 里的行为数据，以及 Stripe 里的收入。\u003c/p\u003e\n","kind":"html","rawMarkdown":"接下来，给“大脑”装上眼睛。\n\n把真正存在客户事实的地方连接起来：Gong 或 Fathom 里的通话录音，Intercom 或 Zendesk 里的客服工单，HubSpot 或 Salesforce 里的交易，PostHog 或 Google Analytics 里的行为数据，以及 Stripe 里的收入。","sourceFormat":"markdown"},"note:sha256:66e9e89f380429e690d687f7d62f4403890e7d8e7d0709c1125251fe3e3e3ab5":{"html":"\u003cp\u003e我反复看到同一种错误：有人一兴奋就启动十个 Agent，得到一大堆泛泛的垃圾输出，然后得出结论——AI 营销被吹过头了。\u003c/p\u003e\n\u003cp\u003e其实 Agent 没问题，问题是上下文太薄。\u003c/p\u003e\n\u003cp\u003e这就像你招来一个非常聪明的营销人，却跳过 onboarding。他会写出听起来很聪明的行业内容，但和竞争对手写的一模一样。\u003c/p\u003e\n\u003cp\u003e所以，在构建任何 Agent 之前，先构建“大脑”：一个文件夹，把你的业务解释得像你在给一个第一天入职、脑子很快的新员工做 onboarding 一样。\u003c/p\u003e\n\u003cp\u003e我会这样组织：\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCa05XacAAtaHo?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e六个文件可以承担绝大部分工作。\u003c/p\u003e\n","kind":"html","rawMarkdown":"我反复看到同一种错误：有人一兴奋就启动十个 Agent，得到一大堆泛泛的垃圾输出，然后得出结论——AI 营销被吹过头了。\n\n其实 Agent 没问题，问题是上下文太薄。\n\n这就像你招来一个非常聪明的营销人，却跳过 onboarding。他会写出听起来很聪明的行业内容，但和竞争对手写的一模一样。\n\n所以，在构建任何 Agent 之前，先构建“大脑”：一个文件夹，把你的业务解释得像你在给一个第一天入职、脑子很快的新员工做 onboarding 一样。\n\n我会这样组织：\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCa05XacAAtaHo?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n六个文件可以承担绝大部分工作。","sourceFormat":"markdown"},"note:sha256:67ab7ffbed1201c2efe3ff0d1738f297b7f1b9ecf7a63cfb9526fa55570e9250":{"html":"\u003cp\u003e这个文件描述谁会购买、谁会留下，以及你能盈利地服务谁。必须具体到让 Agent 真正有东西可用。\u003c/p\u003e\n\u003cp\u003e“Shopify 商店，年营收 100 万到 1000 万美元，创始人仍然自己做账，而且以前被记账员坑过”会给 Agent 很强的上下文。\u003c/p\u003e\n\u003cp\u003e“SMBs”几乎什么都没告诉它。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这个文件描述谁会购买、谁会留下，以及你能盈利地服务谁。必须具体到让 Agent 真正有东西可用。\n\n“Shopify 商店，年营收 100 万到 1000 万美元，创始人仍然自己做账，而且以前被记账员坑过”会给 Agent 很强的上下文。\n\n“SMBs”几乎什么都没告诉它。","sourceFormat":"markdown"},"note:sha256:69b0917141bedd0c8a87cb715e410fa1a34a5d8febfba51997516369b04df397":{"html":"\u003cp\u003e大多数人还没有真正跟上一个变化：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e创意正在成为新的 targeting。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eMeta 已经重建了它决定“哪个广告该展示给谁”的方式。它的新系统 Andromeda 在 2025 年底完成全球 rollout，会直接读取广告本身来判断适合展示给谁。\u003c/p\u003e\n\u003cp\u003e你的图片、hook 和 script，现在正在承担过去 interest targeting 的一部分工作。\u003c/p\u003e\n\u003cp\u003e这对懒惰广告主有一个很残酷的副作用：Andromeda 会把看起来很像的广告归为一组，并把它们当作同一种东西。\u003c/p\u003e\n\u003cp\u003e于是，50 个只是换了 headline 的版本，获得的 reach 可能和一个广告差不多。\u003c/p\u003e\n\u003cp\u003e而且，现在一个 winning ad 往往两三周就开始疲劳，而不是过去的六周。\u003c/p\u003e\n\u003cp\u003e所以，真正的工作是持续产出\u003cstrong\u003e真正不同的 idea\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e过去这通常需要一支 production team；现在需要的是一套 creative engine。\u003c/p\u003e\n\u003cp\u003e我会这样搭。\u003c/p\u003e\n","kind":"html","rawMarkdown":"大多数人还没有真正跟上一个变化：\n\n**创意正在成为新的 targeting。**\n\nMeta 已经重建了它决定“哪个广告该展示给谁”的方式。它的新系统 Andromeda 在 2025 年底完成全球 rollout，会直接读取广告本身来判断适合展示给谁。\n\n你的图片、hook 和 script，现在正在承担过去 interest targeting 的一部分工作。\n\n这对懒惰广告主有一个很残酷的副作用：Andromeda 会把看起来很像的广告归为一组，并把它们当作同一种东西。\n\n于是，50 个只是换了 headline 的版本，获得的 reach 可能和一个广告差不多。\n\n而且，现在一个 winning ad 往往两三周就开始疲劳，而不是过去的六周。\n\n所以，真正的工作是持续产出**真正不同的 idea**。\n\n过去这通常需要一支 production team；现在需要的是一套 creative engine。\n\n我会这样搭。","sourceFormat":"markdown"},"note:sha256:7128f598874b153196c46a5ad3883a89d38d6edd824ce1ba68e4192c0289e76f":{"html":"\u003cp\u003e等它足够可靠后，再让它按计划运行。\u003c/p\u003e\n\u003cp\u003e每周一，它读取上周的通话和 ticket，并把一份新报告放进 \u003ccode\u003eevidence/customer-language/\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e这样，你的整个营销系统就开始基于“客户上周真实说了什么”运行，而不是基于“某个人去年猜了什么”。\u003c/p\u003e\n","kind":"html","rawMarkdown":"等它足够可靠后，再让它按计划运行。\n\n每周一，它读取上周的通话和 ticket，并把一份新报告放进 `evidence/customer-language/`。\n\n这样，你的整个营销系统就开始基于“客户上周真实说了什么”运行，而不是基于“某个人去年猜了什么”。","sourceFormat":"markdown"},"note:sha256:73b48d38259b776e01678f87e419e497824aedebf067c8cdcf979e4f3e76e40c":{"html":"\u003cp\u003e你会发现，客户最初说过的话贯穿了整个过程。\u003c/p\u003e\n\u003cp\u003e通常，一条非常锋利的 insight 会依次经过 research summary、brief 和五轮编辑，最后被磨得和互联网上所有 bookkeeping 广告一样。\u003c/p\u003e\n\u003cp\u003e而在这里，quote 会和 campaign folder 一起流转，所以每一个 Agent 都能看到原始语言。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCamhEaAAAzHyA?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"你会发现，客户最初说过的话贯穿了整个过程。\n\n通常，一条非常锋利的 insight 会依次经过 research summary、brief 和五轮编辑，最后被磨得和互联网上所有 bookkeeping 广告一样。\n\n而在这里，quote 会和 campaign folder 一起流转，所以每一个 Agent 都能看到原始语言。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCamhEaAAAzHyA?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:768d319758294cdc38b0615f926fa753a212dffe3f7dd4158a0c126befaae11b":{"html":"\u003cp\u003e与此同时，那些最能把这些知识用起来的小想法，总是输给“大发布”。\u003c/p\u003e\n\u003cp\u003e为某个细分人群做一个定价计算器；把昨天销售通话里的洞察做成一条 campaign；某个功能终于上线时，给曾经提出这个需求的 40 位老客户发一封消息。\u003c/p\u003e\n\u003cp\u003e过去，每件事都需要设计师、开发者、分析师和两轮会议，于是它们就一直躺在 backlog 里。\u003c/p\u003e\n","kind":"html","rawMarkdown":"与此同时，那些最能把这些知识用起来的小想法，总是输给“大发布”。\n\n为某个细分人群做一个定价计算器；把昨天销售通话里的洞察做成一条 campaign；某个功能终于上线时，给曾经提出这个需求的 40 位老客户发一封消息。\n\n过去，每件事都需要设计师、开发者、分析师和两轮会议，于是它们就一直躺在 backlog 里。","sourceFormat":"markdown"},"note:sha256:76b35d1716a37929549d7ce9c3a426673f5ba6a1f9a90f0128bd2c197a1146c0":{"html":"\u003cp\u003e这一半，仍然是优秀营销人一直以来就必须掌握的能力。\u003c/p\u003e\n\u003cp\u003e你要知道：\u003c/p\u003e\n","kind":"html","rawMarkdown":"这一半，仍然是优秀营销人一直以来就必须掌握的能力。\n\n你要知道：","sourceFormat":"markdown"},"note:sha256:79784029a25a8b32b465504be34e22c3cff27491211669c7c6a52cc7cd7facf9":{"html":"\u003cp\u003eNano Banana、GPT Image 和 Midjourney 现在已经能生成在手机屏幕上也足够成立的 product shot、lifestyle scene 和 static ad。\u003c/p\u003e\n\u003cp\u003e诀窍是，把真实产品照片喂给模型，让产品本身保持准确，而让模型修改产品周围的一切。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Nano Banana、GPT Image 和 Midjourney 现在已经能生成在手机屏幕上也足够成立的 product shot、lifestyle scene 和 static ad。\n\n诀窍是，把真实产品照片喂给模型，让产品本身保持准确，而让模型修改产品周围的一切。","sourceFormat":"markdown"},"note:sha256:7bab4335f4133ecedc84b5acf91f1262b5f80af9623c618a17a223fae52f49cd":{"html":"\u003cp\u003e丢单 Agent 是最有可能“养活”其它 Agent 的那个。\u003c/p\u003e\n\u003cp\u003e把 CRM 里所有 closed-lost deal 连同 notes 和 call transcript 拉出来。\u003c/p\u003e\n\u003cp\u003e“Not interested”只是对一段真实对话非常偷懒的概括。让 Agent 重新读取每笔丢单，记录真正的原因，以及重新打开机会的 condition。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cp\u003e“选择了竞争对手，合同 3 月续约。”\u003cbr\u003e“需要 SSO。”\u003cbr\u003e“Champion 离职了。”\u003c/p\u003e\n\u003cp\u003e然后 Agent 持续监测这些 condition。\u003c/p\u003e\n\u003cp\u003e你的 changelog 一旦显示 SSO 已上线，所有当初提出 SSO 的 prospect 都会得到一封引用原始通话内容的个性化 draft。\u003c/p\u003e\n\u003cp\u003e续约期临近时，你再次出现。Champion 去了新公司时，你先祝贺，再重新介绍自己。\u003c/p\u003e\n\u003cp\u003e尊重 opt-out 和 contact preference，你会发现，大多数公司的 CRM 里其实堆着大量“尚未真正结束的收入机会”。\u003c/p\u003e\n","kind":"html","rawMarkdown":"丢单 Agent 是最有可能“养活”其它 Agent 的那个。\n\n把 CRM 里所有 closed-lost deal 连同 notes 和 call transcript 拉出来。\n\n“Not interested”只是对一段真实对话非常偷懒的概括。让 Agent 重新读取每笔丢单，记录真正的原因，以及重新打开机会的 condition。\n\n例如：\n\n“选择了竞争对手，合同 3 月续约。”  \n“需要 SSO。”  \n“Champion 离职了。”\n\n然后 Agent 持续监测这些 condition。\n\n你的 changelog 一旦显示 SSO 已上线，所有当初提出 SSO 的 prospect 都会得到一封引用原始通话内容的个性化 draft。\n\n续约期临近时，你再次出现。Champion 去了新公司时，你先祝贺，再重新介绍自己。\n\n尊重 opt-out 和 contact preference，你会发现，大多数公司的 CRM 里其实堆着大量“尚未真正结束的收入机会”。","sourceFormat":"markdown"},"note:sha256:80d57ab4e965112d1b18e6457d8017ef35c56e0b4b0c11d6673f433b8bcfee99":{"html":"\u003cp\u003eAgent 把每个 concept 以 paused 状态上线，由人真正点击 go。\u003c/p\u003e\n\u003cp\u003e一段 script 在达到预定 spend 后暂停 loser。\u003c/p\u003e\n\u003cp\u003e每周一，效果 Agent 告诉你哪些 concept 赢了、下周应该测试哪些 hook。\u003c/p\u003e\n\u003cp\u003e于是你的工作变成挑 idea、判断 taste，机器负责 volume。\u003c/p\u003e\n\u003cp\u003e现在，在 paid social 上表现最好的营销工程师，一个月可以上线几十个真正不同的 concept，而且不需要一支传统 production team。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Agent 把每个 concept 以 paused 状态上线，由人真正点击 go。\n\n一段 script 在达到预定 spend 后暂停 loser。\n\n每周一，效果 Agent 告诉你哪些 concept 赢了、下周应该测试哪些 hook。\n\n于是你的工作变成挑 idea、判断 taste，机器负责 volume。\n\n现在，在 paid social 上表现最好的营销工程师，一个月可以上线几十个真正不同的 concept，而且不需要一支传统 production team。","sourceFormat":"markdown"},"note:sha256:85f235b54bb3b080bdfbfbb188363c31b3815c6708ba5f4608b0ac238b3205fa":{"html":"\u003cp\u003e周一，客户语言报告显示，店主们一直在反复说同一句话：\u003c/p\u003e\n\u003cp\u003e“扣掉退款、物流和手续费后，我根本不知道自己到底赚没赚钱。”\u003c/p\u003e\n\u003cp\u003e上个月有 11 位不同客户都表达过类似意思。\u003c/p\u003e\n\u003cp\u003e你把这条洞察拿给真正负责交付服务的人看，问公司是否真的能解决这个问题。\u003c/p\u003e\n\u003cp\u003e对方说可以，而且这是每个新客户进来后，他们最先处理的问题。\u003c/p\u003e\n\u003cp\u003e于是，你在 \u003ccode\u003eoffers.md\u003c/code\u003e 中批准一条 offer：为年销售额 100 万到 1000 万美元的商店提供一次免费的 profitability review。\u003c/p\u003e\n","kind":"html","rawMarkdown":"周一，客户语言报告显示，店主们一直在反复说同一句话：\n\n“扣掉退款、物流和手续费后，我根本不知道自己到底赚没赚钱。”\n\n上个月有 11 位不同客户都表达过类似意思。\n\n你把这条洞察拿给真正负责交付服务的人看，问公司是否真的能解决这个问题。\n\n对方说可以，而且这是每个新客户进来后，他们最先处理的问题。\n\n于是，你在 `offers.md` 中批准一条 offer：为年销售额 100 万到 1000 万美元的商店提供一次免费的 profitability review。","sourceFormat":"markdown"},"note:sha256:86303d33542cd096fefe51907910acb2cbbb40b7ed3ddcc8d152b923b19f12d8":{"html":"\u003cp\u003eVeo、Kling 和 fal 可以把 script 或静态图转成短视频。\u003c/p\u003e\n\u003cp\u003e对于 talking-head ad，Arcads、HeyGen 和 Creatify 可以生成 AI actor，用数十种语言朗读 script。\u003c/p\u003e\n\u003cp\u003eElevenLabs 处理 voiceover，CapCut 或 Captions 处理 editing。\u003c/p\u003e\n","kind":"html","rawMarkdown":"Veo、Kling 和 fal 可以把 script 或静态图转成短视频。\n\n对于 talking-head ad，Arcads、HeyGen 和 Creatify 可以生成 AI actor，用数十种语言朗读 script。\n\nElevenLabs 处理 voiceover，CapCut 或 Captions 处理 editing。","sourceFormat":"markdown"},"note:sha256:8b1939c1a762b303d633f6ecd8c097d0faa5570f7cd13ae497c10abd58d35126":{"html":"\u003cp\u003e两周后，效果 Agent 把 spend 连接到 booked review，再把 review 连接到 signed client。\u003c/p\u003e\n\u003cp\u003eprofit calculator 页面转化最好；Amazon trigger list 带来的 call 最多。\u003c/p\u003e\n\u003cp\u003e同时，它也提醒你：sample 仍然很小。\u003c/p\u003e\n","kind":"html","rawMarkdown":"两周后，效果 Agent 把 spend 连接到 booked review，再把 review 连接到 signed client。\n\nprofit calculator 页面转化最好；Amazon trigger list 带来的 call 最多。\n\n同时，它也提醒你：sample 仍然很小。","sourceFormat":"markdown"},"note:sha256:8c03f188e80e7ec906403c7dae5c33045552b446a36160990c598a66ff00e047":{"html":"\u003cp\u003e这里列出你卖什么、价格是多少、允许承诺什么，以及哪些话在公开之前必须经过审批。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这里列出你卖什么、价格是多少、允许承诺什么，以及哪些话在公开之前必须经过审批。","sourceFormat":"markdown"},"note:sha256:8defd1b126140e2a8cd34db0d4f096a27e25ec1b7f707ecb463800947d806ba9":{"html":"\u003cp\u003e整套系统的核心是 review queue。\u003c/p\u003e\n\u003cp\u003e其中的每一项都应该在一分钟内完成判断。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cp\u003e“批准这个修改后的 offer。它会影响这两条广告和这封邮件。”\u003c/p\u003e\n\u003cp\u003e要让 review item 清楚显示：\u003c/p\u003e\n","kind":"html","rawMarkdown":"整套系统的核心是 review queue。\n\n其中的每一项都应该在一分钟内完成判断。\n\n例如：\n\n“批准这个修改后的 offer。它会影响这两条广告和这封邮件。”\n\n要让 review item 清楚显示：","sourceFormat":"markdown"},"note:sha256:9010cc2f5a089260e9b328621cfc40c23b8af9938790eee357042d3e3d376968":{"html":"\u003cp\u003e这是 AI UGC 里一个很实用的做法。\u003c/p\u003e\n\u003cp\u003eAI actor 让你可以用一条真人 creator video 的成本，在一天内测试 20 个 script。\u003c/p\u003e\n\u003cp\u003e一旦知道哪条 script 真正有效，再让真人来讲，通常会表现得更好，也更能建立信任，同时还能更好遵守那些要求标注 AI 内容的平台规则。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这是 AI UGC 里一个很实用的做法。\n\nAI actor 让你可以用一条真人 creator video 的成本，在一天内测试 20 个 script。\n\n一旦知道哪条 script 真正有效，再让真人来讲，通常会表现得更好，也更能建立信任，同时还能更好遵守那些要求标注 AI 内容的平台规则。","sourceFormat":"markdown"},"note:sha256:9167c50ace50a812d10874b596ce91ef0b136743437be46ea33d3a87f30256df":{"html":"\u003cp\u003e在营销史的大部分时期，赢家往往是预算最大、人最多的公司。\u003c/p\u003e\n\u003cp\u003e我认为接下来十年，赢家会变成：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e最了解客户，而且行动最快的人。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我的猜测是，到 2028 年，最好的营销团队可能只有一两个 marketing engineer，却运行着几十个 Agent，产出速度会超过人数是它十倍的部门。\u003c/p\u003e\n\u003cp\u003e而这些未来的营销工程师，大多数现在其实就坐在 growth、content 和 ops 岗位上。\u003c/p\u003e\n\u003cp\u003e他们距离成为营销工程师，可能只差一个周末真正开始 build。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在营销史的大部分时期，赢家往往是预算最大、人最多的公司。\n\n我认为接下来十年，赢家会变成：\n\n**最了解客户，而且行动最快的人。**\n\n我的猜测是，到 2028 年，最好的营销团队可能只有一两个 marketing engineer，却运行着几十个 Agent，产出速度会超过人数是它十倍的部门。\n\n而这些未来的营销工程师，大多数现在其实就坐在 growth、content 和 ops 岗位上。\n\n他们距离成为营销工程师，可能只差一个周末真正开始 build。","sourceFormat":"markdown"},"note:sha256:976518ade8ff2998111d4d3b82808715ed35b3b1fc65ea5fbaf26cef5083bf9b":{"html":"\u003cp\u003e让 Agent 去读 Reddit、X、TikTok comment，以及竞争对手 review。\u003c/p\u003e\n\u003cp\u003e每周汇报大家在抱怨什么、问什么、为什么兴奋。\u003c/p\u003e\n\u003cp\u003e然后，让它为那些“你的产品确实能帮上忙”的 thread 起草真正有用的回复，但最终由你本人发布。\u003c/p\u003e\n\u003cp\u003e尤其在 Reddit 上，一个真人给出的有用答案，通常比任何广告都强；而一条 spammy 回复会直接让你被 ban。\u003c/p\u003e\n","kind":"html","rawMarkdown":"让 Agent 去读 Reddit、X、TikTok comment，以及竞争对手 review。\n\n每周汇报大家在抱怨什么、问什么、为什么兴奋。\n\n然后，让它为那些“你的产品确实能帮上忙”的 thread 起草真正有用的回复，但最终由你本人发布。\n\n尤其在 Reddit 上，一个真人给出的有用答案，通常比任何广告都强；而一条 spammy 回复会直接让你被 ban。","sourceFormat":"markdown"},"note:sha256:9b523f5a8aa3fe5c8507024a009487035a3c509ba2b4a35e2050e4f275ceb294":{"html":"\u003cp\u003e在 workflow 真正赢得你的信任之前，publish、outreach 和 spend 都继续放在 approval 后面。\u003c/p\u003e\n\u003cp\u003e先把一个 workflow 做可靠，再添加下一个。\u003c/p\u003e\n\u003cp\u003e一个每天早晨自动运行、但本身很混乱的 workflow，只会稳定地给你制造一批混乱。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在 workflow 真正赢得你的信任之前，publish、outreach 和 spend 都继续放在 approval 后面。\n\n先把一个 workflow 做可靠，再添加下一个。\n\n一个每天早晨自动运行、但本身很混乱的 workflow，只会稳定地给你制造一批混乱。","sourceFormat":"markdown"},"note:sha256:9bb54a138d28aba52a5ebd0371ce491ef003d7b91910735274812759dcfc78f9":{"html":"\u003cp\u003e这是大多数人最偷懒的地方。\u003c/p\u003e\n\u003cp\u003e“友好但专业”对 Agent 几乎没用。更好的做法是，放进 3 封你真正喜欢的邮件或广告，并为每个例子写一句为什么它有效；再放 2 个你否掉的版本，并解释原因。\u003c/p\u003e\n\u003cp\u003e例如：“我们否掉这一版，因为它承诺 30 天出结果，而我们不能保证。”\u003c/p\u003e\n\u003cp\u003eAgent 从实例里学到的东西，远比从几个形容词里多。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这是大多数人最偷懒的地方。\n\n“友好但专业”对 Agent 几乎没用。更好的做法是，放进 3 封你真正喜欢的邮件或广告，并为每个例子写一句为什么它有效；再放 2 个你否掉的版本，并解释原因。\n\n例如：“我们否掉这一版，因为它承诺 30 天出结果，而我们不能保证。”\n\nAgent 从实例里学到的东西，远比从几个形容词里多。","sourceFormat":"markdown"},"note:sha256:9ed28d61c19180504e7ebe400956691d39fa70f085702b7b7ba2204dc777a166":{"html":"\u003cp\u003e例如，你卖的是面向水管工和 HVAC 公司的排班软件。\u003c/p\u003e\n\u003cp\u003eAgent 发现很多老板都反复表达某种类似的话：\u003c/p\u003e\n\u003cp\u003e“我受够了吃晚饭的时候还要接工作电话。”\u003c/p\u003e\n\u003cp\u003e这一句话本身就可以成为广告、headline 和销售开场白。\u003c/p\u003e\n\u003cp\u003e它往往比“automated scheduling”强，因为人们购买的常常是他们身处的具体情境，而不是一个抽象功能。\u003c/p\u003e\n","kind":"html","rawMarkdown":"例如，你卖的是面向水管工和 HVAC 公司的排班软件。\n\nAgent 发现很多老板都反复表达某种类似的话：\n\n“我受够了吃晚饭的时候还要接工作电话。”\n\n这一句话本身就可以成为广告、headline 和销售开场白。\n\n它往往比“automated scheduling”强，因为人们购买的常常是他们身处的具体情境，而不是一个抽象功能。","sourceFormat":"markdown"},"note:sha256:9f8f0eb25bf03e77422d756dd11e702bd3b753877426382491df12370fd06adf":{"html":"\u003cp\u003e学习 builder 这半边最快的方法，是这个周末用 AI coding tool 做一个很丑的 landing page，然后真正部署上线。\u003c/p\u003e\n\u003cp\u003e一个真正 deployed 的页面，比十门课教你的东西更多。\u003c/p\u003e\n","kind":"html","rawMarkdown":"学习 builder 这半边最快的方法，是这个周末用 AI coding tool 做一个很丑的 landing page，然后真正部署上线。\n\n一个真正 deployed 的页面，比十门课教你的东西更多。","sourceFormat":"markdown"},"note:sha256:a0b37b938c49f365a5c951e0bab6862a83eebcf259b1a93d0ee523593e4503fa":{"html":"\u003cp\u003e一份长内容——比如 podcast、webinar，或者创始人边走边讲的一段 rant——都可以拆成 20 条 short clip。\u003c/p\u003e\n\u003cp\u003eOpus Clip 之类的工具可以找出最好的片段并自动加 caption，Agent 还能把它们排期到不同平台。\u003c/p\u003e\n\u003cp\u003e很多最大的 podcast 就是这样增长起来的。\u003c/p\u003e\n","kind":"html","rawMarkdown":"一份长内容——比如 podcast、webinar，或者创始人边走边讲的一段 rant——都可以拆成 20 条 short clip。\n\nOpus Clip 之类的工具可以找出最好的片段并自动加 caption，Agent 还能把它们排期到不同平台。\n\n很多最大的 podcast 就是这样增长起来的。","sourceFormat":"markdown"},"note:sha256:a50e48b14656c5a444b38e1586ae9a4c019bdbf00c03f2a9f9d2ae7088da6330":{"html":"\u003cp\u003e效果 Agent 每周一读取 campaign table，然后像一个优秀分析师那样写一份简短 memo。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cp\u003e“profitability review 页面转化率 4%，但其中一半 leads 规模太小，不适合服务。”\u003cbr\u003e“dinner ad 的 qualified call acquisition cost 最低。”\u003cbr\u003e“Retargeting 已花 3,000 美元，只带来两次销售对话。”\u003c/p\u003e\n\u003cp\u003e每一行最后都落到一个决策：keep、kill、change 或 test。\u003c/p\u003e\n\u003cp\u003e一定要把数据接到 retention、refund 和 profit。\u003c/p\u003e\n\u003cp\u003e一条 campaign 可能带来很多便宜客户，但这些客户 60 天后全部 churn。它在 dashboard 上会看起来非常漂亮，却在安静地亏钱。\u003c/p\u003e\n\u003cp\u003e效果 Agent 就是用来抓这种问题的。\u003c/p\u003e\n","kind":"html","rawMarkdown":"效果 Agent 每周一读取 campaign table，然后像一个优秀分析师那样写一份简短 memo。\n\n例如：\n\n“profitability review 页面转化率 4%，但其中一半 leads 规模太小，不适合服务。”  \n“dinner ad 的 qualified call acquisition cost 最低。”  \n“Retargeting 已花 3,000 美元，只带来两次销售对话。”\n\n每一行最后都落到一个决策：keep、kill、change 或 test。\n\n一定要把数据接到 retention、refund 和 profit。\n\n一条 campaign 可能带来很多便宜客户，但这些客户 60 天后全部 churn。它在 dashboard 上会看起来非常漂亮，却在安静地亏钱。\n\n效果 Agent 就是用来抓这种问题的。","sourceFormat":"markdown"},"note:sha256:a7605ce7f8b0f52736df4ab6a73b9bb3fc9baf9a327ad7eb35525735676ed684":{"html":"\u003cp\u003e“Done”意味着：它在自己的限制范围内检查了每个来源，而且明确告诉你哪里失败了。\u003c/p\u003e\n\u003cp\u003e一个会说“今天这个 source 失败了”的 Agent，比十个默默跳过失败步骤的 Agent 更有价值。\u003c/p\u003e\n","kind":"html","rawMarkdown":"“Done”意味着：它在自己的限制范围内检查了每个来源，而且明确告诉你哪里失败了。\n\n一个会说“今天这个 source 失败了”的 Agent，比十个默默跳过失败步骤的 Agent 更有价值。","sourceFormat":"markdown"},"note:sha256:aa2a3f8a84ea8fa29ac953bed558b358d8fd03205f3bd404ee728b0cb3da850c":{"html":"\u003cp\u003e这里存放那些用真金白银换来的教训。\u003c/p\u003e\n\u003cp\u003e“免费审计吸引来的公司规模太小，根本买不起我们。”\u003cbr\u003e“LinkedIn 带来了很多 leads，但几乎没有成交。”\u003c/p\u003e\n\u003cp\u003e这样一句记录，就可能避免 Agent 再犯一次价值 20,000 美元的错误。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这里存放那些用真金白银换来的教训。\n\n“免费审计吸引来的公司规模太小，根本买不起我们。”  \n“LinkedIn 带来了很多 leads，但几乎没有成交。”\n\n这样一句记录，就可能避免 Agent 再犯一次价值 20,000 美元的错误。","sourceFormat":"markdown"},"note:sha256:ac541e2941ebeb114cfb57e169bc9f7b6e1398761d018d98b1766ac9d2ce10f0":{"html":"\u003cp\u003eTikTok 和 Instagram 上的 slideshow 和 carousel，很适合根据客户语言报告批量制作。\u003c/p\u003e\n\u003cp\u003e它们既容易生产，也经常获得大量 save。\u003c/p\u003e\n\u003cp\u003eAgent 写 slides，模型生成图片，你在周日统一审核整批内容。\u003c/p\u003e\n","kind":"html","rawMarkdown":"TikTok 和 Instagram 上的 slideshow 和 carousel，很适合根据客户语言报告批量制作。\n\n它们既容易生产，也经常获得大量 save。\n\nAgent 写 slides，模型生成图片，你在周日统一审核整批内容。","sourceFormat":"markdown"},"note:sha256:b9b5676f3573b87d6fee541380f792b49d01ddafffd16402c54f6ffbd0299248":{"html":"\u003cp\u003e周三，你一次性审核所有内容。\u003c/p\u003e\n\u003cp\u003e其中一个广告承诺了公司无法保证的 savings，于是你删掉它。\u003c/p\u003e\n\u003cp\u003e其余内容审核通过，然后启动一个 2,000 美元的 test。\u003c/p\u003e\n","kind":"html","rawMarkdown":"周三，你一次性审核所有内容。\n\n其中一个广告承诺了公司无法保证的 savings，于是你删掉它。\n\n其余内容审核通过，然后启动一个 2,000 美元的 test。","sourceFormat":"markdown"},"note:sha256:ba829d7663172032f59da5129b0ca92d7f16c70a5251b19da8780a6cc989b544":{"html":"\u003cp\u003e这是每个 Agent 最先读取的一页。\u003c/p\u003e\n\u003cp\u003e它说明公司做什么、服务谁、本季度优先级是什么，以及其它资料分别放在哪里。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这是每个 Agent 最先读取的一页。\n\n它说明公司做什么、服务谁、本季度优先级是什么，以及其它资料分别放在哪里。","sourceFormat":"markdown"},"note:sha256:bbac9b2b64f54660a8bb31685acef34111dd910196258105fa666ce163a9e386":{"html":"\u003cp\u003e这是你的不公平优势。\u003c/p\u003e\n\u003cp\u003e所有竞争对手都能用同样的模型，只有你拥有创始人对品类、客户和竞争的独特判断。\u003c/p\u003e\n\u003cp\u003e花两个小时采访创始人，或者采访你自己，把所有鲜明观点写下来。\u003c/p\u003e\n\u003cp\u003e例如：“我们这个行业的大多数 agency 在 onboarding 上收费过高。”\u003cbr\u003e或者：“我们最好的客户来自会计师推荐。”\u003c/p\u003e\n\u003cp\u003e真正让输出听起来像你的，正是这些观点。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这是你的不公平优势。\n\n所有竞争对手都能用同样的模型，只有你拥有创始人对品类、客户和竞争的独特判断。\n\n花两个小时采访创始人，或者采访你自己，把所有鲜明观点写下来。\n\n例如：“我们这个行业的大多数 agency 在 onboarding 上收费过高。”  \n或者：“我们最好的客户来自会计师推荐。”\n\n真正让输出听起来像你的，正是这些观点。","sourceFormat":"markdown"},"note:sha256:c62694822a971189b693ba9520b143f1a15fcbfaff9c833d5c1395ecd59d0b82":{"html":"\u003cp\u003e\u003cstrong\u003e一个很有帮助的捷径，是从已经有效的 funnel 开始。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我的合伙人之前没有太公开谈这件事，但 \u003ca href=\"https://x.com/@BoringMarketer\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@BoringMarketer\u003c/a\u003e 刚刚推出了 \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e它每周拆解一条真实、正在运行的 funnel，从广告一直拆到最后一封邮件，再把每一步转换成可以直接交给 coding agent 的 prompt。\u003c/p\u003e\n\u003cp\u003e这比从一张白纸开始要好得多。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUChi1tboAAm1GF?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"**一个很有帮助的捷径，是从已经有效的 funnel 开始。**\n\n我的合伙人之前没有太公开谈这件事，但 [@BoringMarketer](https://x.com/@BoringMarketer) 刚刚推出了 [Boring Funnels](https://boringfunnels.com/)。\n\n它每周拆解一条真实、正在运行的 funnel，从广告一直拆到最后一封邮件，再把每一步转换成可以直接交给 coding agent 的 prompt。\n\n这比从一张白纸开始要好得多。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUChi1tboAAm1GF?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:c6acb442c1a501efd048a5223d9906a3a18d8d809d2be7743e8774be73d84834":{"html":"\u003cp\u003e听起来一点都不性感，但这可能是整个系统里最有价值的部分。\u003c/p\u003e\n\u003cp\u003e大多数公司能告诉你“某条 campaign 有多少点击”，也能告诉你“某个客户贡献多少收入”，但很少有人真正把这两张表连接起来。\u003c/p\u003e\n\u003cp\u003e一旦接通，Agent 就能回答真正重要的问题：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e到底是哪种营销，带来了那些真的付钱、而且留下来的客户？\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"听起来一点都不性感，但这可能是整个系统里最有价值的部分。\n\n大多数公司能告诉你“某条 campaign 有多少点击”，也能告诉你“某个客户贡献多少收入”，但很少有人真正把这两张表连接起来。\n\n一旦接通，Agent 就能回答真正重要的问题：\n\n**到底是哪种营销，带来了那些真的付钱、而且留下来的客户？**","sourceFormat":"markdown"},"note:sha256:c89f610cc5848426712b14a3b1075495e7fbc02536e17d2b229705ca6b26678e":{"html":"\u003cp\u003e第四件事，是给每个 channel 明确职责。\u003c/p\u003e\n\u003cp\u003eSearch 回答问题。\u003cbr\u003eSocial 发起对话。\u003cbr\u003eEmail 在具体时刻出现。\u003c/p\u003e\n\u003cp\u003e如果每个 channel 都在重复同一句 message，你其实是在为同一条 impression 付五遍钱。\u003c/p\u003e\n","kind":"html","rawMarkdown":"第四件事，是给每个 channel 明确职责。\n\nSearch 回答问题。  \nSocial 发起对话。  \nEmail 在具体时刻出现。\n\n如果每个 channel 都在重复同一句 message，你其实是在为同一条 impression 付五遍钱。","sourceFormat":"markdown"},"note:sha256:ce0c07364824a93ed4c74efa8f1d1cb259fa84513c7f2597e0886f9cb2070d60":{"html":"\u003cp\u003e当所有品牌都可以生成内容时，feed 上最稀缺的东西反而是：\u003cstrong\u003e一个真实的人，以及他真实的观点。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e把 \u003ccode\u003efounder-opinions.md\u003c/code\u003e 变成内容引擎。\u003c/p\u003e\n\u003cp\u003eAgent 每天根据这些观点写一个 draft，你再把它编辑成真正属于你的声音，然后自己点击 publish。\u003c/p\u003e\n\u003cp\u003eAI 反而让 founder 变得更有价值，因为创始人本人是唯一无法被竞争对手生成出来的东西。\u003c/p\u003e\n\u003cp\u003e保持两条规则：\u003c/p\u003e\n","kind":"html","rawMarkdown":"当所有品牌都可以生成内容时，feed 上最稀缺的东西反而是：**一个真实的人，以及他真实的观点。**\n\n把 `founder-opinions.md` 变成内容引擎。\n\nAgent 每天根据这些观点写一个 draft，你再把它编辑成真正属于你的声音，然后自己点击 publish。\n\nAI 反而让 founder 变得更有价值，因为创始人本人是唯一无法被竞争对手生成出来的东西。\n\n保持两条规则：","sourceFormat":"markdown"},"note:sha256:d36fcc3cd39468d2ef7aa23785ab9fbd03238de5ae21edd77807fb88e7017400":{"blocks":[{"children":[],"kind":"leaf","title":"把 voice.md 和最新的客户语言报告交给 Claude 或 GPT 这样的 frontier model，让它为 8–12 个真正不同的 concept 写 script。"},{"children":[{"title":"一个 pain point；"},{"title":"一个 worked example；"},{"title":"一个 customer story；"},{"title":"一段 founder rant；"},{"title":"一个 comparison；"},{"title":"一个你想拆穿的 myth。"}],"kind":"section","title":"比如"},{"children":[],"kind":"leaf","title":"每个 concept 再配 2–3 个 hook。"},{"children":[],"kind":"leaf","title":"真正的 strategy 在这一步，所以你的时间应该花在这里。"}],"html":"\u003cp\u003e把 \u003ccode\u003evoice.md\u003c/code\u003e 和最新的客户语言报告交给 Claude 或 GPT 这样的 frontier model，让它为 8–12 个真正不同的 concept 写 script。\u003c/p\u003e\n\u003cp\u003e比如：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e一个 pain point；\u003c/li\u003e\n\u003cli\u003e一个 worked example；\u003c/li\u003e\n\u003cli\u003e一个 customer story；\u003c/li\u003e\n\u003cli\u003e一段 founder rant；\u003c/li\u003e\n\u003cli\u003e一个 comparison；\u003c/li\u003e\n\u003cli\u003e一个你想拆穿的 myth。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e每个 concept 再配 2–3 个 hook。\u003c/p\u003e\n\u003cp\u003e真正的 strategy 在这一步，所以你的时间应该花在这里。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"把 `voice.md` 和最新的客户语言报告交给 Claude 或 GPT 这样的 frontier model，让它为 8–12 个真正不同的 concept 写 script。\n\n比如：\n\n- 一个 pain point；\n- 一个 worked example；\n- 一个 customer story；\n- 一段 founder rant；\n- 一个 comparison；\n- 一个你想拆穿的 myth。\n\n每个 concept 再配 2–3 个 hook。\n\n真正的 strategy 在这一步，所以你的时间应该花在这里。","sourceFormat":"markdown"},"note:sha256:d4f52cec5a8ab0ff24c85ca10443c5402a9b5a554dc0ed728ad08d9acffba2da":{"html":"\u003cp\u003e系统搭好后，你的工作会越来越像 editing，而不是 making。\u003c/p\u003e\n\u003cp\u003e周一：阅读 performance memo，做 keep / kill / change 决策。\u003cbr\u003e周二和周三：build，修复上周产出较差的 workflow，并上线新 test。\u003cbr\u003e周四：和销售、客服通话，因为下周最好的 idea 往往藏在那里。\u003cbr\u003e周五：审核 Agent 的产出，并更新文件。\u003c/p\u003e\n","kind":"html","rawMarkdown":"系统搭好后，你的工作会越来越像 editing，而不是 making。\n\n周一：阅读 performance memo，做 keep / kill / change 决策。  \n周二和周三：build，修复上周产出较差的 workflow，并上线新 test。  \n周四：和销售、客服通话，因为下周最好的 idea 往往藏在那里。  \n周五：审核 Agent 的产出，并更新文件。","sourceFormat":"markdown"},"note:sha256:e79146120c1e7e3a10d50deafb4a965e42b66422caebe95da6a64b3344cbdb4a":{"html":"\u003cp\u003e先只做一个 Agent，并把它做到足够好，再做第二个。\u003c/p\u003e\n\u003cp\u003e第一天就让六个 Agent 相互聊天，通常只会让你周末花时间调试一个 group chat。\u003c/p\u003e\n","kind":"html","rawMarkdown":"先只做一个 Agent，并把它做到足够好，再做第二个。\n\n第一天就让六个 Agent 相互聊天，通常只会让你周末花时间调试一个 group chat。","sourceFormat":"markdown"},"note:sha256:ec25b69b60f5dd96a1325061f878a1ba8a040086abbd10f418758a95edd81f26":{"html":"\u003cp\u003e到了 2010 年代，增长黑客出现了，我永远不会忘记那段时期。Sean Ellis 在 2010 年创造了这个词，而整个十年里最经典的招数后来都成了行业传说。\u003c/p\u003e\n\u003cp\u003eHotmail 在每封邮件底部放上“P.S. I love you. Get your free email at Hotmail”；Dropbox 给邀请人和朋友都赠送免费存储空间；Airbnb 让房东把房源同步发布到 Craigslist。\u003c/p\u003e\n\u003cp\u003e增长黑客像做产品一样做营销：漏斗、增长循环和 A/B 测试都成为日常。但问题在于，每一个好点子仍然需要工程师，而工程师属于产品 roadmap。增长黑客有一半时间都在写 ticket、排队等开发。一个星期能跑几个实验，就已经算非常高效。\u003c/p\u003e\n","kind":"html","rawMarkdown":"到了 2010 年代，增长黑客出现了，我永远不会忘记那段时期。Sean Ellis 在 2010 年创造了这个词，而整个十年里最经典的招数后来都成了行业传说。\n\nHotmail 在每封邮件底部放上“P.S. I love you. Get your free email at Hotmail”；Dropbox 给邀请人和朋友都赠送免费存储空间；Airbnb 让房东把房源同步发布到 Craigslist。\n\n增长黑客像做产品一样做营销：漏斗、增长循环和 A/B 测试都成为日常。但问题在于，每一个好点子仍然需要工程师，而工程师属于产品 roadmap。增长黑客有一半时间都在写 ticket、排队等开发。一个星期能跑几个实验，就已经算非常高效。","sourceFormat":"markdown"},"note:sha256:edee8d230d164cd7ced7b84d6228ca1a4a34d0de36c3fcbab4f959dfe128b220":{"html":"\u003cp\u003e然后 Google 在 2000 年推出 AdWords，Facebook 在 2007 年推出广告产品，突然之间，每一次点击都可以被记录。数字营销人由此诞生。\u003c/p\u003e\n\u003cp\u003e工作变成管理 SEO、付费搜索、邮件、展示广告等渠道。营销人开始长期生活在 dashboard 里，真正厉害的人往往是最懂平台机制的人。实验频率也提高到了每月几次。\u003c/p\u003e\n","kind":"html","rawMarkdown":"然后 Google 在 2000 年推出 AdWords，Facebook 在 2007 年推出广告产品，突然之间，每一次点击都可以被记录。数字营销人由此诞生。\n\n工作变成管理 SEO、付费搜索、邮件、展示广告等渠道。营销人开始长期生活在 dashboard 里，真正厉害的人往往是最懂平台机制的人。实验频率也提高到了每月几次。","sourceFormat":"markdown"},"note:sha256:ee4f90d74baee5d23a4a26e78aa3b6401a5cea593de68ce5b3a1425c379d64e6":{"html":"\u003cp\u003e第一个最适合做的，是 customer language agent，因为后面的所有 Agent 都会依赖它发现的东西。\u003c/p\u003e\n\u003cp\u003e它的任务，是读取客户真正说过的话，并抽取他们描述问题时使用的原始语言。\u003c/p\u003e\n\u003cp\u003e把最近 20–50 份销售通话 transcript 导出到 \u003ccode\u003eevidence/calls/\u003c/code\u003e，然后给它类似这样的指令：\u003c/p\u003e\n\u003cp\u003e读取 \u003ccode\u003eevidence/calls/\u003c/code\u003e 中的每一份 transcript。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCa6rbbkAAhB9C?format=png\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"第一个最适合做的，是 customer language agent，因为后面的所有 Agent 都会依赖它发现的东西。\n\n它的任务，是读取客户真正说过的话，并抽取他们描述问题时使用的原始语言。\n\n把最近 20–50 份销售通话 transcript 导出到 `evidence/calls/`，然后给它类似这样的指令：\n\n读取 `evidence/calls/` 中的每一份 transcript。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCa6rbbkAAhB9C?format=png\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:ee5db1289849588b960c0a842db104b0ce7febc91f9ad8a7346e0159d2bdf767":{"html":"\u003cp\u003e这篇文章真正提出的不是“用更多 Agent 自动化营销”，而是把营销从一次次 campaign 的生产流程，重构成一套围绕客户证据、可追溯实验、明确权限和持续反馈运行的学习系统。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这篇文章真正提出的不是“用更多 Agent 自动化营销”，而是把营销从一次次 campaign 的生产流程，重构成一套围绕客户证据、可追溯实验、明确权限和持续反馈运行的学习系统。","sourceFormat":"markdown"},"note:sha256:f23fbcdc04a2f40b415a938f6997b223099dc8f232b6d4d91df9be36b9e212f0":{"html":"\u003cp\u003e营销工程师真正出现，是因为“提出想法的人”和“能把它做出来的人”开始变成同一个人。\u003c/p\u003e\n\u003cp\u003e一个营销人可以自己研究客户、搭页面、生成创意、接数据、上线测试。工作的基本单位也从“一次 campaign”变成了“一套持续产出 campaign 的系统”。于是，一个人一天跑几十个实验开始变得现实。\u003c/p\u003e\n\u003cp\u003e把视角拉远，整个营销史其实只有一个长期趋势：\u003cstrong\u003e一次实验的成本在持续下降。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e谁能跑最多的高质量实验，谁就学得最快；谁学得最快，谁就赢。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT88kbzbgAAnWtT?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"营销工程师真正出现，是因为“提出想法的人”和“能把它做出来的人”开始变成同一个人。\n\n一个营销人可以自己研究客户、搭页面、生成创意、接数据、上线测试。工作的基本单位也从“一次 campaign”变成了“一套持续产出 campaign 的系统”。于是，一个人一天跑几十个实验开始变得现实。\n\n把视角拉远，整个营销史其实只有一个长期趋势：**一次实验的成本在持续下降。**\n\n谁能跑最多的高质量实验，谁就学得最快；谁学得最快，谁就赢。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HT88kbzbgAAnWtT?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:fbb5b4bb95ab0a9ea56b87241453a3ec6b7868227892c991ab4113b49ab4327f":{"blocks":[{"children":[],"kind":"leaf","title":"第二件事，是面向真正影响 purchase 的人做营销。"},{"children":[{"title":"会向 40 个客户推荐软件的 accountant；"},{"title":"为客户选择工具的 agency；"},{"title":"每次都会被问“这个安全吗？”的 IT person。"}],"kind":"section","title":"例如"},{"children":[],"kind":"leaf","title":"直接为这些人做一条 campaign，给他们真正需要的材料，让他们能够对最终购买说 yes。"}],"html":"\u003cp\u003e第二件事，是面向真正影响 purchase 的人做营销。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e会向 40 个客户推荐软件的 accountant；\u003c/li\u003e\n\u003cli\u003e为客户选择工具的 agency；\u003c/li\u003e\n\u003cli\u003e每次都会被问“这个安全吗？”的 IT person。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e直接为这些人做一条 campaign，给他们真正需要的材料，让他们能够对最终购买说 yes。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"第二件事，是面向真正影响 purchase 的人做营销。\n\n例如：\n\n- 会向 40 个客户推荐软件的 accountant；\n- 为客户选择工具的 agency；\n- 每次都会被问“这个安全吗？”的 IT person。\n\n直接为这些人做一条 campaign，给他们真正需要的材料，让他们能够对最终购买说 yes。","sourceFormat":"markdown"}},"sourceRevision":"sha256:1a69f914d6d9e52c59f384cc66908cf3db0de65ecda71f88846e98ef8a6abd04"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=e}}function r(e,t){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${e}": ${t}`)}function i(e){const t=String(e||"").normalize("NFC").trim().replace(/\\/g,"/");t||r(t,"empty"),t.includes("\0")&&r(t,"nul_byte"),t.startsWith("/")&&r(t,"absolute"),/^[A-Za-z]:/.test(t)&&r(t,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*:/.test(t)&&r(t,"url_scheme"),t.endsWith("/")&&r(t,"directory");const n=t.split("/");return n.some(e=>!e||"."===e||".."===e)&&r(t,"unsafe_segment"),n.join("/")}function o(e){if(null===e||"string"==typeof e||"boolean"==typeof e)return
