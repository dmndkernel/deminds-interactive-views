</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-10-09T03:46:37.654Z","language":"zh-CN","name":"DeMinds","version":"1.0.48"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"营销工程师：用 AI Agent 做 100 倍更多实验","outlineVersion":1},"sourceRevision":"sha256:1a69f914d6d9e52c59f384cc66908cf3db0de65ecda71f88846e98ef8a6abd04","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Marketing Engineers  100x More Experiments with AI agents.md","sourceUrl":"https://x.com/gregisenberg/status/2108188646973313195","title":"营销工程师：用 AI Agent 做 100 倍更多实验"},"files":[{"byteLength":39877,"content":"# 营销工程师：用 AI Agent 做 100 倍更多实验\n\n![图像](https://pbs.twimg.com/media/HUHIMEwbYAAW70H?format=jpg\u0026name=medium)\n\n\u003e @gregisenberg · [X 文章](https://x.com/gregisenberg/article/2108188646973313195) · 2026-10-08\n\n营销工程师正在成为新的“10x 员工”，而大多数公司现在还没有这样的人。\n\n如果你正在做一家初创公司、一门生意，或者一份副业，那么成为营销工程师，或招聘一名营销工程师，可能是你眼下最大的杠杆。这也许是自 Google 推出 AdWords 以来，营销最令人兴奋的时刻。甚至可能是有史以来最令人兴奋的时刻。\n\n过去 20 年里，营销点子并不难想，难的是把它真正做出来。销售知道为什么交易会成交，客服知道为什么客户会流失，但每一个想法都得经过 brief、设计师、开发者、分析师和两轮会议，大多数最后都死在 Slack 线程里。\n\n这个瓶颈刚刚被打破。\n\n![图像](https://pbs.twimg.com/media/HUCeZJxbcAED0KN?format=jpg\u0026name=medium)\n\n现在，一个 Agent 可以在十分钟内读完上周的销售通话；另一个把客户原话变成落地页；另一个在你睡觉时上线 30 个广告并停掉表现差的；还有一个会在周一告诉你，究竟是哪条 campaign 带来了真正付费的客户。如今模型已经足够强，只要你的想法够好，输出通常也会够好。\n\n营销工程师做的，就是把这些 Agent 接成一台机器。他一半是营销人，一半是 builder。最优秀的人往往甚至不是传统营销出身，而可能来自创始人、工程师、运营或独立开发者。\n\n**所以准备好咖啡或茶，下面是一份完整 playbook（阅读约 15–20 分钟）。**\n\n## 为什么 Marketing Engineer 正在出现\n\n### 我们是怎么走到这里的\n\n#### Mad Men 时代：一年只有少数几次昂贵机会\n\n从 1950 年代到 1990 年代的 Mad Men 时代，营销意味着印刷、电视、广播和户外广告。工作核心是大创意和大预算。一场 campaign 可能耗资数百万、制作数月，运气好的话，一个季度后才能知道有没有效果。优秀营销人一年真正出手的机会屈指可数，所以整个行业高度依赖品味、说服力和直觉。\n\n#### 数字营销人：渠道开始可测量\n\n然后 Google 在 2000 年推出 AdWords，Facebook 在 2007 年推出广告产品，突然之间，每一次点击都可以被记录。数字营销人由此诞生。\n\n工作变成管理 SEO、付费搜索、邮件、展示广告等渠道。营销人开始长期生活在 dashboard 里，真正厉害的人往往是最懂平台机制的人。实验频率也提高到了每月几次。\n\n#### 增长黑客：营销开始像产品\n\n到了 2010 年代，增长黑客出现了，我永远不会忘记那段时期。Sean Ellis 在 2010 年创造了这个词，而整个十年里最经典的招数后来都成了行业传说。\n\nHotmail 在每封邮件底部放上“P.S. I love you. Get your free email at Hotmail”；Dropbox 给邀请人和朋友都赠送免费存储空间；Airbnb 让房东把房源同步发布到 Craigslist。\n\n增长黑客像做产品一样做营销：漏斗、增长循环和 A/B 测试都成为日常。但问题在于，每一个好点子仍然需要工程师，而工程师属于产品 roadmap。增长黑客有一半时间都在写 ticket、排队等开发。一个星期能跑几个实验，就已经算非常高效。\n\n#### AI 辅助营销人：草稿更快，系统没变\n\nChatGPT 在 2022 年底出现后，我们进入了 AI 辅助营销人的阶段。文案更快，图片更快，但其它东西基本没变。\n\n还是同样的组织结构、同样的会议、同样六周一个周期，只不过第一版草稿更好了。这有点像 AI Copilot 时代。大多数营销团队现在其实仍然停留在这里。\n\n#### 营销工程师：想法和实现合并到同一个人\n\n营销工程师真正出现，是因为“提出想法的人”和“能把它做出来的人”开始变成同一个人。\n\n一个营销人可以自己研究客户、搭页面、生成创意、接数据、上线测试。工作的基本单位也从“一次 campaign”变成了“一套持续产出 campaign 的系统”。于是，一个人一天跑几十个实验开始变得现实。\n\n把视角拉远，整个营销史其实只有一个长期趋势：**一次实验的成本在持续下降。**\n\n谁能跑最多的高质量实验，谁就学得最快；谁学得最快，谁就赢。\n\n![图像](https://pbs.twimg.com/media/HT88kbzbgAAnWtT?format=jpg\u0026name=medium)\n\n### 为什么这件事如此重要\n\n#### 客户知识其实一直散落在公司各处\n\n每家公司都坐在一堆几乎没被真正利用的金矿上（我知道这听起来难以置信，但确实如此）。\n\n![图像](https://pbs.twimg.com/media/HUCehtAbwAAOKjs?format=jpg\u0026name=medium)\n\n销售每周都会听到同样五种异议；客服非常清楚哪些承诺最容易导致退款；创始人对品类有很多鲜明观点，却只存在脑子里和几段播客里；分析团队知道哪些页面带来的客户留存最好。\n\n这些信息散落在不同工具里，由不同的人掌握，往往一个季度才有机会真正进入一次 campaign。\n\n#### 过去，小而具体的营销想法太贵了\n\n与此同时，那些最能把这些知识用起来的小想法，总是输给“大发布”。\n\n为某个细分人群做一个定价计算器；把昨天销售通话里的洞察做成一条 campaign；某个功能终于上线时，给曾经提出这个需求的 40 位老客户发一封消息。\n\n过去，每件事都需要设计师、开发者、分析师和两轮会议，于是它们就一直躺在 backlog 里。\n\n#### 当“具体营销”变便宜\n\n营销工程师可以在一个下午把这些事全部做出来。\n\n当“为具体人、具体场景做具体营销”变得便宜时，真正开始占优势的，是最了解客户的公司。按小时收费的 agency 会最先感受到变化；庞大的营销团队会越来越像委员会；创始人和独立营销人则可能突然拥有过去一个完整部门的产出能力。\n\n注：我的合伙人刚推出了 [Boring Funnels](https://boringfunnels.com/)。背后的想法是，最大的机会在于帮助企业把自己已经知道的客户知识，转成清晰的 offer、有用的落地页，以及最终促成销售的 follow-up。营销工程师可以把整套东西搭出来，观察用户在哪一步流失，并随着更多客户进入不断优化。\n\n下面具体讲怎么做。\n\n## 如何搭建 Marketing Engineer 系统\n\n### 第 1 步：搭好你的工作台\n\n#### 从 Agent 工作区开始\n\n一切都从 Agent workspace 开始。Claude Code、Codex 和 Cursor 是比较常见的选择。\n\n最简单的理解方式是：把这些工具想成一个住在你电脑某个文件夹里的超高速 junior employee。它能读取那个文件夹里的所有文件、创建新文件、运行代码，也能使用你连接给它的任何工具。\n\n#### 连接 Agent 需要的工具\n\n真正神奇的是最后这一点。\n\n工具通过 MCP 之类的方式连接，可以把它粗略理解为给 AI 用的通用插口。HubSpot、Stripe、Notion、Slack 等大量工具都有 MCP server，于是 Agent 可以像你一样读取 CRM，或者拉取上周收入数据。\n\n如果某个工具只有 API，Agent 通常也可以写出调用它的代码。\n\n#### 加入定时运行，但不要拿掉审批\n\n你还会希望 Agent 在你睡觉时按计划执行任务。\n\n一年前，这通常意味着要用 Zapier 或 n8n 之类的 workflow 工具把各个环节串起来。现在，你可以直接让 coding agent 帮你把它写出来。\n\n比如告诉它：“每周一早上 7 点运行，把报告发到 Slack，在任何内容真正发送前等我点 👍。”它可以写出定时任务、带 approve 按钮的 Slack 消息，以及只有在你点击之后才继续执行的代码。\n\n或者你也可以使用 Hermes、OpenClaw 这类常驻后台的 Agent。无论哪种方式，代码都在你的文件夹里，你可以用一句话修改其中任何部分。\n\n### 第 2 步：写好“大脑”\n\n#### 先做上下文，再做 Agent\n\n我反复看到同一种错误：有人一兴奋就启动十个 Agent，得到一大堆泛泛的垃圾输出，然后得出结论——AI 营销被吹过头了。\n\n其实 Agent 没问题，问题是上下文太薄。\n\n这就像你招来一个非常聪明的营销人，却跳过 onboarding。他会写出听起来很聪明的行业内容，但和竞争对手写的一模一样。\n\n所以，在构建任何 Agent 之前，先构建“大脑”：一个文件夹，把你的业务解释得像你在给一个第一天入职、脑子很快的新员工做 onboarding 一样。\n\n我会这样组织：\n\n![图像](https://pbs.twimg.com/media/HUCa05XacAAtaHo?format=jpg\u0026name=medium)\n\n六个文件可以承担绝大部分工作。\n\n#### 1. `START-HERE.md`\n\n这是每个 Agent 最先读取的一页。\n\n它说明公司做什么、服务谁、本季度优先级是什么，以及其它资料分别放在哪里。\n\n#### 2. `company/customer-fit.md`\n\n这个文件描述谁会购买、谁会留下，以及你能盈利地服务谁。必须具体到让 Agent 真正有东西可用。\n\n“Shopify 商店，年营收 100 万到 1000 万美元，创始人仍然自己做账，而且以前被记账员坑过”会给 Agent 很强的上下文。\n\n“SMBs”几乎什么都没告诉它。\n\n#### 3. `company/offers.md`\n\n这里列出你卖什么、价格是多少、允许承诺什么，以及哪些话在公开之前必须经过审批。\n\n#### 4. `brand/voice.md`\n\n这是大多数人最偷懒的地方。\n\n“友好但专业”对 Agent 几乎没用。更好的做法是，放进 3 封你真正喜欢的邮件或广告，并为每个例子写一句为什么它有效；再放 2 个你否掉的版本，并解释原因。\n\n例如：“我们否掉这一版，因为它承诺 30 天出结果，而我们不能保证。”\n\nAgent 从实例里学到的东西，远比从几个形容词里多。\n\n#### 5. `brand/founder-opinions.md`\n\n这是你的不公平优势。\n\n所有竞争对手都能用同样的模型，只有你拥有创始人对品类、客户和竞争的独特判断。\n\n花两个小时采访创始人，或者采访你自己，把所有鲜明观点写下来。\n\n例如：“我们这个行业的大多数 agency 在 onboarding 上收费过高。”  \n或者：“我们最好的客户来自会计师推荐。”\n\n真正让输出听起来像你的，正是这些观点。\n\n#### 6. `decisions/failed-campaigns.md`\n\n这里存放那些用真金白银换来的教训。\n\n“免费审计吸引来的公司规模太小，根本买不起我们。”  \n“LinkedIn 带来了很多 leads，但几乎没有成交。”\n\n这样一句记录，就可能避免 Agent 再犯一次价值 20,000 美元的错误。\n\n#### 把猜测和公司事实分开\n\n有一条规则能让这套“大脑”保持健康：Agent 可以把猜测写进 `evidence/`，但只有人能把内容移动到 `company/`。\n\n否则，一个 Agent 的猜测很容易悄悄变成公司政策。\n\n### 第 3 步：连接你的数据\n\n#### 把客户真相所在的地方接进来\n\n接下来，给“大脑”装上眼睛。\n\n把真正存在客户事实的地方连接起来：Gong 或 Fathom 里的通话录音，Intercom 或 Zendesk 里的客服工单，HubSpot 或 Salesforce 里的交易，PostHog 或 Google Analytics 里的行为数据，以及 Stripe 里的收入。\n\n#### 一开始全部只读\n\n所有系统先从 read-only access 开始。\n\n一个能读取 CRM 的 Agent，从第一天就已经很有用；一个能修改 CRM 的 Agent，则应该随着可靠性逐步“赢得”这个权限。\n\n#### 给每一条 campaign 一个 ID\n\n然后做一件几乎所有公司都会跳过、但其实极其重要的“无聊工作”：给每条 campaign 分配一个 ID，并让这个 ID 贯穿所有地方。\n\n把它写进每个链接的 UTM、每个广告名称、每条邮件 sequence 的名字，以及 CRM 中每一笔 deal 的字段里。\n\n再维护一张简单的表，哪怕一开始只是 Supabase 或 spreadsheet。每条 campaign 一行，包括：ID、spend、leads、qualified calls、deals、revenue、churn。\n\n#### 把营销活动连接到“付费并留下来的客户”\n\n听起来一点都不性感，但这可能是整个系统里最有价值的部分。\n\n大多数公司能告诉你“某条 campaign 有多少点击”，也能告诉你“某个客户贡献多少收入”，但很少有人真正把这两张表连接起来。\n\n一旦接通，Agent 就能回答真正重要的问题：\n\n**到底是哪种营销，带来了那些真的付钱、而且留下来的客户？**\n\n### 第 4 步：先做第一个 Agent\n\n#### 先把一个 Agent 做可靠\n\n先只做一个 Agent，并把它做到足够好，再做第二个。\n\n第一天就让六个 Agent 相互聊天，通常只会让你周末花时间调试一个 group chat。\n\n#### 从“客户语言 Agent”开始\n\n第一个最适合做的，是 customer language agent，因为后面的所有 Agent 都会依赖它发现的东西。\n\n它的任务，是读取客户真正说过的话，并抽取他们描述问题时使用的原始语言。\n\n把最近 20–50 份销售通话 transcript 导出到 `evidence/calls/`，然后给它类似这样的指令：\n\n读取 `evidence/calls/` 中的每一份 transcript。\n\n![图像](https://pbs.twimg.com/media/HUCa6rbbkAAhB9C?format=png\u0026name=medium)\n\n#### 不断纠正指令，直到输出变好\n\n然后把报告和你自己对这些通话的记忆放在一起对照。\n\n第一版可能只有大约 70% 正确。它也许会过度放大某个特别健谈的客户，或者用营销术语给客户群体起名字。\n\n每发现一个错误，就修正指令，并把这次修正写进 `decisions/`，让它下次还记得。\n\n三四轮之后，它读取销售通话的质量可能会超过团队里的大多数人。\n\n#### 找出真正能卖东西的客户原话\n\n例如，你卖的是面向水管工和 HVAC 公司的排班软件。\n\nAgent 发现很多老板都反复表达某种类似的话：\n\n“我受够了吃晚饭的时候还要接工作电话。”\n\n这一句话本身就可以成为广告、headline 和销售开场白。\n\n它往往比“automated scheduling”强，因为人们购买的常常是他们身处的具体情境，而不是一个抽象功能。\n\n#### 可靠以后再定时运行\n\n等它足够可靠后，再让它按计划运行。\n\n每周一，它读取上周的通话和 ticket，并把一份新报告放进 `evidence/customer-language/`。\n\n这样，你的整个营销系统就开始基于“客户上周真实说了什么”运行，而不是基于“某个人去年猜了什么”。\n\n\n### 第 5 步：再加入另外五个 Agent\n\n等第一个 Agent 稳定后，再一个一个加入其它 Agent。每个 Agent 都有自己位于 `workflows/` 下的文件夹、自己的 instructions 和自己的 schedule。\n\n#### 购买触发 Agent\n\n购买触发 Agent 负责监测那些会在一夜之间产生需求的时刻。\n\n一家公司开了第二家门店；一个品牌开始做批发；一家 startup 完成融资并同时发布五个销售岗位；你集成的某个工具刚刚上线新功能——这些都可能是 trigger。\n\n最简单的搭建方式之一是在 Clay 里完成。先拉一组符合 `customer-fit.md` 的 account，然后增加不同列，检查每种 trigger，比如新招聘、融资新闻、新门店、网站新增页面等。Apollo 很适合补充联系人数据。\n\n对于每个出现新 trigger 的 account，Agent 先查 CRM，跳过团队已经在跟进的人，然后完成一句话：\n\n“这个事件会产生这个问题，而我们的产品可以用这种具体方式解决它。”\n\n如果这句话很模糊，这个 account 就先不动。如果这句话足够清晰，Agent 就起草一封以该事件开头的短邮件，并把它保存为 draft，交给你审核。\n\n正是这句过滤条件，让 outbound 更像“在恰当时机出现”，而不是 spam。\n\n#### 搜索 Agent\n\n搜索 Agent 找出人们在购买前最常问的问题，并为每个问题做出互联网上最好的页面。\n\n给它三个信息源：\n\n1. Search Console 数据；\n2. 销售通话里出现的问题；\n3. 当你向 ChatGPT、Claude 和 Perplexity 询问所在品类时，它们给出的回答。\n\n第三个来源很新，而且被严重低估了。\n\n每周都向这些 AI engine 提问你的买家会问的问题，并记录它们推荐哪些公司和来源。这样你能看到模型信任什么，也能看到你自己在哪里“不可见”。\n\n然后，做出比现有页面更有用的内容，因为 AI search 更偏爱真正有用的页面，而不只是“最优化”的页面。\n\n比如，一家商用厨房设备供应商可以写一份“如何开第一家餐厅”的指南，再加一个计算器，根据空间和预算推荐适合的设备。\n\n这样的页面既能获得排名，也可能被 AI engine 引用，还会被真正的买家收藏，等到准备购买时再回来。\n\nAgent 可以在一个下午把这个 calculator 写出来，并发布到 Next.js + Vercel；如果追求速度，也可以用 Framer。\n\n#### 创意 Agent\n\n创意 Agent 负责制作和测试广告。\n\n给它最新的客户语言报告、`offers.md` 里经过批准的 claims、真实产品录像和截图，以及一个你喜欢的广告素材文件夹。\n\n不要让它只是写同一句 headline 的 50 个版本，而是要求它给出不同的“购买理由”：\n\n- 一个广告完整演示一个 worked example；\n- 一个讲客户故事；\n- 一个直接做原始产品 demo。\n\nNano Banana 之类的图片模型，以及 Veo 之类的视频模型，让生产成本几乎降到了零。\n\n给每条广告命名时，要把它真正测试的东西写进去，例如 `BK014_dinner-angle_ugc_v2`。\n\n这样 campaign ID、idea 和 format 都直接写在名称里。\n\n一个月后，“dinner angle 打败了 price angle”是一条可以复用到其它地方的知识；“`video_final_7` 赢了”则只是无意义的 trivia。\n\nAgent 通过 Meta Ads API 上传广告，但保持 paused 状态，由人来真正点击上线。\n\n然后让一段小脚本每天早晨检查结果，在达到预设 spend 后，把 CTR 低于 1% 的广告暂停。\n\n在实验开始前就决定 evidence bar：要花多少钱、跑多少天、什么算 win。\n\n否则，即使做了 200 个广告，也可能只是得到 200 个没有结论的实验。\n\n#### 丢单 Agent\n\n丢单 Agent 是最有可能“养活”其它 Agent 的那个。\n\n把 CRM 里所有 closed-lost deal 连同 notes 和 call transcript 拉出来。\n\n“Not interested”只是对一段真实对话非常偷懒的概括。让 Agent 重新读取每笔丢单，记录真正的原因，以及重新打开机会的 condition。\n\n例如：\n\n“选择了竞争对手，合同 3 月续约。”  \n“需要 SSO。”  \n“Champion 离职了。”\n\n然后 Agent 持续监测这些 condition。\n\n你的 changelog 一旦显示 SSO 已上线，所有当初提出 SSO 的 prospect 都会得到一封引用原始通话内容的个性化 draft。\n\n续约期临近时，你再次出现。Champion 去了新公司时，你先祝贺，再重新介绍自己。\n\n尊重 opt-out 和 contact preference，你会发现，大多数公司的 CRM 里其实堆着大量“尚未真正结束的收入机会”。\n\n#### 效果 Agent\n\n效果 Agent 每周一读取 campaign table，然后像一个优秀分析师那样写一份简短 memo。\n\n例如：\n\n“profitability review 页面转化率 4%，但其中一半 leads 规模太小，不适合服务。”  \n“dinner ad 的 qualified call acquisition cost 最低。”  \n“Retargeting 已花 3,000 美元，只带来两次销售对话。”\n\n每一行最后都落到一个决策：keep、kill、change 或 test。\n\n一定要把数据接到 retention、refund 和 profit。\n\n一条 campaign 可能带来很多便宜客户，但这些客户 60 天后全部 churn。它在 dashboard 上会看起来非常漂亮，却在安静地亏钱。\n\n效果 Agent 就是用来抓这种问题的。\n\n### 第 6 步：把护栏放进工具，而不是只写在 Prompt 里\n\n#### Prompt 不是护栏\n\n最快的翻车方式，就是相信 Prompt 里的一句话。\n\n“发送之前永远先问我”对模型来说只是一个礼貌建议。\n\n真正的 guardrail 应该存在于工具里。\n\n#### 最小权限 + 硬审批\n\n给每个 Agent 它真正需要的最小权限。\n\noutreach Agent 只有 email draft 权限；广告 Agent 只能创建 paused 状态的广告；预算仍然掌握在你手里。\n\napproval step 直接存在代码里。比如 Slack 消息带一个 approve 按钮，action 会一直等待，直到你真正点击。\n\n像 spend cap、suppression list、deduplication 这样的精确规则，交给普通代码。\n\n而像“这个 account 是否合适”“这条 message 是否听起来像我们”这类判断，则交给模型。\n\n#### 给每个 Agent 写一份简短 contract\n\n然后给每个 Agent 写一个短 contract，就像带 guardrail 的 job description。\n\n下面是一份购买触发 Agent 的例子：\n\n![图像](https://pbs.twimg.com/media/HUCbFV0bsAAfDqN?format=jpg\u0026name=medium)\n\n#### 让失败变得可见\n\n“Done”意味着：它在自己的限制范围内检查了每个来源，而且明确告诉你哪里失败了。\n\n一个会说“今天这个 source 失败了”的 Agent，比十个默默跳过失败步骤的 Agent 更有价值。\n\n### 第 7 步：端到端跑一条 campaign\n\n![图像](https://pbs.twimg.com/media/HUHH3H-aMAArNw1?format=jpg\u0026name=medium)\n\n下面看看整套系统协同起来会是什么样。\n\n假设一家 bookkeeping firm 想获得更多 ecommerce 客户。\n\n#### 周一：从客户语言形成 offer\n\n周一，客户语言报告显示，店主们一直在反复说同一句话：\n\n“扣掉退款、物流和手续费后，我根本不知道自己到底赚没赚钱。”\n\n上个月有 11 位不同客户都表达过类似意思。\n\n你把这条洞察拿给真正负责交付服务的人看，问公司是否真的能解决这个问题。\n\n对方说可以，而且这是每个新客户进来后，他们最先处理的问题。\n\n于是，你在 `offers.md` 中批准一条 offer：为年销售额 100 万到 1000 万美元的商店提供一次免费的 profitability review。\n\n#### 让 campaign ID 贯穿每一步\n\n这条 campaign 获得 ID：`BK014`。\n\n从这里开始，所有内容都带着它。\n\n#### 周二：让不同 Agent 基于同一份证据工作\n\n周二，创意 Agent 根据客户原话做出三个 angle：\n\n- 你的利润到底消失在哪里；\n- 一份示例月度报告；\n- 一个真实客户的小故事。\n\n搜索 Agent 做出一个简单的 profit calculator 页面，里面使用公司已经验证过的数字。\n\n丢单 Agent 找出 60 个曾经说“也许年底后再说”的老 prospect，并为每个人起草一封个性化消息。\n\n购买触发 Agent 则标记出刚刚开始在 Amazon 销售的商店，因为 multichannel selling 会让账务变得更复杂。\n\n#### 周三：上线前由人统一审核\n\n周三，你一次性审核所有内容。\n\n其中一个广告承诺了公司无法保证的 savings，于是你删掉它。\n\n其余内容审核通过，然后启动一个 2,000 美元的 test。\n\n#### 两周后：把 spend 接到真正签约客户\n\n两周后，效果 Agent 把 spend 连接到 booked review，再把 review 连接到 signed client。\n\nprofit calculator 页面转化最好；Amazon trigger list 带来的 call 最多。\n\n同时，它也提醒你：sample 仍然很小。\n\n#### 让客户原话从头到尾保留下来\n\n你会发现，客户最初说过的话贯穿了整个过程。\n\n通常，一条非常锋利的 insight 会依次经过 research summary、brief 和五轮编辑，最后被磨得和互联网上所有 bookkeeping 广告一样。\n\n而在这里，quote 会和 campaign folder 一起流转，所以每一个 Agent 都能看到原始语言。\n\n![图像](https://pbs.twimg.com/media/HUCamhEaAAAzHyA?format=jpg\u0026name=medium)\n\n### 第 8 步：运行每周循环\n\n#### 工作开始更像“编辑系统”，而不是不停从零制作\n\n系统搭好后，你的工作会越来越像 editing，而不是 making。\n\n周一：阅读 performance memo，做 keep / kill / change 决策。  \n周二和周三：build，修复上周产出较差的 workflow，并上线新 test。  \n周四：和销售、客服通话，因为下周最好的 idea 往往藏在那里。  \n周五：审核 Agent 的产出，并更新文件。\n\n#### 建立一个能快速决策的 review queue\n\n整套系统的核心是 review queue。\n\n其中的每一项都应该在一分钟内完成判断。\n\n例如：\n\n“批准这个修改后的 offer。它会影响这两条广告和这封邮件。”\n\n要让 review item 清楚显示：\n\n- 改了什么；\n- 会影响什么；\n- 背后的 evidence 是什么。\n\n#### 每一次拒绝，都应该改善下一轮输入\n\n只有当你改变输入，系统才会真正变聪明。\n\n如果你拒绝一条广告，是因为它吸引来的公司规模太小，就更新 `customer-fit.md`。\n\n如果一个 prospect 误读了 offer，就加入相应检查。\n\n维护一份 experiment log，记录测试了什么、为什么测、发生了什么、下一步怎么做。\n\n还要为每个 Agent 保存 10 个 example input，以及对应的 expected output。每次修改 instruction 后，把这组 example 重新跑一遍，这样你能立刻知道系统是不是变差了。\n\n#### 输出一直很差时，先修“大脑”或 contract\n\n如果你发现自己整天都在修 Agent output，那么问题通常发生在上游。\n\n几乎总是“大脑”或者 contract 有问题。\n\n\n## 把系统扩展到增长引擎\n\n### 创意引擎\n\n大多数人还没有真正跟上一个变化：\n\n**创意正在成为新的 targeting。**\n\nMeta 已经重建了它决定“哪个广告该展示给谁”的方式。它的新系统 Andromeda 在 2025 年底完成全球 rollout，会直接读取广告本身来判断适合展示给谁。\n\n你的图片、hook 和 script，现在正在承担过去 interest targeting 的一部分工作。\n\n这对懒惰广告主有一个很残酷的副作用：Andromeda 会把看起来很像的广告归为一组，并把它们当作同一种东西。\n\n于是，50 个只是换了 headline 的版本，获得的 reach 可能和一个广告差不多。\n\n而且，现在一个 winning ad 往往两三周就开始疲劳，而不是过去的六周。\n\n所以，真正的工作是持续产出**真正不同的 idea**。\n\n过去这通常需要一支 production team；现在需要的是一套 creative engine。\n\n我会这样搭。\n\n#### 从文字开始\n\n把 `voice.md` 和最新的客户语言报告交给 Claude 或 GPT 这样的 frontier model，让它为 8–12 个真正不同的 concept 写 script。\n\n比如：\n\n- 一个 pain point；\n- 一个 worked example；\n- 一个 customer story；\n- 一段 founder rant；\n- 一个 comparison；\n- 一个你想拆穿的 myth。\n\n每个 concept 再配 2–3 个 hook。\n\n真正的 strategy 在这一步，所以你的时间应该花在这里。\n\n#### 一个很有用的捷径：从已经有效的 funnel 开始\n\n**一个很有帮助的捷径，是从已经有效的 funnel 开始。**\n\n我的合伙人之前没有太公开谈这件事，但 [@BoringMarketer](https://x.com/@BoringMarketer) 刚刚推出了 [Boring Funnels](https://boringfunnels.com/)。\n\n它每周拆解一条真实、正在运行的 funnel，从广告一直拆到最后一封邮件，再把每一步转换成可以直接交给 coding agent 的 prompt。\n\n这比从一张白纸开始要好得多。\n\n![图像](https://pbs.twimg.com/media/HUChi1tboAAm1GF?format=jpg\u0026name=medium)\n\n#### 然后做图片\n\nNano Banana、GPT Image 和 Midjourney 现在已经能生成在手机屏幕上也足够成立的 product shot、lifestyle scene 和 static ad。\n\n诀窍是，把真实产品照片喂给模型，让产品本身保持准确，而让模型修改产品周围的一切。\n\n#### 然后做视频\n\nVeo、Kling 和 fal 可以把 script 或静态图转成短视频。\n\n对于 talking-head ad，Arcads、HeyGen 和 Creatify 可以生成 AI actor，用数十种语言朗读 script。\n\nElevenLabs 处理 voiceover，CapCut 或 Captions 处理 editing。\n\n#### 用 AI actor 测试，再花钱让真人来赢\n\n这是 AI UGC 里一个很实用的做法。\n\nAI actor 让你可以用一条真人 creator video 的成本，在一天内测试 20 个 script。\n\n一旦知道哪条 script 真正有效，再让真人来讲，通常会表现得更好，也更能建立信任，同时还能更好遵守那些要求标注 AI 内容的平台规则。\n\n#### 让 Agent 运行循环\n\nAgent 把每个 concept 以 paused 状态上线，由人真正点击 go。\n\n一段 script 在达到预定 spend 后暂停 loser。\n\n每周一，效果 Agent 告诉你哪些 concept 赢了、下周应该测试哪些 hook。\n\n于是你的工作变成挑 idea、判断 taste，机器负责 volume。\n\n现在，在 paid social 上表现最好的营销工程师，一个月可以上线几十个真正不同的 concept，而且不需要一支传统 production team。\n\n### 社交引擎\n\nPaid 往往最吸引注意力，但 organic social 才是营销工程师悄悄建立不公平优势的地方。\n\n它是免费 distribution，也是目前最便宜的 creative testing lab。\n\n#### 把 organic 当成你的试验厨房\n\n先把 10 个 hook 做成 organic TikTok、Reels 或 X post。\n\n观察 algorithm 会把哪些推起来，再把预算投到 winner 上。\n\n你先免费知道什么有效，然后 ad budget 只花在已经证明过的 idea 上。\n\n#### 把一切都剪成短内容\n\n一份长内容——比如 podcast、webinar，或者创始人边走边讲的一段 rant——都可以拆成 20 条 short clip。\n\nOpus Clip 之类的工具可以找出最好的片段并自动加 caption，Agent 还能把它们排期到不同平台。\n\n很多最大的 podcast 就是这样增长起来的。\n\n#### 使用“不露脸也能规模化”的格式\n\nTikTok 和 Instagram 上的 slideshow 和 carousel，很适合根据客户语言报告批量制作。\n\n它们既容易生产，也经常获得大量 save。\n\nAgent 写 slides，模型生成图片，你在周日统一审核整批内容。\n\n#### 先听，再说\n\n让 Agent 去读 Reddit、X、TikTok comment，以及竞争对手 review。\n\n每周汇报大家在抱怨什么、问什么、为什么兴奋。\n\n然后，让它为那些“你的产品确实能帮上忙”的 thread 起草真正有用的回复，但最终由你本人发布。\n\n尤其在 Reddit 上，一个真人给出的有用答案，通常比任何广告都强；而一条 spammy 回复会直接让你被 ban。\n\n#### 把创始人真正用起来\n\n当所有品牌都可以生成内容时，feed 上最稀缺的东西反而是：**一个真实的人，以及他真实的观点。**\n\n把 `founder-opinions.md` 变成内容引擎。\n\nAgent 每天根据这些观点写一个 draft，你再把它编辑成真正属于你的声音，然后自己点击 publish。\n\nAI 反而让 founder 变得更有价值，因为创始人本人是唯一无法被竞争对手生成出来的东西。\n\n保持两条规则：\n\n1. 平台要求标注 AI-generated people / scene 时，就明确标注；\n2. publish button 始终留在人手里。\n\n## 如何成为前 1% 的营销工程师\n\n基础系统能够自行运行以后，真正有意思的部分才开始。\n\n### 构建决策工具\n\n第一件事，是构建 decision tool。\n\n比如一家包装公司做一个 calculator，告诉客户哪种 box size 最能降低 shipping bill。\n\n一家软件公司做一个 migration checker，扫描客户当前 setup，然后清楚说明哪些东西可以顺利迁移。\n\n过去，这些通常是六个月的工程项目，所以很少有人会做。\n\n现在，一个营销工程师可能一周就能上线一个粗糙但可用的版本。买家会收藏它，并在真正准备购买时回来。\n\n### 营销给那些“影响购买的人”\n\n第二件事，是面向真正影响 purchase 的人做营销。\n\n例如：\n\n- 会向 40 个客户推荐软件的 accountant；\n- 为客户选择工具的 agency；\n- 每次都会被问“这个安全吗？”的 IT person。\n\n直接为这些人做一条 campaign，给他们真正需要的材料，让他们能够对最终购买说 yes。\n\n### 在 onboarding 里修 acquisition\n\n第三件事，是把 acquisition 问题往 onboarding 里看。\n\n有时 ads 根本没问题，真正的问题是新客户第一周太困惑，于是迅速 churn。\n\n一个能读取 onboarding ticket、找出人们卡在哪里的 Agent，可能比你下一组 ad set 更能推动增长。\n\n### 让每个渠道承担不同工作\n\n第四件事，是给每个 channel 明确职责。\n\nSearch 回答问题。  \nSocial 发起对话。  \nEmail 在具体时刻出现。\n\n如果每个 channel 都在重复同一句 message，你其实是在为同一条 impression 付五遍钱。\n\n## 工具栈与能力要求\n\n### 工具栈\n\n下面是按工作类型整理的完整 toolkit。\n\n工具每隔几个月就会变化，所以真正该学的是 category，再根据需要替换具体名字。\n\n- **Agent workspace：** Claude Code、Codex、Cursor、Google AI Studio\n- **Always-on agents：** Hermes、GrokBot、Codex\n- **Writing and strategy：** Claude、ChatGPT、Gemini\n- **Images：** Nano Banana、GPT Image、Midjourney\n- **Video：** Veo、Sora、Kling、Runway、Fal\n- **AI actors and UGC：** Arcads、HeyGen、Creatify\n- **Voice：** ElevenLabs\n- **Funnels：** [BoringFunnels.com](https://boringfunnels.com/)\n- **Editing and clipping：** CapCut、Captions、Opus Clip\n- **Customer voice：** Gong、Fathom、Intercom、Zendesk、G2\n- **CRM：** HubSpot、Salesforce\n- **Signals and enrichment：** Clay、Apollo\n- **Search and AI visibility：** Ahrefs、Semrush、Google Search Console\n- **Ads：** Meta Ads API、Google Ads API\n- **Email and outbound：** [Customer.io](https://customer.io/)、Resend、Instantly\n- **Web：** Next.js on Vercel、Framer、Webflow\n- **Measurement：** PostHog、Stripe、Supabase\n\n### 你需要学什么\n\n这份工作一半是 marketer，一半是 builder，两边都要懂。\n\n#### 营销人的一半\n\n这一半，仍然是优秀营销人一直以来就必须掌握的能力。\n\n你要知道：\n\n- 怎样做 customer interview，并听出真正重要的那句话；\n- 怎样做 positioning，让正确的人感觉产品就是为自己做的；\n- 怎样设计一个真正有购买理由的 offer，而不是披着伪装的 discount；\n- 怎样写出让人停止滑动的 headline；\n- 每个 channel 是怎样决定内容被谁看到的；\n- 以及足够的 statistics，知道一个结果是真实 signal，还是只是 fluke。\n\n#### Builder 的一半\n\n这一半更新，但其实比很多人想象中更容易学。\n\n你需要：\n\n- 写出 Agent 真正能使用的 context——这可能是整份清单里最被低估的技能；\n- 至少能读代码，判断它到底有没有做你要求的事，因为 Agent 写代码，但最终责任是你的；\n- 理解 API 和 MCP 怎样连接工具；\n- 会写基础 SQL，自己拉数字；\n- 能部署一个页面；\n- 会用 git；\n- 会写 test case；\n- 大致知道每一次 Agent run 会花多少钱。\n\n#### 最快的学习方式：真正上线一个东西\n\n学习 builder 这半边最快的方法，是这个周末用 AI coding tool 做一个很丑的 landing page，然后真正部署上线。\n\n一个真正 deployed 的页面，比十门课教你的东西更多。\n\n## 接下来会走向哪里\n\n![图像](https://pbs.twimg.com/media/HUHHn_3bsAATORV?format=jpg\u0026name=medium)\n\n### 如果这周就开始\n\n如果是我这周从零开始，我会这样做：\n\n如果你是 marketer：构建客户语言 Agent，并用最近 20 次销售通话来跑它。\n\n如果你是 engineer：参加 5 次销售通话，然后为一个具体 customer segment 做一个 calculator。\n\n如果你是 founder：这个周末留出两个小时写 `founder-opinions.md`，因为你之后构建的每一个 Agent 都会因此变得更锋利。\n\n### 让每一个 workflow 自己赢得信任\n\n在 workflow 真正赢得你的信任之前，publish、outreach 和 spend 都继续放在 approval 后面。\n\n先把一个 workflow 做可靠，再添加下一个。\n\n一个每天早晨自动运行、但本身很混乱的 workflow，只会稳定地给你制造一批混乱。\n\n### 作者对下一代营销团队的判断\n\n在营销史的大部分时期，赢家往往是预算最大、人最多的公司。\n\n我认为接下来十年，赢家会变成：\n\n**最了解客户，而且行动最快的人。**\n\n我的猜测是，到 2028 年，最好的营销团队可能只有一两个 marketing engineer，却运行着几十个 Agent，产出速度会超过人数是它十倍的部门。\n\n而这些未来的营销工程师，大多数现在其实就坐在 growth、content 和 ops 岗位上。\n\n他们距离成为营销工程师，可能只差一个周末真正开始 build。\n\n### 更多资源与合作方式\n\n如果你想继续深入，我在 [@startupideaspod](https://x.com/@startupideaspod) 做过一期完整的 marketing engineer 节目：\n\n[https://youtube.com/watch?v=8ZC1G1ezN5o](https://youtube.com/watch?v=8ZC1G1ezN5o)\n\n如果有我能帮忙的地方，可以 DM 我。没法回复所有人，但我会回复一部分。\n\n**我支持你。**\n\nGreg Isenberg\n\n顺便，如果你想和我们合作，有几种方式：\n\n1. **Hire** [LCA](https://latecheckout.agency)**。** 我们是一家面向 AI 的领先产品设计公司。如果你希望自己的 AI 产品在视觉和体验上达到世界级，可以联系我们。Strategy、design、product、engineering，我们都做。\n2. **Use** [**Ideabrowser.com**](https://ideabrowser.com/)**。** 用真实数据寻找下一个 startup idea。已有超过 20 万名 founder 使用。\n3. **Try** [Boring Funnels](https://boringfunnels.com)。我的合伙人刚刚推出 [Boring Funnels](https://boringfunnels.com/)。它每周拆解一个真实有效的 funnel，并把整套流程转换成可以交给 coding agent 的 prompt。\n4. [@startupideaspod](https://x.com/@startupideaspod) —— 可以在 [Spotify](https://open.spotify.com/show/6aB0v6amo3a8hgTCjlTlvh?si=b5f1586b30b44d51)、[Apple](https://podcasts.apple.com/us/podcast/the-startup-ideas-podcast/id1593424985)、[YouTube](https://www.youtube.com/@GregIsenberg/videos) 收听，内容包括 startup idea、growth tactic 和实用 AI tutorial。\n\n---\n\n## ChatGPT 编辑附注 · `dmnd:editorial-insight:v1`\n\n这篇文章真正提出的不是“用更多 Agent 自动化营销”，而是把营销从一次次 campaign 的生产流程，重构成一套围绕客户证据、可追溯实验、明确权限和持续反馈运行的学习系统。\n\n### 关键要点\n\n- 营销工程师的核心杠杆，是把客户研究、创意、开发、数据与实验压缩到更短的执行循环，而不只是更快生成文案。\n- 作者反复强调先建立可用上下文和统一 campaign ID，再扩展 Agent；否则自动化只会放大模糊输入和无法归因的实验。\n- 高风险动作不应只依赖 Prompt 约束：只读起步、最小权限、paused 状态、硬审批和人工 publish 都被放进工具与流程。\n- 真正的长期学习来自把客户原话、实验结果、收入、留存、失败原因和人工拒绝重新写回系统，让下一轮基于更好的输入运行。\n\n### 可借鉴的新思路\n\n- 评价 Agent workflow 时，与其问“自动化了多少步骤”，不如问它是否缩短了从真实客户信号到实验，再到可验证商业结果的闭环。\n- 把事实、猜测和决策记录分层，并让 workflow 逐步赢得权限，是扩展 Agent 系统时一种可复用的治理方法。\n\n---","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"ad2374e7a8cc99de509333775a2338b853c269d7cd9c2e649c19aad04d2297ec","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure- ass=\"mn-img-wrapper\"\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHHn_3bsAATORV?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e接下来会走向哪里\u003c/span\u003e","payload":{"lines":"121,122","tag":"h2"}},{"children":[{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e营销工程师的核心杠杆，是把客户研究、创意、开发、数据与实验压缩到更短的执行循环，而不只是更快生成文案。\u003c/span\u003e","payload":{"lines":"132,133","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e作者反复强调先建立可用上下文和统一 campaign ID，再扩展 Agent；否则自动化只会放大模糊输入和无法归因的实验。\u003c/span\u003e","payload":{"lines":"133,134","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e高风险动作不应只依赖 Prompt 约束：只读起步、最小权限、paused 状态、硬审批和人工 publish 都被放进工具与流程。\u003c/span\u003e","payload":{"lines":"134,135","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e真正的长期学习来自把客户原话、实验结果、收入、留存、失败原因和人工拒绝重新写回系统，让下一轮基于更好的输入运行。\u003c/span\u003e","payload":{"lines":"135,136","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键要点\u003c/span\u003e","payload":{"fold":1,"lines":"131,132","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e评价 Agent workflow 时，与其问“自动化了多少步骤”，不如问它是否缩短了从真实客户信号到实验，再到可验证商业结果的闭环。\u003c/span\u003e","payload":{"lines":"137,138","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e把事实、猜测和决策记录分层，并让 workflow 逐步赢得权限，是扩展 Agent 系统时一种可复用的治理方法。\u003c/span\u003e","payload":{"lines":"138,139","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e可借鉴的新思路\u003c/span\u003e","payload":{"lines":"136,137","tag":"h3"}}],"content":"\u003cspan data-dmnd-editorial-insight=\"v1\" class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eChatGPT 编辑附注\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:ee5db1289849588b960c0a842db104b0ce7febc91f9ad8a7346e0159d2bdf767\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"130,131","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHIMEwbYAAW70H?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e营销工程师：用 AI Agent 做 100 倍更多实验\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"营销工程师：用 AI Agent 做 100 倍更多实验\" data-note-id=\"note:sha256:1da0a8f9cdd5199e538ed06090e5347fad5dc1379f5dd270a6a953c43d6cd3da\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"营销工程师用-ai-agent-做-100-倍更多实验\"\u003e营销工程师：用 AI Agent 做 100 倍更多实验\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHIMEwbYAAW70H?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@gregisenberg · \u003ca href=\"https://x.com/gregisenberg/article/2108188646973313195\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-10-08\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e营销工程师正在成为新的“10x 员工”，而大多数公司现在还没有这样的人。\u003c/p\u003e\n\u003cp\u003e如果你正在做一家初创公司、一门生意，或者一份副业，那么成为营销工程师，或招聘一名营销工程师，可能是你眼下最大的杠杆。这也许是自 Google 推出 AdWords 以来，营销最令人兴奋的时刻。甚至可能是有史以来最令人兴奋的时刻。\u003c/p\u003e\n\u003cp\u003e过去 20 年里，营销点子并不难想，难的是把它真正做出来。销售知道为什么交易会成交，客服知道为什么客户会流失，但每一个想法都得经过 brief、设计师、开发者、分析师和两轮会议，大多数最后都死在 Slack 线程里。\u003c/p\u003e\n\u003cp\u003e这个瓶颈刚刚被打破。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCeZJxbcAED0KN?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e现在，一个 Agent 可以在十分钟内读完上周的销售通话；另一个把客户原话变成落地页；另一个在你睡觉时上线 30 个广告并停掉表现差的；还有一个会在周一告诉你，究竟是哪条 campaign 带来了真正付费的客户。如今模型已经足够强，只要你的想法够好，输出通常也会够好。\u003c/p\u003e\n\u003cp\u003e营销工程师做的，就是把这些 Agent 接成一台机器。他一半是营销人，一半是 builder。最优秀的人往往甚至不是传统营销出身，而可能来自创始人、工程师、运营或独立开发者。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e所以准备好咖啡或茶，下面是一份完整 playbook（阅读约 15–20 分钟）。\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"为什么-marketing-engineer-正在出现\"\u003e为什么 Marketing Engineer 正在出现\u003c/h2\u003e\n\u003ch3 id=\"我们是怎么走到这里的\"\u003e我们是怎么走到这里的\u003c/h3\u003e\n\u003ch4 id=\"mad-men-时代一年只有少数几次昂贵机会\"\u003eMad Men 时代：一年只有少数几次昂贵机会\u003c/h4\u003e\n\u003cp\u003e从 1950 年代到 1990 年代的 Mad Men 时代，营销意味着印刷、电视、广播和户外广告。工作核心是大创意和大预算。一场 campaign 可能耗资数百万、制作数月，运气好的话，一个季度后才能知道有没有效果。优秀营销人一年真正出手的机会屈指可数，所以整个行业高度依赖品味、说服力和直觉。\u003c/p\u003e\n\u003ch4 id=\"数字营销人渠道开始可测量\"\u003e数字营销人：渠道开始可测量\u003c/h4\u003e\n\u003cp\u003e然后 Google 在 2000 年推出 AdWords，Facebook 在 2007 年推出广告产品，突然之间，每一次点击都可以被记录。数字营销人由此诞生。\u003c/p\u003e\n\u003cp\u003e工作变成管理 SEO、付费搜索、邮件、展示广告等渠道。营销人开始长期生活在 dashboard 里，真正厉害的人往往是最懂平台机制的人。实验频率也提高到了每月几次。\u003c/p\u003e\n\u003ch4 id=\"增长黑客营销开始像产品\"\u003e增长黑客：营销开始像产品\u003c/h4\u003e\n\u003cp\u003e到了 2010 年代，增长黑客出现了，我永远不会忘记那段时期。Sean Ellis 在 2010 年创造了这个词，而整个十年里最经典的招数后来都成了行业传说。\u003c/p\u003e\n\u003cp\u003eHotmail 在每封邮件底部放上“P.S. I love you. Get your free email at Hotmail”；Dropbox 给邀请人和朋友都赠送免费存储空间；Airbnb 让房东把房源同步发布到 Craigslist。\u003c/p\u003e\n\u003cp\u003e增长黑客像做产品一样做营销：漏斗、增长循环和 A/B 测试都成为日常。但问题在于，每一个好点子仍然需要工程师，而工程师属于产品 roadmap。增长黑客有一半时间都在写 ticket、排队等开发。一个星期能跑几个实验，就已经算非常高效。\u003c/p\u003e\n\u003ch4 id=\"ai-辅助营销人草稿更快系统没变\"\u003eAI 辅助营销人：草稿更快，系统没变\u003c/h4\u003e\n\u003cp\u003eChatGPT 在 2022 年底出现后，我们进入了 AI 辅助营销人的阶段。文案更快，图片更快，但其它东西基本没变。\u003c/p\u003e\n\u003cp\u003e还是同样的组织结构、同样的会议、同样六周一个周期，只不过第一版草稿更好了。这有点像 AI Copilot 时代。大多数营销团队现在其实仍然停留在这里。\u003c/p\u003e\n\u003ch4 id=\"营销工程师想法和实现合并到同一个人\"\u003e营销工程师：想法和实现合并到同一个人\u003c/h4\u003e\n\u003cp\u003e营销工程师真正出现，是因为“提出想法的人”和“能把它做出来的人”开始变成同一个人。\u003c/p\u003e\n\u003cp\u003e一个营销人可以自己研究客户、搭页面、生成创意、接数据、上线测试。工作的基本单位也从“一次 campaign”变成了“一套持续产出 campaign 的系统”。于是，一个人一天跑几十个实验开始变得现实。\u003c/p\u003e\n\u003cp\u003e把视角拉远，整个营销史其实只有一个长期趋势：\u003cstrong\u003e一次实验的成本在持续下降。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e谁能跑最多的高质量实验，谁就学得最快；谁学得最快，谁就赢。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HT88kbzbgAAnWtT?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"为什么这件事如此重要\"\u003e为什么这件事如此重要\u003c/h3\u003e\n\u003ch4 id=\"客户知识其实一直散落在公司各处\"\u003e客户知识其实一直散落在公司各处\u003c/h4\u003e\n\u003cp\u003e每家公司都坐在一堆几乎没被真正利用的金矿上（我知道这听起来难以置信，但确实如此）。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCehtAbwAAOKjs?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e销售每周都会听到同样五种异议；客服非常清楚哪些承诺最容易导致退款；创始人对品类有很多鲜明观点，却只存在脑子里和几段播客里；分析团队知道哪些页面带来的客户留存最好。\u003c/p\u003e\n\u003cp\u003e这些信息散落在不同工具里，由不同的人掌握，往往一个季度才有机会真正进入一次 campaign。\u003c/p\u003e\n\u003ch4 id=\"过去小而具体的营销想法太贵了\"\u003e过去，小而具体的营销想法太贵了\u003c/h4\u003e\n\u003cp\u003e与此同时，那些最能把这些知识用起来的小想法，总是输给“大发布”。\u003c/p\u003e\n\u003cp\u003e为某个细分人群做一个定价计算器；把昨天销售通话里的洞察做成一条 campaign；某个功能终于上线时，给曾经提出这个需求的 40 位老客户发一封消息。\u003c/p\u003e\n\u003cp\u003e过去，每件事都需要设计师、开发者、分析师和两轮会议，于是它们就一直躺在 backlog 里。\u003c/p\u003e\n\u003ch4 id=\"当具体营销变便宜\"\u003e当“具体营销”变便宜\u003c/h4\u003e\n\u003cp\u003e营销工程师可以在一个下午把这些事全部做出来。\u003c/p\u003e\n\u003cp\u003e当“为具体人、具体场景做具体营销”变得便宜时，真正开始占优势的，是最了解客户的公司。按小时收费的 agency 会最先感受到变化；庞大的营销团队会越来越像委员会；创始人和独立营销人则可能突然拥有过去一个完整部门的产出能力。\u003c/p\u003e\n\u003cp\u003e注：我的合伙人刚推出了 \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e。背后的想法是，最大的机会在于帮助企业把自己已经知道的客户知识，转成清晰的 offer、有用的落地页，以及最终促成销售的 follow-up。营销工程师可以把整套东西搭出来，观察用户在哪一步流失，并随着更多客户进入不断优化。\u003c/p\u003e\n\u003cp\u003e下面具体讲怎么做。\u003c/p\u003e\n\u003ch2 id=\"如何搭建-marketing-engineer-系统\"\u003e如何搭建 Marketing Engineer 系统\u003c/h2\u003e\n\u003ch3 id=\"第-1-步搭好你的工作台\"\u003e第 1 步：搭好你的工作台\u003c/h3\u003e\n\u003ch4 id=\"从-agent-工作区开始\"\u003e从 Agent 工作区开始\u003c/h4\u003e\n\u003cp\u003e一切都从 Agent workspace 开始。Claude Code、Codex 和 Cursor 是比较常见的选择。\u003c/p\u003e\n\u003cp\u003e最简单的理解方式是：把这些工具想成一个住在你电脑某个文件夹里的超高速 junior employee。它能读取那个文件夹里的所有文件、创建新文件、运行代码，也能使用你连接给它的任何工具。\u003c/p\u003e\n\u003ch4 id=\"连接-agent-需要的工具\"\u003e连接 Agent 需要的工具\u003c/h4\u003e\n\u003cp\u003e真正神奇的是最后这一点。\u003c/p\u003e\n\u003cp\u003e工具通过 MCP 之类的方式连接，可以把它粗略理解为给 AI 用的通用插口。HubSpot、Stripe、Notion、Slack 等大量工具都有 MCP server，于是 Agent 可以像你一样读取 CRM，或者拉取上周收入数据。\u003c/p\u003e\n\u003cp\u003e如果某个工具只有 API，Agent 通常也可以写出调用它的代码。\u003c/p\u003e\n\u003ch4 id=\"加入定时运行但不要拿掉审批\"\u003e加入定时运行，但不要拿掉审批\u003c/h4\u003e\n\u003cp\u003e你还会希望 Agent 在你睡觉时按计划执行任务。\u003c/p\u003e\n\u003cp\u003e一年前，这通常意味着要用 Zapier 或 n8n 之类的 workflow 工具把各个环节串起来。现在，你可以直接让 coding agent 帮你把它写出来。\u003c/p\u003e\n\u003cp\u003e比如告诉它：“每周一早上 7 点运行，把报告发到 Slack，在任何内容真正发送前等我点 👍。”它可以写出定时任务、带 approve 按钮的 Slack 消息，以及只有在你点击之后才继续执行的代码。\u003c/p\u003e\n\u003cp\u003e或者你也可以使用 Hermes、OpenClaw 这类常驻后台的 Agent。无论哪种方式，代码都在你的文件夹里，你可以用一句话修改其中任何部分。\u003c/p\u003e\n\u003ch3 id=\"第-2-步写好大脑\"\u003e第 2 步：写好“大脑”\u003c/h3\u003e\n\u003ch4 id=\"先做上下文再做-agent\"\u003e先做上下文，再做 Agent\u003c/h4\u003e\n\u003cp\u003e我反复看到同一种错误：有人一兴奋就启动十个 Agent，得到一大堆泛泛的垃圾输出，然后得出结论——AI 营销被吹过头了。\u003c/p\u003e\n\u003cp\u003e其实 Agent 没问题，问题是上下文太薄。\u003c/p\u003e\n\u003cp\u003e这就像你招来一个非常聪明的营销人，却跳过 onboarding。他会写出听起来很聪明的行业内容，但和竞争对手写的一模一样。\u003c/p\u003e\n\u003cp\u003e所以，在构建任何 Agent 之前，先构建“大脑”：一个文件夹，把你的业务解释得像你在给一个第一天入职、脑子很快的新员工做 onboarding 一样。\u003c/p\u003e\n\u003cp\u003e我会这样组织：\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCa05XacAAtaHo?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e六个文件可以承担绝大部分工作。\u003c/p\u003e\n\u003ch4 id=\"1-start-heremd\"\u003e1. \u003ccode\u003eSTART-HERE.md\u003c/code\u003e\u003c/h4\u003e\n\u003cp\u003e这是每个 Agent 最先读取的一页。\u003c/p\u003e\n\u003cp\u003e它说明公司做什么、服务谁、本季度优先级是什么，以及其它资料分别放在哪里。\u003c/p\u003e\n\u003ch4 id=\"2-companycustomer-fitmd\"\u003e2. \u003ccode\u003ecompany/customer-fit.md\u003c/code\u003e\u003c/h4\u003e\n\u003cp\u003e这个文件描述谁会购买、谁会留下，以及你能盈利地服务谁。必须具体到让 Agent 真正有东西可用。\u003c/p\u003e\n\u003cp\u003e“Shopify 商店，年营收 100 万到 1000 万美元，创始人仍然自己做账，而且以前被记账员坑过”会给 Agent 很强的上下文。\u003c/p\u003e\n\u003cp\u003e“SMBs”几乎什么都没告诉它。\u003c/p\u003e\n\u003ch4 id=\"3-companyoffersmd\"\u003e3. \u003ccode\u003ecompany/offers.md\u003c/code\u003e\u003c/h4\u003e\n\u003cp\u003e这里列出你卖什么、价格是多少、允许承诺什么，以及哪些话在公开之前必须经过审批。\u003c/p\u003e\n\u003ch4 id=\"4-brandvoicemd\"\u003e4. \u003ccode\u003ebrand/voice.md\u003c/code\u003e\u003c/h4\u003e\n\u003cp\u003e这是大多数人最偷懒的地方。\u003c/p\u003e\n\u003cp\u003e“友好但专业”对 Agent 几乎没用。更好的做法是，放进 3 封你真正喜欢的邮件或广告，并为每个例子写一句为什么它有效；再放 2 个你否掉的版本，并解释原因。\u003c/p\u003e\n\u003cp\u003e例如：“我们否掉这一版，因为它承诺 30 天出结果，而我们不能保证。”\u003c/p\u003e\n\u003cp\u003eAgent 从实例里学到的东西，远比从几个形容词里多。\u003c/p\u003e\n\u003ch4 id=\"5-brandfounder-opinionsmd\"\u003e5. \u003ccode\u003ebrand/founder-opinions.md\u003c/code\u003e\u003c/h4\u003e\n\u003cp\u003e这是你的不公平优势。\u003c/p\u003e\n\u003cp\u003e所有竞争对手都能用同样的模型，只有你拥有创始人对品类、客户和竞争的独特判断。\u003c/p\u003e\n\u003cp\u003e花两个小时采访创始人，或者采访你自己，把所有鲜明观点写下来。\u003c/p\u003e\n\u003cp\u003e例如：“我们这个行业的大多数 agency 在 onboarding 上收费过高。”\u003cbr\u003e或者：“我们最好的客户来自会计师推荐。”\u003c/p\u003e\n\u003cp\u003e真正让输出听起来像你的，正是这些观点。\u003c/p\u003e\n\u003ch4 id=\"6-decisionsfailed-campaignsmd\"\u003e6. \u003ccode\u003edecisions/failed-campaigns.md\u003c/code\u003e\u003c/h4\u003e\n\u003cp\u003e这里存放那些用真金白银换来的教训。\u003c/p\u003e\n\u003cp\u003e“免费审计吸引来的公司规模太小，根本买不起我们。”\u003cbr\u003e“LinkedIn 带来了很多 leads，但几乎没有成交。”\u003c/p\u003e\n\u003cp\u003e这样一句记录，就可能避免 Agent 再犯一次价值 20,000 美元的错误。\u003c/p\u003e\n\u003ch4 id=\"把猜测和公司事实分开\"\u003e把猜测和公司事实分开\u003c/h4\u003e\n\u003cp\u003e有一条规则能让这套“大脑”保持健康：Agent 可以把猜测写进 \u003ccode\u003eevidence/\u003c/code\u003e，但只有人能把内容移动到 \u003ccode\u003ecompany/\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e否则，一个 Agent 的猜测很容易悄悄变成公司政策。\u003c/p\u003e\n\u003ch3 id=\"第-3-步连接你的数据\"\u003e第 3 步：连接你的数据\u003c/h3\u003e\n\u003ch4 id=\"把客户真相所在的地方接进来\"\u003e把客户真相所在的地方接进来\u003c/h4\u003e\n\u003cp\u003e接下来，给“大脑”装上眼睛。\u003c/p\u003e\n\u003cp\u003e把真正存在客户事实的地方连接起来：Gong 或 Fathom 里的通话录音，Intercom 或 Zendesk 里的客服工单，HubSpot 或 Salesforce 里的交易，PostHog 或 Google Analytics 里的行为数据，以及 Stripe 里的收入。\u003c/p\u003e\n\u003ch4 id=\"一开始全部只读\"\u003e一开始全部只读\u003c/h4\u003e\n\u003cp\u003e所有系统先从 read-only access 开始。\u003c/p\u003e\n\u003cp\u003e一个能读取 CRM 的 Agent，从第一天就已经很有用；一个能修改 CRM 的 Agent，则应该随着可靠性逐步“赢得”这个权限。\u003c/p\u003e\n\u003ch4 id=\"给每一条-campaign-一个-id\"\u003e给每一条 campaign 一个 ID\u003c/h4\u003e\n\u003cp\u003e然后做一件几乎所有公司都会跳过、但其实极其重要的“无聊工作”：给每条 campaign 分配一个 ID，并让这个 ID 贯穿所有地方。\u003c/p\u003e\n\u003cp\u003e把它写进每个链接的 UTM、每个广告名称、每条邮件 sequence 的名字，以及 CRM 中每一笔 deal 的字段里。\u003c/p\u003e\n\u003cp\u003e再维护一张简单的表，哪怕一开始只是 Supabase 或 spreadsheet。每条 campaign 一行，包括：ID、spend、leads、qualified calls、deals、revenue、churn。\u003c/p\u003e\n\u003ch4 id=\"把营销活动连接到付费并留下来的客户\"\u003e把营销活动连接到“付费并留下来的客户”\u003c/h4\u003e\n\u003cp\u003e听起来一点都不性感，但这可能是整个系统里最有价值的部分。\u003c/p\u003e\n\u003cp\u003e大多数公司能告诉你“某条 campaign 有多少点击”，也能告诉你“某个客户贡献多少收入”，但很少有人真正把这两张表连接起来。\u003c/p\u003e\n\u003cp\u003e一旦接通，Agent 就能回答真正重要的问题：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e到底是哪种营销，带来了那些真的付钱、而且留下来的客户？\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"第-4-步先做第一个-agent\"\u003e第 4 步：先做第一个 Agent\u003c/h3\u003e\n\u003ch4 id=\"先把一个-agent-做可靠\"\u003e先把一个 Agent 做可靠\u003c/h4\u003e\n\u003cp\u003e先只做一个 Agent，并把它做到足够好，再做第二个。\u003c/p\u003e\n\u003cp\u003e第一天就让六个 Agent 相互聊天，通常只会让你周末花时间调试一个 group chat。\u003c/p\u003e\n\u003ch4 id=\"从客户语言-agent开始\"\u003e从“客户语言 Agent”开始\u003c/h4\u003e\n\u003cp\u003e第一个最适合做的，是 customer language agent，因为后面的所有 Agent 都会依赖它发现的东西。\u003c/p\u003e\n\u003cp\u003e它的任务，是读取客户真正说过的话，并抽取他们描述问题时使用的原始语言。\u003c/p\u003e\n\u003cp\u003e把最近 20–50 份销售通话 transcript 导出到 \u003ccode\u003eevidence/calls/\u003c/code\u003e，然后给它类似这样的指令：\u003c/p\u003e\n\u003cp\u003e读取 \u003ccode\u003eevidence/calls/\u003c/code\u003e 中的每一份 transcript。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCa6rbbkAAhB9C?format=png\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch4 id=\"不断纠正指令直到输出变好\"\u003e不断纠正指令，直到输出变好\u003c/h4\u003e\n\u003cp\u003e然后把报告和你自己对这些通话的记忆放在一起对照。\u003c/p\u003e\n\u003cp\u003e第一版可能只有大约 70% 正确。它也许会过度放大某个特别健谈的客户，或者用营销术语给客户群体起名字。\u003c/p\u003e\n\u003cp\u003e每发现一个错误，就修正指令，并把这次修正写进 \u003ccode\u003edecisions/\u003c/code\u003e，让它下次还记得。\u003c/p\u003e\n\u003cp\u003e三四轮之后，它读取销售通话的质量可能会超过团队里的大多数人。\u003c/p\u003e\n\u003ch4 id=\"找出真正能卖东西的客户原话\"\u003e找出真正能卖东西的客户原话\u003c/h4\u003e\n\u003cp\u003e例如，你卖的是面向水管工和 HVAC 公司的排班软件。\u003c/p\u003e\n\u003cp\u003eAgent 发现很多老板都反复表达某种类似的话：\u003c/p\u003e\n\u003cp\u003e“我受够了吃晚饭的时候还要接工作电话。”\u003c/p\u003e\n\u003cp\u003e这一句话本身就可以成为广告、headline 和销售开场白。\u003c/p\u003e\n\u003cp\u003e它往往比“automated scheduling”强，因为人们购买的常常是他们身处的具体情境，而不是一个抽象功能。\u003c/p\u003e\n\u003ch4 id=\"可靠以后再定时运行\"\u003e可靠以后再定时运行\u003c/h4\u003e\n\u003cp\u003e等它足够可靠后，再让它按计划运行。\u003c/p\u003e\n\u003cp\u003e每周一，它读取上周的通话和 ticket，并把一份新报告放进 \u003ccode\u003eevidence/customer-language/\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e这样，你的整个营销系统就开始基于“客户上周真实说了什么”运行，而不是基于“某个人去年猜了什么”。\u003c/p\u003e\n\u003ch3 id=\"第-5-步再加入另外五个-agent\"\u003e第 5 步：再加入另外五个 Agent\u003c/h3\u003e\n\u003cp\u003e等第一个 Agent 稳定后，再一个一个加入其它 Agent。每个 Agent 都有自己位于 \u003ccode\u003eworkflows/\u003c/code\u003e 下的文件夹、自己的 instructions 和自己的 schedule。\u003c/p\u003e\n\u003ch4 id=\"购买触发-agent\"\u003e购买触发 Agent\u003c/h4\u003e\n\u003cp\u003e购买触发 Agent 负责监测那些会在一夜之间产生需求的时刻。\u003c/p\u003e\n\u003cp\u003e一家公司开了第二家门店；一个品牌开始做批发；一家 startup 完成融资并同时发布五个销售岗位；你集成的某个工具刚刚上线新功能——这些都可能是 trigger。\u003c/p\u003e\n\u003cp\u003e最简单的搭建方式之一是在 Clay 里完成。先拉一组符合 \u003ccode\u003ecustomer-fit.md\u003c/code\u003e 的 account，然后增加不同列，检查每种 trigger，比如新招聘、融资新闻、新门店、网站新增页面等。Apollo 很适合补充联系人数据。\u003c/p\u003e\n\u003cp\u003e对于每个出现新 trigger 的 account，Agent 先查 CRM，跳过团队已经在跟进的人，然后完成一句话：\u003c/p\u003e\n\u003cp\u003e“这个事件会产生这个问题，而我们的产品可以用这种具体方式解决它。”\u003c/p\u003e\n\u003cp\u003e如果这句话很模糊，这个 account 就先不动。如果这句话足够清晰，Agent 就起草一封以该事件开头的短邮件，并把它保存为 draft，交给你审核。\u003c/p\u003e\n\u003cp\u003e正是这句过滤条件，让 outbound 更像“在恰当时机出现”，而不是 spam。\u003c/p\u003e\n\u003ch4 id=\"搜索-agent\"\u003e搜索 Agent\u003c/h4\u003e\n\u003cp\u003e搜索 Agent 找出人们在购买前最常问的问题，并为每个问题做出互联网上最好的页面。\u003c/p\u003e\n\u003cp\u003e给它三个信息源：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eSearch Console 数据；\u003c/li\u003e\n\u003cli\u003e销售通话里出现的问题；\u003c/li\u003e\n\u003cli\u003e当你向 ChatGPT、Claude 和 Perplexity 询问所在品类时，它们给出的回答。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e第三个来源很新，而且被严重低估了。\u003c/p\u003e\n\u003cp\u003e每周都向这些 AI engine 提问你的买家会问的问题，并记录它们推荐哪些公司和来源。这样你能看到模型信任什么，也能看到你自己在哪里“不可见”。\u003c/p\u003e\n\u003cp\u003e然后，做出比现有页面更有用的内容，因为 AI search 更偏爱真正有用的页面，而不只是“最优化”的页面。\u003c/p\u003e\n\u003cp\u003e比如，一家商用厨房设备供应商可以写一份“如何开第一家餐厅”的指南，再加一个计算器，根据空间和预算推荐适合的设备。\u003c/p\u003e\n\u003cp\u003e这样的页面既能获得排名，也可能被 AI engine 引用，还会被真正的买家收藏，等到准备购买时再回来。\u003c/p\u003e\n\u003cp\u003eAgent 可以在一个下午把这个 calculator 写出来，并发布到 Next.js + Vercel；如果追求速度，也可以用 Framer。\u003c/p\u003e\n\u003ch4 id=\"创意-agent\"\u003e创意 Agent\u003c/h4\u003e\n\u003cp\u003e创意 Agent 负责制作和测试广告。\u003c/p\u003e\n\u003cp\u003e给它最新的客户语言报告、\u003ccode\u003eoffers.md\u003c/code\u003e 里经过批准的 claims、真实产品录像和截图，以及一个你喜欢的广告素材文件夹。\u003c/p\u003e\n\u003cp\u003e不要让它只是写同一句 headline 的 50 个版本，而是要求它给出不同的“购买理由”：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e一个广告完整演示一个 worked example；\u003c/li\u003e\n\u003cli\u003e一个讲客户故事；\u003c/li\u003e\n\u003cli\u003e一个直接做原始产品 demo。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNano Banana 之类的图片模型，以及 Veo 之类的视频模型，让生产成本几乎降到了零。\u003c/p\u003e\n\u003cp\u003e给每条广告命名时，要把它真正测试的东西写进去，例如 \u003ccode\u003eBK014_dinner-angle_ugc_v2\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e这样 campaign ID、idea 和 format 都直接写在名称里。\u003c/p\u003e\n\u003cp\u003e一个月后，“dinner angle 打败了 price angle”是一条可以复用到其它地方的知识；“\u003ccode\u003evideo_final_7\u003c/code\u003e 赢了”则只是无意义的 trivia。\u003c/p\u003e\n\u003cp\u003eAgent 通过 Meta Ads API 上传广告，但保持 paused 状态，由人来真正点击上线。\u003c/p\u003e\n\u003cp\u003e然后让一段小脚本每天早晨检查结果，在达到预设 spend 后，把 CTR 低于 1% 的广告暂停。\u003c/p\u003e\n\u003cp\u003e在实验开始前就决定 evidence bar：要花多少钱、跑多少天、什么算 win。\u003c/p\u003e\n\u003cp\u003e否则，即使做了 200 个广告，也可能只是得到 200 个没有结论的实验。\u003c/p\u003e\n\u003ch4 id=\"丢单-agent\"\u003e丢单 Agent\u003c/h4\u003e\n\u003cp\u003e丢单 Agent 是最有可能“养活”其它 Agent 的那个。\u003c/p\u003e\n\u003cp\u003e把 CRM 里所有 closed-lost deal 连同 notes 和 call transcript 拉出来。\u003c/p\u003e\n\u003cp\u003e“Not interested”只是对一段真实对话非常偷懒的概括。让 Agent 重新读取每笔丢单，记录真正的原因，以及重新打开机会的 condition。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cp\u003e“选择了竞争对手，合同 3 月续约。”\u003cbr\u003e“需要 SSO。”\u003cbr\u003e“Champion 离职了。”\u003c/p\u003e\n\u003cp\u003e然后 Agent 持续监测这些 condition。\u003c/p\u003e\n\u003cp\u003e你的 changelog 一旦显示 SSO 已上线，所有当初提出 SSO 的 prospect 都会得到一封引用原始通话内容的个性化 draft。\u003c/p\u003e\n\u003cp\u003e续约期临近时，你再次出现。Champion 去了新公司时，你先祝贺，再重新介绍自己。\u003c/p\u003e\n\u003cp\u003e尊重 opt-out 和 contact preference，你会发现，大多数公司的 CRM 里其实堆着大量“尚未真正结束的收入机会”。\u003c/p\u003e\n\u003ch4 id=\"效果-agent\"\u003e效果 Agent\u003c/h4\u003e\n\u003cp\u003e效果 Agent 每周一读取 campaign table，然后像一个优秀分析师那样写一份简短 memo。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cp\u003e“profitability review 页面转化率 4%，但其中一半 leads 规模太小，不适合服务。”\u003cbr\u003e“dinner ad 的 qualified call acquisition cost 最低。”\u003cbr\u003e“Retargeting 已花 3,000 美元，只带来两次销售对话。”\u003c/p\u003e\n\u003cp\u003e每一行最后都落到一个决策：keep、kill、change 或 test。\u003c/p\u003e\n\u003cp\u003e一定要把数据接到 retention、refund 和 profit。\u003c/p\u003e\n\u003cp\u003e一条 campaign 可能带来很多便宜客户，但这些客户 60 天后全部 churn。它在 dashboard 上会看起来非常漂亮，却在安静地亏钱。\u003c/p\u003e\n\u003cp\u003e效果 Agent 就是用来抓这种问题的。\u003c/p\u003e\n\u003ch3 id=\"第-6-步把护栏放进工具而不是只写在-prompt-里\"\u003e第 6 步：把护栏放进工具，而不是只写在 Prompt 里\u003c/h3\u003e\n\u003ch4 id=\"prompt-不是护栏\"\u003ePrompt 不是护栏\u003c/h4\u003e\n\u003cp\u003e最快的翻车方式，就是相信 Prompt 里的一句话。\u003c/p\u003e\n\u003cp\u003e“发送之前永远先问我”对模型来说只是一个礼貌建议。\u003c/p\u003e\n\u003cp\u003e真正的 guardrail 应该存在于工具里。\u003c/p\u003e\n\u003ch4 id=\"最小权限-硬审批\"\u003e最小权限 + 硬审批\u003c/h4\u003e\n\u003cp\u003e给每个 Agent 它真正需要的最小权限。\u003c/p\u003e\n\u003cp\u003eoutreach Agent 只有 email draft 权限；广告 Agent 只能创建 paused 状态的广告；预算仍然掌握在你手里。\u003c/p\u003e\n\u003cp\u003eapproval step 直接存在代码里。比如 Slack 消息带一个 approve 按钮，action 会一直等待，直到你真正点击。\u003c/p\u003e\n\u003cp\u003e像 spend cap、suppression list、deduplication 这样的精确规则，交给普通代码。\u003c/p\u003e\n\u003cp\u003e而像“这个 account 是否合适”“这条 message 是否听起来像我们”这类判断，则交给模型。\u003c/p\u003e\n\u003ch4 id=\"给每个-agent-写一份简短-contract\"\u003e给每个 Agent 写一份简短 contract\u003c/h4\u003e\n\u003cp\u003e然后给每个 Agent 写一个短 contract，就像带 guardrail 的 job description。\u003c/p\u003e\n\u003cp\u003e下面是一份购买触发 Agent 的例子：\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCbFV0bsAAfDqN?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch4 id=\"让失败变得可见\"\u003e让失败变得可见\u003c/h4\u003e\n\u003cp\u003e“Done”意味着：它在自己的限制范围内检查了每个来源，而且明确告诉你哪里失败了。\u003c/p\u003e\n\u003cp\u003e一个会说“今天这个 source 失败了”的 Agent，比十个默默跳过失败步骤的 Agent 更有价值。\u003c/p\u003e\n\u003ch3 id=\"第-7-步端到端跑一条-campaign\"\u003e第 7 步：端到端跑一条 campaign\u003c/h3\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHH3H-aMAArNw1?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e下面看看整套系统协同起来会是什么样。\u003c/p\u003e\n\u003cp\u003e假设一家 bookkeeping firm 想获得更多 ecommerce 客户。\u003c/p\u003e\n\u003ch4 id=\"周一从客户语言形成-offer\"\u003e周一：从客户语言形成 offer\u003c/h4\u003e\n\u003cp\u003e周一，客户语言报告显示，店主们一直在反复说同一句话：\u003c/p\u003e\n\u003cp\u003e“扣掉退款、物流和手续费后，我根本不知道自己到底赚没赚钱。”\u003c/p\u003e\n\u003cp\u003e上个月有 11 位不同客户都表达过类似意思。\u003c/p\u003e\n\u003cp\u003e你把这条洞察拿给真正负责交付服务的人看，问公司是否真的能解决这个问题。\u003c/p\u003e\n\u003cp\u003e对方说可以，而且这是每个新客户进来后，他们最先处理的问题。\u003c/p\u003e\n\u003cp\u003e于是，你在 \u003ccode\u003eoffers.md\u003c/code\u003e 中批准一条 offer：为年销售额 100 万到 1000 万美元的商店提供一次免费的 profitability review。\u003c/p\u003e\n\u003ch4 id=\"让-campaign-id-贯穿每一步\"\u003e让 campaign ID 贯穿每一步\u003c/h4\u003e\n\u003cp\u003e这条 campaign 获得 ID：\u003ccode\u003eBK014\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e从这里开始，所有内容都带着它。\u003c/p\u003e\n\u003ch4 id=\"周二让不同-agent-基于同一份证据工作\"\u003e周二：让不同 Agent 基于同一份证据工作\u003c/h4\u003e\n\u003cp\u003e周二，创意 Agent 根据客户原话做出三个 angle：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你的利润到底消失在哪里；\u003c/li\u003e\n\u003cli\u003e一份示例月度报告；\u003c/li\u003e\n\u003cli\u003e一个真实客户的小故事。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e搜索 Agent 做出一个简单的 profit calculator 页面，里面使用公司已经验证过的数字。\u003c/p\u003e\n\u003cp\u003e丢单 Agent 找出 60 个曾经说“也许年底后再说”的老 prospect，并为每个人起草一封个性化消息。\u003c/p\u003e\n\u003cp\u003e购买触发 Agent 则标记出刚刚开始在 Amazon 销售的商店，因为 multichannel selling 会让账务变得更复杂。\u003c/p\u003e\n\u003ch4 id=\"周三上线前由人统一审核\"\u003e周三：上线前由人统一审核\u003c/h4\u003e\n\u003cp\u003e周三，你一次性审核所有内容。\u003c/p\u003e\n\u003cp\u003e其中一个广告承诺了公司无法保证的 savings，于是你删掉它。\u003c/p\u003e\n\u003cp\u003e其余内容审核通过，然后启动一个 2,000 美元的 test。\u003c/p\u003e\n\u003ch4 id=\"两周后把-spend-接到真正签约客户\"\u003e两周后：把 spend 接到真正签约客户\u003c/h4\u003e\n\u003cp\u003e两周后，效果 Agent 把 spend 连接到 booked review，再把 review 连接到 signed client。\u003c/p\u003e\n\u003cp\u003eprofit calculator 页面转化最好；Amazon trigger list 带来的 call 最多。\u003c/p\u003e\n\u003cp\u003e同时，它也提醒你：sample 仍然很小。\u003c/p\u003e\n\u003ch4 id=\"让客户原话从头到尾保留下来\"\u003e让客户原话从头到尾保留下来\u003c/h4\u003e\n\u003cp\u003e你会发现，客户最初说过的话贯穿了整个过程。\u003c/p\u003e\n\u003cp\u003e通常，一条非常锋利的 insight 会依次经过 research summary、brief 和五轮编辑，最后被磨得和互联网上所有 bookkeeping 广告一样。\u003c/p\u003e\n\u003cp\u003e而在这里，quote 会和 campaign folder 一起流转，所以每一个 Agent 都能看到原始语言。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCamhEaAAAzHyA?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"第-8-步运行每周循环\"\u003e第 8 步：运行每周循环\u003c/h3\u003e\n\u003ch4 id=\"工作开始更像编辑系统而不是不停从零制作\"\u003e工作开始更像“编辑系统”，而不是不停从零制作\u003c/h4\u003e\n\u003cp\u003e系统搭好后，你的工作会越来越像 editing，而不是 making。\u003c/p\u003e\n\u003cp\u003e周一：阅读 performance memo，做 keep / kill / change 决策。\u003cbr\u003e周二和周三：build，修复上周产出较差的 workflow，并上线新 test。\u003cbr\u003e周四：和销售、客服通话，因为下周最好的 idea 往往藏在那里。\u003cbr\u003e周五：审核 Agent 的产出，并更新文件。\u003c/p\u003e\n\u003ch4 id=\"建立一个能快速决策的-review-queue\"\u003e建立一个能快速决策的 review queue\u003c/h4\u003e\n\u003cp\u003e整套系统的核心是 review queue。\u003c/p\u003e\n\u003cp\u003e其中的每一项都应该在一分钟内完成判断。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cp\u003e“批准这个修改后的 offer。它会影响这两条广告和这封邮件。”\u003c/p\u003e\n\u003cp\u003e要让 review item 清楚显示：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e改了什么；\u003c/li\u003e\n\u003cli\u003e会影响什么；\u003c/li\u003e\n\u003cli\u003e背后的 evidence 是什么。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"每一次拒绝都应该改善下一轮输入\"\u003e每一次拒绝，都应该改善下一轮输入\u003c/h4\u003e\n\u003cp\u003e只有当你改变输入，系统才会真正变聪明。\u003c/p\u003e\n\u003cp\u003e如果你拒绝一条广告，是因为它吸引来的公司规模太小，就更新 \u003ccode\u003ecustomer-fit.md\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e如果一个 prospect 误读了 offer，就加入相应检查。\u003c/p\u003e\n\u003cp\u003e维护一份 experiment log，记录测试了什么、为什么测、发生了什么、下一步怎么做。\u003c/p\u003e\n\u003cp\u003e还要为每个 Agent 保存 10 个 example input，以及对应的 expected output。每次修改 instruction 后，把这组 example 重新跑一遍，这样你能立刻知道系统是不是变差了。\u003c/p\u003e\n\u003ch4 id=\"输出一直很差时先修大脑或-contract\"\u003e输出一直很差时，先修“大脑”或 contract\u003c/h4\u003e\n\u003cp\u003e如果你发现自己整天都在修 Agent output，那么问题通常发生在上游。\u003c/p\u003e\n\u003cp\u003e几乎总是“大脑”或者 contract 有问题。\u003c/p\u003e\n\u003ch2 id=\"把系统扩展到增长引擎\"\u003e把系统扩展到增长引擎\u003c/h2\u003e\n\u003ch3 id=\"创意引擎\"\u003e创意引擎\u003c/h3\u003e\n\u003cp\u003e大多数人还没有真正跟上一个变化：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e创意正在成为新的 targeting。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eMeta 已经重建了它决定“哪个广告该展示给谁”的方式。它的新系统 Andromeda 在 2025 年底完成全球 rollout，会直接读取广告本身来判断适合展示给谁。\u003c/p\u003e\n\u003cp\u003e你的图片、hook 和 script，现在正在承担过去 interest targeting 的一部分工作。\u003c/p\u003e\n\u003cp\u003e这对懒惰广告主有一个很残酷的副作用：Andromeda 会把看起来很像的广告归为一组，并把它们当作同一种东西。\u003c/p\u003e\n\u003cp\u003e于是，50 个只是换了 headline 的版本，获得的 reach 可能和一个广告差不多。\u003c/p\u003e\n\u003cp\u003e而且，现在一个 winning ad 往往两三周就开始疲劳，而不是过去的六周。\u003c/p\u003e\n\u003cp\u003e所以，真正的工作是持续产出\u003cstrong\u003e真正不同的 idea\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e过去这通常需要一支 production team；现在需要的是一套 creative engine。\u003c/p\u003e\n\u003cp\u003e我会这样搭。\u003c/p\u003e\n\u003ch4 id=\"从文字开始\"\u003e从文字开始\u003c/h4\u003e\n\u003cp\u003e把 \u003ccode\u003evoice.md\u003c/code\u003e 和最新的客户语言报告交给 Claude 或 GPT 这样的 frontier model，让它为 8–12 个真正不同的 concept 写 script。\u003c/p\u003e\n\u003cp\u003e比如：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e一个 pain point；\u003c/li\u003e\n\u003cli\u003e一个 worked example；\u003c/li\u003e\n\u003cli\u003e一个 customer story；\u003c/li\u003e\n\u003cli\u003e一段 founder rant；\u003c/li\u003e\n\u003cli\u003e一个 comparison；\u003c/li\u003e\n\u003cli\u003e一个你想拆穿的 myth。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e每个 concept 再配 2–3 个 hook。\u003c/p\u003e\n\u003cp\u003e真正的 strategy 在这一步，所以你的时间应该花在这里。\u003c/p\u003e\n\u003ch4 id=\"一个很有用的捷径从已经有效的-funnel-开始\"\u003e一个很有用的捷径：从已经有效的 funnel 开始\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003e一个很有帮助的捷径，是从已经有效的 funnel 开始。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我的合伙人之前没有太公开谈这件事，但 \u003ca href=\"https://x.com/@BoringMarketer\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@BoringMarketer\u003c/a\u003e 刚刚推出了 \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e它每周拆解一条真实、正在运行的 funnel，从广告一直拆到最后一封邮件，再把每一步转换成可以直接交给 coding agent 的 prompt。\u003c/p\u003e\n\u003cp\u003e这比从一张白纸开始要好得多。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUChi1tboAAm1GF?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch4 id=\"然后做图片\"\u003e然后做图片\u003c/h4\u003e\n\u003cp\u003eNano Banana、GPT Image 和 Midjourney 现在已经能生成在手机屏幕上也足够成立的 product shot、lifestyle scene 和 static ad。\u003c/p\u003e\n\u003cp\u003e诀窍是，把真实产品照片喂给模型，让产品本身保持准确，而让模型修改产品周围的一切。\u003c/p\u003e\n\u003ch4 id=\"然后做视频\"\u003e然后做视频\u003c/h4\u003e\n\u003cp\u003eVeo、Kling 和 fal 可以把 script 或静态图转成短视频。\u003c/p\u003e\n\u003cp\u003e对于 talking-head ad，Arcads、HeyGen 和 Creatify 可以生成 AI actor，用数十种语言朗读 script。\u003c/p\u003e\n\u003cp\u003eElevenLabs 处理 voiceover，CapCut 或 Captions 处理 editing。\u003c/p\u003e\n\u003ch4 id=\"用-ai-actor-测试再花钱让真人来赢\"\u003e用 AI actor 测试，再花钱让真人来赢\u003c/h4\u003e\n\u003cp\u003e这是 AI UGC 里一个很实用的做法。\u003c/p\u003e\n\u003cp\u003eAI actor 让你可以用一条真人 creator video 的成本，在一天内测试 20 个 script。\u003c/p\u003e\n\u003cp\u003e一旦知道哪条 script 真正有效，再让真人来讲，通常会表现得更好，也更能建立信任，同时还能更好遵守那些要求标注 AI 内容的平台规则。\u003c/p\u003e\n\u003ch4 id=\"让-agent-运行循环\"\u003e让 Agent 运行循环\u003c/h4\u003e\n\u003cp\u003eAgent 把每个 concept 以 paused 状态上线，由人真正点击 go。\u003c/p\u003e\n\u003cp\u003e一段 script 在达到预定 spend 后暂停 loser。\u003c/p\u003e\n\u003cp\u003e每周一，效果 Agent 告诉你哪些 concept 赢了、下周应该测试哪些 hook。\u003c/p\u003e\n\u003cp\u003e于是你的工作变成挑 idea、判断 taste，机器负责 volume。\u003c/p\u003e\n\u003cp\u003e现在，在 paid social 上表现最好的营销工程师，一个月可以上线几十个真正不同的 concept，而且不需要一支传统 production team。\u003c/p\u003e\n\u003ch3 id=\"社交引擎\"\u003e社交引擎\u003c/h3\u003e\n\u003cp\u003ePaid 往往最吸引注意力，但 organic social 才是营销工程师悄悄建立不公平优势的地方。\u003c/p\u003e\n\u003cp\u003e它是免费 distribution，也是目前最便宜的 creative testing lab。\u003c/p\u003e\n\u003ch4 id=\"把-organic-当成你的试验厨房\"\u003e把 organic 当成你的试验厨房\u003c/h4\u003e\n\u003cp\u003e先把 10 个 hook 做成 organic TikTok、Reels 或 X post。\u003c/p\u003e\n\u003cp\u003e观察 algorithm 会把哪些推起来，再把预算投到 winner 上。\u003c/p\u003e\n\u003cp\u003e你先免费知道什么有效，然后 ad budget 只花在已经证明过的 idea 上。\u003c/p\u003e\n\u003ch4 id=\"把一切都剪成短内容\"\u003e把一切都剪成短内容\u003c/h4\u003e\n\u003cp\u003e一份长内容——比如 podcast、webinar，或者创始人边走边讲的一段 rant——都可以拆成 20 条 short clip。\u003c/p\u003e\n\u003cp\u003eOpus Clip 之类的工具可以找出最好的片段并自动加 caption，Agent 还能把它们排期到不同平台。\u003c/p\u003e\n\u003cp\u003e很多最大的 podcast 就是这样增长起来的。\u003c/p\u003e\n\u003ch4 id=\"使用不露脸也能规模化的格式\"\u003e使用“不露脸也能规模化”的格式\u003c/h4\u003e\n\u003cp\u003eTikTok 和 Instagram 上的 slideshow 和 carousel，很适合根据客户语言报告批量制作。\u003c/p\u003e\n\u003cp\u003e它们既容易生产，也经常获得大量 save。\u003c/p\u003e\n\u003cp\u003eAgent 写 slides，模型生成图片，你在周日统一审核整批内容。\u003c/p\u003e\n\u003ch4 id=\"先听再说\"\u003e先听，再说\u003c/h4\u003e\n\u003cp\u003e让 Agent 去读 Reddit、X、TikTok comment，以及竞争对手 review。\u003c/p\u003e\n\u003cp\u003e每周汇报大家在抱怨什么、问什么、为什么兴奋。\u003c/p\u003e\n\u003cp\u003e然后，让它为那些“你的产品确实能帮上忙”的 thread 起草真正有用的回复，但最终由你本人发布。\u003c/p\u003e\n\u003cp\u003e尤其在 Reddit 上，一个真人给出的有用答案，通常比任何广告都强；而一条 spammy 回复会直接让你被 ban。\u003c/p\u003e\n\u003ch4 id=\"把创始人真正用起来\"\u003e把创始人真正用起来\u003c/h4\u003e\n\u003cp\u003e当所有品牌都可以生成内容时，feed 上最稀缺的东西反而是：\u003cstrong\u003e一个真实的人，以及他真实的观点。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e把 \u003ccode\u003efounder-opinions.md\u003c/code\u003e 变成内容引擎。\u003c/p\u003e\n\u003cp\u003eAgent 每天根据这些观点写一个 draft，你再把它编辑成真正属于你的声音，然后自己点击 publish。\u003c/p\u003e\n\u003cp\u003eAI 反而让 founder 变得更有价值，因为创始人本人是唯一无法被竞争对手生成出来的东西。\u003c/p\u003e\n\u003cp\u003e保持两条规则：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e平台要求标注 AI-generated people / scene 时，就明确标注；\u003c/li\u003e\n\u003cli\u003epublish button 始终留在人手里。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"如何成为前-1-的营销工程师\"\u003e如何成为前 1% 的营销工程师\u003c/h2\u003e\n\u003cp\u003e基础系统能够自行运行以后，真正有意思的部分才开始。\u003c/p\u003e\n\u003ch3 id=\"构建决策工具\"\u003e构建决策工具\u003c/h3\u003e\n\u003cp\u003e第一件事，是构建 decision tool。\u003c/p\u003e\n\u003cp\u003e比如一家包装公司做一个 calculator，告诉客户哪种 box size 最能降低 shipping bill。\u003c/p\u003e\n\u003cp\u003e一家软件公司做一个 migration checker，扫描客户当前 setup，然后清楚说明哪些东西可以顺利迁移。\u003c/p\u003e\n\u003cp\u003e过去，这些通常是六个月的工程项目，所以很少有人会做。\u003c/p\u003e\n\u003cp\u003e现在，一个营销工程师可能一周就能上线一个粗糙但可用的版本。买家会收藏它，并在真正准备购买时回来。\u003c/p\u003e\n\u003ch3 id=\"营销给那些影响购买的人\"\u003e营销给那些“影响购买的人”\u003c/h3\u003e\n\u003cp\u003e第二件事，是面向真正影响 purchase 的人做营销。\u003c/p\u003e\n\u003cp\u003e例如：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e会向 40 个客户推荐软件的 accountant；\u003c/li\u003e\n\u003cli\u003e为客户选择工具的 agency；\u003c/li\u003e\n\u003cli\u003e每次都会被问“这个安全吗？”的 IT person。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e直接为这些人做一条 campaign，给他们真正需要的材料，让他们能够对最终购买说 yes。\u003c/p\u003e\n\u003ch3 id=\"在-onboarding-里修-acquisition\"\u003e在 onboarding 里修 acquisition\u003c/h3\u003e\n\u003cp\u003e第三件事，是把 acquisition 问题往 onboarding 里看。\u003c/p\u003e\n\u003cp\u003e有时 ads 根本没问题，真正的问题是新客户第一周太困惑，于是迅速 churn。\u003c/p\u003e\n\u003cp\u003e一个能读取 onboarding ticket、找出人们卡在哪里的 Agent，可能比你下一组 ad set 更能推动增长。\u003c/p\u003e\n\u003ch3 id=\"让每个渠道承担不同工作\"\u003e让每个渠道承担不同工作\u003c/h3\u003e\n\u003cp\u003e第四件事，是给每个 channel 明确职责。\u003c/p\u003e\n\u003cp\u003eSearch 回答问题。\u003cbr\u003eSocial 发起对话。\u003cbr\u003eEmail 在具体时刻出现。\u003c/p\u003e\n\u003cp\u003e如果每个 channel 都在重复同一句 message，你其实是在为同一条 impression 付五遍钱。\u003c/p\u003e\n\u003ch2 id=\"工具栈与能力要求\"\u003e工具栈与能力要求\u003c/h2\u003e\n\u003ch3 id=\"工具栈\"\u003e工具栈\u003c/h3\u003e\n\u003cp\u003e下面是按工作类型整理的完整 toolkit。\u003c/p\u003e\n\u003cp\u003e工具每隔几个月就会变化，所以真正该学的是 category，再根据需要替换具体名字。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAgent workspace：\u003c/strong\u003e Claude Code、Codex、Cursor、Google AI Studio\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAlways-on agents：\u003c/strong\u003e Hermes、GrokBot、Codex\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWriting and strategy：\u003c/strong\u003e Claude、ChatGPT、Gemini\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eImages：\u003c/strong\u003e Nano Banana、GPT Image、Midjourney\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVideo：\u003c/strong\u003e Veo、Sora、Kling、Runway、Fal\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI actors and UGC：\u003c/strong\u003e Arcads、HeyGen、Creatify\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVoice：\u003c/strong\u003e ElevenLabs\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFunnels：\u003c/strong\u003e \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoringFunnels.com\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEditing and clipping：\u003c/strong\u003e CapCut、Captions、Opus Clip\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCustomer voice：\u003c/strong\u003e Gong、Fathom、Intercom、Zendesk、G2\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCRM：\u003c/strong\u003e HubSpot、Salesforce\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSignals and enrichment：\u003c/strong\u003e Clay、Apollo\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSearch and AI visibility：\u003c/strong\u003e Ahrefs、Semrush、Google Search Console\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAds：\u003c/strong\u003e Meta Ads API、Google Ads API\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEmail and outbound：\u003c/strong\u003e \u003ca href=\"https://customer.io/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCustomer.io\u003c/a\u003e、Resend、Instantly\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWeb：\u003c/strong\u003e Next.js on Vercel、Framer、Webflow\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMeasurement：\u003c/strong\u003e PostHog、Stripe、Supabase\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"你需要学什么\"\u003e你需要学什么\u003c/h3\u003e\n\u003cp\u003e这份工作一半是 marketer，一半是 builder，两边都要懂。\u003c/p\u003e\n\u003ch4 id=\"营销人的一半\"\u003e营销人的一半\u003c/h4\u003e\n\u003cp\u003e这一半，仍然是优秀营销人一直以来就必须掌握的能力。\u003c/p\u003e\n\u003cp\u003e你要知道：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e怎样做 customer interview，并听出真正重要的那句话；\u003c/li\u003e\n\u003cli\u003e怎样做 positioning，让正确的人感觉产品就是为自己做的；\u003c/li\u003e\n\u003cli\u003e怎样设计一个真正有购买理由的 offer，而不是披着伪装的 discount；\u003c/li\u003e\n\u003cli\u003e怎样写出让人停止滑动的 headline；\u003c/li\u003e\n\u003cli\u003e每个 channel 是怎样决定内容被谁看到的；\u003c/li\u003e\n\u003cli\u003e以及足够的 statistics，知道一个结果是真实 signal，还是只是 fluke。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"builder-的一半\"\u003eBuilder 的一半\u003c/h4\u003e\n\u003cp\u003e这一半更新，但其实比很多人想象中更容易学。\u003c/p\u003e\n\u003cp\u003e你需要：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e写出 Agent 真正能使用的 context——这可能是整份清单里最被低估的技能；\u003c/li\u003e\n\u003cli\u003e至少能读代码，判断它到底有没有做你要求的事，因为 Agent 写代码，但最终责任是你的；\u003c/li\u003e\n\u003cli\u003e理解 API 和 MCP 怎样连接工具；\u003c/li\u003e\n\u003cli\u003e会写基础 SQL，自己拉数字；\u003c/li\u003e\n\u003cli\u003e能部署一个页面；\u003c/li\u003e\n\u003cli\u003e会用 git；\u003c/li\u003e\n\u003cli\u003e会写 test case；\u003c/li\u003e\n\u003cli\u003e大致知道每一次 Agent run 会花多少钱。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"最快的学习方式真正上线一个东西\"\u003e最快的学习方式：真正上线一个东西\u003c/h4\u003e\n\u003cp\u003e学习 builder 这半边最快的方法，是这个周末用 AI coding tool 做一个很丑的 landing page，然后真正部署上线。\u003c/p\u003e\n\u003cp\u003e一个真正 deployed 的页面，比十门课教你的东西更多。\u003c/p\u003e\n\u003ch2 id=\"接下来会走向哪里\"\u003e接下来会走向哪里\u003c/h2\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUHHn_3bsAATORV?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003ch3 id=\"如果这周就开始\"\u003e如果这周就开始\u003c/h3\u003e\n\u003cp\u003e如果是我这周从零开始，我会这样做：\u003c/p\u003e\n\u003cp\u003e如果你是 marketer：构建客户语言 Agent，并用最近 20 次销售通话来跑它。\u003c/p\u003e\n\u003cp\u003e如果你是 engineer：参加 5 次销售通话，然后为一个具体 customer segment 做一个 calculator。\u003c/p\u003e\n\u003cp\u003e如果你是 founder：这个周末留出两个小时写 \u003ccode\u003efounder-opinions.md\u003c/code\u003e，因为你之后构建的每一个 Agent 都会因此变得更锋利。\u003c/p\u003e\n\u003ch3 id=\"让每一个-workflow-自己赢得信任\"\u003e让每一个 workflow 自己赢得信任\u003c/h3\u003e\n\u003cp\u003e在 workflow 真正赢得你的信任之前，publish、outreach 和 spend 都继续放在 approval 后面。\u003c/p\u003e\n\u003cp\u003e先把一个 workflow 做可靠，再添加下一个。\u003c/p\u003e\n\u003cp\u003e一个每天早晨自动运行、但本身很混乱的 workflow，只会稳定地给你制造一批混乱。\u003c/p\u003e\n\u003ch3 id=\"作者对下一代营销团队的判断\"\u003e作者对下一代营销团队的判断\u003c/h3\u003e\n\u003cp\u003e在营销史的大部分时期，赢家往往是预算最大、人最多的公司。\u003c/p\u003e\n\u003cp\u003e我认为接下来十年，赢家会变成：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e最了解客户，而且行动最快的人。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我的猜测是，到 2028 年，最好的营销团队可能只有一两个 marketing engineer，却运行着几十个 Agent，产出速度会超过人数是它十倍的部门。\u003c/p\u003e\n\u003cp\u003e而这些未来的营销工程师，大多数现在其实就坐在 growth、content 和 ops 岗位上。\u003c/p\u003e\n\u003cp\u003e他们距离成为营销工程师，可能只差一个周末真正开始 build。\u003c/p\u003e\n\u003ch3 id=\"更多资源与合作方式\"\u003e更多资源与合作方式\u003c/h3\u003e\n\u003cp\u003e如果你想继续深入，我在 \u003ca href=\"https://x.com/@startupideaspod\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@startupideaspod\u003c/a\u003e 做过一期完整的 marketing engineer 节目：\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://youtube.com/watch?v=8ZC1G1ezN5o\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://youtube.com/watch?v=8ZC1G1ezN5o\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e如果有我能帮忙的地方，可以 DM 我。没法回复所有人，但我会回复一部分。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e我支持你。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eGreg Isenberg\u003c/p\u003e\n\u003cp\u003e顺便，如果你想和我们合作，有几种方式：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eHire\u003c/strong\u003e \u003ca href=\"https://latecheckout.agency\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLCA\u003c/a\u003e\u003cstrong\u003e。\u003c/strong\u003e 我们是一家面向 AI 的领先产品设计公司。如果你希望自己的 AI 产品在视觉和体验上达到世界级，可以联系我们。Strategy、design、product、engineering，我们都做。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUse\u003c/strong\u003e \u003ca href=\"https://ideabrowser.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cstrong\u003eIdeabrowser.com\u003c/strong\u003e\u003c/a\u003e\u003cstrong\u003e。\u003c/strong\u003e 用真实数据寻找下一个 startup idea。已有超过 20 万名 founder 使用。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTry\u003c/strong\u003e \u003ca href=\"https://boringfunnels.com\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e。我的合伙人刚刚推出 \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e。它每周拆解一个真实有效的 funnel，并把整套流程转换成可以交给 coding agent 的 prompt。\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/@startupideaspod\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@startupideaspod\u003c/a\u003e —— 可以在 \u003ca href=\"https://open.spotify.com/show/6aB0v6amo3a8hgTCjlTlvh?si=b5f1586b30b44d51\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eSpotify\u003c/a\u003e、\u003ca href=\"https://podcasts.apple.com/us/podcast/the-startup-ideas-podcast/id1593424985\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eApple\u003c/a\u003e、\u003ca href=\"https://www.youtube.com/@GregIsenberg/videos\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eYouTube\u003c/a\u003e 收听，内容包括 startup idea、growth tactic 和实用 AI tutorial。\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"chatgpt-编辑附注-dmndeditorial-insightv1\" class=\"dmnd-editorial-block dmnd-editorial-start\"\u003eChatGPT 编辑附注\u003c/h2\u003e\n\u003cp class=\"dmnd-editorial-block\"\u003e这篇文章真正提出的不是“用更多 Agent 自动化营销”，而是把营销从一次次 campaign 的生产流程，重构成一套围绕客户证据、可追溯实验、明确权限和持续反馈运行的学习系统。\u003c/p\u003e\n\u003ch3 id=\"关键要点\" class=\"dmnd-editorial-block\"\u003e关键要点\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e营销工程师的核心杠杆，是把客户研究、创意、开发、数据与实验压缩到更短的执行循环，而不只是更快生成文案。\u003c/li\u003e\n\u003cli\u003e作者反复强调先建立可用上下文和统一 campaign ID，再扩展 Agent；否则自动化只会放大模糊输入和无法归因的实验。\u003c/li\u003e\n\u003cli\u003e高风险动作不应只依赖 Prompt 约束：只读起步、最小权限、paused 状态、硬审批和人工 publish 都被放进工具与流程。\u003c/li\u003e\n\u003cli\u003e真正的长期学习来自把客户原话、实验结果、收入、留存、失败原因和人工拒绝重新写回系统，让下一轮基于更好的输入运行。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"可借鉴的新思路\" class=\"dmnd-editorial-block\"\u003e可借鉴的新思路\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e评价 Agent workflow 时，与其问“自动化了多少步骤”，不如问它是否缩短了从真实客户信号到实验，再到可验证商业结果的闭环。\u003c/li\u003e\n\u003cli\u003e把事实、猜测和决策记录分层，并让 workflow 逐步赢得权限，是扩展 Agent 系统时一种可复用的治理方法。\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr class=\"dmnd-editorial-block dmnd-editorial-end\"\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:01fbe11ff323c2fddd722896e1ef5c6db51f13bdc8f0db4064ec15daedea2e9a":{"html":"\u003cp\u003e下面是按工作类型整理的完整 toolkit。\u003c/p\u003e\n\u003cp\u003e工具每隔几个月就会变化，所以真正该学的是 category，再根据需要替换具体名字。\u003c/p\u003e\n","kind":"html","rawMarkdown":"下面是按工作类型整理的完整 toolkit。\n\n工具每隔几个月就会变化，所以真正该学的是 category，再根据需要替换具体名字。","sourceFormat":"markdown"},"note:sha256:0357455610ab7d1267fcf3f0c3d88d0ac79d36e710e84522b583fcbbe2290410":{"html":"\u003cp\u003e第三件事，是把 acquisition 问题往 onboarding 里看。\u003c/p\u003e\n\u003cp\u003e有时 ads 根本没问题，真正的问题是新客户第一周太困惑，于是迅速 churn。\u003c/p\u003e\n\u003cp\u003e一个能读取 onboarding ticket、找出人们卡在哪里的 Agent，可能比你下一组 ad set 更能推动增长。\u003c/p\u003e\n","kind":"html","rawMarkdown":"第三件事，是把 acquisition 问题往 onboarding 里看。\n\n有时 ads 根本没问题，真正的问题是新客户第一周太困惑，于是迅速 churn。\n\n一个能读取 onboarding ticket、找出人们卡在哪里的 Agent，可能比你下一组 ad set 更能推动增长。","sourceFormat":"markdown"},"note:sha256:11d4b7af6fb363938b35ab9162d4163421ccf2b096b641547fa98ceb4580b792":{"blocks":[{"children":[],"kind":"leaf","title":"创意 Agent 负责制作和测试广告。"},{"children":[],"kind":"leaf","title":"给它最新的客户语言报告、offers.md 里经过批准的 claims、真实产品录像和截图，以及一个你喜欢的广告素材文件夹。"},{"children":[{"title":"一个广告完整演示一个 worked example；"},{"title":"一个讲客户故事；"},{"title":"一个直接做原始产品 demo。"}],"kind":"section","title":"不要让它只是写同一句 headline 的 50 个版本，而是要求它给出不同的“购买理由”"},{"children":[],"kind":"leaf","title":"Nano Banana 之类的图片模型，以及 Veo 之类的视频模型，让生产成本几乎降到了零。"},{"children":[],"kind":"leaf","title":"给每条广告命名时，要把它真正测试的东西写进去，例如 BK014_dinner-angle_ugc_v2。"},{"children":[],"kind":"leaf","title":"这样 campaign ID、idea 和 format 都直接写在名称里。"},{"children":[],"kind":"leaf","title":"一个月后，“dinner angle 打败了 price angle”是一条可以复用到其它地方的知识；“video_final_7 赢了”则只是无意义的 trivia。"},{"children":[],"kind":"leaf","title":"Agent 通过 Meta Ads API 上传广告，但保持 paused 状态，由人来真正点击上线。"},{"children":[],"kind":"leaf","title":"然后让一段小脚本每天早晨检查结果，在达到预设 spend 后，把 CTR 低于 1% 的广告暂停。"},{"children":[],"kind":"leaf","title":"在实验开始前就决定 evidence bar：要花多少钱、跑多少天、什么算 win。"},{"children":[],"kind":"leaf","title":"否则，即使做了 200 个广告，也可能只是得到 200 个没有结论的实验。"}],"html":"\u003cp\u003e创意 Agent 负责制作和测试广告。\u003c/p\u003e\n\u003cp\u003e给它最新的客户语言报告、\u003ccode\u003eoffers.md\u003c/code\u003e 里经过批准的 claims、真实产品录像和截图，以及一个你喜欢的广告素材文件夹。\u003c/p\u003e\n\u003cp\u003e不要让它只是写同一句 headline 的 50 个版本，而是要求它给出不同的“购买理由”：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e一个广告完整演示一个 worked example；\u003c/li\u003e\n\u003cli\u003e一个讲客户故事；\u003c/li\u003e\n\u003cli\u003e一个直接做原始产品 demo。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNano Banana 之类的图片模型，以及 Veo 之类的视频模型，让生产成本几乎降到了零。\u003c/p\u003e\n\u003cp\u003e给每条广告命名时，要把它真正测试的东西写进去，例如 \u003ccode\u003eBK014_dinner-angle_ugc_v2\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e这样 campaign ID、idea 和 format 都直接写在名称里。\u003c/p\u003e\n\u003cp\u003e一个月后，“dinner angle 打败了 price angle”是一条可以复用到其它地方的知识；“\u003ccode\u003evideo_final_7\u003c/code\u003e 赢了”则只是无意义的 trivia。\u003c/p\u003e\n\u003cp\u003eAgent 通过 Meta Ads API 上传广告，但保持 paused 状态，由人来真正点击上线。\u003c/p\u003e\n\u003cp\u003e然后让一段小脚本每天早晨检查结果，在达到预设 spend 后，把 CTR 低于 1% 的广告暂停。\u003c/p\u003e\n\u003cp\u003e在实验开始前就决定 evidence bar：要花多少钱、跑多少天、什么算 win。\u003c/p\u003e\n\u003cp\u003e否则，即使做了 200 个广告，也可能只是得到 200 个没有结论的实验。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"创意 Agent 负责制作和测试广告。\n\n给它最新的客户语言报告、`offers.md` 里经过批准的 claims、真实产品录像和截图，以及一个你喜欢的广告素材文件夹。\n\n不要让它只是写同一句 headline 的 50 个版本，而是要求它给出不同的“购买理由”：\n\n- 一个广告完整演示一个 worked example；\n- 一个讲客户故事；\n- 一个直接做原始产品 demo。\n\nNano Banana 之类的图片模型，以及 Veo 之类的视频模型，让生产成本几乎降到了零。\n\n给每条广告命名时，要把它真正测试的东西写进去，例如 `BK014_dinner-angle_ugc_v2`。\n\n这样 campaign ID、idea 和 format 都直接写在名称里。\n\n一个月后，“dinner angle 打败了 price angle”是一条可以复用到其它地方的知识；“`video_final_7` 赢了”则只是无意义的 trivia。\n\nAgent 通过 Meta Ads API 上传广告，但保持 paused 状态，由人来真正点击上线。\n\n然后让一段小脚本每天早晨检查结果，在达到预设 spend 后，把 CTR 低于 1% 的广告暂停。\n\n在实验开始前就决定 evidence bar：要花多少钱、跑多少天、什么算 win。\n\n否则，即使做了 200 个广告，也可能只是得到 200 个没有结论的实验。","sourceFormat":"markdown"},"note:sha256:13a7902093cefa5b11a874e92ed9b10915f6abb9019d734b532b93403f58e3c0":{"html":"\u003cp\u003e然后做一件几乎所有公司都会跳过、但其实极其重要的“无聊工作”：给每条 campaign 分配一个 ID，并让这个 ID 贯穿所有地方。\u003c/p\u003e\n\u003cp\u003e把它写进每个链接的 UTM、每个广告名称、每条邮件 sequence 的名字，以及 CRM 中每一笔 deal 的字段里。\u003c/p\u003e\n\u003cp\u003e再维护一张简单的表，哪怕一开始只是 Supabase 或 spreadsheet。每条 campaign 一行，包括：ID、spend、leads、qualified calls、deals、revenue、churn。\u003c/p\u003e\n","kind":"html","rawMarkdown":"然后做一件几乎所有公司都会跳过、但其实极其重要的“无聊工作”：给每条 campaign 分配一个 ID，并让这个 ID 贯穿所有地方。\n\n把它写进每个链接的 UTM、每个广告名称、每条邮件 sequence 的名字，以及 CRM 中每一笔 deal 的字段里。\n\n再维护一张简单的表，哪怕一开始只是 Supabase 或 spreadsheet。每条 campaign 一行，包括：ID、spend、leads、qualified calls、deals、revenue、churn。","sourceFormat":"markdown"},"note:sha256:144bff143612abfac0cd159a507e996ddb4ca9b67b7d44fd158b526d0fb06ddd":{"blocks":[{"children":[{"title":"你的利润到底消失在哪里；"},{"title":"一份示例月度报告；"},{"title":"一个真实客户的小故事。"}],"kind":"section","title":"周二，创意 Agent 根据客户原话做出三个 angle"},{"children":[],"kind":"leaf","title":"搜索 Agent 做出一个简单的 profit calculator 页面，里面使用公司已经验证过的数字。"},{"children":[],"kind":"leaf","title":"丢单 Agent 找出 60 个曾经说“也许年底后再说”的老 prospect，并为每个人起草一封个性化消息。"},{"children":[],"kind":"leaf","title":"购买触发 Agent 则标记出刚刚开始在 Amazon 销售的商店，因为 multichannel selling 会让账务变得更复杂。"}],"html":"\u003cp\u003e周二，创意 Agent 根据客户原话做出三个 angle：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e你的利润到底消失在哪里；\u003c/li\u003e\n\u003cli\u003e一份示例月度报告；\u003c/li\u003e\n\u003cli\u003e一个真实客户的小故事。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e搜索 Agent 做出一个简单的 profit calculator 页面，里面使用公司已经验证过的数字。\u003c/p\u003e\n\u003cp\u003e丢单 Agent 找出 60 个曾经说“也许年底后再说”的老 prospect，并为每个人起草一封个性化消息。\u003c/p\u003e\n\u003cp\u003e购买触发 Agent 则标记出刚刚开始在 Amazon 销售的商店，因为 multichannel selling 会让账务变得更复杂。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"周二，创意 Agent 根据客户原话做出三个 angle：\n\n- 你的利润到底消失在哪里；\n- 一份示例月度报告；\n- 一个真实客户的小故事。\n\n搜索 Agent 做出一个简单的 profit calculator 页面，里面使用公司已经验证过的数字。\n\n丢单 Agent 找出 60 个曾经说“也许年底后再说”的老 prospect，并为每个人起草一封个性化消息。\n\n购买触发 Agent 则标记出刚刚开始在 Amazon 销售的商店，因为 multichannel selling 会让账务变得更复杂。","sourceFormat":"markdown"},"note:sha256:16289808fdb3fefcdf582cce1d7cce7137fcdfaf9cb4e9b23ffc9afdf3a4d5c9":{"html":"\u003cp\u003e营销工程师可以在一个下午把这些事全部做出来。\u003c/p\u003e\n\u003cp\u003e当“为具体人、具体场景做具体营销”变得便宜时，真正开始占优势的，是最了解客户的公司。按小时收费的 agency 会最先感受到变化；庞大的营销团队会越来越像委员会；创始人和独立营销人则可能突然拥有过去一个完整部门的产出能力。\u003c/p\u003e\n\u003cp\u003e注：我的合伙人刚推出了 \u003ca href=\"https://boringfunnels.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eBoring Funnels\u003c/a\u003e。背后的想法是，最大的机会在于帮助企业把自己已经知道的客户知识，转成清晰的 offer、有用的落地页，以及最终促成销售的 follow-up。营销工程师可以把整套东西搭出来，观察用户在哪一步流失，并随着更多客户进入不断优化。\u003c/p\u003e\n\u003cp\u003e下面具体讲怎么做。\u003c/p\u003e\n","kind":"html","rawMarkdown":"营销工程师可以在一个下午把这些事全部做出来。\n\n当“为具体人、具体场景做具体营销”变得便宜时，真正开始占优势的，是最了解客户的公司。按小时收费的 agency 会最先感受到变化；庞大的营销团队会越来越像委员会；创始人和独立营销人则可能突然拥有过去一个完整部门的产出能力。\n\n注：我的合伙人刚推出了 [Boring Funnels](https://boringfunnels.com/)。背后的想法是，最大的机会在于帮助企业把自己已经知道的客户知识，转成清晰的 offer、有用的落地页，以及最终促成销售的 follow-up。营销工程师可以把整套东西搭出来，观察用户在哪一步流失，并随着更多客户进入不断优化。\n\n下面具体讲怎么做。","sourceFormat":"markdown"},"note:sha256:163bf115a453690e2fa9f086dc2aaa91a2dae646b81fbbcf0853ca631c6e9cff":{"html":"\u003cp\u003e购买触发 Agent 负责监测那些会在一夜之间产生需求的时刻。\u003c/p\u003e\n\u003cp\u003e一家公司开了第二家门店；一个品牌开始做批发；一家 startup 完成融资并同时发布五个销售岗位；你集成的某个工具刚刚上线新功能——这些都可能是 trigger。\u003c/p\u003e\n\u003cp\u003e最简单的搭建方式之一是在 Clay 里完成。先拉一组符合 \u003ccode\u003ecustomer-fit.md\u003c/code\u003e 的 account，然后增加不同列，检查每种 trigger，比如新招聘、融资新闻、新门店、网站新增页面等。Apollo 很适合补充联系人数据。\u003c/p\u003e\n\u003cp\u003e对于每个出现新 trigger 的 account，Agent 先查 CRM，跳过团队已经在跟进的人，然后完成一句话：\u003c/p\u003e\n\u003cp\u003e“这个事件会产生这个问题，而我们的产品可以用这种具体方式解决它。”\u003c/p\u003e\n\u003cp\u003e如果这句话很模糊，这个 account 就先不动。如果这句话足够清晰，Agent 就起草一封以该事件开头的短邮件，并把它保存为 draft，交给你审核。\u003c/p\u003e\n\u003cp\u003e正是这句过滤条件，让 outbound 更像“在恰当时机出现”，而不是 spam。\u003c/p\u003e\n","kind":"html","rawMarkdown":"购买触发 Agent 负责监测那些会在一夜之间产生需求的时刻。\n\n一家公司开了第二家门店；一个品牌开始做批发；一家 startup 完成融资并同时发布五个销售岗位；你集成的某个工具刚刚上线新功能——这些都可能是 trigger。\n\n最简单的搭建方式之一是在 Clay 里完成。先拉一组符合 `customer-fit.md` 的 account，然后增加不同列，检查每种 trigger，比如新招聘、融资新闻、新门店、网站新增页面等。Apollo 很适合补充联系人数据。\n\n对于每个出现新 trigger 的 account，Agent 先查 CRM，跳过团队已经在跟进的人，然后完成一句话：\n\n“这个事件会产生这个问题，而我们的产品可以用这种具体方式解决它。”\n\n如果这句话很模糊，这个 account 就先不动。如果这句话足够清晰，Agent 就起草一封以该事件开头的短邮件，并把它保存为 draft，交给你审核。\n\n正是这句过滤条件，让 outbound 更像“在恰当时机出现”，而不是 spam。","sourceFormat":"markdown"},"note:sha256:1754cf8efbc10d874706c97ab4d0a3d23def00e43354342842f50efccb3c5ab6":{"html":"\u003cp\u003e从 1950 年代到 1990 年代的 Mad Men 时代，营销意味着印刷、电视、广播和户外广告。工作核心是大创意和大预算。一场 campaign 可能耗资数百万、制作数月，运气好的话，一个季度后才能知道有没有效果。优秀营销人一年真正出手的机会屈指可数，所以整个行业高度依赖品味、说服力和直觉。\u003c/p\u003e\n","kind":"html","rawMarkdown":"从 1950 年代到 1990 年代的 Mad Men 时代，营销意味着印刷、电视、广播和户外广告。工作核心是大创意和大预算。一场 campaign 可能耗资数百万、制作数月，运气好的话，一个季度后才能知道有没有效果。优秀营销人一年真正出手的机会屈指可数，所以整个行业高度依赖品味、说服力和直觉。","sourceFormat":"markdown"},"note:sha256:188037bd60a753757c2bad9728cb445344d4246feaf77373e55bc7d4ed8b3461":{"html":"\u003cp\u003e然后给每个 Agent 写一个短 contract，就像带 guardrail 的 job description。\u003c/p\u003e\n\u003cp\u003e下面是一份购买触发 Agent 的例子：\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCbFV0bsAAfDqN?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"然后给每个 Agent 写一个短 contract，就像带 guardrail 的 job description。\n\n下面是一份购买触发 Agent 的例子：\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCbFV0bsAAfDqN?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:1da0a8f9cdd5199e538ed06090e5347fad5dc1379f5dd270a6a953c43d6cd3da":{"html":"\u003cblockquote\u003e\n\u003cp\u003e@gregisenberg · \u003ca href=\"https://x.com/gregisenberg/article/2108188646973313195\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX 文章\u003c/a\u003e · 2026-10-08\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e营销工程师正在成为新的“10x 员工”，而大多数公司现在还没有这样的人。\u003c/p\u003e\n\u003cp\u003e如果你正在做一家初创公司、一门生意，或者一份副业，那么成为营销工程师，或招聘一名营销工程师，可能是你眼下最大的杠杆。这也许是自 Google 推出 AdWords 以来，营销最令人兴奋的时刻。甚至可能是有史以来最令人兴奋的时刻。\u003c/p\u003e\n\u003cp\u003e过去 20 年里，营销点子并不难想，难的是把它真正做出来。销售知道为什么交易会成交，客服知道为什么客户会流失，但每一个想法都得经过 brief、设计师、开发者、分析师和两轮会议，大多数最后都死在 Slack 线程里。\u003c/p\u003e\n\u003cp\u003e这个瓶颈刚刚被打破。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HUCeZJxbcAED0KN?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e现在，一个 Agent 可以在十分钟内读完上周的销售通话；另一个把客户原话变成落地页；另一个在你睡觉时上线 30 个广告并停掉表现差的；还有一个会在周一告诉你，究竟是哪条 campaign 带来了真正付费的客户。如今模型已经足够强，只要你的想法够好，输出通常也会够好。\u003c/p\u003e\n\u003cp\u003e营销工程师做的，就是把这些 Agent 接成一台机器。他一半是营销人，一半是 builder。最优秀的人往往甚至不是传统营销出身，而可能来自创始人、工程师、运营或独立开发者。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e所以准备好咖啡或茶，下面是一份完整 playbook（阅读约 15–20 分钟）。\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e @gregisenberg · [X 文章](https://x.com/gregisenberg/article/2108188646973313195) · 2026-10-08\n\n营销工程师正在成为新的“10x 员工”，而大多数公司现在还没有这样的人。\n\n如果你正在做一家初创公司、一门生意，或者一份副业，那么成为营销工程师，或招聘一名营销工程师，可能是你眼下最大的杠杆。这也许是自 Google 推出 AdWords 以来，营销最令人兴奋的时刻。甚至可能是有史以来最令人兴奋的时刻。\n\n过去 20 年里，营销点子并不难想，难的是把它真正做出来。销售知道为什么交易会成交，客服知道为什么客户会流失，但每一个想法都得经过 brief、设计师、开发者、分析师和两轮会议，大多数最后都死在 Slack 线程里。\n\n这个瓶颈刚刚被打破。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HUCeZJxbcAED0KN?format=jpg\u0026name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n现在，一个 Agent 可以在十分钟内读完上周的销售通话；另一个把客户原话变成落地页；另一个在你睡觉时上线 30 个广告并停掉表现差的；还有一个会在周一告诉你，究竟是哪条 campaign 带来了真正付费的客户。如今模型已经足够强，只要你的想法够好，输出通常也会够好。\n\n营销工程师做的，就是把这些 Agent 接成一台机器。他一半是营销人，一半是 builder。最优秀的人往往甚至不是传统营销出身，而可能来自创始人、工程师、运营或独立开发者。\n\n**所以准备好咖啡或茶，下面是一份完整 playbook（阅读约 15–20 分钟）。**","sourceFormat":"markdown"},"note:sha256:1f6b713c6fe15abc638a7f83b963dc990a4f17174f74f2e895c6278e7703cf9a":{"html":"\u003cp\u003e有一条规则能让这套“大脑”保持健康：Agent 可以把猜测写进 \u003ccode\u003eevidence/\u003c/code\u003e，但只有人能把内容移动到 \u003ccode\u003ecompany/\u003c/code\u003e。\u003c/p\u003e\n\u003cp\u003e否则，一个 Agent 的猜测很容易悄悄变成公司政策。\u003c/p\u003e\n","kind":"html","rawMarkdown":"有一条规则能让这套“大脑”保持健康：Agent 可以把猜测写进 `evidence/`，但只有人能把内容移动到 `company/`。\n\n否则，一个 Agent 的猜测很容易悄悄变成公司政策。","sourceFormat":"markdown"},"note:sha256:2148b09186d772ea4af6c24c874513c3f936124976f87ab32a31a69d3663b6a1":{"html":"\u003cp\u003e如果你想继续深入，我在 \u003ca href=\"https://x.com/@startupideaspod\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e@startupideaspod\u003c/a\u003e 做过一期完整的 marketing engineer 节目：\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://youtube.com/watch?v=8ZC1G1ezN5o\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://youtube.com/watch?v=8ZC1G1ezN5o\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e如果有我能帮忙的地方，可以 DM 我。没法回复所有人，但我会回复一部分。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e我支持你。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eGreg Isenberg\u003c/p\u003e\n\u003cp\u003e顺便，如果你想和我们合作，有几种方式：\u003c/p\u003e\n","kind":"html","rawMarkdown":"如果你想继续深入，我在 [@startupideaspod](https://x.com/@startupideaspod) 做过一期完整的 marketing engineer 节目：\n\n[https://youtube.com/watch?v=8ZC1G1ezN5o](https://youtube.com/watch?v=8ZC1G1ezN5o)\n\n如果有我能帮忙的地方，可以 DM 我。没法回复所有人，但我会回复一部分。\n\n**我支持你。**\n\nGreg Isenberg\n\n顺便，如果你想和我们合作，有几种方式：","sourceFormat":"markdown"},"note:sha256:2315b62235fe48304683dd737601392b1b7eb6a02baa4b6132a5ada4ad229a4f":{"html":"\u003cp\u003e第一件事，是构建 decision tool。\u003c/p\u003e\n\u003cp\u003e比如一家包装公司做一个 calculator，告诉客户哪种 box size 最能降低 shipping bill。\u003c/p\u003e\n\u003cp\u003e一家软件公司做一个 migration checker，扫描客户当前 setup，然后清楚说明哪些东西可以顺利迁移。\u003c/p\u003e\n\u003cp\u003e过去，这些通常是六个月的工程项目，所以很少有人会做。\u003c/p\u003e\n\u003cp\u003e现在，一个营销工程师可能一周就能上线一个粗糙但可用的版本。买家会收藏它，并在真正准备购买时回来。\u003c/p\u003e\n","kind":"html","rawMarkdown":"第一件事，是构建 decision tool。\n\n比如一家包装公司做一个 calculator，告诉客户哪种 box size 最能降低 shipping bill。\n\n一家软件公司做一个 migration checker，扫描客户当前 setup，然后清楚说明哪
