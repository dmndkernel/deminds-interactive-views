 the generative objective forces the model to get everything right: the object, the background, the textures, the shapes, the lighting and the shadows—lest it be punished by the training objective. It is this intuition that makes me confident that generative models will be able to solve visual intelligence, simply because their training task is hard enough to be meaningful, forcing them to learn much about the world by virtue of prediction.","sourceFormat":"markdown"},"note:sha256:ec07f28e8003415d887acf87cccf7cc8fdd9e1ba7a0ee3ed72960430f4caa4f5":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px4.p1.1\"\u003e\u003c/span\u003eMuch of the structure described above can be written as a program. Objects are hierarchical, so programs nest; parts repeat, so programs loop; joints have limits and parts have constraints, so programs take parameters and assertions. LLM agents have recently become excellent at exactly this: they can write a program, run it, read the error, and try again, with enough reliability to be reshaping the software industry. If physical structure can be expressed as code, then systems that are good at writing code may also be good at building models of objects and scenes [\u003ca href=\"#bib.bib100\"\u003e113\u003c/a\u003e, \u003ca href=\"#bib.bib101\"\u003e76\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px4.p2.1\"\u003e\u003c/span\u003eThat competence rests on a fundamental property of code itself: it runs and can be validated. A program compiles or it does not, passes its tests or it does not, and this automatic check is what makes coding something an agent can be trained to do well. The property carries over when the program describes an object rather than a piece of software. Such a program can be executed, rendered, and simulated, and its output compared against the image it was meant to explain or the motion the object is meant to have. A proposed structure can therefore be corrected rather than merely produced. Agents already write code that produces articulated 3D assets across hundreds of categories [\u003ca href=\"#bib.bib100\"\u003e113\u003c/a\u003e], and code that drives robots through manipulation tasks, improving as execution feedback and visual comparison are returned to them [\u003ca href=\"#bib.bib102\"\u003e29\u003c/a\u003e]. How far the idea extends is open. Present-day agents lean heavily on the abstractions handed to them and on a language model’s prior knowledge of how everyday objects are built and how they work, and they degrade as those priors are withdrawn [\u003ca href=\"#bib.bib102\"\u003e29\u003c/a\u003e]. Whether such abstractions can instead be extracted from what is being observed, rather than what is supplied in advance, seems to us the question that matters most.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS8.SSS0.Px4.p1.1\"\u003e\u003c/span\u003eMuch of the structure described above can be written as a program. Objects are hierarchical, so programs nest; parts repeat, so programs loop; joints have limits and parts have constraints, so programs take parameters and assertions. LLM agents have recently become excellent at exactly this: they can write a program, run it, read the error, and try again, with enough reliability to be reshaping the software industry. If physical structure can be expressed as code, then systems that are good at writing code may also be good at building models of objects and scenes [[113](#bib.bib100), [76](#bib.bib101)].\n\n\u003cspan id=\"S2.SS8.SSS0.Px4.p2.1\"\u003e\u003c/span\u003eThat competence rests on a fundamental property of code itself: it runs and can be validated. A program compiles or it does not, passes its tests or it does not, and this automatic check is what makes coding something an agent can be trained to do well. The property carries over when the program describes an object rather than a piece of software. Such a program can be executed, rendered, and simulated, and its output compared against the image it was meant to explain or the motion the object is meant to have. A proposed structure can therefore be corrected rather than merely produced. Agents already write code that produces articulated 3D assets across hundreds of categories [[113](#bib.bib100)], and code that drives robots through manipulation tasks, improving as execution feedback and visual comparison are returned to them [[29](#bib.bib102)]. How far the idea extends is open. Present-day agents lean heavily on the abstractions handed to them and on a language model’s prior knowledge of how everyday objects are built and how they work, and they degrade as those priors are withdrawn [[29](#bib.bib102)]. Whether such abstractions can instead be extracted from what is being observed, rather than what is supplied in advance, seems to us the question that matters most.","sourceFormat":"markdown"},"note:sha256:f3c0a6c4e844386c29d5a1e8d341cbb7ee21ba4e0a900114ce13b41fa3fbca5f":{"html":"\u003cp\u003eIn this section, I will outline some thoughts on visual intelligence informed by work from our group. I will frame them as “bets”; some may turn out to be wrong, while some may viewed as obvious. Their intention is to spur (hopefully productive) discussion. Much of these thoughts are motivated by intelligence from an embodied robotics perspective.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS4.p2.1\"\u003e\u003c/span\u003e(Visual) intelligence won’t be just visual. Intelligence will be driven by multimodal signal modeling. Perhaps the elephant in the room is the interplay of vision and language, but other sensory modalities include audio, tactile, and proprioceptive sensing. Such sensory signals are particularly relevant from a robotics perspective. One striking fact is that the vast majority of legged robot demonstrations (including humanoids and quadrupeds) are driven by blind policies that do not make use of visual observations, but rather proprioceptive feedback that reports the kinematic state of the robot’s body. One can move around the world, even acrobatically (via backflips), without opening their eyes. Similarly, there are well-known examples of dexterous manipulation that also operate “blindly”; one can fan out and identify keys in their pocket via tactile feedback and no vision. In fact, one comment that I’ve heard in robotic circles is that vision is the least important perceptual signal for robotics. I would argue against this sentiment and advocate for vision from an information theoretic perspective; compared to other sensory modalities, it is quite high dimensional and tends to contain lots of information about the physical world. This is in fact one reason why it seems attractive to ignore for robotics; it is much easier to build lightweight (and low latency) policies that operate on low-dimensional proprioceptive state. Let me conclude this bet by emphasizing some underexplored research directions. The first is truly multimodal learning. For practical reasons, most multimodal models are really single-modal models that have been post-trained via adaptors for additional modalities. It would be interesting to pre-train representations from raw multi-modal signal streams [\u003ca href=\"#bib.bib9\"\u003e81\u003c/a\u003e]. Another direction that I believe is underexplored is tactile perception. While there exists numerous hardware challenges for building scalable tactile sensors, one perspective from which the vision community could immediately engage is through “near-field” vision, where visual perception is used to analyze nearby (and possibly touching) scene structures. A wonderful example of this is the GelSight sensor [\u003ca href=\"#bib.bib8\"\u003e105\u003c/a\u003e], which reframes tactile sensing as a photometric stereo reconstruction task. Another widely-used example of this are wrist-mounted egocentric cameras, which could be a rich source for understanding the nearby visual world [\u003ca href=\"#bib.bib7\"\u003e14\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS4.p3.1\"\u003e\u003c/span\u003e(Visual) intelligence will be generative. Here, I subscribe to Hinton’s view that “to recognize shapes, first learn to generate images” [\u003ca href=\"#bib.bib6\"\u003e42\u003c/a\u003e], which itself can be traced back to analysis-by-synthesis roots from pattern recognition [\u003ca href=\"#bib.bib5\"\u003e36\u003c/a\u003e, \u003ca href=\"#bib.bib4\"\u003e67\u003c/a\u003e]. To me, the most shocking and impressive innovation in recent years has been the generative modeling of images and videos. While similar image generation results were arguably already demonstrated with generative adversarial networks (GANs), contemporary diffusion and flow models seem to be a step change, particularly for video. I tend to view generative modeling as the natural evolution and culmination of self-supervised learning. Impressive examples include Veo3 and NanoBanana, pointing to the emergent knowledge that can be gleaned via simple pixel supervision. My bet is that generative models will “take-over” representation learning, obviating the need for explicit representation learning in embedded spaces popularized by influential approaches such as DINO and JEPA. Generative models are continually improving with more data and scale, driven by enormous industry investment and support. Indeed, there is a general sense that generative model development requires resources that academia can’t provide. Perhaps surprisingly, this also seems to be the case for all but a few players in industry. As such, efficiency is a necessary cornerstone for innovation, which is described further below. That said, I would like to point out some underexplored technical challenges. Open questions include architectures for multimodal generation; there is a growing body of work on unified models for generating text and images, but given the motivation above, I believe the field should explore generation of multi-sensory signals. One perspective is that of multi-view learning; while learning from a single modality might be enough to understand the true physical world with enough data and scale, different modalities may produce conditionally independent views of the true world, which can be shown to dramatically improve the efficiency of learning [\u003ca href=\"#bib.bib3\"\u003e9\u003c/a\u003e]. A second challenge is that of conditioning. Analysis or reconstruction can be viewed as conditional generation; instead of generating an RGBD image, one may generate depth conditioned on RGB. Current approaches for doing so include denoising modalities from with different noise schedules [\u003ca href=\"#bib.bib2\"\u003e26\u003c/a\u003e]. My hope is that conditional architectures can be made more efficient by learning encoders for the conditioning signal, which itself can be seen as a form of representation learning.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS4.p4.1\"\u003e\u003c/span\u003e(Visual) intelligence will be efficient. It is striking to point out that one of the first efforts for generative video modeling – SORA – was discontinued by OpenAI. The current understanding is that the dollar cost of inference and generation was too high. Serious efforts on video generation seem to be viable only for a few frontier labs, and perhaps out of reach for academia. I believe we need to emphasize the role of efficiency, in both training and inference. My bet is that efficiency can be tackled by re-incorporating “classic” representations including recurrance, 3D, and multi-scale processing back into generative modeling. One open question is that of long-form video generation - that is, generating videos of 1 minute or longer. It is attractive to apply autoregressive sequence modeling, but a key challenge is maintaining consistent memory. At some level, the underlying requirement is a stateful representation that does not grow over time. This is often phrased as recurrence. For example, when generating a walk-through video of a house, one would expect the living room to look consistent when re-entering after 5 minutes. Here, one can view an online 3D reconstruction as a form of a spatial memory state that enforces consistency. While there appears to be a growing body of work the direction of joint reconstruction and generation, a final underexplored space is the role of resolution. High resolution, high-frame rate video generation is simply too expensive for all but a few. One perspective I’ve always appreciated is that we should try to model (and generate) the underlying continuous time-world, irrespective of the sensors that are used to capture it. Or put in other terms, perhaps long video generation is tenable at low resolution and at low frame rates. Such stop-gap solutions are already common in practical workflows, but I would argue that they should be embraced even further, building off of notable work in the past [\u003ca href=\"#bib.bib1\"\u003e79\u003c/a\u003e]. I’ll finally conclude with a more provocative take on data-driven learning; with the right framework, we don’t need that much data. I’ll start with the claim that data diversity, and not scale, is the crucial driver for learning. At some level, I think this is obvious; a million copies of the same training example aren’t useful for learning. But the reason why scale is so attractive is that it is the easiest way to assemble a diverse dataset. But with the right curation of data, I posit that scale is not needed. But this adds the equally hard problem of how to correctly (or automatically) curate datasets. I do not have an insightful answer here, but believe the right framing of the problem is that of reinforcement learning (RL). When compared to other machine learning formulations such as supervised learning or generative modeling, it appears to be the only one that places the responsibility of data collection on the learner. This feels like the right direction! I hope the vision community will embrace it as has robotics and natural language.\u003c/p\u003e\n","kind":"html","rawMarkdown":"In this section, I will outline some thoughts on visual intelligence informed by work from our group. I will frame them as “bets”; some may turn out to be wrong, while some may viewed as obvious. Their intention is to spur (hopefully productive) discussion. Much of these thoughts are motivated by intelligence from an embodied robotics perspective.\n\n\u003cspan id=\"S2.SS4.p2.1\"\u003e\u003c/span\u003e(Visual) intelligence won’t be just visual. Intelligence will be driven by multimodal signal modeling. Perhaps the elephant in the room is the interplay of vision and language, but other sensory modalities include audio, tactile, and proprioceptive sensing. Such sensory signals are particularly relevant from a robotics perspective. One striking fact is that the vast majority of legged robot demonstrations (including humanoids and quadrupeds) are driven by blind policies that do not make use of visual observations, but rather proprioceptive feedback that reports the kinematic state of the robot’s body. One can move around the world, even acrobatically (via backflips), without opening their eyes. Similarly, there are well-known examples of dexterous manipulation that also operate “blindly”; one can fan out and identify keys in their pocket via tactile feedback and no vision. In fact, one comment that I’ve heard in robotic circles is that vision is the least important perceptual signal for robotics. I would argue against this sentiment and advocate for vision from an information theoretic perspective; compared to other sensory modalities, it is quite high dimensional and tends to contain lots of information about the physical world. This is in fact one reason why it seems attractive to ignore for robotics; it is much easier to build lightweight (and low latency) policies that operate on low-dimensional proprioceptive state. Let me conclude this bet by emphasizing some underexplored pies of the same training example aren’t useful for learning. But the reason why scale is so attractive is that it is the easiest way to assemble a diverse dataset. But with the right curation of data, I posit that scale is not needed. But this adds the equally hard problem of how to correctly (or automatically) curate datasets. I do not have an insightful answer here, but believe the right framing of the problem is that of reinforcement learning (RL). When compared to other machine learning formulations such as supervised learning or generative modeling, it appears to be the only one that places the responsibility of data collection on the learner. This feels like the right direction! I hope the vision community will embrace it as has robotics and natural language.","sourceFormat":"markdown"}},"sourceRevision":"sha256:a2612958e0fd31abcc664f195568c91d529a6d537d717da54e0b13c6c9bfa4d2"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=e}}function i(e,t){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${e}": ${t}`)}function r(e){const t=String(e||"").normalize("NFC").trim().replace(/\\/g,"/");t||i(t,"empty"),t.includes("\0")&&i(t,"nul_byte"),t.startsWith("/")&&i(t,"absolute"),/^[A-Za-z]:/.test(t)&&i(t,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*:/.test(t)&&i(t,"url_scheme"),t.endsWith("/")&&i(t,"directory");const n=t.split("/");return n.some(e=>!e||"."===e||".."===e)&&i(t,"unsafe_segment"),n.join("/")}function a(e){if(null===e||"string"==typeof e||"boolean"==typeof e)return JSON.stringify(e);if("number"==typeof e){if(!Number.isFinite(e))throw new n("unsupport
