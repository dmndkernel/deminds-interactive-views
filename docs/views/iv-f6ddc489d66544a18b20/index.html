solve new cases without explicit retraining. In other words, if a model captures the appearance and dynamics of the world sufficiently well, visual in-context learning may make it easier to elicit new capabilities without parameter updates. Even then, a world model is necessary but not sufficient. Intelligence also requires the ability to use that model under new goals: to infer tasks, choose relevant abstractions, generate counterfactuals, adapt to new observations, and act or respond appropriately.\n\nOur central hypothesis is that visual intelligence may emerge through the convergence of three complementary learning objectives: sequential prediction, open-ended generation, and reconstruction. These correspond to three fundamental operations of intelligence. Sequential prediction anticipates what comes next. Open-ended generation explores what could exist. Reconstruction infers hidden structure from incomplete observations. Individually, each may produce powerful models. Together, they may define a path from vision foundation models to visual intelligence, and eventually to general intelligence.\n\nAutoregressive visual learning may become the visual counterpart of GPT. In language, next-token prediction appears simple, but successful prediction requires a model to capture grammar, semantics, facts, discourse, reasoning patterns, and task structure. In vision, predicting the next visual state may require an even richer set of latent concepts. Given an image, video, or embodied observation, the model must infer objects, geometry, motion, occlusion, physical constraints, camera movement, agent behaviour, temporal causality, and uncertainty. To predict coherently is not simply to extrapolate pixels; it is to infer the hidden structure that makes the next observation plausible. If a model can predict future visual states across diverse environments and long horizons, it is being forced to learn how the world evolves. This pressure is a natural route toward visual world modeling: the model must learn from observations, infer their structure, and anticipate what should follow.\n\nGenerative learning is learning to imagine. Generation can impose broader modelling demands than recognition, because recognition often succeeds by detecting discriminative cues, whereas generation requires a model to represent what could exist. A high-quality generative model must learn appearance, geometry, material, lighting, motion, interaction, and plausibility. If such a model can generate high-fidelity images, videos, 3D scenes, and possible futures of the physical world, it becomes more than a content generator. It may provide a basis for an internal simulator, provided that it captures physical and temporal structure rather than appearance alone. A visual agent that can imagine can continue learning inside its own generated possibilities: it can create counterfactuals, test hypotheses, simulate consequences, and refine its understanding before acting. In this sense, imagination is not decoration. It is a mechanism for learning, understanding, and thinking.\n\nReconstruction provides a direct route to learning hidden structure from incomplete observations. Super-resolution, image restoration, inverse rendering, depth estimation, multi-view reconstruction, 3D reconstruction, and 4D dynamic reconstruction all require the model to recover hidden causes from incomplete observations. Among these, scalable 3D reconstruction is especially important. A system that can reconstruct the world accurately from images on the fly must acquire notions of space, scale, correspondence, surfaces, objects, motion, and physical consistency. Such a system may also learn to detect anomalies, infer invisible structure, and understand why some observations are physically plausible while others are not. If reconstruction becomes dramatically stronger, it may no longer be merely a recovery task. It may become a way of recovering regularities of the physical world from visual evidence.\n\nThe role of visual intelligence in the journey toward AGI is therefore not to replace language, but to provide a grounded and potentially independent path. Language-first AI has demonstrated that broad capabilities can emerge from simple objectives at scale. Vision-first AI should now ask the analogous question: what emerges when models learn from visual experience at scale? The early signs are already visible in systems related to video understanding, geometry understanding, physical understanding, embodied intelligence, language alignment, and egocentric perception. These should not be viewed as isolated demos, but as early coordinates of a larger map from visual foundation models to visual intelligence and from visual intelligence to general intelligence.\n\n\u003cspan id=\"S3\"\u003e\u003c/span\u003e\n\n## 3 Summary and Discussion\n\n\u003cspan id=\"S3.SS1\"\u003e\u003c/span\u003e\n\n### 3.1 Summary of Perspectives\n\nThe perspectives presented in this paper approach visual general intelligence (VGI) from complementary directions. Table [1](#S3.T1) provides a concise summary of their central positions.\n\n\u003cspan id=\"S3.T1\"\u003e\u003c/span\u003e\n\nTable 1: A concise summary of the perspectives on visual general intelligence presented in this paper.\n\nTaken as a whole, the positions can be broadly grouped into the following directions: scaling and generative modeling; creativity, prediction, imagination, and reconstruction; continual and lifelong learning; persistent 3D and spatial world representations; embodiment, active perception, and action; multimodal learning and computational efficiency; scientific discovery and generalization to unfamiliar environments; the recovery of compositional physical structure; and forms of visual intelligence that are not organized primarily around language.\n\nSeveral contributions assign a central role to generative learning. Geirhos argues that generative video models trained on web-scale visual data can acquire general-purpose capabilities because generation requires a model to account for substantially more of the visual world than task-specific recognition (Section [2.1](#S2.SS1)). Raghunathan extends generation beyond fidelity toward creativity, requiring coherent, structurally diverse, original, and useful outputs (Section [2.2](#S2.SS2)). Ramanan et al. view generation as a possible culmination of self-supervised representation learning, while emphasizing multimodality and efficiency (Section [2.4](#S2.SS4)). Du uses generative world models for robust perception and visual generation as an interface to action (Section [2.7](#S2.SS7)). Kataoka et al. treat generation as imagination and combine it with autoregressive prediction and reconstruction-based structural understanding (Section [2.10](#S2.SS10)).\n\nShangzhe Wu \u0026 Jiajun Wu provide a complementary qualification to this emphasis on generation (Section [2.8](#S2.SS8)). They argue that predicting pixels or producing photorealistic outputs does not by itself demonstrate an understanding of the physical world. Visual intelligence should recover the entities, intrinsic and extrinsic properties, relations, and dynamics that generated an observation, so that the resulting representation can support interventions, simulation, verification, and action.\n\nOther contributions emphasize how visual knowledge should be acquired, maintained, and used over time. Asano argues that a visually intelligent system should develop throughout its visual lifetime, rather than remain fixed after pre-training (Section [2.3](#S2.SS3)). Davison emphasizes persistent but adaptable spatial representations, closed-loop state estimation, and the computational structure needed for real-time Spatial AI (Section [2.6](#S2.SS6)). Du connects persistent scene representations to action, active exploration, and continual adaptation. Liu further argues that a vision-native system must determine when to look, where to look, and how much visual detail is needed, rather than passively processing a predetermined visual input (Section [2.9](#S2.SS9)).\n\nThe scope of visual intelligence also extends beyond ordinary visual recognition. Ramanan et al. emphasize raw multimodal experience, including touch, audio, and proprioception. Fouhey’s scientific setting emphasizes validation without conventional ground truth, the handling of sensor systematics and units, and integration with domain knowledge (Section [2.5](#S2.SS5)). Raghunathan’s account of creativity similarly asks whether a system can construct possibilities that were not explicitly present in its training experience.\n\nThese perspectives do not converge on a single model, learning objective, representation, or definition of VGI. They nevertheless share an important premise: visual general intelligence should not be understood simply as a more accurate image recognition system or as a visual encoder attached to a language model. Instead, VGI concerns intelligence that emerges from visual experience and enables a system to discover and verify the structure of the world, maintain and update knowledge over time, predict possible futures, imagine alternatives, reconstruct unobserved structure, and adapt its behavior to unfamiliar situations. Such knowledge should ultimately be tested not only by whether a system can describe or reproduce an observation, but also by whether its representation can be edited, simulated, and used to support reliable action.\n\nThe resulting research agenda therefore extends beyond model scale alone. A central challenge is to determine how generation, compositional physical structure, memory, spatial understanding, embodiment, active information acquisition, multimodal experience, and continual learning should be combined within a general visual system. The diversity of positions in this paper suggests that these components should not be treated as isolated capabilities, but as complementary parts of a broader pathway from visual foundation models to visual intelligence and, potentially, to general intelligence.\n\n\u003cspan id=\"S3.SS2\"\u003e\u003c/span\u003e\n\n### 3.2 Discussion\n\n\u003cspan id=\"S3.SS2.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### Can intelligence emerge from visual experience?\n\nBefore asking whether visual intelligence can lead to general intelligence, a more immediate question is whether intelligence can emerge from visual experience itself. Current AI systems often treat vision as an input while assigning abstraction and reasoning primarily to language. Several perspectives in this paper challenge this division. Asano argues that objects, depth, motion, persistence, and affordance can be learned before they are named. Liu similarly emphasizes that grounded, spatial, and action-oriented experience is not naturally reducible to text tokens. Shangzhe Wu \u0026 Jiajun Wu add that visual observations contain physical properties and dynamics that may never have been described in language. Together with Kataoka et al., these positions leave open a grounded and potentially independent path from visual experience to intelligence.\n\nThis does not make language or other modalities unnecessary. Ramanan emphasizes audio, touch, and proprioception, while Du connects vision to action and physical feedback. The open question is whether visual grounding should precede multimodal integration or emerge jointly with it. In either case, vision should not be reduced to an input channel for an otherwise language-centered system.\n\n\u003cspan id=\"S3.SS2.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### Scaling, generation, and physical structure.\n\nGeirhos argues that generative models trained on large-scale video data may acquire generalized capabilities across a range of downstream tasks that are not specified individually during training. Other positions similarly regard these large-scale generative models as a major milestone in different contexts: Ramanan connects them to representation learning, Du to world modeling and action, Raghunathan to creativity, and Kataoka et al. to imagination.\n\nHowever, scaling the volume of training data alone is not sufficient. Liu and Ramanan emphasize the importance of collecting diverse visual data, rather than simply exposing models to vast quantities of data in similar patterns. Meanwhile, Fouhey highlights the need for techniques capable of capturing scientific phenomena only available in a small amount of data. Shangzhe Wu \u0026 Jiajun Wu further distinguish photorealistic appearance from physical understanding. A model may generate a visually plausible event without understanding the underlying physical properties that govern it. We may therefore need to investigate representations of physical structure that can be inspected, edited, simulated, and verified.\n\n\u003cspan id=\"S3.SS2.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### Continual learning and evaluation.\n\nA system trained once and then frozen cannot accommodate an open and changing world. Asano defines VGI as a system that develops throughout its visual lifetime, while Du argues that an embodied system must collect informative experience and continue adapting after deployment. Davison’s persistent spatial representations and Ramanan’s stateful long-horizon models highlight the need for compact memory that can be accessed and revised. Liu and Du further emphasize that an intelligent system should actively decide what to observe and use action to resolve uncertainty.\n\nThese requirements also change how VGI should be evaluated. Fouhey’s scientific setting emphasizes validation without conventional ground truth and the handling of sensor systematics and units; Raghunathan adds coherence, diversity, and originality; Davison and Du require persistent spatial understanding and reliable action; and Shangzhe Wu \u0026 Jiajun Wu ask whether recovered structure supports intervention and simulation rather than reconstruction alone. VGI benchmarks should therefore evaluate transfer, continual adaptation, active observation, persistent world knowledge, creativity, physical consistency, and efficiency. No single benchmark is likely to measure all of these dimensions, but isolated static tasks are unlikely to be sufficient.\n\n\u003cspan id=\"S3.SS2.SSS0.Px4\"\u003e\u003c/span\u003e\n\n#### From visual functions to visual intelligence.\n\nComputer vision has progressed by decomposing visual understanding into tasks such as recognition, reconstruction, generation, mapping, and action prediction. This remains useful, but it also encourages each task to be addressed by a separately trained system. A general visual system would instead need to operate across tasks, timescales, environments, representations, and potentially sensory modalities. It would preserve and revise knowledge, determine which observations matter, and connect perception to prediction and action.\n\nIf vision foundation models acquire these properties, recognition, reconstruction, generation, spatial mapping, and action may become different ways of accessing and testing knowledge held by the same system. The transition from visual foundation models to visual intelligence would therefore mark a new phase of computer vision: from constructing increasingly capable visual functions to investigating how intelligence itself may emerge from visual experience.\n\n\u003cspan id=\"S4\"\u003e\u003c/span\u003e\n\n## 4 Conclusion\n\nThis paper has examined visual general intelligence as a research agenda concerned with two related questions: how intelligence may emerge from visual experience, and how such visual intelligence may provide a path toward general intelligence. The perspectives collected here do not support a single definition, architecture, learning objective, or route to VGI. Rather than forcing these positions into one unified forecast, this paper presents several plausible and complementary conclusions. Visual intelligence may emerge through large-scale generative learning, prediction, reconstruction, persistent spatial memory, continual learning, embodiment, active perception, multimodal experience, or combinations of these mechanisms that have not yet been fully explored.\n\nThis plurality is itself one of the central conclusions of the paper. VGI should not be defined prematurely as a particular model or capability. Nor should it be reduced to a stronger image classifier, a video generator, a world model, or a visual encoder attached to a language model. The positions presented here instead describe visual intelligence as a broader capacity to acquire knowledge from visual experience, discover and maintain the structure of the world, imagine and evaluate possible alternatives, adapt to new observations, and use visual knowledge for prediction, discovery, and action.\n\nExisting systems demonstrate important components of visual intelligence, but not yet their integration into a general, continually adaptable visual system. Current models nevertheless provide partial and increasingly suggestive evidence. Generative video models exhibit unexpected cross-task capabilities; reconstruction models recover increasingly rich geometric and physical structure; spatial systems maintain persistent representations over time; creative models construct multiple plausible alternatives; and embodied agents improve their perception and behavior through interaction. These capabilities remain fragmented, computationally expensive, limited in temporal extent, or dependent on carefully selected data and training conditions. However, taken together, they may represent early coordinates of a broader transition from visual functions to visual intelligence.\n\nIt may therefore be premature to ask whether VGI has already become a path to general intelligence. The more immediate milestone is to determine whether intelligence can first be observed to emerge from visual experience itself. Evidence for this transition should extend beyond improved performance on a fixed collection of visual tasks. It should include transferable capabilities, persistent and revisable world knowledge, creative and counterfactual reasoning, active information seeking, continual adaptation, spatial and physical consistency, and reliable action in unfamiliar situations.\n\nComputer vision may now be entering a new phase in which its central object of study expands from individual visual functions to the emergence of visual intelligence. The purpose of this paper is not to declare which proposed path will prevail, but to make their assumptions, relationships, and open questions visible. The decisive principle may come from one of the directions discussed here, from their convergence, or from an approach that has not yet been imagined. The question left to the field is therefore not only how to build more capable visual models, but what evidence would convince us that intelligence has begun to arise from vision – and how that intelligence might eventually contribute to general intelligence.\n\n## Acknowledgments\n\nThis work was conducted by AIST researchers under FRONTia, a Japanese national program led by the Ministry of Economy, Trade and Industry of Japan (METI) and the New Energy and Industrial Technology Development Organization (NEDO), aimed at developing a domestic multimodal foundation model for AI robots and physical AI. This work was supported by Japan Science and Technology Agency (JST) as part of Adopting Sustainable Partnerships for Innovative Research Ecosystem (ASPIRE), Grant Number JPMJAP2518. We would also like to thank the invited speakers of the CVPR 2026 Workshop on Visual General Intelligence (VGI) for their insightful talks and discussions that helped motivate this white paper. In particular, we are grateful to Matt Deitke, Alexei A. Efros, Kristen Grauman, Alex Kendall, and Andrea Vedaldi, who contributed to the workshop. Their perspectives helped clarify the diversity of open questions surrounding n, Y. Li, H. Poon, and M. Chen (2026) Video models can reason with verifiable rewards. arXiv preprint arXiv:2605.15458. Cited by:\u0026nbsp;\u003ca href=\"#S2.SS1.SSS0.Px3.p1.1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e§2.1\u003c/a\u003e.\u003c/span\u003e","payload":{"lines":"157,158","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eReferences\u003c/span\u003e","payload":{"fold":1,"lines":"42,43","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eVisual General Intelligence: A White Paper\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"Visual General Intelligence: A White Paper\" data-note-id=\"note:sha256:49c9f0618642300968a93e6e9ddf79e72579b67566018238ba0aa1ff4b052b22\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"visual-general-intelligence-a-white-paper\"\u003eVisual General Intelligence: A White Paper\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003eAuthors: Hirokatsu Kataoka, Yoshihiro Fukuhara, Yonglong Tian, Shangzhe Wu, Oishi Deb, Ryousuke Yamada, Christian Rupprecht, Jianyuan Wang, Kohsuke Ide, Koichi Namekata, Xianzheng Ma, Yiming Chen, Robert Geirhos, Aditi Raghunathan, Yuki M. Asano, Deva Ramanan, David Fouhey, Andrew J. Davison, Yilun Du, Jiajun Wu, Zhuang Liu\u003cbr\u003eAffiliations: National Institute of Advanced Industrial Science and Technology (AIST) · Visual Geometry Group (VGG), University of Oxford · CADDi · OpenAI · University of Cambridge · University of Technology Nuremberg · University of Tsukuba · Google DeepMind · Carnegie Mellon University · New York University · Imperial College London · Harvard University · Stanford University · Princeton University\u003cbr\u003e\u003ca href=\"https://arxiv.org/html/2608.25924\" target=\"_blank\" rel=\"noopener noreferrer\"\u003earXiv:2608.25924v1\u003c/a\u003e · cs.CV · 2026-08-26\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"abstract\"\u003eAbstract\u003c/h2\u003e\n\u003cp\u003eThis paper reconsiders intelligence from a vision-centered perspective and examines whether intelligence emerging from visual experience and learning may provide a pathway toward AGI. In the language domain, beginning with the introduction of the Transformer architecture, the GPT series has demonstrated transfer to unseen tasks through autoregressive language modeling on web-scale text combined with aggressive scaling. This raises a natural question, namely, what capabilities and forms of intelligence can emerge from visual modalities such as images, videos, and geometry? In this paper, we discuss whether visual intelligence can serve as a pathway toward AGI, referred to in this paper as visual general intelligence (VGI), by bringing together contributors from diverse standpoints and affiliations. Our aim is not to offer a single definition of visual intelligence, but to clarify the principles that computer vision should pursue in the AGI era, the visual input modalities, the benchmarks, the learning paradigms, and the relationship between vision, when taken as the core, and other modalities such as language.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch2 id=\"1-introduction\"\u003e1 Introduction\u003c/h2\u003e\n\u003cp\u003e\u003cspan id=\"S1.p1.1\"\u003e\u003c/span\u003eSince the early discussions of artificial intelligence (AI), including those surrounding Alan Turing and cybernetics, intelligence has often been discussed as the ability to acquire representations from environmental signals, capture their underlying regularities, generalize to unseen situations, and connect such representations to prediction or action [\u003ca href=\"#bib.bib12\"\u003e82\u003c/a\u003e, \u003ca href=\"#bib.bib13\"\u003e94\u003c/a\u003e, \u003ca href=\"#bib.bib10\"\u003e49\u003c/a\u003e, \u003ca href=\"#bib.bib11\"\u003e35\u003c/a\u003e]. At the same time, it is not obvious that intelligence should be reduced to language.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p2.1\"\u003e\u003c/span\u003eIn the history of Earth, advanced visual systems, including camera-type eyes and compound eyes, date back to the Cambrian period roughly half a billion years ago, and the rapid development of vision has long been discussed as a possible driver of major changes in biological interactions [\u003ca href=\"#bib.bib14\"\u003e70\u003c/a\u003e, \u003ca href=\"#bib.bib15\"\u003e111\u003c/a\u003e]. By contrast, advanced human language, writing systems, and individual languages such as English are all extremely recent phenomena on the timescale of life’s history [\u003ca href=\"#bib.bib16\"\u003e27\u003c/a\u003e, \u003ca href=\"#bib.bib17\"\u003e15\u003c/a\u003e, \u003ca href=\"#bib.bib18\"\u003e5\u003c/a\u003e]. This contrast suggests that vision may be more than a sensor or input modality; the visual modality may instead constitute a foundational intelligent function for capturing the structure of the world.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p3.1\"\u003e\u003c/span\u003eRecent progress in large language models (LLMs) provides an important reference point for thinking about the emergence of intelligence. Through the lineage of statistical language models, neural probabilistic language models [\u003ca href=\"#bib.bib19\"\u003e7\u003c/a\u003e], distributed representations such as word2vec [\u003ca href=\"#bib.bib21\"\u003e66\u003c/a\u003e], sequence-to-sequence models [\u003ca href=\"#bib.bib22\"\u003e77\u003c/a\u003e], attention [\u003ca href=\"#bib.bib23\"\u003e3\u003c/a\u003e], Transformers [\u003ca href=\"#bib.bib24\"\u003e84\u003c/a\u003e], BERT [\u003ca href=\"#bib.bib25\"\u003e19\u003c/a\u003e], and GPT [\u003ca href=\"#bib.bib26\"\u003e73\u003c/a\u003e], language processing gradually shifted from hand-designed features and task-specific pipelines toward representation learning based on large-scale data and general-purpose learning objectives. GPT-3 was especially striking in that, without images, audio, or embodied interaction, it showed that scaling a simple autoregressive self-supervised objective (next-token prediction) over web-scale text corpora could give rise to broad capabilities such as in-context learning and few-shot adaptation [\u003ca href=\"#bib.bib27\"\u003e11\u003c/a\u003e]. Wei et al. formalized such scale-dependent qualitative capability gains as “emergent abilities of large language models” [\u003ca href=\"#bib.bib28\"\u003e92\u003c/a\u003e]. This also resonates with Sutton’s “The Bitter Lesson” [\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e]: in the long run, methods that scale with computation, data, learning, and search tend to dominate manually engineered knowledge and rules. Although the success of language models cannot simply be transferred to visual models, the fact that unexpected abilities can arise from a simple objective, large-scale experience, and scaling is a crucial clue for visual intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p4.1\"\u003e\u003c/span\u003eComputer vision has also undergone major transformations. Before the era of deep neural networks, the field accumulated rich knowledge based on geometry, statistics, and optimization, including edge and corner detection, local features such as SIFT, stereo, optical flow, structure from motion, and object detection. The success of AlexNet at ILSVRC 2012 marked a turning point, ushering in the deep learning era and leading to dramatic progress in visual recognition [\u003ca href=\"#bib.bib30\"\u003e47\u003c/a\u003e, \u003ca href=\"#bib.bib31\"\u003e74\u003c/a\u003e]. More recently, vision research has expanded beyond supervised learning toward self-supervised learning, image-text contrastive learning, Transformers, image and video generation, 3D/4D reconstruction, robotics, and embodied AI. In this context, a natural question is whether emergent abilities analogous to those observed in language models may also appear when visual models are scaled up and exposed to increasingly diverse visual experiences, or whether vision requires principles specific to visual intelligence.\u003c/p\u003e\n\u003cp\u003eThere is no need to settle this question with a single answer at this stage. One viewpoint is that scaling single-modality, single-objective visual learning to its limit may be sufficient; another is that integrating visual modalities such as video, geometry, and spacetime, or visual tasks such as generation, restoration, and reconstruction, may be essential. What matters is not to make the scaling of vision foundation models (VFMs) an end in itself, but to ask under what learning strategies, data structures, model architectures, and evaluation settings visual representations can generalize to unknown tasks and environments. Current VFMs are increasingly applied to classification, dense prediction, correspondence estimation, and 3D reconstruction, yet there remains substantial room to disentangle whether a capability arises from training data, task design, decoders, prompts, model size, or their combinations. This unresolved nature should be viewed not as a limitation, but as a starting point for asking whether intelligence emerging from vision can evolve into general intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p6.1\"\u003e\u003c/span\u003eRecent progress in VLMs and MLLMs is also central to this discussion. CLIP maps images and text into a shared space through contrastive learning, enabling zero-shot recognition mediated by natural language [\u003ca href=\"#bib.bib32\"\u003e72\u003c/a\u003e]. MLLMs such as Flamingo [\u003ca href=\"#bib.bib33\"\u003e2\u003c/a\u003e], BLIP/BLIP-2 [\u003ca href=\"#bib.bib34\"\u003e51\u003c/a\u003e, \u003ca href=\"#bib.bib35\"\u003e50\u003c/a\u003e], and LLaVA [\u003ca href=\"#bib.bib36\"\u003e56\u003c/a\u003e] connect image features from visual encoders to LLMs as token sequences or intermediate representations, enabling visual question answering, captioning, dialogue, and instruction following. These models provide powerful frameworks for connecting vision and language and represent one of the central directions for vision research toward the AGI era. At the same time, because image features, image-text pairs, instruction tuning, and reasoning processes are deeply intertwined, it remains difficult to isolate which capabilities originate from visual experience itself and which emerge from the language model. Rather than rejecting MLLMs, this paper keeps multiple viewpoints open, including vision-only, vision-first, language-mediated, and multimodal perspectives, and discusses visual intelligence from several angles.\u003c/p\u003e\n\u003cp\u003eVisual general intelligence (VGI), as discussed here, is not a rejection of language. Rather, it is a research agenda that asks what vision can understand, predict, and generalize, either before being coupled with language or while interacting with it. Visual data contains dense, observable, and measurable structures. Given such structures, should models predict what will be seen next, generate unobserved regions, reconstruct 3D/4D structures, or integrate multiple objectives to acquire general visual representations? We view visual intelligence research as an attempt to revisit these vision-specific questions through diverse forms of visual learning.\u003c/p\u003e\n\u003cp\u003eIn the AGI era, computer vision has an exceptionally important role to play. Precisely because language models have reshaped the landscape of AI, the computer vision community can now revisit a fundamental question: what kinds of generality can arise from visual learning? The diverse expertise accumulated across visual modalities and tasks offers an unusually rich foundation for exploring VGI. We are entering a creative phase in which the community can proactively design what should be measured beyond benchmark accuracy and incremental improvements, including physical-world applications, adaptation to unknown environments, and societal impact.\u003c/p\u003e\n\u003cp\u003eVGI, namely intelligence emerging from visual modalities and tasks, is not yet a fully established concept. Precisely for this reason, there is great value in bringing together diverse hypotheses rooted in each researcher’s expertise and experience, and in openly, optimistically, and boldly exploring possible pathways from vision to general intelligence from the perspective of the computer vision community. This paper aims to serve as a starting point for such exploration and to broaden the role of vision research in the AGI era as broadly as possible.\u003cspan id=\"footnote1\"\u003e\u003c/span\u003e11 1 This paper originates from discussions at the CVPR 2026 VGI Workshop [\u003ca href=\"#bib.bib37\"\u003e85\u003c/a\u003e]. The views presented here are not intended to provide a single definition of VGI, but rather to summarize multiple perspectives that open diverse possibilities for vision research toward general intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch2 id=\"2-perspectives-on-visual-general-intelligence\"\u003e2 Perspectives on Visual General Intelligence\u003c/h2\u003e\n\u003cp\u003eThe path from visual intelligence to general intelligence is unlikely to be captured by a single definition, model, or benchmark. This section brings together diverse research perspectives to help clarify the open questions that the computer vision community may explore.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"21-video-models-are-visual-foundation-models-robert-geirhos\"\u003e2.1 Video models are visual foundation models (Robert Geirhos)\u003c/h3\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS1.p1.1\"\u003e\u003c/span\u003eIn the context of my research, visual intelligence can be characterized as the ability to solve any visual task, from perception to reasoning, without being explicitly trained on each new task. Just like large language models are now able to solve most language tasks, I believe that the time has finally come for machine vision to undergo a similar transformation from task-specific to general-purpose models. The computer vision community has built outstanding individual and task-specific models to date [\u003ca href=\"#bib.bib51\"\u003e101\u003c/a\u003e, \u003ca href=\"#bib.bib52\"\u003e46\u003c/a\u003e, e.g.], but the field has not yet been unified around a common framework in the same way that LLMs have unified most of natural language processing research. How, then, should we build unified visual foundation models? The foundational primitives that unlocked language intelligence—training large, generative models on web-scale data—apply directly to today’s generative video models. I am convinced that transferring these very principles (large-scale training + generative objective) to video models holds the key to solving visual intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"why-large-models-trained-on-web-scale-data\"\u003eWhy \u003cem\u003elarge models\u003c/em\u003e trained on \u003cem\u003eweb-scale data\u003c/em\u003e?\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eRich Sutton’s bitter lesson [\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e] makes the compelling case that scale has been the single biggest driver of AI progress over the past decades. It is only consequent that LLMs have continued to benefit from larger models and larger, more diverse datasets to date. In a similar vein, there is no reason to believe that video models won’t benefit from scale, on both the architecture and data side.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"why-generative-models\"\u003eWhy \u003cem\u003egenerative\u003c/em\u003e models?\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eMachine learning models love to learn shortcuts—the easiest solutions they can find to solve a given objective [\u003ca href=\"#bib.bib38\"\u003e30\u003c/a\u003e], if only superficially. As a consequence, we need to make the training objective as hard as we can. For example, training classifiers on ImageNet is too easy; they can simply learn to exploit textures [\u003ca href=\"#bib.bib40\"\u003e31\u003c/a\u003e] or the image background [\u003ca href=\"#bib.bib41\"\u003e6\u003c/a\u003e] as predictive features, predicting ‘elephant’ whenever a grey leather-like pattern is detected, or predicting ‘cow’ whenever grass is present. However, training a \u003cem\u003egenerative\u003c/em\u003e model on visual data requires solving a much harder task. Here, the model cannot simply get away with generating grass without the cow, as the generative objective forces the model to get everything right: the object, the background, the textures, the shapes, the lighting and the shadows—lest it be punished by the training objective. It is this intuition that makes me confident that generative models will be able to solve visual intelligence, simply because their training task is hard enough to be meaningful, forcing them to learn much about the world by virtue of prediction.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px3\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"and-finally-why-video-models\"\u003eAnd finally, why \u003cem\u003evideo\u003c/em\u003e models?\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eThere is a principled and a practical argument to support the case of video models as visual foundation models. The principled reason is that video generation is the most general framework for many visual tasks, encompassing still images as a special case [\u003ca href=\"#bib.bib50\"\u003e102\u003c/a\u003e, e.g.]. The practical reason is that in the last two years or so, video models have finally entered the limelight as increasingly capable models, with significant progress happening over the course of months if not days at the moment. In fact, they have become capable enough already to serve as a “version 1.0” of visual foundation models: In our recent work [\u003ca href=\"#bib.bib39\"\u003e93\u003c/a\u003e], we demonstrated that generative video models like Veo 3 exhibit precisely the kind of broad, emergent capabilities that were characteristic of early language foundation models, but in the visual domain instead. Without any task-specific training, the model can perform a wide range of visual tasks simply through image-to-video generation: edge detection, object segmentation, keypoint localization, super-resolution, image editing, style transfer, and even early forms of visual reasoning such as maze solving and graph traversal. Veo 3, a video model trained for entertainment, happens to be a visual foundation model. Subsequent works confirmed and extended these findings in other models too, including open-source models [\u003ca href=\"#bib.bib45\"\u003e86\u003c/a\u003e, \u003ca href=\"#bib.bib49\"\u003e57\u003c/a\u003e, \u003ca href=\"#bib.bib48\"\u003e69\u003c/a\u003e, \u003ca href=\"#bib.bib47\"\u003e45\u003c/a\u003e, \u003ca href=\"#bib.bib46\"\u003e115\u003c/a\u003e, \u003ca href=\"#bib.bib42\"\u003e110\u003c/a\u003e, \u003ca href=\"#bib.bib44\"\u003e37\u003c/a\u003e, \u003ca href=\"#bib.bib43\"\u003e80\u003c/a\u003e]. Just like language foundation models quickly progressed from GPT-2 over GPT-3 to, eventually, ChatGPT and modern LLMs, video models are likely to progress towards fully capable visual foundation models as soon as we start building towards this future.\u003c/p\u003e\n\u003cp\u003eIn light of this, I believe that visual general intelligence is achievable by developing video models as visual foundation models, with the exciting possibility of unifying much of today’s fragmented, “each task requires its own model” computer vision community.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"22-creativity-as-a-test-of-visual-general-intelligence-aditi-raghunathan\"\u003e2.2 Creativity as a Test of Visual General Intelligence (Aditi Raghunathan)\u003c/h3\u003e\n\u003cp\u003eIntelligence is not exhausted by tasks with a single correct answer. In open-ended settings, success also depends on finding creative ways to satisfy a request and making fresh connections that were not explicitly encountered before. For visual intelligence, examples include designing an object under functional constraints, proposing distinct plans for a robot, constructing a scientific diagram, or imagining several ways in which a physical scene could evolve. Creativity in such tasks requires outputs that are not only coherent, but also diverse across repeated generations and original relative to the training experience. These capabilities will become increasingly important as visual models are used for scientific discovery, design, novel training data, and test-time exploration.\u003c/p\u003e\n\u003cp\u003eMany creative tasks require a leap of thought: an implicit search-and-plan process that coordinates several interdependent decisions before the observable output is generated. In vision, this hidden plan might specify a scene layout, a 3D structure, a set of object relationships, a physical mechanism, a camera trajectory, or a sequence of actions. It may be only indirectly visible in the final image or video. Producing such an output therefore requires capturing higher-order structure across the generation as a whole, rather than assembling independently plausible local choices.\u003c/p\u003e\n\u003cp\u003eIn prior work, we designed minimal algorithmic tasks that are loose abstractions of open-ended real-world tasks and that make creativity measurable in a controlled setting. Drawing on a cognitive-science taxonomy, we considered two forms of creativity. Combinational creativity identifies unfamiliar connections among familiar elements, as in analogy, wordplay, and the discovery of connections between previously separate ideas. Its visual analogue could involve finding an unexpected but meaningful relationship among familiar objects, scenes, concepts, or physical processes. Exploratory creativity constructs new patterns subject to a collection of rules or constraints, as in designing problems, proteins, mechanisms, or narratives. Its visual analogue could be a new scene, 3D structure, video, mechanism, or action plan that satisfies geometric, physical, semantic, or task-level constraints.\u003c/p\u003e\n\u003cp\u003eIn both cases, the goal is to produce solutions that are coherent, distinct, and not simply reproduced from training examples. We refer to this operational notion as algorithmic creativity. A corresponding evaluation of creative visual intelligence should measure at least three properties. First, each output should be coherent, satisfying the relevant physical, geometric, semantic, temporal, or task constraints. Second, generations should be structurally diverse, representing meaningfully different solutions rather than cosmetic changes in texture, color, wording, or viewpoint. Third, outputs should be original relative to the model’s training experience.\u003c/p\u003e\n\u003cp\u003eOur results suggest that the learning objective matters for acquiring such behavior. On the controlled tasks, multi-token approaches based on teacherless training and diffusion generated more diverse and original solutions than conventional next-token learning. A central issue is global coordination: the latent creative plan is expressed through relationships among several parts of the sequence, and those parts must fit together as a whole. For visual models, this motivates objectives and architectures that can represent a high-level construction and then generate its local details while preserving spatial and temporal consistency.\u003c/p\u003e\n\u003cp\u003eWe also considered where randomness should enter the generation process. Rather than introducing randomness only through output-level temperature sampling, seed-conditioning provides a random input to the model during both training and inference. Different seeds can select different solutions while allowing each solution to remain internally coherent. A visual analogue would use a persistent sample-level latent variable to select a high-level possibility—such as a layout, mechanism, trajectory, or hypothesis—before generating its details. This may encourage diversity among complete plans rather than merely introducing local variation during decoding.\u003c/p\u003e\n\u003cp\u003eCreativity therefore extends the role of generation in visual general intelligence. A visually intelligent system should not only recognize what is present, reconstruct hidden structure, or predict the most likely future. It should also be able to construct multiple plausible alternatives, preserve the internal logic of each, and search for possibilities that are useful and unfamiliar. Visual models should consequently be evaluated not only by fidelity and accuracy, but also by coherence, structural diversity, originality, and utility. The central question is not simply whether a model can imagine, but whether it can imagine differently without losing structure.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS3\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"23-a-learning-system-that-learns-from-one-datum-yuki-m-asano\"\u003e2.3 A learning system that learns from one datum (Yuki M. Asano)\u003c/h3\u003e\n\u003cp\u003eToday’s strongest visual systems are impressive, but they are not general in the way that matters. They are trained once on large, carefully assembled datasets and then deployed as essentially fixed models. They can recognise objects, reconstruct scenes, answer questions about images, or follow textual instructions. Yet they do not build up a coherent understanding of the world through experience, nor do they continue to reorganise that understanding as the world changes. Today, our field knows one “fix” to this: add more data \u0026amp; (re-)train.\u003c/p\u003e\n\u003cp\u003eIn my opinion, a visually generally intelligent system should learn from visual experience as it unfolds: continuously, without labels, without repeated reshuffling of the past, and without assuming that the important tasks are known in advance. If we could build such a system, we could have adaptive, continuously improving models and agents that require the equivalent of one light-bulb of energy for updating weights, not that of a city.\u003c/p\u003e\n\u003cp\u003eThe starting point is vision rather than language. Before an intelligent system can describe the world, it must first discover its structure. It must learn which parts of an observation belong together, which objects persist across viewpoints and interruptions, how the observer itself is moving, what changes independently in the scene, and which regularities remain stable over days, months, or years.\u003c/p\u003e\n\u003cp\u003eThe aim is not simply to train a larger video model. Current video models are powerful and general perceptual modules, but they operate on data that have already been collected, segmented, shuffled, and revisited.22 2 And I also believe it’s a reasonable bet to scale towards a practical definition of VGI with video generative models. To me, Visual General Intelligence instead asks how a system can learn \u003cem\u003eduring its own visual lifetime\u003c/em\u003e. It should know what it has seen before, detect when something genuinely new has happened, decide which parts of itself should change, and retain knowledge that remains useful. This system requires less a continual learning solution, but rather a whole learning system that can work autonomously in an open-ended way. Think of a baby: no goal, no talking, no problem. A somewhat rough mental comparison sketch would be today’s coding agents that can themselves spawn sub-agents—but instead for vision and from scratch and without language.\u003c/p\u003e\n\u003cp\u003eWhat seems obvious is that this does not get solved by simply having a bigger Transformer and current learning paradigms.33 3 Happy to be wrong, I like simplicity. Instead, a plausible artificial visual brain should contain several interacting systems:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e• A perceptual system that turns the current visual stream into objects, regions, surfaces, motion, and semantic features.44 4 How does even one best represent video? Frames are redundant, codec is difficult, object-centric somewhat arbitrary.\u003c/li\u003e\n\u003cli\u003e• A spatial and dynamic world model that maintains hypotheses about geometry, viewpoint, object identity, motion, and causal change. It should distinguish changes caused by the observer from changes caused by the world.\u003c/li\u003e\n\u003cli\u003e• A memory system that stores information at different timescales.\u003c/li\u003e\n\u003cli\u003e• A task and action interface that exposes the learned visual knowledge to downstream systems, including robots, scientific instruments, search tools, and human users.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThese modules need not be hand-designed as rigid symbolic components. They may be neural, differentiable, and jointly trained. But they should have distinct roles, update rules, and timescales. The brain is not one homogeneous block, and an artificial learner that must remain stable while continuing to change is unlikely to be one either.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS3.p8.1\"\u003e\u003c/span\u003eLanguage enters later as an interface to this visual intelligence. It can name concepts, communicate goals, collaborate, and provide occasional supervision. But language should not be the sole organising principle of the visual system. Much of the world’s structure—depth, motion, persistence, containment, contact, and affordance—exists before it is named. A visually intelligent system should therefore be able to learn these regularities without captions and only subsequently connect them to words. Language becomes a way to query, steer [\u003ca href=\"#bib.bib20\"\u003e75\u003c/a\u003e], and teach an already grounded world model, rather than a substitute for one.\u003c/p\u003e\n\u003cp\u003eThe long-term objective is a visual system that grows with experience. It should become more competent, more structured, and more useful the longer it observes the world; without needing to be reset, retrained from scratch, or told in advance everything it will eventually need to understand.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS4\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"24-intelligence-will-be-multimodal-generative-and-efficient-deva-ramanan-et-al\"\u003e2.4 Intelligence will be multimodal, generative, and efficient (Deva Ramanan et al.)\u003c/h3\u003e\n\u003cp\u003eIn this section, I will outline some thoughts on visual intelligence informed by work from our group. I will frame them as “bets”; some may turn out to be wrong, while some may viewed as obvious. Their intention is to spur (hopefully productive) discussion. Much of these thoughts are motivated by intelligence from an embodied robotics perspective.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS4.p2.1\"\u003e\u003c/span\u003e(Visual) intelligence won’t be just visual. Intelligence will be driven by multimodal signal modeling. Perhaps the elephant in the room is the interplay of vision and language, but other sensory modalities include audio, tactile, and proprioceptive sensing. Such sensory signals are particularly relevant from a robotics perspective. One striking fact is that the vast majority of legged robot demonstrations (including humanoids and quadrupeds) are driven by blind policies that do not make use of visual observations, but rather proprioceptive feedback that reports the kinematic state of the robot’s body. One can move around the world, even acrobatically (via backflips), without opening their eyes. Similarly, there are well-known examples of dexterous manipulation that also operate “blindly”; one can fan out and identify keys in their pocket via tactile feedback and no vision. In fact, one comment that I’ve heard in robotic circles is that vision is the least important perceptual signal for robotics. I would argue against this sentiment and advocate for vision from an information theoretic perspective; compared to other sensory modalities, it is quite high dimensional and tends to contain lots of information about the physical world. This is in fact one reason why it seems attractive to ignore for robotics; it is much easier to build lightweight (and low latency) policies that operate on low-dimensional proprioceptive state. Let me conclude this bet by emphasizing some underexplored research directions. The first is truly multimodal learning. For practical reasons, most multimodal models are really single-modal models that have been post-trained via adaptors for additional modalities. It would be interesting to pre-train representations from raw multi-modal signal streams [\u003ca href=\"#bib.bib9\"\u003e81\u003c/a\u003e]. Another direction that I believe is underexplored is tactile perception. While there exists numerous hardware challenges for building scalable tactile sensors, one perspective from which the vision community could immediately engage is through “near-field” vision, where visual perception is used to analyze nearby (and possibly touching) scene structures. A wonderful example of this is the GelSight sensor [\u003ca href=\"#bib.bib8\"\u003e105\u003c/a\u003e], which reframes tactile sensing as a photometric stereo reconstruction task. Another widely-used example of this are wrist-mounted egocentric cameras, which could be a rich source for understanding the nearby visual world [\u003ca href=\"#bib.bib7\"\u003e14\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS4.p3.1\"\u003e\u003c/span\u003e(Visual) intelligence will be generative. Here, I subscribe to Hinton’s view that “to recognize shapes, first learn to generate images” [\u003ca href=\"#bib.bib6\"\u003e42\u003c/a\u003e], which itself can be traced back to analysis-by-synthesis roots from pattern recognition [\u003ca href=\"#bib.bib5\"\u003e36\u003c/a\u003e, \u003ca href=\"#bib.bib4\"\u003e67\u003c/a\u003e]. To me, the most shocking and impressive innovation in recent years has been the generative modeling of images and videos. While similar image generation results were arguably already demonstrated with generative adversarial networks (GANs), contemporary diffusion and flow models seem to be a step change, particularly for video. I tend to view generative modeling as the natural evolution and culmination of self-supervised learning. Impressive examples include Veo3 and NanoBanana, pointing to the emergent knowledge that can be gleaned via simple pixel supervision. My bet is that generative models will “take-over” representation learning, obviating the need for explicit representation learning in embedded spaces popularized by influential approaches such as DINO and JEPA. Generative models are continually improving with more data and scale, driven by enormous industry investment and support. Indeed, there is a general sense that generative model development requires resources that academia can’t provide. Perhaps surprisingly, this also seems to be the case for all but a few players in industry. As such, efficiency is a necessary cornerstone for innovation, which is described further below. That said, I would like to point out some underexplored technical challenges. Open questions include architectures for multimodal generation; there is a growing body of work on unified models for generating text and images, but given the motivation above, I believe the field should explore generation of multi-sensory signals. One perspective is that of multi-view learning; while learning from a single modality might be enough to understand the true physical world with enough data and scale, different modalities may produce conditionally independent views of the true world, which can be shown to dramatically improve the efficiency of learning [\u003ca href=\"#bib.bib3\"\u003e9\u003c/a\u003e]. A second challenge is that of conditioning. Analysis or reconstruction can be viewed as conditional generation; instead of generating an RGBD image, one may generate depth conditioned on RGB. Current approaches for doing so include denoising modalities from with different noise schedules [\u003ca href=\"#bib.bib2\"\u003e26\u003c/a\u003e]. My hope is that conditional architectures can be made more efficient by learning encoders for the conditioning signal, which itself can be seen as a form of representation learning.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS4.p4.1\"\u003e\u003c/span\u003e(Visual) intelligence will be efficient. It is striking to point out that one of the first efforts for generative video modeling – SORA – was discontinued by OpenAI. The current understanding is that the dollar cost of inference and generation was too high. Serious efforts on video generation seem to be viable only for a few frontier labs, and perhaps out of reach for academia. I believe we need to emphasize the role of efficiency, in both training and inference. My bet is that efficiency can be tackled by re-incorporating “classic” representations including recurrance, 3D, and multi-scale processing back into generative modeling. One open question is that of long-form video generation - that is, generating videos of 1 minute or longer. It is attractive to apply autoregressive sequence modeling, but a key challenge is maintaining consistent memory. At some level, the underlying requirement is a stateful representation that does not grow over time. This is often phrased as recurrence. For example, when generating a walk-through video of a house, one would expect the living room to look consistent when re-entering after 5 minutes. Here, one can view an online 3D reconstruction as a form of a spatial memory state that enforces consistency. While there appears to be a growing body of work the direction of joint reconstruction and generation, a final underexplored space is the role of resolution. High resolution, high-frame rate video generation is simply too expensive for all but a few. One perspective I’ve always appreciated is that we should try to model (and generate) the underlying continuous time-world, irrespective of the sensors that are used to capture it. Or put in other terms, perhaps long video generation is tenable at low resolution and at low frame rates. Such stop-gap solutions are already common in practical workflows, but I would argue that they should be embraced even further, building off of notable work in the past [\u003ca href=\"#bib.bib1\"\u003e79\u003c/a\u003e]. I’ll finally conclude with a more provocative take on data-driven learning; with the right framework, we don’t need that much data. I’ll start with the claim that data diversity, and not scale, is the crucial driver for learning. At some level, I think this is obvious; a million copies of the same training example aren’t useful for learning. But the reason why scale is so attractive is that it is the easiest way to assemble a diverse dataset. But with the right curation of data, I posit that scale is not needed. But this adds the equally hard problem of how to correctly (or automatically) curate datasets. I do not have an insightful answer here, but believe the right framing of the problem is that of reinforcement learning (RL). When compared to other machine learning formulations such as supervised learning or generative modeling, it appears to be the only one that places the responsibility of data collection on the learner. This feels like the right direction! I hope the vision community will embrace it as has robotics and natural language.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"25-visual-intelligence-and-discovery-david-fouhey\"\u003e2.5 Visual Intelligence and Discovery (David Fouhey)\u003c/h3\u003e\n\u003cp\u003eTo me, visual intelligence is the ability to understand (and, perhaps, generate) visual data at the level of a human or better, without an unreasonable amount of supervision on each task. I mean supervision in the broadest sense, not just the direct labels that explicitly trained our past hyper-specialized models (e.g., face detectors), but also the raw data, environments, and simulations that now implicitly train our newer models.\u003c/p\u003e\n\u003cp\u003eCurrently, I believe that supervision scale is what separates us from visual general intelligence: with sufficient resources, our systems are surprisingly good at many tasks but require too much hand-holding. This usually cues someone to bemoan the situation and contrast AI with the efficiency of a toddler. Our methods are data-hungry, but I think this is the wrong take: more of our problems are solvable with data than we thought, with examples spanning recognition to 3D to generation, and many problems require shockingly small amounts of data to “brute-force” to reasonable performance. We just have to figure out how to make things less data hungry. But because of these proof-of-concepts, there is unprecedented demand for visual intelligence, which has opened new opportunities to change the world.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5.p3.1\"\u003e\u003c/span\u003eMy colleagues will do a fantastic job covering other angles like 3D and video generation, so I will focus on the context of scientific discovery. I have worked in this area for several years, with the goal of making AI-based data that scientists want to use for discovery. My work includes AI models [\u003ca href=\"#bib.bib108\"\u003e88\u003c/a\u003e] that reveal the Sun’s magnetic field in new detail, as well as AI-powered data [\u003ca href=\"#bib.bib107\"\u003e91\u003c/a\u003e] that enables reconstructing the process of evolution [\u003ca href=\"#bib.bib106\"\u003e8\u003c/a\u003e]. I believe this area will only grow, and much of the future visual intelligence budget will be directed at scientific data generated by specialized instruments peering at the many scales of reality.\u003c/p\u003e\n\u003cp\u003eI will weave together several problems that I have encountered working with scientists, where there is a mismatch between what vision has to offer and what is needed.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5.p5.1\"\u003e\u003c/span\u003e(Data is limited.) Computer vision, apart from some frontier lab work, is in the situation where data is a knob one can turn (and indeed likely the most effective knob to turn). However, many key scientific problems are challenging because more data can’t be collected. For instance, in understanding the impact of climate change on animal morphology [\u003ca href=\"#bib.bib115\"\u003e90\u003c/a\u003e], one cannot go back and collect species in 1970. Our models applied directly are often poor fits for small amounts of data (and so we need to find ways to align our capabilities to domain needs) and making sense of this data requires integration of other factors.\u003c/p\u003e\n\u003cp\u003e(Validation is hard without ground truth.) Science rarely has the convenient ground-truth we are accustomed to. I mean ground-truth in the broadest sense: not just hand-drawn segments but also other views and data, etc. While some fields are lucky (such as weather with its barometers and rainmeters), most are not. Solar physics has only photons, often from a single angle and time; and evolutionary ecology deals with processes that emerge over the deep time of tens of millions of years. Accordingly, when one makes a new sort of measurement or prediction, there’s no leaderboard to compare with and best number to bold in a table. Instead, validation is the long challenging work of reconciling results with our existing knowledge. This shifts the overall fraction of effort much more towards validation than we’re accustomed to in common CVPR practice. Despite the best efforts of many, our credit systems as a field are not really prepared for this.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5.p7.1\"\u003e\u003c/span\u003e(Multimodality, broadly construed, is integral.) One method of validation is connecting with equations, simplified models, and past data from other instruments. For instance, one can validate estimates of the thermal structure of the Sun’s corona [\u003ca href=\"#bib.bib109\"\u003e13\u003c/a\u003e] by connecting them to X-ray emissions observed by another instrument, bridged by the atomic physics. This validation is challenging and requires common sense that comes from other instruments and knowledge (e.g., did we forget a spectral line in the model? is the assumed elemental abundance reasonable? does the model break basic rules?). This sort of connection cannot be automated easily now and primarily consists of work by eye and hand. Unfortunately, the most useful constraints are not the hard rules like Maxell’s equations, but instead soft plausibility judgments that, for now, need expert intuition to use. Ultimately, to power scientific discovery, visual intelligence will need to be able to really connect disparate multimodal sources.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5.p8.1\"\u003e\u003c/span\u003e(Systematics and units can’t be ignored.) Another method of validation is other instruments. In computer vision, we tend to think of data as falling between [0,255] or [0,1], as provided by a black box sensor hardware. In principle, our scientific sensors come with units and so we can indeed use this as a powerful reality check. However, all instruments come with systematics, or non-physical properties. Accordingly, creating and evaluating vision systems for the sciences requires separating out the real signal originating with the underlying phenomenon from the instrument’s signals. These require deep understanding to disentangle: the sun oscillates at 11 years [\u003ca href=\"#bib.bib110\"\u003e38\u003c/a\u003e] and 5 minutes, but spurious signals have been found at 160 minutes [\u003ca href=\"#bib.bib111\"\u003e10\u003c/a\u003e] and 24 hours [\u003ca href=\"#bib.bib112\"\u003e43\u003c/a\u003e]. In our experience, models latch onto the real and the fake alike, and emulate them faithfully [\u003ca href=\"#bib.bib113\"\u003e41\u003c/a\u003e]. We have to resort to eliminating them at the data source, as one does with weather reanalysis data [\u003ca href=\"#bib.bib114\"\u003e40\u003c/a\u003e], but future models ought to be able to be more editable to separate out and ignore various signals. As a community, we also largely focus on models and math as the primary contribution, when in reality, clean data can often be as big of a driver of success, if not bigger.\u003c/p\u003e\n\u003cp\u003e(Reality is hard to model.) One question I often encounter is: why not use simulations? Unfortunately, anything where it’s worth taking new data is a place where our understanding of reality is blurry. Accordingly, what models we have are only approximate (or there are multiple competing mechanisms that all explain the data). Making matters worse, we’re primarily used to nicely behaved reality. For many problems at the forefront of physics, rendering is itself often an optimization problem, with clean solutions existing only for a limited set of problems. Our existing technology largely does not deal with connecting with complex procedures well, although I hope the advent of effective coding models will make it easier to directly connect our models to models of reality.\u003c/p\u003e\n\u003cp\u003e(Vision is only part of the broader picture.) Pulling back, I have found it humbling to work inside large science projects. In computer vision, we tend to think of the CVPR paper as the world: once you make all of your numbers in table bold, you declare success. But the vision part is often only one part of the pipeline for discovery. When I first started working with scientists, I found that they were interested in largely different things than CVPR reviewers: does my AI data have systematics? are there any mistakes in the AI generated data, and can you catch effectively all of them? I also found that integrating our results into scientific discovery was challenging: there were typically existing ways of doing things that worked around the limitations of past efforts. Figuring out this interface in order to get data in actual use by scientists has been equally laborious and rewarding.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS6\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"26-what-is-the-computational-structure-of-spatial-ai-andrew-j-davison\"\u003e2.6 What is the Computational Structure of Spatial AI? (Andrew J. Davison)\u003c/h3\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS6.p1.1\"\u003e\u003c/span\u003eIn FutureMapping 1 and 2 [\u003ca href=\"#bib.bib61\"\u003e17\u003c/a\u003e, \u003ca href=\"#bib.bib62\"\u003e16\u003c/a\u003e], I defined Spatial AI as the capability for artificial devices to build genuinely rich but efficient representations of their surroundings which enable them to interact with them in the generally intelligent ways people can. To quote Pearl, ‘what humans possessed that other species lacked was a mental representation, a blue-print of their environment which they could manipulate at will to imagine alternative hypothetical environments for planning and learning’ [\u003ca href=\"#bib.bib80\"\u003e71\u003c/a\u003e]. I believe that the capability to build high quality, task-independent representations is the key to the creative visual intelligence that will enable world-changing products such as an autonomous robot that could clear and tidy a messy kitchen, or a general lightweight wearable device that could generally enhance a human’s memory and intelligence. Such products not only place very high demands on their Spatial AI systems, but also very tight constraints on their embedded implementation in terms of size, weight, and efficiency. The computational structure of these systems — what is computed and stored where, how everything is connected, and how this relates to likely future developments in computing hardware — is a crucial and rarely discussed research issue.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS6.SSS0.Px1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"representation\"\u003eRepresentation\u003c/h4\u003e\n\u003cp\u003eA representation is a set of values describing the state of a device and the world around it. It must be persistent, but adaptable; always changing as new information is acquired about the world, or as the world itself changes. This enables a robot to predict and plan. The term ‘world model’ has recently become popular in machine learning research, but scene representation has a long history in AI and robotics. SLAM (Simultaneous Localisation and Mapping) research is the most clear example of how incrementally building persistent world representations enables consistent, long-horizon behavior. Simple visual SLAM maps of sparse features enable reliable long-term navigation to multiple waypoints, or guaranteed area coverage. But the representation possible in real-time visual SLAM has steadily improved, towards dense maps, semantic labels, and explicit object-level scene graphs, sometimes with estimated physics and dynamics properties. Additionally, these representations do not necessarily aim to be globally metrically precise, but can be accurate locally and more approximate at large scales.\u003c/p\u003e\n\u003cp\u003eMy argument that visual SLAM research is evolving into Spatial AI is especially because this area has long been driven by live demonstrations, a focus on efficiency, the use of low-cost hardware, real-time visualizations, and the release of open source code. SLAM researchers have long been obsessed by the key questions of how to continually build a persistent representation from a multi-sensor stream of data without drift and within fixed computation and memory budgets.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS6.SSS0.Px2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"machine-learning-and-state-estimation\"\u003eMachine Learning and State Estimation\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS6.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eSLAM is notable within the broader picture of artificial intelligence in that it has not yet been completely dominated by machine learning. The best performing methods for localization and sparse mapping are still mostly hand-designed algorithms using geometry and probabilistic state estimation; and dense and semantic SLAM systems use a balance, where ML is used to replace part of or add to the functionality of state estimation (e.g. MASt3R-SLAM [\u003ca href=\"#bib.bib81\"\u003e68\u003c/a\u003e]).\u003c/p\u003e\n\u003cp\u003eIt is natural to ask whether the whole of SLAM and Spatial AI will ultimately be performed end-to-end by a neural network, with no hand-designed representations or algorithms at all, and much recent research on 3D foundation models is moving in this direction. In my opinion, this is not the most important question. Spatial AI systems of the future will surely have learned and designed components so tightly integrated that it is hard to tell which is which; and this position may be reached either by adding more and more learned modules to a designed system, or by adding structure to a purely learned system. What remains important in either case, is the storage and computational structure of the whole system. If it is to have the properties that real applications demand: efficient, composable, and shareable with other devices and human users; then I believe that either method will converge on similar properties.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS6.SSS0.Px3\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"processor-hardware-of-the-future\"\u003eProcessor Hardware of the Future\u003c/h4\u003e\n\u003cp\u003eThe move from CPUs to GPUs over the past 15 years as the dominant processors of AI is only the beginning of a trend. The key to efficiency in computation is to fully embrace parallelism, with work done by a very large number of relatively simple cores, but also to reduce data movement around chips and the larger systems they form. This implies a long term move towards processors with very fine-grained parallelism, and with memory distributed across processing tiles, which are connected by sparse communication channels which respect locality. These processors will also inevitably trend towards asynchronous, event-driven operation and low bit-rate or even analog representation of numbers, as these properties also maximize efficiency.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS6.SSS0.Px4\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"mapping-spatial-ai-graphs-to-hardware\"\u003eMapping Spatial AI Graphs to Hardware\u003c/h4\u003e\n\u003cp\u003eIf processors and memory do become increasingly granular, with local memory and sparse connections between tiles, then the ‘bitter lesson’ is that algorithms which map best to these designs will perform best. The FutureMapping papers describe how the route forward is to find the graphs in data and processing structures in Spatial AI algorithms, and to as far as possible match these to hardware by essentially laying those graphs down geographically onto chips. Algorithmically, we need to focus on methods which can perform inference and learning via message passing on general, loopy graphs; a strong candidate is belief propagation which has powerful properties of distributed convergence, even with asynchronous or lossy communication.\u003c/p\u003e\n\u003cp\u003eElements such as the representation of the scene around a robot have their own integral graph structure, as revealed by many SLAM approaches, and these must be designed to have efficient interfaces to the main real-time processing loops which handle live data from sensors and outputs to actuators. Also, very specialised processors will be located close to (or even within) sensors and actuators themselves, such that the communication between them can be at the abstract level of actionable information rather than large flows of data such as video.\u003c/p\u003e\n\u003cp\u003eIn many ways, we may speculate that the drive towards efficient, modular implementation may drive Spatial AI systems to be increasingly like biological brains, which have huge capability with very high efficiency.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"27-visual-intelligence-is-embodied-intelligence-yilun-du\"\u003e2.7 Visual Intelligence is Embodied Intelligence (Yilun Du)\u003c/h3\u003e\n\u003cp\u003eIn this section, I present a perspective on visual intelligence informed by the research of our group. I argue that a central test of visual general intelligence is whether it can enable a robot to perceive, reason about, and act reliably in the physical world. Embodiment is more than a downstream application of visual intelligence: by selecting viewpoints and intervening in the world, an agent can reveal properties that are difficult to infer from passive observation alone, test its predictions, and obtain feedback with which to revise its visual model. Meeting this test requires visual systems that generalize to unfamiliar situations, integrate observations over long temporal horizons into consistent scene representations, connect visual understanding to action, actively acquire informative experience, and continue adapting after deployment. Together, these capabilities form a closed loop in which vision guides action and the consequences of action provide evidence for improving visual understanding.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"building-robust-visual-systems-with-generative-world-models\"\u003eBuilding Robust Visual Systems with Generative World Models.\u003c/h4\u003e\n\u003cp\u003eEmbodied agents will routinely encounter observations outside their training distributions, where current visual systems may fail unpredictably—and, in robotic settings, sometimes catastrophically. A central challenge for visual intelligence is therefore to generalize robustly across open-ended changes in viewpoint, environment, object configuration, and interaction.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px1.p2.1\"\u003e\u003c/span\u003eOne promising route toward such robustness is to construct generative world models and formulate perception as inference over the latent scene states that could have produced an observation. Because visual observations arise from recurring physical regularities—including geometry, objects, relations, and dynamics—such models can explain unfamiliar scenes by reusing and recombining previously acquired knowledge. E
