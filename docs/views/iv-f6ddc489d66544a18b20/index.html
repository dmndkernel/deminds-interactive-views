</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-05T15:13:46.972Z","language":"en","name":"DeMinds","version":"1.0.33"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"Visual General Intelligence A White Paper","outlineVersion":1},"sourceRevision":"sha256:a2612958e0fd31abcc664f195568c91d529a6d537d717da54e0b13c6c9bfa4d2","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Visual General Intelligence  A White Paper.md","sourceUrl":"https://arxiv.org/html/2608.25924","title":"Visual General Intelligence A White Paper"},"files":[{"byteLength":126562,"content":"# Visual General Intelligence: A White Paper\n\n\u003e Authors: Hirokatsu Kataoka, Yoshihiro Fukuhara, Yonglong Tian, Shangzhe Wu, Oishi Deb, Ryousuke Yamada, Christian Rupprecht, Jianyuan Wang, Kohsuke Ide, Koichi Namekata, Xianzheng Ma, Yiming Chen, Robert Geirhos, Aditi Raghunathan, Yuki M. Asano, Deva Ramanan, David Fouhey, Andrew J. Davison, Yilun Du, Jiajun Wu, Zhuang Liu\n\u003e Affiliations: National Institute of Advanced Industrial Science and Technology \\(AIST\\) · Visual Geometry Group \\(VGG\\), University of Oxford · CADDi · OpenAI · University of Cambridge · University of Technology Nuremberg · University of Tsukuba · Google DeepMind · Carnegie Mellon University · New York University · Imperial College London · Harvard University · Stanford University · Princeton University\n\u003e [arXiv:2608.25924v1](https://arxiv.org/html/2608.25924) · cs.CV · 2026-08-26\n\n## Abstract\n\nThis paper reconsiders intelligence from a vision-centered perspective and examines whether intelligence emerging from visual experience and learning may provide a pathway toward AGI. In the language domain, beginning with the introduction of the Transformer architecture, the GPT series has demonstrated transfer to unseen tasks through autoregressive language modeling on web-scale text combined with aggressive scaling. This raises a natural question, namely, what capabilities and forms of intelligence can emerge from visual modalities such as images, videos, and geometry? In this paper, we discuss whether visual intelligence can serve as a pathway toward AGI, referred to in this paper as visual general intelligence (VGI), by bringing together contributors from diverse standpoints and affiliations. Our aim is not to offer a single definition of visual intelligence, but to clarify the principles that computer vision should pursue in the AGI era, the visual input modalities, the benchmarks, the learning paradigms, and the relationship between vision, when taken as the core, and other modalities such as language.\n\n\u003cspan id=\"S1\"\u003e\u003c/span\u003e\n\n## 1 Introduction\n\n\u003cspan id=\"S1.p1.1\"\u003e\u003c/span\u003eSince the early discussions of artificial intelligence (AI), including those surrounding Alan Turing and cybernetics, intelligence has often been discussed as the ability to acquire representations from environmental signals, capture their underlying regularities, generalize to unseen situations, and connect such representations to prediction or action [[82](#bib.bib12), [94](#bib.bib13), [49](#bib.bib10), [35](#bib.bib11)]. At the same time, it is not obvious that intelligence should be reduced to language.\n\n\u003cspan id=\"S1.p2.1\"\u003e\u003c/span\u003eIn the history of Earth, advanced visual systems, including camera-type eyes and compound eyes, date back to the Cambrian period roughly half a billion years ago, and the rapid development of vision has long been discussed as a possible driver of major changes in biological interactions [[70](#bib.bib14), [111](#bib.bib15)]. By contrast, advanced human language, writing systems, and individual languages such as English are all extremely recent phenomena on the timescale of life’s history [[27](#bib.bib16), [15](#bib.bib17), [5](#bib.bib18)]. This contrast suggests that vision may be more than a sensor or input modality; the visual modality may instead constitute a foundational intelligent function for capturing the structure of the world.\n\n\u003cspan id=\"S1.p3.1\"\u003e\u003c/span\u003eRecent progress in large language models (LLMs) provides an important reference point for thinking about the emergence of intelligence. Through the lineage of statistical language models, neural probabilistic language models [[7](#bib.bib19)], distributed representations such as word2vec [[66](#bib.bib21)], sequence-to-sequence models [[77](#bib.bib22)], attention [[3](#bib.bib23)], Transformers [[84](#bib.bib24)], BERT [[19](#bib.bib25)], and GPT [[73](#bib.bib26)], language processing gradually shifted from hand-designed features and task-specific pipelines toward representation learning based on large-scale data and general-purpose learning objectives. GPT-3 was especially striking in that, without images, audio, or embodied interaction, it showed that scaling a simple autoregressive self-supervised objective (next-token prediction) over web-scale text corpora could give rise to broad capabilities such as in-context learning and few-shot adaptation [[11](#bib.bib27)]. Wei et al. formalized such scale-dependent qualitative capability gains as “emergent abilities of large language models” [[92](#bib.bib28)]. This also resonates with Sutton’s “The Bitter Lesson” [[78](#bib.bib29)]: in the long run, methods that scale with computation, data, learning, and search tend to dominate manually engineered knowledge and rules. Although the success of language models cannot simply be transferred to visual models, the fact that unexpected abilities can arise from a simple objective, large-scale experience, and scaling is a crucial clue for visual intelligence.\n\n\u003cspan id=\"S1.p4.1\"\u003e\u003c/span\u003eComputer vision has also undergone major transformations. Before the era of deep neural networks, the field accumulated rich knowledge based on geometry, statistics, and optimization, including edge and corner detection, local features such as SIFT, stereo, optical flow, structure from motion, and object detection. The success of AlexNet at ILSVRC 2012 marked a turning point, ushering in the deep learning era and leading to dramatic progress in visual recognition [[47](#bib.bib30), [74](#bib.bib31)]. More recently, vision research has expanded beyond supervised learning toward self-supervised learning, image-text contrastive learning, Transformers, image and video generation, 3D/4D reconstruction, robotics, and embodied AI. In this context, a natural question is whether emergent abilities analogous to those observed in language models may also appear when visual models are scaled up and exposed to increasingly diverse visual experiences, or whether vision requires principles specific to visual intelligence.\n\nThere is no need to settle this question with a single answer at this stage. One viewpoint is that scaling single-modality, single-objective visual learning to its limit may be sufficient; another is that integrating visual modalities such as video, geometry, and spacetime, or visual tasks such as generation, restoration, and reconstruction, may be essential. What matters is not to make the scaling of vision foundation models (VFMs) an end in itself, but to ask under what learning strategies, data structures, model architectures, and evaluation settings visual representations can generalize to unknown tasks and environments. Current VFMs are increasingly applied to classification, dense prediction, correspondence estimation, and 3D reconstruction, yet there remains substantial room to disentangle whether a capability arises from training data, task design, decoders, prompts, model size, or their combinations. This unresolved nature should be viewed not as a limitation, but as a starting point for asking whether intelligence emerging from vision can evolve into general intelligence.\n\n\u003cspan id=\"S1.p6.1\"\u003e\u003c/span\u003eRecent progress in VLMs and MLLMs is also central to this discussion. CLIP maps images and text into a shared space through contrastive learning, enabling zero-shot recognition mediated by natural language [[72](#bib.bib32)]. MLLMs such as Flamingo [[2](#bib.bib33)], BLIP/BLIP-2 [[51](#bib.bib34), [50](#bib.bib35)], and LLaVA [[56](#bib.bib36)] connect image features from visual encoders to LLMs as token sequences or intermediate representations, enabling visual question answering, captioning, dialogue, and instruction following. These models provide powerful frameworks for connecting vision and language and represent one of the central directions for vision research toward the AGI era. At the same time, because image features, image-text pairs, instruction tuning, and reasoning processes are deeply intertwined, it remains difficult to isolate which capabilities originate from visual experience itself and which emerge from the language model. Rather than rejecting MLLMs, this paper keeps multiple viewpoints open, including vision-only, vision-first, language-mediated, and multimodal perspectives, and discusses visual intelligence from several angles.\n\nVisual general intelligence (VGI), as discussed here, is not a rejection of language. Rather, it is a research agenda that asks what vision can understand, predict, and generalize, either before being coupled with language or while interacting with it. Visual data contains dense, observable, and measurable structures. Given such structures, should models predict what will be seen next, generate unobserved regions, reconstruct 3D/4D structures, or integrate multiple objectives to acquire general visual representations? We view visual intelligence research as an attempt to revisit these vision-specific questions through diverse forms of visual learning.\n\nIn the AGI era, computer vision has an exceptionally important role to play. Precisely because language models have reshaped the landscape of AI, the computer vision community can now revisit a fundamental question: what kinds of generality can arise from visual learning? The diverse expertise accumulated across visual modalities and tasks offers an unusually rich foundation for exploring VGI. We are entering a creative phase in which the community can proactively design what should be measured beyond benchmark accuracy and incremental improvements, including physical-world applications, adaptation to unknown environments, and societal impact.\n\nVGI, namely intelligence emerging from visual modalities and tasks, is not yet a fully established concept. Precisely for this reason, there is great value in bringing together diverse hypotheses rooted in each researcher’s expertise and experience, and in openly, optimistically, and boldly exploring possible pathways from vision to general intelligence from the perspective of the computer vision community. This paper aims to serve as a starting point for such exploration and to broaden the role of vision research in the AGI era as broadly as possible.\u003cspan id=\"footnote1\"\u003e\u003c/span\u003e11 1 This paper originates from discussions at the CVPR 2026 VGI Workshop [[85](#bib.bib37)]. The views presented here are not intended to provide a single definition of VGI, but rather to summarize multiple perspectives that open diverse possibilities for vision research toward general intelligence.\n\n\u003cspan id=\"S2\"\u003e\u003c/span\u003e\n\n## 2 Perspectives on Visual General Intelligence\n\nThe path from visual intelligence to general intelligence is unlikely to be captured by a single definition, model, or benchmark. This section brings together diverse research perspectives to help clarify the open questions that the computer vision community may explore.\n\n\u003cspan id=\"S2.SS1\"\u003e\u003c/span\u003e\n\n### 2.1 Video models are visual foundation models (Robert Geirhos)\n\n\u003cspan id=\"S2.SS1.p1.1\"\u003e\u003c/span\u003eIn the context of my research, visual intelligence can be characterized as the ability to solve any visual task, from perception to reasoning, without being explicitly trained on each new task. Just like large language models are now able to solve most language tasks, I believe that the time has finally come for machine vision to undergo a similar transformation from task-specific to general-purpose models. The computer vision community has built outstanding individual and task-specific models to date [[101](#bib.bib51), [46](#bib.bib52), e.g.], but the field has not yet been unified around a common framework in the same way that LLMs have unified most of natural language processing research. How, then, should we build unified visual foundation models? The foundational primitives that unlocked language intelligence—training large, generative models on web-scale data—apply directly to today’s generative video models. I am convinced that transferring these very principles (large-scale training + generative objective) to video models holds the key to solving visual intelligence.\n\n\u003cspan id=\"S2.SS1.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### Why *large models* trained on *web-scale data*?\n\n\u003cspan id=\"S2.SS1.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eRich Sutton’s bitter lesson [[78](#bib.bib29)] makes the compelling case that scale has been the single biggest driver of AI progress over the past decades. It is only consequent that LLMs have continued to benefit from larger models and larger, more diverse datasets to date. In a similar vein, there is no reason to believe that video models won’t benefit from scale, on both the architecture and data side.\n\n\u003cspan id=\"S2.SS1.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### Why *generative* models?\n\n\u003cspan id=\"S2.SS1.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eMachine learning models love to learn shortcuts—the easiest solutions they can find to solve a given objective [[30](#bib.bib38)], if only superficially. As a consequence, we need to make the training objective as hard as we can. For example, training classifiers on ImageNet is too easy; they can simply learn to exploit textures [[31](#bib.bib40)] or the image background [[6](#bib.bib41)] as predictive features, predicting ‘elephant’ whenever a grey leather-like pattern is detected, or predicting ‘cow’ whenever grass is present. However, training a *generative* model on visual data requires solving a much harder task. Here, the model cannot simply get away with generating grass without the cow, as the generative objective forces the model to get everything right: the object, the background, the textures, the shapes, the lighting and the shadows—lest it be punished by the training objective. It is this intuition that makes me confident that generative models will be able to solve visual intelligence, simply because their training task is hard enough to be meaningful, forcing them to learn much about the world by virtue of prediction.\n\n\u003cspan id=\"S2.SS1.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### And finally, why *video* models?\n\n\u003cspan id=\"S2.SS1.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eThere is a principled and a practical argument to support the case of video models as visual foundation models. The principled reason is that video generation is the most general framework for many visual tasks, encompassing still images as a special case [[102](#bib.bib50), e.g.]. The practical reason is that in the last two years or so, video models have finally entered the limelight as increasingly capable models, with significant progress happening over the course of months if not days at the moment. In fact, they have become capable enough already to serve as a “version 1.0” of visual foundation models: In our recent work [[93](#bib.bib39)], we demonstrated that generative video models like Veo 3 exhibit precisely the kind of broad, emergent capabilities that were characteristic of early language foundation models, but in the visual domain instead. Without any task-specific training, the model can perform a wide range of visual tasks simply through image-to-video generation: edge detection, object segmentation, keypoint localization, super-resolution, image editing, style transfer, and even early forms of visual reasoning such as maze solving and graph traversal. Veo 3, a video model trained for entertainment, happens to be a visual foundation model. Subsequent works confirmed and extended these findings in other models too, including open-source models [[86](#bib.bib45), [57](#bib.bib49), [69](#bib.bib48), [45](#bib.bib47), [115](#bib.bib46), [110](#bib.bib42), [37](#bib.bib44), [80](#bib.bib43)]. Just like language foundation models quickly progressed from GPT-2 over GPT-3 to, eventually, ChatGPT and modern LLMs, video models are likely to progress towards fully capable visual foundation models as soon as we start building towards this future.\n\nIn light of this, I believe that visual general intelligence is achievable by developing video models as visual foundation models, with the exciting possibility of unifying much of today’s fragmented, “each task requires its own model” computer vision community.\n\n\u003cspan id=\"S2.SS2\"\u003e\u003c/span\u003e\n\n### 2.2 Creativity as a Test of Visual General Intelligence (Aditi Raghunathan)\n\nIntelligence is not exhausted by tasks with a single correct answer. In open-ended settings, success also depends on finding creative ways to satisfy a request and making fresh connections that were not explicitly encountered before. For visual intelligence, examples include designing an object under functional constraints, proposing distinct plans for a robot, constructing a scientific diagram, or imagining several ways in which a physical scene could evolve. Creativity in such tasks requires outputs that are not only coherent, but also diverse across repeated generations and original relative to the training experience. These capabilities will become increasingly important as visual models are used for scientific discovery, design, novel training data, and test-time exploration.\n\nMany creative tasks require a leap of thought: an implicit search-and-plan process that coordinates several interdependent decisions before the observable output is generated. In vision, this hidden plan might specify a scene layout, a 3D structure, a set of object relationships, a physical mechanism, a camera trajectory, or a sequence of actions. It may be only indirectly visible in the final image or video. Producing such an output therefore requires capturing higher-order structure across the generation as a whole, rather than assembling independently plausible local choices.\n\nIn prior work, we designed minimal algorithmic tasks that are loose abstractions of open-ended real-world tasks and that make creativity measurable in a controlled setting. Drawing on a cognitive-science taxonomy, we considered two forms of creativity. Combinational creativity identifies unfamiliar connections among familiar elements, as in analogy, wordplay, and the discovery of connections between previously separate ideas. Its visual analogue could involve finding an unexpected but meaningful relationship among familiar objects, scenes, concepts, or physical processes. Exploratory creativity constructs new patterns subject to a collection of rules or constraints, as in designing problems, proteins, mechanisms, or narratives. Its visual analogue could be a new scene, 3D structure, video, mechanism, or action plan that satisfies geometric, physical, semantic, or task-level constraints.\n\nIn both cases, the goal is to produce solutions that are coherent, distinct, and not simply reproduced from training examples. We refer to this operational notion as algorithmic creativity. A corresponding evaluation of creative visual intelligence should measure at least three properties. First, each output should be coherent, satisfying the relevant physical, geometric, semantic, temporal, or task constraints. Second, generations should be structurally diverse, representing meaningfully different solutions rather than cosmetic changes in texture, color, wording, or viewpoint. Third, outputs should be original relative to the model’s training experience.\n\nOur results suggest that the learning objective matters for acquiring such behavior. On the controlled tasks, multi-token approaches based on teacherless training and diffusion generated more diverse and original solutions than conventional next-token learning. A central issue is global coordination: the latent creative plan is expressed through relationships among several parts of the sequence, and those parts must fit together as a whole. For visual models, this motivates objectives and architectures that can represent a high-level construction and then generate its local details while preserving spatial and temporal consistency.\n\nWe also considered where randomness should enter the generation process. Rather than introducing randomness only through output-level temperature sampling, seed-conditioning provides a random input to the model during both training and inference. Different seeds can select different solutions while allowing each solution to remain internally coherent. A visual analogue would use a persistent sample-level latent variable to select a high-level possibility—such as a layout, mechanism, trajectory, or hypothesis—before generating its details. This may encourage diversity among complete plans rather than merely introducing local variation during decoding.\n\nCreativity therefore extends the role of generation in visual general intelligence. A visually intelligent system should not only recognize what is present, reconstruct hidden structure, or predict the most likely future. It should also be able to construct multiple plausible alternatives, preserve the internal logic of each, and search for possibilities that are useful and unfamiliar. Visual models should consequently be evaluated not only by fidelity and accuracy, but also by coherence, structural diversity, originality, and utility. The central question is not simply whether a model can imagine, but whether it can imagine differently without losing structure.\n\n\u003cspan id=\"S2.SS3\"\u003e\u003c/span\u003e\n\n### 2.3 A learning system that learns from one datum (Yuki M. Asano)\n\nToday’s strongest visual systems are impressive, but they are not general in the way that matters. They are trained once on large, carefully assembled datasets and then deployed as essentially fixed models. They can recognise objects, reconstruct scenes, answer questions about images, or follow textual instructions. Yet they do not build up a coherent understanding of the world through experience, nor do they continue to reorganise that understanding as the world changes. Today, our field knows one “fix” to this: add more data \u0026 (re-)train.\n\nIn my opinion, a visually generally intelligent system should learn from visual experience as it unfolds: continuously, without labels, without repeated reshuffling of the past, and without assuming that the important tasks are known in advance. If we could build such a system, we could have adaptive, continuously improving models and agents that require the equivalent of one light-bulb of energy for updating weights, not that of a city.\n\nThe starting point is vision rather than language. Before an intelligent system can describe the world, it must first discover its structure. It must learn which parts of an observation belong together, which objects persist across viewpoints and interruptions, how the observer itself is moving, what changes independently in the scene, and which regularities remain stable over days, months, or years.\n\nThe aim is not simply to train a larger video model. Current video models are powerful and general perceptual modules, but they operate on data that have already been collected, segmented, shuffled, and revisited.22 2 And I also believe it’s a reasonable bet to scale towards a practical definition of VGI with video generative models. To me, Visual General Intelligence instead asks how a system can learn *during its own visual lifetime*. It should know what it has seen before, detect when something genuinely new has happened, decide which parts of itself should change, and retain knowledge that remains useful. This system requires less a continual learning solution, but rather a whole learning system that can work autonomously in an open-ended way. Think of a baby: no goal, no talking, no problem. A somewhat rough mental comparison sketch would be today’s coding agents that can themselves spawn sub-agents—but instead for vision and from scratch and without language.\n\nWhat seems obvious is that this does not get solved by simply having a bigger Transformer and current learning paradigms.33 3 Happy to be wrong, I like simplicity. Instead, a plausible artificial visual brain should contain several interacting systems:\n\n- • A perceptual system that turns the current visual stream into objects, regions, surfaces, motion, and semantic features.44 4 How does even one best represent video? Frames are redundant, codec is difficult, object-centric somewhat arbitrary.\n- • A spatial and dynamic world model that maintains hypotheses about geometry, viewpoint, object identity, motion, and causal change. It should distinguish changes caused by the observer from changes caused by the world.\n- • A memory system that stores information at different timescales.\n- • A task and action interface that exposes the learned visual knowledge to downstream systems, including robots, scientific instruments, search tools, and human users.\n\nThese modules need not be hand-designed as rigid symbolic components. They may be neural, differentiable, and jointly trained. But they should have distinct roles, update rules, and timescales. The brain is not one homogeneous block, and an artificial learner that must remain stable while continuing to change is unlikely to be one either.\n\n\u003cspan id=\"S2.SS3.p8.1\"\u003e\u003c/span\u003eLanguage enters later as an interface to this visual intelligence. It can name concepts, communicate goals, collaborate, and provide occasional supervision. But language should not be the sole organising principle of the visual system. Much of the world’s structure—depth, motion, persistence, containment, contact, and affordance—exists before it is named. A visually intelligent system should therefore be able to learn these regularities without captions and only subsequently connect them to words. Language becomes a way to query, steer [[75](#bib.bib20)], and teach an already grounded world model, rather than a substitute for one.\n\nThe long-term objective is a visual system that grows with experience. It should become more competent, more structured, and more useful the longer it observes the world; without needing to be reset, retrained from scratch, or told in advance everything it will eventually need to understand.\n\n\u003cspan id=\"S2.SS4\"\u003e\u003c/span\u003e\n\n### 2.4 Intelligence will be multimodal, generative, and efficient (Deva Ramanan et al.)\n\nIn this section, I will outline some thoughts on visual intelligence informed by work from our group. I will frame them as “bets”; some may turn out to be wrong, while some may viewed as obvious. Their intention is to spur (hopefully productive) discussion. Much of these thoughts are motivated by intelligence from an embodied robotics perspective.\n\n\u003cspan id=\"S2.SS4.p2.1\"\u003e\u003c/span\u003e(Visual) intelligence won’t be just visual. Intelligence will be driven by multimodal signal modeling. Perhaps the elephant in the room is the interplay of vision and language, but other sensory modalities include audio, tactile, and proprioceptive sensing. Such sensory signals are particularly relevant from a robotics perspective. One striking fact is that the vast majority of legged robot demonstrations (including humanoids and quadrupeds) are driven by blind policies that do not make use of visual observations, but rather proprioceptive feedback that reports the kinematic state of the robot’s body. One can move around the world, even acrobatically (via backflips), without opening their eyes. Similarly, there are well-known examples of dexterous manipulation that also operate “blindly”; one can fan out and identify keys in their pocket via tactile feedback and no vision. In fact, one comment that I’ve heard in robotic circles is that vision is the least important perceptual signal for robotics. I would argue against this sentiment and advocate for vision from an information theoretic perspective; compared to other sensory modalities, it is quite high dimensional and tends to contain lots of information about the physical world. This is in fact one reason why it seems attractive to ignore for robotics; it is much easier to build lightweight (and low latency) policies that operate on low-dimensional proprioceptive state. Let me conclude this bet by emphasizing some underexplored research directions. The first is truly multimodal learning. For practical reasons, most multimodal models are really single-modal models that have been post-trained via adaptors for additional modalities. It would be interesting to pre-train representations from raw multi-modal signal streams [[81](#bib.bib9)]. Another direction that I believe is underexplored is tactile perception. While there exists numerous hardware challenges for building scalable tactile sensors, one perspective from which the vision community could immediately engage is through “near-field” vision, where visual perception is used to analyze nearby (and possibly touching) scene structures. A wonderful example of this is the GelSight sensor [[105](#bib.bib8)], which reframes tactile sensing as a photometric stereo reconstruction task. Another widely-used example of this are wrist-mounted egocentric cameras, which could be a rich source for understanding the nearby visual world [[14](#bib.bib7)].\n\n\u003cspan id=\"S2.SS4.p3.1\"\u003e\u003c/span\u003e(Visual) intelligence will be generative. Here, I subscribe to Hinton’s view that “to recognize shapes, first learn to generate images” [[42](#bib.bib6)], which itself can be traced back to analysis-by-synthesis roots from pattern recognition [[36](#bib.bib5), [67](#bib.bib4)]. To me, the most shocking and impressive innovation in recent years has been the generative modeling of images and videos. While similar image generation results were arguably already demonstrated with generative adversarial networks (GANs), contemporary diffusion and flow models seem to be a step change, particularly for video. I tend to view generative modeling as the natural evolution and culmination of self-supervised learning. Impressive examples include Veo3 and NanoBanana, pointing to the emergent knowledge that can be gleaned via simple pixel supervision. My bet is that generative models will “take-over” representation learning, obviating the need for explicit representation learning in embedded spaces popularized by influential approaches such as DINO and JEPA. Generative models are continually improving with more data and scale, driven by enormous industry investment and support. Indeed, there is a general sense that generative model development requires resources that academia can’t provide. Perhaps surprisingly, this also seems to be the case for all but a few players in industry. As such, efficiency is a necessary cornerstone for innovation, which is described further below. That said, I would like to point out some underexplored technical challenges. Open questions include architectures for multimodal generation; there is a growing body of work on unified models for generating text and images, but given the motivation above, I believe the field should explore generation of multi-sensory signals. One perspective is that of multi-view learning; while learning from a single modality might be enough to understand the true physical world with enough data and scale, different modalities may produce conditionally independent views of the true world, which can be shown to dramatically improve the efficiency of learning [[9](#bib.bib3)]. A second challenge is that of conditioning. Analysis or reconstruction can be viewed as conditional generation; instead of generating an RGBD image, one may generate depth conditioned on RGB. Current approaches for doing so include denoising modalities from with different noise schedules [[26](#bib.bib2)]. My hope is that conditional architectures can be made more efficient by learning encoders for the conditioning signal, which itself can be seen as a form of representation learning.\n\n\u003cspan id=\"S2.SS4.p4.1\"\u003e\u003c/span\u003e(Visual) intelligence will be efficient. It is striking to point out that one of the first efforts for generative video modeling – SORA – was discontinued by OpenAI. The current understanding is that the dollar cost of inference and generation was too high. Serious efforts on video generation seem to be viable only for a few frontier labs, and perhaps out of reach for academia. I believe we need to emphasize the role of efficiency, in both training and inference. My bet is that efficiency can be tackled by re-incorporating “classic” representations including recurrance, 3D, and multi-scale processing back into generative modeling. One open question is that of long-form video generation - that is, generating videos of 1 minute or longer. It is attractive to apply autoregressive sequence modeling, but a key challenge is maintaining consistent memory. At some level, the underlying requirement is a stateful representation that does not grow over time. This is often phrased as recurrence. For example, when generating a walk-through video of a house, one would expect the living room to look consistent when re-entering after 5 minutes. Here, one can view an online 3D reconstruction as a form of a spatial memory state that enforces consistency. While there appears to be a growing body of work the direction of joint reconstruction and generation, a final underexplored space is the role of resolution. High resolution, high-frame rate video generation is simply too expensive for all but a few. One perspective I’ve always appreciated is that we should try to model (and generate) the underlying continuous time-world, irrespective of the sensors that are used to capture it. Or put in other terms, perhaps long video generation is tenable at low resolution and at low frame rates. Such stop-gap solutions are already common in practical workflows, but I would argue that they should be embraced even further, building off of notable work in the past [[79](#bib.bib1)]. I’ll finally conclude with a more provocative take on data-driven learning; with the right framework, we don’t need that much data. I’ll start with the claim that data diversity, and not scale, is the crucial driver for learning. At some level, I think this is obvious; a million copies of the same training example aren’t useful for learning. But the reason why scale is so attractive is that it is the easiest way to assemble a diverse dataset. But with the right curation of data, I posit that scale is not needed. But this adds the equally hard problem of how to correctly (or automatically) curate datasets. I do not have an insightful answer here, but believe the right framing of the problem is that of reinforcement learning (RL). When compared to other machine learning formulations such as supervised learning or generative modeling, it appears to be the only one that places the responsibility of data collection on the learner. This feels like the right direction! I hope the vision community will embrace it as has robotics and natural language.\n\n\u003cspan id=\"S2.SS5\"\u003e\u003c/span\u003e\n\n### 2.5 Visual Intelligence and Discovery (David Fouhey)\n\nTo me, visual intelligence is the ability to understand (and, perhaps, generate) visual data at the level of a human or better, without an unreasonable amount of supervision on each task. I mean supervision in the broadest sense, not just the direct labels that explicitly trained our past hyper-specialized models (e.g., face detectors), but also the raw data, environments, and simulations that now implicitly train our newer models.\n\nCurrently, I believe that supervision scale is what separates us from visual general intelligence: with sufficient resources, our systems are surprisingly good at many tasks but require too much hand-holding. This usually cues someone to bemoan the situation and contrast AI with the efficiency of a toddler. Our methods are data-hungry, but I think this is the wrong take: more of our problems are solvable with data than we thought, with examples spanning recognition to 3D to generation, and many problems require shockingly small amounts of data to “brute-force” to reasonable performance. We just have to figure out how to make things less data hungry. But because of these proof-of-concepts, there is unprecedented demand for visual intelligence, which has opened new opportunities to change the world.\n\n\u003cspan id=\"S2.SS5.p3.1\"\u003e\u003c/span\u003eMy colleagues will do a fantastic job covering other angles like 3D and video generation, so I will focus on the context of scientific discovery. I have worked in this area for several years, with the goal of making AI-based data that scientists want to use for discovery. My work includes AI models [[88](#bib.bib108)] that reveal the Sun’s magnetic field in new detail, as well as AI-powered data [[91](#bib.bib107)] that enables reconstructing the process of evolution [[8](#bib.bib106)]. I believe this area will only grow, and much of the future visual intelligence budget will be directed at scientific data generated by specialized instruments peering at the many scales of reality.\n\nI will weave together several problems that I have encountered working with scientists, where there is a mismatch between what vision has to offer and what is needed.\n\n\u003cspan id=\"S2.SS5.p5.1\"\u003e\u003c/span\u003e(Data is limited.) Computer vision, apart from some frontier lab work, is in the situation where data is a knob one can turn (and indeed likely the most effective knob to turn). However, many key scientific problems are challenging because more data can’t be collected. For instance, in understanding the impact of climate change on animal morphology [[90](#bib.bib115)], one cannot go back and collect species in 1970. Our models applied directly are often poor fits for small amounts of data (and so we need to find ways to align our capabilities to domain needs) and making sense of this data requires integration of other factors.\n\n(Validation is hard without ground truth.) Science rarely has the convenient ground-truth we are accustomed to. I mean ground-truth in the broadest sense: not just hand-drawn segments but also other views and data, etc. While some fields are lucky (such as weather with its barometers and rainmeters), most are not. Solar physics has only photons, often from a single angle and time; and evolutionary ecology deals with processes that emerge over the deep time of tens of millions of years. Accordingly, when one makes a new sort of measurement or prediction, there’s no leaderboard to compare with and best number to bold in a table. Instead, validation is the long challenging work of reconciling results with our existing knowledge. This shifts the overall fraction of effort much more towards validation than we’re accustomed to in common CVPR practice. Despite the best efforts of many, our credit systems as a field are not really prepared for this.\n\n\u003cspan id=\"S2.SS5.p7.1\"\u003e\u003c/span\u003e(Multimodality, broadly construed, is integral.) One method of validation is connecting with equations, simplified models, and past data from other instruments. For instance, one can validate estimates of the thermal structure of the Sun’s corona [[13](#bib.bib109)] by connecting them to X-ray emissions observed by another instrument, bridged by the atomic physics. This validation is challenging and requires common sense that comes from other instruments and knowledge (e.g., did we forget a spectral line in the model? is the assumed elemental abundance reasonable? does the model break basic rules?). This sort of connection cannot be automated easily now and primarily consists of work by eye and hand. Unfortunately, the most useful constraints are not the hard rules like Maxell’s equations, but instead soft plausibility judgments that, for now, need expert intuition to use. Ultimately, to power scientific discovery, visual intelligence will need to be able to really connect disparate multimodal sources.\n\n\u003cspan id=\"S2.SS5.p8.1\"\u003e\u003c/span\u003e(Systematics and units can’t be ignored.) Another method of validation is other instruments. In computer vision, we tend to think of data as falling between [0,255] or [0,1], as provided by a black box sensor hardware. In principle, our scientific sensors come with units and so we can indeed use this as a powerful reality check. However, all instruments come with systematics, or non-physical properties. Accordingly, creating and evaluating vision systems for the sciences requires separating out the real signal originating with the underlying phenomenon from the instrument’s signals. These require deep understanding to disentangle: the sun oscillates at 11 years [[38](#bib.bib110)] and 5 minutes, but spurious signals have been found at 160 minutes [[10](#bib.bib111)] and 24 hours [[43](#bib.bib112)]. In our experience, models latch onto the real and the fake alike, and emulate them faithfully [[41](#bib.bib113)]. We have to resort to eliminating them at the data source, as one does with weather reanalysis data [[40](#bib.bib114)], but future models ought to be able to be more editable to separate out and ignore various signals. As a community, we also largely focus on models and math as the primary contribution, when in reality, clean data can often be as big of a driver of success, if not bigger.\n\n(Reality is hard to model.) One question I often encounter is: why not use simulations? Unfortunately, anything where it’s worth taking new data is a place where our understanding of reality is blurry. Accordingly, what models we have are only approximate (or there are multiple competing mechanisms that all explain the data). Making matters worse, we’re primarily used to nicely behaved reality. For many problems at the forefront of physics, rendering is itself often an optimization problem, with clean solutions existing only for a limited set of problems. Our existing technology largely does not deal with connecting with complex procedures well, although I hope the advent of effective coding models will make it easier to directly connect our models to models of reality.\n\n(Vision is only part of the broader picture.) Pulling back, I have found it humbling to work inside large science projects. In computer vision, we tend to think of the CVPR paper as the world: once you make all of your numbers in table bold, you declare success. But the vision part is often only one part of the pipeline for discovery. When I first started working with scientists, I found that they were interested in largely different things than CVPR reviewers: does my AI data have systematics? are there any mistakes in the AI generated data, and can you catch effectively all of them? I also found that integrating our results into scientific discovery was challenging: there were typically existing ways of doing things that worked around the limitations of past efforts. Figuring out this interface in order to get data in actual use by scientists has been equally laborious and rewarding.\n\n\u003cspan id=\"S2.SS6\"\u003e\u003c/span\u003e\n\n### 2.6 What is the Computational Structure of Spatial AI? (Andrew J. Davison)\n\n\u003cspan id=\"S2.SS6.p1.1\"\u003e\u003c/span\u003eIn FutureMapping 1 and 2 [[17](#bib.bib61), [16](#bib.bib62)], I defined Spatial AI as the capability for artificial devices to build genuinely rich but efficient representations of their surroundings which enable them to interact with them in the generally intelligent ways people can. To quote Pearl, ‘what humans possessed that other species lacked was a mental representation, a blue-print of their environment which they could manipulate at will to imagine alternative hypothetical environments for planning and learning’ [[71](#bib.bib80)]. I believe that the capability to build high quality, task-independent representations is the key to the creative visual intelligence that will enable world-changing products such as an autonomous robot that could clear and tidy a messy kitchen, or a general lightweight wearable device that could generally enhance a human’s memory and intelligence. Such products not only place very high demands on their Spatial AI systems, but also very tight constraints on their embedded implementation in terms of size, weight, and efficiency. The computational structure of these systems — what is computed and stored where, how everything is connected, and how this relates to likely future developments in computing hardware — is a crucial and rarely discussed research issue.\n\n\u003cspan id=\"S2.SS6.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### Representation\n\nA representation is a set of values describing the state of a device and the world around it. It must be persistent, but adaptable; always changing as new information is acquired about the world, or as the world itself changes. This enables a robot to predict and plan. The term ‘world model’ has recently become popular in machine learning research, but scene representation has a long history in AI and robotics. SLAM (Simultaneous Localisation and Mapping) research is the most clear example of how incrementally building persistent world representations enables consistent, long-horizon behavior. Simple visual SLAM maps of sparse features enable reliable long-term navigation to multiple waypoints, or guaranteed area coverage. But the representation possible in real-time visual SLAM has steadily improved, towards dense maps, semantic labels, and explicit object-level scene graphs, sometimes with estimated physics and dynamics properties. Additionally, these representations do not necessarily aim to be globally metrically precise, but can be accurate locally and more approximate at large scales.\n\nMy argument that visual SLAM research is evolving into Spatial AI is especially because this area has long been driven by live demonstrations, a focus on efficiency, the use of low-cost hardware, real-time visualizations, and the release of open source code. SLAM researchers have long been obsessed by the key questions of how to continually build a persistent representation from a multi-sensor stream of data without drift and within fixed computation and memory budgets.\n\n\u003cspan id=\"S2.SS6.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### Machine Learning and State Estimation\n\n\u003cspan id=\"S2.SS6.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eSLAM is notable within the broader picture of artificial intelligence in that it has not yet been completely dominated by machine learning. The best performing methods for localization and sparse mapping are still mostly hand-designed algorithms using geometry and probabilistic state estimation; and dense and semantic SLAM systems use a balance, where ML is used to replace part of or add to the functionality of state estimation (e.g. MASt3R-SLAM [[68](#bib.bib81)]).\n\nIt is natural to ask whether the whole of SLAM and Spatial AI will ultimately be performed end-to-end by a neural network, with no hand-designed representations or algorithms at all, and much recent research on 3D foundation models is moving in this direction. In my opinion, this is not the most important question. Spatial AI systems of the future will surely have learned and designed components so tightly integrated that it is hard to tell which is which; and this position may be reached either by adding more and more learned modules to a designed system, or by adding structure to a purely learned system. What remains important in either case, is the storage and computational structure of the whole system. If it is to have the properties that real applications demand: efficient, composable, and shareable with other devices and human users; then I believe that either method will converge on similar properties.\n\n\u003cspan id=\"S2.SS6.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### Processor Hardware of the Future\n\nThe move from CPUs to GPUs over the past 15 years as the dominant processors of AI is only the beginning of a trend. The key to efficiency in computation is to fully embrace parallelism, with work done by a very large number of relatively simple cores, but also to reduce data movement around chips and the larger systems they form. This implies a long term move towards processors with very fine-grained parallelism, and with memory distributed across processing tiles, which are connected by sparse communication channels which respect locality. These processors will also inevitably trend towards asynchronous, event-driven operation and low bit-rate or even analog representation of numbers, as these properties also maximize efficiency.\n\n\u003cspan id=\"S2.SS6.SSS0.Px4\"\u003e\u003c/span\u003e\n\n#### Mapping Spatial AI Graphs to Hardware\n\nIf processors and memory do become increasingly granular, with local memory and sparse connections between tiles, then the ‘bitter lesson’ is that algorithms which map best to these designs will perform best. The FutureMapping papers describe how the route forward is to find the graphs in data and processing structures in Spatial AI algorithms, and to as far as possible match these to hardware by essentially laying those graphs down geographically onto chips. Algorithmically, we need to focus on methods which can perform inference and learning via message passing on general, loopy graphs; a strong candidate is belief propagation which has powerful properties of distributed convergence, even with asynchronous or lossy communication.\n\nElements such as the representation of the scene around a robot have their own integral graph structure, as revealed by many SLAM approaches, and these must be designed to have efficient interfaces to the main real-time processing loops which handle live data from sensors and outputs to actuators. Also, very specialised processors will be located close to (or even within) sensors and actuators themselves, such that the communication between them can be at the abstract level of actionable information rather than large flows of data such as video.\n\nIn many ways, we may speculate that the drive towards efficient, modular implementation may drive Spatial AI systems to be increasingly like biological brains, which have huge capability with very high efficiency.\n\n\u003cspan id=\"S2.SS7\"\u003e\u003c/span\u003e\n\n### 2.7 Visual Intelligence is Embodied Intelligence (Yilun Du)\n\nIn this section, I present a perspective on visual intelligence informed by the research of our group. I argue that a central test of visual general intelligence is whether it can enable a robot to perceive, reason about, and act reliably in the physical world. Embodiment is more than a downstream application of visual intelligence: by selecting viewpoints and intervening in the world, an agent can reveal properties that are difficult to infer from passive observation alone, test its predictions, and obtain feedback with which to revise its visual model. Meeting this test requires visual systems that generalize to unfamiliar situations, integrate observations over long temporal horizons into consistent scene representations, connect visual understanding to action, actively acquire informative experience, and continue adapting after deployment. Together, these capabilities form a closed loop in which vision guides action and the consequences of action provide evidence for improving visual understanding.\n\n\u003cspan id=\"S2.SS7.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### Building Robust Visual Systems with Generative World Models.\n\nEmbodied agents will routinely encounter observations outside their training distributions, where current visual systems may fail unpredictably—and, in robotic settings, sometimes catastrophically. A central challenge for visual intelligence is therefore to generalize robustly across open-ended changes in viewpoint, environment, object configuration, and interaction.\n\n\u003cspan id=\"S2.SS7.SSS0.Px1.p2.1\"\u003e\u003c/span\u003eOne promising route toward such robustness is to construct generative world models and formulate perception as inference over the latent scene states that could have produced an observation. Because visual observations arise from recurring physical regularities—including geometry, objects, relations, and dynamics—such models can explain unfamiliar scenes by reusing and recombining previously acquired knowledge. Explicit 3D structure [[54](#bib.bib65)] and compositional structure [[22](#bib.bib66), [89](#bib.bib64), [114](#bib.bib67)] can provide useful inductive biases for data-efficient learning and systematic generalization. This approach follows the long-standing paradigm of “analysis by synthesis” [[106](#bib.bib68), [48](#bib.bib69)], in which visual understanding is achieved by inferring a latent scene explanation whose synthesized observations agree with the input. Consistent with this view, earlier work from our group showed that generative compositional models can generalize to scenes containing numbers and configurations of objects not encountered during training [[89](#bib.bib64)].\n\n\u003cspan id=\"S2.SS7.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### Constructing Consistent Scene Representations.\n\n\u003cspan id=\"S2.SS7.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eSuch inference cannot restart from each individual frame. For a robot to operate autonomously over days or longer, it must integrate a continuous stream of partial observations into a persistent and internally consistent representation of its environment. This representation must associate observations across changes in viewpoint and occlusion, preserve the identities and relationships of entities, and update as the physical world changes. Our group has explored object-centric representations that maintain individual entities over time [[23](#bib.bib76), [28](#bib.bib77)], as well as scene-level 3D memories that aggregate observations across an environment [[103](#bib.bib78)]. A key direction is to develop dynamic, hierarchical representations that connect global scene structure to objects, parts, and their relationships while tracking how each level evolves over time. These representations should support incremental updates and task-dependent retrieval at the appropriate level of abstraction. The goal is therefore not simply a persistent map, but a revisable scene representation that supports prediction, action, and targeted information gathering.\n\n\u003cspan id=\"S2.SS7.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### Connecting Visual Intelligence to Action.\n\n\u003cspan id=\"S2.SS7.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eUltimately, visual intelligence should provide the task-relevant understanding needed for a robot to act, interact, and explore. Visual plans need not reproduce every aspect of an observation with equal fidelity, but they must preserve distinctions that change the actions available to the robot or the outcome of a task. Our group has explored this connection by formulating decision-making as conditional visual generation [[24](#bib.bib74), [112](#bib.bib79), [12](#bib.bib75)]. In this framework, a generative model proposes a high-level visual trajectory representing how a task could be completed, while a separate low-level controller grounds that trajectory into continuous robot actions. This decomposition allows visual generation to express task-level intent and anticipated physical evolution while delegating precise execution to the controller. Comparing predicted and observed outcomes then turns execution into a test of both the plan and the visual world model.\n\n\u003cspan id=\"S2.SS7.SSS0.Px4\"\u003e\u003c/span\u003e\n\n#### Active Visual Learning.\n\nAction is not only an output of visual intelligence; it is also a means of obtaining visual evidence. By moving to informative viewpoints and physically interacting with objects, a robot can resolve perceptual ambiguities and reveal properties, affordances, and dynamics that passive observation may leave uncertain. Changing viewpoint can resolve occlusion, while pushing, lifting, or opening an object can provide evidence about its articulation, stability, and physical behavior. Such interactions can also expose limitations in the robot’s current visual model.\n\n\u003cspan id=\"S2.SS7.SSS0.Px4.p2.1\"\u003e\u003c/span\u003eClassic evidence from biological vision supports the importance of coupling perception with self-generated action. In Held and Hein’s experiment, pairs of kittens received closely matched visual input, but only the kittens whose own movements controlled that input developed normal visually guided behavior [[39](#bib.bib70)]. Earlier work from our group explored an initial step toward active visual learning by training a curiosity-driven policy to seek regions of an environment that maximize surprisal under a learned visual representation model [[21](#bib.bib63)]. Such targeted interaction makes action a mechanism for selecting the experience from which the visual system learns.\n\n\u003cspan id=\"S2.SS7.SSS0.Px5\"\u003e\u003c/span\u003e\n\n#### Continually Adapting Visual Intelligence.\n\nActive exploration is valuable only if the resulting evidence can be incorporated into the visual model. A robot will inevitably encounter unfamiliar objects, materials, and visual phenomena—for example, transparent or refractive surfaces—that are not adequately represented in its initial training data. Its visual system should therefore remain plastic after deployment, continually revising its representations and world model in light of new experience.\n\n\u003cspan id=\"S2.SS7.SSS0.Px5.p2.1\"\u003e\u003c/span\u003eRecent work from our group explores preliminary mechanisms for such self-improvement: SILVR improves a video-based robotic planner using trajectories generated through the agent’s own interactions [[60](#bib.bib71)], while World Action Verifier uses detected prediction failures to guide targeted data collection and world-model refinement [[58](#bib.bib72)]. A central challenge is to incorporate genuinely new experience without catastrophically forgetting previously acquired knowledge [[65](#bib.bib73)]. One promising direction is a “wake–sleep” process that separates online interaction and experience gathering from periodic knowledge consolidation. Together, these components form a closed visual learning loop: infer structured scene explanations, maintain them over time, predict how the visual world will evolve under action, intervene to obtain informative evidence, and revise the model when prediction and observation disagree.\n\n\u003cspan id=\"S2.SS8\"\u003e\u003c/span\u003e\n\n### 2.8 Seeing the Physical World via Code (Shangzhe Wu \u0026 Jiajun Wu)\n\n\u003cspan id=\"S2.SS8.p1.1\"\u003e\u003c/span\u003eOne way to think about visual intelligence is as the recovery of the structure, or code, of the physical world from visual observations. An image is a measurement of a physical phenomenon: a scene consists of objects with particular shapes and materials, illuminated in a particular way, observed from a particular viewpoint, and moving and interacting under physical laws. The image records only the light that this arrangement happens to send toward the camera. Seeing, on this view, is an attempt to invert that measurement—to infer, from the recorded light, the underlying scene that gave rise to it. The framing is a long-standing one in vision [[64](#bib.bib53), [36](#bib.bib5), [67](#bib.bib4), [106](#bib.bib68)], and it is broadly the one our own research has followed.\n\n\u003cspan id=\"S2.SS8.p2.1\"\u003e\u003c/span\u003eThe appeal of this framing is that what it recovers remains valid beyond the conditions under which it was observed. Suppose a system has determined that a scene contains a mug of a certain shape and material resting on a table. It is then poised to answer questions, often counterfactual, that were never posed during training: what the mug looks like from behind, what happens if the table is tilted, where a hand should be placed to pick it up. A system that has instead learned the statistics of how mugs on tables tend to appear may well answer some of these correctly, but it has no particular reason to. Structure of this kind is what allows a modest number of observations to support an open-ended range of predictions and actions [[99](#bib.bib82), [98](#bib.bib83)].\n\n\u003cspan id=\"S2.SS8.p3.1\"\u003e\u003c/span\u003eThis also shapes how we think about the relationship between vision and language. Language is already an abstraction over experience: it records what people have found worth describing to one another, in the vocabulary they happened to develop. A good deal of how the physical world behaves has never been described in this way—how a particular stroller folds, how dough responds to a rolling pin, how a rose opens and then collapses over the course of a few weeks [[33](#bib.bib87)]. Visual observations carry this information regardless of whether anyone has named it, which seems to us a reason to treat vision as a source of world structure in its own right, rather than primarily as an input channel to a language model.\n\n\u003cspan id=\"S2.SS8.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### What structure means.\n\n\u003cspan id=\"S2.SS8.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eIt helps to be specific about what this structure of the physical world consists of. First, *entities*: a scene decomposes into objects, and objects decompose into parts, recursively. Second, *intrinsics*: the properties belonging to an object itself rather than to the circumstances under which it is observed—its geometry, its texture, its material, how its parts are jointed and how far they can move, and physical properties such as mass, friction, and stiffness [[109](#bib.bib86), [100](#bib.bib84), [55](#bib.bib85), [18](#bib.bib88), [52](#bib.bib89), [53](#bib.bib103), [32](#bib.bib104), [96](#bib.bib90), [33](#bib.bib87)]. Third, *extrinsics*: pose, illumination, and camera, which account for a large share of the variation in the pixels while leaving the objects themselves unchanged, and which are therefore worth factoring out. Fourth, *relations*: which object supports which, which part turns which, what is contained in what. Fifth, *dynamics*: how the state of a scene changes when something acts on it [[95](#bib.bib91), [61](#bib.bib105), [1](#bib.bib92)].\n\nThis decomposition is by no means exhaustive; it is simply the one that has been productive in our own work. It says what should be recovered, not how it should be encoded: a joint axis may be an explicit parameter or a direction implicit in a network’s weights. What is appealing about such a decomposition is that it allows a system to predict precisely the effect of an action: once it represents a joint axis, it can say what happens when the door is pulled; once it represents mass and friction, what happens when the stack is nudged. A representation that leaves these quantities entangled may still reproduce the appearance of a scene very well, while supporting neither.\n\n\u003cspan id=\"S2.SS8.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### Structure at scale.\n\n\u003cspan id=\"S2.SS8.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eProgress over the past few years suggests that recovering such structure will require scale, as the visual world is far too varied to be covered by models specified by hand. The more interesting question is what that scale is spent on. Much of it currently goes into generative models trained to predict pixels, which are judged largely by how plausible their outputs look. That criterion is silent on whether shape, material, articulation, or physical properties are represented at all. A video model that renders a convincing falling cup has shown that it knows what falling cups look like; it has not shown that mass, contact, or friction appear anywhere inside it. The gap is hard to detect when evaluation rewards perceptual quality, and becomes evident as soon as one wants to intervene, edit, or act [[25](#bib.bib93), [87](#bib.bib94)].\n\n\u003cspan id=\"S2.SS8.SSS0.Px2.p2.1\"\u003e\u003c/span\u003eWhether these quantities eventually emerge from pixel prediction alone, given enough data and compute, remains an open question. Our own work has taken the other route, treating the structure as an explicit target of learning rather than as a by-product of another objective. The physical world is compositional—objects made of parts, scenes made of objects, motions made of joint rotations—so a system that recovers these pieces should be able to reuse them in new combinations, and the hundredth object should cost less than the first. Modelling appearance alone offers less of this, since each new configuration may have to be captured on its own terms. The standard objection to this route is that structured representations do not scale, largely because so much of the structure has had to be put in by hand, and hand-built components do not improve as data and compute grow [[78](#bib.bib29)]. We would suggest that this is a limitation of how the structure is obtained rather than of structure itself, which puts the weight on how structure is represented and on where it comes from.\n\n\u003cspan id=\"S2.SS8.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### Some structure is best written down, and some is not.\n\nAt one extreme, the representation is entirely continuous: the scene becomes a collection of vectors produced by a network. This is expressive and easy to optimize, but no part of it can be explicitly read, edited, or verified. At the other, it is entirely discrete and named: the scene is a mug, resting on a table, with a handle that turns about a given axis. This can be read, edited, and verified, but it reaches only as far as its vocabulary.\n\n\u003cspan id=\"S2.SS8.SSS0.Px3.p2.1\"\u003e\u003c/span\u003eAn effective representation will need to capture both [[108](#bib.bib96), [62](#bib.bib97), [44](#bib.bib98), [97](#bib.bib95)]. Structure that is discrete and relational—which parts exist, how many, how they are arranged, what connects to what—is naturally written as a program or in words. Structure that is continuous and hard to name—the exact geometry of a leaf, the precise appearance of a glazed ceramic—is better left as a learned embedding. The Scene Language [[108](#bib.bib96)] is one concrete instance: a scene is represented by a program giving its hierarchical structure, words naming the semantic class of each entity, and embeddings capturing the visual identity of each one. The same idea underlies our work on neuro-symbolic concepts, where a concept such as “left of” or “put down” is stored jointly as a symbolic program and a neural network grounded in perception and action [[62](#bib.bib97), [44](#bib.bib98), [63](#bib.bib99)].\n\n\u003cspan id=\"S2.SS8.SSS0.Px4\"\u003e\u003c/span\u003e\n\n#### Coding agents as authors of structure.\n\n\u003cspan id=\"S2.SS8.SSS0.Px4.p1.1\"\u003e\u003c/span\u003eMuch of the structure described above can be written as a program. Objects are hierarchical, so programs nest; parts repeat, so programs loop; joints have limits and parts have constraints, so programs take parameters and assertions. LLM agents have recently become excellent at exactly this: they can write a program, run it, read the error, and try again, with enough reliability to be reshaping the software industry. If physical structure can be expressed as code, then systems that are good at writing code may also be good at building models of objects and scenes [[113](#bib.bib100), [76](#bib.bib101)].\n\n\u003cspan id=\"S2.SS8.SSS0.Px4.p2.1\"\u003e\u003c/span\u003eThat competence rests on a fundamental property of code itself: it runs and can be validated. A program compiles or it does not, passes its tests or it does not, and this automatic check is what makes coding something an agent can be trained to do well. The property carries over when the program describes an object rather than a piece of software. Such a program can be executed, rendered, and simulated, and its output compared against the image it was meant to explain or the motion the object is meant to have. A proposed structure can therefore be corrected rather than merely produced. Agents already write code that produces articulated 3D assets across hundreds of categories [[113](#bib.bib100)], and code that drives robots through manipulation tasks, improving as execution feedback and visual comparison are returned to them [[29](#bib.bib102)]. How far the idea extends is open. Present-day agents lean heavily on the abstractions handed to them and on a language model’s prior knowledge of how everyday objects are built and how they work, and they degrade as those priors are withdrawn [[29](#bib.bib102)]. Whether such abstractions can instead be extracted from what is being observed, rather than what is supplied in advance, seems to us the question that matters most.\n\n\u003cspan id=\"S2.SS9\"\u003e\u003c/span\u003e\n\n### 2.9 From Visual Models to Vision-Native Intelligence (Zhuang Liu)\n\nIn this section, I do not aim to provide a complete theory of visual general intelligence. Some points may be familiar, and some are speculative. I include them because they reflect a few beliefs shaped by my own research taste: simple scalable methods, empirical understanding of models, and the role of data and evaluation. Even as visual models become stronger, many AI systems still use vision mostly as an attachment to language. I would like to think about VGI in a more vision-native way, where vision is a natural channel for acquiring context and providing timely feedback.\n\n\u003cspan id=\"S2.SS9.SSS0.Px1\"\u003e\u003c/span\u003e\n\n#### Why vision looks less central today.\n\nHuman vision is an extremely strong baseline. It has been shaped by a long evolutionary process, and most people use it with little conscious effort. We recognize objects, navigate cluttered environments, and correct our actions through visual feedback almost continuously. This may partly explain why language progress looks so striking. In language, AI systems compete against a more variable and culturally trained human baseline. In vision, they compete against one of biology’s most mature intelligence systems.\n\nThis does not make vision less important. It suggests the opposite. Vision is one of the main ways humans experience and organize the world. Human thought is often expressed in language, but many internal cognitive processes are visual or spatial. We imagine scenes, reason about object relations, and plan actions in ways that are not naturally text-token-like. I do not know whether this is the missing ingredient in current AI systems. But I suspect that text-dominated training may miss an important kind of experience: grounded, spatial, continuous, and action-oriented visual experience.\n\n\u003cspan id=\"S2.SS9.SSS0.Px2\"\u003e\u003c/span\u003e\n\n#### Why scaling vision is different from scaling language.\n\n\u003cspan id=\"S2.SS9.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eA central difficulty is that vision does not come with symbolic units in the same way language does. Language has a relatively clear hierarchy: words, phrases, sentences, and documents. Modern language models use subword tokens, but these tokens are still built on top of a symbolic system that humans already created. Language is therefore not raw experience; it is a compressed form of human experience. Vision is different. Pixels are too low-level to be units of intelligence. Patches are engineering conveniences rather than perceptual primitives. Human visual understanding seems object-centric and hierarchical, involving scenes, objects, parts, and relations [[64](#bib.bib53), [34](#bib.bib54)]. Yet there is no agreed-upon hierarchy for vision comparable to the hierarchy of language.\n\nThis makes visual learning especially expensive. A short piece of text can summarize what happened in a room, but the corresponding visual stream contains far more information: appearance, motion, geometry, lighting, and local details that may or may not matter. Vision has no equivalent compression layer. Without useful intermediate units, visual learning must discover what to keep, what to ignore, and how to compress the input on its own. Earlier vision systems imposed tasks such as detection, segmentation, or depth estimation. These abstractions are useful, but they are not equivalent to language tokens. A bounding box or a mask is not comparable to a word or a sentence in expressive flexibility. I therefore do not think the answer is to manually design a fixed visual vocabulary. Some forms of visual intelligence may require several orders of magnitude more effective compute and data processing than language pre-training, perhaps 1,000x or even 10,000x in some settings, before the right abstractions emerge naturally.\n\n\u003cspan id=\"S2.SS9.SSS0.Px2.p3.1\"\u003e\u003c/span\u003eThe visual world can be decomposed into arbitrarily fine details, but not all details are useful. Representing everything at the finest possible granularity would waste enormous compute. Representing everything too coarsely would miss what matters. The useful unit of visual perception is therefore task-dependent. A visual system should keep coarse representations for irrelevant regions and allocate fine-grained representations to task-relevant regions. In this sense, the problem of visual units is inseparable from the problem of where to look. This view is consistent with active vision and visual routines, where perception is an active process of selecting and organizing information for behavior [[104](#bib.bib55), [83](#bib.bib56), [4](#bib.bib57)].\n\nThis is not an argument against scaling. In fact, I am a believer in scaling. In my own research experience, the simplest approaches often work best when they have the right data, the right objective, and enough scale. I therefore do not want to argue that we should hand-design visual units, attention policies, or active perception modules. With enough compute, sufficiently large models, and sufficiently diverse visual experience, many aspects of adaptive visual abstraction and where-to-look behavior may emerge without explicit engineering. The question is not scale versus structure, but what kind of scale is needed for the right structures to emerge, and how to make that scaling efficient enough to be practical.\n\n\u003cspan id=\"S2.SS9.SSS0.Px3\"\u003e\u003c/span\u003e\n\n#### What this suggests for VGI.\n\n\u003cspan id=\"S2.SS9.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eRaw scale is not the same as visual diversity. More images or videos do not necessarily produce broader visual experience if the data is repetitive, narrow, or biased. Large-scale visual datasets are not automatically diverse. Even datasets that appear broad can contain strong dataset-specific signatures, and understanding these biases is part of understanding what visual experience our models actually receive [[59](#bib.bib58), [107](#bib.bib59)]. Besides improving model skill and scaling compute, we should better understand what kinds of visual experience our datasets provide, what they miss, and how to curate data that is broader, less biased, and more useful for learning general visual abstractions.\n\n\u003cspan id=\"S2.SS9.SSS0.Px3.p2.1\"\u003e\u003c/span\u003eMost current systems are not designed around vision as a continuous or low-friction channel of context. They require users to manually capture visual information, upload it, and explain why it matters. A more vision-native system would invert this relationship. It would treat visual context as part of the natural interaction between the system, the user, and the world. This becomes especially important as AI systems become more autonomous and world-facing. A robot, a laboratory assistant, or a medical system cannot rely on humans to continuously describe the state of the world [[20](#bib.bib60)]. It must perceive for itself, decide what matters, detect changes, and use feedback to correct its actions. Vision is not behind language in importance; it is behind language in current interface visibility.\n\nI hope future work on VGI will move beyond static image or video question answering. We should ask not only what a model can infer from a given visual input, but whether it knows what it needs to see next. We should also evaluate adaptive visual abstraction: the ability to keep irrelevant regions coarse while inspecting task-relevant details. For me, the key test is simple: can a visual system learn when to look, where to look, and how much detail it needs?\n\n\u003cspan id=\"S2.SS10\"\u003e\u003c/span\u003e\n\n### 2.10 Visual intelligence towards general intelligence (Hirokatsu Kataoka *et al.*)\n\nWe view visual intelligence as the capacity to acquire usable knowledge of the world from visual experience and apply it to prediction, imagination, reconstruction, and new tasks. In this sense, visual intelligence is intelligence that emerges from visual experience: the ability to learn usable structure of the observable world from partial visual observations, understand its hidden structure, predict what may happen next, reconstruct what is not directly observed, imagine possible alternatives, and generalise such knowledge to new visual tasks. It is not simply a stronger image classifier, nor simply a visual encoder connected to an LLM.\n\nOne important consequence of this view is that human vision should not be the upper bound of visual intelligence. A system exposed to richer-than-human visual information may acquire intelligence that goes beyond human-centered vision. The goal of visual intelligence is not to imitate human perception, but to ask what kind of intelligence can emerge when machines learn from visual experience at a scale, diversity, and precision that humans cannot access. This view also suggests a common analogy across humans, animals, and machines. Biological organisms can exhibit intelligent behavior without language by sensing the world, discovering regularities, predicting, and acting. Vision and perception existed long before symbolic language, and it is plausible that intelligence-like functions can emerge without language. The critical question for vision research is whether a sufficiently powerful visual system can acquire internal knowledge of the world and elicit intelligent behaviour from it.\n\nIf a model understands the world deeply enough, many abilities may already be latent inside the model. The remaining problem may be how to elicit them. This is one of the most important lessons from the development of language models: a model trained with a simple autoregressive objective over large-scale text could perform new tasks when given only a few examples in context. The visual analogue may be true visual in-context learning. A model would be shown a few visual examples of a new task, infer the task structure, infer the appropriate output format, and
