xplicit 3D structure [\u003ca href=\"#bib.bib65\"\u003e54\u003c/a\u003e] and compositional structure [\u003ca href=\"#bib.bib66\"\u003e22\u003c/a\u003e, \u003ca href=\"#bib.bib64\"\u003e89\u003c/a\u003e, \u003ca href=\"#bib.bib67\"\u003e114\u003c/a\u003e] can provide useful inductive biases for data-efficient learning and systematic generalization. This approach follows the long-standing paradigm of “analysis by synthesis” [\u003ca href=\"#bib.bib68\"\u003e106\u003c/a\u003e, \u003ca href=\"#bib.bib69\"\u003e48\u003c/a\u003e], in which visual understanding is achieved by inferring a latent scene explanation whose synthesized observations agree with the input. Consistent with this view, earlier work from our group showed that generative compositional models can generalize to scenes containing numbers and configurations of objects not encountered during training [\u003ca href=\"#bib.bib64\"\u003e89\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"constructing-consistent-scene-representations\"\u003eConstructing Consistent Scene Representations.\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eSuch inference cannot restart from each individual frame. For a robot to operate autonomously over days or longer, it must integrate a continuous stream of partial observations into a persistent and internally consistent representation of its environment. This representation must associate observations across changes in viewpoint and occlusion, preserve the identities and relationships of entities, and update as the physical world changes. Our group has explored object-centric representations that maintain individual entities over time [\u003ca href=\"#bib.bib76\"\u003e23\u003c/a\u003e, \u003ca href=\"#bib.bib77\"\u003e28\u003c/a\u003e], as well as scene-level 3D memories that aggregate observations across an environment [\u003ca href=\"#bib.bib78\"\u003e103\u003c/a\u003e]. A key direction is to develop dynamic, hierarchical representations that connect global scene structure to objects, parts, and their relationships while tracking how each level evolves over time. These representations should support incremental updates and task-dependent retrieval at the appropriate level of abstraction. The goal is therefore not simply a persistent map, but a revisable scene representation that supports prediction, action, and targeted information gathering.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px3\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"connecting-visual-intelligence-to-action\"\u003eConnecting Visual Intelligence to Action.\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eUltimately, visual intelligence should provide the task-relevant understanding needed for a robot to act, interact, and explore. Visual plans need not reproduce every aspect of an observation with equal fidelity, but they must preserve distinctions that change the actions available to the robot or the outcome of a task. Our group has explored this connection by formulating decision-making as conditional visual generation [\u003ca href=\"#bib.bib74\"\u003e24\u003c/a\u003e, \u003ca href=\"#bib.bib79\"\u003e112\u003c/a\u003e, \u003ca href=\"#bib.bib75\"\u003e12\u003c/a\u003e]. In this framework, a generative model proposes a high-level visual trajectory representing how a task could be completed, while a separate low-level controller grounds that trajectory into continuous robot actions. This decomposition allows visual generation to express task-level intent and anticipated physical evolution while delegating precise execution to the controller. Comparing predicted and observed outcomes then turns execution into a test of both the plan and the visual world model.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px4\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"active-visual-learning\"\u003eActive Visual Learning.\u003c/h4\u003e\n\u003cp\u003eAction is not only an output of visual intelligence; it is also a means of obtaining visual evidence. By moving to informative viewpoints and physically interacting with objects, a robot can resolve perceptual ambiguities and reveal properties, affordances, and dynamics that passive observation may leave uncertain. Changing viewpoint can resolve occlusion, while pushing, lifting, or opening an object can provide evidence about its articulation, stability, and physical behavior. Such interactions can also expose limitations in the robot’s current visual model.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px4.p2.1\"\u003e\u003c/span\u003eClassic evidence from biological vision supports the importance of coupling perception with self-generated action. In Held and Hein’s experiment, pairs of kittens received closely matched visual input, but only the kittens whose own movements controlled that input developed normal visually guided behavior [\u003ca href=\"#bib.bib70\"\u003e39\u003c/a\u003e]. Earlier work from our group explored an initial step toward active visual learning by training a curiosity-driven policy to seek regions of an environment that maximize surprisal under a learned visual representation model [\u003ca href=\"#bib.bib63\"\u003e21\u003c/a\u003e]. Such targeted interaction makes action a mechanism for selecting the experience from which the visual system learns.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px5\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"continually-adapting-visual-intelligence\"\u003eContinually Adapting Visual Intelligence.\u003c/h4\u003e\n\u003cp\u003eActive exploration is valuable only if the resulting evidence can be incorporated into the visual model. A robot will inevitably encounter unfamiliar objects, materials, and visual phenomena—for example, transparent or refractive surfaces—that are not adequately represented in its initial training data. Its visual system should therefore remain plastic after deployment, continually revising its representations and world model in light of new experience.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px5.p2.1\"\u003e\u003c/span\u003eRecent work from our group explores preliminary mechanisms for such self-improvement: SILVR improves a video-based robotic planner using trajectories generated through the agent’s own interactions [\u003ca href=\"#bib.bib71\"\u003e60\u003c/a\u003e], while World Action Verifier uses detected prediction failures to guide targeted data collection and world-model refinement [\u003ca href=\"#bib.bib72\"\u003e58\u003c/a\u003e]. A central challenge is to incorporate genuinely new experience without catastrophically forgetting previously acquired knowledge [\u003ca href=\"#bib.bib73\"\u003e65\u003c/a\u003e]. One promising direction is a “wake–sleep” process that separates online interaction and experience gathering from periodic knowledge consolidation. Together, these components form a closed visual learning loop: infer structured scene explanations, maintain them over time, predict how the visual world will evolve under action, intervene to obtain informative evidence, and revise the model when prediction and observation disagree.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"28-seeing-the-physical-world-via-code-shangzhe-wu-jiajun-wu\"\u003e2.8 Seeing the Physical World via Code (Shangzhe Wu \u0026amp; Jiajun Wu)\u003c/h3\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.p1.1\"\u003e\u003c/span\u003eOne way to think about visual intelligence is as the recovery of the structure, or code, of the physical world from visual observations. An image is a measurement of a physical phenomenon: a scene consists of objects with particular shapes and materials, illuminated in a particular way, observed from a particular viewpoint, and moving and interacting under physical laws. The image records only the light that this arrangement happens to send toward the camera. Seeing, on this view, is an attempt to invert that measurement—to infer, from the recorded light, the underlying scene that gave rise to it. The framing is a long-standing one in vision [\u003ca href=\"#bib.bib53\"\u003e64\u003c/a\u003e, \u003ca href=\"#bib.bib5\"\u003e36\u003c/a\u003e, \u003ca href=\"#bib.bib4\"\u003e67\u003c/a\u003e, \u003ca href=\"#bib.bib68\"\u003e106\u003c/a\u003e], and it is broadly the one our own research has followed.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.p2.1\"\u003e\u003c/span\u003eThe appeal of this framing is that what it recovers remains valid beyond the conditions under which it was observed. Suppose a system has determined that a scene contains a mug of a certain shape and material resting on a table. It is then poised to answer questions, often counterfactual, that were never posed during training: what the mug looks like from behind, what happens if the table is tilted, where a hand should be placed to pick it up. A system that has instead learned the statistics of how mugs on tables tend to appear may well answer some of these correctly, but it has no particular reason to. Structure of this kind is what allows a modest number of observations to support an open-ended range of predictions and actions [\u003ca href=\"#bib.bib82\"\u003e99\u003c/a\u003e, \u003ca href=\"#bib.bib83\"\u003e98\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.p3.1\"\u003e\u003c/span\u003eThis also shapes how we think about the relationship between vision and language. Language is already an abstraction over experience: it records what people have found worth describing to one another, in the vocabulary they happened to develop. A good deal of how the physical world behaves has never been described in this way—how a particular stroller folds, how dough responds to a rolling pin, how a rose opens and then collapses over the course of a few weeks [\u003ca href=\"#bib.bib87\"\u003e33\u003c/a\u003e]. Visual observations carry this information regardless of whether anyone has named it, which seems to us a reason to treat vision as a source of world structure in its own right, rather than primarily as an input channel to a language model.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"what-structure-means\"\u003eWhat structure means.\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eIt helps to be specific about what this structure of the physical world consists of. First, \u003cem\u003eentities\u003c/em\u003e: a scene decomposes into objects, and objects decompose into parts, recursively. Second, \u003cem\u003eintrinsics\u003c/em\u003e: the properties belonging to an object itself rather than to the circumstances under which it is observed—its geometry, its texture, its material, how its parts are jointed and how far they can move, and physical properties such as mass, friction, and stiffness [\u003ca href=\"#bib.bib86\"\u003e109\u003c/a\u003e, \u003ca href=\"#bib.bib84\"\u003e100\u003c/a\u003e, \u003ca href=\"#bib.bib85\"\u003e55\u003c/a\u003e, \u003ca href=\"#bib.bib88\"\u003e18\u003c/a\u003e, \u003ca href=\"#bib.bib89\"\u003e52\u003c/a\u003e, \u003ca href=\"#bib.bib103\"\u003e53\u003c/a\u003e, \u003ca href=\"#bib.bib104\"\u003e32\u003c/a\u003e, \u003ca href=\"#bib.bib90\"\u003e96\u003c/a\u003e, \u003ca href=\"#bib.bib87\"\u003e33\u003c/a\u003e]. Third, \u003cem\u003eextrinsics\u003c/em\u003e: pose, illumination, and camera, which account for a large share of the variation in the pixels while leaving the objects themselves unchanged, and which are therefore worth factoring out. Fourth, \u003cem\u003erelations\u003c/em\u003e: which object supports which, which part turns which, what is contained in what. Fifth, \u003cem\u003edynamics\u003c/em\u003e: how the state of a scene changes when something acts on it [\u003ca href=\"#bib.bib91\"\u003e95\u003c/a\u003e, \u003ca href=\"#bib.bib105\"\u003e61\u003c/a\u003e, \u003ca href=\"#bib.bib92\"\u003e1\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003eThis decomposition is by no means exhaustive; it is simply the one that has been productive in our own work. It says what should be recovered, not how it should be encoded: a joint axis may be an explicit parameter or a direction implicit in a network’s weights. What is appealing about such a decomposition is that it allows a system to predict precisely the effect of an action: once it represents a joint axis, it can say what happens when the door is pulled; once it represents mass and friction, what happens when the stack is nudged. A representation that leaves these quantities entangled may still reproduce the appearance of a scene very well, while supporting neither.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"structure-at-scale\"\u003eStructure at scale.\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eProgress over the past few years suggests that recovering such structure will require scale, as the visual world is far too varied to be covered by models specified by hand. The more interesting question is what that scale is spent on. Much of it currently goes into generative models trained to predict pixels, which are judged largely by how plausible their outputs look. That criterion is silent on whether shape, material, articulation, or physical properties are represented at all. A video model that renders a convincing falling cup has shown that it knows what falling cups look like; it has not shown that mass, contact, or friction appear anywhere inside it. The gap is hard to detect when evaluation rewards perceptual quality, and becomes evident as soon as one wants to intervene, edit, or act [\u003ca href=\"#bib.bib93\"\u003e25\u003c/a\u003e, \u003ca href=\"#bib.bib94\"\u003e87\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px2.p2.1\"\u003e\u003c/span\u003eWhether these quantities eventually emerge from pixel prediction alone, given enough data and compute, remains an open question. Our own work has taken the other route, treating the structure as an explicit target of learning rather than as a by-product of another objective. The physical world is compositional—objects made of parts, scenes made of objects, motions made of joint rotations—so a system that recovers these pieces should be able to reuse them in new combinations, and the hundredth object should cost less than the first. Modelling appearance alone offers less of this, since each new configuration may have to be captured on its own terms. The standard objection to this route is that structured representations do not scale, largely because so much of the structure has had to be put in by hand, and hand-built components do not improve as data and compute grow [\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e]. We would suggest that this is a limitation of how the structure is obtained rather than of structure itself, which puts the weight on how structure is represented and on where it comes from.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px3\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"some-structure-is-best-written-down-and-some-is-not\"\u003eSome structure is best written down, and some is not.\u003c/h4\u003e\n\u003cp\u003eAt one extreme, the representation is entirely continuous: the scene becomes a collection of vectors produced by a network. This is expressive and easy to optimize, but no part of it can be explicitly read, edited, or verified. At the other, it is entirely discrete and named: the scene is a mug, resting on a table, with a handle that turns about a given axis. This can be read, edited, and verified, but it reaches only as far as its vocabulary.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px3.p2.1\"\u003e\u003c/span\u003eAn effective representation will need to capture both [\u003ca href=\"#bib.bib96\"\u003e108\u003c/a\u003e, \u003ca href=\"#bib.bib97\"\u003e62\u003c/a\u003e, \u003ca href=\"#bib.bib98\"\u003e44\u003c/a\u003e, \u003ca href=\"#bib.bib95\"\u003e97\u003c/a\u003e]. Structure that is discrete and relational—which parts exist, how many, how they are arranged, what connects to what—is naturally written as a program or in words. Structure that is continuous and hard to name—the exact geometry of a leaf, the precise appearance of a glazed ceramic—is better left as a learned embedding. The Scene Language [\u003ca href=\"#bib.bib96\"\u003e108\u003c/a\u003e] is one concrete instance: a scene is represented by a program giving its hierarchical structure, words naming the semantic class of each entity, and embeddings capturing the visual identity of each one. The same idea underlies our work on neuro-symbolic concepts, where a concept such as “left of” or “put down” is stored jointly as a symbolic program and a neural network grounded in perception and action [\u003ca href=\"#bib.bib97\"\u003e62\u003c/a\u003e, \u003ca href=\"#bib.bib98\"\u003e44\u003c/a\u003e, \u003ca href=\"#bib.bib99\"\u003e63\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px4\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"coding-agents-as-authors-of-structure\"\u003eCoding agents as authors of structure.\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px4.p1.1\"\u003e\u003c/span\u003eMuch of the structure described above can be written as a program. Objects are hierarchical, so programs nest; parts repeat, so programs loop; joints have limits and parts have constraints, so programs take parameters and assertions. LLM agents have recently become excellent at exactly this: they can write a program, run it, read the error, and try again, with enough reliability to be reshaping the software industry. If physical structure can be expressed as code, then systems that are good at writing code may also be good at building models of objects and scenes [\u003ca href=\"#bib.bib100\"\u003e113\u003c/a\u003e, \u003ca href=\"#bib.bib101\"\u003e76\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px4.p2.1\"\u003e\u003c/span\u003eThat competence rests on a fundamental property of code itself: it runs and can be validated. A program compiles or it does not, passes its tests or it does not, and this automatic check is what makes coding something an agent can be trained to do well. The property carries over when the program describes an object rather than a piece of software. Such a program can be executed, rendered, and simulated, and its output compared against the image it was meant to explain or the motion the object is meant to have. A proposed structure can therefore be corrected rather than merely produced. Agents already write code that produces articulated 3D assets across hundreds of categories [\u003ca href=\"#bib.bib100\"\u003e113\u003c/a\u003e], and code that drives robots through manipulation tasks, improving as execution feedback and visual comparison are returned to them [\u003ca href=\"#bib.bib102\"\u003e29\u003c/a\u003e]. How far the idea extends is open. Present-day agents lean heavily on the abstractions handed to them and on a language model’s prior knowledge of how everyday objects are built and how they work, and they degrade as those priors are withdrawn [\u003ca href=\"#bib.bib102\"\u003e29\u003c/a\u003e]. Whether such abstractions can instead be extracted from what is being observed, rather than what is supplied in advance, seems to us the question that matters most.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"29-from-visual-models-to-vision-native-intelligence-zhuang-liu\"\u003e2.9 From Visual Models to Vision-Native Intelligence (Zhuang Liu)\u003c/h3\u003e\n\u003cp\u003eIn this section, I do not aim to provide a complete theory of visual general intelligence. Some points may be familiar, and some are speculative. I include them because they reflect a few beliefs shaped by my own research taste: simple scalable methods, empirical understanding of models, and the role of data and evaluation. Even as visual models become stronger, many AI systems still use vision mostly as an attachment to language. I would like to think about VGI in a more vision-native way, where vision is a natural channel for acquiring context and providing timely feedback.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"why-vision-looks-less-central-today\"\u003eWhy vision looks less central today.\u003c/h4\u003e\n\u003cp\u003eHuman vision is an extremely strong baseline. It has been shaped by a long evolutionary process, and most people use it with little conscious effort. We recognize objects, navigate cluttered environments, and correct our actions through visual feedback almost continuously. This may partly explain why language progress looks so striking. In language, AI systems compete against a more variable and culturally trained human baseline. In vision, they compete against one of biology’s most mature intelligence systems.\u003c/p\u003e\n\u003cp\u003eThis does not make vision less important. It suggests the opposite. Vision is one of the main ways humans experience and organize the world. Human thought is often expressed in language, but many internal cognitive processes are visual or spatial. We imagine scenes, reason about object relations, and plan actions in ways that are not naturally text-token-like. I do not know whether this is the missing ingredient in current AI systems. But I suspect that text-dominated training may miss an important kind of experience: grounded, spatial, continuous, and action-oriented visual experience.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"why-scaling-vision-is-different-from-scaling-language\"\u003eWhy scaling vision is different from scaling language.\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eA central difficulty is that vision does not come with symbolic units in the same way language does. Language has a relatively clear hierarchy: words, phrases, sentences, and documents. Modern language models use subword tokens, but these tokens are still built on top of a symbolic system that humans already created. Language is therefore not raw experience; it is a compressed form of human experience. Vision is different. Pixels are too low-level to be units of intelligence. Patches are engineering conveniences rather than perceptual primitives. Human visual understanding seems object-centric and hierarchical, involving scenes, objects, parts, and relations [\u003ca href=\"#bib.bib53\"\u003e64\u003c/a\u003e, \u003ca href=\"#bib.bib54\"\u003e34\u003c/a\u003e]. Yet there is no agreed-upon hierarchy for vision comparable to the hierarchy of language.\u003c/p\u003e\n\u003cp\u003eThis makes visual learning especially expensive. A short piece of text can summarize what happened in a room, but the corresponding visual stream contains far more information: appearance, motion, geometry, lighting, and local details that may or may not matter. Vision has no equivalent compression layer. Without useful intermediate units, visual learning must discover what to keep, what to ignore, and how to compress the input on its own. Earlier vision systems imposed tasks such as detection, segmentation, or depth estimation. These abstractions are useful, but they are not equivalent to language tokens. A bounding box or a mask is not comparable to a word or a sentence in expressive flexibility. I therefore do not think the answer is to manually design a fixed visual vocabulary. Some forms of visual intelligence may require several orders of magnitude more effective compute and data processing than language pre-training, perhaps 1,000x or even 10,000x in some settings, before the right abstractions emerge naturally.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px2.p3.1\"\u003e\u003c/span\u003eThe visual world can be decomposed into arbitrarily fine details, but not all details are useful. Representing everything at the finest possible granularity would waste enormous compute. Representing everything too coarsely would miss what matters. The useful unit of visual perception is therefore task-dependent. A visual system should keep coarse representations for irrelevant regions and allocate fine-grained representations to task-relevant regions. In this sense, the problem of visual units is inseparable from the problem of where to look. This view is consistent with active vision and visual routines, where perception is an active process of selecting and organizing information for behavior [\u003ca href=\"#bib.bib55\"\u003e104\u003c/a\u003e, \u003ca href=\"#bib.bib56\"\u003e83\u003c/a\u003e, \u003ca href=\"#bib.bib57\"\u003e4\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003eThis is not an argument against scaling. In fact, I am a believer in scaling. In my own research experience, the simplest approaches often work best when they have the right data, the right objective, and enough scale. I therefore do not want to argue that we should hand-design visual units, attention policies, or active perception modules. With enough compute, sufficiently large models, and sufficiently diverse visual experience, many aspects of adaptive visual abstraction and where-to-look behavior may emerge without explicit engineering. The question is not scale versus structure, but what kind of scale is needed for the right structures to emerge, and how to make that scaling efficient enough to be practical.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px3\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"what-this-suggests-for-vgi\"\u003eWhat this suggests for VGI.\u003c/h4\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eRaw scale is not the same as visual diversity. More images or videos do not necessarily produce broader visual experience if the data is repetitive, narrow, or biased. Large-scale visual datasets are not automatically diverse. Even datasets that appear broad can contain strong dataset-specific signatures, and understanding these biases is part of understanding what visual experience our models actually receive [\u003ca href=\"#bib.bib58\"\u003e59\u003c/a\u003e, \u003ca href=\"#bib.bib59\"\u003e107\u003c/a\u003e]. Besides improving model skill and scaling compute, we should better understand what kinds of visual experience our datasets provide, what they miss, and how to curate data that is broader, less biased, and more useful for learning general visual abstractions.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px3.p2.1\"\u003e\u003c/span\u003eMost current systems are not designed around vision as a continuous or low-friction channel of context. They require users to manually capture visual information, upload it, and explain why it matters. A more vision-native system would invert this relationship. It would treat visual context as part of the natural interaction between the system, the user, and the world. This becomes especially important as AI systems become more autonomous and world-facing. A robot, a laboratory assistant, or a medical system cannot rely on humans to continuously describe the state of the world [\u003ca href=\"#bib.bib60\"\u003e20\u003c/a\u003e]. It must perceive for itself, decide what matters, detect changes, and use feedback to correct its actions. Vision is not behind language in importance; it is behind language in current interface visibility.\u003c/p\u003e\n\u003cp\u003eI hope future work on VGI will move beyond static image or video question answering. We should ask not only what a model can infer from a given visual input, but whether it knows what it needs to see next. We should also evaluate adaptive visual abstraction: the ability to keep irrelevant regions coarse while inspecting task-relevant details. For me, the key test is simple: can a visual system learn when to look, where to look, and how much detail it needs?\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS10\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"210-visual-intelligence-towards-general-intelligence-hirokatsu-kataoka-et-al\"\u003e2.10 Visual intelligence towards general intelligence (Hirokatsu Kataoka \u003cem\u003eet al.\u003c/em\u003e)\u003c/h3\u003e\n\u003cp\u003eWe view visual intelligence as the capacity to acquire usable knowledge of the world from visual experience and apply it to prediction, imagination, reconstruction, and new tasks. In this sense, visual intelligence is intelligence that emerges from visual experience: the ability to learn usable structure of the observable world from partial visual observations, understand its hidden structure, predict what may happen next, reconstruct what is not directly observed, imagine possible alternatives, and generalise such knowledge to new visual tasks. It is not simply a stronger image classifier, nor simply a visual encoder connected to an LLM.\u003c/p\u003e\n\u003cp\u003eOne important consequence of this view is that human vision should not be the upper bound of visual intelligence. A system exposed to richer-than-human visual information may acquire intelligence that goes beyond human-centered vision. The goal of visual intelligence is not to imitate human perception, but to ask what kind of intelligence can emerge when machines learn from visual experience at a scale, diversity, and precision that humans cannot access. This view also suggests a common analogy across humans, animals, and machines. Biological organisms can exhibit intelligent behavior without language by sensing the world, discovering regularities, predicting, and acting. Vision and perception existed long before symbolic language, and it is plausible that intelligence-like functions can emerge without language. The critical question for vision research is whether a sufficiently powerful visual system can acquire internal knowledge of the world and elicit intelligent behaviour from it.\u003c/p\u003e\n\u003cp\u003eIf a model understands the world deeply enough, many abilities may already be latent inside the model. The remaining problem may be how to elicit them. This is one of the most important lessons from the development of language models: a model trained with a simple autoregressive objective over large-scale text could perform new tasks when given only a few examples in context. The visual analogue may be true visual in-context learning. A model would be shown a few visual examples of a new task, infer the task structure, infer the appropriate output format, and solve new cases without explicit retraining. In other words, if a model captures the appearance and dynamics of the world sufficiently well, visual in-context learning may make it easier to elicit new capabilities without parameter updates. Even then, a world model is necessary but not sufficient. Intelligence also requires the ability to use that model under new goals: to infer tasks, choose relevant abstractions, generate counterfactuals, adapt to new observations, and act or respond appropriately.\u003c/p\u003e\n\u003cp\u003eOur central hypothesis is that visual intelligence may emerge through the convergence of three complementary learning objectives: sequential prediction, open-ended generation, and reconstruction. These correspond to three fundamental operations of intelligence. Sequential prediction anticipates what comes next. Open-ended generation explores what could exist. Reconstruction infers hidden structure from incomplete observations. Individually, each may produce powerful models. Together, they may define a path from vision foundation models to visual intelligence, and eventually to general intelligence.\u003c/p\u003e\n\u003cp\u003eAutoregressive visual learning may become the visual counterpart of GPT. In language, next-token prediction appears simple, but successful prediction requires a model to capture grammar, semantics, facts, discourse, reasoning patterns, and task structure. In vision, predicting the next visual state may require an even richer set of latent concepts. Given an image, video, or embodied observation, the model must infer objects, geometry, motion, occlusion, physical constraints, camera movement, agent behaviour, temporal causality, and uncertainty. To predict coherently is not simply to extrapolate pixels; it is to infer the hidden structure that makes the next observation plausible. If a model can predict future visual states across diverse environments and long horizons, it is being forced to learn how the world evolves. This pressure is a natural route toward visual world modeling: the model must learn from observations, infer their structure, and anticipate what should follow.\u003c/p\u003e\n\u003cp\u003eGenerative learning is learning to imagine. Generation can impose broader modelling demands than recognition, because recognition often succeeds by detecting discriminative cues, whereas generation requires a model to represent what could exist. A high-quality generative model must learn appearance, geometry, material, lighting, motion, interaction, and plausibility. If such a model can generate high-fidelity images, videos, 3D scenes, and possible futures of the physical world, it becomes more than a content generator. It may provide a basis for an internal simulator, provided that it captures physical and temporal structure rather than appearance alone. A visual agent that can imagine can continue learning inside its own generated possibilities: it can create counterfactuals, test hypotheses, simulate consequences, and refine its understanding before acting. In this sense, imagination is not decoration. It is a mechanism for learning, understanding, and thinking.\u003c/p\u003e\n\u003cp\u003eReconstruction provides a direct route to learning hidden structure from incomplete observations. Super-resolution, image restoration, inverse rendering, depth estimation, multi-view reconstruction, 3D reconstruction, and 4D dynamic reconstruction all require the model to recover hidden causes from incomplete observations. Among these, scalable 3D reconstruction is especially important. A system that can reconstruct the world accurately from images on the fly must acquire notions of space, scale, correspondence, surfaces, objects, motion, and physical consistency. Such a system may also learn to detect anomalies, infer invisible structure, and understand why some observations are physically plausible while others are not. If reconstruction becomes dramatically stronger, it may no longer be merely a recovery task. It may become a way of recovering regularities of the physical world from visual evidence.\u003c/p\u003e\n\u003cp\u003eThe role of visual intelligence in the journey toward AGI is therefore not to replace language, but to provide a grounded and potentially independent path. Language-first AI has demonstrated that broad capabilities can emerge from simple objectives at scale. Vision-first AI should now ask the analogous question: what emerges when models learn from visual experience at scale? The early signs are already visible in systems related to video understanding, geometry understanding, physical understanding, embodied intelligence, language alignment, and egocentric perception. These should not be viewed as isolated demos, but as early coordinates of a larger map from visual foundation models to visual intelligence and from visual intelligence to general intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S3\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch2 id=\"3-summary-and-discussion\"\u003e3 Summary and Discussion\u003c/h2\u003e\n\u003cp\u003e\u003cspan id=\"S3.SS1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"31-summary-of-perspectives\"\u003e3.1 Summary of Perspectives\u003c/h3\u003e\n\u003cp\u003eThe perspectives presented in this paper approach visual general intelligence (VGI) from complementary directions. Table \u003ca href=\"#S3.T1\"\u003e1\u003c/a\u003e provides a concise summary of their central positions.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S3.T1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eTable 1: A concise summary of the perspectives on visual general intelligence presented in this paper.\u003c/p\u003e\n\u003cp\u003eTaken as a whole, the positions can be broadly grouped into the following directions: scaling and generative modeling; creativity, prediction, imagination, and reconstruction; continual and lifelong learning; persistent 3D and spatial world representations; embodiment, active perception, and action; multimodal learning and computational efficiency; scientific discovery and generalization to unfamiliar environments; the recovery of compositional physical structure; and forms of visual intelligence that are not organized primarily around language.\u003c/p\u003e\n\u003cp\u003eSeveral contributions assign a central role to generative learning. Geirhos argues that generative video models trained on web-scale visual data can acquire general-purpose capabilities because generation requires a model to account for substantially more of the visual world than task-specific recognition (Section \u003ca href=\"#S2.SS1\"\u003e2.1\u003c/a\u003e). Raghunathan extends generation beyond fidelity toward creativity, requiring coherent, structurally diverse, original, and useful outputs (Section \u003ca href=\"#S2.SS2\"\u003e2.2\u003c/a\u003e). Ramanan et al. view generation as a possible culmination of self-supervised representation learning, while emphasizing multimodality and efficiency (Section \u003ca href=\"#S2.SS4\"\u003e2.4\u003c/a\u003e). Du uses generative world models for robust perception and visual generation as an interface to action (Section \u003ca href=\"#S2.SS7\"\u003e2.7\u003c/a\u003e). Kataoka et al. treat generation as imagination and combine it with autoregressive prediction and reconstruction-based structural understanding (Section \u003ca href=\"#S2.SS10\"\u003e2.10\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eShangzhe Wu \u0026amp; Jiajun Wu provide a complementary qualification to this emphasis on generation (Section \u003ca href=\"#S2.SS8\"\u003e2.8\u003c/a\u003e). They argue that predicting pixels or producing photorealistic outputs does not by itself demonstrate an understanding of the physical world. Visual intelligence should recover the entities, intrinsic and extrinsic properties, relations, and dynamics that generated an observation, so that the resulting representation can support interventions, simulation, verification, and action.\u003c/p\u003e\n\u003cp\u003eOther contributions emphasize how visual knowledge should be acquired, maintained, and used over time. Asano argues that a visually intelligent system should develop throughout its visual lifetime, rather than remain fixed after pre-training (Section \u003ca href=\"#S2.SS3\"\u003e2.3\u003c/a\u003e). Davison emphasizes persistent but adaptable spatial representations, closed-loop state estimation, and the computational structure needed for real-time Spatial AI (Section \u003ca href=\"#S2.SS6\"\u003e2.6\u003c/a\u003e). Du connects persistent scene representations to action, active exploration, and continual adaptation. Liu further argues that a vision-native system must determine when to look, where to look, and how much visual detail is needed, rather than passively processing a predetermined visual input (Section \u003ca href=\"#S2.SS9\"\u003e2.9\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eThe scope of visual intelligence also extends beyond ordinary visual recognition. Ramanan et al. emphasize raw multimodal experience, including touch, audio, and proprioception. Fouhey’s scientific setting emphasizes validation without conventional ground truth, the handling of sensor systematics and units, and integration with domain knowledge (Section \u003ca href=\"#S2.SS5\"\u003e2.5\u003c/a\u003e). Raghunathan’s account of creativity similarly asks whether a system can construct possibilities that were not explicitly present in its training experience.\u003c/p\u003e\n\u003cp\u003eThese perspectives do not converge on a single model, learning objective, representation, or definition of VGI. They nevertheless share an important premise: visual general intelligence should not be understood simply as a more accurate image recognition system or as a visual encoder attached to a language model. Instead, VGI concerns intelligence that emerges from visual experience and enables a system to discover and verify the structure of the world, maintain and update knowledge over time, predict possible futures, imagine alternatives, reconstruct unobserved structure, and adapt its behavior to unfamiliar situations. Such knowledge should ultimately be tested not only by whether a system can describe or reproduce an observation, but also by whether its representation can be edited, simulated, and used to support reliable action.\u003c/p\u003e\n\u003cp\u003eThe resulting research agenda therefore extends beyond model scale alone. A central challenge is to determine how generation, compositional physical structure, memory, spatial understanding, embodiment, active information acquisition, multimodal experience, and continual learning should be combined within a general visual system. The diversity of positions in this paper suggests that these components should not be treated as isolated capabilities, but as complementary parts of a broader pathway from visual foundation models to visual intelligence and, potentially, to general intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S3.SS2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3 id=\"32-discussion\"\u003e3.2 Discussion\u003c/h3\u003e\n\u003cp\u003e\u003cspan id=\"S3.SS2.SSS0.Px1\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"can-intelligence-emerge-from-visual-experience\"\u003eCan intelligence emerge from visual experience?\u003c/h4\u003e\n\u003cp\u003eBefore asking whether visual intelligence can lead to general intelligence, a more immediate question is whether intelligence can emerge from visual experience itself. Current AI systems often treat vision as an input while assigning abstraction and reasoning primarily to language. Several perspectives in this paper challenge this division. Asano argues that objects, depth, motion, persistence, and affordance can be learned before they are named. Liu similarly emphasizes that grounded, spatial, and action-oriented experience is not naturally reducible to text tokens. Shangzhe Wu \u0026amp; Jiajun Wu add that visual observations contain physical properties and dynamics that may never have been described in language. Together with Kataoka et al., these positions leave open a grounded and potentially independent path from visual experience to intelligence.\u003c/p\u003e\n\u003cp\u003eThis does not make language or other modalities unnecessary. Ramanan emphasizes audio, touch, and proprioception, while Du connects vision to action and physical feedback. The open question is whether visual grounding should precede multimodal integration or emerge jointly with it. In either case, vision should not be reduced to an input channel for an otherwise language-centered system.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S3.SS2.SSS0.Px2\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"scaling-generation-and-physical-structure\"\u003eScaling, generation, and physical structure.\u003c/h4\u003e\n\u003cp\u003eGeirhos argues that generative models trained on large-scale video data may acquire generalized capabilities across a range of downstream tasks that are not specified individually during training. Other positions similarly regard these large-scale generative models as a major milestone in different contexts: Ramanan connects them to representation learning, Du to world modeling and action, Raghunathan to creativity, and Kataoka et al. to imagination.\u003c/p\u003e\n\u003cp\u003eHowever, scaling the volume of training data alone is not sufficient. Liu and Ramanan emphasize the importance of collecting diverse visual data, rather than simply exposing models to vast quantities of data in similar patterns. Meanwhile, Fouhey highlights the need for techniques capable of capturing scientific phenomena only available in a small amount of data. Shangzhe Wu \u0026amp; Jiajun Wu further distinguish photorealistic appearance from physical understanding. A model may generate a visually plausible event without understanding the underlying physical properties that govern it. We may therefore need to investigate representations of physical structure that can be inspected, edited, simulated, and verified.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S3.SS2.SSS0.Px3\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"continual-learning-and-evaluation\"\u003eContinual learning and evaluation.\u003c/h4\u003e\n\u003cp\u003eA system trained once and then frozen cannot accommodate an open and changing world. Asano defines VGI as a system that develops throughout its visual lifetime, while Du argues that an embodied system must collect informative experience and continue adapting after deployment. Davison’s persistent spatial representations and Ramanan’s stateful long-horizon models highlight the need for compact memory that can be accessed and revised. Liu and Du further emphasize that an intelligent system should actively decide what to observe and use action to resolve uncertainty.\u003c/p\u003e\n\u003cp\u003eThese requirements also change how VGI should be evaluated. Fouhey’s scientific setting emphasizes validation without conventional ground truth and the handling of sensor systematics and units; Raghunathan adds coherence, diversity, and originality; Davison and Du require persistent spatial understanding and reliable action; and Shangzhe Wu \u0026amp; Jiajun Wu ask whether recovered structure supports intervention and simulation rather than reconstruction alone. VGI benchmarks should therefore evaluate transfer, continual adaptation, active observation, persistent world knowledge, creativity, physical consistency, and efficiency. No single benchmark is likely to measure all of these dimensions, but isolated static tasks are unlikely to be sufficient.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S3.SS2.SSS0.Px4\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch4 id=\"from-visual-functions-to-visual-intelligence\"\u003eFrom visual functions to visual intelligence.\u003c/h4\u003e\n\u003cp\u003eComputer vision has progressed by decomposing visual understanding into tasks such as recognition, reconstruction, generation, mapping, and action prediction. This remains useful, but it also encourages each task to be addressed by a separately trained system. A general visual system would instead need to operate across tasks, timescales, environments, representations, and potentially sensory modalities. It would preserve and revise knowledge, determine which observations matter, and connect perception to prediction and action.\u003c/p\u003e\n\u003cp\u003eIf vision foundation models acquire these properties, recognition, reconstruction, generation, spatial mapping, and action may become different ways of accessing and testing knowledge held by the same system. The transition from visual foundation models to visual intelligence would therefore mark a new phase of computer vision: from constructing increasingly capable visual functions to investigating how intelligence itself may emerge from visual experience.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S4\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch2 id=\"4-conclusion\"\u003e4 Conclusion\u003c/h2\u003e\n\u003cp\u003eThis paper has examined visual general intelligence as a research agenda concerned with two related questions: how intelligence may emerge from visual experience, and how such visual intelligence may provide a path toward general intelligence. The perspectives collected here do not support a single definition, architecture, learning objective, or route to VGI. Rather than forcing these positions into one unified forecast, this paper presents several plausible and complementary conclusions. Visual intelligence may emerge through large-scale generative learning, prediction, reconstruction, persistent spatial memory, continual learning, embodiment, active perception, multimodal experience, or combinations of these mechanisms that have not yet been fully explored.\u003c/p\u003e\n\u003cp\u003eThis plurality is itself one of the central conclusions of the paper. VGI should not be defined prematurely as a particular model or capability. Nor should it be reduced to a stronger image classifier, a video generator, a world model, or a visual encoder attached to a language model. The positions presented here instead describe visual intelligence as a broader capacity to acquire knowledge from visual experience, discover and maintain the structure of the world, imagine and evaluate possible alternatives, adapt to new observations, and use visual knowledge for prediction, discovery, and action.\u003c/p\u003e\n\u003cp\u003eExisting systems demonstrate important components of visual intelligence, but not yet their integration into a general, continually adaptable visual system. Current models nevertheless provide partial and increasingly suggestive evidence. Generative video models exhibit unexpected cross-task capabilities; reconstruction models recover increasingly rich geometric and physical structure; spatial systems maintain persistent representations over time; creative models construct multiple plausible alternatives; and embodied agents improve their perception and behavior through interaction. These capabilities remain fragmented, computationally expensive, limited in temporal extent, or dependent on carefully selected data and training conditions. However, taken together, they may represent early coordinates of a broader transition from visual functions to visual intelligence.\u003c/p\u003e\n\u003cp\u003eIt may therefore be premature to ask whether VGI has already become a path to general intelligence. The more immediate milestone is to determine whether intelligence can first be observed to emerge from visual experience itself. Evidence for this transition should extend beyond improved performance on a fixed collection of visual tasks. It should include transferable capabilities, persistent and revisable world knowledge, creative and counterfactual reasoning, active information seeking, continual adaptation, spatial and physical consistency, and reliable action in unfamiliar situations.\u003c/p\u003e\n\u003cp\u003eComputer vision may now be entering a new phase in which its central object of study expands from individual visual functions to the emergence of visual intelligence. The purpose of this paper is not to declare which proposed path will prevail, but to make their assumptions, relationships, and open questions visible. The decisive principle may come from one of the directions discussed here, from their convergence, or from an approach that has not yet been imagined. The question left to the field is therefore not only how to build more capable visual models, but what evidence would convince us that intelligence has begun to arise from vision – and how that intelligence might eventually contribute to general intelligence.\u003c/p\u003e\n\u003ch2 id=\"acknowledgments\"\u003eAcknowledgments\u003c/h2\u003e\n\u003cp\u003eThis work was conducted by AIST researchers under FRONTia, a Japanese national program led by the Ministry of Economy, Trade and Industry of Japan (METI) and the New Energy and Industrial Technology Development Organization (NEDO), aimed at developing a domestic multimodal foundation model for AI robots and physical AI. This work was supported by Japan Science and Technology Agency (JST) as part of Adopting Sustainable Partnerships for Innovative Research Ecosystem (ASPIRE), Grant Number JPMJAP2518. We would also like to thank the invited speakers of the CVPR 2026 Workshop on Visual General Intelligence (VGI) for their insightful talks and discussions that helped motivate this white paper. In particular, we are grateful to Matt Deitke, Alexei A. Efros, Kristen Grauman, Alex Kendall, and Andrea Vedaldi, who contributed to the workshop. Their perspectives helped clarify the diversity of open questions surrounding visual intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"bib\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch2 id=\"references\"\u003eReferences\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan id=\"bib.bib92\"\u003e\u003c/span\u003e[1] (2025) A review of learning-based dynamics models for robotic manipulation. Science Robotics 10 (105). Cited by: \u003ca href=\"#S2.SS8.SSS0.Px1.p1.1\"\u003e§2.8\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cspan id=\"bib.bib33\"\u003e\u003c/span\u003e[2] J. Alayrac, J. Donahue, P. Luc, A. Miech, I. Barr, Y. Hasson, K. Lenc, A. Mensch, K. Millican, M. Reynolds, R. Ring, E. Rutherford, S. Cabi, T. Han, Z. Gong, S. Samangooei, M. Monteiro, J. Menick, S. Borgeaud, A. Brock, A. Nematzadeh, S. Sharifzadeh, M. Bińkowski, R. Barreira, O. Vinyals, A. Zisserman, and K. Simonyan (2022) Flamingo: a visual language model for few-shot learning. In Advances in Neural Information Processing Systems, Vol. 35, pp. 23716–23736. Cited by: \u003ca href=\"#S1.p6.1\"\u003e§1\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cspan id=\"bib.bib23\"\u003e\u003c/span\u003e[3] D. Bahdanau, K. Cho, and Y. Bengio (2015) Neural machine translation by jointly learning to align and translate. In International g, S. Song, X. Wen, Y. Li, H. Poon, and M. Chen (2026) Video models can reason with verifiable rewards. arXiv preprint arXiv:2605.15458. Cited by: \u003ca href=\"#S2.SS1.SSS0.Px3.p1.1\"\u003e§2.1\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:01e768ffce8450941e35ac316a9d9e6f198dadce11b88757f591da74afee4481":{"html":"\u003cp\u003eThis paper reconsiders intelligence from a vision-centered perspective and examines whether intelligence emerging from visual experience and learning may provide a pathway toward AGI. In the language domain, beginning with the introduction of the Transformer architecture, the GPT series has demonstrated transfer to unseen tasks through autoregressive language modeling on web-scale text combined with aggressive scaling. This raises a natural question, namely, what capabilities and forms of intelligence can emerge from visual modalities such as images, videos, and geometry? In this paper, we discuss whether visual intelligence can serve as a pathway toward AGI, referred to in this paper as visual general intelligence (VGI), by bringing together contributors from diverse standpoints and affiliations. Our aim is not to offer a single definition of visual intelligence, but to clarify the principles that computer vision should pursue in the AGI era, the visual input modalities, the benchmarks, the learning paradigms, and the relationship between vision, when taken as the core, and other modalities such as language.\u003c/p\u003e\n","kind":"html","rawMarkdown":"This paper reconsiders intelligence from a vision-centered perspective and examines whether intelligence emerging from visual experience and learning may provide a pathway toward AGI. In the language domain, beginning with the introduction of the Transformer architecture, the GPT series has demonstrated transfer to unseen tasks through autoregressive language modeling on web-scale text combined with aggressive scaling. This raises a natural question, namely, what capabilities and forms of intelligence can emerge from visual modalities such as images, videos, and geometry? In this paper, we discuss whether visual intelligence can serve as a pathway toward AGI, referred to in this paper as visual general intelligence (VGI), by bringing together contributors from diverse standpoints and affiliations. Our aim is not to offer a single definition of visual intelligence, but to clarify the principles that computer vision should pursue in the AGI era, the visual input modalities, the benchmarks, the learning paradigms, and the relationship between vision, when taken as the core, and other modalities such as language.","sourceFormat":"markdown"},"note:sha256:06ed3c2c692d0e49ffe66672095b2ec98c00ed1c25f8ac7648c0a55027d9546b":{"html":"\u003cp\u003eIn this section, I do not aim to provide a complete theory of visual general intelligence. Some points may be familiar, and some are speculative. I include them because they reflect a few beliefs shaped by my own research taste: simple scalable methods, empirical understanding of models, and the role of data and evaluation. Even as visual models become stronger, many AI systems still use vision mostly as an attachment to language. I would like to think about VGI in a more vision-native way, where vision is a natural channel for acquiring context and providing timely feedback.\u003c/p\u003e\n","kind":"html","rawMarkdown":"In this section, I do not aim to provide a complete theory of visual general intelligence. Some points may be familiar, and some are speculative. I include them because they reflect a few beliefs shaped by my own research taste: simple scalable methods, empirical understanding of models, and the role of data and evaluation. Even as visual models become stronger, many AI systems still use vision mostly as an attachment to language. I would like to think about VGI in a more vision-native way, where vision is a natural channel for acquiring context and providing timely feedback.","sourceFormat":"markdown"},"note:sha256:0a71a4a715116f29992e0b42e5688843239cf799815b2a9261e1744bb8f23b80":{"html":"\u003cp\u003eComputer vision has progressed by decomposing visual understanding into tasks such as recognition, reconstruction, generation, mapping, and action prediction. This remains useful, but it also encourages each task to be addressed by a separately trained system. A general visual system would instead need to operate across tasks, timescales, environments, representations, and potentially sensory modalities. It would preserve and revise knowledge, determine which observations matter, and connect perception to prediction and action.\u003c/p\u003e\n\u003cp\u003eIf vision foundation models acquire these properties, recognition, reconstruction, generation, spatial mapping, and action may become different ways of accessing and testing knowledge held by the same system. The transition from visual foundation models to visual intelligence would therefore mark a new phase of computer vision: from constructing increasingly capable visual functions to investigating how intelligence itself may emerge from visual experience.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Computer vision has progressed by decomposing visual understanding into tasks such as recognition, reconstruction, generation, mapping, and action prediction. This remains useful, but it also encourages each task to be addressed by a separately trained system. A general visual system would instead need to operate across tasks, timescales, environments, representations, and potentially sensory modalities. It would preserve and revise knowledge, determine which observations matter, and connect perception to prediction and action.\n\nIf vision foundation models acquire these properties, recognition, reconstruction, generation, spatial mapping, and action may become different ways of accessing and testing knowledge held by the same system. The transition from visual foundation models to visual intelligence would therefore mark a new phase of computer vision: from constructing increasingly capable visual functions to investigating how intelligence itself may emerge from visual experience.","sourceFormat":"markdown"},"note:sha256:0ad5b38ea79fa8d2d7c7582856c91c3aaae597a6fcf65b4f7131204fe11418d2":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS1.p1.1\"\u003e\u003c/span\u003eIn the context of my research, visual intelligence can be characterized as the ability to solve any visual task, from perception to reasoning, without being explicitly trained on each new task. Just like large language models are now able to solve most language tasks, I believe that the time has finally come for machine vision to undergo a similar transformation from task-specific to general-purpose models. The computer vision community has built outstanding individual and task-specific models to date [\u003ca href=\"#bib.bib51\"\u003e101\u003c/a\u003e, \u003ca href=\"#bib.bib52\"\u003e46\u003c/a\u003e, e.g.], but the field has not yet been unified around a common framework in the same way that LLMs have unified most of natural language processing research. How, then, should we build unified visual foundation models? The foundational primitives that unlocked language intelligence—training large, generative models on web-scale data—apply directly to today’s generative video models. I am convinced that transferring these very principles (large-scale training + generative objective) to video models holds the key to solving visual intelligence.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS1.p1.1\"\u003e\u003c/span\u003eIn the context of my research, visual intelligence can be characterized as the ability to solve any visual task, from perception to reasoning, without being explicitly trained on each new task. Just like large language models are now able to solve most language tasks, I believe that the time has finally come for machine vision to undergo a similar transformation from task-specific to general-purpose models. The computer vision community has built outstanding individual and task-specific models to date [[101](#bib.bib51), [46](#bib.bib52), e.g.], but the field has not yet been unified around a common framework in the same way that LLMs have unified most of natural language processing research. How, then, should we build unified visual foundation models? The foundational primitives that unlocked language intelligence—training large, generative models on web-scale data—apply directly to today’s generative video models. I am convinced that transferring these very principles (large-scale training + generative objective) to video models holds the key to solving visual intelligence.","sourceFormat":"markdown"},"note:sha256:1e3ad06e3bb0ef70098e2fedb16728f0f45ef018b6eddedad845781f0df9761f":{"html":"\u003cp\u003eIntelligence is not exhausted by tasks with a single correct answer. In open-ended settings, success also depends on finding creative ways to satisfy a request and making fresh connections that were not explicitly encountered before. For visual intelligence, examples include designing an object under functional constraints, proposing distinct plans for a robot, constructing a scientific diagram, or imagining several ways in which a physical scene could evolve. Creativity in such tasks requires outputs that are not only coherent, but also diverse across repeated generations and original relative to the training experience. These capabilities will become increasingly important as visual models are used for scientific discovery, design, novel training data, and test-time exploration.\u003c/p\u003e\n\u003cp\u003eMany creative tasks require a leap of thought: an implicit search-and-plan process that coordinates several interdependent decisions before the observable output is generated. In vision, this hidden plan might specify a scene layout, a 3D structure, a set of object relationships, a physical mechanism, a camera trajectory, or a sequence of actions. It may be only indirectly visible in the final image or video. Producing such an output therefore requires capturing higher-order structure across the generation as a whole, rather than assembling independently plausible local choices.\u003c/p\u003e\n\u003cp\u003eIn prior work, we designed minimal algorithmic tasks that are loose abstractions of open-ended real-world tasks and that make creativity measurable in a controlled setting. Drawing on a cognitive-science taxonomy, we considered two forms of creativity. Combinational creativity identifies unfamiliar connections among familiar elements, as in analogy, wordplay, and the discovery of connections between previously separate ideas. Its visual analogue could involve finding an unexpected but meaningful relationship among familiar objects, scenes, concepts, or physical processes. Exploratory creativity constructs new patterns subject to a collection of rules or constraints, as in designing problems, proteins, mechanisms, or narratives. Its visual analogue could be a new scene, 3D structure, video, mechanism, or action plan that satisfies geometric, physical, semantic, or task-level constraints.\u003c/p\u003e\n\u003cp\u003eIn both cases, the goal is to produce solutions that are coherent, distinct, and not simply reproduced from training examples. We refer to this operational notion as algorithmic creativity. A corresponding evaluation of creative visual intelligence should measure at least three properties. First, each output should be coherent, satisfying the relevant physical, geometric, semantic, temporal, or task constraints. Second, generations should be structurally diverse, representing meaningfully different solutions rather than cosmetic changes in texture, color, wording, or viewpoint. Third, outputs should be original relative to the model’s training experience.\u003c/p\u003e\n\u003cp\u003eOur results suggest that the learning objective matters for acquiring such behavior. On the controlled tasks, multi-token approaches based on teacherless training and diffusion generated more diverse and original solutions than conventional next-token learning. A central issue is global coordination: the latent creative plan is expressed through relationships among several parts of the sequence, and those parts must fit together as a whole. For visual models, this motivates objectives and architectures that can represent a high-level construction and then generate its local details while preserving spatial and temporal consistency.\u003c/p\u003e\n\u003cp\u003eWe also considered where randomness should enter the generation process. Rather than introducing randomness only through output-level temperature sampling, seed-conditioning provides a random input to the model during both training and inference. Different seeds can select different solutions while allowing each solution to remain internally coherent. A visual analogue would use a persistent sample-level latent variable to select a high-level possibility—such as a layout, mechanism, trajectory, or hypothesis—before generating its details. This may encourage diversity among complete plans rather than merely introducing local variation during decoding.\u003c/p\u003e\n\u003cp\u003eCreativity therefore extends the role of generation in visual general intelligence. A visually intelligent system should not only recognize what is present, reconstruct hidden structure, or predict the most likely future. It should also be able to construct multiple plausible alternatives, preserve the internal logic of each, and search for possibilities that are useful and unfamiliar. Visual models should consequently be evaluated not only by fidelity and accuracy, but also by coherence, structural diversity, originality, and utility. The central question is not simply whether a model can imagine, but whether it can imagine differently without losing structure.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Intelligence is not exhausted by tasks with a single correct answer. In open-ended settings, success also depends on finding creative ways to satisfy a request and making fresh connections that were not explicitly encountered before. For visual intelligence, examples include designing an object under functional constraints, proposing distinct plans for a robot, constructing a scientific diagram, or imagining several ways in which a physical scene could evolve. Creativity in such tasks requires outputs that are not only coherent, but also diverse across repeated generations and original relative to the training experience. These capabilities will become increasingly important as visual models are used for scientific discovery, design, novel training data, and test-time exploration.\n\nMany creative tasks require a leap of thought: an implicit search-and-plan process that coordinates several interdependent decisions before the observable output is generated. In vision, this hidden plan might specify a scene layout, a 3D structure, a set of object relationships, a physical mechanism, a camera trajectory, or a sequence of actions. It may be only indirectly visible in the final image or video. Producing such an output therefore requires capturing higher-order structure across the generation as a whole, rather than assembling independently plausible local choices.\n\nIn prior work, we designed minimal algorithmic tasks that are loose abstractions of open-ended real-world tasks and that make creativity measurable in a controlled setting. Drawing on a cognitive-science taxonomy, we considered two forms of creativity. Combinational creativity identifies unfamiliar connections among familiar elements, as in analogy, wordplay, and the discovery of connections between previously separate ideas. Its visual analogue could involve finding an unexpected but meaningful relationship among familiar objects, scenes, concepts, or physical processes. Exploratory creativity constructs new patterns subject to a collection of rules or constraints, as in designing problems, proteins, mechanisms, or narratives. Its visual analogue could be a new scene, 3D structure, video, mechanism, or action plan that satisfies geometric, physical, semantic, or task-level constraints.\n\nIn both cases, the goal is to produce solutions that are coherent, distinct, and not simply reproduced from training examples. We refer to this operational notion as algorithmic creativity. A corresponding evaluation of creative visual intelligence should measure at least three properties. First, each output should be coherent, satisfying the relevant physical, geometric, semantic, temporal, or task constraints. Second, generations should be structurally diverse, representing meaningfully different solutions rather than cosmetic changes in texture, color, wording, or viewpoint. Third, outputs should be original relative to the model’s training experience.\n\nOur results suggest that the learning objective matters for acquiring such behavior. On the controlled tasks, multi-token approaches based on teacherless training and diffusion generated more diverse and original solutions than conventional next-token learning. A central issue is global coordination: the latent creative plan is expressed through relationships among several parts of the sequence, and those parts must fit together as a whole. For visual models, this motivates objectives and architectures that can represent a high-level construction and then generate its local details while preserving spatial and temporal consistency.\n\nWe also considered where randomness should enter the generation process. Rather than introducing randomness only through output-level temperature sampling, seed-conditioning provides a random input to the model during both training and inference. Different seeds can select different solutions while allowing each solution to remain internally coherent. A visual analogue would use a persistent sample-level latent variable to select a high-level possibility—such as a layout, mechanism, trajectory, or hypothesis—before generating its details. This may encourage diversity among complete plans rather than merely introducing local variation during decoding.\n\nCreativity therefore extends the role of generation in visual general intelligence. A visually intelligent system should not only recognize what is present, reconstruct hidden structure, or predict the most likely future. It should also be able to construct multiple plausible alternatives, preserve the internal logic of each, and search for possibilities that are useful and unfamiliar. Visual models should consequently be evaluated not only by fidelity and accuracy, but also by coherence, structural diversity, originality, and utility. The central question is not simply whether a model can imagine, but whether it can imagine differently without losing structure.","sourceFormat":"markdown"},"note:sha256:231daebfe08d8a42191a2a187a35fd56e19edd19c797ce5d12751d3fa9b3f7b2":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS6.p1.1\"\u003e\u003c/span\u003eIn FutureMapping 1 and 2 [\u003ca href=\"#bib.bib61\"\u003e17\u003c/a\u003e, \u003ca href=\"#bib.bib62\"\u003e16\u003c/a\u003e], I defined Spatial AI as the capability for artificial devices to build genuinely rich but efficient representations of their surroundings which enable them to interact with them in the generally intelligent ways people can. To quote Pearl, ‘what humans possessed that other species lacked was a mental representation, a blue-print of their environment which they could manipulate at will to imagine alternative hypothetical environments for planning and learning’ [\u003ca href=\"#bib.bib80\"\u003e71\u003c/a\u003e]. I believe that the capability to build high quality, task-independent representations is the key to the creative visual intelligence that will enable world-changing products such as an autonomous robot that could clear and tidy a messy kitchen, or a general lightweight wearable device that could generally enhance a human’s memory and intelligence. Such products not only place very high demands on their Spatial AI systems, but also very tight constraints on their embedded implementation in terms of size, weight, and efficiency. The computational structure of these systems — what is computed and stored where, how everything is connected, and how this relates to likely future developments in computing hardware — is a crucial and rarely discussed research issue.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS6.p1.1\"\u003e\u003c/span\u003eIn FutureMapping 1 and 2 [[17](#bib.bib61), [16](#bib.bib62)], I defined Spatial AI as the capability for artificial devices to build genuinely rich but efficient representations of their surroundings which enable them to interact with them in the generally intelligent ways people can. To quote Pearl, ‘what humans possessed that other species lacked was a mental representation, a blue-print of their environment which they could manipulate at will to imagine alternative hypothetical environments for planning and learning’ [[71](#bib.bib80)]. I believe that the capability to build high quality, task-independent representations is the key to the creative visual intelligence that will enable world-changing products such as an autonomous robot that could clear and tidy a messy kitchen, or a general lightweight wearable device that could generally enhance a human’s memory and intelligence. Such products not only place very high demands on their Spatial AI systems, but also very tight constraints on their embedded implementation in terms of size, weight, and efficiency. The computational structure of these systems — what is computed and stored where, how everything is connected, and how this relates to likely future developments in computing hardware — is a crucial and rarely discussed research issue.","sourceFormat":"markdown"},"note:sha256:25d2969bcc50206871a0736bb9f3f095e3ea35fa39bbaab55a147a999820b260":{"html":"\u003cp\u003eIn this section, I present a perspective on visual intelligence informed by the research of our group. I argue that a central test of visual general intelligence is whether it can enable a robot to perceive, reason about, and act reliably in the physical world. Embodiment is more than a downstream application of visual intelligence: by selecting viewpoints and intervening in the world, an agent can reveal properties that are difficult to infer from passive observation alone, test its predictions, and obtain feedback with which to revise its visual model. Meeting this test requires visual systems that generalize to unfamiliar situations, integrate observations over long temporal horizons into consistent scene representations, connect visual understanding to action, actively acquire informative experience, and continue adapting after deployment. Together, these capabilities form a closed loop in which vision guides action and the consequences of action provide evidence for improving visual understanding.\u003c/p\u003e\n","kind":"html","rawMarkdown":"In this section, I present a perspective on visual intelligence informed by the research of our group. I argue that a central test of visual general intelligence is whether it can enable a robot to perceive, reason about, and act reliably in the physical world. Embodiment is more than a downstream application of visual intelligence: by selecting viewpoints and intervening in the world, an agent can reveal properties that are difficult to infer from passive observation alone, test its predictions, and obtain feedback with which to revise its visual model. Meeting this test requires visual systems that generalize to unfamiliar situations, integrate observations over long temporal horizons into consistent scene representations, connect visual understanding to action, actively acquire informative experience, and continue adapting after deployment. Together, these capabilities form a closed loop in which vision guides action and the consequences of action provide evidence for improving visual understanding.","sourceFormat":"markdown"},"note:sha256:2e33d4943a48f170ee8ce43ddaf4b8e380e0dd84ec42df696b17f2a273f4b830":{"html":"\u003cp\u003eEmbodied agents will routinely encounter observations outside their training distributions, where current visual systems may fail unpredictably—and, in robotic settings, sometimes catastrophically. A central challenge for visual intelligence is therefore to generalize robustly across open-ended changes in viewpoint, environment, object configuration, and interaction.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px1.p2.1\"\u003e\u003c/span\u003eOne promising route toward such robustness is to construct generative world models and formulate perception as inference over the latent scene states that could have produced an observation. Because visual observations arise from recurring physical regularities—including geometry, objects, relations, and dynamics—such models can explain unfamiliar scenes by reusing and recombining previously acquired knowledge. Explicit 3D structure [\u003ca href=\"#bib.bib65\"\u003e54\u003c/a\u003e] and compositional structure [\u003ca href=\"#bib.bib66\"\u003e22\u003c/a\u003e, \u003ca href=\"#bib.bib64\"\u003e89\u003c/a\u003e, \u003ca href=\"#bib.bib67\"\u003e114\u003c/a\u003e] can provide useful inductive biases for data-efficient learning and systematic generalization. This approach follows the long-standing paradigm of “analysis by synthesis” [\u003ca href=\"#bib.bib68\"\u003e106\u003c/a\u003e, \u003ca href=\"#bib.bib69\"\u003e48\u003c/a\u003e], in which visual understanding is achieved by inferring a latent scene explanation whose synthesized observations agree with the input. Consistent with this view, earlier work from our group showed that generative compositional models can generalize to scenes containing numbers and configurati
