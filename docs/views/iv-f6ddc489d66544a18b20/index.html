le that intelligence-like functions can emerge without language. The critical question for vision research is whether a sufficiently powerful visual system can acquire internal knowledge of the world and elicit intelligent behaviour from it.\u003c/p\u003e\n\u003cp\u003eIf a model understands the world deeply enough, many abilities may already be latent inside the model. The remaining problem may be how to elicit them. This is one of the most important lessons from the development of language models: a model trained with a simple autoregressive objective over large-scale text could perform new tasks when given only a few examples in context. The visual analogue may be true visual in-context learning. A model would be shown a few visual examples of a new task, infer the task structure, infer the appropriate output format, and solve new cases without explicit retraining. In other words, if a model captures the appearance and dynamics of the world sufficiently well, visual in-context learning may make it easier to elicit new capabilities without parameter updates. Even then, a world model is necessary but not sufficient. Intelligence also requires the ability to use that model under new goals: to infer tasks, choose relevant abstractions, generate counterfactuals, adapt to new observations, and act or respond appropriately.\u003c/p\u003e\n\u003cp\u003eOur central hypothesis is that visual intelligence may emerge through the convergence of three complementary learning objectives: sequential prediction, open-ended generation, and reconstruction. These correspond to three fundamental operations of intelligence. Sequential prediction anticipates what comes next. Open-ended generation explores what could exist. Reconstruction infers hidden structure from incomplete observations. Individually, each may produce powerful models. Together, they may define a path from vision foundation models to visual intelligence, and eventually to general intelligence.\u003c/p\u003e\n\u003cp\u003eAutoregressive visual learning may become the visual counterpart of GPT. In language, next-token prediction appears simple, but successful prediction requires a model to capture grammar, semantics, facts, discourse, reasoning patterns, and task structure. In vision, predicting the next visual state may require an even richer set of latent concepts. Given an image, video, or embodied observation, the model must infer objects, geometry, motion, occlusion, physical constraints, camera movement, agent behaviour, temporal causality, and uncertainty. To predict coherently is not simply to extrapolate pixels; it is to infer the hidden structure that makes the next observation plausible. If a model can predict future visual states across diverse environments and long horizons, it is being forced to learn how the world evolves. This pressure is a natural route toward visual world modeling: the model must learn from observations, infer their structure, and anticipate what should follow.\u003c/p\u003e\n\u003cp\u003eGenerative learning is learning to imagine. Generation can impose broader modelling demands than recognition, because recognition often succeeds by detecting discriminative cues, whereas generation requires a model to represent what could exist. A high-quality generative model must learn appearance, geometry, material, lighting, motion, interaction, and plausibility. If such a model can generate high-fidelity images, videos, 3D scenes, and possible futures of the physical world, it becomes more than a content generator. It may provide a basis for an internal simulator, provided that it captures physical and temporal structure rather than appearance alone. A visual agent that can imagine can continue learning inside its own generated possibilities: it can create counterfactuals, test hypotheses, simulate consequences, and refine its understanding before acting. In this sense, imagination is not decoration. It is a mechanism for learning, understanding, and thinking.\u003c/p\u003e\n\u003cp\u003eReconstruction provides a direct route to learning hidden structure from incomplete observations. Super-resolution, image restoration, inverse rendering, depth estimation, multi-view reconstruction, 3D reconstruction, and 4D dynamic reconstruction all require the model to recover hidden causes from incomplete observations. Among these, scalable 3D reconstruction is especially important. A system that can reconstruct the world accurately from images on the fly must acquire notions of space, scale, correspondence, surfaces, objects, motion, and physical consistency. Such a system may also learn to detect anomalies, infer invisible structure, and understand why some observations are physically plausible while others are not. If reconstruction becomes dramatically stronger, it may no longer be merely a recovery task. It may become a way of recovering regularities of the physical world from visual evidence.\u003c/p\u003e\n\u003cp\u003eThe role of visual intelligence in the journey toward AGI is therefore not to replace language, but to provide a grounded and potentially independent path. Language-first AI has demonstrated that broad capabilities can emerge from simple objectives at scale. Vision-first AI should now ask the analogous question: what emerges when models learn from visual experience at scale? The early signs are already visible in systems related to video understanding, geometry understanding, physical understanding, embodied intelligence, language alignment, and egocentric perception. These should not be viewed as isolated demos, but as early coordinates of a larger map from visual foundation models to visual intelligence and from visual intelligence to general intelligence.\u003c/p\u003e\n","kind":"html","rawMarkdown":"We view visual intelligence as the capacity to acquire usable knowledge of the world from visual experience and apply it to prediction, imagination, reconstruction, and new tasks. In this sense, visual intelligence is intelligence that emerges from visual experience: the ability to learn usable structure of the observable world from partial visual observations, understand its hidden structure, predict what may happen next, reconstruct what is not directly observed, imagine possible alternatives, and generalise such knowledge to new visual tasks. It is not simply a stronger image classifier, nor simply a visual encoder connected to an LLM.\n\nOne important consequence of this view is that human vision should not be the upper bound of visual intelligence. A system exposed to richer-than-human visual information may acquire intelligence that goes beyond human-centered vision. The goal of visual intelligence is not to imitate human perception, but to ask what kind of intelligence can emerge when machines learn from visual experience at a scale, diversity, and precision that humans cannot access. This view also suggests a common analogy across humans, animals, and machines. Biological organisms can exhibit intelligent behavior without language by sensing the world, discovering regularities, predicting, and acting. Vision and perception existed long before symbolic language, and it is plausible that intelligence-like functions can emerge without language. The critical question for vision research is whether a sufficiently powerful visual system can acquire internal knowledge of the world and elicit intelligent behaviour from it.\n\nIf a model understands the world deeply enough, many abilities may already be latent inside the model. The remaining problem may be how to elicit them. This is one of the most important lessons from the development of language models: a model trained with a simple autoregressive objective over large-scale text could perform new tasks when given only a few examples in context. The visual analogue may be true visual in-context learning. A model would be shown a few visual examples of a new task, infer the task structure, infer the appropriate output format, and solve new cases without explicit retraining. In other words, if a model captures the appearance and dynamics of the world sufficiently well, visual in-context learning may make it easier to elicit new capabilities without parameter updates. Even then, a world model is necessary but not sufficient. Intelligence also requires the ability to use that model under new goals: to infer tasks, choose relevant abstractions, generate counterfactuals, adapt to new observations, and act or respond appropriately.\n\nOur central hypothesis is that visual intelligence may emerge through the convergence of three complementary learning objectives: sequential prediction, open-ended generation, and reconstruction. These correspond to three fundamental operations of intelligence. Sequential prediction anticipates what comes next. Open-ended generation explores what could exist. Reconstruction infers hidden structure from incomplete observations. Individually, each may produce powerful models. Together, they may define a path from vision foundation models to visual intelligence, and eventually to general intelligence.\n\nAutoregressive visual learning may become the visual counterpart of GPT. In language, next-token prediction appears simple, but successful prediction requires a model to capture grammar, semantics, facts, discourse, reasoning patterns, and task structure. In vision, predicting the next visual state may require an even richer set of latent concepts. Given an image, video, or embodied observation, the model must infer objects, geometry, motion, occlusion, physical constraints, camera movement, agent behaviour, temporal causality, and uncertainty. To predict coherently is not simply to extrapolate pixels; it is to infer the hidden structure that makes the next observation plausible. If a model can predict future visual states across diverse environments and long horizons, it is being forced to learn how the world evolves. This pressure is a natural route toward visual world modeling: the model must learn from observations, infer their structure, and anticipate what should follow.\n\nGenerative learning is learning to imagine. Generation can impose broader modelling demands than recognition, because recognition often succeeds by detecting discriminative cues, whereas generation requires a model to represent what could exist. A high-quality generative model must learn appearance, geometry, material, lighting, motion, interaction, and plausibility. If such a model can generate high-fidelity images, videos, 3D scenes, and possible futures of the physical world, it becomes more than a content generator. It may provide a basis for an internal simulator, provided that it captures physical and temporal structure rather than appearance alone. A visual agent that can imagine can continue learning inside its own generated possibilities: it can create counterfactuals, test hypotheses, simulate consequences, and refine its understanding before acting. In this sense, imagination is not decoration. It is a mechanism for learning, understanding, and thinking.\n\nReconstruction provides a direct route to learning hidden structure from incomplete observations. Super-resolution, image restoration, inverse rendering, depth estimation, multi-view reconstruction, 3D reconstruction, and 4D dynamic reconstruction all require the model to recover hidden causes from incomplete observations. Among these, scalable 3D reconstruction is especially important. A system that can reconstruct the world accurately from images on the fly must acquire notions of space, scale, correspondence, surfaces, objects, motion, and physical consistency. Such a system may also learn to detect anomalies, infer invisible structure, and understand why some observations are physically plausible while others are not. If reconstruction becomes dramatically stronger, it may no longer be merely a recovery task. It may become a way of recovering regularities of the physical world from visual evidence.\n\nThe role of visual intelligence in the journey toward AGI is therefore not to replace language, but to provide a grounded and potentially independent path. Language-first AI has demonstrated that broad capabilities can emerge from simple objectives at scale. Vision-first AI should now ask the analogous question: what emerges when models learn from visual experience at scale? The early signs are already visible in systems related to video understanding, geometry understanding, physical understanding, embodied intelligence, language alignment, and egocentric perception. These should not be viewed as isolated demos, but as early coordinates of a larger map from visual foundation models to visual intelligence and from visual intelligence to general intelligence.","sourceFormat":"markdown"},"note:sha256:873d7131fe36434204272d7ea97787409f7ddf1866a2fdc50e15642c23c01374":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eThere is a principled and a practical argument to support the case of video models as visual foundation models. The principled reason is that video generation is the most general framework for many visual tasks, encompassing still images as a special case [\u003ca href=\"#bib.bib50\"\u003e102\u003c/a\u003e, e.g.]. The practical reason is that in the last two years or so, video models have finally entered the limelight as increasingly capable models, with significant progress happening over the course of months if not days at the moment. In fact, they have become capable enough already to serve as a “version 1.0” of visual foundation models: In our recent work [\u003ca href=\"#bib.bib39\"\u003e93\u003c/a\u003e], we demonstrated that generative video models like Veo 3 exhibit precisely the kind of broad, emergent capabilities that were characteristic of early language foundation models, but in the visual domain instead. Without any task-specific training, the model can perform a wide range of visual tasks simply through image-to-video generation: edge detection, object segmentation, keypoint localization, super-resolution, image editing, style transfer, and even early forms of visual reasoning such as maze solving and graph traversal. Veo 3, a video model trained for entertainment, happens to be a visual foundation model. Subsequent works confirmed and extended these findings in other models too, including open-source models [\u003ca href=\"#bib.bib45\"\u003e86\u003c/a\u003e, \u003ca href=\"#bib.bib49\"\u003e57\u003c/a\u003e, \u003ca href=\"#bib.bib48\"\u003e69\u003c/a\u003e, \u003ca href=\"#bib.bib47\"\u003e45\u003c/a\u003e, \u003ca href=\"#bib.bib46\"\u003e115\u003c/a\u003e, \u003ca href=\"#bib.bib42\"\u003e110\u003c/a\u003e, \u003ca href=\"#bib.bib44\"\u003e37\u003c/a\u003e, \u003ca href=\"#bib.bib43\"\u003e80\u003c/a\u003e]. Just like language foundation models quickly progressed from GPT-2 over GPT-3 to, eventually, ChatGPT and modern LLMs, video models are likely to progress towards fully capable visual foundation models as soon as we start building towards this future.\u003c/p\u003e\n\u003cp\u003eIn light of this, I believe that visual general intelligence is achievable by developing video models as visual foundation models, with the exciting possibility of unifying much of today’s fragmented, “each task requires its own model” computer vision community.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS1.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eThere is a principled and a practical argument to support the case of video models as visual foundation models. The principled reason is that video generation is the most general framework for many visual tasks, encompassing still images as a special case [[102](#bib.bib50), e.g.]. The practical reason is that in the last two years or so, video models have finally entered the limelight as increasingly capable models, with significant progress happening over the course of months if not days at the moment. In fact, they have become capable enough already to serve as a “version 1.0” of visual foundation models: In our recent work [[93](#bib.bib39)], we demonstrated that generative video models like Veo 3 exhibit precisely the kind of broad, emergent capabilities that were characteristic of early language foundation models, but in the visual domain instead. Without any task-specific training, the model can perform a wide range of visual tasks simply through image-to-video generation: edge detection, object segmentation, keypoint localization, super-resolution, image editing, style transfer, and even early forms of visual reasoning such as maze solving and graph traversal. Veo 3, a video model trained for entertainment, happens to be a visual foundation model. Subsequent works confirmed and extended these findings in other models too, including open-source models [[86](#bib.bib45), [57](#bib.bib49), [69](#bib.bib48), [45](#bib.bib47), [115](#bib.bib46), [110](#bib.bib42), [37](#bib.bib44), [80](#bib.bib43)]. Just like language foundation models quickly progressed from GPT-2 over GPT-3 to, eventually, ChatGPT and modern LLMs, video models are likely to progress towards fully capable visual foundation models as soon as we start building towards this future.\n\nIn light of this, I believe that visual general intelligence is achievable by developing video models as visual foundation models, with the exciting possibility of unifying much of today’s fragmented, “each task requires its own model” computer vision community.","sourceFormat":"markdown"},"note:sha256:8c48b81112419a5073d5a132a6025803d3143e081ec22b3864395eee223befa5":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eUltimately, visual intelligence should provide the task-relevant understanding needed for a robot to act, interact, and explore. Visual plans need not reproduce every aspect of an observation with equal fidelity, but they must preserve distinctions that change the actions available to the robot or the outcome of a task. Our group has explored this connection by formulating decision-making as conditional visual generation [\u003ca href=\"#bib.bib74\"\u003e24\u003c/a\u003e, \u003ca href=\"#bib.bib79\"\u003e112\u003c/a\u003e, \u003ca href=\"#bib.bib75\"\u003e12\u003c/a\u003e]. In this framework, a generative model proposes a high-level visual trajectory representing how a task could be completed, while a separate low-level controller grounds that trajectory into continuous robot actions. This decomposition allows visual generation to express task-level intent and anticipated physical evolution while delegating precise execution to the controller. Comparing predicted and observed outcomes then turns execution into a test of both the plan and the visual world model.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS7.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eUltimately, visual intelligence should provide the task-relevant understanding needed for a robot to act, interact, and explore. Visual plans need not reproduce every aspect of an observation with equal fidelity, but they must preserve distinctions that change the actions available to the robot or the outcome of a task. Our group has explored this connection by formulating decision-making as conditional visual generation [[24](#bib.bib74), [112](#bib.bib79), [12](#bib.bib75)]. In this framework, a generative model proposes a high-level visual trajectory representing how a task could be completed, while a separate low-level controller grounds that trajectory into continuous robot actions. This decomposition allows visual generation to express task-level intent and anticipated physical evolution while delegating precise execution to the controller. Comparing predicted and observed outcomes then turns execution into a test of both the plan and the visual world model.","sourceFormat":"markdown"},"note:sha256:96374e569a6f7766e11d10c1b78d77a2a41166eb7d6008dc0830d4937d8f5866":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eProgress over the past few years suggests that recovering such structure will require scale, as the visual world is far too varied to be covered by models specified by hand. The more interesting question is what that scale is spent on. Much of it currently goes into generative models trained to predict pixels, which are judged largely by how plausible their outputs look. That criterion is silent on whether shape, material, articulation, or physical properties are represented at all. A video model that renders a convincing falling cup has shown that it knows what falling cups look like; it has not shown that mass, contact, or friction appear anywhere inside it. The gap is hard to detect when evaluation rewards perceptual quality, and becomes evident as soon as one wants to intervene, edit, or act [\u003ca href=\"#bib.bib93\"\u003e25\u003c/a\u003e, \u003ca href=\"#bib.bib94\"\u003e87\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px2.p2.1\"\u003e\u003c/span\u003eWhether these quantities eventually emerge from pixel prediction alone, given enough data and compute, remains an open question. Our own work has taken the other route, treating the structure as an explicit target of learning rather than as a by-product of another objective. The physical world is compositional—objects made of parts, scenes made of objects, motions made of joint rotations—so a system that recovers these pieces should be able to reuse them in new combinations, and the hundredth object should cost less than the first. Modelling appearance alone offers less of this, since each new configuration may have to be captured on its own terms. The standard objection to this route is that structured representations do not scale, largely because so much of the structure has had to be put in by hand, and hand-built components do not improve as data and compute grow [\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e]. We would suggest that this is a limitation of how the structure is obtained rather than of structure itself, which puts the weight on how structure is represented and on where it comes from.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS8.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eProgress over the past few years suggests that recovering such structure will require scale, as the visual world is far too varied to be covered by models specified by hand. The more interesting question is what that scale is spent on. Much of it currently goes into generative models trained to predict pixels, which are judged largely by how plausible their outputs look. That criterion is silent on whether shape, material, articulation, or physical properties are represented at all. A video model that renders a convincing falling cup has shown that it knows what falling cups look like; it has not shown that mass, contact, or friction appear anywhere inside it. The gap is hard to detect when evaluation rewards perceptual quality, and becomes evident as soon as one wants to intervene, edit, or act [[25](#bib.bib93), [87](#bib.bib94)].\n\n\u003cspan id=\"S2.SS8.SSS0.Px2.p2.1\"\u003e\u003c/span\u003eWhether these quantities eventually emerge from pixel prediction alone, given enough data and compute, remains an open question. Our own work has taken the other route, treating the structure as an explicit target of learning rather than as a by-product of another objective. The physical world is compositional—objects made of parts, scenes made of objects, motions made of joint rotations—so a system that recovers these pieces should be able to reuse them in new combinations, and the hundredth object should cost less than the first. Modelling appearance alone offers less of this, since each new configuration may have to be captured on its own terms. The standard objection to this route is that structured representations do not scale, largely because so much of the structure has had to be put in by hand, and hand-built components do not improve as data and compute grow [[78](#bib.bib29)]. We would suggest that this is a limitation of how the structure is obtained rather than of structure itself, which puts the weight on how structure is represented and on where it comes from.","sourceFormat":"markdown"},"note:sha256:9fe3fc1cc1b9b9c871095df19417ae00acfdf106030840b577fe59bdc8c4af0c":{"html":"\u003cp\u003eThe perspectives presented in this paper approach visual general intelligence (VGI) from complementary directions. Table \u003ca href=\"#S3.T1\"\u003e1\u003c/a\u003e provides a concise summary of their central positions.\u003c/p\u003e\n\u003cp\u003eTable 1: A concise summary of the perspectives on visual general intelligence presented in this paper.\u003c/p\u003e\n\u003cp\u003eTaken as a whole, the positions can be broadly grouped into the following directions: scaling and generative modeling; creativity, prediction, imagination, and reconstruction; continual and lifelong learning; persistent 3D and spatial world representations; embodiment, active perception, and action; multimodal learning and computational efficiency; scientific discovery and generalization to unfamiliar environments; the recovery of compositional physical structure; and forms of visual intelligence that are not organized primarily around language.\u003c/p\u003e\n\u003cp\u003eSeveral contributions assign a central role to generative learning. Geirhos argues that generative video models trained on web-scale visual data can acquire general-purpose capabilities because generation requires a model to account for substantially more of the visual world than task-specific recognition (Section \u003ca href=\"#S2.SS1\"\u003e2.1\u003c/a\u003e). Raghunathan extends generation beyond fidelity toward creativity, requiring coherent, structurally diverse, original, and useful outputs (Section \u003ca href=\"#S2.SS2\"\u003e2.2\u003c/a\u003e). Ramanan et al. view generation as a possible culmination of self-supervised representation learning, while emphasizing multimodality and efficiency (Section \u003ca href=\"#S2.SS4\"\u003e2.4\u003c/a\u003e). Du uses generative world models for robust perception and visual generation as an interface to action (Section \u003ca href=\"#S2.SS7\"\u003e2.7\u003c/a\u003e). Kataoka et al. treat generation as imagination and combine it with autoregressive prediction and reconstruction-based structural understanding (Section \u003ca href=\"#S2.SS10\"\u003e2.10\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eShangzhe Wu \u0026amp; Jiajun Wu provide a complementary qualification to this emphasis on generation (Section \u003ca href=\"#S2.SS8\"\u003e2.8\u003c/a\u003e). They argue that predicting pixels or producing photorealistic outputs does not by itself demonstrate an understanding of the physical world. Visual intelligence should recover the entities, intrinsic and extrinsic properties, relations, and dynamics that generated an observation, so that the resulting representation can support interventions, simulation, verification, and action.\u003c/p\u003e\n\u003cp\u003eOther contributions emphasize how visual knowledge should be acquired, maintained, and used over time. Asano argues that a visually intelligent system should develop throughout its visual lifetime, rather than remain fixed after pre-training (Section \u003ca href=\"#S2.SS3\"\u003e2.3\u003c/a\u003e). Davison emphasizes persistent but adaptable spatial representations, closed-loop state estimation, and the computational structure needed for real-time Spatial AI (Section \u003ca href=\"#S2.SS6\"\u003e2.6\u003c/a\u003e). Du connects persistent scene representations to action, active exploration, and continual adaptation. Liu further argues that a vision-native system must determine when to look, where to look, and how much visual detail is needed, rather than passively processing a predetermined visual input (Section \u003ca href=\"#S2.SS9\"\u003e2.9\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eThe scope of visual intelligence also extends beyond ordinary visual recognition. Ramanan et al. emphasize raw multimodal experience, including touch, audio, and proprioception. Fouhey’s scientific setting emphasizes validation without conventional ground truth, the handling of sensor systematics and units, and integration with domain knowledge (Section \u003ca href=\"#S2.SS5\"\u003e2.5\u003c/a\u003e). Raghunathan’s account of creativity similarly asks whether a system can construct possibilities that were not explicitly present in its training experience.\u003c/p\u003e\n\u003cp\u003eThese perspectives do not converge on a single model, learning objective, representation, or definition of VGI. They nevertheless share an important premise: visual general intelligence should not be understood simply as a more accurate image recognition system or as a visual encoder attached to a language model. Instead, VGI concerns intelligence that emerges from visual experience and enables a system to discover and verify the structure of the world, maintain and update knowledge over time, predict possible futures, imagine alternatives, reconstruct unobserved structure, and adapt its behavior to unfamiliar situations. Such knowledge should ultimately be tested not only by whether a system can describe or reproduce an observation, but also by whether its representation can be edited, simulated, and used to support reliable action.\u003c/p\u003e\n\u003cp\u003eThe resulting research agenda therefore extends beyond model scale alone. A central challenge is to determine how generation, compositional physical structure, memory, spatial understanding, embodiment, active information acquisition, multimodal experience, and continual learning should be combined within a general visual system. The diversity of positions in this paper suggests that these components should not be treated as isolated capabilities, but as complementary parts of a broader pathway from visual foundation models to visual intelligence and, potentially, to general intelligence.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The perspectives presented in this paper approach visual general intelligence (VGI) from complementary directions. Table [1](#S3.T1) provides a concise summary of their central positions.\n\n\nTable 1: A concise summary of the perspectives on visual general intelligence presented in this paper.\n\nTaken as a whole, the positions can be broadly grouped into the following directions: scaling and generative modeling; creativity, prediction, imagination, and reconstruction; continual and lifelong learning; persistent 3D and spatial world representations; embodiment, active perception, and action; multimodal learning and computational efficiency; scientific discovery and generalization to unfamiliar environments; the recovery of compositional physical structure; and forms of visual intelligence that are not organized primarily around language.\n\nSeveral contributions assign a central role to generative learning. Geirhos argues that generative video models trained on web-scale visual data can acquire general-purpose capabilities because generation requires a model to account for substantially more of the visual world than task-specific recognition (Section [2.1](#S2.SS1)). Raghunathan extends generation beyond fidelity toward creativity, requiring coherent, structurally diverse, original, and useful outputs (Section [2.2](#S2.SS2)). Ramanan et al. view generation as a possible culmination of self-supervised representation learning, while emphasizing multimodality and efficiency (Section [2.4](#S2.SS4)). Du uses generative world models for robust perception and visual generation as an interface to action (Section [2.7](#S2.SS7)). Kataoka et al. treat generation as imagination and combine it with autoregressive prediction and reconstruction-based structural understanding (Section [2.10](#S2.SS10)).\n\nShangzhe Wu \u0026 Jiajun Wu provide a complementary qualification to this emphasis on generation (Section [2.8](#S2.SS8)). They argue that predicting pixels or producing photorealistic outputs does not by itself demonstrate an understanding of the physical world. Visual intelligence should recover the entities, intrinsic and extrinsic properties, relations, and dynamics that generated an observation, so that the resulting representation can support interventions, simulation, verification, and action.\n\nOther contributions emphasize how visual knowledge should be acquired, maintained, and used over time. Asano argues that a visually intelligent system should develop throughout its visual lifetime, rather than remain fixed after pre-training (Section [2.3](#S2.SS3)). Davison emphasizes persistent but adaptable spatial representations, closed-loop state estimation, and the computational structure needed for real-time Spatial AI (Section [2.6](#S2.SS6)). Du connects persistent scene representations to action, active exploration, and continual adaptation. Liu further argues that a vision-native system must determine when to look, where to look, and how much visual detail is needed, rather than passively processing a predetermined visual input (Section [2.9](#S2.SS9)).\n\nThe scope of visual intelligence also extends beyond ordinary visual recognition. Ramanan et al. emphasize raw multimodal experience, including touch, audio, and proprioception. Fouhey’s scientific setting emphasizes validation without conventional ground truth, the handling of sensor systematics and units, and integration with domain knowledge (Section [2.5](#S2.SS5)). Raghunathan’s account of creativity similarly asks whether a system can construct possibilities that were not explicitly present in its training experience.\n\nThese perspectives do not converge on a single model, learning objective, representation, or definition of VGI. They nevertheless share an important premise: visual general intelligence should not be understood simply as a more accurate image recognition system or as a visual encoder attached to a language model. Instead, VGI concerns intelligence that emerges from visual experience and enables a system to discover and verify the structure of the world, maintain and update knowledge over time, predict possible futures, imagine alternatives, reconstruct unobserved structure, and adapt its behavior to unfamiliar situations. Such knowledge should ultimately be tested not only by whether a system can describe or reproduce an observation, but also by whether its representation can be edited, simulated, and used to support reliable action.\n\nThe resulting research agenda therefore extends beyond model scale alone. A central challenge is to determine how generation, compositional physical structure, memory, spatial understanding, embodiment, active information acquisition, multimodal experience, and continual learning should be combined within a general visual system. The diversity of positions in this paper suggests that these components should not be treated as isolated capabilities, but as complementary parts of a broader pathway from visual foundation models to visual intelligence and, potentially, to general intelligence.","sourceFormat":"markdown"},"note:sha256:a869637b1081f0f713c805e08fe985f2f465654b11800b57ac06186bf9ce02e8":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eIt helps to be specific about what this structure of the physical world consists of. First, \u003cem\u003eentities\u003c/em\u003e: a scene decomposes into objects, and objects decompose into parts, recursively. Second, \u003cem\u003eintrinsics\u003c/em\u003e: the properties belonging to an object itself rather than to the circumstances under which it is observed—its geometry, its texture, its material, how its parts are jointed and how far they can move, and physical properties such as mass, friction, and stiffness [\u003ca href=\"#bib.bib86\"\u003e109\u003c/a\u003e, \u003ca href=\"#bib.bib84\"\u003e100\u003c/a\u003e, \u003ca href=\"#bib.bib85\"\u003e55\u003c/a\u003e, \u003ca href=\"#bib.bib88\"\u003e18\u003c/a\u003e, \u003ca href=\"#bib.bib89\"\u003e52\u003c/a\u003e, \u003ca href=\"#bib.bib103\"\u003e53\u003c/a\u003e, \u003ca href=\"#bib.bib104\"\u003e32\u003c/a\u003e, \u003ca href=\"#bib.bib90\"\u003e96\u003c/a\u003e, \u003ca href=\"#bib.bib87\"\u003e33\u003c/a\u003e]. Third, \u003cem\u003eextrinsics\u003c/em\u003e: pose, illumination, and camera, which account for a large share of the variation in the pixels while leaving the objects themselves unchanged, and which are therefore worth factoring out. Fourth, \u003cem\u003erelations\u003c/em\u003e: which object supports which, which part turns which, what is contained in what. Fifth, \u003cem\u003edynamics\u003c/em\u003e: how the state of a scene changes when something acts on it [\u003ca href=\"#bib.bib91\"\u003e95\u003c/a\u003e, \u003ca href=\"#bib.bib105\"\u003e61\u003c/a\u003e, \u003ca href=\"#bib.bib92\"\u003e1\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003eThis decomposition is by no means exhaustive; it is simply the one that has been productive in our own work. It says what should be recovered, not how it should be encoded: a joint axis may be an explicit parameter or a direction implicit in a network’s weights. What is appealing about such a decomposition is that it allows a system to predict precisely the effect of an action: once it represents a joint axis, it can say what happens when the door is pulled; once it represents mass and friction, what happens when the stack is nudged. A representation that leaves these quantities entangled may still reproduce the appearance of a scene very well, while supporting neither.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS8.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eIt helps to be specific about what this structure of the physical world consists of. First, *entities*: a scene decomposes into objects, and objects decompose into parts, recursively. Second, *intrinsics*: the properties belonging to an object itself rather than to the circumstances under which it is observed—its geometry, its texture, its material, how its parts are jointed and how far they can move, and physical properties such as mass, friction, and stiffness [[109](#bib.bib86), [100](#bib.bib84), [55](#bib.bib85), [18](#bib.bib88), [52](#bib.bib89), [53](#bib.bib103), [32](#bib.bib104), [96](#bib.bib90), [33](#bib.bib87)]. Third, *extrinsics*: pose, illumination, and camera, which account for a large share of the variation in the pixels while leaving the objects themselves unchanged, and which are therefore worth factoring out. Fourth, *relations*: which object supports which, which part turns which, what is contained in what. Fifth, *dynamics*: how the state of a scene changes when something acts on it [[95](#bib.bib91), [61](#bib.bib105), [1](#bib.bib92)].\n\nThis decomposition is by no means exhaustive; it is simply the one that has been productive in our own work. It says what should be recovered, not how it should be encoded: a joint axis may be an explicit parameter or a direction implicit in a network’s weights. What is appealing about such a decomposition is that it allows a system to predict precisely the effect of an action: once it represents a joint axis, it can say what happens when the door is pulled; once it represents mass and friction, what happens when the stack is nudged. A representation that leaves these quantities entangled may still reproduce the appearance of a scene very well, while supporting neither.","sourceFormat":"markdown"},"note:sha256:ae96fafedbc64b3faf5d18dd00bea58e8382d3771b1c46b68f70b1ecfa4317f3":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eRaw scale is not the same as visual diversity. More images or videos do not necessarily produce broader visual experience if the data is repetitive, narrow, or biased. Large-scale visual datasets are not automatically diverse. Even datasets that appear broad can contain strong dataset-specific signatures, and understanding these biases is part of understanding what visual experience our models actually receive [\u003ca href=\"#bib.bib58\"\u003e59\u003c/a\u003e, \u003ca href=\"#bib.bib59\"\u003e107\u003c/a\u003e]. Besides improving model skill and scaling compute, we should better understand what kinds of visual experience our datasets provide, what they miss, and how to curate data that is broader, less biased, and more useful for learning general visual abstractions.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px3.p2.1\"\u003e\u003c/span\u003eMost current systems are not designed around vision as a continuous or low-friction channel of context. They require users to manually capture visual information, upload it, and explain why it matters. A more vision-native system would invert this relationship. It would treat visual context as part of the natural interaction between the system, the user, and the world. This becomes especially important as AI systems become more autonomous and world-facing. A robot, a laboratory assistant, or a medical system cannot rely on humans to continuously describe the state of the world [\u003ca href=\"#bib.bib60\"\u003e20\u003c/a\u003e]. It must perceive for itself, decide what matters, detect changes, and use feedback to correct its actions. Vision is not behind language in importance; it is behind language in current interface visibility.\u003c/p\u003e\n\u003cp\u003eI hope future work on VGI will move beyond static image or video question answering. We should ask not only what a model can infer from a given visual input, but whether it knows what it needs to see next. We should also evaluate adaptive visual abstraction: the ability to keep irrelevant regions coarse while inspecting task-relevant details. For me, the key test is simple: can a visual system learn when to look, where to look, and how much detail it needs?\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS9.SSS0.Px3.p1.1\"\u003e\u003c/span\u003eRaw scale is not the same as visual diversity. More images or videos do not necessarily produce broader visual experience if the data is repetitive, narrow, or biased. Large-scale visual datasets are not automatically diverse. Even datasets that appear broad can contain strong dataset-specific signatures, and understanding these biases is part of understanding what visual experience our models actually receive [[59](#bib.bib58), [107](#bib.bib59)]. Besides improving model skill and scaling compute, we should better understand what kinds of visual experience our datasets provide, what they miss, and how to curate data that is broader, less biased, and more useful for learning general visual abstractions.\n\n\u003cspan id=\"S2.SS9.SSS0.Px3.p2.1\"\u003e\u003c/span\u003eMost current systems are not designed around vision as a continuous or low-friction channel of context. They require users to manually capture visual information, upload it, and explain why it matters. A more vision-native system would invert this relationship. It would treat visual context as part of the natural interaction between the system, the user, and the world. This becomes especially important as AI systems become more autonomous and world-facing. A robot, a laboratory assistant, or a medical system cannot rely on humans to continuously describe the state of the world [[20](#bib.bib60)]. It must perceive for itself, decide what matters, detect changes, and use feedback to correct its actions. Vision is not behind language in importance; it is behind language in current interface visibility.\n\nI hope future work on VGI will move beyond static image or video question answering. We should ask not only what a model can infer from a given visual input, but whether it knows what it needs to see next. We should also evaluate adaptive visual abstraction: the ability to keep irrelevant regions coarse while inspecting task-relevant details. For me, the key test is simple: can a visual system learn when to look, where to look, and how much detail it needs?","sourceFormat":"markdown"},"note:sha256:b2eeac3bdc9e414c4ae6f698880df3a27f85dcac56aecc9ce868428f95a9c565":{"blocks":[{"children":[],"kind":"leaf","title":"Today’s strongest visual systems are impressive, but they are not general in the way that matters. They are trained once on large, carefully assembled datasets and then deployed as essentially fixed models. They can recognise objects, reconstruct scenes, answer questions about images, or follow textual instructions. Yet they do not build up a coherent understanding of the world through experience, nor do they continue to reorganise that understanding as the world changes. Today, our field knows one “fix” to this: add more data \u0026 (re-)train."},{"children":[],"kind":"leaf","title":"In my opinion, a visually generally intelligent system should learn from visual experience as it unfolds: continuously, without labels, without repeated reshuffling of the past, and without assuming that the important tasks are known in advance. If we could build such a system, we could have adaptive, continuously improving models and agents that require the equivalent of one light-bulb of energy for updating weights, not that of a city."},{"children":[],"kind":"leaf","title":"The starting point is vision rather than language. Before an intelligent system can describe the world, it must first discover its structure. It must learn which parts of an observation belong together, which objects persist across viewpoints and interruptions, how the observer itself is moving, what changes independently in the scene, and which regularities remain stable over days, months, or years."},{"children":[],"kind":"leaf","title":"The aim is not simply to train a larger video model. Current video models are powerful and general perceptual modules, but they operate on data that have already been collected, segmented, shuffled, and revisited.22 2 And I also believe it’s a reasonable bet to scale towards a practical definition of VGI with video generative models. To me, Visual General Intelligence instead asks how a system can learn during its own visual lifetime. It should know what it has seen before, detect when something genuinely new has happened, decide which parts of itself should change, and retain knowledge that remains useful. This system requires less a continual learning solution, but rather a whole learning system that can work autonomously in an open-ended way. Think of a baby: no goal, no talking, no problem. A somewhat rough mental comparison sketch would be today’s coding agents that can themselves spawn sub-agents—but instead for vision and from scratch and without language."},{"children":[{"title":"• A perceptual system that turns the current visual stream into objects, regions, surfaces, motion, and semantic features.44 4 How does even one best represent video? Frames are redundant, codec is difficult, object-centric somewhat arbitrary."},{"title":"• A spatial and dynamic world model that maintains hypotheses about geometry, viewpoint, object identity, motion, and causal change. It should distinguish changes caused by the observer from changes caused by the world."},{"title":"• A memory system that stores information at different timescales."},{"title":"• A task and action interface that exposes the learned visual knowledge to downstream systems, including robots, scientific instruments, search tools, and human users."}],"kind":"section","title":"What seems obvious is that this does not get solved by simply having a bigger Transformer and current learning paradigms.33 3 Happy to be wrong, I like simplicity. Instead, a plausible artificial visual brain should contain several interacting systems"},{"children":[],"kind":"leaf","title":"These modules need not be hand-designed as rigid symbolic components. They may be neural, differentiable, and jointly trained. But they should have distinct roles, update rules, and timescales. The brain is not one homogeneous block, and an artificial learner that must remain stable while continuing to change is unlikely to be one either."},{"children":[],"kind":"leaf","title":"Language enters later as an interface to this visual intelligence. It can name concepts, communicate goals, collaborate, and provide occasional supervision. But language should not be the sole organising principle of the visual system. Much of the world’s structure—depth, motion, persistence, containment, contact, and affordance—exists before it is named. A visually intelligent system should therefore be able to learn these regularities without captions and only subsequently connect them to words. Language becomes a way to query, steer [75], and teach an already grounded world model, rather than a substitute for one."},{"children":[],"kind":"leaf","title":"The long-term objective is a visual system that grows with experience. It should become more competent, more structured, and more useful the longer it observes the world; without needing to be reset, retrained from scratch, or told in advance everything it will eventually need to understand."}],"html":"\u003cp\u003eToday’s strongest visual systems are impressive, but they are not general in the way that matters. They are trained once on large, carefully assembled datasets and then deployed as essentially fixed models. They can recognise objects, reconstruct scenes, answer questions about images, or follow textual instructions. Yet they do not build up a coherent understanding of the world through experience, nor do they continue to reorganise that understanding as the world changes. Today, our field knows one “fix” to this: add more data \u0026amp; (re-)train.\u003c/p\u003e\n\u003cp\u003eIn my opinion, a visually generally intelligent system should learn from visual experience as it unfolds: continuously, without labels, without repeated reshuffling of the past, and without assuming that the important tasks are known in advance. If we could build such a system, we could have adaptive, continuously improving models and agents that require the equivalent of one light-bulb of energy for updating weights, not that of a city.\u003c/p\u003e\n\u003cp\u003eThe starting point is vision rather than language. Before an intelligent system can describe the world, it must first discover its structure. It must learn which parts of an observation belong together, which objects persist across viewpoints and interruptions, how the observer itself is moving, what changes independently in the scene, and which regularities remain stable over days, months, or years.\u003c/p\u003e\n\u003cp\u003eThe aim is not simply to train a larger video model. Current video models are powerful and general perceptual modules, but they operate on data that have already been collected, segmented, shuffled, and revisited.22 2 And I also believe it’s a reasonable bet to scale towards a practical definition of VGI with video generative models. To me, Visual General Intelligence instead asks how a system can learn \u003cem\u003eduring its own visual lifetime\u003c/em\u003e. It should know what it has seen before, detect when something genuinely new has happened, decide which parts of itself should change, and retain knowledge that remains useful. This system requires less a continual learning solution, but rather a whole learning system that can work autonomously in an open-ended way. Think of a baby: no goal, no talking, no problem. A somewhat rough mental comparison sketch would be today’s coding agents that can themselves spawn sub-agents—but instead for vision and from scratch and without language.\u003c/p\u003e\n\u003cp\u003eWhat seems obvious is that this does not get solved by simply having a bigger Transformer and current learning paradigms.33 3 Happy to be wrong, I like simplicity. Instead, a plausible artificial visual brain should contain several interacting systems:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e• A perceptual system that turns the current visual stream into objects, regions, surfaces, motion, and semantic features.44 4 How does even one best represent video? Frames are redundant, codec is difficult, object-centric somewhat arbitrary.\u003c/li\u003e\n\u003cli\u003e• A spatial and dynamic world model that maintains hypotheses about geometry, viewpoint, object identity, motion, and causal change. It should distinguish changes caused by the observer from changes caused by the world.\u003c/li\u003e\n\u003cli\u003e• A memory system that stores information at different timescales.\u003c/li\u003e\n\u003cli\u003e• A task and action interface that exposes the learned visual knowledge to downstream systems, including robots, scientific instruments, search tools, and human users.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThese modules need not be hand-designed as rigid symbolic components. They may be neural, differentiable, and jointly trained. But they should have distinct roles, update rules, and timescales. The brain is not one homogeneous block, and an artificial learner that must remain stable while continuing to change is unlikely to be one either.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS3.p8.1\"\u003e\u003c/span\u003eLanguage enters later as an interface to this visual intelligence. It can name concepts, communicate goals, collaborate, and provide occasional supervision. But language should not be the sole organising principle of the visual system. Much of the world’s structure—depth, motion, persistence, containment, contact, and affordance—exists before it is named. A visually intelligent system should therefore be able to learn these regularities without captions and only subsequently connect them to words. Language becomes a way to query, steer [\u003ca href=\"#bib.bib20\"\u003e75\u003c/a\u003e], and teach an already grounded world model, rather than a substitute for one.\u003c/p\u003e\n\u003cp\u003eThe long-term objective is a visual system that grows with experience. It should become more competent, more structured, and more useful the longer it observes the world; without needing to be reset, retrained from scratch, or told in advance everything it will eventually need to understand.\u003c/p\u003e\n","kind":"structured","rawMarkdown":"Today’s strongest visual systems are impressive, but they are not general in the way that matters. They are trained once on large, carefully assembled datasets and then deployed as essentially fixed models. They can recognise objects, reconstruct scenes, answer questions about images, or follow textual instructions. Yet they do not build up a coherent understanding of the world through experience, nor do they continue to reorganise that understanding as the world changes. Today, our field knows one “fix” to this: add more data \u0026 (re-)train.\n\nIn my opinion, a visually generally intelligent system should learn from visual experience as it unfolds: continuously, without labels, without repeated reshuffling of the past, and without assuming that the important tasks are known in advance. If we could build such a system, we could have adaptive, continuously improving models and agents that require the equivalent of one light-bulb of energy for updating weights, not that of a city.\n\nThe starting point is vision rather than language. Before an intelligent system can describe the world, it must first discover its structure. It must learn which parts of an observation belong together, which objects persist across viewpoints and interruptions, how the observer itself is moving, what changes independently in the scene, and which regularities remain stable over days, months, or years.\n\nThe aim is not simply to train a larger video model. Current video models are powerful and general perceptual modules, but they operate on data that have already been collected, segmented, shuffled, and revisited.22 2 And I also believe it’s a reasonable bet to scale towards a practical definition of VGI with video generative models. To me, Visual General Intelligence instead asks how a system can learn *during its own visual lifetime*. It should know what it has seen before, detect when something genuinely new has happened, decide which parts of itself should change, and retain knowledge that remains useful. This system requires less a continual learning solution, but rather a whole learning system that can work autonomously in an open-ended way. Think of a baby: no goal, no talking, no problem. A somewhat rough mental comparison sketch would be today’s coding agents that can themselves spawn sub-agents—but instead for vision and from scratch and without language.\n\nWhat seems obvious is that this does not get solved by simply having a bigger Transformer and current learning paradigms.33 3 Happy to be wrong, I like simplicity. Instead, a plausible artificial visual brain should contain several interacting systems:\n\n- • A perceptual system that turns the current visual stream into objects, regions, surfaces, motion, and semantic features.44 4 How does even one best represent video? Frames are redundant, codec is difficult, object-centric somewhat arbitrary.\n- • A spatial and dynamic world model that maintains hypotheses about geometry, viewpoint, object identity, motion, and causal change. It should distinguish changes caused by the observer from changes caused by the world.\n- • A memory system that stores information at different timescales.\n- • A task and action interface that exposes the learned visual knowledge to downstream systems, including robots, scientific instruments, search tools, and human users.\n\nThese modules need not be hand-designed as rigid symbolic components. They may be neural, differentiable, and jointly trained. But they should have distinct roles, update rules, and timescales. The brain is not one homogeneous block, and an artificial learner that must remain stable while continuing to change is unlikely to be one either.\n\n\u003cspan id=\"S2.SS3.p8.1\"\u003e\u003c/span\u003eLanguage enters later as an interface to this visual intelligence. It can name concepts, communicate goals, collaborate, and provide occasional supervision. But language should not be the sole organising principle of the visual system. Much of the world’s structure—depth, motion, persistence, containment, contact, and affordance—exists before it is named. A visually intelligent system should therefore be able to learn these regularities without captions and only subsequently connect them to words. Language becomes a way to query, steer [[75](#bib.bib20)], and teach an already grounded world model, rather than a substitute for one.\n\nThe long-term objective is a visual system that grows with experience. It should become more competent, more structured, and more useful the longer it observes the world; without needing to be reset, retrained from scratch, or told in advance everything it will eventually need to understand.","sourceFormat":"markdown"},"note:sha256:b6572a93ff0d8725cdff3bb582be48f0c84237beb188ae7660a62be3d41f5d97":{"html":"\u003cp\u003eHuman vision is an extremely strong baseline. It has been shaped by a long evolutionary process, and most people use it with little conscious effort. We recognize objects, navigate cluttered environments, and correct our actions through visual feedback almost continuously. This may partly explain why language progress looks so striking. In language, AI systems compete against a more variable and culturally trained human baseline. In vision, they compete against one of biology’s most mature intelligence systems.\u003c/p\u003e\n\u003cp\u003eThis does not make vision less important. It suggests the opposite. Vision is one of the main ways humans experience and organize the world. Human thought is often expressed in language, but many internal cognitive processes are visual or spatial. We imagine scenes, reason about object relations, and plan actions in ways that are not naturally text-token-like. I do not know whether this is the missing ingredient in current AI systems. But I suspect that text-dominated training may miss an important kind of experience: grounded, spatial, continuous, and action-oriented visual experience.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Human vision is an extremely strong baseline. It has been shaped by a long evolutionary process, and most people use it with little conscious effort. We recognize objects, navigate cluttered environments, and correct our actions through visual feedback almost continuously. This may partly explain why language progress looks so striking. In language, AI systems compete against a more variable and culturally trained human baseline. In vision, they compete against one of biology’s most mature intelligence systems.\n\nThis does not make vision less important. It suggests the opposite. Vision is one of the main ways humans experience and organize the world. Human thought is often expressed in language, but many internal cognitive processes are visual or spatial. We imagine scenes, reason about object relations, and plan actions in ways that are not naturally text-token-like. I do not know whether this is the missing ingredient in current AI systems. But I suspect that text-dominated training may miss an important kind of experience: grounded, spatial, continuous, and action-oriented visual experience.","sourceFormat":"markdown"},"note:sha256:bca35fe6a8439f0a899db40215b8e69d221570f0e78dc61b5c9b1b15e2c711b5":{"html":"\u003cp\u003eGeirhos argues that generative models trained on large-scale video data may acquire generalized capabilities across a range of downstream tasks that are not specified individually during training. Other positions similarly regard these large-scale generative models as a major milestone in different contexts: Ramanan connects them to representation learning, Du to world modeling and action, Raghunathan to creativity, and Kataoka et al. to imagination.\u003c/p\u003e\n\u003cp\u003eHowever, scaling the volume of training data alone is not sufficient. Liu and Ramanan emphasize the importance of collecting diverse visual data, rather than simply exposing models to vast quantities of data in similar patterns. Meanwhile, Fouhey highlights the need for techniques capable of capturing scientific phenomena only available in a small amount of data. Shangzhe Wu \u0026amp; Jiajun Wu further distinguish photorealistic appearance from physical understanding. A model may generate a visually plausible event without understanding the underlying physical properties that govern it. We may therefore need to investigate representations of physical structure that can be inspected, edited, simulated, and verified.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Geirhos argues that generative models trained on large-scale video data may acquire generalized capabilities across a range of downstream tasks that are not specified individually during training. Other positions similarly regard these large-scale generative models as a major milestone in different contexts: Ramanan connects them to representation learning, Du to world modeling and action, Raghunathan to creativity, and Kataoka et al. to imagination.\n\nHowever, scaling the volume of training data alone is not sufficient. Liu and Ramanan emphasize the importance of collecting diverse visual data, rather than simply exposing models to vast quantities of data in similar patterns. Meanwhile, Fouhey highlights the need for techniques capable of capturing scientific phenomena only available in a small amount of data. Shangzhe Wu \u0026 Jiajun Wu further distinguish photorealistic appearance from physical understanding. A model may generate a visually plausible event without understanding the underlying physical properties that govern it. We may therefore need to investigate representations of physical structure that can be inspected, edited, simulated, and verified.","sourceFormat":"markdown"},"note:sha256:cecf849d47ef6c0fa45f2e4ce894b00b521933506a52c133b8d2cf0ee4a11c51":{"html":"\u003cp\u003eThe move from CPUs to GPUs over the past 15 years as the dominant processors of AI is only the beginning of a trend. The key to efficiency in computation is to fully embrace parallelism, with work done by a very large number of relatively simple cores, but also to reduce data movement around chips and the larger systems they form. This implies a long term move towards processors with very fine-grained parallelism, and with memory distributed across processing tiles, which are connected by sparse communication channels which respect locality. These processors will also inevitably trend towards asynchronous, event-driven operation and low bit-rate or even analog representation of numbers, as these properties also maximize efficiency.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The move from CPUs to GPUs over the past 15 years as the dominant processors of AI is only the beginning of a trend. The key to efficiency in computation is to fully embrace parallelism, with work done by a very large number of relatively simple cores, but also to reduce data movement around chips and the larger systems they form. This implies a long term move towards processors with very fine-grained parallelism, and with memory distributed across processing tiles, which are connected by sparse communication channels which respect locality. These processors will also inevitably trend towards asynchronous, event-driven operation and low bit-rate or even analog representation of numbers, as these properties also maximize efficiency.","sourceFormat":"markdown"},"note:sha256:d3eb839d8f6a2ce3d2c7799560ec1b7509d55343863f1010f2bff40d0d3f5e91":{"html":"\u003cp\u003eAction is not only an output of visual intelligence; it is also a means of obtaining visual evidence. By moving to informative viewpoints and physically interacting with objects, a robot can resolve perceptual ambiguities and reveal properties, affordances, and dynamics that passive observation may leave uncertain. Changing viewpoint can resolve occlusion, while pushing, lifting, or opening an object can provide evidence about its articulation, stability, and physical behavior. Such interactions can also expose limitations in the robot’s current visual model.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px4.p2.1\"\u003e\u003c/span\u003eClassic evidence from biological vision supports the importance of coupling perception with self-generated action. In Held and Hein’s experiment, pairs of kittens received closely matched visual input, but only the kittens whose own movements controlled that input developed normal visually guided behavior [\u003ca href=\"#bib.bib70\"\u003e39\u003c/a\u003e]. Earlier work from our group explored an initial step toward active visual learning by training a curiosity-driven policy to seek regions of an environment that maximize surprisal under a learned visual representation model [\u003ca href=\"#bib.bib63\"\u003e21\u003c/a\u003e]. Such targeted interaction makes action a mechanism for selecting the experience from which the visual system learns.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Action is not only an output of visual intelligence; it is also a means of obtaining visual evidence. By moving to informative viewpoints and physically interacting with objects, a robot can resolve perceptual ambiguities and reveal properties, affordances, and dynamics that passive observation may leave uncertain. Changing viewpoint can resolve occlusion, while pushing, lifting, or opening an object can provide evidence about its articulation, stability, and physical behavior. Such interactions can also expose limitations in the robot’s current visual model.\n\n\u003cspan id=\"S2.SS7.SSS0.Px4.p2.1\"\u003e\u003c/span\u003eClassic evidence from biological vision supports the importance of coupling perception with self-generated action. In Held and Hein’s experiment, pairs of kittens received closely matched visual input, but only the kittens whose own movements controlled that input developed normal visually guided behavior [[39](#bib.bib70)]. Earlier work from our group explored an initial step toward active visual learning by training a curiosity-driven policy to seek regions of an environment that maximize surprisal under a learned visual representation model [[21](#bib.bib63)]. Such targeted interaction makes action a mechanism for selecting the experience from which the visual system learns.","sourceFormat":"markdown"},"note:sha256:d46733eb0ddb57da587eb78521177d5e93af01815f47b3ed48a51da307e917b0":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS6.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eSLAM is notable within the broader picture of artificial intelligence in that it has not yet been completely dominated by machine learning. The best performing methods for localization and sparse mapping are still mostly hand-designed algorithms using geometry and probabilistic state estimation; and dense and semantic SLAM systems use a balance, where ML is used to replace part of or add to the functionality of state estimation (e.g. MASt3R-SLAM [\u003ca href=\"#bib.bib81\"\u003e68\u003c/a\u003e]).\u003c/p\u003e\n\u003cp\u003eIt is natural to ask whether the whole of SLAM and Spatial AI will ultimately be performed end-to-end by a neural network, with no hand-designed representations or algorithms at all, and much recent research on 3D foundation models is moving in this direction. In my opinion, this is not the most important question. Spatial AI systems of the future will surely have learned and designed components so tightly integrated that it is hard to tell which is which; and this position may be reached either by adding more and more learned modules to a designed system, or by adding structure to a purely learned system. What remains important in either case, is the storage and computational structure of the whole system. If it is to have the properties that real applications demand: efficient, composable, and shareable with other devices and human users; then I believe that either method will converge on similar properties.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS6.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eSLAM is notable within the broader picture of artificial intelligence in that it has not yet been completely dominated by machine learning. The best performing methods for localization and sparse mapping are still mostly hand-designed algorithms using geometry and probabilistic state estimation; and dense and semantic SLAM systems use a balance, where ML is used to replace part of or add to the functionality of state estimation (e.g. MASt3R-SLAM [[68](#bib.bib81)]).\n\nIt is natural to ask whether the whole of SLAM and Spatial AI will ultimately be performed end-to-end by a neural network, with no hand-designed representations or algorithms at all, and much recent research on 3D foundation models is moving in this direction. In my opinion, this is not the most important question. Spatial AI systems of the future will surely have learned and designed components so tightly integrated that it is hard to tell which is which; and this position may be reached either by adding more and more learned modules to a designed system, or by adding structure to a purely learned system. What remains important in either case, is the storage and computational structure of the whole system. If it is to have the properties that real applications demand: efficient, composable, and shareable with other devices and human users; then I believe that either method will converge on similar properties.","sourceFormat":"markdown"},"note:sha256:dd286b237cc99c220fd272ed08385c0813df7cda2d609fd88d0f9299b7c5a2e8":{"html":"\u003cp\u003eBefore asking whether visual intelligence can lead to general intelligence, a more immediate question is whether intelligence can emerge from visual experience itself. Current AI systems often treat vision as an input while assigning abstraction and reasoning primarily to language. Several perspectives in this paper challenge this division. Asano argues that objects, depth, motion, persistence, and affordance can be learned before they are named. Liu similarly emphasizes that grounded, spatial, and action-oriented experience is not naturally reducible to text tokens. Shangzhe Wu \u0026amp; Jiajun Wu add that visual observations contain physical properties and dynamics that may never have been described in language. Together with Kataoka et al., these positions leave open a grounded and potentially independent path from visual experience to intelligence.\u003c/p\u003e\n\u003cp\u003eThis does not make language or other modalities unnecessary. Ramanan emphasizes audio, touch, and proprioception, while Du connects vision to action and physical feedback. The open question is whether visual grounding should precede multimodal integration or emerge jointly with it. In either case, vision should not be reduced to an input channel for an otherwise language-centered system.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Before asking whether visual intelligence can lead to general intelligence, a more immediate question is whether intelligence can emerge from visual experience itself. Current AI systems often treat vision as an input while assigning abstraction and reasoning primarily to language. Several perspectives in this paper challenge this division. Asano argues that objects, depth, motion, persistence, and affordance can be learned before they are named. Liu similarly emphasizes that grounded, spatial, and action-oriented experience is not naturally reducible to text tokens. Shangzhe Wu \u0026 Jiajun Wu add that visual observations contain physical properties and dynamics that may never have been described in language. Together with Kataoka et al., these positions leave open a grounded and potentially independent path from visual experience to intelligence.\n\nThis does not make language or other modalities unnecessary. Ramanan emphasizes audio, touch, and proprioception, while Du connects vision to action and physical feedback. The open question is whether visual grounding should precede multimodal integration or emerge jointly with it. In either case, vision should not be reduced to an input channel for an otherwise language-centered system.","sourceFormat":"markdown"},"note:sha256:e547bc281b6e579dea906392b2655711e6d5c94f180c9a82c433ea798662e0c4":{"html":"\u003cp\u003eActive exploration is valuable only if the resulting evidence can be incorporated into the visual model. A robot will inevitably encounter unfamiliar objects, materials, and visual phenomena—for example, transparent or refractive surfaces—that are not adequately represented in its initial training data. Its visual system should therefore remain plastic after deployment, continually revising its representations and world model in light of new experience.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px5.p2.1\"\u003e\u003c/span\u003eRecent work from our group explores preliminary mechanisms for such self-improvement: SILVR improves a video-based robotic planner using trajectories generated through the agent’s own interactions [\u003ca href=\"#bib.bib71\"\u003e60\u003c/a\u003e], while World Action Verifier uses detected prediction failures to guide targeted data collection and world-model refinement [\u003ca href=\"#bib.bib72\"\u003e58\u003c/a\u003e]. A central challenge is to incorporate genuinely new experience without catastrophically forgetting previously acquired knowledge [\u003ca href=\"#bib.bib73\"\u003e65\u003c/a\u003e]. One promising direction is a “wake–sleep” process that separates online interaction and experience gathering from periodic knowledge consolidation. Together, these components form a closed visual learning loop: infer structured scene explanations, maintain them over time, predict how the visual world will evolve under action, intervene to obtain informative evidence, and revise the model when prediction and observation disagree.\u003c/p\u003e\n","kind":"html","rawMarkdown":"Active exploration is valuable only if the resulting evidence can be incorporated into the visual model. A robot will inevitably encounter unfamiliar objects, materials, and visual phenomena—for example, transparent or refractive surfaces—that are not adequately represented in its initial training data. Its visual system should therefore remain plastic after deployment, continually revising its representations and world model in light of new experience.\n\n\u003cspan id=\"S2.SS7.SSS0.Px5.p2.1\"\u003e\u003c/span\u003eRecent work from our group explores preliminary mechanisms for such self-improvement: SILVR improves a video-based robotic planner using trajectories generated through the agent’s own interactions [[60](#bib.bib71)], while World Action Verifier uses detected prediction failures to guide targeted data collection and world-model refinement [[58](#bib.bib72)]. A central challenge is to incorporate genuinely new experience without catastrophically forgetting previously acquired knowledge [[65](#bib.bib73)]. One promising direction is a “wake–sleep” process that separates online interaction and experience gathering from periodic knowledge consolidation. Together, these components form a closed visual learning loop: infer structured scene explanations, maintain them over time, predict how the visual world will evolve under action, intervene to obtain informative evidence, and revise the model when prediction and observation disagree.","sourceFormat":"markdown"},"note:sha256:e78cb9259399ede374c28a5a5df2a54b7f19c5d8b0f2a6183d4f0a8b31a6199b":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eMachine learning models love to learn shortcuts—the easiest solutions they can find to solve a given objective [\u003ca href=\"#bib.bib38\"\u003e30\u003c/a\u003e], if only superficially. As a consequence, we need to make the training objective as hard as we can. For example, training classifiers on ImageNet is too easy; they can simply learn to exploit textures [\u003ca href=\"#bib.bib40\"\u003e31\u003c/a\u003e] or the image background [\u003ca href=\"#bib.bib41\"\u003e6\u003c/a\u003e] as predictive features, predicting ‘elephant’ whenever a grey leather-like pattern is detected, or predicting ‘cow’ whenever grass is present. However, training a \u003cem\u003egenerative\u003c/em\u003e model on visual data requires solving a much harder task. Here, the model cannot simply get away with generating grass without the cow, as the generative objective forces the model to get everything right: the object, the background, the textures, the shapes, the lighting and the shadows—lest it be punished by the training objective. It is this intuition that makes me confident that generative models will be able to solve visual intelligence, simply because their training task is hard enough to be meaningful, forcing them to learn much about the world by virtue of prediction.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS1.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eMachine learning models love to learn shortcuts—the easiest solutions they can find to solve a given objective [[30](#bib.bib38)], if only superficially. As a consequence, we need to make the training objective as hard as we can. For example, training classifiers on ImageNet is too easy; they can simply learn to exploit textures [[31](#bib.bib40)] or the image background [[6](#bib.bib41)] as predictive features, predicting ‘elephant’ whenever a grey leather-like pattern is detected, or predicting ‘cow’ whenever grass is present. However, training a *generative* model on visual data requires solving a much harder task. Here, the model cannot simply get away with generating grass without the cow, as
