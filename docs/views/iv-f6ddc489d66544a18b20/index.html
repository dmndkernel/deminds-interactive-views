ons of objects not encountered during training [\u003ca href=\"#bib.bib64\"\u003e89\u003c/a\u003e].\u003c/p\u003e\n","kind":"html","rawMarkdown":"Embodied agents will routinely encounter observations outside their training distributions, where current visual systems may fail unpredictably—and, in robotic settings, sometimes catastrophically. A central challenge for visual intelligence is therefore to generalize robustly across open-ended changes in viewpoint, environment, object configuration, and interaction.\n\n\u003cspan id=\"S2.SS7.SSS0.Px1.p2.1\"\u003e\u003c/span\u003eOne promising route toward such robustness is to construct generative world models and formulate perception as inference over the latent scene states that could have produced an observation. Because visual observations arise from recurring physical regularities—including geometry, objects, relations, and dynamics—such models can explain unfamiliar scenes by reusing and recombining previously acquired knowledge. Explicit 3D structure [[54](#bib.bib65)] and compositional structure [[22](#bib.bib66), [89](#bib.bib64), [114](#bib.bib67)] can provide useful inductive biases for data-efficient learning and systematic generalization. This approach follows the long-standing paradigm of “analysis by synthesis” [[106](#bib.bib68), [48](#bib.bib69)], in which visual understanding is achieved by inferring a latent scene explanation whose synthesized observations agree with the input. Consistent with this view, earlier work from our group showed that generative compositional models can generalize to scenes containing numbers and configurations of objects not encountered during training [[89](#bib.bib64)].","sourceFormat":"markdown"},"note:sha256:34ff345c57390bc49235236fb40c80e7d97710a8b143f495cf2bea67596975d1":{"html":"\u003cp\u003eIf processors and memory do become increasingly granular, with local memory and sparse connections between tiles, then the ‘bitter lesson’ is that algorithms which map best to these designs will perform best. The FutureMapping papers describe how the route forward is to find the graphs in data and processing structures in Spatial AI algorithms, and to as far as possible match these to hardware by essentially laying those graphs down geographically onto chips. Algorithmically, we need to focus on methods which can perform inference and learning via message passing on general, loopy graphs; a strong candidate is belief propagation which has powerful properties of distributed convergence, even with asynchronous or lossy communication.\u003c/p\u003e\n\u003cp\u003eElements such as the representation of the scene around a robot have their own integral graph structure, as revealed by many SLAM approaches, and these must be designed to have efficient interfaces to the main real-time processing loops which handle live data from sensors and outputs to actuators. Also, very specialised processors will be located close to (or even within) sensors and actuators themselves, such that the communication between them can be at the abstract level of actionable information rather than large flows of data such as video.\u003c/p\u003e\n\u003cp\u003eIn many ways, we may speculate that the drive towards efficient, modular implementation may drive Spatial AI systems to be increasingly like biological brains, which have huge capability with very high efficiency.\u003c/p\u003e\n","kind":"html","rawMarkdown":"If processors and memory do become increasingly granular, with local memory and sparse connections between tiles, then the ‘bitter lesson’ is that algorithms which map best to these designs will perform best. The FutureMapping papers describe how the route forward is to find the graphs in data and processing structures in Spatial AI algorithms, and to as far as possible match these to hardware by essentially laying those graphs down geographically onto chips. Algorithmically, we need to focus on methods which can perform inference and learning via message passing on general, loopy graphs; a strong candidate is belief propagation which has powerful properties of distributed convergence, even with asynchronous or lossy communication.\n\nElements such as the representation of the scene around a robot have their own integral graph structure, as revealed by many SLAM approaches, and these must be designed to have efficient interfaces to the main real-time processing loops which handle live data from sensors and outputs to actuators. Also, very specialised processors will be located close to (or even within) sensors and actuators themselves, such that the communication between them can be at the abstract level of actionable information rather than large flows of data such as video.\n\nIn many ways, we may speculate that the drive towards efficient, modular implementation may drive Spatial AI systems to be increasingly like biological brains, which have huge capability with very high efficiency.","sourceFormat":"markdown"},"note:sha256:4682347abc5704d110bb30f4b1ba8f547e3be4bf9b6169a6d1420531baf6b54f":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS7.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eSuch inference cannot restart from each individual frame. For a robot to operate autonomously over days or longer, it must integrate a continuous stream of partial observations into a persistent and internally consistent representation of its environment. This representation must associate observations across changes in viewpoint and occlusion, preserve the identities and relationships of entities, and update as the physical world changes. Our group has explored object-centric representations that maintain individual entities over time [\u003ca href=\"#bib.bib76\"\u003e23\u003c/a\u003e, \u003ca href=\"#bib.bib77\"\u003e28\u003c/a\u003e], as well as scene-level 3D memories that aggregate observations across an environment [\u003ca href=\"#bib.bib78\"\u003e103\u003c/a\u003e]. A key direction is to develop dynamic, hierarchical representations that connect global scene structure to objects, parts, and their relationships while tracking how each level evolves over time. These representations should support incremental updates and task-dependent retrieval at the appropriate level of abstraction. The goal is therefore not simply a persistent map, but a revisable scene representation that supports prediction, action, and targeted information gathering.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS7.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eSuch inference cannot restart from each individual frame. For a robot to operate autonomously over days or longer, it must integrate a continuous stream of partial observations into a persistent and internally consistent representation of its environment. This representation must associate observations across changes in viewpoint and occlusion, preserve the identities and relationships of entities, and update as the physical world changes. Our group has explored object-centric representations that maintain individual entities over time [[23](#bib.bib76), [28](#bib.bib77)], as well as scene-level 3D memories that aggregate observations across an environment [[103](#bib.bib78)]. A key direction is to develop dynamic, hierarchical representations that connect global scene structure to objects, parts, and their relationships while tracking how each level evolves over time. These representations should support incremental updates and task-dependent retrieval at the appropriate level of abstraction. The goal is therefore not simply a persistent map, but a revisable scene representation that supports prediction, action, and targeted information gathering.","sourceFormat":"markdown"},"note:sha256:49c9f0618642300968a93e6e9ddf79e72579b67566018238ba0aa1ff4b052b22":{"html":"\u003cblockquote\u003e\n\u003cp\u003eAuthors: Hirokatsu Kataoka, Yoshihiro Fukuhara, Yonglong Tian, Shangzhe Wu, Oishi Deb, Ryousuke Yamada, Christian Rupprecht, Jianyuan Wang, Kohsuke Ide, Koichi Namekata, Xianzheng Ma, Yiming Chen, Robert Geirhos, Aditi Raghunathan, Yuki M. Asano, Deva Ramanan, David Fouhey, Andrew J. Davison, Yilun Du, Jiajun Wu, Zhuang Liu\u003cbr\u003eAffiliations: National Institute of Advanced Industrial Science and Technology (AIST) · Visual Geometry Group (VGG), University of Oxford · CADDi · OpenAI · University of Cambridge · University of Technology Nuremberg · University of Tsukuba · Google DeepMind · Carnegie Mellon University · New York University · Imperial College London · Harvard University · Stanford University · Princeton University\u003cbr\u003e\u003ca href=\"https://arxiv.org/html/2608.25924\" target=\"_blank\" rel=\"noopener noreferrer\"\u003earXiv:2608.25924v1\u003c/a\u003e · cs.CV · 2026-08-26\u003c/p\u003e\n\u003c/blockquote\u003e\n","kind":"html","rawMarkdown":"\u003e Authors: Hirokatsu Kataoka, Yoshihiro Fukuhara, Yonglong Tian, Shangzhe Wu, Oishi Deb, Ryousuke Yamada, Christian Rupprecht, Jianyuan Wang, Kohsuke Ide, Koichi Namekata, Xianzheng Ma, Yiming Chen, Robert Geirhos, Aditi Raghunathan, Yuki M. Asano, Deva Ramanan, David Fouhey, Andrew J. Davison, Yilun Du, Jiajun Wu, Zhuang Liu\n\u003e Affiliations: National Institute of Advanced Industrial Science and Technology \\(AIST\\) · Visual Geometry Group \\(VGG\\), University of Oxford · CADDi · OpenAI · University of Cambridge · University of Technology Nuremberg · University of Tsukuba · Google DeepMind · Carnegie Mellon University · New York University · Imperial College London · Harvard University · Stanford University · Princeton University\n\u003e [arXiv:2608.25924v1](https://arxiv.org/html/2608.25924) · cs.CV · 2026-08-26","sourceFormat":"markdown"},"note:sha256:4d23ffa38c21973fd39b6e49f61514337c065fd0dd762715accece4c0fff7a22":{"html":"\u003cp\u003eA representation is a set of values describing the state of a device and the world around it. It must be persistent, but adaptable; always changing as new information is acquired about the world, or as the world itself changes. This enables a robot to predict and plan. The term ‘world model’ has recently become popular in machine learning research, but scene representation has a long history in AI and robotics. SLAM (Simultaneous Localisation and Mapping) research is the most clear example of how incrementally building persistent world representations enables consistent, long-horizon behavior. Simple visual SLAM maps of sparse features enable reliable long-term navigation to multiple waypoints, or guaranteed area coverage. But the representation possible in real-time visual SLAM has steadily improved, towards dense maps, semantic labels, and explicit object-level scene graphs, sometimes with estimated physics and dynamics properties. Additionally, these representations do not necessarily aim to be globally metrically precise, but can be accurate locally and more approximate at large scales.\u003c/p\u003e\n\u003cp\u003eMy argument that visual SLAM research is evolving into Spatial AI is especially because this area has long been driven by live demonstrations, a focus on efficiency, the use of low-cost hardware, real-time visualizations, and the release of open source code. SLAM researchers have long been obsessed by the key questions of how to continually build a persistent representation from a multi-sensor stream of data without drift and within fixed computation and memory budgets.\u003c/p\u003e\n","kind":"html","rawMarkdown":"A representation is a set of values describing the state of a device and the world around it. It must be persistent, but adaptable; always changing as new information is acquired about the world, or as the world itself changes. This enables a robot to predict and plan. The term ‘world model’ has recently become popular in machine learning research, but scene representation has a long history in AI and robotics. SLAM (Simultaneous Localisation and Mapping) research is the most clear example of how incrementally building persistent world representations enables consistent, long-horizon behavior. Simple visual SLAM maps of sparse features enable reliable long-term navigation to multiple waypoints, or guaranteed area coverage. But the representation possible in real-time visual SLAM has steadily improved, towards dense maps, semantic labels, and explicit object-level scene graphs, sometimes with estimated physics and dynamics properties. Additionally, these representations do not necessarily aim to be globally metrically precise, but can be accurate locally and more approximate at large scales.\n\nMy argument that visual SLAM research is evolving into Spatial AI is especially because this area has long been driven by live demonstrations, a focus on efficiency, the use of low-cost hardware, real-time visualizations, and the release of open source code. SLAM researchers have long been obsessed by the key questions of how to continually build a persistent representation from a multi-sensor stream of data without drift and within fixed computation and memory budgets.","sourceFormat":"markdown"},"note:sha256:54f6a5b4a6cbd8c1e2b8586563725df7de3ea35a03f4f1adc2fcfbeac3888fb2":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS1.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eRich Sutton’s bitter lesson [\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e] makes the compelling case that scale has been the single biggest driver of AI progress over the past decades. It is only consequent that LLMs have continued to benefit from larger models and larger, more diverse datasets to date. In a similar vein, there is no reason to believe that video models won’t benefit from scale, on both the architecture and data side.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS1.SSS0.Px1.p1.1\"\u003e\u003c/span\u003eRich Sutton’s bitter lesson [[78](#bib.bib29)] makes the compelling case that scale has been the single biggest driver of AI progress over the past decades. It is only consequent that LLMs have continued to benefit from larger models and larger, more diverse datasets to date. In a similar vein, there is no reason to believe that video models won’t benefit from scale, on both the architecture and data side.","sourceFormat":"markdown"},"note:sha256:5627255065f5c40ede77bb54be0526d698693af4e16f787aeaf64603ee9b4080":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eA central difficulty is that vision does not come with symbolic units in the same way language does. Language has a relatively clear hierarchy: words, phrases, sentences, and documents. Modern language models use subword tokens, but these tokens are still built on top of a symbolic system that humans already created. Language is therefore not raw experience; it is a compressed form of human experience. Vision is different. Pixels are too low-level to be units of intelligence. Patches are engineering conveniences rather than perceptual primitives. Human visual understanding seems object-centric and hierarchical, involving scenes, objects, parts, and relations [\u003ca href=\"#bib.bib53\"\u003e64\u003c/a\u003e, \u003ca href=\"#bib.bib54\"\u003e34\u003c/a\u003e]. Yet there is no agreed-upon hierarchy for vision comparable to the hierarchy of language.\u003c/p\u003e\n\u003cp\u003eThis makes visual learning especially expensive. A short piece of text can summarize what happened in a room, but the corresponding visual stream contains far more information: appearance, motion, geometry, lighting, and local details that may or may not matter. Vision has no equivalent compression layer. Without useful intermediate units, visual learning must discover what to keep, what to ignore, and how to compress the input on its own. Earlier vision systems imposed tasks such as detection, segmentation, or depth estimation. These abstractions are useful, but they are not equivalent to language tokens. A bounding box or a mask is not comparable to a word or a sentence in expressive flexibility. I therefore do not think the answer is to manually design a fixed visual vocabulary. Some forms of visual intelligence may require several orders of magnitude more effective compute and data processing than language pre-training, perhaps 1,000x or even 10,000x in some settings, before the right abstractions emerge naturally.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS9.SSS0.Px2.p3.1\"\u003e\u003c/span\u003eThe visual world can be decomposed into arbitrarily fine details, but not all details are useful. Representing everything at the finest possible granularity would waste enormous compute. Representing everything too coarsely would miss what matters. The useful unit of visual perception is therefore task-dependent. A visual system should keep coarse representations for irrelevant regions and allocate fine-grained representations to task-relevant regions. In this sense, the problem of visual units is inseparable from the problem of where to look. This view is consistent with active vision and visual routines, where perception is an active process of selecting and organizing information for behavior [\u003ca href=\"#bib.bib55\"\u003e104\u003c/a\u003e, \u003ca href=\"#bib.bib56\"\u003e83\u003c/a\u003e, \u003ca href=\"#bib.bib57\"\u003e4\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003eThis is not an argument against scaling. In fact, I am a believer in scaling. In my own research experience, the simplest approaches often work best when they have the right data, the right objective, and enough scale. I therefore do not want to argue that we should hand-design visual units, attention policies, or active perception modules. With enough compute, sufficiently large models, and sufficiently diverse visual experience, many aspects of adaptive visual abstraction and where-to-look behavior may emerge without explicit engineering. The question is not scale versus structure, but what kind of scale is needed for the right structures to emerge, and how to make that scaling efficient enough to be practical.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS9.SSS0.Px2.p1.1\"\u003e\u003c/span\u003eA central difficulty is that vision does not come with symbolic units in the same way language does. Language has a relatively clear hierarchy: words, phrases, sentences, and documents. Modern language models use subword tokens, but these tokens are still built on top of a symbolic system that humans already created. Language is therefore not raw experience; it is a compressed form of human experience. Vision is different. Pixels are too low-level to be units of intelligence. Patches are engineering conveniences rather than perceptual primitives. Human visual understanding seems object-centric and hierarchical, involving scenes, objects, parts, and relations [[64](#bib.bib53), [34](#bib.bib54)]. Yet there is no agreed-upon hierarchy for vision comparable to the hierarchy of language.\n\nThis makes visual learning especially expensive. A short piece of text can summarize what happened in a room, but the corresponding visual stream contains far more information: appearance, motion, geometry, lighting, and local details that may or may not matter. Vision has no equivalent compression layer. Without useful intermediate units, visual learning must discover what to keep, what to ignore, and how to compress the input on its own. Earlier vision systems imposed tasks such as detection, segmentation, or depth estimation. These abstractions are useful, but they are not equivalent to language tokens. A bounding box or a mask is not comparable to a word or a sentence in expressive flexibility. I therefore do not think the answer is to manually design a fixed visual vocabulary. Some forms of visual intelligence may require several orders of magnitude more effective compute and data processing than language pre-training, perhaps 1,000x or even 10,000x in some settings, before the right abstractions emerge naturally.\n\n\u003cspan id=\"S2.SS9.SSS0.Px2.p3.1\"\u003e\u003c/span\u003eThe visual world can be decomposed into arbitrarily fine details, but not all details are useful. Representing everything at the finest possible granularity would waste enormous compute. Representing everything too coarsely would miss what matters. The useful unit of visual perception is therefore task-dependent. A visual system should keep coarse representations for irrelevant regions and allocate fine-grained representations to task-relevant regions. In this sense, the problem of visual units is inseparable from the problem of where to look. This view is consistent with active vision and visual routines, where perception is an active process of selecting and organizing information for behavior [[104](#bib.bib55), [83](#bib.bib56), [4](#bib.bib57)].\n\nThis is not an argument against scaling. In fact, I am a believer in scaling. In my own research experience, the simplest approaches often work best when they have the right data, the right objective, and enough scale. I therefore do not want to argue that we should hand-design visual units, attention policies, or active perception modules. With enough compute, sufficiently large models, and sufficiently diverse visual experience, many aspects of adaptive visual abstraction and where-to-look behavior may emerge without explicit engineering. The question is not scale versus structure, but what kind of scale is needed for the right structures to emerge, and how to make that scaling efficient enough to be practical.","sourceFormat":"markdown"},"note:sha256:634a648232021c728ec728089bd24044040bce7c20e119b2de15b5d5495b006c":{"html":"\u003cp\u003eTo me, visual intelligence is the ability to understand (and, perhaps, generate) visual data at the level of a human or better, without an unreasonable amount of supervision on each task. I mean supervision in the broadest sense, not just the direct labels that explicitly trained our past hyper-specialized models (e.g., face detectors), but also the raw data, environments, and simulations that now implicitly train our newer models.\u003c/p\u003e\n\u003cp\u003eCurrently, I believe that supervision scale is what separates us from visual general intelligence: with sufficient resources, our systems are surprisingly good at many tasks but require too much hand-holding. This usually cues someone to bemoan the situation and contrast AI with the efficiency of a toddler. Our methods are data-hungry, but I think this is the wrong take: more of our problems are solvable with data than we thought, with examples spanning recognition to 3D to generation, and many problems require shockingly small amounts of data to “brute-force” to reasonable performance. We just have to figure out how to make things less data hungry. But because of these proof-of-concepts, there is unprecedented demand for visual intelligence, which has opened new opportunities to change the world.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5.p3.1\"\u003e\u003c/span\u003eMy colleagues will do a fantastic job covering other angles like 3D and video generation, so I will focus on the context of scientific discovery. I have worked in this area for several years, with the goal of making AI-based data that scientists want to use for discovery. My work includes AI models [\u003ca href=\"#bib.bib108\"\u003e88\u003c/a\u003e] that reveal the Sun’s magnetic field in new detail, as well as AI-powered data [\u003ca href=\"#bib.bib107\"\u003e91\u003c/a\u003e] that enables reconstructing the process of evolution [\u003ca href=\"#bib.bib106\"\u003e8\u003c/a\u003e]. I believe this area will only grow, and much of the future visual intelligence budget will be directed at scientific data generated by specialized instruments peering at the many scales of reality.\u003c/p\u003e\n\u003cp\u003eI will weave together several problems that I have encountered working with scientists, where there is a mismatch between what vision has to offer and what is needed.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5.p5.1\"\u003e\u003c/span\u003e(Data is limited.) Computer vision, apart from some frontier lab work, is in the situation where data is a knob one can turn (and indeed likely the most effective knob to turn). However, many key scientific problems are challenging because more data can’t be collected. For instance, in understanding the impact of climate change on animal morphology [\u003ca href=\"#bib.bib115\"\u003e90\u003c/a\u003e], one cannot go back and collect species in 1970. Our models applied directly are often poor fits for small amounts of data (and so we need to find ways to align our capabilities to domain needs) and making sense of this data requires integration of other factors.\u003c/p\u003e\n\u003cp\u003e(Validation is hard without ground truth.) Science rarely has the convenient ground-truth we are accustomed to. I mean ground-truth in the broadest sense: not just hand-drawn segments but also other views and data, etc. While some fields are lucky (such as weather with its barometers and rainmeters), most are not. Solar physics has only photons, often from a single angle and time; and evolutionary ecology deals with processes that emerge over the deep time of tens of millions of years. Accordingly, when one makes a new sort of measurement or prediction, there’s no leaderboard to compare with and best number to bold in a table. Instead, validation is the long challenging work of reconciling results with our existing knowledge. This shifts the overall fraction of effort much more towards validation than we’re accustomed to in common CVPR practice. Despite the best efforts of many, our credit systems as a field are not really prepared for this.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5.p7.1\"\u003e\u003c/span\u003e(Multimodality, broadly construed, is integral.) One method of validation is connecting with equations, simplified models, and past data from other instruments. For instance, one can validate estimates of the thermal structure of the Sun’s corona [\u003ca href=\"#bib.bib109\"\u003e13\u003c/a\u003e] by connecting them to X-ray emissions observed by another instrument, bridged by the atomic physics. This validation is challenging and requires common sense that comes from other instruments and knowledge (e.g., did we forget a spectral line in the model? is the assumed elemental abundance reasonable? does the model break basic rules?). This sort of connection cannot be automated easily now and primarily consists of work by eye and hand. Unfortunately, the most useful constraints are not the hard rules like Maxell’s equations, but instead soft plausibility judgments that, for now, need expert intuition to use. Ultimately, to power scientific discovery, visual intelligence will need to be able to really connect disparate multimodal sources.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS5.p8.1\"\u003e\u003c/span\u003e(Systematics and units can’t be ignored.) Another method of validation is other instruments. In computer vision, we tend to think of data as falling between [0,255] or [0,1], as provided by a black box sensor hardware. In principle, our scientific sensors come with units and so we can indeed use this as a powerful reality check. However, all instruments come with systematics, or non-physical properties. Accordingly, creating and evaluating vision systems for the sciences requires separating out the real signal originating with the underlying phenomenon from the instrument’s signals. These require deep understanding to disentangle: the sun oscillates at 11 years [\u003ca href=\"#bib.bib110\"\u003e38\u003c/a\u003e] and 5 minutes, but spurious signals have been found at 160 minutes [\u003ca href=\"#bib.bib111\"\u003e10\u003c/a\u003e] and 24 hours [\u003ca href=\"#bib.bib112\"\u003e43\u003c/a\u003e]. In our experience, models latch onto the real and the fake alike, and emulate them faithfully [\u003ca href=\"#bib.bib113\"\u003e41\u003c/a\u003e]. We have to resort to eliminating them at the data source, as one does with weather reanalysis data [\u003ca href=\"#bib.bib114\"\u003e40\u003c/a\u003e], but future models ought to be able to be more editable to separate out and ignore various signals. As a community, we also largely focus on models and math as the primary contribution, when in reality, clean data can often be as big of a driver of success, if not bigger.\u003c/p\u003e\n\u003cp\u003e(Reality is hard to model.) One question I often encounter is: why not use simulations? Unfortunately, anything where it’s worth taking new data is a place where our understanding of reality is blurry. Accordingly, what models we have are only approximate (or there are multiple competing mechanisms that all explain the data). Making matters worse, we’re primarily used to nicely behaved reality. For many problems at the forefront of physics, rendering is itself often an optimization problem, with clean solutions existing only for a limited set of problems. Our existing technology largely does not deal with connecting with complex procedures well, although I hope the advent of effective coding models will make it easier to directly connect our models to models of reality.\u003c/p\u003e\n\u003cp\u003e(Vision is only part of the broader picture.) Pulling back, I have found it humbling to work inside large science projects. In computer vision, we tend to think of the CVPR paper as the world: once you make all of your numbers in table bold, you declare success. But the vision part is often only one part of the pipeline for discovery. When I first started working with scientists, I found that they were interested in largely different things than CVPR reviewers: does my AI data have systematics? are there any mistakes in the AI generated data, and can you catch effectively all of them? I also found that integrating our results into scientific discovery was challenging: there were typically existing ways of doing things that worked around the limitations of past efforts. Figuring out this interface in order to get data in actual use by scientists has been equally laborious and rewarding.\u003c/p\u003e\n","kind":"html","rawMarkdown":"To me, visual intelligence is the ability to understand (and, perhaps, generate) visual data at the level of a human or better, without an unreasonable amount of supervision on each task. I mean supervision in the broadest sense, not just the direct labels that explicitly trained our past hyper-specialized models (e.g., face detectors), but also the raw data, environments, and simulations that now implicitly train our newer models.\n\nCurrently, I believe that supervision scale is what separates us from visual general intelligence: with sufficient resources, our systems are surprisingly good at many tasks but require too much hand-holding. This usually cues someone to bemoan the situation and contrast AI with the efficiency of a toddler. Our methods are data-hungry, but I think this is the wrong take: more of our problems are solvable with data than we thought, with examples spanning recognition to 3D to generation, and many problems require shockingly small amounts of data to “brute-force” to reasonable performance. We just have to figure out how to make things less data hungry. But because of these proof-of-concepts, there is unprecedented demand for visual intelligence, which has opened new opportunities to change the world.\n\n\u003cspan id=\"S2.SS5.p3.1\"\u003e\u003c/span\u003eMy colleagues will do a fantastic job covering other angles like 3D and video generation, so I will focus on the context of scientific discovery. I have worked in this area for several years, with the goal of making AI-based data that scientists want to use for discovery. My work includes AI models [[88](#bib.bib108)] that reveal the Sun’s magnetic field in new detail, as well as AI-powered data [[91](#bib.bib107)] that enables reconstructing the process of evolution [[8](#bib.bib106)]. I believe this area will only grow, and much of the future visual intelligence budget will be directed at scientific data generated by specialized instruments peering at the many scales of reality.\n\nI will weave together several problems that I have encountered working with scientists, where there is a mismatch between what vision has to offer and what is needed.\n\n\u003cspan id=\"S2.SS5.p5.1\"\u003e\u003c/span\u003e(Data is limited.) Computer vision, apart from some frontier lab work, is in the situation where data is a knob one can turn (and indeed likely the most effective knob to turn). However, many key scientific problems are challenging because more data can’t be collected. For instance, in understanding the impact of climate change on animal morphology [[90](#bib.bib115)], one cannot go back and collect species in 1970. Our models applied directly are often poor fits for small amounts of data (and so we need to find ways to align our capabilities to domain needs) and making sense of this data requires integration of other factors.\n\n(Validation is hard without ground truth.) Science rarely has the convenient ground-truth we are accustomed to. I mean ground-truth in the broadest sense: not just hand-drawn segments but also other views and data, etc. While some fields are lucky (such as weather with its barometers and rainmeters), most are not. Solar physics has only photons, often from a single angle and time; and evolutionary ecology deals with processes that emerge over the deep time of tens of millions of years. Accordingly, when one makes a new sort of measurement or prediction, there’s no leaderboard to compare with and best number to bold in a table. Instead, validation is the long challenging work of reconciling results with our existing knowledge. This shifts the overall fraction of effort much more towards validation than we’re accustomed to in common CVPR practice. Despite the best efforts of many, our credit systems as a field are not really prepared for this.\n\n\u003cspan id=\"S2.SS5.p7.1\"\u003e\u003c/span\u003e(Multimodality, broadly construed, is integral.) One method of validation is connecting with equations, simplified models, and past data from other instruments. For instance, one can validate estimates of the thermal structure of the Sun’s corona [[13](#bib.bib109)] by connecting them to X-ray emissions observed by another instrument, bridged by the atomic physics. This validation is challenging and requires common sense that comes from other instruments and knowledge (e.g., did we forget a spectral line in the model? is the assumed elemental abundance reasonable? does the model break basic rules?). This sort of connection cannot be automated easily now and primarily consists of work by eye and hand. Unfortunately, the most useful constraints are not the hard rules like Maxell’s equations, but instead soft plausibility judgments that, for now, need expert intuition to use. Ultimately, to power scientific discovery, visual intelligence will need to be able to really connect disparate multimodal sources.\n\n\u003cspan id=\"S2.SS5.p8.1\"\u003e\u003c/span\u003e(Systematics and units can’t be ignored.) Another method of validation is other instruments. In computer vision, we tend to think of data as falling between [0,255] or [0,1], as provided by a black box sensor hardware. In principle, our scientific sensors come with units and so we can indeed use this as a powerful reality check. However, all instruments come with systematics, or non-physical properties. Accordingly, creating and evaluating vision systems for the sciences requires separating out the real signal originating with the underlying phenomenon from the instrument’s signals. These require deep understanding to disentangle: the sun oscillates at 11 years [[38](#bib.bib110)] and 5 minutes, but spurious signals have been found at 160 minutes [[10](#bib.bib111)] and 24 hours [[43](#bib.bib112)]. In our experience, models latch onto the real and the fake alike, and emulate them faithfully [[41](#bib.bib113)]. We have to resort to eliminating them at the data source, as one does with weather reanalysis data [[40](#bib.bib114)], but future models ought to be able to be more editable to separate out and ignore various signals. As a community, we also largely focus on models and math as the primary contribution, when in reality, clean data can often be as big of a driver of success, if not bigger.\n\n(Reality is hard to model.) One question I often encounter is: why not use simulations? Unfortunately, anything where it’s worth taking new data is a place where our understanding of reality is blurry. Accordingly, what models we have are only approximate (or there are multiple competing mechanisms that all explain the data). Making matters worse, we’re primarily used to nicely behaved reality. For many problems at the forefront of physics, rendering is itself often an optimization problem, with clean solutions existing only for a limited set of problems. Our existing technology largely does not deal with connecting with complex procedures well, although I hope the advent of effective coding models will make it easier to directly connect our models to models of reality.\n\n(Vision is only part of the broader picture.) Pulling back, I have found it humbling to work inside large science projects. In computer vision, we tend to think of the CVPR paper as the world: once you make all of your numbers in table bold, you declare success. But the vision part is often only one part of the pipeline for discovery. When I first started working with scientists, I found that they were interested in largely different things than CVPR reviewers: does my AI data have systematics? are there any mistakes in the AI generated data, and can you catch effectively all of them? I also found that integrating our results into scientific discovery was challenging: there were typically existing ways of doing things that worked around the limitations of past efforts. Figuring out this interface in order to get data in actual use by scientists has been equally laborious and rewarding.","sourceFormat":"markdown"},"note:sha256:66cda7e1dfc64dc946d01257c4e044776e2451bf24698498cbf493211b37ee12":{"html":"\u003cp\u003eThis paper has examined visual general intelligence as a research agenda concerned with two related questions: how intelligence may emerge from visual experience, and how such visual intelligence may provide a path toward general intelligence. The perspectives collected here do not support a single definition, architecture, learning objective, or route to VGI. Rather than forcing these positions into one unified forecast, this paper presents several plausible and complementary conclusions. Visual intelligence may emerge through large-scale generative learning, prediction, reconstruction, persistent spatial memory, continual learning, embodiment, active perception, multimodal experience, or combinations of these mechanisms that have not yet been fully explored.\u003c/p\u003e\n\u003cp\u003eThis plurality is itself one of the central conclusions of the paper. VGI should not be defined prematurely as a particular model or capability. Nor should it be reduced to a stronger image classifier, a video generator, a world model, or a visual encoder attached to a language model. The positions presented here instead describe visual intelligence as a broader capacity to acquire knowledge from visual experience, discover and maintain the structure of the world, imagine and evaluate possible alternatives, adapt to new observations, and use visual knowledge for prediction, discovery, and action.\u003c/p\u003e\n\u003cp\u003eExisting systems demonstrate important components of visual intelligence, but not yet their integration into a general, continually adaptable visual system. Current models nevertheless provide partial and increasingly suggestive evidence. Generative video models exhibit unexpected cross-task capabilities; reconstruction models recover increasingly rich geometric and physical structure; spatial systems maintain persistent representations over time; creative models construct multiple plausible alternatives; and embodied agents improve their perception and behavior through interaction. These capabilities remain fragmented, computationally expensive, limited in temporal extent, or dependent on carefully selected data and training conditions. However, taken together, they may represent early coordinates of a broader transition from visual functions to visual intelligence.\u003c/p\u003e\n\u003cp\u003eIt may therefore be premature to ask whether VGI has already become a path to general intelligence. The more immediate milestone is to determine whether intelligence can first be observed to emerge from visual experience itself. Evidence for this transition should extend beyond improved performance on a fixed collection of visual tasks. It should include transferable capabilities, persistent and revisable world knowledge, creative and counterfactual reasoning, active information seeking, continual adaptation, spatial and physical consistency, and reliable action in unfamiliar situations.\u003c/p\u003e\n\u003cp\u003eComputer vision may now be entering a new phase in which its central object of study expands from individual visual functions to the emergence of visual intelligence. The purpose of this paper is not to declare which proposed path will prevail, but to make their assumptions, relationships, and open questions visible. The decisive principle may come from one of the directions discussed here, from their convergence, or from an approach that has not yet been imagined. The question left to the field is therefore not only how to build more capable visual models, but what evidence would convince us that intelligence has begun to arise from vision – and how that intelligence might eventually contribute to general intelligence.\u003c/p\u003e\n","kind":"html","rawMarkdown":"This paper has examined visual general intelligence as a research agenda concerned with two related questions: how intelligence may emerge from visual experience, and how such visual intelligence may provide a path toward general intelligence. The perspectives collected here do not support a single definition, architecture, learning objective, or route to VGI. Rather than forcing these positions into one unified forecast, this paper presents several plausible and complementary conclusions. Visual intelligence may emerge through large-scale generative learning, prediction, reconstruction, persistent spatial memory, continual learning, embodiment, active perception, multimodal experience, or combinations of these mechanisms that have not yet been fully explored.\n\nThis plurality is itself one of the central conclusions of the paper. VGI should not be defined prematurely as a particular model or capability. Nor should it be reduced to a stronger image classifier, a video generator, a world model, or a visual encoder attached to a language model. The positions presented here instead describe visual intelligence as a broader capacity to acquire knowledge from visual experience, discover and maintain the structure of the world, imagine and evaluate possible alternatives, adapt to new observations, and use visual knowledge for prediction, discovery, and action.\n\nExisting systems demonstrate important components of visual intelligence, but not yet their integration into a general, continually adaptable visual system. Current models nevertheless provide partial and increasingly suggestive evidence. Generative video models exhibit unexpected cross-task capabilities; reconstruction models recover increasingly rich geometric and physical structure; spatial systems maintain persistent representations over time; creative models construct multiple plausible alternatives; and embodied agents improve their perception and behavior through interaction. These capabilities remain fragmented, computationally expensive, limited in temporal extent, or dependent on carefully selected data and training conditions. However, taken together, they may represent early coordinates of a broader transition from visual functions to visual intelligence.\n\nIt may therefore be premature to ask whether VGI has already become a path to general intelligence. The more immediate milestone is to determine whether intelligence can first be observed to emerge from visual experience itself. Evidence for this transition should extend beyond improved performance on a fixed collection of visual tasks. It should include transferable capabilities, persistent and revisable world knowledge, creative and counterfactual reasoning, active information seeking, continual adaptation, spatial and physical consistency, and reliable action in unfamiliar situations.\n\nComputer vision may now be entering a new phase in which its central object of study expands from individual visual functions to the emergence of visual intelligence. The purpose of this paper is not to declare which proposed path will prevail, but to make their assumptions, relationships, and open questions visible. The decisive principle may come from one of the directions discussed here, from their convergence, or from an approach that has not yet been imagined. The question left to the field is therefore not only how to build more capable visual models, but what evidence would convince us that intelligence has begun to arise from vision – and how that intelligence might eventually contribute to general intelligence.","sourceFormat":"markdown"},"note:sha256:6722cfb3ca218e9f52f69d9959969bae9d53dae34189f24b4d4008099bc1695c":{"html":"\u003cp\u003eAt one extreme, the representation is entirely continuous: the scene becomes a collection of vectors produced by a network. This is expressive and easy to optimize, but no part of it can be explicitly read, edited, or verified. At the other, it is entirely discrete and named: the scene is a mug, resting on a table, with a handle that turns about a given axis. This can be read, edited, and verified, but it reaches only as far as its vocabulary.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.SSS0.Px3.p2.1\"\u003e\u003c/span\u003eAn effective representation will need to capture both [\u003ca href=\"#bib.bib96\"\u003e108\u003c/a\u003e, \u003ca href=\"#bib.bib97\"\u003e62\u003c/a\u003e, \u003ca href=\"#bib.bib98\"\u003e44\u003c/a\u003e, \u003ca href=\"#bib.bib95\"\u003e97\u003c/a\u003e]. Structure that is discrete and relational—which parts exist, how many, how they are arranged, what connects to what—is naturally written as a program or in words. Structure that is continuous and hard to name—the exact geometry of a leaf, the precise appearance of a glazed ceramic—is better left as a learned embedding. The Scene Language [\u003ca href=\"#bib.bib96\"\u003e108\u003c/a\u003e] is one concrete instance: a scene is represented by a program giving its hierarchical structure, words naming the semantic class of each entity, and embeddings capturing the visual identity of each one. The same idea underlies our work on neuro-symbolic concepts, where a concept such as “left of” or “put down” is stored jointly as a symbolic program and a neural network grounded in perception and action [\u003ca href=\"#bib.bib97\"\u003e62\u003c/a\u003e, \u003ca href=\"#bib.bib98\"\u003e44\u003c/a\u003e, \u003ca href=\"#bib.bib99\"\u003e63\u003c/a\u003e].\u003c/p\u003e\n","kind":"html","rawMarkdown":"At one extreme, the representation is entirely continuous: the scene becomes a collection of vectors produced by a network. This is expressive and easy to optimize, but no part of it can be explicitly read, edited, or verified. At the other, it is entirely discrete and named: the scene is a mug, resting on a table, with a handle that turns about a given axis. This can be read, edited, and verified, but it reaches only as far as its vocabulary.\n\n\u003cspan id=\"S2.SS8.SSS0.Px3.p2.1\"\u003e\u003c/span\u003eAn effective representation will need to capture both [[108](#bib.bib96), [62](#bib.bib97), [44](#bib.bib98), [97](#bib.bib95)]. Structure that is discrete and relational—which parts exist, how many, how they are arranged, what connects to what—is naturally written as a program or in words. Structure that is continuous and hard to name—the exact geometry of a leaf, the precise appearance of a glazed ceramic—is better left as a learned embedding. The Scene Language [[108](#bib.bib96)] is one concrete instance: a scene is represented by a program giving its hierarchical structure, words naming the semantic class of each entity, and embeddings capturing the visual identity of each one. The same idea underlies our work on neuro-symbolic concepts, where a concept such as “left of” or “put down” is stored jointly as a symbolic program and a neural network grounded in perception and action [[62](#bib.bib97), [44](#bib.bib98), [63](#bib.bib99)].","sourceFormat":"markdown"},"note:sha256:67a8c5f4af97475a1220e5d32ed9d3bf140446ea1f402f1e275954419e76d384":{"html":"\u003cp\u003eThe path from visual intelligence to general intelligence is unlikely to be captured by a single definition, model, or benchmark. This section brings together diverse research perspectives to help clarify the open questions that the computer vision community may explore.\u003c/p\u003e\n","kind":"html","rawMarkdown":"The path from visual intelligence to general intelligence is unlikely to be captured by a single definition, model, or benchmark. This section brings together diverse research perspectives to help clarify the open questions that the computer vision community may explore.","sourceFormat":"markdown"},"note:sha256:680353e04509fc8546bdb7bfc3cb139b15f40dbf22d42187e728d45ac3399ad7":{"html":"\u003cp\u003eThis work was conducted by AIST researchers under FRONTia, a Japanese national program led by the Ministry of Economy, Trade and Industry of Japan (METI) and the New Energy and Industrial Technology Development Organization (NEDO), aimed at developing a domestic multimodal foundation model for AI robots and physical AI. This work was supported by Japan Science and Technology Agency (JST) as part of Adopting Sustainable Partnerships for Innovative Research Ecosystem (ASPIRE), Grant Number JPMJAP2518. We would also like to thank the invited speakers of the CVPR 2026 Workshop on Visual General Intelligence (VGI) for their insightful talks and discussions that helped motivate this white paper. In particular, we are grateful to Matt Deitke, Alexei A. Efros, Kristen Grauman, Alex Kendall, and Andrea Vedaldi, who contributed to the workshop. Their perspectives helped clarify the diversity of open questions surrounding visual intelligence.\u003c/p\u003e\n","kind":"html","rawMarkdown":"This work was conducted by AIST researchers under FRONTia, a Japanese national program led by the Ministry of Economy, Trade and Industry of Japan (METI) and the New Energy and Industrial Technology Development Organization (NEDO), aimed at developing a domestic multimodal foundation model for AI robots and physical AI. This work was supported by Japan Science and Technology Agency (JST) as part of Adopting Sustainable Partnerships for Innovative Research Ecosystem (ASPIRE), Grant Number JPMJAP2518. We would also like to thank the invited speakers of the CVPR 2026 Workshop on Visual General Intelligence (VGI) for their insightful talks and discussions that helped motivate this white paper. In particular, we are grateful to Matt Deitke, Alexei A. Efros, Kristen Grauman, Alex Kendall, and Andrea Vedaldi, who contributed to the workshop. Their perspectives helped clarify the diversity of open questions surrounding visual intelligence.","sourceFormat":"markdown"},"note:sha256:7769ae880c59576c792df799680683540c44115fce9af8b217e35d57d1183ab9":{"html":"\u003cp\u003e\u003cspan id=\"S1.p1.1\"\u003e\u003c/span\u003eSince the early discussions of artificial intelligence (AI), including those surrounding Alan Turing and cybernetics, intelligence has often been discussed as the ability to acquire representations from environmental signals, capture their underlying regularities, generalize to unseen situations, and connect such representations to prediction or action [\u003ca href=\"#bib.bib12\"\u003e82\u003c/a\u003e, \u003ca href=\"#bib.bib13\"\u003e94\u003c/a\u003e, \u003ca href=\"#bib.bib10\"\u003e49\u003c/a\u003e, \u003ca href=\"#bib.bib11\"\u003e35\u003c/a\u003e]. At the same time, it is not obvious that intelligence should be reduced to language.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p2.1\"\u003e\u003c/span\u003eIn the history of Earth, advanced visual systems, including camera-type eyes and compound eyes, date back to the Cambrian period roughly half a billion years ago, and the rapid development of vision has long been discussed as a possible driver of major changes in biological interactions [\u003ca href=\"#bib.bib14\"\u003e70\u003c/a\u003e, \u003ca href=\"#bib.bib15\"\u003e111\u003c/a\u003e]. By contrast, advanced human language, writing systems, and individual languages such as English are all extremely recent phenomena on the timescale of life’s history [\u003ca href=\"#bib.bib16\"\u003e27\u003c/a\u003e, \u003ca href=\"#bib.bib17\"\u003e15\u003c/a\u003e, \u003ca href=\"#bib.bib18\"\u003e5\u003c/a\u003e]. This contrast suggests that vision may be more than a sensor or input modality; the visual modality may instead constitute a foundational intelligent function for capturing the structure of the world.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p3.1\"\u003e\u003c/span\u003eRecent progress in large language models (LLMs) provides an important reference point for thinking about the emergence of intelligence. Through the lineage of statistical language models, neural probabilistic language models [\u003ca href=\"#bib.bib19\"\u003e7\u003c/a\u003e], distributed representations such as word2vec [\u003ca href=\"#bib.bib21\"\u003e66\u003c/a\u003e], sequence-to-sequence models [\u003ca href=\"#bib.bib22\"\u003e77\u003c/a\u003e], attention [\u003ca href=\"#bib.bib23\"\u003e3\u003c/a\u003e], Transformers [\u003ca href=\"#bib.bib24\"\u003e84\u003c/a\u003e], BERT [\u003ca href=\"#bib.bib25\"\u003e19\u003c/a\u003e], and GPT [\u003ca href=\"#bib.bib26\"\u003e73\u003c/a\u003e], language processing gradually shifted from hand-designed features and task-specific pipelines toward representation learning based on large-scale data and general-purpose learning objectives. GPT-3 was especially striking in that, without images, audio, or embodied interaction, it showed that scaling a simple autoregressive self-supervised objective (next-token prediction) over web-scale text corpora could give rise to broad capabilities such as in-context learning and few-shot adaptation [\u003ca href=\"#bib.bib27\"\u003e11\u003c/a\u003e]. Wei et al. formalized such scale-dependent qualitative capability gains as “emergent abilities of large language models” [\u003ca href=\"#bib.bib28\"\u003e92\u003c/a\u003e]. This also resonates with Sutton’s “The Bitter Lesson” [\u003ca href=\"#bib.bib29\"\u003e78\u003c/a\u003e]: in the long run, methods that scale with computation, data, learning, and search tend to dominate manually engineered knowledge and rules. Although the success of language models cannot simply be transferred to visual models, the fact that unexpected abilities can arise from a simple objective, large-scale experience, and scaling is a crucial clue for visual intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p4.1\"\u003e\u003c/span\u003eComputer vision has also undergone major transformations. Before the era of deep neural networks, the field accumulated rich knowledge based on geometry, statistics, and optimization, including edge and corner detection, local features such as SIFT, stereo, optical flow, structure from motion, and object detection. The success of AlexNet at ILSVRC 2012 marked a turning point, ushering in the deep learning era and leading to dramatic progress in visual recognition [\u003ca href=\"#bib.bib30\"\u003e47\u003c/a\u003e, \u003ca href=\"#bib.bib31\"\u003e74\u003c/a\u003e]. More recently, vision research has expanded beyond supervised learning toward self-supervised learning, image-text contrastive learning, Transformers, image and video generation, 3D/4D reconstruction, robotics, and embodied AI. In this context, a natural question is whether emergent abilities analogous to those observed in language models may also appear when visual models are scaled up and exposed to increasingly diverse visual experiences, or whether vision requires principles specific to visual intelligence.\u003c/p\u003e\n\u003cp\u003eThere is no need to settle this question with a single answer at this stage. One viewpoint is that scaling single-modality, single-objective visual learning to its limit may be sufficient; another is that integrating visual modalities such as video, geometry, and spacetime, or visual tasks such as generation, restoration, and reconstruction, may be essential. What matters is not to make the scaling of vision foundation models (VFMs) an end in itself, but to ask under what learning strategies, data structures, model architectures, and evaluation settings visual representations can generalize to unknown tasks and environments. Current VFMs are increasingly applied to classification, dense prediction, correspondence estimation, and 3D reconstruction, yet there remains substantial room to disentangle whether a capability arises from training data, task design, decoders, prompts, model size, or their combinations. This unresolved nature should be viewed not as a limitation, but as a starting point for asking whether intelligence emerging from vision can evolve into general intelligence.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S1.p6.1\"\u003e\u003c/span\u003eRecent progress in VLMs and MLLMs is also central to this discussion. CLIP maps images and text into a shared space through contrastive learning, enabling zero-shot recognition mediated by natural language [\u003ca href=\"#bib.bib32\"\u003e72\u003c/a\u003e]. MLLMs such as Flamingo [\u003ca href=\"#bib.bib33\"\u003e2\u003c/a\u003e], BLIP/BLIP-2 [\u003ca href=\"#bib.bib34\"\u003e51\u003c/a\u003e, \u003ca href=\"#bib.bib35\"\u003e50\u003c/a\u003e], and LLaVA [\u003ca href=\"#bib.bib36\"\u003e56\u003c/a\u003e] connect image features from visual encoders to LLMs as token sequences or intermediate representations, enabling visual question answering, captioning, dialogue, and instruction following. These models provide powerful frameworks for connecting vision and language and represent one of the central directions for vision research toward the AGI era. At the same time, because image features, image-text pairs, instruction tuning, and reasoning processes are deeply intertwined, it remains difficult to isolate which capabilities originate from visual experience itself and which emerge from the language model. Rather than rejecting MLLMs, this paper keeps multiple viewpoints open, including vision-only, vision-first, language-mediated, and multimodal perspectives, and discusses visual intelligence from several angles.\u003c/p\u003e\n\u003cp\u003eVisual general intelligence (VGI), as discussed here, is not a rejection of language. Rather, it is a research agenda that asks what vision can understand, predict, and generalize, either before being coupled with language or while interacting with it. Visual data contains dense, observable, and measurable structures. Given such structures, should models predict what will be seen next, generate unobserved regions, reconstruct 3D/4D structures, or integrate multiple objectives to acquire general visual representations? We view visual intelligence research as an attempt to revisit these vision-specific questions through diverse forms of visual learning.\u003c/p\u003e\n\u003cp\u003eIn the AGI era, computer vision has an exceptionally important role to play. Precisely because language models have reshaped the landscape of AI, the computer vision community can now revisit a fundamental question: what kinds of generality can arise from visual learning? The diverse expertise accumulated across visual modalities and tasks offers an unusually rich foundation for exploring VGI. We are entering a creative phase in which the community can proactively design what should be measured beyond benchmark accuracy and incremental improvements, including physical-world applications, adaptation to unknown environments, and societal impact.\u003c/p\u003e\n\u003cp\u003eVGI, namely intelligence emerging from visual modalities and tasks, is not yet a fully established concept. Precisely for this reason, there is great value in bringing together diverse hypotheses rooted in each researcher’s expertise and experience, and in openly, optimistically, and boldly exploring possible pathways from vision to general intelligence from the perspective of the computer vision community. This paper aims to serve as a starting point for such exploration and to broaden the role of vision research in the AGI era as broadly as possible.\u003cspan id=\"footnote1\"\u003e\u003c/span\u003e11 1 This paper originates from discussions at the CVPR 2026 VGI Workshop [\u003ca href=\"#bib.bib37\"\u003e85\u003c/a\u003e]. The views presented here are not intended to provide a single definition of VGI, but rather to summarize multiple perspectives that open diverse possibilities for vision research toward general intelligence.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S1.p1.1\"\u003e\u003c/span\u003eSince the early discussions of artificial intelligence (AI), including those surrounding Alan Turing and cybernetics, intelligence has often been discussed as the ability to acquire representations from environmental signals, capture their underlying regularities, generalize to unseen situations, and connect such representations to prediction or action [[82](#bib.bib12), [94](#bib.bib13), [49](#bib.bib10), [35](#bib.bib11)]. At the same time, it is not obvious that intelligence should be reduced to language.\n\n\u003cspan id=\"S1.p2.1\"\u003e\u003c/span\u003eIn the history of Earth, advanced visual systems, including camera-type eyes and compound eyes, date back to the Cambrian period roughly half a billion years ago, and the rapid development of vision has long been discussed as a possible driver of major changes in biological interactions [[70](#bib.bib14), [111](#bib.bib15)]. By contrast, advanced human language, writing systems, and individual languages such as English are all extremely recent phenomena on the timescale of life’s history [[27](#bib.bib16), [15](#bib.bib17), [5](#bib.bib18)]. This contrast suggests that vision may be more than a sensor or input modality; the visual modality may instead constitute a foundational intelligent function for capturing the structure of the world.\n\n\u003cspan id=\"S1.p3.1\"\u003e\u003c/span\u003eRecent progress in large language models (LLMs) provides an important reference point for thinking about the emergence of intelligence. Through the lineage of statistical language models, neural probabilistic language models [[7](#bib.bib19)], distributed representations such as word2vec [[66](#bib.bib21)], sequence-to-sequence models [[77](#bib.bib22)], attention [[3](#bib.bib23)], Transformers [[84](#bib.bib24)], BERT [[19](#bib.bib25)], and GPT [[73](#bib.bib26)], language processing gradually shifted from hand-designed features and task-specific pipelines toward representation learning based on large-scale data and general-purpose learning objectives. GPT-3 was especially striking in that, without images, audio, or embodied interaction, it showed that scaling a simple autoregressive self-supervised objective (next-token prediction) over web-scale text corpora could give rise to broad capabilities such as in-context learning and few-shot adaptation [[11](#bib.bib27)]. Wei et al. formalized such scale-dependent qualitative capability gains as “emergent abilities of large language models” [[92](#bib.bib28)]. This also resonates with Sutton’s “The Bitter Lesson” [[78](#bib.bib29)]: in the long run, methods that scale with computation, data, learning, and search tend to dominate manually engineered knowledge and rules. Although the success of language models cannot simply be transferred to visual models, the fact that unexpected abilities can arise from a simple objective, large-scale experience, and scaling is a crucial clue for visual intelligence.\n\n\u003cspan id=\"S1.p4.1\"\u003e\u003c/span\u003eComputer vision has also undergone major transformations. Before the era of deep neural networks, the field accumulated rich knowledge based on geometry, statistics, and optimization, including edge and corner detection, local features such as SIFT, stereo, optical flow, structure from motion, and object detection. The success of AlexNet at ILSVRC 2012 marked a turning point, ushering in the deep learning era and leading to dramatic progress in visual recognition [[47](#bib.bib30), [74](#bib.bib31)]. More recently, vision research has expanded beyond supervised learning toward self-supervised learning, image-text contrastive learning, Transformers, image and video generation, 3D/4D reconstruction, robotics, and embodied AI. In this context, a natural question is whether emergent abilities analogous to those observed in language models may also appear when visual models are scaled up and exposed to increasingly diverse visual experiences, or whether vision requires principles specific to visual intelligence.\n\nThere is no need to settle this question with a single answer at this stage. One viewpoint is that scaling single-modality, single-objective visual learning to its limit may be sufficient; another is that integrating visual modalities such as video, geometry, and spacetime, or visual tasks such as generation, restoration, and reconstruction, may be essential. What matters is not to make the scaling of vision foundation models (VFMs) an end in itself, but to ask under what learning strategies, data structures, model architectures, and evaluation settings visual representations can generalize to unknown tasks and environments. Current VFMs are increasingly applied to classification, dense prediction, correspondence estimation, and 3D reconstruction, yet there remains substantial room to disentangle whether a capability arises from training data, task design, decoders, prompts, model size, or their combinations. This unresolved nature should be viewed not as a limitation, but as a starting point for asking whether intelligence emerging from vision can evolve into general intelligence.\n\n\u003cspan id=\"S1.p6.1\"\u003e\u003c/span\u003eRecent progress in VLMs and MLLMs is also central to this discussion. CLIP maps images and text into a shared space through contrastive learning, enabling zero-shot recognition mediated by natural language [[72](#bib.bib32)]. MLLMs such as Flamingo [[2](#bib.bib33)], BLIP/BLIP-2 [[51](#bib.bib34), [50](#bib.bib35)], and LLaVA [[56](#bib.bib36)] connect image features from visual encoders to LLMs as token sequences or intermediate representations, enabling visual question answering, captioning, dialogue, and instruction following. These models provide powerful frameworks for connecting vision and language and represent one of the central directions for vision research toward the AGI era. At the same time, because image features, image-text pairs, instruction tuning, and reasoning processes are deeply intertwined, it remains difficult to isolate which capabilities originate from visual experience itself and which emerge from the language model. Rather than rejecting MLLMs, this paper keeps multiple viewpoints open, including vision-only, vision-first, language-mediated, and multimodal perspectives, and discusses visual intelligence from several angles.\n\nVisual general intelligence (VGI), as discussed here, is not a rejection of language. Rather, it is a research agenda that asks what vision can understand, predict, and generalize, either before being coupled with language or while interacting with it. Visual data contains dense, observable, and measurable structures. Given such structures, should models predict what will be seen next, generate unobserved regions, reconstruct 3D/4D structures, or integrate multiple objectives to acquire general visual representations? We view visual intelligence research as an attempt to revisit these vision-specific questions through diverse forms of visual learning.\n\nIn the AGI era, computer vision has an exceptionally important role to play. Precisely because language models have reshaped the landscape of AI, the computer vision community can now revisit a fundamental question: what kinds of generality can arise from visual learning? The diverse expertise accumulated across visual modalities and tasks offers an unusually rich foundation for exploring VGI. We are entering a creative phase in which the community can proactively design what should be measured beyond benchmark accuracy and incremental improvements, including physical-world applications, adaptation to unknown environments, and societal impact.\n\nVGI, namely intelligence emerging from visual modalities and tasks, is not yet a fully established concept. Precisely for this reason, there is great value in bringing together diverse hypotheses rooted in each researcher’s expertise and experience, and in openly, optimistically, and boldly exploring possible pathways from vision to general intelligence from the perspective of the computer vision community. This paper aims to serve as a starting point for such exploration and to broaden the role of vision research in the AGI era as broadly as possible.\u003cspan id=\"footnote1\"\u003e\u003c/span\u003e11 1 This paper originates from discussions at the CVPR 2026 VGI Workshop [[85](#bib.bib37)]. The views presented here are not intended to provide a single definition of VGI, but rather to summarize multiple perspectives that open diverse possibilities for vision research toward general intelligence.","sourceFormat":"markdown"},"note:sha256:7bd6fe4e8d964def2476f2e03fedb00dec9a6b648e41a2eedf45371927fa9fec":{"html":"\u003cp\u003e\u003cspan id=\"S2.SS8.p1.1\"\u003e\u003c/span\u003eOne way to think about visual intelligence is as the recovery of the structure, or code, of the physical world from visual observations. An image is a measurement of a physical phenomenon: a scene consists of objects with particular shapes and materials, illuminated in a particular way, observed from a particular viewpoint, and moving and interacting under physical laws. The image records only the light that this arrangement happens to send toward the camera. Seeing, on this view, is an attempt to invert that measurement—to infer, from the recorded light, the underlying scene that gave rise to it. The framing is a long-standing one in vision [\u003ca href=\"#bib.bib53\"\u003e64\u003c/a\u003e, \u003ca href=\"#bib.bib5\"\u003e36\u003c/a\u003e, \u003ca href=\"#bib.bib4\"\u003e67\u003c/a\u003e, \u003ca href=\"#bib.bib68\"\u003e106\u003c/a\u003e], and it is broadly the one our own research has followed.\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.p2.1\"\u003e\u003c/span\u003eThe appeal of this framing is that what it recovers remains valid beyond the conditions under which it was observed. Suppose a system has determined that a scene contains a mug of a certain shape and material resting on a table. It is then poised to answer questions, often counterfactual, that were never posed during training: what the mug looks like from behind, what happens if the table is tilted, where a hand should be placed to pick it up. A system that has instead learned the statistics of how mugs on tables tend to appear may well answer some of these correctly, but it has no particular reason to. Structure of this kind is what allows a modest number of observations to support an open-ended range of predictions and actions [\u003ca href=\"#bib.bib82\"\u003e99\u003c/a\u003e, \u003ca href=\"#bib.bib83\"\u003e98\u003c/a\u003e].\u003c/p\u003e\n\u003cp\u003e\u003cspan id=\"S2.SS8.p3.1\"\u003e\u003c/span\u003eThis also shapes how we think about the relationship between vision and language. Language is already an abstraction over experience: it records what people have found worth describing to one another, in the vocabulary they happened to develop. A good deal of how the physical world behaves has never been described in this way—how a particular stroller folds, how dough responds to a rolling pin, how a rose opens and then collapses over the course of a few weeks [\u003ca href=\"#bib.bib87\"\u003e33\u003c/a\u003e]. Visual observations carry this information regardless of whether anyone has named it, which seems to us a reason to treat vision as a source of world structure in its own right, rather than primarily as an input channel to a language model.\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003cspan id=\"S2.SS8.p1.1\"\u003e\u003c/span\u003eOne way to think about visual intelligence is as the recovery of the structure, or code, of the physical world from visual observations. An image is a measurement of a physical phenomenon: a scene consists of objects with particular shapes and materials, illuminated in a particular way, observed from a particular viewpoint, and moving and interacting under physical laws. The image records only the light that this arrangement happens to send toward the camera. Seeing, on this view, is an attempt to invert that measurement—to infer, from the recorded light, the underlying scene that gave rise to it. The framing is a long-standing one in vision [[64](#bib.bib53), [36](#bib.bib5), [67](#bib.bib4), [106](#bib.bib68)], and it is broadly the one our own research has followed.\n\n\u003cspan id=\"S2.SS8.p2.1\"\u003e\u003c/span\u003eThe appeal of this framing is that what it recovers remains valid beyond the conditions under which it was observed. Suppose a system has determined that a scene contains a mug of a certain shape and material resting on a table. It is then poised to answer questions, often counterfactual, that were never posed during training: what the mug looks like from behind, what happens if the table is tilted, where a hand should be placed to pick it up. A system that has instead learned the statistics of how mugs on tables tend to appear may well answer some of these correctly, but it has no particular reason to. Structure of this kind is what allows a modest number of observations to support an open-ended range of predictions and actions [[99](#bib.bib82), [98](#bib.bib83)].\n\n\u003cspan id=\"S2.SS8.p3.1\"\u003e\u003c/span\u003eThis also shapes how we think about the relationship between vision and language. Language is already an abstraction over experience: it records what people have found worth describing to one another, in the vocabulary they happened to develop. A good deal of how the physical world behaves has never been described in this way—how a particular stroller folds, how dough responds to a rolling pin, how a rose opens and then collapses over the course of a few weeks [[33](#bib.bib87)]. Visual observations carry this information regardless of whether anyone has named it, which seems to us a reason to treat vision as a source of world structure in its own right, rather than primarily as an input channel to a language model.","sourceFormat":"markdown"},"note:sha256:7d542fd3206dd98fd72eaf19aa63aded34dc49511a3368d220b5007a4978cd14":{"html":"\u003cp\u003eA system trained once and then frozen cannot accommodate an open and changing world. Asano defines VGI as a system that develops throughout its visual lifetime, while Du argues that an embodied system must collect informative experience and continue adapting after deployment. Davison’s persistent spatial representations and Ramanan’s stateful long-horizon models highlight the need for compact memory that can be accessed and revised. Liu and Du further emphasize that an intelligent system should actively decide what to observe and use action to resolve uncertainty.\u003c/p\u003e\n\u003cp\u003eThese requirements also change how VGI should be evaluated. Fouhey’s scientific setting emphasizes validation without conventional ground truth and the handling of sensor systematics and units; Raghunathan adds coherence, diversity, and originality; Davison and Du require persistent spatial understanding and reliable action; and Shangzhe Wu \u0026amp; Jiajun Wu ask whether recovered structure supports intervention and simulation rather than reconstruction alone. VGI benchmarks should therefore evaluate transfer, continual adaptation, active observation, persistent world knowledge, creativity, physical consistency, and efficiency. No single benchmark is likely to measure all of these dimensions, but isolated static tasks are unlikely to be sufficient.\u003c/p\u003e\n","kind":"html","rawMarkdown":"A system trained once and then frozen cannot accommodate an open and changing world. Asano defines VGI as a system that develops throughout its visual lifetime, while Du argues that an embodied system must collect informative experience and continue adapting after deployment. Davison’s persistent spatial representations and Ramanan’s stateful long-horizon models highlight the need for compact memory that can be accessed and revised. Liu and Du further emphasize that an intelligent system should actively decide what to observe and use action to resolve uncertainty.\n\nThese requirements also change how VGI should be evaluated. Fouhey’s scientific setting emphasizes validation without conventional ground truth and the handling of sensor systematics and units; Raghunathan adds coherence, diversity, and originality; Davison and Du require persistent spatial understanding and reliable action; and Shangzhe Wu \u0026 Jiajun Wu ask whether recovered structure supports intervention and simulation rather than reconstruction alone. VGI benchmarks should therefore evaluate transfer, continual adaptation, active observation, persistent world knowledge, creativity, physical consistency, and efficiency. No single benchmark is likely to measure all of these dimensions, but isolated static tasks are unlikely to be sufficient.","sourceFormat":"markdown"},"note:sha256:871f5371013f293477f66a9316d0f4f5a3c585c8b70b7a128a946e75e0714162":{"html":"\u003cp\u003eWe view visual intelligence as the capacity to acquire usable knowledge of the world from visual experience and apply it to prediction, imagination, reconstruction, and new tasks. In this sense, visual intelligence is intelligence that emerges from visual experience: the ability to learn usable structure of the observable world from partial visual observations, understand its hidden structure, predict what may happen next, reconstruct what is not directly observed, imagine possible alternatives, and generalise such knowledge to new visual tasks. It is not simply a stronger image classifier, nor simply a visual encoder connected to an LLM.\u003c/p\u003e\n\u003cp\u003eOne important consequence of this view is that human vision should not be the upper bound of visual intelligence. A system exposed to richer-than-human visual information may acquire intelligence that goes beyond human-centered vision. The goal of visual intelligence is not to imitate human perception, but to ask what kind of intelligence can emerge when machines learn from visual experience at a scale, diversity, and precision that humans cannot access. This view also suggests a common analogy across humans, animals, and machines. Biological organisms can exhibit intelligent behavior without language by sensing the world, discovering regularities, predicting, and acting. Vision and perception existed long before symbolic language, and it is plausib
