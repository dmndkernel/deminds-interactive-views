3c/span\u003e","payload":{"lines":"18,19","sourceOwner":"l:11897:11935:8co218","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e一天协议把过程拆成早晨心理挖掘、白天打断自动驾驶、晚上整合方向。\u003c/span\u003e","payload":{"lines":"19,20","sourceOwner":"l:11937:11970:8co218","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eCybernetics 提供了一个很实用的行为框架：目标 → 行动 → 感知 → 比较 → 根据反馈再行动。\u003c/span\u003e","payload":{"lines":"20,21","sourceOwner":"l:11972:12027:8co218","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e最终不是追求固定终点，而是建立 vision、anti-vision、项目、日常动作与 constraints 组成的持续反馈结构。\u003c/span\u003e","payload":{"lines":"21,22","sourceOwner":"l:12029:12096:8co218","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e关键要点\u003c/span\u003e","payload":{"fold":1,"lines":"16,17","sourceOwner":"h:11855:12097:8co218","tag":"h3"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e真正值得复用的是“身份—目标—行为—反馈”的循环，而不是一次性的激励。\u003c/span\u003e","payload":{"lines":"23,24","sourceOwner":"l:12112:12148:8co218","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e与其问“怎样逼自己坚持”，不如先问：当前行为到底在保护什么，以及它正在把我带向怎样的人生。\u003c/span\u003e","payload":{"lines":"24,25","sourceOwner":"l:12150:12196:8co218","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e可借鉴的新思路\u003c/span\u003e","payload":{"lines":"22,23","sourceOwner":"h:12101:12200:8co218","tag":"h3"}}],"content":"\u003cspan data-dmnd-editorial-insight=\"v1\" class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003eChatGPT 编辑附注\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:6b5674c7474f16d427433a96c65a842e600b18b7a8d6682c75705764976594e6\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"15,16","sourceOwner":"h:11699:12200:8co218","tag":"h2"}}],"content":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-efypCbQAEEi8a?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\u003cbr\u003e\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e如何用一天重新校准你的人生\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"如何用一天重新校准你的人生\" data-note-id=\"note:sha256:69198d5836f2df41acc2d070ce8b0a4b6929d882a3a11db91a09fefc4e5d2d67\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","sourceOwner":"h:2:12200:8co218","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"如何用一天重新校准你的人生\"\u003e如何用一天重新校准你的人生\u003c/h1\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-efypCbQAEEi8a?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e@thedankoe · \u003ca href=\"https://x.com/thedankoe/article/2010751592346030461\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX Article\u003c/a\u003e · 2026-01-12\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e如果你和我差不多，大概也觉得新年计划挺蠢的。\u003c/p\u003e\n\u003cp\u003e因为大多数人改变人生的方法，从一开始就错了。他们制定新年计划，很大程度上只是因为别人都这么做——我们从各种身份和地位游戏里制造出一种表面的意义——但这种方式并不满足真正改变所需要的条件。真正的改变，比说服自己“今年我要更自律、更高效”要深得多。\u003c/p\u003e\n\u003cp\u003e如果你也是其中一员，我并不是来居高临下地批评你（我的写作确实常常有点狠）。我放弃过的目标，比真正实现的多十倍。我觉得对大多数人来说，这反而很正常。但同样真实的是：人们一次又一次试图改变生活，却几乎总是失败。\u003c/p\u003e\n\u003cp\u003e所以，尽管我觉得新年计划很蠢，但定期回头看看自己讨厌的生活是什么样，然后借此把自己推向一个好得多的方向，仍然是一件很明智的事。\u003c/p\u003e\n\u003cp\u003e无论你是想创业、改变身体状态，还是想冒险追求一种更有意义的生活，又不想两周后就放弃，我都想分享 7 个关于行为改变、心理与效率的想法，帮助你在 2026 年真正开始改变。\u003c/p\u003e\n\u003cp\u003e这篇会比较全面。\u003c/p\u003e\n\u003cp\u003e它不是那种读完就忘的文章。\u003c/p\u003e\n\u003cp\u003e你最好把它存下来，做笔记，并且专门留出时间去思考。\u003c/p\u003e\n\u003cp\u003e文末的协议，目的是让你深入审视自己的心理，找出自己真正想要的生活。完整做一遍大约需要一天，但它带来的影响可能持续更久。\u003c/p\u003e\n\u003cp\u003e开始吧。\u003c/p\u003e\n\u003ch2 id=\"改变为什么总是失败身份目标与自我保护\"\u003e改变为什么总是失败：身份、目标与自我保护\u003c/h2\u003e\n\u003ch3 id=\"i-你还没到达想去的地方因为你还不是那个会到达那里的人\"\u003eI — 你还没到达想去的地方，因为你还不是那个会到达那里的人\u003c/h3\u003e\n\u003cp\u003e面对一个大目标，人们通常只关注成功所需要的两件事中的一件：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e改变行动，以便向目标推进（次要，二阶）\u003c/li\u003e\n\u003cli\u003e改变你是谁，让行为自然随之改变（更重要，一阶）\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e大多数人设定一个表层目标，在最初几周靠兴奋和意志力维持自律，然后几乎毫无挣扎地回到旧生活。因为他们只是试图在一个已经腐烂的地基上搭建更好的生活。\u003c/p\u003e\n\u003cp\u003e如果这还不直观，可以看一个例子。\u003c/p\u003e\n\u003cp\u003e想象一个成功的人。可以是身材极好的健美运动员、身家数亿美元的创业者 / CEO，或者一个面对一群人聊天时完全不会焦虑、极有魅力的人。\u003c/p\u003e\n\u003cp\u003e你觉得健美运动员需要靠“硬撑”才能吃得健康吗？CEO 需要每天逼自己起床去带团队吗？从外面看，可能像是这样。但更接近事实的是：\u003cem\u003e他们已经很难想象自己还能用别的方式生活。\u003c/em\u003e 对健美运动员来说，真正需要硬撑的是去吃得不健康。对 CEO 来说，真正需要逼自己的，反而是赖在床上不起，而且他们会因此非常难受。（这里当然有很多细节，但先顺着这个例子走。）\u003c/p\u003e\n\u003cp\u003e在一些人看来，我自己的生活方式也挺极端、挺自律。对我来说，它只是自然状态。我不是想借此贬低其它生活方式，我只是确实喜欢这样生活。每当我妈让我“休息一下、出去玩玩、找点乐子”时，我常常忍住不回她一句：“如果这不是乐趣，我为什么还要做？”\u003c/p\u003e\n\u003cp\u003e下面这句话听起来很简单，但很多人就是没有真正理解：\u003c/p\u003e\n\u003cp\u003e如果你想得到某种人生结果，就必须在真正得到那个结果之前很久，先拥有会产生那个结果的\u003cem\u003e生活方式\u003c/em\u003e。\u003c/p\u003e\n\u003cp\u003e如果有人说自己想减 30 磅，我通常不会立刻相信。不是因为我觉得他做不到，而是因为太多人会说：“我等减完就能重新开始享受生活了。” 很遗憾，如果你没有把“让你真正减下来的生活方式”变成长期生活，并找到一个比旧习惯更有吸引力、更强的理由，那么你几乎一定会回到原点。然后你可以不高兴地发现，自己浪费了唯一无法拿回来的资源：时间。\u003c/p\u003e\n\u003cp\u003e当一个人真的改变时，那些不再推动自己走向目标的习惯，会变得令人反感。因为你已经非常清楚，这些行动持续复利之后，会把你带向怎样的人生。你之所以还能接受当前的标准，是因为你并没有真正意识到这些标准是什么，以及它们最终会把你带去哪里。后面会讨论怎样把这些东西挖出来，但我们得先铺垫。\u003c/p\u003e\n\u003cp\u003e你说自己想改变。你说你想“财务自由”“变得健康”，但你的行动却一直在表达另一个答案。那不是偶然，原因往往比你想象得更深。\u003c/p\u003e\n\u003ch3 id=\"ii-你还没到达想去的地方因为你其实并没有真正想去那里\"\u003eII — 你还没到达想去的地方，因为你其实并没有真正想去那里\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e只相信行动。人生发生在事件层面，而不是语言层面。相信行动。\u003c/p\u003e\n\u003cp\u003e— Alfred Adler\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e如果你想改变自己，首先要理解\u003cem\u003e心智是怎样工作的\u003c/em\u003e，这样你才有可能重新编程它。\u003c/p\u003e\n\u003cp\u003e理解心智的第一步，是理解所有行为都具有目标导向性。也就是 teleological（目的论式）的。乍一看这好像很明显，但往深处挖时，大多数人并不愿意接受。\u003c/p\u003e\n\u003cp\u003e你向前迈一步，是因为你想走到某个地方。\u003c/p\u003e\n\u003cp\u003e你挠鼻子，是因为你想让痒感消失。\u003c/p\u003e\n\u003cp\u003e这两种情况很明显。但更多时候，你的目标是无意识的。比如，你中午坐在沙发上发呆，可能只是为了在下一件责任到来之前把时间耗掉，而你自己并没有意识到。\u003c/p\u003e\n\u003cp\u003e更复杂、更无意识的时候，你甚至会追求一些伤害自己的目标，同时又用一种社会上能接受的说法为自己的行为辩护，让自己看起来没那么失败。\u003c/p\u003e\n\u003cp\u003e例如，如果你一直拖延工作，你可能会把原因解释成“我不够自律”。但实际上，你和任何时候一样，都在追求某个目标。这个目标可能是：\u003cem\u003e保护自己，不去面对作品完成并公开之后可能遭受的评价。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e如果你说自己想离开一份毫无前景的工作，却一直没有真正理由地留下来，你可能会觉得自己“不够勇敢”，或者“天生就不是敢冒险的人”。但更真实的解释可能是：你正在追求安全、可预测，以及一种不让自己在亲友眼里显得失败的借口——哪怕他们把一份没前景的工作视为成功。\u003c/p\u003e\n\u003cp\u003e这里真正的教训是：真正的改变，需要改变你的目标。\u003c/p\u003e\n\u003cp\u003e我不是说再去\u003cem\u003e设定\u003c/em\u003e一个表层目标——因为“设目标”这件事本身，也可能只是服务于另一个对你有害的无意识目标。生产力领域已经把这个讲烂了。我说的是改变你的\u003cem\u003e视角\u003c/em\u003e。\u003c/p\u003e\n\u003cp\u003e因为目标本质上就是一个视角。它是一种对未来的投射，也是一副感知滤镜，让你更容易注意到那些能帮助你实现目标的信息、想法和资源。\u003c/p\u003e\n\u003cp\u003e接下来还要再往深处挖一点，因为如果你理解不了这一层，就会更难从旧模式里出来。\u003c/p\u003e\n\u003ch3 id=\"iii-你还没到达想去的地方因为你害怕真正到达那里\"\u003eIII — 你还没到达想去的地方，因为你害怕真正到达那里\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e你必须记住，最重要的是：这个想法从哪里来，并没有那么重要。你可能从未见过职业催眠师，也从未正式接受过催眠。但如果你接受了某个观念——可能来自自己、老师、父母、朋友、广告或任何其它来源——并且坚信它是真的，那么它对你的影响，就可能像催眠师的话对被催眠者一样强大。\u003c/p\u003e\n\u003cp\u003e— Maxwell Maltz\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e下面是你今天之所以成为现在这个自己，以及未来会成为另一个自己的基本路径。可以把它看成“身份的解剖结构”：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e你想实现一个目标\u003c/li\u003e\n\u003cli\u003e你开始透过这个目标的滤镜看现实\u003c/li\u003e\n\u003cli\u003e你只会注意那些对实现目标“重要”的信息和想法（学习）\u003c/li\u003e\n\u003cli\u003e你朝目标行动，并得到“正在推进”的反馈\u003c/li\u003e\n\u003cli\u003e你重复这些行为，直到它们变成自动且无意识的模式（conditioning）\u003c/li\u003e\n\u003cli\u003e这些行为变成你对自己的定义：“我是那种会……的人”\u003c/li\u003e\n\u003cli\u003e你开始维护这个身份，以保持心理一致性\u003c/li\u003e\n\u003cli\u003e身份又进一步塑造新的目标，于是整个循环重新开始；如果这个身份本身对你想要的生活不利，问题很快会放大\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e真正棘手的地方，是你必须在第 6 和第 7 步之间把这个循环打断，而这个循环从童年就开始建立。\u003c/p\u003e\n\u003cp\u003e小时候，你最核心的目标是生存。\u003c/p\u003e\n\u003cp\u003e你依赖父母教你怎样活下去，所以你必须适应。大多数人的教育方式，本来就建立在奖励和惩罚上：如果你不接受他们的信念与价值观，就会受到惩罚。直到你开始看穿这一点，你才真正开始独立思考。\u003c/p\u003e\n\u003cp\u003e但你的父母也经历过同样的过程，这就可能变得危险。除非他们主动打破过这些模式，否则他们同样受到工业时代主流“成功观”的训练，同时也携带着从上一代、再上一代继承下来的最好和最坏的条件反射。\u003c/p\u003e\n\u003cp\u003e再往下一层，一旦你的身体生存需求得到满足——在今天的世界里，相对容易做到，很多人几乎从出生就处于较安全的环境——你会开始在概念和意识形态层面“求生”。你可能不再主要保护和复制身体，但会强烈保护和复制自己的思想。网上无处不在的观念战争，本质上往往就是个人和群体身份之间的冲突。\u003c/p\u003e\n\u003cp\u003e身体感受到威胁时，你会进入 fight or flight。\u003c/p\u003e\n\u003cp\u003e身份感受到威胁时，也会发生类似反应。\u003c/p\u003e\n\u003cp\u003e如果你强烈认同某种政治意识形态，那么别人挑战你的信念时，你会真的感到压力，情绪上就像刚被人扇了一耳光。由于大多数人并不会把情绪拿来检验真伪，于是很容易被困在 echo chamber 里，对一些最终伤害自己和他人的观点不断加码。\u003c/p\u003e\n\u003cp\u003e如果你在宗教家庭中长大，却从未真正独立思考，那么别人威胁到你心理安全的小泡泡时，你也可能本能地反击。\u003c/p\u003e\n\u003cp\u003e同样的事情，也会发生在“我是律师”“我是 gamer”“我就是这种人”这些无意识身份上——尤其当这些身份本身阻碍你采取能改善生活的行动时。\u003c/p\u003e\n\u003ch2 id=\"认知框架如何决定你能走多远\"\u003e认知框架如何决定你能走多远\u003c/h2\u003e\n\u003ch3 id=\"iv-你想要的人生存在于某一种心智水平之中\"\u003eIV — 你想要的人生，存在于某一种心智水平之中\u003c/h3\u003e\n\u003cp\u003e心智会随着时间，以一些相对可识别的阶段发展。\u003c/p\u003e\n\u003cp\u003e刚出生时，你就像一块只为生存服务的小海绵，会吸收一切让自己感觉安全的信念，而这些信念又高度受文化塑造。如果不小心，这些信念可能会慢慢结晶，让你之后更难过一种真正有意义的生活。\u003c/p\u003e\n\u003cp\u003e类似的发展路径已经被很多模型描述过，包括 Maslow’s Hierarchy、Greuter’s stages of ego development、Spiral Dynamics 和 Integral Theory。作者也把它们综合成自己的 \u003ca href=\"https://letters.thedankoe.com/p/human-30-a-map-to-reach-the-top-1?lli=1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHuman 3.0 model\u003c/a\u003e，并加入了一些 AI prompts，用来帮助人识别自己的发展阶段和下一步路径。\u003c/p\u003e\n\u003cp\u003e下面是作者对 9 个 ego-development stages 的 80/20 式概括：\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-ebHTubsAEsAee?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eImpulsive（冲动型）\u003c/strong\u003e — 冲动和行动几乎没有分离，思维非黑即白。\u003cem\u003e例如，幼儿生气时直接打人，因为“感受”和“行为”还是同一件事。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSelf-Protective（自我保护型）\u003c/strong\u003e — 世界被看作危险的，你开始学会保护自己。\u003cem\u003e例如，孩子会藏成绩单、对家务撒谎，并摸索成年人到底想听什么。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConformist（从众型）\u003c/strong\u003e — 你和所属群体几乎没有分离，群体规则就像现实本身。\u003cem\u003e例如，一个人真的无法理解为什么有人会投票给与自己家庭或群体不同的政治选择。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSelf-Aware（自我觉察型）\u003c/strong\u003e — 你开始意识到，自己的内在世界与外部表现并不完全一致。\u003cem\u003e例如，坐在教堂里突然意识到自己也许并不真的相信周围人都相信的东西，但又不知道该怎么办。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConscientious（自律 / 原则型）\u003c/strong\u003e — 你建立自己的原则体系，并据此要求自己。\u003cem\u003e例如，经过认真研究后离开家庭宗教，形成一套自己能辩护的个人哲学；或者建立清晰职业计划，因为你相信正确投入会得到正确结果。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIndividualist（个体主义型）\u003c/strong\u003e — 你开始看到，自己的原则同样受环境塑造，因此不再把它们握得那么死。\u003cem\u003e例如，你意识到自己的政治立场可能更多来自成长环境，而不是客观真理；或者发现自己所谓“宏大职业目标”，其实只是为了赢得父亲认可。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eStrategist（战略型）\u003c/strong\u003e — 你开始在系统中工作，同时知道自己也是系统的一部分。\u003cem\u003e例如，领导一个组织的同时主动检查自己的盲点；或者参与政治时知道自己的观点必然部分、带偏见，而且你不可能完全看清这种偏见。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConstruct-Aware（建构觉察型）\u003c/strong\u003e — 你开始把所有框架——包括身份本身——看作有用但并非绝对真实的建构。\u003cem\u003e例如，你用隐喻而不是字面方式持有精神信念，知道 map is not the territory；或者带着一点轻松感，看着自己扮演“founder”“thought leader”这些角色。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUnitive（合一型）\u003c/strong\u003e — 自我与生活之间的分离逐渐消失。\u003cem\u003e例如，工作、休息与玩耍不再像三件不同的事；不再有一个“必须成为某种人”的自我，只剩下对当下发生之事的回应。\u003c/em\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e作者猜测，读到这里的大多数人可能游走在 4 到 8 之间，而这个跨度非常大。更接近 8 的人，可能只是为了学习或用一种不具破坏性的方式消磨时间；更接近 4 的人，则更可能真的在寻找变化：你觉得自己“应该还有更多可能”，但暂时还无法把一切解释清楚，因为背后的因素太多。\u003c/p\u003e\n\u003cp\u003e好消息是，不管你现在在哪个阶段，向前移动通常都存在某种共同模式。\u003c/p\u003e\n\u003ch3 id=\"v-智力是把人生带向你真正想要方向的能力\"\u003eV — 智力，是把人生带向你真正想要方向的能力\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e对智力唯一真正的检验，是你是否从生活中得到自己想要的东西。\u003c/p\u003e\n\u003cp\u003e— Naval Ravikant\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e作者认为，成功可以拆成几个组成部分。\u003c/p\u003e\n\u003cp\u003e一个是 \u003cstrong\u003eagency（能动性）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e一个是 \u003cstrong\u003eopportunity（机会）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e最后一个是 \u003cstrong\u003eintelligence（智力）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e如果你有很强的 agency，却没有真正的机会，那么再愿意行动也很难产生足够回报。\u003c/p\u003e\n\u003cp\u003e如果你有机会也有 agency，却缺乏足够 intelligence，那么你也很难把机会真正转化为结果。\u003c/p\u003e\n\u003cp\u003eAgency 前面谈过。Opportunity 方面，作者无法告诉你一定要换一个物理地点，但如果你完全看不到数字世界里已经存在的大量机会，他也无话可说。\u003c/p\u003e\n\u003cp\u003e这里更重要的是：在这篇文章的语境下，\u003cem\u003eintelligence 到底是什么\u003c/em\u003e？为此，作者转向 cybernetics。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCybernetics 来自希腊词 \u003cem\u003ekybernetikos\u003c/em\u003e，大意是“掌舵”或者“善于操舵”。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e它也常被解释成“得到你想要之物的艺术”。\u003c/p\u003e\n\u003cp\u003e如果 Naval 把智力定义成“从人生里得到自己想要的东西”，那么理解 cybernetics 就能帮助你更快理解这种能力。\u003c/p\u003e\n\u003cp\u003eCybernetics 描述了智能系统的一些核心属性：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e有一个目标\u003c/li\u003e\n\u003cli\u003e朝目标行动\u003c/li\u003e\n\u003cli\u003e感知自己现在在哪里\u003c/li\u003e\n\u003cli\u003e把当前状态和目标比较\u003c/li\u003e\n\u003cli\u003e根据反馈再次行动\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg alt=\"图像\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-eb5tkbEAA8v0u?format=jpg\u0026amp;name=medium\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e可以通过一个系统持续试错、迭代和坚持的能力，来判断它有多“智能”。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e船被风吹离航线后重新修正方向；恒温器感知温度变化后开启；血糖上升后胰腺分泌胰岛素。\u003c/p\u003e\n\u003cp\u003e这些和“得到你想要的人生”有什么关系？\u003c/p\u003e\n\u003cp\u003e作者认为，关系非常直接。\u003c/p\u003e\n\u003cp\u003e行动、感知、比较，以及从更高层理解整个系统，是高智能行为的基础——至少在本文使用的这一定义下。\u003c/p\u003e\n\u003cp\u003e高 intelligence，是持续迭代、坚持，并看懂大局的能力。\u003cstrong\u003e低 intelligence 的典型表现，就是无法从错误中学习。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e低智能的人往往困在问题里，而不是解决问题。遇到路障就放弃。比如一个写作者没能建立受众，于是干脆不写了，因为他缺乏继续尝试、实验并找到适合自己方法的能力。\u003c/p\u003e\n\u003cp\u003e更高的 intelligence，是意识到很多问题只要时间尺度足够大，就存在解决路径。你想实现的目标背后，总存在一系列可能的选择和步骤。\u003c/p\u003e\n\u003cp\u003e这也意味着要理解，想法与能力本身是有层级的。你不可能一下子从 papyrus 跳到 Google Docs。即使某个目标今天确实做不到，也可能只是因为当前缺少某种资源，而这些资源几年后可能才被发明。\u003c/p\u003e\n\u003cp\u003e作者反复强调，他说的“goal”，并不只是典型 self-help 语境里的“设目标”。\u003c/p\u003e\n\u003cp\u003e他更接近 teleology 的理解：世界中的事物都服务于某种目的，并嵌在更大的整体里。\u003c/p\u003e\n\u003cp\u003e目标决定你怎样看世界。\u003c/p\u003e\n\u003cp\u003e目标决定你怎样定义“成功”和“失败”。\u003c/p\u003e\n\u003cp\u003e你可以试着“享受过程”，但如果你追求的目标本身错了，你很难真正享受。\u003c/p\u003e\n\u003cp\u003e你的 mind 就像现实的操作系统。\u003c/p\u003e\n\u003cp\u003e而这个系统主要由目标组成。\u003c/p\u003e\n\u003cp\u003e对大多数人来说，这些目标并不是自己主动选择的，而是像代码一样被写入 psyche：\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e去上学。找工作。被冒犯。扮演受害者。65 岁退休。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e一条熟悉，但不一定有效的路径。\u003c/p\u003e\n\u003cp\u003e想变得更“智能”，作者给出的方向包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e拒绝已知路径\u003c/li\u003e\n\u003cli\u003e进入未知\u003c/li\u003e\n\u003cli\u003e设定更高的目标，以扩展自己的心智\u003c/li\u003e\n\u003cli\u003e接受混乱，让成长发生\u003c/li\u003e\n\u003cli\u003e学习自然界中可泛化的原则\u003c/li\u003e\n\u003cli\u003e成为 deep generalist\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e作者也承认，这不是传统定义上的 intelligence。但他认为，这套过程会在大脑中建立极其丰富的连接，而外界往往会把这种人观察为“更聪明”。如果再加上 agency，效果会更强。\u003c/p\u003e\n\u003cp\u003e这也自然带入下一部分。\u003c/p\u003e\n\u003ch2 id=\"一天重置协议从不满到方向再到行动\"\u003e一天重置协议：从不满到方向，再到行动\u003c/h2\u003e\n\u003ch3 id=\"vi-如何在一天里启动一段全新的生活\"\u003eVI — 如何在一天里启动一段全新的生活\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e我人生里最好的阶段，往往都发生在我彻底受够了自己毫无进展的那段时期之后。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e怎样真正往自己心里挖？\u003c/p\u003e\n\u003cp\u003e怎样看见自己已经习以为常的 conditioning？\u003c/p\u003e\n\u003cp\u003e怎样获得足以改变人生轨迹的洞见？\u003c/p\u003e\n\u003cp\u003e作者的答案是：通过一个简单、但往往令人不舒服的动作——\u003cem\u003e提问。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e真正持续提问的人非常少。你从一个人谈论某个主题的方式里，往往就能看出来。作者甚至直接把 questioning 视为 thinking，而大多数人其实很少真正思考。\u003c/p\u003e\n\u003cp\u003e下面是一套作者建议每年使用一次的完整 protocol，用来重置人生并进入一段高强度进展期。它的目的，是帮助你问对问题。\u003c/p\u003e\n\u003cp\u003e这些问题会从 macro 一直走到 micro：你想去哪里、需要做什么、以及现在立刻可以做什么，才能推动自己向那个现实靠近。\u003c/p\u003e\n\u003cp\u003e完整完成大约需要一天。你需要纸、笔和一个开放的心态。\u003c/p\u003e\n\u003cp\u003e作者观察到，真正实现身份转变的人，通常会经历一个“张力积累后突然发生”的过程，常见有三个阶段：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eDissonance（失调）\u003c/strong\u003e — 开始感觉自己不属于当前生活，并逐渐受够没有进展\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUncertainty（不确定）\u003c/strong\u003e — 不知道接下来会怎样，于是要么尝试，要么迷失并感觉更糟\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDiscovery（发现）\u003c/strong\u003e — 找到真正想追求的东西，然后在很短时间里完成过去几年都没有做到的进展\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e所以，这套 protocol 的目标就是帮助你进入足够强的 dissonance，穿过 uncertainty，并真正发现自己想追求什么，直到方向足够清晰，很多原本的分心开始失去吸引力。\u003c/p\u003e\n\u003cp\u003e整个流程设计为一天完成：早上做一次心理挖掘，找出隐藏动机；白天通过多次 interrupt 打断自动驾驶状态，不断回到对生活的审视；晚上把当天洞见整合成一个第二天就能开始执行的方向。\u003c/p\u003e\n\u003cp\u003e作者也明确承认：这不保证对所有人都有效，因为不是每个读者都处在一个“这些问题恰好会产生巨大影响”的人生阶段。一本书的高潮，也不可能被搬到开头还保持同样效果。\u003c/p\u003e\n\u003ch3 id=\"part-1-早晨心理挖掘建立-vision-与-anti-vision\"\u003ePart 1 — 早晨：心理挖掘，建立 Vision 与 Anti-Vision\u003c/h3\u003e\n\u003cp\u003e第一步，是给心智建立一个新的 frame 或 perception lens。\u003c/p\u003e\n\u003cp\u003e这有点像给自己先造一个新的壳，然后离开旧壳，再慢慢长进新壳里。一开始不合身，反而是正常的。\u003c/p\u003e\n\u003cp\u003e拿出 15–30 分钟，认真思考并回答下面这些问题。作者特别强调：\u003cstrong\u003e不要把这部分思考外包给 AI。\u003c/strong\u003e 目的正是突破你自己心里的限制。如果暂时答不出来，就晚点再回来。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e你已经学会长期忍受的、那种沉闷而持续的不满是什么？不是巨大痛苦，而是你已经默认“就这样吧”的东西。\u003c/li\u003e\n\u003cli\u003e过去一年，你反复抱怨、却从未真正改变的三件事是什么？\u003c/li\u003e\n\u003cli\u003e对每一个抱怨：如果有人只看你的行为、不听你的语言，他会得出“你其实真正想要什么”的结论？\u003c/li\u003e\n\u003cli\u003e关于你当前生活，有什么事实如果必须对一个你极其尊敬的人承认，会让你无法忍受？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e这些问题的目的，是让你真正意识到当前生活中的痛苦。\u003c/p\u003e\n\u003cp\u003e接下来，作者建议把这些痛苦整理成一种 \u003cstrong\u003eanti-vision\u003c/strong\u003e：对“我绝对不想继续活成怎样”的生活形成残酷而清晰的认识。这样就能利用负面能量，为正向行动提供方向和内在动力。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e如果未来五年什么都不改变，请描述一个普通星期二。你在哪里醒来？身体是什么感觉？第一件想到的事是什么？身边是谁？9 点到 18 点之间在做什么？晚上 10 点是什么感受？\u003c/li\u003e\n\u003cli\u003e再把时间拉到十年。你错过了什么？哪些机会彻底关闭？谁已经对你放弃？当你不在场时，别人会怎么评价你？\u003c/li\u003e\n\u003cli\u003e你已经来到生命终点。你选择了最安全的那一版人生，从未真正打破模式。代价是什么？你从未允许自己去感受、尝试或成为过什么？\u003c/li\u003e\n\u003cli\u003e你身边有没有人，已经生活在你刚刚描述的未来里？他可能比你早五年、十年或二十年走上同一条轨迹。想到自己最终变成那样，你有什么感受？\u003c/li\u003e\n\u003cli\u003e如果你真的想改变，需要放弃什么身份？“我是那种会……”的人。社会层面上，不再当这种人会有什么代价？\u003c/li\u003e\n\u003cli\u003e你一直没有改变，最让自己难以启齿的真实原因是什么？那个听起来不像“合理”，而更像软弱、恐惧或懒惰的原因。\u003c/li\u003e\n\u003cli\u003e如果当前行为本质上是一种 self-protection，你到底在保护什么？而这种保护又正在让你付出什么代价？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e如果这些问题你都诚实回答，而且你恰好处在人生合适的阶段，可能会感到明显的不适，甚至对当前生活产生厌恶。\u003c/p\u003e\n\u003cp\u003e接下来，就要把这股能量转成正方向。\u003c/p\u003e\n\u003cp\u003e作者建议先建立一个 \u003cstrong\u003eminimum viable vision\u003c/strong\u003e，因为 vision 更像一个产品：一开始不清晰，但会随着经验逐渐变得更强、更具体。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e先暂时忘掉现实限制。如果你可以打个响指，三年后就生活在完全不同的人生里，不考虑“现实不现实”，你真正\u003cem\u003e想要\u003c/em\u003e什么？同样详细描述一个普通星期二。\u003c/li\u003e\n\u003cli\u003e要让那种生活对你而言变得自然，而不是勉强维持，你需要对自己相信什么？写下身份句：“我是那种会……的人。”\u003c/li\u003e\n\u003cli\u003e如果你已经是那个人，这周你会做哪一件事？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e作者建议第二天一早，先完整回答这些问题。\u003c/p\u003e\n\u003ch3 id=\"part-2-白天打断自动驾驶暴露无意识模式\"\u003ePart 2 — 白天：打断自动驾驶，暴露无意识模式\u003c/h3\u003e\n\u003cp\u003eJournaling 本身很好看，但作者真正想要的是改变。\u003c/p\u003e\n\u003cp\u003e如果你不主动打断当前那些让自己维持不变的无意识模式，真正的改变大概率不会发生。\u003c/p\u003e\n\u003cp\u003e整个白天，都要不断回到早晨写下的内容继续思考。\u003c/p\u003e\n\u003cp\u003e但光靠“记得想”还不够，所以作者建议立刻在手机里创建 reminders 或 calendar events，并直接把问题写进提醒里，这样提醒出现时就能马上开始思考。\u003c/p\u003e\n\u003cp\u003e时间越随机、越不干扰正常日程越好。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e11:00am：\u003c/strong\u003e 我现在做的这件事，其实是在逃避什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e1:30pm：\u003c/strong\u003e 如果有人拍下我过去两小时，他会判断我真正想从人生里得到什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e3:15pm：\u003c/strong\u003e 我现在是在走向我讨厌的人生，还是想要的人生？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e5:00pm：\u003c/strong\u003e 有什么最重要的东西，我一直假装它不重要？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e7:30pm：\u003c/strong\u003e 今天有哪些行为是为了保护旧身份，而不是真正出于欲望？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e9:00pm：\u003c/strong\u003e 今天什么时候我最有生命力？什么时候最麻木？\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e还可以在通勤、散步或躺着的时候继续想：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e如果我不再需要别人把我看成 [你写下的旧身份]，会发生什么变化？\u003c/li\u003e\n\u003cli\u003e我在哪些地方用“活着的感觉”交换了安全感？\u003c/li\u003e\n\u003cli\u003e我明天就能开始成为的、最小版本的“理想中的自己”是什么？\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"part-3-晚上把洞见压缩成方向\"\u003ePart 3 — 晚上：把洞见压缩成方向\u003c/h3\u003e\n\u003cp\u003e如果完整走过前面的过程，作者认为你大概率至少会得到一个可能真正改变人生方向的洞见。\u003c/p\u003e\n\u003cp\u003e接下来要把这些洞见显性化，并开始通过行动把它们整合进新的身份。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e经过今天之后，关于“我为什么一直卡住”，什么答案现在最真实？\u003c/li\u003e\n\u003cli\u003e真正的敌人是什么？明确写出来。不是环境，不是别人，而是那个一直在控制你的内部模式或信念。\u003c/li\u003e\n\u003cli\u003e写一句话，总结你绝对不允许自己的人生变成什么样。这是 anti-vision 的压缩版，读到它时应该能让你产生感觉。\u003c/li\u003e\n\u003cli\u003e再写一句话，总结你现在正在建设什么，同时承认它未来还会演化。这是你的 vision MVP。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e最后，再建立一套目标。\u003c/p\u003e\n\u003cp\u003e但这里的 goal 不是为了“完成某个成就”，因为目标本质上只是投射，而且一定会变化。\u003c/p\u003e\n\u003cp\u003e更好的理解是：把目标当作一个可替换的 point of view，一副能把你带入合适心智状态的 lens，让你采取那些远离不想要的人生、靠近想要人生的行动。\u003c/p\u003e\n\u003cp\u003e不要过度执着于“终点”，因为真正固定的终点并不存在。作者认为，享受更常来自持续进展本身。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eOne-year lens：\u003c/strong\u003e 一年后，必须发生哪一件具体事情，才说明你真的打破了旧模式？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOne-month lens：\u003c/strong\u003e 一个月后，必须达到什么状态，才能让一年目标仍然可能实现？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDaily lens：\u003c/strong\u003e 明天可以 timeblock 哪 2–3 个行动，是“正在成为的那个人”自然会做的？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e到这里，信息已经很多了。\u003c/p\u003e\n\u003cp\u003e但还差最后一层整合。\u003c/p\u003e\n\u003ch2 id=\"把生活变成一个可持续反馈系统\"\u003e把生活变成一个可持续反馈系统\u003c/h2\u003e\n\u003ch3 id=\"vii-把人生设计成一场-video-game\"\u003eVII — 把人生设计成一场 Video Game\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e最理想的内在体验状态，是意识中存在秩序。它发生在心理能量——也就是注意力——被投入现实目标，而且技能与行动机会相匹配的时候。追求一个目标会给意识带来秩序，因为人必须把注意力集中在眼前任务上，并暂时忘记其它一切。\u003c/p\u003e\n\u003cp\u003e— Mihaly Csikszentmihalyi\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e到这里，你已经拿到了作者认为构成“好生活”的主要组成部分。\u003c/p\u003e\n\u003cp\u003e接下来，可以把这些洞见整理成一套统一计划。\u003c/p\u003e\n\u003cp\u003e拿出一张新纸，写下 6 个组件：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAnti-vision\u003c/strong\u003e — 我最不想再次经历的人生是什么？什么是我生活里真正的“反面终点”？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVision\u003c/strong\u003e — 我现在认为自己想要的理想生活是什么？并允许它随着前进不断被修正。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e1 year goal\u003c/strong\u003e — 一年后，我的生活应该是什么样？它是否更接近我想要的方向？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e1 month project\u003c/strong\u003e — 接下来一个月，我需要学什么？获得什么技能？做出什么东西，才能向一年目标靠近？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDaily levers\u003c/strong\u003e — 哪些是每天真正推动项目向前的高优先级动作？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConstraints\u003c/strong\u003e — 为了实现 vision，我有哪些东西明确不愿牺牲？\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e为什么这套结构可能有力量？\u003c/p\u003e\n\u003cp\u003e因为它给你建立了一个属于自己的小世界。\u003c/p\u003e\n\u003cp\u003e如果这一阶段的人生确实适合追求这组目标层级，你会开始自然被它吸引，并逐渐减少其它选择的吸引力。\u003c/p\u003e\n\u003cp\u003e也就是：\u003c/p\u003e\n\u003cp\u003e把人生变成一场 video game。\u003c/p\u003e\n\u003cp\u003e因为游戏本来就是 obsession、enjoyment 与 flow state 的典型系统。它们具备让人聚焦和获得清晰感的组件，所以反过来拆解这些组件，也可以用来设计自己的生活。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003evision\u003c/strong\u003e 是怎样算“赢”——至少在这场游戏下一次演化之前。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003eanti-vision\u003c/strong\u003e 是 stakes——如果你放弃，会发生什么。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003e1 year goal\u003c/strong\u003e 是 mission——这一阶段唯一最重要的长期任务。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003e1 month project\u003c/strong\u003e 是 boss fight——你通过它获得 XP 和 loot。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003edaily levers\u003c/strong\u003e 是 quests——每天推进，并不断解锁新机会。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003econstraints\u003c/strong\u003e 是 rules——这些限制反而会逼出创造力。\u003c/p\u003e\n\u003cp\u003e这些组件像一组同心圆，为注意力建立一道 forcefield，把那些不断出现的 distractions 和 shiny objects 挡在外面。\u003c/p\u003e\n\u003cp\u003e玩得越久，这股力量就越强。\u003c/p\u003e\n\u003cp\u003e最终，这套方式会慢慢变成你是谁，而不是一套需要你不断强迫自己遵守的计划。\u003c/p\u003e\n\u003cp\u003e— Dan\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"chatgpt-编辑附注-dmndeditorial-insightv1\" class=\"dmnd-editorial-block dmnd-editorial-start\"\u003eChatGPT 编辑附注\u003c/h2\u003e\n\u003cp class=\"dmnd-editorial-block\"\u003e这篇文章真正有价值的部分，不是“用一天修好人生”的标题，而是把改变重构为一个反馈系统：先识别旧身份和隐性目标，再建立 anti-vision 与 vision，通过持续行动、反馈和修正，让新行为逐渐变成新的身份。\u003c/p\u003e\n\u003ch3 id=\"关键要点\" class=\"dmnd-editorial-block\"\u003e关键要点\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e作者认为，长期改变首先是身份与目标的改变，而不是单纯增加纪律。\u003c/li\u003e\n\u003cli\u003e很多“拖延”或“不改变”可以被理解为某种自我保护目标，而不只是意志力不足。\u003c/li\u003e\n\u003cli\u003e一天协议把过程拆成早晨心理挖掘、白天打断自动驾驶、晚上整合方向。\u003c/li\u003e\n\u003cli\u003eCybernetics 提供了一个很实用的行为框架：目标 → 行动 → 感知 → 比较 → 根据反馈再行动。\u003c/li\u003e\n\u003cli\u003e最终不是追求固定终点，而是建立 vision、anti-vision、项目、日常动作与 constraints 组成的持续反馈结构。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"可借鉴的新思路\" class=\"dmnd-editorial-block\"\u003e可借鉴的新思路\u003c/h3\u003e\n\u003cul class=\"dmnd-editorial-block\"\u003e\n\u003cli\u003e真正值得复用的是“身份—目标—行为—反馈”的循环，而不是一次性的激励。\u003c/li\u003e\n\u003cli\u003e与其问“怎样逼自己坚持”，不如先问：当前行为到底在保护什么，以及它正在把我带向怎样的人生。\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr class=\"dmnd-editorial-block dmnd-editorial-end\"\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:0b3030f8be4eab943261355c7b4e8b67842174ecbb5044b53d417ede8bc969e4":{"blocks":[{"children":[{"title":"1. 改变行动，以便向目标推进（次要，二阶）"},{"title":"2. 改变你是谁，让行为自然随之改变（更重要，一阶）"}],"kind":"section","title":"面对一个大目标，人们通常只关注成功所需要的两件事中的一件"},{"children":[],"kind":"leaf","title":"大多数人设定一个表层目标，在最初几周靠兴奋和意志力维持自律，然后几乎毫无挣扎地回到旧生活。因为他们只是试图在一个已经腐烂的地基上搭建更好的生活。"},{"children":[],"kind":"leaf","title":"如果这还不直观，可以看一个例子。"},{"children":[],"kind":"leaf","title":"想象一个成功的人。可以是身材极好的健美运动员、身家数亿美元的创业者 / CEO，或者一个面对一群人聊天时完全不会焦虑、极有魅力的人。"},{"children":[],"kind":"leaf","title":"你觉得健美运动员需要靠“硬撑”才能吃得健康吗？CEO 需要每天逼自己起床去带团队吗？从外面看，可能像是这样。但更接近事实的是：他们已经很难想象自己还能用别的方式生活。 对健美运动员来说，真正需要硬撑的是去吃得不健康。对 CEO 来说，真正需要逼自己的，反而是赖在床上不起，而且他们会因此非常难受。（这里当然有很多细节，但先顺着这个例子走。）"},{"children":[],"kind":"leaf","title":"在一些人看来，我自己的生活方式也挺极端、挺自律。对我来说，它只是自然状态。我不是想借此贬低其它生活方式，我只是确实喜欢这样生活。每当我妈让我“休息一下、出去玩玩、找点乐子”时，我常常忍住不回她一句：“如果这不是乐趣，我为什么还要做？”"},{"bodyBlocks":[{"kind":"paragraph","text":"如果你想得到某种人生结果，就必须在真正得到那个结果之前很久，先拥有会产生那个结果的生活方式。"}],"children":[],"kind":"compound_leaf","lead":"下面这句话听起来很简单，但很多人就是没有真正理解："},{"children":[],"kind":"leaf","title":"如果有人说自己想减 30 磅，我通常不会立刻相信。不是因为我觉得他做不到，而是因为太多人会说：“我等减完就能重新开始享受生活了。” 很遗憾，如果你没有把“让你真正减下来的生活方式”变成长期生活，并找到一个比旧习惯更有吸引力、更强的理由，那么你几乎一定会回到原点。然后你可以不高兴地发现，自己浪费了唯一无法拿回来的资源：时间。"},{"children":[],"kind":"leaf","title":"当一个人真的改变时，那些不再推动自己走向目标的习惯，会变得令人反感。因为你已经非常清楚，这些行动持续复利之后，会把你带向怎样的人生。你之所以还能接受当前的标准，是因为你并没有真正意识到这些标准是什么，以及它们最终会把你带去哪里。后面会讨论怎样把这些东西挖出来，但我们得先铺垫。"},{"children":[],"kind":"leaf","title":"你说自己想改变。你说你想“财务自由”“变得健康”，但你的行动却一直在表达另一个答案。那不是偶然，原因往往比你想象得更深。"}],"html":"\u003cp\u003e面对一个大目标，人们通常只关注成功所需要的两件事中的一件：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e改变行动，以便向目标推进（次要，二阶）\u003c/li\u003e\n\u003cli\u003e改变你是谁，让行为自然随之改变（更重要，一阶）\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e大多数人设定一个表层目标，在最初几周靠兴奋和意志力维持自律，然后几乎毫无挣扎地回到旧生活。因为他们只是试图在一个已经腐烂的地基上搭建更好的生活。\u003c/p\u003e\n\u003cp\u003e如果这还不直观，可以看一个例子。\u003c/p\u003e\n\u003cp\u003e想象一个成功的人。可以是身材极好的健美运动员、身家数亿美元的创业者 / CEO，或者一个面对一群人聊天时完全不会焦虑、极有魅力的人。\u003c/p\u003e\n\u003cp\u003e你觉得健美运动员需要靠“硬撑”才能吃得健康吗？CEO 需要每天逼自己起床去带团队吗？从外面看，可能像是这样。但更接近事实的是：\u003cem\u003e他们已经很难想象自己还能用别的方式生活。\u003c/em\u003e 对健美运动员来说，真正需要硬撑的是去吃得不健康。对 CEO 来说，真正需要逼自己的，反而是赖在床上不起，而且他们会因此非常难受。（这里当然有很多细节，但先顺着这个例子走。）\u003c/p\u003e\n\u003cp\u003e在一些人看来，我自己的生活方式也挺极端、挺自律。对我来说，它只是自然状态。我不是想借此贬低其它生活方式，我只是确实喜欢这样生活。每当我妈让我“休息一下、出去玩玩、找点乐子”时，我常常忍住不回她一句：“如果这不是乐趣，我为什么还要做？”\u003c/p\u003e\n\u003cp\u003e下面这句话听起来很简单，但很多人就是没有真正理解：\u003c/p\u003e\n\u003cp\u003e如果你想得到某种人生结果，就必须在真正得到那个结果之前很久，先拥有会产生那个结果的\u003cem\u003e生活方式\u003c/em\u003e。\u003c/p\u003e\n\u003cp\u003e如果有人说自己想减 30 磅，我通常不会立刻相信。不是因为我觉得他做不到，而是因为太多人会说：“我等减完就能重新开始享受生活了。” 很遗憾，如果你没有把“让你真正减下来的生活方式”变成长期生活，并找到一个比旧习惯更有吸引力、更强的理由，那么你几乎一定会回到原点。然后你可以不高兴地发现，自己浪费了唯一无法拿回来的资源：时间。\u003c/p\u003e\n\u003cp\u003e当一个人真的改变时，那些不再推动自己走向目标的习惯，会变得令人反感。因为你已经非常清楚，这些行动持续复利之后，会把你带向怎样的人生。你之所以还能接受当前的标准，是因为你并没有真正意识到这些标准是什么，以及它们最终会把你带去哪里。后面会讨论怎样把这些东西挖出来，但我们得先铺垫。\u003c/p\u003e\n\u003cp\u003e你说自己想改变。你说你想“财务自由”“变得健康”，但你的行动却一直在表达另一个答案。那不是偶然，原因往往比你想象得更深。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"面对一个大目标，人们通常只关注成功所需要的两件事中的一件：\n\n1. 改变行动，以便向目标推进（次要，二阶）\n2. 改变你是谁，让行为自然随之改变（更重要，一阶）\n\n大多数人设定一个表层目标，在最初几周靠兴奋和意志力维持自律，然后几乎毫无挣扎地回到旧生活。因为他们只是试图在一个已经腐烂的地基上搭建更好的生活。\n\n如果这还不直观，可以看一个例子。\n\n想象一个成功的人。可以是身材极好的健美运动员、身家数亿美元的创业者 / CEO，或者一个面对一群人聊天时完全不会焦虑、极有魅力的人。\n\n你觉得健美运动员需要靠“硬撑”才能吃得健康吗？CEO 需要每天逼自己起床去带团队吗？从外面看，可能像是这样。但更接近事实的是：*他们已经很难想象自己还能用别的方式生活。* 对健美运动员来说，真正需要硬撑的是去吃得不健康。对 CEO 来说，真正需要逼自己的，反而是赖在床上不起，而且他们会因此非常难受。（这里当然有很多细节，但先顺着这个例子走。）\n\n在一些人看来，我自己的生活方式也挺极端、挺自律。对我来说，它只是自然状态。我不是想借此贬低其它生活方式，我只是确实喜欢这样生活。每当我妈让我“休息一下、出去玩玩、找点乐子”时，我常常忍住不回她一句：“如果这不是乐趣，我为什么还要做？”\n\n下面这句话听起来很简单，但很多人就是没有真正理解：\n\n如果你想得到某种人生结果，就必须在真正得到那个结果之前很久，先拥有会产生那个结果的*生活方式*。\n\n如果有人说自己想减 30 磅，我通常不会立刻相信。不是因为我觉得他做不到，而是因为太多人会说：“我等减完就能重新开始享受生活了。” 很遗憾，如果你没有把“让你真正减下来的生活方式”变成长期生活，并找到一个比旧习惯更有吸引力、更强的理由，那么你几乎一定会回到原点。然后你可以不高兴地发现，自己浪费了唯一无法拿回来的资源：时间。\n\n当一个人真的改变时，那些不再推动自己走向目标的习惯，会变得令人反感。因为你已经非常清楚，这些行动持续复利之后，会把你带向怎样的人生。你之所以还能接受当前的标准，是因为你并没有真正意识到这些标准是什么，以及它们最终会把你带去哪里。后面会讨论怎样把这些东西挖出来，但我们得先铺垫。\n\n你说自己想改变。你说你想“财务自由”“变得健康”，但你的行动却一直在表达另一个答案。那不是偶然，原因往往比你想象得更深。","sourceFormat":"markdown"},"note:sha256:2c1ea414c6828e41e7cde20f325c454943187469c89a6382ced8843e4055f2e3":{"blocks":[{"children":[],"kind":"leaf","title":"我人生里最好的阶段，往往都发生在我彻底受够了自己毫无进展的那段时期之后。"},{"children":[],"kind":"leaf","title":"怎样真正往自己心里挖？"},{"children":[],"kind":"leaf","title":"怎样看见自己已经习以为常的 conditioning？"},{"children":[],"kind":"leaf","title":"怎样获得足以改变人生轨迹的洞见？"},{"children":[],"kind":"leaf","title":"作者的答案是：通过一个简单、但往往令人不舒服的动作——提问。"},{"children":[],"kind":"leaf","title":"真正持续提问的人非常少。你从一个人谈论某个主题的方式里，往往就能看出来。作者甚至直接把 questioning 视为 thinking，而大多数人其实很少真正思考。"},{"children":[],"kind":"leaf","title":"下面是一套作者建议每年使用一次的完整 protocol，用来重置人生并进入一段高强度进展期。它的目的，是帮助你问对问题。"},{"children":[],"kind":"leaf","title":"这些问题会从 macro 一直走到 micro：你想去哪里、需要做什么、以及现在立刻可以做什么，才能推动自己向那个现实靠近。"},{"children":[],"kind":"leaf","title":"完整完成大约需要一天。你需要纸、笔和一个开放的心态。"},{"children":[{"title":"1. **Dissonance（失调）** — 开始感觉自己不属于当前生活，并逐渐受够没有进展"},{"title":"2. **Uncertainty（不确定）** — 不知道接下来会怎样，于是要么尝试，要么迷失并感觉更糟"},{"title":"3. **Discovery（发现）** — 找到真正想追求的东西，然后在很短时间里完成过去几年都没有做到的进展"}],"kind":"section","title":"作者观察到，真正实现身份转变的人，通常会经历一个“张力积累后突然发生”的过程，常见有三个阶段"},{"children":[],"kind":"leaf","title":"所以，这套 protocol 的目标就是帮助你进入足够强的 dissonance，穿过 uncertainty，并真正发现自己想追求什么，直到方向足够清晰，很多原本的分心开始失去吸引力。"},{"children":[],"kind":"leaf","title":"整个流程设计为一天完成：早上做一次心理挖掘，找出隐藏动机；白天通过多次 interrupt 打断自动驾驶状态，不断回到对生活的审视；晚上把当天洞见整合成一个第二天就能开始执行的方向。"},{"children":[],"kind":"leaf","title":"作者也明确承认：这不保证对所有人都有效，因为不是每个读者都处在一个“这些问题恰好会产生巨大影响”的人生阶段。一本书的高潮，也不可能被搬到开头还保持同样效果。"}],"html":"\u003cblockquote\u003e\n\u003cp\u003e我人生里最好的阶段，往往都发生在我彻底受够了自己毫无进展的那段时期之后。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e怎样真正往自己心里挖？\u003c/p\u003e\n\u003cp\u003e怎样看见自己已经习以为常的 conditioning？\u003c/p\u003e\n\u003cp\u003e怎样获得足以改变人生轨迹的洞见？\u003c/p\u003e\n\u003cp\u003e作者的答案是：通过一个简单、但往往令人不舒服的动作——\u003cem\u003e提问。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e真正持续提问的人非常少。你从一个人谈论某个主题的方式里，往往就能看出来。作者甚至直接把 questioning 视为 thinking，而大多数人其实很少真正思考。\u003c/p\u003e\n\u003cp\u003e下面是一套作者建议每年使用一次的完整 protocol，用来重置人生并进入一段高强度进展期。它的目的，是帮助你问对问题。\u003c/p\u003e\n\u003cp\u003e这些问题会从 macro 一直走到 micro：你想去哪里、需要做什么、以及现在立刻可以做什么，才能推动自己向那个现实靠近。\u003c/p\u003e\n\u003cp\u003e完整完成大约需要一天。你需要纸、笔和一个开放的心态。\u003c/p\u003e\n\u003cp\u003e作者观察到，真正实现身份转变的人，通常会经历一个“张力积累后突然发生”的过程，常见有三个阶段：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eDissonance（失调）\u003c/strong\u003e — 开始感觉自己不属于当前生活，并逐渐受够没有进展\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUncertainty（不确定）\u003c/strong\u003e — 不知道接下来会怎样，于是要么尝试，要么迷失并感觉更糟\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDiscovery（发现）\u003c/strong\u003e — 找到真正想追求的东西，然后在很短时间里完成过去几年都没有做到的进展\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e所以，这套 protocol 的目标就是帮助你进入足够强的 dissonance，穿过 uncertainty，并真正发现自己想追求什么，直到方向足够清晰，很多原本的分心开始失去吸引力。\u003c/p\u003e\n\u003cp\u003e整个流程设计为一天完成：早上做一次心理挖掘，找出隐藏动机；白天通过多次 interrupt 打断自动驾驶状态，不断回到对生活的审视；晚上把当天洞见整合成一个第二天就能开始执行的方向。\u003c/p\u003e\n\u003cp\u003e作者也明确承认：这不保证对所有人都有效，因为不是每个读者都处在一个“这些问题恰好会产生巨大影响”的人生阶段。一本书的高潮，也不可能被搬到开头还保持同样效果。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"\u003e 我人生里最好的阶段，往往都发生在我彻底受够了自己毫无进展的那段时期之后。\n\n怎样真正往自己心里挖？\n\n怎样看见自己已经习以为常的 conditioning？\n\n怎样获得足以改变人生轨迹的洞见？\n\n作者的答案是：通过一个简单、但往往令人不舒服的动作——*提问。*\n\n真正持续提问的人非常少。你从一个人谈论某个主题的方式里，往往就能看出来。作者甚至直接把 questioning 视为 thinking，而大多数人其实很少真正思考。\n\n下面是一套作者建议每年使用一次的完整 protocol，用来重置人生并进入一段高强度进展期。它的目的，是帮助你问对问题。\n\n这些问题会从 macro 一直走到 micro：你想去哪里、需要做什么、以及现在立刻可以做什么，才能推动自己向那个现实靠近。\n\n完整完成大约需要一天。你需要纸、笔和一个开放的心态。\n\n作者观察到，真正实现身份转变的人，通常会经历一个“张力积累后突然发生”的过程，常见有三个阶段：\n\n1. **Dissonance（失调）** — 开始感觉自己不属于当前生活，并逐渐受够没有进展\n2. **Uncertainty（不确定）** — 不知道接下来会怎样，于是要么尝试，要么迷失并感觉更糟\n3. **Discovery（发现）** — 找到真正想追求的东西，然后在很短时间里完成过去几年都没有做到的进展\n\n所以，这套 protocol 的目标就是帮助你进入足够强的 dissonance，穿过 uncertainty，并真正发现自己想追求什么，直到方向足够清晰，很多原本的分心开始失去吸引力。\n\n整个流程设计为一天完成：早上做一次心理挖掘，找出隐藏动机；白天通过多次 interrupt 打断自动驾驶状态，不断回到对生活的审视；晚上把当天洞见整合成一个第二天就能开始执行的方向。\n\n作者也明确承认：这不保证对所有人都有效，因为不是每个读者都处在一个“这些问题恰好会产生巨大影响”的人生阶段。一本书的高潮，也不可能被搬到开头还保持同样效果。","sourceFormat":"markdown"},"note:sha256:4d3c28c1d6e1a69f36735f25da5904bd8742b21fff75a67afc14a701459d4a69":{"blocks":[{"children":[],"kind":"leaf","title":"最理想的内在体验状态，是意识中存在秩序。它发生在心理能量——也就是注意力——被投入现实目标，而且技能与行动机会相匹配的时候。追求一个目标会给意识带来秩序，因为人必须把注意力集中在眼前任务上，并暂时忘记其它一切。"},{"children":[],"kind":"leaf","title":"— Mihaly Csikszentmihalyi"},{"children":[],"kind":"leaf","title":"到这里，你已经拿到了作者认为构成“好生活”的主要组成部分。"},{"children":[],"kind":"leaf","title":"接下来，可以把这些洞见整理成一套统一计划。"},{"children":[{"title":"**Anti-vision** — 我最不想再次经历的人生是什么？什么是我生活里真正的“反面终点”？"},{"title":"**Vision** — 我现在认为自己想要的理想生活是什么？并允许它随着前进不断被修正。"},{"title":"**1 year goal** — 一年后，我的生活应该是什么样？它是否更接近我想要的方向？"},{"title":"**1 month project** — 接下来一个月，我需要学什么？获得什么技能？做出什么东西，才能向一年目标靠近？"},{"title":"**Daily levers** — 哪些是每天真正推动项目向前的高优先级动作？"},{"title":"**Constraints** — 为了实现 vision，我有哪些东西明确不愿牺牲？"}],"kind":"section","title":"拿出一张新纸，写下 6 个组件"},{"children":[],"kind":"leaf","title":"为什么这套结构可能有力量？"},{"children":[],"kind":"leaf","title":"因为它给你建立了一个属于自己的小世界。"},{"children":[],"kind":"leaf","title":"如果这一阶段的人生确实适合追求这组目标层级，你会开始自然被它吸引，并逐渐减少其它选择的吸引力。"},{"bodyBlocks":[{"kind":"paragraph","text":"把人生变成一场 video game。"}],"children":[],"kind":"compound_leaf","lead":"也就是："},{"children":[],"kind":"leaf","title":"因为游戏本来就是 obsession、enjoyment 与 flow state 的典型系统。它们具备让人聚焦和获得清晰感的组件，所以反过来拆解这些组件，也可以用来设计自己的生活。"},{"children":[],"kind":"leaf","title":"你的 vision 是怎样算“赢”——至少在这场游戏下一次演化之前。"},{"children":[],"kind":"leaf","title":"你的 anti-vision 是 stakes——如果你放弃，会发生什么。"},{"children":[],"kind":"leaf","title":"你的 1 year goal 是 mission——这一阶段唯一最重要的长期任务。"},{"children":[],"kind":"leaf","title":"你的 1 month project 是 boss fight——你通过它获得 XP 和 loot。"},{"children":[],"kind":"leaf","title":"你的 daily levers 是 quests——每天推进，并不断解锁新机会。"},{"children":[],"kind":"leaf","title":"你的 constraints 是 rules——这些限制反而会逼出创造力。"},{"children":[],"kind":"leaf","title":"这些组件像一组同心圆，为注意力建立一道 forcefield，把那些不断出现的 distractions 和 shiny objects 挡在外面。"},{"children":[],"kind":"leaf","title":"玩得越久，这股力量就越强。"},{"children":[],"kind":"leaf","title":"最终，这套方式会慢慢变成你是谁，而不是一套需要你不断强迫自己遵守的计划。"},{"children":[],"kind":"leaf","title":"— Dan"}],"html":"\u003cblockquote\u003e\n\u003cp\u003e最理想的内在体验状态，是意识中存在秩序。它发生在心理能量——也就是注意力——被投入现实目标，而且技能与行动机会相匹配的时候。追求一个目标会给意识带来秩序，因为人必须把注意力集中在眼前任务上，并暂时忘记其它一切。\u003c/p\u003e\n\u003cp\u003e— Mihaly Csikszentmihalyi\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e到这里，你已经拿到了作者认为构成“好生活”的主要组成部分。\u003c/p\u003e\n\u003cp\u003e接下来，可以把这些洞见整理成一套统一计划。\u003c/p\u003e\n\u003cp\u003e拿出一张新纸，写下 6 个组件：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAnti-vision\u003c/strong\u003e — 我最不想再次经历的人生是什么？什么是我生活里真正的“反面终点”？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVision\u003c/strong\u003e — 我现在认为自己想要的理想生活是什么？并允许它随着前进不断被修正。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e1 year goal\u003c/strong\u003e — 一年后，我的生活应该是什么样？它是否更接近我想要的方向？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e1 month project\u003c/strong\u003e — 接下来一个月，我需要学什么？获得什么技能？做出什么东西，才能向一年目标靠近？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDaily levers\u003c/strong\u003e — 哪些是每天真正推动项目向前的高优先级动作？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConstraints\u003c/strong\u003e — 为了实现 vision，我有哪些东西明确不愿牺牲？\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e为什么这套结构可能有力量？\u003c/p\u003e\n\u003cp\u003e因为它给你建立了一个属于自己的小世界。\u003c/p\u003e\n\u003cp\u003e如果这一阶段的人生确实适合追求这组目标层级，你会开始自然被它吸引，并逐渐减少其它选择的吸引力。\u003c/p\u003e\n\u003cp\u003e也就是：\u003c/p\u003e\n\u003cp\u003e把人生变成一场 video game。\u003c/p\u003e\n\u003cp\u003e因为游戏本来就是 obsession、enjoyment 与 flow state 的典型系统。它们具备让人聚焦和获得清晰感的组件，所以反过来拆解这些组件，也可以用来设计自己的生活。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003evision\u003c/strong\u003e 是怎样算“赢”——至少在这场游戏下一次演化之前。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003eanti-vision\u003c/strong\u003e 是 stakes——如果你放弃，会发生什么。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003e1 year goal\u003c/strong\u003e 是 mission——这一阶段唯一最重要的长期任务。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003e1 month project\u003c/strong\u003e 是 boss fight——你通过它获得 XP 和 loot。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003edaily levers\u003c/strong\u003e 是 quests——每天推进，并不断解锁新机会。\u003c/p\u003e\n\u003cp\u003e你的 \u003cstrong\u003econstraints\u003c/strong\u003e 是 rules——这些限制反而会逼出创造力。\u003c/p\u003e\n\u003cp\u003e这些组件像一组同心圆，为注意力建立一道 forcefield，把那些不断出现的 distractions 和 shiny objects 挡在外面。\u003c/p\u003e\n\u003cp\u003e玩得越久，这股力量就越强。\u003c/p\u003e\n\u003cp\u003e最终，这套方式会慢慢变成你是谁，而不是一套需要你不断强迫自己遵守的计划。\u003c/p\u003e\n\u003cp\u003e— Dan\u003c/p\u003e\n","kind":"structured","rawMarkdown":"\u003e 最理想的内在体验状态，是意识中存在秩序。它发生在心理能量——也就是注意力——被投入现实目标，而且技能与行动机会相匹配的时候。追求一个目标会给意识带来秩序，因为人必须把注意力集中在眼前任务上，并暂时忘记其它一切。\n\u003e\n\u003e — Mihaly Csikszentmihalyi\n\n到这里，你已经拿到了作者认为构成“好生活”的主要组成部分。\n\n接下来，可以把这些洞见整理成一套统一计划。\n\n拿出一张新纸，写下 6 个组件：\n\n- **Anti-vision** — 我最不想再次经历的人生是什么？什么是我生活里真正的“反面终点”？\n- **Vision** — 我现在认为自己想要的理想生活是什么？并允许它随着前进不断被修正。\n- **1 year goal** — 一年后，我的生活应该是什么样？它是否更接近我想要的方向？\n- **1 month project** — 接下来一个月，我需要学什么？获得什么技能？做出什么东西，才能向一年目标靠近？\n- **Daily levers** — 哪些是每天真正推动项目向前的高优先级动作？\n- **Constraints** — 为了实现 vision，我有哪些东西明确不愿牺牲？\n\n为什么这套结构可能有力量？\n\n因为它给你建立了一个属于自己的小世界。\n\n如果这一阶段的人生确实适合追求这组目标层级，你会开始自然被它吸引，并逐渐减少其它选择的吸引力。\n\n也就是：\n\n把人生变成一场 video game。\n\n因为游戏本来就是 obsession、enjoyment 与 flow state 的典型系统。它们具备让人聚焦和获得清晰感的组件，所以反过来拆解这些组件，也可以用来设计自己的生活。\n\n你的 **vision** 是怎样算“赢”——至少在这场游戏下一次演化之前。\n\n你的 **anti-vision** 是 stakes——如果你放弃，会发生什么。\n\n你的 **1 year goal** 是 mission——这一阶段唯一最重要的长期任务。\n\n你的 **1 month project** 是 boss fight——你通过它获得 XP 和 loot。\n\n你的 **daily levers** 是 quests——每天推进，并不断解锁新机会。\n\n你的 **constraints** 是 rules——这些限制反而会逼出创造力。\n\n这些组件像一组同心圆，为注意力建立一道 forcefield，把那些不断出现的 distractions 和 shiny objects 挡在外面。\n\n玩得越久，这股力量就越强。\n\n最终，这套方式会慢慢变成你是谁，而不是一套需要你不断强迫自己遵守的计划。\n\n— Dan","sourceFormat":"markdown"},"note:sha256:69198d5836f2df41acc2d070ce8b0a4b6929d882a3a11db91a09fefc4e5d2d67":{"html":"\u003cblockquote\u003e\n\u003cp\u003e@thedankoe · \u003ca href=\"https://x.com/thedankoe/article/2010751592346030461\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eX Article\u003c/a\u003e · 2026-01-12\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e如果你和我差不多，大概也觉得新年计划挺蠢的。\u003c/p\u003e\n\u003cp\u003e因为大多数人改变人生的方法，从一开始就错了。他们制定新年计划，很大程度上只是因为别人都这么做——我们从各种身份和地位游戏里制造出一种表面的意义——但这种方式并不满足真正改变所需要的条件。真正的改变，比说服自己“今年我要更自律、更高效”要深得多。\u003c/p\u003e\n\u003cp\u003e如果你也是其中一员，我并不是来居高临下地批评你（我的写作确实常常有点狠）。我放弃过的目标，比真正实现的多十倍。我觉得对大多数人来说，这反而很正常。但同样真实的是：人们一次又一次试图改变生活，却几乎总是失败。\u003c/p\u003e\n\u003cp\u003e所以，尽管我觉得新年计划很蠢，但定期回头看看自己讨厌的生活是什么样，然后借此把自己推向一个好得多的方向，仍然是一件很明智的事。\u003c/p\u003e\n\u003cp\u003e无论你是想创业、改变身体状态，还是想冒险追求一种更有意义的生活，又不想两周后就放弃，我都想分享 7 个关于行为改变、心理与效率的想法，帮助你在 2026 年真正开始改变。\u003c/p\u003e\n\u003cp\u003e这篇会比较全面。\u003c/p\u003e\n\u003cp\u003e它不是那种读完就忘的文章。\u003c/p\u003e\n\u003cp\u003e你最好把它存下来，做笔记，并且专门留出时间去思考。\u003c/p\u003e\n\u003cp\u003e文末的协议，目的是让你深入审视自己的心理，找出自己真正想要的生活。完整做一遍大约需要一天，但它带来的影响可能持续更久。\u003c/p\u003e\n\u003cp\u003e开始吧。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e @thedankoe · [X Article](https://x.com/thedankoe/article/2010751592346030461) · 2026-01-12\n\n如果你和我差不多，大概也觉得新年计划挺蠢的。\n\n因为大多数人改变人生的方法，从一开始就错了。他们制定新年计划，很大程度上只是因为别人都这么做——我们从各种身份和地位游戏里制造出一种表面的意义——但这种方式并不满足真正改变所需要的条件。真正的改变，比说服自己“今年我要更自律、更高效”要深得多。\n\n如果你也是其中一员，我并不是来居高临下地批评你（我的写作确实常常有点狠）。我放弃过的目标，比真正实现的多十倍。我觉得对大多数人来说，这反而很正常。但同样真实的是：人们一次又一次试图改变生活，却几乎总是失败。\n\n所以，尽管我觉得新年计划很蠢，但定期回头看看自己讨厌的生活是什么样，然后借此把自己推向一个好得多的方向，仍然是一件很明智的事。\n\n无论你是想创业、改变身体状态，还是想冒险追求一种更有意义的生活，又不想两周后就放弃，我都想分享 7 个关于行为改变、心理与效率的想法，帮助你在 2026 年真正开始改变。\n\n这篇会比较全面。\n\n它不是那种读完就忘的文章。\n\n你最好把它存下来，做笔记，并且专门留出时间去思考。\n\n文末的协议，目的是让你深入审视自己的心理，找出自己真正想要的生活。完整做一遍大约需要一天，但它带来的影响可能持续更久。\n\n开始吧。","sourceFormat":"markdown"},"note:sha256:6b5674c7474f16d427433a96c65a842e600b18b7a8d6682c75705764976594e6":{"html":"\u003cp\u003e这篇文章真正有价值的部分，不是“用一天修好人生”的标题，而是把改变重构为一个反馈系统：先识别旧身份和隐性目标，再建立 anti-vision 与 vision，通过持续行动、反馈和修正，让新行为逐渐变成新的身份。\u003c/p\u003e\n","kind":"html","rawMarkdown":"这篇文章真正有价值的部分，不是“用一天修好人生”的标题，而是把改变重构为一个反馈系统：先识别旧身份和隐性目标，再建立 anti-vision 与 vision，通过持续行动、反馈和修正，让新行为逐渐变成新的身份。","sourceFormat":"markdown"},"note:sha256:7fac79414344837ecbc925648b49c1d87a38cf9c62dc5a2dc36d67386eb4e4cd":{"html":"\u003cblockquote\u003e\n\u003cp\u003e只相信行动。人生发生在事件层面，而不是语言层面。相信行动。\u003c/p\u003e\n\u003cp\u003e— Alfred Adler\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e如果你想改变自己，首先要理解\u003cem\u003e心智是怎样工作的\u003c/em\u003e，这样你才有可能重新编程它。\u003c/p\u003e\n\u003cp\u003e理解心智的第一步，是理解所有行为都具有目标导向性。也就是 teleological（目的论式）的。乍一看这好像很明显，但往深处挖时，大多数人并不愿意接受。\u003c/p\u003e\n\u003cp\u003e你向前迈一步，是因为你想走到某个地方。\u003c/p\u003e\n\u003cp\u003e你挠鼻子，是因为你想让痒感消失。\u003c/p\u003e\n\u003cp\u003e这两种情况很明显。但更多时候，你的目标是无意识的。比如，你中午坐在沙发上发呆，可能只是为了在下一件责任到来之前把时间耗掉，而你自己并没有意识到。\u003c/p\u003e\n\u003cp\u003e更复杂、更无意识的时候，你甚至会追求一些伤害自己的目标，同时又用一种社会上能接受的说法为自己的行为辩护，让自己看起来没那么失败。\u003c/p\u003e\n\u003cp\u003e例如，如果你一直拖延工作，你可能会把原因解释成“我不够自律”。但实际上，你和任何时候一样，都在追求某个目标。这个目标可能是：\u003cem\u003e保护自己，不去面对作品完成并公开之后可能遭受的评价。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e如果你说自己想离开一份毫无前景的工作，却一直没有真正理由地留下来，你可能会觉得自己“不够勇敢”，或者“天生就不是敢冒险的人”。但更真实的解释可能是：你正在追求安全、可预测，以及一种不让自己在亲友眼里显得失败的借口——哪怕他们把一份没前景的工作视为成功。\u003c/p\u003e\n\u003cp\u003e这里真正的教训是：真正的改变，需要改变你的目标。\u003c/p\u003e\n\u003cp\u003e我不是说再去\u003cem\u003e设定\u003c/em\u003e一个表层目标——因为“设目标”这件事本身，也可能只是服务于另一个对你有害的无意识目标。生产力领域已经把这个讲烂了。我说的是改变你的\u003cem\u003e视角\u003c/em\u003e。\u003c/p\u003e\n\u003cp\u003e因为目标本质上就是一个视角。它是一种对未来的投射，也是一副感知滤镜，让你更容易注意到那些能帮助你实现目标的信息、想法和资源。\u003c/p\u003e\n\u003cp\u003e接下来还要再往深处挖一点，因为如果你理解不了这一层，就会更难从旧模式里出来。\u003c/p\u003e\n","kind":"html","rawMarkdown":"\u003e 只相信行动。人生发生在事件层面，而不是语言层面。相信行动。\n\u003e\n\u003e — Alfred Adler\n\n如果你想改变自己，首先要理解*心智是怎样工作的*，这样你才有可能重新编程它。\n\n理解心智的第一步，是理解所有行为都具有目标导向性。也就是 teleological（目的论式）的。乍一看这好像很明显，但往深处挖时，大多数人并不愿意接受。\n\n你向前迈一步，是因为你想走到某个地方。\n\n你挠鼻子，是因为你想让痒感消失。\n\n这两种情况很明显。但更多时候，你的目标是无意识的。比如，你中午坐在沙发上发呆，可能只是为了在下一件责任到来之前把时间耗掉，而你自己并没有意识到。\n\n更复杂、更无意识的时候，你甚至会追求一些伤害自己的目标，同时又用一种社会上能接受的说法为自己的行为辩护，让自己看起来没那么失败。\n\n例如，如果你一直拖延工作，你可能会把原因解释成“我不够自律”。但实际上，你和任何时候一样，都在追求某个目标。这个目标可能是：*保护自己，不去面对作品完成并公开之后可能遭受的评价。*\n\n如果你说自己想离开一份毫无前景的工作，却一直没有真正理由地留下来，你可能会觉得自己“不够勇敢”，或者“天生就不是敢冒险的人”。但更真实的解释可能是：你正在追求安全、可预测，以及一种不让自己在亲友眼里显得失败的借口——哪怕他们把一份没前景的工作视为成功。\n\n这里真正的教训是：真正的改变，需要改变你的目标。\n\n我不是说再去*设定*一个表层目标——因为“设目标”这件事本身，也可能只是服务于另一个对你有害的无意识目标。生产力领域已经把这个讲烂了。我说的是改变你的*视角*。\n\n因为目标本质上就是一个视角。它是一种对未来的投射，也是一副感知滤镜，让你更容易注意到那些能帮助你实现目标的信息、想法和资源。\n\n接下来还要再往深处挖一点，因为如果你理解不了这一层，就会更难从旧模式里出来。","sourceFormat":"markdown"},"note:sha256:9292803e5f0366b74b7701c91050ace3986659c1a3806093090efd1a633cebe2":{"blocks":[{"children":[],"kind":"leaf","title":"如果完整走过前面的过程，作者认为你大概率至少会得到一个可能真正改变人生方向的洞见。"},{"children":[{"title":"1. 经过今天之后，关于“我为什么一直卡住”，什么答案现在最真实？"},{"title":"2. 真正的敌人是什么？明确写出来。不是环境，不是别人，而是那个一直在控制你的内部模式或信念。"},{"title":"3. 写一句话，总结你绝对不允许自己的人生变成什么样。这是 anti-vision 的压缩版，读到它时应该能让你产生感觉。"},{"title":"4. 再写一句话，总结你现在正在建设什么，同时承认它未来还会演化。这是你的 vision MVP。"}],"kind":"section","title":"接下来要把这些洞见显性化，并开始通过行动把它们整合进新的身份。"},{"children":[],"kind":"leaf","title":"最后，再建立一套目标。"},{"children":[],"kind":"leaf","title":"但这里的 goal 不是为了“完成某个成就”，因为目标本质上只是投射，而且一定会变化。"},{"children":[],"kind":"leaf","title":"更好的理解是：把目标当作一个可替换的 point of view，一副能把你带入合适心智状态的 lens，让你采取那些远离不想要的人生、靠近想要人生的行动。"},{"children":[{"title":"1. **One-year lens：** 一年后，必须发生哪一件具体事情，才说明你真的打破了旧模式？"},{"title":"2. **One-month lens：** 一个月后，必须达到什么状态，才能让一年目标仍然可能实现？"},{"title":"3. **Daily lens：** 明天可以 timeblock 哪 2–3 个行动，是“正在成为的那个人”自然会做的？"}],"kind":"section","title":"不要过度执着于“终点”，因为真正固定的终点并不存在。作者认为，享受更常来自持续进展本身。"},{"children":[],"kind":"leaf","title":"到这里，信息已经很多了。"},{"children":[],"kind":"leaf","title":"但还差最后一层整合。"}],"html":"\u003cp\u003e如果完整走过前面的过程，作者认为你大概率至少会得到一个可能真正改变人生方向的洞见。\u003c/p\u003e\n\u003cp\u003e接下来要把这些洞见显性化，并开始通过行动把它们整合进新的身份。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e经过今天之后，关于“我为什么一直卡住”，什么答案现在最真实？\u003c/li\u003e\n\u003cli\u003e真正的敌人是什么？明确写出来。不是环境，不是别人，而是那个一直在控制你的内部模式或信念。\u003c/li\u003e\n\u003cli\u003e写一句话，总结你绝对不允许自己的人生变成什么样。这是 anti-vision 的压缩版，读到它时应该能让你产生感觉。\u003c/li\u003e\n\u003cli\u003e再写一句话，总结你现在正在建设什么，同时承认它未来还会演化。这是你的 vision MVP。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e最后，再建立一套目标。\u003c/p\u003e\n\u003cp\u003e但这里的 goal 不是为了“完成某个成就”，因为目标本质上只是投射，而且一定会变化。\u003c/p\u003e\n\u003cp\u003e更好的理解是：把目标当作一个可替换的 point of view，一副能把你带入合适心智状态的 lens，让你采取那些远离不想要的人生、靠近想要人生的行动。\u003c/p\u003e\n\u003cp\u003e不要过度执着于“终点”，因为真正固定的终点并不存在。作者认为，享受更常来自持续进展本身。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eOne-year lens：\u003c/strong\u003e 一年后，必须发生哪一件具体事情，才说明你真的打破了旧模式？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOne-month lens：\u003c/strong\u003e 一个月后，必须达到什么状态，才能让一年目标仍然可能实现？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDaily lens：\u003c/strong\u003e 明天可以 timeblock 哪 2–3 个行动，是“正在成为的那个人”自然会做的？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e到这里，信息已经很多了。\u003c/p\u003e\n\u003cp\u003e但还差最后一层整合。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"如果完整走过前面的过程，作者认为你大概率至少会得到一个可能真正改变人生方向的洞见。\n\n接下来要把这些洞见显性化，并开始通过行动把它们整合进新的身份。\n\n1. 经过今天之后，关于“我为什么一直卡住”，什么答案现在最真实？\n2. 真正的敌人是什么？明确写出来。不是环境，不是别人，而是那个一直在控制你的内部模式或信念。\n3. 写一句话，总结你绝对不允许自己的人生变成什么样。这是 anti-vision 的压缩版，读到它时应该能让你产生感觉。\n4. 再写一句话，总结你现在正在建设什么，同时承认它未来还会演化。这是你的 vision MVP。\n\n最后，再建立一套目标。\n\n但这里的 goal 不是为了“完成某个成就”，因为目标本质上只是投射，而且一定会变化。\n\n更好的理解是：把目标当作一个可替换的 point of view，一副能把你带入合适心智状态的 lens，让你采取那些远离不想要的人生、靠近想要人生的行动。\n\n不要过度执着于“终点”，因为真正固定的终点并不存在。作者认为，享受更常来自持续进展本身。\n\n1. **One-year lens：** 一年后，必须发生哪一件具体事情，才说明你真的打破了旧模式？\n2. **One-month lens：** 一个月后，必须达到什么状态，才能让一年目标仍然可能实现？\n3. **Daily lens：** 明天可以 timeblock 哪 2–3 个行动，是“正在成为的那个人”自然会做的？\n\n到这里，信息已经很多了。\n\n但还差最后一层整合。","sourceFormat":"markdown"},"note:sha256:a2af1173c60dd2f5ee3696ecc76ede36ff2ad3e1fa42bbbcb37c2e9902c2a3d2":{"html":"\u003cp\u003e心智会随着时间，以一些相对可识别的阶段发展。\u003c/p\u003e\n\u003cp\u003e刚出生时，你就像一块只为生存服务的小海绵，会吸收一切让自己感觉安全的信念，而这些信念又高度受文化塑造。如果不小心，这些信念可能会慢慢结晶，让你之后更难过一种真正有意义的生活。\u003c/p\u003e\n\u003cp\u003e类似的发展路径已经被很多模型描述过，包括 Maslow’s Hierarchy、Greuter’s stages of ego development、Spiral Dynamics 和 Integral Theory。作者也把它们综合成自己的 \u003ca href=\"https://letters.thedankoe.com/p/human-30-a-map-to-reach-the-top-1?lli=1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eHuman 3.0 model\u003c/a\u003e，并加入了一些 AI prompts，用来帮助人识别自己的发展阶段和下一步路径。\u003c/p\u003e\n\u003cp\u003e下面是作者对 9 个 ego-development stages 的 80/20 式概括：\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-ebHTubsAEsAee?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eImpulsive（冲动型）\u003c/strong\u003e — 冲动和行动几乎没有分离，思维非黑即白。\u003cem\u003e例如，幼儿生气时直接打人，因为“感受”和“行为”还是同一件事。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSelf-Protective（自我保护型）\u003c/strong\u003e — 世界被看作危险的，你开始学会保护自己。\u003cem\u003e例如，孩子会藏成绩单、对家务撒谎，并摸索成年人到底想听什么。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConformist（从众型）\u003c/strong\u003e — 你和所属群体几乎没有分离，群体规则就像现实本身。\u003cem\u003e例如，一个人真的无法理解为什么有人会投票给与自己家庭或群体不同的政治选择。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSelf-Aware（自我觉察型）\u003c/strong\u003e — 你开始意识到，自己的内在世界与外部表现并不完全一致。\u003cem\u003e例如，坐在教堂里突然意识到自己也许并不真的相信周围人都相信的东西，但又不知道该怎么办。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConscientious（自律 / 原则型）\u003c/strong\u003e — 你建立自己的原则体系，并据此要求自己。\u003cem\u003e例如，经过认真研究后离开家庭宗教，形成一套自己能辩护的个人哲学；或者建立清晰职业计划，因为你相信正确投入会得到正确结果。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIndividualist（个体主义型）\u003c/strong\u003e — 你开始看到，自己的原则同样受环境塑造，因此不再把它们握得那么死。\u003cem\u003e例如，你意识到自己的政治立场可能更多来自成长环境，而不是客观真理；或者发现自己所谓“宏大职业目标”，其实只是为了赢得父亲认可。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eStrategist（战略型）\u003c/strong\u003e — 你开始在系统中工作，同时知道自己也是系统的一部分。\u003cem\u003e例如，领导一个组织的同时主动检查自己的盲点；或者参与政治时知道自己的观点必然部分、带偏见，而且你不可能完全看清这种偏见。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConstruct-Aware（建构觉察型）\u003c/strong\u003e — 你开始把所有框架——包括身份本身——看作有用但并非绝对真实的建构。\u003cem\u003e例如，你用隐喻而不是字面方式持有精神信念，知道 map is not the territory；或者带着一点轻松感，看着自己扮演“founder”“thought leader”这些角色。\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUnitive（合一型）\u003c/strong\u003e — 自我与生活之间的分离逐渐消失。\u003cem\u003e例如，工作、休息与玩耍不再像三件不同的事；不再有一个“必须成为某种人”的自我，只剩下对当下发生之事的回应。\u003c/em\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e作者猜测，读到这里的大多数人可能游走在 4 到 8 之间，而这个跨度非常大。更接近 8 的人，可能只是为了学习或用一种不具破坏性的方式消磨时间；更接近 4 的人，则更可能真的在寻找变化：你觉得自己“应该还有更多可能”，但暂时还无法把一切解释清楚，因为背后的因素太多。\u003c/p\u003e\n\u003cp\u003e好消息是，不管你现在在哪个阶段，向前移动通常都存在某种共同模式。\u003c/p\u003e\n","kind":"html","rawMarkdown":"心智会随着时间，以一些相对可识别的阶段发展。\n\n刚出生时，你就像一块只为生存服务的小海绵，会吸收一切让自己感觉安全的信念，而这些信念又高度受文化塑造。如果不小心，这些信念可能会慢慢结晶，让你之后更难过一种真正有意义的生活。\n\n类似的发展路径已经被很多模型描述过，包括 Maslow’s Hierarchy、Greuter’s stages of ego development、Spiral Dynamics 和 Integral Theory。作者也把它们综合成自己的 [Human 3.0 model](https://letters.thedankoe.com/p/human-30-a-map-to-reach-the-top-1?lli=1)，并加入了一些 AI prompts，用来帮助人识别自己的发展阶段和下一步路径。\n\n下面是作者对 9 个 ego-development stages 的 80/20 式概括：\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/G-ebHTubsAEsAee?format=jpg\u0026amp;name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n1. **Impulsive（冲动型）** — 冲动和行动几乎没有分离，思维非黑即白。*例如，幼儿生气时直接打人，因为“感受”和“行为”还是同一件事。*\n2. **Self-Protective（自我保护型）** — 世界被看作危险的，你开始学会保护自己。*例如，孩子会藏成绩单、对家务撒谎，并摸索成年人到底想听什么。*\n3. **Conformist（从众型）** — 你和所属群体几乎没有分离，群体规则就像现实本身。*例如，一个人真的无法理解为什么有人会投票给与自己家庭或群体不同的政治选择。*\n4. **Self-Aware（自我觉察型）** — 你开始意识到，自己的内在世界与外部表现并不完全一致。*例如，坐在教堂里突然意识到自己也许并不真的相信周围人都相信的东西，但又不知道该怎么办。*\n5. **Conscientious（自律 / 原则型）** — 你建立自己的原则体系，并据此要求自己。*例如，经过认真研究后离开家庭宗教，形成一套自己能辩护的个人哲学；或者建立清晰职业计划，因为你相信正确投入会得到正确结果。*\n6. **Individualist（个体主义型）** — 你开始看到，自己的原则同样受环境塑造，因此不再把它们握得那么死。*例如，你意识到自己的政治立场可能更多来自成长环境，而不是客观真理；或者发现自己所谓“宏大职业目标”，其实只是为了赢得父亲认可。*\n7. **Strategist（战略型）** — 你开始在系统中工作，同时知道自己也是系统的一部分。*例如，领导一个组织的同时主动检查自己的盲点；或者参与政治时知道自己的观点必然部分、带偏见，而且你不可能完全看清这种偏见。*\n8. **Construct-Aware（建构觉察型）** — 你开始把所有框架——包括身份本身——看作有用但并非绝对真实的建构。*例如，你用隐喻而不是字面方式持有精神信念，知道 map is not the territory；或者带着一点轻松感，看着自己扮演“founder”“thought leader”这些角色。*\n9. **Unitive（合一型）** — 自我与生活之间的分离逐渐消失。*例如，工作、休息与玩耍不再像三件不同的事；不再有一个“必须成为某种人”的自我，只剩下对当下发生之事的回应。*\n\n作者猜测，读到这里的大多数人可能游走在 4 到 8 之间，而这个跨度非常大。更接近 8 的人，可能只是为了学习或用一种不具破坏性的方式消磨时间；更接近 4 的人，则更可能真的在寻找变化：你觉得自己“应该还有更多可能”，但暂时还无法把一切解释清楚，因为背后的因素太多。\n\n好消息是，不管你现在在哪个阶段，向前移动通常都存在某种共同模式。","sourceFormat":"markdown"},"note:sha256:aa798b6d43af53e805c1351d12ab5c723f5b0d0bef12d19dc093b056e772abc0":{"blocks":[{"children":[],"kind":"leaf","title":"对智力唯一真正的检验，是你是否从生活中得到自己想要的东西。"},{"children":[],"kind":"leaf","title":"— Naval Ravikant"},{"children":[],"kind":"leaf","title":"作者认为，成功可以拆成几个组成部分。"},{"children":[],"kind":"leaf","title":"一个是 agency（能动性）。"},{"children":[],"kind":"leaf","title":"一个是 opportunity（机会）。"},{"children":[],"kind":"leaf","title":"最后一个是 intelligence（智力）。"},{"children":[],"kind":"leaf","title":"如果你有很强的 agency，却没有真正的机会，那么再愿意行动也很难产生足够回报。"},{"children":[],"kind":"leaf","title":"如果你有机会也有 agency，却缺乏足够 intelligence，那么你也很难把机会真正转化为结果。"},{"children":[],"kind":"leaf","title":"Agency 前面谈过。Opportunity 方面，作者无法告诉你一定要换一个物理地点，但如果你完全看不到数字世界里已经存在的大量机会，他也无话可说。"},{"children":[],"kind":"leaf","title":"这里更重要的是：在这篇文章的语境下，intelligence 到底是什么？为此，作者转向 cybernetics。"},{"children":[],"kind":"leaf","title":"Cybernetics 来自希腊词 kybernetikos，大意是“掌舵”或者“善于操舵”。"},{"children":[],"kind":"leaf","title":"它也常被解释成“得到你想要之物的艺术”。"},{"children":[],"kind":"leaf","title":"如果 Naval 把智力定义成“从人生里得到自己想要的东西”，那么理解 cybernetics 就能帮助你更快理解这种能力。"},{"bodyBlocks":[{"blockType":"image","kind":"markdown","raw":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/G-eb5tkbEAA8v0u?format=jpg\u0026amp;name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e"}],"children":[{"title":"有一个目标"},{"title":"朝目标行动"},{"title":"感知自己现在在哪里"},{"title":"把当前状态和目标比较"},{"title":"根据反馈再次行动"}],"kind":"section","title":"Cybernetics 描述了智能系统的一些核心属性"},{"children":[],"kind":"leaf","title":"可以通过一个系统持续试错、迭代和坚持的能力，来判断它有多“智能”。"},{"children":[],"kind":"leaf","title":"船被风吹离航线后重新修正方向；恒温器感知温度变化后开启；血糖上升后胰腺分泌胰岛素。"},{"children":[],"kind":"leaf","title":"这些和“得到你想要的人生”有什么关系？"},{"children":[],"kind":"leaf","title":"作者认为，关系非常直接。"},{"children":[],"kind":"leaf","title":"行动、感知、比较，以及从更高层理解整个系统，是高智能行为的基础——至少在本文使用的这一定义下。"},{"children":[],"kind":"leaf","title":"高 intelligence，是持续迭代、坚持，并看懂大局的能力。低 intelligence 的典型表现，就是无法从错误中学习。"},{"children":[],"kind":"leaf","title":"低智能的人往往困在问题里，而不是解决问题。遇到路障就放弃。比如一个写作者没能建立受众，于是干脆不写了，因为他缺乏继续尝试、实验并找到适合自己方法的能力。"},{"children":[],"kind":"leaf","title":"更高的 intelligence，是意识到很多问题只要时间尺度足够大，就存在解决路径。你想实现的目标背后，总存在一系列可能的选择和步骤。"},{"children":[],"kind":"leaf","title":"这也意味着要理解，想法与能力本身是有层级的。你不可能一下子从 papyrus 跳到 Google Docs。即使某个目标今天确实做不到，也可能只是因为当前缺少某种资源，而这些资源几年后可能才被发明。"},{"children":[],"kind":"leaf","title":"作者反复强调，他说的“goal”，并不只是典型 self-help 语境里的“设目标”。"},{"children":[],"kind":"leaf","title":"他更接近 teleology 的理解：世界中的事物都服务于某种目的，并嵌在更大的整体里。"},{"children":[],"kind":"leaf","title":"目标决定你怎样看世界。"},{"children":[],"kind":"leaf","title":"目标决定你怎样定义“成功”和“失败”。"},{"children":[],"kind":"leaf","title":"你可以试着“享受过程”，但如果你追求的目标本身错了，你很难真正享受。"},{"children":[],"kind":"leaf","title":"你的 mind 就像现实的操作系统。"},{"children":[],"kind":"leaf","title":"而这个系统主要由目标组成。"},{"bodyBlocks":[{"kind":"paragraph","text":"去上学。找工作。被冒犯。扮演受害者。65 岁退休。"}],"children":[],"kind":"compound_leaf","lead":"对大多数人来说，这些目标并不是自己主动选择的，而是像代码一样被写入 psyche："},{"children":[],"kind":"leaf","title":"一条熟悉，但不一定有效的路径。"},{"children":[{"title":"拒绝已知路径"},{"title":"进入未知"},{"title":"设定更高的目标，以扩展自己的心智"},{"title":"接受混乱，让成长发生"},{"title":"学习自然界中可泛化的原则"},{"title":"成为 deep generalist"}],"kind":"section","title":"想变得更“智能”，作者给出的方向包括"},{"children":[],"kind":"leaf","title":"作者也承认，这不是传统定义上的 intelligence。但他认为，这套过程会在大脑中建立极其丰富的连接，而外界往往会把这种人观察为“更聪明”。如果再加上 agency，效果会更强。"},{"children":[],"kind":"leaf","title":"这也自然带入下一部分。"}],"html":"\u003cblockquote\u003e\n\u003cp\u003e对智力唯一真正的检验，是你是否从生活中得到自己想要的东西。\u003c/p\u003e\n\u003cp\u003e— Naval Ravikant\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e作者认为，成功可以拆成几个组成部分。\u003c/p\u003e\n\u003cp\u003e一个是 \u003cstrong\u003eagency（能动性）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e一个是 \u003cstrong\u003eopportunity（机会）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e最后一个是 \u003cstrong\u003eintelligence（智力）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e如果你有很强的 agency，却没有真正的机会，那么再愿意行动也很难产生足够回报。\u003c/p\u003e\n\u003cp\u003e如果你有机会也有 agency，却缺乏足够 intelligence，那么你也很难把机会真正转化为结果。\u003c/p\u003e\n\u003cp\u003eAgency 前面谈过。Opportunity 方面，作者无法告诉你一定要换一个物理地点，但如果你完全看不到数字世界里已经存在的大量机会，他也无话可说。\u003c/p\u003e\n\u003cp\u003e这里更重要的是：在这篇文章的语境下，\u003cem\u003eintelligence 到底是什么\u003c/em\u003e？为此，作者转向 cybernetics。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCybernetics 来自希腊词 \u003cem\u003ekybernetikos\u003c/em\u003e，大意是“掌舵”或者“善于操舵”。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e它也常被解释成“得到你想要之物的艺术”。\u003c/p\u003e\n\u003cp\u003e如果 Naval 把智力定义成“从人生里得到自己想要的东西”，那么理解 cybernetics 就能帮助你更快理解这种能力。\u003c/p\u003e\n\u003cp\u003eCybernetics 描述了智能系统的一些核心属性：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e有一个目标\u003c/li\u003e\n\u003cli\u003e朝目标行动\u003c/li\u003e\n\u003cli\u003e感知自己现在在哪里\u003c/li\u003e\n\u003cli\u003e把当前状态和目标比较\u003c/li\u003e\n\u003cli\u003e根据反馈再次行动\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/G-eb5tkbEAA8v0u?format=jpg\u0026amp;name=medium\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cem\u003e可以通过一个系统持续试错、迭代和坚持的能力，来判断它有多“智能”。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e船被风吹离航线后重新修正方向；恒温器感知温度变化后开启；血糖上升后胰腺分泌胰岛素。\u003c/p\u003e\n\u003cp\u003e这些和“得到你想要的人生”有什么关系？\u003c/p\u003e\n\u003cp\u003e作者认为，关系非常直接。\u003c/p\u003e\n\u003cp\u003e行动、感知、比较，以及从更高层理解整个系统，是高智能行为的基础——至少在本文使用的这一定义下。\u003c/p\u003e\n\u003cp\u003e高 intelligence，是持续迭代、坚持，并看懂大局的能力。\u003cstrong\u003e低 intelligence 的典型表现，就是无法从错误中学习。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e低智能的人往往困在问题里，而不是解决问题。遇到路障就放弃。比如一个写作者没能建立受众，于是干脆不写了，因为他缺乏继续尝试、实验并找到适合自己方法的能力。\u003c/p\u003e\n\u003cp\u003e更高的 intelligence，是意识到很多问题只要时间尺度足够大，就存在解决路径。你想实现的目标背后，总存在一系列可能的选择和步骤。\u003c/p\u003e\n\u003cp\u003e这也意味着要理解，想法与能力本身是有层级的。你不可能一下子从 papyrus 跳到 Google Docs。即使某个目标今天确实做不到，也可能只是因为当前缺少某种资源，而这些资源几年后可能才被发明。\u003c/p\u003e\n\u003cp\u003e作者反复强调，他说的“goal”，并不只是典型 self-help 语境里的“设目标”。\u003c/p\u003e\n\u003cp\u003e他更接近 teleology 的理解：世界中的事物都服务于某种目的，并嵌在更大的整体里。\u003c/p\u003e\n\u003cp\u003e目标决定你怎样看世界。\u003c/p\u003e\n\u003cp\u003e目标决定你怎样定义“成功”和“失败”。\u003c/p\u003e\n\u003cp\u003e你可以试着“享受过程”，但如果你追求的目标本身错了，你很难真正享受。\u003c/p\u003e\n\u003cp\u003e你的 mind 就像现实的操作系统。\u003c/p\u003e\n\u003cp\u003e而这个系统主要由目标组成。\u003c/p\u003e\n\u003cp\u003e对大多数人来说，这些目标并不是自己主动选择的，而是像代码一样被写入 psyche：\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e去上学。找工作。被冒犯。扮演受害者。65 岁退休。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e一条熟悉，但不一定有效的路径。\u003c/p\u003e\n\u003cp\u003e想变得更“智能”，作者给出的方向包括：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e拒绝已知路径\u003c/li\u003e\n\u003cli\u003e进入未知\u003c/li\u003e\n\u003cli\u003e设定更高的目标，以扩展自己的心智\u003c/li\u003e\n\u003cli\u003e接受混乱，让成长发生\u003c/li\u003e\n\u003cli\u003e学习自然界中可泛化的原则\u003c/li\u003e\n\u003cli\u003e成为 deep generalist\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e作者也承认，这不是传统定义上的 intelligence。但他认为，这套过程会在大脑中建立极其丰富的连接，而外界往往会把这种人观察为“更聪明”。如果再加上 agency，效果会更强。\u003c/p\u003e\n\u003cp\u003e这也自然带入下一部分。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"\u003e 对智力唯一真正的检验，是你是否从生活中得到自己想要的东西。\n\u003e\n\u003e — Naval Ravikant\n\n作者认为，成功可以拆成几个组成部分。\n\n一个是 **agency（能动性）**。\n\n一个是 **opportunity（机会）**。\n\n最后一个是 **intelligence（智力）**。\n\n如果你有很强的 agency，却没有真正的机会，那么再愿意行动也很难产生足够回报。\n\n如果你有机会也有 agency，却缺乏足够 intelligence，那么你也很难把机会真正转化为结果。\n\nAgency 前面谈过。Opportunity 方面，作者无法告诉你一定要换一个物理地点，但如果你完全看不到数字世界里已经存在的大量机会，他也无话可说。\n\n这里更重要的是：在这篇文章的语境下，*intelligence 到底是什么*？为此，作者转向 cybernetics。\n\n\u003e Cybernetics 来自希腊词 *kybernetikos*，大意是“掌舵”或者“善于操舵”。\n\n它也常被解释成“得到你想要之物的艺术”。\n\n如果 Naval 把智力定义成“从人生里得到自己想要的东西”，那么理解 cybernetics 就能帮助你更快理解这种能力。\n\nCybernetics 描述了智能系统的一些核心属性：\n\n- 有一个目标\n- 朝目标行动\n- 感知自己现在在哪里\n- 把当前状态和目标比较\n- 根据反馈再次行动\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/G-eb5tkbEAA8v0u?format=jpg\u0026amp;name=medium\" alt=\"图像\" /\u003e\u003c/div\u003e\n\n*可以通过一个系统持续试错、迭代和坚持的能力，来判断它有多“智能”。*\n\n船被风吹离航线后重新修正方向；恒温器感知温度变化后开启；血糖上升后胰腺分泌胰岛素。\n\n这些和“得到你想要的人生”有什么关系？\n\n作者认为，关系非常直接。\n\n行动、感知、比较，以及从更高层理解整个系统，是高智能行为的基础——至少在本文使用的这一定义下。\n\n高 intelligence，是持续迭代、坚持，并看懂大局的能力。**低 intelligence 的典型表现，就是无法从错误中学习。**\n\n低智能的人往往困在问题里，而不是解决问题。遇到路障就放弃。比如一个写作者没能建立受众，于是干脆不写了，因为他缺乏继续尝试、实验并找到适合自己方法的能力。\n\n更高的 intelligence，是意识到很多问题只要时间尺度足够大，就存在解决路径。你想实现的目标背后，总存在一系列可能的选择和步骤。\n\n这也意味着要理解，想法与能力本身是有层级的。你不可能一下子从 papyrus 跳到 Google Docs。即使某个目标今天确实做不到，也可能只是因为当前缺少某种资源，而这些资源几年后可能才被发明。\n\n作者反复强调，他说的“goal”，并不只是典型 self-help 语境里的“设目标”。\n\n他更接近 teleology 的理解：世界中的事物都服务于某种目的，并嵌在更大的整体里。\n\n目标决定你怎样看世界。\n\n目标决定你怎样定义“成功”和“失败”。\n\n你可以试着“享受过程”，但如果你追求的目标本身错了，你很难真正享受。\n\n你的 mind 就像现实的操作系统。\n\n而这个系统主要由目标组成。\n\n对大多数人来说，这些目标并不是自己主动选择的，而是像代码一样被写入 psyche：\n\n*去上学。找工作。被冒犯。扮演受害者。65 岁退休。*\n\n一条熟悉，但不一定有效的路径。\n\n想变得更“智能”，作者给出的方向包括：\n\n- 拒绝已知路径\n- 进入未知\n- 设定更高的目标，以扩展自己的心智\n- 接受混乱，让成长发生\n- 学习自然界中可泛化的原则\n- 成为 deep generalist\n\n作者也承认，这不是传统定义上的 intelligence。但他认为，这套过程会在大脑中建立极其丰富的连接，而外界往往会把这种人观察为“更聪明”。如果再加上 agency，效果会更强。\n\n这也自然带入下一部分。","sourceFormat":"markdown"},"note:sha256:b3ed6bbf64721aa6624afea4474927d05df356ac059df1f1b9b200188fecdb00":{"blocks":[{"children":[],"kind":"leaf","title":"你必须记住，最重要的是：这个想法从哪里来，并没有那么重要。你可能从未见过职业催眠师，也从未正式接受过催眠。但如果你接受了某个观念——可能来自自己、老师、父母、朋友、广告或任何其它来源——并且坚信它是真的，那么它对你的影响，就可能像催眠师的话对被催眠者一样强大。"},{"children":[],"kind":"leaf","title":"— Maxwell Maltz"},{"children":[{"title":"1. 你想实现一个目标"},{"title":"2. 你开始透过这个目标的滤镜看现实"},{"title":"3. 你只会注意那些对实现目标“重要”的信息和想法（学习）"},{"title":"4. 你朝目标行动，并得到“正在推进”的反馈"},{"title":"5. 你重复这些行为，直到它们变成自动且无意识的模式（conditioning）"},{"title":"6. 这些行为变成你对自己的定义：“我是那种会……的人”"},{"title":"7. 你开始维护这个身份，以保持心理一致性"},{"title":"8. 身份又进一步塑造新的目标，于是整个循环重新开始；如果这个身份本身对你想要的生活不利，问题很快会放大"}],"kind":"section","title":"下面是你今天之所以成为现在这个自己，以及未来会成为另一个自己的基本路径。可以把它看成“身份的解剖结构”"},{"children":[],"kind":"leaf","title":"真正棘手的地方，是你必须在第 6 和第 7 步之间把这个循环打断，而这个循环从童年就开始建立。"},{"children":[],"kind":"leaf","title":"小时候，你最核心的目标是生存。"},{"children":[],"kind":"leaf","title":"你依赖父母教你怎样活下去，所以你必须适应。大多数人的教育方式，本来就建立在奖励和惩罚上：如果你不接受他们的信念与价值观，就会受到惩罚。直到你开始看穿这一点，你才真正开始独立思考。"},{"children":[],"kind":"leaf","title":"但你的父母也经历过同样的过程，这就可能变得危险。除非他们主动打破过这些模式，否则他们同样受到工业时代主流“成功观”的训练，同时也携带着从上一代、再上一代继承下来的最好和最坏的条件反射。"},{"children":[],"kind":"leaf","title":"再往下一层，一旦你的身体生存需求得到满足——在今天的世界里，相对容易做到，很多人几乎从出生就处于较安全的环境——你会开始在概念和意识形态层面“求生”。你可能不再主要保护和复制身体，但会强烈保护和复制自己的思想。网上无处不在的观念战争，本质上往往就是个人和群体身份之间的冲突。"},{"children":[],"kind":"leaf","title":"身体感受到威胁时，你会进入 fight or flight。"},{"children":[],"kind":"leaf","title":"身份感受到威胁时，也会发生类似反应。"},{"children":[],"kind":"leaf","title":"如果你强烈认同某种政治意识形态，那么别人挑战你的信念时，你会真的感到压力，情绪上就像刚被人扇了一耳光。由于大多数人并不会把情绪拿来检验真伪，于是很容易被困在 echo chamber 里，对一些最终伤害自己和他人的观点不断加码。"},{"children":[],"kind":"leaf","title":"如果你在宗教家庭中长大，却从未真正独立思考，那么别人威胁到你心理安全的小泡泡时，你也可能本能地反击。"},{"children":[],"kind":"leaf","title":"同样的事情，也会发生在“我是律师”“我是 gamer”“我就是这种人”这些无意识身份上——尤其当这些身份本身阻碍你采取能改善生活的行动时。"}],"html":"\u003cblockquote\u003e\n\u003cp\u003e你必须记住，最重要的是：这个想法从哪里来，并没有那么重要。你可能从未见过职业催眠师，也从未正式接受过催眠。但如果你接受了某个观念——可能来自自己、老师、父母、朋友、广告或任何其它来源——并且坚信它是真的，那么它对你的影响，就可能像催眠师的话对被催眠者一样强大。\u003c/p\u003e\n\u003cp\u003e— Maxwell Maltz\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e下面是你今天之所以成为现在这个自己，以及未来会成为另一个自己的基本路径。可以把它看成“身份的解剖结构”：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e你想实现一个目标\u003c/li\u003e\n\u003cli\u003e你开始透过这个目标的滤镜看现实\u003c/li\u003e\n\u003cli\u003e你只会注意那些对实现目标“重要”的信息和想法（学习）\u003c/li\u003e\n\u003cli\u003e你朝目标行动，并得到“正在推进”的反馈\u003c/li\u003e\n\u003cli\u003e你重复这些行为，直到它们变成自动且无意识的模式（conditioning）\u003c/li\u003e\n\u003cli\u003e这些行为变成你对自己的定义：“我是那种会……的人”\u003c/li\u003e\n\u003cli\u003e你开始维护这个身份，以保持心理一致性\u003c/li\u003e\n\u003cli\u003e身份又进一步塑造新的目标，于是整个循环重新开始；如果这个身份本身对你想要的生活不利，问题很快会放大\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e真正棘手的地方，是你必须在第 6 和第 7 步之间把这个循环打断，而这个循环从童年就开始建立。\u003c/p\u003e\n\u003cp\u003e小时候，你最核心的目标是生存。\u003c/p\u003e\n\u003cp\u003e你依赖父母教你怎样活下去，所以你必须适应。大多数人的教育方式，本来就建立在奖励和惩罚上：如果你不接受他们的信念与价值观，就会受到惩罚。直到你开始看穿这一点，你才真正开始独立思考。\u003c/p\u003e\n\u003cp\u003e但你的父母也经历过同样的过程，这就可能变得危险。除非他们主动打破过这些模式，否则他们同样受到工业时代主流“成功观”的训练，同时也携带着从上一代、再上一代继承下来的最好和最坏的条件反射。\u003c/p\u003e\n\u003cp\u003e再往下一层，一旦你的身体生存需求得到满足——在今天的世界里，相对容易做到，很多人几乎从出生就处于较安全的环境——你会开始在概念和意识形态层面“求生”。你可能不再主要保护和复制身体，但会强烈保护和复制自己的思想。网上无处不在的观念战争，本质上往往就是个人和群体身份之间的冲突。\u003c/p\u003e\n\u003cp\u003e身体感受到威胁时，你会进入 fight or flight。\u003c/p\u003e\n\u003cp\u003e身份感受到威胁时，也会发生类似反应。\u003c/p\u003e\n\u003cp\u003e如果你强烈认同某种政治意识形态，那么别人挑战你的信念时，你会真的感到压力，情绪上就像刚被人扇了一耳光。由于大多数人并不会把情绪拿来检验真伪，于是很容易被困在 echo chamber 里，对一些最终伤害自己和他人的观点不断加码。\u003c/p\u003e\n\u003cp\u003e如果你在宗教家庭中长大，却从未真正独立思考，那么别人威胁到你心理安全的小泡泡时，你也可能本能地反击。\u003c/p\u003e\n\u003cp\u003e同样的事情，也会发生在“我是律师”“我是 gamer”“我就是这种人”这些无意识身份上——尤其当这些身份本身阻碍你采取能改善生活的行动时。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"\u003e 你必须记住，最重要的是：这个想法从哪里来，并没有那么重要。你可能从未见过职业催眠师，也从未正式接受过催眠。但如果你接受了某个观念——可能来自自己、老师、父母、朋友、广告或任何其它来源——并且坚信它是真的，那么它对你的影响，就可能像催眠师的话对被催眠者一样强大。\n\u003e\n\u003e — Maxwell Maltz\n\n下面是你今天之所以成为现在这个自己，以及未来会成为另一个自己的基本路径。可以把它看成“身份的解剖结构”：\n\n1. 你想实现一个目标\n2. 你开始透过这个目标的滤镜看现实\n3. 你只会注意那些对实现目标“重要”的信息和想法（学习）\n4. 你朝目标行动，并得到“正在推进”的反馈\n5. 你重复这些行为，直到它们变成自动且无意识的模式（conditioning）\n6. 这些行为变成你对自己的定义：“我是那种会……的人”\n7. 你开始维护这个身份，以保持心理一致性\n8. 身份又进一步塑造新的目标，于是整个循环重新开始；如果这个身份本身对你想要的生活不利，问题很快会放大\n\n真正棘手的地方，是你必须在第 6 和第 7 步之间把这个循环打断，而这个循环从童年就开始建立。\n\n小时候，你最核心的目标是生存。\n\n你依赖父母教你怎样活下去，所以你必须适应。大多数人的教育方式，本来就建立在奖励和惩罚上：如果你不接受他们的信念与价值观，就会受到惩罚。直到你开始看穿这一点，你才真正开始独立思考。\n\n但你的父母也经历过同样的过程，这就可能变得危险。除非他们主动打破过这些模式，否则他们同样受到工业时代主流“成功观”的训练，同时也携带着从上一代、再上一代继承下来的最好和最坏的条件反射。\n\n再往下一层，一旦你的身体生存需求得到满足——在今天的世界里，相对容易做到，很多人几乎从出生就处于较安全的环境——你会开始在概念和意识形态层面“求生”。你可能不再主要保护和复制身体，但会强烈保护和复制自己的思想。网上无处不在的观念战争，本质上往往就是个人和群体身份之间的冲突。\n\n身体感受到威胁时，你会进入 fight or flight。\n\n身份感受到威胁时，也会发生类似反应。\n\n如果你强烈认同某种政治意识形态，那么别人挑战你的信念时，你会真的感到压力，情绪上就像刚被人扇了一耳光。由于大多数人并不会把情绪拿来检验真伪，于是很容易被困在 echo chamber 里，对一些最终伤害自己和他人的观点不断加码。\n\n如果你在宗教家庭中长大，却从未真正独立思考，那么别人威胁到你心理安全的小泡泡时，你也可能本能地反击。\n\n同样的事情，也会发生在“我是律师”“我是 gamer”“我就是这种人”这些无意识身份上——尤其当这些身份本身阻碍你采取能改善生活的行动时。","sourceFormat":"markdown"},"note:sha256:b859f31de5969ec174030eb5e8271349468317e541b5da349b43095a3e782b2e":{"blocks":[{"children":[],"kind":"leaf","title":"第一步，是给心智建立一个新的 frame 或 perception lens。"},{"children":[],"kind":"leaf","title":"这有点像给自己先造一个新的壳，然后离开旧壳，再慢慢长进新壳里。一开始不合身，反而是正常的。"},{"children":[{"title":"1. 你已经学会长期忍受的、那种沉闷而持续的不满是什么？不是巨大痛苦，而是你已经默认“就这样吧”的东西。"},{"title":"2. 过去一年，你反复抱怨、却从未真正改变的三件事是什么？"},{"title":"3. 对每一个抱怨：如果有人只看你的行为、不听你的语言，他会得出“你其实真正想要什么”的结论？"},{"title":"4. 关于你当前生活，有什么事实如果必须对一个你极其尊敬的人承认，会让你无法忍受？"}],"kind":"section","title":"拿出 15–30 分钟，认真思考并回答下面这些问题。作者特别强调：不要把这部分思考外包给 AI。 目的正是突破你自己心里的限制。如果暂时答不出来，就晚点再回来。"},{"children":[],"kind":"leaf","title":"这些问题的目的，是让你真正意识到当前生活中的痛苦。"},{"children":[{"title":"1. 如果未来五年什么都不改变，请描述一个普通星期二。你在哪里醒来？身体是什么感觉？第一件想到的事是什么？身边是谁？9 点到 18 点之间在做什么？晚上 10 点是什么感受？"},{"title":"2. 再把时间拉到十年。你错过了什么？哪些机会彻底关闭？谁已经对你放弃？当你不在场时，别人会怎么评价你？"},{"title":"3. 你已经来到生命终点。你选择了最安全的那一版人生，从未真正打破模式。代价是什么？你从未允许自己去感受、尝试或成为过什么？"},{"title":"4. 你身边有没有人，已经生活在你刚刚描述的未来里？他可能比你早五年、十年或二十年走上同一条轨迹。想到自己最终变成那样，你有什么感受？"},{"title":"5. 如果你真的想改变，需要放弃什么身份？“我是那种会……”的人。社会层面上，不再当这种人会有什么代价？"},{"title":"6. 你一直没有改变，最让自己难以启齿的真实原因是什么？那个听起来不像“合理”，而更像软弱、恐惧或懒惰的原因。"},{"title":"7. 如果当前行为本质上是一种 self-protection，你到底在保护什么？而这种保护又正在让你付出什么代价？"}],"kind":"section","title":"接下来，作者建议把这些痛苦整理成一种 anti-vision：对“我绝对不想继续活成怎样”的生活形成残酷而清晰的认识。这样就能利用负面能量，为正向行动提供方向和内在动力。"},{"children":[],"kind":"leaf","title":"如果这些问题你都诚实回答，而且你恰好处在人生合适的阶段，可能会感到明显的不适，甚至对当前生活产生厌恶。"},{"children":[],"kind":"leaf","title":"接下来，就要把这股能量转成正方向。"},{"children":[{"title":"1. 先暂时忘掉现实限制。如果你可以打个响指，三年后就生活在完全不同的人生里，不考虑“现实不现实”，你真正*想要*什么？同样详细描述一个普通星期二。"},{"title":"2. 要让那种生活对你而言变得自然，而不是勉强维持，你需要对自己相信什么？写下身份句：“我是那种会……的人。”"},{"title":"3. 如果你已经是那个人，这周你会做哪一件事？"}],"kind":"section","title":"作者建议先建立一个 minimum viable vision，因为 vision 更像一个产品：一开始不清晰，但会随着经验逐渐变得更强、更具体。"},{"children":[],"kind":"leaf","title":"作者建议第二天一早，先完整回答这些问题。"}],"html":"\u003cp\u003e第一步，是给心智建立一个新的 frame 或 perception lens。\u003c/p\u003e\n\u003cp\u003e这有点像给自己先造一个新的壳，然后离开旧壳，再慢慢长进新壳里。一开始不合身，反而是正常的。\u003c/p\u003e\n\u003cp\u003e拿出 15–30 分钟，认真思考并回答下面这些问题。作者特别强调：\u003cstrong\u003e不要把这部分思考外包给 AI。\u003c/strong\u003e 目的正是突破你自己心里的限制。如果暂时答不出来，就晚点再回来。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e你已经学会长期忍受的、那种沉闷而持续的不满是什么？不是巨大痛苦，而是你已经默认“就这样吧”的东西。\u003c/li\u003e\n\u003cli\u003e过去一年，你反复抱怨、却从未真正改变的三件事是什么？\u003c/li\u003e\n\u003cli\u003e对每一个抱怨：如果有人只看你的行为、不听你的语言，他会得出“你其实真正想要什么”的结论？\u003c/li\u003e\n\u003cli\u003e关于你当前生活，有什么事实如果必须对一个你极其尊敬的人承认，会让你无法忍受？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e这些问题的目的，是让你真正意识到当前生活中的痛苦。\u003c/p\u003e\n\u003cp\u003e接下来，作者建议把这些痛苦整理成一种 \u003cstrong\u003eanti-vision\u003c/strong\u003e：对“我绝对不想继续活成怎样”的生活形成残酷而清晰的认识。这样就能利用负面能量，为正向行动提供方向和内在动力。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e如果未来五年什么都不改变，请描述一个普通星期二。你在哪里醒来？身体是什么感觉？第一件想到的事是什么？身边是谁？9 点到 18 点之间在做什么？晚上 10 点是什么感受？\u003c/li\u003e\n\u003cli\u003e再把时间拉到十年。你错过了什么？哪些机会彻底关闭？谁已经对你放弃？当你不在场时，别人会怎么评价你？\u003c/li\u003e\n\u003cli\u003e你已经来到生命终点。你选择了最安全的那一版人生，从未真正打破模式。代价是什么？你从未允许自己去感受、尝试或成为过什么？\u003c/li\u003e\n\u003cli\u003e你身边有没有人，已经生活在你刚刚描述的未来里？他可能比你早五年、十年或二十年走上同一条轨迹。想到自己最终变成那样，你有什么感受？\u003c/li\u003e\n\u003cli\u003e如果你真的想改变，需要放弃什么身份？“我是那种会……”的人。社会层面上，不再当这种人会有什么代价？\u003c/li\u003e\n\u003cli\u003e你一直没有改变，最让自己难以启齿的真实原因是什么？那个听起来不像“合理”，而更像软弱、恐惧或懒惰的原因。\u003c/li\u003e\n\u003cli\u003e如果当前行为本质上是一种 self-protection，你到底在保护什么？而这种保护又正在让你付出什么代价？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e如果这些问题你都诚实回答，而且你恰好处在人生合适的阶段，可能会感到明显的不适，甚至对当前生活产生厌恶。\u003c/p\u003e\n\u003cp\u003e接下来，就要把这股能量转成正方向。\u003c/p\u003e\n\u003cp\u003e作者建议先建立一个 \u003cstrong\u003eminimum viable vision\u003c/strong\u003e，因为 vision 更像一个产品：一开始不清晰，但会随着经验逐渐变得更强、更具体。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e先暂时忘掉现实限制。如果你可以打个响指，三年后就生活在完全不同的人生里，不考虑“现实不现实”，你真正\u003cem\u003e想要\u003c/em\u003e什么？同样详细描述一个普通星期二。\u003c/li\u003e\n\u003cli\u003e要让那种生活对你而言变得自然，而不是勉强维持，你需要对自己相信什么？写下身份句：“我是那种会……的人。”\u003c/li\u003e\n\u003cli\u003e如果你已经是那个人，这周你会做哪一件事？\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e作者建议第二天一早，先完整回答这些问题。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"第一步，是给心智建立一个新的 frame 或 perception lens。\n\n这有点像给自己先造一个新的壳，然后离开旧壳，再慢慢长进新壳里。一开始不合身，反而是正常的。\n\n拿出 15–30 分钟，认真思考并回答下面这些问题。作者特别强调：**不要把这部分思考外包给 AI。** 目的正是突破你自己心里的限制。如果暂时答不出来，就晚点再回来。\n\n1. 你已经学会长期忍受的、那种沉闷而持续的不满是什么？不是巨大痛苦，而是你已经默认“就这样吧”的东西。\n2. 过去一年，你反复抱怨、却从未真正改变的三件事是什么？\n3. 对每一个抱怨：如果有人只看你的行为、不听你的语言，他会得出“你其实真正想要什么”的结论？\n4. 关于你当前生活，有什么事实如果必须对一个你极其尊敬的人承认，会让你无法忍受？\n\n这些问题的目的，是让你真正意识到当前生活中的痛苦。\n\n接下来，作者建议把这些痛苦整理成一种 **anti-vision**：对“我绝对不想继续活成怎样”的生活形成残酷而清晰的认识。这样就能利用负面能量，为正向行动提供方向和内在动力。\n\n1. 如果未来五年什么都不改变，请描述一个普通星期二。你在哪里醒来？身体是什么感觉？第一件想到的事是什么？身边是谁？9 点到 18 点之间在做什么？晚上 10 点是什么感受？\n2. 再把时间拉到十年。你错过了什么？哪些机会彻底关闭？谁已经对你放弃？当你不在场时，别人会怎么评价你？\n3. 你已经来到生命终点。你选择了最安全的那一版人生，从未真正打破模式。代价是什么？你从未允许自己去感受、尝试或成为过什么？\n4. 你身边有没有人，已经生活在你刚刚描述的未来里？他可能比你早五年、十年或二十年走上同一条轨迹。想到自己最终变成那样，你有什么感受？\n5. 如果你真的想改变，需要放弃什么身份？“我是那种会……”的人。社会层面上，不再当这种人会有什么代价？\n6. 你一直没有改变，最让自己难以启齿的真实原因是什么？那个听起来不像“合理”，而更像软弱、恐惧或懒惰的原因。\n7. 如果当前行为本质上是一种 self-protection，你到底在保护什么？而这种保护又正在让你付出什么代价？\n\n如果这些问题你都诚实回答，而且你恰好处在人生合适的阶段，可能会感到明显的不适，甚至对当前生活产生厌恶。\n\n接下来，就要把这股能量转成正方向。\n\n作者建议先建立一个 **minimum viable vision**，因为 vision 更像一个产品：一开始不清晰，但会随着经验逐渐变得更强、更具体。\n\n1. 先暂时忘掉现实限制。如果你可以打个响指，三年后就生活在完全不同的人生里，不考虑“现实不现实”，你真正*想要*什么？同样详细描述一个普通星期二。\n2. 要让那种生活对你而言变得自然，而不是勉强维持，你需要对自己相信什么？写下身份句：“我是那种会……的人。”\n3. 如果你已经是那个人，这周你会做哪一件事？\n\n作者建议第二天一早，先完整回答这些问题。","sourceFormat":"markdown"},"note:sha256:db04dd70b7fa0dc96c34becdfabcea2f67178fcd8c26c89f4ebf77430d9bf6a8":{"blocks":[{"children":[],"kind":"leaf","title":"Journaling 本身很好看，但作者真正想要的是改变。"},{"children":[],"kind":"leaf","title":"如果你不主动打断当前那些让自己维持不变的无意识模式，真正的改变大概率不会发生。"},{"children":[],"kind":"leaf","title":"整个白天，都要不断回到早晨写下的内容继续思考。"},{"children":[],"kind":"leaf","title":"但光靠“记得想”还不够，所以作者建议立刻在手机里创建 reminders 或 calendar events，并直接把问题写进提醒里，这样提醒出现时就能马上开始思考。"},{"children":[{"title":"**11:00am：** 我现在做的这件事，其实是在逃避什么？"},{"title":"**1:30pm：** 如果有人拍下我过去两小时，他会判断我真正想从人生里得到什么？"},{"title":"**3:15pm：** 我现在是在走向我讨厌的人生，还是想要的人生？"},{"title":"**5:00pm：** 有什么最重要的东西，我一直假装它不重要？"},{"title":"**7:30pm：** 今天有哪些行为是为了保护旧身份，而不是真正出于欲望？"},{"title":"**9:00pm：** 今天什么时候我最有生命力？什么时候最麻木？"}],"kind":"section","title":"时间越随机、越不干扰正常日程越好。"},{"children":[{"title":"如果我不再需要别人把我看成 [你写下的旧身份]，会发生什么变化？"},{"title":"我在哪些地方用“活着的感觉”交换了安全感？"},{"title":"我明天就能开始成为的、最小版本的“理想中的自己”是什么？"}],"kind":"section","title":"还可以在通勤、散步或躺着的时候继续想"}],"html":"\u003cp\u003eJournaling 本身很好看，但作者真正想要的是改变。\u003c/p\u003e\n\u003cp\u003e如果你不主动打断当前那些让自己维持不变的无意识模式，真正的改变大概率不会发生。\u003c/p\u003e\n\u003cp\u003e整个白天，都要不断回到早晨写下的内容继续思考。\u003c/p\u003e\n\u003cp\u003e但光靠“记得想”还不够，所以作者建议立刻在手机里创建 reminders 或 calendar events，并直接把问题写进提醒里，这样提醒出现时就能马上开始思考。\u003c/p\u003e\n\u003cp\u003e时间越随机、越不干扰正常日程越好。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e11:00am：\u003c/strong\u003e 我现在做的这件事，其实是在逃避什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e1:30pm：\u003c/strong\u003e 如果有人拍下我过去两小时，他会判断我真正想从人生里得到什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e3:15pm：\u003c/strong\u003e 我现在是在走向我讨厌的人生，还是想要的人生？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e5:00pm：\u003c/strong\u003e 有什么最重要的东西，我一直假装它不重要？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e7:30pm：\u003c/strong\u003e 今天有哪些行为是为了保护旧身份，而不是真正出于欲望？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e9:00pm：\u003c/strong\u003e 今天什么时候我最有生命力？什么时候最麻木？\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e还可以在通勤、散步或躺着的时候继续想：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e如果我不再需要别人把我看成 [你写下的旧身份]，会发生什么变化？\u003c/li\u003e\n\u003cli\u003e我在哪些地方用“活着的感觉”交换了安全感？\u003c/li\u003e\n\u003cli\u003e我明天就能开始成为的、最小版本的“理想中的自己”是什么？\u003c/li\u003e\n\u003c/ul\u003e\n","kind":"structured","rawMarkdown":"Journaling 本身很好看，但作者真正想要的是改变。\n\n如果你不主动打断当前那些让自己维持不变的无意识模式，真正的改变大概率不会发生。\n\n整个白天，都要不断回到早晨写下的内容继续思考。\n\n但光靠“记得想”还不够，所以作者建议立刻在手机里创建 reminders 或 calendar events，并直接把问题写进提醒里，这样提醒出现时就能马上开始思考。\n\n时间越随机、越不干扰正常日程越好。\n\n- **11:00am：** 我现在做的这件事，其实是在逃避什么？\n- **1:30pm：** 如果有人拍下我过去两小时，他会判断我真正想从人生里得到什么？\n- **3:15pm：** 我现在是在走向我讨厌的人生，还是想要的人生？\n- **5:00pm：** 有什么最重要的东西，我一直假装它不重要？\n- **7:30pm：** 今天有哪些行为是为了保护旧身份，而不是真正出于欲望？\n- **9:00pm：** 今天什么时候我最有生命力？什么时候最麻木？\n\n还可以在通勤、散步或躺着的时候继续想：\n\n- 如果我不再需要别人把我看成 [你写下的旧身份]，会发生什么变化？\n- 我在哪些地方用“活着的感觉”交换了安全感？\n- 我明天就能开始成为的、最小版本的“理想中的自己”是什么？","sourceFormat":"markdown"}},"sourceRevision":"sha256:8fbce23a812ab300836d6d4d8ebf997663c820e66d24416ae793a27b4929506f"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"symbol"!=typeof t?t+"":t,n);!function(){"use strict";const e="deminds-interactive",t=["reading","map","asset-ref-v1"];class n extends Error{constructor(e,t){super(t),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=e}}function r(e,t){throw new n("inval
